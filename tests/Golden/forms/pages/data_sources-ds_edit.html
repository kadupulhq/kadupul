</div></div></div><div class="formColumnRight"><div class="formData"><span id="host_id_wrap" class="autodrop ui-selectmenu-button ui-selectmenu-button-closed ui-corner-all ui-corner-all ui-button ui-widget"><span id="host_id_click" style="z-index:4" class="ui-selectmenu-icon ui-icon ui-icon-triangle-1-s"></span><span class="ui-select-text"><input type="text" class="ui-state-default ui-corner-all" id="host_id_input" value="None"></span></span><input type="hidden" id="host_id" name="host_id" value="0">		<script type="text/javascript" nonce="<NONCE>">
		var host_idTimer;
		var host_idClickTimer;
		var host_idOpen = false;

		$(function() {
		    $('#host_id_input').autocomplete({
				source: 'data_sources.php?action=ajax_hosts_noany',
				autoFocus: true,
				minLength: 0,
				select: function(event,ui) {
					$('#host_id_input').val(ui.item.label);
					if (ui.item.id) {
						$('#host_id').val(ui.item.id);
					} else {
						$('#host_id').val(ui.item.value);
					}
					;
				}
			}).css('border', 'none').css('background-color', 'transparent');

			$('#host_id_wrap').on('dblclick', function() {
				host_idOpen = false;
				clearTimeout(host_idTimer);
				clearTimeout(host_idClickTimer);
				$('#host_id_input').autocomplete('close').select();
			}).on('click', function() {
				if (host_idOpen) {
					$('#host_id_input').autocomplete('close');
					clearTimeout(host_idTimer);
					host_idOpen = false;
				} else {
					host_idClickTimer = setTimeout(function() {
						$('#host_id_input').autocomplete('search', '');
						clearTimeout(host_idTimer);
						host_idOpen = true;
					}, 200);
				}
				$('#host_id_input').select();
			}).on('mouseleave', function() {
				host_idTimer = setTimeout(function() { $('#host_id_input').autocomplete('close'); }, 800);
			});

			width = $('#host_id_input').textBoxWidth();
			if (width < 100) {
				width = 100;
			}

			$('#host_id_wrap').css('width', width+20);
			$('#host_id_input').css('width', width);

			$('ul[id^="ui-id"]').on('mouseenter', function() {
				clearTimeout(host_idTimer);
			}).on('mouseleave', function() {
				host_idTimer = setTimeout(function() { $('#host_id_input').autocomplete('close'); }, 800);
			});

			$('ul[id^="ui-id"] > li').each().on('mouseenter', function() {
				$(this).addClass('ui-state-hover');
			}).on('mouseleave', function() {
				$(this).removeClass('ui-state-hover');
			});

			$('#host_id_wrap').on('mouseenter', function() {
				$(this).addClass('ui-state-hover');
				$('input#host_id_input').addClass('ui-state-hover');
			}).on('mouseleave', function() {
				$(this).removeClass('ui-state-hover');
				$('input#host_id_input').removeClass('ui-state-hover');
			});
		});
		</script>
