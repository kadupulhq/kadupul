#
# Encodes docs/architecture.md. Run `make deptrac`. A module added under src/
# must get its layers here; `--fail-on-uncovered` fails the run until it does.
#
# <Module>.Domain          its own Domain, PSR interfaces and, across modules,
#                          another module's Contract
# <Module>.Application     its own Domain and, across modules, another module's
#                          Contract (not Platform's)
# Contract                 public module APIs; another Contract at most
# <Module>.Infrastructure  its own layers, any Contract and vendor code
# <Module>.Legacy          Infrastructure/Legacy, the only layer that may read
#                          superglobals
#
# Deptrac does not see calls to legacy functions (db_*, cacti_*) or `global`
# and include statements; ArchitectureTest covers those outside Infrastructure.
# $_ENV is allowed everywhere: it is process configuration, not legacy state.
deptrac:
  paths:
    - ./src
  analyser:
    types:
      - class
      - class_superglobal
      - use
      - function
      - function_superglobal
  layers:
    - name: Alerting.Domain
      collectors:
        - type: directory
          value: src/Alerting/Domain/.*
    - name: Alerting.Application
      collectors:
        - type: directory
          value: src/Alerting/Application/.*
    - name: Alerting.Legacy
      collectors:
        - type: directory
          value: src/Alerting/Infrastructure/Legacy/.*
    - name: Alerting.Infrastructure
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Alerting/Infrastructure/.*
          must_not:
            - type: directory
              value: src/Alerting/Infrastructure/Legacy/.*
    - name: Automation.Domain
      collectors:
        - type: directory
          value: src/Automation/Domain/.*
    - name: Automation.Application
