          must:
            - type: directory
              value: src/[^/]+/Contract/.*
          must_not:
            - type: directory
              value: src/Platform/Contract/.*
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^Kadupul\\Kernel$#'
    - name: Psr
      collectors:
        - type: classNameRegex
          value: '#^Psr\\#'
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^[A-Za-z]#'
          must_not:
            - type: classNameRegex
              value: '#^(Kadupul|Psr)\\#'
            - type: php_internal
              value: .*
    - name: Superglobals
      collectors:
        - type: superglobal
          value:
            - _SESSION
            - _SERVER
            - _GET
            - _POST
            - _COOKIE
            - _REQUEST
            - _FILES
            - GLOBALS
