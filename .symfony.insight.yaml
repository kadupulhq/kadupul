# Match the PHP minor used by mise and Composer on main.
php_version: '8.4'

php_ini: |
    memory_limit=512M
    extension=gd.so
    extension=gmp.so
    extension=intl.so
    extension=mbstring.so
    extension=pdo_mysql.so

# Composer installs dependencies outside the conventional root vendor directory.
exclude_patterns:
    - 'include/vendor/*'
