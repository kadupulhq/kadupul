[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; The image already runs as www-data, so php-fpm does not drop privileges
; itself. Setting user here as root would be the only way it could.
listen = 0.0.0.0:9000
listen.allowed_clients = any

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
