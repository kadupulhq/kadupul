; Values an operator should not have to think about. Anything tunable per
; install belongs in the environment, not baked into the image.
expose_php = Off
date.timezone = UTC

memory_limit = 512M
max_execution_time = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

apc.enabled = 1
apc.enable_cli = 0
apc.shm_size = 128M

; The interface reports these back, so they have to be real values.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
