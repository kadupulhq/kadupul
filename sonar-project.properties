# SonarQube Cloud analysis for kadupulhq/kadupul on the 1.2 LTS line. The
# organization and project keys are SonarQube Cloud's defaults for this
# repository, shared with main. The workflow judges 1.2 changes on security
# findings only, so no coverage report is sent.
sonar.organization=kadupulhq
sonar.projectKey=kadupulhq_kadupul
sonar.projectName=Kadupul

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.php.version=8.1

# Vendored libraries and generated or third-party trees, matching main. Findings
# there belong upstream.
sonar.exclusions=include/vendor/**,include/fa/**,include/js/**,**/*.min.js,**/*.min.css,**/node_modules/**,tests/**,locales/**,docs/**,cache/**,log/**,rra/**
