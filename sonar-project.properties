# SonarQube Cloud analysis for kadupulhq/kadupul on the 1.2 LTS line. The 1.2
# line has its own project, separate from main, so its quality gate can count
# bugs and security findings only; no coverage report is sent.
sonar.organization=kadupulhq
sonar.projectKey=kadupulhq_kadupul-lts
sonar.projectName=Kadupul 1.2 LTS

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.php.version=8.0

# Vendored libraries and generated or third-party trees, matching main. Findings
# there belong upstream.
sonar.exclusions=include/vendor/**,include/fa/**,include/js/**,**/*.min.js,**/*.min.css,**/node_modules/**,tests/**,locales/**,docs/**,cache/**,log/**,rra/**
