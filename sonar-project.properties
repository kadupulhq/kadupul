# SonarQube Cloud analysis for kadupulhq/kadupul. The organization and project
# keys are SonarQube Cloud's defaults for this repository.
sonar.organization=kadupulhq
sonar.projectKey=kadupulhq_kadupul
sonar.projectName=Kadupul

sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.php.version=8.2

# Vendored libraries and generated or third-party trees, matching .semgrepignore
# and the CodeQL paths-ignore list. Findings there belong upstream.
sonar.exclusions=include/vendor/**,include/fa/**,include/js/**,**/*.min.js,**/*.min.css,**/node_modules/**,tests/**,locales/**,docs/**,cache/**,log/**,rra/**,var/**

# Clover report from tests/phpunit-coverage.xml, written by the workflow before
# the scan. Its paths are absolute under GITHUB_WORKSPACE, which is also the
# scanner's base directory, so they resolve without rewriting.
sonar.php.coverage.reportPaths=tests/coverage.xml,var/symfony-coverage.xml
sonar.javascript.lcov.reportPaths=tests/vendor-sync.lcov
sonar.python.coverage.reportPaths=var/offline-coverage.xml

# Layout is owned by .php-cs-fixer.php, which keeps Cacti's same-line braces
# and sets no line limit. Sonar's PSR layout and 120-column rules conflict with
# that house style.
sonar.issue.ignore.multicriteria=psrLayout,lineLength
sonar.issue.ignore.multicriteria.psrLayout.ruleKey=php:S1808
sonar.issue.ignore.multicriteria.psrLayout.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.lineLength.ruleKey=php:S103
sonar.issue.ignore.multicriteria.lineLength.resourceKey=**/*.php
