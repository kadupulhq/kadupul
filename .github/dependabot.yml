version: 2
updates:
  - package-ecosystem: composer
    directories:
      - /
      # The test runner is declared here rather than in the tracked
      # include/vendor tree. Only the manifest is committed on this branch; the
      # lock file arrives with the characterization suite, after which Dependabot
      # updates both.
      - /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      php-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
      - /tests/e2e
      - /include/tabler
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      javascript-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
