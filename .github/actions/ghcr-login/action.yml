name: Log in to GHCR
description: Log Docker in to the GitHub Container Registry with the caller's token.

# Composite actions cannot read secrets, so the caller passes the token.
inputs:
  token:
    description: Token with packages read access, normally github.token.
    required: true
  username:
    description: Registry user name, normally github.actor.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.token }}
        GHCR_USERNAME: ${{ inputs.username }}
      run: bash tests/tools/login_ghcr.sh
