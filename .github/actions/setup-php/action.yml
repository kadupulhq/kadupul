name: Set up PHP
description: Install PHP through the pinned setup-php release.

# setup-php declares no default for these inputs, so an empty value behaves
# the same as leaving the key out of the calling step.
inputs:
  php-version:
    description: PHP version or matrix value to install.
    required: true
  extensions:
    description: Comma-separated PHP extensions.
    required: false
    default: ''
  ini-values:
    description: Comma-separated php.ini settings.
    required: false
    default: ''
  coverage:
    description: Coverage driver (none, pcov or xdebug).
    required: false
    default: ''
  tools:
    description: Comma-separated tools such as composer.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        ini-values: ${{ inputs.ini-values }}
        coverage: ${{ inputs.coverage }}
        tools: ${{ inputs.tools }}
