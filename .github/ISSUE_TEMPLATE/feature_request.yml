name: Feature request
description: Propose a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and what it costs you.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What the software should do instead.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, plugins, or upstream discussions. Delete if none.

  - type: checkboxes
    id: compat
    attributes:
      label: Compatibility
      options:
        - label: This can be done without breaking the Cacti plugin API.
