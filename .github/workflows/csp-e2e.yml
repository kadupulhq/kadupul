#
# CSP nonce migration: unit + integration + (deferred) E2E tests.
# Scoped to the branch and the CSP-relevant files so it does not run on
# every unrelated change.

name: CSP Migration CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: csp-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pull request path filter lives here instead of under `on:`, so the
  # workflow always runs and its result job always reports.
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff must fail the job, never read as "nothing relevant".
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              lib/headers_secure.php|lib/csp_report_endpoint.php|include/global.php|include/global_settings.php|csp_report.php|tests/integration/*|tests/e2e/*|.github/workflows/csp-e2e.yml|tests/Unit/HeadersSecureTest.php|tests/Unit/CspReportEndpointTest.php|tests/Unit/HelpLocalDocumentationTest.php|tests/Unit/HelpSsrFTest.php|help.php|lib/html.php|include/themes/classic/*|tests/bootstrap-unit.php|tests/composer.json) relevant=true ;;
            esac
          done <<< "$changed"
          echo "Relevant to this workflow: $relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    timeout-minutes: 20
    name: Unit tests (CactiSecureHeaders, CSP report endpoint, local help)
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: ./.github/actions/setup-php # zizmor: ignore[self-repository]
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json, openssl, curl, xml
          coverage: none

      - name: Restore pinned compatibility libraries
        run: php tools/dependencies/install-legacy.php

      - name: Install test runner (Pest) scoped to tests/
        working-directory: tests
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pest unit tests
        working-directory: tests
        # phpunit.xml bootstraps include/global.php, which exits 0 without a
        # database, and Pest reads only its first path argument. Both left this
        # step green with no tests run, so each file runs on its own against the
        # database-free bootstrap and a run with no passing tests fails.
        run: |
          set -euo pipefail
          for test in Unit/HeadersSecureTest.php Unit/CspReportEndpointTest.php Unit/HelpLocalDocumentationTest.php Unit/HelpSsrFTest.php; do
            ./vendor/bin/pest --test-directory=. --fail-on-empty-test-suite --colors=never --bootstrap bootstrap-unit.php "$test" | tee "$RUNNER_TEMP/pest.log"
            grep -Eq 'Tests: +[1-9][0-9]* passed' "$RUNNER_TEMP/pest.log"
          done

  integration:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    timeout-minutes: 30
    name: Integration tests (php -S harness)
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: ./.github/actions/setup-php # zizmor: ignore[self-repository]
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json, openssl, curl, xml
          coverage: none

      - name: Restore pinned compatibility libraries
        run: php tools/dependencies/install-legacy.php

      - name: Install test runner (Pest) scoped to tests/
        working-directory: tests
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pest integration tests
        working-directory: tests
        # Only the php -S header harness runs without a database; the other
        # integration files need the container stack and never ran here.
        run: |
          set -euo pipefail
          ./vendor/bin/pest --test-directory=. --fail-on-empty-test-suite --colors=never --bootstrap bootstrap-unit.php integration/ContentSecurityPolicyTest.php | tee "$RUNNER_TEMP/pest.log"
          grep -Eq 'Tests: +[1-9][0-9]* passed' "$RUNNER_TEMP/pest.log"

  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    permissions:
      contents: read
      packages: read
    name: Playwright E2E (docker-compose + Playwright)
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash tests/tools/login_ghcr.sh

      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
        with:
          install_args: python@3.12.12

      - name: Verify private paths and CLI guards through Nginx
        run: mise exec python@3.12.12 -- python tests/security/nginx_private_paths.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22.22.2'

      - name: Set up PHP for dependency installation
        uses: ./.github/actions/setup-php # zizmor: ignore[self-repository]
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, mysqli, pdo_mysql, pcntl, sockets, sqlite3, xml
          coverage: none

      - name: Install application dependencies and browser assets
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction
          npm ci --ignore-scripts
          npm run build

      - name: Build and start compose stack
        working-directory: tests/e2e
        run: docker compose up -d --build

      - name: Wait for Kadupul to respond on :8080
        run: |
          set -euo pipefail
          # Require the CSP-Report-Only header to be present before
          # declaring the stack ready. A bare 200 can be served by the
          # install wizard or an intermediate bootstrap page that does
          # not run the global.php header block.
          for i in $(seq 1 60); do
            if curl -fsSI http://localhost:8080/login.php 2>/dev/null | grep -iq '^content-security-policy-report-only:'; then
              echo "Cacti is up with report-only CSP header after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Cacti did not emit the expected CSP header within 120s" >&2
          curl -sI http://localhost:8080/ || true
          docker compose -f tests/e2e/docker-compose.yml logs --tail=200 || true
          exit 1

      - name: Verify Symfony runtime storage as the FPM user
        working-directory: tests/e2e
        run: |
          docker compose exec -T --user www-data php php -r '
            foreach (["var/cache", "var/log"] as $path) {
              if (!is_dir($path) || !is_writable($path) || (fileperms($path) & 0002) !== 0) {
                throw new RuntimeException("Symfony runtime storage must be writable by FPM and private: " . $path);
              }
            }
          '

      - name: Run VDEF HTTP and MariaDB scenario
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_COMPOSE_PROJECT: e2e
        run: mise exec python@3.12.12 -- python tests/e2e/vdef_http_mariadb.py

      - name: Dump Kadupul container logs (diagnostic)
        if: always()
        working-directory: tests/e2e
        run: |
          echo "=== php ==="
          docker compose logs php --tail=80 || true
          echo ""
          echo "=== mariadb settings rows ==="
          docker compose exec -T mariadb mariadb -ucactiuser -pcactipass cacti \
              -e "SELECT name,value FROM settings WHERE name IN ('install_complete','content_security_policy_script'); SELECT cacti FROM version;" \
              2>&1 || true
          echo ""
          echo "=== curl -sI / full response headers ==="
          curl -sI http://localhost:8080/ || true
          echo ""
          echo "=== curl -s / first 400 bytes of body ==="
          curl -s http://localhost:8080/ | head -c 400 || true
          echo ""
          echo "=== include/config.php url_path line ==="
          docker compose exec -T php grep -E "^\$(url_path|database_hostname)" /var/www/html/cacti/include/config.php || true

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: npm ci --ignore-scripts

      - name: Install Playwright browser (chromium)
        working-directory: tests/e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright suite (core CSP)
        working-directory: tests/e2e
        run: ./node_modules/.bin/playwright test tests/csp.spec.ts

      - name: Run Playwright suite (plugin CSP -- thold + monitor)
        working-directory: tests/e2e
        # Separate step so a plugin-clone failure or a plugin-side CSP
        # regression is visually distinct from a core CSP failure in the
        # GitHub Actions UI. The plugin spec depends on thold and
        # monitor sources baked into the image at build time; the
        # docker compose up --build above runs the clone.
        run: ./node_modules/.bin/playwright test tests/csp-plugins.spec.ts

      - name: Run Playwright suite (classic theme tabs)
        working-directory: tests/e2e
        run: ./node_modules/.bin/playwright test tests/classic-tabs.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
          retention-days: 7

      - name: Tear down compose stack
        if: always()
        working-directory: tests/e2e
        run: docker compose down -v

  csp-result:
    name: CSP result
    # Always reports: a required check reads a skipped job as passing.
    # The suite jobs skip only when the changes job found nothing relevant.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - unit
      - integration
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.result == 'success' && needs.changes.outputs.relevant == 'false' && 'unit integration e2e' || '' }}
        run: bash tests/tools/require_job_results.sh
