name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, gmp, ldap, mbstring, mysqli, pdo_mysql, snmp, sockets, xml, zip
          coverage: none
          tools: none

      # Fails loudly on a parse error in any tracked source file. This is the
      # floor the rest of the pipeline builds on, and it runs even before there
      # is a composer.json to install from.
      - name: Syntax check
        run: |
          set -euo pipefail
          files=$(git ls-files '*.php')
          if [ -z "$files" ]; then
            echo "No PHP sources tracked yet; nothing to check."
            exit 0
          fi
          printf '%s\n' "$files" | xargs -n1 -P4 php -l

      - name: Validate composer manifest
        if: hashFiles('composer.json') != ''
        run: composer validate --strict

      - name: Install dependencies
        if: hashFiles('composer.lock') != ''
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        if: hashFiles('phpstan.neon', 'phpstan.neon.dist', '.phpstan.neon') != ''
        run: composer run-script phpstan

      - name: Tests
        if: hashFiles('phpunit.xml', 'phpunit.xml.dist') != ''
        run: composer test

  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Check formatting
        if: hashFiles('.php-cs-fixer.php', '.php-cs-fixer.dist.php') != ''
        run: composer run-script php-cs-fixer

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect a manifest
        id: detect
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json at the root yet; skipping."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.found == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present lint

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present build

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present test

  changelog:
    name: Changelog
    # The release workflow refuses to publish a tag the changelog does not
    # describe. Finding that out at tag time is the worst moment, so catch it
    # here instead. Add the no-changelog label to skip deliberately.
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD)

          # A branch that only moves CI, docs or the changelog itself needs no entry.
          substantive=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CHANGELOG.md|.github/*|docs/*|*.md) ;;
              *) substantive=true ;;
            esac
          done <<< "$changed"

          if [ "$substantive" = false ]; then
            echo "No user-visible change in this branch; no entry needed."
            exit 0
          fi

          if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::This branch changes behaviour but does not touch CHANGELOG.md. Add an entry under Unreleased, or apply the no-changelog label." >&2
            exit 1
          fi
          echo "Changelog updated."

