name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-storage-preflight:
    name: Windows storage access
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Verify a writable directory with the read-only attribute
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('kadupul-storage-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $env:WINDOWS_STORAGE_TEST_ROOT = $fixture
          try {
            $item = Get-Item $fixture
            $item.Attributes = $item.Attributes -bor [System.IO.FileAttributes]::ReadOnly
            if (-not ((Get-Item $fixture).Attributes -band [System.IO.FileAttributes]::ReadOnly)) {
              throw 'The fixture must have the read-only directory attribute'
            }
            php tests/integration/windows_storage_preflight.php
            if ($LASTEXITCODE -ne 0) { throw 'Windows storage preflight regression failed' }
          } finally {
            $item = Get-Item $fixture
            $item.Attributes = $item.Attributes -band (-bnot [System.IO.FileAttributes]::ReadOnly)
            Remove-Item -LiteralPath $fixture -Recurse -Force
          }

  database-contracts:
    name: Database contracts (${{ matrix.database }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        database: ['mariadb:10.6', 'mariadb:10.11', 'mariadb:11.8', 'mysql:8.0', 'mysql:8.4', 'mysql:9.7']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: cacti_boost_contract
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
          MYSQL_ROOT_PASSWORD: cactiroot
        ports:
        - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --user=cactiuser --password=cactiuser --silent || mariadb-admin ping -h 127.0.0.1 --user=cactiuser --password=cactiuser --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install PHP 8.1
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.1'
        extensions: pdo_mysql
        coverage: none

    - name: Install test dependencies
      working-directory: tests
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Record database behavior and run contracts
      working-directory: tests
      env:
        BOOST_DB_HOST: 127.0.0.1
        BOOST_DB_NAME: cacti_boost_contract
        BOOST_DB_USER: cactiuser
        BOOST_DB_PASSWORD: cactiuser
      run: |
        # shellcheck disable=SC2016
        php -r '$db = new PDO("mysql:host=" . getenv("BOOST_DB_HOST") . ";dbname=" . getenv("BOOST_DB_NAME"), getenv("BOOST_DB_USER"), getenv("BOOST_DB_PASSWORD")); echo json_encode($db->query("SELECT VERSION() AS version, @@version_comment AS vendor, @@sql_mode AS sql_mode, @@collation_server AS collation, @@default_storage_engine AS storage_engine")->fetch(PDO::FETCH_ASSOC), JSON_PRETTY_PRINT), PHP_EOL;'
        php vendor/bin/pest --configuration=phpunit-database.xml --colors=never

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, gmp, ldap, mbstring, mysqli, pdo_mysql, snmp, sockets, xml, zip
          coverage: none
          tools: none

      # Fails loudly on a parse error in any tracked source file. This is the
      # floor the rest of the pipeline builds on, and it runs even before there
      # is a composer.json to install from.
      - name: Syntax check
        run: |
          set -euo pipefail
          # include/vendor is Composer's, not ours. Linting it means a
          # deprecation in somebody else's library can redden our build.
          files=$(git ls-files '*.php' | grep -v '^include/vendor/')
          if [ -z "$files" ]; then
            echo "No PHP sources tracked yet; nothing to check."
            exit 0
          fi
          printf '%s\n' "$files" | xargs -n1 -P4 php -l

      - name: Validate composer manifest
        if: hashFiles('composer.json') != ''
        run: composer validate --strict

      - name: Install dependencies
        if: hashFiles('composer.lock') != ''
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        if: hashFiles('phpstan.neon', 'phpstan.neon.dist', '.phpstan.neon') != ''
        run: composer run-script phpstan

      - name: Detect Composer test script
        id: composer-test
        if: hashFiles('composer.json') != ''
        run: |
          # PHP variables must remain literal until PHP parses the expression.
          # shellcheck disable=SC2016
          php -r '$manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); echo "available=" . (isset($manifest["scripts"]["test"]) ? "true" : "false") . PHP_EOL;' >> "$GITHUB_OUTPUT"

      - name: Tests
        if: steps.composer-test.outputs.available == 'true'
        run: composer test

      - name: Install isolated CSV test runner
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction

      - name: Exercise production CSV paths
        working-directory: tests
        # The old Pest runner emits dependency deprecations on PHP 8.4. The
        # isolated production subprocess explicitly enables E_ALL and throws
        # on every diagnostic, including CSV default-argument deprecations.
        run: php -d error_reporting=8191 vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/CsvExplicitEscapeParityTest.php --colors=never

      - name: Install RRDtool for spike-removal contracts
        run: sudo apt-get update && sudo apt-get install -y rrdtool

      - name: Verify spike-removal backups and filesystem safety
        working-directory: tests
        env:
          RRDTOOL_TEST_BINARY: /usr/bin/rrdtool
        # Pest 1 emits dependency deprecations on PHP 8.4.
        run: php -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-spikekill.xml --colors=never

      - name: Verify privileged spike-removal boundaries
        working-directory: tests
        run: sudo -- "$(command -v php)" -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-spikekill.xml --colors=never

  application-smoke:
    name: Install, login and poller smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: python@3.12.12
      - name: Install PHP for native process-boundary self-tests
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: posix
          coverage: none
      - name: Verify observation normalization and failure reporting
        run: mise exec python@3.12.12 -- python tests/Support/Behavior/selftest.py
      # This exercises runtime invariants without claiming parity with upstream.
      # Observations are ephemeral CI artifacts; committed goldens stay untouched.
      - name: Load PHP base image for runtime provenance
        run: docker pull php:8.2-apache
      - name: Exercise fresh install, authentication and collection
        env:
          PHP_VERSION: '8.2'
        run: mise exec python@3.12.12 -- python tests/Support/Behavior/harness.py run --target ci-smoke --update-golden
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-smoke-observations
          path: tests/behavior/results/ci-smoke/
          if-no-files-found: warn

  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: php-cs-fixer:3.95.25

      # main moves to PER-CS one edited file at a time, so only the PHP files
      # this push or pull request changes are checked. On a pull request HEAD
      # is the test merge, and its first parent is the base branch tip. Calling
      # bash keeps the step working if a patch-based cherry-pick drops the
      # script's executable bit.
      - name: Check formatting
        if: hashFiles('.php-cs-fixer.php', '.php-cs-fixer.dist.php') != ''
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: bash tests/tools/check_php_style.sh "$BASE"

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect a manifest
        id: detect
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json at the root yet; skipping."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.found == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present lint

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present build

      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present test

  changelog:
    name: Changelog
    # The release workflow refuses to publish a tag the changelog does not
    # describe. Finding that out at tag time is the worst moment, so catch it
    # here instead. Add the no-changelog label to skip deliberately.
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD)

          # A branch that only moves CI, docs or the changelog itself needs no entry.
          substantive=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CHANGELOG.md|.github/*|docs/*|*.md) ;;
              *) substantive=true ;;
            esac
          done <<< "$changed"

          if [ "$substantive" = false ]; then
            echo "No user-visible change in this branch; no entry needed."
            exit 0
          fi

          if ! printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::This branch changes behaviour but does not touch CHANGELOG.md. Add an entry under Unreleased, or apply the no-changelog label." >&2
            exit 1
          fi
          echo "Changelog updated."
