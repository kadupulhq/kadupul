name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-floor:
    name: PHP runtime boundary (${{ matrix.php }})
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    strategy:
      matrix:
        # 8.3 is a rejection test, not a supported application runtime.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Isolate installed PHP before mise activation
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-php/bin"
          ln -s "$(readlink -f "$(command -v php)")" "$RUNNER_TEMP/runtime-php/bin/php"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python@3.12.12
          add_shims_to_path: false
      - name: Register selected PHP and verify CLI/HTTP runtime boundaries
        env:
          TEST_PHP_VERSION: '${{ matrix.php }}'
        run: |
          mise link "php@$TEST_PHP_VERSION" "$RUNNER_TEMP/runtime-php"
          mise exec python@3.12.12 -- python tests/tools/runtime_floor.py --php-version "$TEST_PHP_VERSION"

  windows-storage-preflight:
    name: Windows storage access
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify portable installer probe and executable allowlist
        shell: pwsh
        run: |
          php tests/integration/installer_probe_preflight.php
          if ($LASTEXITCODE -ne 0) { throw 'Installer probe preflight failed' }
      - name: Verify a writable directory with the read-only attribute
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('kadupul-storage-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $env:WINDOWS_STORAGE_TEST_ROOT = $fixture
          try {
            $item = Get-Item $fixture
            $item.Attributes = $item.Attributes -bor [System.IO.FileAttributes]::ReadOnly
            if (-not ((Get-Item $fixture).Attributes -band [System.IO.FileAttributes]::ReadOnly)) {
              throw 'The fixture must have the read-only directory attribute'
            }
            php tests/integration/windows_storage_preflight.php
            if ($LASTEXITCODE -ne 0) { throw 'Windows storage preflight regression failed' }
          } finally {
            $item = Get-Item $fixture
            $item.Attributes = $item.Attributes -band (-bnot [System.IO.FileAttributes]::ReadOnly)
            Remove-Item -LiteralPath $fixture -Recurse -Force
          }

  database-contracts:
    name: Database contracts (${{ matrix.database }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        database: ['mariadb:10.6', 'mariadb:10.11', 'mariadb:11.8', 'mysql:8.0', 'mysql:8.4', 'mysql:9.7']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: cacti_boost_contract
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
          MYSQL_ROOT_PASSWORD: cactiroot
        ports:
        - 3306:3306
        options: --health-cmd="MYSQL_PWD=$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 --user=$MYSQL_USER --silent || MYSQL_PWD=$MYSQL_PASSWORD mariadb-admin ping -h 127.0.0.1 --user=$MYSQL_USER --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install PHP 8.4
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.4'
        extensions: dom, gd, gmp, intl, ldap, mbstring, mysqlnd, pdo_mysql, sockets, sqlite3, xml
        coverage: none

    - name: Install application dependencies
      run: composer install --no-dev --no-interaction --no-progress --prefer-dist

    - name: Install test dependencies
      working-directory: tests
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Record database behavior and run contracts
      working-directory: tests
      env:
        BOOST_DB_HOST: 127.0.0.1
        BOOST_DB_NAME: cacti_boost_contract
        BOOST_DB_USER: cactiuser
        BOOST_DB_PASSWORD: cactiuser
        KADUPUL_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=cacti_boost_contract;charset=utf8mb4
        KADUPUL_TEST_MYSQL_USER: cactiuser
        KADUPUL_TEST_MYSQL_PASSWORD: cactiuser
        KADUPUL_TEST_MYSQL_ADMIN_USER: root
        KADUPUL_TEST_MYSQL_ADMIN_PASSWORD: cactiroot
      run: |
        # shellcheck disable=SC2016
        php -r '$db = new PDO("mysql:host=" . getenv("BOOST_DB_HOST") . ";dbname=" . getenv("BOOST_DB_NAME"), getenv("BOOST_DB_USER"), getenv("BOOST_DB_PASSWORD")); echo json_encode($db->query("SELECT VERSION() AS version, @@version_comment AS vendor, @@sql_mode AS sql_mode, @@collation_server AS collation, @@default_storage_engine AS storage_engine")->fetch(PDO::FETCH_ASSOC), JSON_PRETTY_PRINT), PHP_EOL;'
        # Pest 1 dependency deprecations: see docs/testing/php84-modernization-audit.md.
        php -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-database.xml --colors=never
        php Symfony/data_input_lock_probe.php
        php Support/verify_row_cache.php
        php -d zend.exception_ignore_args=1 vendor/bin/phpunit --no-configuration --cache-result-file="$RUNNER_TEMP/reference-transaction-phpunit.cache" Symfony/LegacyReferenceWriteTransactionNativeTest.php
        # Use the disposable matrix server's existing administrator identity;
        # the probe creates/drops only its own random schema in a finally block.
        KADUPUL_REFERENCE_TEST_DSN="$KADUPUL_TEST_MYSQL_DSN" \
          KADUPUL_REFERENCE_TEST_USER="$KADUPUL_TEST_MYSQL_ADMIN_USER" \
          KADUPUL_REFERENCE_TEST_PASSWORD="$KADUPUL_TEST_MYSQL_ADMIN_PASSWORD" \
          php -d zend.exception_ignore_args=1 security/reference_write_transaction_native_probe.php

  cdef-reference-contracts:
    name: CDEF references (${{ matrix.database }})
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: ['mariadb:10.11', 'mysql:8.4']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: kadupul_cdef_reference_test
          MYSQL_USER: cactiuser
          MYSQL_PASSWORD: cactiuser
          MYSQL_ROOT_PASSWORD: cactiroot
        ports:
          - 3306/tcp
        options: --health-cmd="MYSQL_PWD=$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 --user=$MYSQL_USER --silent || MYSQL_PWD=$MYSQL_PASSWORD mariadb-admin ping -h 127.0.0.1 --user=$MYSQL_USER --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4.25'
          extensions: curl, dom, gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, sqlite3, xml
          coverage: pcov
          tools: composer
      - name: Preserve selected PHP for mise
        run: |
          mkdir -p "$RUNNER_TEMP/cdef-php/bin"
          ln -s "$(readlink -f "$(command -v php)")" "$RUNNER_TEMP/cdef-php/bin/php"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python@3.12.12 node@22.22.2
          add_shims_to_path: false
      - name: Build actual dependencies and installer assets
        run: |
          mise link php@8.4.25 "$RUNNER_TEMP/cdef-php"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends rrdtool snmp
          mise exec php@8.4.25 -- composer install --no-interaction --no-progress --prefer-dist
          mise exec node@22.22.2 -- npm ci --ignore-scripts
          mise exec node@22.22.2 -- npm run build
          mise exec php@8.4.25 -- php bin/console asset-map:compile
      - name: Native API coverage and actual installer caller proofs
        env:
          KADUPUL_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports['3306'] }};dbname=kadupul_cdef_reference_test;charset=utf8mb4
          KADUPUL_TEST_MYSQL_USER: root
          KADUPUL_TEST_MYSQL_PASSWORD: cactiroot
          KADUPUL_REFERENCE_TEST_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports['3306'] }};dbname=kadupul_cdef_reference_test;charset=utf8mb4
          KADUPUL_REFERENCE_TEST_USER: root
          KADUPUL_REFERENCE_TEST_PASSWORD: cactiroot
        run: |
          mkdir -p "$RUNNER_TEMP/cdef-api-coverage"
          mise exec python@3.12.12 -- python tests/security/test_cdef_reference_runner.py
          mise exec python@3.12.12 -- python tests/security/test_cdef_reference_gettext.py
          mise exec php@8.4.25 -- php -d pcov.directory="$GITHUB_WORKSPACE" \
            -d pcov.exclude='~/(include/vendor|tests)/~' include/vendor/bin/phpunit \
            -c phpunit-symfony.xml --filter 'CdefReferenceNativeTest|InstallerVersionConfirmationTest|InstallerFailedPollTest|LegacyAggregateSaveRefusalTest|AggregateItemTransactionTest|CdefNativeProbeCoverageTest|CdefCliNativeCoverageTest|AggregateGraphStatementTest|AggregateGraphItemsBoundaryTest|AggregateCacheCursorTest|HostDataSubstitutionTest' \
            --coverage-php "$RUNNER_TEMP/cdef-api-coverage/native.php" \
            --coverage-clover "$RUNNER_TEMP/cdef-api-coverage/native.xml"
          mise exec php@8.4.25 python@3.12.12 -- python tests/security/run_cdef_reference_contracts.py \
            --output "$RUNNER_TEMP/cdef-reference-proof"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cdef-reference-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/cdef-api-coverage
            ${{ runner.temp }}/cdef-reference-proof
          if-no-files-found: error

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, gmp, ldap, mbstring, mysqli, pdo_mysql, snmp, sockets, xml, zip
          coverage: none
          tools: none

      # Fails loudly on a parse error in any tracked source file. This is the
      # floor the rest of the pipeline builds on, and it runs even before there
      # is a composer.json to install from.
      - name: Syntax check
        run: |
          set -euo pipefail
          # include/vendor is Composer's, not ours. Linting it means a
          # deprecation in somebody else's library can redden our build.
          files=$(git ls-files '*.php' | grep -v '^include/vendor/')
          if [ -z "$files" ]; then
            echo "No PHP sources tracked yet; nothing to check."
            exit 0
          fi
          printf '%s\n' "$files" | xargs -n1 -P4 php -l

      - name: Validate composer manifest
        if: hashFiles('composer.json') != ''
        run: composer validate --strict

      - name: Install dependencies
        if: hashFiles('composer.lock') != ''
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        if: hashFiles('phpstan.neon', 'phpstan.neon.dist', '.phpstan.neon') != ''
        run: composer run-script phpstan

      - name: Detect Composer test script
        id: composer-test
        if: hashFiles('composer.json') != ''
        run: |
          # PHP variables must remain literal until PHP parses the expression.
          # shellcheck disable=SC2016
          php -r '$manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); echo "available=" . (isset($manifest["scripts"]["test"]) ? "true" : "false") . PHP_EOL;' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'

      - name: Build installed browser assets for compatibility tests
        run: npm ci --ignore-scripts && npm run build

      # The production command, strict about unresolved url() and @import.
      # CompiledLegacyAssetsTest compiles again into a scratch directory.
      - name: Compile browser assets
        run: php bin/console asset-map:compile

      - name: Tests
        if: steps.composer-test.outputs.available == 'true'
        run: composer test

      - name: Install isolated CSV test runner
        run: composer install --working-dir=tests --prefer-dist --no-progress --no-interaction

      - name: Verify PHP 8.0 string and regex behavior
        working-directory: tests
        run: php -d "error_reporting=E_ALL & ~E_DEPRECATED" vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/Php80StringRegexTest.php --colors=never

      - name: Verify helper union return contracts
        working-directory: tests
        run: php -d error_reporting=8191 vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/Core/Helpers/HelperUnionReturnTypeTest.php --colors=never

      - name: Verify token entropy failure and native identifiers
        working-directory: tests
        run: php -d "error_reporting=E_ALL & ~E_DEPRECATED" vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/GenerateHashFailsClosedTest.php --colors=never

      - name: Exercise production CSV paths
        working-directory: tests
        # The old Pest runner emits dependency deprecations on PHP 8.4. The
        # isolated production subprocess explicitly enables E_ALL and throws
        # on every diagnostic, including CSV default-argument deprecations.
        run: php -d error_reporting=8191 vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/CsvExplicitEscapeParityTest.php --colors=never

      - name: Verify string predicates and directory boundaries
        working-directory: tests
        run: |
          php -d error_reporting=24575 vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/Core/StringPredicateHelpersTest.php --colors=never
          php -d error_reporting=24575 vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/Core/PathHelpersTest.php --colors=never

      - name: Legacy form goldens
        working-directory: tests
        # Pest 1 emits dependency deprecations on PHP 8.4.
        run: php -d error_reporting=24575 vendor/bin/pest --bootstrap=bootstrap-unit.php Unit/Forms/LegacyFormGoldenTest.php --colors=never

      - name: Install RRDtool for spike-removal contracts
        run: sudo apt-get update && sudo apt-get install -y rrdtool

      - name: Verify spike-removal backups and filesystem safety
        working-directory: tests
        env:
          RRDTOOL_TEST_BINARY: /usr/bin/rrdtool
        # Pest 1 emits dependency deprecations on PHP 8.4.
        run: php -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-spikekill.xml --colors=never

      - name: Verify privileged spike-removal boundaries
        working-directory: tests
        run: sudo -- "$(command -v php)" -d error_reporting=24575 vendor/bin/pest --configuration=phpunit-spikekill.xml --colors=never

  application-smoke:
    name: Install, login and poller smoke
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python@3.12.12 node@22.22.2
      - name: Install PHP for native process-boundary self-tests
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: posix
          coverage: none
      - name: Register actual installed PHP with mise
        run: |
          fixture_php_version=$(php -r 'echo PHP_VERSION;')
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 4 ? 0 : 1);'
          mkdir -p "$RUNNER_TEMP/offline-fixture-php/bin"
          ln -s "$(readlink -f "$(command -v php)")" "$RUNNER_TEMP/offline-fixture-php/bin/php"
          mise link "php@$fixture_php_version" "$RUNNER_TEMP/offline-fixture-php"
          echo "KADUPUL_OFFLINE_FIXTURE_PHP_VERSION=$fixture_php_version" >> "$GITHUB_ENV"
      - name: Verify observation normalization and failure reporting
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/Support/Behavior/selftest.py
      - name: Verify offline build runtime selection
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" node@22.22.2 python@3.12.12 -- python tests/tools/test_offline_build_runtime.py
      - name: Verify offline guest fixture mutations
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/tools/test_offline_fixture_mutation.py
      - name: Verify installed legacy form controls and coverage marker bindings
        run: mise exec python@3.12.12 -- python tests/tools/test_cdef_legacy_page_forms.py
      - name: Verify coverage helper imports and database report preservation
        run: mise exec python@3.12.12 -- python tests/tools/test_coverage_selftest_database_reports.py
      - name: Restore pinned compatibility libraries
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" -- php tools/dependencies/install-legacy.php
      - name: Verify flag maintenance filename filters
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/Support/flag_icons_helpers_test.py
      # This exercises runtime invariants without claiming parity with upstream.
      # Observations are ephemeral CI artifacts; committed goldens stay untouched.
      - name: Load PHP base image for runtime provenance
        run: docker pull php:8.4-apache
      - name: Exercise fresh install, authentication and collection
        env:
          PHP_VERSION: '8.4'
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/Support/Behavior/harness.py run --target ci-smoke --update-golden
      - name: Verify External Links through HTTP and MariaDB
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/Symfony/link_review_http.py
      - name: Verify the actual CLI upgrades an installed LTS database version
        run: mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/Symfony/schema_upgrade_cli_http.py
      - name: Refuse forbidden access at every entry point
        run: |
          mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/security/test_entry_route_samples.py
          mise exec "php@$KADUPUL_OFFLINE_FIXTURE_PHP_VERSION" python@3.12.12 -- python tests/security/entry_point_authorization.py
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-smoke-observations
          path: tests/behavior/results/ci-smoke/
          if-no-files-found: warn

  style:
    name: Code style
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: php-cs-fixer:3.95.27

      # main moves to PER-CS one edited file at a time, so only the PHP files
      # this push or pull request changes are checked. On a pull request HEAD
      # is the test merge, and its first parent is the base branch tip. Calling
      # bash keeps the step working if a patch-based cherry-pick drops the
      # script's executable bit.
      - name: Check formatting
        if: hashFiles('.php-cs-fixer.php', '.php-cs-fixer.dist.php') != ''
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: bash tests/tools/check_php_style.sh "$BASE"

      - name: Check the hook installer
        run: bash tests/tools/test_githooks_install.sh

      - name: Check merge validation preserves incoming content
        run: bash tests/tools/test_githooks_merge.sh

  javascript:
    name: JavaScript
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect a manifest
        id: detect
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json at the root yet; skipping."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.found == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present lint

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run --if-present build

      - name: Set up PHP for controller fixtures
        if: steps.detect.outputs.found == 'true'
        # The permission-filter JS test executes the actual PHP controllers.
        # Its SQLite fixture and HTML renderer need these runtime extensions.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, dom
          coverage: none

      - name: Test browser behavior
        if: steps.detect.outputs.found == 'true'
        run: |
          npm run --if-present test
          node --test tests/Unit/security-inventory.test.mjs tests/Unit/sites-navigation.test.mjs tests/Unit/midwinter-cookie.test.mjs tests/Unit/midwinter-css-imports.test.mjs tests/Unit/theme-scripts.test.mjs tests/Unit/selectmenu-scroll.test.mjs tests/Unit/permission-filter.test.mjs

  changelog:
    name: Changelog
    # The release workflow refuses to publish a tag the changelog does not
    # describe. Finding that out at tag time is the worst moment, so catch it
    # here instead. Add the no-changelog label to skip deliberately.
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA" HEAD)

          # A branch that only moves CI, contributor hooks, docs or the
          # changelog itself needs no entry.
          substantive=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              CHANGELOG.md|.github/*|.githooks/*|docs/*|*.md) ;;
              *) substantive=true ;;
            esac
          done <<< "$changed"

          if [ "$substantive" = false ]; then
            echo "No user-visible change in this branch; no entry needed."
            exit 0
          fi

          # A here-string avoids SIGPIPE from grep -q exiting early on large PRs.
          if ! grep -qx 'CHANGELOG.md' <<< "$changed"; then
            echo "::error file=CHANGELOG.md::This branch changes behaviour but does not touch CHANGELOG.md. Add an entry under Unreleased, or apply the no-changelog label." >&2
            exit 1
          fi
          echo "Changelog updated."
