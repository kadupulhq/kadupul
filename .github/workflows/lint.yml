name: Lint

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**', '.github/dependabot.yml']
  pull_request:
    paths: ['.github/workflows/**', '.github/actions/**', '.github/dependabot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    timeout-minutes: 20
    name: Workflow files
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: actionlint@1.7.12

      # Catches the expression typo, the bad `needs` reference, and the shell
      # mistake that would otherwise only show up on a tag.
      - name: actionlint
        run: mise exec actionlint@1.7.12 -- actionlint -color

      # Catches the security mistakes actionlint does not: unpinned actions,
      # over-broad permissions, and script injection through untrusted context.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.30.1
          zizmor --persona=regular --min-severity=low --strict-collection .github/workflows/ .github/dependabot.yml
