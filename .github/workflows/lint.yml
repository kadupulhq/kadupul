name: Lint

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**']
  pull_request:
    paths: ['.github/workflows/**', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches the expression typo, the bad `needs` reference, and the shell
      # mistake that would otherwise only show up on a tag.
      - name: actionlint
        run: |
          docker run --rm \
            --volume "${PWD}:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # Catches the security mistakes actionlint does not: unpinned actions,
      # over-broad permissions, and script injection through untrusted context.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx install zizmor==1.30.1
          zizmor --persona=regular --min-severity=low .github/workflows/
