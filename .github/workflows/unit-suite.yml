name: Complete LTS unit suite
on:
  pull_request:
    branches: [lts/1.2, 'chore/consolidate-lts-*']
  push:
    branches: [lts/1.2]
permissions:
  contents: read
concurrency:
  group: unit-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit suite PHP ${{ matrix.php }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, gettext, gmp, intl, ldap, mbstring, mysqli, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, snmp, sockets, xml, zip
          coverage: none
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: node@22.22.2
      - name: Install RRDtool
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends rrdtool
      - name: Install locked application dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - name: Install test dependencies
        working-directory: tests
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Test runner failure handling
        run: python3 -m unittest discover -s tests/runner_tests -v
      - name: Run every unit file in an isolated process
        env:
          RRDTOOL_TEST_BINARY: /usr/bin/rrdtool
        run: mise exec node@22.22.2 -- python3 tests/run_unit_suite.py --output artifacts/unit-suite
      - name: Preserve all results and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-suite-php-${{ matrix.php }}
          path: artifacts/unit-suite/
          if-no-files-found: error
