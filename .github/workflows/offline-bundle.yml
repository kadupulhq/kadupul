name: Offline bundle

on:
  pull_request:
    branches: [main, 'chore/consolidate-main-*']
  merge_group:
  push:
    branches: [main]
  workflow_call:
    inputs:
      hosted-runners-only:
        description: Keep every job on GitHub-hosted runners, as release builds require
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-bundle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authentication:
    permissions:
      contents: read
      packages: read
    name: Shared authentication (${{ matrix.backend }} sessions)
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && !inputs.hosted-runners-only && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    # The self-hosted runners take 28 to 30 minutes here, against 18 on
    # GitHub-hosted ones, so 30 cancelled passing runs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [files, database]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash tests/tools/login_ghcr.sh
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: python@3.12.12 node@22.22.2
      - name: Install pinned browser workflow test runtime
        run: |
          mise exec node@22.22.2 -- npm ci --ignore-scripts --no-audit --no-fund --prefix tests/e2e
          mise exec node@22.22.2 -- node tests/e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify complete shared authentication backend over HTTP
        env:
          SESSION_BACKEND: ${{ matrix.backend }}
          AUTH_PROJECT: kadupul-offline-auth-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}
        run: |
          case "$SESSION_BACKEND" in
            files)
              mise exec python@3.12.12 -- python tests/Symfony/session_bridge.py --project "$AUTH_PROJECT"
              ;;
            database)
              mise exec python@3.12.12 -- python tests/Symfony/session_bridge.py --database-sessions --project "$AUTH_PROJECT"
              ;;
            *)
              echo "Unknown session backend" >&2
              exit 1
              ;;
          esac

  bundle:
    permissions:
      contents: read
      packages: read
    needs: authentication
    # A superseded run is cancelled rather than reported as a failure.
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && !inputs.hosted-runners-only && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Require both authentication backends to pass
        if: ${{ needs.authentication.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash tests/tools/login_ghcr.sh
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: python@3.12.12 node@22.22.2
      - name: Locate Composer download cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock', 'tests/composer.lock') }}
          restore-keys: |
            composer-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Build dependency-complete archive
        run: mise exec python@3.12.12 -- python tools/build-offline.py
      - name: Build isolated verification runtime
        run: docker build -f tests/behavior/Dockerfile -t kadupul-offline-verifier .
      - name: Verify archive without network access
        run: |
          mkdir -p /tmp/kadupul-offline-check
          cd dist
          sha256sum --check kadupul-offline.tar.gz.sha256
          tar -xzf kadupul-offline.tar.gz -C /tmp/kadupul-offline-check
          docker run --rm --network none --entrypoint php \
            --volume /tmp/kadupul-offline-check/kadupul:/app \
            --volume "$GITHUB_WORKSPACE/tools/verify-offline.php:/verify-offline.php:ro" \
            --workdir /app kadupul-offline-verifier \
            -d auto_prepend_file= /verify-offline.php
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: kadupul-offline-bundle
          path: |
            dist/kadupul-offline.tar.gz
            dist/kadupul-offline.tar.gz.sha256
          if-no-files-found: error

  offline-bundle-result:
    name: Offline bundle result
    # Always reports: a required check reads a skipped job as passing.
    if: ${{ !cancelled() }}
    needs:
      - authentication
      - bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ''
        run: bash tests/tools/require_job_results.sh
