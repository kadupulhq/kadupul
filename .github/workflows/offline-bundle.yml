name: Offline bundle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python@3.12.12
      - name: Build dependency-complete archive
        run: mise exec python@3.12.12 -- python tools/build-offline.py
      - name: Build isolated verification runtime
        run: docker build -f tests/behavior/Dockerfile -t kadupul-offline-verifier .
      - name: Verify shared authentication over HTTP
        run: |
          mise exec python@3.12.12 -- python tests/Symfony/session_bridge.py
          mise exec python@3.12.12 -- python tests/Symfony/session_bridge.py --database-sessions
      - name: Verify archive without network access
        run: |
          mkdir -p /tmp/kadupul-offline-check
          cd dist
          sha256sum --check kadupul-offline.tar.gz.sha256
          tar -xzf kadupul-offline.tar.gz -C /tmp/kadupul-offline-check
          docker run --rm --network none --entrypoint php \
            --volume /tmp/kadupul-offline-check/kadupul:/app \
            --volume "$GITHUB_WORKSPACE/tools/verify-offline.php:/verify-offline.php:ro" \
            --workdir /app kadupul-offline-verifier \
            -d auto_prepend_file= /verify-offline.php
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kadupul-offline-bundle
          path: |
            dist/kadupul-offline.tar.gz
            dist/kadupul-offline.tar.gz.sha256
          if-no-files-found: error
