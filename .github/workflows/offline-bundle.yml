name: Offline bundle

on:
  pull_request:
    branches: [main, 'chore/consolidate-main-*']
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: offline-bundle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authentication:
    name: Shared authentication (${{ matrix.backend }} sessions)
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [files, database]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure hosted Docker image cache
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: bash tests/tools/configure_docker_mirror.sh
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: python@3.12.12 node@22.22.2
      - name: Install pinned browser workflow test runtime
        run: |
          mise exec node@22.22.2 -- npm ci --ignore-scripts --no-audit --no-fund --prefix tests/e2e
          mise exec node@22.22.2 -- node tests/e2e/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Verify complete shared authentication backend over HTTP
        env:
          SESSION_BACKEND: ${{ matrix.backend }}
          AUTH_PROJECT: kadupul-offline-auth-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}
        run: |
          case "$SESSION_BACKEND" in
            files)
              mise exec python@3.12.12 -- python tests/Symfony/session_bridge.py --project "$AUTH_PROJECT"
              ;;
            database)
              mise exec python@3.12.12 -- python tests/Symfony/session_bridge.py --database-sessions --project "$AUTH_PROJECT"
              ;;
            *)
              echo "Unknown session backend" >&2
              exit 1
              ;;
          esac

  bundle:
    needs: authentication
    if: ${{ always() }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Require both authentication backends to pass
        if: ${{ needs.authentication.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure hosted Docker image cache
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: bash tests/tools/configure_docker_mirror.sh
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: python@3.12.12 node@22.22.2
      - name: Locate Composer download cache
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('composer.lock', 'tests/composer.lock') }}
          restore-keys: |
            composer-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Build dependency-complete archive
        run: mise exec python@3.12.12 -- python tools/build-offline.py
      - name: Build isolated verification runtime
        run: docker build -f tests/behavior/Dockerfile -t kadupul-offline-verifier .
      - name: Verify archive without network access
        run: |
          mkdir -p /tmp/kadupul-offline-check
          cd dist
          sha256sum --check kadupul-offline.tar.gz.sha256
          tar -xzf kadupul-offline.tar.gz -C /tmp/kadupul-offline-check
          docker run --rm --network none --entrypoint php \
            --volume /tmp/kadupul-offline-check/kadupul:/app \
            --volume "$GITHUB_WORKSPACE/tools/verify-offline.php:/verify-offline.php:ro" \
            --workdir /app kadupul-offline-verifier \
            -d auto_prepend_file= /verify-offline.php
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          retention-days: 14
          name: kadupul-offline-bundle
          path: |
            dist/kadupul-offline.tar.gz
            dist/kadupul-offline.tar.gz.sha256
          if-no-files-found: error
