name: Snyk

on:
  push:
    branches: [lts/1.2]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token:
    name: Check Snyk configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether SNYK_TOKEN is configured
        id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Explain why scans are skipped
        if: ${{ steps.check.outputs.configured != 'true' }}
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo '::warning::Snyk scans are skipped for fork pull requests because GitHub does not provide repository secrets to them.'
          else
            echo '::warning::Snyk scans are skipped. Configure the SNYK_TOKEN Actions secret to enable Composer dependency scans.'
          fi

  dependencies:
    name: Composer dependencies
    needs: token
    if: ${{ needs.token.outputs.configured == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd
        with:
          snyk-version: v1.1307.4
      - name: Test Composer dependencies
        run: snyk test --all-projects --dev --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
