name: Snyk

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request can affect the jobs below; every other
  # event runs them.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test merge and both of its parents.
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: tests/tools/ci_change_scope.sh
          sparse-checkout-cone-mode: false
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tests/tools/ci_change_scope.sh

  token:
    timeout-minutes: 5
    name: Check Snyk configuration
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether SNYK_TOKEN is configured
        id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Explain why scans are skipped
        if: ${{ steps.check.outputs.configured != 'true' }}
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo '::warning::Snyk scans are skipped for fork pull requests because GitHub does not provide repository secrets to them.'
          else
            echo '::warning::Snyk scans are skipped. Configure the SNYK_TOKEN Actions secret to enable Composer and npm dependency scans.'
          fi

  dependencies:
    timeout-minutes: 30
    name: Composer and npm dependencies
    needs: [scope, token]
    if: ${{ needs.scope.outputs.code == 'true' && needs.token.outputs.configured == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-php # zizmor: ignore[self-repository]
        with:
          php-version: '8.4'
          tools: composer
      - uses: ./.github/actions/setup-node # zizmor: ignore[self-repository]
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository]
        with:
          install_args: python@3.12.12
      - name: Install Python dependencies for project discovery
        run: |
          mise exec python@3.12.12 -- python -m venv "$RUNNER_TEMP/snyk-python"
          "$RUNNER_TEMP/snyk-python/bin/python" -m pip install -r tests/Symfony/requirements.txt
          "$RUNNER_TEMP/snyk-python/bin/python" -m pip install --require-hashes -r tests/tools/requirements.txt
          "$RUNNER_TEMP/snyk-python/bin/python" -m pip install --only-binary=:all: --require-hashes -r .github/scripts/catalog/requirements.txt
          echo "$RUNNER_TEMP/snyk-python/bin" >> "$GITHUB_PATH"
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1307.4
      - name: Verify complete-project report guard
        run: mise exec python@3.12.12 -- python -m unittest discover -s tests/security -p 'test_snyk*.py' -v
      - name: Match Composer's root-only development requirements
        # This checkout is disposable. Root manifests and all locked packages stay intact.
        run: mise exec python@3.12.12 -- python tests/security/prepare_snyk_composer_locks.py composer.lock tests/composer.lock
      - name: Test Composer and npm dependencies
        id: dependency_scan
        run: |
          scan_dir=$(mktemp -d "$RUNNER_TEMP/snyk-completion.XXXXXX")
          echo "receipt-path=$scan_dir/completion.json" >> "$GITHUB_OUTPUT"
          # --print-deps is documented and selects the pinned legacy testing path.
          # Keep package trees, policies and provider errors out of public logs.
          trap 'rm -f -- "$scan_dir/report.json" "$scan_dir/scan.log"' EXIT
          set +e
          snyk test --all-projects --dev --severity-threshold=high --print-deps \
            --json-file-output="$scan_dir/report.json" > "$scan_dir/scan.log" 2>&1
          scan_status=$?
          mise exec python@3.12.12 -- python tests/security/verify_snyk_project_report.py \
            "$scan_dir/report.json" --checkout "$GITHUB_WORKSPACE" \
            --cli-exit "$scan_status" --scan-log "$scan_dir/scan.log" \
            --receipt "$scan_dir/completion.json"
          report_status=$?
          set -e
          if [ "$scan_status" -ne 0 ]; then
            exit "$scan_status"
          fi
          exit "$report_status"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Retain safe dependency scan completion evidence
        if: ${{ always() && steps.dependency_scan.outputs.receipt-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: snyk-project-completion
          path: ${{ steps.dependency_scan.outputs.receipt-path }}
          if-no-files-found: error

  snyk-result:
    name: Snyk result
    # Always reports: a required check reads a skipped job as passing.
    # The scan skips without SNYK_TOKEN (forks, Dependabot), which the token job
    # warns about, and on prose-only pull requests.
    if: ${{ !cancelled() }}
    needs:
      - scope
      - token
      - dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ ((needs.token.result == 'success' && (needs.token.outputs.configured != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))) || (needs.scope.result == 'success' && needs.scope.outputs.code == 'false')) && 'dependencies' || '' }}
        run: bash tests/tools/require_job_results.sh
