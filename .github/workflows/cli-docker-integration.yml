name: CLI maintenance Docker integration

on:
  pull_request:
    branches: [main, lts/1.2]
  merge_group:
  push:
    branches: [main, lts/1.2]
    paths:
      - 'cli/**'
      - 'include/**'
      - 'lib/**'
      - 'cacti.sql'
      - 'lib/api_tree.php'
      - 'lib/data_query.php'
      - 'lib/maintenance_cli.php'
      - 'lib/utility.php'
      - 'docs/audit_schema.sql'
      - '.dockerignore'
      - 'include/global_constants.php'
      - 'composer.json'
      - 'composer.lock'
      - 'tests/e2e/docker/**'
      - 'tests/tools/check_cli_version.sh'
      - '.github/workflows/cli-docker-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-docker-integration-${{ github.event.pull_request.base.ref || github.ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pull request path filter lives here instead of under `on:`, so the
  # workflow always runs and its result job always reports.
  # Pushes keep their own path filter.
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff must fail the job, never read as "nothing relevant".
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          relevant=false
          while IFS= read -r path; do
            case "$path" in
              cli/*|include/*|lib/*|cacti.sql|docs/audit_schema.sql|.dockerignore|composer.json|composer.lock|tests/e2e/docker/*|tests/tools/check_cli_version.sh|.github/workflows/cli-docker-integration.yml) relevant=true ;;
            esac
          done <<< "$changed"
          echo "Relevant to this workflow: $relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  cli-database:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    permissions:
      contents: read
      packages: read
    name: CLI integration against MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        uses: ./.github/actions/ghcr-login # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          username: ${{ github.actor }}

      - name: Run CLI maintenance integration suite
        env:
          CACTI_E2E_TEST_GLOB: tests/09-cli-maintenance-integration.sh
        run: tests/e2e/docker/run.sh

  cli-docker-integration-result:
    name: CLI Docker integration result
    # Always reports: a required check reads a skipped job as passing.
    # The suite jobs skip only when the changes job found nothing relevant.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - cli-database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.result == 'success' && needs.changes.outputs.relevant == 'false' && 'cli-database' || '' }}
        run: bash tests/tools/require_job_results.sh
