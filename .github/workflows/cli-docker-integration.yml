name: CLI maintenance Docker integration

on:
  pull_request:
    branches: [main, lts/1.2, fix/main-installer-automation-mode]
  merge_group:
  push:
    branches: [main, lts/1.2]
    paths:
      - 'cli/**'
      - 'include/**'
      - 'lib/**'
      - 'install/**'
      - 'bin/legacy-installer.php'
      - 'src/Platform/**'
      - 'templates/platform/installer.html.twig'
      - 'config/**'
      - 'cacti.sql'
      - 'lib/api_tree.php'
      - 'lib/data_query.php'
      - 'lib/maintenance_cli.php'
      - 'lib/utility.php'
      - 'docs/audit_schema.sql'
      - '.dockerignore'
      - 'include/global_constants.php'
      - 'composer.json'
      - 'composer.lock'
      - 'tests/e2e/docker/**'
      - 'tests/e2e/installer-native.cjs'
      - 'tests/e2e/package*.json'
      - 'tests/tools/check_cli_version.sh'
      - '.github/workflows/cli-docker-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-docker-integration-${{ github.event.pull_request.base.ref || github.ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The pull request path filter lives here instead of under `on:`, so the
  # workflow always runs and its result job always reports.
  # Pushes keep their own path filter.
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test merge and both of its parents.
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: tests/tools/ci_change_scope.sh
          sparse-checkout-cone-mode: false
      - name: Match changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEVANT_PATHS: |
            cli/*
            include/*
            lib/*
            install/*
            bin/legacy-installer.php
            src/Platform/*
            templates/platform/installer.html.twig
            config/*
            cacti.sql
            docs/audit_schema.sql
            .dockerignore
            composer.json
            composer.lock
            tests/e2e/docker/*
            tests/e2e/installer-native.cjs
            tests/e2e/package*.json
            tests/tools/check_cli_version.sh
            .github/workflows/cli-docker-integration.yml
        run: bash tests/tools/ci_change_scope.sh

  cli-database:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    permissions:
      contents: read
      packages: read
    name: CLI integration against MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        uses: ./.github/actions/ghcr-login # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          username: ${{ github.actor }}

      - name: Run CLI maintenance integration suite
        env:
          CACTI_E2E_TEST_GLOB: tests/09-cli-maintenance-integration.sh
        run: tests/e2e/docker/run.sh

  installer-browser:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    permissions:
      contents: read
      packages: read
    name: Native installer browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ghcr-login # zizmor: ignore[self-repository]
        with:
          token: ${{ github.token }}
          username: ${{ github.actor }}
      - uses: ./.github/actions/setup-php # zizmor: ignore[self-repository]
        with:
          php-version: '8.4'
          coverage: none
      - uses: ./.github/actions/setup-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install locked browser runner
        working-directory: tests/e2e
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise fresh installation through native authentication
        env:
          CACTI_E2E_INSTALLER_BROWSER: '1'
          CACTI_E2E_TEST_GLOB: tests/09-cli-maintenance-integration.sh
        run: tests/e2e/docker/run.sh

  cli-docker-integration-result:
    name: CLI Docker integration result
    # Always reports: a required check reads a skipped job as passing.
    # The suite jobs skip only when the changes job found nothing relevant.
    if: ${{ !cancelled() }}
    needs:
      - changes
      - cli-database
      - installer-browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.changes.result == 'success' && needs.changes.outputs.relevant == 'false' && 'cli-database installer-browser' || '' }}
        run: bash tests/tools/require_job_results.sh
