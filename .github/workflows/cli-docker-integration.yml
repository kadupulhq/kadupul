name: CLI maintenance Docker integration

on:
  pull_request:
    branches: [main, lts/1.2, 'chore/consolidate-lts-*']
    paths:
      - 'cli/**'
      - 'lib/api_tree.php'
      - 'lib/audit.php'
      - 'lib/data_query.php'
      - 'lib/maintenance_cli.php'
      - 'lib/poller.php'
      - 'lib/template.php'
      - 'lib/utility.php'
      - 'docs/audit_schema.sql'
      - 'include/global_constants.php'
      - 'composer.json'
      - 'composer.lock'
      - 'tests/e2e/docker/**'
      - 'tests/tools/check_cli_version.sh'
      - 'tests/integration/AnalyzeDatabaseCliContract.php'
      - 'tests/integration/analyze_database_cli.sh'
      - '.github/workflows/cli-docker-integration.yml'
  push:
    branches: [main, lts/1.2]
    paths:
      - 'cli/**'
      - 'lib/api_tree.php'
      - 'lib/audit.php'
      - 'lib/data_query.php'
      - 'lib/maintenance_cli.php'
      - 'lib/poller.php'
      - 'lib/template.php'
      - 'lib/utility.php'
      - 'docs/audit_schema.sql'
      - 'include/global_constants.php'
      - 'composer.json'
      - 'composer.lock'
      - 'tests/e2e/docker/**'
      - 'tests/tools/check_cli_version.sh'
      - 'tests/integration/AnalyzeDatabaseCliContract.php'
      - 'tests/integration/analyze_database_cli.sh'
      - '.github/workflows/cli-docker-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-docker-integration-${{ github.event.pull_request.base.ref || github.ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-database:
    name: CLI integration against MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run CLI maintenance integration suite
        env:
          CACTI_E2E_TEST_GLOB: tests/09-cli-maintenance-integration.sh
        run: tests/e2e/docker/run.sh

  analyze-binlog:
    name: Native LTS analysis ${{ matrix.image }} PHP ${{ matrix.php }}
    if: (github.event.pull_request.base.ref == 'lts/1.2' || startsWith(github.event.pull_request.base.ref, 'chore/consolidate-lts-')) || github.ref == 'refs/heads/lts/1.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
        image: ['mariadb:10.6', 'mariadb:10.11', 'mariadb:11.8', 'mysql:8.0', 'mysql:8.4', 'mysql:9.7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Run unchanged production CLI and database helpers on native MariaDB
        env:
          ANALYZE_DB_IMAGE: ${{ matrix.image }}
        run: tests/integration/analyze_database_cli.sh
