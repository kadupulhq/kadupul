name: RRDtool Proxy E2E

on:
  pull_request:
    paths:
      - lib/rrd.php
      - lib/functions.php
      - src/Graphing/Infrastructure/Rrd/**
      - include/global_settings.php
      - settings.php
      - templates_import.php
      - templates_export.php
      - tests/e2e/**
      - .github/workflows/rrd-proxy-e2e.yml
  push:
    branches: [main]
    paths:
      - lib/rrd.php
      - lib/functions.php
      - src/Graphing/Infrastructure/Rrd/**
      - include/global_settings.php
      - settings.php
      - templates_import.php
      - templates_export.php
      - tests/e2e/**
      - .github/workflows/rrd-proxy-e2e.yml

permissions:
  contents: read

concurrency:
  group: rrd-proxy-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-proxy-journey:
    name: Settings, RRD I/O, and template import/export
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'

      - name: Install application dependencies and build browser assets
        run: |
          composer install --no-dev --prefer-dist --no-progress --no-interaction
          npm ci --ignore-scripts
          npm run build

      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run real RRDtool proxy user journey
        run: tests/e2e/rrd-proxy/run.sh

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rrd-proxy-playwright-results
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
