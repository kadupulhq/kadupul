name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-bundle:
    uses: ./.github/workflows/offline-bundle.yml # zizmor: ignore[self-repository] -- Pinned actionlint does not yet support $/ workflow calls.

  # A called workflow can only narrow the caller's token, never widen it, so
  # every scope the reusable jobs need has to be granted here.
  release:
    needs: offline-bundle
    uses: kadupulhq/.github/.github/workflows/release.yml@917f4d4369474e947d29252a7597868927f3a38a # v1.0.0
    permissions:
      contents: write     # create the release and upload its assets
      packages: write     # push the image, its signature and its attestation
      id-token: write     # OIDC token for cosign and the attestations API
      attestations: write # file provenance against the repository
    with:
      # The verified, dependency-complete offline builder supplies the archive.
      tarball: false
      image: true
      draft: true
      php-version: '8.4'

  attach-offline-bundle:
    timeout-minutes: 15
    needs: [release, offline-bundle]
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kadupul-offline-bundle
          path: dist
      - name: Verify the archive checksum before attesting
        working-directory: dist
        run: sha256sum --check kadupul-offline.tar.gz.sha256
      - name: Attest the installable offline archive
        id: offline-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kadupul-offline.tar.gz
      - name: Preserve the signed verification bundle with the release asset
        env:
          ATTESTATION_BUNDLE: ${{ steps.offline-attestation.outputs.bundle-path }}
        run: |
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" dist/kadupul-offline.tar.gz.sigstore.json
          jq -e '.dsseEnvelope | (.payloadType == "application/vnd.in-toto+json") and (.payload | type == "string") and (.signatures | length > 0)' "$ATTESTATION_BUNDLE" >/dev/null
          jq -c '.dsseEnvelope' "$ATTESTATION_BUNDLE" > dist/kadupul-offline.tar.gz.intoto.jsonl
      - name: Attach installable archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/kadupul-offline.tar.gz dist/kadupul-offline.tar.gz.sha256 dist/kadupul-offline.tar.gz.sigstore.json dist/kadupul-offline.tar.gz.intoto.jsonl

  publish:
    name: Verify artifacts before publishing
    needs: [release, attach-offline-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - name: Verify signed archive and container provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir verification
          gh release download "$RELEASE_TAG" --dir verification \
            --pattern kadupul-offline.tar.gz \
            --pattern kadupul-offline.tar.gz.sha256 \
            --pattern kadupul-offline.tar.gz.sigstore.json \
            --pattern kadupul-offline.tar.gz.intoto.jsonl
          cd verification
          sha256sum --check kadupul-offline.tar.gz.sha256
          jq -c '.dsseEnvelope' kadupul-offline.tar.gz.sigstore.json > expected-provenance.jsonl
          cmp expected-provenance.jsonl kadupul-offline.tar.gz.intoto.jsonl
          gh attestation verify kadupul-offline.tar.gz --repo "$GH_REPO" \
            --bundle kadupul-offline.tar.gz.sigstore.json \
            --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
            --signer-workflow kadupulhq/kadupul/.github/workflows/release.yml
          gh attestation verify "oci://ghcr.io/${GH_REPO,,}:${RELEASE_TAG#v}" \
            --repo "$GH_REPO" \
            --source-digest "$GITHUB_SHA" \
            --signer-digest 917f4d4369474e947d29252a7597868927f3a38a \
            --signer-workflow kadupulhq/.github/.github/workflows/release.yml
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$RELEASE_TAG" --draft=false ;;
          esac
