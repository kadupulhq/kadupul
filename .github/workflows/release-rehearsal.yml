name: Release upgrade and rollback
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    permissions:
      contents: read
      packages: read
    name: Upgrade, RRD preservation and rollback
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: bash tests/tools/login_ghcr.sh
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: python@3.12.12
      - name: Validate failure evidence and cleanup isolation
        run: mise exec python@3.12.12 -- python tests/Support/Behavior/release_selftest.py
      - name: Fetch pinned baseline source
        run: git fetch --no-tags https://github.com/Cacti/cacti.git 6482af547c204199e829b7a0df0b7a13db3e0a58
      - name: Rehearse upgrade and restore the matching snapshot
        env:
          PHP_VERSION: '8.4'
        run: mise exec python@3.12.12 -- python tests/Support/Behavior/release_readiness.py
      - name: Preserve complete or failed observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: release-rehearsal
          path: tests/behavior/results/release-readiness/
          if-no-files-found: error
