name: Container mirrors

on:
  pull_request:
    paths:
      - tools/containers/**
      - tests/tools/test_container_mirrors.py
      - .github/workflows/container-mirrors.yml
  push:
    branches: [main, ci/authenticated-ghcr-mirrors]
    paths:
      - tools/containers/mirrors.json
      - tools/containers/mirror.py
      - .github/workflows/container-mirrors.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-mirrors
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == 'kadupulhq/kadupul'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: python@3.12.12
      - id: inventory
        name: Verify mirror admission and authentication contracts
        run: mise exec python@3.12.12 -- python tests/tools/test_container_mirrors.py
      - id: matrix
        run: echo "matrix=$(mise exec python@3.12.12 -- python tools/containers/mirror.py --matrix)" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name != 'pull_request'
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: python@3.12.12
      - name: Install OCI copy tool
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends skopeo
      - name: Publish and verify the pinned multi-platform manifest
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          MIRROR_DESTINATION: ${{ matrix.image.destination }}
        run: mise exec python@3.12.12 -- python tools/containers/mirror.py --destination "$MIRROR_DESTINATION" --report mirror-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirror-${{ strategy.job-index }}
          path: mirror-receipt.json
          if-no-files-found: error
          retention-days: 14
