name: Boost capacity diagnostics
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.6', '10.11', '11.8']
    services:
      db:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: cacti_boost_contract
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: php@8.1.34
      - name: Install test dependencies
        run: mise exec php@8.1.34 -- composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - name: Retain database handoff and exact deletion contracts
        working-directory: tests
        run: mise exec php@8.1.34 -- php vendor/bin/pest --configuration=phpunit-boost-mariadb.xml --colors=never
      - name: Measure million-row queries with identical selected samples
        run: mise exec php@8.1.34 -- php tests/benchmarks/poller_queue.php > queue.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: queue-${{ matrix.mariadb }}
          path: queue.json
  legacy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: php@8.1.34
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config libxml2-dev libpango1.0-dev libcairo2-dev libglib2.0-dev groff-base rrdtool
      - name: Build pinned RRDtool 1.4.9
        run: tests/benchmarks/build_rrd149.sh "$RUNNER_TEMP/rrd149"
      - name: Install test dependencies
        run: mise exec php@8.1.34 -- composer install --working-dir=tests --no-interaction --no-progress --prefer-dist
      - name: Verify modern retries and real legacy pending writes
        working-directory: tests
        env:
          RRDTOOL_TEST_BINARY: /usr/bin/rrdtool
          RRDTOOL_LEGACY_TEST_BINARY: ${{ runner.temp }}/rrd149/bin/rrdtool
        run: mise exec php@8.1.34 -- php vendor/bin/pest --configuration=phpunit-boost.xml --colors=never
