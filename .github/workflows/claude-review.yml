name: Pull request review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: kadupulhq/.github/.github/workflows/review.yml@7d491e4c5a03d9eaf107c128fa16a99a33711c3a
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      review_guidance: |
        Repository rules:
        - A pull request based on lts/1.2 must keep Cacti 1.2.31
          behaviour and must not add Symfony or any other framework
          dependency. lts/1.2 keeps upstream Cacti formatting.
        - PHP changed on main follows PER-CS 2.0.
      checkout_pr_head: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
