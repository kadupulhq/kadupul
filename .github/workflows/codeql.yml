name: CodeQL

# CodeQL has no PHP analyser, so it covers the JavaScript that ships with the
# interface and the workflows themselves. Semgrep carries PHP in security.yml.
#
# Code scanning needs the paid Code Security add-on on a private repository.
# Every job here is gated on the repository being public and starts running by
# itself once the visibility changes. Nothing to remember at that point.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:${{ matrix.language }}

  codeql-result:
    name: CodeQL result
    # Always reports: a required check reads a skipped job as passing.
    # Analysis skips only while the repository is private.
    if: ${{ !cancelled() }}
    needs:
      - analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ github.event.repository.private && 'analyze' || '' }}
        run: bash tests/tools/require_job_results.sh
