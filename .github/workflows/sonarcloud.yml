name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    # Fork and Dependabot pull requests get no secrets, so the scan cannot authenticate there.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Blame and new-code detection need the full history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: pcov
          tools: composer

      # composer install only warns when the lock is stale; validate exits
      # non-zero, so the run uses exactly the committed versions.
      - name: Install test dependencies
        working-directory: tests
        run: |
          set -euo pipefail
          composer validate --no-check-publish --check-lock
          composer install --no-progress --no-interaction

      # No continue-on-error. A failing test stops the job before the scan, so
      # Sonar never receives coverage from a partial run. The checks after the
      # run catch one that exits 0 before PHPUnit writes the report, and a
      # report that recorded nothing.
      #
      # PCOV guesses its root from the working directory and would instrument
      # only tests/, so point it at the checkout.
      - name: Unit tests with coverage
        working-directory: tests
        run: |
          set -euo pipefail
          php -d pcov.directory="$GITHUB_WORKSPACE" \
            -d pcov.exclude='~/(include/vendor|tests)/~' \
            vendor/bin/pest --configuration phpunit-coverage.xml
          test -s coverage.xml
          # PHP variables must remain literal until PHP parses the expression.
          # shellcheck disable=SC2016
          php -r '$m = simplexml_load_file("coverage.xml")->project->metrics; echo "Covered statements: {$m["coveredstatements"]} of {$m["statements"]}", PHP_EOL; exit((int) $m["coveredstatements"] > 0 ? 0 : 1);'

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
