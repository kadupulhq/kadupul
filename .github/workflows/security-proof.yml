name: Security Proof Guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repository to query for advisory source data (owner/name)"
        required: false
        default: "kadupulhq/kadupul"
      branch_list:
        description: "Space-separated branch list to evaluate"
        required: false
        default: "main"
      strict_gate:
        description: "Fail run when unresolved advisories remain"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: security-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sink-inventory-guard:
    name: sink and architectural hotspot guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Verify advisory matrix failure handling
        run: bash tests/security/test_private_advisory_matrix.sh

      - name: Verify generated dependency exclusions
        run: bash tests/security/test_sink_inventory_exclusions.sh

      - name: Verify tracked sink baseline
        run: tests/security/verify_sink_inventory.sh

      - name: Verify no new architectural hotspots
        run: tests/security/verify_architectural_hotspots.sh

  entry-point-inventory:
    name: entry-point gate inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The classifier reads each page with nikic/php-parser, a locked dev
      # dependency, so it needs the application's PHP and composer install.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      # Recorded before mise activates, so the php pin in .mise.toml cannot
      # put a different interpreter ahead of the one composer installed for.
      - name: Record the PHP interpreter
        run: echo "PHP=$(command -v php)" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python@3.12.12

      # Fails on any added, removed or reclassified entry point, and on any
      # entry point whose gate the generator cannot read from the code.
      - name: Verify entry-point gate inventory
        run: mise exec python@3.12.12 -- tests/security/verify_entry_point_inventory.sh

      - name: Check the inventory classifier fails closed
        run: mise exec python@3.12.12 -- python tests/security/test_entry_point_classifier.py

      - name: Verify Apache verdicts depend on the .htaccess rules
        run: mise exec python@3.12.12 -- python tests/security/test_entry_point_apache_denies.py

  branding-migration-guard:
    name: branding migration (utf8mb4 and latin1)
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: kadupul_branding_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: Verify migration and installer wiring
        env:
          KADUPUL_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=${{ job.services.database.ports['3306'] }};dbname=kadupul_branding_test;charset=utf8mb4
        run: php tests/security/verify_branding_migration.php

  advisory-proof-matrix:
    name: private advisory proof matrix
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build proof matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADVISORY_REPO: ${{ inputs.repo_name }}
          ADVISORY_BRANCHES: ${{ inputs.branch_list }}
        run: |
          set -euo pipefail
          out_dir="security/proof-run/${GITHUB_RUN_ID}"
          mkdir -p "${out_dir}"
          tests/security/build_private_advisory_matrix.sh \
            "${ADVISORY_REPO}" \
            "${ADVISORY_BRANCHES}" \
            "${out_dir}"
          tests/security/build_sink_inventory.sh > "${out_dir}/sink_inventory.current.tsv"
          tests/security/build_architectural_helper_report.sh --summary > "${out_dir}/architectural_helper.summary.tsv"
          tests/security/build_architectural_helper_report.sh --hotspots > "${out_dir}/architectural_helper.hotspots.tsv"

      - name: Enforce closure gate
        if: inputs.strict_gate == 'true'
        run: |
          set -euo pipefail
          tests/security/verify_private_advisory_matrix.sh "security/proof-run/${GITHUB_RUN_ID}/private_advisory_proof_matrix.tsv"

      - name: Upload proof artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: private-advisory-proof-${{ github.run_id }}
          path: security/proof-run/${{ github.run_id }}
          if-no-files-found: error
