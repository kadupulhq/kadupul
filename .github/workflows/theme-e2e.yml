name: Theme E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'chore/consolidate-main-*', 'migration/twig-*']
  merge_group:

permissions:
  contents: read

concurrency:
  group: theme-e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request can affect the jobs below; every other
  # event runs them.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test merge and both of its parents.
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: tests/tools/ci_change_scope.sh
          sparse-checkout-cone-mode: false
      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tests/tools/ci_change_scope.sh

  theme-e2e:
    needs: scope
    if: ${{ needs.scope.outputs.code == 'true' }}
    timeout-minutes: 45
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: ./.github/actions/setup-php # zizmor: ignore[self-repository]
        with:
          php-version: '8.4'
          extensions: gd, gmp, intl, ldap, mbstring, pcntl, pdo_mysql, posix, sockets, xml

      - name: Setup Node
        uses: ./.github/actions/setup-node # zizmor: ignore[self-repository]
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Build application browser dependencies
        run: npm ci --ignore-scripts && npm run build

      - name: Install E2E dependencies
        run: npm ci --ignore-scripts
        working-directory: tests/e2e

      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Install checksum-verified legacy browser dependencies
        run: php tools/dependencies/install-legacy.php

      - name: Run theme Playwright suite
        run: npm run test:themes -- --config=playwright.config.js
        working-directory: tests/e2e

      - name: Verify pinned browser library sources
        run: node tools/dependencies/sync.mjs --check

      - name: Run browser library compatibility suite
        run: node node_modules/@playwright/test/cli.js test --config=playwright.config.js vendor-assets.spec.js billboard.spec.js
        working-directory: tests/e2e

      - name: Cache Composer downloads
        uses: ./.github/actions/composer-cache # zizmor: ignore[self-repository]

      - name: Install PHP dependencies for asset compilation
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Compile browser assets
        run: php bin/console asset-map:compile

      - name: Load compiled stylesheets and fonts
        run: node node_modules/@playwright/test/cli.js test --config=playwright.config.js compiled-assets.spec.js
        working-directory: tests/e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: playwright-theme-artifacts
          path: |
            tests/e2e/test-results
            tests/e2e/playwright-report
          if-no-files-found: ignore

  theme-e2e-result:
    name: Theme E2E result
    # Always reports: a required check reads a skipped job as passing.
    if: ${{ !cancelled() }}
    needs:
      - scope
      - theme-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ needs.scope.result == 'success' && needs.scope.outputs.code == 'false' && 'theme-e2e' || '' }}
        run: bash tests/tools/require_job_results.sh
