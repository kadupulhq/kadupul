name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Rulesets change even when the code does not. Catch that weekly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tree is inherited from Cacti and does not start clean: a sample of
      # 400 of our own files returns 41 findings. A zero-findings gate on that
      # is a permanently red build, not a bar. So a pull request is measured
      # against its merge base and blocks only on what it introduces, while the
      # scheduled full scan reports everything without blocking.
      - name: Scan
        env:
          IMAGE: semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          configs=(--config p/php --config p/javascript --config p/typescript
                   --config p/security-audit --config p/secrets)
          # Project-specific taint rules, once the fork carries them.
          [ -f .semgrep.yml ] && configs+=(--config .semgrep.yml)
          [ -d tests/security/semgrep ] && configs+=(--config tests/security/semgrep)

          # A pull request blocks on new findings only. Everything else
          # reports the whole tree and does not block.
          gate=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            gate=(--baseline-commit "${BASE_SHA}" --error)
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${PWD}:/src" \
            --workdir /src \
            "$IMAGE" \
            semgrep scan "${configs[@]}" "${gate[@]}" \
              --metrics off \
              --timeout 0 --timeout-threshold 0 --max-target-bytes 0 \
              --sarif --output semgrep.sarif

      # Code scanning needs the paid Code Security add-on on a private
      # repository, so this only runs once the repository is public. The scan
      # above is the gate either way.
      - name: Upload to code scanning
        if: ${{ always() && !github.event.repository.private && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Keep the report when the scan fails
        if: ${{ failure() && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  dependencies:
    name: Dependency review
    # Needs the dependency graph, which is another Code Security feature on a
    # private repository. Turns itself on with the repository.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # A dependency that is not redistributable under GPL-3.0 cannot ship.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, Elastic-2.0
