name: Security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    # Rulesets change even when the code does not. Catch that weekly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: python@3.12.12
      - name: Install the pinned native scanner
        run: |
          scanner_environment="$RUNNER_TEMP/semgrep"
          expected_version=$(sed -nE 's/^semgrep==([^[:space:]]+).*$/\1/p' tests/tools/requirements-semgrep.txt)
          test -n "$expected_version"
          mise exec python@3.12.12 -- python -m venv "$scanner_environment"
          "$scanner_environment/bin/python" -m pip install --disable-pip-version-check --require-hashes -r tests/tools/requirements-semgrep.txt
          echo "$scanner_environment/bin" >> "$GITHUB_PATH"
          installed_version=$(PATH="$scanner_environment/bin:$PATH" "$scanner_environment/bin/semgrep" --version)
          test "$installed_version" = "$expected_version"

      # The tree is inherited from Cacti and does not start clean: a sample of
      # 400 of our own files returns 41 findings. A zero-findings gate on that
      # is a permanently red build, not a bar. So a pull request is measured
      # against its merge base and blocks only on what it introduces, while the
      # scheduled full scan reports everything without blocking.
      - name: Scan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          configs=(--config p/php --config p/javascript --config p/typescript
                   --config p/security-audit --config p/secrets)
          # Project-specific taint rules, once the fork carries them.
          [ -f .semgrep.yml ] && configs+=(--config .semgrep.yml)
          [ -d tests/security/semgrep ] && configs+=(--config tests/security/semgrep)

          # A pull request or merge group blocks on new findings only.
          # Everything else reports the whole tree and does not block.
          gate=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            gate=(--baseline-commit "${BASE_SHA}" --error)
          fi

          semgrep scan "${configs[@]}" "${gate[@]}" \
              --metrics off \
              --timeout 0 --timeout-threshold 0 --max-target-bytes 0 \
              --sarif --output semgrep.sarif

      # Semgrep honours nosemgrep, but it still writes those findings to the
      # SARIF with an inSource suppression, and code scanning lists them as open
      # alerts. Drop them so the upload reports only live findings.
      - name: Drop suppressed findings from the report
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        run: |
          set -euo pipefail
          jq '.runs |= map(.results |= map(select((.suppressions // []) | length == 0)))' semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif

      # Code scanning needs the paid Code Security add-on on a private
      # repository, so this only runs once the repository is public. The scan
      # above is the gate either way.
      - name: Upload to code scanning
        if: ${{ always() && !github.event.repository.private && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Keep the report when the scan fails
        if: ${{ failure() && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

  dependencies:
    timeout-minutes: 15
    name: Dependency review
    # Needs the dependency graph, which is another Code Security feature on a
    # private repository. Turns itself on with the repository.
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ${{ vars.DO_RUNNERS_ENABLED == 'true' && github.actor != 'dependabot[bot]' && (contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON('["self-hosted","Linux","X64","kadupul-do"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # A dependency that is not redistributable under GPL-3.0 cannot ship.
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0, BUSL-1.1, Elastic-2.0

  security-result:
    name: Security result
    # Always reports: a required check reads a skipped job as passing.
    # Dependency review runs only on pull requests in a public repository.
    if: ${{ !cancelled() }}
    needs:
      - semgrep
      - dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/tools/require_job_results.sh
          sparse-checkout-cone-mode: false
      - name: Require every gating job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ (github.event_name != 'pull_request' || github.event.repository.private) && 'dependencies' || '' }}
        run: bash tests/tools/require_job_results.sh
