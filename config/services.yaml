services:
    _defaults:
        autowire: true
        autoconfigure: true

    Kadupul\Platform\Infrastructure\:
        resource: '../src/Platform/Infrastructure/'
        # Built by InstallationConnectionMiddleware around each DBAL driver; a
        # container service of its own would have no driver to wrap.
        exclude: '../src/Platform/Infrastructure/Doctrine/InstallationConnectionDriver.php'

    # Public so a cli/ shim can reach it through the kernel container before running
    # a command, instead of passing the output mode as a hidden command option.
    Kadupul\Platform\Infrastructure\Symfony\Console\CliPresentation:
        public: true

    Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\Platform\Contract\LegacyConfiguration:
        alias: Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration

    Kadupul\Platform\Contract\DatabaseConnection:
        alias: Kadupul\Platform\Infrastructure\Legacy\InstallationDatabase

    Kadupul\Platform\Infrastructure\Legacy\InstallationVersion:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\Platform\Infrastructure\Legacy\LegacyOperatorLog:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\Platform\Application\Port\DatabaseMaintenance:
        alias: Kadupul\Platform\Infrastructure\Persistence\DbalDatabaseMaintenance
    Kadupul\Platform\Application\Port\TableConversion:
        alias: Kadupul\Platform\Infrastructure\Persistence\DbalTableConversion
    Kadupul\Platform\Infrastructure\Persistence\DbalTableConversion:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Kadupul\Platform\Application\Port\Clock:
        alias: Kadupul\Platform\Infrastructure\Symfony\SystemClock
    Kadupul\Platform\Application\Command\AnalyzeDatabase: ~
    Kadupul\Platform\Application\Command\MaintenanceTarget: ~
    Kadupul\Platform\Application\Command\SchemaChangeAudit: ~
    Kadupul\Platform\Application\Command\TableConversionStep: ~
    Kadupul\Platform\Application\Command\ConvertTables: ~
    # Public because lib/installer.php fetches it from the kernel container. It
    # converts with no operator, so no command or controller may depend on it.
    Kadupul\Platform\Infrastructure\Legacy\InstallerTableConversion:
        public: true

    Kadupul\IdentityAccess\Infrastructure\:
        resource: '../src/IdentityAccess/Infrastructure/'

    # One shared instance, so the operator AnalyzeDatabase selects is the one it
    # then checks. Command-line only: ConsoleAccess stays on the session adapter,
    # and CliConsoleAccess does not implement it, so no route can resolve it.
    Kadupul\IdentityAccess\Contract\ConsoleOperator:
        alias: Kadupul\IdentityAccess\Infrastructure\Cli\CliConsoleAccess

    # Session expiry/revocation must commit independently of application writes.
    # Rolling back a site edit must never restore a rejected credential.
    kadupul.session_database:
        class: Kadupul\Platform\Infrastructure\Legacy\InstallationDatabase

    Kadupul\IdentityAccess\Infrastructure\Legacy\ReadOnlyDatabaseSessionHandler:
        arguments:
            $database: '@kadupul.session_database'

    Kadupul\IdentityAccess\Application\Query\CurrentActor: ~

    Kadupul\IdentityAccess\Application\Port\AuthenticatedSession:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyAuthenticatedSession

    Kadupul\IdentityAccess\Contract\ConsoleAccess:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyAuthenticatedSession

    Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyAuditTrail:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\IdentityAccess\Contract\AuditTrail:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyAuditTrail

    Kadupul\Inventory\Infrastructure\:
        resource: '../src/Inventory/Infrastructure/'

    Kadupul\Inventory\Application\Query\ListDevices: ~

    Kadupul\Inventory\Application\Query\FindEditableDevice: ~
    Kadupul\Inventory\Application\Command\EditDevice: ~

    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceEditor:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\Inventory\Application\Port\DeviceEditor:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceEditor

    Kadupul\Inventory\Application\Port\DeviceCatalog:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceCatalog

    Kadupul\Inventory\Application\Query\ListDeviceSites: ~

    Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceSites:
        arguments:
            $database: '@doctrine.dbal.web_connection'
    Kadupul\Inventory\Application\Port\DeviceSites:
        alias: Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceSites

    Kadupul\Inventory\Application\Query\FindDeviceDetails: ~

    Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceDetailsReader:
        arguments:
            $database: '@doctrine.dbal.web_connection'
    Kadupul\Inventory\Application\Port\DeviceDetailsReader:
        alias: Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceDetailsReader

    Kadupul\Inventory\Application\Query\ListSites: ~

    Kadupul\Inventory\Infrastructure\Persistence\DoctrineSiteCatalog:
        arguments:
            $database: '@doctrine.dbal.web_connection'
    Kadupul\Inventory\Application\Port\SiteCatalog:
        alias: Kadupul\Inventory\Infrastructure\Persistence\DoctrineSiteCatalog

    Kadupul\Inventory\Application\Query\FindEditableSite: ~
    Kadupul\Inventory\Application\Command\EditSite: ~

    Kadupul\Inventory\Application\Port\SiteEditor:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacySiteEditor

    Kadupul\IdentityAccess\Contract\LocalePreference:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyLocalePreference

    Kadupul\Alerting\Application\Command\SendTestMail: ~
    Kadupul\Alerting\Infrastructure\Symfony\TestMailCommand: ~
    Kadupul\Alerting\Infrastructure\Mail\InstallationTestMailDelivery: ~

    Kadupul\Alerting\Application\Port\TestMailDelivery:
        alias: Kadupul\Alerting\Infrastructure\Mail\InstallationTestMailDelivery

    Kadupul\Alerting\Infrastructure\Mail\SmtpMessageSender: ~
    Kadupul\Alerting\Application\Command\NotifyAdministrator: ~
    Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorPreferences: ~
    Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorRecipients: ~
    Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministrativeMailDelivery: ~
    Kadupul\Alerting\Infrastructure\Legacy\AdministratorNotificationBridge:
        public: true

    Kadupul\Alerting\Application\Port\AdministratorNotificationPreferences:
        alias: Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorPreferences
    Kadupul\Alerting\Application\Port\AdministratorRecipients:
        alias: Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorRecipients
    Kadupul\Alerting\Application\Port\AdministrativeMailDelivery:
        alias: Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministrativeMailDelivery
    Kadupul\IdentityAccess\Contract\UserContacts:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyUserContacts

    Kadupul\IdentityAccess\Application\Command\CleanInvalidatedRowCache: ~
    Kadupul\IdentityAccess\Application\Port\InvalidatedRowCache:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\InstallationRowCache
    Kadupul\IdentityAccess\Infrastructure\Symfony\RowCacheSchedule:
        arguments:
            $enabled: '%env(default::KADUPUL_ROW_CACHE_SCHEDULER)%'
    Kadupul\IdentityAccess\Infrastructure\Symfony\RowCacheCleanupHandler:
        arguments:
            $enabled: '%env(default::KADUPUL_ROW_CACHE_SCHEDULER)%'

    # Cleanup fixes its session timezone; do not share that PDO with other modules.
    kadupul.row_cache_database:
        class: Kadupul\Platform\Infrastructure\Legacy\InstallationDatabase
    Kadupul\IdentityAccess\Infrastructure\Legacy\InstallationRowCache:
        arguments:
            $database: '@kadupul.row_cache_database'

    Kadupul\IdentityAccess\Application\Query\InspectInvalidatedRowCache: ~
    Kadupul\IdentityAccess\Infrastructure\Symfony\RowCacheState:
        arguments:
            $directory: '%kernel.project_dir%/var/scheduler'
    Kadupul\IdentityAccess\Infrastructure\Symfony\RowCacheCommand:
        arguments:
            $enabled: '%env(default::KADUPUL_ROW_CACHE_SCHEDULER)%'

    Kadupul\Inventory\Application\Command\CreateSite: ~
    Kadupul\Inventory\Application\Port\SiteCreator:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacySiteCreator

    Kadupul\Inventory\Application\Query\PrepareSiteAction: ~
    Kadupul\Inventory\Application\Command\DeleteSites: ~
    Kadupul\Inventory\Application\Command\DuplicateSites: ~
    Kadupul\Inventory\Application\Port\SiteLifecycle:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacySiteLifecycle
    Kadupul\Inventory\Application\Command\CreateDevice: ~
    Kadupul\Inventory\Application\Query\PrepareDeviceCreation: ~
    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceCreator:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Kadupul\Inventory\Application\Port\DeviceCreator:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceCreator
    Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceCreationCatalog:
        arguments:
            $database: '@doctrine.dbal.web_connection'
    Kadupul\Inventory\Application\Port\DeviceCreationCatalog:
        alias: Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceCreationCatalog

    Kadupul\Inventory\Application\Query\ListAssignableSites: ~

    # Device-visibility policies must be read on the connection that runs the
    # filtered query, so both come from the same read connection.
    Kadupul\Inventory\Infrastructure\Persistence\DoctrineDeviceVisibility:
        arguments:
            $database: '@doctrine.dbal.web_connection'

    Kadupul\Inventory\Infrastructure\Persistence\DoctrineSiteAssignmentCatalog:
        arguments:
            $database: '@doctrine.dbal.web_connection'

    Kadupul\Inventory\Application\Port\SiteAssignmentCatalog:
        alias: Kadupul\Inventory\Infrastructure\Persistence\DoctrineSiteAssignmentCatalog

    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceTemplateAssignments:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Kadupul\Inventory\Application\Port\DeviceTemplateAssignments:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceTemplateAssignments
    Kadupul\Inventory\Application\Command\AssignDeviceTemplate: ~
    Kadupul\Inventory\Application\Query\PrepareDeviceTemplateAssignment: ~

    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceCollectorAssignments:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Kadupul\Inventory\Application\Port\DeviceCollectorAssignments:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceCollectorAssignments
    Kadupul\Inventory\Application\Command\AssignDeviceCollector: ~
    Kadupul\Inventory\Application\Query\PrepareDeviceCollectorAssignment: ~

    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceRemovals:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Kadupul\Inventory\Application\Port\DeviceRemovals:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceRemovals
    Kadupul\Inventory\Application\Query\PrepareDeviceRemoval: ~
    Kadupul\Inventory\Application\Command\RemoveDevices: ~

    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceStates:
        arguments:
            $projectDir: '%kernel.project_dir%'
    Kadupul\Inventory\Application\Port\DeviceStates:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceStates
    Kadupul\Inventory\Application\Query\PrepareDeviceStateChange: ~
    Kadupul\Inventory\Application\Command\SetDevicesEnabled: ~

when@test:
    services:
        # A when@ block parses its own "services" key independently of the main
        # one above, so _defaults must be repeated here to get autowiring.
        _defaults:
            autowire: true
            autoconfigure: true

        # Proves a command sees the CliPresentation a shim sets through the kernel
        # container. Test-only: prod and dev never load this service.
        Kadupul\Tests\Fixtures\PresentationProbeCommand: ~
