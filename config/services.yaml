services:
    _defaults:
        autowire: true
        autoconfigure: true

    Kadupul\Platform\Infrastructure\:
        resource: '../src/Platform/Infrastructure/'

    Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\Platform\Contract\LegacyConfiguration:
        alias: Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration

    Kadupul\Platform\Contract\DatabaseConnection:
        alias: Kadupul\Platform\Infrastructure\Legacy\InstallationDatabase

    Kadupul\IdentityAccess\Infrastructure\:
        resource: '../src/IdentityAccess/Infrastructure/'

    # Session expiry/revocation must commit independently of application writes.
    # Rolling back a site edit must never restore a rejected credential.
    kadupul.session_database:
        class: Kadupul\Platform\Infrastructure\Legacy\InstallationDatabase

    Kadupul\IdentityAccess\Infrastructure\Legacy\ReadOnlyDatabaseSessionHandler:
        arguments:
            $database: '@kadupul.session_database'

    Kadupul\IdentityAccess\Application\Query\CurrentActor: ~

    Kadupul\IdentityAccess\Application\Port\AuthenticatedSession:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyAuthenticatedSession

    Kadupul\IdentityAccess\Contract\ConsoleAccess:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyAuthenticatedSession

    Kadupul\Inventory\Infrastructure\:
        resource: '../src/Inventory/Infrastructure/'

    Kadupul\Inventory\Application\Query\ListDevices: ~

    Kadupul\Inventory\Application\Query\FindEditableDevice: ~
    Kadupul\Inventory\Application\Command\EditDevice: ~

    Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceEditor:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Kadupul\Inventory\Application\Port\DeviceEditor:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceEditor

    Kadupul\Inventory\Application\Port\DeviceCatalog:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceCatalog

    Kadupul\Inventory\Application\Query\ListDeviceSites: ~

    Kadupul\Inventory\Application\Port\DeviceSites:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceSites

    Kadupul\Inventory\Application\Query\FindDeviceDetails: ~

    Kadupul\Inventory\Application\Port\DeviceDetailsReader:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacyDeviceDetailsReader

    Kadupul\Inventory\Application\Query\ListSites: ~

    Kadupul\Inventory\Application\Port\SiteCatalog:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacySiteCatalog

    Kadupul\Inventory\Application\Query\FindEditableSite: ~
    Kadupul\Inventory\Application\Command\EditSite: ~

    Kadupul\Inventory\Application\Port\SiteEditor:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacySiteEditor

    Kadupul\IdentityAccess\Contract\LocalePreference:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyLocalePreference

    Kadupul\Alerting\Application\Command\SendTestMail: ~
    Kadupul\Alerting\Infrastructure\Symfony\TestMailCommand: ~
    Kadupul\Alerting\Infrastructure\Mail\InstallationTestMailDelivery: ~

    Kadupul\Alerting\Application\Port\TestMailDelivery:
        alias: Kadupul\Alerting\Infrastructure\Mail\InstallationTestMailDelivery

    Kadupul\Alerting\Infrastructure\Mail\SmtpMessageSender: ~
    Kadupul\Alerting\Application\Command\NotifyAdministrator: ~
    Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorPreferences: ~
    Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorRecipients: ~
    Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministrativeMailDelivery: ~
    Kadupul\Alerting\Infrastructure\Legacy\AdministratorNotificationBridge:
        public: true

    Kadupul\Alerting\Application\Port\AdministratorNotificationPreferences:
        alias: Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorPreferences
    Kadupul\Alerting\Application\Port\AdministratorRecipients:
        alias: Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministratorRecipients
    Kadupul\Alerting\Application\Port\AdministrativeMailDelivery:
        alias: Kadupul\Alerting\Infrastructure\Legacy\LegacyAdministrativeMailDelivery
    Kadupul\IdentityAccess\Contract\UserContacts:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyUserContacts

    Kadupul\IdentityAccess\Application\Command\CleanInvalidatedRowCache: ~
    Kadupul\IdentityAccess\Application\Port\InvalidatedRowCache:
        alias: Kadupul\IdentityAccess\Infrastructure\Legacy\InstallationRowCache
    Kadupul\IdentityAccess\Infrastructure\Symfony\RowCacheSchedule:
        arguments:
            $stateDirectory: '%kernel.project_dir%/var/scheduler'
            $enabled: '%env(default::KADUPUL_ROW_CACHE_SCHEDULER)%'
    Kadupul\IdentityAccess\Infrastructure\Symfony\RowCacheCleanupHandler:
        arguments:
            $enabled: '%env(default::KADUPUL_ROW_CACHE_SCHEDULER)%'

    # Cleanup fixes its session timezone; do not share that PDO with other modules.
    kadupul.row_cache_database:
        class: Kadupul\Platform\Infrastructure\Legacy\InstallationDatabase
    Kadupul\IdentityAccess\Infrastructure\Legacy\InstallationRowCache:
        arguments:
            $database: '@kadupul.row_cache_database'

    Kadupul\Inventory\Application\Command\CreateSite: ~
    Kadupul\Inventory\Application\Port\SiteCreator:
        alias: Kadupul\Inventory\Infrastructure\Legacy\LegacySiteCreator
