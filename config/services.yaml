    # Model-driven monitoring (Telemetry, ModelRegistry, Monitoring, Graphing sink).
    # Bindings and writer ownership claims are durable (milestone 5, slice B).
    # The other in-memory services lose their state at the end of each request;
    # they are wired so the use cases resolve, not because persistence exists.
    Kadupul\Telemetry\Infrastructure\:
        resource: '../src/Telemetry/Infrastructure/'
    Kadupul\Telemetry\Application\Contract\Clock:
        alias: Kadupul\Telemetry\Infrastructure\Clock\SymfonyClock
    Kadupul\Graphing\Application\Port\Clock:
        alias: Kadupul\Graphing\Infrastructure\Clock\SymfonyClock
    # In-memory: the guard counts series within one request only.
    Kadupul\Telemetry\Domain\CardinalityGuard:
        arguments:
            $limitPerMetric: '%kadupul.telemetry.series_limit_per_metric%'
    Kadupul\Telemetry\Application\CounterNormalizer: ~

    Kadupul\ModelRegistry\Infrastructure\:
        resource: '../src/ModelRegistry/Infrastructure/'
    # In-memory repositories.
    Kadupul\ModelRegistry\Application\Port\ModelRepository:
        alias: Kadupul\ModelRegistry\Infrastructure\Persistence\InMemoryModelRepository
