    Kadupul\ModelRegistry\Application\Query\ResolveDependencies: ~

    Kadupul\Monitoring\Infrastructure\:
        resource: '../src/Monitoring/Infrastructure/'
    # Read-only legacy discovery over the web connection; SELECT statements only.
    Kadupul\Monitoring\Infrastructure\Legacy\LegacyDataSourceDiscovery:
        arguments:
            $database: '@doctrine.dbal.web_connection'
    Kadupul\Monitoring\Application\Port\ExistingMonitoring:
        alias: Kadupul\Monitoring\Infrastructure\Legacy\LegacyExistingMonitoring
    # Bindings and ownership claims are kept on the main connection: they are
    # central configuration, and the web connection may use read-only
    # credentials. An offline collector has no main connection and fails
    # instead of keeping a private copy.
    Kadupul\Monitoring\Infrastructure\Persistence\DbalBindingRepository:
        arguments:
            $database: '@doctrine.dbal.main_connection'
    Kadupul\Monitoring\Application\Port\BindingRepository:
        alias: Kadupul\Monitoring\Infrastructure\Persistence\DbalBindingRepository
    Kadupul\Monitoring\Infrastructure\Persistence\DbalWriterClaimStore:
        arguments:
            $database: '@doctrine.dbal.main_connection'
    # In-memory stores: plans, packs and capabilities.
    Kadupul\Monitoring\Application\Port\CollectionPlanStore:
        alias: Kadupul\Monitoring\Infrastructure\Persistence\InMemoryCollectionPlanStore
    Kadupul\Monitoring\Application\Port\DeviceCapabilityStore:
        alias: Kadupul\Monitoring\Infrastructure\Persistence\InMemoryDeviceCapabilityStore
    Kadupul\Monitoring\Application\Port\PackRepository:
        alias: Kadupul\Monitoring\Infrastructure\Persistence\InMemoryPackRepository
    Kadupul\Monitoring\Infrastructure\Persistence\WriterOwnershipRegistry:
        arguments:
            $legacy: '@Kadupul\Monitoring\Infrastructure\Legacy\LegacyDataSourceDiscovery'
            $claims: '@Kadupul\Monitoring\Infrastructure\Persistence\DbalWriterClaimStore'
    Kadupul\Monitoring\Application\Port\WriterOwnershipProbe:
        alias: Kadupul\Monitoring\Infrastructure\Persistence\WriterOwnershipRegistry
    Kadupul\Monitoring\Contract\BindingCatalog:
        alias: Kadupul\Monitoring\Application\ResolveBinding
    Kadupul\Monitoring\Application\ResolveBinding: ~
    Kadupul\Monitoring\Application\RegisterBinding: ~
    # No authorizer is wired, so approval and activation are denied.
    Kadupul\Monitoring\Application\ApproveBinding:
        arguments:
            $authorizer: null
    Kadupul\Monitoring\Domain\ActivationPolicy: ~
    Kadupul\Monitoring\Application\ActivateCollectionPlan:
        arguments:
            $authorizer: null
    # No protocol adapter exists, so discovery has no providers.
    Kadupul\Monitoring\Application\DiscoverDeviceCapabilities:
        arguments:
            $providers: []
    Kadupul\Monitoring\Application\MonitoringPlanner: ~

    # The RRD sink. Storage adapters come from RrdStorageFactory, which returns a
