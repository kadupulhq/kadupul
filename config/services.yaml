parameters:
    # Model-driven RRD writes. The gate is closed and no environment variable
    # feeds it. Binding approval and plan activation have no IdentityAccess
    # authorizer yet, so nothing can be approved and opening the gate would
    # have no effect; keep it false until an authorizer exists and this
    # comment is replaced by the decision that opens it.
    kadupul.monitoring.rrd_writes_enabled: false
    # Empty means unconfigured. The sink then refuses every storage call
    # instead of guessing a binary or a directory; nothing reads the legacy
    # path_rrdtool or path_rra settings.
    kadupul.monitoring.rrdtool_binary: ''
    kadupul.monitoring.rrd_root: ''
    # local_data_id => path below the root ending in .rrd. Nothing builds this
    # from the legacy tables yet, so an unmapped id is reported as a missing file.
    kadupul.monitoring.rrd_paths: {}
    # Provisional ceiling on distinct series per metric for the normalizer.
    kadupul.telemetry.series_limit_per_metric: 1000

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $projectDir: '%kernel.project_dir%'

    Kadupul\Platform\Infrastructure\:
        resource: '../src/Platform/Infrastructure/'
        # Built by InstallationConnectionMiddleware around each DBAL driver; a
        # container service of its own would have no driver to wrap.
        exclude:
            - '../src/Platform/Infrastructure/Doctrine/InstallationConnectionDriver.php'
            # Native schema services are built with the explicit primary PDO
            # connection at the legacy installer/CLI boundary.
            - '../src/Platform/Infrastructure/Legacy/CdefReferenceContract.php'
            - '../src/Platform/Infrastructure/Legacy/CdefReferenceReadiness.php'
            - '../src/Platform/Infrastructure/Legacy/CdefReferenceReadinessProcedure.php'
            - '../src/Platform/Infrastructure/Legacy/CdefReferenceTriggers.php'
            # Constructed with the exact selected native PDO at the caller boundary.
            - '../src/Platform/Infrastructure/Legacy/LegacyReferenceWriteTransaction.php'
            - '../src/Platform/Infrastructure/Symfony/ConsoleHomeResponse.php'

    # Public so a cli/ shim can reach it through the kernel container before running
    # a command, instead of passing the output mode as a hidden command option.
    Kadupul\Platform\Infrastructure\Symfony\Console\CliPresentation:
        public: true

    Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration: ~

    Kadupul\Platform\Contract\LegacyConfiguration:
        alias: Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration

    # Lazy, so a service that receives it reads config.php only when it uses
    # a value, as it did through LegacyConfiguration.
    Kadupul\Platform\Contract\PlatformConfiguration:
        lazy: true
        factory: ['@Kadupul\Platform\Infrastructure\Legacy\InstallationConfiguration', 'platform']

    Kadupul\Platform\Contract\ReferenceWriteTransactionRunner:
        alias: Kadupul\Platform\Infrastructure\Legacy\NativeReferenceWriteTransactionRunner

    Kadupul\Platform\Contract\DatabaseConnection:
