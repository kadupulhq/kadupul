"A useful name for this Rule.": "Užitečný název tohoto pravidla."
"Access denied.": "Přístup byl odepřen."
"Add Tree Rule": "Přidat pravidlo stromů"
"Back to Tree Rules": "Zpět na pravidla stromů"
"Cancel": "Zrušit"
"Check this box to enable this rule.": "Zaškrtnutím povolíte toto pravidlo."
"Choose a Tree for the new Tree Items.": "Vyberte strom pro nové položky stromu."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Vyberte záhlaví vybraného stromu, do kterého se má zařadit, nebo jeho kořen. Ujistěte se, že při provedení tohoto pravidla stále existuje."
"Choose a header of the selected Tree.": "Vyberte záhlaví vybraného stromu."
"Choose a listed Graph Grouping Style.": "Vyberte uvedený styl seskupování grafů."
"Choose a listed Leaf Item Type.": "Vyberte uvedený typ položky listu."
"Choose an existing Tree.": "Vyberte existující strom."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Vyberte, jak se grafy seskupují při vykreslení pro tohoto konkrétního hostitele ve stromu. Používá se pro listy zařízení."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Kliknutím na Pokračovat odstraníte následující pravidla stromů včetně jejich kritérií výběru objektů a vytváření stromu."
"Click Continue to disable the following Tree Rules.": "Kliknutím na Pokračovat zakážete následující pravidla stromů."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Kliknutím na Pokračovat zduplikujete následující pravidla stromů. Volitelně můžete změnit formát názvu nových pravidel stromů, která budou zpočátku zakázána."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Kliknutím na Pokračovat povolíte následující pravidla stromů. Ujistěte se, že byla úspěšně otestována."
"Continue": "Pokračovat"
"Data Query Index": "Index datového dotazu"
"Delete Tree Rules": "Odstranit pravidla stromů"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledek odstranění je nejistý. Před dalším pokusem zkontrolujte seznam pravidel stromů."
"Delete selected": "Odstranit vybrané"
"Device": "Zařízení"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Listy zařízení nemohou používat kritéria na sloupcích grafů ani šablon grafů. Při změně typu položky listu na Zařízení zaškrtněte toto políčko, aby se tato kritéria odebrala; nelze je obnovit."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Listy zařízení nemohou používat kritéria založená na grafech. Pro uložení potvrďte odebrání %count% kritérií."
"Disable Tree Rules": "Zakázat pravidla stromů"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledek zakázání je nejistý. Před dalším pokusem zkontrolujte seznam pravidel stromů."
"Disable selected": "Zakázat vybrané"
"Duplicate Tree Rules": "Duplikovat pravidla stromů"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledek duplikace je nejistý. Před dalším pokusem zkontrolujte seznam pravidel stromů."
"Duplicate selected": "Duplikovat vybrané"
