"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledek povolení je nejistý. Před dalším pokusem zkontrolujte seznam pravidel stromů."
"Enable selected": "Povolit vybrané"
"Enter a name.": "Zadejte název."
