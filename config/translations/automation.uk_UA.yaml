"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Унікальний рядок, який зіставлятиметься з рядком sysDescr пристроїв для прив'язки до цього шаблону автоматизації. Можна використовувати будь-який регулярний вираз Perl на додачу до будь-якого виразу SQL Where."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Унікальний рядок, який зіставлятиметься з рядком sysName пристроїв для прив'язки до цього шаблону автоматизації. Можна використовувати будь-який регулярний вираз Perl на додачу до будь-якого виразу SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Унікальний рядок, який зіставлятиметься з рядком sysOid пристроїв для прив'язки до цього шаблону автоматизації. Можна використовувати будь-який регулярний вираз Perl на додачу до будь-якого виразу SQL Where."
