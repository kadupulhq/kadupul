"Action": "Ενέργεια"
"Advanced options": "Προηγμένες επιλογές"
"Applying database upgrades": "Εφαρμογή αναβαθμίσεων βάσης δεδομένων"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Δημιουργήστε αντίγραφο ασφαλείας της βάσης δεδομένων, των αρχείων RRD, της διαμόρφωσης και των κλειδιών. Οι αναβαθμίσεις βάσης δεδομένων ενδέχεται να οριστικοποιήσουν αλλαγές που η επαναφορά εφαρμογής δεν μπορεί να αναιρέσει."
"Blocked": "Αποκλεισμένο"
"Check": "Ελεγχος"
"Check again": "Έλεγχος ξανά"
"Check collection freshness and collector connectivity before enabling discovery.": "Ελέγξτε την επικαιρότητα συλλογής και τη συνδεσιμότητα των συλλεκτών πριν ενεργοποιήσετε τον εντοπισμό."
"Check requirements": "Έλεγχος απαιτήσεων"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Οι έλεγχοι επιθεωρούν αυτήν τη διεργασία και τα δικαιώματα του συστήματος αρχείων. Δεν γράφουν δοκιμαστικά αρχεία ούτε επικοινωνούν με συσκευές."
"Collection profile": "Προφίλ συλλογής"
"Collector": "Συλλέκτης"
"Configure": "Διαμόρφωση"
"Configuring collection profiles": "Διαμόρφωση προφίλ συλλογής"
"Configuring discovery": "Διαμόρφωση εντοπισμού"
"Configuring the local device": "Διαμόρφωση της τοπικής συσκευής"
"Confirming database version": "Επιβεβαίωση έκδοσης βάσης δεδομένων"
"Converting selected tables": "Μετατροπή επιλεγμένων πινάκων"
"Database version": "Έκδοση βάσης δεδομένων"
"Disabled": "Απενεργοποιημένο"
"Discovery": "Εντοπισμός"
"Discovery SNMP settings": "Ρυθμίσεις SNMP εντοπισμού"
"Discovery range": "Εύρος εντοπισμού"
"Enable discovery after installation": "Ενεργοποίηση εντοπισμού μετά την εγκατάσταση"
"Executable paths": "Διαδρομές εκτελέσιμων"
"Execution status": "Κατάσταση εκτέλεσης"
"Finished execution": "Η εκτέλεση ολοκληρώθηκε"
"Finishing tasks only. Schema migrations will not be replayed.": "Μόνο εργασίες ολοκλήρωσης. Οι μετεγκαταστάσεις σχήματος δεν θα επαναληφθούν."
"I accept the license terms": "Αποδέχομαι τους όρους της άδειας χρήσης"
"I authorize discovery of the displayed range": "Εξουσιοδοτώ τον εντοπισμό του εμφανιζόμενου εύρους"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Έλεγξα το αρχείο καταγραφής και επιβεβαίωσα ότι ο προηγούμενος εργάτης και οι θυγατρικές του διεργασίες έχουν σταματήσει"
"I checked the previous attempt and accept that some changes may already be committed": "Έλεγξα την προηγούμενη προσπάθεια και αποδέχομαι ότι ορισμένες αλλαγές ενδέχεται να έχουν ήδη οριστικοποιηθεί"
"I reviewed this plan and have the required backups": "Εξέτασα αυτό το πλάνο και διαθέτω τα απαιτούμενα αντίγραφα ασφαλείας"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Εάν ένας εργάτης σταματήσει απροσδόκητα, διατηρήστε το log/cacti.log και επιβεβαιώστε ότι η διεργασία του έχει τερματιστεί πριν προσπαθήσετε ρητά ξανά. Μια κατάσταση αναμονής δεν επιβεβαιώνει επιτυχή εκκίνηση."
"Importing templates": "Εισαγωγή προτύπων"
"Install Kadupul": "Εγκατάσταση Kadupul"
"Installation and upgrade": "Εγκατάσταση και αναβάθμιση"
"Installation request was rejected.": "Το αίτημα εγκατάστασης απορρίφθηκε."
"Installation steps": "Βήματα εγκατάστασης"
"Installed": "Εγκατεστημένο"
"Keep a backup of the database, RRD files, configuration and secret material.": "Διατηρήστε αντίγραφο ασφαλείας της βάσης δεδομένων, των αρχείων RRD, της διαμόρφωσης και του μυστικού υλικού."
"Language": "Γλώσσα"
"Large tables may require the dedicated CLI conversion tool before installation.": "Οι μεγάλοι πίνακες ενδέχεται να απαιτούν το αποκλειστικό εργαλείο μετατροπής CLI πριν από την εγκατάσταση."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Αφήστε τα πεδία μυστικών κενά για να διατηρήσετε τα αποθηκευμένα διαπιστευτήρια. Τα μυστικά δεν εμφανίζονται ποτέ ξανά."
"License": "Άδεια Χρήσης"
"No action needed": "Δεν απαιτείται ενέργεια"
"Observed": "Παρατηρήθηκε"
"Open the console": "Άνοιγμα της κονσόλας"
"Operation": "Λειτουργία"
"Override discovery SNMP settings": "Παράκαμψη ρυθμίσεων SNMP εντοπισμού"
"Pass": "Επιτυχία"
"Poller interval in seconds": "Διάστημα Poller σε δευτερόλεπτα"
"Preparing CSRF protection": "Προετοιμασία προστασίας CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Η πρόοδος δείχνει την τελευταία καταγεγραμμένη φάση. Η ανανέωση αυτής της σελίδας δεν εκκινεί ούτε επαναλαμβάνει ποτέ έναν εργάτη."
"Recover stopped attempt": "Ανάκτηση σταματημένης προσπάθειας"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Η ανάκτηση διατηρεί τις αποθηκευμένες επιλογές και δεν τερματίζει ποτέ έναν ενεργό εργάτη. Ελέγξτε ξανά το πλάνο πριν προσπαθήσετε ξανά."
"Review": "Έλεγχος"
"Review installation plan": "Έλεγχος πλάνου εγκατάστασης"
"Run": "Εκτέλεση"
"Run reviewed plan": "Εκτέλεση ελεγμένου πλάνου"
"Save and review": "Αποθήκευση και έλεγχος"
"Scope": "Εμβέλεια"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Η κατάσταση δεν είναι διαθέσιμη. Η αποθηκευμένη εργασία διατηρείται. Ανανεώστε για επανασύνδεση· μην υποβάλετε άλλη εγκατάσταση."
"Synchronizing collectors": "Συγχρονισμός συλλεκτών"
"Table conversions": "Μετατροπές πινάκων"
"Templates": "Πρότυπα"
"The database version matches this application. Installation does not establish that polling is healthy.": "Η έκδοση της βάσης δεδομένων αντιστοιχεί σε αυτήν την εφαρμογή. Η εγκατάσταση δεν τεκμηριώνει ότι το polling λειτουργεί εύρυθμα."
"The request outcome is unknown. Check execution status before retrying.": "Η έκβαση του αιτήματος είναι άγνωστη. Ελέγξτε την κατάσταση εκτέλεσης πριν προσπαθήσετε ξανά."
"Theme": "Θέμα"
"Verify": "Επαλήθευση"
"Verify the poller schedule and service account.": "Επαληθεύστε το χρονοδιάγραμμα του poller και τον λογαριασμό υπηρεσίας."
"Version change": "Αλλαγή έκδοσης"
"Waiting for the installation worker": "Αναμονή για τον εργάτη εγκατάστασης"
"collector": "συλλέκτης"
"complete": "ολοκληρωμένο"
"failed": "απέτυχε"
"finish": "ολοκλήρωση"
"install": "εγκατάσταση"
"not_started": "not_started"
"partial": "μερικό"
"running": "σε εκτέλεση"
"succeeded": "πέτυχε"
"upgrade": "αναβάθμιση"
"waiting": "σε αναμονή"
"Accept the license before saving the installation plan.": "Αποδεχτείτε την άδεια χρήσης πριν αποθηκεύσετε το πλάνο εγκατάστασης."
"Invalid installation form.": "Μη έγκυρη φόρμα εγκατάστασης."
"Access denied.": "Άρνηση πρόσβασης."
"Confirm the recovery warning before retrying.": "Επιβεβαιώστε την προειδοποίηση ανάκαμψης πριν προσπαθήσετε ξανά."
"Review and confirm the current installation plan.": "Ελέγξτε και επιβεβαιώστε το τρέχον πλάνο εγκατάστασης."
"Confirm the discovery scope before starting.": "Επιβεβαιώστε το εύρος εντοπισμού πριν από την εκκίνηση."
"Resolve the blocking checks before starting.": "Επιλύστε τους ανασταλτικούς ελέγχους πριν ξεκινήσετε."
"Too many installer options.": "Πάρα πολλές επιλογές προγράμματος εγκατάστασης."
"Invalid installer option name.": "Μη έγκυρο όνομα επιλογής προγράμματος εγκατάστασης."
"Unknown or malformed installer option.": "Άγνωστη ή κακοσχηματισμένη επιλογή προγράμματος εγκατάστασης."
"Installer options must be scalar values.": "Οι επιλογές του προγράμματος εγκατάστασης πρέπει να είναι βαθμωτές τιμές."
"Installer option is too long or contains a null byte.": "Η επιλογή του προγράμματος εγκατάστασης είναι πολύ μεγάλη ή περιέχει null byte."
"Installer IDs and intervals must be whole numbers.": "Τα αναγνωριστικά και τα διαστήματα του προγράμματος εγκατάστασης πρέπει να είναι ακέραιοι αριθμοί."
"Installer ID or interval is outside its supported range.": "Το αναγνωριστικό ή το διάστημα του προγράμματος εγκατάστασης βρίσκεται εκτός του υποστηριζόμενου εύρους του."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Η εγκατάσταση δεν μπόρεσε να συνεχιστεί. Επαναφορτώστε την κατάστασή της και ελέγξτε τους ανασταλτικούς ελέγχους πριν προσπαθήσετε ξανά."
"Confirm that the previous worker has stopped before recovering its plan.": "Επιβεβαιώστε ότι ο προηγούμενος εργάτης έχει σταματήσει πριν από την ανάκτηση του πλάνου του."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Η βάση δεδομένων εγκαταστάθηκε, αλλά ορισμένοι συλλέκτες χρειάζονται ακόμα συγχρονισμό. Επαναλάβετε τις εργασίες ολοκλήρωσης αφού ελέγξετε την κατάστασή τους."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Η εγκατάσταση σταμάτησε. Διατηρήστε το αρχείο καταγραφής του προγράμματος εγκατάστασης, διορθώστε την αιτία και επιβεβαιώστε ρητά μια νέα προσπάθεια. Ορισμένες αλλαγές στη βάση δεδομένων ενδέχεται να έχουν ήδη οριστικοποιηθεί. Ελέγξτε την εκκαθάριση προσθέτων πριν εξουσιοδοτήσετε νέα προσπάθεια."
"Next action": "Επόμενη ενέργεια"
"Follow the execution status. Do not start another attempt while a worker is active.": "Παρακολουθήστε την κατάσταση εκτέλεσης. Μην ξεκινήσετε άλλη προσπάθεια ενώ ένας εργάτης είναι ενεργός."
"Complete the recovery checklist before retrying.": "Ολοκληρώστε τη λίστα ελέγχου ανάκαμψης πριν προσπαθήσετε ξανά."
"Verify collection and graph operation before enabling discovery.": "Επαληθεύστε τη λειτουργία συλλογής και γραφημάτων πριν ενεργοποιήσετε τον εντοπισμό."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Επιλύστε τις αποκλεισμένες απαιτήσεις και έπειτα ελέγξτε ξανά. Οι αποθηκευμένες επιλογές διατηρούνται."
"Review the planned changes and backup checklist before authorizing execution.": "Ελέγξτε τις προγραμματισμένες αλλαγές και τη λίστα ελέγχου αντιγράφων ασφαλείας πριν εξουσιοδοτήσετε την εκτέλεση."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Επιλέξτε ένα προφίλ συλλογής και αποδεχτείτε την άδεια χρήσης. Οι προαιρετικές ρυθμίσεις μπορούν να ανοίξουν όταν χρειάζεται."
"Download installation diagnostics": "Λήψη διαγνωστικών εγκατάστασης"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Ανοίξτε ένα γράφημα και επιβεβαιώστε ότι τα δεδομένα RRD του ενημερώνονται μετά από έναν κύκλο poller."
"Requirement details": "Λεπτομέρειες απαίτησης"
"Recover": "Ανάκτηση"
"Recovery checklist": "Λίστα ελέγχου ανάκαμψης"
"Preserve log/cacti.log and record the failed attempt.": "Διατηρήστε το log/cacti.log και καταγράψτε την αποτυχημένη προσπάθεια."
"Confirm that the previous worker and its child processes have stopped.": "Επιβεβαιώστε ότι ο προηγούμενος εργάτης και οι θυγατρικές του διεργασίες έχουν σταματήσει."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Επιθεωρήστε τις οριστικοποιημένες αλλαγές, τον συγχρονισμό συλλεκτών και την εκκαθάριση προσθέτων. Διορθώστε την αιτία πριν προσπαθήσετε ξανά."
"Review the saved plan again, then explicitly authorize a retry.": "Ελέγξτε ξανά το αποθηκευμένο πλάνο και έπειτα εξουσιοδοτήστε ρητά μια νέα προσπάθεια."
"Recover a stopped worker": "Ανάκτηση σταματημένου εργάτη"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Χρησιμοποιήστε την ανάκτηση μόνο αφού επιβεβαιώσετε ότι αυτή η προσπάθεια δεν εκτελείται πλέον. Η ανάκτηση δεν σταματά μια διεργασία."
"Collector and installation mode": "Συλλέκτης και λειτουργία εγκατάστασης"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Η διαμόρφωση ανάπτυξης καθορίζει τον ρόλο συλλέκτη και τις συνδέσεις βάσης δεδομένων. Επαληθεύστε τη διαμόρφωση του κύριου διακομιστή πριν ξεκινήσετε έναν συλλέκτη."
"Discovery and SNMP settings": "Ρυθμίσεις εντοπισμού και SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Διατηρήστε τον εντοπισμό απενεργοποιημένο έως ότου επαληθευτεί η συλλογή και η συνδεσιμότητα των συλλεκτών."
"Template selection": "Επιλογή προτύπου"
"Templates selected for import": "Πρότυπα επιλεγμένα για εισαγωγή"
"No templates selected.": "Δεν επιλέχθηκαν πρότυπα."
"Backup checklist": "Λίστα ελέγχου αντιγράφων ασφαλείας"
"Database backup and a tested restoration procedure.": "Αντίγραφο ασφαλείας βάσης δεδομένων και δοκιμασμένη διαδικασία επαναφοράς."
"RRD files and the service account permissions needed to restore them.": "Αρχεία RRD και τα δικαιώματα λογαριασμού υπηρεσίας που απαιτούνται για την επαναφορά τους."
"Configuration, keys and plugin data outside the database.": "Διαμόρφωση, κλειδιά και δεδομένα προσθέτων εκτός της βάσης δεδομένων."
"Post-installation checks": "Έλεγχοι μετά την εγκατάσταση"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Οι επαληθευμένοι έλεγχοι καλύπτουν μόνο τα εμφανιζόμενα αποδεικτικά στοιχεία. Οι μη αξιολογημένοι έλεγχοι εξακολουθούν να απαιτούν επαλήθευση από χειριστή."
"Operational checks still require operator verification.": "Οι λειτουργικοί έλεγχοι εξακολουθούν να απαιτούν επαλήθευση από χειριστή."
"Status": "Κατάσταση"
"verified": "επαληθευμένο"
"action_required": "action_required"
"not_assessed": "not_assessed"
"Database schema": "Σχήμα βάσης δεδομένων"
"Stored schema matches the application target.": "Το αποθηκευμένο σχήμα αντιστοιχεί στον προορισμό της εφαρμογής."
"Target schema completion has not been confirmed.": "Η ολοκλήρωση του σχήματος προορισμού δεν έχει επιβεβαιωθεί."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Ελέγξτε την έκβαση εγκατάστασης και επιλύστε τις αποτυχίες πριν θεωρήσετε την αναβάθμιση σχήματος ολοκληρωμένη."
"Installation outcome": "Έκβαση εγκατάστασης"
"A successful receipt matches the current target schema.": "Μια επιτυχής απόδειξη αντιστοιχεί στο τρέχον σχήμα προορισμού."
"A complete successful installation outcome has not been confirmed.": "Δεν έχει επιβεβαιωθεί πλήρης επιτυχής έκβαση εγκατάστασης."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Διατηρήστε το αρχείο καταγραφής του προγράμματος εγκατάστασης και χρησιμοποιήστε τη ρητή διαδικασία ανάκαμψης ή επανάληψης όταν απαιτείται."
"Collector synchronization": "Συγχρονισμός συλλεκτών"
"The completed installer reports pending collector synchronization.": "Το ολοκληρωμένο πρόγραμμα εγκατάστασης αναφέρει εκκρεμή συγχρονισμό συλλεκτών."
"The completed installer reports no pending collectors.": "Το ολοκληρωμένο πρόγραμμα εγκατάστασης δεν αναφέρει εκκρεμείς συλλέκτες."
"Collector completion remains unconfirmed by this partial receipt.": "Η ολοκλήρωση του συλλέκτη παραμένει ανεπιβεβαίωτη από αυτήν τη μερική απόδειξη."
"Collector completion is not established by this installation outcome.": "Η ολοκλήρωση του συλλέκτη δεν τεκμηριώνεται από αυτήν την έκβαση εγκατάστασης."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Ελέγξτε την κατάσταση συλλέκτη και επαναλάβετε τις εργασίες ολοκλήρωσης για μερικές εκβάσεις. Αυτό δεν επαληθεύει τη μεταγενέστερη επικαιρότητα συλλογής."
"Scheduled collection": "Προγραμματισμένη συλλογή"
"No poller or device was contacted by this assessment.": "Κανένας poller ή συσκευή δεν ερωτήθηκε από αυτήν την αξιολόγηση."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Επιβεβαιώστε ότι ο διαμορφωμένος χρονοπρογραμματιστής εκτελεί τον poller με τον προβλεπόμενο λογαριασμό υπηρεσίας και ελέγξτε τον επόμενο κανονικό κύκλο του."
"Graph data": "Δεδομένα γραφήματος"
"Live samples and RRD updates were not exercised.": "Τα ζωντανά δείγματα και οι ενημερώσεις RRD δεν δοκιμάστηκαν."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Μετά από έναν κανονικό κύκλο συλλογής, επιβεβαιώστε ότι τα αναμενόμενα γραφήματα λαμβάνουν νέα δείγματα και ελέγξτε τυχόν σφάλματα του poller."
"Recovery readiness": "Ετοιμότητα ανάκαμψης"
"Backup restoration was not exercised.": "Η επαναφορά αντιγράφου ασφαλείας δεν δοκιμάστηκε."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Επαληθεύστε μια απομονωμένη επαναφορά της βάσης δεδομένων, των αρχείων RRD, της διαμόρφωσης και του υλικού κλειδιών πριν βασιστείτε στην ανάκαμψη."
"No persisted local poller start has been recorded.": "Δεν έχει καταγραφεί διατηρημένη εκκίνηση τοπικού poller."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Ο διατηρημένος χρονισμός poller δεν είναι έγκυρος και δεν μπορεί να τεκμηριώσει την εύρυθμη λειτουργία του χρονοπρογραμματιστή."
"The recorded poller start is in the future. Check clock synchronization.": "Η καταγεγραμμένη εκκίνηση poller βρίσκεται στο μέλλον. Ελέγξτε τον συγχρονισμό ρολογιού."
"The recorded poller start is older than the native scheduling tolerance.": "Η καταγεγραμμένη εκκίνηση poller είναι παλαιότερη από την εγγενή ανοχή χρονοπρογραμματισμού."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Καταγράφηκε εκκίνηση τοπικού poller εντός της εγγενούς ανοχής χρονοπρογραμματισμού. Η ολοκλήρωση και η εύρυθμη λειτουργία της συσκευής δεν έχουν επαληθευτεί."
"readable": "αναγνώσιμο"
"missing or unreadable": "λείπει ή δεν είναι αναγνώσιμος"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Επαναφέρετε την πλήρη έκδοση και τις κλειδωμένες εξαρτήσεις της· εκχωρήστε στον λογαριασμό υπηρεσίας δικαιώματα ανάγνωσης."
"PHP temporary directory": "Προσωρινός κατάλογος PHP"
"directory writable by this process": "κατάλογος εγγράψιμος από αυτήν τη διεργασία"
"missing or not writable": "λείπει ή δεν είναι εγγράψιμος"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Διαμορφώστε το sys_temp_dir ως υπάρχοντα κατάλογο εγγράψιμο από τον λογαριασμό εγκατάστασης. Οι εγγενείς εισαγωγές χρησιμοποιούν προσωρινά αρχεία."
"Background worker launch": "Εκκίνηση εργάτη παρασκηνίου"
"required PHP functions available; launch not exercised": "οι απαιτούμενες συναρτήσεις PHP είναι διαθέσιμες· η εκκίνηση δεν δοκιμάστηκε"
"required PHP launch function disabled": "η απαιτούμενη συνάρτηση εκκίνησης PHP είναι απενεργοποιημένη"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Ενεργοποιήστε το exec για το περιβάλλον εκτέλεσης PHP ιστού ή χρησιμοποιήστε το εξουσιοδοτημένο πρόγραμμα εγκατάστασης CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Ενεργοποιήστε τα popen, pclose για το περιβάλλον εκτέλεσης PHP ιστού ή χρησιμοποιήστε το εξουσιοδοτημένο πρόγραμμα εγκατάστασης CLI."
"Database transaction ownership": "Ιδιοκτησία συναλλαγής βάσης δεδομένων"
"autocommit enabled; no caller-owned transaction": "το autocommit είναι ενεργοποιημένο· καμία συναλλαγή που ανήκει στον καλούντα"
"autocommit disabled or caller transaction active": "το autocommit είναι απενεργοποιημένο ή υπάρχει ενεργή συναλλαγή καλούντος"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Εκτελέστε την εγκατάσταση εκτός συναλλαγής που ανήκει στον καλούντα και ενεργοποιήστε το autocommit στη σύνδεση μεταβολής της."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Επαναφέρετε τον κατάλογο έκδοσης και εκχωρήστε στον λογαριασμό εγκατάστασης δικαιώματα εγγραφής για εισαγωγές πόρων προτύπων. Μην τον κάνετε εγγράψιμο από όλους."
"Worker file: install/background.php": "Αρχείο εργάτη: install/background.php"
"Worker file: bin/legacy-installer.php": "Αρχείο εργάτη: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Αρχείο εργάτη: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Προορισμός εισαγωγής: resource/snmp_queries"
"Import destination: resource/script_server": "Προορισμός εισαγωγής: resource/script_server"
"Import destination: resource/script_queries": "Προορισμός εισαγωγής: resource/script_queries"
"Import destination: scripts": "Προορισμός εισαγωγής: scripts"
"Database privileges": "Δικαιώματα βάσης δεδομένων"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Τα πραγματικά δικαιώματα μετεγκατάστασης, συμπεριλαμβανομένων των ενεργών ρόλων και των εκχωρήσεων ανά αντικείμενο, δεν επαληθεύτηκαν."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Ζητήστε από τον διαχειριστή της βάσης δεδομένων να επαληθεύσει τις απαιτούμενες εγγραφές πινάκων, τις αλλαγές σχήματος, τα triggers και τις ρουτίνες για τον λογαριασμό εγκατάστασης και το σχήμα. Μην εκχωρείτε καθολικά δικαιώματα διαχειριστή."
"Compare web and worker runtimes": "Σύγκριση περιβαλλόντων εκτέλεσης ιστού και εργάτη"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Αυτό ξεκινά ρητά έναν σύντομο έλεγχο PHP μόνο για ανάγνωση. Δεν δεσμεύει πρόγραμμα εγκατάστασης, δεν γράφει αρχεία και δεν επικοινωνεί με συσκευές."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Ο έλεγχος κληρονομεί αυτήν τη διεργασία ιστού και χρησιμοποιεί τον διαμορφωμένο διερμηνέα PHP του προγράμματος εγκατάστασης. Δεν επιθεωρεί ξεχωριστό χρονοπρογραμματιστή ή υπηρεσία."
"I authorize the read-only worker runtime comparison.": "Εξουσιοδοτώ τη σύγκριση μόνο για ανάγνωση του περιβάλλοντος εκτέλεσης εργάτη."
"Compare runtimes": "Σύγκριση περιβαλλόντων εκτέλεσης"
"Runtime comparison results": "Αποτελέσματα σύγκρισης περιβαλλόντων εκτέλεσης"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Οι διαφορές δικαιωμάτων και ταυτότητας ενδέχεται να είναι σκόπιμες. Οι παρατηρήσεις μόνο για ανάγνωση δεν αποδεικνύουν ότι οι εγγραφές ή η εγκατάσταση θα επιτύχουν."
"Confirm the read-only worker runtime comparison.": "Επιβεβαιώστε τη σύγκριση μόνο για ανάγνωση του περιβάλλοντος εκτέλεσης εργάτη."
"The runtime comparison is unavailable.": "Η σύγκριση περιβαλλόντων εκτέλεσης δεν είναι διαθέσιμη."
"Shared application secret": "Κοινόχρηστο μυστικό εφαρμογής"
"A strong web application secret is required before comparison.": "Απαιτείται ένα ισχυρό μυστικό εφαρμογής ιστού πριν από τη σύγκριση."
"Runtime comparison": "Σύγκριση περιβαλλόντων εκτέλεσης"
"The configured worker runtime did not confirm a bounded comparison.": "Το διαμορφωμένο περιβάλλον εκτέλεσης εργάτη δεν επιβεβαίωσε μια φραγμένη σύγκριση."
"The inherited worker secret could not be confirmed against the web secret.": "Το κληρονομημένο μυστικό εργάτη δεν μπόρεσε να επιβεβαιωθεί έναντι του μυστικού ιστού."
"PHP runtime comparison": "Σύγκριση περιβάλλοντος εκτέλεσης PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Και τα δύο περιβάλλοντα εκτέλεσης πρέπει να υποστηρίζουν PHP 8.4· διαφορετικές εκδόσεις ενημερώσεων απαιτούν έλεγχο."
"Required extension comparison": "Σύγκριση απαιτούμενων επεκτάσεων"
"Required extension availability is checked; differing versions require review.": "Ελέγχεται η διαθεσιμότητα των απαιτούμενων επεκτάσεων· διαφορετικές εκδόσεις απαιτούν έλεγχο."
"Process identity comparison": "Σύγκριση ταυτότητας διεργασίας"
"Effective process identity is unavailable on this platform.": "Η πραγματική ταυτότητα διεργασίας δεν είναι διαθέσιμη σε αυτήν την πλατφόρμα."
"Effective process identities match.": "Οι πραγματικές ταυτότητες διεργασιών ταιριάζουν."
"Effective process identities differ; separate service accounts may be intentional.": "Οι πραγματικές ταυτότητες διεργασιών διαφέρουν· οι ξεχωριστοί λογαριασμοί υπηρεσίας ενδέχεται να είναι σκόπιμοι."
"Directory access comparison": "Σύγκριση πρόσβασης καταλόγου"
"Read-only directory permission observations match.": "Οι παρατηρήσεις δικαιωμάτων καταλόγου μόνο για ανάγνωση ταιριάζουν."
"Directory locations or permission observations differ; review the service-account roles.": "Οι τοποθεσίες καταλόγων ή οι παρατηρήσεις δικαιωμάτων διαφέρουν· ελέγξτε τους ρόλους του λογαριασμού υπηρεσίας."
"Worker directory read and traversal": "Ανάγνωση και διάσχιση καταλόγου εργάτη"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Οι απαιτούμενοι κατάλογοι εργάτη πρέπει να υπάρχουν και να επιτρέπουν την ανάγνωση και τη διάσχιση. Δεν δοκιμάστηκαν εγγραφές."
"The inherited worker secret matches the web secret for this private challenge.": "Το κληρονομημένο μυστικό εργάτη αντιστοιχεί στο μυστικό ιστού για αυτήν την ιδιωτική πρόκληση."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Ελέγξτε τον διαμορφωμένο διερμηνέα PHP, τις απαιτούμενες επεκτάσεις, το κληρονομημένο μυστικό και τα δικαιώματα καταλόγου του λογαριασμού υπηρεσίας. Δεν δοκιμάστηκαν εγγραφές ή εκκίνηση του προγράμματος εγκατάστασης."
"advisory": "συμβουλευτικό"
