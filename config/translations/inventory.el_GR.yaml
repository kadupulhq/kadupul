"Remove graphs and data sources": "Αφαίρεση γραφημάτων και πηγών δεδομένων"
"Select a removal policy.": "Επιλέξτε μια πολιτική αφαίρεσης."
"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "Οι επιλεγμένες συσκευές ή τα γραφήματα και οι πηγές δεδομένων τους άλλαξαν. Επαναφορτώστε την επιβεβαίωση πριν αφαιρέσετε συσκευές."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "Οι κοινόχρηστες πηγές δεδομένων ή τα συγκεντρωτικά γραφήματα πρέπει να αποσυνδεθούν πριν από την αφαίρεση γραφημάτων και πηγών δεδομένων."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "Η έκβαση της αφαίρεσης συσκευής είναι αβέβαιη. Ελέγξτε τις επιλεγμένες συσκευές, τα γραφήματα και τις πηγές δεδομένων πριν προσπαθήσετε ξανά."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "Η αφαίρεση συσκευής δεν μπορεί να αναιρεθεί από εδώ. Επιλέξτε αν θα διατηρηθούν τα γραφήματα και οι απενεργοποιημένες πηγές δεδομένων ή αν θα αφαιρεθούν."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "Οι κοινόχρηστες πηγές δεδομένων και τα συγκεντρωτικά γραφήματα πρέπει να αποσυνδεθούν πριν από την αφαίρεση γραφημάτων. Τα διατηρούμενα γραφήματα και οι πηγές δεδομένων γίνονται μη εκχωρημένα."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "Οι επηρεαζόμενοι απομακρυσμένοι συλλέκτες πρέπει να είναι σε σύνδεση. Μια αποτυχημένη αφαίρεση ενδέχεται να αφήσει απομακρυσμένες αλλαγές ή αλλαγές προσθέτων· ελέγξτε το αποτέλεσμα πριν προσπαθήσετε ξανά."
"RRD file cleanup follows the configured maintenance policy.": "Η εκκαθάριση αρχείων RRD ακολουθεί τη διαμορφωμένη πολιτική συντήρησης."
"%graphs% graphs, %sources% data sources": "%graphs% γραφήματα, %sources% πηγές δεδομένων"
"Device template updated.": "Το πρότυπο συσκευής ενημερώθηκε."
"Clear device statistics": "Εκκαθάριση στατιστικών συσκευής"
"Confirm clearing statistics": "Επιβεβαίωση εκκαθάρισης στατιστικών"
"Selected device statistics cleared.": "Τα στατιστικά των επιλεγμένων συσκευών εκκαθαρίστηκαν."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Επαναφορά χρόνων απόκρισης, πλήθους poll και διαθεσιμότητας για αυτές τις συσκευές. Τα γραφήματα, τα ιστορικά δεδομένα και οι ρυθμίσεις συσκευών διατηρούνται. Τα στατιστικά συνεχίζονται με το επόμενο poll."
"Synchronize device templates": "Συγχρονισμός προτύπων συσκευών"
"Confirm synchronization": "Επιβεβαίωση συγχρονισμού"
"Selected device templates synchronized.": "Τα πρότυπα των επιλεγμένων συσκευών συγχρονίστηκαν."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Εφαρμογή των τρεχόντων εκχωρημένων προτύπων σε αυτές τις συσκευές. Προστίθενται οι ελλείπουσες συσχετίσεις γραφημάτων και ερωτημάτων δεδομένων, ενώ οι αχρησιμοποίητες συσχετίσεις προτύπων γραφημάτων ενδέχεται να αφαιρεθούν. Οι συσκευές χωρίς πρότυπα παραλείπονται. Τα υπάρχοντα γραφήματα και τα ιστορικά δεδομένα διατηρούνται· η αυτοματοποίηση ενδέχεται να δημιουργήσει νέα γραφήματα."
"Change device options": "Αλλαγή επιλογών συσκευής"
"Confirm option changes": "Επιβεβαίωση αλλαγών επιλογών"
"Selected device options updated.": "Οι επιλογές των επιλεγμένων συσκευών ενημερώθηκαν."
"Device options": "Επιλογές συσκευής"
"Select at least one supported device option.": "Επιλέξτε τουλάχιστον μία υποστηριζόμενη επιλογή συσκευής."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Αλλάζουν μόνο οι επιλεγμένες επιλογές. Οι μη επιλεγμένες επιλογές διατηρούν τις τρέχουσες τιμές τους. Η επιλογή κενής θέσης την εκκαθαρίζει."
"Update %option%": "Ενημέρωση %option%"
"Assignment target": "Προορισμός εκχώρησης"
"Select an assignment target": "Επιλέξτε έναν προορισμό εκχώρησης"
"Select a valid assignment target.": "Επιλέξτε έναν έγκυρο προορισμό εκχώρησης."
"Invalid assignment kind.": "Μη έγκυρο είδος εκχώρησης."
"Assign device sites": "Εκχώρηση τοποθεσιών συσκευών"
"Assign device templates": "Εκχώρηση προτύπων συσκευών"
"Assign device collectors": "Εκχώρηση συλλεκτών συσκευών"
"Confirm assignments": "Επιβεβαίωση εκχωρήσεων"
"Selected device assignments updated.": "Οι εκχωρήσεις των επιλεγμένων συσκευών ενημερώθηκαν."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Η επιλεγμένη εκχώρηση εφαρμόζεται σε κάθε καταχωρισμένη συσκευή. Οι αλλαγές προτύπων διατηρούν τα υπάρχοντα γραφήματα· η αυτοματοποίηση ενδέχεται να δημιουργήσει νέα γραφήματα. Οι αλλαγές συλλεκτών μεταφέρουν την ιδιοκτησία polling."
"Change device SNMP settings": "Αλλαγή ρυθμίσεων SNMP συσκευής"
"Confirm SNMP changes": "Επιβεβαίωση αλλαγών SNMP"
"Selected device SNMP settings updated.": "Οι ρυθμίσεις SNMP των επιλεγμένων συσκευών ενημερώθηκαν."
"Device graph-template associations": "Συσχετίσεις προτύπων γραφημάτων συσκευής"
"Device associations updated.": "Οι συσχετίσεις συσκευών ενημερώθηκαν."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Η αφαίρεση μιας συσχέτισης διατηρεί τα υπάρχοντα γραφήματα και τα ιστορικά δεδομένα. Η προσθήκη μιας συσχέτισης ενδέχεται να δημιουργήσει γραφήματα μέσω αυτοματοποίησης. Οι επηρεαζόμενοι συλλέκτες πρέπει να είναι σε σύνδεση."
