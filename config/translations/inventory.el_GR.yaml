"Device automation rules applied.": "Οι κανόνες αυτοματοποίησης συσκευών εφαρμόστηκαν."
"Apply existing graph and tree automation rules to the selected devices. Rules may create graphs, data sources and tree entries.": "Εφαρμογή των υπαρχόντων κανόνων αυτοματοποίησης γραφημάτων και δέντρων στις επιλεγμένες συσκευές. Οι κανόνες ενδέχεται να δημιουργήσουν γραφήματα, πηγές δεδομένων και καταχωρίσεις δέντρου."
"Only checked SNMP settings are changed. Unchecked settings and credentials retain their current values.": "Αλλάζουν μόνο οι επιλεγμένες ρυθμίσεις SNMP. Οι μη επιλεγμένες ρυθμίσεις και τα διαπιστευτήρια διατηρούν τις τρέχουσες τιμές τους."
"Select at least one supported SNMP setting.": "Επιλέξτε τουλάχιστον μία υποστηριζόμενη ρύθμιση SNMP."
