"Converting selected tables": "Konvertuojamos pasirinktos lentelės"
"Database version": "Duomenų bazės versija"
"Disabled": "Išjungta"
"Discovery": "Aptikimas"
"Discovery SNMP settings": "Aptikimo SNMP nustatymai"
"Discovery range": "Aptikimo diapazonas"
"Enable discovery after installation": "Įjungti aptikimą po įdiegimo"
"Executable paths": "Vykdomųjų failų keliai"
"Execution status": "Vykdymo būsena"
"Finished execution": "Vykdymas baigtas"
"Finishing tasks only. Schema migrations will not be replayed.": "Tik baigiamosios užduotys. Schemos migracijos nebus kartojamos."
"I accept the license terms": "Sutinku su licencijos sąlygomis"
"I authorize discovery of the displayed range": "Leidžiu aptikti rodomą diapazoną"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Patikrinau žurnalą ir patvirtinu, kad ankstesnis vykdytojas ir jo dukteriniai procesai sustojo"
"I checked the previous attempt and accept that some changes may already be committed": "Patikrinau ankstesnį bandymą ir sutinku, kad kai kurie pakeitimai jau gali būti įrašyti"
"I reviewed this plan and have the required backups": "Peržiūrėjau šį planą ir turiu reikiamas atsargines kopijas"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Jei vykdytojas netikėtai sustoja, išsaugokite log/cacti.log ir prieš aiškiai kartodami įsitikinkite, kad jo procesas baigėsi. Laukimo būsena nepatvirtina sėkmingo paleidimo."
"Importing templates": "Importuojami šablonai"
"Install Kadupul": "Įdiegti „Kadupul“"
"Installation and upgrade": "Diegimas ir atnaujinimas"
"Installation request was rejected.": "Diegimo užklausa atmesta."
"Installation steps": "Diegimo žingsniai"
"Installed": "Įdiegta"
"Keep a backup of the database, RRD files, configuration and secret material.": "Saugokite atsarginę duomenų bazės, RRD failų, konfigūracijos ir slaptos medžiagos kopiją."
"Language": "Kalba"
"Large tables may require the dedicated CLI conversion tool before installation.": "Dideles lenteles prieš diegimą gali reikėti konvertuoti specialiu CLI konvertavimo įrankiu."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Palikite slaptų laukų tuščius, kad išlaikytumėte saugomus prisijungimo duomenis. Paslaptys niekada nerodomos iš naujo."
"License": "Licencija"
"No action needed": "Veiksmų nereikia"
"Observed": "Pastebėta"
"Open the console": "Atidaryti konsolę"
"Operation": "Operacija"
"Override discovery SNMP settings": "Perrašyti aptikimo SNMP nustatymus"
"Pass": "Išlaikyta"
"Poller interval in seconds": "Apklausų intervalas sekundėmis"
"Preparing CSRF protection": "Ruošiama CSRF apsauga"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Eiga rodo paskutinį užfiksuotą etapą. Atnaujinus šį puslapį vykdytojas niekada nepaleidžiamas ir nekartojamas."
"Recover stopped attempt": "Atkurti sustojusį bandymą"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Atkūrimas išlaiko išsaugotus pasirinkimus ir niekada nenutraukia veikiančio vykdytojo. Prieš kartodami dar kartą peržiūrėkite planą."
"Review": "Peržiūra"
"Review installation plan": "Peržiūrėti diegimo planą"
"Run": "Vykdyti"
"Run reviewed plan": "Vykdyti peržiūrėtą planą"
"Save and review": "Išsaugoti ir peržiūrėti"
"Scope": "Apimtis"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Būsena nepasiekiama. Atliktas darbas išsaugotas. Atnaujinkite, kad vėl prisijungtumėte; nepateikite kito diegimo."
"Synchronizing collectors": "Sinchronizuojami rinkikliai"
"Table conversions": "Lentelių konvertavimai"
"Templates": "Šablonai"
"The database version matches this application. Installation does not establish that polling is healthy.": "Duomenų bazės versija atitinka šią programą. Diegimas nepatvirtina, kad apklausa veikia tinkamai."
"The request outcome is unknown. Check execution status before retrying.": "Užklausos rezultatas nežinomas. Prieš kartodami patikrinkite vykdymo būseną."
"Theme": "Tema"
"Verify": "Patikrinti"
"Verify the poller schedule and service account.": "Patikrinkite apklausų tvarkaraštį ir paslaugos paskyrą."
"Version change": "Versijos pakeitimas"
"Waiting for the installation worker": "Laukiama diegimo vykdytojo"
"collector": "rinkiklis"
"complete": "užbaigta"
"failed": "nepavyko"
"finish": "baigti"
"install": "diegti"
"not_started": "nepradėta"
"partial": "dalinė"
"running": "vykdoma"
"succeeded": "sėkminga"
"upgrade": "atnaujinti"
"waiting": "laukiama"
"Accept the license before saving the installation plan.": "Prieš įrašydami diegimo planą sutikite su licencija."
"Invalid installation form.": "Netinkama diegimo forma."
"Access denied.": "Prieiga uždrausta."
"Confirm the recovery warning before retrying.": "Prieš kartodami patvirtinkite atkūrimo įspėjimą."
"Review and confirm the current installation plan.": "Peržiūrėkite ir patvirtinkite dabartinį diegimo planą."
"Confirm the discovery scope before starting.": "Prieš pradėdami patvirtinkite aptikimo apimtį."
"Resolve the blocking checks before starting.": "Prieš pradėdami išspręskite blokuojančias patikras."
"Too many installer options.": "Per daug diegimo parinkčių."
"Invalid installer option name.": "Netinkamas diegimo parinkties pavadinimas."
"Unknown or malformed installer option.": "Nežinoma arba netinkamai suformuota diegimo parinktis."
"Installer options must be scalar values.": "Diegimo parinktys turi būti skaliarinės reikšmės."
"Installer option is too long or contains a null byte.": "Diegimo parinktis per ilga arba joje yra nulinis baitas."
"Installer IDs and intervals must be whole numbers.": "Diegimo ID ir intervalai turi būti sveikieji skaičiai."
"Installer ID or interval is outside its supported range.": "Diegimo ID arba intervalas yra už palaikomo diapazono ribų."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Diegimo tęsti nepavyko. Prieš kartodami iš naujo įkelkite jo būseną ir peržiūrėkite blokuojančias patikras."
"Confirm that the previous worker has stopped before recovering its plan.": "Prieš atkurdami planą patvirtinkite, kad ankstesnis vykdytojas sustojo."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Duomenų bazė įdiegta, tačiau kai kuriuos rinkiklius vis dar reikia sinchronizuoti. Patikrinę jų būseną, pakartokite baigiamąsias užduotis."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Diegimas sustojo. Išsaugokite diegimo žurnalą, pašalinkite priežastį ir aiškiai patvirtinkite pakartojimą. Kai kurie duomenų bazės pakeitimai jau gali būti įrašyti. Prieš įgaliodami pakartojimą patikrinkite papildinių išvalymą."
"Next action": "Kitas veiksmas"
"Follow the execution status. Do not start another attempt while a worker is active.": "Sekite vykdymo būseną. Nepradėkite kito bandymo, kol vykdytojas aktyvus."
"Complete the recovery checklist before retrying.": "Prieš kartodami užpildykite atkūrimo kontrolinį sąrašą."
"Verify collection and graph operation before enabling discovery.": "Prieš įjungdami aptikimą patikrinkite rinkimo ir grafikų veikimą."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Išspręskite užblokuotus reikalavimus ir tikrinkite dar kartą. Išsaugoti pasirinkimai išlaikomi."
"Review the planned changes and backup checklist before authorizing execution.": "Prieš įgaliodami vykdymą peržiūrėkite planuojamus pakeitimus ir atsarginių kopijų kontrolinį sąrašą."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Pasirinkite rinkimo profilį ir sutikite su licencija. Pasirinktinius nustatymus galima atidaryti prireikus."
"Download installation diagnostics": "Atsisiųsti diegimo diagnostiką"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Atidarykite grafiką ir patikrinkite, ar jo RRD duomenys atnaujinami po apklausos ciklo."
"Requirement details": "Reikalavimų informacija"
"Recover": "Atkurti"
"Recovery checklist": "Atkūrimo kontrolinis sąrašas"
"Preserve log/cacti.log and record the failed attempt.": "Išsaugokite log/cacti.log ir užfiksuokite nepavykusį bandymą."
"Confirm that the previous worker and its child processes have stopped.": "Patvirtinkite, kad ankstesnis vykdytojas ir jo dukteriniai procesai sustojo."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Patikrinkite įrašytus pakeitimus, rinkiklių sinchronizavimą ir papildinių išvalymą. Prieš kartodami pašalinkite priežastį."
"Review the saved plan again, then explicitly authorize a retry.": "Dar kartą peržiūrėkite išsaugotą planą, tada aiškiai įgaliokite pakartojimą."
"Recover a stopped worker": "Atkurti sustojusį vykdytoją"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Atkūrimą naudokite tik įsitikinę, kad šis bandymas nebevykdomas. Atkūrimas nesustabdo proceso."
"Collector and installation mode": "Rinkiklio ir diegimo režimas"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Diegimo konfigūracija nustato rinkiklio vaidmenį ir duomenų bazių ryšius. Prieš paleisdami rinkiklį patikrinkite pagrindinio serverio konfigūraciją."
"Discovery and SNMP settings": "Aptikimo ir SNMP nustatymai"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Laikykite aptikimą išjungtą, kol bus patikrintas rinkimas ir rinkiklių ryšys."
"Template selection": "Šablonų pasirinkimas"
"Templates selected for import": "Importuoti pasirinkti šablonai"
"No templates selected.": "Šablonų nepasirinkta."
"Backup checklist": "Atsarginių kopijų kontrolinis sąrašas"
"Database backup and a tested restoration procedure.": "Duomenų bazės atsarginė kopija ir išbandyta atkūrimo procedūra."
"RRD files and the service account permissions needed to restore them.": "RRD failai ir jiems atkurti reikalingi paslaugos paskyros leidimai."
"Configuration, keys and plugin data outside the database.": "Konfigūracija, raktai ir papildinių duomenys už duomenų bazės ribų."
"Post-installation checks": "Patikros po diegimo"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Patikrintos patikros apima tik rodomus įrodymus. Neįvertintas patikras vis tiek turi patikrinti operatorius."
"Operational checks still require operator verification.": "Operacines patikras vis tiek turi patikrinti operatorius."
"Status": "Būsena"
"verified": "Patikrinta"
"action_required": "Reikia veiksmų"
"not_assessed": "Neįvertinta"
"Database schema": "Duomenų bazės schema"
"Stored schema matches the application target.": "Saugoma schema atitinka programos tikslinę schemą."
"Target schema completion has not been confirmed.": "Tikslinės schemos užbaigimas nepatvirtintas."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Peržiūrėkite diegimo rezultatą ir prieš laikydami schemos atnaujinimą užbaigtu, išspręskite nesėkmes."
"Installation outcome": "Diegimo rezultatas"
"A successful receipt matches the current target schema.": "Sėkmingas kvitas atitinka dabartinę tikslinę schemą."
"A complete successful installation outcome has not been confirmed.": "Pilnas sėkmingas diegimo rezultatas nepatvirtintas."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Išsaugokite diegimo žurnalą ir prireikus naudokite aiškią atkūrimo ar kartojimo procedūrą."
"Collector synchronization": "Rinkiklių sinchronizavimas"
"The completed installer reports pending collector synchronization.": "Užbaigtas diegimas praneša apie laukiantį rinkiklių sinchronizavimą."
"The completed installer reports no pending collectors.": "Užbaigtas diegimas praneša, kad laukiančių rinkiklių nėra."
"Collector completion remains unconfirmed by this partial receipt.": "Šis dalinis kvitas nepatvirtina rinkiklių užbaigimo."
"Collector completion is not established by this installation outcome.": "Šis diegimo rezultatas nenustato rinkiklių užbaigimo."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Dalinių rezultatų atveju peržiūrėkite rinkiklių būseną ir kartokite baigiamąsias užduotis. Tai nepatikrina vėlesnio rinkimo šviežumo."
"Scheduled collection": "Suplanuotas rinkimas"
"No poller or device was contacted by this assessment.": "Šio vertinimo metu nesusisiekta nei su apklausikliu, nei su įrenginiu."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Patvirtinkite, kad sukonfigūruotas planuoklis paleidžia apklausiklį numatyta paslaugos paskyra, ir peržiūrėkite kitą įprastą ciklą."
"Graph data": "Grafikų duomenys"
"Live samples and RRD updates were not exercised.": "Gyvi mėginiai ir RRD atnaujinimai nebuvo išbandyti."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Po įprasto rinkimo ciklo patikrinkite, ar tikėtini grafikai gauna šviežių mėginių, ir peržiūrėkite apklausiklio klaidas."
"Recovery readiness": "Atkūrimo parengtis"
"Backup restoration was not exercised.": "Atsarginės kopijos atkūrimas neišbandytas."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Prieš pasikliaudami atkūrimu, patikrinkite izoliuotą duomenų bazės, RRD failų, konfigūracijos ir raktų medžiagos atkūrimą."
"No persisted local poller start has been recorded.": "Išsaugoto vietinio apklausiklio paleidimo neužfiksuota."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Išsaugotas apklausiklio laikas netinkamas ir negali patvirtinti planuoklio būklės."
"The recorded poller start is in the future. Check clock synchronization.": "Užfiksuotas apklausiklio paleidimas yra ateityje. Patikrinkite laiko sinchronizavimą."
"The recorded poller start is older than the native scheduling tolerance.": "Užfiksuotas apklausiklio paleidimas senesnis už natyviąją planavimo toleranciją."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Vietinio apklausiklio paleidimas užfiksuotas per natyviąją planavimo toleranciją. Užbaigimas ir įrenginių būklė nepatikrinti."
"readable": "skaitoma"
"missing or unreadable": "trūksta arba neskaitoma"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Atkurkite visą leidimą ir jo užrakintas priklausomybes; suteikite paslaugos paskyrai skaitymo prieigą."
"PHP temporary directory": "PHP laikinasis katalogas"
"directory writable by this process": "katalogas, į kurį šis procesas gali rašyti"
"missing or not writable": "trūksta arba nerašomas"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Sukonfigūruokite sys_temp_dir kaip esamą katalogą, į kurį gali rašyti diegimo paskyra. Natyvieji importai naudoja laikinus failus."
"Background worker launch": "Fono vykdytojo paleidimas"
"required PHP functions available; launch not exercised": "reikalingos PHP funkcijos pasiekiamos; paleidimas neišbandytas"
"required PHP launch function disabled": "reikalinga PHP paleidimo funkcija išjungta"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Įjunkite exec žiniatinklio PHP aplinkoje arba naudokite įgaliotą CLI diegiklį."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Įjunkite popen, pclose žiniatinklio PHP aplinkoje arba naudokite įgaliotą CLI diegiklį."
"Database transaction ownership": "Duomenų bazės transakcijos nuosavybė"
"autocommit enabled; no caller-owned transaction": "automatinis patvirtinimas (autocommit) įjungtas; nėra iškvietėjui priklausančios transakcijos"
"autocommit disabled or caller transaction active": "automatinis patvirtinimas išjungtas arba aktyvi iškvietėjo transakcija"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Vykdykite diegimą už iškvietėjui priklausančios transakcijos ribų ir įjunkite automatinį patvirtinimą jo mutacijų ryšyje."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Atkurkite leidimo katalogą ir suteikite diegimo paskyrai rašymo prieigą šablonų išteklių importui. Nepadarykite jo visiems rašomo."
"Worker file: install/background.php": "Vykdytojo failas: install/background.php"
"Worker file: bin/legacy-installer.php": "Vykdytojo failas: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Vykdytojo failas: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importo paskirtis: resource/snmp_queries"
"Import destination: resource/script_server": "Importo paskirtis: resource/script_server"
"Import destination: resource/script_queries": "Importo paskirtis: resource/script_queries"
"Import destination: scripts": "Importo paskirtis: scripts"
"Database privileges": "Duomenų bazės privilegijos"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Faktinės migracijos privilegijos, įskaitant aktyvias roles ir konkretiems objektams skirtus leidimus, nebuvo patikrintos."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Paprašykite duomenų bazės administratoriaus patikrinti diegimo paskyrai ir schemai reikalingus lentelių rašymus, schemos pakeitimus, trigerius ir rutinas. Nesuteikite visuotinių administratoriaus privilegijų."
"Compare web and worker runtimes": "Palyginti žiniatinklio ir vykdytojo aplinkas"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tai aiškiai paleidžia trumpą tik skaitomą PHP zondą. Jis nerezervuoja diegiklio, nerašo failų ir nesusisiekia su įrenginiais."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Zondas paveldi šį žiniatinklio procesą ir naudoja sukonfigūruotą diegimo PHP interpretatorių. Jis netikrina atskiro planuoklio ar paslaugos."
"I authorize the read-only worker runtime comparison.": "Leidžiu tik skaitomą vykdytojo aplinkos palyginimą."
"Compare runtimes": "Palyginti aplinkas"
"Runtime comparison results": "Aplinkų palyginimo rezultatai"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Leidimų ir tapatybių skirtumai gali būti tyčiniai. Tik skaitomi stebėjimai nepatvirtina, kad rašymas ar diegimas pavyks."
"Confirm the read-only worker runtime comparison.": "Patvirtinkite tik skaitomą vykdytojo aplinkos palyginimą."
"The runtime comparison is unavailable.": "Aplinkų palyginimas nepasiekiamas."
"Shared application secret": "Bendra programos paslaptis"
"A strong web application secret is required before comparison.": "Prieš palyginimą reikalinga stipri žiniatinklio programos paslaptis."
"Runtime comparison": "Aplinkų palyginimas"
"The configured worker runtime did not confirm a bounded comparison.": "Sukonfigūruota vykdytojo aplinka nepatvirtino apribotos trukmės palyginimo."
"The inherited worker secret could not be confirmed against the web secret.": "Paveldėtos vykdytojo paslapties nepavyko patvirtinti pagal žiniatinklio paslaptį."
"PHP runtime comparison": "PHP aplinkų palyginimas"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Abi aplinkos turi palaikyti PHP 8.4; skirtingos pataisų versijos reikalauja peržiūros."
"Required extension comparison": "Reikalingų plėtinių palyginimas"
"Required extension availability is checked; differing versions require review.": "Tikrinamas reikalingų plėtinių prieinamumas; skirtingos versijos reikalauja peržiūros."
"Process identity comparison": "Proceso tapatybės palyginimas"
"Effective process identity is unavailable on this platform.": "Faktinė proceso tapatybė šioje platformoje nepasiekiama."
"Effective process identities match.": "Faktinės proceso tapatybės sutampa."
"Effective process identities differ; separate service accounts may be intentional.": "Faktinės proceso tapatybės skiriasi; atskiros paslaugų paskyros gali būti tyčinės."
"Directory access comparison": "Katalogų prieigos palyginimas"
"Read-only directory permission observations match.": "Tik skaitomi katalogų leidimų stebėjimai sutampa."
"Directory locations or permission observations differ; review the service-account roles.": "Katalogų vietos arba leidimų stebėjimai skiriasi; peržiūrėkite paslaugų paskyrų roles."
"Worker directory read and traversal": "Vykdytojo katalogų skaitymas ir peržengimas"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Reikalingi vykdytojo katalogai turi egzistuoti ir leisti skaityti bei peržengti. Rašymas nebuvo tikrinamas."
"The inherited worker secret matches the web secret for this private challenge.": "Paveldėta vykdytojo paslaptis sutampa su žiniatinklio paslaptimi šiam privačiam iššūkiui."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Peržiūrėkite sukonfigūruotą PHP interpretatorių, reikalingus plėtinius, paveldėtą paslaptį ir paslaugų paskyrų katalogų leidimus. Rašymas ir diegiklio paleidimas nebuvo išbandyti."
"advisory": "patariamasis"
