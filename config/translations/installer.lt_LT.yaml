"Advanced options": "Išplėstinės parinktys"
"Applying database upgrades": "Taikomi duomenų bazės atnaujinimai"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Sukurkite atsargines duomenų bazės, RRD failų, konfigūracijos ir raktų kopijas. Duomenų bazės atnaujinimai gali įrašyti pakeitimų, kurių programos atšaukimas neatšauktų."
"Blocked": "Užblokuota"
"Check": "Tikrinti"
"Check again": "Tikrinti dar kartą"
"Check collection freshness and collector connectivity before enabling discovery.": "Prieš įjungdami aptikimą, patikrinkite rinkimo šviežumą ir rinkiklių ryšį."
"Check requirements": "Tikrinti reikalavimus"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Patikros tikrina šį procesą ir failų sistemos leidimus. Jos nerašo bandomųjų failų ir nesusisiekia su įrenginiais."
