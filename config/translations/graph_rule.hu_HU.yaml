"Select up to %count% rows at a time.": "Egyszerre legfeljebb %count% sort jelölhet ki."
"The graph rule changed since you opened this form. Reload before saving.": "A grafikonszabály megváltozott az űrlap megnyitása óta. Mentés előtt töltse újra az oldalt."
