"A useful name for this Rule.": "A szabály hasznos neve."
"Access denied.": "A hozzáférés megtagadva."
"Add Graph Rule": "Grafikonszabály hozzáadása"
"Back to Graph Rules": "Vissza a grafikonszabályokhoz"
"Cancel": "Mégse"
"Check this box to enable this rule.": "Jelölje be a négyzetet a szabály engedélyezéséhez."
"Choose a Data Query to apply to this rule.": "Válassza ki a szabályra alkalmazandó adatlekérdezést."
"Choose a Graph Type": "Grafikontípus kiválasztása"
"Choose a Graph Type of the selected Data Query.": "Válassza ki a kijelölt adatlekérdezés egyik grafikontípusát."
"Choose an existing Data Query.": "Válasszon egy meglévő adatlekérdezést."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Válassza ki a kijelölt adatlekérdezés bármelyik elérhető grafikontípusát, amelyet a szabályra alkalmazni kíván."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kattintson a Folytatás gombra a következő grafikonszabályok eszközkijelölési és grafikonlétrehozási feltételeikkel együtt történő törléséhez."
"Click Continue to disable the following Graph Rules.": "Kattintson a Folytatás gombra a következő grafikonszabályok letiltásához."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kattintson a Folytatás gombra a következő grafikonszabályok megkettőzéséhez. Tetszés szerint módosíthatja az új grafikonszabályok címformátumát; ezek letiltott állapotban jönnek létre."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kattintson a Folytatás gombra a következő grafikonszabályok engedélyezéséhez. Győződjön meg róla, hogy sikeresen tesztelték őket."
