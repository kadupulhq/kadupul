"Accept the license before saving the installation plan.": "Před uložením plánu instalace přijměte licenci."
"Invalid installation form.": "Neplatný formulář instalace."
"Access denied.": "Přístup byl odepřen."
"Confirm the recovery warning before retrying.": "Před opakováním potvrďte upozornění k obnovení."
"Review and confirm the current installation plan.": "Zkontrolujte a potvrďte aktuální plán instalace."
"Confirm the discovery scope before starting.": "Před zahájením potvrďte rozsah zjišťování."
"Resolve the blocking checks before starting.": "Před zahájením vyřešte blokující kontroly."
"Too many installer options.": "Příliš mnoho voleb instalátoru."
"Invalid installer option name.": "Neplatný název volby instalátoru."
"Unknown or malformed installer option.": "Neznámá nebo chybně utvořená volba instalátoru."
"Installer options must be scalar values.": "Volby instalátoru musí být skalární hodnoty."
"Installer option is too long or contains a null byte.": "Volba instalátoru je příliš dlouhá nebo obsahuje nulový bajt."
"Installer IDs and intervals must be whole numbers.": "ID a intervaly instalátoru musí být celá čísla."
"Installer ID or interval is outside its supported range.": "ID nebo interval instalátoru je mimo podporovaný rozsah."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Instalaci nebylo možné provést. Před dalším pokusem znovu načtěte její stav a zkontrolujte blokující kontroly."
"Confirm that the previous worker has stopped before recovering its plan.": "Před obnovením jeho plánu potvrďte, že předchozí úloha byla zastavena."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Databáze je nainstalována, ale některé sběrače stále vyžadují synchronizaci. Po kontrole jejich stavu zopakujte dokončovací úlohy."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Instalace se zastavila. Zachovejte protokol instalátoru, odstraňte příčinu a výslovně potvrďte opakování. Některé změny databáze mohly být již potvrzeny. Před povolením opakování zkontrolujte vyčištění pluginů."
"Next action": "Další akce"
"Follow the execution status. Do not start another attempt while a worker is active.": "Řiďte se stavem provádění. Dokud je úloha aktivní, nespouštějte další pokus."
"Complete the recovery checklist before retrying.": "Před opakováním dokončete kontrolní seznam obnovení."
"Verify collection and graph operation before enabling discovery.": "Před povolením zjišťování ověřte sběr dat a provoz grafů."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Vyřešte blokované požadavky a poté zkontrolujte znovu. Uložené volby jsou zachovány."
"Review the planned changes and backup checklist before authorizing execution.": "Před povolením provedení zkontrolujte plánované změny a kontrolní seznam záloh."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Vyberte profil sběru a přijměte licenci. Volitelná nastavení lze otevřít podle potřeby."
"Download installation diagnostics": "Stáhnout diagnostiku instalace"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Otevřete graf a ověřte, že se jeho data RRD po cyklu pollerů aktualizují."
"Requirement details": "Podrobnosti požadavku"
"Recover": "Obnovit"
"Recovery checklist": "Kontrolní seznam obnovení"
"Preserve log/cacti.log and record the failed attempt.": "Zachovejte log/cacti.log a zaznamenejte neúspěšný pokus."
"Confirm that the previous worker and its child processes have stopped.": "Potvrďte, že předchozí úloha a její podřízené procesy byly zastaveny."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Zkontrolujte potvrzené změny, synchronizaci sběračů a vyčištění pluginů. Před opakováním odstraňte příčinu."
"Review the saved plan again, then explicitly authorize a retry.": "Znovu zkontrolujte uložený plán a poté opakování výslovně povolte."
"Recover a stopped worker": "Obnovit zastavenou úlohu"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Obnovení použijte, až když potvrdíte, že tento pokus již neběží. Obnovení proces nezastaví."
"Collector and installation mode": "Režim sběrače a instalace"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Role sběrače a připojení k databázi určuje konfigurace nasazení. Před spuštěním sběrače ověřte konfiguraci primárního serveru."
"Discovery and SNMP settings": "Zjišťování a nastavení SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Ponechte zjišťování zakázané, dokud nebudou ověřeny sběr dat a konektivita sběračů."
"Template selection": "Výběr šablon"
"Templates selected for import": "Šablony vybrané k importu"
"No templates selected.": "Nejsou vybrány žádné šablony."
"Backup checklist": "Kontrolní seznam záloh"
"Database backup and a tested restoration procedure.": "Záloha databáze a otestovaný postup obnovy."
"RRD files and the service account permissions needed to restore them.": "Soubory RRD a oprávnění účtu služby potřebná k jejich obnově."
"Configuration, keys and plugin data outside the database.": "Konfigurace, klíče a data pluginů mimo databázi."
"Post-installation checks": "Kontroly po instalaci"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Ověřené kontroly pokrývají pouze zobrazené důkazy. Neposouzené kontroly stále vyžadují ověření operátorem."
"Operational checks still require operator verification.": "Provozní kontroly stále vyžadují ověření operátorem."
"Status": "Stav"
"verified": "Ověřeno"
"action_required": "Vyžaduje akci"
"not_assessed": "Neposouzeno"
"Database schema": "Schéma databáze"
"Stored schema matches the application target.": "Uložené schéma odpovídá cíli aplikace."
"Target schema completion has not been confirmed.": "Dokončení cílového schématu nebylo potvrzeno."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Zkontrolujte výsledek instalace a před považováním aktualizace schématu za dokončenou vyřešte selhání."
"Installation outcome": "Výsledek instalace"
"A successful receipt matches the current target schema.": "Úspěšné potvrzení odpovídá aktuálnímu cílovému schématu."
"A complete successful installation outcome has not been confirmed.": "Úplný úspěšný výsledek instalace nebyl potvrzen."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Zachovejte protokol instalátoru a v případě potřeby použijte výslovný postup obnovení nebo opakování."
"Collector synchronization": "Synchronizace sběračů"
"The completed installer reports pending collector synchronization.": "Dokončený instalátor hlásí čekající synchronizaci sběračů."
"The completed installer reports no pending collectors.": "Dokončený instalátor nehlásí žádné čekající sběrače."
"Collector completion remains unconfirmed by this partial receipt.": "Toto částečné potvrzení nepotvrzuje dokončení sběračů."
"Collector completion is not established by this installation outcome.": "Dokončení sběračů tímto výsledkem instalace není prokázáno."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Zkontrolujte stav sběračů a u částečných výsledků zopakujte dokončovací úlohy. Tím se neověřuje pozdější aktuálnost sběru."
"Scheduled collection": "Plánovaný sběr"
"No poller or device was contacted by this assessment.": "Toto posouzení nekontaktovalo žádný poller ani zařízení."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Potvrďte, že nakonfigurovaný plánovač spouští poller pod zamýšleným účtem služby, a zkontrolujte jeho další běžný cyklus."
"Graph data": "Data grafů"
"Live samples and RRD updates were not exercised.": "Živé vzorky a aktualizace RRD nebyly vyzkoušeny."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Po běžném cyklu sběru potvrďte, že očekávané grafy dostávají čerstvé vzorky, a zkontrolujte chyby pollerů."
"Recovery readiness": "Připravenost k obnově"
"Backup restoration was not exercised.": "Obnova ze zálohy nebyla vyzkoušena."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Než se spolehnete na obnovu, ověřte izolovanou obnovu databáze, souborů RRD, konfigurace a klíčového materiálu."
"No persisted local poller start has been recorded.": "Nebyl zaznamenán žádný trvale uložený místní start pollerů."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Trvale uložené časování pollerů je neplatné a nemůže prokázat stav plánovače."
"The recorded poller start is in the future. Check clock synchronization.": "Zaznamenaný start pollerů leží v budoucnosti. Zkontrolujte synchronizaci hodin."
"The recorded poller start is older than the native scheduling tolerance.": "Zaznamenaný start pollerů je starší než nativní tolerance plánování."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Místní start pollerů byl zaznamenán v rámci nativní tolerance plánování. Dokončení a stav zařízení nejsou ověřeny."
"readable": "čitelné"
"missing or unreadable": "chybí nebo je nečitelné"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Obnovte úplné vydání a jeho zamčené závislosti; udělte účtu služby oprávnění ke čtení."
"PHP temporary directory": "Dočasný adresář PHP"
"directory writable by this process": "adresář zapisovatelný tímto procesem"
"missing or not writable": "chybí nebo není zapisovatelný"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Nakonfigurujte sys_temp_dir jako existující adresář zapisovatelný instalačním účtem. Nativní importy používají dočasné soubory."
"Background worker launch": "Spuštění úlohy na pozadí"
"required PHP functions available; launch not exercised": "požadované funkce PHP jsou dostupné; spuštění nebylo vyzkoušeno"
"required PHP launch function disabled": "požadovaná funkce PHP pro spuštění je zakázána"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Povolte exec pro webový běh PHP nebo použijte autorizovaný instalátor CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Povolte popen, pclose pro webový běh PHP nebo použijte autorizovaný instalátor CLI."
"Database transaction ownership": "Vlastnictví databázové transakce"
"autocommit enabled; no caller-owned transaction": "autocommit je povolen; žádná transakce vlastněná volajícím"
"autocommit disabled or caller transaction active": "autocommit je zakázán nebo je aktivní transakce volajícího"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Spusťte instalaci mimo transakci vlastněnou volajícím a povolte autocommit na jejím připojení pro zápis."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Obnovte adresář vydání a udělte instalačnímu účtu oprávnění zápisu pro importy zdrojů šablon. Nepřidělujte mu oprávnění zápisu pro všechny."
"Worker file: install/background.php": "Soubor úlohy: install/background.php"
"Worker file: bin/legacy-installer.php": "Soubor úlohy: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Soubor úlohy: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Cíl importu: resource/snmp_queries"
"Import destination: resource/script_server": "Cíl importu: resource/script_server"
"Import destination: resource/script_queries": "Cíl importu: resource/script_queries"
"Import destination: scripts": "Cíl importu: scripts"
"Database privileges": "Oprávnění databáze"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Efektivní oprávnění pro migraci, včetně aktivních rolí a oprávnění k jednotlivým objektům, nebyla ověřena."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Požádejte správce databáze, aby pro instalační účet a schéma ověřil požadované zápisy do tabulek, změny schématu, triggery a rutiny. Neudělujte globální oprávnění správce."
"Compare web and worker runtimes": "Porovnat běhová prostředí webu a úlohy"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tímto se výslovně spustí krátká sonda PHP pouze pro čtení. Nerezervuje instalátor, nezapisuje soubory ani nekontaktuje zařízení."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Sonda dědí tento webový proces a používá nakonfigurovaný interpret PHP instalátoru. Nekontroluje samostatný plánovač ani službu."
"I authorize the read-only worker runtime comparison.": "Povoluji porovnání běhových prostředí úlohy pouze pro čtení."
"Compare runtimes": "Porovnat běhová prostředí"
"Runtime comparison results": "Výsledky porovnání běhových prostředí"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Rozdíly v oprávněních a identitě mohou být záměrné. Pozorování pouze pro čtení neprokazují, že zápisy nebo instalace uspějí."
"Confirm the read-only worker runtime comparison.": "Potvrďte porovnání běhových prostředí úlohy pouze pro čtení."
"The runtime comparison is unavailable.": "Porovnání běhových prostředí není k dispozici."
"Shared application secret": "Sdílené tajemství aplikace"
"A strong web application secret is required before comparison.": "Před porovnáním je vyžadováno silné tajemství webové aplikace."
"Runtime comparison": "Porovnání běhových prostředí"
"The configured worker runtime did not confirm a bounded comparison.": "Nakonfigurované běhové prostředí úlohy nepotvrdilo omezené porovnání."
"The inherited worker secret could not be confirmed against the web secret.": "Zděděné tajemství úlohy se nepodařilo potvrdit proti webovému tajemství."
"PHP runtime comparison": "Porovnání běhových prostředí PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Obě prostředí musí podporovat PHP 8.4; odlišné verze oprav vyžadují kontrolu."
"Required extension comparison": "Porovnání požadovaných rozšíření"
"Required extension availability is checked; differing versions require review.": "Kontroluje se dostupnost požadovaných rozšíření; odlišné verze vyžadují kontrolu."
"Process identity comparison": "Porovnání identity procesu"
"Effective process identity is unavailable on this platform.": "Efektivní identita procesu není na této platformě dostupná."
"Effective process identities match.": "Efektivní identity procesů se shodují."
"Effective process identities differ; separate service accounts may be intentional.": "Efektivní identity procesů se liší; samostatné účty služeb mohou být záměrné."
"Directory access comparison": "Porovnání přístupu k adresářům"
"Read-only directory permission observations match.": "Pozorování oprávnění k adresářům pouze pro čtení se shodují."
"Directory locations or permission observations differ; review the service-account roles.": "Umístění adresářů nebo pozorování oprávnění se liší; zkontrolujte role účtů služeb."
"Worker directory read and traversal": "Čtení a procházení adresářů úlohy"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Požadované adresáře úlohy musí existovat a umožňovat čtení a procházení. Zápisy nebyly testovány."
"The inherited worker secret matches the web secret for this private challenge.": "Zděděné tajemství úlohy se pro tuto soukromou výzvu shoduje s webovým tajemstvím."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Zkontrolujte nakonfigurovaný interpret PHP, požadovaná rozšíření, zděděné tajemství a oprávnění k adresářům účtů služeb. Nebyly vyzkoušeny žádné zápisy ani spuštění instalátoru."
"advisory": "doporučení"
