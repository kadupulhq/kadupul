"Preparing CSRF protection": "Připravuje se ochrana CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Průběh zobrazuje poslední zaznamenanou fázi. Obnovení této stránky nikdy nespustí ani neopakuje úlohu."
"Recover stopped attempt": "Obnovit zastavený pokus"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Obnovení zachová uložené volby a nikdy neukončí běžící úlohu. Před opakováním plán znovu zkontrolujte."
