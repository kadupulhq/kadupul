"Large tables may require the dedicated CLI conversion tool before installation.": "Velké tabulky mohou před instalací vyžadovat specializovaný nástroj CLI pro převod."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Pro zachování uložených přihlašovacích údajů ponechte tajná pole prázdná. Tajné hodnoty se nikdy znovu nezobrazují."
