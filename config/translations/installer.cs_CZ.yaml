"Scope": "Rozsah"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Stav není dostupný. Uložená práce je zachována. Obnovte stránku pro opětovné připojení; neodesílejte další instalaci."
"Synchronizing collectors": "Synchronizují se sběrače"
"Table conversions": "Převody tabulek"
"Templates": "Šablony"
