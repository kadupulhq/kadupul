"I accept the license terms": "Přijímám licenční podmínky"
"I authorize discovery of the displayed range": "Povoluji zjišťování zobrazeného rozsahu"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Zkontroloval(a) jsem protokol a potvrzuji, že předchozí úloha a její podřízené procesy byly zastaveny"
"I checked the previous attempt and accept that some changes may already be committed": "Zkontroloval(a) jsem předchozí pokus a beru na vědomí, že některé změny již mohly být potvrzeny"
"I reviewed this plan and have the required backups": "Zkontroloval(a) jsem tento plán a mám potřebné zálohy"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Pokud se úloha neočekávaně zastaví, zachovejte log/cacti.log a před výslovným opakováním potvrďte, že její proces skončil. Stav čekání nepotvrzuje úspěšné spuštění."
