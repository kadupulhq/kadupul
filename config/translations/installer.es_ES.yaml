"Action": "Acción"
"Advanced options": "Opciones avanzadas"
"Applying database upgrades": "Aplicando actualizaciones de la base de datos"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Haga una copia de seguridad de la base de datos, los archivos RRD, la configuración y las claves. Las actualizaciones de la base de datos pueden confirmar cambios que una reversión de la aplicación no puede deshacer."
"Blocked": "Bloqueado"
"Check": "Comprobar"
"Check again": "Comprobar de nuevo"
"Check collection freshness and collector connectivity before enabling discovery.": "Compruebe la vigencia de la recopilación y la conectividad del recopilador antes de habilitar el descubrimiento."
"Check requirements": "Comprobar requisitos"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Las comprobaciones inspeccionan este proceso y los permisos del sistema de archivos. No escriben archivos de prueba ni contactan con dispositivos."
"Collection profile": "Perfil de recopilación"
"Collector": "Recopilador"
"Configure": "Configurar"
"Configuring collection profiles": "Configurando perfiles de recopilación"
"Configuring discovery": "Configurando descubrimiento"
"Configuring the local device": "Configurando el dispositivo local"
"Confirming database version": "Confirmando versión de la base de datos"
"Converting selected tables": "Convirtiendo tablas seleccionadas"
"Database version": "Versión de la base de datos"
"Disabled": "Deshabilitado"
"Discovery": "Descubrimiento"
"Discovery SNMP settings": "Configuración SNMP de descubrimiento"
"Discovery range": "Rango de descubrimiento"
"Enable discovery after installation": "Habilitar descubrimiento tras la instalación"
"Executable paths": "Rutas de ejecutables"
"Execution status": "Estado de ejecución"
"Finished execution": "Ejecución finalizada"
"Finishing tasks only. Schema migrations will not be replayed.": "Solo tareas de finalización. Las migraciones de esquema no se volverán a ejecutar."
"I accept the license terms": "Acepto los términos de la licencia"
"I authorize discovery of the displayed range": "Autorizo el descubrimiento del rango mostrado"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "He comprobado el registro y confirmado que el trabajador anterior y sus procesos secundarios se han detenido"
"I checked the previous attempt and accept that some changes may already be committed": "He comprobado el intento anterior y acepto que algunos cambios ya pueden haberse confirmado"
"I reviewed this plan and have the required backups": "He revisado este plan y dispongo de las copias de seguridad necesarias"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Si un trabajador se detiene inesperadamente, conserve log/cacti.log y confirme que su proceso ha finalizado antes de reintentarlo explícitamente. Un estado de espera no confirma un inicio correcto."
"Importing templates": "Importando plantillas"
"Install Kadupul": "Instalar Kadupul"
"Installation and upgrade": "Instalación y actualización"
"Installation request was rejected.": "La solicitud de instalación fue rechazada."
"Installation steps": "Pasos de instalación"
"Installed": "Instalado"
"Keep a backup of the database, RRD files, configuration and secret material.": "Conserve una copia de seguridad de la base de datos, los archivos RRD, la configuración y el material de claves."
"Language": "Idioma"
"Large tables may require the dedicated CLI conversion tool before installation.": "Las tablas grandes pueden requerir la herramienta de conversión CLI dedicada antes de la instalación."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Deje los campos secretos en blanco para conservar las credenciales almacenadas. Los secretos nunca se vuelven a mostrar."
"License": "Licencia"
"No action needed": "No requiere acción"
"Observed": "Observado"
"Open the console": "Abrir la consola"
"Operation": "Operación"
"Override discovery SNMP settings": "Anular configuración SNMP de descubrimiento"
"Pass": "Aprobado"
"Poller interval in seconds": "Intervalo del sondeador en segundos"
"Preparing CSRF protection": "Preparando protección CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "El progreso muestra la última fase registrada. Actualizar esta página nunca inicia ni reintenta un trabajador."
"Recover stopped attempt": "Recuperar intento detenido"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "La recuperación conserva las selecciones guardadas y nunca termina un trabajador activo. Revise el plan de nuevo antes de volver a intentarlo."
"Review": "Revisar"
"Review installation plan": "Revisar plan de instalación"
"Run": "Ejecutar"
"Run reviewed plan": "Ejecutar plan revisado"
"Save and review": "Guardar y revisar"
"Scope": "Ámbito"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "El estado no está disponible. Se conserva el trabajo guardado. Actualice para volver a conectar; no envíe otra instalación."
"Synchronizing collectors": "Sincronizando recopiladores"
"Table conversions": "Conversiones de tablas"
"Templates": "Plantillas"
"The database version matches this application. Installation does not establish that polling is healthy.": "La versión de la base de datos coincide con esta aplicación. La instalación no acredita que el sondeo esté sano."
"The request outcome is unknown. Check execution status before retrying.": "El resultado de la solicitud es desconocido. Compruebe el estado de ejecución antes de volver a intentarlo."
"Theme": "Tema"
"Verify": "Verificar"
"Verify the poller schedule and service account.": "Verifique la programación del sondeador y la cuenta de servicio."
"Version change": "Cambio de versión"
"Waiting for the installation worker": "Esperando al trabajador de instalación"
"collector": "recopilador"
"complete": "completado"
"failed": "fallido"
"finish": "finalizar"
"install": "instalar"
"not_started": "sin iniciar"
"partial": "parcial"
"running": "en ejecución"
"succeeded": "correcto"
"upgrade": "actualizar"
"waiting": "en espera"
"Accept the license before saving the installation plan.": "Acepte la licencia antes de guardar el plan de instalación."
"Invalid installation form.": "Formulario de instalación no válido."
"Access denied.": "Acceso denegado."
"Confirm the recovery warning before retrying.": "Confirme la advertencia de recuperación antes de volver a intentarlo."
"Review and confirm the current installation plan.": "Revise y confirme el plan de instalación actual."
"Confirm the discovery scope before starting.": "Confirme el ámbito de descubrimiento antes de comenzar."
"Resolve the blocking checks before starting.": "Resuelva las comprobaciones bloqueantes antes de comenzar."
"Too many installer options.": "Demasiadas opciones del instalador."
"Invalid installer option name.": "Nombre de opción del instalador no válido."
"Unknown or malformed installer option.": "Opción del instalador desconocida o con formato incorrecto."
"Installer options must be scalar values.": "Las opciones del instalador deben ser valores escalares."
"Installer option is too long or contains a null byte.": "La opción del instalador es demasiado larga o contiene un byte nulo."
"Installer IDs and intervals must be whole numbers.": "Los ID e intervalos del instalador deben ser números enteros."
"Installer ID or interval is outside its supported range.": "El ID o intervalo del instalador está fuera de su rango admitido."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "La instalación no pudo continuar. Recargue su estado y revise las comprobaciones bloqueantes antes de volver a intentarlo."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirme que el trabajador anterior se ha detenido antes de recuperar su plan."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "La base de datos está instalada, pero algunos recopiladores aún necesitan sincronización. Reintente las tareas de finalización tras comprobar su estado."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "La instalación se detuvo. Conserve el registro del instalador, corrija la causa y confirme explícitamente un reintento. Es posible que algunos cambios de la base de datos ya se hayan confirmado. Compruebe la limpieza de complementos antes de autorizar un reintento."
"Next action": "Siguiente acción"
"Follow the execution status. Do not start another attempt while a worker is active.": "Siga el estado de ejecución. No inicie otro intento mientras haya un trabajador activo."
"Complete the recovery checklist before retrying.": "Complete la lista de verificación de recuperación antes de volver a intentarlo."
"Verify collection and graph operation before enabling discovery.": "Verifique la recopilación y el funcionamiento de los gráficos antes de habilitar el descubrimiento."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Resuelva los requisitos bloqueados y luego compruebe de nuevo. Las selecciones guardadas se conservan."
"Review the planned changes and backup checklist before authorizing execution.": "Revise los cambios previstos y la lista de verificación de copias de seguridad antes de autorizar la ejecución."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Seleccione un perfil de recopilación y acepte la licencia. Los ajustes opcionales pueden abrirse cuando sea necesario."
"Download installation diagnostics": "Descargar diagnósticos de instalación"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Abra un gráfico y confirme que sus datos RRD se actualizan tras un ciclo del sondeador."
"Requirement details": "Detalles del requisito"
"Recover": "Recuperar"
"Recovery checklist": "Lista de verificación de recuperación"
"Preserve log/cacti.log and record the failed attempt.": "Conserve log/cacti.log y registre el intento fallido."
"Confirm that the previous worker and its child processes have stopped.": "Confirme que el trabajador anterior y sus procesos secundarios se han detenido."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspeccione los cambios confirmados, la sincronización del recopilador y la limpieza de complementos. Corrija la causa antes de volver a intentarlo."
"Review the saved plan again, then explicitly authorize a retry.": "Revise de nuevo el plan guardado y luego autorice explícitamente un reintento."
"Recover a stopped worker": "Recuperar un trabajador detenido"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Use la recuperación solo tras confirmar que este intento ya no se está ejecutando. La recuperación no detiene un proceso."
"Collector and installation mode": "Recopilador y modo de instalación"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "La configuración de despliegue determina el rol del recopilador y las conexiones de base de datos. Verifique la configuración del servidor primario antes de iniciar un recopilador."
"Discovery and SNMP settings": "Configuración de descubrimiento y SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Mantenga el descubrimiento deshabilitado hasta que se hayan verificado la recopilación y la conectividad del recopilador."
"Template selection": "Selección de plantilla"
"Templates selected for import": "Plantillas seleccionadas para importar"
"No templates selected.": "No hay plantillas seleccionadas."
"Backup checklist": "Lista de verificación de copias de seguridad"
"Database backup and a tested restoration procedure.": "Copia de seguridad de la base de datos y un procedimiento de restauración probado."
"RRD files and the service account permissions needed to restore them.": "Archivos RRD y los permisos de la cuenta de servicio necesarios para restaurarlos."
"Configuration, keys and plugin data outside the database.": "Configuración, claves y datos de complementos fuera de la base de datos."
"Post-installation checks": "Comprobaciones posteriores a la instalación"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Las comprobaciones verificadas cubren únicamente la evidencia mostrada. Las comprobaciones no evaluadas aún requieren verificación del operador."
"Operational checks still require operator verification.": "Las comprobaciones operativas aún requieren verificación del operador."
"Status": "Estado"
"verified": "Verificado"
"action_required": "Acción requerida"
"not_assessed": "No evaluado"
"Database schema": "Esquema de la base de datos"
"Stored schema matches the application target.": "El esquema almacenado coincide con el destino de la aplicación."
"Target schema completion has not been confirmed.": "No se ha confirmado la finalización del esquema de destino."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Revise el resultado de la instalación y resuelva los fallos antes de dar por completada la actualización del esquema."
"Installation outcome": "Resultado de la instalación"
"A successful receipt matches the current target schema.": "Un comprobante válido coincide con el esquema de destino actual."
"A complete successful installation outcome has not been confirmed.": "No se ha confirmado un resultado completo y satisfactorio de la instalación."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Conserve el registro del instalador y utilice el procedimiento explícito de recuperación o reintento cuando sea necesario."
"Collector synchronization": "Sincronización de recopiladores"
"The completed installer reports pending collector synchronization.": "El instalador completado informa de una sincronización de recopiladores pendiente."
"The completed installer reports no pending collectors.": "El instalador completado no informa de ningún recopilador pendiente."
"Collector completion remains unconfirmed by this partial receipt.": "La finalización del recopilador sigue sin confirmarse mediante este comprobante parcial."
"Collector completion is not established by this installation outcome.": "La finalización del recopilador no queda acreditada por este resultado de instalación."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Revise el estado del recopilador y reintente las tareas de finalización para resultados parciales. Esto no verifica la vigencia posterior de la recopilación."
"Scheduled collection": "Recopilación programada"
"No poller or device was contacted by this assessment.": "Esta evaluación no contactó con ningún sondeador ni dispositivo."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Confirme que el programador configurado ejecuta el sondeador con la cuenta de servicio prevista y revise su próximo ciclo normal."
"Graph data": "Datos del gráfico"
"Live samples and RRD updates were not exercised.": "No se probaron muestras en vivo ni actualizaciones de RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Tras un ciclo de recopilación normal, confirme que los gráficos esperados reciben muestras recientes y revise los errores del sondeador."
"Recovery readiness": "Preparación para recuperación"
"Backup restoration was not exercised.": "No se probó la restauración de la copia de seguridad."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifique una restauración aislada de la base de datos, los archivos RRD, la configuración y el material de claves antes de confiar en la recuperación."
"No persisted local poller start has been recorded.": "No se ha registrado ningún inicio persistente del sondeador local."
"Persisted poller timing is invalid and cannot establish scheduler health.": "La temporización persistente del sondeador no es válida y no puede acreditar el estado de salud del programador."
"The recorded poller start is in the future. Check clock synchronization.": "El inicio del sondeador registrado está en el futuro. Compruebe la sincronización del reloj."
"The recorded poller start is older than the native scheduling tolerance.": "El inicio del sondeador registrado es anterior a la tolerancia de programación nativa."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Se registró el inicio de un sondeador local dentro de la tolerancia de programación nativa. No se han verificado la finalización ni el estado del dispositivo."
"readable": "legible"
"missing or unreadable": "ausente o ilegible"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaure la versión completa y sus dependencias bloqueadas; conceda acceso de lectura a la cuenta de servicio."
"PHP temporary directory": "Directorio temporal de PHP"
"directory writable by this process": "directorio con permisos de escritura para este proceso"
"missing or not writable": "ausente o sin permisos de escritura"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configure sys_temp_dir como un directorio existente con permisos de escritura para la cuenta de instalación. Las importaciones nativas utilizan archivos temporales."
"Background worker launch": "Inicio del trabajador en segundo plano"
"required PHP functions available; launch not exercised": "funciones PHP requeridas disponibles; inicio no probado"
"required PHP launch function disabled": "función de inicio PHP requerida deshabilitada"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Habilite exec para el entorno de ejecución PHP web o utilice el instalador CLI autorizado."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Habilite popen y pclose para el entorno de ejecución PHP web o utilice el instalador CLI autorizado."
"Database transaction ownership": "Propiedad de transacciones de la base de datos"
"autocommit enabled; no caller-owned transaction": "autocommit habilitado; sin transacción propiedad del invocador"
"autocommit disabled or caller transaction active": "autocommit deshabilitado o transacción del invocador activa"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Ejecute la instalación fuera de una transacción propiedad del invocador y habilite autocommit en su conexión de mutación."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaure el directorio de la versión y conceda acceso de escritura a la cuenta de instalación para importar recursos de plantillas. No lo haga escribible por cualquiera."
"Worker file: install/background.php": "Archivo del trabajador: install/background.php"
"Worker file: bin/legacy-installer.php": "Archivo del trabajador: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Archivo del trabajador: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destino de importación: resource/snmp_queries"
"Import destination: resource/script_server": "Destino de importación: resource/script_server"
"Import destination: resource/script_queries": "Destino de importación: resource/script_queries"
"Import destination: scripts": "Destino de importación: scripts"
"Database privileges": "Privilegios de la base de datos"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "No se verificaron los privilegios efectivos de migración, incluidos los roles activos y los permisos específicos de objeto."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Solicite al administrador de la base de datos que verifique las escrituras de tablas necesarias, cambios de esquema, disparadores y rutinas para la cuenta y el esquema de instalación. No conceda privilegios de administrador global."
"Compare web and worker runtimes": "Comparar entornos de ejecución web y del trabajador"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Esto inicia explícitamente una sonda PHP breve de solo lectura. No reserva un instalador, no escribe archivos ni contacta con dispositivos."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "La sonda hereda este proceso web y utiliza el intérprete PHP de instalación configurado. No inspecciona un programador ni un servicio independientes."
"I authorize the read-only worker runtime comparison.": "Autorizo la comparación de solo lectura del entorno de ejecución del trabajador."
"Compare runtimes": "Comparar entornos de ejecución"
"Runtime comparison results": "Resultados de la comparación de entornos de ejecución"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Las diferencias de permisos e identidad pueden ser intencionadas. Las observaciones de solo lectura no demuestran que las escrituras o la instalación vayan a tener éxito."
"Confirm the read-only worker runtime comparison.": "Confirme la comparación de solo lectura del entorno de ejecución del trabajador."
"The runtime comparison is unavailable.": "La comparación de entornos de ejecución no está disponible."
"Shared application secret": "Secreto compartido de aplicación"
"A strong web application secret is required before comparison.": "Se requiere un secreto sólido de la aplicación web antes de realizar la comparación."
"Runtime comparison": "Comparación de entornos de ejecución"
"The configured worker runtime did not confirm a bounded comparison.": "El entorno de ejecución del trabajador configurado no confirmó una comparación acotada."
"The inherited worker secret could not be confirmed against the web secret.": "No se pudo confirmar el secreto heredado del trabajador frente al secreto web."
"PHP runtime comparison": "Comparación de entornos de ejecución PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Ambos entornos de ejecución deben admitir PHP 8.4; las versiones de parche distintas requieren revisión."
"Required extension comparison": "Comparación de extensiones requeridas"
"Required extension availability is checked; differing versions require review.": "Se comprueba la disponibilidad de las extensiones requeridas; las versiones distintas requieren revisión."
"Process identity comparison": "Comparación de identidad de proceso"
"Effective process identity is unavailable on this platform.": "La identidad efectiva de proceso no está disponible en esta plataforma."
"Effective process identities match.": "Las identidades efectivas de proceso coinciden."
"Effective process identities differ; separate service accounts may be intentional.": "Las identidades efectivas de proceso difieren; las cuentas de servicio separadas pueden ser intencionadas."
"Directory access comparison": "Comparación de acceso a directorios"
"Read-only directory permission observations match.": "Las observaciones de permisos de directorio de solo lectura coinciden."
"Directory locations or permission observations differ; review the service-account roles.": "Las ubicaciones de directorio o las observaciones de permisos difieren; revise los roles de la cuenta de servicio."
"Worker directory read and traversal": "Lectura y recorrido del directorio del trabajador"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Los directorios requeridos del trabajador deben existir y permitir lectura y recorrido. No se probaron escrituras."
"The inherited worker secret matches the web secret for this private challenge.": "El secreto heredado del trabajador coincide con el secreto web para este desafío privado."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Revise el intérprete PHP configurado, las extensiones requeridas, el secreto heredado y los permisos de directorio de la cuenta de servicio. No se probaron escrituras ni el inicio del instalador."
"advisory": "informativo"
