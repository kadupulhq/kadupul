"Preparing CSRF protection": "CSRF-Schutz wird vorbereitet"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Der Fortschritt zeigt die zuletzt erfasste Phase. Das Neuladen dieser Seite startet oder wiederholt niemals einen Worker."
"Recover stopped attempt": "Gestoppten Versuch wiederherstellen"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Die Wiederherstellung behält gespeicherte Auswahlen bei und beendet niemals einen aktiven Worker. Prüfen Sie den Plan vor einem erneuten Versuch erneut."
