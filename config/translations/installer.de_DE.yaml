"Accept the license before saving the installation plan.": "Akzeptieren Sie die Lizenz, bevor Sie den Installationsplan speichern."
"Invalid installation form.": "Ungültiges Installationsformular."
"Access denied.": "Zugriff verweigert."
"Confirm the recovery warning before retrying.": "Bestätigen Sie die Wiederherstellungswarnung, bevor Sie es erneut versuchen."
"Review and confirm the current installation plan.": "Prüfen und bestätigen Sie den aktuellen Installationsplan."
"Confirm the discovery scope before starting.": "Bestätigen Sie vor dem Start den Erkennungsbereich."
"Resolve the blocking checks before starting.": "Beheben Sie die blockierenden Prüfungen vor dem Start."
"Too many installer options.": "Zu viele Installationsoptionen."
"Invalid installer option name.": "Ungültiger Name der Installationsoption."
"Unknown or malformed installer option.": "Unbekannte oder fehlerhafte Installationsoption."
"Installer options must be scalar values.": "Installationsoptionen müssen skalare Werte sein."
"Installer option is too long or contains a null byte.": "Die Installationsoption ist zu lang oder enthält ein Null-Byte."
"Installer IDs and intervals must be whole numbers.": "Installations-IDs und Intervalle müssen ganze Zahlen sein."
"Installer ID or interval is outside its supported range.": "Installations-ID oder Intervall liegt außerhalb des unterstützten Bereichs."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Die Installation konnte nicht fortgesetzt werden. Laden Sie den Status neu und prüfen Sie vor einem erneuten Versuch die blockierenden Prüfungen."
"Confirm that the previous worker has stopped before recovering its plan.": "Bestätigen Sie, dass der vorherige Worker gestoppt wurde, bevor Sie seinen Plan wiederherstellen."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Die Datenbank ist installiert, aber einige Datensammler müssen noch synchronisiert werden. Wiederholen Sie die abschließenden Aufgaben, nachdem Sie deren Status geprüft haben."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installation gestoppt. Sichern Sie das Installationsprotokoll, beheben Sie die Ursache und bestätigen Sie ausdrücklich einen erneuten Versuch. Einige Datenbankänderungen sind möglicherweise bereits festgeschrieben. Prüfen Sie die Plugin-Bereinigung, bevor Sie einen erneuten Versuch autorisieren."
"Next action": "Nächste Aktion"
"Follow the execution status. Do not start another attempt while a worker is active.": "Verfolgen Sie den Ausführungsstatus. Starten Sie keinen weiteren Versuch, solange ein Worker aktiv ist."
"Complete the recovery checklist before retrying.": "Schließen Sie die Wiederherstellungs-Checkliste ab, bevor Sie es erneut versuchen."
"Verify collection and graph operation before enabling discovery.": "Prüfen Sie Erfassung und Graph-Betrieb, bevor Sie die Erkennung aktivieren."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Beheben Sie die blockierten Voraussetzungen und prüfen Sie danach erneut. Gespeicherte Auswahlen bleiben erhalten."
"Review the planned changes and backup checklist before authorizing execution.": "Prüfen Sie die geplanten Änderungen und die Backup-Checkliste, bevor Sie die Ausführung autorisieren."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Wählen Sie ein Erfassungsprofil aus und akzeptieren Sie die Lizenz. Optionale Einstellungen können bei Bedarf geöffnet werden."
"Download installation diagnostics": "Installationsdiagnose herunterladen"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Öffnen Sie einen Graphen und bestätigen Sie, dass seine RRD-Daten nach einem Poller-Zyklus aktualisiert werden."
"Requirement details": "Details zu den Voraussetzungen"
"Recover": "Wiederherstellen"
"Recovery checklist": "Wiederherstellungs-Checkliste"
"Preserve log/cacti.log and record the failed attempt.": "Sichern Sie log/cacti.log und protokollieren Sie den fehlgeschlagenen Versuch."
"Confirm that the previous worker and its child processes have stopped.": "Bestätigen Sie, dass der vorherige Worker und seine Kindprozesse beendet wurden."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Prüfen Sie festgeschriebene Änderungen, Datensammler-Synchronisierung und Plugin-Bereinigung. Beheben Sie die Ursache vor einem erneuten Versuch."
"Review the saved plan again, then explicitly authorize a retry.": "Prüfen Sie den gespeicherten Plan erneut und autorisieren Sie dann ausdrücklich einen erneuten Versuch."
"Recover a stopped worker": "Gestoppten Worker wiederherstellen"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Verwenden Sie die Wiederherstellung erst, nachdem Sie bestätigt haben, dass dieser Versuch nicht mehr läuft. Die Wiederherstellung beendet keinen Prozess."
"Collector and installation mode": "Datensammler und Installationsmodus"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Die Bereitstellungskonfiguration bestimmt die Datensammler-Rolle und die Datenbankverbindungen. Prüfen Sie die Konfiguration des Primärservers, bevor Sie einen Datensammler starten."
"Discovery and SNMP settings": "Erkennungs- und SNMP-Einstellungen"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Lassen Sie die Erkennung deaktiviert, bis Erfassung und Datensammler-Konnektivität verifiziert wurden."
"Template selection": "Vorlagenauswahl"
"Templates selected for import": "Für den Import ausgewählte Vorlagen"
"No templates selected.": "Keine Vorlagen ausgewählt."
"Backup checklist": "Backup-Checkliste"
"Database backup and a tested restoration procedure.": "Datenbanksicherung und ein getestetes Wiederherstellungsverfahren."
"RRD files and the service account permissions needed to restore them.": "RRD-Dateien und die für deren Wiederherstellung erforderlichen Dienstkontoberechtigungen."
"Configuration, keys and plugin data outside the database.": "Konfiguration, Schlüssel und Plugin-Daten außerhalb der Datenbank."
"Post-installation checks": "Prüfungen nach der Installation"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Verifizierte Prüfungen decken nur die gezeigten Nachweise ab. Nicht bewertete Prüfungen erfordern weiterhin eine Überprüfung durch den Betreiber."
"Operational checks still require operator verification.": "Betriebsprüfungen erfordern weiterhin eine Überprüfung durch den Betreiber."
"Status": "Status"
"verified": "Verifiziert"
"action_required": "Aktion erforderlich"
"not_assessed": "Nicht bewertet"
"Database schema": "Datenbankschema"
"Stored schema matches the application target.": "Das gespeicherte Schema entspricht dem Anwendungsziel."
"Target schema completion has not been confirmed.": "Der Abschluss des Zielschemas wurde nicht bestätigt."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Prüfen Sie das Installationsergebnis und beheben Sie Fehler, bevor Sie das Schema-Upgrade als abgeschlossen betrachten."
"Installation outcome": "Installationsergebnis"
"A successful receipt matches the current target schema.": "Eine erfolgreiche Empfangsbestätigung entspricht dem aktuellen Zielschema."
"A complete successful installation outcome has not been confirmed.": "Ein vollständig erfolgreicher Installationsabschluss wurde nicht bestätigt."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Sichern Sie das Installationsprotokoll und nutzen Sie bei Bedarf das explizite Wiederherstellungs- oder Wiederholungsverfahren."
"Collector synchronization": "Datensammler-Synchronisierung"
"The completed installer reports pending collector synchronization.": "Das abgeschlossene Installationsprogramm meldet eine ausstehende Datensammler-Synchronisierung."
"The completed installer reports no pending collectors.": "Das abgeschlossene Installationsprogramm meldet keine ausstehenden Datensammler."
"Collector completion remains unconfirmed by this partial receipt.": "Der Abschluss der Datensammler bleibt durch diese Teilbestätigung unbestätigt."
"Collector completion is not established by this installation outcome.": "Der Abschluss der Datensammler wird durch dieses Installationsergebnis nicht bestätigt."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Prüfen Sie den Status der Datensammler und wiederholen Sie abschließende Aufgaben bei Teilergebnissen. Dies verifiziert nicht die spätere Aktualität der Erfassung."
"Scheduled collection": "Geplante Erfassung"
"No poller or device was contacted by this assessment.": "Bei dieser Prüfung wurde weder ein Poller noch ein Gerät kontaktiert."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Bestätigen Sie, dass der konfigurierte Zeitplaner den Poller unter dem vorgesehenen Dienstkonto ausführt, und prüfen Sie den nächsten regulären Zyklus."
"Graph data": "Graph-Daten"
"Live samples and RRD updates were not exercised.": "Live-Messwerte und RRD-Aktualisierungen wurden nicht getestet."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Prüfen Sie nach einem regulären Erfassungszyklus, ob die erwarteten Graphen aktuelle Messwerte erhalten, und kontrollieren Sie die Poller-Fehler."
"Recovery readiness": "Wiederherstellungsbereitschaft"
"Backup restoration was not exercised.": "Die Wiederherstellung aus dem Backup wurde nicht getestet."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Prüfen Sie eine isolierte Wiederherstellung von Datenbank, RRD-Dateien, Konfiguration und Schlüsselmaterial, bevor Sie sich auf die Wiederherstellung verlassen."
"No persisted local poller start has been recorded.": "Es wurde kein persistierter lokaler Poller-Start erfasst."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Die persistierte Poller-Zeitmessung ist ungültig und kann den Zustand des Zeitplaners nicht belegen."
"The recorded poller start is in the future. Check clock synchronization.": "Der erfasste Poller-Start liegt in der Zukunft. Prüfen Sie die Zeitsynchronisierung."
"The recorded poller start is older than the native scheduling tolerance.": "Der erfasste Poller-Start ist älter als die native Zeitplantoleranz."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Ein lokaler Poller-Start wurde innerhalb der nativen Zeitplantoleranz erfasst. Abschluss und Gerätezustand sind nicht verifiziert."
"readable": "lesbar"
"missing or unreadable": "fehlt oder nicht lesbar"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Stellen Sie das vollständige Release und seine gesicherten Abhängigkeiten wieder her; gewähren Sie dem Dienstkonto Leserechte."
"PHP temporary directory": "Temporäres PHP-Verzeichnis"
"directory writable by this process": "Verzeichnis für diesen Prozess beschreibbar"
"missing or not writable": "fehlt oder nicht beschreibbar"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurieren Sie sys_temp_dir als vorhandenes Verzeichnis, das für das Installationskonto beschreibbar ist. Native Importe verwenden temporäre Dateien."
"Background worker launch": "Start des Hintergrund-Workers"
"required PHP functions available; launch not exercised": "erforderliche PHP-Funktionen verfügbar; Start nicht ausgeführt"
"required PHP launch function disabled": "erforderliche PHP-Startfunktion deaktiviert"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Aktivieren Sie exec für die Web-PHP-Laufzeitumgebung oder verwenden Sie das autorisierte CLI-Installationsprogramm."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Aktivieren Sie popen, pclose für die Web-PHP-Laufzeitumgebung oder verwenden Sie das autorisierte CLI-Installationsprogramm."
"Database transaction ownership": "Eigentümerschaft von Datenbanktransaktionen"
"autocommit enabled; no caller-owned transaction": "Autocommit aktiviert; keine Transaktion des Aufrufers"
"autocommit disabled or caller transaction active": "Autocommit deaktiviert oder aufrufende Transaktion aktiv"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Führen Sie die Installation außerhalb einer vom Aufrufer gestarteten Transaktion aus und aktivieren Sie Autocommit auf der Änderungsverbindung."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Stellen Sie das Release-Verzeichnis wieder her und gewähren Sie dem Installationskonto Schreibrechte für Vorlagen-Ressourcenimporte. Machen Sie es nicht für alle beschreibbar."
"Worker file: install/background.php": "Worker-Datei: install/background.php"
"Worker file: bin/legacy-installer.php": "Worker-Datei: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Worker-Datei: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importziel: resource/snmp_queries"
"Import destination: resource/script_server": "Importziel: resource/script_server"
"Import destination: resource/script_queries": "Importziel: resource/script_queries"
"Import destination: scripts": "Importziel: scripts"
"Database privileges": "Datenbankberechtigungen"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Effektive Migrationsberechtigungen, einschließlich aktiver Rollen und objektspezifischer Rechte, wurden nicht verifiziert."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Lassen Sie vom Datenbankadministrator die erforderlichen Tabellenschreibrechte, Schemaänderungen, Trigger und Routinen für das Installationskonto und -schema prüfen. Vergeben Sie keine globalen Administratorrechte."
"Compare web and worker runtimes": "Web- und Worker-Laufzeitumgebungen vergleichen"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Dies startet ausdrücklich eine kurze schreibgeschützte PHP-Prüfung. Es reserviert kein Installationsprogramm, schreibt keine Dateien und kontaktiert keine Geräte."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Die Prüfung erbt diesen Webprozess und verwendet den konfigurierten PHP-Interpreter des Installationsprogramms. Sie untersucht keinen separaten Zeitplaner oder Dienst."
"I authorize the read-only worker runtime comparison.": "Ich autorisiere den schreibgeschützten Vergleich der Worker-Laufzeitumgebung."
"Compare runtimes": "Laufzeitumgebungen vergleichen"
"Runtime comparison results": "Ergebnisse des Laufzeitvergleichs"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Berechtigungs- und Identitätsunterschiede können beabsichtigt sein. Schreibgeschützte Beobachtungen belegen nicht, dass Schreibvorgänge oder die Installation erfolgreich verlaufen."
"Confirm the read-only worker runtime comparison.": "Bestätigen Sie den schreibgeschützten Vergleich der Worker-Laufzeitumgebung."
"The runtime comparison is unavailable.": "Der Laufzeitvergleich ist nicht verfügbar."
"Shared application secret": "Gemeinsames Anwendungsgeheimnis"
"A strong web application secret is required before comparison.": "Vor dem Vergleich ist ein starkes Geheimnis für die Webanwendung erforderlich."
"Runtime comparison": "Laufzeitvergleich"
"The configured worker runtime did not confirm a bounded comparison.": "Die konfigurierte Worker-Laufzeitumgebung hat keinen begrenzten Vergleich bestätigt."
"The inherited worker secret could not be confirmed against the web secret.": "Das vererbte Worker-Geheimnis konnte nicht gegen das Web-Geheimnis bestätigt werden."
"PHP runtime comparison": "Vergleich der PHP-Laufzeitumgebung"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Beide Laufzeitumgebungen müssen PHP 8.4 unterstützen; abweichende Patch-Versionen erfordern eine Prüfung."
"Required extension comparison": "Vergleich erforderlicher Erweiterungen"
"Required extension availability is checked; differing versions require review.": "Die Verfügbarkeit erforderlicher Erweiterungen wird geprüft; abweichende Versionen erfordern eine Prüfung."
"Process identity comparison": "Vergleich der Prozessidentitäten"
"Effective process identity is unavailable on this platform.": "Die effektive Prozessidentität ist auf dieser Plattform nicht verfügbar."
"Effective process identities match.": "Die effektiven Prozessidentitäten stimmen überein."
"Effective process identities differ; separate service accounts may be intentional.": "Die effektiven Prozessidentitäten weichen voneinander ab; separate Dienstkonten können beabsichtigt sein."
"Directory access comparison": "Vergleich des Verzeichniszugriffs"
"Read-only directory permission observations match.": "Die schreibgeschützten Beobachtungen der Verzeichnisberechtigungen stimmen überein."
"Directory locations or permission observations differ; review the service-account roles.": "Verzeichnispfade oder Berechtigungsbeobachtungen weichen ab; prüfen Sie die Rollen des Dienstkontos."
"Worker directory read and traversal": "Lesen und Durchqueren des Worker-Verzeichnisses"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Erforderliche Worker-Verzeichnisse müssen existieren sowie Lese- und Durchquerungsrechte erlauben. Schreibvorgänge wurden nicht getestet."
"The inherited worker secret matches the web secret for this private challenge.": "Das vererbte Worker-Geheimnis stimmt bei dieser privaten Prüfung mit dem Web-Geheimnis überein."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Prüfen Sie den konfigurierten PHP-Interpreter, erforderliche Erweiterungen, das vererbte Geheimnis und die Verzeichnisberechtigungen des Dienstkontos. Schreibvorgänge oder der Start des Installationsprogramms wurden nicht ausgeführt."
"advisory": "Hinweis"
