"I accept the license terms": "Ich akzeptiere die Lizenzbedingungen"
"I authorize discovery of the displayed range": "Ich autorisiere die Erkennung des angezeigten Bereichs"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Ich habe das Protokoll geprüft und bestätigt, dass der vorherige Worker und seine Kindprozesse beendet wurden"
"I checked the previous attempt and accept that some changes may already be committed": "Ich habe den vorherigen Versuch geprüft und akzeptiere, dass einige Änderungen möglicherweise bereits festgeschrieben sind"
"I reviewed this plan and have the required backups": "Ich habe diesen Plan geprüft und verfüge über die erforderlichen Backups"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Wenn ein Worker unerwartet stoppt, sichern Sie log/cacti.log und bestätigen Sie, dass der Prozess beendet wurde, bevor Sie ausdrücklich einen erneuten Versuch starten. Ein Wartestatus bestätigt keinen erfolgreichen Start."
