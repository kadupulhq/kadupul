"Check requirements": "Voraussetzungen prüfen"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Die Prüfungen untersuchen diesen Prozess und die Dateisystemberechtigungen. Sie schreiben keine Testdateien und kontaktieren keine Geräte."
