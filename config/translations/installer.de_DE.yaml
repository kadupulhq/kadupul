"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Der Status ist nicht verfügbar. Gespeicherte Arbeit bleibt erhalten. Aktualisieren Sie zur Wiederverbindung; senden Sie keine weitere Installation ab."
"Synchronizing collectors": "Datensammler werden synchronisiert"
"Table conversions": "Tabellenkonvertierungen"
"Templates": "Schablonen"
