"Keep a backup of the database, RRD files, configuration and secret material.": "Halten Sie ein Backup von Datenbank, RRD-Dateien, Konfiguration und geheimen Schlüsseln vor."
"Language": "Sprache"
"Large tables may require the dedicated CLI conversion tool before installation.": "Große Tabellen erfordern vor der Installation möglicherweise das dedizierte CLI-Konvertierungswerkzeug."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Lassen Sie geheime Felder leer, um gespeicherte Zugangsdaten beizubehalten. Geheimnisse werden niemals erneut angezeigt."
