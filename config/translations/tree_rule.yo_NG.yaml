"Device": "Ẹ̀rọ"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Àwọn ewé Ẹ̀rọ kò lè lo àwọn ìlànà lórí àwọn òpó àwòrán ìtọ́ka tàbí àdàkọ àwòrán ìtọ́ka. Nígbà tí o bá ń yí Irú Ohun Ewé padà sí Ẹ̀rọ, ṣàmì sí àpótí yìí láti yọ àwọn ìlànà wọ̀nyẹn kúrò; a kò lè mú wọn padà."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Àwọn ewé Ẹ̀rọ kò lè lo àwọn ìlànà tí ó dá lórí àwòrán ìtọ́ka. Fìdí yíyọ àwọn ìlànà %count% kúrò múlẹ̀ láti fi pamọ́."
