"Cancel": "Fagilé"
"Check this box to enable this rule.": "Ṣàmì sí àpótí yìí láti mú òfin yìí ṣiṣẹ́."
"Choose a Tree for the new Tree Items.": "Yan Igi kan fún Àwọn Ohun Igi tuntun."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Yan àkọlé-ókè kan ti Igi tí a yàn láti so mọ́, tàbí gbòǹgbò rẹ̀. Rí i dájú pé ó ṣì wà nígbà tí a bá ń ṣe òfin yìí."
"Choose a header of the selected Tree.": "Yan àkọlé-ókè kan ti Igi tí a yàn."
