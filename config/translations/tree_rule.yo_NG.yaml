"Choose a listed Leaf Item Type.": "Yan Irú Ohun Ewé tí a tò."
"Choose an existing Tree.": "Yan Igi tó wà tẹ́lẹ̀."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Yan bí a ṣe ń kó àwọn àwòrán ìtọ́ka jọ nígbà tí a bá yà wọ́n fún olùgbàlejò pàtó yìí lórí igi náà. A ń lò ó fún àwọn ewé Ẹ̀rọ."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria."
