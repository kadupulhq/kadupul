"Database version": "Databaseversjon"
"Disabled": "Deaktivert"
"Discovery": "Oppdagelse"
"Discovery SNMP settings": "SNMP-innstillinger for oppdagelse"
"Discovery range": "Oppdagelsesområde"
"Enable discovery after installation": "Aktiver oppdagelse etter installasjon"
