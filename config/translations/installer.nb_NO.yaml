"Applying database upgrades": "Bruker databaseoppgraderinger"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Ta sikkerhetskopi av databasen, RRD-filene, konfigurasjonen og nøklene. Databaseoppgraderinger kan utføre endringer som en tilbakerulling av applikasjonen ikke kan angre."
"Blocked": "Blokkert"
"Check": "Kontroller"
"Check again": "Kontroller på nytt"
"Check collection freshness and collector connectivity before enabling discovery.": "Kontroller innsamlingens ferskhet og innsamlertilkoblingen før du aktiverer oppdagelse."
"Check requirements": "Kontroller krav"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Kontrollene undersøker denne prosessen og filsystemtillatelsene. De skriver ikke testfiler og kontakter ikke enheter."
