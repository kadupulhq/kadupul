"Accept the license before saving the installation plan.": "Godta lisensen før du lagrer installasjonsplanen."
"Invalid installation form.": "Ugyldig installasjonsskjema."
"Access denied.": "Tilgang nektet."
"Confirm the recovery warning before retrying.": "Bekreft gjenopprettingsadvarselen før du prøver igjen."
"Review and confirm the current installation plan.": "Gå gjennom og bekreft den gjeldende installasjonsplanen."
"Confirm the discovery scope before starting.": "Bekreft oppdagelsesomfanget før du starter."
"Resolve the blocking checks before starting.": "Løs de blokkerende kontrollene før du starter."
"Too many installer options.": "For mange installasjonsalternativer."
"Invalid installer option name.": "Ugyldig navn på installasjonsalternativ."
"Unknown or malformed installer option.": "Ukjent eller feilformatert installasjonsalternativ."
"Installer options must be scalar values.": "Installasjonsalternativer må være skalarverdier."
"Installer option is too long or contains a null byte.": "Installasjonsalternativet er for langt eller inneholder en nullbyte."
"Installer IDs and intervals must be whole numbers.": "Installasjons-ID-er og intervaller må være hele tall."
"Installer ID or interval is outside its supported range.": "Installasjons-ID eller intervall er utenfor det støttede området."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Installasjonen kunne ikke fortsette. Last inn statusen på nytt og gå gjennom de blokkerende kontrollene før du prøver igjen."
"Confirm that the previous worker has stopped before recovering its plan.": "Bekreft at den forrige arbeideren har stoppet før du gjenoppretter planen."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Databasen er installert, men noen innsamlere må fortsatt synkroniseres. Prøv de avsluttende oppgavene på nytt etter å ha sjekket statusen deres."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installasjonen stoppet. Bevar installasjonsloggen, rett opp årsaken og bekreft eksplisitt et nytt forsøk. Noen databaseendringer kan allerede være utført. Kontroller opprydding av programtillegg før du autoriserer et nytt forsøk."
"Next action": "Neste handling"
"Follow the execution status. Do not start another attempt while a worker is active.": "Følg kjøringsstatusen. Ikke start et nytt forsøk mens en arbeider er aktiv."
"Complete the recovery checklist before retrying.": "Fullfør gjenopprettingssjekklisten før du prøver igjen."
"Verify collection and graph operation before enabling discovery.": "Verifiser innsamling og grafdrift før du aktiverer oppdagelse."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Løs de blokkerte kravene, og kontroller deretter på nytt. Lagrede valg beholdes."
"Review the planned changes and backup checklist before authorizing execution.": "Gå gjennom de planlagte endringene og sikkerhetskopisjekklisten før du autoriserer kjøring."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Velg en innsamlingsprofil og godta lisensen. Valgfrie innstillinger kan åpnes ved behov."
"Download installation diagnostics": "Last ned installasjonsdiagnostikk"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Åpne en graf og bekreft at RRD-dataene oppdateres etter en pollersyklus."
"Requirement details": "Kravdetaljer"
"Recover": "Gjenopprett"
"Recovery checklist": "Gjenopprettingssjekkliste"
"Preserve log/cacti.log and record the failed attempt.": "Bevar log/cacti.log og registrer det mislykkede forsøket."
"Confirm that the previous worker and its child processes have stopped.": "Bekreft at den forrige arbeideren og dens underprosesser har stoppet."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Undersøk utførte endringer, innsamlersynkronisering og opprydding av programtillegg. Rett opp årsaken før du prøver igjen."
"Review the saved plan again, then explicitly authorize a retry.": "Gå gjennom den lagrede planen på nytt, og autoriser deretter eksplisitt et nytt forsøk."
"Recover a stopped worker": "Gjenopprett en stoppet arbeider"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Bruk gjenoppretting bare etter at du har bekreftet at dette forsøket ikke lenger kjører. Gjenoppretting stopper ikke en prosess."
"Collector and installation mode": "Innsamler- og installasjonsmodus"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Distribusjonskonfigurasjonen bestemmer innsamlerrollen og databasetilkoblingene. Verifiser primærserverens konfigurasjon før du starter en innsamler."
"Discovery and SNMP settings": "Oppdagelses- og SNMP-innstillinger"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Hold oppdagelse deaktivert til innsamling og innsamlertilkobling er verifisert."
"Template selection": "Malvalg"
"Templates selected for import": "Maler valgt for import"
"No templates selected.": "Ingen maler valgt."
"Backup checklist": "Sikkerhetskopisjekkliste"
"Database backup and a tested restoration procedure.": "Databasesikkerhetskopi og en testet gjenopprettingsprosedyre."
"RRD files and the service account permissions needed to restore them.": "RRD-filer og tillatelsene til tjenestekontoen som trengs for å gjenopprette dem."
"Configuration, keys and plugin data outside the database.": "Konfigurasjon, nøkler og programtilleggsdata utenfor databasen."
"Post-installation checks": "Kontroller etter installasjon"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Verifiserte kontroller dekker bare bevisene som vises. Ikke vurderte kontroller krever fortsatt verifisering av en operatør."
"Operational checks still require operator verification.": "Driftskontroller krever fortsatt verifisering av en operatør."
"Status": "Status"
"verified": "Verifisert"
"action_required": "Handling kreves"
"not_assessed": "Ikke vurdert"
"Database schema": "Databaseskjema"
"Stored schema matches the application target.": "Lagret skjema samsvarer med applikasjonens målskjema."
"Target schema completion has not been confirmed.": "Fullføring av målskjemaet er ikke bekreftet."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Gå gjennom installasjonsresultatet og løs feil før du anser skjemaoppgraderingen som fullført."
"Installation outcome": "Installasjonsresultat"
"A successful receipt matches the current target schema.": "En vellykket kvittering samsvarer med gjeldende målskjema."
"A complete successful installation outcome has not been confirmed.": "Et fullstendig vellykket installasjonsresultat er ikke bekreftet."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Bevar installasjonsloggen og bruk den eksplisitte gjenopprettings- eller gjentakelsesprosedyren når det kreves."
"Collector synchronization": "Innsamlersynkronisering"
"The completed installer reports pending collector synchronization.": "Det fullførte installasjonsprogrammet rapporterer ventende innsamlersynkronisering."
"The completed installer reports no pending collectors.": "Det fullførte installasjonsprogrammet rapporterer ingen ventende innsamlere."
"Collector completion remains unconfirmed by this partial receipt.": "Fullføring av innsamlere forblir ubekreftet av denne delvise kvitteringen."
"Collector completion is not established by this installation outcome.": "Fullføring av innsamlere er ikke fastslått av dette installasjonsresultatet."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Gå gjennom innsamlerstatusen og prøv avsluttende oppgaver på nytt ved delvise resultater. Dette verifiserer ikke senere innsamlingsferskhet."
"Scheduled collection": "Planlagt innsamling"
"No poller or device was contacted by this assessment.": "Ingen poller eller enhet ble kontaktet av denne vurderingen."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Bekreft at den konfigurerte planleggeren kjører polleren som den tiltenkte tjenestekontoen, og gå gjennom neste normale syklus."
"Graph data": "Grafdata"
"Live samples and RRD updates were not exercised.": "Levende prøver og RRD-oppdateringer ble ikke utprøvd."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Etter en normal innsamlingssyklus bekrefter du at forventede grafer mottar ferske prøver, og gjennomgår pollerfeil."
"Recovery readiness": "Gjenopprettingsberedskap"
"Backup restoration was not exercised.": "Gjenoppretting fra sikkerhetskopi ble ikke utprøvd."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifiser en isolert gjenoppretting av database, RRD-filer, konfigurasjon og nøkkelmateriale før du stoler på gjenoppretting."
"No persisted local poller start has been recorded.": "Ingen lagret lokal pollerstart er registrert."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Lagret pollertidspunkt er ugyldig og kan ikke fastslå planleggerens helse."
"The recorded poller start is in the future. Check clock synchronization.": "Den registrerte pollerstarten er i fremtiden. Kontroller klokkesynkroniseringen."
"The recorded poller start is older than the native scheduling tolerance.": "Den registrerte pollerstarten er eldre enn den opprinnelige planleggingstoleransen."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "En lokal pollerstart ble registrert innenfor den opprinnelige planleggingstoleransen. Fullføring og enhetshelse er ikke verifisert."
"readable": "lesbar"
"missing or unreadable": "mangler eller er uleselig"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Gjenopprett hele utgivelsen og dens låste avhengigheter; gi tjenestekontoen lesetilgang."
"PHP temporary directory": "PHPs midlertidige katalog"
"directory writable by this process": "katalog som kan skrives til av denne prosessen"
"missing or not writable": "mangler eller er ikke skrivbar"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurer sys_temp_dir som en eksisterende katalog som installasjonskontoen kan skrive til. Opprinnelige importer bruker midlertidige filer."
"Background worker launch": "Oppstart av bakgrunnsarbeider"
"required PHP functions available; launch not exercised": "nødvendige PHP-funksjoner er tilgjengelige; oppstart er ikke utprøvd"
"required PHP launch function disabled": "nødvendig PHP-oppstartsfunksjon er deaktivert"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Aktiver exec for PHP-kjøretiden for web, eller bruk det autoriserte CLI-installasjonsprogrammet."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Aktiver popen og pclose for PHP-kjøretiden for web, eller bruk det autoriserte CLI-installasjonsprogrammet."
"Database transaction ownership": "Eierskap til databasetransaksjon"
"autocommit enabled; no caller-owned transaction": "autocommit er aktivert; ingen transaksjon eid av kalleren"
"autocommit disabled or caller transaction active": "autocommit er deaktivert eller en kallertransaksjon er aktiv"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Kjør installasjonen utenfor en transaksjon eid av kalleren, og aktiver autocommit på mutasjonstilkoblingen."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Gjenopprett utgivelseskatalogen og gi installasjonskontoen skrivetilgang for import av malressurser. Ikke gjør den skrivbar for alle."
"Worker file: install/background.php": "Arbeiderfil: install/background.php"
"Worker file: bin/legacy-installer.php": "Arbeiderfil: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Arbeiderfil: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importmål: resource/snmp_queries"
"Import destination: resource/script_server": "Importmål: resource/script_server"
"Import destination: resource/script_queries": "Importmål: resource/script_queries"
"Import destination: scripts": "Importmål: scripts"
"Database privileges": "Databaseprivilegier"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Effektive migreringsprivilegier, inkludert aktive roller og objektspesifikke tillatelser, ble ikke verifisert."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "La databaseadministratoren verifisere nødvendige tabellskrivinger, skjemaendringer, triggere og rutiner for installasjonskontoen og skjemaet. Ikke gi globale administratorprivilegier."
"Compare web and worker runtimes": "Sammenlign web- og arbeiderkjøretider"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Dette starter eksplisitt en kort skrivebeskyttet PHP-sonde. Den reserverer ikke et installasjonsprogram, skriver ikke filer og kontakter ikke enheter."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Sonden arver denne webprosessen og bruker den konfigurerte PHP-tolkeren for installasjon. Den undersøker ikke en separat planlegger eller tjeneste."
"I authorize the read-only worker runtime comparison.": "Jeg autoriserer den skrivebeskyttede sammenligningen av arbeiderkjøretid."
"Compare runtimes": "Sammenlign kjøretider"
"Runtime comparison results": "Resultater av kjøretidssammenligning"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Forskjeller i tillatelser og identitet kan være tilsiktet. Skrivebeskyttede observasjoner beviser ikke at skriving eller installasjon vil lykkes."
"Confirm the read-only worker runtime comparison.": "Bekreft den skrivebeskyttede sammenligningen av arbeiderkjøretid."
"The runtime comparison is unavailable.": "Kjøretidssammenligningen er utilgjengelig."
"Shared application secret": "Delt applikasjonshemmelighet"
"A strong web application secret is required before comparison.": "En sterk hemmelighet for webapplikasjonen kreves før sammenligning."
"Runtime comparison": "Kjøretidssammenligning"
"The configured worker runtime did not confirm a bounded comparison.": "Den konfigurerte arbeiderkjøretiden bekreftet ikke en avgrenset sammenligning."
"The inherited worker secret could not be confirmed against the web secret.": "Den arvede arbeiderhemmeligheten kunne ikke bekreftes mot webhemmeligheten."
"PHP runtime comparison": "Sammenligning av PHP-kjøretid"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Begge kjøretidene må støtte PHP 8.4; ulike patchversjoner krever gjennomgang."
"Required extension comparison": "Sammenligning av nødvendige utvidelser"
"Required extension availability is checked; differing versions require review.": "Tilgjengeligheten av nødvendige utvidelser kontrolleres; ulike versjoner krever gjennomgang."
"Process identity comparison": "Sammenligning av prosessidentitet"
"Effective process identity is unavailable on this platform.": "Effektiv prosessidentitet er utilgjengelig på denne plattformen."
"Effective process identities match.": "Effektive prosessidentiteter samsvarer."
"Effective process identities differ; separate service accounts may be intentional.": "Effektive prosessidentiteter er forskjellige; separate tjenestekontoer kan være tilsiktet."
"Directory access comparison": "Sammenligning av katalogtilgang"
"Read-only directory permission observations match.": "Skrivebeskyttede observasjoner av katalogtillatelser samsvarer."
"Directory locations or permission observations differ; review the service-account roles.": "Katalogplasseringer eller tillatelsesobservasjoner er forskjellige; gå gjennom rollene til tjenestekontoene."
"Worker directory read and traversal": "Lesing og traversering av arbeiderkataloger"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Nødvendige arbeiderkataloger må finnes og tillate lesing og traversering. Ingen skriving ble testet."
"The inherited worker secret matches the web secret for this private challenge.": "Den arvede arbeiderhemmeligheten samsvarer med webhemmeligheten for denne private utfordringen."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Gå gjennom den konfigurerte PHP-tolkeren, nødvendige utvidelser, arvet hemmelighet og katalogtillatelser for tjenestekontoene. Ingen skriving eller installasjonsoppstart ble utprøvd."
"advisory": "rådgivende"
