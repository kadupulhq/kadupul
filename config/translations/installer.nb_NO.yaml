"Finished execution": "Fullført kjøring"
"Finishing tasks only. Schema migrations will not be replayed.": "Bare avsluttende oppgaver. Skjemamigreringer spilles ikke av på nytt."
"I accept the license terms": "Jeg godtar lisensvilkårene"
"I authorize discovery of the displayed range": "Jeg autoriserer oppdagelse av det viste området"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Jeg har sjekket loggen og bekreftet at den forrige arbeideren og dens underprosesser har stoppet"
"I checked the previous attempt and accept that some changes may already be committed": "Jeg har sjekket det forrige forsøket og godtar at noen endringer allerede kan være utført"
"I reviewed this plan and have the required backups": "Jeg har gjennomgått denne planen og har de nødvendige sikkerhetskopiene"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Hvis en arbeider stopper uventet, bevar log/cacti.log og bekreft at prosessen er avsluttet før du eksplisitt prøver igjen. En ventetilstand bekrefter ikke at oppstarten lyktes."
"Importing templates": "Importerer maler"
"Install Kadupul": "Installer Kadupul"
"Installation and upgrade": "Installasjon og oppgradering"
"Installation request was rejected.": "Installasjonsforespørselen ble avvist."
"Installation steps": "Installasjonstrinn"
"Installed": "Installert"
"Keep a backup of the database, RRD files, configuration and secret material.": "Ta vare på en sikkerhetskopi av databasen, RRD-filene, konfigurasjonen og hemmelig materiale."
"Language": "Språk"
"Large tables may require the dedicated CLI conversion tool before installation.": "Store tabeller kan kreve det dedikerte CLI-konverteringsverktøyet før installasjon."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "La hemmelige felt stå tomme for å beholde lagret legitimasjon. Hemmeligheter vises aldri på nytt."
"License": "Lisens"
"No action needed": "Ingen handling nødvendig"
"Observed": "Observert"
"Open the console": "Åpne konsollen"
"Operation": "Operasjon"
"Override discovery SNMP settings": "Overstyr SNMP-innstillinger for oppdagelse"
"Pass": "Bestått"
"Poller interval in seconds": "Pollerintervall i sekunder"
"Preparing CSRF protection": "Forbereder CSRF-beskyttelse"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Fremdriften viser den sist registrerte fasen. Oppdatering av denne siden starter eller prøver aldri en arbeider på nytt."
"Recover stopped attempt": "Gjenopprett stoppet forsøk"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Gjenoppretting beholder de lagrede valgene og avslutter aldri en levende arbeider. Gå gjennom planen på nytt før du prøver igjen."
"Review": "Gjennomgang"
"Review installation plan": "Gå gjennom installasjonsplanen"
"Run": "Kjør"
"Run reviewed plan": "Kjør den gjennomgåtte planen"
"Save and review": "Lagre og gå gjennom"
"Scope": "Omfang"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status er utilgjengelig. Lagret arbeid beholdes. Oppdater for å koble til igjen; ikke send inn en ny installasjon."
"Synchronizing collectors": "Synkroniserer innsamlere"
"Table conversions": "Tabellkonverteringer"
"Templates": "Maler"
"The database version matches this application. Installation does not establish that polling is healthy.": "Databaseversjonen samsvarer med denne applikasjonen. Installasjon fastslår ikke at polling fungerer som den skal."
"The request outcome is unknown. Check execution status before retrying.": "Resultatet av forespørselen er ukjent. Kontroller kjøringsstatusen før du prøver igjen."
