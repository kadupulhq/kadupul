"A useful name for this Rule.": "Magac waxtar leh oo loogu talagalay Xeerkan."
"Access denied.": "Gelitaanka waa la diiday."
"Add Tree Rule": "Ku Dar Xeerka Geedka"
"Back to Tree Rules": "Ku Noqo Xeerarka Geedka"
"Cancel": "Jooji"
"Check this box to enable this rule.": "Calaamadee sanduuqan si aad u hawl-geliso xeerkan."
"Choose a Tree for the new Tree Items.": "U dooro Geed walxaha Geedka cusub."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Dooro madax ka mid ah Geedka la doortay si loogu xiro, ama xididkiisa. Hubi inuu weli jiro marka xeerkan la fulinayo."
"Choose a header of the selected Tree.": "Dooro madax ka mid ah Geedka la doortay."
"Choose a listed Graph Grouping Style.": "Dooro Qaabka Kooxaynta Garaafyada ee liiska ku jira."
"Choose a listed Leaf Item Type.": "Dooro Nooca Shayga Caleenta ee liiska ku jira."
"Choose an existing Tree.": "Dooro Geed jira."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Dooro sida garaafyada loo kooxeeyo marka loo sawirayo martigeliyahan gaarka ah ee geedka saaran. Waxaa loo adeegsadaa caleemaha Aaladda."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Guji Sii Wad si aad u tirtirto Xeerarka Geedka ee soo socda oo ay la jiraan Shuruudahooda Xulashada Shayga iyo Abuurista Geedka."
"Click Continue to disable the following Tree Rules.": "Guji Sii Wad si aad u damiso Xeerarka Geedka ee soo socda."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Guji Sii Wad si aad u nuqul-samayso Xeerarka Geedka ee soo socda. Ikhtiyaar ahaan waad beddeli kartaa qaabka cinwaanka ee Xeerarka Geedka ee cusub, kuwaas oo ku bilaabmaya iyagoo dansan."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Guji Sii Wad si aad u shiddo Xeerarka Geedka ee soo socda. Hubi in si guul leh loo tijaabiyay."
"Continue": "Sii wad"
"Data Query Index": "Tusaha Weydiinta Xogta"
"Delete Tree Rules": "Tirtir Xeerarka Geedka"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Natiijada tirtiridda lama hubo. Hubi liiska Xeerarka Geedka ka hor intaadan mar kale isku dayin."
"Delete selected": "Tirtir kuwa la doortay"
"Device": "Qalabka"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Caleemaha aaladda ma isticmaali karaan shuruudaha tiirarka garaafka ama qaabka garaafka. Marka aad u beddelayso Nooca Shayga Caleenta Aalad, calaamadee sanduuqan si aad uga saarto shuruudahaas; dib looma soo celin karo."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Caleemaha aaladda ma isticmaali karaan shuruudo ku salaysan garaafka. Xaqiiji ka saarista %count% shuruudood si loo kaydiyo."
"Disable Tree Rules": "Dami Xeerarka Geedka"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Natiijada daminta lama hubo. Hubi liiska Xeerarka Geedka ka hor intaadan mar kale isku dayin."
"Disable selected": "Jooji kuwa la doortay"
"Duplicate Tree Rules": "Nuqul-samee Xeerarka Geedka"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Natiijada nuqul-samaynta lama hubo. Hubi liiska Xeerarka Geedka ka hor intaadan mar kale isku dayin."
"Duplicate selected": "Nuqul ka samee kuwa la doortay"
"Edit Tree Rule": "Wax Ka Beddel Xeerka Geedka"
"Enable Rule": "Hawl-geli Xeerka"
"Enable Tree Rules": "Shid Xeerarka Geedka"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Natiijada shididda lama hubo. Hubi liiska Xeerarka Geedka ka hor intaadan mar kale isku dayin."
"Enable selected": "Hawlgeli kuwa la doortay"
"Enter a name.": "Geli magac."
"Enter a valid name format.": "Geli qaab magac oo sax ah."
"Enter at most %count% characters.": "Geli ugu badnaan %count% xaraf."
"Enter single-line text.": "Geli qoraal hal saf ah."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Mid kasta oo ah <rule_name> waxaa lagu beddelaa magaca Xeerka Geedka la koobiyaynayo."
"Graph": "Jaantus"
"Graph Grouping Style": "Qaabka Kooxaynta Jaantusyada"
"Graph Template": "Qaab-dhismeedka Jaantuska"
"Invalid Tree Rule selection.": "Xulashada Xeerka Geedka waa mid aan sax ahayn."
"Leaf Item Type": "Nooca Shayga Caleenta"
"Name": "Magaca"
"Object Selection and Tree Creation Criteria": "Shuruudaha Xulashada Shayga iyo Abuurista Geedka"
"One or more selected Tree Rules no longer exist.": "Mid ama ka badan oo ka mid ah Xeerarka Geedka ee la doortay hadda ma jiraan."
"Optional: Sub-Tree Item": "Ikhtiyaari: Shayga Geed-hoosaadka"
"Remove graph-based criteria": "Ka saar shuruudaha ku salaysan garaafka"
"Save": "Kaydi"
"Save outcome is uncertain. Reload before retrying.": "Natiijada kaydinta lama hubo. Dib u soo rar ka hor intaadan isku dayin mar kale."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Kaydi xeerka marka hore; Shuruudihiisa Xulashada Shayga iyo Abuurista Geedka waxaa lagu daraa kaddib."
"Select": "Dooro"
"Select %name%": "Dooro %name%"
"Select at least one Tree Rule.": "Dooro ugu yaraan hal Xeerka Geedka."
"Select at most 100 Tree Rules at a time.": "Dooro ugu badnaan 100 Xeerka Geedka markiiba."
"Select up to %count% rows at a time.": "Dooro ilaa %count% saf mar qura."
"The Item Type that shall be dynamically added to the tree.": "Nooca Shayga si firfircoon loogu dari doono geedka."
"The name format must give every copy a name of 1 to 255 characters.": "Qaabka magacu waa inuu koobi kasta siiyo magac ka kooban 1 ilaa 255 xaraf."
"The tree rule changed since you opened this form. Reload before saving.": "Xeerka geedka wuu isbeddelay tan iyo markii aad furtay foomkan. Dib u rar ka hor intaadan kaydin."
"Title Format": "Qaabka Cinwaanka"
"Tree": "Geed"
"Tree Rule Selection [edit: %name%]": "Xulashada Xeerka Geedka [wax ka beddel: %name%]"
"Tree Rules Selection [new]": "Xulashada Xeerarka Geedka [cusub]"
"Tree rule not found.": "Xeerka geedka lama helin."
"Tree rule saved.": "Xeerka geedka waa la kaydiyay."
"Unable to load Tree Rules. Reload before retrying.": "Lama soo rari karo Xeerarka Geedka. Dib u rar ka hor intaadan mar kale isku dayin."
"Unable to load the tree rule. Reload before retrying.": "Lama soo rari karo xeerka geedka. Dib u rar ka hor intaadan mar kale isku dayin."
"Unexpected fields were submitted.": "Meelo aan la filayn ayaa la gudbiyay."
