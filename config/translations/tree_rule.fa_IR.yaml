"A useful name for this Rule.": "نامی کاربردی برای این قانون."
"Access denied.": "دسترسی رد شد."
"Add Tree Rule": "افزودن قانون درخت"
"Back to Tree Rules": "بازگشت به قوانین درخت"
"Check this box to enable this rule.": "برای فعال کردن این قانون، این کادر را علامت بزنید."
"Choose a Tree for the new Tree Items.": "یک درخت برای آیتم‌های جدید درخت انتخاب کنید."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "یک سرشاخه از درخت انتخاب‌شده برای اتصال یا ریشه آن انتخاب کنید. مطمئن شوید که هنگام اجرای این قانون همچنان وجود دارد."
"Choose a header of the selected Tree.": "یک سرشاخه از درخت انتخاب‌شده برگزینید."
"Choose a listed Graph Grouping Style.": "یک سبک گروه‌بندی نمودار فهرست‌شده انتخاب کنید."
"Choose a listed Leaf Item Type.": "یک نوع آیتم برگ فهرست‌شده انتخاب کنید."
"Choose an existing Tree.": "یک درخت موجود انتخاب کنید."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "نحوه گروه‌بندی نمودارها هنگام رسم برای این میزبان خاص روی درخت را انتخاب کنید. برای برگ‌های دستگاه استفاده می‌شود."
"Data Query Index": "نمایه پرس‌وجوی داده"
"Device": "دستگاه"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "برگ‌های دستگاه نمی‌توانند از معیارهای مبتنی بر ستون‌های نمودار یا الگوی نمودار استفاده کنند. هنگام تغییر نوع آیتم برگ به «دستگاه»، برای حذف آن معیارها این کادر را علامت بزنید؛ این معیارها قابل بازیابی نیستند."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "برگ‌های دستگاه نمی‌توانند از معیارهای مبتنی بر نمودار استفاده کنند. برای ذخیره، حذف %count% معیار را تأیید کنید."
"Edit Tree Rule": "ویرایش قانون درخت"
"Enable Rule": "فعال کردن قانون"
"Enter a name.": "یک نام وارد کنید."
"Enter at most %count% characters.": "حداکثر %count% نویسه وارد کنید."
"Enter single-line text.": "متن تک‌خطی وارد کنید."
"Graph": "نمودار"
"Graph Grouping Style": "سبک گروه‌بندی نمودار"
"Graph Template": "الگوی نمودار"
"Leaf Item Type": "نوع آیتم برگ"
"Name": "نام"
"Object Selection and Tree Creation Criteria": "معیارهای انتخاب شیء و ایجاد درخت"
"Optional: Sub-Tree Item": "اختیاری: آیتم زیرشاخه درخت"
"Remove graph-based criteria": "حذف معیارهای مبتنی بر نمودار"
"Save": "ذخیره"
"Save outcome is uncertain. Reload before retrying.": "نتیجه ذخیره نامشخص است. پیش از تلاش مجدد دوباره بارگذاری کنید."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "ابتدا قانون را ذخیره کنید؛ معیارهای انتخاب شیء و ایجاد درخت آن پس از آن افزوده می‌شوند."
"The Item Type that shall be dynamically added to the tree.": "نوع آیتمی که به‌صورت پویا به درخت افزوده خواهد شد."
"The tree rule changed since you opened this form. Reload before saving.": "قانون درخت از زمانی که این فرم را باز کرده‌اید تغییر کرده است. پیش از ذخیره دوباره بارگذاری کنید."
"Tree": "درخت"
"Tree Rule Selection [edit: %name%]": "انتخاب قانون درخت [ویرایش: %name%]"
"Tree Rules Selection [new]": "انتخاب قوانین درخت [جدید]"
"Tree rule not found.": "قانون درخت یافت نشد."
"Tree rule saved.": "قانون درخت ذخیره شد."
"Unable to load the tree rule. Reload before retrying.": "امکان بارگذاری قانون درخت وجود ندارد. پیش از تلاش مجدد دوباره بارگذاری کنید."
"Unexpected fields were submitted.": "فیلدهای غیرمنتظره‌ای ارسال شدند."
