"A useful name for this Rule.": "Un nom útil per a aquesta regla."
"Access denied.": "Accés denegat."
"Add Tree Rule": "Afegeix una regla d'arbre"
"Back to Tree Rules": "Torna a les regles d'arbre"
"Cancel": "Cancel·la"
"Check this box to enable this rule.": "Marqueu aquesta casella per activar aquesta regla."
"Choose a Tree for the new Tree Items.": "Trieu un arbre per als nous elements d'arbre."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Trieu una capçalera de l'arbre seleccionat on enganxar-lo, o la seva arrel. Assegureu-vos que encara existeix quan s'executi aquesta regla."
"Choose a header of the selected Tree.": "Trieu una capçalera de l'arbre seleccionat."
"Choose a listed Graph Grouping Style.": "Trieu un estil d'agrupació de gràfics de la llista."
"Choose a listed Leaf Item Type.": "Trieu un tipus d'element de fulla de la llista."
"Choose an existing Tree.": "Trieu un arbre existent."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Trieu com s'agrupen els gràfics quan es dibuixen per a aquest amfitrió concret a l'arbre. S'utilitza per a les fulles de dispositius."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Feu clic a Continua per suprimir les regles d'arbre següents amb els seus criteris de selecció d'objectes i de creació d'arbres."
"Click Continue to disable the following Tree Rules.": "Feu clic a Continua per desactivar les regles d'arbre següents."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Feu clic a Continua per duplicar les regles d'arbre següents. Opcionalment, podeu canviar el format del títol de les noves regles d'arbre, que s'inicien desactivades."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Feu clic a Continua per activar les regles d'arbre següents. Assegureu-vos que s'han provat correctament."
"Continue": "Continua"
"Data Query Index": "Índex de la consulta de dades"
"Delete Tree Rules": "Suprimeix les regles d'arbre"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "El resultat de la supressió és incert. Comproveu la llista de regles d'arbre abans de tornar-ho a provar."
"Delete selected": "Suprimeix la selecció"
"Device": "Dispositiu"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Les fulles de dispositiu no poden utilitzar criteris sobre columnes de gràfics o de plantilles de gràfics. En canviar el tipus d'element de fulla a Dispositiu, marqueu aquesta casella per eliminar aquests criteris; no es poden recuperar."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Les fulles de dispositiu no poden utilitzar criteris basats en gràfics. Confirmeu l'eliminació de %count% criteris per desar."
"Disable Tree Rules": "Desactiva les regles d'arbre"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "El resultat de la desactivació és incert. Comproveu la llista de regles d'arbre abans de tornar-ho a provar."
"Disable selected": "Desactiva la selecció"
"Duplicate Tree Rules": "Duplica les regles d'arbre"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "El resultat de la duplicació és incert. Comproveu la llista de regles d'arbre abans de tornar-ho a provar."
"Duplicate selected": "Duplica la selecció"
"Edit Tree Rule": "Edita la regla d'arbre"
"Enable Rule": "Activa la regla"
"Enable Tree Rules": "Activa les regles d'arbre"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "El resultat de l'activació és incert. Comproveu la llista de regles d'arbre abans de tornar-ho a provar."
"Enable selected": "Activa la selecció"
"Enter a name.": "Introduïu un nom."
"Enter a valid name format.": "Introduïu un format de nom vàlid."
"Enter at most %count% characters.": "Introduïu com a màxim %count% caràcters."
"Enter single-line text.": "Introduïu text d'una sola línia."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Cada <rule_name> se substitueix pel nom de la regla d'arbre que es copia."
"Graph": "Gràfic"
"Graph Grouping Style": "Estil d'agrupació de gràfics"
"Graph Template": "Plantilla de gràfic"
"Invalid Tree Rule selection.": "Selecció de regles d'arbre no vàlida."
"Leaf Item Type": "Tipus d'element de fulla"
"Name": "Nom"
"Object Selection and Tree Creation Criteria": "Criteris de selecció d'objectes i de creació d'arbres"
"One or more selected Tree Rules no longer exist.": "Una o més regles d'arbre seleccionades ja no existeixen."
"Optional: Sub-Tree Item": "Opcional: element de subarbre"
"Remove graph-based criteria": "Elimina els criteris basats en gràfics"
"Save": "Desa"
"Save outcome is uncertain. Reload before retrying.": "El resultat de desar és incert. Torneu a carregar abans de tornar-ho a provar."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Deseu primer la regla; els seus criteris de selecció d'objectes i de creació d'arbres s'afegeixen després."
"Select": "Selecciona"
"Select %name%": "Selecciona %name%"
"Select at least one Tree Rule.": "Seleccioneu almenys una regla d'arbre."
"Select at most 100 Tree Rules at a time.": "Seleccioneu com a màxim 100 regles d'arbre alhora."
"Select up to %count% rows at a time.": "Seleccioneu fins a %count% files alhora."
"The Item Type that shall be dynamically added to the tree.": "El tipus d'element que s'afegirà dinàmicament a l'arbre."
"The name format must give every copy a name of 1 to 255 characters.": "El format del nom ha de donar a cada còpia un nom d'1 a 255 caràcters."
"The tree rule changed since you opened this form. Reload before saving.": "La regla d'arbre ha canviat des que vau obrir aquest formulari. Torneu a carregar abans de desar."
"Title Format": "Format del títol"
"Tree": "Arbre"
"Tree Rule Selection [edit: %name%]": "Selecció de regla d'arbre [edita: %name%]"
"Tree Rules Selection [new]": "Selecció de regles d'arbre [nou]"
"Tree rule not found.": "No s'ha trobat la regla d'arbre."
"Tree rule saved.": "S'ha desat la regla d'arbre."
"Unable to load Tree Rules. Reload before retrying.": "No s'han pogut carregar les regles d'arbre. Torneu a carregar abans de tornar-ho a provar."
"Unable to load the tree rule. Reload before retrying.": "No s'ha pogut carregar la regla d'arbre. Torneu a carregar abans de tornar-ho a provar."
