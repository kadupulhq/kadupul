"A useful name for this Rule.": "便於識別此規則的名稱。"
"Access denied.": "拒絕存取。"
"Add Tree Rule": "新增樹狀目錄規則"
"Back to Tree Rules": "返回樹狀目錄規則清單"
"Check this box to enable this rule.": "勾選此方塊以啟用此規則。"
"Choose a Tree for the new Tree Items.": "選擇新樹狀目錄項目的目標樹狀目錄。"
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "選擇要掛載的所選樹狀目錄標頭或根目錄。請確保執行此規則時該項目仍然存在。"
"Choose a header of the selected Tree.": "選擇所選樹狀目錄的標頭。"
"Choose a listed Graph Grouping Style.": "請選擇列出的圖表分組樣式。"
"Choose a listed Leaf Item Type.": "請選擇列出的葉節點項目類型。"
"Choose an existing Tree.": "請選擇現有的樹狀目錄。"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "選擇在樹狀目錄中繪製此特定主機時的圖表分組方式。用於裝置葉節點。"
"Data Query Index": "資料查詢索引"
"Device": "裝置"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "裝置葉節點不能使用圖表或圖表範本欄位的條件。將葉節點項目類型變更為「裝置」時，請勾選此方塊以移除這些條件；移除後將無法復原。"
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "裝置葉節點不能使用以圖表為基礎的條件。請確認移除 %count% 個條件以儲存。"
"Edit Tree Rule": "編輯樹狀目錄規則"
"Enable Rule": "啟用規則"
"Enter a name.": "請輸入名稱。"
"Enter at most %count% characters.": "最多只能輸入 %count% 個字元。"
"Enter single-line text.": "請輸入單行文字。"
"Graph": "圖表"
"Graph Grouping Style": "圖表分組樣式"
"Graph Template": "圖表範本"
"Leaf Item Type": "葉節點項目類型"
