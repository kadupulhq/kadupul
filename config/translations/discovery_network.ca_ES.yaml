"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "L'adreça de correu que s'utilitzarà com a remitent del correu de notificació.  Si es deixa en blanc, s'utilitza l'adreça de correu de notificació d'automatització per defecte."
