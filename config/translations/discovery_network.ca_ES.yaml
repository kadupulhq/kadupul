"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Una llista, delimitada per espais, de servidors DNS alternatius que s'utilitzaran per a la resolució DNS. Si és buida, s'utilitzarà el SO del poller per resoldre els noms DNS."
"Access denied.": "Accés denegat."
"Add Discovery Network": "Afegeix una xarxa de descobriment"
"After an initial failure, the number of ping retries to attempt before failing.": "Després d'un error inicial, el nombre de reintents de ping que s'intentaran abans de fallar."
"After the selected Run Limit, the discovery process will be terminated.": "Després del límit d'execució seleccionat, el procés de descobriment es finalitzarà."
