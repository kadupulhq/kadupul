"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Les planificacions diària i setmanal utilitzen l'inici i Reexecuta cada; la setmanal també utilitza Dies de la setmana. La mensual utilitza Mesos i Dies del mes; Mensual el dia utilitza Mesos, Setmanes del mes i Dies de la setmana."
