"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "విరమించుకునే ముందు SNMP రీడ్‌స్ట్రింగ్ ద్వారా పరికరాన్ని చేరుకోవడానికి గరిష్ట ప్రయత్నాల సంఖ్య."
"The maximum number of milliseconds Cacti will wait for an SNMP response (does not work with php-snmp support).": "SNMP ప్రతిస్పందన కోసం Cacti వేచి ఉండే గరిష్ట మిల్లీసెకన్ల సంఖ్య (php-snmp మద్దతుతో పని చేయదు)."
"The name can be at most 100 characters.": "పేరు గరిష్టంగా 100 అక్షరాలు ఉండవచ్చు."
"This is a unique string that will be matched to a devices sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ఈ ఆటోమేషన్ టెంప్లేట్‌తో జత చేయడానికి పరికరాల sysDescr స్ట్రింగ్‌తో సరిపోల్చబడే ప్రత్యేకమైన స్ట్రింగ్ ఇది. ఏదైనా SQL Where ఎక్స్‌ప్రెషన్‌తో పాటు ఏదైనా Perl రెగ్యులర్ ఎక్స్‌ప్రెషన్‌ను ఉపయోగించవచ్చు."
"This is a unique string that will be matched to a devices sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ఈ ఆటోమేషన్ టెంప్లేట్‌తో జత చేయడానికి పరికరాల sysName స్ట్రింగ్‌తో సరిపోల్చబడే ప్రత్యేకమైన స్ట్రింగ్ ఇది. ఏదైనా SQL Where ఎక్స్‌ప్రెషన్‌తో పాటు ఏదైనా Perl రెగ్యులర్ ఎక్స్‌ప్రెషన్‌ను ఉపయోగించవచ్చు."
"This is a unique string that will be matched to a devices sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ఈ ఆటోమేషన్ టెంప్లేట్‌తో జత చేయడానికి పరికరాల sysOid స్ట్రింగ్‌తో సరిపోల్చబడే ప్రత్యేకమైన స్ట్రింగ్ ఇది. ఏదైనా SQL Where ఎక్స్‌ప్రెషన్‌తో పాటు ఏదైనా Perl రెగ్యులర్ ఎక్స్‌ప్రెషన్‌ను ఉపయోగించవచ్చు."
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "ఈ పాత ఆటోమేషన్ టెంప్లేట్ ఫారమ్ గడువు ముగిసింది. పరికర నియమాలను తెరిచి కొత్త ఫారమ్‌ను సమర్పించండి."
