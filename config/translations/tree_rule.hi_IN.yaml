"Choose an existing Tree.": "मौजूदा ट्री चुनें।"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "चुनें कि ट्री पर इस विशेष होस्ट के लिए ग्राफ़ बनाते समय उन्हें कैसे समूहीकृत किया जाए। डिवाइस लीफ़ के लिए उपयोग किया जाता है।"
"Data Query Index": "डेटा क्वेरी इंडेक्स"
"Device": "डिवाइस"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "डिवाइस लीफ़ ग्राफ़ या ग्राफ़ टेम्पलेट कॉलम पर मानदंड का उपयोग नहीं कर सकतीं। लीफ़ आइटम प्रकार को डिवाइस में बदलते समय, उन मानदंडों को हटाने के लिए इस बॉक्स को चेक करें; उन्हें पुनर्प्राप्त नहीं किया जा सकता।"
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "डिवाइस लीफ़ ग्राफ़-आधारित मानदंड का उपयोग नहीं कर सकतीं। सहेजने के लिए %count% मानदंड हटाने की पुष्टि करें।"
