"A useful name for this Rule.": "इस नियम का एक उपयोगी नाम।"
"Access denied.": "पहुंच अस्वीकृत।"
"Add Tree Rule": "ट्री नियम जोड़ें"
"Back to Tree Rules": "ट्री नियमों पर वापस जाएं"
"Check this box to enable this rule.": "इस नियम को सक्षम करने के लिए इस बॉक्स को जांचें।"
"Choose a Tree for the new Tree Items.": "नए ट्री आइटम के लिए ट्री चुनें।"
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "हुक करने के लिए चयनित ट्री का एक हेडर या उसका रूट चुनें। सुनिश्चित करें कि इस नियम के निष्पादित होने पर वह अभी भी मौजूद हो।"
"Choose a header of the selected Tree.": "चयनित ट्री का एक हेडर चुनें।"
"Choose a listed Graph Grouping Style.": "सूचीबद्ध ग्राफ़ समूहन शैली चुनें।"
