"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "Gaano katagal maaaring mawala ang data bago magtala ang RRDtool ng unknown na data.  Dagdagan ang halagang ito kung hindi matatag ang iyong Data Source at nais mong ipagpatuloy ang lumang data sa halip na magpakita ng mga puwang sa iyong mga graph.  Imumultiply ang halagang ito sa X-Files Factor para matukoy ang aktwal na tagal ng oras."
