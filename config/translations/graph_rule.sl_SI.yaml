"A useful name for this Rule.": "Uporabno ime za to pravilo."
"Access denied.": "Dostop zavrnjen."
"Add Graph Rule": "Dodaj pravilo za grafe"
"Back to Graph Rules": "Nazaj na pravila za grafe"
"Cancel": "Prekliči"
"Check this box to enable this rule.": "Označite to polje, da omogočite to pravilo."
"Choose a Data Query to apply to this rule.": "Izberite podatkovno poizvedbo, ki jo uporabite za to pravilo."
"Choose a Graph Type": "Izberite vrsto grafa"
"Choose a Graph Type of the selected Data Query.": "Izberite vrsto grafa izbrane podatkovne poizvedbe."
"Choose an existing Data Query.": "Izberite obstoječo podatkovno poizvedbo."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Izberite katero koli razpoložljivo vrsto grafa izbrane podatkovne poizvedbe, ki jo uporabite za to pravilo."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kliknite Nadaljuj, da izbrišete naslednja pravila za grafe z merili za izbor naprav in ustvarjanje grafov."
"Click Continue to disable the following Graph Rules.": "Kliknite Nadaljuj, da onemogočite naslednja pravila za grafe."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kliknite Nadaljuj, da podvojite naslednja pravila za grafe. Po želji lahko spremenite obliko naslova za nova pravila za grafe, ki so sprva onemogočena."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kliknite Nadaljuj, da omogočite naslednja pravila za grafe. Poskrbite, da so bila uspešno preizkušena."
