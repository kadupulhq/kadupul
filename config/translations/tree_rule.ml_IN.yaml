"Enable Tree Rules": "ട്രീ നിയമങ്ങൾ പ്രവർത്തനക്ഷമമാക്കുക"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "പ്രവർത്തനക്ഷമമാക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ട്രീ നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
