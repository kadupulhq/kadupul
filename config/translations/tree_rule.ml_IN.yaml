"A useful name for this Rule.": "ഈ നിയമത്തിന് ഉപയോഗപ്രദമായ ഒരു പേര്."
"Access denied.": "ആക്സസ് നിഷേധിച്ചു."
"Add Tree Rule": "ട്രീ നിയമം ചേർക്കുക"
"Back to Tree Rules": "ട്രീ നിയമങ്ങളിലേക്ക് മടങ്ങുക"
"Cancel": "റദ്ദാക്കുക"
"Check this box to enable this rule.": "ഈ നിയമം പ്രവർത്തനക്ഷമമാക്കാൻ ഈ ബോക്സ് തിരഞ്ഞെടുക്കുക."
"Choose a Tree for the new Tree Items.": "പുതിയ ട്രീ ഇനങ്ങൾക്കായി ഒരു ട്രീ തിരഞ്ഞെടുക്കുക."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "ചേർക്കാൻ തിരഞ്ഞെടുത്ത ട്രീയുടെ ഒരു ഹെഡർ, അല്ലെങ്കിൽ അതിന്റെ റൂട്ട് തിരഞ്ഞെടുക്കുക. ഈ നിയമം പ്രവർത്തിപ്പിക്കുമ്പോഴും അത് നിലവിലുണ്ടെന്ന് ഉറപ്പാക്കുക."
"Choose a header of the selected Tree.": "തിരഞ്ഞെടുത്ത ട്രീയുടെ ഒരു ഹെഡർ തിരഞ്ഞെടുക്കുക."
"Choose a listed Graph Grouping Style.": "പട്ടികയിലുള്ള ഒരു ഗ്രാഫ് ഗ്രൂപ്പിംഗ് ശൈലി തിരഞ്ഞെടുക്കുക."
"Choose a listed Leaf Item Type.": "പട്ടികയിലുള്ള ഒരു ലീഫ് ഇന തരം തിരഞ്ഞെടുക്കുക."
"Choose an existing Tree.": "നിലവിലുള്ള ഒരു ട്രീ തിരഞ്ഞെടുക്കുക."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ട്രീയിൽ ഈ പ്രത്യേക ഹോസ്റ്റിനായി വരയ്ക്കുമ്പോൾ ഗ്രാഫുകൾ എങ്ങനെ ഗ്രൂപ്പ് ചെയ്യണമെന്ന് തിരഞ്ഞെടുക്കുക. ഉപകരണ ലീഫുകൾക്ക് ഉപയോഗിക്കുന്നു."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "ഇനിപ്പറയുന്ന ട്രീ നിയമങ്ങളും അവയുടെ ഒബ്ജക്റ്റ് തിരഞ്ഞെടുപ്പ്, ട്രീ സൃഷ്ടി മാനദണ്ഡങ്ങളും ഇല്ലാതാക്കാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക."
"Click Continue to disable the following Tree Rules.": "ഇനിപ്പറയുന്ന ട്രീ നിയമങ്ങൾ പ്രവർത്തനരഹിതമാക്കാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "ഇനിപ്പറയുന്ന ട്രീ നിയമങ്ങൾ ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക. പ്രവർത്തനരഹിതമായി ആരംഭിക്കുന്ന പുതിയ ട്രീ നിയമങ്ങളുടെ ശീർഷക ഫോർമാറ്റ് ഓപ്ഷണലായി മാറ്റാം."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "ഇനിപ്പറയുന്ന ട്രീ നിയമങ്ങൾ പ്രവർത്തനക്ഷമമാക്കാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക. അവ വിജയകരമായി പരീക്ഷിച്ചിട്ടുണ്ടെന്ന് ഉറപ്പാക്കുക."
"Continue": "തുടരുക"
"Data Query Index": "ഡാറ്റ ക്വറി ഇൻഡെക്സ്"
"Delete Tree Rules": "ട്രീ നിയമങ്ങൾ ഇല്ലാതാക്കുക"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "ഇല്ലാതാക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ട്രീ നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Delete selected": "തിരഞ്ഞെടുത്തത് ഇല്ലാതാക്കുക"
"Device": "ഉപകരണം"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "ഉപകരണ ലീഫുകൾക്ക് ഗ്രാഫ് അല്ലെങ്കിൽ ഗ്രാഫ് ടെംപ്ലേറ്റ് കോളങ്ങളിലെ മാനദണ്ഡങ്ങൾ ഉപയോഗിക്കാനാവില്ല. ലീഫ് ഇന തരം ഉപകരണം ആയി മാറ്റുമ്പോൾ, ആ മാനദണ്ഡങ്ങൾ നീക്കം ചെയ്യാൻ ഈ ബോക്സ് തിരഞ്ഞെടുക്കുക; അവ വീണ്ടെടുക്കാനാവില്ല."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "ഉപകരണ ലീഫുകൾക്ക് ഗ്രാഫ് അടിസ്ഥാനമാക്കിയ മാനദണ്ഡങ്ങൾ ഉപയോഗിക്കാനാവില്ല. സംരക്ഷിക്കാൻ %count% മാനദണ്ഡങ്ങൾ നീക്കം ചെയ്യുന്നത് സ്ഥിരീകരിക്കുക."
"Disable Tree Rules": "ട്രീ നിയമങ്ങൾ പ്രവർത്തനരഹിതമാക്കുക"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "പ്രവർത്തനരഹിതമാക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ട്രീ നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Disable selected": "തിരഞ്ഞെടുത്തത് പ്രവർത്തനരഹിതമാക്കുക"
"Duplicate Tree Rules": "ട്രീ നിയമങ്ങൾ ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യുക"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ട്രീ നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Duplicate selected": "തിരഞ്ഞെടുത്തത് ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യുക"
