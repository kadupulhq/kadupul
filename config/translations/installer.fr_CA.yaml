"Installed": "Installé"
"Keep a backup of the database, RRD files, configuration and secret material.": "Conservez une sauvegarde de la base de données, des fichiers RRD, de la configuration et du matériel secret."
"Language": "Langue"
"Large tables may require the dedicated CLI conversion tool before installation.": "Les grandes tables peuvent nécessiter l’outil de conversion en ligne de commande dédié avant l’installation."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Laissez les champs secrets vides pour conserver les identifiants enregistrés. Les secrets ne sont jamais réaffichés."
