"waiting": "en attente"
"Accept the license before saving the installation plan.": "Acceptez la licence avant d’enregistrer le plan d’installation."
"Invalid installation form.": "Formulaire d’installation non valide."
"Access denied.": "Accès refusé."
"Confirm the recovery warning before retrying.": "Confirmez l’avertissement de récupération avant de réessayer."
"Review and confirm the current installation plan.": "Examinez et confirmez le plan d’installation actuel."
"Confirm the discovery scope before starting.": "Confirmez la portée de la découverte avant de commencer."
"Resolve the blocking checks before starting.": "Résolvez les vérifications bloquantes avant de commencer."
"Too many installer options.": "Trop d’options d’installation."
"Invalid installer option name.": "Nom d’option d’installation non valide."
"Unknown or malformed installer option.": "Option d’installation inconnue ou mal formée."
"Installer options must be scalar values.": "Les options d’installation doivent être des valeurs scalaires."
"Installer option is too long or contains a null byte.": "Une option d’installation est trop longue ou contient un octet nul."
"Installer IDs and intervals must be whole numbers.": "Les identifiants et intervalles d’installation doivent être des nombres entiers."
"Installer ID or interval is outside its supported range.": "Un identifiant ou intervalle d’installation est hors de la plage prise en charge."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "L’installation n’a pas pu se poursuivre. Actualisez son état et examinez les vérifications bloquantes avant de réessayer."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirmez que le processus précédent est arrêté avant de récupérer son plan."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "La base de données est installée, mais certains collecteurs doivent encore être synchronisés. Vérifiez leur état avant de relancer les tâches de finalisation."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "L’installation s’est arrêtée. Conservez le journal de l’installateur, corrigez la cause et confirmez explicitement une nouvelle tentative. Certaines modifications à la base de données peuvent déjà être validées. Vérifiez le nettoyage des extensions avant d’autoriser une nouvelle tentative."
"Next action": "Prochaine action"
"Follow the execution status. Do not start another attempt while a worker is active.": "Suivez l’état d’exécution. Ne lancez pas d’autre tentative tant qu’un processus est actif."
"Complete the recovery checklist before retrying.": "Suivez la liste de vérification de récupération avant de réessayer."
"Verify collection and graph operation before enabling discovery.": "Vérifiez le fonctionnement de la collecte et des graphiques avant d’activer la découverte."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Résolvez les prérequis bloqués, puis vérifiez de nouveau. Les sélections sauvegardées sont conservées."
"Review the planned changes and backup checklist before authorizing execution.": "Passez en revue les modifications prévues et la liste de vérification des sauvegardes avant d’autoriser l’exécution."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Choisissez un profil de collecte et acceptez la licence. Les paramètres facultatifs peuvent être ouverts au besoin."
"Download installation diagnostics": "Télécharger les diagnostics d’installation"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Ouvrez un graphique et confirmez que ses données RRD s’actualisent après un cycle de collecte."
"Requirement details": "Détails des prérequis"
"Recover": "Récupérer"
"Recovery checklist": "Liste de vérification de récupération"
"Preserve log/cacti.log and record the failed attempt.": "Conservez log/cacti.log et consignez la tentative échouée."
"Confirm that the previous worker and its child processes have stopped.": "Confirmez que le processus précédent et ses processus enfants sont arrêtés."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspectez les modifications validées, la synchronisation des collecteurs et le nettoyage des extensions. Corrigez la cause avant de réessayer."
"Review the saved plan again, then explicitly authorize a retry.": "Passez de nouveau en revue le plan sauvegardé, puis autorisez explicitement une nouvelle tentative."
"Recover a stopped worker": "Récupérer un processus arrêté"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "N’utilisez la récupération qu’après avoir confirmé que cette tentative n’est plus en cours. La récupération n’arrête aucun processus."
"Collector and installation mode": "Collecteur et mode d’installation"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "La configuration du déploiement détermine le rôle du collecteur et les connexions aux bases de données. Vérifiez la configuration du serveur principal avant de démarrer un collecteur."
"Discovery and SNMP settings": "Paramètres de découverte et SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Gardez la découverte désactivée tant que la collecte et la connectivité des collecteurs n’ont pas été vérifiées."
"Template selection": "Sélection des modèles"
"Templates selected for import": "Modèles sélectionnés pour l’importation"
"No templates selected.": "Aucun modèle sélectionné."
"Backup checklist": "Liste de vérification des sauvegardes"
"Database backup and a tested restoration procedure.": "Sauvegarde de la base de données et procédure de restauration testée."
"RRD files and the service account permissions needed to restore them.": "Fichiers RRD et permissions du compte de service nécessaires pour les restaurer."
"Configuration, keys and plugin data outside the database.": "Configuration, clés et données des extensions hors de la base de données."
"Post-installation checks": "Vérifications post-installation"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Les vérifications confirmées ne couvrent que les éléments présentés. Les points non évalués exigent encore une vérification par l’opérateur."
"Operational checks still require operator verification.": "Les vérifications opérationnelles exigent encore une confirmation par l’opérateur."
"Status": "État"
"verified": "Vérifié"
"action_required": "Action requise"
"not_assessed": "Non évalué"
"Database schema": "Schéma de la base de données"
"Stored schema matches the application target.": "Le schéma enregistré correspond à la cible de l’application."
"Target schema completion has not been confirmed.": "L’achèvement du schéma cible n’a pas été confirmé."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Examinez le résultat de l’installation et corrigez les échecs avant de considérer la mise à niveau du schéma comme terminée."
"Installation outcome": "Résultat de l’installation"
"A successful receipt matches the current target schema.": "Un compte rendu de réussite correspond au schéma cible actuel."
"A complete successful installation outcome has not been confirmed.": "La réussite complète de l’installation n’a pas été confirmée."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Conservez le journal de l’installateur et utilisez la procédure explicite de récupération ou de nouvelle tentative au besoin."
"Collector synchronization": "Synchronisation des collecteurs"
"The completed installer reports pending collector synchronization.": "L’installateur terminé signale une synchronisation de collecteurs en attente."
"The completed installer reports no pending collectors.": "L’installateur terminé ne signale aucun collecteur en attente."
"Collector completion remains unconfirmed by this partial receipt.": "Ce compte rendu partiel ne confirme pas l’achèvement des collecteurs."
"Collector completion is not established by this installation outcome.": "Ce résultat d’installation n’établit pas l’achèvement des collecteurs."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Examinez l’état des collecteurs et relancez les tâches de finalisation pour les résultats partiels. Cela ne vérifie pas l’actualité des collectes ultérieures."
"Scheduled collection": "Collecte planifiée"
"No poller or device was contacted by this assessment.": "Aucun processus de collecte ni aucun périphérique n’a été contacté lors de cette évaluation."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Confirmez que le planificateur configuré exécute le processus de collecte sous le compte de service prévu et examinez son prochain cycle normal."
"Graph data": "Données des graphiques"
"Live samples and RRD updates were not exercised.": "Les échantillons en direct et les mises à jour RRD n’ont pas été mis à l’épreuve."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Après un cycle de collecte normal, confirmez que les graphiques attendus reçoivent de nouveaux échantillons et examinez les erreurs de collecte."
"Recovery readiness": "État de préparation à la récupération"
"Backup restoration was not exercised.": "La restauration des sauvegardes n’a pas été testée."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Vérifiez une restauration isolée de la base de données, des fichiers RRD, de la configuration et des clés avant de vous fier à la récupération."
"No persisted local poller start has been recorded.": "Aucun démarrage persistant du processus de collecte local n’a été enregistré."
"Persisted poller timing is invalid and cannot establish scheduler health.": "L’horodatage persistant du processus de collecte est invalide et ne permet pas d’établir le bon état du planificateur."
"The recorded poller start is in the future. Check clock synchronization.": "Le démarrage de collecte enregistré est dans le futur. Vérifiez la synchronisation des horloges."
"The recorded poller start is older than the native scheduling tolerance.": "Le démarrage de collecte enregistré dépasse la tolérance de planification native."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Un démarrage de collecte local a été enregistré dans la tolérance de planification native. L’achèvement et l’état des périphériques ne sont pas vérifiés."
"readable": "lisible"
"missing or unreadable": "absent ou illisible"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaurez la version complète et ses dépendances verrouillées; accordez l’accès en lecture au compte de service."
"PHP temporary directory": "Répertoire temporaire PHP"
"directory writable by this process": "répertoire accessible en écriture pour ce processus"
"missing or not writable": "absent ou non accessible en écriture"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configurez sys_temp_dir sur un répertoire existant accessible en écriture pour le compte d’installation. Les importations natives utilisent des fichiers temporaires."
"Background worker launch": "Lancement du processus en arrière-plan"
"required PHP functions available; launch not exercised": "fonctions PHP requises disponibles; lancement non testé"
"required PHP launch function disabled": "fonction PHP requise pour le lancement désactivée"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Activez exec pour l’environnement PHP web ou utilisez l’installateur en ligne de commande autorisé."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Activez popen et pclose pour l’environnement PHP web ou utilisez l’installateur en ligne de commande autorisé."
"Database transaction ownership": "Propriété des transactions de la base de données"
"autocommit enabled; no caller-owned transaction": "autocommit activé; aucune transaction appartenant à l’appelant"
"autocommit disabled or caller transaction active": "autocommit désactivé ou transaction de l’appelant active"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Exécutez l’installation hors d’une transaction appartenant à l’appelant et activez autocommit sur sa connexion de modification."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaurez le répertoire de la version et accordez au compte d’installation un accès en écriture pour importer les ressources des modèles. Ne le rendez pas accessible en écriture à tous."
"Worker file: install/background.php": "Fichier du processus : install/background.php"
"Worker file: bin/legacy-installer.php": "Fichier du processus : bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fichier du processus : include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destination d’importation : resource/snmp_queries"
"Import destination: resource/script_server": "Destination d’importation : resource/script_server"
"Import destination: resource/script_queries": "Destination d’importation : resource/script_queries"
"Import destination: scripts": "Destination d’importation : scripts"
"Database privileges": "Privilèges de la base de données"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Les privilèges effectifs de migration, y compris les rôles actifs et les droits propres aux objets, n’ont pas été vérifiés."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Demandez à l’administrateur de la base de données de vérifier les écritures de tables, les modifications de schéma, les déclencheurs et les routines requis pour le compte et le schéma d’installation. N’accordez pas de privilèges d’administration globaux."
"Compare web and worker runtimes": "Comparer les environnements d’exécution web et de travail"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Cette action lance explicitement une courte sonde PHP en lecture seule. Elle ne réserve aucun programme d’installation, n’écrit aucun fichier et ne contacte aucun périphérique."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "La sonde hérite de ce processus web et utilise l’interpréteur PHP configuré pour le programme d’installation. Elle n’inspecte aucun planificateur ni service distinct."
"I authorize the read-only worker runtime comparison.": "J’autorise la comparaison en lecture seule de l’environnement d’exécution de travail."
"Compare runtimes": "Comparer les environnements d’exécution"
"Runtime comparison results": "Résultats de la comparaison des environnements d’exécution"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Les différences de droits et d’identité peuvent être intentionnelles. Les observations en lecture seule ne prouvent pas que les écritures ou l’installation réussiront."
"Confirm the read-only worker runtime comparison.": "Confirmez la comparaison en lecture seule de l’environnement d’exécution de travail."
"The runtime comparison is unavailable.": "La comparaison des environnements d’exécution est indisponible."
"Shared application secret": "Secret partagé de l’application"
"A strong web application secret is required before comparison.": "Un secret d’application web robuste est requis avant la comparaison."
"Runtime comparison": "Comparaison des environnements d’exécution"
"The configured worker runtime did not confirm a bounded comparison.": "L’environnement d’exécution de travail configuré n’a pas confirmé la comparaison dans les limites prévues."
"The inherited worker secret could not be confirmed against the web secret.": "La correspondance entre le secret hérité du processus de travail et le secret web n’a pas pu être confirmée."
"PHP runtime comparison": "Comparaison de l’environnement d’exécution PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Les deux environnements d’exécution doivent prendre en charge PHP 8.4; les différences de version corrective doivent être examinées."
"Required extension comparison": "Comparaison des extensions requises"
"Required extension availability is checked; differing versions require review.": "La disponibilité des extensions requises est vérifiée; les différences de version doivent être examinées."
"Process identity comparison": "Comparaison des identités des processus"
"Effective process identity is unavailable on this platform.": "L’identité effective du processus est indisponible sur cette plateforme."
"Effective process identities match.": "Les identités effectives des processus correspondent."
"Effective process identities differ; separate service accounts may be intentional.": "Les identités effectives des processus diffèrent; des comptes de service distincts peuvent être intentionnels."
"Directory access comparison": "Comparaison des accès aux répertoires"
"Read-only directory permission observations match.": "Les observations en lecture seule des droits sur les répertoires correspondent."
"Directory locations or permission observations differ; review the service-account roles.": "Les emplacements des répertoires ou les observations de droits diffèrent; examinez les rôles des comptes de service."
"Worker directory read and traversal": "Lecture et parcours des répertoires du processus de travail"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Les répertoires requis du processus de travail doivent exister et permettre la lecture et le parcours. Aucune écriture n’a été testée."
"The inherited worker secret matches the web secret for this private challenge.": "Le secret hérité du processus de travail correspond au secret web pour ce défi privé."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Examinez l’interpréteur PHP configuré, les extensions requises, le secret hérité et les droits des comptes de service sur les répertoires. Aucune écriture ni aucun démarrage du programme d’installation n’a été exécuté."
"advisory": "à examiner"
