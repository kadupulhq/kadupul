"I accept the license terms": "J’accepte les conditions de la licence"
"I authorize discovery of the displayed range": "J’autorise la découverte de la plage affichée"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "J’ai vérifié le journal et confirmé que le processus précédent et ses processus enfants sont arrêtés"
"I checked the previous attempt and accept that some changes may already be committed": "J’ai vérifié la tentative précédente et j’accepte que certaines modifications soient déjà validées"
"I reviewed this plan and have the required backups": "J’ai examiné ce plan et je dispose des sauvegardes nécessaires"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Si un processus s’arrête de façon inattendue, conservez log/cacti.log et confirmez la fin de son processus avant de réessayer explicitement. Un état en attente ne confirme pas un démarrage réussi."
