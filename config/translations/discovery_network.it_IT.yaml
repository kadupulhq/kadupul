"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Le pianificazioni giornaliere e settimanali usano l'avvio e Ripeti ogni; quelle settimanali usano anche Giorni della settimana. Quelle mensili usano Mesi e Giorni del mese; Mensile per giorno usa Mesi, Settimane del mese e Giorni della settimana."
