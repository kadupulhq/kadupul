"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Elenco delimitato da spazi di server DNS alternativi da usare per la risoluzione DNS. Se lasciato vuoto, verrà usato il sistema operativo del poller per risolvere i nomi DNS."
"Access denied.": "Accesso negato."
"Add Discovery Network": "Aggiungi rete di rilevamento"
"After an initial failure, the number of ping retries to attempt before failing.": "Dopo un errore iniziale, il numero di tentativi ping da eseguire prima di segnalare l'errore."
"After the selected Run Limit, the discovery process will be terminated.": "Dopo il limite di esecuzione selezionato, il processo di rilevamento verrà terminato."
