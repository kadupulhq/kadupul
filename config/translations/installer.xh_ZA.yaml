"Configuring collection profiles": "Kuqwalaselwa iiprofayili zokuqokelela"
"Configuring discovery": "Kuqwalaselwa ufumaniso"
"Configuring the local device": "Kuqwalaselwa isixhobo sasekhaya"
"Confirming database version": "Kuqinisekiswa uguqulelo lwesiseko sedatha"
"Converting selected tables": "Kuguqulwa iitheyibhile ezikhethiweyo"
"Database version": "Uguqulelo lwesiseko sedatha"
"Disabled": "Ikhubaziwe"
"Discovery": "Ufumaniso"
"Discovery SNMP settings": "Iisetingi ze-SNMP zoFumaniso"
"Discovery range": "Uluhlu lofumaniso"
"Enable discovery after installation": "Vula ufumaniso emva kofakelo"
"Executable paths": "Iimendo eziqhutywayo"
"Execution status": "Isimo sokuqhuba"
"Finished execution": "Ugqibile ukusebenza"
"Finishing tasks only. Schema migrations will not be replayed.": "Kugqityezelwa imisebenzi kuphela. Ukufuduswa kwe-schema akuyi kuphindwa."
"I accept the license terms": "Ndiyayamkela imiqathango yelayisensi"
"I authorize discovery of the displayed range": "Ndikugunyazisile ukufunyanwa koluhlu olubonisiweyo"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Ndiyijongile ilog ndaza ndaqinisekisa ukuba umsebenzi wangaphambili neenkqubo zakhe ezingabantwana zimile"
"I checked the previous attempt and accept that some changes may already be committed": "Ndilijongile ilinge langaphambili kwaye ndiyavuma ukuba olunye utshintsho lusenokuba selugqityiwe"
"I reviewed this plan and have the required backups": "Ndilijongile eli cebo kwaye ndinee-backup ezifunekayo"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ukuba umsebenzi uyeka ngokungalindelekanga, gcina i-log/cacti.log kwaye uqinisekise ukuba inkqubo yakhe iphelile ngaphambi kokuzama kwakhona ngokucacileyo. Imeko yokulinda ayiqinisekisi ukuqaliswa okuyimpumelelo."
"Importing templates": "Kungeniswa iithempleyithi"
"Install Kadupul": "Faka i-Kadupul"
"Installation and upgrade": "Ukufaka nokuphucula"
"Installation request was rejected.": "Isicelo sokufaka saliwe."
"Installation steps": "Amanyathelo okufaka"
"Installed": "IFakiwe"
"Keep a backup of the database, RRD files, configuration and secret material.": "Gcina i-backup yesiseko sedatha, iifayile ze-RRD, ulungiselelo kunye nezinto eziyimfihlo."
"Language": "Ulwimi"
"Large tables may require the dedicated CLI conversion tool before installation.": "Iitafile ezinkulu zinokufuna isixhobo sokuguqula se-CLI esizinikeleyo ngaphambi kokufaka."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Shiya imihlaba eyimfihlo ingenanto ukuze ugcine iziqinisekiso ezigciniweyo. Iimfihlo azikhe ziboniswe kwakhona."
"License": "Ilayisensi"
"No action needed": "Akukho senzo sifunekayo"
"Observed": "Kuqatshelwe"
"Open the console": "Vula i-console"
"Operation": "Umsebenzi"
"Override discovery SNMP settings": "Bhala ngaphezulu iisetingi zokufumanisa ze-SNMP"
"Pass": "Phumelela"
"Poller interval in seconds": "Ixesha eliphakathi le-poller ngemizuzwana"
"Preparing CSRF protection": "Kulungiswa ukhuseleko lwe-CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Inkqubela-phambili ibonisa isigaba sokugqibela esirekhodiweyo. Ukuhlaziya eli phepha akukhe kuqalise okanye kuzame kwakhona umsebenzi."
"Recover stopped attempt": "Buyisela ilinge elimisiweyo"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Ukubuyisela kugcina ukhetho olugciniweyo kwaye akukhe kuphelise umsebenzi ophilayo. Jonga icebo kwakhona ngaphambi kokuzama kwakhona."
"Review": "Jonga kwakhona"
"Review installation plan": "Jonga icebo lokufaka"
"Run": "Qhuba"
"Run reviewed plan": "Qhuba icebo elijongiweyo"
"Save and review": "Gcina kwaye ujonge kwakhona"
"Scope": "Umda wokusebenza"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Imeko ayifumaneki. Umsebenzi ogciniweyo ugcinwe. Hlaziya ukuze uqhagamshele kwakhona; musa ukuthumela olunye ufakelo."
"Synchronizing collectors": "Ingqamanisa abaqokeleli"
"Table conversions": "Ukuguqulwa kweteyibhile"
"Templates": "Iitempleyithi"
"The database version matches this application. Installation does not establish that polling is healthy.": "Uguqulelo lwesiseko sedatha luyahambelana nale aplikheyishini. Ufakelo alubonisi ukuba ukuqokelela kusebenza kakuhle."
"The request outcome is unknown. Check execution status before retrying.": "Isiphumo sesicelo asaziwa. Jonga imeko yokusebenza ngaphambi kokuzama kwakhona."
"Theme": "Umxholo"
"Verify": "Qinisekisa"
"Verify the poller schedule and service account.": "Qinisekisa ishedyuli ye-poller kunye ne-akhawunti yenkonzo."
"Version change": "Utshintsho loguqulelo"
"Waiting for the installation worker": "Ilindele umsebenzi wesifaki"
"collector": "umqokeleli"
"complete": "igqityiwe"
"failed": "ayiphumelelanga"
"finish": "gqiba"
"install": "faka"
"not_started": "ayikaqalwa"
"partial": "inxenye"
"running": "iyasebenza"
"succeeded": "iphumelele"
"upgrade": "phucula"
"waiting": "ilindile"
"Accept the license before saving the installation plan.": "Yamkela ilayisensi phambi kokugcina isicwangciso sofakelo."
"Invalid installation form.": "Ifomu yokufaka engasebenziyo."
"Access denied.": "Ufikelelo lwaliwe."
"Confirm the recovery warning before retrying.": "Qinisekisa isilumkiso sokubuyisela phambi kokuzama kwakhona."
"Review and confirm the current installation plan.": "Jonga kwakhona kwaye uqinisekise icebo langoku lokufaka."
"Confirm the discovery scope before starting.": "Qinisekisa ububanzi bofumaniso phambi kokuqala."
"Resolve the blocking checks before starting.": "Sombulula iitshekhi ezithintelayo ngaphambi kokuqala."
"Too many installer options.": "Iinketho zesifaki ezininzi kakhulu."
"Invalid installer option name.": "Igama lokhetho lomfakeli elingasebenziyo."
"Unknown or malformed installer option.": "Ukhetho lwesifaki olungaziwayo okanye olungamelanga kakuhle."
"Installer options must be scalar values.": "Ukhetho lomfakeli kufuneka lube ngamaxabiso e-scalar."
"Installer option is too long or contains a null byte.": "Ukhetho lomfakeli lude kakhulu okanye luqulethe i-null byte."
"Installer IDs and intervals must be whole numbers.": "Ii-ID zomfakeli kunye namaxesha kufuneka abe ngamanani apheleleyo."
"Installer ID or interval is outside its supported range.": "I-ID yomfakeli okanye ixesha lingaphandle koluhlu lwayo oluxhaswayo."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Ufakelo alukwazanga ukuqhubeka. Layisha kwakhona imeko yalo kwaye uhlole iimhlolo ezivimbayo ngaphambi kokuzama kwakhona."
"Confirm that the previous worker has stopped before recovering its plan.": "Qinisekisa ukuba umsebenzi wangaphambili umile phambi kokubuyisela isicwangciso sawo."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Isiseko sedatha sifakiwe, kodwa abanye abaqokeleli basafuna ungqamaniso. Zama kwakhona imisebenzi yokugqibezela emva kokujonga imeko yabo."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Ukufaka kumile. Gcina ilog yomfakeli, lungisa unobangela kwaye uqinisekise ngokucacileyo ukuzama kwakhona. Olunye utshintsho lwesiseko sedatha lusenokuba selugqityiwe. Jonga ukucocwa kwe-plugin ngaphambi kokugunyazisa ukuzama kwakhona."
"Next action": "Isenzo esilandelayo"
"Follow the execution status. Do not start another attempt while a worker is active.": "Landela imeko yokusebenza. Musa ukuqalisa elinye ilinge ngelixa umsebenzi osebenzayo esasebenza."
"Complete the recovery checklist before retrying.": "Gqibezela uluhlu lokuhlola ukubuyisela phambi kokuzama kwakhona."
"Verify collection and graph operation before enabling discovery.": "Qinisekisa ukusebenza koqokelelo kunye negrafu ngaphambi kokuvula ukufumanisa."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Sombulula iimfuno ezivaliweyo, uze ujonge kwakhona. Ukhetho olugciniweyo luyagcinwa."
"Review the planned changes and backup checklist before authorizing execution.": "Jonga utshintsho olucwangcisiweyo kunye noluhlu lokutshekisha lwe-backup ngaphambi kokugunyazisa ukusetyenziswa."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Khetha iprofayili yokuqokelela uze wamkele ilayisensi. Iisetingi ezikhethekileyo zingavulwa xa zifuneka."
"Download installation diagnostics": "Khuphela uxilongo lofakelo"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Vula igrafu uze uqinisekise ukuba idatha yayo ye-RRD iyahlaziyeka emva komjikelo we-poller."
"Requirement details": "Iinkcukacha zeemfuno"
"Recover": "Buyisela"
"Recovery checklist": "Uluhlu lokutshekisha lokubuyisela"
"Preserve log/cacti.log and record the failed attempt.": "Gcina i-log/cacti.log kwaye urekhode ilinge elisileleyo."
"Confirm that the previous worker and its child processes have stopped.": "Qinisekisa ukuba umsebenzi wangaphambili kunye neenkqubo zawo ezingabantwana zimile."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Hlola utshintsho olugqityiweyo, ungqamaniso lomqokeleli kunye nokucocwa kwe-plugin. Lungisa unobangela ngaphambi kokuzama kwakhona."
"Review the saved plan again, then explicitly authorize a retry.": "Jonga icebo eligciniweyo kwakhona, uze ugunyazise ngokucacileyo ukuzama kwakhona."
"Recover a stopped worker": "Buyisela umsebenzi omisiweyo"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Sebenzisa ukubuyisela kuphela emva kokuqinisekisa ukuba olu zamo alusasebenzi. Ukubuyisela akumisi inkqubo."
"Collector and installation mode": "Umqokeleli kunye nemo yofakelo"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Uqwalaselo lokuthumela lumisela indima yomqokeleli kunye noqhagamshelwano lwesiseko sedatha. Qinisekisa uqwalaselo lweseva ephambili ngaphambi kokuqalisa umqokeleli."
"Discovery and SNMP settings": "Ufumaniso kunye neesetingi ze-SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Gcina ukufunyanwa kukhubaziwe de ukuqokelela kunye nonxibelelwano lomqokeleli kuqinisekiswe."
"Template selection": "Ukhetho lwetempleyithi"
"Templates selected for import": "Iitempleyithi ezikhethelwe ukungeniswa"
"No templates selected.": "Akukho zithempleyithi zikhethiweyo."
"Backup checklist": "Uluhlu lokuhlola ikopi yogcino"
"Database backup and a tested restoration procedure.": "Ikopi yokugcina yesiseko sedatha kunye nenkqubo yokubuyisela evavanyiweyo."
"RRD files and the service account permissions needed to restore them.": "Iifayile ze-RRD kunye neemvume ze-akhawunti yenkonzo ezifunekayo ukuze zibuyiselwe."
"Configuration, keys and plugin data outside the database.": "Uqwalaselo, izitshixo kunye nedatha yeplagini ngaphandle kwesiseko sedatha."
"Post-installation checks": "Iitshekhi zasemva kokufaka"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Iimhlolo eziqinisekisiweyo zigubungela kuphela ubungqina obubonisiweyo. Iimhlolo ezingavavanywanga zisafuna uqinisekiso lomsebenzisi."
"Operational checks still require operator verification.": "Iitshekhi zokusebenza zisafuna ukuqinisekiswa ngumqhubi."
"Status": "Imeko"
"verified": "iqinisekisiwe"
"action_required": "kufuneka isenzo"
"not_assessed": "ayivavanywanga"
"Database schema": "Isakhelo sesiseko sedatha"
"Stored schema matches the application target.": "Iskima esigciniweyo siyahambelana nethagethi ye-aplikheyishini."
"Target schema completion has not been confirmed.": "Ukugqitywa kweskima ekujoliswe kuso akuqinisekiswanga."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Jonga isiphumo sokufaka kwaye usombulule ukusilela ngaphambi kokuthatha ukuphuculwa kwe-schema njengokugqityiweyo."
"Installation outcome": "Isiphumo sokufaka"
"A successful receipt matches the current target schema.": "Irisithi eyimpumelelo iyafana nesakhelo esikhoyo ekujoliswe kuso."
"A complete successful installation outcome has not been confirmed.": "Isiphumo sofakelo oluyimpumelelo olupheleleyo asikaqinisekiswa."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Gcina ilog yomfakeli kwaye usebenzise inkqubo ecacileyo yokubuyisela okanye yokuzama kwakhona xa kufuneka."
"Collector synchronization": "Ungqamaniso lomqokeleli"
"The completed installer reports pending collector synchronization.": "Isifaki esigqityiweyo sixela ungqamaniso lwabaqokeleli olulindileyo."
"The completed installer reports no pending collectors.": "Isifaki esigqityiweyo asixeli abaqokeleli abalindileyo."
"Collector completion remains unconfirmed by this partial receipt.": "Ukugqitywa komqokeleli akukaqinisekiswa yile risithi engaphelelanga."
"Collector completion is not established by this installation outcome.": "Ukugqitywa komqokeleli akufunyanwanga sesi siphumo sofakelo."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Jonga imeko yomqokeleli kwaye uzame kwakhona imisebenzi yokugqibezela kwiziphumo ezinxalenye. Oku akuqinisekisi ubutsha bokuqokelela kamva."
"Scheduled collection": "Uqokelelo olucwangcisiweyo"
"No poller or device was contacted by this assessment.": "Akukho poller okanye sixhobo esiqhagamshelweyo kolu vavanyo."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Qinisekisa ukuba umcwangcisi oqwalaselweyo uqhuba i-poller njenge-akhawunti yenkonzo ecetyiweyo kwaye uphonononge umjikelo wayo olandelayo oqhelekileyo."
"Graph data": "Idatha yegrafu"
"Live samples and RRD updates were not exercised.": "Iisampuli ezibukhoma kunye nohlaziyo lwe-RRD azizange zisetyenziswe."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Emva komjikelo oqhelekileyo wokuqokelela, qinisekisa ukuba iigrafu ezilindelekileyo zifumana iisampulu ezintsha kwaye uhlole iimpazamo ze-poller."
"Recovery readiness": "Ukulungela ukubuyisela"
"Backup restoration was not exercised.": "Ukubuyiselwa kwekopi yogcino akuzange kusetyenziswe."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Qinisekisa ukubuyiselwa okuhlukanisiweyo kwesiseko sedatha, iifayile ze-RRD, uqwalaselo kunye nezixhobo zezitshixo ngaphambi kokuthembela ekubuyiseleni."
"No persisted local poller start has been recorded.": "Akukho siqalo se-poller yendawo esigciniweyo esirekhodiweyo."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Ixesha le-poller eligciniweyo alisebenzi kwaye alinakuseka impilo yeshedyula."
"The recorded poller start is in the future. Check clock synchronization.": "Ukuqala kwe-poller okurekhodiweyo kukwixesha elizayo. Jonga ungqamaniso lwewotshi."
"The recorded poller start is older than the native scheduling tolerance.": "Ukuqala kwe-poller okurekhodiweyo kudala kunokunyamezelwa kokucwangcisa kwemveli."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Ukuqalisa kwe-poller yasekhaya kubhalwe ngaphakathi komda woxolelo lwendalo wokucwangcisa. Ukugqitywa kunye nempilo yesixhobo aziqinisekiswanga."
"readable": "iyafundeka"
"missing or unreadable": "ilahlekile okanye ayifundeki"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Buyisela i-release epheleleyo kunye nezixhomekeko zayo ezitshixiweyo; nika i-akhawunti yenkonzo ufikelelo lokufunda."
"PHP temporary directory": "Ulawulo lwethutyana lwe-PHP"
"directory writable by this process": "uvimba ubhaleka yile nkqubo"
"missing or not writable": "ilahlekile okanye ayibhaleki"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Qwalasela i-sys_temp_dir njengovimba weefayili okhoyo obhalwayo yi-akhawunti yofakelo. Ukungenisa kwemveli kusebenzisa iifayili zethutyana."
"Background worker launch": "Ukuphehlelelwa komsebenzi wangaphambili"
"required PHP functions available; launch not exercised": "imisebenzi ye-PHP efunekayo iyafumaneka; ukuqaliswa akuvavanywanga"
"required PHP launch function disabled": "umsebenzi wokuqalisa we-PHP ofunekayo ukhibaziwe"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Vula i-exec kwixesha lokusebenza le-PHP yewebhu, okanye usebenzise umfakeli ogunyazisiweyo we-CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Vula i-popen, pclose kwixesha lokusebenza le-PHP yewebhu, okanye usebenzise umfakeli ogunyazisiweyo we-CLI."
"Database transaction ownership": "Ubunini bentengiselwano yesiseko sedatha"
"autocommit enabled; no caller-owned transaction": "i-autocommit ivuliwe; akukho ntengiselwano ephethwe ngumnxibelelisi"
"autocommit disabled or caller transaction active": "i-autocommit ikhubaziwe okanye intengiselwano yomnxibelelisi iyasebenza"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Qhuba ukufaka ngaphandle kwe-transaction ephethwe ngumbizi kwaye uvule i-autocommit kunxibelelwano lwayo lotshintsho."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Buyisela ulawulo lwe-release kwaye unike i-akhawunti yokufaka ufikelelo lokubhala lokungenisa izixhobo zethempleyithi. Musa ukuyenza ibhaleke kwihlabathi."
"Worker file: install/background.php": "Ifayile yomsebenzi: install/background.php"
"Worker file: bin/legacy-installer.php": "Ifayile yomsebenzi: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Ifayile yomsebenzi: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Indawo yokungenisa: resource/snmp_queries"
"Import destination: resource/script_server": "Indawo yokungenisa: resource/script_server"
"Import destination: resource/script_queries": "Indawo yokungenisa: resource/script_queries"
"Import destination: scripts": "Indawo yokungenisa: scripts"
"Database privileges": "Amalungelo esiseko sedatha"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Amalungelo asebenzayo okufudusa, kuquka iindima ezisebenzayo kunye nezibonelelo ezikhethekileyo zezinto, awazange aqinisekiswe."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Cela umlawuli wesiseko sedatha aqinisekise ukubhalwa kwetafile okufunekayo, utshintsho lwe-schema, ii-trigger kunye nee-routine ze-akhawunti yokufaka kunye ne-schema. Musa ukunika amalungelo omlawuli wehlabathi lonke."
"Compare web and worker runtimes": "Thelekisa amaxesha okusebenza ewebhu kunye nawomsebenzi"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Oku kuqala ngokucacileyo uvavanyo olufutshane lokufunda kuphela lwe-PHP. Akugcini isifaki, akubhali iifayile okanye kuqhagamshelane nezixhobo."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Uvavanyo luzuza njengelifa le nkqubo yewebhu kwaye lusebenzisa umguquleli we-PHP wesifaki oqwalaselweyo. Aluhloli ishedyula okanye inkonzo eyahlukileyo."
"I authorize the read-only worker runtime comparison.": "Ndikugunyazisile ukuthelekiswa kokusebenza kwabasebenzi bokufunda kuphela."
"Compare runtimes": "Thelekisa amaxesha okusebenza"
"Runtime comparison results": "Iziphumo zothelekiso lokusebenza"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Umahluko wemvume nowobunjani unokuba ngowabom. Uqaphelo lokufunda kuphela alubonakalisi ukuba ukubhala okanye ukufaka kuya kuphumelela."
"Confirm the read-only worker runtime comparison.": "Qinisekisa uthelekiso lwexesha lokusebenza lomsebenzi olufundwa kuphela."
"The runtime comparison is unavailable.": "Uthelekiso lwexesha lokusebenza alufumaneki."
"Shared application secret": "Imfihlo ye-aplikheyishini ekwabelwana ngayo"
"A strong web application secret is required before comparison.": "Imfihlo eyomeleleyo ye-web application iyafuneka phambi kokuthelekisa."
"Runtime comparison": "Uthelekiso lokusebenza"
"The configured worker runtime did not confirm a bounded comparison.": "Ixesha lokuqhuba lomsebenzi oqwalaselweyo aluqinisekisanga uthelekiso olunomda."
"The inherited worker secret could not be confirmed against the web secret.": "Imfihlo yomsebenzi efumaneke njengelifa ayikwazanga ukuqinisekiswa ngokuchasene nemfihlo yewebhu."
"PHP runtime comparison": "Uthelekiso lokusebenza kwe-PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Omabini amaxesha okusebenza kufuneka axhase i-PHP 8.4; iinguqulelo zesiqendu ezahlukileyo zifuna uphononongo."
"Required extension comparison": "Uthelekiso lwe-extension efunekayo"
"Required extension availability is checked; differing versions require review.": "Ukufumaneka kwe-extension efunekayo kuyajongwa; iinguqulelo ezahlukeneyo zifuna uhlaziyo."
"Process identity comparison": "Uthelekiso lobunjani benkqubo"
"Effective process identity is unavailable on this platform.": "Iinkcukacha zenkqubo esebenzayo azifumaneki kweli qonga."
"Effective process identities match.": "Iinkcukacha zenkqubo esebenzayo ziyafana."
"Effective process identities differ; separate service accounts may be intentional.": "Iinkcukacha zenkqubo esebenzayo ziyahluka; ii-akhawunti zenkonzo ezahlukeneyo zingaba zenziwe ngabom."
"Directory access comparison": "Uthelekiso lofikelelo kuvimba weefayili"
"Read-only directory permission observations match.": "Uqaphelo lwemvume yolawulo lokufunda kuphela luyahambelana."
"Directory locations or permission observations differ; review the service-account roles.": "Iindawo zovimba weefayili okanye imibono yemvume iyahluka; hlola iindima ze-service-account."
"Worker directory read and traversal": "Ukufunda nokuhamba kuvimba womsebenzi"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Ulawulo lwabasebenzi olufunekayo kufuneka lubekho kwaye luvumele ukufunda kunye nokuhamba phakathi kwalo. Akukho kubhala kuvavanyiweyo."
"The inherited worker secret matches the web secret for this private challenge.": "Imfihlo yomsebenzi efumaneke njengelifa iyahambelana nemfihlo yewebhu yalo mceli mngeni wabucala."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Jonga i-interpreter ye-PHP elungiselelweyo, ii-extension ezifunekayo, imfihlo efumaneka njengelifa kunye neemvume zolawulo lwe-akhawunti yenkonzo. Akukho kubhala okanye ukuqaliswa komfakeli okuvavanyiweyo."
"advisory": "ingcebiso"
