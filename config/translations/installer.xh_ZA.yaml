"Action": "Inyathelo"
"Advanced options": "Iinketho eziphezulu"
"Applying database upgrades": "Ukusetyenziswa kophuculo lwesiseko sedatha"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Yenza ikopi yokugcina yesiseko sedatha, iifayili ze-RRD, uqwalaselo kunye nezitshixo. Uphuculo lwesiseko sedatha lunokwenza utshintsho olungenakubuyiselwa umva ngokubuyisela i-application."
"Blocked": "Ivaliwe"
"Check": "Hlola"
"Check again": "Hlola kwakhona"
"Check collection freshness and collector connectivity before enabling discovery.": "Hlola ubutsha bokuqokelela kunye noqhagamshelo lomqokeleli phambi kokuvula ufumaniso."
"Check requirements": "Hlola iimfuneko"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Uhlolo luhlola le nkqubo kunye neemvume zefayili yesixokelelwano. Alubhali iifayili zovavanyo okanye luqhagamshelane nezixhobo."
"Collection profile": "Iprofayili yokuqokelela"
"Collector": "Umqokeleli"
