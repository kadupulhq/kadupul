"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "प्रभावित रिमोट सङ्कलकहरू अनलाइन हुनुपर्छ। असफल हटाइले रिमोट वा प्लगइन परिवर्तनहरू छोड्न सक्छ; पुनः प्रयास गर्नुअघि नतिजा निरीक्षण गर्नुहोस्।"
