"Remote collectors must be online. Reload and verify the device after a failed assignment before retrying.": "रिमोट सङ्कलकहरू अनलाइन हुनुपर्छ। तोक्ने कार्य असफल भएपछि पुनः प्रयास गर्नुअघि रिलोड गरी उपकरण प्रमाणित गर्नुहोस्।"
