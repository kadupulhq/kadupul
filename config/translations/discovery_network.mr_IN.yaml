"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS रिझोल्यूशनसाठी वापरण्यासाठी पर्यायी DNS सर्व्हर्सची स्पेसने विभक्त केलेली सूची. रिकामे असल्यास, DNS नावे रिझॉल्व्ह करण्यासाठी पोलर OS वापरला जाईल."
