"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "RRDtool ಅಜ್ಞಾತ ಡೇಟಾವನ್ನು ದಾಖಲಿಸುವ ಮೊದಲು ಡೇಟಾ ಎಷ್ಟು ಕಾಲ ಕಾಣೆಯಾಗಿರಬಹುದು.  ನಿಮ್ಮ ಡೇಟಾ ಮೂಲ ಅಸ್ಥಿರವಾಗಿದ್ದರೆ ಮತ್ತು ನಿಮ್ಮ ಗ್ರಾಫ್‌ಗಳಲ್ಲಿ ಅಂತರಗಳನ್ನು ತೋರಿಸುವ ಬದಲು ಹಳೆಯ ಡೇಟಾವನ್ನು ಮುಂದುವರಿಸಲು ಬಯಸಿದರೆ ಈ ಮೌಲ್ಯವನ್ನು ಹೆಚ್ಚಿಸಿ.  ನಿಜವಾದ ಸಮಯವನ್ನು ನಿರ್ಧರಿಸಲು ಈ ಮೌಲ್ಯವನ್ನು X-Files ಫ್ಯಾಕ್ಟರ್‌ನಿಂದ ಗುಣಿಸಲಾಗುತ್ತದೆ."
