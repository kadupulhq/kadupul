"The amount of unknown data that can still be regarded as known.": "ಇನ್ನೂ ತಿಳಿದಿರುವುದೆಂದು ಪರಿಗಣಿಸಬಹುದಾದ ಅಜ್ಞಾತ ಡೇಟಾದ ಪ್ರಮಾಣ."
"The default Data Source Profile cannot be deleted.": "ಡೀಫಾಲ್ಟ್ ಡೇಟಾ ಮೂಲ ಪ್ರೊಫೈಲ್ ಅನ್ನು ಅಳಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ."
"The default profile and profiles in use by Data Templates or Data Sources cannot be deleted.": "ಡೀಫಾಲ್ಟ್ ಪ್ರೊಫೈಲ್ ಮತ್ತು ಡೇಟಾ ಟೆಂಪ್ಲೇಟ್‌ಗಳು ಅಥವಾ ಡೇಟಾ ಮೂಲಗಳು ಬಳಸುತ್ತಿರುವ ಪ್ರೊಫೈಲ್‌ಗಳನ್ನು ಅಳಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ."
"The frequency that data will be collected from the Data Source.": "ಡೇಟಾ ಮೂಲದಿಂದ ಡೇಟಾ ಸಂಗ್ರಹಿಸುವ ಆವರ್ತನ."
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "RRA ವಿಶೇಷತೆಯಲ್ಲಿ ಒಂದು ಸಾಲನ್ನು ತುಂಬುವ ಮೊದಲು ಅಗತ್ಯವಿರುವ ಮಾದರಿಗಳ ಸಂಖ್ಯೆ.  ಮೊದಲ RRA ಯಾವಾಗಲೂ 1 ರ ಮೌಲ್ಯವನ್ನು ಹೊಂದಿರಬೇಕು."
"The polling interval, X-Files Factor, Consolidation Functions and RRAs cannot be changed.": "ಪೋಲಿಂಗ್ ಅಂತರ, X-Files ಫ್ಯಾಕ್ಟರ್, ಕನ್ಸಾಲಿಡೇಶನ್ ಫಂಕ್ಷನ್‌ಗಳು ಮತ್ತು RRA ಗಳನ್ನು ಬದಲಾಯಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ."
"This legacy Data Source Profile form has expired. Open Data Source Profiles and submit a new form.": "ಈ ಹಳೆಯ ಡೇಟಾ ಮೂಲ ಪ್ರೊಫೈಲ್ ಫಾರ್ಮ್‌ನ ಅವಧಿ ಮುಗಿದಿದೆ. ಡೇಟಾ ಮೂಲ ಪ್ರೊಫೈಲ್‌ಗಳನ್ನು ತೆರೆದು ಹೊಸ ಫಾರ್ಮ್ ಅನ್ನು ಸಲ್ಲಿಸಿ."
