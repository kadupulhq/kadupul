"To change the default, mark another profile as the default.": "ಡೀಫಾಲ್ಟ್ ಬದಲಾಯಿಸಲು, ಇನ್ನೊಂದು ಪ್ರೊಫೈಲ್ ಅನ್ನು ಡೀಫಾಲ್ಟ್ ಎಂದು ಗುರುತಿಸಿ."
