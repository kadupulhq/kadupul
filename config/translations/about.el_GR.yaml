"About Kadupul": "Σχετικά με το Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Το Kadupul είναι ένα ανεξάρτητο έργο ανοιχτού κώδικα για παρακολούθηση δικτύων και σχεδίαση γραφημάτων χρονοσειρών."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Η ανάπτυξη, οι συνεισφορές και οι αποφάσεις εκδόσεων διαχειρίζονται από τον οργανισμό Kadupul."
"For documentation and support, visit the Kadupul project.": "Για τεκμηρίωση και υποστήριξη, επισκεφθείτε το έργο Kadupul."
