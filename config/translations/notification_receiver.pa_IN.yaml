"SNMPv3 authentication and privacy passphrases require at least 8 bytes.": "SNMPv3 ਪ੍ਰਮਾਣੀਕਰਨ ਅਤੇ ਪ੍ਰਾਈਵੇਸੀ ਪਾਸਫ਼੍ਰੇਜ਼ ਲਈ ਘੱਟੋ-ਘੱਟ 8 ਬਾਈਟ ਲੋੜੀਂਦੇ ਹਨ।"
"SNMPv3 privacy also requires authentication.": "SNMPv3 ਪ੍ਰਾਈਵੇਸੀ ਲਈ ਪ੍ਰਮਾਣੀਕਰਨ ਵੀ ਲੋੜੀਂਦਾ ਹੈ।"
"SNMPv3 requires a username and an engine ID.": "SNMPv3 ਲਈ ਉਪਭੋਗਤਾ ਨਾਮ ਅਤੇ ਇੰਜਣ ID ਲੋੜੀਂਦੇ ਹਨ।"
"Save": "ਸੰਭਾਲੋ"
"Save outcome is uncertain. Reload before retrying.": "ਸੰਭਾਲਣ ਦਾ ਨਤੀਜਾ ਅਨਿਸ਼ਚਿਤ ਹੈ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"Select a supported notification receiver setting.": "ਇੱਕ ਸਮਰਥਿਤ ਸੂਚਨਾ ਪ੍ਰਾਪਤਕਰਤਾ ਸੈਟਿੰਗ ਚੁਣੋ।"
"Select supported notification receiver settings.": "ਸਮਰਥਿਤ ਸੂਚਨਾ ਪ੍ਰਾਪਤਕਰਤਾ ਸੈਟਿੰਗਾਂ ਚੁਣੋ।"
"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "SNMPv3 ਪ੍ਰਮਾਣੀਕਰਨ ਜਾਂ ਪ੍ਰਾਈਵੇਸੀ ਪ੍ਰੋਟੋਕੋਲ ਨੂੰ ਉਸਦੇ ਪਾਸਫ਼੍ਰੇਜ਼ ਸਮੇਤ ਸੈੱਟ ਕਰੋ।"
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "ਸਟੋਰ ਕੀਤੇ ਪ੍ਰਮਾਣ-ਪੱਤਰ ਕਦੇ ਨਹੀਂ ਦਿਖਾਏ ਜਾਂਦੇ। ਇਹਨਾਂ ਨੂੰ ਬਦਲਣ ਨਾਲ ਸਾਰੇ ਚਾਰ ਪ੍ਰਮਾਣ-ਪੱਤਰ ਖੇਤਰ ਸੈੱਟ ਹੋ ਜਾਂਦੇ ਹਨ; SNMP ਵਰਜਨ 3 ਛੱਡਣ ਨਾਲ ਇਸਦਾ ਉਪਭੋਗਤਾ ਨਾਮ ਅਤੇ ਪਾਸਫ਼੍ਰੇਜ਼ ਸਾਫ਼ ਹੋ ਜਾਂਦੇ ਹਨ।"
"Submit every notification receiver field.": "ਹਰੇਕ ਸੂਚਨਾ ਪ੍ਰਾਪਤਕਰਤਾ ਖੇਤਰ ਜਮ੍ਹਾਂ ਕਰੋ।"
"The notification receiver changed since you opened this form. Reload before saving.": "ਇਹ ਫ਼ਾਰਮ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ ਸੂਚਨਾ ਪ੍ਰਾਪਤਕਰਤਾ ਬਦਲ ਗਿਆ ਹੈ। ਸੰਭਾਲਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The passphrases do not match.": "ਪਾਸਫ਼੍ਰੇਜ਼ ਮੇਲ ਨਹੀਂ ਖਾਂਦੇ।"
"Unable to load the notification receiver. Reload before retrying.": "ਸੂਚਨਾ ਪ੍ਰਾਪਤਕਰਤਾ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕਿਆ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"Unexpected fields were submitted.": "ਅਣਕਿਆਸੇ ਖੇਤਰ ਜਮ੍ਹਾਂ ਕੀਤੇ ਗਏ।"
"Use stored credentials": "ਸਟੋਰ ਕੀਤੇ ਪ੍ਰਮਾਣ-ਪੱਤਰ ਵਰਤੋ"
"Version 1": "ਵਰਜਨ 1"
"Version 2": "ਵਰਜਨ 2"
"Version 3": "ਵਰਜਨ 3"
