"Executable paths": "قابل عمل راستے"
"Execution status": "عمل درآمد کی حیثیت"
"Finished execution": "عمل درآمد مکمل ہو گیا"
"Finishing tasks only. Schema migrations will not be replayed.": "صرف تکمیلی کام۔ اسکیمہ مائیگریشنز دوبارہ نہیں چلائی جائیں گی۔"
"I accept the license terms": "میں لائسنس کی شرائط قبول کرتا ہوں"
"I authorize discovery of the displayed range": "میں دکھائی گئی رینج کی ڈسکوری کی اجازت دیتا ہوں"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "میں نے لاگ چیک کر لیا ہے اور تصدیق کر لی ہے کہ پچھلا ورکر اور اس کے ذیلی عمل رک چکے ہیں"
"I checked the previous attempt and accept that some changes may already be committed": "میں نے پچھلی کوشش چیک کر لی ہے اور تسلیم کرتا ہوں کہ کچھ تبدیلیاں پہلے ہی نافذ ہو چکی ہوں گی"
"I reviewed this plan and have the required backups": "میں نے اس منصوبے کا جائزہ لے لیا ہے اور میرے پاس مطلوبہ بیک اپ موجود ہیں"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "اگر کوئی ورکر غیر متوقع طور پر رک جائے تو log/cacti.log محفوظ رکھیں اور واضح طور پر دوبارہ کوشش کرنے سے پہلے تصدیق کریں کہ اس کا عمل ختم ہو چکا ہے۔ انتظار کی حالت کامیاب آغاز کی تصدیق نہیں کرتی۔"
"Importing templates": "ٹیمپلیٹس درآمد کیے جا رہے ہیں"
"Install Kadupul": "Kadupul انسٹال کریں"
"Installation and upgrade": "تنصیب اور اپ گریڈ"
"Installation request was rejected.": "تنصیب کی درخواست مسترد کر دی گئی۔"
"Installation steps": "تنصیب کے مراحل"
