"Collector": "کلیکٹر"
"Configure": "کنفیگر کریں"
"Configuring collection profiles": "کلیکشن پروفائلز کنفیگر کیے جا رہے ہیں"
"Configuring discovery": "ڈسکوری کنفیگر کی جا رہی ہے"
"Configuring the local device": "مقامی ڈیوائس کنفیگر کی جا رہی ہے"
"Confirming database version": "ڈیٹا بیس ورژن کی تصدیق کی جا رہی ہے"
