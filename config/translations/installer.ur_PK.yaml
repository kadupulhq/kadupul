"Accept the license before saving the installation plan.": "تنصیب کا منصوبہ محفوظ کرنے سے پہلے لائسنس قبول کریں۔"
"Invalid installation form.": "تنصیب کا غیر درست فارم۔"
"Access denied.": "رسائی مسترد کر دی گئی۔"
"Confirm the recovery warning before retrying.": "دوبارہ کوشش کرنے سے پہلے بحالی کے انتباہ کی تصدیق کریں۔"
"Review and confirm the current installation plan.": "موجودہ تنصیب کے منصوبے کا جائزہ لیں اور تصدیق کریں۔"
"Confirm the discovery scope before starting.": "شروع کرنے سے پہلے ڈسکوری کے دائرہ کار کی تصدیق کریں۔"
"Resolve the blocking checks before starting.": "شروع کرنے سے پہلے مسدود کرنے والی جانچیں حل کریں۔"
"Too many installer options.": "انسٹالر کے بہت زیادہ اختیارات۔"
"Invalid installer option name.": "انسٹالر کے اختیار کا غیر درست نام۔"
"Unknown or malformed installer option.": "نامعلوم یا خراب انسٹالر اختیار۔"
"Installer options must be scalar values.": "انسٹالر کے اختیارات اسکیلر اقدار ہونے چاہئیں۔"
"Installer option is too long or contains a null byte.": "انسٹالر کا اختیار بہت لمبا ہے یا اس میں null بائٹ شامل ہے۔"
"Installer IDs and intervals must be whole numbers.": "انسٹالر IDs اور وقفے مکمل اعداد ہونے چاہئیں۔"
"Installer ID or interval is outside its supported range.": "انسٹالر ID یا وقفہ اس کی معاونت یافتہ حد سے باہر ہے۔"
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "تنصیب آگے نہیں بڑھ سکی۔ دوبارہ کوشش کرنے سے پہلے اس کی حیثیت دوبارہ لوڈ کریں اور مسدود کرنے والی جانچوں کا جائزہ لیں۔"
"Confirm that the previous worker has stopped before recovering its plan.": "اس کا منصوبہ بحال کرنے سے پہلے تصدیق کریں کہ پچھلا ورکر رک چکا ہے۔"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ڈیٹا بیس نصب ہے، لیکن کچھ کلیکٹرز کو ابھی ہم آہنگی کی ضرورت ہے۔ ان کی حیثیت چیک کرنے کے بعد تکمیلی کام دوبارہ چلائیں۔"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "تنصیب رک گئی۔ انسٹالر لاگ محفوظ رکھیں، سبب درست کریں اور واضح طور پر دوبارہ کوشش کی تصدیق کریں۔ کچھ ڈیٹا بیس تبدیلیاں پہلے ہی نافذ ہو چکی ہوں گی۔ دوبارہ کوشش کی اجازت دینے سے پہلے پلگ ان کی صفائی چیک کریں۔"
"Next action": "اگلا عمل"
"Follow the execution status. Do not start another attempt while a worker is active.": "عمل درآمد کی حیثیت پر نظر رکھیں۔ جب کوئی ورکر فعال ہو تو دوسری کوشش شروع نہ کریں۔"
"Complete the recovery checklist before retrying.": "دوبارہ کوشش کرنے سے پہلے بحالی کی چیک لسٹ مکمل کریں۔"
"Verify collection and graph operation before enabling discovery.": "ڈسکوری فعال کرنے سے پہلے کلیکشن اور گراف کے عمل کی تصدیق کریں۔"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "مسدود ضروریات حل کریں، پھر دوبارہ چیک کریں۔ محفوظ کردہ انتخابات برقرار رہتے ہیں۔"
"Review the planned changes and backup checklist before authorizing execution.": "عمل درآمد کی اجازت دینے سے پہلے منصوبہ بند تبدیلیوں اور بیک اپ چیک لسٹ کا جائزہ لیں۔"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "کلیکشن پروفائل منتخب کریں اور لائسنس قبول کریں۔ ضرورت پڑنے پر اختیاری ترتیبات کھولی جا سکتی ہیں۔"
"Download installation diagnostics": "تنصیب کی تشخیص ڈاؤن لوڈ کریں"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ایک گراف کھولیں اور تصدیق کریں کہ پولر سائیکل کے بعد اس کا RRD ڈیٹا اپ ڈیٹ ہوتا ہے۔"
"Requirement details": "ضرورت کی تفصیلات"
"Recover": "بحال کریں"
"Recovery checklist": "بحالی کی چیک لسٹ"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log محفوظ رکھیں اور ناکام کوشش ریکارڈ کریں۔"
"Confirm that the previous worker and its child processes have stopped.": "تصدیق کریں کہ پچھلا ورکر اور اس کے ذیلی عمل رک چکے ہیں۔"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "نافذ شدہ تبدیلیوں، کلیکٹر کی ہم آہنگی اور پلگ ان کی صفائی کا معائنہ کریں۔ دوبارہ کوشش کرنے سے پہلے سبب درست کریں۔"
"Review the saved plan again, then explicitly authorize a retry.": "محفوظ شدہ منصوبے کا دوبارہ جائزہ لیں، پھر واضح طور پر دوبارہ کوشش کی اجازت دیں۔"
"Recover a stopped worker": "رکے ہوئے ورکر کو بحال کریں"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "بحالی صرف اس بات کی تصدیق کے بعد استعمال کریں کہ یہ کوشش اب نہیں چل رہی۔ بحالی کسی عمل کو نہیں روکتی۔"
"Collector and installation mode": "کلیکٹر اور تنصیب کا موڈ"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "تعیناتی کی کنفیگریشن کلیکٹر کے کردار اور ڈیٹا بیس کنکشنز متعین کرتی ہے۔ کلیکٹر شروع کرنے سے پہلے بنیادی سرور کی کنفیگریشن کی تصدیق کریں۔"
"Discovery and SNMP settings": "ڈسکوری اور SNMP ترتیبات"
"Keep discovery disabled until collection and collector connectivity have been verified.": "جب تک کلیکشن اور کلیکٹر کنیکٹیویٹی کی تصدیق نہ ہو جائے ڈسکوری کو غیر فعال رکھیں۔"
"Template selection": "ٹیمپلیٹ کا انتخاب"
"Templates selected for import": "درآمد کے لیے منتخب کردہ ٹیمپلیٹس"
"No templates selected.": "کوئی ٹیمپلیٹس منتخب نہیں۔"
"Backup checklist": "بیک اپ چیک لسٹ"
"Database backup and a tested restoration procedure.": "ڈیٹا بیس کا بیک اپ اور آزمایا ہوا بحالی کا طریقہ کار۔"
"RRD files and the service account permissions needed to restore them.": "RRD فائلیں اور انہیں بحال کرنے کے لیے درکار سروس اکاؤنٹ کی اجازتیں۔"
"Configuration, keys and plugin data outside the database.": "ڈیٹا بیس کے باہر کنفیگریشن، کلیدیں اور پلگ ان ڈیٹا۔"
"Post-installation checks": "تنصیب کے بعد کی جانچیں"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "تصدیق شدہ جانچیں صرف دکھائے گئے شواہد کا احاطہ کرتی ہیں۔ غیر جانچ شدہ جانچوں کے لیے اب بھی آپریٹر کی تصدیق درکار ہے۔"
"Operational checks still require operator verification.": "آپریشنل جانچوں کے لیے اب بھی آپریٹر کی تصدیق درکار ہے۔"
"Status": "حیثیت"
"verified": "تصدیق شدہ"
"action_required": "عمل درکار ہے"
"not_assessed": "جانچ نہیں کی گئی"
"Database schema": "ڈیٹا بیس اسکیمہ"
"Stored schema matches the application target.": "محفوظ کردہ اسکیمہ ایپلیکیشن کے ہدف سے میل کھاتا ہے۔"
"Target schema completion has not been confirmed.": "ہدف اسکیمہ کی تکمیل کی تصدیق نہیں ہوئی ہے۔"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "اسکیمہ اپ گریڈ کو مکمل سمجھنے سے پہلے تنصیب کے نتیجے کا جائزہ لیں اور ناکامیاں حل کریں۔"
"Installation outcome": "تنصیب کا نتیجہ"
"A successful receipt matches the current target schema.": "کامیاب رسید موجودہ ہدف اسکیمہ سے میل کھاتی ہے۔"
"A complete successful installation outcome has not been confirmed.": "تنصیب کے مکمل کامیاب نتیجے کی تصدیق نہیں ہوئی ہے۔"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "انسٹالر لاگ محفوظ رکھیں اور ضرورت پڑنے پر واضح بحالی یا دوبارہ کوشش کا طریقہ کار استعمال کریں۔"
"Collector synchronization": "کلیکٹر ہم آہنگی"
"The completed installer reports pending collector synchronization.": "مکمل شدہ انسٹالر زیر التوا کلیکٹر ہم آہنگی کی اطلاع دیتا ہے۔"
"The completed installer reports no pending collectors.": "مکمل شدہ انسٹالر کسی زیر التوا کلیکٹر کی اطلاع نہیں دیتا۔"
"Collector completion remains unconfirmed by this partial receipt.": "اس جزوی رسید سے کلیکٹر کی تکمیل غیر مصدقہ رہتی ہے۔"
"Collector completion is not established by this installation outcome.": "تنصیب کے اس نتیجے سے کلیکٹر کی تکمیل ثابت نہیں ہوتی۔"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "کلیکٹر کی حیثیت کا جائزہ لیں اور جزوی نتائج کے لیے تکمیلی کام دوبارہ آزمائیں۔ یہ بعد کی کلیکشن کی تازگی کی تصدیق نہیں کرتا۔"
"Scheduled collection": "شیڈول شدہ کلیکشن"
"No poller or device was contacted by this assessment.": "اس تشخیص کے دوران کسی پولر یا ڈیوائس سے رابطہ نہیں کیا گیا۔"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "تصدیق کریں کہ کنفیگر کردہ شیڈولر پولر کو مطلوبہ سروس اکاؤنٹ کے طور پر چلاتا ہے اور اس کے اگلے معمول کے سائیکل کا جائزہ لیں۔"
"Graph data": "گراف ڈیٹا"
"Live samples and RRD updates were not exercised.": "لائیو نمونوں اور RRD اپ ڈیٹس کی مشق نہیں کی گئی۔"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "معمول کے کلیکشن سائیکل کے بعد تصدیق کریں کہ متوقع گرافس کو تازہ نمونے مل رہے ہیں اور پولر کی خرابیوں کا جائزہ لیں۔"
"Recovery readiness": "بحالی کی تیاری"
"Backup restoration was not exercised.": "بیک اپ بحالی کی مشق نہیں کی گئی۔"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "بحالی پر انحصار کرنے سے پہلے ڈیٹا بیس، RRD فائلوں، کنفیگریشن اور کلیدی مواد کی الگ تھلگ بحالی کی تصدیق کریں۔"
"No persisted local poller start has been recorded.": "مقامی پولر کا کوئی مستقل آغاز ریکارڈ نہیں ہوا۔"
"Persisted poller timing is invalid and cannot establish scheduler health.": "محفوظ شدہ پولر ٹائمنگ غیر درست ہے اور شیڈولر کی صحت ثابت نہیں کر سکتی۔"
"The recorded poller start is in the future. Check clock synchronization.": "ریکارڈ شدہ پولر آغاز مستقبل میں ہے۔ گھڑی کی ہم آہنگی چیک کریں۔"
"The recorded poller start is older than the native scheduling tolerance.": "ریکارڈ شدہ پولر آغاز مقامی شیڈولنگ حد سے پرانا ہے۔"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "مقامی پولر کا آغاز مقامی شیڈولنگ حد کے اندر ریکارڈ ہوا۔ تکمیل اور ڈیوائس کی صحت کی تصدیق نہیں ہوئی ہے۔"
"readable": "قابل مطالعہ"
"missing or unreadable": "غائب یا ناقابل مطالعہ"
"Restore the complete release and its locked dependencies; grant the service account read access.": "مکمل ریلیز اور اس کے مقفل انحصارات بحال کریں؛ سروس اکاؤنٹ کو پڑھنے کی رسائی دیں۔"
"PHP temporary directory": "PHP عارضی ڈائریکٹری"
"directory writable by this process": "ڈائریکٹری اس عمل کے لیے قابل تحریر ہے"
"missing or not writable": "غائب یا ناقابل تحریر"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir کو ایک موجود ڈائریکٹری کے طور پر کنفیگر کریں جو تنصیب کے اکاؤنٹ کے لیے قابل تحریر ہو۔ مقامی درآمدات عارضی فائلیں استعمال کرتی ہیں۔"
"Background worker launch": "بیک گراؤنڈ ورکر کا آغاز"
"required PHP functions available; launch not exercised": "مطلوبہ PHP فنکشنز دستیاب ہیں؛ آغاز نہیں آزمایا گیا"
"required PHP launch function disabled": "مطلوبہ PHP لانچ فنکشن غیر فعال ہے"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "ویب PHP رن ٹائم کے لیے exec فعال کریں، یا مجاز CLI انسٹالر استعمال کریں۔"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "ویب PHP رن ٹائم کے لیے popen، pclose فعال کریں، یا مجاز CLI انسٹالر استعمال کریں۔"
"Database transaction ownership": "ڈیٹا بیس ٹرانزیکشن کی ملکیت"
"autocommit enabled; no caller-owned transaction": "autocommit فعال؛ کوئی کالر کی ملکیت والی ٹرانزیکشن نہیں"
"autocommit disabled or caller transaction active": "autocommit غیر فعال یا کالر ٹرانزیکشن فعال ہے"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "تنصیب کو کالر کی ملکیت والی ٹرانزیکشن سے باہر چلائیں اور اس کے تبدیلی والے کنکشن پر autocommit فعال کریں۔"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "ریلیز ڈائریکٹری بحال کریں اور ٹیمپلیٹ وسائل کی درآمدات کے لیے تنصیب کے اکاؤنٹ کو تحریر کی رسائی دیں۔ اسے سب کے لیے قابل تحریر نہ بنائیں۔"
"Worker file: install/background.php": "ورکر فائل: install/background.php"
"Worker file: bin/legacy-installer.php": "ورکر فائل: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "ورکر فائل: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "درآمد کی منزل: resource/snmp_queries"
"Import destination: resource/script_server": "درآمد کی منزل: resource/script_server"
"Import destination: resource/script_queries": "درآمد کی منزل: resource/script_queries"
"Import destination: scripts": "درآمد کی منزل: scripts"
"Database privileges": "ڈیٹا بیس کے مراعات"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "منتقلی کے مؤثر مراعات، بشمول فعال کردار اور آبجیکٹ کے مخصوص حقوق، کی تصدیق نہیں کی گئی۔"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ڈیٹا بیس ایڈمنسٹریٹر سے تنصیب کے اکاؤنٹ اور اسکیمہ کے لیے مطلوبہ جدول تحریر، اسکیمہ تبدیلیوں، ٹریگرز اور روٹینز کی تصدیق کروائیں۔ عالمی ایڈمنسٹریٹر کے مراعات نہ دیں۔"
"Compare web and worker runtimes": "ویب اور ورکر رن ٹائمز کا موازنہ کریں"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "یہ واضح طور پر ایک مختصر صرف پڑھنے کے قابل PHP جانچ شروع کرتا ہے۔ یہ کسی انسٹالر کو محفوظ نہیں کرتا، فائلیں نہیں لکھتا اور نہ ہی ڈیوائسز سے رابطہ کرتا ہے۔"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "جانچ اس ویب عمل کو وراثت میں لیتی ہے اور کنفیگر کردہ انسٹالر PHP انٹرپریٹر استعمال کرتی ہے۔ یہ کسی الگ شیڈولر یا سروس کا معائنہ نہیں کرتی۔"
"I authorize the read-only worker runtime comparison.": "میں صرف پڑھنے کے قابل ورکر رن ٹائم موازنے کی اجازت دیتا ہوں۔"
"Compare runtimes": "رن ٹائمز کا موازنہ کریں"
"Runtime comparison results": "رن ٹائم موازنہ کے نتائج"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "اجازت اور شناخت کے اختلافات ارادتاً ہو سکتے ہیں۔ صرف پڑھنے کے مشاہدات یہ ثابت نہیں کرتے کہ تحریر یا تنصیب کامیاب ہو گی۔"
"Confirm the read-only worker runtime comparison.": "صرف پڑھنے کے قابل ورکر رن ٹائم موازنے کی تصدیق کریں۔"
"The runtime comparison is unavailable.": "رن ٹائم موازنہ دستیاب نہیں ہے۔"
"Shared application secret": "مشترکہ ایپلیکیشن خفیہ کلید"
"A strong web application secret is required before comparison.": "موازنے سے پہلے ایک مضبوط ویب ایپلیکیشن خفیہ کلید درکار ہے۔"
"Runtime comparison": "رن ٹائم موازنہ"
"The configured worker runtime did not confirm a bounded comparison.": "کنفیگر کردہ ورکر رن ٹائم نے محدود موازنے کی تصدیق نہیں کی۔"
"The inherited worker secret could not be confirmed against the web secret.": "وراثتی ورکر خفیہ کلید کی ویب خفیہ کلید کے مقابلے میں تصدیق نہیں ہو سکی۔"
"PHP runtime comparison": "PHP رن ٹائم موازنہ"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "دونوں رن ٹائمز کو PHP 8.4 کی معاونت کرنی چاہیے؛ مختلف پیچ ورژنز کا جائزہ درکار ہے۔"
"Required extension comparison": "مطلوبہ ایکسٹینشن کا موازنہ"
"Required extension availability is checked; differing versions require review.": "مطلوبہ ایکسٹینشن کی دستیابی چیک کی گئی ہے؛ مختلف ورژنز کا جائزہ درکار ہے۔"
"Process identity comparison": "عمل کی شناخت کا موازنہ"
"Effective process identity is unavailable on this platform.": "اس پلیٹ فارم پر عمل کی مؤثر شناخت دستیاب نہیں ہے۔"
"Effective process identities match.": "عمل کی مؤثر شناختیں یکساں ہیں۔"
"Effective process identities differ; separate service accounts may be intentional.": "عمل کی مؤثر شناختیں مختلف ہیں؛ الگ سروس اکاؤنٹس ارادتاً ہو سکتے ہیں۔"
"Directory access comparison": "ڈائریکٹری تک رسائی کا موازنہ"
"Read-only directory permission observations match.": "صرف پڑھنے کے قابل ڈائریکٹری اجازت کے مشاہدات یکساں ہیں۔"
"Directory locations or permission observations differ; review the service-account roles.": "ڈائریکٹری کے مقامات یا اجازت کے مشاہدات مختلف ہیں؛ سروس اکاؤنٹ کے کرداروں کا جائزہ لیں۔"
"Worker directory read and traversal": "ورکر ڈائریکٹری پڑھنا اور گزرنا"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "مطلوبہ ورکر ڈائریکٹریز کا موجود ہونا اور پڑھنے و گزرنے کی اجازت ہونا ضروری ہے۔ کوئی تحریر نہیں آزمائی گئی۔"
"The inherited worker secret matches the web secret for this private challenge.": "اس نجی چیلنج کے لیے وراثتی ورکر خفیہ کلید ویب خفیہ کلید سے میل کھاتی ہے۔"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "کنفیگر کردہ PHP انٹرپریٹر، مطلوبہ ایکسٹینشنز، وراثتی خفیہ کلید اور سروس اکاؤنٹ ڈائریکٹری کی اجازتوں کا جائزہ لیں۔ کوئی تحریر یا انسٹالر کا آغاز نہیں آزمایا گیا۔"
"advisory": "مشاورتی"
