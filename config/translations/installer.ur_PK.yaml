"Keep a backup of the database, RRD files, configuration and secret material.": "ڈیٹا بیس، RRD فائلوں، کنفیگریشن اور خفیہ مواد کا بیک اپ محفوظ رکھیں۔"
"Language": "زبان"
"Large tables may require the dedicated CLI conversion tool before installation.": "بڑے جدولوں کے لیے تنصیب سے پہلے مخصوص CLI تبدیلی کے آلے کی ضرورت ہو سکتی ہے۔"
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "محفوظ کردہ اسناد برقرار رکھنے کے لیے خفیہ فیلڈز خالی چھوڑ دیں۔ خفیہ معلومات دوبارہ کبھی نہیں دکھائی جاتیں۔"
"License": "لائسنس"
"No action needed": "کسی عمل کی ضرورت نہیں"
"Observed": "مشاہدہ شدہ"
