"Action": "عمل"
"Advanced options": "اعلیٰ اختیارات"
"Applying database upgrades": "ڈیٹا بیس اپ گریڈز لاگو کیے جا رہے ہیں"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "ڈیٹا بیس، RRD فائلوں، کنفیگریشن اور کلیدوں کا بیک اپ لیں۔ ڈیٹا بیس اپ گریڈز ایسی تبدیلیاں لاگو کر سکتے ہیں جنہیں ایپلیکیشن رول بیک واپس نہیں کر سکتا۔"
"Blocked": "مسدود"
"Check": "چیک کریں"
"Check again": "دوبارہ چیک کریں"
"Check collection freshness and collector connectivity before enabling discovery.": "ڈسکوری فعال کرنے سے پہلے کلیکشن کی تازگی اور کلیکٹر کنیکٹیویٹی چیک کریں۔"
"Check requirements": "ضروریات چیک کریں"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "جانچ اس عمل اور فائل سسٹم کی اجازتوں کا معائنہ کرتی ہے۔ یہ ٹیسٹ فائلیں نہیں لکھتی اور نہ ہی ڈیوائسز سے رابطہ کرتی ہے۔"
