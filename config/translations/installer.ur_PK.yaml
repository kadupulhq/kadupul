"Pass": "کامیاب"
"Poller interval in seconds": "پولر وقفہ سیکنڈوں میں"
"Preparing CSRF protection": "CSRF تحفظ تیار کیا جا رہا ہے"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "پیش رفت آخری ریکارڈ شدہ مرحلہ دکھاتی ہے۔ اس صفحے کو تازہ کرنے سے کبھی کوئی ورکر شروع یا دوبارہ شروع نہیں ہوتا۔"
"Recover stopped attempt": "رکی ہوئی کوشش بحال کریں"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "بحالی محفوظ شدہ انتخابات کو برقرار رکھتی ہے اور کبھی کسی فعال ورکر کو ختم نہیں کرتی۔ دوبارہ کوشش کرنے سے پہلے منصوبے کا دوبارہ جائزہ لیں۔"
"Review": "جائزہ لیں"
"Review installation plan": "تنصیب کے منصوبے کا جائزہ لیں"
"Run": "چلائیں"
"Run reviewed plan": "جائزہ شدہ منصوبہ چلائیں"
"Save and review": "محفوظ کریں اور جائزہ لیں"
"Scope": "دائرہ کار"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "حیثیت دستیاب نہیں ہے۔ محفوظ شدہ کام برقرار ہے۔ دوبارہ جڑنے کے لیے تازہ کریں؛ دوسری تنصیب جمع نہ کریں۔"
"Synchronizing collectors": "کلیکٹرز ہم آہنگ کیے جا رہے ہیں"
"Table conversions": "جدول کی تبدیلیاں"
"Templates": "ٹیمپلیٹس"
"The database version matches this application. Installation does not establish that polling is healthy.": "ڈیٹا بیس ورژن اس ایپلیکیشن سے میل کھاتا ہے۔ تنصیب یہ ثابت نہیں کرتی کہ پولنگ صحت مند ہے۔"
"The request outcome is unknown. Check execution status before retrying.": "درخواست کا نتیجہ نامعلوم ہے۔ دوبارہ کوشش کرنے سے پہلے عمل درآمد کی حیثیت چیک کریں۔"
"Theme": "تھیم"
"Verify": "تصدیق کریں"
"Verify the poller schedule and service account.": "پولر شیڈول اور سروس اکاؤنٹ کی تصدیق کریں۔"
"Version change": "ورژن کی تبدیلی"
"Waiting for the installation worker": "تنصیب کے ورکر کا انتظار کیا جا رہا ہے"
"collector": "کلیکٹر"
"complete": "مکمل"
"failed": "ناکام"
"finish": "مکمل کریں"
