"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "Shyiraho uburyo bwo kwemeza cyangwa bw'ibanga bwa SNMPv3 hamwe n'ijambo ry'ibanga ryabwo."
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "Amakuru y'uburenganzira abitswe ntajya agaragazwa. Kuyasimbuza bishyiraho imyanya yose ine y'uburenganzira; kuva muri SNMP verisiyo ya 3 bisiba izina ry'ukoresha n'amagambo y'ibanga yayo."
"Submit every notification receiver field.": "Ohereza buri mwanya w'uwakira amamenyesha."
"The notification receiver changed since you opened this form. Reload before saving.": "Uwakira amamenyesha yahindutse kuva wafungura iyi fomu. Ongera uyifungure mbere yo kubika."
"The passphrases do not match.": "Amagambo y'ibanga ntahuye."
