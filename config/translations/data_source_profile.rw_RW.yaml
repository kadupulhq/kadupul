"Changing the Heartbeat from this page does not change the Heartbeat for your existing Data Sources.  Use RRDtool's 'tune' function to make that change to your existing RRDfiles' heartbeats, or run the CLI utility update_heartbeat.php to correct.": "Guhindura igipimo cya Heartbeat kuri uru rupapuro ntibihindura Heartbeat ku masoko y'amakuru yawe asanzweho. Koresha uburyo bwa 'tune' bwa RRDtool kugira ngo ukore iryo hinduka kuri heartbeats za dosiye za RRD zisanzweho, cyangwa ukoreshe igikoresho cya CLI update_heartbeat.php kugira ngo ubikosore."
