"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "Igihe amakuru ashobora kubura mbere y'uko RRDtool yandika amakuru atazwi. Ongera iyi mibare niba inkomoko y'amakuru yawe idahamye kandi ukaba ushaka gukomeza gukoresha amakuru ya kera aho kwerekana ibyuho mu bishushanyo byawe. Iyi mibare ikubwa na X-Files Factor kugira ngo hamenyekane igihe nyacyo."
