"waiting": "wachtend"
"Accept the license before saving the installation plan.": "Accepteer de licentie voordat u het installatieplan opslaat."
"Invalid installation form.": "Ongeldig installatieformulier."
"Access denied.": "Toegang geweigerd."
"Confirm the recovery warning before retrying.": "Bevestig de herstelwaarschuwing voordat u het opnieuw probeert."
"Review and confirm the current installation plan.": "Beoordeel en bevestig het huidige installatieplan."
"Confirm the discovery scope before starting.": "Bevestig het detectiebereik voordat u start."
"Resolve the blocking checks before starting.": "Los de blokkerende controles op voordat u start."
"Too many installer options.": "Te veel installatieopties."
"Invalid installer option name.": "Ongeldige naam voor installatieoptie."
"Unknown or malformed installer option.": "Onbekende of ongeldig geformatteerde installatieoptie."
"Installer options must be scalar values.": "Installatieopties moeten scalaire waarden zijn."
"Installer option is too long or contains a null byte.": "Installatieoptie is te lang of bevat een null-byte."
"Installer IDs and intervals must be whole numbers.": "Installatie-ID's en intervallen moeten gehele getallen zijn."
"Installer ID or interval is outside its supported range.": "Installatie-ID of interval valt buiten het ondersteunde bereik."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "De installatie kon niet doorgaan. Herlaad de status en bekijk de blokkerende controles voordat u het opnieuw probeert."
"Confirm that the previous worker has stopped before recovering its plan.": "Bevestig dat de vorige worker is gestopt voordat u het plan herstelt."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "De database is geïnstalleerd, maar sommige collectors moeten nog worden gesynchroniseerd. Probeer de afrondende taken opnieuw na controle van hun status."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installatie gestopt. Bewaar het installatielogboek, verhelp de oorzaak en bevestig expliciet een nieuwe poging. Sommige databasewijzigingen zijn mogelijk al doorgevoerd. Controleer plug-inopschoning voordat u een nieuwe poging autoriseert."
"Next action": "Volgende actie"
"Follow the execution status. Do not start another attempt while a worker is active.": "Volg de uitvoeringsstatus. Start geen nieuwe poging terwijl een worker actief is."
"Complete the recovery checklist before retrying.": "Voltooi de herstelchecklist voordat u het opnieuw probeert."
"Verify collection and graph operation before enabling discovery.": "Verifieer de gegevensverzameling en grafiekwerking voordat u detectie inschakelt."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Los de geblokkeerde vereisten op en controleer opnieuw. Opgeslagen selecties blijven behouden."
"Review the planned changes and backup checklist before authorizing execution.": "Beoordeel de geplande wijzigingen en de back-upchecklist voordat u de uitvoering autoriseert."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Kies een verzamelprofiel en accepteer de licentie. Optionele instellingen kunnen indien nodig worden geopend."
"Download installation diagnostics": "Installatiediagnostiek downloaden"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Open een grafiek en controleer of de RRD-gegevens worden bijgewerkt na een pollercyclus."
"Requirement details": "Details van vereiste"
"Recover": "Herstellen"
"Recovery checklist": "Herstelchecklist"
"Preserve log/cacti.log and record the failed attempt.": "Bewaar log/cacti.log en registreer de mislukte poging."
"Confirm that the previous worker and its child processes have stopped.": "Bevestig dat de vorige worker en diens onderliggende processen zijn gestopt."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Controleer doorgevoerde wijzigingen, collectorsynchronisatie en plug-inopschoning. Verhelp de oorzaak voordat u het opnieuw probeert."
"Review the saved plan again, then explicitly authorize a retry.": "Beoordeel het opgeslagen plan opnieuw en autoriseer vervolgens expliciet een nieuwe poging."
"Recover a stopped worker": "Een gestopte worker herstellen"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Gebruik herstel alleen nadat u hebt bevestigd dat deze poging niet meer actief is. Herstel stopt geen proces."
"Collector and installation mode": "Collector en installatiemodus"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "De implementatieconfiguratie bepaalt de collectorrol en databaseverbindingen. Controleer de primaire serverconfiguratie voordat u een collector start."
"Discovery and SNMP settings": "Detectie- en SNMP-instellingen"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Houd detectie uitgeschakeld totdat de verzameling en de collectorconnectiviteit zijn geverifieerd."
"Template selection": "Sjabloonselectie"
"Templates selected for import": "Sjablonen geselecteerd voor import"
"No templates selected.": "Geen sjablonen geselecteerd."
"Backup checklist": "Back-upchecklist"
"Database backup and a tested restoration procedure.": "Databaseback-up en een geteste herstelprocedure."
"RRD files and the service account permissions needed to restore them.": "RRD-bestanden en de serviceaccountmachtigingen die nodig zijn om ze te herstellen."
"Configuration, keys and plugin data outside the database.": "Configuratie, sleutels en plug-ingegevens buiten de database."
"Post-installation checks": "Controles na installatie"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Geverifieerde controles dekken alleen het getoonde bewijs. Niet-beoordeelde controles vereisen nog steeds verificatie door een beheerder."
"Operational checks still require operator verification.": "Operationele controles vereisen nog steeds verificatie door een beheerder."
"Status": "Status"
"verified": "geverifieerd"
"action_required": "Actie vereist"
"not_assessed": "Niet beoordeeld"
"Database schema": "Databaseschema"
"Stored schema matches the application target.": "Opgeslagen schema komt overeen met het applicatiedoel."
"Target schema completion has not been confirmed.": "Voltooiing van doelschema is niet bevestigd."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Bekijk het installatieresultaat en los fouten op voordat u de schema-upgrade als voltooid beschouwt."
"Installation outcome": "Installatieresultaat"
"A successful receipt matches the current target schema.": "Een geslaagd ontvangstbewijs komt overeen met het huidige doelschema."
"A complete successful installation outcome has not been confirmed.": "Een volledig geslaagd installatieresultaat is niet bevestigd."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Bewaar het installatielogboek en gebruik waar nodig de expliciete herstel- of hernieuwingsprocedure."
"Collector synchronization": "Collectorsynchronisatie"
"The completed installer reports pending collector synchronization.": "Het voltooide installatieprogramma meldt openstaande collectorsynchronisatie."
"The completed installer reports no pending collectors.": "Het voltooide installatieprogramma meldt geen openstaande collectors."
"Collector completion remains unconfirmed by this partial receipt.": "De voltooiing van de collector blijft onbevestigd door dit gedeeltelijke ontvangstbewijs."
"Collector completion is not established by this installation outcome.": "De voltooiing van de collector wordt niet aangetoond door dit installatieresultaat."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Controleer de collectorstatus en probeer afrondende taken opnieuw voor gedeeltelijke resultaten. Dit verifieert niet de latere actualiteit van de gegevensverzameling."
"Scheduled collection": "Geplande verzameling"
"No poller or device was contacted by this assessment.": "Er is geen poller of apparaat gecontacteerd door deze beoordeling."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Bevestig dat de geconfigureerde planner de poller uitvoert als het beoogde serviceaccount en controleer de volgende normale cyclus."
"Graph data": "Grafiekgegevens"
"Live samples and RRD updates were not exercised.": "Live meetwaarden en RRD-updates zijn niet getest."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Controleer na een normale verzamelcyclus of verwachte grafieken nieuwe meetwaarden ontvangen en bekijk pollerfouten."
"Recovery readiness": "Herstelgereedheid"
"Backup restoration was not exercised.": "Herstel van back-up is niet getest."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifieer een geïsoleerd herstel van database, RRD-bestanden, configuratie en sleutelmateriaal voordat u op herstel vertrouwt."
"No persisted local poller start has been recorded.": "Er is geen persistente lokale pollerstart geregistreerd."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Opgeslagen pollertiming is ongeldig en kan de status van de planner niet aantonen."
"The recorded poller start is in the future. Check clock synchronization.": "De geregistreerde pollerstart ligt in de toekomst. Controleer de kloksynchronisatie."
"The recorded poller start is older than the native scheduling tolerance.": "De geregistreerde pollerstart is ouder dan de systeemeigen planningstolerantie."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Er is een lokale pollerstart geregistreerd binnen de systeemeigen planningstolerantie. Voltooiing en apparaatstatus zijn niet geverifieerd."
"readable": "leesbaar"
"missing or unreadable": "ontbrekend of onleesbaar"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Herstel de volledige release en de vergrendelde afhankelijkheden; verleen het serviceaccount leestoegang."
"PHP temporary directory": "Tijdelijke PHP-map"
"directory writable by this process": "map beschrijfbaar door dit proces"
"missing or not writable": "ontbrekend of niet beschrijfbaar"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configureer sys_temp_dir als een bestaande map die beschrijfbaar is door het installatieaccount. Systeemeigen imports gebruiken tijdelijke bestanden."
"Background worker launch": "Starten van achtergrondworker"
"required PHP functions available; launch not exercised": "vereiste PHP-functies beschikbaar; starten niet getest"
"required PHP launch function disabled": "vereiste PHP-startfunctie uitgeschakeld"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Schakel exec in voor de web-PHP-runtime, of gebruik het geautoriseerde CLI-installatieprogramma."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Schakel popen, pclose in voor de web-PHP-runtime, of gebruik het geautoriseerde CLI-installatieprogramma."
"Database transaction ownership": "Eigendom van databasetransacties"
"autocommit enabled; no caller-owned transaction": "autocommit ingeschakeld; geen transactie van de aanroeper"
"autocommit disabled or caller transaction active": "autocommit uitgeschakeld of aanroepertransactie actief"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Voer de installatie uit buiten een door de aanroeper beheerde transactie en schakel autocommit in op de mutatieverbinding."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Herstel de releasemap en verleen het installatieaccount schrijftoegang voor sjabloonbronimports. Maak de map niet voor iedereen schrijfbaar."
"Worker file: install/background.php": "Workerbestand: install/background.php"
"Worker file: bin/legacy-installer.php": "Workerbestand: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Workerbestand: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importbestemming: resource/snmp_queries"
"Import destination: resource/script_server": "Importbestemming: resource/script_server"
"Import destination: resource/script_queries": "Importbestemming: resource/script_queries"
"Import destination: scripts": "Importbestemming: scripts"
"Database privileges": "Databaserechten"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Effectieve migratierechten, waaronder actieve rollen en objectspecifieke toekenningen, zijn niet geverifieerd."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Laat de databasebeheerder de vereiste tabelschrijfbewerkingen, schemawijzigingen, triggers en routines controleren voor het installatieaccount en -schema. Ken geen algemene beheerdersrechten toe."
"Compare web and worker runtimes": "Web- en workerruntimes vergelijken"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Dit start expliciet een korte alleen-lezen PHP-probe. Het reserveert geen installatieprogramma, schrijft geen bestanden en maakt geen contact met apparaten."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "De probe erft dit webproces en gebruikt de geconfigureerde PHP-interpreter van het installatieprogramma. Het inspecteert geen afzonderlijke planner of service."
"I authorize the read-only worker runtime comparison.": "Ik autoriseer de alleen-lezen vergelijking van de workerruntime."
"Compare runtimes": "Runtimes vergelijken"
"Runtime comparison results": "Resultaten van runtimevergelijking"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Verschillen in machtigingen en identiteiten kunnen opzettelijk zijn. Alleen-lezen waarnemingen bewijzen niet dat schrijfbewerkingen of installatie zullen slagen."
"Confirm the read-only worker runtime comparison.": "Bevestig de alleen-lezen vergelijking van de workerruntime."
"The runtime comparison is unavailable.": "De runtimevergelijking is niet beschikbaar."
"Shared application secret": "Gedeeld applicatiegeheim"
"A strong web application secret is required before comparison.": "Een sterk geheim voor de webapplicatie is vereist vóór vergelijking."
"Runtime comparison": "Runtimevergelijking"
"The configured worker runtime did not confirm a bounded comparison.": "De geconfigureerde workerruntime heeft geen begrensde vergelijking bevestigd."
"The inherited worker secret could not be confirmed against the web secret.": "Het overgenomen workergeheim kon niet worden bevestigd aan het webgeheim."
"PHP runtime comparison": "PHP-runtimevergelijking"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Beide runtimes moeten PHP 8.4 ondersteunen; afwijkende patchversies vereisen controle."
"Required extension comparison": "Vergelijking van vereiste extensies"
"Required extension availability is checked; differing versions require review.": "Beschikbaarheid van vereiste extensies wordt gecontroleerd; afwijkende versies vereisen controle."
"Process identity comparison": "Vergelijking van procesidentiteit"
"Effective process identity is unavailable on this platform.": "Effectieve procesidentiteit is niet beschikbaar op dit platform."
"Effective process identities match.": "Effectieve procesidentiteiten komen overeen."
"Effective process identities differ; separate service accounts may be intentional.": "Effectieve procesidentiteiten verschillen; afzonderlijke serviceaccounts kunnen opzettelijk zijn."
"Directory access comparison": "Vergelijking van maptoegang"
"Read-only directory permission observations match.": "Alleen-lezen waarnemingen van mapmachtigingen komen overeen."
"Directory locations or permission observations differ; review the service-account roles.": "Maplocaties of waargenomen machtigingen verschillen; controleer de rollen van het serviceaccount."
"Worker directory read and traversal": "Lezen en doorlopen van workermap"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Vereiste workermappen moeten bestaan en lezen en doorlopen toestaan. Er zijn geen schrijfbewerkingen getest."
"The inherited worker secret matches the web secret for this private challenge.": "Het overgenomen workergeheim komt overeen met het webgeheim voor deze privé-uitdaging."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Controleer de geconfigureerde PHP-interpreter, vereiste extensies, overgenomen geheim en mapmachtigingen van het serviceaccount. Er zijn geen schrijfbewerkingen of het starten van het installatieprogramma uitgevoerd."
