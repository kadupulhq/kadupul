"Applying database upgrades": "Database-upgrades toepassen"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Maak een back-up van de database, RRD-bestanden, configuratie en sleutels. Database-upgrades kunnen wijzigingen doorvoeren die het terugdraaien van de applicatie niet ongedaan kan maken."
