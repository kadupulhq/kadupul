"Run reviewed plan": "Beoordeeld plan uitvoeren"
"Save and review": "Opslaan en beoordelen"
"Scope": "Bereik"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status is niet beschikbaar. Opgeslagen werk blijft behouden. Vernieuw om opnieuw verbinding te maken; dien geen nieuwe installatie in."
"Synchronizing collectors": "Collectors synchroniseren"
"Table conversions": "Tabelconversies"
"Templates": "Sjablonen"
"The database version matches this application. Installation does not establish that polling is healthy.": "De databaseversie komt overeen met deze applicatie. Installatie toont niet aan dat polling gezond is."
"The request outcome is unknown. Check execution status before retrying.": "Het resultaat van het verzoek is onbekend. Controleer de uitvoeringsstatus voordat u het opnieuw probeert."
