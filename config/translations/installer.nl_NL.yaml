"Preparing CSRF protection": "CSRF-beveiliging voorbereiden"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "De voortgang toont de laatst geregistreerde fase. Het vernieuwen van deze pagina start of herhaalt nooit een worker."
"Recover stopped attempt": "Gestopte poging herstellen"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Herstel behoudt de opgeslagen selecties en beëindigt nooit een actieve worker. Beoordeel het plan opnieuw voordat u het opnieuw probeert."
