"Installed": "Geïnstalleerd"
"Keep a backup of the database, RRD files, configuration and secret material.": "Bewaar een back-up van de database, RRD-bestanden, configuratie en geheim materiaal."
"Language": "Taal"
"Large tables may require the dedicated CLI conversion tool before installation.": "Grote tabellen vereisen mogelijk het speciale CLI-conversiehulpprogramma vóór de installatie."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Laat geheime velden leeg om opgeslagen referenties te behouden. Geheimen worden nooit opnieuw weergegeven."
