"Check requirements": "Vereisten controleren"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Controles inspecteren dit proces en bestandssysteemmachtigingen. Ze schrijven geen testbestanden en maken geen contact met apparaten."
