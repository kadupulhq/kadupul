"Finishing tasks only. Schema migrations will not be replayed.": "Alleen afrondende taken. Schemamigraties worden niet opnieuw afgespeeld."
"I accept the license terms": "Ik accepteer de licentievoorwaarden"
"I authorize discovery of the displayed range": "Ik autoriseer detectie van het weergegeven bereik"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Ik heb het logboek gecontroleerd en bevestig dat de vorige worker en diens onderliggende processen zijn gestopt"
"I checked the previous attempt and accept that some changes may already be committed": "Ik heb de vorige poging gecontroleerd en accepteer dat sommige wijzigingen mogelijk al zijn doorgevoerd"
"I reviewed this plan and have the required backups": "Ik heb dit plan beoordeeld en beschik over de vereiste back-ups"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Als een worker onverwacht stopt, bewaart u log/cacti.log en bevestigt u dat het proces is beëindigd voordat u het expliciet opnieuw probeert. Een wachtstatus bevestigt geen geslaagde start."
