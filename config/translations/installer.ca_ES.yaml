"Action": "Acció"
"Advanced options": "Opcions avançades"
"Applying database upgrades": "Aplicació de les actualitzacions de la base de dades"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Feu una còpia de seguretat de la base de dades, els fitxers RRD, la configuració i les claus. Les actualitzacions de la base de dades poden consolidar canvis que la reversió de l'aplicació no pot desfer."
"Blocked": "Bloquejat"
"Check": "Comprova"
"Check again": "Torna a comprovar"
"Check collection freshness and collector connectivity before enabling discovery.": "Comproveu la frescor de la recol·lecció i la connectivitat dels recol·lectors abans d'activar el descobriment."
"Check requirements": "Comprova els requisits"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Les comprovacions inspeccionen aquest procés i els permisos del sistema de fitxers. No escriuen fitxers de prova ni contacten amb dispositius."
"Collection profile": "Perfil de recol·lecció"
"Collector": "Recol·lector"
"Configure": "Configura"
"Configuring collection profiles": "Configuració dels perfils de recol·lecció"
"Configuring discovery": "Configuració del descobriment"
"Configuring the local device": "Configuració del dispositiu local"
"Confirming database version": "Confirmació de la versió de la base de dades"
"Converting selected tables": "Conversió de les taules seleccionades"
"Database version": "Versió de la base de dades"
"Disabled": "Desactivat"
"Discovery": "Descobriment"
"Discovery SNMP settings": "Paràmetres SNMP del descobriment"
"Discovery range": "Interval de descoberta"
"Enable discovery after installation": "Activa el descobriment després de la instal·lació"
"Executable paths": "Camins dels executables"
"Execution status": "Estat de l'execució"
"Finished execution": "Execució finalitzada"
"Finishing tasks only. Schema migrations will not be replayed.": "Només tasques de finalització. Les migracions d'esquema no es tornaran a executar."
"I accept the license terms": "Accepto els termes de la llicència"
"I authorize discovery of the displayed range": "Autoritzo el descobriment del interval mostrat"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "He comprovat el registre i he confirmat que el procés anterior i els seus processos fills s'han aturat"
"I checked the previous attempt and accept that some changes may already be committed": "He comprovat l'intent anterior i accepto que alguns canvis ja poden estar consolidats"
"I reviewed this plan and have the required backups": "He revisat aquest pla i tinc les còpies de seguretat necessàries"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Si un procés s'atura inesperadament, conserveu log/cacti.log i confirmeu que el seu procés ha acabat abans de tornar-ho a provar explícitament. Un estat d'espera no confirma que l'inici hagi estat correcte."
"Importing templates": "Importació de plantilles"
"Install Kadupul": "Instal·la Kadupul"
"Installation and upgrade": "Instal·lació i actualització"
"Installation request was rejected.": "S'ha rebutjat la petició d'instal·lació."
"Installation steps": "Passos d'instal·lació"
"Installed": "Instal·lat"
"Keep a backup of the database, RRD files, configuration and secret material.": "Conserveu una còpia de seguretat de la base de dades, els fitxers RRD, la configuració i el material secret."
"Language": "Idioma"
"Large tables may require the dedicated CLI conversion tool before installation.": "Les taules grans poden requerir l'eina de conversió CLI dedicada abans de la instal·lació."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Deixeu en blanc els camps secrets per conservar les credencials emmagatzemades. Els secrets mai es tornen a mostrar."
"License": "Llicència"
"No action needed": "No cal cap acció"
"Observed": "Observat"
"Open the console": "Obre la consola"
"Operation": "Operació"
"Override discovery SNMP settings": "Substitueix els paràmetres SNMP del descobriment"
"Pass": "Superat"
"Poller interval in seconds": "Interval del poller en segons"
"Preparing CSRF protection": "Preparació de la protecció CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "El progrés mostra l'última fase registrada. Actualitzar aquesta pàgina mai inicia ni reintenta un procés."
"Recover stopped attempt": "Recupera l'intent aturat"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "La recuperació conserva les seleccions desades i mai finalitza un procés actiu. Reviseu el pla de nou abans de tornar-ho a provar."
"Review": "Revisió"
"Review installation plan": "Revisa el pla d'instal·lació"
"Run": "Executa"
"Run reviewed plan": "Executa el pla revisat"
"Save and review": "Desa i revisa"
"Scope": "Abast"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "L'estat no està disponible. El treball desat es conserva. Actualitzeu per reconnectar; no envieu una altra instal·lació."
"Synchronizing collectors": "Sincronització dels recol·lectors"
"Table conversions": "Conversions de taules"
"Templates": "Plantilles"
"The database version matches this application. Installation does not establish that polling is healthy.": "La versió de la base de dades coincideix amb aquesta aplicació. La instal·lació no estableix que el sondeig sigui correcte."
"The request outcome is unknown. Check execution status before retrying.": "Es desconeix el resultat de la petició. Comproveu l'estat de l'execució abans de tornar-ho a provar."
"Theme": "Tema"
"Verify": "Verifica"
"Verify the poller schedule and service account.": "Verifiqueu la planificació del poller i el compte de servei."
"Version change": "Canvi de versió"
"Waiting for the installation worker": "Esperant el procés d'instal·lació"
"collector": "recol·lector"
"complete": "completat"
"failed": "fallit"
"finish": "finalitza"
"install": "instal·la"
"not_started": "not_started"
"partial": "parcial"
"running": "en execució"
"succeeded": "correcte"
"upgrade": "actualitza"
"waiting": "en espera"
"Accept the license before saving the installation plan.": "Accepteu la llicència abans de desar el pla d'instal·lació."
"Invalid installation form.": "Formulari d'instal·lació no vàlid."
"Access denied.": "Accés denegat."
"Confirm the recovery warning before retrying.": "Confirmeu l'advertència de recuperació abans de tornar-ho a provar."
"Review and confirm the current installation plan.": "Reviseu i confirmeu el pla d'instal·lació actual."
"Confirm the discovery scope before starting.": "Confirmeu l'abast del descobriment abans de començar."
"Resolve the blocking checks before starting.": "Resoleu les comprovacions bloquejants abans de començar."
"Too many installer options.": "Massa opcions de l'instal·lador."
"Invalid installer option name.": "Nom d'opció de l'instal·lador no vàlid."
"Unknown or malformed installer option.": "Opció de l'instal·lador desconeguda o mal formada."
"Installer options must be scalar values.": "Les opcions de l'instal·lador han de ser valors escalars."
"Installer option is too long or contains a null byte.": "L'opció de l'instal·lador és massa llarga o conté un byte nul."
"Installer IDs and intervals must be whole numbers.": "Els ID i els intervals de l'instal·lador han de ser nombres enters."
"Installer ID or interval is outside its supported range.": "L'ID o l'interval de l'instal·lador és fora del seu interval admès."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "No s'ha pogut continuar la instal·lació. Torneu a carregar-ne l'estat i reviseu les comprovacions bloquejants abans de tornar-ho a provar."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirmeu que el procés anterior s'ha aturat abans de recuperar-ne el pla."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "La base de dades està instal·lada, però alguns recol·lectors encara necessiten sincronització. Torneu a provar les tasques de finalització després de comprovar-ne l'estat."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "La instal·lació s'ha aturat. Conserveu el registre de l'instal·lador, corregiu la causa i confirmeu explícitament un reintent. Alguns canvis a la base de dades ja poden estar consolidats. Comproveu la neteja dels connectors abans d'autoritzar un reintent."
"Next action": "Acció següent"
"Follow the execution status. Do not start another attempt while a worker is active.": "Seguiu l'estat de l'execució. No inicieu un altre intent mentre hi hagi un procés actiu."
"Complete the recovery checklist before retrying.": "Completeu la llista de verificació de recuperació abans de tornar-ho a provar."
"Verify collection and graph operation before enabling discovery.": "Verifiqueu el funcionament de la recol·lecció i dels gràfics abans d'activar el descobriment."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Resoleu els requisits bloquejats i torneu a comprovar. Les seleccions desades es conserven."
"Review the planned changes and backup checklist before authorizing execution.": "Reviseu els canvis previstos i la llista de verificació de còpies de seguretat abans d'autoritzar l'execució."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Trieu un perfil de recol·lecció i accepteu la llicència. Els paràmetres opcionals es poden obrir quan calgui."
"Download installation diagnostics": "Baixa el diagnòstic de la instal·lació"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Obriu un gràfic i confirmeu que les seves dades RRD s'actualitzen després d'un cicle del poller."
"Requirement details": "Detalls del requisit"
"Recover": "Recupera"
"Recovery checklist": "Llista de verificació de recuperació"
"Preserve log/cacti.log and record the failed attempt.": "Conserveu log/cacti.log i registreu l'intent fallit."
"Confirm that the previous worker and its child processes have stopped.": "Confirmeu que el procés anterior i els seus processos fills s'han aturat."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspeccioneu els canvis consolidats, la sincronització dels recol·lectors i la neteja dels connectors. Corregiu la causa abans de tornar-ho a provar."
"Review the saved plan again, then explicitly authorize a retry.": "Reviseu de nou el pla desat i autoritzeu explícitament un reintent."
"Recover a stopped worker": "Recupera un procés aturat"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Utilitzeu la recuperació només després de confirmar que aquest intent ja no s'està executant. La recuperació no atura cap procés."
"Collector and installation mode": "Mode de recol·lector i d'instal·lació"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "La configuració del desplegament determina el rol del recol·lector i les connexions a la base de dades. Verifiqueu la configuració del servidor principal abans d'iniciar un recol·lector."
"Discovery and SNMP settings": "Paràmetres de descobriment i SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Mantingueu el descobriment desactivat fins que s'hagin verificat la recol·lecció i la connectivitat dels recol·lectors."
"Template selection": "Selecció de plantilles"
"Templates selected for import": "Plantilles seleccionades per importar"
"No templates selected.": "No s'ha seleccionat cap plantilla."
"Backup checklist": "Llista de verificació de còpies de seguretat"
"Database backup and a tested restoration procedure.": "Còpia de seguretat de la base de dades i un procediment de restauració provat."
"RRD files and the service account permissions needed to restore them.": "Fitxers RRD i els permisos del compte de servei necessaris per restaurar-los."
"Configuration, keys and plugin data outside the database.": "Configuració, claus i dades de connectors fora de la base de dades."
"Post-installation checks": "Comprovacions posteriors a la instal·lació"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Les comprovacions verificades només cobreixen l'evidència mostrada. Les comprovacions no avaluades encara requereixen verificació de l'operador."
"Operational checks still require operator verification.": "Les comprovacions operatives encara requereixen verificació de l'operador."
"Status": "Estat"
"verified": "Verificat"
"action_required": "Cal una acció"
"not_assessed": "No avaluat"
"Database schema": "Esquema de la base de dades"
"Stored schema matches the application target.": "L'esquema emmagatzemat coincideix amb l'objectiu de l'aplicació."
"Target schema completion has not been confirmed.": "No s'ha confirmat la finalització de l'esquema objectiu."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Reviseu el resultat de la instal·lació i resoleu els errors abans de considerar completa l'actualització de l'esquema."
"Installation outcome": "Resultat de la instal·lació"
"A successful receipt matches the current target schema.": "Un rebut correcte coincideix amb l'esquema objectiu actual."
"A complete successful installation outcome has not been confirmed.": "No s'ha confirmat un resultat d'instal·lació complet i correcte."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Conserveu el registre de l'instal·lador i utilitzeu el procediment explícit de recuperació o reintent quan calgui."
"Collector synchronization": "Sincronització dels recol·lectors"
"The completed installer reports pending collector synchronization.": "L'instal·lador completat informa d'una sincronització de recol·lectors pendent."
"The completed installer reports no pending collectors.": "L'instal·lador completat informa que no hi ha recol·lectors pendents."
"Collector completion remains unconfirmed by this partial receipt.": "Aquest rebut parcial no confirma la finalització dels recol·lectors."
"Collector completion is not established by this installation outcome.": "Aquest resultat d'instal·lació no estableix la finalització dels recol·lectors."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Reviseu l'estat dels recol·lectors i torneu a provar les tasques de finalització en els resultats parcials. Això no verifica la frescor de la recol·lecció posterior."
"Scheduled collection": "Recol·lecció planificada"
"No poller or device was contacted by this assessment.": "Aquesta avaluació no ha contactat amb cap poller ni dispositiu."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Confirmeu que el planificador configurat executa el poller amb el compte de servei previst i reviseu-ne el proper cicle normal."
"Graph data": "Dades de gràfics"
"Live samples and RRD updates were not exercised.": "No s'han exercitat les mostres en directe ni les actualitzacions d'RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Després d'un cicle de recol·lecció normal, confirmeu que els gràfics esperats reben mostres noves i reviseu els errors del poller."
"Recovery readiness": "Preparació per a la recuperació"
"Backup restoration was not exercised.": "No s'ha exercitat la restauració de la còpia de seguretat."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifiqueu una restauració aïllada de la base de dades, els fitxers RRD, la configuració i el material de claus abans de confiar en la recuperació."
"No persisted local poller start has been recorded.": "No s'ha registrat cap inici persistent del poller local."
"Persisted poller timing is invalid and cannot establish scheduler health.": "El temps persistent del poller no és vàlid i no pot establir l'estat del planificador."
"The recorded poller start is in the future. Check clock synchronization.": "L'inici registrat del poller és en el futur. Comproveu la sincronització del rellotge."
"The recorded poller start is older than the native scheduling tolerance.": "L'inici registrat del poller és més antic que la tolerància de planificació nativa."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "S'ha registrat un inici del poller local dins de la tolerància de planificació nativa. No es verifiquen la finalització ni l'estat dels dispositius."
"readable": "llegible"
"missing or unreadable": "inexistent o il·legible"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaureu la versió completa i les seves dependències bloquejades; concediu accés de lectura al compte de servei."
"PHP temporary directory": "Directori temporal de PHP"
"directory writable by this process": "directori escrivible per aquest procés"
"missing or not writable": "inexistent o no escrivible"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configureu sys_temp_dir com a un directori existent escrivible pel compte d'instal·lació. Les importacions natives utilitzen fitxers temporals."
"Background worker launch": "Inici del procés en segon pla"
"required PHP functions available; launch not exercised": "funcions de PHP necessàries disponibles; inici no exercitat"
"required PHP launch function disabled": "funció d'inici de PHP necessària desactivada"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Activeu exec per a l'entorn d'execució PHP web, o utilitzeu l'instal·lador CLI autoritzat."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Activeu popen i pclose per a l'entorn d'execució PHP web, o utilitzeu l'instal·lador CLI autoritzat."
"Database transaction ownership": "Propietat de la transacció de la base de dades"
"autocommit enabled; no caller-owned transaction": "autocommit activat; cap transacció pròpia del cridador"
"autocommit disabled or caller transaction active": "autocommit desactivat o transacció del cridador activa"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Executeu la instal·lació fora d'una transacció pròpia del cridador i activeu l'autocommit a la seva connexió de mutació."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaureu el directori de la versió i concediu accés d'escriptura al compte d'instal·lació per a les importacions de recursos de plantilles. No el feu escrivible per a tothom."
"Worker file: install/background.php": "Fitxer del procés: install/background.php"
"Worker file: bin/legacy-installer.php": "Fitxer del procés: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fitxer del procés: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destinació d'importació: resource/snmp_queries"
"Import destination: resource/script_server": "Destinació d'importació: resource/script_server"
"Import destination: resource/script_queries": "Destinació d'importació: resource/script_queries"
"Import destination: scripts": "Destinació d'importació: scripts"
"Database privileges": "Privilegis de la base de dades"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "No s'han verificat els privilegis de migració efectius, inclosos els rols actius i les concessions específiques d'objectes."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Demaneu a l'administrador de la base de dades que verifiqui les escriptures de taules, els canvis d'esquema, els activadors i les rutines necessaris per al compte d'instal·lació i l'esquema. No concediu privilegis d'administrador global."
"Compare web and worker runtimes": "Compara els entorns d'execució web i del procés"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Això inicia explícitament una breu sonda PHP de només lectura. No reserva cap instal·lador, no escriu fitxers ni contacta amb dispositius."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "La sonda hereta aquest procés web i utilitza l'intèrpret PHP de l'instal·lador configurat. No inspecciona un planificador o servei separat."
"I authorize the read-only worker runtime comparison.": "Autoritzo la comparació d'entorns d'execució del procés de només lectura."
"Compare runtimes": "Compara els entorns d'execució"
"Runtime comparison results": "Resultats de la comparació d'entorns d'execució"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Les diferències de permisos i d'identitat poden ser intencionades. Les observacions de només lectura no demostren que les escriptures o la instal·lació tindran èxit."
"Confirm the read-only worker runtime comparison.": "Confirmeu la comparació d'entorns d'execució del procés de només lectura."
"The runtime comparison is unavailable.": "La comparació d'entorns d'execució no està disponible."
"Shared application secret": "Secret d'aplicació compartit"
"A strong web application secret is required before comparison.": "Cal un secret d'aplicació web fort abans de la comparació."
"Runtime comparison": "Comparació d'entorns d'execució"
"The configured worker runtime did not confirm a bounded comparison.": "L'entorn d'execució del procés configurat no ha confirmat una comparació acotada."
"The inherited worker secret could not be confirmed against the web secret.": "No s'ha pogut confirmar el secret heretat del procés amb el secret web."
"PHP runtime comparison": "Comparació de l'entorn d'execució de PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Tots dos entorns han de ser compatibles amb PHP 8.4; les versions de pedaç diferents requereixen revisió."
"Required extension comparison": "Comparació d'extensions necessàries"
"Required extension availability is checked; differing versions require review.": "Es comprova la disponibilitat de les extensions necessàries; les versions diferents requereixen revisió."
"Process identity comparison": "Comparació de la identitat del procés"
"Effective process identity is unavailable on this platform.": "La identitat efectiva del procés no està disponible en aquesta plataforma."
"Effective process identities match.": "Les identitats efectives dels processos coincideixen."
"Effective process identities differ; separate service accounts may be intentional.": "Les identitats efectives dels processos difereixen; pot ser intencionat que hi hagi comptes de servei separats."
"Directory access comparison": "Comparació de l'accés als directoris"
"Read-only directory permission observations match.": "Les observacions de permisos de directori de només lectura coincideixen."
"Directory locations or permission observations differ; review the service-account roles.": "Les ubicacions de directoris o les observacions de permisos difereixen; reviseu els rols dels comptes de servei."
"Worker directory read and traversal": "Lectura i recorregut dels directoris del procés"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Els directoris necessaris del procés han d'existir i permetre la lectura i el recorregut. No s'ha provat cap escriptura."
"The inherited worker secret matches the web secret for this private challenge.": "El secret heretat del procés coincideix amb el secret web per a aquest repte privat."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Reviseu l'intèrpret PHP configurat, les extensions necessàries, el secret heretat i els permisos de directori dels comptes de servei. No s'han exercitat escriptures ni l'inici de l'instal·lador."
"advisory": "informatiu"
