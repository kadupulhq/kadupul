"A useful name for this Rule.": "اسم مفيد لهذه القاعدة."
"Access denied.": "الولوج مرفوض."
"Add Tree Rule": "إضافة قاعدة شجرة"
"Back to Tree Rules": "العودة إلى قواعد الشجرة"
"Cancel": "إلغاء"
"Check this box to enable this rule.": "حدد هذه الخانة لتفعيل هذه القاعدة."
"Choose a Tree for the new Tree Items.": "اختر شجرة لعناصر الشجرة الجديدة."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "اختر ترويسة من الشجرة المحددة للربط بها، أو جذرها. تأكد من أنها لا تزال موجودة عند تنفيذ هذه القاعدة."
"Choose a header of the selected Tree.": "اختر ترويسة من الشجرة المحددة."
"Choose a listed Graph Grouping Style.": "اختر نمط تجميع الرسوم البيانية من القائمة."
"Choose a listed Leaf Item Type.": "اختر نوع عنصر الورقة من القائمة."
"Choose an existing Tree.": "اختر شجرة موجودة."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "اختر كيفية تجميع الرسوم البيانية عند رسمها لهذا المضيف تحديداً في الشجرة. يُستعمل لأوراق الأجهزة."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "انقر على «متابعة» لحذف قواعد الشجرة التالية مع معايير اختيار الكائنات وإنشاء الشجرة الخاصة بها."
"Click Continue to disable the following Tree Rules.": "انقر على «متابعة» لتعطيل قواعد الشجرة التالية."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "انقر على «متابعة» لنسخ قواعد الشجرة التالية. يمكنك اختيارياً تغيير صيغة العنوان لقواعد الشجرة الجديدة، والتي تبدأ في حالة تعطيل."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "انقر على «متابعة» لتفعيل قواعد الشجرة التالية. تأكد من أنه تم اختبارها بنجاح."
"Continue": "متابعة"
"Data Query Index": "فهرس استعلام المعطيات"
"Delete Tree Rules": "حذف قواعد الشجرة"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "نتيجة الحذف غير مؤكدة. يُرجى مراجعة قائمة قواعد الشجرة قبل إعادة المحاولة."
"Delete selected": "حذف المحدد"
"Device": "جهاز"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "لا يمكن لأوراق الأجهزة استعمال معايير على أعمدة الرسوم البيانية أو قوالب الرسوم البيانية. عند تغيير نوع عنصر الورقة إلى «جهاز»، حدّد هذا المربع لإزالة تلك المعايير؛ ولا يمكن استرجاعها."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "لا يمكن لأوراق الأجهزة استعمال معايير مبنية على الرسوم البيانية. أكّد إزالة %count% من المعايير للحفظ."
"Disable Tree Rules": "تعطيل قواعد الشجرة"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "نتيجة التعطيل غير مؤكدة. يُرجى مراجعة قائمة قواعد الشجرة قبل إعادة المحاولة."
"Disable selected": "تعطيل المحدد"
"Duplicate Tree Rules": "نسخ قواعد الشجرة"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "نتيجة النسخ غير مؤكدة. يُرجى مراجعة قائمة قواعد الشجرة قبل إعادة المحاولة."
"Duplicate selected": "تكرار المحدد"
"Edit Tree Rule": "تعديل قاعدة الشجرة"
"Enable Rule": "تفعيل القاعدة"
"Enable Tree Rules": "تفعيل قواعد الشجرة"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "نتيجة التفعيل غير مؤكدة. يُرجى مراجعة قائمة قواعد الشجرة قبل إعادة المحاولة."
"Enable selected": "تفعيل المحدد"
"Enter a name.": "أدخل اسماً."
"Enter a valid name format.": "أدخل صيغة اسم صالحة."
"Enter at most %count% characters.": "أدخل %count% حرفاً على الأكثر."
"Enter single-line text.": "أدخل نصاً من سطر واحد."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "يتم استبدال كل <rule_name> باسم قاعدة الشجرة الجاري نسخها."
"Graph": "مبيان"
"Graph Grouping Style": "نمط تجميع المبيانات"
"Graph Template": "قالب المبيان"
"Invalid Tree Rule selection.": "تحديد قاعدة الشجرة غير صالح."
"Leaf Item Type": "نوع العنصر الطرفي"
"Name": "الاسم"
"Object Selection and Tree Creation Criteria": "معايير اختيار الكائنات وإنشاء الشجرة"
"One or more selected Tree Rules no longer exist.": "واحدة أو أكثر من قواعد الشجرة المحددة لم تعد موجودة."
"Optional: Sub-Tree Item": "اختياري: عنصر شجرة فرعية"
"Remove graph-based criteria": "إزالة المعايير المبنية على الرسوم البيانية"
"Save": "حفظ"
"Save outcome is uncertain. Reload before retrying.": "نتيجة الحفظ غير مؤكدة. أعد التحميل قبل إعادة المحاولة."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "احفظ القاعدة أولاً؛ وتُضاف معايير اختيار الكائنات وإنشاء الشجرة الخاصة بها بعد ذلك."
"Select": "تحديد"
"Select %name%": "تحديد %name%"
"Select at least one Tree Rule.": "حدّد قاعدة شجرة واحدة على الأقل."
"Select at most 100 Tree Rules at a time.": "حدّد 100 قاعدة شجرة على الأكثر في المرة الواحدة."
"Select up to %count% rows at a time.": "حدّد ما يصل إلى %count% صفوف في المرة الواحدة."
"The Item Type that shall be dynamically added to the tree.": "نوع العنصر الذي ستتم إضافته ديناميكياً إلى الشجرة."
"The name format must give every copy a name of 1 to 255 characters.": "يجب أن يمنح تنسيق الاسم لكل نسخة اسماً يتراوح طوله بين 1 و255 حرفاً."
"The tree rule changed since you opened this form. Reload before saving.": "تغيّرت قاعدة الشجرة منذ فتح هذه الاستمارة. أعد التحميل قبل الحفظ."
"Title Format": "تنسيق العنوان"
"Tree": "شجرة"
"Tree Rule Selection [edit: %name%]": "تحديد قاعدة الشجرة [تعديل: %name%]"
"Tree Rules Selection [new]": "تحديد قواعد الشجرة [جديد]"
"Tree rule not found.": "لم يتم العثور على قاعدة الشجرة."
"Tree rule saved.": "تم حفظ قاعدة الشجرة."
"Unable to load Tree Rules. Reload before retrying.": "تعذّر تحميل قواعد الشجرة. أعد التحميل قبل إعادة المحاولة."
"Unable to load the tree rule. Reload before retrying.": "تعذّر تحميل قاعدة الشجرة. أعد التحميل قبل إعادة المحاولة."
"Unexpected fields were submitted.": "تم إرسال حقول غير متوقعة."
