"The SNMP entry order changed since you opened this page. Reload before moving.": "Itondekanya ry'ibyinjizwa bya SNMP ryahindutse uhereye igihe wafunguriye iyi paji. Ongera utangize mbere yo kwimura."
"The automation template changed since you opened this form. Reload before saving.": "Inyandikorugero yo kwikoresha yahindutse uhereye igihe wafunguriye iyi nyandiko. Ongera utangize mbere yo kubika."
