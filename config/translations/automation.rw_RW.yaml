"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "Umubare ntarengwa w'inshuro zo kugerageza kugera ku gikoresho ukoresheje ijambo ryo gusoma rya SNMP mbere yo kubireka."
"The maximum number of milliseconds Kadupul will wait for an SNMP response (does not work with php-snmp support).": "Umubare ntarengwa wa milisegonda Kadupul izategereza igisubizo cya SNMP (ntibikora iyo hari ubufasha bwa php-snmp)."
"The name can be at most 100 characters.": "Izina rishobora kugira inyuguti zitarenze 100."
"The name format must give every copy a name of 1 to 100 characters.": "Imiterere y'izina igomba guha buri kopi izina rifite kuva ku nyuguti 1 kugeza ku 100."
"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "Iyi nyandiko y'Itsinda ry'Amahitamo ya SNMP yarangiye igihe. Ongera ufungure Itsinda ry'Amahitamo ya SNMP ukoreshe inyandiko yaryo igezweho."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Iyi ni inyandiko idasanzwe izahuzwa n'inyandiko ya sysDescr y'igikoresho kugira ngo gihuzwe n'iyi Nyandikorugero yo Kwikoresha. Imvugo y'imiterere iyo ari yo yose ya Perl ishobora gukoreshwa hiyongereyeho imvugo iyo ari yo yose ya SQL Where."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Iyi ni inyandiko idasanzwe izahuzwa n'inyandiko ya sysName y'igikoresho kugira ngo gihuzwe n'iyi Nyandikorugero yo Kwikoresha. Imvugo y'imiterere iyo ari yo yose ya Perl ishobora gukoreshwa hiyongereyeho imvugo iyo ari yo yose ya SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Iyi ni inyandiko idasanzwe izahuzwa n'inyandiko ya sysOid y'igikoresho kugira ngo gihuzwe n'iyi Nyandikorugero yo Kwikoresha. Imvugo y'imiterere iyo ari yo yose ya Perl ishobora gukoreshwa hiyongereyeho imvugo iyo ari yo yose ya SQL Where."
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "Iyi nyandiko ya kera y'inyandikorugero yo kwikoresha yarangiye igihe. Fungura Amategeko y'Ibikoresho maze wohereze inyandiko nshya."
