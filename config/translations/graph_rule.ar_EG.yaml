"A useful name for this Rule.": "اسم مفيد لهذه القاعدة."
"Access denied.": "تم رفض الوصول."
"Add Graph Rule": "إضافة قاعدة رسم بياني"
"Back to Graph Rules": "العودة إلى قواعد الرسوم البيانية"
"Cancel": "إلغاء"
"Check this box to enable this rule.": "حدد هذا المربع لتفعيل هذه القاعدة."
"Choose a Data Query to apply to this rule.": "اختر استعلام بيانات لتطبيقه على هذه القاعدة."
"Choose a Graph Type": "اختر نوع الرسم البياني"
"Choose a Graph Type of the selected Data Query.": "اختر نوع رسم بياني من استعلام البيانات المحدد."
"Choose an existing Data Query.": "اختر استعلام بيانات حالي."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "اختر أي نوع من أنواع الرسوم البيانية المتاحة لاستعلام البيانات المحدد لتطبيقه على هذه القاعدة."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "اضغط متابعة لحذف قواعد الرسوم البيانية التالية مع معايير اختيار الأجهزة وإنشاء الرسوم البيانية الخاصة بها."
"Click Continue to disable the following Graph Rules.": "اضغط متابعة لتعطيل قواعد الرسوم البيانية التالية."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "اضغط متابعة لتكرار قواعد الرسوم البيانية التالية. يمكنك اختياريًا تغيير تنسيق العنوان لقواعد الرسوم البيانية الجديدة، والتي تبدأ معطّلة."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "اضغط متابعة لتفعيل قواعد الرسوم البيانية التالية. تأكد من اختبارها بنجاح."
"Continue": "متابعة"
"Data Query": "استعلام البيانات"
"Delete Graph Rules": "حذف قواعد الرسوم البيانية"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة الحذف غير مؤكدة. راجع قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Delete selected": "حذف المحدد"
"Device Selection and Graph Creation Criteria": "معايير اختيار الأجهزة وإنشاء الرسوم البيانية"
"Disable Graph Rules": "تعطيل قواعد الرسوم البيانية"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة التعطيل غير مؤكدة. راجع قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Disable selected": "تعطيل المحدد"
"Duplicate Graph Rules": "تكرار قواعد الرسوم البيانية"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة التكرار غير مؤكدة. راجع قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Duplicate selected": "تكرار المحدد"
"Edit Graph Rule": "تعديل قاعدة الرسم البياني"
"Enable Graph Rules": "تفعيل قواعد الرسوم البيانية"
"Enable Rule": "تفعيل القاعدة"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة التفعيل غير مؤكدة. راجع قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Enable selected": "تفعيل المحدد"
"Enter a name.": "أدخل اسماً."
"Enter a valid name format.": "أدخل تنسيق اسم صالح."
"Enter at most %count% characters.": "أدخل %count% حرف بحد أقصى."
"Enter single-line text.": "أدخل نصًا من سطر واحد."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "يتم استبدال كل <rule_name> باسم قاعدة الرسم البياني التي يتم نسخها."
"Graph Type": "نوع الرسم البياني"
"Graph rule not found.": "لم يتم العثور على قاعدة الرسم البياني."
"Graph rule saved.": "تم حفظ قاعدة الرسم البياني."
"Invalid Graph Rule selection.": "تحديد قاعدة الرسم البياني غير صالح."
"Name": "الاسم"
"One or more selected Graph Rules no longer exist.": "واحدة أو أكثر من قواعد الرسوم البيانية المحددة لم تعد موجودة."
"Rule Selection [edit: %name%]": "تحديد القاعدة [تعديل: %name%]"
"Rule Selection [new]": "تحديد القواعد [جديد]"
"Save": "حفظ"
"Save outcome is uncertain. Reload before retrying.": "نتيجة الحفظ غير مؤكدة. أعد التحميل قبل إعادة المحاولة."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "احفظ القاعدة أولاً؛ ثم تُضاف معايير اختيار الأجهزة وإنشاء الرسوم البيانية الخاصة بها بعد ذلك."
"Select": "تحديد"
"Select %name%": "تحديد %name%"
"Select at least one Graph Rule.": "حدد قاعدة رسم بياني واحدة على الأقل."
"Select at most 100 Graph Rules at a time.": "حدد 100 قاعدة رسم بياني بحد أقصى في المرة الواحدة."
"Select up to %count% rows at a time.": "اختر ما يصل إلى %count% من الصفوف في المرة الواحدة."
"The graph rule changed since you opened this form. Reload before saving.": "تغيّرت قاعدة الرسم البياني منذ فتح هذا النموذج. أعد التحميل قبل الحفظ."
"The name format must give every copy a name of 1 to 255 characters.": "يجب أن يمنح تنسيق الاسم كل نسخة اسمًا يتراوح طوله بين 1 و255 حرفًا."
"Title Format": "تنسيق العنوان"
"Unable to load Graph Rules. Reload before retrying.": "تعذّر تحميل قواعد الرسوم البيانية. أعد التحميل قبل إعادة المحاولة."
"Unable to load the graph rule. Reload before retrying.": "تعذّر تحميل قاعدة الرسم البياني. أعد التحميل قبل إعادة المحاولة."
"Unexpected fields were submitted.": "تم إرسال حقول غير متوقعة."
