"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "வரைபடங்களையும் தரவு மூலங்களையும் அகற்றுவதற்கு முன் பகிரப்பட்ட தரவு மூலங்கள் அல்லது ஒருங்கிணைந்த வரைபடங்கள் பிரிக்கப்பட வேண்டும்."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "சாதன அகற்றலின் முடிவு உறுதியற்றது. மீண்டும் முயற்சிக்கும் முன் தேர்ந்தெடுக்கப்பட்ட சாதனங்கள், வரைபடங்கள் மற்றும் தரவு மூலங்களைச் சரிபார்க்கவும்."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "சாதன அகற்றலை இங்கே செயல்தவிர்க்க முடியாது. வரைபடங்கள் மற்றும் முடக்கப்பட்ட தரவு மூலங்களைத் தக்கவைப்பதா அல்லது அகற்றுவதா என்பதைத் தேர்ந்தெடுக்கவும்."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "வரைபட அகற்றலுக்கு முன் பகிரப்பட்ட தரவு மூலங்களும் ஒருங்கிணைந்த வரைபடங்களும் பிரிக்கப்பட வேண்டும். தக்கவைக்கப்பட்ட வரைபடங்களும் தரவு மூலங்களும் ஒதுக்கப்படாதவையாக மாறும்."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "பாதிக்கப்பட்ட தொலைநிலை சேகரிப்பான்கள் ஆன்லைனில் இருக்க வேண்டும். தோல்வியுற்ற அகற்றல் தொலைநிலை அல்லது செருகுநிரல் மாற்றங்களை விட்டுச்செல்லலாம்; மீண்டும் முயற்சிக்கும் முன் முடிவை ஆய்வு செய்யவும்."
"RRD file cleanup follows the configured maintenance policy.": "RRD கோப்பு சுத்திகரிப்பு கட்டமைக்கப்பட்ட பராமரிப்புக் கொள்கையைப் பின்பற்றுகிறது."
