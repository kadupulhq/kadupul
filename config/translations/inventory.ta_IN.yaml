"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "தேர்ந்தெடுக்கப்பட்ட ஒவ்வொரு சாதனத்திற்கும் இந்த SNMP அமைப்புகளைப் பயன்படுத்தவும். ஒவ்வொரு சாதனத்தின் சேமிக்கப்பட்ட நற்சான்றிதழ்களைத் தக்கவைக்கவும் அல்லது வெளிப்படையாக மாற்றவும். சேமிக்கப்பட்ட ரகசியங்கள் ஒருபோதும் காட்டப்படாது."
