"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "இந்தச் சாதனங்களுக்கான மறுமொழி நேரங்கள், போல் எண்ணிக்கைகள் மற்றும் கிடைக்கும் தன்மையை மீட்டமைக்கவும். வரைபடங்கள், வரலாற்றுத் தரவு மற்றும் சாதன அமைப்புகள் தக்கவைக்கப்படுகின்றன. அடுத்த போலுடன் புள்ளிவிவரங்கள் மீண்டும் தொடங்கும்."
