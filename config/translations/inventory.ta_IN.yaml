"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "இந்தச் சாதனங்களுக்குத் தற்போது ஒதுக்கப்பட்ட வார்ப்புருக்களைப் பயன்படுத்தவும். விடுபட்ட வரைபட மற்றும் தரவு-வினவல் தொடர்புகள் சேர்க்கப்படும், மேலும் பயன்படுத்தப்படாத வரைபட-வார்ப்புரு தொடர்புகள் அகற்றப்படலாம். வார்ப்புருக்கள் இல்லாத சாதனங்கள் தவிர்க்கப்படும். தற்போதைய வரைபடங்களும் வரலாற்றுத் தரவும் தக்கவைக்கப்படும்; தானியங்கு புதிய வரைபடங்களை உருவாக்கலாம்."
