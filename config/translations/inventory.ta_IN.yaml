"Apply existing graph and tree automation rules to the selected devices. Rules may create graphs, data sources and tree entries.": "தேர்ந்தெடுக்கப்பட்ட சாதனங்களுக்கு தற்போதைய வரைபட மற்றும் மர தானியங்கு விதிகளைப் பயன்படுத்தவும். விதிகள் வரைபடங்கள், தரவு மூலங்கள் மற்றும் மர உள்ளீடுகளை உருவாக்கக்கூடும்."
