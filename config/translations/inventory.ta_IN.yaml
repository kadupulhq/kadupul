"Retain graphs and disable data sources": "வரைபடங்களைத் தக்கவைத்து தரவு மூலங்களை முடக்கு"
"Remove graphs and data sources": "வரைபடங்கள் மற்றும் தரவு மூலங்களை அகற்று"
