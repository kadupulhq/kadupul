"You must specify both the Months and Days of Month.": "Πρέπει να καθορίσετε τόσο τους μήνες όσο και τις ημέρες του μήνα."
"You must specify the Months, Weeks of Months, and Days of Week.": "Πρέπει να καθορίσετε τους μήνες, τις εβδομάδες του μήνα και τις ημέρες της εβδομάδας."
"You must specify the day of the week.": "Πρέπει να καθορίσετε την ημέρα της εβδομάδας."
