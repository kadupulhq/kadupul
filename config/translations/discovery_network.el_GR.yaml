"After the selected Run Limit, the discovery process will be terminated.": "Μετά το επιλεγμένο όριο εκτέλεσης, η διεργασία εντοπισμού θα τερματιστεί."
"Allow same sysName on different hosts": "Να επιτρέπεται το ίδιο sysName σε διαφορετικούς κεντρικούς υπολογιστές"
