"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Λίστα εναλλακτικών διακομιστών DNS διαχωρισμένη με κενά για την επίλυση ονομάτων DNS. Αν παραμείνει κενή, θα χρησιμοποιηθεί το λειτουργικό σύστημα του poller για την επίλυση ονομάτων DNS."
"Access denied.": "Άρνηση πρόσβασης."
