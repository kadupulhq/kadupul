"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "இந்த SNMP விருப்பத் தொகுப்பு படிவம் காலாவதியாகிவிட்டது. SNMP விருப்பத் தொகுப்பை மீண்டும் திறந்து அதன் தற்போதைய படிவத்தைப் பயன்படுத்தவும்."
"This is a unique string that will be matched to a devices sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "இது இந்தத் தானியங்கு வார்ப்புருவுடன் இணைக்கச் சாதனத்தின் sysDescr சரத்துடன் பொருந்தும் தனித்துவமான சரமாகும். எந்த SQL Where வெளிப்பாட்டுடனும் கூடுதலாக எந்த Perl வழக்கமான வெளிப்பாட்டையும் பயன்படுத்தலாம்."
"This is a unique string that will be matched to a devices sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "இது இந்தத் தானியங்கு வார்ப்புருவுடன் இணைக்கச் சாதனத்தின் sysName சரத்துடன் பொருந்தும் தனித்துவமான சரமாகும். எந்த SQL Where வெளிப்பாட்டுடனும் கூடுதலாக எந்த Perl வழக்கமான வெளிப்பாட்டையும் பயன்படுத்தலாம்."
