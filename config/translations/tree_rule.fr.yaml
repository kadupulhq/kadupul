"A useful name for this Rule.": "Un nom utile pour cette règle."
"Access denied.": "Accès refusé."
"Add Tree Rule": "Ajouter une règle d’arbre"
"Back to Tree Rules": "Retour aux règles des arbres"
"Check this box to enable this rule.": "Cochez cette case pour activer cette règle."
"Choose a Tree for the new Tree Items.": "Choisissez un arbre pour les nouveaux éléments de l’arbre."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Choisissez un en-tête de l’arbre sélectionné auquel rattacher les éléments, ou sa racine. Vérifiez qu’il existe toujours lorsque cette règle s’exécute."
"Choose a header of the selected Tree.": "Choisissez un en-tête de l’arbre sélectionné."
"Choose a listed Graph Grouping Style.": "Choisissez un style de regroupement de graphiques de la liste."
"Choose a listed Leaf Item Type.": "Choisissez un type d’élément feuille de la liste."
"Choose an existing Tree.": "Choisissez un arbre existant."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Choisissez comment les graphiques de cet hôte sont regroupés dans l’arbre. Utilisé pour les feuilles de type équipement."
"Data Query Index": "Index des requêtes de données"
"Device": "Équipement"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Les feuilles de type équipement ne peuvent pas utiliser de critères sur les colonnes des graphiques ou des modèles de graphique. Lorsque vous passez le type d’élément feuille à Équipement, cochez cette case pour supprimer ces critères ; ils ne pourront pas être récupérés."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Les feuilles de type équipement ne peuvent pas utiliser de critères sur les graphiques. Confirmez la suppression de %count% critères pour enregistrer."
"Edit Tree Rule": "Modifier la règle d’arbre"
"Enable Rule": "Activer la règle"
"Enter a name.": "Saisissez un nom."
"Enter at most %count% characters.": "Saisissez au plus %count% caractères."
"Enter single-line text.": "Saisissez un texte sur une seule ligne."
"Graph": "Graphique"
"Graph Grouping Style": "Style de regroupement des graphiques"
"Graph Template": "Modèle de graphique"
"Leaf Item Type": "Type d’élément feuille"
"Name": "Nom"
"Object Selection and Tree Creation Criteria": "Critères de sélection d’objets et de création d’arbres"
"Optional: Sub-Tree Item": "Facultatif : élément de sous-arbre"
"Remove graph-based criteria": "Supprimer les critères sur les graphiques"
"Save": "Enregistrer"
"Save outcome is uncertain. Reload before retrying.": "Le résultat de l’enregistrement est incertain. Rechargez avant de réessayer."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Enregistrez d’abord la règle ; ses critères de sélection d’objets et de création d’arbres s’ajoutent ensuite."
"The Item Type that shall be dynamically added to the tree.": "Le type d’élément ajouté dynamiquement à l’arbre."
"The tree rule changed since you opened this form. Reload before saving.": "La règle d’arbre a changé depuis l’ouverture de ce formulaire. Rechargez avant d’enregistrer."
"Tree": "Arbre"
"Tree Rule Selection [edit: %name%]": "Sélection de règle d’arbre [modifier : %name%]"
"Tree Rules Selection [new]": "Sélection de règle d’arbre [nouvelle]"
"Tree rule not found.": "Règle d’arbre introuvable."
"Tree rule saved.": "Règle d’arbre enregistrée."
"Unable to load the tree rule. Reload before retrying.": "Impossible de charger la règle d’arbre. Rechargez avant de réessayer."
"Unexpected fields were submitted.": "Des champs inattendus ont été envoyés."
