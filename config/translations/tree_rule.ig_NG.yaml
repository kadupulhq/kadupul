"A useful name for this Rule.": "Aha bara uru maka Iwu a."
"Access denied.": "Ajụrụ ohere."
"Add Tree Rule": "Tinye Iwu Osisi"
"Back to Tree Rules": "Laghachi na Iwu Osisi"
"Check this box to enable this rule.": "Kaa akara na igbe a iji gbanye iwu a."
"Choose a Tree for the new Tree Items.": "Họrọ Osisi maka Ihe Osisi ọhụrụ."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Họrọ isiokwu nke Osisi ahọpụtara iji jikọọ na ya, ma ọ bụ mgbọrọgwụ ya. Jide n'aka na ọ ka dị mgbe emejupụtara iwu a."
"Choose a header of the selected Tree.": "Họrọ isiokwu nke Osisi ahọpụtara."
"Choose a listed Graph Grouping Style.": "Họrọ Ụdị Nchịkọta Eserese edepụtara."
"Choose a listed Leaf Item Type.": "Họrọ Ụdị Ihe Akwụkwọ edepụtara."
"Choose an existing Tree.": "Họrọ Osisi dị ugbu a."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Họrọ otu esi achịkọta eserese mgbe a na-ese ya maka host a pụrụ iche na osisi ahụ. A na-eji ya maka akwụkwọ Ngwaọrụ."
"Data Query Index": "Ndụkọta Ajụjụ Data"
"Device": "Ngwaọrụ"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Akwụkwọ ngwaọrụ enweghị ike iji njirimara na kọlụm eserese ma ọ bụ tẹmpletị eserese. Mgbe ị na-agbanwe Ụdị Ihe Akwụkwọ gaa na Ngwaọrụ, kaa akara na igbe a iji wepụ njirimara ndị ahụ; enweghị ike iweghachite ha."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Akwụkwọ ngwaọrụ enweghị ike iji njirimara dabere na eserese. Kwado mwepụ nke njirimara %count% iji chekwaa."
"Edit Tree Rule": "Dezie Iwu Osisi"
"Enable Rule": "Gbanye Iwu"
"Enter a name.": "Tinye aha."
"Enter at most %count% characters.": "Tinye ruru mkpụrụedemede %count% kachasị."
"Enter single-line text.": "Tinye ederede otu ahịrị."
"Graph": "Eserese"
"Graph Grouping Style": "Ụdị Nchịkọta Eserese"
"Graph Template": "Ndebiri Eserese"
"Leaf Item Type": "Ụdị Ihe Akwụkwọ"
"Name": "Aha"
"Object Selection and Tree Creation Criteria": "Nhọrọ Ihe na Ụkpụrụ Mmepụta Osisi"
"Optional: Sub-Tree Item": "Nhọrọ: Ihe Sub-Tree"
"Remove graph-based criteria": "Wepụ ụkpụrụ dabere na eserese"
"Save": "Chekwaa"
"Save outcome is uncertain. Reload before retrying.": "Nsonaazụ nchekwa edoghị anya. Butegharịa tupu ịnwaa ọzọ."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Chekwaa iwu ahụ mbụ; a na-agbakwunye Nhọrọ Ihe na Ụkpụrụ Imepụta Osisi ya ma emechaa."
"The Item Type that shall be dynamically added to the tree.": "Ụdị Ihe a ga-agbakwunye na osisi na-akpaghị aka."
"The tree rule changed since you opened this form. Reload before saving.": "Iwu osisi agbanweela kemgbe ị meghere fọm a. Bugharịa tupu ịchekwaa."
"Tree": "Osisi"
"Tree Rule Selection [edit: %name%]": "Nhọrọ Iwu Osisi [dezie: %name%]"
"Tree Rules Selection [new]": "Nhọrọ Iwu Osisi [ọhụrụ]"
"Tree rule not found.": "Achọtaghị iwu osisi."
"Tree rule saved.": "Echekwara iwu osisi."
"Unable to load the tree rule. Reload before retrying.": "Enweghị ike ibu iwu osisi ahụ. Bugharịa tupu ị nwaa ọzọ."
"Unexpected fields were submitted.": "E nyefere ogige ndị a na-atụghị anya ha."
