"Action": "செயல்"
"Advanced options": "மேம்பட்ட விருப்பங்கள்"
"Applying database upgrades": "தரவுத்தள மேம்படுத்தல்கள் பயன்படுத்தப்படுகின்றன"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "தரவுத்தளம், RRD கோப்புகள், கட்டமைப்பு மற்றும் விசைகளைக் காப்புப்பிரதி எடுக்கவும். பயன்பாட்டுத் திரும்பப்பெறுதலால் செயல்தவிர்க்க முடியாத மாற்றங்களைத் தரவுத்தள மேம்படுத்தல்கள் செய்யக்கூடும்."
"Blocked": "தடுக்கப்பட்டது"
"Check": "சரிபார்"
"Check again": "மீண்டும் சரிபார்"
"Check collection freshness and collector connectivity before enabling discovery.": "கண்டறிதலை இயக்கும் முன் சேகரிப்புப் புதுமை மற்றும் சேகரிப்பான் இணைப்பைச் சரிபார்க்கவும்."
"Check requirements": "தேவைகளைச் சரிபார்"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "சோதனைகள் இந்தச் செயல்முறை மற்றும் கோப்பு முறைமை அனுமதிகளை ஆய்வு செய்கின்றன. அவை சோதனைக் கோப்புகளை எழுதவோ சாதனங்களைத் தொடர்பு கொள்ளவோ மாட்டா."
"Collection profile": "சேகரிப்பு சுயவிவரம்"
"Collector": "சேகரிப்பான்"
"Configure": "கட்டமை"
"Configuring collection profiles": "சேகரிப்பு சுயவிவரங்களைக் கட்டமைக்கிறது"
"Configuring discovery": "கண்டறிதலைக் கட்டமைக்கிறது"
"Configuring the local device": "உள்ளூர் சாதனத்தைக் கட்டமைக்கிறது"
"Confirming database version": "தரவுத்தளப் பதிப்பை உறுதிப்படுத்துகிறது"
"Converting selected tables": "தேர்ந்தெடுக்கப்பட்ட அட்டவணைகள் மாற்றப்படுகின்றன"
"Database version": "தரவுத்தளப் பதிப்பு"
"Disabled": "முடக்கப்பட்டது"
"Discovery": "கண்டறிதல்"
"Discovery SNMP settings": "கண்டறிதல் SNMP அமைப்புகள்"
"Discovery range": "கண்டறிதல் வரம்பு"
"Enable discovery after installation": "நிறுவிய பின் கண்டறிதலை இயக்கு"
"Executable paths": "செயல்படுத்தக்கூடிய பாதைகள்"
"Execution status": "செயல்படுத்தல் நிலை"
"Finished execution": "செயல்படுத்தல் முடிந்தது"
"Finishing tasks only. Schema migrations will not be replayed.": "முடிக்கும் பணிகள் மட்டுமே. ஸ்கீமா இடம்பெயர்வுகள் மீண்டும் இயக்கப்படாது."
"I accept the license terms": "நான் உரிம விதிமுறைகளை ஏற்கிறேன்"
"I authorize discovery of the displayed range": "காட்டப்படும் வரம்பைக் கண்டறிய நான் அங்கீகரிக்கிறேன்"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "நான் பதிவைச் சரிபார்த்து முந்தைய பணியாளரும் அதன் துணைச் செயல்முறைகளும் நிறுத்தப்பட்டதை உறுதிப்படுத்தினேன்"
"I checked the previous attempt and accept that some changes may already be committed": "முந்தைய முயற்சியை நான் சரிபார்த்து சில மாற்றங்கள் ஏற்கனவே சேமிக்கப்பட்டிருக்கலாம் என்பதை ஏற்கிறேன்"
"I reviewed this plan and have the required backups": "நான் இந்தத் திட்டத்தை மதிப்பாய்வு செய்தேன் மற்றும் தேவையான காப்புப்பிரதிகள் என்னிடம் உள்ளன"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "ஒரு பணியாளர் எதிர்பாராதவிதமாக நின்றால், log/cacti.log கோப்பைப் பாதுகாத்து வெளிப்படையாக மீண்டும் முயற்சிப்பதற்கு முன் அதன் செயல்முறை முடிவடைந்ததை உறுதிப்படுத்தவும். காத்திருக்கும் நிலை வெற்றிகரமான துவக்கத்தை உறுதிப்படுத்தாது."
"Importing templates": "வார்ப்புருக்கள் இறக்குமதி செய்யப்படுகின்றன"
"Install Kadupul": "Kadupul-ஐ நிறுவு"
"Installation and upgrade": "நிறுவல் மற்றும் மேம்படுத்தல்"
"Installation request was rejected.": "நிறுவல் கோரிக்கை நிராகரிக்கப்பட்டது."
"Installation steps": "நிறுவல் படிகள்"
"Installed": "நிறுவப்பட்டது"
"Keep a backup of the database, RRD files, configuration and secret material.": "தரவுத்தளம், RRD கோப்புகள், கட்டமைப்பு மற்றும் ரகசியப் பொருட்களின் காப்புப்பிரதியை வைத்திருக்கவும்."
"Language": "மொழி"
"Large tables may require the dedicated CLI conversion tool before installation.": "நிறுவலுக்கு முன் பெரிய அட்டவணைகளுக்குப் பிரத்யேக CLI மாற்றுக் கருவி தேவைப்படலாம்."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "சேமிக்கப்பட்ட நற்சான்றிதழ்களைத் தக்கவைக்க ரகசியப் புலங்களைக் காலியாக விடவும். ரகசியங்கள் ஒருபோதும் மீண்டும் காட்டப்படாது."
"License": "உரிமம்"
"No action needed": "எந்த நடவடிக்கையும் தேவையில்லை"
"Observed": "அவதானிக்கப்பட்டது"
"Open the console": "கன்சோலைத் திற"
"Operation": "செயல்பாடு"
"Override discovery SNMP settings": "கண்டறிதல் SNMP அமைப்புகளை மேலெழுது"
"Pass": "தேர்ச்சி"
"Poller interval in seconds": "போலர் இடைவெளி விநாடிகளில்"
"Preparing CSRF protection": "CSRF பாதுகாப்பைத் தயாரிக்கிறது"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "முன்னேற்றம் கடைசியாகப் பதிவு செய்யப்பட்ட கட்டத்தைக் காட்டுகிறது. இந்தப் பக்கத்தைப் புதுப்பிப்பது ஒருபோதும் பணியாளரைத் தொடங்காது அல்லது மீண்டும் முயற்சிக்காது."
"Recover stopped attempt": "நிறுத்தப்பட்ட முயற்சியை மீட்டெடு"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "மீட்பு சேமிக்கப்பட்ட தேர்வுகளைத் தக்கவைக்கிறது மற்றும் இயங்கும் பணியாளரை ஒருபோதும் நிறுத்தாது. மீண்டும் முயற்சிப்பதற்கு முன் திட்டத்தை மீண்டும் மதிப்பாய்வு செய்யவும்."
"Review": "மதிப்பாய்வு"
"Review installation plan": "நிறுவல் திட்டத்தை மதிப்பாய்வு செய்"
"Run": "இயக்கு"
"Run reviewed plan": "மதிப்பாய்வு செய்யப்பட்ட திட்டத்தை இயக்கு"
"Save and review": "சேமித்து மதிப்பாய்வு செய்"
"Scope": "நோக்கெல்லை"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "நிலை கிடைக்கவில்லை. சேமிக்கப்பட்ட பணி தக்கவைக்கப்படுகிறது. மீண்டும் இணையப் புதுப்பிக்கவும்; மற்றொரு நிறுவலைச் சமர்ப்பிக்க வேண்டாம்."
"Synchronizing collectors": "சேகரிப்பான்கள் ஒத்திசைக்கப்படுகின்றன"
"Table conversions": "அட்டவணை மாற்றங்கள்"
"Templates": "வார்ப்புருக்கள்"
"The database version matches this application. Installation does not establish that polling is healthy.": "தரவுத்தளப் பதிப்பு இந்தப் பயன்பாட்டுடன் பொருந்துகிறது. நிறுவல் போலிங் நலமாக இருப்பதை உறுதிப்படுத்தாது."
"The request outcome is unknown. Check execution status before retrying.": "கோரிக்கையின் முடிவு தெரியவில்லை. மீண்டும் முயற்சிக்கும் முன் செயல்படுத்தல் நிலையைச் சரிபார்க்கவும்."
"Theme": "தீம்"
"Verify": "சரிபார்"
"Verify the poller schedule and service account.": "போலர் அட்டவணை மற்றும் சேவைக் கணக்கைச் சரிபார்க்கவும்."
"Version change": "பதிப்பு மாற்றம்"
"Waiting for the installation worker": "நிறுவல் பணியாளருக்காகக் காத்திருக்கிறது"
"collector": "சேகரிப்பான்"
"complete": "முழுமை"
"failed": "தோல்வியடைந்தது"
"finish": "முடி"
"install": "நிறுவு"
"not_started": "தொடங்கப்படவில்லை"
"partial": "பகுதியளவு"
"running": "இயங்குகிறது"
"succeeded": "வெற்றியடைந்தது"
"upgrade": "மேம்படுத்து"
"waiting": "காத்திருக்கிறது"
"Accept the license before saving the installation plan.": "நிறுவல் திட்டத்தைச் சேமிப்பதற்கு முன் உரிமத்தை ஏற்றுக்கொள்ளவும்."
"Invalid installation form.": "தவறான நிறுவல் படிவம்."
"Access denied.": "அணுகல் மறுக்கப்பட்டது."
"Confirm the recovery warning before retrying.": "மீண்டும் முயற்சிக்கும் முன் மீட்பு எச்சரிக்கையை உறுதிப்படுத்துக."
"Review and confirm the current installation plan.": "தற்போதைய நிறுவல் திட்டத்தை மதிப்பாய்வு செய்து உறுதிப்படுத்தவும்."
"Confirm the discovery scope before starting.": "தொடங்குவதற்கு முன் கண்டறிதல் நோக்கெல்லையை உறுதிப்படுத்துக."
"Resolve the blocking checks before starting.": "தொடங்குவதற்கு முன் தடுக்கும் சோதனைகளைத் தீர்க்கவும்."
"Too many installer options.": "மிக அதிக நிறுவி விருப்பங்கள்."
"Invalid installer option name.": "தவறான நிறுவி விருப்பப் பெயர்."
"Unknown or malformed installer option.": "தெரியாத அல்லது தவறான வடிவ நிறுவி விருப்பம்."
"Installer options must be scalar values.": "நிறுவி விருப்பங்கள் அளவுசார் மதிப்புகளாக இருக்க வேண்டும்."
"Installer option is too long or contains a null byte.": "நிறுவி விருப்பம் மிக நீளமாக உள்ளது அல்லது null byte-ஐக் கொண்டுள்ளது."
"Installer IDs and intervals must be whole numbers.": "நிறுவி ID-கள் மற்றும் இடைவெளிகள் முழு எண்களாக இருக்க வேண்டும்."
"Installer ID or interval is outside its supported range.": "நிறுவி ID அல்லது இடைவெளி அதன் ஆதரிக்கப்படும் வரம்பிற்கு வெளியே உள்ளது."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "நிறுவலைத் தொடர முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் அதன் நிலையை மீண்டும் ஏற்றித் தடுக்கும் சோதனைகளை மதிப்பாய்வு செய்யவும்."
"Confirm that the previous worker has stopped before recovering its plan.": "முந்தைய பணியாளரின் திட்டத்தை மீட்டெடுப்பதற்கு முன் அது நிறுத்தப்பட்டதை உறுதிப்படுத்துக."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "தரவுத்தளம் நிறுவப்பட்டுள்ளது, ஆனால் சில சேகரிப்பான்களுக்கு இன்னும் ஒத்திசைவு தேவை. அவற்றின் நிலையைச் சரிபார்த்த பிறகு முடிக்கும் பணிகளை மீண்டும் முயற்சிக்கவும்."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "நிறுவல் நிறுத்தப்பட்டது. நிறுவிப் பதிவைப் பாதுகாத்து, காரணத்தைச் சரிசெய்து மீண்டும் முயற்சிப்பதை வெளிப்படையாக உறுதிப்படுத்தவும். சில தரவுத்தள மாற்றங்கள் ஏற்கனவே சேமிக்கப்பட்டிருக்கலாம். மீண்டும் முயற்சிக்க அங்கீகரிப்பதற்கு முன் செருகுநிரல் சுத்திகரிப்பைச் சரிபார்க்கவும்."
"Next action": "அடுத்த செயல்"
"Follow the execution status. Do not start another attempt while a worker is active.": "செயல்படுத்தல் நிலையைப் பின்தொடரவும். பணியாளர் செயலில் இருக்கும்போது மற்றொரு முயற்சியைத் தொடங்க வேண்டாம்."
"Complete the recovery checklist before retrying.": "மீண்டும் முயற்சிக்கும் முன் மீட்புச் சரிபார்ப்புப் பட்டியலை முடிக்கவும்."
"Verify collection and graph operation before enabling discovery.": "கண்டறிதலை இயக்கும் முன் சேகரிப்பு மற்றும் வரைபடச் செயல்பாட்டைச் சரிபார்க்கவும்."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "தடுக்கப்பட்ட தேவைகளைத் தீர்க்கவும், பின்னர் மீண்டும் சரிபார்க்கவும். சேமிக்கப்பட்ட தேர்வுகள் தக்கவைக்கப்படுகின்றன."
"Review the planned changes and backup checklist before authorizing execution.": "செயல்படுத்தலை அங்கீகரிப்பதற்கு முன் திட்டமிடப்பட்ட மாற்றங்களையும் காப்புப்பிரதி சரிபார்ப்புப் பட்டியலையும் மதிப்பாய்வு செய்யவும்."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "சேகரிப்பு சுயவிவரத்தைத் தேர்ந்தெடுத்து உரிமத்தை ஏற்றுக்கொள்ளவும். தேவைப்படும்போது விருப்ப அமைப்புகளைத் திறக்கலாம்."
"Download installation diagnostics": "நிறுவல் கண்டறிதல் தரவைப் பதிவிறக்கு"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ஒரு வரைபடத்தைத் திறந்து, ஒரு போலர் சுழற்சிக்குப் பிறகு அதன் RRD தரவு புதுப்பிக்கப்படுவதை உறுதிப்படுத்தவும்."
"Requirement details": "தேவை விவரங்கள்"
"Recover": "மீட்டெடு"
"Recovery checklist": "மீட்புச் சரிபார்ப்புப் பட்டியல்"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log கோப்பைப் பாதுகாத்து தோல்வியுற்ற முயற்சியைப் பதிவு செய்யவும்."
"Confirm that the previous worker and its child processes have stopped.": "முந்தைய பணியாளரும் அதன் துணைச் செயல்முறைகளும் நிறுத்தப்பட்டதை உறுதிப்படுத்துக."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "சேமிக்கப்பட்ட மாற்றங்கள், சேகரிப்பான் ஒத்திசைவு மற்றும் செருகுநிரல் சுத்திகரிப்பை ஆய்வு செய்யவும். மீண்டும் முயற்சிக்கும் முன் காரணத்தைச் சரிசெய்யவும்."
"Review the saved plan again, then explicitly authorize a retry.": "சேமிக்கப்பட்ட திட்டத்தை மீண்டும் மதிப்பாய்வு செய்து, பின்னர் மறுமுயற்சியை வெளிப்படையாக அங்கீகரிக்கவும்."
"Recover a stopped worker": "நிறுத்தப்பட்ட பணியாளரை மீட்டெடு"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "இந்த முயற்சி இனி இயங்கவில்லை என்பதை உறுதிப்படுத்திய பின்னரே மீட்பைப் பயன்படுத்தவும். மீட்பு ஒரு செயல்முறையை நிறுத்தாது."
"Collector and installation mode": "சேகரிப்பான் மற்றும் நிறுவல் பயன்முறை"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "பயன்படுத்தல் கட்டமைப்பு சேகரிப்பான் பாத்திரத்தையும் தரவுத்தள இணைப்புகளையும் தீர்மானிக்கிறது. சேகரிப்பானைத் தொடங்குவதற்கு முன் முதன்மைச் சேவையகக் கட்டமைப்பைச் சரிபார்க்கவும்."
"Discovery and SNMP settings": "கண்டறிதல் மற்றும் SNMP அமைப்புகள்"
"Keep discovery disabled until collection and collector connectivity have been verified.": "சேகரிப்பு மற்றும் சேகரிப்பான் இணைப்பு சரிபார்க்கப்படும் வரை கண்டறிதலை முடக்கி வைக்கவும்."
"Template selection": "வார்ப்புருத் தேர்வு"
"Templates selected for import": "இறக்குமதிக்குத் தேர்ந்தெடுக்கப்பட்ட வார்ப்புருக்கள்"
"No templates selected.": "வார்ப்புருக்கள் எதுவும் தேர்ந்தெடுக்கப்படவில்லை."
"Backup checklist": "காப்புப்பிரதி சரிபார்ப்புப் பட்டியல்"
"Database backup and a tested restoration procedure.": "தரவுத்தளக் காப்புப்பிரதி மற்றும் சோதிக்கப்பட்ட மீட்டெடுப்பு செயல்முறை."
"RRD files and the service account permissions needed to restore them.": "RRD கோப்புகள் மற்றும் அவற்றை மீட்டெடுக்கத் தேவையான சேவைக் கணக்கு அனுமதிகள்."
"Configuration, keys and plugin data outside the database.": "தரவுத்தளத்திற்கு வெளியே உள்ள கட்டமைப்பு, விசைகள் மற்றும் செருகுநிரல் தரவு."
"Post-installation checks": "நிறுவலுக்குப் பிந்தைய சோதனைகள்"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "சரிபார்க்கப்பட்ட சோதனைகள் காட்டப்பட்டுள்ள ஆதாரத்தை மட்டுமே உள்ளடக்கும். மதிப்பிடப்படாத சோதனைகளுக்கு இன்னும் இயக்குநரின் சரிபார்ப்பு தேவை."
"Operational checks still require operator verification.": "செயல்பாட்டுச் சோதனைகளுக்கு இன்னும் இயக்குநரின் சரிபார்ப்பு தேவை."
"Status": "நிலை"
"verified": "சரிபார்க்கப்பட்டது"
"action_required": "நடவடிக்கை தேவை"
"not_assessed": "மதிப்பிடப்படவில்லை"
"Database schema": "தரவுத்தள ஸ்கீமா"
"Stored schema matches the application target.": "சேமிக்கப்பட்ட ஸ்கீமா பயன்பாட்டு இலக்குடன் பொருந்துகிறது."
"Target schema completion has not been confirmed.": "இலக்கு ஸ்கீமா நிறைவு உறுதிப்படுத்தப்படவில்லை."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "ஸ்கீமா மேம்படுத்தலை முடிந்ததாகக் கருதுவதற்கு முன் நிறுவல் முடிவை மதிப்பாய்வு செய்து தோல்விகளைத் தீர்க்கவும்."
"Installation outcome": "நிறுவல் முடிவு"
"A successful receipt matches the current target schema.": "வெற்றிகரமான ரசீது தற்போதைய இலக்கு ஸ்கீமாவுடன் பொருந்துகிறது."
"A complete successful installation outcome has not been confirmed.": "முழுமையான வெற்றிகரமான நிறுவல் முடிவு இன்னும் உறுதிப்படுத்தப்படவில்லை."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "நிறுவிப் பதிவைப் பாதுகாத்து தேவைப்படும்போது வெளிப்படையான மீட்பு அல்லது மறுமுயற்சி நடைமுறையைப் பயன்படுத்தவும்."
"Collector synchronization": "சேகரிப்பான் ஒத்திசைவு"
"The completed installer reports pending collector synchronization.": "நிறைவடைந்த நிறுவி நிலுவையில் உள்ள சேகரிப்பான் ஒத்திசைவைப் புகாரளிக்கிறது."
"The completed installer reports no pending collectors.": "நிறைவடைந்த நிறுவி நிலுவையில் உள்ள சேகரிப்பான்கள் எதுவும் இல்லை எனப் புகாரளிக்கிறது."
"Collector completion remains unconfirmed by this partial receipt.": "இந்தப் பகுதி ரசீதால் சேகரிப்பான் நிறைவு உறுதிப்படுத்தப்படாமல் உள்ளது."
"Collector completion is not established by this installation outcome.": "இந்த நிறுவல் முடிவால் சேகரிப்பான் நிறைவு உறுதிப்படுத்தப்படவில்லை."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "சேகரிப்பான் நிலையை மதிப்பாய்வு செய்து பகுதி முடிவுகளுக்கான முடிக்கும் பணிகளை மீண்டும் முயற்சிக்கவும். இது பிந்தைய சேகரிப்புப் புதுமையைச் சரிபார்க்காது."
"Scheduled collection": "திட்டமிடப்பட்ட சேகரிப்பு"
"No poller or device was contacted by this assessment.": "இந்த மதிப்பீட்டால் எந்தப் போலர் அல்லது சாதனமும் தொடர்பு கொள்ளப்படவில்லை."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "கட்டமைக்கப்பட்ட அட்டவணையாளர் உத்தேசித்த சேவைக் கணக்காக போலரை இயக்குவதை உறுதிசெய்து அதன் அடுத்த இயல்பான சுழற்சியை மதிப்பாய்வு செய்யவும்."
"Graph data": "வரைபடத் தரவு"
"Live samples and RRD updates were not exercised.": "நேரடி மாதிரிகள் மற்றும் RRD புதுப்பிப்புகள் இயக்கப்படவில்லை."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "ஒரு இயல்பான சேகரிப்புச் சுழற்சிக்குப் பிறகு, எதிர்பார்க்கப்படும் வரைபடங்கள் புதிய மாதிரிகளைப் பெறுவதை உறுதிசெய்து போலர் பிழைகளை மதிப்பாய்வு செய்யவும்."
"Recovery readiness": "மீட்புத் தயார்நிலை"
"Backup restoration was not exercised.": "காப்புப்பிரதி மீட்டெடுப்பு பயிற்சி செய்யப்படவில்லை."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "மீட்பை நம்புவதற்கு முன் தரவுத்தளம், RRD கோப்புகள், கட்டமைப்பு மற்றும் விசைப் பொருட்களின் தனிமைப்படுத்தப்பட்ட மீட்டெடுப்பைச் சரிபார்க்கவும்."
"No persisted local poller start has been recorded.": "தொடர்ந்த உள்ளூர் போலர் தொடக்கம் எதுவும் பதிவு செய்யப்படவில்லை."
"Persisted poller timing is invalid and cannot establish scheduler health.": "தொடர்ந்த போலர் நேரம் தவறானது மற்றும் அட்டவணையாளர் நலத்தை நிறுவ முடியாது."
"The recorded poller start is in the future. Check clock synchronization.": "பதிவு செய்யப்பட்ட போலர் தொடக்கம் எதிர்காலத்தில் உள்ளது. கடிகார ஒத்திசைவைச் சரிபார்க்கவும்."
"The recorded poller start is older than the native scheduling tolerance.": "பதிவு செய்யப்பட்ட போலர் தொடக்கம் இயல்பான அட்டவணை சகிப்புத்தன்மையை விடப் பழையது."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "இயல்பான அட்டவணை சகிப்புத்தன்மைக்குள் உள்ளூர் போலர் தொடக்கம் பதிவு செய்யப்பட்டது. நிறைவு மற்றும் சாதன நிலைமை சரிபார்க்கப்படவில்லை."
"readable": "படிக்கக்கூடியது"
"missing or unreadable": "காணவில்லை அல்லது படிக்க முடியவில்லை"
"Restore the complete release and its locked dependencies; grant the service account read access.": "முழுமையான வெளியீட்டையும் அதன் பூட்டப்பட்ட சார்புகளையும் மீட்டெடுக்கவும்; சேவைக் கணக்கிற்குப் படிக்கும் அணுகலை வழங்கவும்."
"PHP temporary directory": "PHP தற்காலிகக் கோப்பகம்"
"directory writable by this process": "இந்தச் செயல்முறையால் எழுதக்கூடிய கோப்பகம்"
"missing or not writable": "காணவில்லை அல்லது எழுத முடியவில்லை"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "நிறுவல் கணக்கால் எழுதக்கூடிய ஏற்கனவே உள்ள கோப்பகமாக sys_temp_dir-ஐ கட்டமைக்கவும். இயல்பான இறக்குமதிகள் தற்காலிகக் கோப்புகளைப் பயன்படுத்துகின்றன."
"Background worker launch": "பின்னணிப் பணியாளர் துவக்கம்"
"required PHP functions available; launch not exercised": "தேவையான PHP செயல்கூறுகள் கிடைக்கின்றன; துவக்கம் இயக்கப்படவில்லை"
"required PHP launch function disabled": "தேவையான PHP துவக்கச் செயல்கூறு முடக்கப்பட்டுள்ளது"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "வலை PHP இயக்க நேரத்திற்கு exec-ஐ இயக்கவும் அல்லது அங்கீகரிக்கப்பட்ட CLI நிறுவியைப் பயன்படுத்தவும்."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "வலை PHP இயக்க நேரத்திற்கு popen, pclose-ஐ இயக்கவும் அல்லது அங்கீகரிக்கப்பட்ட CLI நிறுவியைப் பயன்படுத்தவும்."
"Database transaction ownership": "தரவுத்தளப் பரிவர்த்தனை உரிமை"
"autocommit enabled; no caller-owned transaction": "autocommit இயக்கப்பட்டது; அழைப்பாளர்-உரிமைப் பரிவர்த்தனை இல்லை"
"autocommit disabled or caller transaction active": "autocommit முடக்கப்பட்டுள்ளது அல்லது அழைப்பாளர் பரிவர்த்தனை செயலில் உள்ளது"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "அழைப்பாளர்-உரிமைப் பரிவர்த்தனைக்கு வெளியே நிறுவலை இயக்கவும் மற்றும் அதன் மாற்ற இணைப்பில் autocommit-ஐ இயக்கவும்."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "வெளியீட்டுக் கோப்பகத்தை மீட்டெடுத்து வார்ப்புரு வள இறக்குமதிகளுக்கு நிறுவல் கணக்கிற்கு எழுதும் அணுகலை வழங்கவும். அதை அனைவராலும் எழுதக்கூடியதாக மாற்ற வேண்டாம்."
"Worker file: install/background.php": "பணியாளர் கோப்பு: install/background.php"
"Worker file: bin/legacy-installer.php": "பணியாளர் கோப்பு: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "பணியாளர் கோப்பு: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "இறக்குமதி இலக்கு: resource/snmp_queries"
"Import destination: resource/script_server": "இறக்குமதி இலக்கு: resource/script_server"
"Import destination: resource/script_queries": "இறக்குமதி இலக்கு: resource/script_queries"
"Import destination: scripts": "இறக்குமதி இலக்கு: scripts"
"Database privileges": "தரவுத்தள உரிமைகள்"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "செயலில் உள்ள பாத்திரங்கள் மற்றும் பொருள் சார்ந்த மானியங்கள் உட்பட, பயனுள்ள இடம்பெயர்வு உரிமைகள் சரிபார்க்கப்படவில்லை."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "நிறுவல் கணக்கு மற்றும் ஸ்கீமாவுக்குத் தேவையான அட்டவணை எழுத்துகள், ஸ்கீமா மாற்றங்கள், தூண்டிகள் மற்றும் நடைமுறைகளைத் தரவுத்தள நிர்வாகி சரிபார்க்கச் செய்யவும். உலகளாவிய நிர்வாகி உரிமைகளை வழங்க வேண்டாம்."
"Compare web and worker runtimes": "வலை மற்றும் பணியாளர் இயக்க நேரங்களை ஒப்பிடு"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "இது ஒரு குறுகிய படிக்க மட்டும் PHP ஆய்வை வெளிப்படையாகத் தொடங்குகிறது. இது நிறுவியை ஒதுக்கவோ, கோப்புகளை எழுதவோ அல்லது சாதனங்களைத் தொடர்பு கொள்ளவோ மாட்டாது."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "ஆய்வு இந்த வலைச் செயல்முறையை மரபுரிமையாகப் பெறுகிறது மற்றும் கட்டமைக்கப்பட்ட நிறுவி PHP மொழிபெயர்ப்பியைப் பயன்படுத்துகிறது. இது தனி அட்டவணையாளர் அல்லது சேவையை ஆய்வு செய்யாது."
"I authorize the read-only worker runtime comparison.": "படிக்க மட்டும் பணியாளர் இயக்க நேர ஒப்பீட்டை நான் அங்கீகரிக்கிறேன்."
"Compare runtimes": "இயக்க நேரங்களை ஒப்பிடு"
"Runtime comparison results": "இயக்க நேர ஒப்பீட்டு முடிவுகள்"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "அனுமதி மற்றும் அடையாள வேறுபாடுகள் திட்டமிட்டவையாக இருக்கலாம். படிக்க மட்டும் அவதானிப்புகள் எழுதுதல்கள் அல்லது நிறுவல் வெற்றி பெறும் என்பதை நிரூபிக்காது."
"Confirm the read-only worker runtime comparison.": "படிக்க மட்டும் பணியாளர் இயக்க நேர ஒப்பீட்டை உறுதிப்படுத்துக."
"The runtime comparison is unavailable.": "இயக்க நேர ஒப்பீடு கிடைக்கவில்லை."
"Shared application secret": "பகிரப்பட்ட பயன்பாட்டு ரகசியம்"
"A strong web application secret is required before comparison.": "ஒப்பீட்டிற்கு முன் வலுவான வலைப் பயன்பாட்டு ரகசியம் தேவை."
"Runtime comparison": "இயக்க நேர ஒப்பீடு"
"The configured worker runtime did not confirm a bounded comparison.": "கட்டமைக்கப்பட்ட பணியாளர் இயக்க நேரம் வரம்புக்குட்பட்ட ஒப்பீட்டை உறுதிப்படுத்தவில்லை."
"The inherited worker secret could not be confirmed against the web secret.": "வலை ரகசியத்திற்கு எதிராக மரபுரிமை பணியாளர் ரகசியத்தை உறுதிப்படுத்த முடியவில்லை."
"PHP runtime comparison": "PHP இயக்க நேர ஒப்பீடு"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "இரு இயக்க நேரங்களும் PHP 8.4-ஐ ஆதரிக்க வேண்டும்; மாறுபடும் திருத்தப் பதிப்புகளுக்கு மதிப்பாய்வு தேவை."
"Required extension comparison": "தேவையான நீட்டிப்பு ஒப்பீடு"
"Required extension availability is checked; differing versions require review.": "தேவையான நீட்டிப்பு கிடைக்கும் தன்மை சரிபார்க்கப்பட்டது; மாறுபடும் பதிப்புகளுக்கு மதிப்பாய்வு தேவை."
"Process identity comparison": "செயல்முறை அடையாள ஒப்பீடு"
"Effective process identity is unavailable on this platform.": "இந்தத் தளத்தில் செயல்படும் செயல்முறை அடையாளம் கிடைக்கவில்லை."
"Effective process identities match.": "செயல்படும் செயல்முறை அடையாளங்கள் பொருந்துகின்றன."
"Effective process identities differ; separate service accounts may be intentional.": "செயல்படும் செயல்முறை அடையாளங்கள் வேறுபடுகின்றன; தனித்தனி சேவைக் கணக்குகள் திட்டமிடப்பட்டவையாக இருக்கலாம்."
"Directory access comparison": "கோப்பக அணுகல் ஒப்பீடு"
"Read-only directory permission observations match.": "படிக்க மட்டும் கோப்பக அனுமதி அவதானிப்புகள் பொருந்துகின்றன."
"Directory locations or permission observations differ; review the service-account roles.": "கோப்பக இருப்பிடங்கள் அல்லது அனுமதி அவதானிப்புகள் வேறுபடுகின்றன; சேவைக் கணக்குப் பாத்திரங்களை மதிப்பாய்வு செய்யவும்."
"Worker directory read and traversal": "பணியாளர் கோப்பகப் படித்தல் மற்றும் உலாவல்"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "தேவையான பணியாளர் கோப்பகங்கள் இருக்க வேண்டும் மற்றும் படித்தல் மற்றும் உலாவலை அனுமதிக்க வேண்டும். எழுதுதல்கள் எதுவும் சோதிக்கப்படவில்லை."
"The inherited worker secret matches the web secret for this private challenge.": "இந்தத் தனிப்பட்ட சவாலுக்கான வலை ரகசியத்துடன் மரபுரிமை பணியாளர் ரகசியம் பொருந்துகிறது."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "கட்டமைக்கப்பட்ட PHP மொழிபெயர்ப்பி, தேவையான நீட்டிப்புகள், மரபுரிமை ரகசியம் மற்றும் சேவைக் கணக்குக் கோப்பக அனுமதிகளை மதிப்பாய்வு செய்யவும். எழுதுதல்கள் அல்லது நிறுவித் தொடக்கம் எதுவும் இயக்கப்படவில்லை."
"advisory": "அறிவுறுத்தல்"
