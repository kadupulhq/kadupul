"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "هذه سلسلة نصية فريدة ستتم مطابقتها مع سلسلة sysName الخاصة بالأجهزة لإقرانها بقالب الأتمتة هذا. يمكن استخدام أي تعبير نمطي لـ Perl بالإضافة إلى أي تعبير SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "هذه سلسلة نصية فريدة ستتم مطابقتها مع سلسلة sysOid الخاصة بالأجهزة لإقرانها بقالب الأتمتة هذا. يمكن استخدام أي تعبير نمطي لـ Perl بالإضافة إلى أي تعبير SQL Where."
