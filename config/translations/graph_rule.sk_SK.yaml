"A useful name for this Rule.": "Užitočný názov tohto pravidla."
"Access denied.": "Prístup zamietnutý."
"Add Graph Rule": "Pridať pravidlo grafu"
"Back to Graph Rules": "Späť na pravidlá grafov"
"Cancel": "Zrušiť"
"Check this box to enable this rule.": "Zaškrtnutím tohto políčka toto pravidlo povolíte."
"Choose a Data Query to apply to this rule.": "Vyberte dotaz na dáta, ktorý sa použije v tomto pravidle."
"Choose a Graph Type": "Vyberte typ grafu"
"Choose a Graph Type of the selected Data Query.": "Vyberte typ grafu vybraného dotazu na dáta."
"Choose an existing Data Query.": "Vyberte existujúci dotaz na dáta."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Vyberte ktorýkoľvek z dostupných typov grafov vybraného dotazu na dáta, ktorý sa použije v tomto pravidle."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kliknutím na Pokračovať odstránite nasledujúce pravidlá grafov spolu s ich kritériami výberu zariadení a vytvárania grafov."
"Click Continue to disable the following Graph Rules.": "Kliknutím na Pokračovať zakážete nasledujúce pravidlá grafov."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kliknutím na Pokračovať duplikujete nasledujúce pravidlá grafov. Voliteľne môžete zmeniť formát názvu nových pravidiel grafov, ktoré sa začínajú ako zakázané."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kliknutím na Pokračovať povolíte nasledujúce pravidlá grafov. Uistite sa, že boli úspešne otestované."
"Continue": "Pokračovať"
"Data Query": "Dotaz na dáta"
"Delete Graph Rules": "Odstrániť pravidlá grafov"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Výsledok odstránenia je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel grafov."
"Delete selected": "Odstrániť vybrané"
"Device Selection and Graph Creation Criteria": "Kritériá výberu zariadení a vytvárania grafov"
"Disable Graph Rules": "Zakázať pravidlá grafov"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Výsledok zakázania je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel grafov."
"Disable selected": "Zakázať vybrané"
"Duplicate Graph Rules": "Duplikovať pravidlá grafov"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Výsledok duplikovania je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel grafov."
"Duplicate selected": "Duplikovať vybrané"
"Edit Graph Rule": "Upraviť pravidlo grafu"
"Enable Graph Rules": "Povoliť pravidlá grafov"
"Enable Rule": "Povoliť pravidlo"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Výsledok povolenia je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel grafov."
"Enable selected": "Povoliť vybrané"
"Enter a name.": "Zadajte názov."
"Enter a valid name format.": "Zadajte platný formát názvu."
"Enter at most %count% characters.": "Zadajte najviac %count% znakov."
"Enter single-line text.": "Zadajte jednoriadkový text."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Každé <rule_name> sa nahradí názvom kopírovaného pravidla grafu."
"Graph Type": "Typ grafu"
"Graph rule not found.": "Pravidlo grafu sa nenašlo."
"Graph rule saved.": "Pravidlo grafu bolo uložené."
"Invalid Graph Rule selection.": "Neplatný výber pravidiel grafov."
"Name": "Názov"
"One or more selected Graph Rules no longer exist.": "Jedno alebo viac vybraných pravidiel grafov už neexistuje."
"Rule Selection [edit: %name%]": "Výber pravidla [úprava: %name%]"
"Rule Selection [new]": "Výber pravidla [nový]"
"Save": "Uložiť"
"Save outcome is uncertain. Reload before retrying.": "Výsledok uloženia je neistý. Pred ďalším pokusom stránku znova načítajte."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Najprv uložte pravidlo; jeho kritériá výberu zariadení a vytvárania grafov sa pridajú potom."
"Select": "Vybrať"
"Select %name%": "Vybrať %name%"
"Select at least one Graph Rule.": "Vyberte aspoň jedno pravidlo grafu."
"Select at most 100 Graph Rules at a time.": "Naraz vyberte najviac 100 pravidiel grafov."
"Select up to %count% rows at a time.": "Naraz vyberte najviac %count% riadkov."
"The graph rule changed since you opened this form. Reload before saving.": "Pravidlo grafu sa zmenilo od otvorenia tohto formulára. Pred uložením stránku znova načítajte."
"The name format must give every copy a name of 1 to 255 characters.": "Formát názvu musí každej kópii dať názov s dĺžkou 1 až 255 znakov."
"Title Format": "Formát názvu"
"Unable to load Graph Rules. Reload before retrying.": "Pravidlá grafov sa nepodarilo načítať. Pred ďalším pokusom stránku znova načítajte."
"Unable to load the graph rule. Reload before retrying.": "Pravidlo grafu sa nepodarilo načítať. Pred ďalším pokusom stránku znova načítajte."
"Unexpected fields were submitted.": "Boli odoslané neočakávané polia."
