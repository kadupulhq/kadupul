"This is a unique string that will be matched to a devices sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "यह एक अद्वितीय स्ट्रिंग है जिसका मिलान डिवाइस को इस ऑटोमेशन टेम्पलेट से जोड़ने के लिए डिवाइस की sysOid स्ट्रिंग से किया जाएगा। किसी भी SQL Where अभिव्यक्ति के अतिरिक्त किसी भी Perl नियमित अभिव्यक्ति का उपयोग किया जा सकता है।"
