"Action": "Радња"
"Advanced options": "Напредне опције"
"Applying database upgrades": "Примена надоградњи базе података"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Направите резервну копију базе података, RRD датотека, конфигурације и кључева. Надоградње базе података могу трајно уписати промене које враћање апликације не може поништити."
"Blocked": "Блокирано"
"Check": "Провера"
"Check again": "Провери поново"
"Check collection freshness and collector connectivity before enabling discovery.": "Проверите свежину прикупљања и повезаност прикупљача пре омогућавања откривања."
"Check requirements": "Провери захтеве"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Провере прегледају овај процес и дозволе датотечног система. Не записују пробне датотеке нити контактирају уређаје."
"Collection profile": "Профил прикупљања"
"Collector": "Прикупљач"
"Configure": "Подеси"
"Configuring collection profiles": "Подешавање профила прикупљања"
"Configuring discovery": "Подешавање откривања"
"Configuring the local device": "Подешавање локалног уређаја"
"Confirming database version": "Потврђивање верзије базе података"
"Converting selected tables": "Конверзија изабраних табела"
"Database version": "Верзија базе података"
"Disabled": "Онемогућено"
"Discovery": "Откривање"
"Discovery SNMP settings": "SNMP подешавања откривања"
"Discovery range": "Опсег откривања"
"Enable discovery after installation": "Омогући откривање након инсталације"
"Executable paths": "Путање извршних датотека"
"Execution status": "Статус извршавања"
"Finished execution": "Извршавање завршено"
"Finishing tasks only. Schema migrations will not be replayed.": "Само завршни задаци. Миграције шеме неће бити поново извршене."
"I accept the license terms": "Прихватам услове лиценце"
"I authorize discovery of the displayed range": "Овлашћујем откривање приказаног опсега"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Проверио/ла сам евиденцију и потврдио/ла да су претходни радник и његови подпроцеси заустављени"
"I checked the previous attempt and accept that some changes may already be committed": "Проверио/ла сам претходни покушај и прихватам да неке промене већ могу бити трајно уписане"
"I reviewed this plan and have the required backups": "Прегледао/ла сам овај план и имам потребне резервне копије"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ако се радник неочекивано заустави, сачувајте log/cacti.log и потврдите да је његов процес завршен пре изричитог понављања. Стање чекања не потврђује успешно покретање."
"Importing templates": "Увоз шаблона"
"Install Kadupul": "Инсталирај Kadupul"
"Installation and upgrade": "Инсталација и надоградња"
"Installation request was rejected.": "Захтев за инсталацију је одбијен."
"Installation steps": "Кораци инсталације"
"Installed": "Инсталирано"
"Keep a backup of the database, RRD files, configuration and secret material.": "Чувајте резервну копију базе података, RRD датотека, конфигурације и тајног материјала."
"Language": "Језик"
"Large tables may require the dedicated CLI conversion tool before installation.": "Велике табеле могу захтевати посебну CLI алатку за конверзију пре инсталације."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Оставите тајна поља празна да задржите сачуване акредитиве. Тајне вредности се никада поново не приказују."
"License": "Лиценца"
"No action needed": "Није потребна радња"
"Observed": "Уочено"
"Open the console": "Отвори конзолу"
"Operation": "Операција"
"Override discovery SNMP settings": "Надјачај SNMP подешавања откривања"
"Pass": "Прошло"
"Poller interval in seconds": "Интервал прикупљача у секундама"
"Preparing CSRF protection": "Припрема CSRF заштите"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Напредак приказује последњу забележену фазу. Освежавање ове странице никада не покреће нити понавља радника."
"Recover stopped attempt": "Опорави заустављени покушај"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Опоравак задржава сачуване изборе и никада не прекида радника који ради. Поново прегледајте план пре понављања."
"Review": "Преглед"
"Review installation plan": "Прегледај план инсталације"
"Run": "Покрени"
"Run reviewed plan": "Покрени прегледани план"
"Save and review": "Сачувај и прегледај"
"Scope": "Обим"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Статус је недоступан. Сачувани рад је задржан. Освежите да се поново повежете; не шаљите другу инсталацију."
"Synchronizing collectors": "Синхронизација прикупљача"
"Table conversions": "Конверзије табела"
"Templates": "Шаблони"
"The database version matches this application. Installation does not establish that polling is healthy.": "Верзија базе података одговара овој апликацији. Инсталација не доказује да је прикупљање исправно."
"The request outcome is unknown. Check execution status before retrying.": "Исход захтева је непознат. Проверите статус извршавања пре понављања."
"Theme": "Тема"
"Verify": "Верификуј"
"Verify the poller schedule and service account.": "Проверите распоред прикупљача и сервисни налог."
"Version change": "Промена верзије"
"Waiting for the installation worker": "Чека се радник инсталације"
"collector": "прикупљач"
"complete": "завршено"
"failed": "неуспешно"
"finish": "завршетак"
"install": "инсталација"
"not_started": "није покренуто"
"partial": "делимично"
"running": "покренуто"
"succeeded": "успешно"
"upgrade": "надоградња"
"waiting": "на чекању"
"Accept the license before saving the installation plan.": "Прихватите лиценцу пре чувања плана инсталације."
"Invalid installation form.": "Неисправан образац инсталације."
"Access denied.": "Приступ одбијен."
"Confirm the recovery warning before retrying.": "Потврдите упозорење о опоравку пре понављања."
"Review and confirm the current installation plan.": "Прегледајте и потврдите тренутни план инсталације."
"Confirm the discovery scope before starting.": "Потврдите обим откривања пре почетка."
"Resolve the blocking checks before starting.": "Решите блокирајуће провере пре почетка."
"Too many installer options.": "Превише опција инсталатера."
"Invalid installer option name.": "Неисправан назив опције инсталатера."
"Unknown or malformed installer option.": "Непозната или неисправно формирана опција инсталатера."
"Installer options must be scalar values.": "Опције инсталатера морају бити скаларне вредности."
"Installer option is too long or contains a null byte.": "Опција инсталатера је предугачка или садржи нулти бајт."
"Installer IDs and intervals must be whole numbers.": "ID-ови и интервали инсталатера морају бити цели бројеви."
"Installer ID or interval is outside its supported range.": "ID или интервал инсталатера је ван подржаног опсега."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Инсталација није могла да се настави. Поново учитајте њен статус и прегледајте блокирајуће провере пре понављања."
"Confirm that the previous worker has stopped before recovering its plan.": "Потврдите да је претходни радник заустављен пре опоравка његовог плана."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "База података је инсталирана, али неким прикупљачима је и даље потребна синхронизација. Поновите завршне задатке након провере њиховог статуса."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Инсталација је заустављена. Сачувајте евиденцију инсталатера, отклоните узрок и изричито потврдите понављање. Неке промене базе података могу већ бити трајно уписане. Проверите чишћење додатака пре овлашћивања понављања."
"Next action": "Следећа радња"
"Follow the execution status. Do not start another attempt while a worker is active.": "Пратите статус извршавања. Не покрећите други покушај док је радник активан."
"Complete the recovery checklist before retrying.": "Завршите контролну листу опоравка пре понављања."
"Verify collection and graph operation before enabling discovery.": "Проверите прикупљање и рад графикона пре омогућавања откривања."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Решите блокиране захтеве, а затим проверите поново. Сачувани избори су задржани."
"Review the planned changes and backup checklist before authorizing execution.": "Прегледајте планиране промене и контролну листу резервних копија пре овлашћивања извршавања."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Изаберите профил прикупљања и прихватите лиценцу. Опциона подешавања могу се отворити по потреби."
"Download installation diagnostics": "Преузми дијагностику инсталације"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Отворите графикон и потврдите да се његови RRD подаци ажурирају након циклуса прикупљача."
"Requirement details": "Детаљи захтева"
"Recover": "Опорави"
"Recovery checklist": "Контролна листа опоравка"
"Preserve log/cacti.log and record the failed attempt.": "Сачувајте log/cacti.log и забележите неуспели покушај."
"Confirm that the previous worker and its child processes have stopped.": "Потврдите да су претходни радник и његови подпроцеси заустављени."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Прегледајте трајно уписане промене, синхронизацију прикупљача и чишћење додатака. Отклоните узрок пре понављања."
"Review the saved plan again, then explicitly authorize a retry.": "Поново прегледајте сачувани план, а затим изричито овластите понављање."
"Recover a stopped worker": "Опорави заустављеног радника"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Користите опоравак тек након што потврдите да овај покушај више није у току. Опоравак не зауставља процес."
"Collector and installation mode": "Режим прикупљача и инсталације"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Конфигурација распоређивања одређује улогу прикупљача и везе са базом података. Проверите конфигурацију примарног сервера пре покретања прикупљача."
"Discovery and SNMP settings": "Откривање и SNMP подешавања"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Држите откривање онемогућеним док се не провере прикупљање и повезаност прикупљача."
"Template selection": "Избор шаблона"
"Templates selected for import": "Шаблони изабрани за увоз"
"No templates selected.": "Нису изабрани шаблони."
"Backup checklist": "Контролна листа резервних копија"
"Database backup and a tested restoration procedure.": "Резервна копија базе података и тестиран поступак враћања."
"RRD files and the service account permissions needed to restore them.": "RRD датотеке и дозволе сервисног налога потребне за њихово враћање."
"Configuration, keys and plugin data outside the database.": "Конфигурација, кључеви и подаци додатака ван базе података."
"Post-installation checks": "Провере након инсталације"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Верификоване провере покривају само приказане доказе. Неоцењене провере и даље захтевају верификацију оператера."
"Operational checks still require operator verification.": "Оперативне провере и даље захтевају верификацију оператера."
"Status": "Статус"
"verified": "Верификовано"
"action_required": "Потребна радња"
"not_assessed": "Није процењено"
"Database schema": "Шема базе података"
"Stored schema matches the application target.": "Сачувана шема одговара циљу апликације."
"Target schema completion has not been confirmed.": "Довршетак циљне шеме није потврђен."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Прегледајте исход инсталације и отклоните неуспехе пре него што надоградњу шеме сматрате завршеном."
"Installation outcome": "Исход инсталације"
"A successful receipt matches the current target schema.": "Успешна признаница одговара тренутној циљној шеми."
"A complete successful installation outcome has not been confirmed.": "Потпун успешан исход инсталације није потврђен."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Сачувајте евиденцију инсталатера и по потреби користите изричит поступак опоравка или понављања."
"Collector synchronization": "Синхронизација прикупљача"
"The completed installer reports pending collector synchronization.": "Завршени инсталатер пријављује синхронизацију прикупљача на чекању."
"The completed installer reports no pending collectors.": "Завршени инсталатер не пријављује прикупљаче на чекању."
"Collector completion remains unconfirmed by this partial receipt.": "Довршетак прикупљача остаје непотврђен овом делимичном признаницом."
"Collector completion is not established by this installation outcome.": "Довршетак прикупљача није утврђен овим исходом инсталације."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Прегледајте статус прикупљача и поновите завршне задатке за делимичне исходе. Ово не верификује каснију свежину прикупљања."
"Scheduled collection": "Заказано прикупљање"
"No poller or device was contacted by this assessment.": "Ова процена није контактирала ниједан прикупљач нити уређај."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Потврдите да подешени планер покреће прикупљач као предвиђени сервисни налог и прегледајте његов следећи редовни циклус."
"Graph data": "Подаци графикона"
"Live samples and RRD updates were not exercised.": "Живи узорци и RRD ажурирања нису испитани."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Након редовног циклуса прикупљања потврдите да очекивани графикони примају свеже узорке и прегледајте грешке прикупљача."
"Recovery readiness": "Спремност за опоравак"
"Backup restoration was not exercised.": "Враћање из резервне копије није испитано."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Проверите изоловано враћање базе података, RRD датотека, конфигурације и кључног материјала пре ослањања на опоравак."
"No persisted local poller start has been recorded.": "Није забележено трајно сачувано локално покретање прикупљача."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Трајно сачувано време прикупљача је неисправно и не може утврдити исправност планера."
"The recorded poller start is in the future. Check clock synchronization.": "Забележено покретање прикупљача је у будућности. Проверите синхронизацију сата."
"The recorded poller start is older than the native scheduling tolerance.": "Забележено покретање прикупљача старије је од изворне толеранције планирања."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Локално покретање прикупљача забележено је у оквиру изворне толеранције планирања. Довршетак и исправност уређаја нису верификовани."
"readable": "читљиво"
"missing or unreadable": "недостаје или није читљиво"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Вратите комплетно издање и његове закључане зависности; доделите сервисном налогу приступ за читање."
"PHP temporary directory": "PHP привремени директоријум"
"directory writable by this process": "директоријум у који овај процес може да пише"
"missing or not writable": "недостаје или није могуће писати"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Подесите sys_temp_dir као постојећи директоријум у који може да пише налог инсталације. Изворни увози користе привремене датотеке."
"Background worker launch": "Покретање позадинског радника"
"required PHP functions available; launch not exercised": "потребне PHP функције су доступне; покретање није испитано"
"required PHP launch function disabled": "потребна PHP функција за покретање је онемогућена"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Омогућите exec за веб PHP окружење или користите овлашћени CLI инсталатер."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Омогућите popen, pclose за веб PHP окружење или користите овлашћени CLI инсталатер."
"Database transaction ownership": "Власништво над трансакцијом базе података"
"autocommit enabled; no caller-owned transaction": "autocommit омогућен; нема трансакције у власништву позиваоца"
"autocommit disabled or caller transaction active": "autocommit онемогућен или је трансакција позиваоца активна"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Покрените инсталацију ван трансакције у власништву позиваоца и омогућите autocommit на њеној вези за измене."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Вратите директоријум издања и доделите налогу инсталације право писања ради увоза ресурса шаблона. Немојте га чинити доступним за писање свима."
"Worker file: install/background.php": "Датотека радника: install/background.php"
"Worker file: bin/legacy-installer.php": "Датотека радника: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Датотека радника: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Одредиште увоза: resource/snmp_queries"
"Import destination: resource/script_server": "Одредиште увоза: resource/script_server"
"Import destination: resource/script_queries": "Одредиште увоза: resource/script_queries"
"Import destination: scripts": "Одредиште увоза: scripts"
"Database privileges": "Привилегије базе података"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Ефективне привилегије миграције, укључујући активне улоге и дозволе за одређене објекте, нису верификоване."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Нека администратор базе података верификује потребна уписивања у табеле, измене шеме, окидаче и рутине за налог инсталације и шему. Не додељујте глобалне администраторске привилегије."
"Compare web and worker runtimes": "Упореди окружења веба и радника"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Ово изричито покреће кратку PHP пробу само за читање. Не резервише инсталатер, не записује датотеке нити контактира уређаје."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Проба наслеђује овај веб процес и користи подешени PHP интерпретер инсталатера. Не прегледа посебан планер или сервис."
"I authorize the read-only worker runtime comparison.": "Овлашћујем поређење радног окружења радника само за читање."
"Compare runtimes": "Упореди окружења"
"Runtime comparison results": "Резултати поређења окружења"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Разлике у дозволама и идентитету могу бити намерне. Запажања само за читање не доказују да ће писање или инсталација успети."
"Confirm the read-only worker runtime comparison.": "Потврдите поређење радног окружења радника само за читање."
"The runtime comparison is unavailable.": "Поређење окружења није доступно."
"Shared application secret": "Заједничка тајна апликације"
"A strong web application secret is required before comparison.": "Пре поређења је потребна јака тајна веб апликације."
"Runtime comparison": "Поређење окружења"
"The configured worker runtime did not confirm a bounded comparison.": "Подешено радно окружење радника није потврдило ограничено поређење."
"The inherited worker secret could not be confirmed against the web secret.": "Наслеђена тајна радника није могла бити потврђена у односу на веб тајну."
"PHP runtime comparison": "Поређење PHP окружења"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Оба окружења морају подржавати PHP 8.4; различите верзије закрпа захтевају преглед."
"Required extension comparison": "Поређење потребних проширења"
"Required extension availability is checked; differing versions require review.": "Проверава се доступност потребних проширења; различите верзије захтевају преглед."
"Process identity comparison": "Поређење идентитета процеса"
"Effective process identity is unavailable on this platform.": "Ефективни идентитет процеса није доступан на овој платформи."
"Effective process identities match.": "Ефективни идентитети процеса се поклапају."
"Effective process identities differ; separate service accounts may be intentional.": "Ефективни идентитети процеса се разликују; одвојени сервисни налози могу бити намерни."
"Directory access comparison": "Поређење приступа директоријумима"
"Read-only directory permission observations match.": "Запажања дозвола директоријума само за читање се поклапају."
"Directory locations or permission observations differ; review the service-account roles.": "Локације директоријума или запажања дозвола се разликују; прегледајте улоге сервисних налога."
"Worker directory read and traversal": "Читање и прелазак директоријума радника"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Потребни директоријуми радника морају постојати и дозвољавати читање и прелазак. Писање није тестирано."
"The inherited worker secret matches the web secret for this private challenge.": "Наслеђена тајна радника одговара веб тајни за овај приватни изазов."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Прегледајте подешени PHP интерпретер, потребна проширења, наслеђену тајну и дозволе директоријума сервисних налога. Писање и покретање инсталатера нису испитани."
"advisory": "саветодавно"
