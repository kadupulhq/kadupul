"A useful name for this Rule.": "Igama eliwusizo lalo Mthetho."
"Access denied.": "Ukufinyelela kwenqatshiwe."
"Add Tree Rule": "Engeza Umthetho Wesihlahla"
"Back to Tree Rules": "Buyela kuMithetho Yesihlahla"
"Check this box to enable this rule.": "Maka leli bhokisi ukuze unike amandla lo mthetho."
"Choose a Tree for the new Tree Items.": "Khetha Isihlahla Sezinto Ezintsha Zesihlahla."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Khetha isihloko seSihlahla esikhethiwe ozoxhuma kuso, noma impande yaso. Qiniseka ukuthi sisakhona lapho lo mthetho usetshenziswa."
"Choose a header of the selected Tree.": "Khetha isihloko seSihlahla esikhethiwe."
"Choose a listed Graph Grouping Style.": "Khetha Isitayela Sokuhlela Amagrafu esisohlwini."
"Choose a listed Leaf Item Type.": "Khetha Uhlobo Lwento Yeqabunga elisohlwini."
"Choose an existing Tree.": "Khetha Isihlahla esikhona."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Khetha ukuthi amagrafu ahlelwa kanjani lapho edwetshwa kulo msingathi othile esihlahleni. Isetshenziselwa amaqabunga eDivayisi."
"Data Query Index": "Inkomba YoMbuzo Wedatha"
"Device": "Idivayisi"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Amaqabunga edivayisi awakwazi ukusebenzisa imibandela kumakholomu egrafu noma esifanekiso segrafu. Lapho ushintsha Uhlobo Lwento Yeqabunga lube yiDivayisi, maka leli bhokisi ukuze ususe leyo mibandela; ayikwazi ukubuyiselwa."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Amaqabunga edivayisi awakwazi ukusebenzisa imibandela esekelwe kugrafu. Qinisekisa ukususwa kwemibandela engu-%count% ukuze ulondoloze."
"Edit Tree Rule": "Hlela Umthetho Wesihlahla"
"Enable Rule": "Nika Amandla Umthetho"
"Enter a name.": "Faka igama."
"Enter at most %count% characters.": "Faka izinhlamvu ezingafika ku-%count% kakhulu."
"Enter single-line text.": "Faka umbhalo womugqa owodwa."
"Graph": "Igrafu"
"Graph Grouping Style": "Isitayela Sokuqoqwa Kwegrafu"
"Graph Template": "Isifanekiso Segrafu"
"Leaf Item Type": "Uhlobo Lwento Yeqabunga"
"Name": "Igama"
"Object Selection and Tree Creation Criteria": "Ukukhethwa Kwento kanye Nemibandela Yokwakha Isihlahla"
"Optional: Sub-Tree Item": "Ongakukhetha: Into Yesihlahla Esincane"
"Remove graph-based criteria": "Khipha imibandela esekelwe egrafini"
"Save": "Londoloza"
"Save outcome is uncertain. Reload before retrying.": "Umphumela wokulondoloza awuqinisekile. Layisha kabusha ngaphambi kokuzama futhi."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Londoloza umthetho kuqala; Ukukhethwa Kwento kanye Nezimfuneko Zokudala Isihlahla kwengezwa ngemva kwalokho."
"The Item Type that shall be dynamically added to the tree.": "Uhlobo Lwento oluzokwengezwa ngokuguquguqukayo esihlahleni."
"The tree rule changed since you opened this form. Reload before saving.": "Umthetho wesihlahla ushintshile selokhu uvule leli fomu. Layisha kabusha ngaphambi kokulondoloza."
"Tree": "Isihlahla"
"Tree Rule Selection [edit: %name%]": "Ukukhethwa Komthetho Wesihlahla [hlela: %name%]"
"Tree Rules Selection [new]": "Ukukhethwa Kwemithetho Yesihlahla [okusha]"
"Tree rule not found.": "Umthetho wesihlahla awutholakalanga."
"Tree rule saved.": "Umthetho wesihlahla ulondoloziwe."
"Unable to load the tree rule. Reload before retrying.": "Ayikwazi ukulayisha umthetho wesihlahla. Layisha kabusha ngaphambi kokuzama futhi."
"Unexpected fields were submitted.": "Kuthunyelwe izinkambu ezingalindelekile."
