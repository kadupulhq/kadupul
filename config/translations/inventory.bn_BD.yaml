"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "এই ডিভাইসগুলোতে বর্তমান নির্ধারিত টেমপ্লেটগুলো প্রয়োগ করুন। অনুপস্থিত গ্রাফ ও ডেটা-কোয়েরি সংযুক্তি যোগ করা হবে এবং অব্যবহৃত গ্রাফ-টেমপ্লেট সংযুক্তি অপসারণ করা হতে পারে। টেমপ্লেটবিহীন ডিভাইসগুলো এড়িয়ে যাওয়া হবে। বিদ্যমান গ্রাফ ও ঐতিহাসিক ডেটা সংরক্ষিত থাকবে; অটোমেশন নতুন গ্রাফ তৈরি করতে পারে।"
