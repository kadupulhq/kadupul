"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "Aquest formulari de conjunt d'opcions SNMP ha caducat. Obriu de nou el conjunt d'opcions SNMP i utilitzeu el seu formulari actual."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Aquesta és una cadena única que es compararà amb la cadena sysDescr d'un dispositiu per associar-lo a aquesta plantilla d'automatització.  Es pot utilitzar qualsevol expressió regular Perl, a més de qualsevol expressió SQL Where."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Aquesta és una cadena única que es compararà amb la cadena sysName d'un dispositiu per associar-lo a aquesta plantilla d'automatització.  Es pot utilitzar qualsevol expressió regular Perl, a més de qualsevol expressió SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Aquesta és una cadena única que es compararà amb la cadena sysOid d'un dispositiu per associar-lo a aquesta plantilla d'automatització.  Es pot utilitzar qualsevol expressió regular Perl, a més de qualsevol expressió SQL Where."
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "Aquest formulari heretat de plantilla d'automatització ha caducat. Obriu Regles de dispositius i envieu un formulari nou."
