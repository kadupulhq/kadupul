"Action": "عملیات"
"Advanced options": "گزینه‌های پیشرفته"
"Applying database upgrades": "در حال اعمال ارتقاهای پایگاه داده"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "از پایگاه داده، فایل‌های RRD، پیکربندی و کلیدها نسخه پشتیبان بگیرید. ارتقاهای پایگاه داده ممکن است تغییراتی را ثبت کنند که بازگردانی برنامه قادر به برگرداندن آن‌ها نباشد."
"Blocked": "مسدودشده"
"Check": "بررسی"
"Check again": "بررسی مجدد"
"Check collection freshness and collector connectivity before enabling discovery.": "پیش از فعال کردن کشف، تازگی جمع‌آوری و اتصال‌پذیری گردآورنده را بررسی کنید."
"Check requirements": "بررسی پیش‌نیازها"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "بررسی‌ها این فرآیند و مجوزهای سیستم فایل را بازرسی می‌کنند. هیچ فایل آزمایشی نمی‌نویسند و با دستگاه‌ها تماس نمی‌گیرند."
"Collection profile": "نمایه جمع‌آوری"
"Collector": "گردآورنده"
"Configure": "پیکربندی"
"Configuring collection profiles": "در حال پیکربندی نمایه‌های جمع‌آوری"
"Configuring discovery": "در حال پیکربندی کشف"
"Configuring the local device": "در حال پیکربندی دستگاه محلی"
"Confirming database version": "در حال تأیید نسخه پایگاه داده"
"Converting selected tables": "در حال تبدیل جدول‌های انتخاب‌شده"
"Database version": "نسخه پایگاه داده"
"Disabled": "غیرفعال"
"Discovery": "کشف"
"Discovery SNMP settings": "تنظیمات SNMP کشف"
"Discovery range": "بازه کشف"
"Enable discovery after installation": "فعال کردن کشف پس از نصب"
"Executable paths": "مسیرهای اجرایی"
"Execution status": "وضعیت اجرا"
"Finished execution": "اجرا به پایان رسید"
"Finishing tasks only. Schema migrations will not be replayed.": "فقط کارهای پایانی انجام می‌شوند. مهاجرت‌های طرح‌واره دوباره اجرا نخواهند شد."
"I accept the license terms": "شرایط مجوز را می‌پذیرم"
"I authorize discovery of the displayed range": "کشف بازه نمایش‌داده‌شده را مجاز می‌دانم"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "گزارش وقایع را بررسی کردم و تأیید می‌کنم که کارگر قبلی و فرآیندهای فرزند آن متوقف شده‌اند"
"I checked the previous attempt and accept that some changes may already be committed": "تلاش قبلی را بررسی کردم و می‌پذیرم که ممکن است برخی تغییرات از قبل ثبت شده باشند"
"I reviewed this plan and have the required backups": "این طرح را بازبینی کردم و نسخه‌های پشتیبان مورد نیاز را در اختیار دارم"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "اگر کارگری به‌طور غیرمنتظره متوقف شد، پیش از تلاش مجددِ صریح، log/cacti.log را حفظ کنید و از پایان یافتن فرآیند آن مطمئن شوید. وضعیت انتظار به معنای راه‌اندازی موفق نیست."
"Importing templates": "در حال وارد کردن الگوها"
"Install Kadupul": "نصب Kadupul"
"Installation and upgrade": "نصب و ارتقا"
"Installation request was rejected.": "درخواست نصب رد شد."
"Installation steps": "مراحل نصب"
"Installed": "نصب‌شده"
"Keep a backup of the database, RRD files, configuration and secret material.": "نسخه پشتیبانی از پایگاه داده، فایل‌های RRD، پیکربندی و داده‌های محرمانه نگه دارید."
"Language": "زبان"
"Large tables may require the dedicated CLI conversion tool before installation.": "جدول‌های بزرگ ممکن است پیش از نصب به ابزار تبدیل اختصاصی CLI نیاز داشته باشند."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "برای حفظ اعتبارنامه‌های ذخیره‌شده، فیلدهای محرمانه را خالی بگذارید. مقادیر محرمانه هرگز دوباره نمایش داده نمی‌شوند."
"License": "مجوز"
"No action needed": "نیازی به اقدام نیست"
"Observed": "مشاهده‌شده"
"Open the console": "باز کردن کنسول"
"Operation": "عملیات"
"Override discovery SNMP settings": "بازنویسی تنظیمات SNMP کشف"
"Pass": "موفق"
"Poller interval in seconds": "بازه پولر به ثانیه"
"Preparing CSRF protection": "در حال آماده‌سازی محافظت CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "پیشرفت آخرین مرحله ثبت‌شده را نشان می‌دهد. بازآوری این صفحه هرگز یک کارگر را آغاز یا دوباره امتحان نمی‌کند."
"Recover stopped attempt": "بازیابی تلاش متوقف‌شده"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "بازیابی انتخاب‌های ذخیره‌شده را حفظ می‌کند و هرگز یک کارگر زنده را متوقف نمی‌کند. پیش از تلاش مجدد، طرح را دوباره بازبینی کنید."
"Review": "بازبینی"
"Review installation plan": "بازبینی طرح نصب"
"Run": "اجرا"
"Run reviewed plan": "اجرای طرح بازبینی‌شده"
"Save and review": "ذخیره و بازبینی"
"Scope": "دامنه"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "وضعیت در دسترس نیست. کار ذخیره‌شده حفظ شده است. برای اتصال مجدد بازآوری کنید؛ نصب دیگری ارسال نکنید."
"Synchronizing collectors": "در حال همگام‌سازی گردآورنده‌ها"
"Table conversions": "تبدیل‌های جدول"
"Templates": "الگوها"
"The database version matches this application. Installation does not establish that polling is healthy.": "نسخه پایگاه داده با این برنامه مطابقت دارد. نصب، سلامت پولینگ را اثبات نمی‌کند."
"The request outcome is unknown. Check execution status before retrying.": "نتیجه درخواست نامشخص است. پیش از تلاش مجدد، وضعیت اجرا را بررسی کنید."
"Theme": "پوسته"
"Verify": "بررسی و تأیید"
"Verify the poller schedule and service account.": "زمان‌بندی پولر و حساب سرویس را بررسی و تأیید کنید."
"Version change": "تغییر نسخه"
"Waiting for the installation worker": "در انتظار کارگر نصب"
"collector": "گردآورنده"
"complete": "تکمیل‌شده"
"failed": "ناموفق"
"finish": "پایان"
"install": "نصب"
"not_started": "شروع‌نشده"
"partial": "جزئی"
"running": "در حال اجرا"
"succeeded": "موفقیت‌آمیز"
"upgrade": "ارتقا"
"waiting": "در انتظار"
"Accept the license before saving the installation plan.": "پیش از ذخیره طرح نصب، مجوز را بپذیرید."
"Invalid installation form.": "فرم نصب نامعتبر است."
"Access denied.": "دسترسی رد شد."
"Confirm the recovery warning before retrying.": "پیش از تلاش مجدد، هشدار بازیابی را تأیید کنید."
"Review and confirm the current installation plan.": "طرح نصب فعلی را بازبینی و تأیید کنید."
"Confirm the discovery scope before starting.": "پیش از شروع، دامنه کشف را تأیید کنید."
"Resolve the blocking checks before starting.": "پیش از شروع، بررسی‌های مسدودکننده را برطرف کنید."
"Too many installer options.": "تعداد گزینه‌های نصب‌کننده بیش از حد زیاد است."
"Invalid installer option name.": "نام گزینه نصب‌کننده نامعتبر است."
"Unknown or malformed installer option.": "گزینه نصب‌کننده ناشناخته یا بدشکل است."
"Installer options must be scalar values.": "گزینه‌های نصب‌کننده باید مقادیر اسکالر باشند."
"Installer option is too long or contains a null byte.": "گزینه نصب‌کننده بیش از حد طولانی است یا حاوی بایت تهی (null) است."
"Installer IDs and intervals must be whole numbers.": "شناسه‌های نصب‌کننده و بازه‌ها باید اعداد صحیح باشند."
"Installer ID or interval is outside its supported range.": "شناسه نصب‌کننده یا بازه خارج از محدوده مجاز خود است."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "نصب نتوانست ادامه یابد. پیش از تلاش مجدد، وضعیت آن را دوباره بارگذاری کرده و بررسی‌های مسدودکننده را بازبینی کنید."
"Confirm that the previous worker has stopped before recovering its plan.": "پیش از بازیابی طرح کارگر قبلی، تأیید کنید که متوقف شده است."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "پایگاه داده نصب شده است، اما برخی گردآورنده‌ها همچنان به همگام‌سازی نیاز دارند. پس از بررسی وضعیت آن‌ها، کارهای پایانی را دوباره امتحان کنید."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "نصب متوقف شد. گزارش وقایع نصب‌کننده را حفظ کنید، علت را برطرف نمایید و تلاش مجدد را به‌طور صریح تأیید کنید. ممکن است برخی تغییرات پایگاه داده از قبل ثبت شده باشند. پیش از صدور مجوز تلاش مجدد، پاک‌سازی افزونه را بررسی کنید."
"Next action": "عملیات بعدی"
"Follow the execution status. Do not start another attempt while a worker is active.": "وضعیت اجرا را دنبال کنید. تا زمانی که یک کارگر فعال است، تلاش دیگری را آغاز نکنید."
"Complete the recovery checklist before retrying.": "پیش از تلاش مجدد، فهرست بررسی بازیابی را تکمیل کنید."
"Verify collection and graph operation before enabling discovery.": "پیش از فعال کردن کشف، عملکرد جمع‌آوری و نمودارها را بررسی و تأیید کنید."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "پیش‌نیازهای مسدودشده را برطرف کنید، سپس دوباره بررسی نمایید. انتخاب‌های ذخیره‌شده حفظ می‌شوند."
"Review the planned changes and backup checklist before authorizing execution.": "پیش از صدور مجوز اجرا، تغییرات برنامه‌ریزی‌شده و فهرست بررسی پشتیبان‌گیری را بازبینی کنید."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "یک نمایه جمع‌آوری انتخاب کنید و مجوز را بپذیرید. تنظیمات اختیاری را می‌توان در صورت نیاز باز کرد."
"Download installation diagnostics": "بارگیری اطلاعات عیب‌یابی نصب"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "یک نمودار را باز کنید و مطمئن شوید که داده‌های RRD آن پس از یک چرخه پولر به‌روزرسانی می‌شوند."
"Requirement details": "جزئیات پیش‌نیاز"
"Recover": "بازیابی"
"Recovery checklist": "فهرست بررسی بازیابی"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log را حفظ کنید و تلاش ناموفق را ثبت نمایید."
"Confirm that the previous worker and its child processes have stopped.": "تأیید کنید که کارگر قبلی و فرآیندهای فرزند آن متوقف شده‌اند."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "تغییرات ثبت‌شده، همگام‌سازی گردآورنده و پاک‌سازی افزونه را بررسی کنید. پیش از تلاش مجدد، علت را برطرف نمایید."
"Review the saved plan again, then explicitly authorize a retry.": "طرح ذخیره‌شده را دوباره بازبینی کنید، سپس به‌طور صریح مجوز تلاش مجدد را صادر نمایید."
"Recover a stopped worker": "بازیابی یک کارگر متوقف‌شده"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "فقط پس از اطمینان از اینکه این تلاش دیگر در حال اجرا نیست از بازیابی استفاده کنید. بازیابی هیچ فرآیندی را متوقف نمی‌کند."
"Collector and installation mode": "گردآورنده و حالت نصب"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "پیکربندی استقرار، نقش گردآورنده و اتصال‌های پایگاه داده را تعیین می‌کند. پیش از راه‌اندازی یک گردآورنده، پیکربندی سرور اصلی را بررسی نمایید."
"Discovery and SNMP settings": "تنظیمات کشف و SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "تا زمانی که جمع‌آوری و اتصال‌پذیری گردآورنده تأیید نشده‌اند، کشف را غیرفعال نگه دارید."
"Template selection": "انتخاب الگو"
"Templates selected for import": "الگوهای انتخاب‌شده برای واردسازی"
"No templates selected.": "هیچ الگویی انتخاب نشده است."
"Backup checklist": "فهرست بررسی پشتیبان‌گیری"
"Database backup and a tested restoration procedure.": "پشتیبان‌گیری پایگاه داده و رویه آزمایش‌شده بازیابی."
"RRD files and the service account permissions needed to restore them.": "فایل‌های RRD و مجوزهای حساب سرویس مورد نیاز برای بازیابی آن‌ها."
"Configuration, keys and plugin data outside the database.": "پیکربندی، کلیدها و داده‌های افزونه‌ها در خارج از پایگاه داده."
"Post-installation checks": "بررسی‌های پس از نصب"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "بررسی‌های تأییدشده فقط شواهد نمایش‌داده‌شده را پوشش می‌دهند. بررسی‌های ارزیابی‌نشده همچنان نیازمند تأیید اپراتور هستند."
"Operational checks still require operator verification.": "بررسی‌های عملیاتی همچنان نیازمند تأیید اپراتور هستند."
"Status": "وضعیت"
"verified": "تأییدشده"
"action_required": "نیازمند اقدام"
"not_assessed": "ارزیابی‌نشده"
"Database schema": "طرح‌واره پایگاه داده"
"Stored schema matches the application target.": "طرح‌واره ذخیره‌شده با هدف برنامه مطابقت دارد."
"Target schema completion has not been confirmed.": "تکمیل طرح‌واره هدف تأیید نشده است."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "نتیجه نصب را بازبینی کنید و پیش از تلقی کردن ارتقای طرح‌واره به‌عنوان کامل، خطاها را برطرف نمایید."
"Installation outcome": "نتیجه نصب"
"A successful receipt matches the current target schema.": "رسید موفق با طرح‌واره هدف فعلی مطابقت دارد."
"A complete successful installation outcome has not been confirmed.": "نتیجه نصب کامل و موفق تأیید نشده است."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "گزارش وقایع نصب‌کننده را حفظ کنید و در صورت نیاز از رویه صریح بازیابی یا تلاش مجدد استفاده نمایید."
"Collector synchronization": "همگام‌سازی گردآورنده"
"The completed installer reports pending collector synchronization.": "نصب‌کننده تکمیل‌شده، همگام‌سازی در انتظارِ گردآورنده را گزارش می‌کند."
"The completed installer reports no pending collectors.": "نصب‌کننده تکمیل‌شده هیچ گردآورنده در انتظاری گزارش نمی‌کند."
"Collector completion remains unconfirmed by this partial receipt.": "تکمیل گردآورنده با این رسید جزئی همچنان تأییدنشده باقی مانده است."
"Collector completion is not established by this installation outcome.": "تکمیل گردآورنده با این نتیجه نصب اثبات نمی‌شود."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "وضعیت گردآورنده را بررسی کنید و کارهای پایانی را برای نتایج جزئی دوباره امتحان کنید. این کار تازگی جمع‌آوری بعدی را تأیید نمی‌کند."
"Scheduled collection": "جمع‌آوری زمان‌بندی‌شده"
"No poller or device was contacted by this assessment.": "در این ارزیابی با هیچ پولر یا دستگاهی تماس گرفته نشد."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "تأیید کنید که زمان‌بند پیکربندی‌شده، پولر را با حساب سرویس مورد نظر اجرا می‌کند و چرخه عادی بعدی آن را بررسی نمایید."
"Graph data": "داده‌های نمودار"
"Live samples and RRD updates were not exercised.": "نمونه‌های زنده و به‌روزرسانی‌های RRD آزمایش نشده‌اند."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "پس از یک چرخه عادی جمع‌آوری، اطمینان حاصل کنید که نمودارهای مورد انتظار نمونه‌های تازه دریافت می‌کنند و خطاهای پولر را بررسی کنید."
"Recovery readiness": "آمادگی بازیابی"
"Backup restoration was not exercised.": "بازیابی نسخه پشتیبان آزمایش نشده است."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "پیش از اتکا به بازیابی، یک بازیابی ایزوله‌شده از پایگاه داده، فایل‌های RRD، پیکربندی و کلیدها را آزمایش و تأیید کنید."
"No persisted local poller start has been recorded.": "هیچ شروع ماندگار پولر محلی ثبت نشده است."
"Persisted poller timing is invalid and cannot establish scheduler health.": "زمان‌بندی ماندگار پولر نامعتبر است و نمی‌تواند سلامت زمان‌بند را اثبات کند."
"The recorded poller start is in the future. Check clock synchronization.": "آغاز ثبت‌شده پولر در آینده است. همگام‌سازی ساعت را بررسی کنید."
"The recorded poller start is older than the native scheduling tolerance.": "آغاز ثبت‌شده پولر قدیمی‌تر از بازه تحمل زمان‌بندی بومی است."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "آغاز یک پولر محلی در بازه تحمل زمان‌بندی بومی ثبت شد. تکمیل کار و سلامت دستگاه بررسی نشده است."
"readable": "قابل خواندن"
"missing or unreadable": "مفقود یا غیرقابل خواندن"
"Restore the complete release and its locked dependencies; grant the service account read access.": "نسخه کامل و وابستگی‌های قفل‌شده آن را بازیابی کنید؛ به حساب سرویس دسترسی خواندن بدهید."
"PHP temporary directory": "دایرکتوری موقت PHP"
"directory writable by this process": "دایرکتوری قابل نوشتن توسط این فرآیند"
"missing or not writable": "مفقود یا غیرقابل نوشتن"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir را به‌عنوان یک دایرکتوری موجود و قابل نوشتن توسط حساب کاربری نصب پیکربندی کنید. واردسازی‌های بومی از فایل‌های موقت استفاده می‌کنند."
"Background worker launch": "راه‌اندازی کارگر پس‌زمینه"
"required PHP functions available; launch not exercised": "توابع PHP مورد نیاز در دسترس هستند؛ راه‌اندازی آزمایش نشده است"
"required PHP launch function disabled": "تابع راه‌اندازی PHP مورد نیاز غیرفعال است"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "exec را برای محیط اجرای وب PHP فعال کنید یا از نصب‌کننده مجاز CLI استفاده نمایید."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "popen و pclose را برای محیط اجرای وب PHP فعال کنید یا از نصب‌کننده مجاز CLI استفاده نمایید."
"Database transaction ownership": "مالکیت تراکنش پایگاه داده"
"autocommit enabled; no caller-owned transaction": "autocommit فعال؛ بدون تراکنش متعلق به فراخواننده"
"autocommit disabled or caller transaction active": "autocommit غیرفعال یا تراکنش فراخواننده فعال است"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "نصب را خارج از تراکنش متعلق به فراخواننده اجرا کنید و autocommit را روی اتصال تغییردهنده آن فعال نمایید."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "دایرکتوری نسخه را بازیابی کنید و برای واردسازی منابع الگو، به حساب کاربری نصب دسترسی نوشتن بدهید. آن را برای همه قابل نوشتن نکنید."
"Worker file: install/background.php": "فایل کارگر: install/background.php"
"Worker file: bin/legacy-installer.php": "فایل کارگر: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "فایل کارگر: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "مقصد واردسازی: resource/snmp_queries"
"Import destination: resource/script_server": "مقصد واردسازی: resource/script_server"
"Import destination: resource/script_queries": "مقصد واردسازی: resource/script_queries"
"Import destination: scripts": "مقصد واردسازی: scripts"
"Database privileges": "مجوزهای پایگاه داده"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "مجوزهای مؤثر مهاجرت، شامل نقش‌های فعال و مجوزهای اختصاصی اشیا، بررسی نشده‌اند."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "از مدیر پایگاه داده بخواهید نوشتن‌های مورد نیاز در جدول‌ها، تغییرات طرح‌واره، تریگرها و روال‌ها را برای حساب کاربری نصب و طرح‌واره بررسی کند. مجوزهای مدیر سراسری اعطا نکنید."
"Compare web and worker runtimes": "مقایسه محیط‌های اجرای وب و کارگر"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "این کار به‌طور صریح یک کاوشگر کوتاه و فقط‌خواندنی PHP را آغاز می‌کند. نصب‌کننده‌ای رزرو نمی‌کند، فایلی نمی‌نویسد و با دستگاه‌ها تماس نمی‌گیرد."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "کاوشگر از این فرآیند وب ارث‌بری می‌کند و از مفسر PHP نصب‌کننده پیکربندی‌شده استفاده می‌نماید. این کاوشگر هیچ زمان‌بند یا سرویس جداگانه‌ای را بررسی نمی‌کند."
"I authorize the read-only worker runtime comparison.": "مقایسه فقط‌خواندنی محیط اجرای کارگر را مجاز می‌دانم."
"Compare runtimes": "مقایسه محیط‌های اجرا"
"Runtime comparison results": "نتایج مقایسه محیط اجرا"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "تفاوت‌های مجوز و هویت ممکن است عمدی باشند. مشاهدات فقط‌خواندنی ثابت نمی‌کنند که نوشتن یا نصب با موفقیت انجام خواهد شد."
"Confirm the read-only worker runtime comparison.": "مقایسه فقط‌خواندنی محیط اجرای کارگر را تأیید کنید."
"The runtime comparison is unavailable.": "مقایسه محیط اجرا در دسترس نیست."
"Shared application secret": "رمز مشترک برنامه"
"A strong web application secret is required before comparison.": "پیش از مقایسه، وجود یک رمز قوی برای برنامه وب الزامی است."
"Runtime comparison": "مقایسه محیط اجرا"
"The configured worker runtime did not confirm a bounded comparison.": "محیط اجرای کارگر پیکربندی‌شده، یک مقایسه کران‌دار را تأیید نکرد."
"The inherited worker secret could not be confirmed against the web secret.": "رمز به ارث‌رسیده کارگر در برابر رمز وب قابل تأیید نبود."
"PHP runtime comparison": "مقایسه محیط اجرای PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "هر دو محیط اجرا باید از PHP 8.4 پشتیبانی کنند؛ تفاوت در نسخه‌های وصله نیازمند بررسی است."
"Required extension comparison": "مقایسه افزونه مورد نیاز"
"Required extension availability is checked; differing versions require review.": "در دسترس بودن افزونه مورد نیاز بررسی شده است؛ تفاوت در نسخه‌ها نیازمند بررسی است."
"Process identity comparison": "مقایسه هویت فرآیند"
"Effective process identity is unavailable on this platform.": "هویت مؤثر فرآیند روی این سکو در دسترس نیست."
"Effective process identities match.": "هویت‌های مؤثر فرآیند مطابقت دارند."
"Effective process identities differ; separate service accounts may be intentional.": "هویت‌های مؤثر فرآیند متفاوت هستند؛ استفاده از حساب‌های سرویس مجزا ممکن است عمدی باشد."
"Directory access comparison": "مقایسه دسترسی دایرکتوری"
"Read-only directory permission observations match.": "مشاهدات فقط‌خواندنی مجوزهای دایرکتوری مطابقت دارند."
"Directory locations or permission observations differ; review the service-account roles.": "مسیرهای دایرکتوری یا مشاهدات مجوز متفاوت هستند؛ نقش‌های حساب سرویس را بررسی کنید."
"Worker directory read and traversal": "خواندن و پیمایش دایرکتوری کارگر"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "دایرکتوری‌های مورد نیاز کارگر باید وجود داشته باشند و اجازه خواندن و پیمایش بدهند. هیچ نوشتنی آزمایش نشده است."
"The inherited worker secret matches the web secret for this private challenge.": "رمز به ارث‌رسیده کارگر با رمز وب برای این چالش خصوصی مطابقت دارد."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "مفسر PHP پیکربندی‌شده، افزونه‌های مورد نیاز، رمز به ارث‌رسیده و مجوزهای دایرکتوری حساب سرویس را بررسی کنید. هیچ نوشتنی یا راه‌اندازی نصب‌کننده انجام نشده است."
"advisory": "مشورتی"
