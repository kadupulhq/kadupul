"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "ದೈನಿಕ ಮತ್ತು ಸಾಪ್ತಾಹಿಕ ವೇಳಾಪಟ್ಟಿಗಳು ಆರಂಭ ಮತ್ತು ಪ್ರತಿ ಮರುಚಾಲನೆಯನ್ನು ಬಳಸುತ್ತವೆ; ಸಾಪ್ತಾಹಿಕವು ವಾರದ ದಿನಗಳನ್ನೂ ಬಳಸುತ್ತದೆ. ಮಾಸಿಕವು ತಿಂಗಳುಗಳು ಮತ್ತು ತಿಂಗಳ ದಿನಗಳನ್ನು ಬಳಸುತ್ತದೆ; ದಿನದಂದು ಮಾಸಿಕವು ತಿಂಗಳುಗಳು, ತಿಂಗಳ ವಾರಗಳು ಮತ್ತು ವಾರದ ದಿನಗಳನ್ನು ಬಳಸುತ್ತದೆ."
