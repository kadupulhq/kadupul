"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS ಪರಿಹಾರಕ್ಕಾಗಿ ಬಳಸಲು ಪರ್ಯಾಯ DNS ಸರ್ವರ್‌ಗಳ ಸ್ಪೇಸ್‌ನಿಂದ ಬೇರ್ಪಡಿಸಿದ ಪಟ್ಟಿ. ಖಾಲಿ ಇದ್ದರೆ, DNS ಹೆಸರುಗಳನ್ನು ಪರಿಹರಿಸಲು ಪೋಲರ್ OS ಅನ್ನು ಬಳಸಲಾಗುತ್ತದೆ."
