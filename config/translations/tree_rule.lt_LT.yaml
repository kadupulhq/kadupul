"A useful name for this Rule.": "Naudingas šios taisyklės pavadinimas."
"Access denied.": "Prieiga uždrausta."
"Add Tree Rule": "Pridėti medžio taisyklę"
"Back to Tree Rules": "Atgal į medžių taisykles"
"Cancel": "Atšaukti"
"Check this box to enable this rule.": "Pažymėkite šį langelį, kad įjungtumėte šią taisyklę."
"Choose a Tree for the new Tree Items.": "Pasirinkite naujų medžio elementų medį."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Pasirinkite pasirinkto medžio antraštę, prie kurios prijungti, arba jo šaknį. Įsitikinkite, kad ji vis dar egzistuoja, kai ši taisyklė bus vykdoma."
"Choose a header of the selected Tree.": "Pasirinkite pasirinkto medžio antraštę."
"Choose a listed Graph Grouping Style.": "Pasirinkite sąraše esantį grafikų grupavimo stilių."
"Choose a listed Leaf Item Type.": "Pasirinkite sąraše esantį lapo elemento tipą."
"Choose an existing Tree.": "Pasirinkite esamą medį."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Pasirinkite, kaip grafikai grupuojami, kai braižomi šiam konkrečiam medžio įrenginiui. Naudojama įrenginių lapams."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Spustelėkite „Tęsti“, kad ištrintumėte šias medžių taisykles kartu su jų objektų atranka ir medžio kūrimo kriterijais."
"Click Continue to disable the following Tree Rules.": "Spustelėkite „Tęsti“, kad išjungtumėte šias medžių taisykles."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Spustelėkite „Tęsti“, kad dubliuotumėte šias medžių taisykles. Galite pasirinktinai pakeisti naujų medžių taisyklių, kurios pradžioje išjungtos, pavadinimo formatą."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Spustelėkite „Tęsti“, kad įjungtumėte šias medžių taisykles. Įsitikinkite, kad jos sėkmingai išbandytos."
"Continue": "Tęsti"
"Data Query Index": "Duomenų užklausos indeksas"
"Delete Tree Rules": "Ištrinti medžių taisykles"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Ištrynimo rezultatas neaiškus. Prieš kartodami patikrinkite medžių taisyklių sąrašą."
"Delete selected": "Ištrinti pasirinktas"
"Device": "Įrenginys"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Įrenginių lapai negali naudoti kriterijų, susijusių su grafikų ar grafikų šablonų stulpeliais. Keisdami lapo elemento tipą į „Įrenginys“, pažymėkite šį langelį, kad pašalintumėte tuos kriterijus; jų atkurti nebus galima."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Įrenginių lapai negali naudoti grafikais pagrįstų kriterijų. Norėdami įrašyti, patvirtinkite %count% kriterijų pašalinimą."
"Disable Tree Rules": "Išjungti medžių taisykles"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Išjungimo rezultatas neaiškus. Prieš kartodami patikrinkite medžių taisyklių sąrašą."
"Disable selected": "Išjungti pasirinktas"
"Duplicate Tree Rules": "Dubliuoti medžių taisykles"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Dubliavimo rezultatas neaiškus. Prieš kartodami patikrinkite medžių taisyklių sąrašą."
"Duplicate selected": "Dubliuoti pasirinktas"
"Edit Tree Rule": "Redaguoti medžio taisyklę"
"Enable Rule": "Įjungti taisyklę"
"Enable Tree Rules": "Įjungti medžių taisykles"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Įjungimo rezultatas neaiškus. Prieš kartodami patikrinkite medžių taisyklių sąrašą."
"Enable selected": "Įjungti pasirinktas"
"Enter a name.": "Įveskite pavadinimą."
"Enter a valid name format.": "Įveskite tinkamą pavadinimo formatą."
"Enter at most %count% characters.": "Įveskite ne daugiau kaip %count% simbolių."
"Enter single-line text.": "Įveskite vienos eilutės tekstą."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Kiekvienas <rule_name> pakeičiamas kopijuojamos medžio taisyklės pavadinimu."
