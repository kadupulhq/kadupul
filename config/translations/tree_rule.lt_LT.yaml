"Leaf Item Type": "Lapo elemento tipas"
"Name": "Pavadinimas"
"Object Selection and Tree Creation Criteria": "Objektų atranka ir medžio kūrimo kriterijai"
"One or more selected Tree Rules no longer exist.": "Vienos ar kelių pasirinktų medžių taisyklių nebėra."
"Optional: Sub-Tree Item": "Neprivaloma: submedžio elementas"
"Remove graph-based criteria": "Pašalinti grafikais pagrįstus kriterijus"
"Save": "Išsaugoti"
"Save outcome is uncertain. Reload before retrying.": "Įrašymo rezultatas neaiškus. Prieš kartodami įkelkite iš naujo."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Pirmiausia įrašykite taisyklę; jos objektų atranka ir medžio kūrimo kriterijai pridedami vėliau."
"Select": "Pasirinkti"
"Select %name%": "Pasirinkti %name%"
"Select at least one Tree Rule.": "Pasirinkite bent vieną medžio taisyklę."
"Select at most 100 Tree Rules at a time.": "Vienu metu pasirinkite ne daugiau kaip 100 medžių taisyklių."
"Select up to %count% rows at a time.": "Vienu metu pasirinkite iki %count% eilučių."
"The Item Type that shall be dynamically added to the tree.": "Elemento tipas, kuris bus dinamiškai pridedamas prie medžio."
"The name format must give every copy a name of 1 to 255 characters.": "Pavadinimo formatas turi suteikti kiekvienai kopijai 1–255 simbolių pavadinimą."
"The tree rule changed since you opened this form. Reload before saving.": "Medžio taisyklė pasikeitė nuo šios formos atidarymo. Prieš įrašydami įkelkite iš naujo."
"Title Format": "Pavadinimo formatas"
"Tree": "Medis"
