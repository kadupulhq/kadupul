"A useful name for this Rule.": "Naudingas šios taisyklės pavadinimas."
"Access denied.": "Prieiga uždrausta."
"Add Graph Rule": "Pridėti grafikų taisyklę"
"Back to Graph Rules": "Atgal į grafikų taisykles"
"Cancel": "Atšaukti"
"Check this box to enable this rule.": "Pažymėkite šį langelį, kad įjungtumėte šią taisyklę."
"Choose a Data Query to apply to this rule.": "Pasirinkite šiai taisyklei taikytiną duomenų užklausą."
"Choose a Graph Type": "Pasirinkite grafiko tipą"
"Choose a Graph Type of the selected Data Query.": "Pasirinkite pasirinktos duomenų užklausos grafiko tipą."
"Choose an existing Data Query.": "Pasirinkite esamą duomenų užklausą."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Pasirinkite bet kurį pasiekiamą pasirinktos duomenų užklausos grafiko tipą, kad jis būtų taikomas šiai taisyklei."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Spustelėkite „Tęsti“, kad ištrintumėte šias grafikų taisykles kartu su jų įrenginių atrankos ir grafikų kūrimo kriterijais."
"Click Continue to disable the following Graph Rules.": "Spustelėkite „Tęsti“, kad išjungtumėte šias grafikų taisykles."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Spustelėkite „Tęsti“, kad dubliuotumėte šias grafikų taisykles. Galite pasirinktinai pakeisti naujų grafikų taisyklių, kurios pradžioje išjungtos, pavadinimo formatą."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Spustelėkite „Tęsti“, kad įjungtumėte šias grafikų taisykles. Įsitikinkite, kad jos sėkmingai išbandytos."
"Continue": "Tęsti"
"Data Query": "Duomenų užklausa"
