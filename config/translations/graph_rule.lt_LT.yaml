"Rule Selection [edit: %name%]": "Taisyklių atranka [redaguoti: %name%]"
"Rule Selection [new]": "Taisyklių atranka [nauja]"
"Save": "Išsaugoti"
"Save outcome is uncertain. Reload before retrying.": "Įrašymo rezultatas neaiškus. Prieš kartodami įkelkite iš naujo."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Pirmiausia įrašykite taisyklę; jos įrenginių atranka ir grafikų kūrimo kriterijai pridedami vėliau."
"Select": "Pasirinkti"
"Select %name%": "Pasirinkti %name%"
"Select at least one Graph Rule.": "Pasirinkite bent vieną grafikų taisyklę."
"Select at most 100 Graph Rules at a time.": "Vienu metu pasirinkite ne daugiau kaip 100 grafikų taisyklių."
"Select up to %count% rows at a time.": "Vienu metu pasirinkite iki %count% eilučių."
"The graph rule changed since you opened this form. Reload before saving.": "Grafikų taisyklė pasikeitė nuo šios formos atidarymo. Prieš įrašydami įkelkite iš naujo."
"The name format must give every copy a name of 1 to 255 characters.": "Pavadinimo formatas turi suteikti kiekvienai kopijai 1–255 simbolių pavadinimą."
"Title Format": "Pavadinimo formatas"
