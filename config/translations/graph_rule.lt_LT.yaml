"Enter a name.": "Įveskite pavadinimą."
"Enter a valid name format.": "Įveskite tinkamą pavadinimo formatą."
"Enter at most %count% characters.": "Įveskite ne daugiau kaip %count% simbolių."
"Enter single-line text.": "Įveskite vienos eilutės tekstą."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Kiekvienas <rule_name> pakeičiamas kopijuojamos grafikų taisyklės pavadinimu."
