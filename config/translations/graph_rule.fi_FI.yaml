"A useful name for this Rule.": "Kuvaava nimi tälle säännölle."
"Access denied.": "Pääsy estetty."
"Add Graph Rule": "Lisää kaaviosääntö"
"Back to Graph Rules": "Takaisin kaaviosääntöihin"
"Cancel": "Peruuta"
"Check this box to enable this rule.": "Ota tämä sääntö käyttöön valitsemalla ruutu."
"Choose a Data Query to apply to this rule.": "Valitse tähän sääntöön sovellettava tietokysely."
"Choose a Graph Type": "Valitse kaavion tyyppi"
"Choose a Graph Type of the selected Data Query.": "Valitse valitun tietokyselyn kaavion tyyppi."
"Choose an existing Data Query.": "Valitse olemassa oleva tietokysely."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Valitse tähän sääntöön sovellettava valitun tietokyselyn kaavion tyyppi."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Poista seuraavat kaaviosäännöt laitevalintoineen ja kaavioiden luontiehtoineen valitsemalla Jatka."
"Click Continue to disable the following Graph Rules.": "Poista seuraavat kaaviosäännöt käytöstä valitsemalla Jatka."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Monista seuraavat kaaviosäännöt valitsemalla Jatka. Voit halutessasi muuttaa uusien kaaviosääntöjen otsikkomuotoa; ne aloittavat pois käytöstä."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Ota seuraavat kaaviosäännöt käyttöön valitsemalla Jatka. Varmista, että ne on testattu onnistuneesti."
