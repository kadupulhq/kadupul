"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "Įrenginių pašalinimo rezultatas neaiškus. Prieš kartodami patikrinkite pasirinktus įrenginius, grafikus ir duomenų šaltinius."
