"Remote collectors must be online. Reload and verify the device after a failed assignment before retrying.": "Nuotoliniai rinkikliai turi būti prisijungę. Nepavykus priskirti, prieš kartodami įkelkite iš naujo ir patikrinkite įrenginį."
