"Advanced options": "Nhọrọ dị elu"
"Applying database upgrades": "Na-etinye mmelite nchekwa data"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Mee nkwado ndabere nke nchekwa data, faịlụ RRD, nhazi na mkpịsị ugodi. Mmelite nchekwa data nwere ike itinye mgbanwe nke nlọghachi azụ ngwa enweghị ike ikagbu."
