"I accept the license terms": "Ana m anabata usoro ikike"
"I authorize discovery of the displayed range": "Ana m enye ikike nchọpụta nke oke egosipụtara"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Enyochara m log ma kwado na onye ọrụ gara aga na usoro ụmụ ya akwụsịla"
"I checked the previous attempt and accept that some changes may already be committed": "Enyochara m mbọ gara aga ma nabata na ụfọdụ mgbanwe nwere ike ịbụ nke etinyelarị"
"I reviewed this plan and have the required backups": "Enyochara m atụmatụ a ma nwee ndabere achọrọ"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ọ bụrụ na onye ọrụ kwụsị na mberede, chekwaa log/cacti.log ma kwado na usoro ya akwụsịla tupu ịnwaa ọzọ n'ụzọ doro anya. Ọnọdụ ichere anaghị egosi mmalite gara nke ọma."
"Importing templates": "Na-ebubata ndebiri"
