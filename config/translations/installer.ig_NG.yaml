"Pass": "Gafere"
"Poller interval in seconds": "Oge poller na sekọnd"
"Preparing CSRF protection": "Na-akwado nchedo CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Ọganihu na-egosi oge ikpeazụ edere. Imegharị ibe a anaghị amalite ma ọ bụ nwaa onye ọrụ ọzọ."
"Recover stopped attempt": "Weghachite mbọ kwụsịrị"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Mgbake na-ejigide nhọrọ echekwara ma ọ dịghị mgbe ọ na-akwụsị onye ọrụ dị ndụ. Nyochaa atụmatụ ahụ ọzọ tupu ịnwaa ọzọ."
"Review": "Nyochaa"
"Review installation plan": "Nyochaa atụmatụ nwụnye"
"Run": "Gbaa"
"Run reviewed plan": "Gbaa atụmatụ enyochara"
"Save and review": "Chekwaa ma nyochaa"
"Scope": "Oke (Scope)"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Ọnọdụ adịghị. A na-ejigide ọrụ echekwara. Bugharịa iji jikọọ ọzọ; etinyela ntinye ọzọ."
"Synchronizing collectors": "Na-emekọrịta ndị nchịkọta"
"Table conversions": "Ntụgharị tebụl"
"Templates": "Atụmatụ"
"The database version matches this application. Installation does not establish that polling is healthy.": "Ụdị database kwekọrọ na ngwa a. Ntinye anaghị egosi na polling dị mma."
"The request outcome is unknown. Check execution status before retrying.": "Amaghị nsonaazụ arịrịọ ahụ. Lelee ọnọdụ mmezu tupu ị nwaa ọzọ."
"Theme": "Isiokwu (Theme)"
"Verify": "Nyochaa"
"Verify the poller schedule and service account.": "Nyochaa nhazi oge poller na akaụntụ ọrụ."
"Version change": "Mgbanwe ụdị"
