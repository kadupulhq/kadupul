"Accept the license before saving the installation plan.": "Nabata ikike ahụ tupu ịchekwaa atụmatụ nrụnye."
"Invalid installation form.": "Fọm nwụnye adịghị mma."
"Access denied.": "Ajụrụ ohere."
"Confirm the recovery warning before retrying.": "Kwado ịdọ aka ná ntị mgbake tupu ị nwaa ọzọ."
"Review and confirm the current installation plan.": "Nyochaa ma kwado atụmatụ nwụnye ugbu a."
"Confirm the discovery scope before starting.": "Kwado oke nchọpụta tupu ịmalite."
"Resolve the blocking checks before starting.": "Dozie nyocha mgbochi tupu ịmalite."
"Too many installer options.": "Ọtụtụ nhọrọ onye ntinye dị oke."
"Invalid installer option name.": "Aha nhọrọ installer adịghị mma."
"Unknown or malformed installer option.": "Nhọrọ onye ntinye amaghị ma ọ bụ nke mebiri emebi."
"Installer options must be scalar values.": "Nhọrọ installer ga-abụrịrị uru scalar."
"Installer option is too long or contains a null byte.": "Nhọrọ installer dị ogologo karịa ma ọ bụ nwere byte efu."
"Installer IDs and intervals must be whole numbers.": "ID na oge installer ga-abụrịrị ọnụọgụgụ zuru ezu."
"Installer ID or interval is outside its supported range.": "ID ma ọ bụ oge installer dị n'èzí oke a kwadoro."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Ntinye enweghị ike ịga n'ihu. Bugharịa ọnọdụ ya ma lelee nnyocha ndị na-egbochi ya tupu ị nwaa ọzọ."
"Confirm that the previous worker has stopped before recovering its plan.": "Kwado na onye ọrụ mbụ akwụsịla tupu iweghachite atụmatụ ya."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Ewụnyela database, mana ụfọdụ ndị nchịkọta ka chọrọ mmekọrịta. Nwaa ọrụ mmecha ọzọ mgbe ị lechara ọnọdụ ha."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Kwụsịrị nwụnye. Chekwaa log installer, dozie ihe kpatara ya ma kwado nnwale ọzọ n'ụzọ doro anya. Ụfọdụ mgbanwe nchekwa data nwere ike ịbụ nke etinyelarị. Lelee nhichapụ plugin tupu inye ikike nnwale ọzọ."
"Next action": "Omume ọzọ"
"Follow the execution status. Do not start another attempt while a worker is active.": "Soro ọnọdụ mmezu. Ebidoela mbọ ọzọ mgbe onye ọrụ na-arụ ọrụ."
"Complete the recovery checklist before retrying.": "Mechaa ndepụta nyocha mgbake tupu ị nwaa ọzọ."
"Verify collection and graph operation before enabling discovery.": "Nyochaa nchịkọta na ọrụ eserese tupu ịgbanwuo nchọpụta."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Dozie ihe achọrọ egbochiri, wee lelee ọzọ. A na-edobe nhọrọ echekwara."
"Review the planned changes and backup checklist before authorizing execution.": "Nyochaa mgbanwe e mere atụmatụ na ndepụta nyocha ndabere tupu inye ikike mmezu."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Họrọ profaịlụ nchịkọta ma nabata ikike. Enwere ike imeghe ntọala nhọrọ mgbe achọrọ."
"Download installation diagnostics": "Budata nchọpụta nrụnye"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Mepee eserese ma kwado na data RRD ya na-emelite mgbe okirikiri poller gasịrị."
"Requirement details": "Nkọwa ihe achọrọ"
"Recover": "Weghachite"
"Recovery checklist": "Ndepụta nyocha mgbake"
"Preserve log/cacti.log and record the failed attempt.": "Chekwaa log/cacti.log ma dekọọ mbọ dara ada."
"Confirm that the previous worker and its child processes have stopped.": "Kwado na onye ọrụ mbụ na usoro ụmụ ya akwụsịla."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Nyochaa mgbanwe etinyere, mmekọrịta onye nchịkọta na nhichapụ plugin. Dozie ihe kpatara ya tupu ịnwaa ọzọ."
"Review the saved plan again, then explicitly authorize a retry.": "Nyochaa atụmatụ echekwara ọzọ, wee nye ikike nnwale ọzọ n'ụzọ doro anya."
"Recover a stopped worker": "Weghachite onye ọrụ kwụsịrị"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Jiri mgbake naanị mgbe i kwenyere na mgbalị a anaghịzi agba ọsọ. Mgbake anaghị akwụsị usoro."
"Collector and installation mode": "Ngwa nchịkọta na ọnọdụ nrụnye"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Nhazi ntinye (deployment) na-ekpebi ọrụ onye nchịkọta na njikọ database. Nyochaa nhazi seva isi tupu ịmalite onye nchịkọta."
"Discovery and SNMP settings": "Ntọala nchọpụta na SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Debe nchọpụta na ngbanyụ ruo mgbe akwadoro nchịkọta na njikọta onye nchịkọta."
"Template selection": "Nhọrọ atụmatụ"
"Templates selected for import": "Atụmatụ ahọpụtara maka mbubata"
"No templates selected.": "Ahọpụtaghị ndebiri."
"Backup checklist": "Ndepụta nyocha nkwado ndabere"
"Database backup and a tested restoration procedure.": "Nkwado ndabere nchekwa data na usoro mweghachi anwalere."
"RRD files and the service account permissions needed to restore them.": "Faịlụ RRD na ikike akaụntụ ọrụ dị mkpa iji weghachite ha."
"Configuration, keys and plugin data outside the database.": "Nhazi, mkpịsị ugodi na data plọgin dị n'èzí nchekwa data."
"Post-installation checks": "Nyocha mgbe nwụnye gasịrị"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Nnyocha ekwenyere na-ekpuchi naanị ihe akaebe egosipụtara. Nnyocha a na-enyochabeghị ka chọrọ nkwenye onye ọrụ."
"Operational checks still require operator verification.": "Nyocha ọrụ ka chọrọ nkwado onye ọrụ."
"Status": "Ọnọdụ"
"verified": "enyochala"
"action_required": "ọrụ dị mkpa"
"not_assessed": "enyochaabeghị"
"Database schema": "Schema nchekwa data"
"Stored schema matches the application target.": "Atụmatụ e chekwara kwekọrọ na ebumnuche ngwa."
"Target schema completion has not been confirmed.": "Ekwebeghị mmecha atụmatụ ebumnuche."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Nyochaa nsonaazụ nwụnye ma dozie ọdịda tupu ị tụlee na nkwalite schema agwụla."
"Installation outcome": "Nsonaazụ nwụnye"
"A successful receipt matches the current target schema.": "Nnata gara nke ọma dakọtara na schema ebumnuche ugbu a."
"A complete successful installation outcome has not been confirmed.": "Ekwebeghị nsonaazụ nrụnye zuru oke na nke gara nke ọma."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Chekwaa log installer ma jiri usoro mgbake ma ọ bụ nnwale ọzọ doro anya mgbe achọrọ."
"Collector synchronization": "Nmekọrịta ngwa nchịkọta"
"The completed installer reports pending collector synchronization.": "Onye ntinye mechara akọọrọ mmekọrịta onye nchịkọta na-echere."
"The completed installer reports no pending collectors.": "Onye ntinye mechara akọọrọ na enweghị ndị nchịkọta na-echere."
"Collector completion remains unconfirmed by this partial receipt.": "Mmecha ngwa nchịkọta ka na-enweghị nkwado site na nnata akụkụ a."
"Collector completion is not established by this installation outcome.": "Nsonaazụ nrụnye a ekwenyebeghị mmecha ngwa nchịkọta."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Nyochaa ọnọdụ onye nchịkọta ma nwaa ọzọ ịmecha ọrụ maka nsonaazụ ezughị oke. Nke a anaghị akwado ịdị ọhụrụ nchịkọta na-esote."
"Scheduled collection": "Nchịkọta a haziri ahazi"
"No poller or device was contacted by this assessment.": "Nyocha a akpọtụrụghị poller ma ọ bụ ngwaọrụ ọ bụla."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Kwado na nhazi oge ahaziri na-agba poller dị ka akaụntụ ọrụ ezubere ma nyochaa usoro nkịtị ya na-esote."
"Graph data": "Data eserese"
"Live samples and RRD updates were not exercised.": "Emebeghị ihe atụ dị ndụ na mmelite RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Mgbe usoro nchịkọta nkịtị gasịrị, kwado na eserese a tụrụ anya ya na-enweta nlele ọhụrụ ma nyochaa njehie poller."
"Recovery readiness": "Njikere mgbake"
"Backup restoration was not exercised.": "Emeghị nnwale mweghachi nkwado ndabere."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Nyochaa mweghachi dị iche nke database, faịlụ RRD, nhazi na ihe igodo tupu ị dabere na mgbake."
"No persisted local poller start has been recorded.": "Enweghị mmalite poller mpaghara echekwara edekọla."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Oge poller echekwara adịghị mma ma enweghị ike iguzobe ahụike onye nhazi oge."
"The recorded poller start is in the future. Check clock synchronization.": "Mmalite poller e dekọrọ dị n'ọdịnihu. Lelee mmekọrịta elekere."
"The recorded poller start is older than the native scheduling tolerance.": "Mmalite poller e dekọrọ tọrọ karịa ntachi obi nhazi oge ala."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Edere mmalite poller dị n'ime n'ime oke ndidi nhazi oge dị n'ime. Ekwenyebeghị mmecha na ahụike ngwaọrụ."
"readable": "enwere ike ịgụ"
"missing or unreadable": "na-efu ma ọ bụ enweghị ike ịgụ"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Weghachite mbipụta zuru ezu na ndabere ya akpọchiri; nye akaụntụ ọrụ ikike ọgụgụ."
"PHP temporary directory": "Ndekọ nwa oge PHP"
"directory writable by this process": "ndekọ nke usoro a nwere ike ide"
"missing or not writable": "na-efu ma ọ bụ enweghị ike ide"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Hazie sys_temp_dir dị ka ndekọ faịlụ dị ugbu a nke akaụntụ nrụnye nwere ike ide ihe na ya. Mbubata ala na-eji faịlụ nwa oge."
"Background worker launch": "Mmalite onye ọrụ azụ"
"required PHP functions available; launch not exercised": "ọrụ PHP achọrọ dị; emebeghị mmalite"
"required PHP launch function disabled": "agbanyụọla ọrụ mmalite PHP achọrọ"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Gbanye exec maka PHP runtime web, ma ọ bụ jiri onye nrụnye CLI enyere ikike."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Gbanye popen, pclose maka PHP runtime web, ma ọ bụ jiri onye nrụnye CLI enyere ikike."
"Database transaction ownership": "Ikike azụmahịa nchekwa data"
"autocommit enabled; no caller-owned transaction": "autocommit agbanwuola; enweghị azụmahịa nke onye na-akpọ nwe"
"autocommit disabled or caller transaction active": "autocommit agbanyụrụ ma ọ bụ azụmahịa onye na-akpọ na-arụ ọrụ"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Gbaa nwụnye n'èzí azụmahịa nke onye oku nwere ma gbanye autocommit na njikọ mgbanwe ya."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Weghachite ndekọ mbipụta ma nye akaụntụ nwụnye ikike ide maka mbubata akụrụngwa ndebiri. Emela ka ụwa nwee ike ide ya."
"Worker file: install/background.php": "Faịlụ Worker: install/background.php"
"Worker file: bin/legacy-installer.php": "Faịlụ Worker: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Faịlụ Worker: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Ebe mbubata: resource/snmp_queries"
"Import destination: resource/script_server": "Ebe mbubata: resource/script_server"
"Import destination: resource/script_queries": "Ebe mbubata: resource/script_queries"
"Import destination: scripts": "Ebe mbubata: scripts"
"Database privileges": "Ikike nchekwa data"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Enyochaghị ikike mbufe dị irè, gụnyere ọrụ na-arụ ọrụ na onyinye akọwapụtara maka ihe."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Mee ka onye nchịkwa nchekwa data nyochaa ndedị tebụl achọrọ, mgbanwe schema, triggers na routines maka akaụntụ nrụnye na schema. Enyela ikike onye nchịkwa zuru ụwa ọnụ."
"Compare web and worker runtimes": "Tụnyere sistemụ arụmọrụ web na nke worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Nke a na-amalite nyocha PHP naanị-ọgụgụ dị mkpụmkpụ n'ụzọ doro anya. Ọ naghị edebe onye ntinye, dee faịlụ ma ọ bụ kpọtụrụ ngwaọrụ."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Nnyocha ahụ na-eketa usoro weebụ a ma jiri onye ntụgharị okwu PHP onye ntinye ahaziri ahazi. Ọ naghị enyocha onye nhazi oge ma ọ bụ ọrụ dị iche."
"I authorize the read-only worker runtime comparison.": "Ana m enye ikike ntụnyere oge arụmọrụ onye ọrụ ọgụgụ naanị."
"Compare runtimes": "Tụnyere sistemụ arụmọrụ"
"Runtime comparison results": "Nsonaazụ ntụnyere oge arụmọrụ"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Ndịiche ikike na njirimara nwere ike ịbụ nke eburu n'uche. Nchọpụta ọgụgụ naanị anaghị egosi na ndedị ma ọ bụ nwụnye ga-aga nke ọma."
"Confirm the read-only worker runtime comparison.": "Kwado ntụnyere sistemụ arụmọrụ worker naanị ọgụgụ."
"The runtime comparison is unavailable.": "Ntụnyere oge ọrụ adịghị."
"Shared application secret": "Nzuzo ngwa e kesara"
"A strong web application secret is required before comparison.": "Achọrọ nzuzo ngwa web siri ike tupu ntụnyere."
"Runtime comparison": "Ntụnyere oge arụmọrụ"
"The configured worker runtime did not confirm a bounded comparison.": "Oge ọrụ worker ahaziri ahazi ekwenyeghị ntụnyere nwere oke."
"The inherited worker secret could not be confirmed against the web secret.": "Enweghị ike ikwenye nzuzo worker e ketara megide nzuzo weebụ."
"PHP runtime comparison": "Ntụnyere oge arụmọrụ PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Sistemụ arụmọrụ abụọ ga-akwadorịrị PHP 8.4; nsụgharị patch dị iche iche chọrọ nyocha."
"Required extension comparison": "Ntụnyere ndọtị achọrọ"
"Required extension availability is checked; differing versions require review.": "Enyochala ịdị adị ndọtị achọrọ; ụdị dị iche iche chọrọ nyocha."
"Process identity comparison": "Ntụnyere njirimara usoro"
"Effective process identity is unavailable on this platform.": "Njirimara usoro dị irè adịghị na ikpo okwu a."
"Effective process identities match.": "Njirimara usoro dị irè dakọtara."
"Effective process identities differ; separate service accounts may be intentional.": "Njirimara usoro dị irè dị iche; akaụntụ ọrụ dị iche iche nwere ike ịbụ nke e zubere."
"Directory access comparison": "Ntụnyere ohere ndekọ faịlụ"
"Read-only directory permission observations match.": "Nchọpụta ikike ndekọ ọgụgụ naanị kwekọrọ."
"Directory locations or permission observations differ; review the service-account roles.": "Ebe ndekọ faịlụ ma ọ bụ nleba anya ikike dị iche; nyochaa ọrụ akaụntụ ọrụ."
"Worker directory read and traversal": "Ọgụgụ na ngafe ndekọ Worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Ndekọ onye ọrụ achọrọ ga-adịrịrị ma kwe ka ọgụgụ na ngafe. Enweghị ndedị a nwalere."
"The inherited worker secret matches the web secret for this private challenge.": "Nzuzo worker e ketara kwekọrọ na nzuzo weebụ maka ihe ịma aka nzuzo a."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Nyochaa onye ntụgharị okwu PHP ahaziri, ndọtị achọrọ, ihe nzuzo eketa na ikike ndekọ akaụntụ ọrụ. Emebeghị ndedị ma ọ bụ mmalite installer."
"advisory": "ndụmọdụ"
