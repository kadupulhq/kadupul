"Installation request was rejected.": "Ajụrụ arịrịọ nwụnye."
"Installation steps": "Nzọụkwụ nwụnye"
"Installed": "Ewụnyere"
"Keep a backup of the database, RRD files, configuration and secret material.": "Debe ndabere nke nchekwa data, faịlụ RRD, nhazi na ihe nzuzo."
"Language": "Asụsụ"
"Large tables may require the dedicated CLI conversion tool before installation.": "Tebụl buru ibu nwere ike ịchọ ngwaọrụ ntụgharị CLI raara onwe ya nye tupu nwụnye."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Hapụ ubi nzuzo ka ọ tọgbọrọ chakoo iji debe nzere echekwara. Anaghị egosipụta ihe nzuzo ọzọ."
