"A useful name for this Rule.": "Користан назив за ово правило."
"Access denied.": "Приступ одбијен."
"Add Tree Rule": "Додај правило за стабла"
"Back to Tree Rules": "Назад на правила за стабла"
"Cancel": "Откажи"
"Check this box to enable this rule.": "Означите ово поље да омогућите ово правило."
"Choose a Tree for the new Tree Items.": "Изаберите стабло за нове ставке стабла."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Изаберите заглавље изабраног стабла за закачивање, или његов корен. Уверите се да и даље постоји када се ово правило изврши."
"Choose a header of the selected Tree.": "Изаберите заглавље изабраног стабла."
"Choose a listed Graph Grouping Style.": "Изаберите понуђени стил груписања графикона."
"Choose a listed Leaf Item Type.": "Изаберите понуђени тип листа ставке."
"Choose an existing Tree.": "Изаберите постојеће стабло."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Изаберите како се графикони групишу када се цртају за овај конкретан хост у стаблу. Користи се за листове уређаја."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Кликните на Настави да обришете следећа правила за стабла заједно са њиховим критеријумима за избор објеката и креирање стабла."
"Click Continue to disable the following Tree Rules.": "Кликните на Настави да онемогућите следећа правила за стабла."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Кликните на Настави да дуплирате следећа правила за стабла. Опционо можете променити формат наслова за нова правила за стабла, која почињу онемогућена."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Кликните на Настави да омогућите следећа правила за стабла. Уверите се да су успешно тестирана."
"Continue": "Настави"
"Data Query Index": "Индекс упита података"
"Delete Tree Rules": "Обриши правила за стабла"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Исход брисања је неизвестан. Проверите листу правила за стабла пре понављања."
"Delete selected": "Обриши изабрано"
"Device": "Уређај"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Листови уређаја не могу користити критеријуме над колонама графикона или шаблона графикона. Када тип листа ставке мењате у Уређај, означите ово поље да уклоните те критеријуме; они се не могу повратити."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Листови уређаја не могу користити критеријуме засноване на графиконима. Потврдите уклањање %count% критеријума да бисте сачували."
"Disable Tree Rules": "Онемогући правила за стабла"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Исход онемогућавања је неизвестан. Проверите листу правила за стабла пре понављања."
"Disable selected": "Онемогући изабрано"
"Duplicate Tree Rules": "Дуплирај правила за стабла"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Исход дуплирања је неизвестан. Проверите листу правила за стабла пре понављања."
"Duplicate selected": "Дуплирај изабрано"
"Edit Tree Rule": "Измени правило за стабла"
"Enable Rule": "Омогући правило"
"Enable Tree Rules": "Омогући правила за стабла"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Исход омогућавања је неизвестан. Проверите листу правила за стабла пре понављања."
"Enable selected": "Омогући изабрано"
"Enter a name.": "Унесите назив."
"Enter a valid name format.": "Унесите исправан формат назива."
"Enter at most %count% characters.": "Унесите највише %count% знакова."
"Enter single-line text.": "Унесите текст у једном реду."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Сваки <rule_name> се замењује називом правила за стабла које се копира."
"Graph": "Графикон"
"Graph Grouping Style": "Стил груписања графикона"
"Graph Template": "Шаблон графикона"
"Invalid Tree Rule selection.": "Неисправан избор правила за стабла."
"Leaf Item Type": "Врста ставке листа"
"Name": "Назив"
"Object Selection and Tree Creation Criteria": "Критеријуми за избор објеката и креирање стабла"
"One or more selected Tree Rules no longer exist.": "Једно или више изабраних правила за стабла више не постоје."
"Optional: Sub-Tree Item": "Опционо: ставка подстабла"
"Remove graph-based criteria": "Уклони критеријуме засноване на графиконима"
"Save": "Сачувај"
"Save outcome is uncertain. Reload before retrying.": "Исход чувања је неизвестан. Поново учитајте пре понављања."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Прво сачувајте правило; његови критеријуми за избор објеката и креирање стабла додају се након тога."
"Select": "Изабери"
"Select %name%": "Изабери %name%"
"Select at least one Tree Rule.": "Изаберите најмање једно правило за стабла."
"Select at most 100 Tree Rules at a time.": "Изаберите највише 100 правила за стабла одједном."
"Select up to %count% rows at a time.": "Изаберите до %count% редова одједном."
"The Item Type that shall be dynamically added to the tree.": "Тип ставке који ће се динамички додавати у стабло."
"The name format must give every copy a name of 1 to 255 characters.": "Формат назива мора свакој копији дати назив од 1 до 255 знакова."
"The tree rule changed since you opened this form. Reload before saving.": "Правило за стабла је промењено откако сте отворили овај образац. Поново учитајте пре чувања."
"Title Format": "Формат наслова"
"Tree": "Стабло"
"Tree Rule Selection [edit: %name%]": "Избор правила за стабла [измена: %name%]"
"Tree Rules Selection [new]": "Избор правила за стабла [ново]"
"Tree rule not found.": "Правило за стабла није пронађено."
"Tree rule saved.": "Правило за стабла је сачувано."
