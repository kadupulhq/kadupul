"The SNMP entry order changed since you opened this page. Reload before moving.": "ਇਹ ਪੰਨਾ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ SNMP ਇੰਦਰਾਜ਼ ਕ੍ਰਮ ਬਦਲ ਗਿਆ ਹੈ। ਲਿਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The automation template changed since you opened this form. Reload before saving.": "ਇਹ ਫ਼ਾਰਮ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ ਆਟੋਮੇਸ਼ਨ ਟੈਮਪਲੇਟ ਬਦਲ ਗਿਆ ਹੈ। ਸੰਭਾਲਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The automation template order changed since you opened this page. Reload before moving.": "ਇਹ ਪੰਨਾ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ ਆਟੋਮੇਸ਼ਨ ਟੈਮਪਲੇਟ ਕ੍ਰਮ ਬਦਲ ਗਿਆ ਹੈ। ਲਿਜਾਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "ਹਾਰ ਮੰਨਣ ਤੋਂ ਪਹਿਲਾਂ SNMP ਰੀਡਸਟ੍ਰਿੰਗ ਰਾਹੀਂ ਡਿਵਾਈਸ ਤੱਕ ਪਹੁੰਚਣ ਦੀਆਂ ਵੱਧ ਤੋਂ ਵੱਧ ਕੋਸ਼ਿਸ਼ਾਂ।"
"The maximum number of milliseconds Kadupul will wait for an SNMP response (does not work with php-snmp support).": "Kadupul SNMP ਜਵਾਬ ਲਈ ਵੱਧ ਤੋਂ ਵੱਧ ਜਿੰਨੇ ਮਿਲੀਸਕਿੰਟ ਉਡੀਕ ਕਰੇਗਾ (php-snmp ਸਹਾਇਤਾ ਨਾਲ ਕੰਮ ਨਹੀਂ ਕਰਦਾ)।"
"The name can be at most 100 characters.": "ਨਾਮ ਵੱਧ ਤੋਂ ਵੱਧ 100 ਅੱਖਰਾਂ ਦਾ ਹੋ ਸਕਦਾ ਹੈ।"
"The name format must give every copy a name of 1 to 100 characters.": "ਨਾਮ ਫ਼ਾਰਮੈਟ ਨੂੰ ਹਰੇਕ ਨਕਲ ਨੂੰ 1 ਤੋਂ 100 ਅੱਖਰਾਂ ਦਾ ਨਾਮ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ।"
"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "ਇਸ SNMP ਵਿਕਲਪ ਸੈੱਟ ਫ਼ਾਰਮ ਦੀ ਮਿਆਦ ਪੁੱਗ ਗਈ ਹੈ। SNMP ਵਿਕਲਪ ਸੈੱਟ ਦੁਬਾਰਾ ਖੋਲ੍ਹੋ ਅਤੇ ਇਸਦਾ ਮੌਜੂਦਾ ਫ਼ਾਰਮ ਵਰਤੋ।"
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ਇਹ ਇੱਕ ਵਿਲੱਖਣ ਸਟ੍ਰਿੰਗ ਹੈ ਜਿਸਦਾ ਮੇਲ ਡਿਵਾਈਸ ਦੀ sysDescr ਸਟ੍ਰਿੰਗ ਨਾਲ ਕੀਤਾ ਜਾਵੇਗਾ ਤਾਂ ਜੋ ਇਸਨੂੰ ਇਸ ਆਟੋਮੇਸ਼ਨ ਟੈਮਪਲੇਟ ਨਾਲ ਜੋੜਿਆ ਜਾ ਸਕੇ। ਕਿਸੇ ਵੀ SQL Where ਐਕਸਪ੍ਰੈਸ਼ਨ ਤੋਂ ਇਲਾਵਾ ਕੋਈ ਵੀ Perl ਰੈਗੂਲਰ ਐਕਸਪ੍ਰੈਸ਼ਨ ਵਰਤੀ ਜਾ ਸਕਦੀ ਹੈ।"
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ਇਹ ਇੱਕ ਵਿਲੱਖਣ ਸਟ੍ਰਿੰਗ ਹੈ ਜਿਸਦਾ ਮੇਲ ਡਿਵਾਈਸ ਦੀ sysName ਸਟ੍ਰਿੰਗ ਨਾਲ ਕੀਤਾ ਜਾਵੇਗਾ ਤਾਂ ਜੋ ਇਸਨੂੰ ਇਸ ਆਟੋਮੇਸ਼ਨ ਟੈਮਪਲੇਟ ਨਾਲ ਜੋੜਿਆ ਜਾ ਸਕੇ। ਕਿਸੇ ਵੀ SQL Where ਐਕਸਪ੍ਰੈਸ਼ਨ ਤੋਂ ਇਲਾਵਾ ਕੋਈ ਵੀ Perl ਰੈਗੂਲਰ ਐਕਸਪ੍ਰੈਸ਼ਨ ਵਰਤੀ ਜਾ ਸਕਦੀ ਹੈ।"
