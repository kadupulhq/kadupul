"This legacy automation template form has expired. Open Device Rules and submit a new form.": "ਇਸ ਪੁਰਾਣੇ ਆਟੋਮੇਸ਼ਨ ਟੈਮਪਲੇਟ ਫ਼ਾਰਮ ਦੀ ਮਿਆਦ ਪੁੱਗ ਗਈ ਹੈ। ਡਿਵਾਈਸ ਨਿਯਮ ਖੋਲ੍ਹੋ ਅਤੇ ਨਵਾਂ ਫ਼ਾਰਮ ਜਮ੍ਹਾਂ ਕਰੋ।"
