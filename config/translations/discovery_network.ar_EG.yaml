"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "قائمة مفصولة بمسافات لسيرفرات DNS البديلة لاستخدامها في تحليل أسماء DNS. إذا تُركت فارغة، سيُستخدم نظام تشغيل المستطلع لتحليل أسماء DNS."
"Access denied.": "تم رفض الوصول."
"Add Discovery Network": "إضافة شبكة اكتشاف"
"After an initial failure, the number of ping retries to attempt before failing.": "بعد الفشل الأولي، عدد محاولات إعادة ping قبل تسجيل الفشل."
"After the selected Run Limit, the discovery process will be terminated.": "بعد انتهاء حد التشغيل المحدد، سيتم إنهاء عملية الاكتشاف."
"Allow same sysName on different hosts": "السماح بنفس sysName على مضيفين مختلفين"
"Alternate DNS Servers": "سيرفرات DNS البديلة"
"April": "أبريل"
"Associated Site": "الموقع المرتبط"
"August": "أغسطس"
"Automatically Add Devices": "إضافة الأجهزة تلقائياً"
"Back to Networks": "العودة إلى الشبكات"
"Choose an existing Data Collector.": "اختر مجمّع بيانات موجوداً."
"Choose an existing SNMP Option Set.": "اختر مجموعة خيارات SNMP موجودة."
"Choose an existing Site.": "اختر موقعاً موجوداً."
"Choose one of the listed values.": "اختر إحدى القيم المدرجة."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "اختر مجمّع البيانات/المستطلع المطلوب استخدامه لجمع البيانات من هذا الجهاز."
"Choose the Site that you wish to associate discovered Devices with.": "اختر الموقع الذي ترغب في ربط الأجهزة المكتشفة به."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "تستخدم الجداول اليومية والأسبوعية وقت البدء وخيار إعادة التشغيل كل؛ وتستخدم الأسبوعية أيضاً أيام الأسبوع. وتستخدم الشهرية الأشهر وأيام الشهر؛ بينما تستخدم الجدولة الشهرية في يوم محدد الأشهر وأسابيع الشهر وأيام الأسبوع."
"Daily": "يومي"
"Data Collector": "جامع البيانات"
"Day(s) of Week": "يوم (أيام) الأسبوع"
"Days of Month": "أيام الشهر"
"Days of Week": "أيام الأسبوع"
"December": "ديسمبر"
"Define the collection frequency.": "حدد معدل تكرار الجمع."
"Define the number of threads to use for discovering this Network Range.": "حدد عدد خيوط المعالجة المطلوب استخدامها لاكتشاف نطاق الشبكة هذا."
"Discovery Threads": "خيوط معالجة الاكتشاف"
"Discovery Timing": "توقيت الاكتشاف"
"Discovery network not found.": "لم يتم العثور على شبكة الاكتشاف."
"Discovery network saved.": "تم حفظ شبكة الاكتشاف."
"Edit Discovery Network": "تعديل شبكة الاكتشاف"
"Enable NetBIOS": "تفعيل NetBIOS"
"Enable this Network Range.": "تفعيل نطاق الشبكة هذا."
"Enabled": "مفعل"
"Enter DNS servers as IP addresses or host names separated by spaces.": "أدخل سيرفرات DNS كعناوين IP أو أسماء مضيفين مفصولة بمسافات."
"Enter IPs or FQDNs of DNS Servers": "أدخل عناوين IP أو أسماء FQDN لسيرفرات DNS"
"Enter a name.": "أدخل اسماً."
"Enter a valid email address.": "أدخل عنوان بريد إلكتروني صحيحاً."
"Enter a whole number from %min% to %max%.": "أدخل عدداً صحيحاً من %min% إلى %max%."
"Enter at most %count% bytes.": "أدخل %count% بايت بحد أقصى."
"Enter single-line text.": "أدخل نصًا من سطر واحد."
"Enter the start as YYYY-MM-DD HH:MM.": "أدخل وقت البدء بصيغة YYYY-MM-DD HH:MM."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "أدخل نطاقات شبكات صالحة مفصولة بفواصل. يمكنك استخدام عنوان IP، أو نطاق شبكة مثل 192.168.1.0/24 أو 192.168.1.0/255.255.255.0، أو صيغة البدل مثل 192.168.*.*."
"Enter valid network ranges separated by commas.": "أدخل نطاقات شبكات صالحة مفصولة بفواصل."
"February": "فبراير"
"First": "الأول"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "بالنسبة لأي أجهزة مكتشفة حديثاً يمكن الوصول إليها عبر SNMP وتطابق قاعدة جهاز، أضفها كأجهزة."
"Friday": "الجمعة"
"General Settings": "الإعدادات العامة"
"Give this Network a meaningful name.": "أعطِ هذه الشبكة اسماً واضحاً ذا دلالة."
"ICMP Ping": "ICMP Ping"
"If a device previously added is found, rerun its data queries.": "إذا تم العثور على جهاز مضاف مسبقاً، أعد تشغيل استعلامات البيانات الخاصة به."
"If checked, when the Automation Network is scanned, a report will be sent to the Notification Email account.": "عند تحديد هذا الخيار، سيتم إرسال تقرير إلى حساب البريد الإلكتروني للإشعارات عند فحص شبكة الأتمتة."
