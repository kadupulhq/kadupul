"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "عنوان البريد الإلكتروني المستخدم كعنوان المُرسل لبريد الإشعارات. إذا تُرك فارغاً، يُستخدم عنوان بريد إشعارات الأتمتة الافتراضي."
"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "اسم حساب البريد الإلكتروني المستخدم كاسم المُرسل لبريد الإشعارات. إذا تُرك فارغاً، يُستخدم اسم إشعارات الأتمتة الافتراضي."
"The Email account to be used to send the Notification Email to.": "حساب البريد الإلكتروني المطلوب إرسال بريد الإشعارات إليه."
"The discovery network changed since you opened this form. Reload before saving.": "تغيّرت بيانات شبكة الاكتشاف منذ فتح هذا النموذج. أعد التحميل قبل الحفظ."
"The discovery network form is incomplete.": "نموذج شبكة الاكتشاف غير مكتمل."
"The ranges cover more than %count% addresses.": "تغطي النطاقات أكثر من %count% عنوان."
"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "قيمة المهلة المستخدمة لفحص ping عبر ICMP وUDP للمضيف. وتنطبق قيمة مهلة SNMP الخاصة بالمضيف على فحوصات SNMP ping."
"The type of ping packet to send.": "نوع حزمة ping المطلوب إرسالها."
