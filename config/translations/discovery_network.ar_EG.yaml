"Unexpected fields were submitted.": "تم إرسال حقول غير متوقعة."
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "استخدم NetBIOS لمحاولة تحديد اسم المضيف للأجهزة النشطة."
"Wednesday": "الأربعاء"
"Week(s) of Month": "أسبوع (أسابيع) الشهر"
"Weekly": "أسبوعي"
"What Day(s) of the Month will this Network Range be discovered?": "في أي يوم (أيام) من الشهر سيتم اكتشاف نطاق الشبكة هذا؟"
"What Day(s) of the week will this Network Range be discovered?": "في أي يوم (أيام) من الأسبوع سيتم اكتشاف نطاق الشبكة هذا؟"
"What Month(s) of the Year will this Network Range be discovered?": "في أي شهر (أشهر) من السنة سيتم اكتشاف نطاق الشبكة هذا؟"
"What Week(s) of the Month will this Network Range be discovered?": "في أي أسبوع (أسابيع) من الشهر سيتم اكتشاف نطاق الشبكة هذا؟"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "في أي وقت سيبدأ عنصر اكتشاف الشبكة هذا؟ أدخله بصيغة YYYY-MM-DD HH:MM."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "عند اكتشاف الأجهزة، السماح بإضافة أسماء sysnames مكررة على مضيفين مختلفين"
"You must specify both the Months and Days of Month.": "يجب تحديد كل من الأشهر وأيام الشهر."
"You must specify the Months, Weeks of Month, and Days of Week.": "يجب تحديد الأشهر وأسابيع الشهر وأيام الأسبوع."
"You must specify the day of the week.": "يجب تحديد يوم الأسبوع."
