"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "Platnost tohoto formuláře sady voleb SNMP vypršela. Otevřete sadu voleb SNMP znovu a použijte její aktuální formulář."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Jedinečný řetězec, který bude porovnán s řetězcem sysDescr zařízení a přiřadí zařízení k této šabloně automatizace.  Kromě libovolného výrazu SQL Where lze použít jakýkoli regulární výraz Perl."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Jedinečný řetězec, který bude porovnán s řetězcem sysName zařízení a přiřadí zařízení k této šabloně automatizace.  Kromě libovolného výrazu SQL Where lze použít jakýkoli regulární výraz Perl."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Jedinečný řetězec, který bude porovnán s řetězcem sysOid zařízení a přiřadí zařízení k této šabloně automatizace.  Kromě libovolného výrazu SQL Where lze použít jakýkoli regulární výraz Perl."
