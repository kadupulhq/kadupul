"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "Maximální počet pokusů o spojení se zařízením pomocí čtecího řetězce SNMP, než se pokus vzdá."
"The maximum number of milliseconds Kadupul will wait for an SNMP response (does not work with php-snmp support).": "Maximální počet milisekund, po které bude Kadupul čekat na odpověď SNMP (nefunguje s podporou php-snmp)."
"The name can be at most 100 characters.": "Název může mít nejvýše 100 znaků."
