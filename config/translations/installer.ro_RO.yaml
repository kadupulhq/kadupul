"Action": "Acțiune"
"Advanced options": "Opțiuni avansate"
"Applying database upgrades": "Se aplică actualizările bazei de date"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Faceți o copie de rezervă a bazei de date, a fișierelor RRD, a configurației și a cheilor. Actualizările bazei de date pot confirma modificări pe care revenirea aplicației nu le poate anula."
"Blocked": "Blocat"
"Check": "Verifică"
"Check again": "Verifică din nou"
"Check collection freshness and collector connectivity before enabling discovery.": "Verificați prospețimea colectării și conectivitatea colectoarelor înainte de a activa descoperirea."
"Check requirements": "Verifică cerințele"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Verificările inspectează acest proces și permisiunile sistemului de fișiere. Ele nu scriu fișiere de test și nu contactează dispozitive."
