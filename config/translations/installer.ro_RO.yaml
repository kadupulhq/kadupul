"Collector": "Colector"
"Configure": "Configurează"
"Configuring collection profiles": "Se configurează profilurile de colectare"
"Configuring discovery": "Se configurează descoperirea"
"Configuring the local device": "Se configurează dispozitivul local"
"Confirming database version": "Se confirmă versiunea bazei de date"
"Converting selected tables": "Se convertesc tabelele selectate"
"Database version": "Versiunea bazei de date"
"Disabled": "Dezactivat"
"Discovery": "Descoperire"
"Discovery SNMP settings": "Setări SNMP pentru descoperire"
"Discovery range": "Interval de descoperire"
"Enable discovery after installation": "Activează descoperirea după instalare"
"Executable paths": "Căi ale executabilelor"
"Execution status": "Stare de execuție"
"Finished execution": "Execuție finalizată"
"Finishing tasks only. Schema migrations will not be replayed.": "Doar sarcinile de finalizare. Migrările de schemă nu vor fi reluate."
"I accept the license terms": "Accept termenii licenței"
"I authorize discovery of the displayed range": "Autorizez descoperirea intervalului afișat"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Am verificat jurnalul și am confirmat că worker-ul anterior și procesele sale copil s-au oprit"
"I checked the previous attempt and accept that some changes may already be committed": "Am verificat încercarea anterioară și accept că unele modificări pot fi deja confirmate"
"I reviewed this plan and have the required backups": "Am verificat acest plan și am copiile de rezervă necesare"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Dacă un worker se oprește neașteptat, păstrați log/cacti.log și confirmați că procesul său s-a încheiat înainte de a reîncerca explicit. O stare de așteptare nu confirmă o pornire reușită."
"Importing templates": "Se importă șabloanele"
"Install Kadupul": "Instalează Kadupul"
"Installation and upgrade": "Instalare și actualizare"
"Installation request was rejected.": "Cererea de instalare a fost respinsă."
"Installation steps": "Pașii de instalare"
"Installed": "Instalat"
"Keep a backup of the database, RRD files, configuration and secret material.": "Păstrați o copie de rezervă a bazei de date, a fișierelor RRD, a configurației și a materialului secret."
"Language": "Limbă"
"Large tables may require the dedicated CLI conversion tool before installation.": "Tabelele mari pot necesita instrumentul CLI dedicat de conversie înainte de instalare."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Lăsați câmpurile secrete goale pentru a păstra acreditările stocate. Secretele nu sunt afișate niciodată din nou."
"License": "Licență"
"No action needed": "Nu este necesară nicio acțiune"
"Observed": "Observat"
"Open the console": "Deschide consola"
"Operation": "Operație"
"Override discovery SNMP settings": "Înlocuiește setările SNMP pentru descoperire"
"Pass": "Reușit"
"Poller interval in seconds": "Intervalul poller-ului în secunde"
"Preparing CSRF protection": "Se pregătește protecția CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Progresul arată ultima fază înregistrată. Reîmprospătarea acestei pagini nu pornește și nu reîncearcă niciodată un worker."
"Recover stopped attempt": "Recuperează încercarea oprită"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Recuperarea păstrează selecțiile salvate și nu oprește niciodată un worker activ. Verificați din nou planul înainte de a reîncerca."
"Review": "Verificare"
"Review installation plan": "Verifică planul de instalare"
"Run": "Rulează"
"Run reviewed plan": "Rulează planul verificat"
"Save and review": "Salvează și verifică"
"Scope": "Domeniu"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Starea nu este disponibilă. Munca salvată este păstrată. Reîmprospătați pentru a vă reconecta; nu trimiteți o altă instalare."
"Synchronizing collectors": "Se sincronizează colectoarele"
"Table conversions": "Conversii de tabele"
"Templates": "Șabloane"
"The database version matches this application. Installation does not establish that polling is healthy.": "Versiunea bazei de date corespunde acestei aplicații. Instalarea nu stabilește că interogarea funcționează corect."
"The request outcome is unknown. Check execution status before retrying.": "Rezultatul cererii este necunoscut. Verificați starea de execuție înainte de a reîncerca."
"Theme": "Temă"
"Verify": "Verifică"
"Verify the poller schedule and service account.": "Verificați programarea poller-ului și contul de serviciu."
"Version change": "Schimbarea versiunii"
"Waiting for the installation worker": "Se așteaptă worker-ul de instalare"
"collector": "colector"
"complete": "finalizat"
"failed": "eșuat"
"finish": "finalizare"
"install": "instalare"
"not_started": "neînceput"
"partial": "parțial"
"running": "în execuție"
"succeeded": "reușit"
"upgrade": "actualizare"
"waiting": "în așteptare"
"Accept the license before saving the installation plan.": "Acceptați licența înainte de a salva planul de instalare."
"Invalid installation form.": "Formular de instalare nevalid."
"Access denied.": "Acces refuzat."
"Confirm the recovery warning before retrying.": "Confirmați avertismentul de recuperare înainte de a reîncerca."
"Review and confirm the current installation plan.": "Verificați și confirmați planul curent de instalare."
"Confirm the discovery scope before starting.": "Confirmați domeniul descoperirii înainte de a începe."
"Resolve the blocking checks before starting.": "Rezolvați verificările care blochează înainte de a începe."
"Too many installer options.": "Prea multe opțiuni de instalare."
"Invalid installer option name.": "Nume de opțiune de instalare nevalid."
"Unknown or malformed installer option.": "Opțiune de instalare necunoscută sau malformată."
"Installer options must be scalar values.": "Opțiunile de instalare trebuie să fie valori scalare."
"Installer option is too long or contains a null byte.": "Opțiunea de instalare este prea lungă sau conține un octet nul."
"Installer IDs and intervals must be whole numbers.": "ID-urile și intervalele de instalare trebuie să fie numere întregi."
"Installer ID or interval is outside its supported range.": "ID-ul sau intervalul de instalare se află în afara domeniului acceptat."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Instalarea nu a putut continua. Reîncărcați starea și verificați controalele care blochează înainte de a reîncerca."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirmați că worker-ul anterior s-a oprit înainte de a-i recupera planul."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Baza de date este instalată, dar unele colectoare necesită încă sincronizare. Reîncercați sarcinile de finalizare după verificarea stării lor."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Instalarea s-a oprit. Păstrați jurnalul instalatorului, corectați cauza și confirmați explicit o reîncercare. Unele modificări ale bazei de date pot fi deja confirmate. Verificați curățarea pluginurilor înainte de a autoriza o reîncercare."

"Next action": "Următoarea acțiune"
"Follow the execution status. Do not start another attempt while a worker is active.": "Urmăriți starea de execuție. Nu porniți o altă încercare cât timp un worker este activ."
"Complete the recovery checklist before retrying.": "Parcurgeți lista de verificare a recuperării înainte de a reîncerca."
"Verify collection and graph operation before enabling discovery.": "Verificați colectarea și funcționarea graficelor înainte de a activa descoperirea."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Rezolvați cerințele blocate, apoi verificați din nou. Selecțiile salvate sunt păstrate."
"Review the planned changes and backup checklist before authorizing execution.": "Verificați modificările planificate și lista de verificare a copiilor de rezervă înainte de a autoriza execuția."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Alegeți un profil de colectare și acceptați licența. Setările opționale pot fi deschise la nevoie."
"Download installation diagnostics": "Descarcă diagnosticarea instalării"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Deschideți un grafic și confirmați că datele sale RRD se actualizează după un ciclu al poller-ului."
"Requirement details": "Detalii despre cerințe"
"Recover": "Recuperează"
"Recovery checklist": "Lista de verificare a recuperării"
"Preserve log/cacti.log and record the failed attempt.": "Păstrați log/cacti.log și înregistrați încercarea eșuată."
"Confirm that the previous worker and its child processes have stopped.": "Confirmați că worker-ul anterior și procesele sale copil s-au oprit."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspectați modificările confirmate, sincronizarea colectoarelor și curățarea pluginurilor. Corectați cauza înainte de a reîncerca."
"Review the saved plan again, then explicitly authorize a retry.": "Verificați din nou planul salvat, apoi autorizați explicit o reîncercare."
"Recover a stopped worker": "Recuperează un worker oprit"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Folosiți recuperarea doar după ce confirmați că această încercare nu mai rulează. Recuperarea nu oprește un proces."
"Collector and installation mode": "Colector și mod de instalare"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Configurația implementării determină rolul colectorului și conexiunile la baza de date. Verificați configurația serverului principal înainte de a porni un colector."
"Discovery and SNMP settings": "Setări de descoperire și SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Păstrați descoperirea dezactivată până când colectarea și conectivitatea colectoarelor au fost verificate."
"Template selection": "Selecția șabloanelor"
"Templates selected for import": "Șabloane selectate pentru import"
"No templates selected.": "Niciun șablon selectat."
"Backup checklist": "Lista de verificare a copiilor de rezervă"
"Database backup and a tested restoration procedure.": "Copie de rezervă a bazei de date și o procedură de restaurare testată."
"RRD files and the service account permissions needed to restore them.": "Fișierele RRD și permisiunile contului de serviciu necesare pentru restaurarea lor."
"Configuration, keys and plugin data outside the database.": "Configurația, cheile și datele pluginurilor din afara bazei de date."
"Post-installation checks": "Verificări după instalare"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Verificările confirmate acoperă doar dovezile afișate. Verificările neevaluate necesită în continuare verificarea de către operator."
"Operational checks still require operator verification.": "Verificările operaționale necesită în continuare verificarea de către operator."
"Status": "Stare"
"verified": "Verificat"
"action_required": "Acțiune necesară"
"not_assessed": "Neevaluat"

"Database schema": "Schema bazei de date"
"Stored schema matches the application target.": "Schema stocată corespunde țintei aplicației."
"Target schema completion has not been confirmed.": "Finalizarea schemei țintă nu a fost confirmată."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Verificați rezultatul instalării și rezolvați erorile înainte de a considera actualizarea schemei finalizată."
"Installation outcome": "Rezultatul instalării"
"A successful receipt matches the current target schema.": "O chitanță reușită corespunde schemei țintă curente."
"A complete successful installation outcome has not been confirmed.": "Un rezultat complet reușit al instalării nu a fost confirmat."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Păstrați jurnalul instalatorului și folosiți procedura explicită de recuperare sau de reîncercare când este necesar."
"Collector synchronization": "Sincronizarea colectoarelor"
"The completed installer reports pending collector synchronization.": "Instalatorul finalizat raportează sincronizare de colectoare în așteptare."
"The completed installer reports no pending collectors.": "Instalatorul finalizat nu raportează niciun colector în așteptare."
"Collector completion remains unconfirmed by this partial receipt.": "Finalizarea colectoarelor rămâne neconfirmată de această chitanță parțială."
"Collector completion is not established by this installation outcome.": "Finalizarea colectoarelor nu este stabilită de acest rezultat al instalării."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Verificați starea colectoarelor și reîncercați sarcinile de finalizare pentru rezultate parțiale. Aceasta nu verifică prospețimea colectării ulterioare."
"Scheduled collection": "Colectare programată"
"No poller or device was contacted by this assessment.": "Această evaluare nu a contactat niciun poller sau dispozitiv."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Confirmați că planificatorul configurat rulează poller-ul cu contul de serviciu dorit și verificați următorul său ciclu normal."
"Graph data": "Date grafice"
"Live samples and RRD updates were not exercised.": "Eșantioanele în direct și actualizările RRD nu au fost exersate."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "După un ciclu normal de colectare, confirmați că graficele așteptate primesc eșantioane noi și verificați erorile poller-ului."
"Recovery readiness": "Pregătirea pentru recuperare"
"Backup restoration was not exercised.": "Restaurarea din copia de rezervă nu a fost exersată."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verificați o restaurare izolată a bazei de date, a fișierelor RRD, a configurației și a materialului de chei înainte de a vă baza pe recuperare."
"No persisted local poller start has been recorded.": "Nu a fost înregistrată nicio pornire locală persistentă a poller-ului."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Temporizarea persistentă a poller-ului este nevalidă și nu poate stabili starea planificatorului."
"The recorded poller start is in the future. Check clock synchronization.": "Pornirea înregistrată a poller-ului este în viitor. Verificați sincronizarea ceasului."
"The recorded poller start is older than the native scheduling tolerance.": "Pornirea înregistrată a poller-ului este mai veche decât toleranța nativă de planificare."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "O pornire locală a poller-ului a fost înregistrată în limita toleranței native de planificare. Finalizarea și starea dispozitivelor nu sunt verificate."

"readable": "lizibil"
"missing or unreadable": "lipsă sau ilizibil"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaurați versiunea completă și dependențele ei blocate; acordați contului de serviciu acces de citire."
"PHP temporary directory": "Director temporar PHP"
"directory writable by this process": "director în care acest proces poate scrie"
"missing or not writable": "lipsă sau fără drept de scriere"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configurați sys_temp_dir ca director existent în care contul de instalare poate scrie. Importurile native folosesc fișiere temporare."
"Background worker launch": "Pornirea worker-ului de fundal"
"required PHP functions available; launch not exercised": "funcțiile PHP necesare sunt disponibile; pornirea nu a fost exersată"
"required PHP launch function disabled": "funcția PHP de pornire necesară este dezactivată"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Activați exec pentru runtime-ul PHP web sau folosiți instalatorul CLI autorizat."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Activați popen, pclose pentru runtime-ul PHP web sau folosiți instalatorul CLI autorizat."
"Database transaction ownership": "Proprietatea tranzacțiilor bazei de date"
"autocommit enabled; no caller-owned transaction": "autocommit activat; nicio tranzacție deținută de apelant"
"autocommit disabled or caller transaction active": "autocommit dezactivat sau tranzacție a apelantului activă"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Rulați instalarea în afara unei tranzacții deținute de apelant și activați autocommit pe conexiunea sa de modificare."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaurați directorul versiunii și acordați contului de instalare drept de scriere pentru importurile de resurse ale șabloanelor. Nu îl faceți inscriptibil pentru toată lumea."
"Worker file: install/background.php": "Fișier worker: install/background.php"
"Worker file: bin/legacy-installer.php": "Fișier worker: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fișier worker: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destinație import: resource/snmp_queries"
"Import destination: resource/script_server": "Destinație import: resource/script_server"
"Import destination: resource/script_queries": "Destinație import: resource/script_queries"
"Import destination: scripts": "Destinație import: scripts"

"Database privileges": "Privilegii ale bazei de date"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Privilegiile efective de migrare, inclusiv rolurile active și drepturile specifice obiectelor, nu au fost verificate."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Cereți administratorului bazei de date să verifice scrierile în tabele, modificările de schemă, trigger-ele și rutinele necesare pentru contul de instalare și schemă. Nu acordați privilegii globale de administrator."

"Compare web and worker runtimes": "Compară runtime-urile web și worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Aceasta pornește explicit o scurtă sondă PHP numai pentru citire. Nu rezervă un instalator, nu scrie fișiere și nu contactează dispozitive."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Sonda moștenește acest proces web și folosește interpretorul PHP configurat pentru instalator. Nu inspectează un planificator sau un serviciu separat."
"I authorize the read-only worker runtime comparison.": "Autorizez compararea numai pentru citire a runtime-ului worker-ului."
"Compare runtimes": "Compară runtime-urile"
"Runtime comparison results": "Rezultatele comparării runtime-urilor"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Diferențele de permisiuni și de identitate pot fi intenționate. Observațiile numai pentru citire nu dovedesc că scrierile sau instalarea vor reuși."
"Confirm the read-only worker runtime comparison.": "Confirmați compararea numai pentru citire a runtime-ului worker-ului."
"The runtime comparison is unavailable.": "Compararea runtime-urilor nu este disponibilă."
"Shared application secret": "Secret partajat al aplicației"
"A strong web application secret is required before comparison.": "Este necesar un secret puternic al aplicației web înainte de comparare."
"Runtime comparison": "Compararea runtime-urilor"
"The configured worker runtime did not confirm a bounded comparison.": "Runtime-ul configurat al worker-ului nu a confirmat o comparare limitată."
"The inherited worker secret could not be confirmed against the web secret.": "Secretul moștenit al worker-ului nu a putut fi confirmat față de secretul web."
"PHP runtime comparison": "Compararea runtime-urilor PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Ambele runtime-uri trebuie să accepte PHP 8.4; versiunile de corecție diferite necesită verificare."
"Required extension comparison": "Compararea extensiilor necesare"
"Required extension availability is checked; differing versions require review.": "Disponibilitatea extensiilor necesare este verificată; versiunile diferite necesită verificare."
"Process identity comparison": "Compararea identității proceselor"
"Effective process identity is unavailable on this platform.": "Identitatea efectivă a procesului nu este disponibilă pe această platformă."
"Effective process identities match.": "Identitățile efective ale proceselor se potrivesc."
"Effective process identities differ; separate service accounts may be intentional.": "Identitățile efective ale proceselor diferă; conturile de serviciu separate pot fi intenționate."
"Directory access comparison": "Compararea accesului la directoare"
"Read-only directory permission observations match.": "Observațiile numai pentru citire privind permisiunile directoarelor se potrivesc."
"Directory locations or permission observations differ; review the service-account roles.": "Locațiile directoarelor sau observațiile privind permisiunile diferă; verificați rolurile conturilor de serviciu."
"Worker directory read and traversal": "Citirea și parcurgerea directoarelor worker-ului"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Directoarele necesare worker-ului trebuie să existe și să permită citirea și parcurgerea. Nu a fost testată nicio scriere."
"The inherited worker secret matches the web secret for this private challenge.": "Secretul moștenit al worker-ului se potrivește cu secretul web pentru această provocare privată."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Verificați interpretorul PHP configurat, extensiile necesare, secretul moștenit și permisiunile directoarelor conturilor de serviciu. Nu au fost exersate scrieri sau pornirea instalatorului."
"advisory": "consultativ"
