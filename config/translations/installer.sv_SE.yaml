"Applying database upgrades": "Tillämpar databasuppgraderingar"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Säkerhetskopiera databasen, RRD-filer, konfiguration och nycklar. Databasuppgraderingar kan genomföra ändringar som en applikationsåterställning inte kan ångra."
