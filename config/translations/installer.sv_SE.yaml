"Check collection freshness and collector connectivity before enabling discovery.": "Kontrollera insamlingsaktualitet och insamlaranslutning innan du aktiverar identifiering."
"Check requirements": "Kontrollera krav"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Kontrollerna inspekterar denna process och filsystemets behörigheter. De skriver inga testfiler och kontaktar inga enheter."
