"waiting": "väntar"
"Accept the license before saving the installation plan.": "Acceptera licensen innan du sparar installationsplanen."
"Invalid installation form.": "Ogiltigt installationsformulär."
"Access denied.": "Åtkomst nekad."
"Confirm the recovery warning before retrying.": "Bekräfta återställningsvarningen innan du försöker igen."
"Review and confirm the current installation plan.": "Granska och bekräfta den aktuella installationsplanen."
"Confirm the discovery scope before starting.": "Bekräfta identifieringens omfattning innan du startar."
"Resolve the blocking checks before starting.": "Åtgärda de blockerande kontrollerna innan du startar."
"Too many installer options.": "För många installationsalternativ."
"Invalid installer option name.": "Ogiltigt namn på installationsalternativ."
"Unknown or malformed installer option.": "Okänt eller felaktigt utformat installationsalternativ."
"Installer options must be scalar values.": "Installationsalternativ måste vara skalära värden."
"Installer option is too long or contains a null byte.": "Installationsalternativet är för långt eller innehåller en nollbyte."
"Installer IDs and intervals must be whole numbers.": "Installations-ID:n och intervall måste vara heltal."
"Installer ID or interval is outside its supported range.": "Installations-ID eller intervall ligger utanför det tillåtna intervallet."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Installationen kunde inte fortsätta. Ladda om dess status och granska de blockerande kontrollerna innan du försöker igen."
"Confirm that the previous worker has stopped before recovering its plan.": "Bekräfta att föregående arbetsprocess har avslutats innan du återställer dess plan."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Databasen är installerad, men vissa insamlare behöver fortfarande synkroniseras. Försök köra de slutförande uppgifterna igen efter att ha kontrollerat deras status."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installationen stoppades. Spara installationsloggen, åtgärda orsaken och bekräfta uttryckligen ett nytt försök. Vissa databasändringar kan redan ha verkställts. Kontrollera tilläggsupprensning innan du godkänner ett nytt försök."
"Next action": "Nästa åtgärd"
"Follow the execution status. Do not start another attempt while a worker is active.": "Följ körningsstatusen. Starta inte ett nytt försök medan en arbetsprocess är aktiv."
"Complete the recovery checklist before retrying.": "Slutför återställningschecklistan innan du försöker igen."
"Verify collection and graph operation before enabling discovery.": "Verifiera insamling och graffunktion innan du aktiverar identifiering."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Åtgärda de blockerade kraven och kontrollera sedan igen. Sparade val behålls."
"Review the planned changes and backup checklist before authorizing execution.": "Granska planerade ändringar och checklista för säkerhetskopiering innan du godkänner körning."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Välj en insamlingsprofil och acceptera licensen. Valfria inställningar kan öppnas vid behov."
"Download installation diagnostics": "Ladda ner installationsdiagnostik"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Öppna en graf och bekräfta att dess RRD-data uppdateras efter en pollercykel."
"Requirement details": "Kravdetaljer"
"Recover": "Återställ"
"Recovery checklist": "Checklista för återställning"
"Preserve log/cacti.log and record the failed attempt.": "Spara log/cacti.log och dokumentera det misslyckade försöket."
"Confirm that the previous worker and its child processes have stopped.": "Bekräfta att föregående arbetsprocess och dess underprocesser har avslutats."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Granska verkställda ändringar, insamlarsynkronisering och tilläggsupprensning. Åtgärda orsaken innan du försöker igen."
"Review the saved plan again, then explicitly authorize a retry.": "Granska den sparade planen igen och godkänn sedan uttryckligen ett nytt försök."
"Recover a stopped worker": "Återställ en stoppad arbetsprocess"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Använd återställning först efter att du bekräftat att detta försök inte längre körs. Återställning stoppar inte en process."
"Collector and installation mode": "Insamlare och installationsläge"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Driftsättningskonfigurationen avgör insamlarrollen och databasanslutningarna. Verifiera den primära serverkonfigurationen innan du startar en insamlare."
"Discovery and SNMP settings": "Identifierings- och SNMP-inställningar"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Håll identifiering inaktiverad tills insamling och insamlaranslutning har verifierats."
"Template selection": "Mallval"
"Templates selected for import": "Mallar valda för import"
"No templates selected.": "Inga mallar markerade."
"Backup checklist": "Checklista för säkerhetskopiering"
"Database backup and a tested restoration procedure.": "Databassäkerhetskopia och en testad återställningsrutin."
"RRD files and the service account permissions needed to restore them.": "RRD-filer och de tjänstekontobehörigheter som krävs för att återställa dem."
"Configuration, keys and plugin data outside the database.": "Konfiguration, nycklar och tilläggsdata utanför databasen."
"Post-installation checks": "Kontroller efter installation"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Verifierade kontroller omfattar endast det visade underlaget. Obedömda kontroller kräver fortfarande operatörsverifiering."
"Operational checks still require operator verification.": "Driftskontroller kräver fortfarande operatörsverifiering."
"Status": "Status"
"verified": "verifierad"
"action_required": "action_required"
"not_assessed": "not_assessed"
"Database schema": "Databasschema"
"Stored schema matches the application target.": "Lagrat schema matchar applikationsmålet."
"Target schema completion has not been confirmed.": "Målschemats slutförande har inte bekräftats."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Granska installationsresultatet och åtgärda fel innan schemauppgraderingen betraktas som slutförd."
"Installation outcome": "Installationsresultat"
"A successful receipt matches the current target schema.": "En lyckad kvittens matchar det aktuella målschemat."
"A complete successful installation outcome has not been confirmed.": "Ett fullständigt lyckat installationsresultat har inte bekräftats."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Spara installationsloggen och använd den uttryckliga återställnings- eller omförsöksrutinen vid behov."
"Collector synchronization": "Insamlarsynkronisering"
"The completed installer reports pending collector synchronization.": "Det slutförda installationsprogrammet rapporterar väntande insamlarsynkronisering."
"The completed installer reports no pending collectors.": "Det slutförda installationsprogrammet rapporterar inga väntande insamlare."
"Collector completion remains unconfirmed by this partial receipt.": "Insamlarens slutförande förblir obekräftat av denna partiella kvittens."
"Collector completion is not established by this installation outcome.": "Insamlarens slutförande fastställs inte av detta installationsresultat."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Granska insamlarstatus och försök köra slutförande uppgifter igen för partiella resultat. Detta verifierar inte senare insamlingsaktualitet."
"Scheduled collection": "Schemalagd insamling"
"No poller or device was contacted by this assessment.": "Ingen poller eller enhet kontaktades av denna bedömning."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Bekräfta att den konfigurerade schemaläggaren kör pollern som avsett tjänstekonto och granska dess nästa normala cykel."
"Graph data": "Grafdata"
"Live samples and RRD updates were not exercised.": "Direkta mätvärden och RRD-uppdateringar har inte testats."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Efter en normal insamlingscykel, bekräfta att förväntade grafer tar emot nya mätvärden och granska pollerfel."
"Recovery readiness": "Återställningsberedskap"
"Backup restoration was not exercised.": "Återställning från säkerhetskopia har inte testats."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifiera en isolerad återställning av databas, RRD-filer, konfiguration och nyckelmaterial innan du förlitar dig på återställning."
"No persisted local poller start has been recorded.": "Ingen beständig lokal pollerstart har registrerats."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Lagrad pollertiming är ogiltig och kan inte fastställa schemaläggarens hälsa."
"The recorded poller start is in the future. Check clock synchronization.": "Den registrerade pollerstarten ligger i framtiden. Kontrollera klocksynkroniseringen."
"The recorded poller start is older than the native scheduling tolerance.": "Den registrerade pollerstarten är äldre än den inbyggda schemaläggningstoleransen."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "En lokal pollerstart registrerades inom den inbyggda schemaläggningstoleransen. Slutförande och enhetshälsa har inte verifierats."
"readable": "läsbar"
"missing or unreadable": "saknas eller är oläsbar"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Återställ den fullständiga versionen och dess låsta beroenden; ge tjänstekontot läsbehörighet."
"PHP temporary directory": "Temporär katalog för PHP"
"directory writable by this process": "katalog skrivbar av denna process"
"missing or not writable": "saknas eller är inte skrivbar"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurera sys_temp_dir som en befintlig katalog som är skrivbar av installationskontot. Inbyggda importer använder temporära filer."
"Background worker launch": "Start av bakgrundsarbetsprocess"
"required PHP functions available; launch not exercised": "nödvändiga PHP-funktioner tillgängliga; start ej körd"
"required PHP launch function disabled": "nödvändig PHP-startfunktion inaktiverad"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Aktivera exec för webbens PHP-körtidsmiljö, eller använd det auktoriserade CLI-installationsprogrammet."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Aktivera popen, pclose för webbens PHP-körtidsmiljö, eller använd det auktoriserade CLI-installationsprogrammet."
"Database transaction ownership": "Ägarskap för databastransaktion"
"autocommit enabled; no caller-owned transaction": "autocommit aktiverad; ingen anroparägd transaktion"
"autocommit disabled or caller transaction active": "autocommit inaktiverad eller anropartransaktion aktiv"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Kör installationen utanför en anroparägd transaktion och aktivera autocommit på dess ändringsanslutning."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Återställ versionskatalogen och ge installationskontot skrivbehörighet för import av mallresurser. Gör den inte skrivbar för alla."
"Worker file: install/background.php": "Arbetsprocessfil: install/background.php"
"Worker file: bin/legacy-installer.php": "Arbetsprocessfil: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Arbetsprocessfil: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importmål: resource/snmp_queries"
"Import destination: resource/script_server": "Importmål: resource/script_server"
"Import destination: resource/script_queries": "Importmål: resource/script_queries"
"Import destination: scripts": "Importmål: scripts"
"Database privileges": "Databasbehörigheter"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Effektiva migreringsbehörigheter, inklusive aktiva roller och objektspecifika rättigheter, verifierades inte."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Be databasadministratören verifiera nödvändiga tabellskrivningar, schemaändringar, utlösare och rutiner för installationskontot och schemat. Bevilja inte globala administratörsbehörigheter."
"Compare web and worker runtimes": "Jämför webb- och arbetsprocesskörtider"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Detta startar uttryckligen en kort skrivskyddad PHP-probe. Den reserverar inget installationsprogram, skriver inga filer och kontaktar inga enheter."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Proben ärver denna webbprocess och använder den konfigurerade PHP-tolken för installationen. Den inspekterar inte en separat schemaläggare eller tjänst."
"I authorize the read-only worker runtime comparison.": "Jag godkänner den skrivskyddade jämförelsen av arbetsprocessens körtidsmiljö."
"Compare runtimes": "Jämför körtidsmiljöer"
"Runtime comparison results": "Resultat av körtidsjämförelse"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Skillnader i behörigheter och identitet kan vara avsiktliga. Skrivskyddade observationer bevisar inte att skrivningar eller installation kommer att lyckas."
"Confirm the read-only worker runtime comparison.": "Bekräfta den skrivskyddade jämförelsen av arbetsprocessens körtidsmiljö."
"The runtime comparison is unavailable.": "Körtidsjämförelsen är otillgänglig."
"Shared application secret": "Delad applikationshemlighet"
"A strong web application secret is required before comparison.": "En stark webbapplikationshemlighet krävs före jämförelse."
"Runtime comparison": "Körtidsjämförelse"
"The configured worker runtime did not confirm a bounded comparison.": "Den konfigurerade arbetsprocessens körtidsmiljö bekräftade inte en avgränsad jämförelse."
"The inherited worker secret could not be confirmed against the web secret.": "Arbetsprocessens ärvda hemlighet kunde inte bekräftas mot webbhemligheten."
"PHP runtime comparison": "Jämförelse av PHP-körtidsmiljöer"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Båda körtidsmiljöerna måste stödja PHP 8.4; avvikande patchversioner kräver granskning."
"Required extension comparison": "Jämförelse av nödvändiga tillägg"
"Required extension availability is checked; differing versions require review.": "Tillgänglighet för nödvändiga tillägg kontrolleras; avvikande versioner kräver granskning."
"Process identity comparison": "Jämförelse av processidentitet"
"Effective process identity is unavailable on this platform.": "Effektiv processidentitet är inte tillgänglig på denna plattform."
"Effective process identities match.": "Effektiva processidentiteter matchar."
"Effective process identities differ; separate service accounts may be intentional.": "Effektiva processidentiteter skiljer sig åt; separata tjänstekonton kan vara avsiktligt."
"Directory access comparison": "Jämförelse av katalogåtkomst"
"Read-only directory permission observations match.": "Skrivskyddade observationer av katalogbehörigheter matchar."
"Directory locations or permission observations differ; review the service-account roles.": "Katalogplatser eller observerade behörigheter skiljer sig åt; granska tjänstekontonas roller."
"Worker directory read and traversal": "Läsning och genomgång av arbetskatalog"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Nödvändiga arbetskataloger måste finnas och tillåta läsning och genomgång. Inga skrivningar testades."
"The inherited worker secret matches the web secret for this private challenge.": "Arbetsprocessens ärvda hemlighet matchar webbhemligheten för denna privata utmaning."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Granska den konfigurerade PHP-tolken, nödvändiga tillägg, ärvd hemlighet och tjänstekontots katalogbehörigheter. Inga skrivningar eller start av installationsprogram har utförts."
"advisory": "rådgivande"
