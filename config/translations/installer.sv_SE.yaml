"Operation": "Operation"
"Override discovery SNMP settings": "Åsidosätt SNMP-inställningar för identifiering"
"Pass": "Godkänd"
"Poller interval in seconds": "Pollerintervall i sekunder"
"Preparing CSRF protection": "Förbereder CSRF-skydd"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Förloppet visar den senast registrerade fasen. Att uppdatera denna sida startar eller försöker aldrig köra en arbetsprocess igen."
"Recover stopped attempt": "Återställ stoppat försök"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Återställning behåller de sparade valen och avslutar aldrig en aktiv arbetsprocess. Granska planen igen innan du försöker igen."
"Review": "Granska"
"Review installation plan": "Granska installationsplan"
"Run": "Kör"
"Run reviewed plan": "Kör granskad plan"
"Save and review": "Spara och granska"
"Scope": "Omfattning"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status är otillgänglig. Sparat arbete behålls. Uppdatera för att återansluta; skicka inte in en ny installation."
"Synchronizing collectors": "Synkroniserar insamlare"
"Table conversions": "Tabellkonverteringar"
"Templates": "Mallar"
"The database version matches this application. Installation does not establish that polling is healthy.": "Databasversionen matchar denna applikation. Installationen fastställer inte att polling fungerar felfritt."
"The request outcome is unknown. Check execution status before retrying.": "Begärans resultat är okänt. Kontrollera körningsstatus innan du försöker igen."
