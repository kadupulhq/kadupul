"Finishing tasks only. Schema migrations will not be replayed.": "Endast slutförande uppgifter. Schemamigreringar spelas inte upp på nytt."
"I accept the license terms": "Jag accepterar licensvillkoren"
"I authorize discovery of the displayed range": "Jag godkänner identifiering av det visade intervallet"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Jag kontrollerade loggen och bekräftade att föregående arbetsprocess och dess underprocesser har avslutats"
"I checked the previous attempt and accept that some changes may already be committed": "Jag kontrollerade föregående försök och accepterar att vissa ändringar redan kan ha verkställts"
"I reviewed this plan and have the required backups": "Jag har granskat denna plan och har de nödvändiga säkerhetskopiorna"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Om en arbetsprocess avslutas oväntat, spara log/cacti.log och bekräfta att processen har upphört innan du uttryckligen försöker igen. Ett väntande tillstånd bekräftar inte en lyckad start."
"Importing templates": "Importerar mallar"
"Install Kadupul": "Installera Kadupul"
"Installation and upgrade": "Installation och uppgradering"
"Installation request was rejected.": "Installationsbegäran avvisades."
"Installation steps": "Installationssteg"
"Installed": "Installerade"
"Keep a backup of the database, RRD files, configuration and secret material.": "Behåll en säkerhetskopia av databasen, RRD-filer, konfiguration och hemligt nyckelmaterial."
"Language": "Språk"
"Large tables may require the dedicated CLI conversion tool before installation.": "Stora tabeller kan kräva det dedikerade CLI-konverteringsverktyget före installation."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Lämna hemliga fält tomma för att behålla lagrade autentiseringsuppgifter. Hemligheter visas aldrig igen."
"License": "Licens"
"No action needed": "Ingen åtgärd krävs"
"Observed": "Observerad"
