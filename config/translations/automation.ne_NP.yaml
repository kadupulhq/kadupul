"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "यो SNMP विकल्प सेट फारमको म्याद सकिएको छ। SNMP विकल्प सेट फेरि खोल्नुहोस् र यसको हालको फारम प्रयोग गर्नुहोस्।"
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "यो उपकरणको sysDescr स्ट्रिङसँग मेल खाएर यसलाई यस स्वचालन टेम्प्लेटसँग जोड्ने अद्वितीय स्ट्रिङ हो। कुनै पनि SQL Where अभिव्यक्तिसँगै कुनै पनि Perl नियमित अभिव्यक्ति प्रयोग गर्न सकिन्छ।"
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "यो उपकरणको sysName स्ट्रिङसँग मेल खाएर यसलाई यस स्वचालन टेम्प्लेटसँग जोड्ने अद्वितीय स्ट्रिङ हो। कुनै पनि SQL Where अभिव्यक्तिसँगै कुनै पनि Perl नियमित अभिव्यक्ति प्रयोग गर्न सकिन्छ।"
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "यो उपकरणको sysOid स्ट्रिङसँग मेल खाएर यसलाई यस स्वचालन टेम्प्लेटसँग जोड्ने अद्वितीय स्ट्रिङ हो। कुनै पनि SQL Where अभिव्यक्तिसँगै कुनै पनि Perl नियमित अभिव्यक्ति प्रयोग गर्न सकिन्छ।"
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "यो पुरानो स्वचालन टेम्प्लेट फारमको म्याद सकिएको छ। उपकरण नियमहरू खोल्नुहोस् र नयाँ फारम पेस गर्नुहोस्।"
