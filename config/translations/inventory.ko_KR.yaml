"Device associations updated.": "장치 연결이 업데이트되었습니다."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "연결을 제거해도 기존 그래프와 과거 데이터는 유지됩니다. 연결을 추가하면 자동화를 통해 그래프가 생성될 수 있습니다. 영향을 받는 수집기가 온라인 상태여야 합니다."
