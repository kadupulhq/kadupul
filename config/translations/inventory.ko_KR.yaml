"Retain graphs and disable data sources": "그래프 유지 및 데이터 소스 비활성화"
"Remove graphs and data sources": "그래프 및 데이터 소스 제거"
"Select a removal policy.": "제거 정책을 선택하세요."
"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "선택한 장치 또는 해당 그래프와 데이터 소스가 변경되었습니다. 장치를 제거하기 전에 확인 화면을 다시 불러오세요."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "그래프와 데이터 소스를 제거하기 전에 공유 데이터 소스 또는 집계 그래프를 분리해야 합니다."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "장치 제거 결과를 확인할 수 없습니다. 다시 시도하기 전에 선택한 장치, 그래프 및 데이터 소스를 확인하세요."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "장치 제거는 여기에서 되돌릴 수 없습니다. 그래프와 비활성화된 데이터 소스를 유지할지 제거할지 선택하세요."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "그래프를 제거하기 전에 공유 데이터 소스와 집계 그래프를 분리해야 합니다. 유지된 그래프와 데이터 소스는 미할당 상태가 됩니다."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "영향을 받는 원격 수집기가 온라인 상태여야 합니다. 제거에 실패하면 원격 장치나 플러그인 변경 사항이 남아 있을 수 있으므로, 다시 시도하기 전에 결과를 점검하세요."
"RRD file cleanup follows the configured maintenance policy.": "RRD 파일 정리는 구성된 유지 관리 정책을 따릅니다."
"%graphs% graphs, %sources% data sources": "그래프 %graphs%개, 데이터 소스 %sources%개"
"Device template updated.": "장치 템플릿이 업데이트되었습니다."
"Clear device statistics": "장치 통계 지우기"
"Confirm clearing statistics": "통계 지우기 확인"
"Selected device statistics cleared.": "선택한 장치의 통계가 지워졌습니다."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "이 장치들의 응답 시간, 폴링 횟수 및 가용성을 초기화합니다. 그래프, 과거 데이터 및 장치 설정은 유지됩니다. 통계는 다음 폴링부터 다시 기록됩니다."
"Synchronize device templates": "장치 템플릿 동기화"
"Confirm synchronization": "동기화 확인"
"Selected device templates synchronized.": "선택한 장치의 템플릿이 동기화되었습니다."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "이 장치들에 현재 할당된 템플릿을 적용합니다. 누락된 그래프 및 데이터 쿼리 연결은 추가되고, 사용되지 않는 그래프 템플릿 연결은 제거될 수 있습니다. 템플릿이 없는 장치는 건너뜁니다. 기존 그래프와 과거 데이터는 유지되며 자동화에 의해 새 그래프가 생성될 수 있습니다."
"Change device options": "장치 옵션 변경"
"Confirm option changes": "옵션 변경 확인"
"Selected device options updated.": "선택한 장치의 옵션이 업데이트되었습니다."
"Device options": "장치 옵션"
"Select at least one supported device option.": "지원되는 장치 옵션을 하나 이상 선택하세요."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "선택된 옵션만 변경됩니다. 선택하지 않은 옵션은 현재 값을 유지합니다. 빈 위치를 선택하면 지워집니다."
"Update %option%": "%option% 업데이트"
"Assignment target": "할당 대상"
"Select an assignment target": "할당 대상 선택"
"Select a valid assignment target.": "유효한 할당 대상을 선택하세요."
"Invalid assignment kind.": "잘못된 할당 종류입니다."
"Assign device sites": "장치 사이트 할당"
"Assign device templates": "장치 템플릿 할당"
"Assign device collectors": "장치 수집기 할당"
"Confirm assignments": "할당 확인"
"Selected device assignments updated.": "선택한 장치의 할당이 업데이트되었습니다."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "선택한 할당이 나열된 모든 장치에 적용됩니다. 템플릿 변경 시 기존 그래프가 유지되며 자동화에 의해 새 그래프가 생성될 수 있습니다. 수집기 변경 시 폴링 소유권이 이전됩니다."
