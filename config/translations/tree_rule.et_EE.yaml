"A useful name for this Rule.": "Selle reegli kasulik nimi."
"Access denied.": "Juurdepääs keelatud."
"Add Tree Rule": "Lisa puureegel"
"Back to Tree Rules": "Tagasi puureeglite juurde"
"Cancel": "Tühista"
"Check this box to enable this rule.": "Selle reegli lubamiseks märgi see ruut."
"Choose a Tree for the new Tree Items.": "Vali uute puukirjete puu."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Vali valitud puu päis, kuhu kinnituda, või selle juur. Veendu, et see on reegli täitmisel endiselt olemas."
"Choose a header of the selected Tree.": "Vali valitud puu päis."
"Choose a listed Graph Grouping Style.": "Vali loendis olev graafikute rühmitamise stiil."
"Choose a listed Leaf Item Type.": "Vali loendis olev puulehe kirje tüüp."
"Choose an existing Tree.": "Vali olemasolev puu."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Vali, kuidas graafikud selle konkreetse hosti jaoks puus joonistamisel rühmitatakse. Kasutatakse seadme lehtede jaoks."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Järgmiste puureeglite kustutamiseks koos nende objektivaliku ja puuloome kriteeriumidega klõpsa „Jätka“."
"Click Continue to disable the following Tree Rules.": "Järgmiste puureeglite keelamiseks klõpsa „Jätka“."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Järgmiste puureeglite kopeerimiseks klõpsa „Jätka“. Soovi korral võid uute puureeglite, mis algavad keelatuna, pealkirja vormingut muuta."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Järgmiste puureeglite lubamiseks klõpsa „Jätka“. Veendu, et need on edukalt testitud."
"Continue": "Jätka"
"Data Query Index": "Andmepäringu indeks"
"Delete Tree Rules": "Kustuta puureeglid"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Kustutamise tulemus on ebakindel. Kontrolli puureeglite loendit enne uuesti proovimist."
"Delete selected": "Kustuta valitud"
"Device": "Seade"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Seadme puulehed ei saa kasutada graafiku ega graafikumalli veergude kriteeriume. Kui muudad puulehe kirje tüübiks Seade, märgi see ruut nende kriteeriumide eemaldamiseks; neid ei saa taastada."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Seadme puulehed ei saa kasutada graafikupõhiseid kriteeriume. Salvestamiseks kinnita %count% kriteeriumi eemaldamine."
