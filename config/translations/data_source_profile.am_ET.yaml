"The Data Source Profile changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የውሂብ ምንጭ መገለጫው ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"The RRA changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ RRA ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"The amount of unknown data that can still be regarded as known.": "አሁንም እንደሚታወቅ ሊቆጠር የሚችል የማይታወቅ ውሂብ መጠን።"
"The default Data Source Profile cannot be deleted.": "ነባሪው የውሂብ ምንጭ መገለጫ ሊሰረዝ አይችልም።"
"The default profile and profiles in use by Data Templates or Data Sources cannot be deleted.": "ነባሪው መገለጫ እና በውሂብ አብነቶች ወይም በውሂብ ምንጮች ጥቅም ላይ የሚውሉ መገለጫዎች ሊሰረዙ አይችሉም።"
"The frequency that data will be collected from the Data Source.": "ከውሂብ ምንጩ ውሂብ የሚሰበሰብበት ድግግሞሽ።"
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "በRRA ዝርዝር ውስጥ ረድፍ ከመሙላቱ በፊት የሚያስፈልጉ ናሙናዎች ብዛት። የመጀመሪያው RRA ሁልጊዜ 1 እሴት ሊኖረው ይገባል።"
"The polling interval, X-Files Factor, Consolidation Functions and RRAs cannot be changed.": "የመጠየቂያ ክፍተት፣ የX-Files ፋክተር፣ የማጠቃለያ ተግባራት እና RRAs ሊለወጡ አይችሉም።"
"This legacy Data Source Profile form has expired. Open Data Source Profiles and submit a new form.": "ይህ የቆየ የውሂብ ምንጭ መገለጫ ቅጽ ጊዜው አልፎበታል። የውሂብ ምንጭ መገለጫዎችን ይክፈቱ እና አዲስ ቅጽ ያስገቡ።"
"Title Format": "የርዕስ ቅርጸት"
"To change the default, mark another profile as the default.": "ነባሪውን ለመለወጥ፣ ሌላ መገለጫን እንደ ነባሪ ምልክት ያድርጉ።"
"Unable to load Data Source Profiles. Reload before retrying.": "የውሂብ ምንጭ መገለጫዎችን መጫን አልተቻለም። እንደገና ከመሞከርዎ በፊት እንደገና ይጫኑ።"
"Unexpected fields were submitted.": "ያልተጠበቁ መስኮች ገብተዋል።"
"When viewing a Graph based upon the RRA in question, the default Timespan to show for that Graph.": "በጥያቄ ውስጥ ባለው RRA ላይ የተመሰረተ ግራፍ ሲመለከቱ፣ ለዚያ ግራፍ የሚታይ ነባሪ የጊዜ ክፍተት።"
