"Affected remote collectors must be online. A failed operation may have changed remote devices; verify every selected device before retrying.": "प्रभावित रिमोट कलेक्टर ऑनलाइन होने चाहिए। विफल संचालन से रिमोट डिवाइस में बदलाव हो सकता है; पुनः प्रयास करने से पहले प्रत्येक चयनित डिवाइस को सत्यापित करें।"
