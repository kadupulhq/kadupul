"Changing templates adds their graph and data-query associations and removes unused graph associations. Existing graphs and collected data are retained. Unassigning keeps current associations.": "टेम्पलेट बदलने से उनकी ग्राफ़ और डेटा-क्वेरी संबद्धताएं जुड़ती हैं और अप्रयुक्त ग्राफ़ संबद्धताएं हट जाती हैं। मौजूदा ग्राफ़ और एकत्रित डेटा सुरक्षित रहते हैं। अनअसाइन करने पर वर्तमान संबद्धताएं बनी रहती हैं।"
"Remote collectors must be online. Reload and verify the device after a failed assignment before retrying.": "रिमोट कलेक्टर ऑनलाइन होने चाहिए। विफल असाइनमेंट के बाद पुनः प्रयास करने से पहले डिवाइस को पुनः लोड और सत्यापित करें।"
"Select supported SNMP settings.": "समर्थित SNMP सेटिंग्स चुनें।"
