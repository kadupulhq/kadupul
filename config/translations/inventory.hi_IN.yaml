"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "इन डिवाइस पर वर्तमान में असाइन किए गए टेम्पलेट लागू करें। अनुपस्थित ग्राफ़ और डेटा-क्वेरी संबद्धताएं जोड़ी जाती हैं, और अप्रयुक्त ग्राफ़-टेम्पलेट संबद्धताएं हटाई जा सकती हैं। बिना टेम्पलेट वाले डिवाइस छोड़ दिए जाते हैं। मौजूदा ग्राफ़ और ऐतिहासिक डेटा सुरक्षित रहते हैं; ऑटोमेशन नए ग्राफ़ बना सकता है।"
