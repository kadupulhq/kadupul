"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "चयनित डिवाइस या उनके ग्राफ़ और डेटा स्रोत बदल गए हैं। डिवाइस हटाने से पहले पुष्टि को पुनः लोड करें।"
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "ग्राफ़ और डेटा स्रोत हटाने से पहले साझा डेटा स्रोतों या एग्रीगेट ग्राफ़ को अलग करना होगा।"
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "डिवाइस हटाने का परिणाम अनिश्चित है। पुनः प्रयास करने से पहले चयनित डिवाइस, ग्राफ़ और डेटा स्रोत जांचें।"
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "यहां डिवाइस हटाने को पूर्ववत नहीं किया जा सकता। चुनें कि ग्राफ़ और अक्षम डेटा स्रोतों को बनाए रखना है या उन्हें हटाना है।"
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "ग्राफ़ हटाने से पहले साझा डेटा स्रोतों और एग्रीगेट ग्राफ़ को अलग करना होगा। बनाए रखे गए ग्राफ़ और डेटा स्रोत अनअसाइन हो जाते हैं।"
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "प्रभावित रिमोट कलेक्टर ऑनलाइन होने चाहिए। विफल निष्कासन से रिमोट या प्लगइन परिवर्तन बचे रह सकते हैं; पुनः प्रयास करने से पहले परिणाम का निरीक्षण करें।"
"RRD file cleanup follows the configured maintenance policy.": "RRD फ़ाइल क्लीनअप कॉन्फ़िगर की गई रखरखाव नीति का पालन करता है।"
