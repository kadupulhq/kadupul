"Device collector assigned.": "डिवाइस कलेक्टर असाइन किया गया।"
"Moving a device copies its polling configuration and removes it from the previous collector. Existing graphs and collected data are retained.": "किसी डिवाइस को स्थानांतरित करने से उसका पोलिंग कॉन्फ़िगरेशन कॉपी हो जाता है और वह पिछले कलेक्टर से हट जाता है। मौजूदा ग्राफ़ और एकत्रित डेटा सुरक्षित रहते हैं।"
