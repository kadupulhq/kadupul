"Device operation outcome is uncertain. Check every selected device before retrying.": "डिवाइस संचालन परिणाम अनिश्चित है। पुनः प्रयास करने से पहले प्रत्येक चयनित डिवाइस जांचें।"
"Enable devices": "डिवाइस सक्षम करें"
