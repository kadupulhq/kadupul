"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "इन डिवाइस के लिए प्रतिक्रिया समय, पोल गिनती और उपलब्धता रीसेट करें। ग्राफ़, ऐतिहासिक डेटा और डिवाइस सेटिंग्स सुरक्षित रहते हैं। आंकड़े अगले पोल के साथ फिर से शुरू होते हैं।"
