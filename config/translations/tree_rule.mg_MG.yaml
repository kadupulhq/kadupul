"A useful name for this Rule.": "Anarana ilaina ho an'ity Fitsipika ity."
"Access denied.": "Tsy nahazo alalana."
"Add Tree Rule": "Hanampy fitsipiky ny hazo"
"Back to Tree Rules": "Hiverina any amin'ny fitsipiky ny hazo"
"Cancel": "Aoka ihany"
"Check this box to enable this rule.": "Mariho ity efajoro ity mba handefasana ity fitsipika ity."
"Choose a Tree for the new Tree Items.": "Misafidiana hazo ho an'ireo singan'ny hazo vaovao."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Misafidiana lohateny iray amin'ilay Hazo voafidy hampifandraisina, na ny fotony. Ataovy azo antoka fa mbola misy izany rehefa tanterahina ity fitsipika ity."
"Choose a header of the selected Tree.": "Misafidiana lohateny iray amin'ilay Hazo voafidy."
"Choose a listed Graph Grouping Style.": "Misafidiana Fomba fanambarana kisary ao amin'ny lisitra."
"Choose a listed Leaf Item Type.": "Misafidiana Karazana singa ravina ao amin'ny lisitra."
"Choose an existing Tree.": "Misafidiana Hazo efa misy."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Misafidiana ny fomba fanambarana ny kisary rehefa saryina ho an'ity mpampiantrano ity amin'ny hazo. Ampiasaina ho an'ny ravin'ny fitaovana."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Tsindrio ny Tohizo mba hamafana ireto Fitsipiky ny hazo manaraka ireto miaraka amin'ny Fepetra fisafidianana zavatra sy famoronana hazo."
"Click Continue to disable the following Tree Rules.": "Tsindrio ny Tohizo mba hanajanonana ireto Fitsipiky ny hazo manaraka ireto."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Tsindrio ny Tohizo mba handikana ireto Fitsipiky ny hazo manaraka ireto. Azonao ovana ihany koa ny endriky ny lohateny ho an'ireo Fitsipiky ny hazo vaovao, izay hanomboka tsy mandeha."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Tsindrio ny Tohizo mba handefasana ireto Fitsipiky ny hazo manaraka ireto. Ataovy azo antoka fa efa voasedra tsara izy ireo."
"Continue": "Tohizo"
"Data Query Index": "Tondron'ny fangatahana angona"
"Delete Tree Rules": "Hamafa ny fitsipiky ny hazo"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Tsy azo antoka ny vokatra tamin'ny famafana. Hamarino ny lisitry ny fitsipiky ny hazo alohan'ny hanandramana indray."
"Delete selected": "Hamafa izay voafidy"
"Device": "Fitaovana"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Tsy afaka mampiasa fepetra amin'ny tsanganana kisary na lasitra kisary ny ravin'ny fitaovana. Rehefa manova ny Karazana singa ravina ho Fitaovana dia mariho ity boaty ity hanesorana ireo fepetra ireo; tsy azo averina intsony izy ireo."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Tsy afaka mampiasa fepetra mifototra amin'ny kisary ny ravin'ny fitaovana. Hamarino ny fanesorana fepetra %count% mba hitahirizana."
"Disable Tree Rules": "Hanajanona ny fitsipiky ny hazo"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Tsy azo antoka ny vokatra tamin'ny fanajanonana. Hamarino ny lisitry ny fitsipiky ny hazo alohan'ny hanandramana indray."
"Disable selected": "Hampitsahatra ireo voafidy"
"Duplicate Tree Rules": "Handika ny fitsipiky ny hazo"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Tsy azo antoka ny vokatra tamin'ny fandikana. Hamarino ny lisitry ny fitsipiky ny hazo alohan'ny hanandramana indray."
"Duplicate selected": "Ataovy kopia izay voafidy"
"Edit Tree Rule": "Hanova ny fitsipiky ny hazo"
"Enable Rule": "Alefaso ny fitsipika"
"Enable Tree Rules": "Handefa ny fitsipiky ny hazo"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Tsy azo antoka ny vokatra tamin'ny fandefasana. Hamarino ny lisitry ny fitsipiky ny hazo alohan'ny hanandramana indray."
"Enable selected": "Hampandeha ireo voafidy"
"Enter a name.": "Ampidiro ny anarana."
"Enter a valid name format.": "Ampidiro endrika anarana manan-kery."
"Enter at most %count% characters.": "Mampidira soratra farafahabetsany %count%."
"Enter single-line text.": "Mampidira lahatsoratra andalana tokana."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Soloina ny anaran'ny Fitsipiky ny hazo adika ny <rule_name> tsirairay."
"Graph": "Kisary"
"Graph Grouping Style": "Fomba fanakambanana kisary"
"Graph Template": "Lasitra Kisary"
"Invalid Tree Rule selection.": "Tsy manan-kery ny safidy fitsipiky ny hazo."
"Leaf Item Type": "Karazana singa ravina"
"Name": "Anarana"
"Object Selection and Tree Creation Criteria": "Fepetra fisafidianana zavatra sy famoronana hazo"
"One or more selected Tree Rules no longer exist.": "Tsy misy intsony ny iray na maromaro amin'ireo Fitsipiky ny hazo voafidy."
"Optional: Sub-Tree Item": "Safidy: Singan'ny zana-kazo"
"Remove graph-based criteria": "Esory ny fepetra mifototra amin'ny kisary"
"Save": "Tahirizo"
"Save outcome is uncertain. Reload before retrying.": "Tsy azo antoka ny valin'ny fitahirizana. Havaozy alohan'ny hanandramana indray."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Tehirizo aloha ny fitsipika; ampiana avy eo ny Fepetra fisafidianana zavatra sy famoronana hazo."
"Select": "Fidio"
"Select %name%": "Fidio ny %name%"
"Select at least one Tree Rule.": "Misafidiana Fitsipiky ny hazo iray farafahakeliny."
"Select at most 100 Tree Rules at a time.": "Misafidiana Fitsipiky ny hazo 100 raha be indrindra indray mandeha."
"Select up to %count% rows at a time.": "Fidio hatramin'ny andalana %count% indray mandeha."
"The Item Type that shall be dynamically added to the tree.": "Ny karazana singa izay hampiana ho azy ao amin'ny hazo."
"The name format must give every copy a name of 1 to 255 characters.": "Ny endriky ny anarana dia tsy maintsy manome anarana misy tarehintsoratra 1 hatramin'ny 255 ho an'ny dika mitovy tsirairay."
"The tree rule changed since you opened this form. Reload before saving.": "Niova ny fitsipiky ny hazo hatramin'ny nanokafanao ity taratasy ity. Avereno sokafana alohan'ny hitahirizana."
"Title Format": "Endriky ny lohateny"
"Tree": "Hazo"
"Tree Rule Selection [edit: %name%]": "Fifidianana fitsipiky ny hazo [fanovana: %name%]"
"Tree Rules Selection [new]": "Fisafidianana fitsipiky ny hazo [vaovao]"
"Tree rule not found.": "Tsy hita ny fitsipiky ny hazo."
"Tree rule saved.": "Voatahiry ny fitsipiky ny hazo."
"Unable to load Tree Rules. Reload before retrying.": "Tsy afaka mampiditra ireo Fitsipiky ny Hazo. Avereno ampidirina alohan'ny hanandramana indray."
"Unable to load the tree rule. Reload before retrying.": "Tsy afaka mampiditra ny fitsipiky ny hazo. Avereno ampidirina alohan'ny hanandramana indray."
"Unexpected fields were submitted.": "Nisy saha tsy nampoizina nalefa."
