"What Day(s) of the Month will this Network Range be discovered?": "Ni uwuhe munsi (iyihe minsi) y'ukwezi iki gice cy'umuyoboro kizashakishwamo?"
"What Day(s) of the week will this Network Range be discovered?": "Ni uwuhe munsi (iyihe minsi) y'icyumweru iki gice cy'umuyoboro kizashakishwamo?"
"What Month(s) of the Year will this Network Range be discovered?": "Ni ukuhe kwezi (ayahe mezi) y'umwaka iki gice cy'umuyoboro kizashakishwamo?"
"What Week(s) of the Month will this Network Range be discovered?": "Ni ikihe cyumweru (ibihe byumweru) by'ukwezi iki gice cy'umuyoboro kizashakishwamo?"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "Ni ryari iki gikorwa cyo gushakisha ku muyoboro kizatangira?  Cyandike nka YYYY-MM-DD HH:MM."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "Mu gihe cyo gushakisha ibikoresho, emerera amazina ya sisitemu asa kongerwa ku bikoresho bitandukanye"
"You must specify both the Months and Days of Month.": "Ugomba gushyiramo amezi n'iminsi y'ukwezi byombi."
"You must specify the Months, Weeks of Month, and Days of Week.": "Ugomba gushyiramo amezi, ibyumweru by'ukwezi, n'iminsi y'icyumweru."
"You must specify the day of the week.": "Ugomba gushyiramo umunsi w'icyumweru."
