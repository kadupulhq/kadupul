"Enter DNS servers as IP addresses or host names separated by spaces.": "Injiza amaseriveri ya DNS nk'aderesi za IP cyangwa amazina y'ibikoresho bitandukanyijwe n'umwanya."
"Enter IPs or FQDNs of DNS Servers": "Injiza aderesi za IP cyangwa za FQDN z'amaseriveri ya DNS"
"Enter a name.": "Injiza izina."
"Enter a valid email address.": "Injiza aderesi ya imeri yemewe."
"Enter a whole number from %min% to %max%.": "Injiza umubare wuzuye kuva kuri %min% kugeza kuri %max%."
