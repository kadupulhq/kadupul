"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Urutonde rw'amaseriveri yandi ya DNS atandukanyijwe n'umwanya yo gukoresha mu gukemura amazina ya DNS. Nibisigara ubusa, sisitemu y'imikorere y'ikusanyamakuru izakoreshwa mu gukemura amazina ya DNS."
"Access denied.": "Uburenganzira bwanzwe."
"Add Discovery Network": "Ongeraho umuyoboro w'ishakisha"
"After an initial failure, the number of ping retries to attempt before failing.": "Nyuma yo gutsindwa bwa mbere, umubare w'ibigeragezo bya ping bikorwa mbere yo kwemeza ko byanze."
"After the selected Run Limit, the discovery process will be terminated.": "Nyuma y'igihe ntarengwa cy'ikorwa cyahiswemo, igikorwa cyo gushakisha kizahagarikwa."
"Allow same sysName on different hosts": "Emera sysName imwe ku bikoresho bitandukanye"
"Alternate DNS Servers": "Amaseriveri yandi ya DNS"
"April": "Mata"
"Associated Site": "Ikicaro gifitanye isano"
"August": "Kanama"
"Automatically Add Devices": "Ongeramo ibikoresho mu buryo bwikora"
"Back to Networks": "Subira ku miyoboro"
"Choose an existing Data Collector.": "Hitamo ikusanyamakuru risanzweho."
"Choose an existing SNMP Option Set.": "Hitamo itsinda ry'amahitamo ya SNMP risanzweho."
"Choose an existing Site.": "Hitamo ikicaro gisanzweho."
"Choose one of the listed values.": "Hitamo imwe mu ndangagaciro ziri ku rutonde."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "Hitamo igikusanyamakuru cyo gukoresha mu gukusanya amakuru ava muri iki gikoresho."
"Choose the Site that you wish to associate discovered Devices with.": "Hitamo ikicaro wifuza guhuza n'ibikoresho byavumbuwe."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Gahunda z'umunsi n'iz'icyumweru zikoresha itangiriro na Ongera ukore buri; iz'icyumweru zikoresha kandi Iminsi y'icyumweru. Iz'ukwezi zikoresha Amezi n'Iminsi y'ukwezi; iz'ukwezi ku munsi runaka zikoresha Amezi, Ibyumweru by'ukwezi n'Iminsi y'icyumweru."
"Daily": "Buri munsi"
"Data Collector": "Igikusanya amakuru"
"Day(s) of Week": "Umunsi (Iminsi) y'icyumweru"
"Days of Month": "Iminsi y'ukwezi"
"Days of Week": "Iminsi y'icyumweru"
"December": "Ukuboza"
"Define the collection frequency.": "Shyiraho inshuro yo gukusanya amakuru."
"Define the number of threads to use for discovering this Network Range.": "Shyiraho umubare w'inzira z'ikorwa zikoreshwa mu gushakisha iki gice cy'umuyoboro."
