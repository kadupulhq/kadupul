"Enter single-line text.": "Injiza umwandiko w'umurongo umwe."
"Enter the start as YYYY-MM-DD HH:MM.": "Injiza itangiriro mu buryo bwa YYYY-MM-DD HH:MM."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "Injiza ibice by'umuyoboro byemewe bitandukanyijwe n'akitso. Ushobora gukoresha aderesi ya IP, igice cy'umuyoboro nka 192.168.1.0/24 cyangwa 192.168.1.0/255.255.255.0, cyangwa ukoresheje ikimenyetso gisimbura nka 192.168.*.*"
"Enter valid network ranges separated by commas.": "Injiza ibice by'umuyoboro byemewe bitandukanyijwe n'akitso."
"February": "Gashyantare"
"First": "Cya mbere"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "Ku bikoresho bishya byose byavumbuwe bigerwaho hakoreshejwe SNMP kandi bihura n'itegeko ry'igikoresho, byongereho nk'ibikoresho."
