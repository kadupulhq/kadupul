"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "Aderesi ya imeri yo gukoresha nk'imeri y'uwohereza ku imeri y'imenyesha. Niba isigaye ubusa, hakoreshwa aderesi ya imeri y'imenyesha y'ikoreshaburyo bwikora isanzweho."
"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "Izina rya konti ya imeri ryo gukoresha nk'izina ry'uwohereza ku imeri y'imenyesha. Niba risigaye ubusa, hakoreshwa izina ry'imenyesha ry'ikoreshaburyo bwikora risanzweho."
"The Email account to be used to send the Notification Email to.": "Konti ya imeri yo gukoresha mu kohereza imeri y'imenyesha."
"The discovery network changed since you opened this form. Reload before saving.": "Umuyoboro w'ishakisha wahindutse kuva wafungura iyi fomu. Ongera upakurure mbere yo kubika."
"The discovery network form is incomplete.": "Ifomu y'umuyoboro w'ishakisha ntiyuzuye."
"The ranges cover more than %count% addresses.": "Ibice by'umuyoboro bifata aderesi zirenga %count%."
"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "Igihe ntarengwa kigomba gukoreshwa mu gukora ping ya ICMP na UDP ku gikoresho. Iki gihe ntarengwa cya SNMP cy'igikoresho gikoreshwa no kuri ping ya SNMP."
