"Retain graphs and disable data sources": "ഗ്രാഫുകൾ നിലനിർത്തുകയും ഡാറ്റ സോഴ്സുകൾ പ്രവർത്തനരഹിതമാക്കുകയും ചെയ്യുക"
"Remove graphs and data sources": "ഗ്രാഫുകളും ഡാറ്റ സോഴ്സുകളും നീക്കം ചെയ്യുക"
