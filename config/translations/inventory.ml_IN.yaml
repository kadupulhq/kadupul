"Changing templates adds their graph and data-query associations and removes unused graph associations. Existing graphs and collected data are retained. Unassigning keeps current associations.": "ടെംപ്ലേറ്റുകൾ മാറ്റുന്നത് അവയുടെ ഗ്രാഫ്, ഡാറ്റ-ക്വറി ബന്ധങ്ങൾ ചേർക്കുകയും ഉപയോഗിക്കാത്ത ഗ്രാഫ് ബന്ധങ്ങൾ നീക്കം ചെയ്യുകയും ചെയ്യുന്നു. നിലവിലുള്ള ഗ്രാഫുകളും ശേഖരിച്ച ഡാറ്റയും നിലനിർത്തുന്നു. നൽകുന്നത് ഒഴിവാക്കുന്നത് നിലവിലെ ബന്ധങ്ങൾ നിലനിർത്തുന്നു."
