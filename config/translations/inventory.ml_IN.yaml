"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "തിരഞ്ഞെടുത്ത നൽകൽ ലിസ്റ്റിലെ എല്ലാ ഉപകരണങ്ങൾക്കും പ്രയോഗിക്കുന്നു. ടെംപ്ലേറ്റ് മാറ്റങ്ങൾ നിലവിലുള്ള ഗ്രാഫുകൾ നിലനിർത്തുന്നു; ഓട്ടോമേഷൻ പുതിയ ഗ്രാഫുകൾ സൃഷ്ടിച്ചേക്കാം. കളക്ടർ മാറ്റങ്ങൾ പോളിംഗ് ഉടമസ്ഥത കൈമാറുന്നു."
