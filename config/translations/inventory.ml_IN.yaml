"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "ഈ ഉപകരണങ്ങളിൽ നിലവിൽ നൽകിയ ടെംപ്ലേറ്റുകൾ പ്രയോഗിക്കുക. വിട്ടുപോയ ഗ്രാഫ്, ഡാറ്റ-ക്വറി ബന്ധങ്ങൾ ചേർക്കുകയും ഉപയോഗിക്കാത്ത ഗ്രാഫ്-ടെംപ്ലേറ്റ് ബന്ധങ്ങൾ നീക്കം ചെയ്തേക്കാം. ടെംപ്ലേറ്റുകളില്ലാത്ത ഉപകരണങ്ങൾ ഒഴിവാക്കപ്പെടും. നിലവിലുള്ള ഗ്രാഫുകളും ചരിത്ര ഡാറ്റയും നിലനിർത്തുന്നു; ഓട്ടോമേഷൻ പുതിയ ഗ്രാഫുകൾ സൃഷ്ടിച്ചേക്കാം."
