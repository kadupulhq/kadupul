"Clear device statistics": "ഉപകരണ സ്ഥിതിവിവരക്കണക്കുകൾ മായ്ക്കുക"
"Confirm clearing statistics": "സ്ഥിതിവിവരക്കണക്കുകൾ മായ്ക്കൽ സ്ഥിരീകരിക്കുക"
"Selected device statistics cleared.": "തിരഞ്ഞെടുത്ത ഉപകരണ സ്ഥിതിവിവരക്കണക്കുകൾ മായ്ച്ചു."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "ഈ ഉപകരണങ്ങളുടെ പ്രതികരണ സമയങ്ങൾ, പോൾ എണ്ണങ്ങൾ, ലഭ്യത എന്നിവ റീസെറ്റ് ചെയ്യുക. ഗ്രാഫുകൾ, ചരിത്ര ഡാറ്റ, ഉപകരണ ക്രമീകരണങ്ങൾ എന്നിവ നിലനിർത്തുന്നു. അടുത്ത പോളിൽ സ്ഥിതിവിവരക്കണക്കുകൾ പുനരാരംഭിക്കും."
