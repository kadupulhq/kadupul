"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "തിരഞ്ഞെടുത്ത ഉപകരണങ്ങളോ അവയുടെ ഗ്രാഫുകളും ഡാറ്റ സോഴ്സുകളും മാറി. ഉപകരണങ്ങൾ നീക്കം ചെയ്യുന്നതിന് മുമ്പ് സ്ഥിരീകരണം റീലോഡ് ചെയ്യുക."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "ഗ്രാഫുകളും ഡാറ്റ സോഴ്സുകളും നീക്കം ചെയ്യുന്നതിന് മുമ്പ് പങ്കിട്ട ഡാറ്റ സോഴ്സുകളോ അഗ്രിഗേറ്റ് ഗ്രാഫുകളോ വേർപെടുത്തണം."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "ഉപകരണം നീക്കം ചെയ്യലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് തിരഞ്ഞെടുത്ത ഉപകരണങ്ങൾ, ഗ്രാഫുകൾ, ഡാറ്റ സോഴ്സുകൾ എന്നിവ പരിശോധിക്കുക."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "ഉപകരണം നീക്കം ചെയ്യൽ ഇവിടെ പഴയപടിയാക്കാനാവില്ല. ഗ്രാഫുകളും പ്രവർത്തനരഹിതമാക്കിയ ഡാറ്റ സോഴ്സുകളും നിലനിർത്തണോ നീക്കം ചെയ്യണോ എന്ന് തിരഞ്ഞെടുക്കുക."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "ഗ്രാഫ് നീക്കം ചെയ്യുന്നതിന് മുമ്പ് പങ്കിട്ട ഡാറ്റ സോഴ്സുകളും അഗ്രിഗേറ്റ് ഗ്രാഫുകളും വേർപെടുത്തണം. നിലനിർത്തിയ ഗ്രാഫുകളും ഡാറ്റ സോഴ്സുകളും നൽകാത്തവയാകും."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "ബാധിക്കപ്പെടുന്ന റിമോട്ട് കളക്ടറുകൾ ഓൺലൈനിൽ ആയിരിക്കണം. പരാജയപ്പെട്ട നീക്കം ചെയ്യൽ റിമോട്ടിലോ പ്ലഗിനിലോ മാറ്റങ്ങൾ ബാക്കിവച്ചേക്കാം; വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ഫലം പരിശോധിക്കുക."
"RRD file cleanup follows the configured maintenance policy.": "RRD ഫയൽ ക്ലീനപ്പ് കോൺഫിഗർ ചെയ്ത അറ്റകുറ്റപ്പണി നയം പിന്തുടരുന്നു."
