"Installed": "مثبّت"
"Keep a backup of the database, RRD files, configuration and secret material.": "احتفظ بنسخة احتياطية من قاعدة البيانات وملفات RRD والإعدادات والبيانات السرية."
"Language": "اللغة"
"Large tables may require the dedicated CLI conversion tool before installation.": "قد تتطلب الجداول الكبيرة استخدام أداة التحويل المخصصة عبر CLI قبل التثبيت."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "اترك الحقول السرية فارغة للاحتفاظ ببيانات الاعتماد المحفوظة. لا يُعاد عرض البيانات السرية مطلقاً."
