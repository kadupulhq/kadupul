"I accept the license terms": "أوافق على شروط الترخيص"
"I authorize discovery of the displayed range": "أصرّح باكتشاف النطاق المعروض"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "راجعت السجل وتأكدت من توقف العامل السابق وعملياته الفرعية"
"I checked the previous attempt and accept that some changes may already be committed": "راجعت المحاولة السابقة وأقرّ بأن بعض التغييرات قد تكون اعتُمدت بالفعل"
"I reviewed this plan and have the required backups": "راجعت هذه الخطة ولديّ النسخ الاحتياطية المطلوبة"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "إذا توقف العامل بشكل غير متوقع، احتفظ بملف log/cacti.log وتأكد من انتهاء عمليته قبل إعادة المحاولة صراحةً. حالة الانتظار لا تؤكد نجاح التشغيل."
