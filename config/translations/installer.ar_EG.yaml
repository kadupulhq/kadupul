"waiting": "في الانتظار"
"Accept the license before saving the installation plan.": "وافق على الترخيص قبل حفظ خطة التثبيت."
"Invalid installation form.": "نموذج التثبيت غير صالح."
"Access denied.": "تم رفض الوصول."
"Confirm the recovery warning before retrying.": "أكّد تحذير الاستعادة قبل إعادة المحاولة."
"Review and confirm the current installation plan.": "راجع خطة التثبيت الحالية وأكّدها."
"Confirm the discovery scope before starting.": "أكّد نطاق الاكتشاف قبل البدء."
"Resolve the blocking checks before starting.": "عالج الفحوصات المانعة قبل البدء."
"Too many installer options.": "خيارات المثبّت كثيرة جداً."
"Invalid installer option name.": "اسم خيار المثبّت غير صالح."
"Unknown or malformed installer option.": "خيار مثبّت غير معروف أو صياغته غير سليمة."
"Installer options must be scalar values.": "يجب أن تكون خيارات المثبّت قيماً أحادية."
"Installer option is too long or contains a null byte.": "خيار المثبّت طويل جداً أو يحتوي على بايت صفري."
"Installer IDs and intervals must be whole numbers.": "يجب أن تكون معرّفات المثبّت والفترات الزمنية أعداداً صحيحة."
"Installer ID or interval is outside its supported range.": "معرّف المثبّت أو الفترة الزمنية خارج النطاق المدعوم."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "تعذّر استكمال التثبيت. أعد تحميل حالته وراجع الفحوصات المانعة قبل إعادة المحاولة."
"Confirm that the previous worker has stopped before recovering its plan.": "تأكد من توقف العامل السابق قبل استعادة خطته."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "تم تثبيت قاعدة البيانات، لكن بعض المجمّعات لا تزال بحاجة إلى مزامنة. أعد محاولة المهام النهائية بعد فحص حالتها."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "توقف التثبيت. احتفظ بسجل المثبّت، وصحّح السبب، وأكّد إعادة المحاولة صراحةً. قد تكون بعض تغييرات قاعدة البيانات قد اعتُمدت بالفعل. افحص تنظيف الإضافات قبل التصريح بإعادة المحاولة."
"Next action": "الإجراء التالي"
"Follow the execution status. Do not start another attempt while a worker is active.": "تابع حالة التنفيذ. لا تبدأ محاولة أخرى أثناء عمل أحد العمال."
"Complete the recovery checklist before retrying.": "أكمل قائمة التحقق من الاستعادة قبل إعادة المحاولة."
"Verify collection and graph operation before enabling discovery.": "تحقق من عمل الجمع والرسوم البيانية قبل تفعيل الاكتشاف."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "عالج المتطلبات المحظورة، ثم افحص مرة أخرى. يتم الاحتفاظ بالاختيارات المحفوظة."
"Review the planned changes and backup checklist before authorizing execution.": "راجع التغييرات المخططة وقائمة التحقق من النسخ الاحتياطي قبل التصريح بالتنفيذ."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "اختر ملف تعريف للجمع ووافق على الترخيص. يمكن فتح الإعدادات الاختيارية عند الحاجة."
"Download installation diagnostics": "تحميل تشخيصات التثبيت"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "افتح رسماً بيانياً وتأكد من تحديث بيانات RRD الخاصة به بعد دورة المستطلع."
"Requirement details": "تفاصيل المتطلبات"
"Recover": "استعادة"
"Recovery checklist": "قائمة التحقق من الاستعادة"
"Preserve log/cacti.log and record the failed attempt.": "احتفظ بملف log/cacti.log وسجّل المحاولة الفاشلة."
"Confirm that the previous worker and its child processes have stopped.": "تأكد من توقف العامل السابق والعمليات الفرعية التابعة له."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "افحص التغييرات المعتمدة ومزامنة المجمّع وتنظيف الإضافات، وعالج السبب قبل إعادة المحاولة."
"Review the saved plan again, then explicitly authorize a retry.": "راجع الخطة المحفوظة مرة أخرى، ثم اسمح صراحةً بإعادة المحاولة."
"Recover a stopped worker": "استعادة عامل متوقف"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "استخدم الاستعادة فقط بعد التأكد من انتهاء تشغيل هذه المحاولة؛ فالاستعادة لا توقف أي عملية قيد التشغيل."
"Collector and installation mode": "المجمّع ووضع التثبيت"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "تحدد إعدادات النشر دور المجمّع واتصالات قاعدة البيانات. تأكد من إعدادات السيرفر الرئيسي قبل بدء تشغيل أي مجمّع."
"Discovery and SNMP settings": "إعدادات الاكتشاف وSNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "اترك الاكتشاف معطلاً حتى يتم التحقق من عملية الجمع واتصال المجمّع."
"Template selection": "اختيار القوالب"
"Templates selected for import": "القوالب المحددة للاستيراد"
"No templates selected.": "لم يتم تحديد أي قوالب."
"Backup checklist": "قائمة مراجعة النسخ الاحتياطي"
"Database backup and a tested restoration procedure.": "نسخة احتياطية لقاعدة البيانات وإجراء استعادة تم اختباره."
"RRD files and the service account permissions needed to restore them.": "ملفات RRD وصلاحيات حساب الخدمة اللازمة لاستعادتها."
"Configuration, keys and plugin data outside the database.": "ملفات الإعدادات والمفاتيح وبيانات الإضافات الموجودة خارج قاعدة البيانات."
"Post-installation checks": "فحوصات ما بعد التثبيت"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "تغطي الفحوصات التي تم التحقق منها الأدلة المعروضة فقط، ولا تزال الفحوصات غير المقيّمة تتطلب مراجعة المشغّل."
"Operational checks still require operator verification.": "لا تزال الفحوصات التشغيلية تتطلب تحقق المشغّل."
"Status": "الحالة"
"verified": "تم التحقق"
"action_required": "إجراء مطلوب"
"not_assessed": "غير مقيّم"
"Database schema": "مخطط قاعدة البيانات"
"Stored schema matches the application target.": "المخطط المخزن يطابق الإصدار المستهدف للتطبيق."
"Target schema completion has not been confirmed.": "لم يتم تأكيد اكتمال المخطط المستهدف."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "راجع نتيجة التثبيت وعالج الأعطال قبل اعتبار ترقية المخطط مكتملة."
"Installation outcome": "نتيجة التثبيت"
"A successful receipt matches the current target schema.": "يتطابق سجل الإتمام الناجح مع المخطط المستهدف الحالي."
"A complete successful installation outcome has not been confirmed.": "لم يتم تأكيد إتمام التثبيت بنجاح بشكل كامل."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "احتفظ بسجل المثبّت واستخدم إجراء الاستعادة أو إعادة المحاولة الصريح عند الحاجة."
"Collector synchronization": "مزامنة المجمّع"
"The completed installer reports pending collector synchronization.": "يشير المثبّت المكتمل إلى وجود مجمّعات في انتظار المزامنة."
"The completed installer reports no pending collectors.": "يشير المثبّت المكتمل إلى عدم وجود مجمّعات معلّقة."
"Collector completion remains unconfirmed by this partial receipt.": "يظل اكتمال المجمّع غير مؤكد بناءً على سجل الإتمام الجزئي هذا."
"Collector completion is not established by this installation outcome.": "لا تثبت نتيجة التثبيت هذه اكتمال المجمّع."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "راجع حالة المجمّع وأعد تشغيل مهام الإنهاء للنتائج الجزئية. هذا الإجراء لا يتحقق من حداثة بيانات الجمع اللاحقة."
"Scheduled collection": "الجمع المجدول"
"No poller or device was contacted by this assessment.": "لم يتم التواصل مع أي مستطلع أو جهاز أثناء هذا التقييم."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "تأكد من أن المجدول المُعد يشغّل المستطلع بحساب الخدمة المخصص وراجع دورته الاعتيادية التالية."
"Graph data": "بيانات الرسوم البيانية"
"Live samples and RRD updates were not exercised.": "لم يتم فحص العينات الحية وتحديثات RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "بعد دورة جمع اعتيادية، تأكد من وصول عينات حديثة إلى الرسوم البيانية المتوقعة وراجع أخطاء المستطلع."
"Recovery readiness": "جاهزية الاستعادة"
"Backup restoration was not exercised.": "لم يتم فحص استعادة النسخة الاحتياطية."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "تأكد من إجراء استعادة معزولة لقاعدة البيانات وملفات RRD والإعدادات ومواد المفاتيح قبل الاعتماد على الاستعادة."
"No persisted local poller start has been recorded.": "لم يتم تسجيل أي بدء محفوظ لتشغيل المستطلع المحلي."
"Persisted poller timing is invalid and cannot establish scheduler health.": "توقيت المستطلع المحفوظ غير صالح ولا يمكنه إثبات سلامة المجدول."
"The recorded poller start is in the future. Check clock synchronization.": "وقت بدء المستطلع المسجل يقع في المستقبل. افحص مزامنة الساعة."
"The recorded poller start is older than the native scheduling tolerance.": "وقت بدء المستطلع المسجل أقدم من حد السماح الأصلي للجدولة."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "تم تسجيل بدء تشغيل المستطلع المحلي ضمن حد السماح الأصلي للجدولة. لم يتم التحقق من الاكتمال أو سلامة الجهاز."
"readable": "قابل للقراءة"
"missing or unreadable": "مفقود أو غير قابل للقراءة"
"Restore the complete release and its locked dependencies; grant the service account read access.": "استعد الإصدار الكامل وتبعياته المقيدة؛ وامنح حساب الخدمة صلاحية القراءة."
"PHP temporary directory": "مجلد PHP المؤقت"
"directory writable by this process": "مجلد قابل للكتابة لهذه العملية"
"missing or not writable": "مفقود أو غير قابل للكتابة"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "اضبط sys_temp_dir كمجلد موجود قابل للكتابة لحساب التثبيت، حيث تستخدم عمليات الاستيراد الأصلية ملفات مؤقتة."
"Background worker launch": "تشغيل عامل الخلفية"
"required PHP functions available; launch not exercised": "دوال PHP المطلوبة متوفرة؛ لم يتم فحص التشغيل"
"required PHP launch function disabled": "دالة تشغيل PHP المطلوبة معطلة"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "فعّل exec لبيئة تشغيل PHP للويب، أو استخدم مثبّت CLI المعتمد."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "فعّل popen وpclose لبيئة تشغيل PHP للويب، أو استخدم مثبّت CLI المعتمد."
"Database transaction ownership": "ملكية معاملات قاعدة البيانات"
"autocommit enabled; no caller-owned transaction": "التثبيت التلقائي (autocommit) مفعل؛ لا توجد معاملة مملوكة للجهة المستدعية"
"autocommit disabled or caller transaction active": "التثبيت التلقائي (autocommit) معطل أو توجد معاملة نشطة للجهة المستدعية"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "شغّل التثبيت خارج أي معاملة مملوكة للجهة المستدعية وفعّل التثبيت التلقائي (autocommit) على اتصال التعديل الخاص به."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "استعد مجلد الإصدار وامنح حساب التثبيت صلاحية الكتابة لاستيراد موارد القوالب. لا تجعله متاحًا للكتابة للجميع."
"Worker file: install/background.php": "ملف العامل: install/background.php"
"Worker file: bin/legacy-installer.php": "ملف العامل: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "ملف العامل: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "وجهة الاستيراد: resource/snmp_queries"
"Import destination: resource/script_server": "وجهة الاستيراد: resource/script_server"
"Import destination: resource/script_queries": "وجهة الاستيراد: resource/script_queries"
"Import destination: scripts": "وجهة الاستيراد: scripts"
"Database privileges": "صلاحيات قاعدة البيانات"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "لم يتم التحقق من صلاحيات الترحيل الفعلية، بما في ذلك الأدوار النشطة والمنح الخاصة بالكائنات."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "اطلب من مسؤول قاعدة البيانات التحقق من صلاحيات الكتابة المطلوبة للجداول وتعديلات المخطط والمشغلات والإجراءات المخزنة لحساب التثبيت والمخطط. لا تمنح صلاحيات المسؤول العام."
"Compare web and worker runtimes": "مقارنة بيئتي تشغيل الويب والعامل"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "يبدأ هذا الإجراء فحص PHP قصير للقراءة فقط بشكل صريح، ولا يحجز المثبّت أو يكتب ملفات أو يتواصل مع الأجهزة."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "يرث الفحص عملية الويب الحالية ويستخدم مفسر PHP المُعد للمثبّت، ولا يفحص أي مجدول أو خدمة منفصلة."
"I authorize the read-only worker runtime comparison.": "أوافق على إجراء مقارنة بيئة تشغيل العامل للقراءة فقط."
"Compare runtimes": "مقارنة بيئات التشغيل"
"Runtime comparison results": "نتائج مقارنة بيئات التشغيل"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "قد تكون اختلافات الصلاحيات والهوية مقصودة. ملاحظات القراءة فقط لا تثبت نجاح عمليات الكتابة أو التثبيت."
"Confirm the read-only worker runtime comparison.": "تأكيد مقارنة بيئة تشغيل العامل للقراءة فقط."
"The runtime comparison is unavailable.": "مقارنة بيئات التشغيل غير متاحة."
"Shared application secret": "السر المشترك للتطبيق"
"A strong web application secret is required before comparison.": "مطلوب سر قوي لتطبيق الويب قبل إجراء المقارنة."
"Runtime comparison": "مقارنة بيئات التشغيل"
"The configured worker runtime did not confirm a bounded comparison.": "لم تؤكد بيئة تشغيل العامل المُعدة إجراء مقارنة محدودة النطاق."
"The inherited worker secret could not be confirmed against the web secret.": "تعذر التحقق من تطابق المفتاح السري الموروث للعامل مع المفتاح السري للويب."
"PHP runtime comparison": "مقارنة بيئة تشغيل PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "يجب أن تدعم بيئتا التشغيل PHP 8.4؛ وأي اختلاف في إصدارات التصحيح يتطلب مراجعة."
"Required extension comparison": "مقارنة الإضافات المطلوبة"
"Required extension availability is checked; differing versions require review.": "يتم فحص توفر الإضافات المطلوبة؛ وأي اختلاف في الإصدارات يتطلب مراجعة."
"Process identity comparison": "مقارنة هوية العملية"
"Effective process identity is unavailable on this platform.": "هوية العملية الفعلية غير متاحة على هذه المنصة."
"Effective process identities match.": "هويات العمليات الفعلية متطابقة."
"Effective process identities differ; separate service accounts may be intentional.": "هويات العمليات الفعلية مختلفة؛ قد يكون فصل حسابات الخدمة مقصوداً."
"Directory access comparison": "مقارنة صلاحيات الوصول للمجلدات"
"Read-only directory permission observations match.": "نتائج فحص صلاحيات القراءة فقط للمجلدات متطابقة."
"Directory locations or permission observations differ; review the service-account roles.": "مواقع المجلدات أو نتائج فحص الصلاحيات مختلفة؛ يُرجى مراجعة أدوار حساب الخدمة."
"Worker directory read and traversal": "قراءة مجلد العامل والتنقل داخله"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "يجب أن تكون مجلدات العامل المطلوبة موجودة وتسمح بالقراءة والتنقل داخلها. لم يتم اختبار أي عمليات كتابة."
"The inherited worker secret matches the web secret for this private challenge.": "يتطابق المفتاح السري الموروث للعامل مع المفتاح السري للويب لهذا التحدي الخاص."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "راجع مفسّر PHP المُعد والإضافات المطلوبة والمفتاح السري الموروث وصلاحيات مجلدات حساب الخدمة. لم يتم تنفيذ أي عمليات كتابة أو تشغيل لبرنامج التثبيت."
"advisory": "إرشادي"
