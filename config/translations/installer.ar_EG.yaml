"Action": "الإجراء"
"Advanced options": "خيارات متقدمة"
"Applying database upgrades": "جارٍ تطبيق ترقيات قاعدة البيانات"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "قم بعمل نسخة احتياطية لقاعدة البيانات وملفات RRD والإعدادات والمفاتيح. قد تثبّت ترقيات قاعدة البيانات تغييرات لا يمكن للتراجع على مستوى التطبيق إلغاؤها."
"Blocked": "محظور"
"Check": "الفحص"
"Check again": "فحص مرة أخرى"
"Check collection freshness and collector connectivity before enabling discovery.": "افحص حداثة جمع البيانات واتصال المجمّع قبل تفعيل الاكتشاف."
"Check requirements": "فحص المتطلبات"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "تقوم الفحوصات بفحص هذه العملية وصلاحيات نظام الملفات. ولا تكتب ملفات اختبار أو تتصل بالأجهزة."
