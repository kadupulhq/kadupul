"Preparing CSRF protection": "جارٍ تجهيز حماية CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "يعرض التقدّم آخر مرحلة مسجّلة. تحديث هذه الصفحة لا يبدأ تشغيل عامل ولا يعيد المحاولة أبداً."
"Recover stopped attempt": "استعادة المحاولة المتوقفة"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "تحتفظ الاستعادة بالاختيارات المحفوظة ولا تُنهي عاملاً نشطاً أبداً. راجع الخطة مرة أخرى قبل إعادة المحاولة."
"Review": "مراجعة"
"Review installation plan": "مراجعة خطة التثبيت"
"Run": "تشغيل"
"Run reviewed plan": "تشغيل الخطة المراجَعة"
"Save and review": "حفظ ومراجعة"
"Scope": "النطاق"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "الحالة غير متاحة. تم الاحتفاظ بالعمل المحفوظ. حدّث لإعادة الاتصال؛ لا ترسل طلب تثبيت آخر."
"Synchronizing collectors": "جارٍ مزامنة المجمّعات"
"Table conversions": "تحويلات الجداول"
"Templates": "القوالب"
"The database version matches this application. Installation does not establish that polling is healthy.": "إصدار قاعدة البيانات يتطابق مع هذا التطبيق. التثبيت لا يثبت أن الاستطلاع يعمل بشكل سليم."
"The request outcome is unknown. Check execution status before retrying.": "نتيجة الطلب غير معروفة. افحص حالة التنفيذ قبل إعادة المحاولة."
"Theme": "المظهر"
"Verify": "تحقق"
"Verify the poller schedule and service account.": "تحقق من جدول المستطلع وحساب الخدمة."
"Version change": "تغيير الإصدار"
"Waiting for the installation worker": "في انتظار عامل التثبيت"
"collector": "مجمّع"
"complete": "مكتمل"
"failed": "فشل"
"finish": "إنهاء"
"install": "تثبيت"
"not_started": "لم يبدأ"
