"Action": "Toiminto"
"Advanced options": "Lisäasetukset"
"Applying database upgrades": "Tietokantapäivityksiä otetaan käyttöön"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Varmuuskopioi tietokanta, RRD-tiedostot, asetukset ja avaimet. Tietokantapäivitykset voivat kirjata muutoksia, joita sovelluksen palautus ei voi kumota."
"Blocked": "Estetty"
"Check": "Tarkista"
"Check again": "Tarkista uudelleen"
"Check collection freshness and collector connectivity before enabling discovery.": "Tarkista keruun tuoreus ja kerääjän yhteys ennen etsinnän käyttöönottoa."
"Check requirements": "Tarkista vaatimukset"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Tarkistukset kohdistuvat tähän prosessiin ja tiedostojärjestelmän käyttöoikeuksiin. Ne eivät kirjoita testitiedostoja eivätkä ota yhteyttä laitteisiin."
"Collection profile": "Keruuprofiili"
"Collector": "Kerääjä"
"Configure": "Määritä"
"Configuring collection profiles": "Määritetään keruuprofiileja"
"Configuring discovery": "Määritetään etsintää"
"Configuring the local device": "Määritetään paikallista laitetta"
"Confirming database version": "Vahvistetaan tietokannan versiota"
"Converting selected tables": "Muunnetaan valittuja tauluja"
"Database version": "Tietokannan versio"
"Disabled": "Pois käytöstä"
"Discovery": "Etsintä"
"Discovery SNMP settings": "Etsinnän SNMP-asetukset"
"Discovery range": "Etsinnän alue"
"Enable discovery after installation": "Ota etsintä käyttöön asennuksen jälkeen"
"Executable paths": "Suoritettavien tiedostojen polut"
"Execution status": "Suorituksen tila"
"Finished execution": "Suoritus päättyi"
"Finishing tasks only. Schema migrations will not be replayed.": "Vain viimeistelytehtävät. Skeemamigraatioita ei ajeta uudelleen."
"I accept the license terms": "Hyväksyn lisenssiehdot"
"I authorize discovery of the displayed range": "Valtuutan näytetyn alueen etsinnän"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Olen tarkistanut lokin ja varmistanut, että edellinen työprosessi ja sen aliprosessit ovat pysähtyneet"
"I checked the previous attempt and accept that some changes may already be committed": "Olen tarkistanut edellisen yrityksen ja hyväksyn, että joitakin muutoksia on voitu jo kirjata"
"I reviewed this plan and have the required backups": "Olen tarkistanut tämän suunnitelman ja minulla on tarvittavat varmuuskopiot"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Jos työprosessi pysähtyy odottamatta, säilytä tiedosto log/cacti.log ja varmista, että sen prosessi on päättynyt, ennen kuin yrität uudelleen nimenomaisesti. Odotustila ei vahvista käynnistyksen onnistuneen."
"Importing templates": "Tuodaan malleja"
"Install Kadupul": "Asenna Kadupul"
"Installation and upgrade": "Asennus ja päivitys"
"Installation request was rejected.": "Asennuspyyntö hylättiin."
"Installation steps": "Asennusvaiheet"
"Installed": "Asennettu"
"Keep a backup of the database, RRD files, configuration and secret material.": "Säilytä varmuuskopio tietokannasta, RRD-tiedostoista, asetuksista ja salaisesta aineistosta."
"Language": "Kieli"
"Large tables may require the dedicated CLI conversion tool before installation.": "Suuret taulut voivat edellyttää erillistä CLI-muunnostyökalua ennen asennusta."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Jätä salaiset kentät tyhjiksi säilyttääksesi tallennetut tunnistetiedot. Salaisuuksia ei koskaan näytetä uudelleen."
"License": "Lisenssi"
"No action needed": "Ei toimenpiteitä"
"Observed": "Havaittu"
"Open the console": "Avaa konsoli"
"Operation": "Toiminto"
"Override discovery SNMP settings": "Ohita etsinnän SNMP-asetukset"
"Pass": "Läpäisty"
"Poller interval in seconds": "Pollaajan väli sekunteina"
"Preparing CSRF protection": "Valmistellaan CSRF-suojausta"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Edistyminen näyttää viimeksi kirjatun vaiheen. Sivun päivittäminen ei koskaan käynnistä tai yritä uudelleen työprosessia."
"Recover stopped attempt": "Palauta pysähtynyt yritys"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Palautus säilyttää tallennetut valinnat eikä koskaan lopeta elävää työprosessia. Tarkista suunnitelma uudelleen ennen uutta yritystä."
"Review": "Tarkastus"
"Review installation plan": "Tarkista asennussuunnitelma"
"Run": "Suorita"
"Run reviewed plan": "Suorita tarkistettu suunnitelma"
"Save and review": "Tallenna ja tarkista"
"Scope": "Laajuus"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Tila ei ole saatavilla. Tallennettu työ säilytetään. Päivitä sivu muodostaaksesi yhteyden uudelleen; älä lähetä toista asennusta."
"Synchronizing collectors": "Synkronoidaan kerääjiä"
"Table conversions": "Taulumuunnokset"
"Templates": "Mallit"
"The database version matches this application. Installation does not establish that polling is healthy.": "Tietokannan versio vastaa tätä sovellusta. Asennus ei osoita, että kysely toimii oikein."
"The request outcome is unknown. Check execution status before retrying.": "Pyynnön lopputulos on tuntematon. Tarkista suorituksen tila ennen uutta yritystä."
"Theme": "Teema"
"Verify": "Varmenna"
"Verify the poller schedule and service account.": "Varmista pollaajan aikataulu ja palvelutili."
"Version change": "Version muutos"
"Waiting for the installation worker": "Odotetaan asennuksen työprosessia"
"collector": "kerääjä"
"complete": "valmis"
"failed": "epäonnistui"
"finish": "viimeistele"
"install": "asenna"
"not_started": "ei aloitettu"
"partial": "osittainen"
"running": "käynnissä"
"succeeded": "onnistui"
"upgrade": "päivitä"
"waiting": "odottaa"
"Accept the license before saving the installation plan.": "Hyväksy lisenssi ennen asennussuunnitelman tallennusta."
"Invalid installation form.": "Virheellinen asennuslomake."
"Access denied.": "Pääsy estetty."
"Confirm the recovery warning before retrying.": "Vahvista palautusvaroitus ennen uutta yritystä."
"Review and confirm the current installation plan.": "Tarkista ja vahvista nykyinen asennussuunnitelma."
"Confirm the discovery scope before starting.": "Vahvista etsinnän laajuus ennen käynnistystä."
"Resolve the blocking checks before starting.": "Ratkaise estävät tarkistukset ennen käynnistystä."
"Too many installer options.": "Liian monta asennusohjelman asetusta."
"Invalid installer option name.": "Virheellinen asennusohjelman asetuksen nimi."
"Unknown or malformed installer option.": "Tuntematon tai virheellisesti muotoiltu asennusohjelman asetus."
"Installer options must be scalar values.": "Asennusohjelman asetusten on oltava skalaariarvoja."
"Installer option is too long or contains a null byte.": "Asennusohjelman asetus on liian pitkä tai sisältää null-tavun."
"Installer IDs and intervals must be whole numbers.": "Asennusohjelman tunnusten ja välien on oltava kokonaislukuja."
"Installer ID or interval is outside its supported range.": "Asennusohjelman tunnus tai väli on tuetun alueen ulkopuolella."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Asennusta ei voitu jatkaa. Lataa sen tila uudelleen ja tarkista estävät tarkistukset ennen uutta yritystä."
"Confirm that the previous worker has stopped before recovering its plan.": "Varmista, että edellinen työprosessi on pysähtynyt, ennen kuin palautat sen suunnitelman."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Tietokanta on asennettu, mutta jotkin kerääjät tarvitsevat vielä synkronointia. Yritä viimeistelytehtäviä uudelleen tilan tarkistuksen jälkeen."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Asennus pysähtyi. Säilytä asennusohjelman loki, korjaa syy ja vahvista uusi yritys nimenomaisesti. Joitakin tietokantamuutoksia on voitu jo kirjata. Tarkista lisäosien siivous ennen uuden yrityksen valtuuttamista."
"Next action": "Seuraava toimenpide"
"Follow the execution status. Do not start another attempt while a worker is active.": "Seuraa suorituksen tilaa. Älä aloita uutta yritystä, kun työprosessi on aktiivinen."
"Complete the recovery checklist before retrying.": "Suorita palautuksen tarkistuslista loppuun ennen uutta yritystä."
"Verify collection and graph operation before enabling discovery.": "Varmista keruun ja kaavioiden toiminta ennen etsinnän käyttöönottoa."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Ratkaise estetyt vaatimukset ja tarkista sitten uudelleen. Tallennetut valinnat säilytetään."
"Review the planned changes and backup checklist before authorizing execution.": "Tarkista suunnitellut muutokset ja varmuuskopioiden tarkistuslista ennen suorituksen valtuuttamista."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Valitse keruuprofiili ja hyväksy lisenssi. Valinnaiset asetukset voi avata tarvittaessa."
"Download installation diagnostics": "Lataa asennuksen diagnostiikkatiedot"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Avaa kaavio ja varmista, että sen RRD-data päivittyy kyselykierroksen jälkeen."
"Requirement details": "Vaatimusten tiedot"
"Recover": "Palauta"
"Recovery checklist": "Palautuksen tarkistuslista"
"Preserve log/cacti.log and record the failed attempt.": "Säilytä tiedosto log/cacti.log ja kirjaa epäonnistunut yritys."
"Confirm that the previous worker and its child processes have stopped.": "Varmista, että edellinen työprosessi ja sen aliprosessit ovat pysähtyneet."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Tarkista kirjatut muutokset, kerääjien synkronointi ja lisäosien siivous. Korjaa syy ennen uutta yritystä."
"Review the saved plan again, then explicitly authorize a retry.": "Tarkista tallennettu suunnitelma uudelleen ja valtuuta sitten uusi yritys nimenomaisesti."
"Recover a stopped worker": "Palauta pysähtynyt työprosessi"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Käytä palautusta vasta, kun olet varmistanut, ettei tämä yritys ole enää käynnissä. Palautus ei lopeta prosessia."
"Collector and installation mode": "Kerääjän ja asennuksen tila"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Käyttöönoton asetukset määrittävät kerääjän roolin ja tietokantayhteydet. Tarkista ensisijaisen palvelimen asetukset ennen kerääjän käynnistämistä."
"Discovery and SNMP settings": "Etsinnän ja SNMP:n asetukset"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Pidä etsintä pois käytöstä, kunnes keruu ja kerääjän yhteys on varmennettu."
"Template selection": "Mallien valinta"
"Templates selected for import": "Tuotavaksi valitut mallit"
"No templates selected.": "Malleja ei valittu."
"Backup checklist": "Varmuuskopioiden tarkistuslista"
"Database backup and a tested restoration procedure.": "Tietokannan varmuuskopio ja testattu palautusmenettely."
"RRD files and the service account permissions needed to restore them.": "RRD-tiedostot ja niiden palauttamiseen tarvittavat palvelutilin käyttöoikeudet."
"Configuration, keys and plugin data outside the database.": "Asetukset, avaimet ja lisäosien data tietokannan ulkopuolella."
"Post-installation checks": "Asennuksen jälkeiset tarkistukset"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Varmennetut tarkistukset kattavat vain näytetyn todistusaineiston. Arvioimattomat tarkistukset edellyttävät edelleen operaattorin varmennusta."
"Operational checks still require operator verification.": "Toiminnalliset tarkistukset edellyttävät edelleen operaattorin varmennusta."
"Status": "Tila"
"verified": "Varmennettu"
"action_required": "Toimenpide vaaditaan"
"not_assessed": "Ei arvioitu"
"Database schema": "Tietokannan skeema"
"Stored schema matches the application target.": "Tallennettu skeema vastaa sovelluksen tavoiteskeemaa."
"Target schema completion has not been confirmed.": "Tavoiteskeeman valmistumista ei ole vahvistettu."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Tarkista asennuksen lopputulos ja ratkaise virheet, ennen kuin pidät skeemapäivitystä valmiina."
"Installation outcome": "Asennuksen lopputulos"
"A successful receipt matches the current target schema.": "Onnistunut kuitti vastaa nykyistä tavoiteskeemaa."
"A complete successful installation outcome has not been confirmed.": "Täydellistä onnistunutta asennuksen lopputulosta ei ole vahvistettu."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Säilytä asennusohjelman loki ja käytä tarvittaessa nimenomaista palautus- tai uudelleenyrityskäytäntöä."
"Collector synchronization": "Kerääjän synkronointi"
"The completed installer reports pending collector synchronization.": "Valmistunut asennusohjelma ilmoittaa kerääjän synkronoinnin olevan kesken."
"The completed installer reports no pending collectors.": "Valmistunut asennusohjelma ilmoittaa, ettei keskeneräisiä kerääjiä ole."
"Collector completion remains unconfirmed by this partial receipt.": "Tämä osittainen kuitti ei vahvista kerääjän valmistumista."
"Collector completion is not established by this installation outcome.": "Tämä asennuksen lopputulos ei vahvista kerääjän valmistumista."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Tarkista kerääjän tila ja yritä osittaisten lopputulosten viimeistelytehtäviä uudelleen. Tämä ei varmista myöhempää keruun tuoreutta."
"Scheduled collection": "Ajastettu keruu"
"No poller or device was contacted by this assessment.": "Tämä arvio ei ottanut yhteyttä pollaajaan tai laitteisiin."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Varmista, että määritetty ajastin ajaa pollaajaa aiotulla palvelutilillä, ja tarkista sen seuraava normaali kierros."
"Graph data": "Kaavioiden data"
"Live samples and RRD updates were not exercised.": "Reaaliaikaisia näytteitä ja RRD-päivityksiä ei kokeiltu."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Varmista normaalin keruukierroksen jälkeen, että odotetut kaaviot saavat tuoreita näytteitä, ja tarkista pollaajan virheet."
"Recovery readiness": "Palautusvalmius"
"Backup restoration was not exercised.": "Varmuuskopion palautusta ei kokeiltu."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Varmista tietokannan, RRD-tiedostojen, asetusten ja avainaineiston palautus eristetyssä ympäristössä, ennen kuin luotat palautukseen."
"No persisted local poller start has been recorded.": "Pysyvää paikallisen pollaajan käynnistystä ei ole kirjattu."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Tallennettu pollaajan ajoitus on virheellinen, eikä se voi osoittaa ajastimen toimivuutta."
"The recorded poller start is in the future. Check clock synchronization.": "Kirjattu pollaajan käynnistys on tulevaisuudessa. Tarkista kellon synkronointi."
"The recorded poller start is older than the native scheduling tolerance.": "Kirjattu pollaajan käynnistys on vanhempi kuin natiivin ajoituksen toleranssi."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Paikallisen pollaajan käynnistys kirjattiin natiivin ajoituksen toleranssin sisällä. Valmistumista ja laitteiden tilaa ei ole varmennettu."
"readable": "luettavissa"
"missing or unreadable": "puuttuu tai ei ole luettavissa"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Palauta täydellinen julkaisu ja sen lukitut riippuvuudet; anna palvelutilille lukuoikeus."
"PHP temporary directory": "PHP:n väliaikaishakemisto"
"directory writable by this process": "hakemisto, johon tällä prosessilla on kirjoitusoikeus"
"missing or not writable": "puuttuu tai ei ole kirjoitettavissa"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Määritä sys_temp_dir olemassa olevaksi hakemistoksi, johon asennustilillä on kirjoitusoikeus. Natiivit tuonnit käyttävät väliaikaistiedostoja."
"Background worker launch": "Taustatyöprosessin käynnistys"
"required PHP functions available; launch not exercised": "tarvittavat PHP-funktiot saatavilla; käynnistystä ei kokeiltu"
"required PHP launch function disabled": "tarvittava PHP:n käynnistysfunktio on poistettu käytöstä"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Ota exec käyttöön web-PHP-ympäristössä tai käytä valtuutettua CLI-asennusohjelmaa."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Ota popen ja pclose käyttöön web-PHP-ympäristössä tai käytä valtuutettua CLI-asennusohjelmaa."
"Database transaction ownership": "Tietokantatransaktion omistajuus"
"autocommit enabled; no caller-owned transaction": "autocommit käytössä; ei kutsujan omistamaa transaktiota"
"autocommit disabled or caller transaction active": "autocommit pois käytöstä tai kutsujan transaktio aktiivinen"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Suorita asennus kutsujan omistaman transaktion ulkopuolella ja ota autocommit käyttöön sen muutosyhteydellä."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Palauta julkaisuhakemisto ja anna asennustilille kirjoitusoikeus malliresurssien tuontia varten. Älä anna kaikille kirjoitusoikeutta."
"Worker file: install/background.php": "Työprosessin tiedosto: install/background.php"
"Worker file: bin/legacy-installer.php": "Työprosessin tiedosto: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Työprosessin tiedosto: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Tuonnin kohde: resource/snmp_queries"
"Import destination: resource/script_server": "Tuonnin kohde: resource/script_server"
"Import destination: resource/script_queries": "Tuonnin kohde: resource/script_queries"
"Import destination: scripts": "Tuonnin kohde: scripts"
"Database privileges": "Tietokannan oikeudet"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Voimassa olevia migraatio-oikeuksia, mukaan lukien aktiiviset roolit ja objektikohtaiset oikeudet, ei varmennettu."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Pyydä tietokannan ylläpitäjää varmentamaan asennustilin tarvittavat taulukirjoitukset, skeemamuutokset, liipaisimet ja rutiinit skeemassa. Älä anna yleisiä ylläpitäjän oikeuksia."
"Compare web and worker runtimes": "Vertaa web- ja työprosessiympäristöjä"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tämä käynnistää nimenomaisesti lyhyen vain luku -tilaisen PHP-kokeen. Se ei varaa asennusohjelmaa, kirjoita tiedostoja tai ota yhteyttä laitteisiin."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Koe perii tämän web-prosessin ja käyttää määritettyä asennusohjelman PHP-tulkkia. Se ei tarkista erillistä ajastinta tai palvelua."
"I authorize the read-only worker runtime comparison.": "Valtuutan vain luku -tilaisen työprosessiympäristön vertailun."
"Compare runtimes": "Vertaa ympäristöjä"
"Runtime comparison results": "Ympäristöjen vertailun tulokset"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Oikeus- ja identiteettierot voivat olla tarkoituksellisia. Vain luku -havainnot eivät todista, että kirjoitukset tai asennus onnistuvat."
"Confirm the read-only worker runtime comparison.": "Vahvista vain luku -tilainen työprosessiympäristön vertailu."
"The runtime comparison is unavailable.": "Ympäristöjen vertailu ei ole käytettävissä."
"Shared application secret": "Jaettu sovellussalaisuus"
"A strong web application secret is required before comparison.": "Vahva web-sovelluksen salaisuus vaaditaan ennen vertailua."
"Runtime comparison": "Ympäristöjen vertailu"
"The configured worker runtime did not confirm a bounded comparison.": "Määritetty työprosessiympäristö ei vahvistanut rajattua vertailua."
"The inherited worker secret could not be confirmed against the web secret.": "Peritty työprosessin salaisuus ei vahvistunut web-salaisuutta vasten."
"PHP runtime comparison": "PHP-ympäristön vertailu"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Molempien ympäristöjen on tuettava PHP 8.4:ää; poikkeavat korjausversiot on tarkistettava."
"Required extension comparison": "Tarvittavien laajennusten vertailu"
"Required extension availability is checked; differing versions require review.": "Tarvittavien laajennusten saatavuus tarkistetaan; poikkeavat versiot on tarkistettava."
"Process identity comparison": "Prosessin identiteetin vertailu"
"Effective process identity is unavailable on this platform.": "Prosessin voimassa oleva identiteetti ei ole saatavilla tällä alustalla."
"Effective process identities match.": "Prosessien voimassa olevat identiteetit vastaavat toisiaan."
"Effective process identities differ; separate service accounts may be intentional.": "Prosessien voimassa olevat identiteetit eroavat toisistaan; erilliset palvelutilit voivat olla tarkoituksellisia."
"Directory access comparison": "Hakemistojen käyttöoikeuksien vertailu"
"Read-only directory permission observations match.": "Vain luku -tilaiset hakemistojen käyttöoikeushavainnot vastaavat toisiaan."
"Directory locations or permission observations differ; review the service-account roles.": "Hakemistojen sijainnit tai käyttöoikeushavainnot eroavat; tarkista palvelutilien roolit."
"Worker directory read and traversal": "Työprosessin hakemistojen luku ja läpikäynti"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Tarvittavien työprosessin hakemistojen on oltava olemassa, ja niiden on sallittava luku ja läpikäynti. Kirjoituksia ei testattu."
"The inherited worker secret matches the web secret for this private challenge.": "Peritty työprosessin salaisuus vastaa web-salaisuutta tässä yksityisessä haasteessa."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Tarkista määritetty PHP-tulkki, tarvittavat laajennukset, peritty salaisuus ja palvelutilien hakemistojen käyttöoikeudet. Kirjoituksia tai asennusohjelman käynnistystä ei kokeiltu."
"advisory": "ohjeellinen"
