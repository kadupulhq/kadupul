"A useful name for this Rule.": "આ નિયમ માટે ઉપયોગી નામ."
"Access denied.": "પ્રવેશ નકારવામાં આવ્યો."
"Add Graph Rule": "ગ્રાફ નિયમ ઉમેરો"
"Back to Graph Rules": "ગ્રાફ નિયમો પર પાછા જાઓ"
"Cancel": "રદ કરો"
"Check this box to enable this rule.": "આ નિયમ સક્ષમ કરવા આ બૉક્સ ચેક કરો."
"Choose a Data Query to apply to this rule.": "આ નિયમ પર લાગુ કરવા માટે ડેટા ક્વેરી પસંદ કરો."
"Choose a Graph Type": "ગ્રાફ પ્રકાર પસંદ કરો"
"Choose a Graph Type of the selected Data Query.": "પસંદ કરેલ ડેટા ક્વેરીનો ગ્રાફ પ્રકાર પસંદ કરો."
"Choose an existing Data Query.": "હાલની ડેટા ક્વેરી પસંદ કરો."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "આ નિયમ પર લાગુ કરવા માટે પસંદ કરેલ ડેટા ક્વેરીના કોઈપણ ઉપલબ્ધ ગ્રાફ પ્રકાર પસંદ કરો."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "નીચેના ગ્રાફ નિયમો તેમની ઉપકરણ પસંદગી અને ગ્રાફ બનાવટ માપદંડ સાથે કાઢી નાખવા માટે ચાલુ રાખો પર ક્લિક કરો."
"Click Continue to disable the following Graph Rules.": "નીચેના ગ્રાફ નિયમો અક્ષમ કરવા માટે ચાલુ રાખો પર ક્લિક કરો."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "નીચેના ગ્રાફ નિયમોની નકલ કરવા માટે ચાલુ રાખો પર ક્લિક કરો. તમે નવા ગ્રાફ નિયમો માટે શીર્ષક ફોર્મેટ વૈકલ્પિક રીતે બદલી શકો છો, જે અક્ષમ તરીકે શરૂ થાય છે."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "નીચેના ગ્રાફ નિયમો સક્ષમ કરવા માટે ચાલુ રાખો પર ક્લિક કરો. ખાતરી કરો કે તેમનું સફળતાપૂર્વક પરીક્ષણ થયું છે."
