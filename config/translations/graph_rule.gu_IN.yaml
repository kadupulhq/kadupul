"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "પહેલાં નિયમ સાચવો; તેની ઉપકરણ પસંદગી અને ગ્રાફ બનાવટ માપદંડ પછીથી ઉમેરવામાં આવે છે."
"Select": "પસંદ કરો"
"Select %name%": "%name% પસંદ કરો"
"Select at least one Graph Rule.": "ઓછામાં ઓછો એક ગ્રાફ નિયમ પસંદ કરો."
"Select at most 100 Graph Rules at a time.": "એક સમયે વધુમાં વધુ 100 ગ્રાફ નિયમો પસંદ કરો."
"Select up to %count% rows at a time.": "એક સમયે %count% પંક્તિઓ સુધી પસંદ કરો."
"The graph rule changed since you opened this form. Reload before saving.": "તમે આ ફોર્મ ખોલ્યું ત્યારથી ગ્રાફ નિયમ બદલાયો છે. સાચવતા પહેલાં ફરીથી લોડ કરો."
"The name format must give every copy a name of 1 to 255 characters.": "નામ ફોર્મેટે દરેક નકલને 1 થી 255 અક્ષરોનું નામ આપવું જોઈએ."
"Title Format": "શીર્ષક ફોર્મેટ"
"Unable to load Graph Rules. Reload before retrying.": "ગ્રાફ નિયમો લોડ કરી શકાયા નથી. ફરી પ્રયાસ કરતા પહેલાં ફરીથી લોડ કરો."
"Unable to load the graph rule. Reload before retrying.": "ગ્રાફ નિયમ લોડ કરી શકાયો નથી. ફરી પ્રયાસ કરતા પહેલાં ફરીથી લોડ કરો."
"Unexpected fields were submitted.": "અનપેક્ષિત ફીલ્ડ્સ સબમિટ કરવામાં આવ્યા."
