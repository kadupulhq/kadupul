"A useful name for this Rule.": "ഈ നിയമത്തിന് ഉപയോഗപ്രദമായ ഒരു പേര്."
"Access denied.": "ആക്സസ് നിഷേധിച്ചു."
"Add Graph Rule": "ഗ്രാഫ് നിയമം ചേർക്കുക"
"Back to Graph Rules": "ഗ്രാഫ് നിയമങ്ങളിലേക്ക് മടങ്ങുക"
"Cancel": "റദ്ദാക്കുക"
"Check this box to enable this rule.": "ഈ നിയമം പ്രവർത്തനക്ഷമമാക്കാൻ ഈ ബോക്സ് തിരഞ്ഞെടുക്കുക."
"Choose a Data Query to apply to this rule.": "ഈ നിയമത്തിൽ പ്രയോഗിക്കേണ്ട ഒരു ഡാറ്റ ക്വറി തിരഞ്ഞെടുക്കുക."
"Choose a Graph Type": "ഒരു ഗ്രാഫ് തരം തിരഞ്ഞെടുക്കുക"
"Choose a Graph Type of the selected Data Query.": "തിരഞ്ഞെടുത്ത ഡാറ്റ ക്വറിയുടെ ഒരു ഗ്രാഫ് തരം തിരഞ്ഞെടുക്കുക."
"Choose an existing Data Query.": "നിലവിലുള്ള ഒരു ഡാറ്റ ക്വറി തിരഞ്ഞെടുക്കുക."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "ഈ നിയമത്തിൽ പ്രയോഗിക്കാൻ തിരഞ്ഞെടുത്ത ഡാറ്റ ക്വറിയുടെ ലഭ്യമായ ഏതെങ്കിലും ഗ്രാഫ് തരം തിരഞ്ഞെടുക്കുക."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "ഇനിപ്പറയുന്ന ഗ്രാഫ് നിയമങ്ങളും അവയുടെ ഉപകരണ തിരഞ്ഞെടുപ്പ്, ഗ്രാഫ് സൃഷ്ടി മാനദണ്ഡങ്ങളും ഇല്ലാതാക്കാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക."
"Click Continue to disable the following Graph Rules.": "ഇനിപ്പറയുന്ന ഗ്രാഫ് നിയമങ്ങൾ പ്രവർത്തനരഹിതമാക്കാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "ഇനിപ്പറയുന്ന ഗ്രാഫ് നിയമങ്ങൾ ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക. പ്രവർത്തനരഹിതമായി ആരംഭിക്കുന്ന പുതിയ ഗ്രാഫ് നിയമങ്ങളുടെ ശീർഷക ഫോർമാറ്റ് ഓപ്ഷണലായി മാറ്റാം."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "ഇനിപ്പറയുന്ന ഗ്രാഫ് നിയമങ്ങൾ പ്രവർത്തനക്ഷമമാക്കാൻ തുടരുക ക്ലിക്ക് ചെയ്യുക. അവ വിജയകരമായി പരീക്ഷിച്ചിട്ടുണ്ടെന്ന് ഉറപ്പാക്കുക."
"Continue": "തുടരുക"
"Data Query": "ഡാറ്റ ക്വറി"
"Delete Graph Rules": "ഗ്രാഫ് നിയമങ്ങൾ ഇല്ലാതാക്കുക"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "ഇല്ലാതാക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ഗ്രാഫ് നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Delete selected": "തിരഞ്ഞെടുത്തത് ഇല്ലാതാക്കുക"
"Device Selection and Graph Creation Criteria": "ഉപകരണ തിരഞ്ഞെടുപ്പും ഗ്രാഫ് സൃഷ്ടി മാനദണ്ഡങ്ങളും"
"Disable Graph Rules": "ഗ്രാഫ് നിയമങ്ങൾ പ്രവർത്തനരഹിതമാക്കുക"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "പ്രവർത്തനരഹിതമാക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ഗ്രാഫ് നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Disable selected": "തിരഞ്ഞെടുത്തത് പ്രവർത്തനരഹിതമാക്കുക"
"Duplicate Graph Rules": "ഗ്രാഫ് നിയമങ്ങൾ ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യുക"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ഗ്രാഫ് നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Duplicate selected": "തിരഞ്ഞെടുത്തത് ഡ്യൂപ്ലിക്കേറ്റ് ചെയ്യുക"
"Edit Graph Rule": "ഗ്രാഫ് നിയമം തിരുത്തുക"
"Enable Graph Rules": "ഗ്രാഫ് നിയമങ്ങൾ പ്രവർത്തനക്ഷമമാക്കുക"
"Enable Rule": "നിയമം പ്രവർത്തനക്ഷമമാക്കുക"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "പ്രവർത്തനക്ഷമമാക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് ഗ്രാഫ് നിയമ ലിസ്റ്റ് പരിശോധിക്കുക."
"Enable selected": "തിരഞ്ഞെടുത്തത് പ്രവർത്തനക്ഷമമാക്കുക"
"Enter a name.": "ഒരു പേര് നൽകുക."
"Enter a valid name format.": "സാധുവായ ഒരു പേര് ഫോർമാറ്റ് നൽകുക."
"Enter at most %count% characters.": "പരമാവധി %count% അക്ഷരങ്ങൾ നൽകുക."
"Enter single-line text.": "ഒറ്റ വരി ടെക്സ്റ്റ് നൽകുക."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "ഓരോ <rule_name> ഉം പകർത്തുന്ന ഗ്രാഫ് നിയമത്തിന്റെ പേര് ഉപയോഗിച്ച് മാറ്റിസ്ഥാപിക്കപ്പെടും."
"Graph Type": "ഗ്രാഫ് തരം"
"Graph rule not found.": "ഗ്രാഫ് നിയമം കണ്ടെത്തിയില്ല."
"Graph rule saved.": "ഗ്രാഫ് നിയമം സംരക്ഷിച്ചു."
"Invalid Graph Rule selection.": "അസാധുവായ ഗ്രാഫ് നിയമ തിരഞ്ഞെടുപ്പ്."
"Name": "പേര്"
"One or more selected Graph Rules no longer exist.": "തിരഞ്ഞെടുത്ത ഒന്നോ അതിലധികമോ ഗ്രാഫ് നിയമങ്ങൾ ഇപ്പോൾ നിലവിലില്ല."
"Rule Selection [edit: %name%]": "നിയമ തിരഞ്ഞെടുപ്പ് [തിരുത്തൽ: %name%]"
"Rule Selection [new]": "നിയമ തിരഞ്ഞെടുപ്പ് [പുതിയത്]"
"Save": "സംരക്ഷിക്കുക"
"Save outcome is uncertain. Reload before retrying.": "സംരക്ഷിക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "ആദ്യം നിയമം സംരക്ഷിക്കുക; അതിന്റെ ഉപകരണ തിരഞ്ഞെടുപ്പ്, ഗ്രാഫ് സൃഷ്ടി മാനദണ്ഡങ്ങൾ പിന്നീട് ചേർക്കുന്നു."
"Select": "തിരഞ്ഞെടുക്കുക"
"Select %name%": "%name% തിരഞ്ഞെടുക്കുക"
"Select at least one Graph Rule.": "കുറഞ്ഞത് ഒരു ഗ്രാഫ് നിയമം തിരഞ്ഞെടുക്കുക."
"Select at most 100 Graph Rules at a time.": "ഒരു സമയം പരമാവധി 100 ഗ്രാഫ് നിയമങ്ങൾ തിരഞ്ഞെടുക്കുക."
"Select up to %count% rows at a time.": "ഒരു സമയം %count% വരികൾ വരെ തിരഞ്ഞെടുക്കുക."
"The graph rule changed since you opened this form. Reload before saving.": "നിങ്ങൾ ഈ ഫോം തുറന്നതിന് ശേഷം ഗ്രാഫ് നിയമം മാറി. സംരക്ഷിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The name format must give every copy a name of 1 to 255 characters.": "പേര് ഫോർമാറ്റ് ഓരോ പകർപ്പിനും 1 മുതൽ 255 വരെ അക്ഷരങ്ങളുള്ള പേര് നൽകണം."
"Title Format": "ശീർഷക ഫോർമാറ്റ്"
"Unable to load Graph Rules. Reload before retrying.": "ഗ്രാഫ് നിയമങ്ങൾ ലോഡ് ചെയ്യാനായില്ല. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"Unable to load the graph rule. Reload before retrying.": "ഗ്രാഫ് നിയമം ലോഡ് ചെയ്യാനായില്ല. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"Unexpected fields were submitted.": "പ്രതീക്ഷിക്കാത്ത ഫീൽഡുകൾ സമർപ്പിച്ചു."
