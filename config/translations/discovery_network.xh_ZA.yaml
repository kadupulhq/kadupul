"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Uluhlu olwahlulwe ngezithuba lweeSeva ze-DNS ezizezinye eziza kusetyenziswa ukusombulula i-DNS. Ukuba akukho nto, i-OS ye-poller iya kusetyenziswa ukusombulula amagama e-DNS."
