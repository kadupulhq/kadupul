"About Kadupul": "Kadupul-നെക്കുറിച്ച്"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "നെറ്റ്‌വർക്ക് നിരീക്ഷണത്തിനും ടൈം-സീരീസ് ഗ്രാഫിംഗിനുമുള്ള ഒരു സ്വതന്ത്ര ഓപ്പൺ-സോഴ്സ് പ്രോജക്റ്റാണ് Kadupul."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "വികസനം, സംഭാവനകൾ, റിലീസ് തീരുമാനങ്ങൾ എന്നിവ Kadupul ഓർഗനൈസേഷനാണ് കൈകാര്യം ചെയ്യുന്നത്."
"For documentation and support, visit the Kadupul project.": "ഡോക്യുമെന്റേഷനും പിന്തുണയ്ക്കും Kadupul പ്രോജക്റ്റ് സന്ദർശിക്കുക."
