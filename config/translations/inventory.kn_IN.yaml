"Confirm clearing statistics": "ಅಂಕಿಅಂಶಗಳನ್ನು ತೆರವುಗೊಳಿಸುವುದನ್ನು ದೃಢೀಕರಿಸಿ"
"Selected device statistics cleared.": "ಆಯ್ದ ಸಾಧನ ಅಂಕಿಅಂಶಗಳನ್ನು ತೆರವುಗೊಳಿಸಲಾಗಿದೆ."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "ಈ ಸಾಧನಗಳ ಪ್ರತಿಕ್ರಿಯೆ ಸಮಯ, ಪೋಲ್ ಎಣಿಕೆಗಳು ಮತ್ತು ಲಭ್ಯತೆಯನ್ನು ಮರುಹೊಂದಿಸಿ. ಗ್ರಾಫ್‌ಗಳು, ಐತಿಹಾಸಿಕ ಡೇಟಾ ಮತ್ತು ಸಾಧನ ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳಲಾಗುತ್ತದೆ. ಮುಂದಿನ ಪೋಲ್‌ನೊಂದಿಗೆ ಅಂಕಿಅಂಶಗಳು ಮುಂದುವರಿಯುತ್ತವೆ."
"Synchronize device templates": "ಸಾಧನ ಟೆಂಪ್ಲೇಟ್‌ಗಳನ್ನು ಸಿಂಕ್ರೊನೈಸ್ ಮಾಡಿ"
"Confirm synchronization": "ಸಿಂಕ್ರೊನೈಸೇಶನ್ ಅನ್ನು ದೃಢೀಕರಿಸಿ"
"Selected device templates synchronized.": "ಆಯ್ದ ಸಾಧನ ಟೆಂಪ್ಲೇಟ್‌ಗಳನ್ನು ಸಿಂಕ್ರೊನೈಸ್ ಮಾಡಲಾಗಿದೆ."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "ಈ ಸಾಧನಗಳಿಗೆ ಪ್ರಸ್ತುತ ನಿಯೋಜಿಸಿದ ಟೆಂಪ್ಲೇಟ್‌ಗಳನ್ನು ಅನ್ವಯಿಸಿ. ಕಾಣೆಯಾದ ಗ್ರಾಫ್ ಮತ್ತು ಡೇಟಾ ಕ್ವೆರಿ ಸಂಬಂಧಗಳನ್ನು ಸೇರಿಸಲಾಗುತ್ತದೆ, ಮತ್ತು ಬಳಕೆಯಾಗದ ಗ್ರಾಫ್ ಟೆಂಪ್ಲೇಟ್ ಸಂಬಂಧಗಳನ್ನು ತೆಗೆದುಹಾಕಬಹುದು. ಟೆಂಪ್ಲೇಟ್ ಇಲ್ಲದ ಸಾಧನಗಳನ್ನು ಬಿಟ್ಟುಬಿಡಲಾಗುತ್ತದೆ. ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಗ್ರಾಫ್‌ಗಳು ಮತ್ತು ಐತಿಹಾಸಿಕ ಡೇಟಾವನ್ನು ಉಳಿಸಿಕೊಳ್ಳಲಾಗುತ್ತದೆ; ಆಟೋಮೇಶನ್ ಹೊಸ ಗ್ರಾಫ್‌ಗಳನ್ನು ರಚಿಸಬಹುದು."
