"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "ಆಯ್ದ ಸಾಧನಗಳು ಅಥವಾ ಅವುಗಳ ಗ್ರಾಫ್‌ಗಳು ಮತ್ತು ಡೇಟಾ ಮೂಲಗಳು ಬದಲಾಗಿವೆ. ಸಾಧನಗಳನ್ನು ತೆಗೆದುಹಾಕುವ ಮೊದಲು ದೃಢೀಕರಣವನ್ನು ಮರುಲೋಡ್ ಮಾಡಿ."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "ಗ್ರಾಫ್‌ಗಳು ಮತ್ತು ಡೇಟಾ ಮೂಲಗಳನ್ನು ತೆಗೆದುಹಾಕುವ ಮೊದಲು ಹಂಚಿಕೆಯ ಡೇಟಾ ಮೂಲಗಳು ಅಥವಾ ಸಮುಚ್ಚಯ ಗ್ರಾಫ್‌ಗಳನ್ನು ಬೇರ್ಪಡಿಸಬೇಕು."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "ಸಾಧನ ತೆಗೆದುಹಾಕುವಿಕೆಯ ಫಲಿತಾಂಶ ಖಚಿತವಿಲ್ಲ. ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಆಯ್ದ ಸಾಧನಗಳು, ಗ್ರಾಫ್‌ಗಳು ಮತ್ತು ಡೇಟಾ ಮೂಲಗಳನ್ನು ಪರಿಶೀಲಿಸಿ."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "ಸಾಧನ ತೆಗೆದುಹಾಕುವಿಕೆಯನ್ನು ಇಲ್ಲಿ ರದ್ದುಗೊಳಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಗ್ರಾಫ್‌ಗಳು ಮತ್ತು ನಿಷ್ಕ್ರಿಯ ಡೇಟಾ ಮೂಲಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳಬೇಕೇ ಅಥವಾ ತೆಗೆದುಹಾಕಬೇಕೇ ಎಂಬುದನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "ಗ್ರಾಫ್ ತೆಗೆದುಹಾಕುವ ಮೊದಲು ಹಂಚಿಕೆಯ ಡೇಟಾ ಮೂಲಗಳು ಮತ್ತು ಸಮುಚ್ಚಯ ಗ್ರಾಫ್‌ಗಳನ್ನು ಬೇರ್ಪಡಿಸಬೇಕು. ಉಳಿಸಿಕೊಂಡ ಗ್ರಾಫ್‌ಗಳು ಮತ್ತು ಡೇಟಾ ಮೂಲಗಳು ನಿಯೋಜಿಸದಂತಾಗುತ್ತವೆ."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "ಬಾಧಿತ ರಿಮೋಟ್ ಸಂಗ್ರಾಹಕಗಳು ಆನ್‌ಲೈನ್‌ನಲ್ಲಿರಬೇಕು. ವಿಫಲ ತೆಗೆದುಹಾಕುವಿಕೆಯು ರಿಮೋಟ್ ಅಥವಾ ಪ್ಲಗಿನ್ ಬದಲಾವಣೆಗಳನ್ನು ಉಳಿಸಿರಬಹುದು; ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಫಲಿತಾಂಶವನ್ನು ಪರಿಶೀಲಿಸಿ."
"RRD file cleanup follows the configured maintenance policy.": "RRD ಫೈಲ್ ಸ್ವಚ್ಛಗೊಳಿಸುವಿಕೆಯು ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ ನಿರ್ವಹಣಾ ನೀತಿಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ."
