"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "ಗುರುತು ಹಾಕಿದ ಆಯ್ಕೆಗಳನ್ನು ಮಾತ್ರ ಬದಲಾಯಿಸಲಾಗುತ್ತದೆ. ಗುರುತು ಹಾಕದ ಆಯ್ಕೆಗಳು ತಮ್ಮ ಪ್ರಸ್ತುತ ಮೌಲ್ಯಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತವೆ. ಖಾಲಿ ಸ್ಥಳವನ್ನು ಆಯ್ಕೆಮಾಡಿದರೆ ಅದನ್ನು ತೆರವುಗೊಳಿಸಲಾಗುತ್ತದೆ."
