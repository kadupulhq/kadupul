"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "ಆಯ್ದ ನಿಯೋಜನೆಯನ್ನು ಪಟ್ಟಿ ಮಾಡಿದ ಪ್ರತಿ ಸಾಧನಕ್ಕೂ ಅನ್ವಯಿಸಲಾಗುತ್ತದೆ. ಟೆಂಪ್ಲೇಟ್ ಬದಲಾವಣೆಗಳು ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಗ್ರಾಫ್‌ಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತವೆ; ಆಟೋಮೇಶನ್ ಹೊಸ ಗ್ರಾಫ್‌ಗಳನ್ನು ರಚಿಸಬಹುದು. ಸಂಗ್ರಾಹಕ ಬದಲಾವಣೆಗಳು ಪೋಲಿಂಗ್ ಮಾಲೀಕತ್ವವನ್ನು ವರ್ಗಾಯಿಸುತ್ತವೆ."
