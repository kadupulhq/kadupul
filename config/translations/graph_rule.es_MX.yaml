"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Haga clic en Continuar para duplicar las siguientes reglas de gráficas. Opcionalmente puede cambiar el formato de título de las nuevas reglas de gráficas, las cuales inician deshabilitadas."
