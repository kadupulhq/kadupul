"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Cliquez sur Continuer pour supprimer les règles de graphique suivantes avec leurs critères de sélection des équipements et de création de graphiques."
"Click Continue to disable the following Graph Rules.": "Cliquez sur Continuer pour désactiver les règles de graphique suivantes."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Cliquez sur Continuer pour dupliquer les règles de graphique suivantes. Vous pouvez éventuellement modifier le format du titre des nouvelles règles de graphique, qui sont créées désactivées."
