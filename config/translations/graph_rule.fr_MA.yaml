"A useful name for this Rule.": "Un nom utile pour cette règle."
"Access denied.": "Accès refusé."
"Add Graph Rule": "Ajouter une règle de graphique"
"Back to Graph Rules": "Retour aux règles de graphique"
"Cancel": "Annuler"
"Check this box to enable this rule.": "Cochez cette case pour activer cette règle."
"Choose a Data Query to apply to this rule.": "Sélectionnez une requête de données à appliquer à cette règle."
"Choose a Graph Type": "Choisissez un type de graphique"
"Choose a Graph Type of the selected Data Query.": "Choisissez un type de graphique de la requête de données sélectionnée."
"Choose an existing Data Query.": "Choisissez une requête de données existante."
