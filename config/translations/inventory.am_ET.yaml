"This legacy form has expired. Open Devices and submit a new form.": "ይህ የቆየ ቅጽ ጊዜው አልፎበታል። መሣሪያዎችን ይክፈቱ እና አዲስ ቅጽ ያስገቡ።"
"Open Devices and use its current forms.": "መሣሪያዎችን ክፈት እና የአሁኑን ቅጾቹን ተጠቀም።"
"Not up": "አልተነሳም"
