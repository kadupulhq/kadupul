"Apply device automation rules": "የመሣሪያ አውቶሜሽን ደንቦችን ተግብር"
"Confirm applying automation rules": "የአውቶሜሽን ደንቦችን መተግበርን አረጋግጥ"
"Device automation rules applied.": "የመሣሪያ አውቶሜሽን ደንቦች ተተግብረዋል።"
"Apply existing graph and tree automation rules to the selected devices. Rules may create graphs, data sources and tree entries.": "ነባር የግራፍ እና የዛፍ አውቶሜሽን ደንቦችን በተመረጡት መሣሪያዎች ላይ ተግብር። ደንቦች ግራፎችን፣ የውሂብ ምንጮችን እና የዛፍ ግቤቶችን ሊፈጥሩ ይችላሉ።"
"Only checked SNMP settings are changed. Unchecked settings and credentials retain their current values.": "ምልክት የተደረገባቸው የSNMP ቅንብሮች ብቻ ይቀየራሉ። ምልክት ያልተደረገባቸው ቅንብሮች እና ምስክርነቶች የአሁኑን እሴቶቻቸውን ይይዛሉ።"
"Select at least one supported SNMP setting.": "ቢያንስ አንድ የሚደገፍ የSNMP ቅንብር ይምረጡ።"
