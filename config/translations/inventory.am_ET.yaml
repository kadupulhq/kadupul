"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "ግራፉን ከማስወገድዎ በፊት የተጋሩ የውሂብ ምንጮች እና ጥምር ግራፎች መለየት አለባቸው። የተያዙ ግራፎች እና የውሂብ ምንጮች ያልተመደቡ ይሆናሉ።"
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "ተጽዕኖ የደረሰባቸው የርቀት ሰብሳቢዎች በመስመር ላይ መሆን አለባቸው። ያልተሳካ ማስወገድ የርቀት ወይም የተሰኪ ለውጦችን ሊተው ይችላል፤ እንደገና ከመሞከርዎ በፊት ውጤቱን ይመርምሩ።"
