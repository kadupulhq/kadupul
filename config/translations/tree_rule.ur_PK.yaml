"A useful name for this Rule.": "اس قاعدے کے لیے ایک موزوں نام۔"
"Access denied.": "رسائی مسترد کر دی گئی۔"
"Add Tree Rule": "ٹری قاعدہ شامل کریں"
"Back to Tree Rules": "ٹری قواعد پر واپس جائیں"
"Check this box to enable this rule.": "اس قاعدے کو فعال کرنے کے لیے اس باکس پر نشان لگائیں۔"
"Choose a Tree for the new Tree Items.": "نئے ٹری آئٹمز کے لیے ایک ٹری منتخب کریں۔"
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "منسلک کرنے کے لیے منتخب ٹری کا ایک ہیڈر یا اس کی جڑ منتخب کریں۔ یقینی بنائیں کہ جب یہ قاعدہ چلے تو وہ موجود ہو۔"
"Choose a header of the selected Tree.": "منتخب ٹری کا ایک ہیڈر منتخب کریں۔"
"Choose a listed Graph Grouping Style.": "فہرست میں سے گراف گروپنگ کا انداز منتخب کریں۔"
"Choose a listed Leaf Item Type.": "فہرست میں سے لیف آئٹم کی قسم منتخب کریں۔"
"Choose an existing Tree.": "ایک موجود ٹری منتخب کریں۔"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "منتخب کریں کہ ٹری پر اس مخصوص ہوسٹ کے لیے گرافس بناتے وقت انہیں کیسے گروپ کیا جائے۔ ڈیوائس لیوز کے لیے استعمال ہوتا ہے۔"
"Data Query Index": "ڈیٹا کوئری انڈیکس"
"Device": "ڈیوائس"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "ڈیوائس لیوز گراف یا گراف ٹیمپلیٹ کالمز پر معیارات استعمال نہیں کر سکتے۔ لیف آئٹم کی قسم کو ڈیوائس میں تبدیل کرتے وقت، ان معیارات کو ہٹانے کے لیے اس باکس پر نشان لگائیں؛ انہیں بحال نہیں کیا جا سکے گا۔"
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "ڈیوائس لیوز گراف پر مبنی معیارات استعمال نہیں کر سکتے۔ محفوظ کرنے کے لیے %count% معیارات ہٹانے کی تصدیق کریں۔"
"Edit Tree Rule": "ٹری قاعدے میں ترمیم کریں"
"Enable Rule": "قاعدہ فعال کریں"
"Enter a name.": "نام درج کریں۔"
"Enter at most %count% characters.": "زیادہ سے زیادہ %count% حروف درج کریں۔"
"Enter single-line text.": "ایک سطر کا متن درج کریں۔"
"Graph": "گراف"
"Graph Grouping Style": "گراف گروپنگ کا انداز"
"Graph Template": "گراف ٹیمپلیٹ"
"Leaf Item Type": "لیف آئٹم کی قسم"
"Name": "نام"
"Object Selection and Tree Creation Criteria": "آبجیکٹ کا انتخاب اور ٹری بنانے کے معیارات"
"Optional: Sub-Tree Item": "اختیاری: سب ٹری آئٹم"
"Remove graph-based criteria": "گراف پر مبنی معیارات ہٹائیں"
"Save": "محفوظ کریں"
"Save outcome is uncertain. Reload before retrying.": "محفوظ کرنے کا نتیجہ غیر یقینی ہے۔ دوبارہ کوشش کرنے سے پہلے دوبارہ لوڈ کریں۔"
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "پہلے قاعدہ محفوظ کریں؛ اس کے آبجیکٹ کے انتخاب اور ٹری بنانے کے معیارات بعد میں شامل کیے جاتے ہیں۔"
"The Item Type that shall be dynamically added to the tree.": "آئٹم کی وہ قسم جو خودکار طور پر ٹری میں شامل کی جائے گی۔"
"The tree rule changed since you opened this form. Reload before saving.": "یہ فارم کھولنے کے بعد ٹری قاعدہ تبدیل ہو گیا۔ محفوظ کرنے سے پہلے دوبارہ لوڈ کریں۔"
"Tree": "ٹری"
"Tree Rule Selection [edit: %name%]": "ٹری قاعدے کا انتخاب [ترمیم: %name%]"
"Tree Rules Selection [new]": "ٹری قواعد کا انتخاب [نیا]"
"Tree rule not found.": "ٹری قاعدہ نہیں ملا۔"
"Tree rule saved.": "ٹری قاعدہ محفوظ ہو گیا۔"
"Unable to load the tree rule. Reload before retrying.": "ٹری قاعدہ لوڈ کرنے میں ناکام۔ دوبارہ کوشش کرنے سے پہلے دوبارہ لوڈ کریں۔"
"Unexpected fields were submitted.": "غیر متوقع فیلڈز جمع کروائی گئیں۔"
