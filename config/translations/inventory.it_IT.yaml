"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "I collettori remoti interessati devono essere online. Una rimozione non riuscita potrebbe lasciare modifiche remote o dei plugin; verifica l'esito prima di riprovare."
