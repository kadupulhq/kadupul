"Check this box to enable this rule.": "ಈ ನಿಯಮವನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಲು ಈ ಬಾಕ್ಸ್ ಅನ್ನು ಗುರುತಿಸಿ."
"Choose a Data Query to apply to this rule.": "ಈ ನಿಯಮಕ್ಕೆ ಅನ್ವಯಿಸಲು ಡೇಟಾ ಕ್ವೆರಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ."
