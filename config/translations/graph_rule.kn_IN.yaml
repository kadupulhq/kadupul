"Choose an existing Data Query.": "ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಡೇಟಾ ಕ್ವೆರಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "ಈ ನಿಯಮಕ್ಕೆ ಅನ್ವಯಿಸಲು ಆಯ್ದ ಡೇಟಾ ಕ್ವೆರಿಯ ಲಭ್ಯ ಗ್ರಾಫ್ ಪ್ರಕಾರಗಳಲ್ಲಿ ಯಾವುದನ್ನಾದರೂ ಆಯ್ಕೆಮಾಡಿ."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "ಈ ಕೆಳಗಿನ ಗ್ರಾಫ್ ನಿಯಮಗಳನ್ನು ಅವುಗಳ ಸಾಧನ ಆಯ್ಕೆ ಮತ್ತು ಗ್ರಾಫ್ ರಚನೆ ಮಾನದಂಡಗಳೊಂದಿಗೆ ಅಳಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ."
"Click Continue to disable the following Graph Rules.": "ಈ ಕೆಳಗಿನ ಗ್ರಾಫ್ ನಿಯಮಗಳನ್ನು ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "ಈ ಕೆಳಗಿನ ಗ್ರಾಫ್ ನಿಯಮಗಳನ್ನು ನಕಲಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ. ನಿಷ್ಕ್ರಿಯವಾಗಿ ಆರಂಭವಾಗುವ ಹೊಸ ಗ್ರಾಫ್ ನಿಯಮಗಳಿಗೆ ಶೀರ್ಷಿಕೆ ಸ್ವರೂಪವನ್ನು ಐಚ್ಛಿಕವಾಗಿ ಬದಲಾಯಿಸಬಹುದು."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "ಈ ಕೆಳಗಿನ ಗ್ರಾಫ್ ನಿಯಮಗಳನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ. ಅವುಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಪರೀಕ್ಷಿಸಲಾಗಿದೆ ಎಂದು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ."
