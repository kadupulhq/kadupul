"The default profile and profiles in use by Data Templates or Data Sources cannot be deleted.": "സ്ഥിര പ്രൊഫൈലും ഡാറ്റ ടെംപ്ലേറ്റുകളോ ഡാറ്റ സോഴ്സുകളോ ഉപയോഗിക്കുന്ന പ്രൊഫൈലുകളും ഇല്ലാതാക്കാനാവില്ല."
"The frequency that data will be collected from the Data Source.": "ഡാറ്റ സോഴ്സിൽ നിന്ന് ഡാറ്റ ശേഖരിക്കുന്ന ആവൃത്തി."
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "RRA സ്പെസിഫിക്കേഷനിൽ ഒരു വരി നിറയ്ക്കുന്നതിന് മുമ്പ് ആവശ്യമായ സാമ്പിളുകളുടെ എണ്ണം. ആദ്യ RRA-യ്ക്ക് എപ്പോഴും 1 എന്ന മൂല്യം ഉണ്ടായിരിക്കണം."
"The polling interval, X-Files Factor, Consolidation Functions and RRAs cannot be changed.": "പോളിംഗ് ഇടവേള, X-Files ഫാക്ടർ, കൺസോളിഡേഷൻ ഫംഗ്ഷനുകൾ, RRA-കൾ എന്നിവ മാറ്റാനാവില്ല."
