"A useful name for this Rule.": "Nama yang jelas untuk Aturan ini."
"Access denied.": "Akses ditolak."
"Add Tree Rule": "Tambah Aturan Pohon"
"Back to Tree Rules": "Kembali ke Aturan Pohon"
"Check this box to enable this rule.": "Centang kotak ini untuk mengaktifkan aturan ini."
"Choose a Tree for the new Tree Items.": "Pilih Pohon untuk Item Pohon baru."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Pilih header dari Pohon yang dipilih untuk ditautkan, atau root-nya. Pastikan item tersebut masih ada saat aturan ini dijalankan."
"Choose a header of the selected Tree.": "Pilih header dari Pohon yang dipilih."
"Choose a listed Graph Grouping Style.": "Pilih Gaya Pengelompokan Grafik yang tercantum."
"Choose a listed Leaf Item Type.": "Pilih Tipe Item Daun yang tercantum."
"Choose an existing Tree.": "Pilih Pohon yang ada."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Pilih cara grafik dikelompokkan saat digambar untuk host tertentu pada pohon. Digunakan untuk daun Perangkat."
"Data Query Index": "Indeks Kueri Data"
"Device": "Perangkat"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Daun perangkat tidak dapat menggunakan kriteria pada kolom grafik atau templat grafik. Saat mengubah Tipe Item Daun menjadi Perangkat, centang kotak ini untuk menghapus kriteria tersebut; kriteria tidak dapat dipulihkan."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Daun perangkat tidak dapat menggunakan kriteria berbasis grafik. Konfirmasi penghapusan %count% kriteria untuk menyimpan."
"Edit Tree Rule": "Edit Aturan Pohon"
"Enable Rule": "Aktifkan Aturan"
"Enter a name.": "Masukkan nama."
"Enter at most %count% characters.": "Masukkan maksimal %count% karakter."
"Enter single-line text.": "Masukkan teks satu baris."
"Graph": "Grafik"
"Graph Grouping Style": "Gaya Pengelompokan Grafik"
"Graph Template": "Templat Grafik"
"Leaf Item Type": "Tipe Item Daun"
"Name": "Nama"
"Object Selection and Tree Creation Criteria": "Kriteria Pemilihan Objek dan Pembuatan Pohon"
"Optional: Sub-Tree Item": "Opsional: Item Sub-Pohon"
"Remove graph-based criteria": "Hapus kriteria berbasis grafik"
"Save": "Simpan"
"Save outcome is uncertain. Reload before retrying.": "Hasil penyimpanan tidak pasti. Muat ulang sebelum mencoba lagi."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Simpan aturan terlebih dahulu; Kriteria Pemilihan Objek dan Pembuatan Pohonnya ditambahkan setelahnya."
"The Item Type that shall be dynamically added to the tree.": "Tipe Item yang akan ditambahkan secara dinamis ke pohon."
"The tree rule changed since you opened this form. Reload before saving.": "Aturan pohon berubah sejak Anda membuka formulir ini. Muat ulang sebelum menyimpan."
"Tree": "Pohon"
"Tree Rule Selection [edit: %name%]": "Pemilihan Aturan Pohon [edit: %name%]"
"Tree Rules Selection [new]": "Pemilihan Aturan Pohon [baru]"
"Tree rule not found.": "Aturan pohon tidak ditemukan."
"Tree rule saved.": "Aturan pohon disimpan."
"Unable to load the tree rule. Reload before retrying.": "Tidak dapat memuat aturan pohon. Muat ulang sebelum mencoba lagi."
"Unexpected fields were submitted.": "Kolom yang tidak terduga dikirimkan."
