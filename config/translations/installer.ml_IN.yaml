"missing or not writable": "കാണാനില്ല അല്ലെങ്കിൽ എഴുതാനാവില്ല"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir ഇൻസ്റ്റലേഷൻ അക്കൗണ്ടിന് എഴുതാവുന്ന നിലവിലുള്ള ഒരു ഡയറക്ടറിയായി കോൺഫിഗർ ചെയ്യുക. നേറ്റീവ് ഇറക്കുമതികൾ താൽക്കാലിക ഫയലുകൾ ഉപയോഗിക്കുന്നു."
