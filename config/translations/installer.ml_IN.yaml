"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "വെബ് PHP റൺടൈമിന് popen, pclose പ്രവർത്തനക്ഷമമാക്കുക, അല്ലെങ്കിൽ അനുവദിച്ച CLI ഇൻസ്റ്റാളർ ഉപയോഗിക്കുക."
