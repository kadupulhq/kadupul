"Database privileges": "ഡാറ്റാബേസ് പ്രിവിലേജുകൾ"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "സജീവ റോളുകളും ഒബ്ജക്റ്റ്-നിർദ്ദിഷ്ട ഗ്രാന്റുകളും ഉൾപ്പെടെ ഫലപ്രദമായ മൈഗ്രേഷൻ പ്രിവിലേജുകൾ പരിശോധിച്ചുറപ്പിച്ചിട്ടില്ല."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ഇൻസ്റ്റലേഷൻ അക്കൗണ്ടിനും സ്കീമയ്ക്കും ആവശ്യമായ ടേബിൾ റൈറ്റുകൾ, സ്കീമ മാറ്റങ്ങൾ, ട്രിഗറുകൾ, റൂട്ടീനുകൾ എന്നിവ പരിശോധിച്ചുറപ്പിക്കാൻ ഡാറ്റാബേസ് അഡ്മിനിസ്ട്രേറ്ററോട് ആവശ്യപ്പെടുക. ഗ്ലോബൽ അഡ്മിനിസ്ട്രേറ്റർ പ്രിവിലേജുകൾ നൽകരുത്."
"Compare web and worker runtimes": "വെബ്, വർക്കർ റൺടൈമുകൾ താരതമ്യം ചെയ്യുക"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "ഇത് വ്യക്തമായി ഒരു ഹ്രസ്വ റീഡ്-ഒൺലി PHP പ്രോബ് ആരംഭിക്കുന്നു. ഇത് ഒരു ഇൻസ്റ്റാളർ റിസർവ് ചെയ്യുകയോ ഫയലുകൾ എഴുതുകയോ ഉപകരണങ്ങളുമായി ബന്ധപ്പെടുകയോ ചെയ്യുന്നില്ല."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "പ്രോബ് ഈ വെബ് പ്രോസസ്സിൽ നിന്ന് അനന്തരമെടുക്കുകയും കോൺഫിഗർ ചെയ്ത ഇൻസ്റ്റാളർ PHP ഇന്റർപ്രെറ്റർ ഉപയോഗിക്കുകയും ചെയ്യുന്നു. ഇത് പ്രത്യേക ഷെഡ്യൂളറോ സർവീസോ പരിശോധിക്കുന്നില്ല."
"I authorize the read-only worker runtime comparison.": "റീഡ്-ഒൺലി വർക്കർ റൺടൈം താരതമ്യത്തിന് ഞാൻ അനുമതി നൽകുന്നു."
"Compare runtimes": "റൺടൈമുകൾ താരതമ്യം ചെയ്യുക"
"Runtime comparison results": "റൺടൈം താരതമ്യ ഫലങ്ങൾ"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "അനുമതി, ഐഡന്റിറ്റി വ്യത്യാസങ്ങൾ മനഃപൂർവ്വമായിരിക്കാം. റീഡ്-ഒൺലി നിരീക്ഷണങ്ങൾ റൈറ്റുകളോ ഇൻസ്റ്റലേഷനോ വിജയിക്കുമെന്ന് തെളിയിക്കുന്നില്ല."
"Confirm the read-only worker runtime comparison.": "റീഡ്-ഒൺലി വർക്കർ റൺടൈം താരതമ്യം സ്ഥിരീകരിക്കുക."
"The runtime comparison is unavailable.": "റൺടൈം താരതമ്യം ലഭ്യമല്ല."
"Shared application secret": "പങ്കിട്ട ആപ്ലിക്കേഷൻ രഹസ്യം"
"A strong web application secret is required before comparison.": "താരതമ്യത്തിന് മുമ്പ് ശക്തമായ ഒരു വെബ് ആപ്ലിക്കേഷൻ രഹസ്യം ആവശ്യമാണ്."
"Runtime comparison": "റൺടൈം താരതമ്യം"
"The configured worker runtime did not confirm a bounded comparison.": "കോൺഫിഗർ ചെയ്ത വർക്കർ റൺടൈം പരിമിതമായ ഒരു താരതമ്യം സ്ഥിരീകരിച്ചില്ല."
"The inherited worker secret could not be confirmed against the web secret.": "അനന്തരമെടുത്ത വർക്കർ രഹസ്യം വെബ് രഹസ്യവുമായി സ്ഥിരീകരിക്കാനായില്ല."
"PHP runtime comparison": "PHP റൺടൈം താരതമ്യം"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "രണ്ട് റൺടൈമുകളും PHP 8.4 പിന്തുണയ്ക്കണം; വ്യത്യസ്ത പാച്ച് പതിപ്പുകൾ അവലോകനം ആവശ്യമാണ്."
"Required extension comparison": "ആവശ്യമായ എക്സ്റ്റൻഷൻ താരതമ്യം"
"Required extension availability is checked; differing versions require review.": "ആവശ്യമായ എക്സ്റ്റൻഷൻ ലഭ്യത പരിശോധിക്കുന്നു; വ്യത്യസ്ത പതിപ്പുകൾ അവലോകനം ആവശ്യമാണ്."
"Process identity comparison": "പ്രോസസ്സ് ഐഡന്റിറ്റി താരതമ്യം"
"Effective process identity is unavailable on this platform.": "ഫലപ്രദമായ പ്രോസസ്സ് ഐഡന്റിറ്റി ഈ പ്ലാറ്റ്‌ഫോമിൽ ലഭ്യമല്ല."
"Effective process identities match.": "ഫലപ്രദമായ പ്രോസസ്സ് ഐഡന്റിറ്റികൾ പൊരുത്തപ്പെടുന്നു."
"Effective process identities differ; separate service accounts may be intentional.": "ഫലപ്രദമായ പ്രോസസ്സ് ഐഡന്റിറ്റികൾ വ്യത്യസ്തമാണ്; പ്രത്യേക സർവീസ് അക്കൗണ്ടുകൾ മനഃപൂർവ്വമായിരിക്കാം."
"Directory access comparison": "ഡയറക്ടറി ആക്സസ് താരതമ്യം"
"Read-only directory permission observations match.": "റീഡ്-ഒൺലി ഡയറക്ടറി അനുമതി നിരീക്ഷണങ്ങൾ പൊരുത്തപ്പെടുന്നു."
"Directory locations or permission observations differ; review the service-account roles.": "ഡയറക്ടറി സ്ഥാനങ്ങളോ അനുമതി നിരീക്ഷണങ്ങളോ വ്യത്യസ്തമാണ്; സർവീസ് അക്കൗണ്ട് റോളുകൾ അവലോകനം ചെയ്യുക."
"Worker directory read and traversal": "വർക്കർ ഡയറക്ടറി വായനയും ട്രാവേഴ്സലും"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "ആവശ്യമായ വർക്കർ ഡയറക്ടറികൾ നിലവിലുണ്ടായിരിക്കുകയും വായനയും ട്രാവേഴ്സലും അനുവദിക്കുകയും വേണം. റൈറ്റുകളൊന്നും പരീക്ഷിച്ചിട്ടില്ല."
"The inherited worker secret matches the web secret for this private challenge.": "അനന്തരമെടുത്ത വർക്കർ രഹസ്യം ഈ സ്വകാര്യ ചലഞ്ചിനായി വെബ് രഹസ്യവുമായി പൊരുത്തപ്പെടുന്നു."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "കോൺഫിഗർ ചെയ്ത PHP ഇന്റർപ്രെറ്റർ, ആവശ്യമായ എക്സ്റ്റൻഷനുകൾ, അനന്തരമെടുത്ത രഹസ്യം, സർവീസ് അക്കൗണ്ട് ഡയറക്ടറി അനുമതികൾ എന്നിവ അവലോകനം ചെയ്യുക. റൈറ്റുകളോ ഇൻസ്റ്റാളർ ആരംഭമോ പരീക്ഷിച്ചിട്ടില്ല."
"advisory": "ഉപദേശക"
