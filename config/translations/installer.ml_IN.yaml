"autocommit disabled or caller transaction active": "ഓട്ടോകമ്മിറ്റ് പ്രവർത്തനരഹിതം അല്ലെങ്കിൽ കോളർ ട്രാൻസാക്ഷൻ സജീവം"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "കോളറുടെ ട്രാൻസാക്ഷന് പുറത്ത് ഇൻസ്റ്റലേഷൻ പ്രവർത്തിപ്പിക്കുകയും അതിന്റെ മ്യൂട്ടേഷൻ കണക്ഷനിൽ ഓട്ടോകമ്മിറ്റ് പ്രവർത്തനക്ഷമമാക്കുകയും ചെയ്യുക."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "റിലീസ് ഡയറക്ടറി പുനഃസ്ഥാപിക്കുകയും ടെംപ്ലേറ്റ് റിസോഴ്സ് ഇറക്കുമതികൾക്കായി ഇൻസ്റ്റലേഷൻ അക്കൗണ്ടിന് റൈറ്റ് ആക്സസ് നൽകുകയും ചെയ്യുക. ഇത് എല്ലാവർക്കും എഴുതാവുന്നതാക്കരുത്."
