"Review and confirm the current installation plan.": "നിലവിലെ ഇൻസ്റ്റലേഷൻ പദ്ധതി അവലോകനം ചെയ്ത് സ്ഥിരീകരിക്കുക."
"Confirm the discovery scope before starting.": "ആരംഭിക്കുന്നതിന് മുമ്പ് ഡിസ്കവറി വ്യാപ്തി സ്ഥിരീകരിക്കുക."
