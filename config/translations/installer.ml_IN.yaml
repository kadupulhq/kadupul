"Installer options must be scalar values.": "ഇൻസ്റ്റാളർ ഓപ്ഷനുകൾ സ്കെയിലർ മൂല്യങ്ങളായിരിക്കണം."
"Installer option is too long or contains a null byte.": "ഇൻസ്റ്റാളർ ഓപ്ഷൻ വളരെ നീളമുള്ളതാണ് അല്ലെങ്കിൽ ഒരു നൾ ബൈറ്റ് അടങ്ങിയിരിക്കുന്നു."
"Installer IDs and intervals must be whole numbers.": "ഇൻസ്റ്റാളർ ID-കളും ഇടവേളകളും പൂർണ്ണസംഖ്യകളായിരിക്കണം."
"Installer ID or interval is outside its supported range.": "ഇൻസ്റ്റാളർ ID അല്ലെങ്കിൽ ഇടവേള പിന്തുണയ്ക്കുന്ന പരിധിക്ക് പുറത്താണ്."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ഇൻസ്റ്റലേഷൻ തുടരാനായില്ല. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് അതിന്റെ സ്ഥിതി റീലോഡ് ചെയ്ത് തടസ്സപ്പെടുത്തുന്ന പരിശോധനകൾ അവലോകനം ചെയ്യുക."
"Confirm that the previous worker has stopped before recovering its plan.": "പദ്ധതി വീണ്ടെടുക്കുന്നതിന് മുമ്പ് മുൻ വർക്കർ നിലച്ചതായി സ്ഥിരീകരിക്കുക."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ഡാറ്റാബേസ് ഇൻസ്റ്റാൾ ചെയ്തു, പക്ഷേ ചില കളക്ടറുകൾക്ക് ഇപ്പോഴും സമന്വയം ആവശ്യമാണ്. സ്ഥിതി പരിശോധിച്ച ശേഷം അവസാന ജോലികൾ വീണ്ടും ശ്രമിക്കുക."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ഇൻസ്റ്റലേഷൻ നിലച്ചു. ഇൻസ്റ്റാളർ ലോഗ് സംരക്ഷിക്കുക, കാരണം പരിഹരിക്കുക, വീണ്ടും ശ്രമിക്കുന്നത് വ്യക്തമായി സ്ഥിരീകരിക്കുക. ചില ഡാറ്റാബേസ് മാറ്റങ്ങൾ ഇതിനകം കമ്മിറ്റ് ചെയ്തിരിക്കാം. വീണ്ടും ശ്രമിക്കാൻ അനുമതി നൽകുന്നതിന് മുമ്പ് പ്ലഗിൻ ക്ലീനപ്പ് പരിശോധിക്കുക."
"Next action": "അടുത്ത നടപടി"
"Follow the execution status. Do not start another attempt while a worker is active.": "നിർവഹണ സ്ഥിതി പിന്തുടരുക. ഒരു വർക്കർ സജീവമായിരിക്കുമ്പോൾ മറ്റൊരു ശ്രമം ആരംഭിക്കരുത്."
"Complete the recovery checklist before retrying.": "വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് വീണ്ടെടുക്കൽ ചെക്ക്‌ലിസ്റ്റ് പൂർത്തിയാക്കുക."
"Verify collection and graph operation before enabling discovery.": "ഡിസ്കവറി പ്രവർത്തനക്ഷമമാക്കുന്നതിന് മുമ്പ് ശേഖരണവും ഗ്രാഫ് പ്രവർത്തനവും പരിശോധിച്ചുറപ്പിക്കുക."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "തടഞ്ഞ ആവശ്യകതകൾ പരിഹരിച്ച ശേഷം വീണ്ടും പരിശോധിക്കുക. സംരക്ഷിച്ച തിരഞ്ഞെടുപ്പുകൾ നിലനിർത്തുന്നു."
"Review the planned changes and backup checklist before authorizing execution.": "നിർവഹണത്തിന് അനുമതി നൽകുന്നതിന് മുമ്പ് ആസൂത്രിത മാറ്റങ്ങളും ബാക്കപ്പ് ചെക്ക്‌ലിസ്റ്റും അവലോകനം ചെയ്യുക."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "ഒരു ശേഖരണ പ്രൊഫൈൽ തിരഞ്ഞെടുത്ത് ലൈസൻസ് അംഗീകരിക്കുക. ആവശ്യമുള്ളപ്പോൾ ഓപ്ഷണൽ ക്രമീകരണങ്ങൾ തുറക്കാം."
"Download installation diagnostics": "ഇൻസ്റ്റലേഷൻ ഡയഗ്നോസ്റ്റിക്സ് ഡൗൺലോഡ് ചെയ്യുക"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ഒരു ഗ്രാഫ് തുറന്ന് ഒരു പോളർ സൈക്കിളിന് ശേഷം അതിന്റെ RRD ഡാറ്റ അപ്ഡേറ്റ് ആകുന്നുവെന്ന് ഉറപ്പാക്കുക."
"Requirement details": "ആവശ്യകതാ വിശദാംശങ്ങൾ"
"Recover": "വീണ്ടെടുക്കുക"
"Recovery checklist": "വീണ്ടെടുക്കൽ ചെക്ക്‌ലിസ്റ്റ്"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log സംരക്ഷിക്കുകയും പരാജയപ്പെട്ട ശ്രമം രേഖപ്പെടുത്തുകയും ചെയ്യുക."
"Confirm that the previous worker and its child processes have stopped.": "മുൻ വർക്കറും അതിന്റെ ചൈൽഡ് പ്രോസസ്സുകളും നിലച്ചതായി സ്ഥിരീകരിക്കുക."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "കമ്മിറ്റ് ചെയ്ത മാറ്റങ്ങൾ, കളക്ടർ സമന്വയം, പ്ലഗിൻ ക്ലീനപ്പ് എന്നിവ പരിശോധിക്കുക. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് കാരണം പരിഹരിക്കുക."
"Review the saved plan again, then explicitly authorize a retry.": "സംരക്ഷിച്ച പദ്ധതി വീണ്ടും അവലോകനം ചെയ്യുക, തുടർന്ന് വീണ്ടും ശ്രമിക്കാൻ വ്യക്തമായി അനുമതി നൽകുക."
"Recover a stopped worker": "നിലച്ച ഒരു വർക്കർ വീണ്ടെടുക്കുക"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "ഈ ശ്രമം ഇനി പ്രവർത്തിക്കുന്നില്ലെന്ന് സ്ഥിരീകരിച്ച ശേഷം മാത്രം വീണ്ടെടുക്കൽ ഉപയോഗിക്കുക. വീണ്ടെടുക്കൽ ഒരു പ്രോസസ്സിനെ നിർത്തുന്നില്ല."
"Collector and installation mode": "കളക്ടർ, ഇൻസ്റ്റലേഷൻ മോഡ്"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "കളക്ടർ റോളും ഡാറ്റാബേസ് കണക്ഷനുകളും നിർണ്ണയിക്കുന്നത് ഡിപ്ലോയ്മെന്റ് കോൺഫിഗറേഷനാണ്. ഒരു കളക്ടർ ആരംഭിക്കുന്നതിന് മുമ്പ് പ്രൈമറി സെർവർ കോൺഫിഗറേഷൻ പരിശോധിച്ചുറപ്പിക്കുക."
"Discovery and SNMP settings": "ഡിസ്കവറി, SNMP ക്രമീകരണങ്ങൾ"
"Keep discovery disabled until collection and collector connectivity have been verified.": "ശേഖരണവും കളക്ടർ കണക്റ്റിവിറ്റിയും പരിശോധിച്ചുറപ്പിക്കുന്നത് വരെ ഡിസ്കവറി പ്രവർത്തനരഹിതമാക്കി വയ്ക്കുക."
"Template selection": "ടെംപ്ലേറ്റ് തിരഞ്ഞെടുപ്പ്"
"Templates selected for import": "ഇറക്കുമതിക്ക് തിരഞ്ഞെടുത്ത ടെംപ്ലേറ്റുകൾ"
"No templates selected.": "ടെംപ്ലേറ്റുകളൊന്നും തിരഞ്ഞെടുത്തിട്ടില്ല."
"Backup checklist": "ബാക്കപ്പ് ചെക്ക്‌ലിസ്റ്റ്"
"Database backup and a tested restoration procedure.": "ഡാറ്റാബേസ് ബാക്കപ്പും പരീക്ഷിച്ച പുനഃസ്ഥാപന നടപടിക്രമവും."
"RRD files and the service account permissions needed to restore them.": "RRD ഫയലുകളും അവ പുനഃസ്ഥാപിക്കാൻ ആവശ്യമായ സർവീസ് അക്കൗണ്ട് അനുമതികളും."
"Configuration, keys and plugin data outside the database.": "ഡാറ്റാബേസിന് പുറത്തുള്ള കോൺഫിഗറേഷൻ, കീകൾ, പ്ലഗിൻ ഡാറ്റ."
"Post-installation checks": "ഇൻസ്റ്റലേഷന് ശേഷമുള്ള പരിശോധനകൾ"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "പരിശോധിച്ചുറപ്പിച്ച പരിശോധനകൾ കാണിച്ചിരിക്കുന്ന തെളിവുകൾ മാത്രം ഉൾക്കൊള്ളുന്നു. വിലയിരുത്താത്ത പരിശോധനകൾക്ക് ഇപ്പോഴും ഓപ്പറേറ്റർ പരിശോധന ആവശ്യമാണ്."
"Operational checks still require operator verification.": "പ്രവർത്തന പരിശോധനകൾക്ക് ഇപ്പോഴും ഓപ്പറേറ്റർ പരിശോധന ആവശ്യമാണ്."
"Status": "സ്ഥിതി"
"verified": "പരിശോധിച്ചുറപ്പിച്ചത്"
"action_required": "നടപടി ആവശ്യമാണ്"
"not_assessed": "വിലയിരുത്തിയിട്ടില്ല"
"Database schema": "ഡാറ്റാബേസ് സ്കീമ"
"Stored schema matches the application target.": "സംഭരിച്ച സ്കീമ ആപ്ലിക്കേഷൻ ലക്ഷ്യവുമായി പൊരുത്തപ്പെടുന്നു."
"Target schema completion has not been confirmed.": "ലക്ഷ്യ സ്കീമ പൂർത്തീകരണം സ്ഥിരീകരിച്ചിട്ടില്ല."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "ഇൻസ്റ്റലേഷൻ ഫലം അവലോകനം ചെയ്യുകയും സ്കീമ അപ്ഗ്രേഡ് പൂർത്തിയായതായി കണക്കാക്കുന്നതിന് മുമ്പ് പരാജയങ്ങൾ പരിഹരിക്കുകയും ചെയ്യുക."
"Installation outcome": "ഇൻസ്റ്റലേഷൻ ഫലം"
"A successful receipt matches the current target schema.": "വിജയകരമായ ഒരു രസീത് നിലവിലെ ലക്ഷ്യ സ്കീമയുമായി പൊരുത്തപ്പെടുന്നു."
"A complete successful installation outcome has not been confirmed.": "പൂർണ്ണമായ വിജയകരമായ ഇൻസ്റ്റലേഷൻ ഫലം സ്ഥിരീകരിച്ചിട്ടില്ല."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "ഇൻസ്റ്റാളർ ലോഗ് സംരക്ഷിക്കുകയും ആവശ്യമുള്ളപ്പോൾ വ്യക്തമായ വീണ്ടെടുക്കൽ അല്ലെങ്കിൽ വീണ്ടും ശ്രമിക്കൽ നടപടിക്രമം ഉപയോഗിക്കുകയും ചെയ്യുക."
"Collector synchronization": "കളക്ടർ സമന്വയം"
"The completed installer reports pending collector synchronization.": "പൂർത്തിയായ ഇൻസ്റ്റാളർ തീർപ്പാക്കാത്ത കളക്ടർ സമന്വയം റിപ്പോർട്ട് ചെയ്യുന്നു."
"The completed installer reports no pending collectors.": "പൂർത്തിയായ ഇൻസ്റ്റാളർ തീർപ്പാക്കാത്ത കളക്ടറുകളില്ലെന്ന് റിപ്പോർട്ട് ചെയ്യുന്നു."
"Collector completion remains unconfirmed by this partial receipt.": "ഈ ഭാഗിക രസീത് വഴി കളക്ടർ പൂർത്തീകരണം സ്ഥിരീകരിക്കപ്പെടുന്നില്ല."
"Collector completion is not established by this installation outcome.": "ഈ ഇൻസ്റ്റലേഷൻ ഫലം വഴി കളക്ടർ പൂർത്തീകരണം സ്ഥാപിക്കപ്പെടുന്നില്ല."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "ഭാഗിക ഫലങ്ങൾക്കായി കളക്ടർ സ്ഥിതി അവലോകനം ചെയ്യുകയും അവസാന ജോലികൾ വീണ്ടും ശ്രമിക്കുകയും ചെയ്യുക. ഇത് പിന്നീടുള്ള ശേഖരണ പുതുമ പരിശോധിച്ചുറപ്പിക്കുന്നില്ല."
"Scheduled collection": "ഷെഡ്യൂൾ ചെയ്ത ശേഖരണം"
"No poller or device was contacted by this assessment.": "ഈ വിലയിരുത്തലിൽ ഒരു പോളറോ ഉപകരണമോ ബന്ധപ്പെട്ടിട്ടില്ല."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "കോൺഫിഗർ ചെയ്ത ഷെഡ്യൂളർ ഉദ്ദേശിച്ച സർവീസ് അക്കൗണ്ടായി പോളർ പ്രവർത്തിപ്പിക്കുന്നുവെന്ന് ഉറപ്പാക്കുകയും അതിന്റെ അടുത്ത സാധാരണ സൈക്കിൾ അവലോകനം ചെയ്യുകയും ചെയ്യുക."
"Graph data": "ഗ്രാഫ് ഡാറ്റ"
"Live samples and RRD updates were not exercised.": "തത്സമയ സാമ്പിളുകളും RRD അപ്ഡേറ്റുകളും പരീക്ഷിച്ചിട്ടില്ല."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "ഒരു സാധാരണ ശേഖരണ സൈക്കിളിന് ശേഷം, പ്രതീക്ഷിക്കുന്ന ഗ്രാഫുകൾക്ക് പുതിയ സാമ്പിളുകൾ ലഭിക്കുന്നുവെന്ന് ഉറപ്പാക്കുകയും പോളർ പിശകുകൾ അവലോകനം ചെയ്യുകയും ചെയ്യുക."
"Recovery readiness": "വീണ്ടെടുക്കൽ സന്നദ്ധത"
"Backup restoration was not exercised.": "ബാക്കപ്പ് പുനഃസ്ഥാപനം പരീക്ഷിച്ചിട്ടില്ല."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "വീണ്ടെടുക്കലിനെ ആശ്രയിക്കുന്നതിന് മുമ്പ് ഡാറ്റാബേസ്, RRD ഫയലുകൾ, കോൺഫിഗറേഷൻ, കീ മെറ്റീരിയൽ എന്നിവയുടെ ഒറ്റപ്പെട്ട പുനഃസ്ഥാപനം പരിശോധിച്ചുറപ്പിക്കുക."
"No persisted local poller start has been recorded.": "സ്ഥിരമായി സംഭരിച്ച ലോക്കൽ പോളർ ആരംഭം രേഖപ്പെടുത്തിയിട്ടില്ല."
"Persisted poller timing is invalid and cannot establish scheduler health.": "സ്ഥിരമായി സംഭരിച്ച പോളർ സമയം അസാധുവാണ്, ഷെഡ്യൂളർ ആരോഗ്യം സ്ഥാപിക്കാനാവില്ല."
"The recorded poller start is in the future. Check clock synchronization.": "രേഖപ്പെടുത്തിയ പോളർ ആരംഭം ഭാവിയിലാണ്. ക്ലോക്ക് സിൻക്രൊണൈസേഷൻ പരിശോധിക്കുക."
"The recorded poller start is older than the native scheduling tolerance.": "രേഖപ്പെടുത്തിയ പോളർ ആരംഭം നേറ്റീവ് ഷെഡ്യൂളിംഗ് സഹിഷ്ണുതയേക്കാൾ പഴയതാണ്."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "നേറ്റീവ് ഷെഡ്യൂളിംഗ് സഹിഷ്ണുതയ്ക്കുള്ളിൽ ഒരു ലോക്കൽ പോളർ ആരംഭം രേഖപ്പെടുത്തി. പൂർത്തീകരണവും ഉപകരണ ആരോഗ്യവും പരിശോധിച്ചുറപ്പിച്ചിട്ടില്ല."
