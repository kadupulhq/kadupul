"A useful name for this Rule.": "ఈ నియమం కోసం ఉపయోగకరమైన పేరు."
"Access denied.": "యాక్సెస్ నిరాకరించబడింది."
"Add Tree Rule": "ట్రీ నియమాన్ని జోడించు"
"Back to Tree Rules": "ట్రీ నియమాలకు తిరిగి వెళ్ళు"
"Check this box to enable this rule.": "ఈ నియమాన్ని ప్రారంభించడానికి ఈ పెట్టెను ఎంచుకోండి."
"Choose a Tree for the new Tree Items.": "కొత్త ట్రీ అంశాల కోసం ట్రీని ఎంచుకోండి."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "హుక్ చేయడానికి ఎంచుకున్న ట్రీ యొక్క హెడర్‌ను లేదా దాని మూలాన్ని ఎంచుకోండి. ఈ నియమం అమలు చేయబడినప్పుడు అది ఇంకా ఉందని నిర్ధారించుకోండి."
"Choose a header of the selected Tree.": "ఎంచుకున్న ట్రీ యొక్క హెడర్‌ను ఎంచుకోండి."
"Choose a listed Graph Grouping Style.": "జాబితా చేయబడిన గ్రాఫ్ సమూహ శైలిని ఎంచుకోండి."
"Choose a listed Leaf Item Type.": "జాబితా చేయబడిన లీఫ్ అంశం రకాన్ని ఎంచుకోండి."
"Choose an existing Tree.": "ఇప్పటికే ఉన్న ట్రీని ఎంచుకోండి."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ట్రీపై ఈ ప్రత్యేక హోస్ట్ కోసం గీసినప్పుడు గ్రాఫ్‌లు ఎలా సమూహపరచబడాలో ఎంచుకోండి. పరికర ఆకుల కోసం ఉపయోగించబడుతుంది."
"Data Query Index": "డేటా క్వెరీ సూచిక"
"Device": "పరికరం"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "పరికర ఆకులు గ్రాఫ్ లేదా గ్రాఫ్ టెంప్లేట్ నిలువు వరుసలపై ప్రమాణాలను ఉపయోగించలేవు. లీఫ్ అంశం రకాన్ని 'పరికరం'కి మార్చేటప్పుడు, ఆ ప్రమాణాలను తొలగించడానికి ఈ పెట్టెను ఎంచుకోండి; వాటిని తిరిగి పొందలేము."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "పరికర ఆకులు గ్రాఫ్-ఆధారిత ప్రమాణాలను ఉపయోగించలేవు. సేవ్ చేయడానికి %count% ప్రమాణాల తొలగింపును నిర్ధారించండి."
"Edit Tree Rule": "ట్రీ నియమాన్ని సవరించు"
"Enable Rule": "నియమాన్ని ప్రారంభించు"
"Enter a name.": "పేరును నమోదు చేయండి."
"Enter at most %count% characters.": "గరిష్టంగా %count% అక్షరాలు నమోదు చేయండి."
"Enter single-line text.": "సింగిల్-లైన్ టెక్స్ట్‌ను నమోదు చేయండి."
"Graph": "గ్రాఫ్"
"Graph Grouping Style": "గ్రాఫ్ సమూహ శైలి"
"Graph Template": "గ్రాఫ్ టెంప్లేట్"
"Leaf Item Type": "లీఫ్ అంశం రకం"
"Name": "పేరు"
"Object Selection and Tree Creation Criteria": "ఆబ్జెక్ట్ ఎంపిక మరియు ట్రీ సృష్టి ప్రమాణాలు"
"Optional: Sub-Tree Item": "ఐచ్ఛికం: ఉప-ట్రీ అంశం"
"Remove graph-based criteria": "గ్రాఫ్-ఆధారిత ప్రమాణాలను తొలగించు"
"Save": "సేవ్ చేయి"
"Save outcome is uncertain. Reload before retrying.": "సేవ్ ఫలితం అనిశ్చితంగా ఉంది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "ముందుగా నియమాన్ని సేవ్ చేయండి; దాని ఆబ్జెక్ట్ ఎంపిక మరియు ట్రీ సృష్టి ప్రమాణాలు ఆ తర్వాత జోడించబడతాయి."
"The Item Type that shall be dynamically added to the tree.": "ట్రీకి డైనమిక్‌గా జోడించబడే అంశం రకం."
"The tree rule changed since you opened this form. Reload before saving.": "మీరు ఈ ఫారమ్‌ను తెరిచిన తర్వాత ట్రీ నియమం మారింది. సేవ్ చేసే ముందు మళ్లీ లోడ్ చేయండి."
"Tree": "ట్రీ"
"Tree Rule Selection [edit: %name%]": "ట్రీ నియమం ఎంపిక [సవరణ: %name%]"
"Tree Rules Selection [new]": "ట్రీ నియమాల ఎంపిక [కొత్తది]"
"Tree rule not found.": "ట్రీ నియమం కనుగొనబడలేదు."
"Tree rule saved.": "ట్రీ నియమం సేవ్ చేయబడింది."
"Unable to load the tree rule. Reload before retrying.": "ట్రీ నియమాన్ని లోడ్ చేయలేకపోయింది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Unexpected fields were submitted.": "ఊహించని ఫీల్డ్‌లు సమర్పించబడ్డాయి."
