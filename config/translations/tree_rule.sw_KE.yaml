"A useful name for this Rule.": "Jina muhimu kwa Kanuni hii."
"Access denied.": "Ufikiaji umekataliwa."
"Add Tree Rule": "Ongeza Kanuni ya Mti"
"Back to Tree Rules": "Rudi kwenye Kanuni za Mti"
"Check this box to enable this rule.": "Teua kisanduku hiki ili kuwezesha kanuni hii."
"Choose a Tree for the new Tree Items.": "Chagua Mti kwa Vipengee vipya vya Mti."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Chagua kichwa cha Mti uliochaguliwa cha kuunganisha, au mzizi wake. Hakikisha kuwa bado kipo wakati kanuni hii inapotekelezwa."
"Choose a header of the selected Tree.": "Chagua kichwa cha Mti uliochaguliwa."
"Choose a listed Graph Grouping Style.": "Chagua Mtindo wa Kupanga Grafu ulioorodheshwa."
"Choose a listed Leaf Item Type.": "Chagua Aina ya Kipengee cha Jani iliyoorodheshwa."
"Choose an existing Tree.": "Chagua Mti uliopo."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Chagua jinsi grafu zinavyopangwa zinapochorwa kwa mpangishi huyu mahususi kwenye mti. Hutumika kwa majani ya Kifaa."
"Data Query Index": "Faharasa ya Hoja ya Data"
"Device": "Kifaa"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Majani ya kifaa hayawezi kutumia vigezo kwenye safuwima za grafu au kiolezo cha grafu. Unapobadilisha Aina ya Kipengee cha Jani kuwa Kifaa, teua kisanduku hiki ili kuondoa vigezo hivyo; haviwezi kurejeshwa."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Majani ya kifaa hayawezi kutumia vigezo vinavyotegemea grafu. Thibitisha uondoaji wa vigezo %count% ili kuhifadhi."
"Edit Tree Rule": "Hariri Kanuni ya Mti"
"Enable Rule": "Wezesha Kanuni"
"Enter a name.": "Ingiza jina."
"Enter at most %count% characters.": "Ingiza zisizozidi herufi %count%."
"Enter single-line text.": "Ingiza maandishi ya mstari mmoja."
"Graph": "Grafu"
"Graph Grouping Style": "Mtindo wa Kupanga Grafu"
"Graph Template": "Kiolezo cha Grafu"
"Leaf Item Type": "Aina ya Kipengee cha Jani"
"Name": "Jina"
"Object Selection and Tree Creation Criteria": "Vigezo vya Uteuzi wa Kipengee na Uundaji wa Mti"
"Optional: Sub-Tree Item": "Hiari: Kipengee cha Tawi Dogo"
"Remove graph-based criteria": "Ondoa vigezo vinavyotegemea grafu"
"Save": "Hifadhi"
"Save outcome is uncertain. Reload before retrying.": "Matokeo ya kuhifadhi hayana uhakika. Pakia upya kabla ya kujaribu tena."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Hifadhi kanuni kwanza; Vigezo vyake vya Uteuzi wa Kipengee na Uundaji wa Mti huongezwa baadaye."
"The Item Type that shall be dynamically added to the tree.": "Aina ya Kipengee itakayoongezwa kwa nguvu kwenye mti."
"The tree rule changed since you opened this form. Reload before saving.": "Kanuni ya mti ilibadilika tangu ulipofungua fomu hii. Pakia upya kabla ya kuhifadhi."
"Tree": "Mti"
"Tree Rule Selection [edit: %name%]": "Uteuzi wa Kanuni ya Mti [hariri: %name%]"
"Tree Rules Selection [new]": "Uteuzi wa Kanuni za Mti [mpya]"
"Tree rule not found.": "Kanuni ya mti haikupatikana."
"Tree rule saved.": "Kanuni ya mti imehifadhiwa."
"Unable to load the tree rule. Reload before retrying.": "Imeshindwa kupakia kanuni ya mti. Pakia upya kabla ya kujaribu tena."
"Unexpected fields were submitted.": "Sehemu zisizotarajiwa ziliwasilishwa."
