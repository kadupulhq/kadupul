"Back to Tree Rules": "Vissza a faszabályokhoz"
"Cancel": "Mégse"
"Check this box to enable this rule.": "Jelölje be a négyzetet a szabály engedélyezéséhez."
"Choose a Tree for the new Tree Items.": "Válasszon fát az új faelemeknek."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Válassza ki a kijelölt fa azon fejlécét, amelyhez csatlakozni kíván, vagy a gyökerét. Győződjön meg róla, hogy a szabály végrehajtásakor még létezik."
"Choose a header of the selected Tree.": "Válassza ki a kijelölt fa egyik fejlécét."
"Choose a listed Graph Grouping Style.": "Válasszon a felsorolt grafikoncsoportosítási stílusok közül."
"Choose a listed Leaf Item Type.": "Válasszon a felsorolt levélelemtípusok közül."
"Choose an existing Tree.": "Válasszon egy meglévő fát."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Válassza ki, hogyan legyenek csoportosítva a grafikonok az adott állomás fán történő megjelenítésekor. Eszközlevelekhez használatos."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Kattintson a Folytatás gombra a következő faszabályok objektumkijelölési és fa-létrehozási feltételeikkel együtt történő törléséhez."
"Click Continue to disable the following Tree Rules.": "Kattintson a Folytatás gombra a következő faszabályok letiltásához."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Kattintson a Folytatás gombra a következő faszabályok megkettőzéséhez. Tetszés szerint módosíthatja az új faszabályok címformátumát; ezek letiltott állapotban jönnek létre."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Kattintson a Folytatás gombra a következő faszabályok engedélyezéséhez. Győződjön meg róla, hogy sikeresen tesztelték őket."
