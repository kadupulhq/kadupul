"About Kadupul": "Game da Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul aiki ne mai zaman kansa na buɗaɗɗen tushe don sa ido kan hanyar sadarwa da zana jadawalan jerin lokaci."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Ci gaba, gudummawa, da yanke shawarar saki suna ƙarƙashin kulawar ƙungiyar Kadupul."
