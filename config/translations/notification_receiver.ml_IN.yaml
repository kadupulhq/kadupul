"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "സംഭരിച്ച ക്രെഡൻഷ്യലുകൾ ഒരിക്കലും പ്രദർശിപ്പിക്കില്ല. അവ മാറ്റിസ്ഥാപിക്കുന്നത് നാല് ക്രെഡൻഷ്യൽ ഫീൽഡുകളും സജ്ജമാക്കുന്നു; SNMP പതിപ്പ് 3 ഒഴിവാക്കുന്നത് അതിന്റെ ഉപയോക്തൃനാമവും പാസ്‌ഫ്രേസുകളും മായ്ക്കുന്നു."
"Submit every notification receiver field.": "എല്ലാ അറിയിപ്പ് സ്വീകർത്താവ് ഫീൽഡുകളും സമർപ്പിക്കുക."
"The notification receiver changed since you opened this form. Reload before saving.": "നിങ്ങൾ ഈ ഫോം തുറന്നതിന് ശേഷം അറിയിപ്പ് സ്വീകർത്താവ് മാറി. സംരക്ഷിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The passphrases do not match.": "പാസ്‌ഫ്രേസുകൾ പൊരുത്തപ്പെടുന്നില്ല."
"Unable to load the notification receiver. Reload before retrying.": "അറിയിപ്പ് സ്വീകർത്താവിനെ ലോഡ് ചെയ്യാനായില്ല. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"Unexpected fields were submitted.": "പ്രതീക്ഷിക്കാത്ത ഫീൽഡുകൾ സമർപ്പിച്ചു."
