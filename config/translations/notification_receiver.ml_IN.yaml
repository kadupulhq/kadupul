"Save outcome is uncertain. Reload before retrying.": "സംരക്ഷിക്കലിന്റെ ഫലം അനിശ്ചിതമാണ്. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"Select a supported notification receiver setting.": "പിന്തുണയ്ക്കുന്ന ഒരു അറിയിപ്പ് സ്വീകർത്താവ് ക്രമീകരണം തിരഞ്ഞെടുക്കുക."
