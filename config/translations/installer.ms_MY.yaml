"Action": "Tindakan"
"Advanced options": "Pilihan lanjutan"
"Applying database upgrades": "Menggunakan naik taraf pangkalan data"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Sandarkan pangkalan data, fail RRD, konfigurasi dan kunci. Naik taraf pangkalan data mungkin melakukan perubahan yang tidak dapat dibatalkan oleh pengunduran aplikasi."
"Blocked": "Disekat"
"Check": "Semak"
"Check again": "Semak semula"
"Check collection freshness and collector connectivity before enabling discovery.": "Semak kesegaran pengumpulan dan ketersambungan pengumpul sebelum mendayakan penemuan."
"Check requirements": "Semak keperluan"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Semakan memeriksa proses ini dan kebenaran sistem fail. Ia tidak menulis fail ujian atau menghubungi peranti."
"Collection profile": "Profil pengumpulan"
"Collector": "Pengumpul"
"Configure": "Konfigurasikan"
"Configuring collection profiles": "Mengkonfigurasi profil pengumpulan"
"Configuring discovery": "Mengkonfigurasi penemuan"
"Configuring the local device": "Mengkonfigurasi peranti setempat"
"Confirming database version": "Mengesahkan versi pangkalan data"
"Converting selected tables": "Menukar jadual yang dipilih"
"Database version": "Versi pangkalan data"
"Disabled": "Dilumpuhkan"
"Discovery": "Penemuan"
"Discovery SNMP settings": "Tetapan SNMP penemuan"
"Discovery range": "Julat penemuan"
"Enable discovery after installation": "Dayakan penemuan selepas pemasangan"
"Executable paths": "Laluan boleh laksana"
"Execution status": "Status pelaksanaan"
"Finished execution": "Pelaksanaan selesai"
"Finishing tasks only. Schema migrations will not be replayed.": "Tugasan penamat sahaja. Migrasi skema tidak akan diulang."
"I accept the license terms": "Saya menerima syarat lesen"
"I authorize discovery of the displayed range": "Saya membenarkan penemuan julat yang dipaparkan"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Saya telah menyemak log dan mengesahkan bahawa pekerja sebelumnya dan proses anaknya telah berhenti"
"I checked the previous attempt and accept that some changes may already be committed": "Saya telah menyemak percubaan sebelumnya dan menerima bahawa sesetengah perubahan mungkin sudah dilakukan"
"I reviewed this plan and have the required backups": "Saya telah menyemak pelan ini dan mempunyai sandaran yang diperlukan"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Jika pekerja berhenti secara tidak dijangka, kekalkan log/cacti.log dan sahkan prosesnya telah tamat sebelum mencuba lagi secara eksplisit. Keadaan menunggu tidak mengesahkan pelancaran yang berjaya."
"Importing templates": "Mengimport templat"
"Install Kadupul": "Pasang Kadupul"
"Installation and upgrade": "Pemasangan dan naik taraf"
"Installation request was rejected.": "Permintaan pemasangan ditolak."
"Installation steps": "Langkah pemasangan"
"Installed": "Dipasang"
"Keep a backup of the database, RRD files, configuration and secret material.": "Simpan sandaran pangkalan data, fail RRD, konfigurasi dan bahan rahsia."
"Language": "Bahasa"
"Large tables may require the dedicated CLI conversion tool before installation.": "Jadual besar mungkin memerlukan alat penukaran CLI khusus sebelum pemasangan."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Biarkan medan rahsia kosong untuk mengekalkan bukti kelayakan yang disimpan. Rahsia tidak pernah dipaparkan semula."
"License": "Lesen"
"No action needed": "Tiada tindakan diperlukan"
"Observed": "Diperhatikan"
"Open the console": "Buka konsol"
"Operation": "Operasi"
"Override discovery SNMP settings": "Atasi tetapan SNMP penemuan"
"Pass": "Lulus"
"Poller interval in seconds": "Selang poller dalam saat"
"Preparing CSRF protection": "Menyediakan perlindungan CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Kemajuan menunjukkan fasa terakhir yang direkodkan. Menyegarkan halaman ini tidak pernah memulakan atau mencuba semula pekerja."
"Recover stopped attempt": "Pulihkan percubaan yang terhenti"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Pemulihan mengekalkan pilihan yang disimpan dan tidak pernah menamatkan pekerja yang masih aktif. Semak pelan sekali lagi sebelum mencuba semula."
"Review": "Semakan"
"Review installation plan": "Semak pelan pemasangan"
"Run": "Jalankan"
"Run reviewed plan": "Jalankan pelan yang disemak"
"Save and review": "Simpan dan semak"
"Scope": "Skop"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status tidak tersedia. Kerja yang disimpan dikekalkan. Segarkan untuk menyambung semula; jangan hantar pemasangan lain."
"Synchronizing collectors": "Menyegerakkan pengumpul"
"Table conversions": "Penukaran jadual"
"Templates": "Templat"
"The database version matches this application. Installation does not establish that polling is healthy.": "Versi pangkalan data sepadan dengan aplikasi ini. Pemasangan tidak membuktikan bahawa tinjauan berjalan dengan sihat."
"The request outcome is unknown. Check execution status before retrying.": "Hasil permintaan tidak diketahui. Semak status pelaksanaan sebelum mencuba lagi."
"Theme": "Tema"
"Verify": "Sahkan"
"Verify the poller schedule and service account.": "Sahkan jadual poller dan akaun perkhidmatan."
"Version change": "Perubahan versi"
"Waiting for the installation worker": "Menunggu pekerja pemasangan"
"collector": "pengumpul"
"complete": "selesai"
"failed": "gagal"
"finish": "tamat"
"install": "pasang"
"not_started": "belum_bermula"
"partial": "separa"
"running": "berjalan"
"succeeded": "berjaya"
"upgrade": "naik taraf"
"waiting": "menunggu"
"Accept the license before saving the installation plan.": "Terima lesen sebelum menyimpan pelan pemasangan."
"Invalid installation form.": "Borang pemasangan tidak sah."
"Access denied.": "Akses dinafikan."
"Confirm the recovery warning before retrying.": "Sahkan amaran pemulihan sebelum mencuba lagi."
"Review and confirm the current installation plan.": "Semak dan sahkan pelan pemasangan semasa."
"Confirm the discovery scope before starting.": "Sahkan skop penemuan sebelum bermula."
"Resolve the blocking checks before starting.": "Selesaikan semakan yang menyekat sebelum bermula."
"Too many installer options.": "Terlalu banyak pilihan pemasang."
"Invalid installer option name.": "Nama pilihan pemasang tidak sah."
"Unknown or malformed installer option.": "Pilihan pemasang tidak diketahui atau salah bentuk."
"Installer options must be scalar values.": "Pilihan pemasang mestilah nilai skalar."
"Installer option is too long or contains a null byte.": "Pilihan pemasang terlalu panjang atau mengandungi bait null."
"Installer IDs and intervals must be whole numbers.": "ID dan selang pemasang mestilah nombor bulat."
"Installer ID or interval is outside its supported range.": "ID atau selang pemasang berada di luar julat yang disokong."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Pemasangan tidak dapat diteruskan. Muat semula statusnya dan semak pemeriksaan yang menyekat sebelum mencuba lagi."
"Confirm that the previous worker has stopped before recovering its plan.": "Sahkan bahawa pekerja sebelumnya telah berhenti sebelum memulihkan pelannya."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Pangkalan data telah dipasang, tetapi sesetengah pengumpul masih memerlukan penyegerakan. Cuba semula tugasan penamat selepas menyemak statusnya."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Pemasangan terhenti. Kekalkan log pemasang, betulkan puncanya dan sahkan percubaan semula secara eksplisit. Sesetengah perubahan pangkalan data mungkin sudah dilakukan. Semak pembersihan pemalam sebelum membenarkan percubaan semula."
"Next action": "Tindakan seterusnya"
"Follow the execution status. Do not start another attempt while a worker is active.": "Ikuti status pelaksanaan. Jangan mulakan percubaan lain semasa pekerja masih aktif."
"Complete the recovery checklist before retrying.": "Lengkapkan senarai semak pemulihan sebelum mencuba semula."
"Verify collection and graph operation before enabling discovery.": "Sahkan operasi pengumpulan dan graf sebelum mendayakan penemuan."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Selesaikan keperluan yang disekat, kemudian semak semula. Pilihan yang disimpan dikekalkan."
"Review the planned changes and backup checklist before authorizing execution.": "Semak perubahan yang dirancang dan senarai semak sandaran sebelum membenarkan pelaksanaan."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Pilih profil pengumpulan dan terima lesen. Tetapan pilihan boleh dibuka apabila diperlukan."
"Download installation diagnostics": "Muat turun diagnostik pemasangan"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Buka graf dan sahkan data RRD-nya dikemas kini selepas satu kitaran poller."
"Requirement details": "Butiran keperluan"
"Recover": "Pulihkan"
"Recovery checklist": "Senarai semak pemulihan"
"Preserve log/cacti.log and record the failed attempt.": "Kekalkan log/cacti.log dan rekodkan percubaan yang gagal."
"Confirm that the previous worker and its child processes have stopped.": "Sahkan bahawa pekerja sebelumnya dan proses anaknya telah berhenti."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Periksa perubahan yang telah dilakukan, penyegerakan pengumpul dan pembersihan pemalam. Betulkan puncanya sebelum mencuba semula."
"Review the saved plan again, then explicitly authorize a retry.": "Semak pelan yang disimpan sekali lagi, kemudian benarkan percubaan semula secara eksplisit."
"Recover a stopped worker": "Pulihkan pekerja yang terhenti"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Gunakan pemulihan hanya selepas mengesahkan bahawa percubaan ini tidak lagi berjalan. Pemulihan tidak menghentikan proses."
"Collector and installation mode": "Mod pengumpul dan pemasangan"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Konfigurasi penempatan menentukan peranan pengumpul dan sambungan pangkalan data. Sahkan konfigurasi pelayan utama sebelum memulakan pengumpul."
"Discovery and SNMP settings": "Penemuan dan tetapan SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Biarkan penemuan dilumpuhkan sehingga pengumpulan dan ketersambungan pengumpul disahkan."
"Template selection": "Pemilihan templat"
"Templates selected for import": "Templat yang dipilih untuk diimport"
"No templates selected.": "Tiada templat dipilih."
"Backup checklist": "Senarai semak sandaran"
"Database backup and a tested restoration procedure.": "Sandaran pangkalan data dan prosedur pemulihan yang telah diuji."
"RRD files and the service account permissions needed to restore them.": "Fail RRD dan kebenaran akaun perkhidmatan yang diperlukan untuk memulihkannya."
"Configuration, keys and plugin data outside the database.": "Konfigurasi, kunci dan data pemalam di luar pangkalan data."
"Post-installation checks": "Semakan selepas pemasangan"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Semakan yang disahkan hanya meliputi bukti yang dipaparkan. Semakan yang belum dinilai masih memerlukan pengesahan pengendali."
"Operational checks still require operator verification.": "Semakan operasi masih memerlukan pengesahan pengendali."
"Status": "Status"
"verified": "Disahkan"
"action_required": "Tindakan diperlukan"
"not_assessed": "Belum dinilai"
"Database schema": "Skema pangkalan data"
"Stored schema matches the application target.": "Skema yang disimpan sepadan dengan sasaran aplikasi."
"Target schema completion has not been confirmed.": "Penyiapan skema sasaran belum disahkan."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Semak hasil pemasangan dan selesaikan kegagalan sebelum menganggap naik taraf skema selesai."
"Installation outcome": "Hasil pemasangan"
"A successful receipt matches the current target schema.": "Resit yang berjaya sepadan dengan skema sasaran semasa."
"A complete successful installation outcome has not been confirmed.": "Hasil pemasangan berjaya yang lengkap belum disahkan."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Kekalkan log pemasang dan gunakan prosedur pemulihan atau percubaan semula yang eksplisit apabila diperlukan."
"Collector synchronization": "Penyegerakan pengumpul"
"The completed installer reports pending collector synchronization.": "Pemasang yang telah selesai melaporkan penyegerakan pengumpul yang belum selesai."
"The completed installer reports no pending collectors.": "Pemasang yang telah selesai melaporkan tiada pengumpul yang belum selesai."
"Collector completion remains unconfirmed by this partial receipt.": "Penyiapan pengumpul kekal tidak disahkan oleh resit separa ini."
"Collector completion is not established by this installation outcome.": "Penyiapan pengumpul tidak ditentukan oleh hasil pemasangan ini."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Semak status pengumpul dan cuba semula tugasan penamat bagi hasil separa. Ini tidak mengesahkan kesegaran pengumpulan kemudian."
"Scheduled collection": "Pengumpulan berjadual"
"No poller or device was contacted by this assessment.": "Tiada poller atau peranti dihubungi oleh penilaian ini."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Sahkan penjadual yang dikonfigurasi menjalankan poller sebagai akaun perkhidmatan yang dimaksudkan dan semak kitaran normal seterusnya."
"Graph data": "Data graf"
"Live samples and RRD updates were not exercised.": "Sampel langsung dan kemas kini RRD tidak diuji."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Selepas kitaran pengumpulan biasa, sahkan graf yang dijangka menerima sampel baharu dan semak ralat poller."
"Recovery readiness": "Kesediaan pemulihan"
"Backup restoration was not exercised.": "Pemulihan sandaran tidak diuji."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Sahkan pemulihan terasing bagi pangkalan data, fail RRD, konfigurasi dan bahan kunci sebelum bergantung pada pemulihan."
"No persisted local poller start has been recorded.": "Tiada permulaan poller setempat yang berterusan direkodkan."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Pemasaan poller yang berterusan tidak sah dan tidak dapat menentukan kesihatan penjadual."
"The recorded poller start is in the future. Check clock synchronization.": "Permulaan poller yang direkodkan berada pada masa hadapan. Semak penyegerakan jam."
"The recorded poller start is older than the native scheduling tolerance.": "Permulaan poller yang direkodkan lebih lama daripada toleransi penjadualan asli."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Permulaan poller setempat direkodkan dalam toleransi penjadualan asli. Penyiapan dan kesihatan peranti tidak disahkan."
"readable": "boleh dibaca"
"missing or unreadable": "tiada atau tidak boleh dibaca"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Pulihkan keluaran lengkap dan kebergantungannya yang dikunci; berikan akses baca kepada akaun perkhidmatan."
"PHP temporary directory": "Direktori sementara PHP"
"directory writable by this process": "direktori boleh ditulis oleh proses ini"
"missing or not writable": "tiada atau tidak boleh ditulis"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurasikan sys_temp_dir sebagai direktori sedia ada yang boleh ditulis oleh akaun pemasangan. Import asli menggunakan fail sementara."
"Background worker launch": "Pelancaran pekerja latar belakang"
"required PHP functions available; launch not exercised": "fungsi PHP yang diperlukan tersedia; pelancaran tidak diuji"
"required PHP launch function disabled": "fungsi pelancaran PHP yang diperlukan dilumpuhkan"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Dayakan exec untuk runtime PHP web, atau gunakan pemasang CLI yang dibenarkan."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Dayakan popen, pclose untuk runtime PHP web, atau gunakan pemasang CLI yang dibenarkan."
"Database transaction ownership": "Pemilikan transaksi pangkalan data"
"autocommit enabled; no caller-owned transaction": "autocommit didayakan; tiada transaksi milik pemanggil"
"autocommit disabled or caller transaction active": "autocommit dilumpuhkan atau transaksi pemanggil aktif"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Jalankan pemasangan di luar transaksi milik pemanggil dan dayakan autocommit pada sambungan mutasinya."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Pulihkan direktori keluaran dan berikan akses tulis kepada akaun pemasangan untuk import sumber templat. Jangan jadikannya boleh ditulis oleh semua orang."
"Worker file: install/background.php": "Fail pekerja: install/background.php"
"Worker file: bin/legacy-installer.php": "Fail pekerja: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fail pekerja: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destinasi import: resource/snmp_queries"
"Import destination: resource/script_server": "Destinasi import: resource/script_server"
"Import destination: resource/script_queries": "Destinasi import: resource/script_queries"
"Import destination: scripts": "Destinasi import: scripts"
"Database privileges": "Keistimewaan pangkalan data"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Keistimewaan migrasi berkesan, termasuk peranan aktif dan geran khusus objek, tidak disahkan."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Minta pentadbir pangkalan data mengesahkan penulisan jadual, perubahan skema, pencetus dan rutin yang diperlukan untuk akaun pemasangan dan skema. Jangan berikan keistimewaan pentadbir global."
"Compare web and worker runtimes": "Bandingkan runtime web dan pekerja"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Ini memulakan siasatan PHP baca sahaja yang pendek secara eksplisit. Ia tidak menempah pemasang, menulis fail atau menghubungi peranti."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Siasatan mewarisi proses web ini dan menggunakan penterjemah PHP pemasang yang dikonfigurasi. Ia tidak memeriksa penjadual atau perkhidmatan yang berasingan."
"I authorize the read-only worker runtime comparison.": "Saya membenarkan perbandingan runtime pekerja baca sahaja."
"Compare runtimes": "Bandingkan runtime"
"Runtime comparison results": "Keputusan perbandingan runtime"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Perbezaan kebenaran dan identiti mungkin disengajakan. Pemerhatian baca sahaja tidak membuktikan bahawa penulisan atau pemasangan akan berjaya."
"Confirm the read-only worker runtime comparison.": "Sahkan perbandingan runtime pekerja baca sahaja."
"The runtime comparison is unavailable.": "Perbandingan runtime tidak tersedia."
"Shared application secret": "Rahsia aplikasi dikongsi"
"A strong web application secret is required before comparison.": "Rahsia aplikasi web yang kukuh diperlukan sebelum perbandingan."
"Runtime comparison": "Perbandingan runtime"
"The configured worker runtime did not confirm a bounded comparison.": "Runtime pekerja yang dikonfigurasi tidak mengesahkan perbandingan yang terhad."
"The inherited worker secret could not be confirmed against the web secret.": "Rahsia pekerja yang diwarisi tidak dapat disahkan berbanding rahsia web."
"PHP runtime comparison": "Perbandingan runtime PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Kedua-dua runtime mesti menyokong PHP 8.4; versi tampalan yang berbeza memerlukan semakan."
"Required extension comparison": "Perbandingan sambungan yang diperlukan"
"Required extension availability is checked; differing versions require review.": "Ketersediaan sambungan yang diperlukan disemak; versi yang berbeza memerlukan semakan."
"Process identity comparison": "Perbandingan identiti proses"
"Effective process identity is unavailable on this platform.": "Identiti proses berkesan tidak tersedia pada platform ini."
"Effective process identities match.": "Identiti proses berkesan sepadan."
"Effective process identities differ; separate service accounts may be intentional.": "Identiti proses berkesan berbeza; akaun perkhidmatan yang berasingan mungkin disengajakan."
"Directory access comparison": "Perbandingan akses direktori"
"Read-only directory permission observations match.": "Pemerhatian kebenaran direktori baca sahaja sepadan."
"Directory locations or permission observations differ; review the service-account roles.": "Lokasi direktori atau pemerhatian kebenaran berbeza; semak peranan akaun perkhidmatan."
"Worker directory read and traversal": "Bacaan dan lintasan direktori pekerja"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Direktori pekerja yang diperlukan mesti wujud dan membenarkan bacaan serta lintasan. Tiada penulisan diuji."
"The inherited worker secret matches the web secret for this private challenge.": "Rahsia pekerja yang diwarisi sepadan dengan rahsia web untuk cabaran persendirian ini."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Semak penterjemah PHP yang dikonfigurasi, sambungan yang diperlukan, rahsia yang diwarisi dan kebenaran direktori akaun perkhidmatan. Tiada penulisan atau permulaan pemasang dijalankan."
"advisory": "nasihat"
