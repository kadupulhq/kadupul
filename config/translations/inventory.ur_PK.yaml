"Apply existing graph and tree automation rules to the selected devices. Rules may create graphs, data sources and tree entries.": "منتخب ڈیوائسز پر موجودہ گراف اور ٹری آٹومیشن قواعد لاگو کریں۔ قواعد سے گرافس، ڈیٹا سورسز اور ٹری اندراجات بن سکتے ہیں۔"
"Only checked SNMP settings are changed. Unchecked settings and credentials retain their current values.": "صرف نشان زد SNMP ترتیبات تبدیل کی جاتی ہیں۔ غیر نشان زد ترتیبات اور اسناد اپنی موجودہ اقدار برقرار رکھتی ہیں۔"
"Select at least one supported SNMP setting.": "کم از کم ایک معاونت یافتہ SNMP ترتیب منتخب کریں۔"
"Invalid location search.": "مقام کی غیر درست تلاش۔"
