"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "Platnosť tohto formulára sady volieb SNMP vypršala. Znova otvorte sadu volieb SNMP a použite jej aktuálny formulár."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Jedinečný reťazec, ktorý sa porovná s reťazcom sysDescr zariadenia a priradí ho k tejto šablóne automatizácie. Okrem akéhokoľvek výrazu SQL Where možno použiť aj ľubovoľný regulárny výraz Perl."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Jedinečný reťazec, ktorý sa porovná s reťazcom sysName zariadenia a priradí ho k tejto šablóne automatizácie. Okrem akéhokoľvek výrazu SQL Where možno použiť aj ľubovoľný regulárny výraz Perl."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Jedinečný reťazec, ktorý sa porovná s reťazcom sysOid zariadenia a priradí ho k tejto šablóne automatizácie. Okrem akéhokoľvek výrazu SQL Where možno použiť aj ľubovoľný regulárny výraz Perl."
