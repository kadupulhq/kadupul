"SNMPv3 authentication and privacy passphrases require at least 8 bytes.": "Maneno ya siri ya uthibitishaji na faragha ya SNMPv3 yanahitaji angalau bytes 8."
"SNMPv3 privacy also requires authentication.": "Faragha ya SNMPv3 pia inahitaji uthibitishaji."
"SNMPv3 requires a username and an engine ID.": "SNMPv3 inahitaji jina la mtumiaji na kitambulisho cha injini."
"Save": "Hifadhi"
"Save outcome is uncertain. Reload before retrying.": "Matokeo ya kuhifadhi hayana uhakika. Pakia upya kabla ya kujaribu tena."
"Select a supported notification receiver setting.": "Chagua mpokeaji wa arifa anayetumika."
"Select supported notification receiver settings.": "Chagua mipangilio ya mpokeaji wa arifa inayotumika."
"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "Weka itifaki ya uthibitishaji au faragha ya SNMPv3 pamoja na neno lake la siri."
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "Vitambulisho vilivyohifadhiwa havionyeshwi kamwe. Kuvibadilisha huweka sehemu zote nne za vitambulisho; kuondoka kwenye toleo la 3 la SNMP kunafuta jina lake la mtumiaji na maneno ya siri."
"Submit every notification receiver field.": "Wasilisha kila sehemu ya mpokeaji wa arifa."
"The notification receiver changed since you opened this form. Reload before saving.": "Mpokeaji wa arifa alibadilika tangu ulipofungua fomu hii. Pakia upya kabla ya kuhifadhi."
"The passphrases do not match.": "Maneno ya siri hayalingani."
"Unable to load the notification receiver. Reload before retrying.": "Imeshindwa kupakia mpokeaji wa arifa. Pakia upya kabla ya kujaribu tena."
"Unexpected fields were submitted.": "Sehemu zisizotarajiwa ziliwasilishwa."
"Use stored credentials": "Tumia vitambulisho vilivyohifadhiwa"
