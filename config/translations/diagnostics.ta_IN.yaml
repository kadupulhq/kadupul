"Recorded Boost settings and database statistics. Row estimates are not exact queue counts. Refresh to read current values.": "பதிவு செய்யப்பட்ட Boost அமைப்புகள் மற்றும் தரவுத்தளப் புள்ளிவிவரங்கள். வரிசை மதிப்பீடுகள் சரியான வரிசை எண்ணிக்கைகள் அல்ல. தற்போதைய மதிப்புகளைப் படிக்கப் புதுப்பிக்கவும்."
"Recorded configuration and inventory counts. External tool probes and tuning recommendations are available in advanced diagnostics.": "பதிவு செய்யப்பட்ட கட்டமைப்பு மற்றும் சரக்குப் பட்டியல் எண்ணிக்கைகள். வெளிப்புறக் கருவி ஆய்வுகள் மற்றும் சீரமைப்புப் பரிந்துரைகள் மேம்பட்ட கண்டறிதலில் கிடைக்கின்றன."
