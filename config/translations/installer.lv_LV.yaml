"Accept the license before saving the installation plan.": "Pirms instalēšanas plāna saglabāšanas pieņemiet licenci."
"Invalid installation form.": "Nederīga instalēšanas forma."
"Access denied.": "Piekļuve liegta."
"Confirm the recovery warning before retrying.": "Pirms atkārtota mēģinājuma apstipriniet atkopšanas brīdinājumu."
"Review and confirm the current installation plan.": "Pārskatiet un apstipriniet pašreizējo instalēšanas plānu."
"Confirm the discovery scope before starting.": "Pirms sākšanas apstipriniet atklāšanas tvērumu."
"Resolve the blocking checks before starting.": "Pirms sākšanas atrisiniet bloķējošās pārbaudes."
"Too many installer options.": "Pārāk daudz instalētāja opciju."
"Invalid installer option name.": "Nederīgs instalētāja opcijas nosaukums."
"Unknown or malformed installer option.": "Nezināma vai nepareizi formatēta instalētāja opcija."
"Installer options must be scalar values.": "Instalētāja opcijām jābūt skalārām vērtībām."
"Installer option is too long or contains a null byte.": "Instalētāja opcija ir pārāk gara vai satur nulles baitu."
"Installer IDs and intervals must be whole numbers.": "Instalētāja ID un intervāliem jābūt veseliem skaitļiem."
"Installer ID or interval is outside its supported range.": "Instalētāja ID vai intervāls ir ārpus atbalstītā diapazona."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Instalēšana nevarēja turpināties. Pirms atkārtota mēģinājuma pārlādējiet tās statusu un pārskatiet bloķējošās pārbaudes."
"Confirm that the previous worker has stopped before recovering its plan.": "Pirms plāna atkopšanas apstipriniet, ka iepriekšējais darbinieks ir apturēts."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Datubāze ir instalēta, taču dažiem savācējiem joprojām nepieciešama sinhronizācija. Pēc to statusa pārbaudes atkārtojiet pabeigšanas uzdevumus."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Instalēšana apturēta. Saglabājiet instalētāja žurnālu, novērsiet cēloni un skaidri apstipriniet atkārtotu mēģinājumu. Dažas datubāzes izmaiņas jau var būt apstiprinātas. Pirms atkārtota mēģinājuma pilnvarošanas pārbaudiet spraudņu tīrīšanu."
"Next action": "Nākamā darbība"
"Follow the execution status. Do not start another attempt while a worker is active.": "Sekojiet izpildes statusam. Nesāciet citu mēģinājumu, kamēr darbinieks ir aktīvs."
"Complete the recovery checklist before retrying.": "Pirms atkārtota mēģinājuma izpildiet atkopšanas kontrolsarakstu."
"Verify collection and graph operation before enabling discovery.": "Pirms atklāšanas iespējošanas verificējiet savākšanas un grafiku darbību."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Atrisiniet bloķētās prasības un pēc tam pārbaudiet vēlreiz. Saglabātās atlases tiek saglabātas."
"Review the planned changes and backup checklist before authorizing execution.": "Pirms izpildes pilnvarošanas pārskatiet plānotās izmaiņas un dublēšanas kontrolsarakstu."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Izvēlieties savākšanas profilu un pieņemiet licenci. Papildu iestatījumus var atvērt pēc nepieciešamības."
"Download installation diagnostics": "Lejupielādēt instalēšanas diagnostiku"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Atveriet grafiku un pārliecinieties, ka tā RRD dati tiek atjaunināti pēc aptaujātāja cikla."
"Requirement details": "Prasības detaļas"
"Recover": "Atgūt"
"Recovery checklist": "Atkopšanas kontrolsaraksts"
"Preserve log/cacti.log and record the failed attempt.": "Saglabājiet log/cacti.log un reģistrējiet neveiksmīgo mēģinājumu."
"Confirm that the previous worker and its child processes have stopped.": "Apstipriniet, ka iepriekšējais darbinieks un tā bērnprocesi ir apturēti."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Pārbaudiet apstiprinātās izmaiņas, savācēju sinhronizāciju un spraudņu tīrīšanu. Pirms atkārtota mēģinājuma novērsiet cēloni."
"Review the saved plan again, then explicitly authorize a retry.": "Vēlreiz pārskatiet saglabāto plānu un pēc tam skaidri pilnvarojiet atkārtotu mēģinājumu."
"Recover a stopped worker": "Atgūt apturētu darbinieku"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Izmantojiet atkopšanu tikai pēc tam, kad esat apstiprinājis, ka šis mēģinājums vairs nedarbojas. Atkopšana neaptur procesu."
"Collector and installation mode": "Savācējs un instalēšanas režīms"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Izvietošanas konfigurācija nosaka savācēja lomu un datubāzes savienojumus. Pirms savācēja palaišanas pārbaudiet primārā servera konfigurāciju."
"Discovery and SNMP settings": "Atklāšanas un SNMP iestatījumi"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Saglabājiet atklāšanu atspējotu, līdz ir pārbaudīta savākšana un savācēja savienojamība."
"Template selection": "Veidņu atlase"
"Templates selected for import": "Importēšanai atlasītās veidnes"
"No templates selected.": "Nav atlasīta neviena veidne."
"Backup checklist": "Dublēšanas kontrolsaraksts"
"Database backup and a tested restoration procedure.": "Datubāzes dublējumkopija un pārbaudīta atjaunošanas procedūra."
"RRD files and the service account permissions needed to restore them.": "RRD faili un to atjaunošanai nepieciešamās pakalpojuma konta atļaujas."
"Configuration, keys and plugin data outside the database.": "Konfigurācija, atslēgas un spraudņu dati ārpus datubāzes."
"Post-installation checks": "Pēcinstalēšanas pārbaudes"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Verificētās pārbaudes aptver tikai redzamos pierādījumus. Nenovērtētajām pārbaudēm joprojām nepieciešama operatora verifikācija."
"Operational checks still require operator verification.": "Operacionālajām pārbaudēm joprojām nepieciešama operatora verifikācija."
"Status": "Statuss"
"verified": "verificēts"
"action_required": "Action required"
"not_assessed": "Not assessed"
"Database schema": "Datubāzes shēma"
"Stored schema matches the application target.": "Saglabātā shēma atbilst lietojumprogrammas mērķim."
"Target schema completion has not been confirmed.": "Mērķa shēmas pabeigšana nav apstiprināta."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Pirms shēmas jaunināšanas uzskatīšanas par pabeigtu pārskatiet instalēšanas iznākumu un novērsiet neveiksmes."
"Installation outcome": "Instalēšanas iznākums"
"A successful receipt matches the current target schema.": "Veiksmīga kvīts atbilst pašreizējai mērķa shēmai."
"A complete successful installation outcome has not been confirmed.": "Pilnīga veiksmīga instalēšanas izpilde nav apstiprināta."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Saglabājiet instalētāja žurnālu un, ja nepieciešams, izmantojiet skaidro atkopšanas vai atkārtota mēģinājuma procedūru."
"Collector synchronization": "Savācēju sinhronizācija"
"The completed installer reports pending collector synchronization.": "Pabeigtais instalētājs ziņo par gaidošu savācēju sinhronizāciju."
"The completed installer reports no pending collectors.": "Pabeigtais instalētājs ziņo, ka nav gaidošu savācēju."
"Collector completion remains unconfirmed by this partial receipt.": "Šī daļējā kvīts joprojām neapstiprina savācēja pabeigšanu."
"Collector completion is not established by this installation outcome.": "Šis instalēšanas rezultāts neapliecina savācēja pabeigšanu."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Pārskatiet savācēju statusu un daļēju rezultātu gadījumā atkārtojiet pabeigšanas uzdevumus. Tas neverificē turpmāko savākšanas aktualitāti."
"Scheduled collection": "Plānotā savākšana"
"No poller or device was contacted by this assessment.": "Šis novērtējums nesazinājās ne ar vienu aptaujātāju vai ierīci."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Apstipriniet, ka konfigurētais plānotājs palaiž aptaujātāju ar paredzēto pakalpojuma kontu, un pārskatiet tā nākamo parasto ciklu."
"Graph data": "Grafiku dati"
"Live samples and RRD updates were not exercised.": "Tiešraides paraugi un RRD atjauninājumi netika pārbaudīti."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Pēc parasta savākšanas cikla pārliecinieties, ka paredzētie grafiki saņem aktuālus paraugus, un pārskatiet aptaujātāja kļūdas."
"Recovery readiness": "Atkopšanas gatavība"
"Backup restoration was not exercised.": "Dublējumkopijas atjaunošana netika pārbaudīta."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Pirms paļaušanās uz atkopšanu verificējiet izolētu datubāzes, RRD failu, konfigurācijas un atslēgu materiāla atjaunošanu."
"No persisted local poller start has been recorded.": "Nav reģistrēts neviens saglabāts lokālā aptaujātāja starts."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Saglabātais aptaujātāja laiks nav derīgs un nevar apstiprināt plānotāja stāvokli."
"The recorded poller start is in the future. Check clock synchronization.": "Reģistrētais aptaujātāja starts ir nākotnē. Pārbaudiet pulksteņa sinhronizāciju."
"The recorded poller start is older than the native scheduling tolerance.": "Reģistrētais aptaujātāja starts ir vecāks par iebūvēto plānošanas pielaidi."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Lokālā aptaujātāja starts tika reģistrēts iebūvētās plānošanas pielaides robežās. Pabeigšana un ierīces stāvoklis nav verificēti."
"readable": "lasāms"
"missing or unreadable": "trūkst vai nav lasāms"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Atjaunojiet pilno laidienu un tā bloķētās atkarības; piešķiriet pakalpojuma kontam lasīšanas piekļuvi."
"PHP temporary directory": "PHP pagaidu direktorijs"
"directory writable by this process": "direktorijs, kurā šim procesam ir rakstīšanas tiesības"
"missing or not writable": "trūkst vai nav rakstāms"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurējiet sys_temp_dir kā esošu direktoriju, kurā instalēšanas kontam ir rakstīšanas tiesības. Iebūvētie importi izmanto pagaidu failus."
"Background worker launch": "Fona darbinieka palaišana"
"required PHP functions available; launch not exercised": "nepieciešamās PHP funkcijas ir pieejamas; palaišana nav veikta"
"required PHP launch function disabled": "nepieciešamā PHP palaišanas funkcija ir atspējota"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Iespējojiet exec tīmekļa PHP izpildvidei vai izmantojiet pilnvaroto CLI instalētāju."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Iespējojiet popen, pclose tīmekļa PHP izpildvidei vai izmantojiet pilnvaroto CLI instalētāju."
"Database transaction ownership": "Datubāzes transakciju īpašumtiesības"
"autocommit enabled; no caller-owned transaction": "autocommit iespējots; nav izsaucējam piederošas transakcijas"
"autocommit disabled or caller transaction active": "autocommit atspējots vai aktīva izsaucēja transakcija"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Palaidiet instalēšanu ārpus izsaucējam piederošas transakcijas un iespējojiet autocommit tās mutāciju savienojumā."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Atjaunojiet laidiena direktoriju un piešķiriet instalēšanas kontam rakstīšanas piekļuvi veidņu resursu importēšanai. Nepadariet to rakstāmu visiem."
"Worker file: install/background.php": "Darbinieka fails: install/background.php"
"Worker file: bin/legacy-installer.php": "Darbinieka fails: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Darbinieka fails: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importa galamērķis: resource/snmp_queries"
"Import destination: resource/script_server": "Importa galamērķis: resource/script_server"
"Import destination: resource/script_queries": "Importa galamērķis: resource/script_queries"
"Import destination: scripts": "Importa galamērķis: scripts"
"Database privileges": "Datubāzes privilēģijas"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Efektīvās migrācijas privilēģijas, tostarp aktīvās lomas un objektiem specifiskās tiesības, netika verificētas."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Palūdziet datubāzes administratoram pārbaudīt nepieciešamos tabulu ierakstus, shēmas izmaiņas, trigerus un rutīnas instalēšanas kontam un shēmai. Nepiešķiriet globālā administratora privilēģijas."
"Compare web and worker runtimes": "Salīdzināt tīmekļa un darbinieka izpildvides"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tas skaidri sāk īsu tikai lasāmu PHP zondi. Tas nerezervē instalētāju, neraksta failus un nesazinās ar ierīcēm."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Zonde pārmanto šo tīmekļa procesu un izmanto konfigurēto instalētāja PHP interpretu. Tā nepārbauda atsevišķu plānotāju vai pakalpojumu."
"I authorize the read-only worker runtime comparison.": "Es pilnvaroju tikai lasāmu darbinieka izpildvides salīdzinājumu."
"Compare runtimes": "Salīdzināt izpildvides"
"Runtime comparison results": "Izpildvides salīdzinājuma rezultāti"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Atļauju un identitātes atšķirības var būt apzinātas. Tikai lasāmi novērojumi nepierāda, ka rakstīšana vai instalēšana būs veiksmīga."
"Confirm the read-only worker runtime comparison.": "Apstipriniet tikai lasāmo darbinieka izpildvides salīdzinājumu."
"The runtime comparison is unavailable.": "Izpildvides salīdzinājums nav pieejams."
"Shared application secret": "Koplietotais lietojumprogrammas noslēpums"
"A strong web application secret is required before comparison.": "Pirms salīdzināšanas ir nepieciešams spēcīgs tīmekļa lietojumprogrammas noslēpums."
"Runtime comparison": "Izpildvides salīdzinājums"
"The configured worker runtime did not confirm a bounded comparison.": "Konfigurētā darbinieka izpildvide neapstiprināja ierobežotu salīdzinājumu."
"The inherited worker secret could not be confirmed against the web secret.": "Mantoto darbinieka noslēpumu nevarēja apstiprināt pret tīmekļa noslēpumu."
"PHP runtime comparison": "PHP izpildvides salīdzinājums"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Abām izpildvidēm jāatbalsta PHP 8.4; atšķirīgas ielāpu versijas prasa pārskatīšanu."
"Required extension comparison": "Nepieciešamo paplašinājumu salīdzinājums"
"Required extension availability is checked; differing versions require review.": "Tiek pārbaudīta nepieciešamo paplašinājumu pieejamība; atšķirīgas versijas prasa pārskatīšanu."
"Process identity comparison": "Procesa identitātes salīdzinājums"
"Effective process identity is unavailable on this platform.": "Efektīvā procesa identitāte šajā platformā nav pieejama."
"Effective process identities match.": "Efektīvās procesa identitātes sakrīt."
"Effective process identities differ; separate service accounts may be intentional.": "Efektīvās procesa identitātes atšķiras; atsevišķi pakalpojumu konti var būt apzināta izvēle."
"Directory access comparison": "Direktoriju piekļuves salīdzinājums"
"Read-only directory permission observations match.": "Tikai lasāmās direktoriju atļauju novērojumi sakrīt."
"Directory locations or permission observations differ; review the service-account roles.": "Direktoriju atrašanās vietas vai atļauju novērojumi atšķiras; pārskatiet pakalpojuma konta lomas."
"Worker directory read and traversal": "Darbinieka direktorija lasīšana un šķērsošana"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Nepieciešamajiem darbinieka direktoriem jāpastāv un jāatļauj lasīšana un šķērsošana. Rakstīšana netika testēta."
"The inherited worker secret matches the web secret for this private challenge.": "Mantotais darbinieka noslēpums atbilst tīmekļa noslēpumam šim privātajam izaicinājumam."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Pārskatiet konfigurēto PHP interpretu, nepieciešamos paplašinājumus, mantoto noslēpumu un pakalpojuma konta direktoriju atļaujas. Rakstīšana vai instalētāja palaišana netika veikta."
"advisory": "ieteikums"
