"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Tani waa xaraf-taxane gaar ah oo lala midayn doono xaraf-taxanaha sysName ee aaladda si loogu lammaaniyo Qaab-dhismeedkan Otomaatiga. Tibaax kasta oo joogto ah oo Perl ah waa la isticmaali karaa marka lagu daro tibaax kasta oo SQL Where ah."
