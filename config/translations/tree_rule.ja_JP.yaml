"A useful name for this Rule.": "このルールの便利な名前。"
"Access denied.": "アクセスが拒否されました。"
"Add Tree Rule": "ツリールールを追加"
"Back to Tree Rules": "ツリールール一覧に戻る"
"Check this box to enable this rule.": "このルールを有効にするには、このボックスをオンにします。"
"Choose a Tree for the new Tree Items.": "新しいツリー項目のツリーを選択してください。"
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "選択したツリーで紐付けるヘッダーまたはルートを選択してください。このルールが実行される時点でも存在することを確認してください。"
"Choose a header of the selected Tree.": "選択したツリーのヘッダーを選択してください。"
"Choose a listed Graph Grouping Style.": "一覧にあるグラフグループ化スタイルを選択してください。"
"Choose a listed Leaf Item Type.": "一覧にあるリーフ項目タイプを選択してください。"
"Choose an existing Tree.": "既存のツリーを選択してください。"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ツリー上でこの特定ホストのグラフを描画する際のグループ化方法を選択してください。デバイスリーフに使用されます。"
"Data Query Index": "データクエリインデックス"
"Device": "デバイス"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "デバイスリーフでは、グラフ列またはグラフテンプレート列に対する基準を使用できません。リーフ項目タイプを「デバイス」に変更する際、これらの基準を削除するにはこのチェックボックスをオンにしてください。削除した基準は復元できません。"
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "デバイスリーフではグラフベースの基準を使用できません。保存するには %count% 件の基準の削除を確認してください。"
"Edit Tree Rule": "ツリールールを編集"
"Enable Rule": "ルールを有効にします"
"Enter a name.": "名前を入力してください。"
"Enter at most %count% characters.": "最大 %count% 文字以内で入力してください。"
"Enter single-line text.": "1 行のテキストを入力してください。"
"Graph": "グラフ"
"Graph Grouping Style": "グラフのグループスタイル"
