"A useful name for this Rule.": "Un nome utile per questa regola."
"Access denied.": "Accesso negato."
"Add Tree Rule": "Aggiungi regola albero"
"Back to Tree Rules": "Torna alle regole albero"
"Check this box to enable this rule.": "Selezionare questa casella per attivare questa regola."
"Choose a Tree for the new Tree Items.": "Scegliere un albero per i nuovi elementi dell'albero."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Scegli un'intestazione dell'albero selezionato a cui collegare l'elemento, oppure la sua radice. Assicurati che esista ancora quando questa regola viene eseguita."
"Choose a header of the selected Tree.": "Scegli un'intestazione dell'albero selezionato."
"Choose a listed Graph Grouping Style.": "Scegli uno stile di raggruppamento grafici elencato."
"Choose a listed Leaf Item Type.": "Scegli un tipo di elemento foglia elencato."
"Choose an existing Tree.": "Scegli un albero esistente."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Scegli come vengono raggruppati i grafici quando vengono disegnati per questo specifico host sull'albero. Usato per le foglie dispositivo."
"Data Query Index": "Indice delle query dati"
"Device": "Dispositivo"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Le foglie dispositivo non possono usare criteri sulle colonne di grafico o modello grafico. Quando cambi il tipo di elemento foglia in Dispositivo, seleziona questa casella per rimuovere tali criteri; non potranno essere recuperati."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Le foglie dispositivo non possono usare criteri basati su grafici. Conferma la rimozione di %count% criteri per salvare."
"Edit Tree Rule": "Modifica regola albero"
"Enable Rule": "Abilita regola"
"Enter a name.": "Inserisci un nome."
"Enter at most %count% characters.": "Inserisci al massimo %count% caratteri."
"Enter single-line text.": "Inserisci testo su una sola riga."
