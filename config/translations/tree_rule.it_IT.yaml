"Save outcome is uncertain. Reload before retrying.": "L'esito del salvataggio è incerto. Ricarica prima di riprovare."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Salva prima la regola; i relativi criteri di selezione oggetti e creazione albero vengono aggiunti in seguito."
"The Item Type that shall be dynamically added to the tree.": "Il tipo di articolo che deve essere aggiunto dinamicamente all'albero."
"The tree rule changed since you opened this form. Reload before saving.": "La regola albero è cambiata dopo l'apertura di questo modulo. Ricarica prima di salvare."
