"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Isang listahang pinaghihiwalay ng espasyo ng mga alternatibong DNS Server na gagamitin sa DNS resolution. Kung blangko, gagamitin ang OS ng poller upang i-resolve ang mga pangalan ng DNS."
