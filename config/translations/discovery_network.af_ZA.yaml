"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "'n Spasiegeskeide lys van alternatiewe DNS-bedieners om vir DNS-resolusie te gebruik. Indien leeg, sal die poller-bedryfstelsel gebruik word om DNS-name op te los."
