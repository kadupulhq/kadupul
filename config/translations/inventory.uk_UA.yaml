"Device associations updated.": "Прив'язки пристрою оновлено."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Вилучення прив'язки зберігає наявні графіки та історичні дані. Додавання прив'язки може створювати графіки через автоматизацію. Відповідні збирачі мають бути в мережі."
