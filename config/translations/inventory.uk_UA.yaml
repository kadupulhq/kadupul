"Confirm clearing statistics": "Підтвердити очищення статистики"
"Selected device statistics cleared.": "Статистику вибраних пристроїв очищено."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Скинути час відгуку, лічильники опитувань і доступність для цих пристроїв. Графіки, історичні дані та налаштування пристроїв зберігаються. Збирання статистики відновиться з наступного опитування."
"Synchronize device templates": "Синхронізувати шаблони пристроїв"
"Confirm synchronization": "Підтвердити синхронізацію"
"Selected device templates synchronized.": "Шаблони вибраних пристроїв синхронізовано."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Застосувати поточні призначені шаблони до цих пристроїв. Відсутні прив'язки графіків і запитів даних додаються, а невикористані прив'язки шаблонів графіків можуть бути видалені. Пристрої без шаблонів пропускаються. Наявні графіки та історичні дані зберігаються; автоматизація може створити нові графіки."
"Change device options": "Змінити параметри пристроїв"
"Confirm option changes": "Підтвердити зміну параметрів"
"Selected device options updated.": "Параметри вибраних пристроїв оновлено."
"Device options": "Параметри пристрою"
"Select at least one supported device option.": "Виберіть принаймні один підтримуваний параметр пристрою."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Змінюються лише позначені параметри. Непозначені параметри зберігають поточні значення. Вибір порожнього розташування очищає його."
"Update %option%": "Оновити %option%"
