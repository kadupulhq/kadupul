"Assign device templates": "Призначити шаблони пристроїв"
"Assign device collectors": "Призначити збирачів пристроїв"
"Confirm assignments": "Підтвердити призначення"
"Selected device assignments updated.": "Призначення вибраних пристроїв оновлено."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Вибране призначення застосовується до кожного переліченого пристрою. Зміна шаблону зберігає наявні графіки; автоматизація може створити нові графіки. Зміна збирача передає відповідальність за опитування."
