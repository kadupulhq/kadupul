"A useful name for this Rule.": "Користан назив за ово правило."
"Access denied.": "Приступ одбијен."
"Add Graph Rule": "Додај правило за графиконе"
"Back to Graph Rules": "Назад на правила за графиконе"
"Cancel": "Откажи"
"Check this box to enable this rule.": "Означите ово поље да омогућите ово правило."
"Choose a Data Query to apply to this rule.": "Изаберите упит података који ће се применити на ово правило."
"Choose a Graph Type": "Изаберите тип графикона"
"Choose a Graph Type of the selected Data Query.": "Изаберите тип графикона изабраног упита података."
"Choose an existing Data Query.": "Изаберите постојећи упит података."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Изаберите било који од доступних типова графикона изабраног упита података да примените на ово правило."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Кликните на Настави да обришете следећа правила за графиконе заједно са њиховим критеријумима за избор уређаја и креирање графикона."
"Click Continue to disable the following Graph Rules.": "Кликните на Настави да онемогућите следећа правила за графиконе."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Кликните на Настави да дуплирате следећа правила за графиконе. Опционо можете променити формат наслова за нова правила за графиконе, која почињу онемогућена."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Кликните на Настави да омогућите следећа правила за графиконе. Уверите се да су успешно тестирана."
"Continue": "Настави"
"Data Query": "Упит података"
"Delete Graph Rules": "Обриши правила за графиконе"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Исход брисања је неизвестан. Проверите листу правила за графиконе пре понављања."
"Delete selected": "Обриши изабрано"
"Device Selection and Graph Creation Criteria": "Критеријуми за избор уређаја и креирање графикона"
"Disable Graph Rules": "Онемогући правила за графиконе"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Исход онемогућавања је неизвестан. Проверите листу правила за графиконе пре понављања."
"Disable selected": "Онемогући изабрано"
"Duplicate Graph Rules": "Дуплирај правила за графиконе"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Исход дуплирања је неизвестан. Проверите листу правила за графиконе пре понављања."
"Duplicate selected": "Дуплирај изабрано"
"Edit Graph Rule": "Измени правило за графиконе"
"Enable Graph Rules": "Омогући правила за графиконе"
"Enable Rule": "Омогући правило"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Исход омогућавања је неизвестан. Проверите листу правила за графиконе пре понављања."
"Enable selected": "Омогући изабрано"
"Enter a name.": "Унесите назив."
"Enter a valid name format.": "Унесите исправан формат назива."
"Enter at most %count% characters.": "Унесите највише %count% знакова."
"Enter single-line text.": "Унесите текст у једном реду."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Сваки <rule_name> се замењује називом правила за графиконе које се копира."
"Graph Type": "Тип графикона"
"Graph rule not found.": "Правило за графиконе није пронађено."
"Graph rule saved.": "Правило за графиконе је сачувано."
"Invalid Graph Rule selection.": "Неисправан избор правила за графиконе."
"Name": "Назив"
"One or more selected Graph Rules no longer exist.": "Једно или више изабраних правила за графиконе више не постоје."
"Rule Selection [edit: %name%]": "Избор правила [измена: %name%]"
"Rule Selection [new]": "Избор правила [ново]"
"Save": "Сачувај"
"Save outcome is uncertain. Reload before retrying.": "Исход чувања је неизвестан. Поново учитајте пре понављања."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Прво сачувајте правило; његови критеријуми за избор уређаја и креирање графикона додају се након тога."
"Select": "Изабери"
"Select %name%": "Изабери %name%"
"Select at least one Graph Rule.": "Изаберите најмање једно правило за графиконе."
"Select at most 100 Graph Rules at a time.": "Изаберите највише 100 правила за графиконе одједном."
"Select up to %count% rows at a time.": "Изаберите до %count% редова одједном."
"The graph rule changed since you opened this form. Reload before saving.": "Правило за графиконе је промењено откако сте отворили овај образац. Поново учитајте пре чувања."
"The name format must give every copy a name of 1 to 255 characters.": "Формат назива мора свакој копији дати назив од 1 до 255 знакова."
"Title Format": "Формат наслова"
"Unable to load Graph Rules. Reload before retrying.": "Није могуће учитати правила за графиконе. Поново учитајте пре понављања."
"Unable to load the graph rule. Reload before retrying.": "Није могуће учитати правило за графиконе. Поново учитајте пре понављања."
"Unexpected fields were submitted.": "Послата су неочекивана поља."
