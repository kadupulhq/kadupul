"A useful name for this Rule.": "'n Nuttige naam vir hierdie reël."
"Access denied.": "Toegang geweier."
"Add Tree Rule": "Voeg boomreël by"
"Back to Tree Rules": "Terug na boomreëls"
"Check this box to enable this rule.": "Merk hierdie blokkie om hierdie reël te aktiveer."
"Choose a Tree for the new Tree Items.": "Kies 'n boom vir die nuwe boomitems."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Kies 'n opskrif van die gekose boom om aan te haak, of sy wortel. Maak seker dat dit steeds bestaan wanneer hierdie reël uitgevoer word."
"Choose a header of the selected Tree.": "Kies 'n opskrif van die gekose boom."
"Choose a listed Graph Grouping Style.": "Kies 'n gelyste grafiekgroepeerstyl."
"Choose a listed Leaf Item Type.": "Kies 'n gelyste blaaritemtipe."
"Choose an existing Tree.": "Kies 'n bestaande boom."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Kies hoe grafieke gegroepeer word wanneer dit vir hierdie spesifieke gasheer op die boom geteken word. Word vir toestelblare gebruik."
"Data Query Index": "Datanavraag-indeks"
"Device": "Toestel"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Toestelblare kan nie kriteria op grafiek- of grafieksjabloonkolomme gebruik nie. Wanneer jy die blaaritemtipe na Toestel verander, merk hierdie blokkie om daardie kriteria te verwyder; dit kan nie herwin word nie."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Toestelblare kan nie grafiekgebaseerde kriteria gebruik nie. Bevestig die verwydering van %count% kriteria om te stoor."
"Edit Tree Rule": "Wysig boomreël"
"Enable Rule": "Aktiveer reël"
"Enter a name.": "Voer 'n naam in."
"Enter at most %count% characters.": "Voer hoogstens %count% karakters in."
"Enter single-line text.": "Voer enkelreël-teks in."
"Graph": "Grafiek"
"Graph Grouping Style": "Grafiekgroeperingstyl"
"Graph Template": "Grafieksjabloon"
"Leaf Item Type": "Blaaritemtipe"
"Name": "Naam"
"Object Selection and Tree Creation Criteria": "Objekseleksie- en boomskeppingskriteria"
"Optional: Sub-Tree Item": "Opsioneel: Sub-boomitem"
"Remove graph-based criteria": "Verwyder grafiekgebaseerde kriteria"
"Save": "Stoor"
"Save outcome is uncertain. Reload before retrying.": "Stoor-uitkoms is onseker. Herlaai voordat jy weer probeer."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Stoor eers die reël; sy Objekkeuse- en Boomskepping-kriteria word daarna bygevoeg."
"The Item Type that shall be dynamically added to the tree.": "Die Itemtipe wat dinamies by die boom gevoeg sal word."
"The tree rule changed since you opened this form. Reload before saving.": "Die boomreël het verander sedert jy hierdie vorm oopgemaak het. Herlaai voordat jy stoor."
"Tree": "Boom"
"Tree Rule Selection [edit: %name%]": "Boomreël-keuse [wysig: %name%]"
"Tree Rules Selection [new]": "Boomreëls-keuse [nuut]"
"Tree rule not found.": "Boomreël nie gevind nie."
"Tree rule saved.": "Boomreël gestoor."
"Unable to load the tree rule. Reload before retrying.": "Kan nie die boomreël laai nie. Herlaai voordat jy weer probeer."
"Unexpected fields were submitted.": "Onverwagte velde is ingedien."
