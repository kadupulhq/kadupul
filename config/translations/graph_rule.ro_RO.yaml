"A useful name for this Rule.": "Un nume util pentru această regulă."
"Access denied.": "Acces refuzat."
"Add Graph Rule": "Adaugă regulă de grafic"
"Back to Graph Rules": "Înapoi la regulile de grafice"
"Cancel": "Anulează"
"Check this box to enable this rule.": "Bifați această casetă pentru a activa această regulă."
"Choose a Data Query to apply to this rule.": "Alegeți o interogare de date de aplicat acestei reguli."
"Choose a Graph Type": "Alegeți un tip de grafic"
"Choose a Graph Type of the selected Data Query.": "Alegeți un tip de grafic al interogării de date selectate."
"Choose an existing Data Query.": "Alegeți o interogare de date existentă."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Alegeți oricare dintre tipurile de grafice disponibile ale interogării de date selectate pentru a le aplica acestei reguli."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Faceți clic pe Continuă pentru a șterge următoarele reguli de grafice împreună cu criteriile lor de selecție a dispozitivelor și de creare a graficelor."
"Click Continue to disable the following Graph Rules.": "Faceți clic pe Continuă pentru a dezactiva următoarele reguli de grafice."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Faceți clic pe Continuă pentru a duplica următoarele reguli de grafice. Opțional, puteți schimba formatul titlului pentru noile reguli de grafice, care pornesc dezactivate."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Faceți clic pe Continuă pentru a activa următoarele reguli de grafice. Asigurați-vă că au fost testate cu succes."
