"Choose an existing Tree.": "ਮੌਜੂਦ ਟ੍ਰੀ ਚੁਣੋ।"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ਚੁਣੋ ਕਿ ਟ੍ਰੀ 'ਤੇ ਇਸ ਖ਼ਾਸ ਹੋਸਟ ਲਈ ਗ੍ਰਾਫ਼ ਬਣਾਏ ਜਾਣ ਵੇਲੇ ਉਨ੍ਹਾਂ ਨੂੰ ਕਿਵੇਂ ਗਰੁੱਪ ਕੀਤਾ ਜਾਵੇ। ਡਿਵਾਈਸ ਲੀਫ਼ਾਂ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ।"
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "ਹੇਠਾਂ ਦਿੱਤੇ ਟ੍ਰੀ ਨਿਯਮ ਉਨ੍ਹਾਂ ਦੀ ਆਬਜੈਕਟ ਚੋਣ ਅਤੇ ਟ੍ਰੀ ਬਣਾਉਣ ਦੇ ਮਾਪਦੰਡਾਂ ਸਮੇਤ ਮਿਟਾਉਣ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ।"
"Click Continue to disable the following Tree Rules.": "ਹੇਠਾਂ ਦਿੱਤੇ ਟ੍ਰੀ ਨਿਯਮ ਅਸਮਰੱਥ ਕਰਨ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ।"
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "ਹੇਠਾਂ ਦਿੱਤੇ ਟ੍ਰੀ ਨਿਯਮਾਂ ਦੀਆਂ ਨਕਲਾਂ ਬਣਾਉਣ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ। ਤੁਸੀਂ ਨਵੇਂ ਟ੍ਰੀ ਨਿਯਮਾਂ ਲਈ ਸਿਰਲੇਖ ਫ਼ਾਰਮੈਟ ਵਿਕਲਪਕ ਤੌਰ 'ਤੇ ਬਦਲ ਸਕਦੇ ਹੋ, ਜੋ ਅਸਮਰੱਥ ਅਵਸਥਾ ਵਿੱਚ ਸ਼ੁਰੂ ਹੁੰਦੇ ਹਨ।"
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "ਹੇਠਾਂ ਦਿੱਤੇ ਟ੍ਰੀ ਨਿਯਮ ਸਮਰੱਥ ਕਰਨ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ। ਯਕੀਨੀ ਬਣਾਓ ਕਿ ਉਨ੍ਹਾਂ ਦੀ ਸਫਲਤਾਪੂਰਵਕ ਜਾਂਚ ਹੋ ਚੁੱਕੀ ਹੈ।"
