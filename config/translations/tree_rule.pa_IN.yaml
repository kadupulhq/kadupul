"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "ਚੁਣੇ ਟ੍ਰੀ ਦਾ ਇੱਕ ਸਿਰਲੇਖ ਚੁਣੋ ਜਿਸ ਵਿੱਚ ਜੋੜਨਾ ਹੈ, ਜਾਂ ਇਸਦਾ ਰੂਟ। ਯਕੀਨੀ ਬਣਾਓ ਕਿ ਇਹ ਨਿਯਮ ਚੱਲਣ ਵੇਲੇ ਵੀ ਮੌਜੂਦ ਹੈ।"
