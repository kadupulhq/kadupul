"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "ਡਿਵਾਈਸ ਲੀਫ਼ਾਂ ਗ੍ਰਾਫ਼-ਆਧਾਰਿਤ ਮਾਪਦੰਡ ਨਹੀਂ ਵਰਤ ਸਕਦੀਆਂ। ਸੰਭਾਲਣ ਲਈ %count% ਮਾਪਦੰਡਾਂ ਨੂੰ ਹਟਾਉਣ ਦੀ ਪੁਸ਼ਟੀ ਕਰੋ।"
