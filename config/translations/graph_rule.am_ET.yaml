"A useful name for this Rule.": "ለዚህ ደንብ ጠቃሚ ስም።"
"Access denied.": "መዳረሻ ተከልክሏል።"
"Add Graph Rule": "የግራፍ ደንብ አክል"
"Back to Graph Rules": "ወደ ግራፍ ደንቦች ተመለስ"
"Check this box to enable this rule.": "ይህንን ደንብ ለማንቃት ይህንን ሳጥን ምልክት ያድርጉ።"
"Choose a Data Query to apply to this rule.": "በዚህ ደንብ ላይ የሚተገበር የውሂብ መጠይቅ ይምረጡ።"
"Choose a Graph Type": "የግራፍ ዓይነት ይምረጡ"
"Choose a Graph Type of the selected Data Query.": "የተመረጠውን የውሂብ መጠይቅ የግራፍ ዓይነት ይምረጡ።"
"Choose an existing Data Query.": "ያለ የውሂብ መጠይቅ ይምረጡ።"
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "በዚህ ደንብ ላይ የሚተገበር ከተመረጠው የውሂብ መጠይቅ ማንኛውንም የሚገኝ የግራፍ ዓይነት ይምረጡ።"
"Data Query": "የውሂብ መጠይቅ"
"Device Selection and Graph Creation Criteria": "የመሣሪያ ምርጫ እና የግራፍ ፍጠራ መስፈርቶች"
"Edit Graph Rule": "የግራፍ ደንብ አርትዕ"
"Enable Rule": "ደንብ አንቃ"
"Enter a name.": "ስም ያስገቡ።"
"Enter at most %count% characters.": "ቢበዛ %count% ቁምፊዎችን ያስገቡ።"
"Enter single-line text.": "ባለ አንድ መስመር ጽሑፍ ያስገቡ።"
"Graph Type": "የግራፍ ዓይነት"
"Graph rule not found.": "የግራፍ ደንብ አልተገኘም።"
"Graph rule saved.": "የግራፍ ደንብ ተቀምጧል።"
"Name": "ስም"
"Rule Selection [edit: %name%]": "የደንብ ምርጫ [አርትዕ: %name%]"
"Rule Selection [new]": "የደንብ ምርጫ [አዲስ]"
"Save": "አስቀምጥ"
"Save outcome is uncertain. Reload before retrying.": "የማስቀመጥ ውጤቱ እርግጠኛ አይደለም። እንደገና ከመሞከርዎ በፊት ዳግም ይጫኑ።"
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "መጀመሪያ ደንቡን ያስቀምጡ፤ የመሣሪያ ምርጫው እና የግራፍ መፍጠሪያ መስፈርቶቹ በኋላ ይታከላሉ።"
"The graph rule changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የግራፍ ደንቡ ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"Unable to load the graph rule. Reload before retrying.": "የግራፍ ደንቡን መጫን አልተቻለም። እንደገና ከመሞከርዎ በፊት እንደገና ይጫኑ።"
"Unexpected fields were submitted.": "ያልተጠበቁ መስኮች ገብተዋል።"
