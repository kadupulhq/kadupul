"A useful name for this Rule.": "Izina ry'ingirakamaro ry'iri tegeko."
"Access denied.": "Uburenganzira bwanzwe."
"Add Tree Rule": "Ongeraho Itegeko ry'Igiti"
"Back to Tree Rules": "Subira ku Mategeko y'Igiti"
"Cancel": "Hagarika"
"Check this box to enable this rule.": "Hitamo aka gasanduku kugira ngo ukoreshe iri tegeko."
"Choose a Tree for the new Tree Items.": "Hitamo igiti kizashyirwamo ibigize igiti bishya."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Hitamo umutwe w'Igiti cyahiswemo wo guhuzaho, cyangwa umuzi wacyo. Menya neza ko bigihari igihe iri tegeko rishyizwe mu bikorwa."
"Choose a header of the selected Tree.": "Hitamo umutwe w'Igiti cyahiswemo."
"Choose a listed Graph Grouping Style.": "Hitamo Uburyo bwo Gushyira Ibishushanyo mu Matsinda buri ku rutonde."
"Choose a listed Leaf Item Type.": "Hitamo Ubwoko bw'Ikigize Ikibabi buri ku rutonde."
"Choose an existing Tree.": "Hitamo Igiti gisanzweho."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Hitamo uburyo ibishushanyo bishyirwa mu matsinda iyo bishushanyijwe kuri iyi mudasobwa yakira yihariye iri ku giti. Bikoreshwa ku bibabi by'Igikoresho."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Kanda Komeza kugira ngo usibe Amategeko y'Igiti akurikira hamwe n'Ibipimo byayo byo Guhitamo Ibintu no Kurema Igiti."
"Click Continue to disable the following Tree Rules.": "Kanda Komeza kugira ngo uhagarike Amategeko y'Igiti akurikira."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Kanda Komeza kugira ngo ukore kopi y'Amategeko y'Igiti akurikira. Ushobora guhitamo guhindura imiterere y'umutwe w'Amategeko mashya y'Igiti, atangira ahagaritswe."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Kanda Komeza kugira ngo wemeze Amategeko y'Igiti akurikira. Menya neza ko yageragejwe neza."
"Continue": "Komeza"
"Data Query Index": "Urutonde rw'ishakisha ry'amakuru"
"Delete Tree Rules": "Siba Amategeko y'Igiti"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Ibyavuye mu gusiba ntibisobanutse. Genzura urutonde rw'Amategeko y'Igiti mbere yo kongera kugerageza."
"Delete selected": "Siba ibyatoranyijwe"
"Device": "Igikoresho"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Ibibabi by'Igikoresho ntibishobora gukoresha ibipimo ku nkingi z'igishushanyo cyangwa z'inyandikorugero y'igishushanyo. Igihe uhindura Ubwoko bw'Ikigize Ikibabi bukaba Igikoresho, shyira akamenyetso muri aka kazu kugira ngo ukureho ibyo bipimo; ntibishobora kugarurwa."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Ibibabi by'Igikoresho ntibishobora gukoresha ibipimo bishingiye ku gishushanyo. Emeza ikurwaho ry'ibipimo %count% kugira ngo ubike."
"Disable Tree Rules": "Hagarika Amategeko y'Igiti"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Ibyavuye mu guhagarika ntibisobanutse. Genzura urutonde rw'Amategeko y'Igiti mbere yo kongera kugerageza."
"Disable selected": "Hagarika ibyahiswemo"
"Duplicate Tree Rules": "Kora kopi y'Amategeko y'Igiti"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Ibyavuye mu gukora kopi ntibisobanutse. Genzura urutonde rw'Amategeko y'Igiti mbere yo kongera kugerageza."
"Duplicate selected": "Kora kopi y'ibyahiswemo"
"Edit Tree Rule": "Hindura Itegeko ry'Igiti"
"Enable Rule": "Koresha itegeko"
"Enable Tree Rules": "Emeza Amategeko y'Igiti"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Ibyavuye mu kwemeza ntibisobanutse. Genzura urutonde rw'Amategeko y'Igiti mbere yo kongera kugerageza."
"Enable selected": "Koresha ibyahiswemo"
"Enter a name.": "Injiza izina."
"Enter a valid name format.": "Andika imiterere yemewe y'izina."
"Enter at most %count% characters.": "Injiza inyuguti zitarenze %count%."
"Enter single-line text.": "Injiza umwandiko w'umurongo umwe."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Buri <rule_name> risimbuzwa izina ry'Itegeko ry'Igiti riri gukorwamo kopi."
"Graph": "Igishushanyo"
"Graph Grouping Style": "Uburyo bwo guhuriza hamwe ibishushanyo"
"Graph Template": "Inyandikorugero y'igishushanyo"
"Invalid Tree Rule selection.": "Ihitamo ry'Itegeko ry'Igiti ritemewe."
"Leaf Item Type": "Ubwoko bw'ikintu cy'ikibabi"
"Name": "Izina"
"Object Selection and Tree Creation Criteria": "Ibipimo byo Guhitamo Ibintu no Kurema Igiti"
"One or more selected Tree Rules no longer exist.": "Rimwe cyangwa menshi mu Mategeko y'Igiti yahiswemo ntakiriho."
"Optional: Sub-Tree Item": "Bitari itegeko: Ikintu cyo mu ishami ry'igiti"
"Remove graph-based criteria": "Kuraho ibipimo bishingiye ku gishushanyo"
"Save": "Bika"
"Save outcome is uncertain. Reload before retrying.": "Nta cyemeza ko kubika byakunze. Ongera utangize ipaji mbere yo kongera kugerageza."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Banza ubike iri tegeko; Ibipimo byaryo byo Guhitamo Ibintu no Kurema Igiti byongerwaho nyuma."
"Select": "Hitamo"
"Select %name%": "Hitamo %name%"
"Select at least one Tree Rule.": "Hitamo nibura Itegeko ry'Igiti rimwe."
"Select at most 100 Tree Rules at a time.": "Hitamo Amategeko y'Igiti atarenze 100 icyarimwe."
"Select up to %count% rows at a time.": "Hitamo imirongo itarenze %count% icyarimwe."
"The Item Type that shall be dynamically added to the tree.": "Ubwoko bw'ikintu kizajya cyongerwa mu giti mu buryo bwikora."
"The name format must give every copy a name of 1 to 255 characters.": "Imiterere y'izina igomba guha buri kopi izina rifite inyuguti kuva kuri 1 kugeza kuri 255."
"The tree rule changed since you opened this form. Reload before saving.": "Itegeko ry'igiti ryarahindutse kuva wafungura iyi fishi. Ongera uvugurure paji mbere yo kubika."
"Title Format": "Imiterere y'umutwe"
"Tree": "Igiti"
"Tree Rule Selection [edit: %name%]": "Guhitamo Itegeko ry'Igiti [hindura: %name%]"
"Tree Rules Selection [new]": "Ihitamo ry'Amategeko y'Igiti [gishya]"
"Tree rule not found.": "Itegeko ry'igiti ntiryabonetse."
"Tree rule saved.": "Itegeko ry'igiti ryabitswe."
"Unable to load Tree Rules. Reload before retrying.": "Ntibyashobotse gukurura Amategeko y'Igiti. Ongera uvugurure paji mbere yo kongera kugerageza."
"Unable to load the tree rule. Reload before retrying.": "Ntibyashobotse gukurura itegeko ry'igiti. Ongera uvugurure paji mbere yo kongera kugerageza."
"Unexpected fields were submitted.": "Imyanya itari yitezwe yoherejwe."
