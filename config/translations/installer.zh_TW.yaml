"Finishing tasks only. Schema migrations will not be replayed.": "僅執行收尾工作。不會重播結構描述移轉。"
"I accept the license terms": "我接受授權條款"
"I authorize discovery of the displayed range": "我授權對顯示的範圍進行探索"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "我已檢查日誌並確認先前的背景工作程序及其子程序皆已停止"
"I checked the previous attempt and accept that some changes may already be committed": "我已檢查先前的嘗試並接受部分變更可能已經認可"
"I reviewed this plan and have the required backups": "我已檢視此計畫並備妥所需的備份"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "若背景工作程序意外停止，請保留 log/cacti.log 並確認其程序已結束，再明確重試。等待狀態並不代表啟動成功。"
"Importing templates": "正在匯入範本"
"Install Kadupul": "安裝 Kadupul"
"Installation and upgrade": "安裝與升級"
"Installation request was rejected.": "安裝請求已遭拒絕。"
"Installation steps": "安裝步驟"
"Installed": "已安裝"
"Keep a backup of the database, RRD files, configuration and secret material.": "請保留資料庫、RRD 檔案、組態設定與密鑰資料的備份。"
"Language": "語言"
"Large tables may require the dedicated CLI conversion tool before installation.": "大型資料表在安裝前可能需要使用專用的 CLI 轉換工具。"
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "將密鑰欄位留白即可保留已儲存的憑證。密鑰永遠不會再次顯示。"
"License": "授權條款"
"No action needed": "無須採取動作"
"Observed": "已觀測"
"Open the console": "開啟主控台"
"Operation": "操作"
"Override discovery SNMP settings": "覆寫探索 SNMP 設定"
"Pass": "通過"
"Poller interval in seconds": "輪詢器間隔（秒）"
"Preparing CSRF protection": "正在準備 CSRF 防護"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "進度顯示最後記錄的階段。重新整理此頁面絕對不會啟動或重試背景工作程序。"
"Recover stopped attempt": "復原已停止的嘗試"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "復原作業會保留已儲存的選取項目，且絕對不會終止運作中的背景工作程序。重試前請再次檢視計畫。"
"Review": "檢視"
"Review installation plan": "檢視安裝計畫"
"Run": "執行"
"Run reviewed plan": "執行已檢視的計畫"
"Save and review": "儲存並檢視"
"Scope": "範圍"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "無法取得狀態。已儲存的進度會保留。請重新整理以重新連線；請勿再次送出安裝。"
"Synchronizing collectors": "正在同步收集器"
"Table conversions": "資料表轉換"
"Templates": "範本"
"The database version matches this application. Installation does not establish that polling is healthy.": "資料庫版本與此應用程式相符。安裝完成並不代表輪詢運作正常。"
"The request outcome is unknown. Check execution status before retrying.": "請求結果未知。重試前請先檢查執行狀態。"
"Theme": "佈景主題"
"Verify": "驗證"
"Verify the poller schedule and service account.": "驗證輪詢器排程與服務帳戶。"
"Version change": "版本變更"
"Waiting for the installation worker": "正在等待安裝背景工作程序"
"collector": "收集器"
"complete": "完成"
"failed": "失敗"
"finish": "完成"
"install": "安裝"
"not_started": "尚未開始"
"partial": "部分完成"
"running": "執行中"
"succeeded": "成功"
"upgrade": "升級"
"waiting": "等待中"
"Accept the license before saving the installation plan.": "儲存安裝計畫前請先接受授權條款。"
"Invalid installation form.": "無效的安裝表單。"
"Access denied.": "拒絕存取。"
"Confirm the recovery warning before retrying.": "重試前請先確認復原警告。"
"Review and confirm the current installation plan.": "檢視並確認目前的安裝計畫。"
"Confirm the discovery scope before starting.": "開始前請先確認探索範圍。"
"Resolve the blocking checks before starting.": "開始前請先解決封鎖性的檢查項目。"
"Too many installer options.": "安裝程式選項過多。"
"Invalid installer option name.": "無效的安裝程式選項名稱。"
"Unknown or malformed installer option.": "未知或格式錯誤的安裝程式選項。"
"Installer options must be scalar values.": "安裝程式選項必須為純量值。"
"Installer option is too long or contains a null byte.": "安裝程式選項過長或包含 null 位元組。"
"Installer IDs and intervals must be whole numbers.": "安裝程式 ID 與間隔必須為整數。"
"Installer ID or interval is outside its supported range.": "安裝程式 ID 或間隔超出支援範圍。"
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "無法繼續安裝。重試前請先重新載入狀態並檢視封鎖性的檢查項目。"
"Confirm that the previous worker has stopped before recovering its plan.": "復原其計畫前，請確認先前的背景工作程序已停止。"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "資料庫已安裝，但部分收集器仍需要進行同步。請在檢查其狀態後重試收尾工作。"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "安裝已停止。請保留安裝程式日誌、修正原因並明確確認重試。部分資料庫變更可能已經認可。授權重試前請先檢查外掛程式清理狀態。"
"Next action": "後續動作"
"Follow the execution status. Do not start another attempt while a worker is active.": "請關注執行狀態。當背景工作程序仍在運作時，請勿啟動另一次嘗試。"
"Complete the recovery checklist before retrying.": "重試前請先完成復原檢查清單。"
"Verify collection and graph operation before enabling discovery.": "啟用探索前請先驗證收集與圖表運作是否正常。"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "請解決受阻的系統需求，然後重新檢查。已儲存的選取項目將予保留。"
"Review the planned changes and backup checklist before authorizing execution.": "授權執行前，請先檢視規劃的變更與備份檢查清單。"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "選擇收集設定檔並接受授權條款。需要時可展開選用設定。"
"Download installation diagnostics": "下載安裝診斷資訊"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "開啟圖表並確認其 RRD 資料在輪詢器週期後有更新。"
"Requirement details": "系統需求詳細資訊"
"Recover": "復原"
"Recovery checklist": "復原檢查清單"
"Preserve log/cacti.log and record the failed attempt.": "請保留 log/cacti.log 並記錄失敗的嘗試。"
"Confirm that the previous worker and its child processes have stopped.": "確認先前的背景工作程序及其子程序均已停止。"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "請檢查已認可的變更、收集器同步狀況與外掛程式清理狀態。修正原因後再重試。"
"Review the saved plan again, then explicitly authorize a retry.": "請再次檢視已儲存的計畫，然後明確授權重試。"
"Recover a stopped worker": "復原已停止的背景工作程序"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "僅在確認此嘗試已不再執行後才使用復原。復原不會停止正在執行的程序。"
"Collector and installation mode": "收集器與安裝模式"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "部署組態決定了收集器角色與資料庫連線。啟動收集器前請先驗證主要伺服器組態。"
"Discovery and SNMP settings": "探索與 SNMP 設定"
"Keep discovery disabled until collection and collector connectivity have been verified.": "在收集作業與收集器連線能力驗證完成前，請保持停用探索。"
"Template selection": "範本選取"
"Templates selected for import": "已選取要匯入的範本"
"No templates selected.": "未選取範本。"
"Backup checklist": "備份檢查清單"
"Database backup and a tested restoration procedure.": "資料庫備份與經過測試的還原程序。"
"RRD files and the service account permissions needed to restore them.": "RRD 檔案及還原所需的服務帳戶權限。"
"Configuration, keys and plugin data outside the database.": "資料庫以外的組態設定、金鑰與外掛程式資料。"
"Post-installation checks": "安裝後檢查"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "已驗證的檢查僅涵蓋所顯示的佐證資料。尚未評估的檢查仍需操作人員驗證。"
"Operational checks still require operator verification.": "營運檢查仍需操作人員驗證。"
"Status": "狀態"
"verified": "已驗證"
"action_required": "需要處理"
"not_assessed": "尚未評估"
"Database schema": "資料庫結構描述"
"Stored schema matches the application target.": "已儲存的結構描述與應用程式目標相符。"
"Target schema completion has not been confirmed.": "尚未確認目標結構描述是否完成。"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "在認定結構描述升級完成前，請先檢視安裝結果並解決失敗項目。"
"Installation outcome": "安裝結果"
"A successful receipt matches the current target schema.": "成功的執行回執與目前目標結構描述相符。"
"A complete successful installation outcome has not been confirmed.": "尚未確認安裝是否已完整成功完成。"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "請保留安裝程式日誌，並於需要時使用明確的復原或重試程序。"
"Collector synchronization": "收集器同步"
"The completed installer reports pending collector synchronization.": "已完成的安裝程式回報尚有待處理的收集器同步作業。"
"The completed installer reports no pending collectors.": "已完成的安裝程式回報目前沒有待處理的收集器。"
"Collector completion remains unconfirmed by this partial receipt.": "此部分回執仍無法確認收集器已完成作業。"
"Collector completion is not established by this installation outcome.": "此安裝結果並未確立收集器已完成作業。"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "針對部分完成的結果，請檢視收集器狀態並重試收尾工作。這並不會驗證後續的收集新鮮度。"
"Scheduled collection": "排程收集"
"No poller or device was contacted by this assessment.": "此評估未連線至任何輪詢器或裝置。"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "確認已設定的排程器以預期的服務帳戶執行輪詢器，並檢視其下一個正常週期。"
"Graph data": "圖表資料"
"Live samples and RRD updates were not exercised.": "尚未演練即時樣本與 RRD 更新。"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "在正常收集週期後，確認預期的圖表有收到新樣本並檢視輪詢器錯誤。"
"Recovery readiness": "復原就緒狀態"
"Backup restoration was not exercised.": "尚未演練備份還原作業。"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "在仰賴復原之前，請先驗證資料庫、RRD 檔案、組態設定與金鑰資料的隔離還原。"
"No persisted local poller start has been recorded.": "尚未記錄任何持久化的本機輪詢器啟動紀錄。"
"Persisted poller timing is invalid and cannot establish scheduler health.": "持久化的輪詢器時間資料無效，無法確立排程器健全狀況。"
"The recorded poller start is in the future. Check clock synchronization.": "記錄的輪詢器啟動時間位於未來。請檢查時鐘同步。"
"The recorded poller start is older than the native scheduling tolerance.": "記錄的輪詢器啟動時間早於原生排程容許誤差。"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "已在原生排程容許誤差範圍內記錄本機輪詢器啟動，但尚未驗證是否完成及裝置健全狀況。"
"readable": "可讀取"
"missing or unreadable": "遺失或無法讀取"
"Restore the complete release and its locked dependencies; grant the service account read access.": "請還原完整的發布版本與其鎖定的相依套件；並授予服務帳戶讀取權限。"
"PHP temporary directory": "PHP 暫存目錄"
"directory writable by this process": "此程序可寫入的目錄"
"missing or not writable": "遺失或無法寫入"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "請將 sys_temp_dir 設定為存在且可供安裝帳戶寫入的目錄。原生匯入作業會使用暫存檔案。"
"Background worker launch": "背景工作程序啟動"
"required PHP functions available; launch not exercised": "所需的 PHP 函式可用；尚未演練啟動"
"required PHP launch function disabled": "所需的 PHP 啟動函式已停用"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "請為網頁 PHP 執行環境啟用 exec，或使用經授權的 CLI 安裝程式。"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "請為網頁 PHP 執行環境啟用 popen、pclose，或使用經授權的 CLI 安裝程式。"
"Database transaction ownership": "資料庫交易擁有權"
"autocommit enabled; no caller-owned transaction": "autocommit 已啟用；無呼叫端擁有的交易"
"autocommit disabled or caller transaction active": "autocommit 已停用或呼叫端交易啟用中"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "在呼叫端擁有的交易之外執行安裝，並在其異動連線上啟用 autocommit。"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "請還原發布目錄並授予安裝帳戶寫入權限以進行範本資源匯入。切勿將其設為所有人皆可寫入。"
"Worker file: install/background.php": "背景工作程序檔案：install/background.php"
"Worker file: bin/legacy-installer.php": "背景工作程序檔案：bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "背景工作程序檔案：include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "匯入目的地：resource/snmp_queries"
"Import destination: resource/script_server": "匯入目的地：resource/script_server"
"Import destination: resource/script_queries": "匯入目的地：resource/script_queries"
"Import destination: scripts": "匯入目的地：scripts"
"Database privileges": "資料庫權限"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "尚未驗證有效的移轉權限（包含作用中角色與物件特定授權）。"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "請資料庫管理員驗證安裝帳戶與結構描述所需的資料表寫入、結構描述變更、觸發程序與常式權限。請勿授予全域管理員權限。"
"Compare web and worker runtimes": "比較網頁與背景工作執行環境"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "這會明確啟動一個簡短的唯讀 PHP 探測。它不會保留安裝程式、寫入檔案或連線至裝置。"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "此探測會繼承此網頁程序並使用已設定的安裝程式 PHP 直譯器。它不會檢查獨立的排程器或服務。"
"I authorize the read-only worker runtime comparison.": "我授權進行唯讀的背景工作執行環境比較。"
"Compare runtimes": "比較執行環境"
"Runtime comparison results": "執行環境比較結果"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "權限與身分差異可能是刻意設計的。唯讀觀測結果無法證明寫入或安裝將會成功。"
"Confirm the read-only worker runtime comparison.": "確認唯讀的背景工作執行環境比較。"
"The runtime comparison is unavailable.": "執行環境比較無法使用。"
"Shared application secret": "共用應用程式密鑰"
"A strong web application secret is required before comparison.": "比對前必須提供高強度的網頁應用程式密鑰。"
"Runtime comparison": "執行環境比較"
"The configured worker runtime did not confirm a bounded comparison.": "已設定的背景工作執行環境未確認有限範圍的比較結果。"
"The inherited worker secret could not be confirmed against the web secret.": "無法針對網頁密鑰確認繼承的背景工作程序密鑰。"
"PHP runtime comparison": "PHP 執行環境比較"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "兩個執行環境都必須支援 PHP 8.4；不同的修訂版本需要進行檢視確認。"
"Required extension comparison": "必要擴充套件比較"
"Required extension availability is checked; differing versions require review.": "已檢查必要擴充套件的可用性；不同的版本需要進行檢視確認。"
"Process identity comparison": "程序身分比較"
"Effective process identity is unavailable on this platform.": "此平台無法取得有效程序身分。"
"Effective process identities match.": "有效程序身分相符。"
"Effective process identities differ; separate service accounts may be intentional.": "有效程序身分不同；分開的服務帳戶可能是刻意設計的。"
"Directory access comparison": "目錄存取權限比較"
"Read-only directory permission observations match.": "唯讀的目錄權限觀測結果相符。"
"Directory locations or permission observations differ; review the service-account roles.": "目錄位置或權限觀測結果有所差異；請檢視服務帳戶角色。"
"Worker directory read and traversal": "背景工作程序目錄讀取與遍歷"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "必要的背景工作程序目錄必須存在且允許讀取與遍歷。未進行任何寫入測試。"
"The inherited worker secret matches the web secret for this private challenge.": "繼承的背景工作程序密鑰與此私人驗證的網頁密鑰相符。"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "檢視已設定的 PHP 直譯器、必要擴充套件、繼承的密鑰與服務帳戶目錄權限。未進行任何寫入或安裝程式啟動。"
"advisory": "建議事項"
