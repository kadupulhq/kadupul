"This is a unique string that will be matched to a devices sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Questa è una stringa univoca che verrà confrontata con la stringa sysDescr di un dispositivo per associarlo a questo modello di automazione. È possibile usare qualsiasi espressione regolare Perl in aggiunta a qualsiasi espressione SQL Where."
