"A useful name for this Rule.": "Noderīgs nosaukums šai kārtulai."
"Access denied.": "Piekļuve liegta."
"Add Tree Rule": "Pievienot koka kārtulu"
"Back to Tree Rules": "Atpakaļ uz koka kārtulām"
"Check this box to enable this rule.": "Atķeksējiet šo izvēles rūtiņu, lai iespējotu šo kārtulu."
"Choose a Tree for the new Tree Items.": "Izvēlieties koku jaunajiem koka vienumiem."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Izvēlieties atlasītā koka galveni, pie kuras piesaistīt, vai tā sakni. Pārliecinieties, ka tā joprojām pastāv, kad šī kārtula tiek izpildīta."
"Choose a header of the selected Tree.": "Izvēlieties atlasītā koka galveni."
"Choose a listed Graph Grouping Style.": "Izvēlieties sarakstā norādītu grafiku grupēšanas stilu."
"Choose a listed Leaf Item Type.": "Izvēlieties sarakstā norādītu lapas vienuma tipu."
"Choose an existing Tree.": "Izvēlieties esošu koku."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Izvēlieties, kā grafiki tiek grupēti, kad tie tiek zīmēti šim konkrētajam resursdatoram kokā. Izmanto ierīču lapām."
"Data Query Index": "Datu vaicājumu indekss"
"Device": "Ierīce"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Ierīces lapas nevar izmantot kritērijus grafika vai grafika veidnes kolonnās. Mainot lapas vienuma tipu uz Ierīce, atzīmējiet šo izvēles rūtiņu, lai noņemtu šos kritērijus; tos nevarēs atgūt."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Ierīces lapas nevar izmantot uz grafikiem balstītus kritērijus. Lai saglabātu, apstipriniet %count% kritēriju noņemšanu."
"Edit Tree Rule": "Rediģēt koka kārtulu"
"Enable Rule": "Iespējot kārtulu"
"Enter a name.": "Ievadiet nosaukumu."
"Enter at most %count% characters.": "Ievadiet ne vairāk kā %count% rakstzīmes."
"Enter single-line text.": "Ievadiet vienas rindiņas tekstu."
"Graph": "Grafiks"
"Graph Grouping Style": "Grafiku grupēšanas stils"
"Graph Template": "Grafika veidne"
"Leaf Item Type": "Lapas elementa tips"
"Name": "Nosaukums"
"Object Selection and Tree Creation Criteria": "Objektu atlases un koka izveides kritēriji"
"Optional: Sub-Tree Item": "Pēc izvēles: Apakškoka elements"
"Remove graph-based criteria": "Noņemt uz grafikiem balstītos kritērijus"
"Save": "Saglabāt"
"Save outcome is uncertain. Reload before retrying.": "Saglabāšanas iznākums nav skaidrs. Pirms atkārtota mēģinājuma pārlādējiet."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Vispirms saglabājiet kārtulu; tās objektu atlases un koka izveides kritēriji tiek pievienoti pēc tam."
"The Item Type that shall be dynamically added to the tree.": "Elementa tips, kas dinamiski jāpievieno kokam."
"The tree rule changed since you opened this form. Reload before saving.": "Koka kārtula mainījās kopš šīs formas atvēršanas. Pirms saglabāšanas pārlādējiet."
"Tree": "Koks"
"Tree Rule Selection [edit: %name%]": "Koka kārtulas atlase [rediģēt: %name%]"
"Tree Rules Selection [new]": "Koka kārtulu atlase [jauna]"
"Tree rule not found.": "Koka kārtula nav atrasta."
"Tree rule saved.": "Koka kārtula saglabāta."
"Unable to load the tree rule. Reload before retrying.": "Nevar ielādēt koka kārtulu. Pirms atkārtota mēģinājuma pārlādējiet."
