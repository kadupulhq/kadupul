"A useful name for this Rule.": "ਇਸ ਨਿਯਮ ਲਈ ਇੱਕ ਉਪਯੋਗੀ ਨਾਮ।"
"Access denied.": "ਪਹੁੰਚ ਤੋਂ ਇਨਕਾਰ ਕੀਤਾ ਗਿਆ।"
"Add Graph Rule": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸ਼ਾਮਲ ਕਰੋ"
"Back to Graph Rules": "ਗ੍ਰਾਫ਼ ਨਿਯਮਾਂ ਵੱਲ ਵਾਪਸ"
"Cancel": "ਰੱਦ ਕਰੋ"
"Check this box to enable this rule.": "ਇਸ ਨਿਯਮ ਨੂੰ ਚਾਲੂ ਕਰਨ ਲਈ ਇਹ ਡੱਬਾ ਚੁਣੋ।"
"Choose a Data Query to apply to this rule.": "ਇਸ ਨਿਯਮ 'ਤੇ ਲਾਗੂ ਕਰਨ ਲਈ ਇੱਕ ਡਾਟਾ ਕੁਏਰੀ ਚੁਣੋ।"
"Choose a Graph Type": "ਇੱਕ ਗ੍ਰਾਫ਼ ਕਿਸਮ ਚੁਣੋ"
"Choose a Graph Type of the selected Data Query.": "ਚੁਣੀ ਡਾਟਾ ਕੁਏਰੀ ਦੀ ਇੱਕ ਗ੍ਰਾਫ਼ ਕਿਸਮ ਚੁਣੋ।"
"Choose an existing Data Query.": "ਮੌਜੂਦ ਡਾਟਾ ਕੁਏਰੀ ਚੁਣੋ।"
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "ਇਸ ਨਿਯਮ 'ਤੇ ਲਾਗੂ ਕਰਨ ਲਈ ਚੁਣੀ ਡਾਟਾ ਕੁਏਰੀ ਦੀਆਂ ਉਪਲਬਧ ਗ੍ਰਾਫ਼ ਕਿਸਮਾਂ ਵਿੱਚੋਂ ਕੋਈ ਵੀ ਚੁਣੋ।"
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "ਹੇਠਾਂ ਦਿੱਤੇ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਉਨ੍ਹਾਂ ਦੇ ਡਿਵਾਈਸ ਚੋਣ ਅਤੇ ਗ੍ਰਾਫ਼ ਬਣਾਉਣ ਦੇ ਮਾਪਦੰਡਾਂ ਸਮੇਤ ਮਿਟਾਉਣ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ।"
"Click Continue to disable the following Graph Rules.": "ਹੇਠਾਂ ਦਿੱਤੇ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਅਸਮਰੱਥ ਕਰਨ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ।"
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "ਹੇਠਾਂ ਦਿੱਤੇ ਗ੍ਰਾਫ਼ ਨਿਯਮਾਂ ਦੀਆਂ ਨਕਲਾਂ ਬਣਾਉਣ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ। ਤੁਸੀਂ ਨਵੇਂ ਗ੍ਰਾਫ਼ ਨਿਯਮਾਂ ਲਈ ਸਿਰਲੇਖ ਫ਼ਾਰਮੈਟ ਵਿਕਲਪਕ ਤੌਰ 'ਤੇ ਬਦਲ ਸਕਦੇ ਹੋ, ਜੋ ਅਸਮਰੱਥ ਅਵਸਥਾ ਵਿੱਚ ਸ਼ੁਰੂ ਹੁੰਦੇ ਹਨ।"
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "ਹੇਠਾਂ ਦਿੱਤੇ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸਮਰੱਥ ਕਰਨ ਲਈ ਜਾਰੀ ਰੱਖੋ 'ਤੇ ਕਲਿੱਕ ਕਰੋ। ਯਕੀਨੀ ਬਣਾਓ ਕਿ ਉਨ੍ਹਾਂ ਦੀ ਸਫਲਤਾਪੂਰਵਕ ਜਾਂਚ ਹੋ ਚੁੱਕੀ ਹੈ।"
"Continue": "ਜਾਰੀ ਰੱਖੋ"
"Data Query": "ਡਾਟਾ ਕੁਏਰੀ"
"Delete Graph Rules": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਮਿਟਾਓ"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "ਮਿਟਾਉਣ ਦਾ ਨਤੀਜਾ ਅਨਿਸ਼ਚਿਤ ਹੈ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸੂਚੀ ਦੇਖੋ।"
"Delete selected": "ਚੁਣੇ ਮਿਟਾਓ"
"Device Selection and Graph Creation Criteria": "ਡਿਵਾਈਸ ਚੋਣ ਅਤੇ ਗ੍ਰਾਫ਼ ਬਣਾਉਣ ਦੇ ਮਾਪਦੰਡ"
"Disable Graph Rules": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਅਸਮਰੱਥ ਕਰੋ"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "ਅਸਮਰੱਥ ਕਰਨ ਦਾ ਨਤੀਜਾ ਅਨਿਸ਼ਚਿਤ ਹੈ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸੂਚੀ ਦੇਖੋ।"
"Disable selected": "ਚੁਣੇ ਅਸਮਰੱਥ ਕਰੋ"
"Duplicate Graph Rules": "ਗ੍ਰਾਫ਼ ਨਿਯਮਾਂ ਦੀ ਨਕਲ ਬਣਾਓ"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "ਨਕਲ ਬਣਾਉਣ ਦਾ ਨਤੀਜਾ ਅਨਿਸ਼ਚਿਤ ਹੈ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸੂਚੀ ਦੇਖੋ।"
"Duplicate selected": "ਚੁਣਿਆਂ ਦੀ ਨਕਲ ਬਣਾਓ"
"Edit Graph Rule": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸੋਧੋ"
"Enable Graph Rules": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸਮਰੱਥ ਕਰੋ"
"Enable Rule": "ਨਿਯਮ ਸਮਰੱਥ ਕਰੋ"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "ਸਮਰੱਥ ਕਰਨ ਦਾ ਨਤੀਜਾ ਅਨਿਸ਼ਚਿਤ ਹੈ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸੂਚੀ ਦੇਖੋ।"
"Enable selected": "ਚੁਣੇ ਸਮਰੱਥ ਕਰੋ"
"Enter a name.": "ਇੱਕ ਨਾਮ ਦਰਜ ਕਰੋ।"
"Enter a valid name format.": "ਇੱਕ ਵੈਧ ਨਾਮ ਫ਼ਾਰਮੈਟ ਦਰਜ ਕਰੋ।"
"Enter at most %count% characters.": "ਵੱਧ ਤੋਂ ਵੱਧ %count% ਅੱਖਰ ਦਰਜ ਕਰੋ।"
"Enter single-line text.": "ਇੱਕ-ਲਾਈਨ ਟੈਕਸਟ ਦਰਜ ਕਰੋ।"
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "ਹਰੇਕ <rule_name> ਦੀ ਥਾਂ ਨਕਲ ਕੀਤੇ ਜਾ ਰਹੇ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਦਾ ਨਾਮ ਲੈ ਲਵੇਗਾ।"
"Graph Type": "ਗ੍ਰਾਫ਼ ਕਿਸਮ"
"Graph rule not found.": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਨਹੀਂ ਮਿਲਿਆ।"
"Graph rule saved.": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਸੰਭਾਲਿਆ ਗਿਆ।"
"Invalid Graph Rule selection.": "ਅਵੈਧ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਚੋਣ।"
"Name": "ਨਾਮ"
"One or more selected Graph Rules no longer exist.": "ਚੁਣੇ ਗਏ ਇੱਕ ਜਾਂ ਵੱਧ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਹੁਣ ਮੌਜੂਦ ਨਹੀਂ ਹਨ।"
"Rule Selection [edit: %name%]": "ਨਿਯਮ ਚੋਣ [ਸੋਧੋ: %name%]"
"Rule Selection [new]": "ਨਿਯਮ ਚੋਣ [ਨਵੀਂ]"
"Save": "ਸੰਭਾਲੋ"
"Save outcome is uncertain. Reload before retrying.": "ਸੰਭਾਲਣ ਦਾ ਨਤੀਜਾ ਅਨਿਸ਼ਚਿਤ ਹੈ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "ਪਹਿਲਾਂ ਨਿਯਮ ਸੰਭਾਲੋ; ਇਸਦੇ ਡਿਵਾਈਸ ਚੋਣ ਅਤੇ ਗ੍ਰਾਫ਼ ਬਣਾਉਣ ਦੇ ਮਾਪਦੰਡ ਬਾਅਦ ਵਿੱਚ ਜੋੜੇ ਜਾਂਦੇ ਹਨ।"
"Select": "ਚੁਣੋ"
"Select %name%": "%name% ਚੁਣੋ"
"Select at least one Graph Rule.": "ਘੱਟੋ-ਘੱਟ ਇੱਕ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਚੁਣੋ।"
"Select at most 100 Graph Rules at a time.": "ਇੱਕ ਵਾਰ ਵਿੱਚ ਵੱਧ ਤੋਂ ਵੱਧ 100 ਗ੍ਰਾਫ਼ ਨਿਯਮ ਚੁਣੋ।"
"Select up to %count% rows at a time.": "ਇੱਕ ਵਾਰ ਵਿੱਚ ਵੱਧ ਤੋਂ ਵੱਧ %count% ਕਤਾਰਾਂ ਚੁਣੋ।"
"The graph rule changed since you opened this form. Reload before saving.": "ਇਹ ਫ਼ਾਰਮ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ ਗ੍ਰਾਫ਼ ਨਿਯਮ ਬਦਲ ਗਿਆ ਹੈ। ਸੰਭਾਲਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The name format must give every copy a name of 1 to 255 characters.": "ਨਾਮ ਫ਼ਾਰਮੈਟ ਨੂੰ ਹਰੇਕ ਨਕਲ ਨੂੰ 1 ਤੋਂ 255 ਅੱਖਰਾਂ ਦਾ ਨਾਮ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ।"
"Title Format": "ਸਿਰਲੇਖ ਫ਼ਾਰਮੈਟ"
"Unable to load Graph Rules. Reload before retrying.": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕੇ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"Unable to load the graph rule. Reload before retrying.": "ਗ੍ਰਾਫ਼ ਨਿਯਮ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕਿਆ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"Unexpected fields were submitted.": "ਅਣਕਿਆਸੇ ਖੇਤਰ ਜਮ੍ਹਾਂ ਕੀਤੇ ਗਏ।"
