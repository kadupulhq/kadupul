"A useful name for this Rule.": "Een handige naam voor deze regel."
"Access denied.": "Toegang geweigerd."
"Add Tree Rule": "Boomregel toevoegen"
"Back to Tree Rules": "Terug naar boomregels"
"Check this box to enable this rule.": "Activeer deze optie om deze regel in te schakelen."
"Choose a Tree for the new Tree Items.": "Kies een boom voor de nieuwe boom-items."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Kies een koptekst van de geselecteerde boomstructuur om aan te koppelen, of de root ervan. Zorg ervoor dat deze nog bestaat wanneer deze regel wordt uitgevoerd."
"Choose a header of the selected Tree.": "Kies een koptekst van de geselecteerde boomstructuur."
"Choose a listed Graph Grouping Style.": "Kies een vermelde groeperingsstijl voor grafieken."
"Choose a listed Leaf Item Type.": "Kies een vermeld bladitemtype."
"Choose an existing Tree.": "Kies een bestaande boom."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Kies hoe grafieken worden gegroepeerd wanneer ze voor deze specifieke host in de boomstructuur worden getekend. Gebruikt voor apparaatbladeren."
"Data Query Index": "Gegevensquery index"
"Device": "Apparaat"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Apparaatbladeren kunnen geen criteria gebruiken op grafiek- of grafieksjabloonkolommen. Schakel bij het wijzigen van het bladitemtype naar Apparaat dit selectievakje in om die criteria te verwijderen; ze kunnen niet worden hersteld."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Apparaatbladeren kunnen geen op grafieken gebaseerde criteria gebruiken. Bevestig het verwijderen van %count% criteria om op te slaan."
