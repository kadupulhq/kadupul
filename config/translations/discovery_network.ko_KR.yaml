"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS 이름 확인에 사용할 대체 DNS 서버 목록을 공백으로 구분하여 입력합니다. 비워 두면 폴러 OS를 사용하여 DNS 이름을 확인합니다."
