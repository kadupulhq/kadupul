"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "일간 및 주간 일정은 시작 시간과 반복 주기를 사용하며, 주간 일정은 요일도 함께 사용합니다. 월간 일정은 월과 일을 사용하며, 요일 기준 월간 일정은 월, 주차 및 요일을 사용합니다."
