"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS रिज़ॉल्यूशन के लिए उपयोग किए जाने वाले वैकल्पिक DNS सर्वरों की स्पेस-सीमांकित सूची। यदि रिक्त छोड़ा जाता है, तो DNS नाम रिज़ॉल्व करने के लिए पोलर OS का उपयोग किया जाएगा।"
"Access denied.": "पहुंच अस्वीकृत।"
