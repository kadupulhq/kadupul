"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "अधिसूचना ईमेल के लिए प्रेषक के नाम के रूप में उपयोग किया जाने वाला ईमेल खाता नाम। यदि रिक्त छोड़ा जाता है, तो डिफ़ॉल्ट ऑटोमेशन अधिसूचना नाम उपयोग किया जाता है।"
"The Email account to be used to send the Notification Email to.": "वह ईमेल खाता जिस पर अधिसूचना ईमेल भेजा जाना है।"
