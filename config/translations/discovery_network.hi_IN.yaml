"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "यह नेटवर्क डिस्कवरी आइटम किस समय शुरू होगा? इसे YYYY-MM-DD HH:MM के रूप में दर्ज करें।"
"When discovering devices, allow duplicate sysnames to be added on different hosts": "डिवाइस डिस्कवर करते समय, विभिन्न होस्ट पर डुप्लिकेट sysnames जोड़ने की अनुमति दें"
"You must specify both the Months and Days of Month.": "आपको महीने और महीने के दिन दोनों निर्दिष्ट करने होंगे।"
