"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "दैनिक और साप्ताहिक शेड्यूल प्रारंभ और हर बार पुनः चलाएं का उपयोग करते हैं; साप्ताहिक सप्ताह के दिन भी उपयोग करता है। मासिक महीनों और महीने के दिनों का उपयोग करता है; दिन पर मासिक महीनों, महीने के सप्ताहों और सप्ताह के दिनों का उपयोग करता है।"
