"The automation template order changed since you opened this page. Reload before moving.": "আপনি এই পৃষ্ঠাটি খোলার পর অটোমেশন টেমপ্লেটের ক্রম পরিবর্তিত হয়েছে। সরানোর আগে রিলোড করুন।"
"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "হাল ছাড়ার আগে একটি SNMP রিডস্ট্রিংয়ের মাধ্যমে ডিভাইসে পৌঁছানোর সর্বোচ্চ চেষ্টার সংখ্যা।"
"The maximum number of milliseconds Cacti will wait for an SNMP response (does not work with php-snmp support).": "SNMP প্রতিক্রিয়ার জন্য Cacti সর্বোচ্চ যত মিলিসেকেন্ড অপেক্ষা করবে (php-snmp সমর্থনের সাথে কাজ করে না)।"
"The name can be at most 100 characters.": "নাম সর্বোচ্চ ১০০ অক্ষরের হতে পারে।"
"This is a unique string that will be matched to a devices sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "এটি একটি অনন্য স্ট্রিং যা কোনো ডিভাইসকে এই অটোমেশন টেমপ্লেটের সাথে যুক্ত করতে তার sysDescr স্ট্রিংয়ের সাথে মেলানো হবে। যেকোনো SQL Where এক্সপ্রেশনের পাশাপাশি যেকোনো Perl রেগুলার এক্সপ্রেশন ব্যবহার করা যেতে পারে।"
"This is a unique string that will be matched to a devices sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "এটি একটি অনন্য স্ট্রিং যা কোনো ডিভাইসকে এই অটোমেশন টেমপ্লেটের সাথে যুক্ত করতে তার sysName স্ট্রিংয়ের সাথে মেলানো হবে। যেকোনো SQL Where এক্সপ্রেশনের পাশাপাশি যেকোনো Perl রেগুলার এক্সপ্রেশন ব্যবহার করা যেতে পারে।"
"This is a unique string that will be matched to a devices sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "এটি একটি অনন্য স্ট্রিং যা কোনো ডিভাইসকে এই অটোমেশন টেমপ্লেটের সাথে যুক্ত করতে তার sysOid স্ট্রিংয়ের সাথে মেলানো হবে। যেকোনো SQL Where এক্সপ্রেশনের পাশাপাশি যেকোনো Perl রেগুলার এক্সপ্রেশন ব্যবহার করা যেতে পারে।"
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "এই লিগ্যাসি অটোমেশন টেমপ্লেট ফর্মটির মেয়াদ শেষ হয়ে গেছে। ডিভাইস রুলসমূহ খুলুন এবং একটি নতুন ফর্ম জমা দিন।"
