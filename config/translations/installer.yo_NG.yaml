"Action": "Ìgbésẹ̀"
"Advanced options": "Àwọn àṣàyàn onípele gíga"
"Applying database upgrades": "Ń lo àwọn ìgbéga ilé-ìkópamọ́ dátà"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Ṣe àtìlẹ́yìn àkójọpọ̀ ilé-ìkópamọ́ dátà, àwọn fáìlì RRD, ìṣètò àti àwọn kọ́kọ́rọ́. Àwọn ìgbéga ilé-ìkópamọ́ dátà lè ṣe àwọn àtúnṣe tí ìpadàbọ̀sípò ohun èlò kò lè tún ṣe."
"Blocked": "Ti Dínà"
"Check": "Ṣàyẹ̀wò"
"Check again": "Ṣàyẹ̀wò lẹ́ẹ̀kan sí i"
"Check collection freshness and collector connectivity before enabling discovery.": "Ṣàyẹ̀wò ìtutù ìkójọ àti ìsopọ̀ olùkó kí o tó mú ìwárí ṣiṣẹ́."
"Check requirements": "Ṣàyẹ̀wò àwọn ìbéèrè"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Àwọn àyẹ̀wò ń ṣàyẹ̀wò ìlànà yìí àti àwọn àṣẹ ètò fáìlì. Wọn kì í kọ àwọn fáìlì àyẹ̀wò tàbí kàn sí àwọn ẹ̀rọ."
"Collection profile": "Àkọsílẹ̀ ìkójọ"
"Collector": "Olùkó"
"Configure": "Ṣètò"
"Configuring collection profiles": "Ń ṣètò àwọn àkọsílẹ̀ ìkójọ"
"Configuring discovery": "Ń ṣètò ìwárí"
"Configuring the local device": "Ń ṣètò ẹ̀rọ ìbílẹ̀"
"Confirming database version": "Ń fìdí ẹ̀yà ilé-ìkópamọ́ dátà múlẹ̀"
"Converting selected tables": "Ń yí àwọn tábìlì tí a yàn padà"
"Database version": "Ẹ̀yà ilé-ìkópamọ́ dátà"
"Disabled": "Ti Pa Lẹ́nu Iṣẹ́"
"Discovery": "Ìwárí"
"Discovery SNMP settings": "Àwọn ètò SNMP ìwárí"
"Discovery range": "Ààlà ìwárí"
"Enable discovery after installation": "Mú ìwárí ṣiṣẹ́ lẹ́yìn ìfisílé"
"Executable paths": "Àwọn ipa-ọ̀nà tí ó ṣeé ṣiṣẹ́"
"Execution status": "Ipò ìṣiṣẹ́"
"Finished execution": "Ìṣiṣẹ́ ti parí"
"Finishing tasks only. Schema migrations will not be replayed.": "Ṣíṣe àwọn iṣẹ́ ìparí nìkan. A kò ní tún àwọn ìṣílọ́ síkímà ṣe."
"I accept the license terms": "Mo gba àwọn òfin ìwé àṣẹ"
"I authorize discovery of the displayed range": "Mo fún ní àṣẹ fún ìwádìí ààlà tí a ṣàfihàn"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Mo ti ṣàyẹ̀wò àkọsílẹ̀ náà mo sì ti fìdí rẹ̀ múlẹ̀ pé òṣìṣẹ́ tẹ́lẹ̀ àti àwọn ìṣiṣẹ́ ọmọ rẹ̀ ti dúró"
"I checked the previous attempt and accept that some changes may already be committed": "Mo ti ṣàyẹ̀wò ìgbìyànjú tẹ́lẹ̀ mo sì gbà pé àwọn àyípadà kan lè ti di fífipamọ́ tẹ́lẹ̀"
"I reviewed this plan and have the required backups": "Mo ti ṣe àtúnyẹ̀wò ètò yìí mo sì ní àwọn àkọ́pamọ́ tí a nílò"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Tí òṣìṣẹ́ kan bá dúró láìròtẹ́lẹ̀, pa log/cacti.log mọ́ kí o sì fìdí rẹ̀ múlẹ̀ pé ìṣiṣẹ́ rẹ̀ ti parí kí o tó tún gbìyànjú ní gbangba. Ipò ìdúró kò fìdí ìfilọ́lẹ̀ tí ó yọrí sí rere múlẹ̀."
"Importing templates": "Ń kó àwọn àdàkọ wọlé"
"Install Kadupul": "Fi Kadupul Sori Ẹ̀rọ"
"Installation and upgrade": "Ìfisori ẹ̀rọ àti ìgbéga"
"Installation request was rejected.": "A kọ ìbéèrè ìfisori ẹ̀rọ."
"Installation steps": "Àwọn ìgbésẹ̀ ìfisori ẹ̀rọ"
"Installed": "Ti Fi Sori Ẹ̀rọ"
"Keep a backup of the database, RRD files, configuration and secret material.": "Pa àkọ́pamọ́ ibi-ìpamọ́ dátà, àwọn fáìlì RRD, ìṣètò àti ohun èlò àṣírí mọ́."
"Language": "Èdè"
"Large tables may require the dedicated CLI conversion tool before installation.": "Àwọn tábìlì ńlá lè nílò irinṣẹ́ ìyípadà CLI pàtàkì ṣáájú ìfisori ẹ̀rọ."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Fi àwọn ààyè àṣírí sílẹ̀ ní òfo láti pa àwọn ẹ̀rí ìwọlé tí a fipamọ́ mọ́. A kì í tún àwọn àṣírí ṣàfihàn láé."
"License": "Ìwé Àṣẹ"
"No action needed": "Kò sí ìṣe tí a nílò"
"Observed": "Ti ṣe àkíyèsí"
"Open the console": "Ṣí console"
"Operation": "Ìṣiṣẹ́"
"Override discovery SNMP settings": "Bori àwọn ètò SNMP ìwádìí"
"Pass": "Kọjá"
"Poller interval in seconds": "Àkókò àárín poller ní ìṣẹ́jú-àáyá"
"Preparing CSRF protection": "Ń mú ààbò CSRF sílẹ̀"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Ìlọsíwájú ń fi ìpele tí a kọ sílẹ̀ kẹ́yìn hàn. Sísọ ojú-ewé yìí di tuntun kì í bẹ̀rẹ̀ tàbí tún gbìyànjú òṣìṣẹ́ kan láé."
"Recover stopped attempt": "Gba ìgbìyànjú tí ó dúró padà"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Ìgbàpadà máa ń pa àwọn àṣàyàn tí a fipamọ́ mọ́ kì í sì í pa òṣìṣẹ́ tí ó ń ṣiṣẹ́ rẹ́ láé. Ṣe àtúnyẹ̀wò ètò náà lẹ́ẹ̀kan sí i kí o tó tún gbìyànjú."
"Review": "Àtúnyẹ̀wò"
"Review installation plan": "Ṣe àtúnyẹ̀wò ètò ìfisori ẹ̀rọ"
"Run": "Ṣiṣẹ́"
"Run reviewed plan": "Ṣiṣẹ́ ètò tí a ṣe àtúnyẹ̀wò"
"Save and review": "Fipamọ́ kí o sì ṣe àtúnyẹ̀wò"
"Scope": "Ààlà Iṣẹ́"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Ipò kò sí. Iṣẹ́ tí a fi pamọ́ ṣì wà. Tún ojú-òpó gbé jáde láti tún sopọ̀; má ṣe fi ìfisíṣẹ́ mìíràn ránṣẹ́."
"Synchronizing collectors": "Ń mú àwọn olùkójọ báramu"
"Table conversions": "Àwọn ìyípadà tábìlì"
"Templates": "Àwọn Àdàkọ"
"The database version matches this application. Installation does not establish that polling is healthy.": "Ẹ̀dà dátàbéèsì bá ohun èlò yìí mu. Ìfi-sori-ẹ̀rọ kò fìdí rẹ̀ múlẹ̀ pé ìṣàkójọ wà ní ìlera."
"The request outcome is unknown. Check execution status before retrying.": "Àbájáde ìbéèrè náà jẹ́ àìmọ̀. Ṣàyẹ̀wò ipò ìṣiṣẹ́ kí o tó tún gbìyànjú."
"Theme": "Kókó àwòrán"
"Verify": "Fìdí Múlẹ̀"
"Verify the poller schedule and service account.": "Fìdí ìtòlẹ́sẹẹsẹ àkókò olùṣàkójọ àti àkọọ́lẹ̀ iṣẹ́ múlẹ̀."
"Version change": "Ìyípadà ẹ̀dà"
"Waiting for the installation worker": "Ń dúró de òṣìṣẹ́ ìfi-sori-ẹ̀rọ"
"collector": "olùkójọ"
"complete": "parí"
"failed": "kùnà"
"finish": "parí"
"install": "fi sori ẹ̀rọ"
"not_started": "kò ì bẹ̀rẹ̀"
"partial": "àìpé"
"running": "ń ṣiṣẹ́"
"succeeded": "ti yọrí sí rere"
"upgrade": "gbé sókè"
"waiting": "ń dúró"
"Accept the license before saving the installation plan.": "Gba ìwé-àṣẹ náà kí o tó fi ètò ìfisílé pamọ́."
"Invalid installation form.": "Fọ́ọ̀mù ìfisori ẹ̀rọ tí kò tọ́."
"Access denied.": "A kọ̀ ìráyè."
"Confirm the recovery warning before retrying.": "Fìdí ìkìlọ̀ ìmúpadàbọ̀sípò múlẹ̀ kí o tó tún gbìyànjú."
"Review and confirm the current installation plan.": "Ṣe àtúnyẹ̀wò kí o sì fìdí ètò ìfisori ẹ̀rọ lọ́wọ́lọ́wọ́ múlẹ̀."
"Confirm the discovery scope before starting.": "Fìdí ààyè ìwárí múlẹ̀ kí o tó bẹ̀rẹ̀."
"Resolve the blocking checks before starting.": "Yanjú àwọn àyẹ̀wò ìdènà kí o tó bẹ̀rẹ̀."
"Too many installer options.": "Àwọn àṣàyàn olùfi-sori-ẹ̀rọ pọ̀ jù."
"Invalid installer option name.": "Orúkọ àṣàyàn olùfisori ẹ̀rọ tí kò tọ́."
"Unknown or malformed installer option.": "Àṣàyàn olùfi-sori-ẹ̀rọ àìmọ̀ tàbí àìdára."
"Installer options must be scalar values.": "Àwọn àṣàyàn olùfisori ẹ̀rọ gbọ́dọ̀ jẹ́ àwọn ìníyelórí scalar."
"Installer option is too long or contains a null byte.": "Àṣàyàn olùfisori ẹ̀rọ gùn jù tàbí ó ní byte òfo."
"Installer IDs and intervals must be whole numbers.": "Àwọn ID olùfisori ẹ̀rọ àti àkókò àárín gbọ́dọ̀ jẹ́ odidi nọ́ńbà."
"Installer ID or interval is outside its supported range.": "ID olùfisori ẹ̀rọ tàbí àkókò àárín wà lóde ààlà rẹ̀ tí a ṣètìlẹ́yìn fún."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Ìfi-sori-ẹ̀rọ kò lè tẹ̀síwájú. Tún ipò rẹ̀ gbé jáde kí o sì ṣàyẹ̀wò àwọn àyẹ̀wò ìdènà kí o tó tún gbìyànjú."
"Confirm that the previous worker has stopped before recovering its plan.": "Fìdí rẹ̀ múlẹ̀ pé òṣìṣẹ́ tẹ́lẹ̀ ti dúró kí o tó mú ètò rẹ̀ padà."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "A ti fi dátàbéèsì sori ẹ̀rọ, ṣùgbọ́n àwọn olùkójọ kan ṣì nílò ìbáramu. Tún àwọn iṣẹ́ ìparí gbìyànjú lẹ́yìn ṣíṣàyẹ̀wò ipò wọn."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Ìfisori ẹ̀rọ ti dúró. Pa àkọsílẹ̀ olùfisori ẹ̀rọ mọ́, tún ohun tí ó fà á ṣe kí o sì fìdí ìtúngbìyànjú múlẹ̀ ní gbangba. Àwọn àyípadà ibi-ìpamọ́ dátà kan lè ti di fífipamọ́ tẹ́lẹ̀. Ṣàyẹ̀wò ìwẹ̀nùmọ́ àfikún kí o tó fún ní àṣẹ fún ìtúngbìyànjú."
"Next action": "Ìṣe tókàn"
"Follow the execution status. Do not start another attempt while a worker is active.": "Tẹ̀lé ipò ìṣiṣẹ́. Má ṣe bẹ̀rẹ̀ ìgbìyànjú mìíràn nígbà tí òṣìṣẹ́ kan bá ń ṣiṣẹ́."
"Complete the recovery checklist before retrying.": "Parí àtòjọ àyẹ̀wò ìmúpadàbọ̀sípò kí o tó tún gbìyànjú."
"Verify collection and graph operation before enabling discovery.": "Fìdí ìkójọpọ̀ àti iṣẹ́ gíráfù múlẹ̀ kí o tó mú ìwádìí ṣiṣẹ́."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Yanjú àwọn ohun tí a nílò tí ó dènà, lẹ́yìn náà tún ṣàyẹ̀wò. Àwọn àṣàyàn tí a fipamọ́ ni a pa mọ́."
"Review the planned changes and backup checklist before authorizing execution.": "Ṣe àtúnyẹ̀wò àwọn àyípadà tí a gbèrò àti àtòjọ àyẹ̀wò àkọ́pamọ́ kí o tó fún ní àṣẹ fún ìṣiṣẹ́."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Yan àkọsílẹ̀ ìkójọ kan kí o sì gba ìwé-àṣẹ náà. A lè ṣí àwọn ètò àṣàyàn nígbà tí a bá nílò wọn."
"Download installation diagnostics": "Gba àwọn ìwádìí àṣìṣe ìfisílé sílẹ̀"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Ṣí àtẹ àwòrán kan kí o sì fìdí rẹ̀ múlẹ̀ pé dátà RRD rẹ̀ ṣe àtúnṣe lẹ́yìn ìyípo poller kan."
"Requirement details": "Àlàyé kíkún ohun tí a nílò"
"Recover": "Gba padà"
"Recovery checklist": "Àtòjọ àyẹ̀wò ìgbàpadà"
"Preserve log/cacti.log and record the failed attempt.": "Pa log/cacti.log mọ́ kí o sì kọ ìgbìyànjú tí ó kùnà sílẹ̀."
"Confirm that the previous worker and its child processes have stopped.": "Fìdí rẹ̀ múlẹ̀ pé òṣìṣẹ́ tẹ́lẹ̀ àti àwọn ìlànà ọmọ rẹ̀ ti dúró."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Ṣe àyẹ̀wò àwọn àyípadà tí a ti fipamọ́, ìṣàṣọ̀kan olùkó dátà àti ìwẹ̀nùmọ́ àfikún. Tún ohun tí ó fà á ṣe kí o tó tún gbìyànjú."
"Review the saved plan again, then explicitly authorize a retry.": "Ṣe àtúnyẹ̀wò ètò tí a fipamọ́ lẹ́ẹ̀kan sí i, lẹ́yìn náà fún ní àṣẹ ní gbangba fún ìtúngbìyànjú."
"Recover a stopped worker": "Gba òṣìṣẹ́ tí ó dúró padà"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Lo ìpadàbọ̀ sípò kìkì lẹ́yìn fífìdí rẹ̀ múlẹ̀ pé ìgbìyànjú yìí kò ṣiṣẹ́ mọ́. Ìpadàbọ̀ sípò kì í dá ìlànà dúró."
"Collector and installation mode": "Olùkó àti ipò ìfisílé"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Ìṣètò ìfìsíṣẹ́ ń pinnu ipa olùkójọ àti àwọn ìsopọ̀ dátàbéèsì. Ṣàyẹ̀wò ìṣètò olupin àkọ́kọ́ kí o tó bẹ̀rẹ̀ olùkójọ."
"Discovery and SNMP settings": "Àwọn ètò ìwárí àti SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Pa ìwádìí mọ́ ní pípa títí tí a ó fi fìdí ìkójọpọ̀ àti ìsopọ̀ olùkó dátà múlẹ̀."
"Template selection": "Ìyàn àdàkọ"
"Templates selected for import": "Àwọn àdàkọ tí a yàn fún ìgbéwọlé"
"No templates selected.": "Kò sí àwọn àdàkọ tí a yàn."
"Backup checklist": "Àtòjọ àyẹ̀wò àtìlẹ́yìn"
"Database backup and a tested restoration procedure.": "Àtìlẹ́yìn ilé-ìkópamọ́ dátà àti ìlànà ìmúpadàbọ̀sípò tí a ti dán wò."
"RRD files and the service account permissions needed to restore them.": "Àwọn fáìlì RRD àti àwọn àṣẹ àkọọ́lẹ̀ iṣẹ́ tí a nílò láti mú wọn padà bọ̀ sípò."
"Configuration, keys and plugin data outside the database.": "Ìṣètò, àwọn kọ́kọ́rọ́ àti dátà àfikún lóde ilé-ìkópamọ́ dátà."
"Post-installation checks": "Àwọn àyẹ̀wò lẹ́yìn-ìfisori ẹ̀rọ"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Àwọn àyẹ̀wò tí a fìdí múlẹ̀ bo kìkì ẹ̀rí tí a fi hàn. Àwọn àyẹ̀wò tí a kò ì ṣe ìwádìí wọn ṣì nílò ìfìdí múlẹ̀ olùṣiṣẹ́."
"Operational checks still require operator verification.": "Àwọn àyẹ̀wò ìṣiṣẹ́ ṣì nílò ìfìdí múlẹ̀ olùṣiṣẹ́."
"Status": "Ipò"
"verified": "tí a fìdí múlẹ̀"
"action_required": "ìgbésẹ̀ pọndandan"
"not_assessed": "kò ì ṣe ìwádìí rẹ̀"
"Database schema": "Àtòjọ ilé-ìkópamọ́ dátà"
"Stored schema matches the application target.": "Ètò tábìlì tí a fi pamọ́ bá ibi-àfojúsùn ohun èlò mu."
"Target schema completion has not been confirmed.": "A kò ì fìdí ìparí ètò tábìlì àfojúsùn múlẹ̀."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Ṣe àtúnyẹ̀wò àbájáde ìfisori ẹ̀rọ kí o sì yanjú àwọn ìkùnà kí o tó ka ìgbéga síkímà sí pípé."
"Installation outcome": "Àbájáde ìfisori ẹ̀rọ"
"A successful receipt matches the current target schema.": "Ìwé-ẹ̀rí àṣeyọrí bá àtòjọ ibi-àfojúsùn lọ́wọ́lọ́wọ́ mu."
"A complete successful installation outcome has not been confirmed.": "A kò tíì fìdí àbájáde ìfisílé tó péye àti tó ṣàṣeyọrí múlẹ̀."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Pa àkọsílẹ̀ olùfisori ẹ̀rọ mọ́ kí o sì lo ìlànà ìgbàpadà tàbí ìtúngbìyànjú ní gbangba nígbà tí ó bá pọn dandan."
"Collector synchronization": "Ìṣọ̀kan olùkó"
"The completed installer reports pending collector synchronization.": "Olùfi-sori-ẹ̀rọ tí ó parí ròyìn ìbáramu olùkójọ tó kù sílẹ̀."
"The completed installer reports no pending collectors.": "Olùfi-sori-ẹ̀rọ tí ó parí ròyìn pé kò sí olùkójọ tó kù sílẹ̀."
"Collector completion remains unconfirmed by this partial receipt.": "Ìwé-ẹ̀rí aláìpé yìí kò tíì fìdí ìparí olùkó múlẹ̀."
"Collector completion is not established by this installation outcome.": "Àbájáde ìfisílé yìí kò fìdí ìparí olùkó múlẹ̀."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Ṣe àtúnyẹ̀wò ipò olùkó dátà kí o sì tún àwọn iṣẹ́ ìparí gbìyànjú fún àwọn àbájáde aláìpé. Èyí kò fìdí ìtutù ìkójọpọ̀ tí ó tẹ̀lé múlẹ̀."
"Scheduled collection": "Ìkójọpọ̀ tí a tò lẹ́sẹẹsẹ"
"No poller or device was contacted by this assessment.": "Ìṣirò yìí kò kàn sí poller tàbí ẹ̀rọ kankan."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Fìdí rẹ̀ múlẹ̀ pé olùṣètò àkókò tí a ṣètò ń ṣiṣẹ́ olùṣàyẹ̀wò gẹ́gẹ́ bí àkọọ́lẹ̀ iṣẹ́ tí a pinnu kí o sì ṣàyẹ̀wò ìyípo déédé tó ń bọ̀."
"Graph data": "Dátà àtẹ àwòrán"
"Live samples and RRD updates were not exercised.": "A kò dán àwọn àpẹẹrẹ àkókò gidi àti àwọn àtúnṣe RRD wò."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Lẹ́yìn ìyípo ìkójọ déédé kan, fìdí rẹ̀ múlẹ̀ pé àwọn àwòrán ìtọ́ka tí a retí ń gba àwọn àpẹẹrẹ tuntun kí o sì ṣàyẹ̀wò àwọn àṣìṣe olùṣàyẹ̀wò."
"Recovery readiness": "Ìmúrasílẹ̀ ìgbàpadà"
"Backup restoration was not exercised.": "A kò dán ìmúpadàbọ̀sípò àtìlẹ́yìn wò."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Fìdí ìpadàbọ̀ sípò ìdádúró ọ̀tọ̀ ti dátàbéèsì, àwọn fáìlì RRD, ìṣètò àti ohun èlò kọ́kọ́rọ́ múlẹ̀ kí o tó gbẹ́kẹ̀lé ìpadàbọ̀ sípò."
"No persisted local poller start has been recorded.": "Kò sí ìbẹ̀rẹ̀ poller abẹ́lé tí a fipamọ́ tí a ti kọ sílẹ̀."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Àkókò poller tí a fipamọ́ kò tọ́ kò sì lè fìdí ìlera olùṣètò àkókò múlẹ̀."
"The recorded poller start is in the future. Check clock synchronization.": "Ìbẹ̀rẹ̀ olùṣàkójọ tí a kọ sílẹ̀ wà lọ́jọ́ iwájú. Ṣàyẹ̀wò ìbáramu aago."
"The recorded poller start is older than the native scheduling tolerance.": "Ìbẹ̀rẹ̀ olùṣàkójọ tí a kọ sílẹ̀ ti gbó ju ìfaradà ìtòlẹ́sẹẹsẹ ìpilẹ̀ lọ."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "A gba ìbẹ̀rẹ̀ olùṣàyẹ̀wò ìbílẹ̀ sílẹ̀ láàárín ààyè ìṣètò àkókò àbínibí. A kò tíì fìdí ìparí àti ìlera ẹ̀rọ múlẹ̀."
"readable": "ṣeé kà"
"missing or unreadable": "sọnù tàbí kò ṣeé kà"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Mú ìtújáde pípé àti àwọn ìgbẹ́kẹ̀lé rẹ̀ tí a tì pa padà bọ̀ sípò; fún àkọọ́lẹ̀ iṣẹ́ ní àṣẹ kíkà."
"PHP temporary directory": "Fódà ìgbà díẹ̀ PHP"
"directory writable by this process": "fódà ṣeé kọ̀wé sí láti ọwọ́ ìlànà yìí"
"missing or not writable": "sọnù tàbí kò ṣeé kọ̀wé sí"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Ṣètò sys_temp_dir gẹ́gẹ́ bí àpò tó wà tí àkọọ́lẹ̀ ìfisílé lè kọ sí. Àwọn ìkówọlé àbínibí ń lo àwọn fáìlì ìgbà díẹ̀."
"Background worker launch": "Ìbẹ̀rẹ̀ òṣìṣẹ́ àbẹ́lẹ̀"
"required PHP functions available; launch not exercised": "àwọn iṣẹ́ PHP tí a nílò wà; a kò dán ìbẹ̀rẹ̀ wò"
"required PHP launch function disabled": "iṣẹ́ ìbẹ̀rẹ̀ PHP tí a nílò wà ní dídá dúró"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Mú exec ṣiṣẹ́ fún àyíká ìṣiṣẹ́ PHP wẹ́ẹ̀bù, tàbí lo olùfisílé CLI tí a fún láṣẹ."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Mú popen, pclose ṣiṣẹ́ fún àyíká ìṣiṣẹ́ PHP wẹ́ẹ̀bù, tàbí lo olùfisílé CLI tí a fún láṣẹ."
"Database transaction ownership": "Ìjẹ́-oní ìṣòwò ilé-ìkópamọ́ dátà"
"autocommit enabled; no caller-owned transaction": "autocommit wà ní mímú ṣiṣẹ́; kò sí ìṣòwò tí olùpè ní"
"autocommit disabled or caller transaction active": "autocommit wà ní dídá dúró tàbí ìṣòwò olùpè ń ṣiṣẹ́"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Ṣiṣẹ́ ìfisori ẹ̀rọ lóde ìdúnàádúrà tí olùpè ní kí o sì mú autocommit ṣiṣẹ́ lórí ìsopọ̀ ìyípadà rẹ̀."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Mú fódà ìtújáde padà bọ̀ sípò kí o sì fún àkọọ́lẹ̀ ìfisori ẹ̀rọ ní àṣẹ kíkọ fún àwọn ìkówọlé ohun èlò àdàkọ. Má ṣe jẹ́ kí gbogbo ayé lè kọ sí i."
"Worker file: install/background.php": "Fáìlì òṣìṣẹ́: install/background.php"
"Worker file: bin/legacy-installer.php": "Fáìlì òṣìṣẹ́: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fáìlì òṣìṣẹ́: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Ààyè ìkówọlé: resource/snmp_queries"
"Import destination: resource/script_server": "Ààyè ìkówọlé: resource/script_server"
"Import destination: resource/script_queries": "Ààyè ìkówọlé: resource/script_queries"
"Import destination: scripts": "Ààyè ìkówọlé: scripts"
"Database privileges": "Àwọn àǹfààní ilé-ìkópamọ́ dátà"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "A kò fìdí àwọn àǹfààní ìṣíkiri tó munádóko múlẹ̀, pẹ̀lú àwọn ipa tí ń ṣiṣẹ́ àti àwọn ìfúnni pàtó ohun."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Jẹ́ kí olùṣàkóso ibi-ìpamọ́ dátà fìdí àwọn kíkọ tábìlì tí a nílò, àwọn àyípadà síkímà, triggers àti routines múlẹ̀ fún àkọọ́lẹ̀ ìfisori ẹ̀rọ àti síkímà. Má ṣe fúnni ní àwọn àǹfààní olùṣàkóso gbogbo-gbòò."
"Compare web and worker runtimes": "Fi àwọn àyíká ìṣiṣẹ́ wẹ́ẹ̀bù àti ti òṣìṣẹ́ wéra"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Èyí bẹ̀rẹ̀ àyẹ̀wò PHP kúkúrú tí a kà nìkan ní pàtó. Kì í ṣe ìfipamọ́ olùfi-sori-ẹ̀rọ, kì í kọ fáìlì tàbí kàn sí àwọn ẹ̀rọ."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Àyẹ̀wò náà jogún ìlànà wẹ́ẹ̀bù yìí ó sì ń lo olùtúmọ̀ PHP olùfi-sori-ẹ̀rọ tí a ṣètò. Kì í ṣàyẹ̀wò olùtò-àkókò tàbí iṣẹ́ ọ̀tọ̀."
"I authorize the read-only worker runtime comparison.": "Mo fún ní àṣẹ fún ìfiwéra àkókò ìṣiṣẹ́ òṣìṣẹ́ kíkà-nìkan."
"Compare runtimes": "Fi àwọn àyíká ìṣiṣẹ́ wéra"
"Runtime comparison results": "Àwọn èsì ìfiwéra àkókò ìṣiṣẹ́"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Àwọn ìyàtọ̀ àṣẹ àti ìdánimọ̀ lè jẹ́ àfọwọ́ṣe. Àwọn àkíyèsí kíkà-nìkan kò fi hàn pé kíkọ tàbí ìfisori ẹ̀rọ yóò yọrí sí rere."
"Confirm the read-only worker runtime comparison.": "Fìdí ìfiwéra àyíká ìṣiṣẹ́ òṣìṣẹ́ kíkà-nìkan múlẹ̀."
"The runtime comparison is unavailable.": "Ìfiwéra àkókò ìṣiṣẹ́ kò sí."
"Shared application secret": "Àṣírí ohun èlò pín"
"A strong web application secret is required before comparison.": "Aṣírí ohun èlò wẹ́ẹ̀bù tó lágbára pọndandan kí a tó lè ṣe ìfiwéra."
"Runtime comparison": "Ìfiwéra àkókò ìṣiṣẹ́"
"The configured worker runtime did not confirm a bounded comparison.": "Àkókò ìṣiṣẹ́ òṣìṣẹ́ tí a ṣètò kò fìdí ìfiwéra tó ní ààlà múlẹ̀."
"The inherited worker secret could not be confirmed against the web secret.": "A kò lè fìdí àṣírí òṣìṣẹ́ tí a jogún múlẹ̀ lòdì sí àṣírí wẹ́ẹ̀bù."
"PHP runtime comparison": "Ìfiwéra àkókò ìṣiṣẹ́ PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Àwọn àyíká ìṣiṣẹ́ méjèèjì gbọ́dọ̀ ṣètìlẹ́yìn fún PHP 8.4; àwọn ẹ̀yà àtúnṣe tí ó yàtọ̀ nílò àtúnyẹ̀wò."
"Required extension comparison": "Ìfiwéra ìfẹ̀sí tí a nílò"
"Required extension availability is checked; differing versions require review.": "A ṣàyẹ̀wò wíwà ìfẹ̀sí tí a nílò; àwọn ẹ̀yà tí ó yàtọ̀ nílò àtúnyẹ̀wò."
"Process identity comparison": "Ìfiwéra ìdánimọ̀ ìṣiṣẹ́"
"Effective process identity is unavailable on this platform.": "Ìdánimọ̀ ìlànà ìṣiṣẹ́ tó munádóko kò sí lórí pẹpẹ yìí."
"Effective process identities match.": "Àwọn ìdánimọ̀ ìlànà ìṣiṣẹ́ tó munádóko bára mu."
"Effective process identities differ; separate service accounts may be intentional.": "Àwọn ìdánimọ̀ ìlànà ìṣiṣẹ́ tó munádóko yàtọ̀; àwọn àkọọ́lẹ̀ iṣẹ́ ọ̀tọ̀ọ̀tọ̀ lè jẹ́ èyí tí a mọ̀ọ́mọ̀ ṣe."
"Directory access comparison": "Ìfiwéra ìráyè àpò"
"Read-only directory permission observations match.": "Àwọn àkíyèsí àṣẹ fódà kíkà-nìkan báramu."
"Directory locations or permission observations differ; review the service-account roles.": "Àwọn ipò àpò tàbí àwọn àkíyèsí àṣẹ yàtọ̀; ṣàyẹ̀wò àwọn ipa àkọọ́lẹ̀ iṣẹ́."
"Worker directory read and traversal": "Kíkà àti ìrìn-àjò fódà òṣìṣẹ́"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Àwọn fódà òṣìṣẹ́ tí a nílò gbọ́dọ̀ wà kí wọ́n sì gba kíkà àti ìrékọjá láàyè. Kò sí kíkọ tí a dán wò."
"The inherited worker secret matches the web secret for this private challenge.": "Àṣírí òṣìṣẹ́ tí a jogún bá àṣírí wẹ́ẹ̀bù mu fún ìpèníjà àdáni yìí."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Ṣe àtúnyẹ̀wò olùtúmọ̀ PHP tí a ṣètò, àwọn ìfẹ̀sí tí a nílò, àṣírí tí a jogún àti àwọn àṣẹ fódà àkọọ́lẹ̀ iṣẹ́. Kò sí kíkọ tàbí ìbẹ̀rẹ̀ olùfisori ẹ̀rọ tí a dán wò."
"advisory": "ìmọ̀ràn"
