"The graph rule changed since you opened this form. Reload before saving.": "Ο κανόνας γραφήματος άλλαξε από τότε που ανοίξατε αυτήν τη φόρμα. Επαναφορτώστε πριν αποθηκεύσετε."
"Unable to load the graph rule. Reload before retrying.": "Αδυναμία φόρτωσης του κανόνα γραφήματος. Επαναφορτώστε πριν προσπαθήσετε ξανά."
"Unexpected fields were submitted.": "Υποβλήθηκαν απροσδόκητα πεδία."
