"Choose an existing Site.": "בחר אתר קיים."
"Choose one of the listed values.": "בחר אחד מהערכים המופיעים ברשימה."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "בחר את אוסף הנתונים/דוגם שישמש לאיסוף נתונים מהתקן זה."
"Choose the Site that you wish to associate discovered Devices with.": "בחר את האתר שאליו ברצונך לשייך התקנים שהתגלו."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "לוחות זמנים יומיים ושבועיים משתמשים בהתחלה וב'הרץ שוב כל'; לוחות זמנים שבועיים משתמשים גם בימים בשבוע. חודשי משתמש בחודשים ובימים בחודש; חודשי ביום מסוים משתמש בחודשים, בשבועות בחודש ובימים בשבוע."
"Daily": "יומי"
"Data Collector": "אספן נתונים"
