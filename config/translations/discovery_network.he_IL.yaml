"April": "אפריל"
"Associated Site": "אתר משויך"
"August": "אוגוסט"
"Automatically Add Devices": "הוסף התקנים באופן אוטומטי"
"Back to Networks": "חזרה לרשתות"
"Choose an existing Data Collector.": "בחר אוסף נתונים קיים."
