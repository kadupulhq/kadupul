"Enter DNS servers as IP addresses or host names separated by spaces.": "הזן שרתי DNS ככתובות IP או שמות מארחים מופרדים ברווחים."
"Enter IPs or FQDNs of DNS Servers": "הזן כתובות IP או שמות FQDN של שרתי DNS"
"Enter a name.": "הזן שם."
"Enter a valid email address.": "הזן כתובת דוא\"ל חוקית."
"Enter a whole number from %min% to %max%.": "הזן מספר שלם מ-%min% עד %max%."
"Enter at most %count% bytes.": "הזן לכל היותר %count% בתים."
"Enter single-line text.": "הזן טקסט בשורה אחת."
"Enter the start as YYYY-MM-DD HH:MM.": "הזן את שעת ההתחלה בתבנית YYYY-MM-DD HH:MM."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "הזן טווחי רשת חוקיים מופרדים בפסיקים. באפשרותך להשתמש בכתובת IP, בטווח רשת כגון 192.168.1.0/24 או 192.168.1.0/255.255.255.0, או בסימון תווים כלליים כגון 192.168.*.*"
"Enter valid network ranges separated by commas.": "הזן טווחי רשת חוקיים מופרדים בפסיקים."
