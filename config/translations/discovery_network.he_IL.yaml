"You must specify both the Months and Days of Month.": "עליך לציין הן את החודשים והן את הימים בחודש."
"You must specify the Months, Weeks of Month, and Days of Week.": "עליך לציין את החודשים, השבועות בחודש והימים בשבוע."
"You must specify the day of the week.": "עליך לציין את היום בשבוע."
