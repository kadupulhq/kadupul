"Wednesday": "יום רביעי"
"Week(s) of Month": "שבועות בחודש"
"Weekly": "שבועי"
"What Day(s) of the Month will this Network Range be discovered?": "באילו ימים בחודש יתגלה טווח רשת זה?"
"What Day(s) of the week will this Network Range be discovered?": "באילו ימים בשבוע יתגלה טווח רשת זה?"
"What Month(s) of the Year will this Network Range be discovered?": "באילו חודשים בשנה יתגלה טווח רשת זה?"
"What Week(s) of the Month will this Network Range be discovered?": "באילו שבועות בחודש יתגלה טווח רשת זה?"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "באיזו שעה יתחיל פריט גילוי רשת זה? הזן בתבנית YYYY-MM-DD HH:MM."
