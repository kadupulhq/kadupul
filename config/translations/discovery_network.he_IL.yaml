"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "שם חשבון הדוא\"ל שישמש כשם השולח עבור דוא\"ל ההתראה. אם יושאר ריק, ייעשה שימוש בשם ברירת המחדל להתראות אוטומציה."
"The Email account to be used to send the Notification Email to.": "חשבון הדוא\"ל שאליו יישלח דוא\"ל ההתראה."
"The discovery network changed since you opened this form. Reload before saving.": "רשת הגילוי השתנתה מאז פתחת טופס זה. טען מחדש לפני השמירה."
