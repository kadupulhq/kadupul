"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "רשימה מופרדת ברווחים של שרתי DNS חלופיים לשימוש עבור פענוח DNS. אם השדה ריק, מערכת ההפעלה של הדוגם תשמש לפענוח שמות DNS."
"Access denied.": "הגישה נדחתה."
"Add Discovery Network": "הוסף רשת גילוי"
"After an initial failure, the number of ping retries to attempt before failing.": "לאחר כשל ראשוני, מספר ניסיונות ה-ping החוזרים שיבוצעו לפני דיווח כישלון."
"After the selected Run Limit, the discovery process will be terminated.": "לאחר מגבלת הריצה שנבחרה, תהליך הגילוי יופסק."
"Allow same sysName on different hosts": "אפשר sysName זהה במארחים שונים"
