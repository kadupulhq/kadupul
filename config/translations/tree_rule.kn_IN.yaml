"Check this box to enable this rule.": "ಈ ನಿಯಮವನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಲು ಈ ಬಾಕ್ಸ್ ಅನ್ನು ಗುರುತಿಸಿ."
"Choose a Tree for the new Tree Items.": "ಹೊಸ ಟ್ರೀ ಐಟಂಗಳಿಗೆ ಟ್ರೀಯನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "ಆಯ್ದ ಟ್ರೀಯ ಹೆಡರ್ ಅಥವಾ ಅದರ ರೂಟ್ ಅನ್ನು ಸೇರಿಸಲು ಆಯ್ಕೆಮಾಡಿ. ಈ ನಿಯಮವನ್ನು ಕಾರ್ಯಗತಗೊಳಿಸುವಾಗ ಅದು ಇನ್ನೂ ಅಸ್ತಿತ್ವದಲ್ಲಿದೆ ಎಂದು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ."
"Choose a header of the selected Tree.": "ಆಯ್ದ ಟ್ರೀಯ ಹೆಡರ್ ಅನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Choose a listed Graph Grouping Style.": "ಪಟ್ಟಿಯಲ್ಲಿರುವ ಗ್ರಾಫ್ ಗುಂಪುಗಾರಿಕೆ ಶೈಲಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Choose a listed Leaf Item Type.": "ಪಟ್ಟಿಯಲ್ಲಿರುವ ಲೀಫ್ ಐಟಂ ಪ್ರಕಾರವನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Choose an existing Tree.": "ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಟ್ರೀಯನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ಟ್ರೀಯಲ್ಲಿ ಈ ನಿರ್ದಿಷ್ಟ ಹೋಸ್ಟ್‌ಗಾಗಿ ಗ್ರಾಫ್‌ಗಳನ್ನು ಚಿತ್ರಿಸುವಾಗ ಅವುಗಳನ್ನು ಹೇಗೆ ಗುಂಪುಗೊಳಿಸಬೇಕು ಎಂಬುದನ್ನು ಆಯ್ಕೆಮಾಡಿ. ಸಾಧನ ಲೀಫ್‌ಗಳಿಗೆ ಬಳಸಲಾಗುತ್ತದೆ."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "ಈ ಕೆಳಗಿನ ಟ್ರೀ ನಿಯಮಗಳನ್ನು ಅವುಗಳ ವಸ್ತು ಆಯ್ಕೆ ಮತ್ತು ಟ್ರೀ ರಚನೆ ಮಾನದಂಡಗಳೊಂದಿಗೆ ಅಳಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ."
"Click Continue to disable the following Tree Rules.": "ಈ ಕೆಳಗಿನ ಟ್ರೀ ನಿಯಮಗಳನ್ನು ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "ಈ ಕೆಳಗಿನ ಟ್ರೀ ನಿಯಮಗಳನ್ನು ನಕಲಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ. ನಿಷ್ಕ್ರಿಯವಾಗಿ ಆರಂಭವಾಗುವ ಹೊಸ ಟ್ರೀ ನಿಯಮಗಳಿಗೆ ಶೀರ್ಷಿಕೆ ಸ್ವರೂಪವನ್ನು ಐಚ್ಛಿಕವಾಗಿ ಬದಲಾಯಿಸಬಹುದು."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "ಈ ಕೆಳಗಿನ ಟ್ರೀ ನಿಯಮಗಳನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಲು ಮುಂದುವರಿಸಿ ಕ್ಲಿಕ್ ಮಾಡಿ. ಅವುಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಪರೀಕ್ಷಿಸಲಾಗಿದೆ ಎಂದು ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ."
