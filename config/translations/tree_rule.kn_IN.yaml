"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "ಸಾಧನ ಲೀಫ್‌ಗಳು ಗ್ರಾಫ್ ಅಥವಾ ಗ್ರಾಫ್ ಟೆಂಪ್ಲೇಟ್ ಕಾಲಮ್‌ಗಳ ಮೇಲಿನ ಮಾನದಂಡವನ್ನು ಬಳಸಲಾಗುವುದಿಲ್ಲ. ಲೀಫ್ ಐಟಂ ಪ್ರಕಾರವನ್ನು ಸಾಧನಕ್ಕೆ ಬದಲಾಯಿಸುವಾಗ, ಆ ಮಾನದಂಡಗಳನ್ನು ತೆಗೆದುಹಾಕಲು ಈ ಪೆಟ್ಟಿಗೆಯನ್ನು ಗುರುತಿಸಿ; ಅವುಗಳನ್ನು ಮರುಪಡೆಯಲು ಸಾಧ್ಯವಿಲ್ಲ."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "ಸಾಧನ ಲೀಫ್‌ಗಳು ಗ್ರಾಫ್ ಆಧಾರಿತ ಮಾನದಂಡವನ್ನು ಬಳಸಲಾಗುವುದಿಲ್ಲ. ಉಳಿಸಲು %count% ಮಾನದಂಡಗಳ ತೆಗೆದುಹಾಕುವಿಕೆಯನ್ನು ದೃಢೀಕರಿಸಿ."
