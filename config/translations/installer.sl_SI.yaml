"Advanced options": "Napredne možnosti"
"Applying database upgrades": "Uporaba nadgradenj zbirke podatkov"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Varnostno kopirajte zbirko podatkov, datoteke RRD, konfiguracijo in ključe. Nadgradnje zbirke podatkov lahko potrdijo spremembe, ki jih povrnitev aplikacije ne more razveljaviti."
"Blocked": "Blokirano"
"Check": "Preveri"
