"Override discovery SNMP settings": "Preglasi nastavitve SNMP za odkrivanje"
"Pass": "Uspešno"
"Poller interval in seconds": "Interval pollerja v sekundah"
"Preparing CSRF protection": "Priprava zaščite CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Napredek prikazuje zadnjo zabeleženo fazo. Osvežitev te strani nikoli ne zažene ali ponovi delavca."
"Recover stopped attempt": "Obnovi ustavljeni poskus"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Obnovitev ohrani shranjene izbire in nikoli ne konča delujočega delavca. Pred ponovnim poskusom znova preglejte načrt."
"Review": "Pregled"
"Review installation plan": "Preglej načrt namestitve"
"Run": "Zaženi"
"Run reviewed plan": "Zaženi pregledani načrt"
"Save and review": "Shrani in preglej"
"Scope": "Obseg"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Stanje ni na voljo. Shranjeno delo je ohranjeno. Osvežite za ponovno povezavo; ne oddajajte nove namestitve."
"Synchronizing collectors": "Sinhroniziranje zbiralnikov"
"Table conversions": "Pretvorbe tabel"
"Templates": "Predloge"
"The database version matches this application. Installation does not establish that polling is healthy.": "Različica zbirke podatkov se ujema s to aplikacijo. Namestitev ne dokazuje, da je popraševanje zdravo."
"The request outcome is unknown. Check execution status before retrying.": "Izid zahteve ni znan. Pred ponovnim poskusom preverite stanje izvajanja."
"Theme": "Tema"
"Verify": "Preveri"
"Verify the poller schedule and service account.": "Preverite urnik pollerja in storitveni račun."
"Version change": "Sprememba različice"
"Waiting for the installation worker": "Čakanje na delavca namestitve"
"collector": "zbiralnik"
"complete": "končano"
"failed": "neuspelo"
"finish": "zaključek"
"install": "namestitev"
"not_started": "ni zagnano"
"partial": "delno"
"running": "v teku"
"succeeded": "uspelo"
"upgrade": "nadgradnja"
"waiting": "čakanje"
"Accept the license before saving the installation plan.": "Pred shranjevanjem načrta namestitve sprejmite licenco."
"Invalid installation form.": "Neveljaven obrazec namestitve."
"Access denied.": "Dostop zavrnjen."
"Confirm the recovery warning before retrying.": "Pred ponovnim poskusom potrdite opozorilo o obnovitvi."
"Review and confirm the current installation plan.": "Preglejte in potrdite trenutni načrt namestitve."
"Confirm the discovery scope before starting.": "Pred zagonom potrdite obseg odkrivanja."
"Resolve the blocking checks before starting.": "Pred zagonom odpravite blokirajoča preverjanja."
"Too many installer options.": "Preveč možnosti namestitvenega programa."
"Invalid installer option name.": "Neveljavno ime možnosti namestitvenega programa."
"Unknown or malformed installer option.": "Neznana ali napačno oblikovana možnost namestitvenega programa."
"Installer options must be scalar values.": "Možnosti namestitvenega programa morajo biti skalarne vrednosti."
"Installer option is too long or contains a null byte.": "Možnost namestitvenega programa je predolga ali vsebuje ničelni bajt."
"Installer IDs and intervals must be whole numbers.": "ID-ji in intervali namestitvenega programa morajo biti cela števila."
"Installer ID or interval is outside its supported range.": "ID ali interval namestitvenega programa je zunaj podprtega obsega."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Namestitve ni bilo mogoče nadaljevati. Pred ponovnim poskusom znova naložite njeno stanje in preglejte blokirajoča preverjanja."
"Confirm that the previous worker has stopped before recovering its plan.": "Pred obnovitvijo njegovega načrta potrdite, da se je prejšnji delavec ustavil."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Zbirka podatkov je nameščena, vendar nekateri zbiralniki še potrebujejo sinhronizacijo. Po preverjanju njihovega stanja ponovite zaključna opravila."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Namestitev se je ustavila. Ohranite dnevnik namestitvenega programa, odpravite vzrok in izrecno potrdite ponovni poskus. Nekatere spremembe zbirke podatkov so morda že potrjene. Pred odobritvijo ponovnega poskusa preverite čiščenje vtičnikov."
"Next action": "Naslednje dejanje"
"Follow the execution status. Do not start another attempt while a worker is active.": "Sledite stanju izvajanja. Ne začnite novega poskusa, dokler je delavec aktiven."
"Complete the recovery checklist before retrying.": "Pred ponovnim poskusom dokončajte kontrolni seznam za obnovitev."
"Verify collection and graph operation before enabling discovery.": "Pred omogočitvijo odkrivanja preverite delovanje zbiranja in grafov."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Odpravite blokirane zahteve in nato preverite znova. Shranjene izbire so ohranjene."
"Review the planned changes and backup checklist before authorizing execution.": "Pred odobritvijo izvajanja preglejte načrtovane spremembe in kontrolni seznam varnostnih kopij."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Izberite profil zbiranja in sprejmite licenco. Izbirne nastavitve lahko odprete po potrebi."
"Download installation diagnostics": "Prenesi diagnostiko namestitve"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Odprite graf in potrdite, da se njegovi podatki RRD posodobijo po ciklu pollerja."
"Requirement details": "Podrobnosti zahtev"
"Recover": "Obnovi"
"Recovery checklist": "Kontrolni seznam za obnovitev"
"Preserve log/cacti.log and record the failed attempt.": "Ohranite log/cacti.log in zabeležite neuspeli poskus."
"Confirm that the previous worker and its child processes have stopped.": "Potrdite, da sta prejšnji delavec in njegovi podrejeni procesi ustavljena."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Preglejte potrjene spremembe, sinhronizacijo zbiralnikov in čiščenje vtičnikov. Pred ponovnim poskusom odpravite vzrok."
"Review the saved plan again, then explicitly authorize a retry.": "Znova preglejte shranjeni načrt in nato izrecno odobrite ponovni poskus."
"Recover a stopped worker": "Obnovi ustavljenega delavca"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Obnovitev uporabite šele po potrditvi, da ta poskus ne teče več. Obnovitev ne ustavi procesa."
"Collector and installation mode": "Zbiralnik in način namestitve"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Konfiguracija uvedbe določa vlogo zbiralnika in povezave z zbirko podatkov. Pred zagonom zbiralnika preverite konfiguracijo primarnega strežnika."
"Discovery and SNMP settings": "Odkrivanje in nastavitve SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Odkrivanje naj ostane onemogočeno, dokler ni preverjeno zbiranje in povezljivost zbiralnikov."
"Template selection": "Izbor predlog"
"Templates selected for import": "Predloge, izbrane za uvoz"
"No templates selected.": "Nobena predloga ni izbrana."
"Backup checklist": "Kontrolni seznam varnostnih kopij"
"Database backup and a tested restoration procedure.": "Varnostna kopija zbirke podatkov in preizkušen postopek obnovitve."
"RRD files and the service account permissions needed to restore them.": "Datoteke RRD in dovoljenja storitvenega računa, potrebna za njihovo obnovitev."
"Configuration, keys and plugin data outside the database.": "Konfiguracija, ključi in podatki vtičnikov zunaj zbirke podatkov."
"Post-installation checks": "Preverjanja po namestitvi"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Preverjena preverjanja zajemajo samo prikazane dokaze. Neocenjena preverjanja še vedno zahtevajo preverjanje upravljavca."
"Operational checks still require operator verification.": "Operativna preverjanja še vedno zahtevajo preverjanje upravljavca."
"Status": "Stanje"
"verified": "Preverjeno"
"action_required": "Potrebno ukrepanje"
"not_assessed": "Ni ocenjeno"
"Database schema": "Shema zbirke podatkov"
"Stored schema matches the application target.": "Shranjena shema se ujema s ciljem aplikacije."
"Target schema completion has not been confirmed.": "Dokončanje ciljne sheme ni potrjeno."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Pred štetjem nadgradnje sheme za dokončano preglejte izid namestitve in odpravite napake."
"Installation outcome": "Izid namestitve"
"A successful receipt matches the current target schema.": "Uspešno potrdilo se ujema s trenutno ciljno shemo."
"A complete successful installation outcome has not been confirmed.": "Popoln uspešen izid namestitve ni potrjen."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Ohranite dnevnik namestitvenega programa in po potrebi uporabite izrecen postopek obnovitve ali ponovnega poskusa."
"Collector synchronization": "Sinhronizacija zbiralnikov"
"The completed installer reports pending collector synchronization.": "Dokončani namestitveni program poroča o čakajoči sinhronizaciji zbiralnikov."
"The completed installer reports no pending collectors.": "Dokončani namestitveni program poroča, da ni čakajočih zbiralnikov."
"Collector completion remains unconfirmed by this partial receipt.": "To delno potrdilo ne potrjuje dokončanja zbiralnikov."
"Collector completion is not established by this installation outcome.": "Ta izid namestitve ne dokazuje dokončanja zbiralnikov."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Preglejte stanje zbiralnikov in ponovite zaključna opravila pri delnih izidih. S tem se ne preveri svežina poznejšega zbiranja."
"Scheduled collection": "Načrtovano zbiranje"
"No poller or device was contacted by this assessment.": "S to oceno ni bil vzpostavljen stik z nobenim pollerjem ali napravo."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Potrdite, da konfiguriran razporejevalnik zaganja poller kot predvideni storitveni račun, in preglejte njegov naslednji običajni cikel."
"Graph data": "Podatki grafov"
"Live samples and RRD updates were not exercised.": "Živi vzorci in posodobitve RRD niso bili preizkušeni."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Po običajnem ciklu zbiranja potrdite, da pričakovani grafi prejemajo sveže vzorce, in preglejte napake pollerja."
"Recovery readiness": "Pripravljenost na obnovitev"
"Backup restoration was not exercised.": "Obnovitev iz varnostne kopije ni bila preizkušena."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Preden se zanesete na obnovitev, preverite izolirano obnovitev zbirke podatkov, datotek RRD, konfiguracije in gradiva ključev."
"No persisted local poller start has been recorded.": "Ni zabeležen noben trajno shranjen lokalni zagon pollerja."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Trajno shranjena časovna razporeditev pollerja je neveljavna in ne more dokazati zdravja razporejevalnika."
"The recorded poller start is in the future. Check clock synchronization.": "Zabeleženi zagon pollerja je v prihodnosti. Preverite sinhronizacijo ure."
"The recorded poller start is older than the native scheduling tolerance.": "Zabeleženi zagon pollerja je starejši od tolerance izvornega razporejanja."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Lokalni zagon pollerja je bil zabeležen znotraj tolerance izvornega razporejanja. Dokončanje in zdravje naprav nista preverjena."
"readable": "berljivo"
"missing or unreadable": "manjka ali ni berljivo"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Obnovite celotno izdajo in njene zaklenjene odvisnosti; storitvenemu računu dodelite dostop za branje."
"PHP temporary directory": "Začasni imenik PHP"
"directory writable by this process": "imenik, v katerega lahko ta proces piše"
"missing or not writable": "manjka ali ni zapisljivo"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Nastavite sys_temp_dir na obstoječ imenik, v katerega lahko piše namestitveni račun. Izvorni uvozi uporabljajo začasne datoteke."
"Background worker launch": "Zagon delavca v ozadju"
"required PHP functions available; launch not exercised": "zahtevane funkcije PHP so na voljo; zagon ni preizkušen"
"required PHP launch function disabled": "zahtevana funkcija zagona PHP je onemogočena"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Omogočite exec za spletno izvajalno okolje PHP ali uporabite pooblaščen namestitveni program CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Omogočite popen, pclose za spletno izvajalno okolje PHP ali uporabite pooblaščen namestitveni program CLI."
"Database transaction ownership": "Lastništvo transakcije zbirke podatkov"
"autocommit enabled; no caller-owned transaction": "samodejna potrditev omogočena; ni transakcije v lasti klicatelja"
"autocommit disabled or caller transaction active": "samodejna potrditev onemogočena ali aktivna transakcija klicatelja"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Namestitev zaženite zunaj transakcije v lasti klicatelja in na povezavi za spreminjanje omogočite samodejno potrditev."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Obnovite imenik izdaje in namestitvenemu računu dodelite pravico pisanja za uvoz virov predlog. Ne omogočite pisanja vsem."
"Worker file: install/background.php": "Datoteka delavca: install/background.php"
"Worker file: bin/legacy-installer.php": "Datoteka delavca: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Datoteka delavca: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Cilj uvoza: resource/snmp_queries"
"Import destination: resource/script_server": "Cilj uvoza: resource/script_server"
"Import destination: resource/script_queries": "Cilj uvoza: resource/script_queries"
"Import destination: scripts": "Cilj uvoza: scripts"
"Database privileges": "Pravice zbirke podatkov"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Učinkovite pravice za selitev, vključno z aktivnimi vlogami in pravicami za posamezne objekte, niso bile preverjene."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Skrbnik zbirke podatkov naj za namestitveni račun in shemo preveri zahtevane zapise v tabele, spremembe sheme, sprožilce in rutine. Ne dodelite globalnih skrbniških pravic."
"Compare web and worker runtimes": "Primerjaj izvajalna okolja spleta in delavca"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "To izrecno zažene kratek PHP preizkus samo za branje. Ne rezervira namestitvenega programa, ne zapisuje datotek in ne vzpostavlja stika z napravami."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Preizkus podeduje ta spletni proces in uporabi konfiguriran PHP interpreter namestitvenega programa. Ne pregleda ločenega razporejevalnika ali storitve."
"I authorize the read-only worker runtime comparison.": "Odobrim primerjavo izvajalnih okolij delavca samo za branje."
"Compare runtimes": "Primerjaj izvajalna okolja"
"Runtime comparison results": "Rezultati primerjave izvajalnih okolij"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Razlike v dovoljenjih in identiteti so lahko namerne. Opažanja samo za branje ne dokazujejo, da bosta pisanje ali namestitev uspela."
"Confirm the read-only worker runtime comparison.": "Potrdite primerjavo izvajalnih okolij delavca samo za branje."
"The runtime comparison is unavailable.": "Primerjava izvajalnih okolij ni na voljo."
"Shared application secret": "Skupna skrivnost aplikacije"
"A strong web application secret is required before comparison.": "Pred primerjavo je potrebna močna skrivnost spletne aplikacije."
"Runtime comparison": "Primerjava izvajalnih okolij"
"The configured worker runtime did not confirm a bounded comparison.": "Konfigurirano izvajalno okolje delavca ni potrdilo omejene primerjave."
"The inherited worker secret could not be confirmed against the web secret.": "Podedovane skrivnosti delavca ni bilo mogoče potrditi glede na spletno skrivnost."
"PHP runtime comparison": "Primerjava izvajalnih okolij PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Obe izvajalni okolji morata podpirati PHP 8.4; različne popravne različice zahtevajo pregled."
"Required extension comparison": "Primerjava zahtevanih razširitev"
"Required extension availability is checked; differing versions require review.": "Preverja se razpoložljivost zahtevanih razširitev; različne različice zahtevajo pregled."
"Process identity comparison": "Primerjava identitete procesa"
"Effective process identity is unavailable on this platform.": "Dejanska identiteta procesa na tej platformi ni na voljo."
"Effective process identities match.": "Dejanski identiteti procesov se ujemata."
"Effective process identities differ; separate service accounts may be intentional.": "Dejanski identiteti procesov se razlikujeta; ločeni storitveni računi so lahko namerni."
"Directory access comparison": "Primerjava dostopa do imenikov"
"Read-only directory permission observations match.": "Opažanja dovoljenj imenikov samo za branje se ujemajo."
"Directory locations or permission observations differ; review the service-account roles.": "Lokacije imenikov ali opažanja dovoljenj se razlikujejo; preglejte vloge storitvenih računov."
"Worker directory read and traversal": "Branje in prečkanje imenikov delavca"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Zahtevani imeniki delavca morajo obstajati ter omogočati branje in prečkanje. Pisanje ni bilo preizkušeno."
"The inherited worker secret matches the web secret for this private challenge.": "Podedovana skrivnost delavca se ujema s spletno skrivnostjo za ta zasebni izziv."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Preglejte konfiguriran PHP interpreter, zahtevane razširitve, podedovano skrivnost in dovoljenja imenikov storitvenih računov. Pisanje in zagon namestitvenega programa nista bila preizkušena."
"advisory": "svetovalno"
