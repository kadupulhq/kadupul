"Converting selected tables": "Pretvorba izbranih tabel"
"Database version": "Različica zbirke podatkov"
"Disabled": "Onemogočeno"
"Discovery": "Odkrivanje"
"Discovery SNMP settings": "Nastavitve SNMP za odkrivanje"
"Discovery range": "Obseg odkrivanja"
"Enable discovery after installation": "Omogoči odkrivanje po namestitvi"
"Executable paths": "Poti do izvedljivih datotek"
"Execution status": "Stanje izvajanja"
"Finished execution": "Izvajanje končano"
"Finishing tasks only. Schema migrations will not be replayed.": "Samo zaključna opravila. Selitve sheme se ne bodo ponovno izvedle."
"I accept the license terms": "Sprejemam licenčne pogoje"
"I authorize discovery of the displayed range": "Odobrim odkrivanje prikazanega obsega"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Preveril(-a) sem dnevnik in potrdil(-a), da sta prejšnji delavec in njegovi podrejeni procesi ustavljena"
"I checked the previous attempt and accept that some changes may already be committed": "Preveril(-a) sem prejšnji poskus in sprejemam, da so nekatere spremembe morda že potrjene"
"I reviewed this plan and have the required backups": "Pregledal(-a) sem ta načrt in imam potrebne varnostne kopije"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Če se delavec nepričakovano ustavi, ohranite log/cacti.log in pred izrecnim ponovnim poskusom potrdite, da se je njegov proces končal. Stanje čakanja ne potrjuje uspešnega zagona."
"Importing templates": "Uvoz predlog"
"Install Kadupul": "Namesti Kadupul"
"Installation and upgrade": "Namestitev in nadgradnja"
"Installation request was rejected.": "Zahteva za namestitev je bila zavrnjena."
"Installation steps": "Koraki namestitve"
"Installed": "Nameščeno"
"Keep a backup of the database, RRD files, configuration and secret material.": "Hranite varnostno kopijo zbirke podatkov, datotek RRD, konfiguracije in skrivnega gradiva."
"Language": "Jezik"
"Large tables may require the dedicated CLI conversion tool before installation.": "Velike tabele lahko pred namestitvijo zahtevajo namensko orodje CLI za pretvorbo."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Skrivna polja pustite prazna, da ohranite shranjene poverilnice. Skrivnosti se nikoli ne prikažejo znova."
