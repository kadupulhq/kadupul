"Check collection freshness and collector connectivity before enabling discovery.": "Pred omogočitvijo odkrivanja preverite svežino zbiranja in povezljivost zbiralnikov."
"Check requirements": "Preveri zahteve"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Preverjanja pregledajo ta proces in dovoljenja datotečnega sistema. Ne zapisujejo preizkusnih datotek in ne vzpostavljajo stika z napravami."
