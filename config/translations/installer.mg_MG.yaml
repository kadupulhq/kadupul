"Advanced options": "Safidy avo lenta"
"Applying database upgrades": "Fampiharana ny fanavaozana ny angon-drakitra"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Manaova dika fiarovana ny angon-drakitra, ny rakitra RRD, ny fikirakirana ary ny fanalahidy. Mety hampihatra fanovana tsy azon'ny fiverenan'ny rindranasa foanana ny fanavaozana ny angon-drakitra."
"Blocked": "Voasakana"
"Check": "Fanamarinana"
"Check again": "Hamarino indray"
"Check collection freshness and collector connectivity before enabling discovery.": "Hamarino ny fahavaozan'ny fanangonana sy ny fifandraisan'ny mpanangona alohan'ny hampandehanana ny fikarohana."
"Check requirements": "Hamarino ny fepetra takiana"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Manamarina ity dingana ity sy ny alalana amin'ny rafitra rakitra ny fitsirihana. Tsy manoratra rakitra fitsapana na mifandray amin'ny fitaovana izy ireo."
"Collection profile": "Mombamomba ny fanangonana"
"Collector": "Mpanangona"
