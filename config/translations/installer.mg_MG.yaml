"Converting selected tables": "Manova endrika ireo tabilao voafidy"
"Database version": "Kinovan'ny tahiry angona"
"Disabled": "Tsy mandeha"
"Discovery": "Fikarohana"
"Discovery SNMP settings": "Fikirana SNMP ho an'ny fikarohana"
"Discovery range": "Sahan'ny fikarohana"
"Enable discovery after installation": "Alefaso ny fikarohana aorian'ny fametrahana"
"Executable paths": "Lalan'ireo rakitra azo tanterahina"
"Execution status": "Satan'ny fanatanterahana"
"Finished execution": "Vita ny fanatanterahana"
"Finishing tasks only. Schema migrations will not be replayed.": "Asa famaranana ihany. Tsy haverina alefa ireo fanovana rafitry ny tahiry angona."
"I accept the license terms": "Manaiky ny fepetran'ny fahazoan-dalana aho"
"I authorize discovery of the displayed range": "Manome alalana ny fikarohana amin'ny saha aseho aho"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Nojereko ny tatitra ary nohamariniko fa nijanona ny mpanatanteraka teo aloha sy ireo dingana zanany"
"I checked the previous attempt and accept that some changes may already be committed": "Nojereko ny fanandramana teo aloha ary ekeko fa mety efa nampiharina ny fanovana sasany"
"I reviewed this plan and have the required backups": "Nodinihiko ity drafitra ity ary manana ny tahiry fiarovana ilaina aho"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Raha mijanona tampoka ny mpanatanteraka iray dia tehirizo ny log/cacti.log ary hamarino fa nifarana ny dingana misy azy alohan'ny hanandramana indray mazava tsara. Ny toe-javatra miandry dia tsy manamarina fanombohana nahomby."
"Importing templates": "Manafatra ireo lasitra"
"Install Kadupul": "Apetraho ny Kadupul"
"Installation and upgrade": "Fametrahana sy fanavaozana"
"Installation request was rejected.": "Nolavina ny fangatahana fametrahana."
"Installation steps": "Dingana fametrahana"
"Installed": "Tafapetraka"
"Keep a backup of the database, RRD files, configuration and secret material.": "Tehirizo ny kopia fiarovana ny tahiry angona, ny rakitra RRD, ny fikirana ary ireo singa miafina."
"Language": "Fiteny"
"Large tables may require the dedicated CLI conversion tool before installation.": "Mety hitaky ny fitaovana CLI natokana hanovana endrika ny tabilao lehibe alohan'ny fametrahana."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Avelao ho foana ny saha miafina mba hitazonana ireo fanamarinana voatahiry. Tsy aseho intsony mihitsy ny tsiambaratelo."
"License": "Lisansa"
"No action needed": "Tsy misy hetsika ilaina"
"Observed": "Voamarika"
"Open the console": "Sokafy ny konsoly"
"Operation": "Asa"
"Override discovery SNMP settings": "Soloy ny fikirana SNMP ho an'ny fikarohana"
"Pass": "Nahomby"
"Poller interval in seconds": "Elanelam-potoanan'ny mpanangon-drakitra amin'ny segondra"
"Preparing CSRF protection": "Manomana ny fiarovana CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Ny fivoarana dia mampiseho ny dingana voarakitra farany. Ny fanavaozana ity pejy ity dia tsy manomboka na manandrana indray mpanatanteraka velively."
"Recover stopped attempt": "Avereno ny fanandramana nijanona"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Ny famerenana dia mitazona ny safidy voatahiry ary tsy mamarana velively mpanatanteraka mbola mandeha. Diniho indray ny drafitra alohan'ny hanandramana indray."
"Review": "Diniho"
"Review installation plan": "Diniho ny drafitra fametrahana"
"Run": "Alefaso"
"Run reviewed plan": "Alefaso ny drafitra nodinihina"
"Save and review": "Tehirizo ary diniho"
"Scope": "Saha"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Tsy azo ny sata. Voatahiry ny asa voaray. Havaozy mba hifandray indray; aza mandefa fametrahana hafa."
"Synchronizing collectors": "Mampifandrindra ireo mpanangona"
"Table conversions": "Fanovana endrika tabilao"
"Templates": "Lasitra"
"The database version matches this application. Installation does not establish that polling is healthy.": "Mifanaraka amin'ity fampiharana ity ny kinovan'ny tahiry angona. Ny fametrahana dia tsy manaporofo fa salama ny fanangonana angona."
"The request outcome is unknown. Check execution status before retrying.": "Tsy fantatra ny vokatry ny fangatahana. Jereo ny satan'ny fanatanterahana alohan'ny hanandramana indray."
"Theme": "Endrika"
"Verify": "Hamarino"
"Verify the poller schedule and service account.": "Hamarino ny fandaharam-potoanan'ny mpanangon-drakitra sy ny kaonty serivisy."
"Version change": "Fiovan'ny kinova"
"Waiting for the installation worker": "Miandry ny mpanatanteraka fametrahana"
"collector": "mpanangona"
"complete": "vita"
"failed": "tsy nahomby"
"finish": "famaranana"
"install": "fametrahana"
"not_started": "tsy mbola natomboka"
"partial": "ampahany"
"running": "mandeha"
"succeeded": "nahomby"
"upgrade": "fanavaozana"
"waiting": "miandry"
"Accept the license before saving the installation plan.": "Ekeo ny fahazoan-dalana alohan'ny hitahirizana ny drafitra fametrahana."
"Invalid installation form.": "Tsy manankery ny taratasy fametrahana."
"Access denied.": "Tsy nahazo alalana."
"Confirm the recovery warning before retrying.": "Hamarino ny fampitandremana momba ny famerenana alohan'ny hanandramana indray."
"Review and confirm the current installation plan.": "Diniho ary hamarino ny drafitra fametrahana ankehitriny."
"Confirm the discovery scope before starting.": "Hamarino ny sahan'ny fikarohana alohan'ny hanombohana."
"Resolve the blocking checks before starting.": "Vahao ireo fanamarinana manakana alohan'ny hanombohana."
"Too many installer options.": "Be loatra ny safidin'ny mpametraka."
"Invalid installer option name.": "Tsy manankery ny anaran'ny safidin'ny mpametraka."
"Unknown or malformed installer option.": "Safidin'ny mpametraka tsy fantatra na diso endrika."
"Installer options must be scalar values.": "Tsy maintsy sanda tokana ny safidin'ny mpametraka."
"Installer option is too long or contains a null byte.": "Lava loatra ny safidin'ny mpametraka na misy okteta foana."
"Installer IDs and intervals must be whole numbers.": "Tsy maintsy isa feno ny ID sy ny elanelam-potoanan'ny mpametraka."
"Installer ID or interval is outside its supported range.": "Any ivelan'ny elanelana ekena ny ID na ny elanelam-potoanan'ny mpametraka."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Tsy afaka nitohy ny fametrahana. Havaozy ny satany ary diniho ireo fanamarinana manakana alohan'ny hanandramana indray."
"Confirm that the previous worker has stopped before recovering its plan.": "Hamarino fa nijanona ny mpanatanteraka teo aloha alohan'ny hamerenana ny drafiny."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Voapetraka ny tahiry angona, fa mbola mila fampifanarahana ny mpanangona sasany. Andramo indray ny asa famaranana rehefa avy nanamarina ny satany."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Nijanona ny fametrahana. Tehirizo ny tatitry ny mpametraka, ahitsio ny antony ary hamarino mazava ny fanandramana indray. Mety efa nampiharina ny fanovana sasany tao amin'ny tahiry angona. Jereo ny fanadiovana ny tovana alohan'ny hanomezana alalana hanandrana indray."
"Next action": "Hetsika manaraka"
"Follow the execution status. Do not start another attempt while a worker is active.": "Araho ny satan'ny fanatanterahana. Aza manomboka fanandramana hafa raha mbola miasa ny mpanatanteraka iray."
"Complete the recovery checklist before retrying.": "Fenoy ny lisitra fanamarinana famerenana alohan'ny hanandramana indray."
"Verify collection and graph operation before enabling discovery.": "Hamarino ny fiasan'ny fanangonana sy ny kisary alohan'ny handefasana ny fikarohana."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Vahao ireo fepetra voasakana, avy eo hamarino indray. Voatahiry ireo safidy voaray."
"Review the planned changes and backup checklist before authorizing execution.": "Diniho ireo fanovana nomanina sy ny lisitra fanamarinana kopia fiarovana alohan'ny hanomezana alalana ny fanatanterahana."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Misafidiana mombamomba ny fanangonana ary ekeo ny fahazoan-dalana. Azo sokafana ny fikirana fanampiny raha ilaina."
"Download installation diagnostics": "Alaivo ny fizahana olana amin'ny fametrahana"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Sokafy ny kisary iray ary hamarino fa mihavao ny angona RRD ao aminy aorian'ny tsingerin'ny mpanangon-drakitra iray."
"Requirement details": "Antsipirian'ny fepetra"
"Recover": "Avereno"
"Recovery checklist": "Lisitra fanamarinana ny famerenana"
"Preserve log/cacti.log and record the failed attempt.": "Tehirizo ny log/cacti.log ary raketo ny fanandramana tsy nahomby."
"Confirm that the previous worker and its child processes have stopped.": "Hamarino fa nijanona ny mpanatanteraka teo aloha sy ny zana-draharahany."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Jereo ireo fanovana voarakitra, ny fampifanarahana ny mpanangona ary ny fanadiovana ny fanampin-rindrankajy. Ahitsio ny antony alohan'ny hanandramana indray."
"Review the saved plan again, then explicitly authorize a retry.": "Avereno jerena indray ny drafitra voatahiry, avy eo omeo alalana mazava ny fanandramana indray."
"Recover a stopped worker": "Hamerina mpanatanteraka nijanona"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Aza mampiasa ny famerenana raha tsy efa voamarina fa tsy mandeha intsony ity fanandramana ity. Tsy mampiato raharaha ny famerenana."
"Collector and installation mode": "Fomba fiasan'ny mpanangona sy ny fametrahana"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Ny fikirakirana ny fametrahana no mamaritra ny andraikitry ny mpanangona sy ny fifandraisana amin'ny angon-drakitra. Hamarino ny fikirakirana ny mpizara fototra alohan'ny hanombohana mpanangona."
"Discovery and SNMP settings": "Fikirakirana ny fitadiavana sy SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Avelao ho tapaka ny fitadiavana mandra-pamarinina ny fanangonana sy ny fifandraisan'ny mpanangona."
"Template selection": "Fifidianana lasitra"
"Templates selected for import": "Lasitra voafidy hampidirina"
"No templates selected.": "Tsy misy lasitra voafidy."
"Backup checklist": "Lisitra fanamarinana ny kopia fiarovana"
"Database backup and a tested restoration procedure.": "Kopia fiarovana ny angon-drakitra sy fomba famerenana efa voasedra."
"RRD files and the service account permissions needed to restore them.": "Rakitra RRD sy ireo fahazoan-dalan'ny kaontim-panompoana ilaina hamerenana azy ireo."
"Configuration, keys and plugin data outside the database.": "Fikirakirana, fanalahidy ary angon'ny fanampin-rindrankajy ivelan'ny angon-drakitra."
"Post-installation checks": "Fanamarinana aorian'ny fametrahana"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Ny fanamarinana voamarina dia mandrakotra ny porofo aseho ihany. Mbola mitaky fanamarinana ataon'ny mpandraharaha ireo fanamarinana tsy mbola nohadihadiana."
"Operational checks still require operator verification.": "Mbola mitaky fanamarinana ataon'ny mpandraharaha ireo fanamarinana fampandehanana."
"Status": "Toe-javatra"
"verified": "Voamarina"
"action_required": "Mitaky fandraisana andraikitra"
"not_assessed": "Tsy mbola nohadihadiana"
"Database schema": "Rafitry ny angon-drakitra"
"Stored schema matches the application target.": "Mifanaraka amin'ny tanjon'ny fampiharana ny rafitra voatahiry."
"Target schema completion has not been confirmed.": "Tsy mbola voamarina ny fahavitan'ny rafitra kendrena."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Jereo ny vokatry ny fametrahana ary vahao ireo tsy fahombiazana alohan'ny hiheverana fa vita ny fanavaozana ny rafitra."
"Installation outcome": "Vokatry ny fametrahana"
"A successful receipt matches the current target schema.": "Mifanaraka amin'ny rafitra kendrena ankehitriny ny fanamarinana fahavitana mahomby."
"A complete successful installation outcome has not been confirmed.": "Tsy mbola voamarina ny fahavitan'ny fametrahana nahomby tanteraka."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Tehirizo ny tatitry ny mpametraka ary ampiasao ny fomba famerenana na fanandramana indray mazava rehefa ilaina."
"Collector synchronization": "Fampifanarahana ny mpanangona"
"The completed installer reports pending collector synchronization.": "Mitatitra fampifanarahana mpanangona mbola miandry ny mpametraka vita."
"The completed installer reports no pending collectors.": "Tsy mitatitra mpanangona mbola miandry ny mpametraka vita."
"Collector completion remains unconfirmed by this partial receipt.": "Mbola tsy voamarina amin'ity fanamarinana fahavitana ampahany ity ny fahavitan'ny mpanangona."
"Collector completion is not established by this installation outcome.": "Tsy voaporofon'ity vokatry ny fametrahana ity ny fahavitan'ny mpanangona."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Jereo ny satan'ny mpanangona ary andramo indray ireo asa famaranana ho an'ny vokatra ampahany. Tsy manamarina ny fahavaozan'ny fanangonana manaraka izany."
"Scheduled collection": "Fanangonana voalahatra"
"No poller or device was contacted by this assessment.": "Tsy nisy mpaka angona na fitaovana nifandraisana tamin'ity fanombanana ity."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Hamarino fa mampandeha ny mpaka angona amin'ny alalan'ny kaontim-panompoana nokendrena ny mpandahatra asa voafaritra ary jereo ny tsingerina ara-dalàna manaraka."
"Graph data": "Angon'ny grafika"
"Live samples and RRD updates were not exercised.": "Tsy nosedraina ny santionany mivantana sy ny fanavaozana RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Aorian'ny tsingerina fanangonana ara-dalàna iray, hamarino fa mahazo santionany vaovao ireo grafika andrasana ary jereo ireo hadisoan'ny mpaka angona."
"Recovery readiness": "Fahavononana amin'ny famerenana"
"Backup restoration was not exercised.": "Tsy nosedraina ny famerenana ny kopia fiarovana."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Hamarino aloha ny famerenana mitokana ny angon-drakitra, ny rakitra RRD, ny fikirakirana ary ny singa fanalahidy alohan'ny hianteherana amin'ny famerenana."
"No persisted local poller start has been recorded.": "Tsy mbola nisy fanombohan'ny mpaka angona eo an-toerana voatahiry."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Tsy manankery ny fandaharam-potoan'ny mpaka angona voatahiry ary tsy afaka manamarina ny fahasalaman'ny mpandahatra asa."
"The recorded poller start is in the future. Check clock synchronization.": "Amin'ny hoavy ny fanombohan'ny mpaka angona voarakitra. Jereo ny fampifanarahana ny famantaranandro."
"The recorded poller start is older than the native scheduling tolerance.": "Tranainy noho ny fetran'ny fandaharam-potoana raikitra ny fanombohan'ny mpaka angona voarakitra."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Nisy fanombohan'ny mpaka angona eo an-toerana voarakitra tao anatin'ny fetran'ny fandaharam-potoana raikitra. Tsy voamarina ny fahavitany sy ny fahasalaman'ny fitaovana."
"readable": "azo vakiana"
"missing or unreadable": "tsy hita na tsy azo vakiana"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Avereno ny dika navoaka feno sy ireo singa miankina voahidy; omeo alalana hamaky ny kaontim-panompoana."
"PHP temporary directory": "Lahatahiry vonjimaika PHP"
"directory writable by this process": "lahatahiry azon'ity raharaha ity soratana"
"missing or not writable": "tsy hita na tsy azo soratana"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Amboary ny sys_temp_dir ho lahatahiry efa misy azon'ny kaonty fametrahana soratana. Mampiasa rakitra vonjimaika ny fampidirana voajanahary."
"Background worker launch": "Fandefasana ny mpanatanteraka ambadika"
"required PHP functions available; launch not exercised": "misy ireo fiasa PHP ilaina; tsy nosedraina ny fandefasana"
"required PHP launch function disabled": "tapaka ny fiasa PHP ilaina amin'ny fandefasana"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Alefaso ny exec ho an'ny tontolo fampandehanana PHP an'ny tranonkala, na ampiasao ny mpametraka CLI nahazo alalana."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Alefaso ny popen, pclose ho an'ny tontolo fampandehanana PHP an'ny tranonkala, na ampiasao ny mpametraka CLI nahazo alalana."
"Database transaction ownership": "Fananana ny fifanakalozan'ny angon-drakitra"
"autocommit enabled; no caller-owned transaction": "mandeha ny autocommit; tsy misy fifanakalozana fehezin'ny mpiantso"
"autocommit disabled or caller transaction active": "tapaka ny autocommit na mbola mandeha ny fifanakalozan'ny mpiantso"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Tanteraho ivelan'ny fifanakalozana fehezin'ny mpiantso ny fametrahana ary alefaso ny autocommit eo amin'ny fifandraisana fanovany."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Avereno ny lahatahiry misy ny dika navoaka ary omeo alalana hanoratra ny kaonty fametrahana mba hampidirana loharanon-dasitra. Aza atao azo soratan'ny rehetra izany."
"Worker file: install/background.php": "Rakitra mpanatanteraka: install/background.php"
"Worker file: bin/legacy-installer.php": "Rakitra mpanatanteraka: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Rakitra mpanatanteraka: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Toerana fampidirana: resource/snmp_queries"
"Import destination: resource/script_server": "Toerana fampidirana: resource/script_server"
"Import destination: resource/script_queries": "Toerana fampidirana: resource/script_queries"
"Import destination: scripts": "Toerana fampidirana: scripts"
"Database privileges": "Fahazoan-dalana amin'ny angon-drakitra"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Tsy mbola voamarina ireo fahazoan-dalana tena izy amin'ny fifindrana, anisan'izany ireo anjara asa mavitrika sy ireo fahazoan-dalana manokana ho an'ny singa."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Asaivo manamarina ny fanoratana tabilao, ny fanovana rafitra, ny mpandrisika ary ny fomba fiasa ilaina ho an'ny kaonty fametrahana sy ny rafitra ny mpitantana ny angon-drakitra. Aza manome fahazoan-dalana mpitantana ankapobeny."
"Compare web and worker runtimes": "Ampitahao ny tontolo fampandehanana ny tranonkala sy ny mpanatanteraka"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Manomboka fitsapana fohy mamaky ihany amin'ny PHP mazava tsara izany. Tsy mamandrika mpametraka, tsy manoratra rakitra ary tsy mifandray amin'ny fitaovana izany."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Mandova ity raharahan-tranonkala ity ilay fitsapana ary mampiasa ny mpandika PHP an'ny mpametraka voafaritra. Tsy mijery mpandahatra asa na serivisy mitokana izany."
"I authorize the read-only worker runtime comparison.": "Manome alalana ny fampitahana mamaky ihany ny tontolo fampandehanana ny mpanatanteraka aho."
"Compare runtimes": "Ampitahao ireo tontolo fampandehanana"
"Runtime comparison results": "Vokatry ny fampitahana ny tontolo fampandehanana"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Mety ho niniana natao ny fahasamihafan'ny fahazoan-dalana sy ny mari-panondroana. Tsy manaporofo ny fandinihana mamaky ihany fa hahomby ny fanoratana na ny fametrahana."
"Confirm the read-only worker runtime comparison.": "Hamarino ny fampitahana mamaky ihany ny tontolo fampandehanana ny mpanatanteraka."
"The runtime comparison is unavailable.": "Tsy misy ny fampitahana ny tontolo fampandehanana."
"Shared application secret": "Tsiambaratelo iraisan'ny fampiharana"
"A strong web application secret is required before comparison.": "Ilaina ny tsiambaratelo matanjaka ho an'ny fampiharana an-tranonkala alohan'ny fampitahana."
"Runtime comparison": "Fampitahana ny tontolo fampandehanana"
"The configured worker runtime did not confirm a bounded comparison.": "Tsy nanamafy fampitahana voafetra ny tontolo fampandehanana ny mpanatanteraka namboarina."
"The inherited worker secret could not be confirmed against the web secret.": "Tsy voamarina tamin'ny tsiambaratelon'ny tranonkala ny tsiambaratelon'ny mpanatanteraka nolovaina."
"PHP runtime comparison": "Fampitahana ny tontolo fampandehanana PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Tsy maintsy manohana PHP 8.4 ny tontolo fampandehanana roa; mila jerena ny kinova fanamboarana samy hafa."
"Required extension comparison": "Fampitahana ny fanitarana ilaina"
"Required extension availability is checked; differing versions require review.": "Voazaha ny fisian'ny fanitarana ilaina; mila jerena ny kinova samy hafa."
"Process identity comparison": "Fampitahana ny famantarana ny dingana"
"Effective process identity is unavailable on this platform.": "Tsy hita amin'ity sehatra ity ny famantarana ny dingana tena ampiasaina."
"Effective process identities match.": "Mitovy ny famantarana ny dingana tena ampiasaina."
