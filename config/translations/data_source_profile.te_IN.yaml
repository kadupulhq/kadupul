"The default Data Source Profile cannot be deleted.": "డిఫాల్ట్ డేటా మూల ప్రొఫైల్‌ను తొలగించలేము."
"The default profile and profiles in use by Data Templates or Data Sources cannot be deleted.": "డిఫాల్ట్ ప్రొఫైల్ మరియు డేటా టెంప్లేట్లు లేదా డేటా మూలాల ద్వారా ఉపయోగంలో ఉన్న ప్రొఫైళ్లను తొలగించలేము."
"The frequency that data will be collected from the Data Source.": "డేటా మూలం నుండి డేటా సేకరించబడే ఫ్రీక్వెన్సీ."
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "RRA స్పెసిఫికేషన్‌లో ఒక అడ్డు వరుసను పూరించడానికి ముందు అవసరమైన నమూనాల సంఖ్య. మొదటి RRA ఎల్లప్పుడూ 1 విలువను కలిగి ఉండాలి."
"The polling interval, X-Files Factor, Consolidation Functions and RRAs cannot be changed.": "పోలింగ్ విరామం, X-Files ఫ్యాక్టర్, కన్సాలిడేషన్ ఫంక్షన్లు మరియు RRAలను మార్చలేము."
"This legacy Data Source Profile form has expired. Open Data Source Profiles and submit a new form.": "ఈ పాత డేటా మూల ప్రొఫైల్ ఫారమ్ గడువు ముగిసింది. డేటా మూల ప్రొఫైళ్లను తెరిచి కొత్త ఫారమ్‌ను సమర్పించండి."
"Title Format": "శీర్షిక ఫార్మాట్"
"To change the default, mark another profile as the default.": "డిఫాల్ట్‌ను మార్చడానికి, మరొక ప్రొఫైల్‌ను డిఫాల్ట్‌గా గుర్తించండి."
"Unable to load Data Source Profiles. Reload before retrying.": "డేటా మూల ప్రొఫైళ్లను లోడ్ చేయలేకపోయింది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
