"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "لائحة مفصولة بمسافات لمخدمات DNS البديلة المستعملة في تحليل أسماء DNS. إذا تُركت فارغة، فسيُستعمل نظام تشغيل المستطلع لتحليل أسماء DNS."
"Access denied.": "الولوج مرفوض."
"Add Discovery Network": "إضافة شبكة اكتشاف"
"After an initial failure, the number of ping retries to attempt before failing.": "عدد محاولات إعادة اختبار ping بعد الفشل الأولي قبل اعتبار الفشل نهائياً."
"After the selected Run Limit, the discovery process will be terminated.": "بعد تجاوز حد التشغيل المحدد، سيتم إيقاف عملية الاكتشاف."
"Allow same sysName on different hosts": "السماح بنفس قيمة sysName على مضيفين مختلفين"
"Alternate DNS Servers": "مخدمات DNS البديلة"
"April": "أبريل"
"Associated Site": "الموقع المرتبط"
"August": "غشت"
"Automatically Add Devices": "إضافة الأجهزة تلقائياً"
"Back to Networks": "العودة إلى الشبكات"
"Choose an existing Data Collector.": "اختر مجمّع معطيات موجوداً."
"Choose an existing SNMP Option Set.": "اختر مجموعة خيارات SNMP موجودة."
"Choose an existing Site.": "اختر موقعاً موجوداً."
"Choose one of the listed values.": "اختر إحدى القيم المدرجة في اللائحة."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "اختر مجمّع المعطيات/المستطلع المستعمل لجمع المعطيات من هذا الجهاز."
"Choose the Site that you wish to associate discovered Devices with.": "اختر الموقع الذي ترغب في ربط الأجهزة المكتشفة به."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "تعتمد الجدولة اليومية والأسبوعية على وقت البدء وخيار «إعادة التشغيل كل»؛ وتعتمد الأسبوعية أيضاً على أيام الأسبوع. بينما تعتمد الشهرية على الأشهر وأيام الشهر؛ وتعتمد الجدولة «شهرياً في يوم محدد» على الأشهر وأسابيع الشهر وأيام الأسبوع."
"Daily": "يومي"
"Data Collector": "جامع المعطيات"
"Day(s) of Week": "يوم (أيام) الأسبوع"
"Days of Month": "أيام الشهر"
"Days of Week": "أيام الأسبوع"
"December": "دجنبر"
"Define the collection frequency.": "حدّد وتيرة جمع المعطيات."
"Define the number of threads to use for discovering this Network Range.": "حدّد عدد خيوط المعالجة المستعملة لاكتشاف نطاق الشبكة هذا."
