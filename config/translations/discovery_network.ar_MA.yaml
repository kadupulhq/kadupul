"Enter DNS servers as IP addresses or host names separated by spaces.": "أدخل مخدمات DNS على شكل عناوين IP أو أسماء مضيفين مفصولة بمسافات."
"Enter IPs or FQDNs of DNS Servers": "أدخل عناوين IP أو أسماء FQDN لمخدمات DNS"
"Enter a name.": "أدخل اسماً."
"Enter a valid email address.": "أدخل عنوان بريد إلكتروني صحيحاً."
"Enter a whole number from %min% to %max%.": "أدخل عدداً صحيحاً بين %min% و%max%."
"Enter at most %count% bytes.": "أدخل %count% بايت كحد أقصى."
"Enter single-line text.": "أدخل نصاً من سطر واحد."
"Enter the start as YYYY-MM-DD HH:MM.": "أدخل تاريخ ووقت البدء وفق الصيغة YYYY-MM-DD HH:MM."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "أدخل نطاقات شبكات صالحة مفصولة بفواصل. يمكنك استعمال عنوان IP، أو نطاق شبكة مثل 192.168.1.0/24 أو 192.168.1.0/255.255.255.0، أو صيغة البدل مثل 192.168.*.*"
"Enter valid network ranges separated by commas.": "أدخل نطاقات شبكات صالحة مفصولة بفواصل."
"February": "فبراير"
"First": "الأول"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "أضف كأجهزة كل الأجهزة المكتشفة حديثاً التي يمكن الولوج إليها عبر SNMP وتطابق قاعدة جهاز."
"Friday": "الجمعة"
"General Settings": "الإعدادات العامة"
