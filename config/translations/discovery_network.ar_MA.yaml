"If a device previously added is found, rerun its data queries.": "إذا تم العثور على جهاز مضاف مسبقاً، فأعد تشغيل استعلامات المعطيات الخاصة به."
"If checked, when the Automation Network is scanned, a report will be sent to the Notification Email account.": "عند تحديد هذا الخيار، سيتم إرسال تقرير إلى حساب البريد الإلكتروني الخاص بالإشعارات عند فحص شبكة الأتمتة."
