"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "اسم حساب البريد الإلكتروني المستعمل كاسم مُرسل لبريد الإشعارات. إذا تُرك فارغاً، فسيُستعمل الاسم الافتراضي لإشعارات الأتمتة."
"The Email account to be used to send the Notification Email to.": "حساب البريد الإلكتروني المستعمل لإرسال بريد الإشعارات إليه."
"The discovery network changed since you opened this form. Reload before saving.": "تغيّرت شبكة الاكتشاف منذ فتح هذه الاستمارة. أعد التحميل قبل الحفظ."
