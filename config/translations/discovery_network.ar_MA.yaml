"The ranges cover more than %count% addresses.": "تغطي النطاقات أكثر من %count% عنوان."
"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "قيمة المهلة المستخدمة لفحص ping عبر ICMP و UDP للمضيف. وتنطبق قيمة مهلة SNMP الخاصة بالمضيف على فحوصات ping عبر SNMP."
