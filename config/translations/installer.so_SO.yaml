"Action": "Ficil"
"Advanced options": "Ikhtiyaarrada horumarsan"
"Applying database upgrades": "Dabaqidda cusboonaysiinta kaydka xogta"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Nuqul kayd ah ka samee kaydka xogta, faylasha RRD, qaabaynta iyo furayaasha. Cusboonaysiinta kaydka xogta waxay hirgelin kartaa isbeddello uusan dib-u-celinta barnaamijku ka noqon karin."
"Blocked": "Xiran"
"Check": "Baaritaan"
"Check again": "Hubi mar kale"
"Check collection freshness and collector connectivity before enabling discovery.": "Hubi cusboonaanta ururinta iyo xiriirka ururiyaha ka hor intaadan hawlgelin sahaminta."
"Check requirements": "Hubi shuruudaha"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Hubinnadu waxay baaraan hawshan iyo oggolaanshaha nidaamka faylasha. Ma qoraan faylal tijaabo ah mana la xiriiraan qalabka."
"Collection profile": "Astaanta ururinta"
"Collector": "Ururiye"
"Configure": "Qaabee"
"Configuring collection profiles": "Qaabaynta astaamaha ururinta"
"Configuring discovery": "Qaabaynta sahaminta"
"Configuring the local device": "Qaabaynta qalabka maxalliga ah"
"Confirming database version": "Xaqiijinta nooca kaydka xogta"
"Converting selected tables": "U beddelidda jadwallada la doortay"
"Database version": "Nooca keydka xogta"
"Disabled": "Hawlgab"
"Discovery": "Sahamin"
"Discovery SNMP settings": "Dejinta SNMP ee sahaminta"
"Discovery range": "Baaxadda sahaminta"
"Enable discovery after installation": "Hawlgeli sahaminta rakibaadda kaddib"
"Executable paths": "Waddooyinka faylasha fulinta"
"Execution status": "Xaaladda fulinta"
"Finished execution": "Fulinta waa la dhammaystiray"
"Finishing tasks only. Schema migrations will not be replayed.": "Hawlaha dhammaystirka oo keliya. Guuritaannada qaab-dhismeedka dib looma celin doono."
"I accept the license terms": "Waan aqbalay shuruudaha shatiga"
"I authorize discovery of the displayed range": "Waxaan oggolaaday sahaminta baaxadda la soo bandhigay"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Waxaan hubiyay diiwaanka waxaana xaqiijiyay in shaqeeyihii hore iyo habraacyadiisa hoose ay joogsadeen"
"I checked the previous attempt and accept that some changes may already be committed": "Waxaan hubiyay isku daygii hore waxaana aqbalay in isbeddellada qaarkood ay horeba u hirgaleen"
"I reviewed this plan and have the required backups": "Waxaan dib u eegay qorshahan waxaana haystaa nuqullada kaydka ee loo baahan yahay"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Haddii shaqeeye si lama filaan ah u joogsado, xafid log/cacti.log oo xaqiiji in habraaciisu dhammaaday ka hor intaadan si cad isugu dayin mar kale. Xaaladda sugitaanku ma xaqiijinayso bilaabid guul leh."
"Importing templates": "Soo dejinta qaababka"
"Install Kadupul": "Rakib Kadupul"
"Installation and upgrade": "Rakibaadda iyo cusboonaysiinta"
"Installation request was rejected.": "Codsiga rakibaadda waa la diiday."
"Installation steps": "Tallaabooyinka rakibaadda"
"Installed": "La rakibay"
"Keep a backup of the database, RRD files, configuration and secret material.": "Kaydi nuqul ka mid ah keydka xogta, faylasha RRD, dejinta iyo xogta sirta ah."
"Language": "Luqadda"
"Large tables may require the dedicated CLI conversion tool before installation.": "Jadwallada waaweyni waxay u baahan karaan qalabka gaarka ah ee beddelidda CLI ka hor rakibaadda."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Bannaan ku dhaaf meelaha sirta ah si loo haysto aqoonsiyada kaydsan. Siraha dib looma soo bandhigo."
"License": "Shatiga"
"No action needed": "Wax tallaabo ah looma baahna"
"Observed": "La arkay"
"Open the console": "Fur koonsolka"
"Operation": "Hawlgal"
"Override discovery SNMP settings": "Beddel dejinta SNMP ee sahaminta"
"Pass": "Gudbay"
"Poller interval in seconds": "Muddada ururiyaha oo ilbiriqsiyo ah"
"Preparing CSRF protection": "Diyaarinta ilaalinta CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Horumarku wuxuu muujinayaa wejigii ugu dambeeyay ee la diiwaangeliyay. Cusboonaysiinta boggan marnaba ma bilowdo mana celiso shaqeeye."
"Recover stopped attempt": "Soo celi isku daygii joogsaday"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Soo celintu waxay haysataa xulashooyinka kaydsan marnabana ma joojiso shaqeeye shaqaynaya. Dib u eeg qorshaha mar kale ka hor intaadan isku dayin."
"Review": "Dib u eegis"
"Review installation plan": "Dib u eeg qorshaha rakibaadda"
"Run": "Fuli"
"Run reviewed plan": "Fuli qorshaha dib loo eegay"
"Save and review": "Kaydi oo dib u eeg"
"Scope": "Baaxadda"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Xaaladda lama heli karo. Shaqada la kaydiyay waa la haystaa. Bogga cusboonaysii si aad dib ugu xidho; ha soo gudbin rakibaad kale."
"Synchronizing collectors": "Is-waafajinta ururiyeyaasha"
"Table conversions": "Beddelidda jadwallada"
"Templates": "Qaab-dhismeedyada"
"The database version matches this application. Installation does not establish that polling is healthy.": "Nooca keydka xogtu wuxuu la mid yahay codsigan. Rakibaaddu ma xaqiijinayso in ururintu caafimaad qabto."
"The request outcome is unknown. Check execution status before retrying.": "Natiijada codsiga lama yaqaan. Hubi xaaladda fulinta ka hor intaadan mar kale isku dayin."
"Theme": "Mawduuca"
"Verify": "Xaqiiji"
"Verify the poller schedule and service account.": "Xaqiiji jadwalka ururiyaha iyo koontada adeegga."
"Version change": "Isbeddelka nooca"
"Waiting for the installation worker": "Sugitaanka shaqeeyaha rakibaadda"
"collector": "ururiye"
"complete": "dhammaystiran"
"failed": "guuldarraystay"
"finish": "dhammaystir"
"install": "rakibaad"
"not_started": "aan bilaabmin"
"partial": "qayb ahaan"
"running": "shaqaynaya"
"succeeded": "guulaystay"
"upgrade": "cusboonaysiin"
"waiting": "sugaya"
"Accept the license before saving the installation plan.": "Aqbal shatiga ka hor intaadan kaydin qorshaha rakibaadda."
"Invalid installation form.": "Foomka rakibaaddu ma saxna."
"Access denied.": "Gelitaanka waa la diiday."
"Confirm the recovery warning before retrying.": "Xaqiiji digniinta soo celinta ka hor intaadan mar kale isku dayin."
"Review and confirm the current installation plan.": "Dib u eeg oo xaqiiji qorshaha rakibaadda ee hadda jira."
"Confirm the discovery scope before starting.": "Xaqiiji baaxadda sahaminta ka hor intaadan bilaabin."
"Resolve the blocking checks before starting.": "Xalli hubinnada xannibaadda leh ka hor intaadan bilaabin."
"Too many installer options.": "Ikhtiyaarrada rakibaha aad bay u badan yihiin."
"Invalid installer option name.": "Magaca ikhtiyaarka rakibuhu ma saxna."
"Unknown or malformed installer option.": "Ikhtiyaar rakibe oo aan la aqoon ama qaabkiisu khaldan yahay."
"Installer options must be scalar values.": "Ikhtiyaarrada rakibuhu waa inay ahaadaan qiimeyaal keli ah."
"Installer option is too long or contains a null byte.": "Ikhtiyaarka rakibuhu aad buu u dheer yahay ama wuxuu ka kooban yahay bayt eber ah."
"Installer IDs and intervals must be whole numbers.": "Aqoonsiyada (ID) rakibaha iyo muddooyinku waa inay ahaadaan tirooyin dhan."
"Installer ID or interval is outside its supported range.": "Aqoonsiga (ID) rakibaha ama muddadu wuxuu ka baxsan yahay xadka la taageero."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Rakibaaddu ma sii socon karin. Dib u soo rar xaaladdeeda oo dib u eeg hubinnada xannibaadda leh ka hor intaadan mar kale isku dayin."
"Confirm that the previous worker has stopped before recovering its plan.": "Xaqiiji in shaqeeyihii hore uu joogsaday ka hor intaadan soo celin qorshihiisa."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Keydka xogta waa la rakibay, laakiin ururiyeyaasha qaarkood waxay weli u baahan yihiin is-waafajin. Mar kale isku day hawlaha dhammaystirka kaddib marka aad hubiso xaaladdooda."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Rakibaaddu way joogsatay. Xafid diiwaanka rakibaha, sax sababta oo si cad u xaqiiji isku dayga cusub. Isbeddellada qaarkood ee keydka xogta waxaa laga yaabaa inay horeba u hirgaleen. Hubi nadiifinta kordhisyada ka hor intaadan oggolaan isku day cusub."
"Next action": "Tallaabada xigta"
"Follow the execution status. Do not start another attempt while a worker is active.": "Raac xaaladda fulinta. Ha bilaabin isku day kale inta shaqeeye uu firfircoon yahay."
"Complete the recovery checklist before retrying.": "Dhammaystir liiska hubinta soo celinta ka hor intaadan mar kale isku dayin."
"Verify collection and graph operation before enabling discovery.": "Xaqiiji shaqada ururinta iyo garaafyada ka hor intaadan hawlgelin sahaminta."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Xalli shuruudaha xanniban, kaddibna mar kale hubi. Xulashooyinka la kaydiyay waa la haystaa."
"Review the planned changes and backup checklist before authorizing execution.": "Dib u eeg isbeddellada la qorsheeyay iyo liiska hubinta kaydka ka hor intaadan oggolaan fulinta."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Dooro astaan ururin oo aqbal shatiga. Dejinnada ikhtiyaariga ah waa la furi karaa marka loo baahdo."
"Download installation diagnostics": "Soo deji baadhitaanka ciladaha rakibaadda"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Fur garaaf oo xaqiiji in xogtiisa RRD ay cusboonaato kaddib wareeg ururiye."
"Requirement details": "Faahfaahinta shuruudda"
"Recover": "Soo celi"
"Recovery checklist": "Liiska hubinta soo celinta"
"Preserve log/cacti.log and record the failed attempt.": "Xafid log/cacti.log oo diiwaangeli isku daygii guuldarraystay."
"Confirm that the previous worker and its child processes have stopped.": "Xaqiiji in shaqeeyihii hore iyo habraacyadiisa hoose ay joogsadeen."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Baar isbeddellada la meel-mariyay, waafajinta ururiyaha iyo nadiifinta kordhiyeyaasha. Sax sababta ka hor intaadan dib isugu dayin."
"Review the saved plan again, then explicitly authorize a retry.": "Dib u eeg qorshaha keydsan mar kale, dabadeed si cad u oggolow isku-day cusub."
"Recover a stopped worker": "Soo celi hawlwadeen joogsaday"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Isticmaal soo-celinta oo keliya marka aad xaqiijiso in isku-daygan uusan hadda socon. Soo-celintu ma joojiso geeddi-socodka."
"Collector and installation mode": "Habka ururiyaha iyo rakibidda"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Qaabeynta hawlgelinta ayaa go'aamisa doorka ururiyaha iyo xiriirrada keydka xogta. Xaqiiji qaabeynta adeegaha aasaasiga ah ka hor intaadan bilaabin ururiye."
"Discovery and SNMP settings": "Dejinta baarista iyo SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Ku hay baarista mid damisan ilaa ururinta iyo xiriirka ururiyaha la xaqiijiyo."
"Template selection": "Xulashada tusmooyinka"
"Templates selected for import": "Tusmooyinka loo xulay soo-dejinta"
"No templates selected.": "Ma jiraan tusmooyin la xulay."
"Backup checklist": "Liiska hubinta nuqul-keydka"
"Database backup and a tested restoration procedure.": "Nuqul-keydka keydka xogta iyo hab soo-celin oo la tijaabiyay."
"RRD files and the service account permissions needed to restore them.": "Faylasha RRD iyo rukhsadaha koontada adeegga ee loo baahan yahay si loo soo celiyo."
"Configuration, keys and plugin data outside the database.": "Qaabeynta, furayaasha iyo xogta kordhiyeyaasha ee ka baxsan keydka xogta."
"Post-installation checks": "Hubinta rakibidda kaddib"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Hubinnada la xaqiijiyay waxay daboolaan oo keliya caddaynta muuqata. Hubinnada aan la qiimeyn waxay weli u baahan yihiin xaqiijinta hawlwadeenka."
"Operational checks still require operator verification.": "Hubinnada hawlqabadka waxay weli u baahan yihiin xaqiijinta hawlwadeenka."
"Status": "Xaaladda"
"verified": "La xaqiijiyay"
"action_required": "Tallaabo ayaa loo baahan yahay"
"not_assessed": "Aan la qiimeyn"
"Database schema": "Qaab-dhismeedka keydka xogta"
"Stored schema matches the application target.": "Qaab-dhismeedka keydsan wuxuu la mid yahay bartilmaameedka barnaamijka."
"Target schema completion has not been confirmed.": "Dhammeystirka qaab-dhismeedka bartilmaameedka lama xaqiijin."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Dib u eeg natiijada rakibidda oo xalli fashillada ka hor intaadan u qaadan in casriyeynta qaab-dhismeedku dhammaatay."
"Installation outcome": "Natiijada rakibidda"
"A successful receipt matches the current target schema.": "Rasiid guuleystay wuxuu la mid yahay qaab-dhismeedka bartilmaameedka ee hadda."
"A complete successful installation outcome has not been confirmed.": "Natiijo rakibid oo si buuxda u guuleysatay lama xaqiijin."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Keydi diiwaanka rakibaha oo isticmaal habka soo-celinta ama isku-dayga cad marka loo baahdo."
"Collector synchronization": "Waafajinta ururiyaha"
"The completed installer reports pending collector synchronization.": "Rakibaha dhammaaday wuxuu soo sheegayaa waafajinta ururiyaha oo sugaysa."
"The completed installer reports no pending collectors.": "Rakibaha dhammaaday ma soo sheegayo wax ururiyeyaal ah oo sugaya."
"Collector completion remains unconfirmed by this partial receipt.": "Dhammeystirka ururiyaha weli laguma xaqiijin rasiidkan qaybsan."
"Collector completion is not established by this installation outcome.": "Dhammeystirka ururiyaha kuma sugna natiijadan rakibidda."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Dib u eeg xaaladda ururiyaha oo dib isugu day hawlaha dhammeystirka ee natiijooyinka qaybsan. Tani ma xaqiijinayso cusboonaanta ururinta dambe."
"Scheduled collection": "Ururinta jadwalsan"
"No poller or device was contacted by this assessment.": "Qiimeyntani lama xiriirin wax xog-qaade ama qalab ah."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Xaqiiji in jadwal-dejiyaha la qaabeeyay uu ku socodsiiyo xog-qaadaha koontada adeegga ee loogu talagalay, kana dib u eeg wareeggiisa caadiga ah ee xiga."
"Graph data": "Xogta jaantuska"
"Live samples and RRD updates were not exercised.": "Muunadaha tooska ah iyo cusbooneysiinta RRD lama tijaabin."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Wareeg ururin oo caadi ah kaddib, xaqiiji in jaantusyada la filayo ay helaan muunado cusub oo dib u eeg khaladaadka xog-qaadaha."
"Recovery readiness": "Diyaargarowga soo-celinta"
"Backup restoration was not exercised.": "Soo-celinta nuqul-keydka lama tijaabin."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Xaqiiji soo-celin gooni ah oo keydka xogta, faylasha RRD, qaabeynta iyo agabka furaha ah ka hor intaadan ku tiirsanaan soo-celinta."
"No persisted local poller start has been recorded.": "Ma jiro bilow xog-qaade gudaha ah oo keydsan oo la diiwaangeliyay."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Waqtiga xog-qaadaha ee keydsan waa mid aan sax ahayn mana xaqiijin karo caafimaadka jadwal-dejiyaha."
"The recorded poller start is in the future. Check clock synchronization.": "Bilowga xog-qaadaha ee diiwaangashan wuxuu ku jiraa mustaqbalka. Hubi waafajinta saacadda."
"The recorded poller start is older than the native scheduling tolerance.": "Bilowga xog-qaadaha ee diiwaangashan wuxuu ka da' weyn yahay dulqaadka jadwalka asalka ah."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Bilow xog-qaade gudaha ah ayaa la diiwaangeliyay gudaha dulqaadka jadwalka asalka ah. Dhammeystirka iyo caafimaadka qalabka lama xaqiijin."
"readable": "la akhrin karo"
"missing or unreadable": "maqan ama aan la akhrin karin"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Soo celi siideynta dhammeystiran iyo ku-tiirsanaanteeda xiran; sii koontada adeegga rukhsadda akhriska."
"PHP temporary directory": "Galka ku-meel-gaarka ah ee PHP"
"directory writable by this process": "gal uu geeddi-socodkani wax ku qori karo"
"missing or not writable": "maqan ama aan wax lagu qori karin"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "U qaabee sys_temp_dir sidii gal jira oo koontada rakibidda ay wax ku qori karto. Soo-dejinta asalka ahi waxay isticmaashaa faylal ku-meel-gaar ah."
"Background worker launch": "Bilowga hawlwadeenka gadaal ka shaqeeya"
"required PHP functions available; launch not exercised": "hawlaha PHP ee loo baahan yahay waa diyaar; bilowga lama tijaabin"
"required PHP launch function disabled": "hawsha bilowga ee PHP ee loo baahan yahay waa la damiyay"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Daar exec waqtiga-socodka PHP ee shabakadda, ama isticmaal rakibaha CLI ee la oggolaaday."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Daar popen, pclose waqtiga-socodka PHP ee shabakadda, ama isticmaal rakibaha CLI ee la oggolaaday."
"Database transaction ownership": "Lahaanshaha macaamilka keydka xogta"
"autocommit enabled; no caller-owned transaction": "autocommit waa daaran yahay; ma jiro macaamil uu leeyahay wacuhu"
"autocommit disabled or caller transaction active": "autocommit waa damisan yahay ama macaamilka wacaha ayaa firfircoon"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Ku socodsii rakibidda meel ka baxsan macaamilka uu leeyahay wacuhu oo daar autocommit xiriirkiisa isbeddelka."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Soo celi galka siideynta oo sii koontada rakibidda rukhsadda qorista ee soo-dejinta agabka tusmooyinka. Ha ka dhigin mid qof walba wax ku qori karo."
"Worker file: install/background.php": "Faylka hawlwadeenka: install/background.php"
"Worker file: bin/legacy-installer.php": "Faylka hawlwadeenka: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Faylka hawlwadeenka: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Halka loo soo dejinayo: resource/snmp_queries"
"Import destination: resource/script_server": "Halka loo soo dejinayo: resource/script_server"
"Import destination: resource/script_queries": "Halka loo soo dejinayo: resource/script_queries"
"Import destination: scripts": "Halka loo soo dejinayo: scripts"
"Database privileges": "Xuquuqaha keydka xogta"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Xuquuqaha guuritaanka ee wax-ku-oolka ah, oo ay ku jiraan doorarka firfircoon iyo oggolaanshooyinka u gaarka ah shayga, lama xaqiijin."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Maamulaha keydka xogta ha xaqiijiyo qorista jadwallada, isbeddellada qaab-dhismeedka, kiciyeyaasha iyo hawlaha joogtada ah ee loo baahan yahay koontada rakibidda iyo qaab-dhismeedka. Ha siin xuquuqaha maamulaha guud."
"Compare web and worker runtimes": "Isbarbardhig waqtiyada-socodka shabakadda iyo hawlwadeenka"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tani waxay si cad u bilaabaysaa baaritaan gaaban oo PHP ah oo akhris-keliya ah. Ma xirto rakibe, ma qorto faylal, lamana xiriirto qalab."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Baaritaanku wuxuu dhaxlaa geeddi-socodkan shabakadda wuxuuna adeegsadaa turjubaanka PHP ee rakibaha la qaabeeyay. Ma baaro jadwal-dejiye ama adeeg gaar ah."
"I authorize the read-only worker runtime comparison.": "Waxaan oggolaanayaa isbarbardhigga waqtiga-socodka hawlwadeenka ee akhris-keliya ah."
"Compare runtimes": "Isbarbardhig waqtiyada-socodka"
"Runtime comparison results": "Natiijooyinka isbarbardhigga waqtiga-socodka"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Farqiyada rukhsadda iyo aqoonsiga waxaa laga yaabaa inay yihiin kuwo ula kac ah. Indha-indheynta akhris-keliya ahi ma caddeynayso in qorista ama rakibiddu guuleysan doonto."
"Confirm the read-only worker runtime comparison.": "Xaqiiji isbarbardhigga waqtiga-socodka hawlwadeenka ee akhris-keliya ah."
"The runtime comparison is unavailable.": "Isbarbardhigga waqtiga-socodka lama heli karo."
"Shared application secret": "Sirta la wadaago ee barnaamijka"
"A strong web application secret is required before comparison.": "Sir adag oo barnaamijka shabakadda ah ayaa loo baahan yahay ka hor isbarbardhigga."
"Runtime comparison": "Isbarbardhigga waqtiga-socodka"
"The configured worker runtime did not confirm a bounded comparison.": "Waqtiga-socodka hawlwadeenka ee la qaabeeyay ma xaqiijin isbarbardhig xaddidan."
"The inherited worker secret could not be confirmed against the web secret.": "Sirta hawlwadeenka ee la dhaxlay lama xaqiijin karin marka loo eego sirta shabakadda."
"PHP runtime comparison": "Isbarbardhigga deegaanka fulinta PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Labada deegaan fulinba waa inay taageeraan PHP 8.4; noocyada hagaajinta ee kala duwan waxay u baahan yihiin dib-u-eegis."
"Required extension comparison": "Isbarbardhigga kordhinnada loo baahan yahay"
"Required extension availability is checked; differing versions require review.": "Helitaanka kordhinnada loo baahan yahay waa la hubiyaa; noocyada kala duwan waxay u baahan yihiin dib-u-eegis."
"Process identity comparison": "Isbarbardhigga aqoonsiga habsocodka"
"Effective process identity is unavailable on this platform.": "Aqoonsiga habsocodka dhabta ah lagama heli karo madashan."
"Effective process identities match.": "Aqoonsiyada habsocodka dhabta ah way iswaafaqaan."
"Effective process identities differ; separate service accounts may be intentional.": "Aqoonsiyada habsocodka dhabta ah way kala duwan yihiin; koontooyinka adeegga ee kala goonida ah waxay noqon karaan kuwo ula kac ah."
"Directory access comparison": "Isbarbardhigga gelitaanka galalka"
"Read-only directory permission observations match.": "Indho-indheynta oggolaanshaha galalka akhriska-keliya way iswaafaqaan."
"Directory locations or permission observations differ; review the service-account roles.": "Goobaha galalka ama indho-indheynta oggolaanshaha way kala duwan yihiin; dib u eeg doorarka koontada adeegga."
"Worker directory read and traversal": "Akhriska iyo dhex-marka galalka hawlwadeenka"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Galalka hawlwadeenka ee loo baahan yahay waa inay jiraan oo oggolaadaan akhriska iyo dhex-marka. Wax qoraal ah lama tijaabin."
"The inherited worker secret matches the web secret for this private challenge.": "Sirta hawlwadeenka ee la dhaxlay waxay waafaqsan tahay sirta shabakadda ee caqabaddan gaarka ah."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Dib u eeg turjumaanka PHP ee la habeeyay, kordhinnada loo baahan yahay, sirta la dhaxlay iyo oggolaanshaha galalka koontada adeegga. Wax qoraal ah ama bilowga rakibaha lama fulin."
"advisory": "talo-bixin"
