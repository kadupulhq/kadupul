"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Lisitry ny mpizara DNS hafa sarahan'ny elanelana ampiasaina amin'ny famahana DNS. Raha banga, ny OS an'ny mpanangona no hampiasaina hamaha ireo anarana DNS."
