"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Ny fandaharam-potoana isan'andro sy isan-kerinandro dia mampiasa ny fanombohana sy ny Averina isaky ny; ny isan-kerinandro dia mampiasa koa ny Andron'ny herinandro. Ny isam-bolana dia mampiasa ny Volana sy ny Andron'ny volana; ny isam-bolana amin'ny andro voatondro dia mampiasa ny Volana, Herinandron'ny volana ary ny Andron'ny herinandro."
