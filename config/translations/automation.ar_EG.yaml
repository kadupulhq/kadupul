"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "الحد الأقصى لعدد محاولات الوصول إلى جهاز عبر نص القراءة (readstring) الخاص بـ SNMP قبل التوقف."
"The maximum number of milliseconds Kadupul will wait for an SNMP response (does not work with php-snmp support).": "الحد الأقصى لعدد المللي ثانية التي ينتظرها Kadupul للحصول على استجابة SNMP (لا يعمل مع دعم php-snmp)."
"The name can be at most 100 characters.": "يجب ألا يتجاوز الاسم 100 حرف."
