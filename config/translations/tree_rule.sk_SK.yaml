"A useful name for this Rule.": "Užitočný názov tohto pravidla."
"Access denied.": "Prístup zamietnutý."
"Add Tree Rule": "Pridať pravidlo stromu"
"Back to Tree Rules": "Späť na pravidlá stromov"
"Cancel": "Zrušiť"
"Check this box to enable this rule.": "Zaškrtnutím tohto políčka toto pravidlo povolíte."
"Choose a Tree for the new Tree Items.": "Vyberte strom pre nové položky stromu."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Vyberte hlavičku vybraného stromu, do ktorej sa má zaradiť, alebo jeho koreň. Uistite sa, že pri vykonaní tohto pravidla stále existuje."
"Choose a header of the selected Tree.": "Vyberte hlavičku vybraného stromu."
"Choose a listed Graph Grouping Style.": "Vyberte uvedený štýl zoskupovania grafov."
"Choose a listed Leaf Item Type.": "Vyberte uvedený typ položky listu."
"Choose an existing Tree.": "Vyberte existujúci strom."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Vyberte, ako sa grafy zoskupujú pri vykresľovaní pre tohto hostiteľa v strome. Používa sa pre listy zariadení."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Kliknutím na Pokračovať odstránite nasledujúce pravidlá stromov spolu s ich kritériami výberu objektov a vytvárania stromu."
"Click Continue to disable the following Tree Rules.": "Kliknutím na Pokračovať zakážete nasledujúce pravidlá stromov."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Kliknutím na Pokračovať duplikujete nasledujúce pravidlá stromov. Voliteľne môžete zmeniť formát názvu nových pravidiel stromov, ktoré sa začínajú ako zakázané."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Kliknutím na Pokračovať povolíte nasledujúce pravidlá stromov. Uistite sa, že boli úspešne otestované."
"Continue": "Pokračovať"
"Data Query Index": "Index dotazu na dáta"
"Delete Tree Rules": "Odstrániť pravidlá stromov"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledok odstránenia je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel stromov."
"Delete selected": "Odstrániť vybrané"
"Device": "Zariadenie"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Listy zariadení nemôžu používať kritériá na stĺpcoch grafov alebo šablón grafov. Pri zmene typu položky listu na Zariadenie zaškrtnutím tohto políčka tieto kritériá odstránite; nemožno ich obnoviť."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Listy zariadení nemôžu používať kritériá založené na grafoch. Na uloženie potvrďte odstránenie %count% kritérií."
"Disable Tree Rules": "Zakázať pravidlá stromov"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledok zakázania je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel stromov."
"Disable selected": "Zakázať vybrané"
"Duplicate Tree Rules": "Duplikovať pravidlá stromov"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledok duplikovania je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel stromov."
"Duplicate selected": "Duplikovať vybrané"
"Edit Tree Rule": "Upraviť pravidlo stromu"
"Enable Rule": "Povoliť pravidlo"
"Enable Tree Rules": "Povoliť pravidlá stromov"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Výsledok povolenia je neistý. Pred ďalším pokusom skontrolujte zoznam pravidiel stromov."
"Enable selected": "Povoliť vybrané"
"Enter a name.": "Zadajte názov."
"Enter a valid name format.": "Zadajte platný formát názvu."
"Enter at most %count% characters.": "Zadajte najviac %count% znakov."
"Enter single-line text.": "Zadajte jednoriadkový text."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Každé <rule_name> sa nahradí názvom kopírovaného pravidla stromu."
"Graph": "Graf"
"Graph Grouping Style": "Štýl zoskupovania grafov"
"Graph Template": "Šablóna grafu"
"Invalid Tree Rule selection.": "Neplatný výber pravidiel stromov."
"Leaf Item Type": "Typ položky listu"
"Name": "Názov"
"Object Selection and Tree Creation Criteria": "Kritériá výberu objektov a vytvárania stromu"
"One or more selected Tree Rules no longer exist.": "Jedno alebo viac vybraných pravidiel stromov už neexistuje."
"Optional: Sub-Tree Item": "Voliteľné: položka podstromu"
"Remove graph-based criteria": "Odstrániť kritériá založené na grafoch"
"Save": "Uložiť"
"Save outcome is uncertain. Reload before retrying.": "Výsledok uloženia je neistý. Pred ďalším pokusom stránku znova načítajte."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Najprv uložte pravidlo; jeho kritériá výberu objektov a vytvárania stromu sa pridajú potom."
"Select": "Vybrať"
"Select %name%": "Vybrať %name%"
"Select at least one Tree Rule.": "Vyberte aspoň jedno pravidlo stromu."
"Select at most 100 Tree Rules at a time.": "Naraz vyberte najviac 100 pravidiel stromov."
"Select up to %count% rows at a time.": "Naraz vyberte najviac %count% riadkov."
"The Item Type that shall be dynamically added to the tree.": "Typ položky, ktorý sa má dynamicky pridať do stromu."
"The name format must give every copy a name of 1 to 255 characters.": "Formát názvu musí každej kópii dať názov s dĺžkou 1 až 255 znakov."
"The tree rule changed since you opened this form. Reload before saving.": "Pravidlo stromu sa zmenilo od otvorenia tohto formulára. Pred uložením stránku znova načítajte."
"Title Format": "Formát názvu"
"Tree": "Strom"
"Tree Rule Selection [edit: %name%]": "Výber pravidla stromu [úprava: %name%]"
"Tree Rules Selection [new]": "Výber pravidiel stromov [nový]"
"Tree rule not found.": "Pravidlo stromu sa nenašlo."
"Tree rule saved.": "Pravidlo stromu bolo uložené."
"Unable to load Tree Rules. Reload before retrying.": "Pravidlá stromov sa nepodarilo načítať. Pred ďalším pokusom stránku znova načítajte."
"Unable to load the tree rule. Reload before retrying.": "Pravidlo stromu sa nepodarilo načítať. Pred ďalším pokusom stránku znova načítajte."
"Unexpected fields were submitted.": "Boli odoslané neočakávané polia."
