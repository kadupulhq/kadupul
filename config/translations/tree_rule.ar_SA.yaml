"A useful name for this Rule.": "اسم مفيد لهذه القاعدة."
"Access denied.": "تم رفض الوصول."
"Add Tree Rule": "إضافة قاعدة شجرة"
"Back to Tree Rules": "العودة إلى قواعد الشجرة"
"Check this box to enable this rule.": "حدد هذا المربع لتمكين هذه القاعدة."
"Choose a Tree for the new Tree Items.": "اختر شجرة لعناصر شجرة جديدة."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "اختر ترويسة من الشجرة المحددة للربط بها، أو جذرها. تأكد من أنها لا تزال موجودة عند تنفيذ هذه القاعدة."
"Choose a header of the selected Tree.": "اختر ترويسة من الشجرة المحددة."
"Choose a listed Graph Grouping Style.": "اختر نمط تجميع رسوم بيانية مُدرجاً."
"Choose a listed Leaf Item Type.": "اختر نوع عنصر ورقة مُدرجاً."
"Choose an existing Tree.": "اختر شجرة موجودة."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "اختر كيفية تجميع الرسوم البيانية عند رسمها لهذا المضيف تحديداً في الشجرة. يُستخدم لأوراق الأجهزة."
"Data Query Index": "فهرس استعلام البيانات"
"Device": "جهاز"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "لا يمكن لأوراق الأجهزة استخدام معايير على أعمدة الرسوم البيانية أو قوالب الرسوم البيانية. عند تغيير نوع عنصر الورقة إلى «جهاز»، حدّد هذا المربع لإزالة تلك المعايير؛ ولا يمكن استعادتها."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "لا يمكن لأوراق الأجهزة استخدام معايير قائمة على الرسوم البيانية. أكّد إزالة %count% معايير للحفظ."
"Edit Tree Rule": "تحرير قاعدة الشجرة"
"Enable Rule": "تمكين القاعدة"
"Enter a name.": "أدخل اسماً."
"Enter at most %count% characters.": "أدخل %count% حرفاً على الأكثر."
"Enter single-line text.": "أدخل نصاً من سطر واحد."
"Graph": "الرسم البياني"
"Graph Grouping Style": "نمط تجميع الرسم البياني"
"Graph Template": "قالب الرسم البياني"
"Leaf Item Type": "ورقة نوع البند"
"Name": "الاسم"
"Object Selection and Tree Creation Criteria": "معايير اختيار الكائنات وإنشاء الشجرة"
"Optional: Sub-Tree Item": "اختياري: عنصر شجرة فرعية"
"Remove graph-based criteria": "إزالة المعايير القائمة على الرسوم البيانية"
"Save": "حفظ"
"Save outcome is uncertain. Reload before retrying.": "نتيجة الحفظ غير مؤكدة. أعد التحميل قبل إعادة المحاولة."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "احفظ القاعدة أولاً؛ وتُضاف معايير اختيار الكائنات وإنشاء الشجرة الخاصة بها بعد ذلك."
"The Item Type that shall be dynamically added to the tree.": "نوع العنصر الذي يجب إضافته ديناميكيًا إلى الشجرة."
"The tree rule changed since you opened this form. Reload before saving.": "تغيّرت قاعدة الشجرة منذ فتح هذا النموذج. أعد التحميل قبل الحفظ."
"Tree": "شجرة"
"Tree Rule Selection [edit: %name%]": "تحديد قاعدة الشجرة [تحرير: %name%]"
"Tree Rules Selection [new]": "تحديد قواعد الشجرة [جديد]"
"Tree rule not found.": "لم يتم العثور على قاعدة الشجرة."
"Tree rule saved.": "تم حفظ قاعدة الشجرة."
"Unable to load the tree rule. Reload before retrying.": "تعذّر تحميل قاعدة الشجرة. أعد التحميل قبل إعادة المحاولة."
"Unexpected fields were submitted.": "تم إرسال حقول غير متوقعة."
