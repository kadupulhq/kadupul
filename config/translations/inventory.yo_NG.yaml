"Device operation outcome is uncertain. Check every selected device before retrying.": "Àbájáde ìṣiṣẹ́ ẹ̀rọ kò dájú. Ṣàyẹ̀wò gbogbo ẹ̀rọ tí a yàn kí o tó tún gbìyànjú."
"Enable devices": "Mú àwọn ẹ̀rọ ṣiṣẹ́"
"Disable devices": "Pa àwọn ẹ̀rọ lẹ́nu iṣẹ́"
"Enable selected devices": "Mú àwọn ẹ̀rọ tí a yàn ṣiṣẹ́"
"Disable selected devices": "Pa àwọn ẹ̀rọ tí a yàn lẹ́nu iṣẹ́"
"Confirm enabling": "Fìdí mímú ṣiṣẹ́ múlẹ̀"
"Confirm disabling": "Fìdí pípa lẹ́nu iṣẹ́ múlẹ̀"
"Confirm the polling state for these devices. Their graphs, data and other settings are retained.": "Fìdí ipò ìṣàyẹ̀wò múlẹ̀ fún àwọn ẹ̀rọ wọ̀nyí. Àwọn àwòrán ìtọ́ka, dátà àti àwọn ètò mìíràn wọn yóò dúró."
"Affected remote collectors must be online. A failed operation may have changed remote devices; verify every selected device before retrying.": "Àwọn olùkó jíjìn tí ọ̀rọ̀ kàn gbọ́dọ̀ wà lórí íńtánẹ́ẹ̀tì. Ìṣiṣẹ́ tó kùnà lè ti yí àwọn ẹ̀rọ jíjìn padà; ṣàyẹ̀wò gbogbo ẹ̀rọ tí a yàn kí o tó tún gbìyànjú."
"Selected devices enabled.": "A ti mú àwọn ẹ̀rọ tí a yàn ṣiṣẹ́."
"Selected devices disabled.": "A ti dá àwọn ẹ̀rọ tí a yàn dúró."
"Select %device%": "Yan %device%"
"Remove devices": "Yọ àwọn ẹ̀rọ kúrò"
"Remove selected devices": "Yọ àwọn ẹ̀rọ tí a yàn kúrò"
"Selected devices removed.": "A ti yọ àwọn ẹ̀rọ tí a yàn kúrò."
"Confirm removal": "Fìdí yíyọ-kúrò múlẹ̀"
"Graphs and data sources": "Àwọn àtẹ àwòrán àti àwọn orísun dátà"
"Retain graphs and disable data sources": "Pa àwọn àtẹ àwòrán mọ́ kí o sì pa àwọn orísun dátà"
"Remove graphs and data sources": "Yọ àwọn àtẹ àwòrán àti àwọn orísun dátà kúrò"
"Select a removal policy.": "Yan ìlànà ìyọkúrò kan."
"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "Àwọn ẹ̀rọ tí a yàn tàbí gíráfù àti orísun dátà wọn ti yí padà. Tún ìfìdí múlẹ̀ gbé jáde kí o tó yọ àwọn ẹ̀rọ kúrò."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "A gbọ́dọ̀ ya àwọn orísun dátà pín tàbí gíráfù àpapọ̀ kúrò kí a tó yọ gíráfù àti orísun dátà kúrò."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "Àbájáde yíyọ ẹ̀rọ kúrò kò dájú. Ṣàyẹ̀wò àwọn ẹ̀rọ, àwọn àwòrán ìtọ́ka àti àwọn orísun dátà tí a yàn kí o tó tún gbìyànjú."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "Yíyọ ẹ̀rọ kúrò kò ṣeé tún ṣe níbí. Yan bóyá láti pa àwọn àwòrán ìtọ́ka àti àwọn orísun dátà tí a pa lẹ́nu iṣẹ́ mọ́ tàbí láti yọ wọ́n kúrò."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "A gbọ́dọ̀ ya àwọn orísun dátà pín àti gíráfù àpapọ̀ kúrò kí a tó yọ gíráfù kúrò. Àwọn gíráfù àti orísun dátà tí a dá dúró yóò di aláìní olùṣàmúlò."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "Àwọn olùkó jíjìn tí ọ̀rọ̀ kàn gbọ́dọ̀ wà lórí íńtánẹ́ẹ̀tì. Ìyọkúrò tó kùnà lè fi àwọn àtúnṣe jíjìn tàbí àfikún sílẹ̀; ṣàyẹ̀wò àbájáde náà kí o tó tún gbìyànjú."
"RRD file cleanup follows the configured maintenance policy.": "Ìfọ̀mọ́ fáìlì RRD máa ń tẹ̀lé ìlànà ìtọ́jú tí a ṣètò."
"%graphs% graphs, %sources% data sources": "àwòrán ìtọ́ka %graphs%, orísun dátà %sources%"
"Device template updated.": "A ti sọ àdàkọ ẹ̀rọ di tuntun."
"Clear device statistics": "Nu àwọn ìṣirò ẹ̀rọ kúrò"
"Confirm clearing statistics": "Fìdí nínu àwọn ìṣirò kúrò múlẹ̀"
"Selected device statistics cleared.": "A ti pa ìṣirò ẹ̀rọ tí a yàn rẹ́."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Tún àwọn àkókò ìdáhùn, iye poll àti wíwà fún àwọn ẹ̀rọ wọ̀nyí ṣètò. Àwọn àtẹ àwòrán, dátà ìtàn àti àwọn ètò ẹ̀rọ ni a pa mọ́. Àwọn ìṣirò yóò bẹ̀rẹ̀ padà pẹ̀lú poll tókàn."
"Synchronize device templates": "Mú àwọn àdàkọ ẹ̀rọ báramu"
"Confirm synchronization": "Fìdí ìṣọ̀kan múlẹ̀"
"Selected device templates synchronized.": "A ti mú àwọn àdàkọ ẹ̀rọ tí a yàn báramu."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Lo àwọn àdàkọ tí a yàn lọ́wọ́lọ́wọ́ fún àwọn ẹ̀rọ wọ̀nyí. A óò fi àwọn ìsopọ̀ àwòrán ìtọ́ka àti ìbéèrè dátà tó sọnù kún, a sì lè yọ àwọn ìsopọ̀ àdàkọ àwòrán ìtọ́ka tí a kò lò kúrò. A óò fo àwọn ẹ̀rọ tí kò ní àdàkọ. Àwọn àwòrán ìtọ́ka tó wà tẹ́lẹ̀ àti dátà ìtàn yóò dúró; ìṣiṣẹ́ aládàáṣe lè dá àwọn àwòrán ìtọ́ka tuntun sílẹ̀."
"Change device options": "Yí àwọn àṣàyàn ẹ̀rọ padà"
"Confirm option changes": "Fìdí àwọn àtúnṣe àṣàyàn múlẹ̀"
"Selected device options updated.": "A ti ṣàtúnṣe àwọn àṣàyàn ẹ̀rọ tí a yàn."
"Device options": "Àwọn àṣàyàn ẹ̀rọ"
"Select at least one supported device option.": "Yan ó kéré jù àṣàyàn ẹ̀rọ kan tí a ṣe àtìlẹ́yìn fún."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Àwọn àṣàyàn tí a ṣàmì sí nìkan ni a yí padà. Àwọn àṣàyàn tí a kò ṣàmì sí máa ń pa ìníyelórí wọn lọ́wọ́lọ́wọ́ mọ́. Yíyan ibùdó òfo máa ń pa á rẹ́."
