"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Ìfúnniṣẹ́ tí a yàn jẹ́ mímú ṣiṣẹ́ lórí gbogbo ẹ̀rọ tí a tò. Àwọn ìyípadà àdàkọ ń pa àwọn gíráfù tó wà tẹ́lẹ̀ mọ́; àdáṣe lè ṣẹ̀dá àwọn gíráfù tuntun. Àwọn ìyípadà olùkójọ ń gbé olówó ìṣàkójọ lọ."
