"A useful name for this Rule.": "Izina ry'ingirakamaro ry'iri tegeko."
"Access denied.": "Uburenganzira bwanzwe."
"Add Graph Rule": "Ongeraho itegeko ry'igishushanyo"
"Back to Graph Rules": "Subira ku mategeko y'ibishushanyo"
"Cancel": "Hagarika"
"Check this box to enable this rule.": "Hitamo aka gasanduku kugira ngo ukoreshe iri tegeko."
"Choose a Data Query to apply to this rule.": "Hitamo ibaza ry'amakuru ryo gushyira kuri iri tegeko."
"Choose a Graph Type": "Hitamo ubwoko bw'igishushanyo"
"Choose a Graph Type of the selected Data Query.": "Hitamo ubwoko bw'igishushanyo bw'isabamakuru ryahiswemo."
"Choose an existing Data Query.": "Hitamo isabamakuru risanzweho."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Hitamo ubwoko ubwo ari bwo bwose bw'igishushanyo buboneka mu isabamakuru ryahiswemo kugira ngo bukoreshwe kuri iri tegeko."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kanda Komeza kugira ngo usibe amategeko y'ibishushanyo akurikira hamwe n'ibishingirwaho mu guhitamo ibikoresho no mu gukora ibishushanyo byayo."
"Click Continue to disable the following Graph Rules.": "Kanda Komeza kugira ngo uhagarike amategeko y'ibishushanyo akurikira."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kanda Komeza kugira ngo ukore kopi z'amategeko y'ibishushanyo akurikira. Ushobora guhindura imiterere y'umutwe y'amategeko mashya y'ibishushanyo, atangira ahagaritswe."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kanda Komeza kugira ngo ukoreshe amategeko y'ibishushanyo akurikira. Menya neza ko yageragejwe neza."
"Continue": "Komeza"
"Data Query": "Ishakisha ry'amakuru"
"Delete Graph Rules": "Siba amategeko y'ibishushanyo"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Ibyavuye mu gusiba ntibizwi neza. Suzuma urutonde rw'amategeko y'ibishushanyo mbere yo kongera kugerageza."
"Delete selected": "Siba ibyatoranyijwe"
"Device Selection and Graph Creation Criteria": "Ibishingirwaho mu guhitamo ibikoresho no gukora ibishushanyo"
"Disable Graph Rules": "Hagarika amategeko y'ibishushanyo"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Ibyavuye mu guhagarika ntibizwi neza. Suzuma urutonde rw'amategeko y'ibishushanyo mbere yo kongera kugerageza."
"Disable selected": "Hagarika ibyahiswemo"
"Duplicate Graph Rules": "Kora kopi z'amategeko y'ibishushanyo"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Ibyavuye mu gukora kopi ntibizwi neza. Suzuma urutonde rw'amategeko y'ibishushanyo mbere yo kongera kugerageza."
"Duplicate selected": "Kora kopi y'ibyahiswemo"
"Edit Graph Rule": "Hindura itegeko ry'igishushanyo"
"Enable Graph Rules": "Koresha amategeko y'ibishushanyo"
"Enable Rule": "Koresha itegeko"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Ibyavuye mu gukoresha ntibizwi neza. Suzuma urutonde rw'amategeko y'ibishushanyo mbere yo kongera kugerageza."
"Enable selected": "Koresha ibyahiswemo"
"Enter a name.": "Injiza izina."
"Enter a valid name format.": "Andika imiterere yemewe y'izina."
"Enter at most %count% characters.": "Injiza inyuguti zitarenze %count%."
"Enter single-line text.": "Injiza umwandiko w'umurongo umwe."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Buri <rule_name> isimburwa n'izina ry'itegeko ry'igishushanyo ririmo gukorerwa kopi."
"Graph Type": "Ubwoko bw'igishushanyo"
"Graph rule not found.": "Itegeko ry'igishushanyo ntiryabonetse."
"Graph rule saved.": "Itegeko ry'igishushanyo ryabitswe."
"Invalid Graph Rule selection.": "Ihitamo ry'itegeko ry'igishushanyo ntiryemewe."
"Name": "Izina"
"One or more selected Graph Rules no longer exist.": "Rimwe cyangwa menshi mu mategeko y'ibishushanyo yahiswemo ntabwo akiriho."
"Rule Selection [edit: %name%]": "Guhitamo itegeko [hindura: %name%]"
"Rule Selection [new]": "Ihitamo ry'itegeko [rishya]"
"Save": "Bika"
"Save outcome is uncertain. Reload before retrying.": "Nta cyemeza ko kubika byakunze. Ongera utangize ipaji mbere yo kongera kugerageza."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Banza ubike itegeko; ibishingirwaho mu guhitamo ibikoresho no gukora ibishushanyo byaryo byongerwaho nyuma."
"Select": "Hitamo"
"Select %name%": "Hitamo %name%"
"Select at least one Graph Rule.": "Hitamo nibura itegeko ry'igishushanyo rimwe."
"Select at most 100 Graph Rules at a time.": "Hitamo amategeko y'ibishushanyo atarenze 100 icyarimwe."
"Select up to %count% rows at a time.": "Hitamo imirongo itarenze %count% icyarimwe."
"The graph rule changed since you opened this form. Reload before saving.": "Itegeko ry'igishushanyo ryahindutse uhereye igihe wafunguriye iyi fomu. Ongera upakire mbere yo kubika."
"The name format must give every copy a name of 1 to 255 characters.": "Imiterere y'izina igomba guha buri kopi izina rifite inyuguti kuva kuri 1 kugeza kuri 255."
"Title Format": "Imiterere y'umutwe"
"Unable to load Graph Rules. Reload before retrying.": "Ntibyashobotse gupakira amategeko y'ibishushanyo. Ongera upakire mbere yo kongera kugerageza."
"Unable to load the graph rule. Reload before retrying.": "Ntibyashobotse gupakira itegeko ry'igishushanyo. Ongera upakire mbere yo kongera kugerageza."
"Unexpected fields were submitted.": "Imyanya itari yitezwe yoherejwe."
