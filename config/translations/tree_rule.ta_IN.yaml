"A useful name for this Rule.": "இந்த விதிக்குப் பயனுள்ள பெயர்."
"Access denied.": "அணுகல் மறுக்கப்பட்டது."
"Add Tree Rule": "மர விதி சேர்"
"Back to Tree Rules": "மர விதிகளுக்குத் திரும்பு"
"Check this box to enable this rule.": "இந்த விதியை இயக்க இந்தப் பெட்டியைத் தேர்ந்தெடுக்கவும்."
"Choose a Tree for the new Tree Items.": "புதிய மர உருப்படிகளுக்கான ஒரு மரத்தைத் தேர்ந்தெடுக்கவும்."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "இணைக்க தேர்ந்தெடுக்கப்பட்ட மரத்தின் ஒரு தலைப்பு அல்லது அதன் வேரைத் தேர்ந்தெடுக்கவும். இந்த விதி செயல்படுத்தப்படும்போது அது இன்னும் இருப்பதை உறுதிசெய்யவும்."
"Choose a header of the selected Tree.": "தேர்ந்தெடுக்கப்பட்ட மரத்தின் ஒரு தலைப்பைத் தேர்ந்தெடுக்கவும்."
"Choose a listed Graph Grouping Style.": "பட்டியலிடப்பட்ட வரைபடக் குழுவாக்கல் பாணியைத் தேர்ந்தெடுக்கவும்."
"Choose a listed Leaf Item Type.": "பட்டியலிடப்பட்ட இலை உருப்படி வகையைத் தேர்ந்தெடுக்கவும்."
"Choose an existing Tree.": "ஏற்கனவே உள்ள மரத்தைத் தேர்ந்தெடுக்கவும்."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "மரத்தில் இந்தக் குறிப்பிட்ட புரவலனுக்காக வரைபடங்கள் வரையப்படும்போது அவை எவ்வாறு குழுவாக்கப்படுகின்றன என்பதைத் தேர்ந்தெடுக்கவும். சாதன இலைகளுக்குப் பயன்படுத்தப்படுகிறது."
"Data Query Index": "தரவு வினவல் அட்டவணை"
"Device": "சாதனம்"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "சாதன இலைகள் வரைபடம் அல்லது வரைபட வார்ப்புரு நெடுவரிசைகளின் நிபந்தனைகளைப் பயன்படுத்த முடியாது. இலை உருப்படி வகையைச் சாதனமாக மாற்றும்போது, அந்த நிபந்தனைகளை அகற்ற இந்தப் பெட்டியைத் தேர்ந்தெடுக்கவும்; அவற்றை மீட்டெடுக்க முடியாது."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "சாதன இலைகள் வரைபடம் சார்ந்த நிபந்தனைகளைப் பயன்படுத்த முடியாது. சேமிக்க %count% நிபந்தனைகளை அகற்றுவதை உறுதிப்படுத்தவும்."
"Edit Tree Rule": "மர விதியைத் திருத்து"
"Enable Rule": "விதியை இயக்கு"
"Enter a name.": "ஒரு பெயரை உள்ளிடவும்."
"Enter at most %count% characters.": "அதிகபட்சம் %count% எழுத்துகள் உள்ளிடவும்."
"Enter single-line text.": "ஒற்றை வரி உரையை உள்ளிடவும்."
"Graph": "வரைபடம்"
"Graph Grouping Style": "வரைபடக் குழுவாக்கல் பாணி"
"Graph Template": "வரைபட வார்ப்புரு"
"Leaf Item Type": "இலை உருப்படி வகை"
"Name": "பெயர்"
"Object Selection and Tree Creation Criteria": "பொருள் தேர்வு மற்றும் மர உருவாக்க நிபந்தனைகள்"
"Optional: Sub-Tree Item": "விருப்பமானது: துணை-மர உருப்படி"
"Remove graph-based criteria": "வரைபடம் சார்ந்த நிபந்தனைகளை அகற்று"
"Save": "சேமி"
"Save outcome is uncertain. Reload before retrying.": "சேமிப்பின் முடிவு உறுதியற்றது. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "முதலில் விதியைச் சேமிக்கவும்; அதன் பொருள் தேர்வு மற்றும் மர உருவாக்க நிபந்தனைகள் பின்னர் சேர்க்கப்படும்."
"The Item Type that shall be dynamically added to the tree.": "மரத்தில் மாறும் வகையில் சேர்க்கப்பட வேண்டிய உருப்படி வகை."
"The tree rule changed since you opened this form. Reload before saving.": "இந்தப் படிவத்தைத் திறந்த பிறகு மர விதி மாறிவிட்டது. சேமிப்பதற்கு முன் மீண்டும் ஏற்றவும்."
"Tree": "மரம்"
"Tree Rule Selection [edit: %name%]": "மர விதித் தேர்வு [திருத்து: %name%]"
"Tree Rules Selection [new]": "மர விதிகள் தேர்வு [புதியது]"
"Tree rule not found.": "மர விதி கிடைக்கவில்லை."
"Tree rule saved.": "மர விதி சேமிக்கப்பட்டது."
"Unable to load the tree rule. Reload before retrying.": "மர விதியை ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
