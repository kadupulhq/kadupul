"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "I-Kadupul yiprojekthi ye-open-source ezimeleyo yokubeka iliso kwinethiwekhi kunye nokwenza iigrafu zexesha eliqhubekayo."
