"SNMP Version": "SNMP பதிப்பு"
"SNMPv3 authentication and privacy passphrases require at least 8 bytes.": "SNMPv3 அங்கீகார மற்றும் தனியுரிமைக் கடவுச்சொற்றொடர்களுக்குக் குறைந்தது 8 bytes தேவை."
"SNMPv3 privacy also requires authentication.": "SNMPv3 தனியுரிமைக்கு அங்கீகாரமும் தேவை."
"SNMPv3 requires a username and an engine ID.": "SNMPv3-க்கு ஒரு பயனர்பெயர் மற்றும் ஒரு இயந்திரம் ID தேவை."
"Save": "சேமி"
"Save outcome is uncertain. Reload before retrying.": "சேமிப்பின் முடிவு உறுதியற்றது. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Select a supported notification receiver setting.": "ஆதரிக்கப்படும் அறிவிப்புப் பெறுநர் அமைப்பைத் தேர்ந்தெடுக்கவும்."
"Select supported notification receiver settings.": "ஆதரிக்கப்படும் அறிவிப்புப் பெறுநர் அமைப்புகளைத் தேர்ந்தெடுக்கவும்."
"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "SNMPv3 அங்கீகார அல்லது தனியுரிமை நெறிமுறையை அதன் கடவுச்சொற்றொடருடன் சேர்த்து அமைக்கவும்."
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "சேமிக்கப்பட்ட நற்சான்றிதழ்கள் ஒருபோதும் காட்டப்படாது. அவற்றை மாற்றுவது நான்கு நற்சான்றிதழ் புலங்களையும் அமைக்கும்; SNMP பதிப்பு 3-ஐ விட்டு வெளியேறுவது அதன் பயனர்பெயர் மற்றும் கடவுச்சொற்றொடர்களை அழிக்கும்."
"Submit every notification receiver field.": "ஒவ்வொரு அறிவிப்புப் பெறுநர் புலத்தையும் சமர்ப்பி."
"The notification receiver changed since you opened this form. Reload before saving.": "இந்தப் படிவத்தைத் திறந்த பிறகு அறிவிப்புப் பெறுநர் மாறிவிட்டது. சேமிப்பதற்கு முன் மீண்டும் ஏற்றவும்."
"The passphrases do not match.": "கடவுச்சொற்றொடர்கள் பொருந்தவில்லை."
"Unable to load the notification receiver. Reload before retrying.": "அறிவிப்புப் பெறுநரை ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
"Use stored credentials": "சேமிக்கப்பட்ட நற்சான்றிதழ்களைப் பயன்படுத்து"
"Version 1": "பதிப்பு 1"
"Version 2": "பதிப்பு 2"
