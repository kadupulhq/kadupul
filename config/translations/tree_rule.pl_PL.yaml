"A useful name for this Rule.": "Przydatna nazwa dla tego artykułu."
"Access denied.": "Odmowa dostępu."
"Add Tree Rule": "Dodaj regułę drzewa"
"Back to Tree Rules": "Powrót do reguł drzewa"
"Check this box to enable this rule.": "Zaznacz to pole, aby włączyć tę regułę."
"Choose a Tree for the new Tree Items.": "Wybierz drzewo dla nowych przedmiotów z drzewa."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Wybierz nagłówek wybranego drzewa do podpięcia lub jego korzeń. Upewnij się, że nadal istnieje w momencie wykonania tej reguły."
"Choose a header of the selected Tree.": "Wybierz nagłówek wybranego drzewa."
"Choose a listed Graph Grouping Style.": "Wybierz styl grupowania wykresów z listy."
"Choose a listed Leaf Item Type.": "Wybierz typ elementu liścia z listy."
"Choose an existing Tree.": "Wybierz istniejące drzewo."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Wybierz sposób grupowania wykresów podczas ich rysowania dla tego hosta w drzewie. Używane dla liści urządzeń."
"Data Query Index": "Indeks zapytań o dane"
"Device": "Urządzenie"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Liście urządzeń nie mogą używać kryteriów opartych na kolumnach wykresu lub szablonu wykresu. Podczas zmiany typu elementu liścia na Urządzenie zaznacz to pole, aby usunąć te kryteria; nie będzie można ich odzyskać."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Liście urządzeń nie mogą używać kryteriów opartych na wykresach. Potwierdź usunięcie kryteriów (%count%), aby zapisać."
"Edit Tree Rule": "Edytuj regułę drzewa"
"Enable Rule": "Włącz regułę"
"Enter a name.": "Wprowadź nazwę."
"Enter at most %count% characters.": "Wprowadź maksymalnie %count% znaków."
"Enter single-line text.": "Wprowadź tekst jednowierszowy."
"Graph": "Wykres"
"Graph Grouping Style": "Styl grupowania wykresów"
"Graph Template": "Szablon wykresu"
"Leaf Item Type": "Typ elementu na kartce"
"Name": "Nazwa"
"Object Selection and Tree Creation Criteria": "Kryteria wyboru obiektów i tworzenia drzewa"
"Optional: Sub-Tree Item": "Nieobowiązkowe: Pozycja poddrzewa"
"Remove graph-based criteria": "Usuń kryteria oparte na wykresach"
"Save": "Zapisz"
"Save outcome is uncertain. Reload before retrying.": "Wynik zapisu jest niepewny. Odśwież stronę przed ponowną próbą."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Najpierw zapisz regułę; jej kryteria wyboru obiektów i tworzenia drzewa są dodawane później."
"The Item Type that shall be dynamically added to the tree.": "Typ elementu, który powinien być dynamicznie dodawany do drzewa."
"The tree rule changed since you opened this form. Reload before saving.": "Reguła drzewa zmieniła się od otwarcia tego formularza. Odśwież stronę przed zapisaniem."
"Tree": "Drzewo"
"Tree Rule Selection [edit: %name%]": "Wybór reguły drzewa [edycja: %name%]"
"Tree Rules Selection [new]": "Wybór reguł drzewa [nowy]"
"Tree rule not found.": "Nie znaleziono reguły drzewa."
"Tree rule saved.": "Zapisano regułę drzewa."
"Unable to load the tree rule. Reload before retrying.": "Nie można wczytać reguły drzewa. Odśwież stronę przed ponowną próbą."
"Unexpected fields were submitted.": "Przesłano nieoczekiwane pola."
