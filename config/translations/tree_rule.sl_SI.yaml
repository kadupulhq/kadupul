"A useful name for this Rule.": "Uporabno ime za to pravilo."
"Access denied.": "Dostop zavrnjen."
"Add Tree Rule": "Dodaj pravilo za drevesa"
"Back to Tree Rules": "Nazaj na pravila za drevesa"
"Cancel": "Prekliči"
"Check this box to enable this rule.": "Označite to polje, da omogočite to pravilo."
"Choose a Tree for the new Tree Items.": "Izberite drevo za nove elemente drevesa."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Izberite glavo izbranega drevesa, v katero se vklopi, ali njegov koren. Poskrbite, da bo še obstajala, ko se to pravilo izvede."
"Choose a header of the selected Tree.": "Izberite glavo izbranega drevesa."
"Choose a listed Graph Grouping Style.": "Izberite navedeni slog združevanja grafov."
"Choose a listed Leaf Item Type.": "Izberite navedeno vrsto elementa lista."
"Choose an existing Tree.": "Izberite obstoječe drevo."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Izberite, kako se grafi združijo, ko so izrisani za ta gostitelj v drevesu. Uporablja se za liste naprav."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Kliknite Nadaljuj, da izbrišete naslednja pravila za drevesa z merili za izbor objektov in ustvarjanje drevesa."
"Click Continue to disable the following Tree Rules.": "Kliknite Nadaljuj, da onemogočite naslednja pravila za drevesa."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Kliknite Nadaljuj, da podvojite naslednja pravila za drevesa. Po želji lahko spremenite obliko naslova za nova pravila za drevesa, ki so sprva onemogočena."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Kliknite Nadaljuj, da omogočite naslednja pravila za drevesa. Poskrbite, da so bila uspešno preizkušena."
"Continue": "Nadaljuj"
"Data Query Index": "Indeks podatkovne poizvedbe"
"Delete Tree Rules": "Izbriši pravila za drevesa"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Izid brisanja ni gotov. Pred ponovnim poskusom preverite seznam pravil za drevesa."
"Delete selected": "Izbriši izbrano"
"Device": "Naprava"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Listi naprav ne morejo uporabljati meril za stolpce grafov ali predlog grafov. Ko vrsto elementa lista spremenite v Naprava, označite to polje, da odstranite ta merila; ni jih mogoče obnoviti."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Listi naprav ne morejo uporabljati meril, ki temeljijo na grafih. Za shranjevanje potrdite odstranitev %count% meril."
"Disable Tree Rules": "Onemogoči pravila za drevesa"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Izid onemogočanja ni gotov. Pred ponovnim poskusom preverite seznam pravil za drevesa."
"Disable selected": "Onemogoči izbrano"
"Duplicate Tree Rules": "Podvoji pravila za drevesa"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Izid podvajanja ni gotov. Pred ponovnim poskusom preverite seznam pravil za drevesa."
"Duplicate selected": "Podvoji izbrano"
"Edit Tree Rule": "Uredi pravilo za drevesa"
"Enable Rule": "Omogoči pravilo"
