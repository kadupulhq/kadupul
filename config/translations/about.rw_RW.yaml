"About Kadupul": "Ibyerekeye Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul ni umushinga wigenga ufite kode ifunguye (open-source) wo gukurikirana imiyoboro no gushushanya ibishushanyo bishingiye ku gihe."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Iterambere, imisanzu n'ibyemezo byo gusohora amakopi biyoborwa n'umuryango wa Kadupul."
"For documentation and support, visit the Kadupul project.": "Kugira ngo ubone inyandiko z'ubufasha n'ubundi bufasha, sura umushinga wa Kadupul."
