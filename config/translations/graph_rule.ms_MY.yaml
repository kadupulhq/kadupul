"A useful name for this Rule.": "Nama yang berguna untuk Peraturan ini."
"Access denied.": "Akses dinafikan."
"Add Graph Rule": "Tambah Peraturan Graf"
"Back to Graph Rules": "Kembali ke Peraturan Graf"
"Cancel": "Batal"
"Check this box to enable this rule.": "Tandakan kotak ini untuk mendayakan peraturan ini."
"Choose a Data Query to apply to this rule.": "Pilih Pertanyaan Data yang akan digunakan pada peraturan ini."
"Choose a Graph Type": "Pilih Jenis Graf"
"Choose a Graph Type of the selected Data Query.": "Pilih Jenis Graf bagi Pertanyaan Data yang dipilih."
"Choose an existing Data Query.": "Pilih Pertanyaan Data yang sedia ada."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Pilih mana-mana Jenis Graf yang tersedia bagi Pertanyaan Data yang dipilih untuk digunakan pada peraturan ini."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Klik Teruskan untuk memadam Peraturan Graf berikut beserta Pemilihan Peranti dan Kriteria Penciptaan Graf."
"Click Continue to disable the following Graph Rules.": "Klik Teruskan untuk melumpuhkan Peraturan Graf berikut."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Klik Teruskan untuk menduplikasi Peraturan Graf berikut. Anda boleh menukar format tajuk untuk Peraturan Graf baharu secara pilihan, yang bermula dalam keadaan dilumpuhkan."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Klik Teruskan untuk mendayakan Peraturan Graf berikut. Pastikan ia telah diuji dengan berjaya."
"Continue": "Teruskan"
"Data Query": "Pertanyaan Data"
"Delete Graph Rules": "Padam Peraturan Graf"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Hasil pemadaman tidak pasti. Semak senarai Peraturan Graf sebelum mencuba lagi."
"Delete selected": "Padam yang dipilih"
"Device Selection and Graph Creation Criteria": "Pemilihan Peranti dan Kriteria Penciptaan Graf"
"Disable Graph Rules": "Lumpuhkan Peraturan Graf"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Hasil pelumpuhan tidak pasti. Semak senarai Peraturan Graf sebelum mencuba lagi."
"Disable selected": "Lumpuhkan yang dipilih"
"Duplicate Graph Rules": "Duplikasi Peraturan Graf"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Hasil duplikasi tidak pasti. Semak senarai Peraturan Graf sebelum mencuba lagi."
"Duplicate selected": "Duplikasi yang dipilih"
"Edit Graph Rule": "Sunting Peraturan Graf"
"Enable Graph Rules": "Dayakan Peraturan Graf"
"Enable Rule": "Dayakan Peraturan"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Hasil pendayaan tidak pasti. Semak senarai Peraturan Graf sebelum mencuba lagi."
"Enable selected": "Dayakan yang dipilih"
"Enter a name.": "Masukkan nama."
"Enter a valid name format.": "Masukkan format nama yang sah."
"Enter at most %count% characters.": "Masukkan paling banyak %count% aksara."
"Enter single-line text.": "Masukkan teks satu baris."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Setiap <rule_name> diganti dengan nama Peraturan Graf yang sedang disalin."
"Graph Type": "Jenis Graf"
"Graph rule not found.": "Peraturan graf tidak ditemui."
"Graph rule saved.": "Peraturan graf disimpan."
"Invalid Graph Rule selection.": "Pilihan Peraturan Graf tidak sah."
"Name": "Nama"
"One or more selected Graph Rules no longer exist.": "Satu atau lebih Peraturan Graf yang dipilih tidak lagi wujud."
"Rule Selection [edit: %name%]": "Pemilihan Peraturan [sunting: %name%]"
"Rule Selection [new]": "Pemilihan Peraturan [baharu]"
"Save": "Simpan"
"Save outcome is uncertain. Reload before retrying.": "Hasil simpanan tidak pasti. Muat semula sebelum mencuba lagi."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Simpan peraturan dahulu; Pemilihan Peranti dan Kriteria Penciptaan Grafnya ditambah selepas itu."
"Select": "Pilih"
"Select %name%": "Pilih %name%"
"Select at least one Graph Rule.": "Pilih sekurang-kurangnya satu Peraturan Graf."
