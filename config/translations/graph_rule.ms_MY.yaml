"Select up to %count% rows at a time.": "Pilih sehingga %count% baris pada satu masa."
"The graph rule changed since you opened this form. Reload before saving.": "Peraturan graf telah berubah sejak anda membuka borang ini. Muat semula sebelum menyimpan."
"The name format must give every copy a name of 1 to 255 characters.": "Format nama mesti memberikan setiap salinan nama sepanjang 1 hingga 255 aksara."
"Title Format": "Format Tajuk"
"Unable to load Graph Rules. Reload before retrying.": "Tidak dapat memuatkan Peraturan Graf. Muat semula sebelum mencuba lagi."
