"A useful name for this Rule.": "Nama yang berguna untuk Peraturan ini."
"Access denied.": "Akses dinafikan."
"Add Tree Rule": "Tambah Peraturan Pokok"
"Back to Tree Rules": "Kembali ke Peraturan Pokok"
"Cancel": "Batal"
"Check this box to enable this rule.": "Tandakan kotak ini untuk mendayakan peraturan ini."
"Choose a Tree for the new Tree Items.": "Pilih Pokok untuk Item Pokok baharu."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Pilih pengepala Pokok yang dipilih untuk dikaitkan, atau akarnya. Pastikan ia masih wujud apabila peraturan ini dilaksanakan."
"Choose a header of the selected Tree.": "Pilih pengepala Pokok yang dipilih."
"Choose a listed Graph Grouping Style.": "Pilih Gaya Pengelompokan Graf yang tersenarai."
"Choose a listed Leaf Item Type.": "Pilih Jenis Item Daun yang tersenarai."
"Choose an existing Tree.": "Pilih Pokok yang sedia ada."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Pilih cara graf dikelompokkan apabila dilukis untuk hos tertentu ini pada pokok. Digunakan untuk daun Peranti."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Klik Teruskan untuk memadam Peraturan Pokok berikut beserta Pemilihan Objek dan Kriteria Penciptaan Pokok."
"Click Continue to disable the following Tree Rules.": "Klik Teruskan untuk melumpuhkan Peraturan Pokok berikut."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Klik Teruskan untuk menduplikasi Peraturan Pokok berikut. Anda boleh menukar format tajuk untuk Peraturan Pokok baharu secara pilihan, yang bermula dalam keadaan dilumpuhkan."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Klik Teruskan untuk mendayakan Peraturan Pokok berikut. Pastikan ia telah diuji dengan berjaya."
"Continue": "Teruskan"
"Data Query Index": "Indeks Pertanyaan Data"
"Delete Tree Rules": "Padam Peraturan Pokok"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Hasil pemadaman tidak pasti. Semak senarai Peraturan Pokok sebelum mencuba lagi."
"Delete selected": "Padam yang dipilih"
"Device": "Peranti"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Daun Peranti tidak boleh menggunakan kriteria pada lajur graf atau templat graf. Apabila menukar Jenis Item Daun kepada Peranti, tandakan kotak ini untuk mengalih keluar kriteria tersebut; ia tidak boleh dipulihkan."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Daun Peranti tidak boleh menggunakan kriteria berasaskan graf. Sahkan pengalihan keluar %count% kriteria untuk menyimpan."
"Disable Tree Rules": "Lumpuhkan Peraturan Pokok"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Hasil pelumpuhan tidak pasti. Semak senarai Peraturan Pokok sebelum mencuba lagi."
"Disable selected": "Lumpuhkan yang dipilih"
"Duplicate Tree Rules": "Duplikasi Peraturan Pokok"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Hasil duplikasi tidak pasti. Semak senarai Peraturan Pokok sebelum mencuba lagi."
"Duplicate selected": "Duplikasi yang dipilih"
"Edit Tree Rule": "Sunting Peraturan Pokok"
"Enable Rule": "Dayakan Peraturan"
"Enable Tree Rules": "Dayakan Peraturan Pokok"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Hasil pendayaan tidak pasti. Semak senarai Peraturan Pokok sebelum mencuba lagi."
"Enable selected": "Dayakan yang dipilih"
