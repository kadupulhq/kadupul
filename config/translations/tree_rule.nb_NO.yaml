"A useful name for this Rule.": "Et nyttig navn for denne regelen."
"Access denied.": "Tilgang nektet."
"Add Tree Rule": "Legg til tre-regel"
"Back to Tree Rules": "Tilbake til tre-regler"
"Cancel": "Avbryt"
"Check this box to enable this rule.": "Merk av her for å aktivere denne regelen."
"Choose a Tree for the new Tree Items.": "Velg et tre for de nye treelementene."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Velg en overskrift i det valgte treet å koble til, eller roten. Pass på at den fortsatt finnes når denne regelen kjøres."
"Choose a header of the selected Tree.": "Velg en overskrift i det valgte treet."
"Choose a listed Graph Grouping Style.": "Velg en oppført grafgrupperingsstil."
"Choose a listed Leaf Item Type.": "Velg en oppført bladelementtype."
"Choose an existing Tree.": "Velg et eksisterende tre."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Velg hvordan grafer grupperes når de tegnes for denne verten i treet. Brukes for enhetsblader."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Klikk Fortsett for å slette følgende tre-regler sammen med objektutvalget og kriteriene for treoppretting."
"Click Continue to disable the following Tree Rules.": "Klikk Fortsett for å deaktivere følgende tre-regler."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Klikk Fortsett for å duplisere følgende tre-regler. Du kan eventuelt endre tittelformatet for de nye tre-reglene, som starter deaktivert."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Klikk Fortsett for å aktivere følgende tre-regler. Pass på at de er testet."
"Continue": "Fortsett"
"Data Query Index": "Dataspørringsindeks"
"Delete Tree Rules": "Slett tre-regler"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet av slettingen er usikkert. Kontroller listen over tre-regler før du prøver igjen."
"Delete selected": "Slett valgte"
"Device": "Enhet"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Enhetsblader kan ikke bruke kriterier på graf- eller grafmalkolonner. Når du endrer bladelementtypen til Enhet, merk av her for å fjerne disse kriteriene; de kan ikke gjenopprettes."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Enhetsblader kan ikke bruke grafbaserte kriterier. Bekreft fjerning av %count% kriterier for å lagre."
"Disable Tree Rules": "Deaktiver tre-regler"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet av deaktiveringen er usikkert. Kontroller listen over tre-regler før du prøver igjen."
"Disable selected": "Deaktiver valgte"
"Duplicate Tree Rules": "Dupliser tre-regler"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet av dupliseringen er usikkert. Kontroller listen over tre-regler før du prøver igjen."
"Duplicate selected": "Dupliser valgte"
"Edit Tree Rule": "Rediger tre-regel"
"Enable Rule": "Aktiver regel"
"Enable Tree Rules": "Aktiver tre-regler"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet av aktiveringen er usikkert. Kontroller listen over tre-regler før du prøver igjen."
"Enable selected": "Aktiver valgte"
