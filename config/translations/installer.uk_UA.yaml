"Action": "Дія"
"Advanced options": "Додаткові параметри"
"Applying database upgrades": "Застосування оновлень бази даних"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Створіть резервну копію бази даних, файлів RRD, конфігурації та ключів. Оновлення бази даних можуть фіксувати зміни, які відкат застосунку не зможе скасувати."
"Blocked": "Заблоковано"
"Check": "Перевірка"
"Check again": "Перевірити знову"
"Check collection freshness and collector connectivity before enabling discovery.": "Перевірте актуальність збирання даних і зв'язок зі збирачами перед увімкненням виявлення."
"Check requirements": "Перевірити вимоги"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Перевірки аналізують права цього процесу та файлової системи. Вони не створюють тестові файли і не звертаються до пристроїв."
"Collection profile": "Профіль збирання"
"Collector": "Збирач"
"Configure": "Налаштувати"
"Configuring collection profiles": "Налаштування профілів збирання"
"Configuring discovery": "Налаштування виявлення"
"Configuring the local device": "Налаштування локального пристрою"
"Confirming database version": "Підтвердження версії бази даних"
"Converting selected tables": "Перетворення вибраних таблиць"
"Database version": "Версія бази даних"
"Disabled": "Вимкнен"
"Discovery": "Виявлення"
"Discovery SNMP settings": "Налаштування SNMP для виявлення"
"Discovery range": "Діапазон виявлення"
"Enable discovery after installation": "Увімкнути виявлення після встановлення"
"Executable paths": "Шляхи до виконуваних файлів"
"Execution status": "Стан виконання"
"Finished execution": "Виконання завершено"
"Finishing tasks only. Schema migrations will not be replayed.": "Виконуються лише завершальні завдання. Міграції схеми не повторюватимуться."
"I accept the license terms": "Я приймаю умови ліцензії"
"I authorize discovery of the displayed range": "Я дозволяю виявлення для показаного діапазону"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Я перевірив журнал і підтверджую, що попередній обробник і його дочірні процеси зупинилися"
"I checked the previous attempt and accept that some changes may already be committed": "Я перевірив попередню спробу та приймаю, що деякі зміни вже могли бути зафіксовані"
"I reviewed this plan and have the required backups": "Я переглянув цей план і маю необхідні резервні копії"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Якщо обробник несподівано зупиниться, збережіть log/cacti.log і переконайтеся, що його процес завершився, перш ніж явно повторювати спробу. Стан очікування не підтверджує успішний запуск."
"Importing templates": "Імпорт шаблонів"
"Install Kadupul": "Встановити Kadupul"
"Installation and upgrade": "Встановлення та оновлення"
"Installation request was rejected.": "Запит на встановлення відхилено."
"Installation steps": "Етапи встановлення"
"Installed": "Встановлено"
"Keep a backup of the database, RRD files, configuration and secret material.": "Зберігайте резервну копію бази даних, файлів RRD, конфігурації та секретних ключів."
"Language": "Мова"
"Large tables may require the dedicated CLI conversion tool before installation.": "Великі таблиці можуть потребувати запуску спеціального CLI-інструмента перетворення перед встановленням."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Залиште поля секретів порожніми, щоб зберегти поточні облікові дані. Секрети ніколи не відображаються повторно."
"License": "Ліцензія"
"No action needed": "Дії не потрібні"
"Observed": "Спостережено"
"Open the console": "Відкрити консоль"
"Operation": "Операція"
"Override discovery SNMP settings": "Перевизначити налаштування SNMP для виявлення"
"Pass": "Пройдено"
"Poller interval in seconds": "Інтервал опитувача в секундах"
"Preparing CSRF protection": "Підготовка захисту від CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Поступ відображає останній зафіксований етап. Оновлення цієї сторінки ніколи не запускає обробник і не повторює спробу."
"Recover stopped attempt": "Відновити зупинену спробу"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Відновлення зберігає вибрані параметри й ніколи не завершує активний обробник. Перегляньте план ще раз перед повторною спробою."
"Review": "Перегляд"
"Review installation plan": "Перегляд плану встановлення"
"Run": "Запустити"
"Run reviewed plan": "Виконати переглянутий план"
"Save and review": "Зберегти та переглянути"
"Scope": "Область"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Стан недоступний. Збережену роботу збережено. Оновіть сторінку, щоб повторно підключитися; не надсилайте нове встановлення."
"Synchronizing collectors": "Синхронізація збирачів"
"Table conversions": "Перетворення таблиць"
"Templates": "Шаблони"
"The database version matches this application. Installation does not establish that polling is healthy.": "Версія бази даних відповідає цьому застосунку. Встановлення не гарантує, що опитування працює справно."
"The request outcome is unknown. Check execution status before retrying.": "Результат запиту невідомий. Перевірте стан виконання перед повторною спробою."
"Theme": "Тема оформлення"
"Verify": "Перевірити"
"Verify the poller schedule and service account.": "Перевірте розклад опитувача та службовий обліковий запис."
"Version change": "Зміна версії"
"Waiting for the installation worker": "Очікування обробника встановлення"
"collector": "збирач"
"complete": "завершено"
"failed": "помилка"
"finish": "завершити"
"install": "встановлення"
"not_started": "не розпочато"
"partial": "частково"
"running": "виконується"
"succeeded": "успішно завершено"
"upgrade": "оновлення"
"waiting": "очікування"
"Accept the license before saving the installation plan.": "Прийміть ліцензію перед збереженням плану встановлення."
"Invalid installation form.": "Неприпустима форма встановлення."
"Access denied.": "Доступ заборонено."
"Confirm the recovery warning before retrying.": "Підтвердьте попередження щодо відновлення перед повторною спробою."
"Review and confirm the current installation plan.": "Перегляньте та підтвердьте поточний план встановлення."
"Confirm the discovery scope before starting.": "Підтвердьте область виявлення перед запуском."
"Resolve the blocking checks before starting.": "Усуньте блокувальні перевірки перед запуском."
"Too many installer options.": "Занадто багато параметрів встановлювача."
"Invalid installer option name.": "Неприпустима назва параметра встановлювача."
"Unknown or malformed installer option.": "Невідомий або пошкоджений параметр встановлювача."
"Installer options must be scalar values.": "Параметри встановлювача мають бути скалярними значеннями."
"Installer option is too long or contains a null byte.": "Параметр встановлювача занадто довгий або містить нульовий байт."
"Installer IDs and intervals must be whole numbers.": "ID та інтервали встановлювача мають бути цілими числами."
"Installer ID or interval is outside its supported range.": "ID або інтервал встановлювача виходить за межі підтримуваного діапазону."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Не вдалося продовжити встановлення. Перезавантажте його стан і перегляньте блокувальні перевірки перед повторною спробою."
"Confirm that the previous worker has stopped before recovering its plan.": "Переконайтеся, що попередній обробник зупинився, перш ніж відновлювати його план."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Базу даних встановлено, але деякі збирачі все ще потребують синхронізації. Повторіть завершальні завдання після перевірки їхнього стану."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Встановлення зупинено. Збережіть журнал встановлювача, усуньте причину та явно підтвердьте повторну спробу. Деякі зміни в базі даних уже могли бути зафіксовані. Перевірте очищення плагінів перед наданням дозволу на повторну спробу."
"Next action": "Наступна дія"
"Follow the execution status. Do not start another attempt while a worker is active.": "Стежте за станом виконання. Не запускайте іншу спробу, доки обробник активний."
"Complete the recovery checklist before retrying.": "Виконайте контрольний список відновлення перед повторною спробою."
"Verify collection and graph operation before enabling discovery.": "Перевірте збирання даних і роботу графіків перед увімкненням виявлення."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Усуньте блокувальні вимоги, а потім перевірте знову. Збережені параметри зберігаються."
"Review the planned changes and backup checklist before authorizing execution.": "Перегляньте заплановані зміни та контрольний список резервного копіювання перед наданням дозволу на виконання."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Виберіть профіль збирання та прийміть ліцензію. За потреби можна відкрити додаткові налаштування."
"Download installation diagnostics": "Завантажити діагностику встановлення"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Відкрийте графік і переконайтеся, що його дані RRD оновлюються після циклу опитувача."
"Requirement details": "Деталі вимог"
"Recover": "Відновити"
"Recovery checklist": "Контрольний список відновлення"
"Preserve log/cacti.log and record the failed attempt.": "Збережіть log/cacti.log і зафіксуйте невдалу спробу."
"Confirm that the previous worker and its child processes have stopped.": "Переконайтеся, що попередній обробник і його дочірні процеси зупинилися."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Перевірте зафіксовані зміни, синхронізацію збирачів і очищення плагінів. Усуньте причину перед повторною спробою."
"Review the saved plan again, then explicitly authorize a retry.": "Перегляньте збережений план ще раз, а потім явно дозвольте повторну спробу."
"Recover a stopped worker": "Відновити зупинений обробник"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Використовуйте відновлення лише після підтвердження, що ця спроба більше не виконується. Відновлення не зупиняє процес."
"Collector and installation mode": "Збирач і режим встановлення"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Конфігурація розгортання визначає роль збирача та підключення до бази даних. Перевірте конфігурацію основного сервера перед запуском збирача."
"Discovery and SNMP settings": "Налаштування виявлення та SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Тримайте виявлення вимкненим, доки не буде перевірено збирання даних і з'єднання зі збирачем."
"Template selection": "Вибір шаблону"
"Templates selected for import": "Шаблони, вибрані для імпорту"
"No templates selected.": "Шаблони не вибрано."
"Backup checklist": "Контрольний список резервного копіювання"
"Database backup and a tested restoration procedure.": "Резервна копія бази даних і перевірена процедура відновлення."
"RRD files and the service account permissions needed to restore them.": "Файли RRD і права службового облікового запису, необхідні для їх відновлення."
"Configuration, keys and plugin data outside the database.": "Конфігурація, ключі та дані плагінів поза базою даних."
"Post-installation checks": "Перевірки після встановлення"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Підтверджені перевірки охоплюють лише показані докази. Неоцінені перевірки все ще потребують підтвердження оператором."
"Operational checks still require operator verification.": "Експлуатаційні перевірки все ще потребують підтвердження оператором."
"Status": "Стан"
"verified": "Перевірено"
"action_required": "Потрібна дія"
"not_assessed": "Не оцінено"
"Database schema": "Схема бази даних"
"Stored schema matches the application target.": "Збережена схема відповідає цільовій схемі застосунку."
"Target schema completion has not been confirmed.": "Завершення цільової схеми не підтверджено."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Перегляньте результат встановлення та усуньте збої, перш ніж вважати оновлення схеми завершеним."
"Installation outcome": "Результат встановлення"
"A successful receipt matches the current target schema.": "Успішна квитанція відповідає поточній цільовій схемі."
"A complete successful installation outcome has not been confirmed.": "Повний успішний результат встановлення не підтверджено."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Збережіть журнал встановлювача та за потреби скористайтеся явною процедурою відновлення або повторної спроби."
"Collector synchronization": "Синхронізація збирачів"
"The completed installer reports pending collector synchronization.": "Завершений встановлювач повідомляє про збирачі, що очікують синхронізації."
"The completed installer reports no pending collectors.": "Завершений встановлювач повідомляє, що немає збирачів, які очікують синхронізації."
"Collector completion remains unconfirmed by this partial receipt.": "Завершення роботи збирача залишається непідтвердженим цією частковою квитанцією."
"Collector completion is not established by this installation outcome.": "Завершення роботи збирача не підтверджується цим результатом встановлення."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Перевірте стан збирачів і повторіть завершальні завдання для часткових результатів. Це не перевіряє подальшу актуальність збирання даних."
"Scheduled collection": "Заплановане збирання"
"No poller or device was contacted by this assessment.": "Ця оцінка не зверталася до жодного опитувача чи пристрою."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Переконайтеся, що налаштований планувальник запускає опитувач від імені потрібного службового облікового запису, і перегляньте його наступний штатний цикл."
"Graph data": "Дані графіків"
"Live samples and RRD updates were not exercised.": "Актуальні вибірки та оновлення RRD не перевірялися."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Після звичайного циклу збирання переконайтеся, що очікувані графіки отримують свіжі вибірки, і перегляньте помилки опитувача."
"Recovery readiness": "Готовність до відновлення"
"Backup restoration was not exercised.": "Відновлення з резервної копії не виконувалося."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Перевірте ізольоване відновлення бази даних, файлів RRD, конфігурації та ключових матеріалів, перш ніж покладатися на відновлення."
"No persisted local poller start has been recorded.": "Не зафіксовано жодного збереженого локального запуску опитувача."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Збережений час роботи опитувача недійсний і не може підтвердити справність планувальника."
"The recorded poller start is in the future. Check clock synchronization.": "Зафіксований запуск опитувача знаходиться в майбутньому. Перевірте синхронізацію годинника."
"The recorded poller start is older than the native scheduling tolerance.": "Зафіксований запуск опитувача старіший за штатний допуск планування."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Локальний запуск опитувача зафіксовано в межах штатного допуску планування. Завершення роботи та справність пристроїв не перевірено."
"readable": "доступний для читання"
"missing or unreadable": "відсутній або недоступний для читання"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Відновіть повний реліз і його зафіксовані залежності; надайте службовому обліковому запису доступ на читання."
"PHP temporary directory": "Тимчасовий каталог PHP"
"directory writable by this process": "каталог доступний для запису цим процесом"
"missing or not writable": "відсутній або недоступний для запису"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Налаштуйте sys_temp_dir як наявний каталог, доступний для запису обліковому запису встановлення. Вбудований імпорт використовує тимчасові файли."
"Background worker launch": "Запуск фонового обробника"
"required PHP functions available; launch not exercised": "обов'язкові функції PHP доступні; запуск не перевірявся"
"required PHP launch function disabled": "обов'язкова функція запуску PHP вимкнена"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Увімкніть exec для вебсередовища PHP або скористайтеся авторизованим CLI-встановлювачем."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Увімкніть popen, pclose для вебсередовища PHP або скористайтеся авторизованим CLI-встановлювачем."
"Database transaction ownership": "Володіння транзакціями бази даних"
"autocommit enabled; no caller-owned transaction": "autocommit увімкнено; немає транзакції, якою керує викликач"
"autocommit disabled or caller transaction active": "autocommit вимкнено або активна транзакція викликача"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Запустіть встановлення поза транзакцією, якою керує викликач, і ввімкніть autocommit на з'єднанні для змін."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Відновіть каталог релізу та надайте обліковому запису встановлення доступ на запис для імпорту ресурсів шаблонів. Не робіть його доступним для запису всім користувачам."
"Worker file: install/background.php": "Файл обробника: install/background.php"
"Worker file: bin/legacy-installer.php": "Файл обробника: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Файл обробника: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Призначення імпорту: resource/snmp_queries"
"Import destination: resource/script_server": "Призначення імпорту: resource/script_server"
"Import destination: resource/script_queries": "Призначення імпорту: resource/script_queries"
"Import destination: scripts": "Призначення імпорту: scripts"
"Database privileges": "Привілеї бази даних"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Фактичні привілеї міграції, включно з активними ролями та правами на окремі об'єкти, не перевірено."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Попросіть адміністратора бази даних перевірити необхідні права запису в таблиці, зміни схеми, тригери та підпрограми для облікового запису встановлення й схеми. Не надавайте права глобального адміністратора."
"Compare web and worker runtimes": "Порівняти вебсередовище та середовище фонового обробника"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Це явно запускає коротку перевірку PHP лише для читання. Вона не резервує встановлювач, не записує файли та не звертається до пристроїв."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Перевірка успадковує цей вебпроцес і використовує налаштований інтерпретатор PHP встановлювача. Вона не перевіряє окремий планувальник або службу."
"I authorize the read-only worker runtime comparison.": "Я дозволяю порівняння середовища виконання обробника в режимі лише для читання."
"Compare runtimes": "Порівняти середовища виконання"
"Runtime comparison results": "Результати порівняння середовищ виконання"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Відмінності в правах та ідентичності можуть бути навмисними. Спостереження лише для читання не гарантують успішності запису чи встановлення."
"Confirm the read-only worker runtime comparison.": "Підтвердьте порівняння середовища виконання обробника в режимі лише для читання."
"The runtime comparison is unavailable.": "Порівняння середовищ виконання недоступне."
"Shared application secret": "Спільний секрет застосунку"
"A strong web application secret is required before comparison.": "Перед порівнянням потрібен надійний секрет вебзастосунку."
"Runtime comparison": "Порівняння середовищ виконання"
"The configured worker runtime did not confirm a bounded comparison.": "Налаштоване середовище виконання обробника не підтвердило обмежене порівняння."
"The inherited worker secret could not be confirmed against the web secret.": "Успадкований секрет обробника не вдалося підтвердити проти вебсекрету."
"PHP runtime comparison": "Порівняння середовищ виконання PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Обидва середовища виконання мають підтримувати PHP 8.4; відмінності патч-версій потребують перевірки."
"Required extension comparison": "Порівняння обов'язкових розширень"
"Required extension availability is checked; differing versions require review.": "Перевіряється наявність обов'язкових розширень; відмінності версій потребують перевірки."
"Process identity comparison": "Порівняння ідентичності процесів"
"Effective process identity is unavailable on this platform.": "Фактична ідентичність процесу недоступна на цій платформі."
"Effective process identities match.": "Фактичні ідентичності процесів збігаються."
"Effective process identities differ; separate service accounts may be intentional.": "Фактичні ідентичності процесів відрізняються; окремі службові облікові записи можуть бути навмисними."
"Directory access comparison": "Порівняння доступу до каталогів"
"Read-only directory permission observations match.": "Спостереження прав доступу до каталогів у режимі лише для читання збігаються."
"Directory locations or permission observations differ; review the service-account roles.": "Розташування каталогів або спостережені права відрізняються; перевірте ролі службових облікових записів."
"Worker directory read and traversal": "Читання та перехід каталогу обробника"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Обов'язкові каталоги обробника мають існувати та дозволяти читання і перехід. Запис не перевірявся."
"The inherited worker secret matches the web secret for this private challenge.": "Успадкований секрет обробника збігається з вебсекретом для цього приватного запиту."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Перевірте налаштований інтерпретатор PHP, обов'язкові розширення, успадкований секрет і права каталогів службового облікового запису. Запис або запуск встановлювача не виконувалися."
"advisory": "рекомендаційний"
