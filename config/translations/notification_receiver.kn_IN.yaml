"Notification receiver fields must contain valid single-line text.": "ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರ ಕ್ಷೇತ್ರಗಳು ಮಾನ್ಯ ಒಂದೇ ಸಾಲಿನ ಪಠ್ಯವನ್ನು ಹೊಂದಿರಬೇಕು."
"Notification receiver not found.": "ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರು ಕಂಡುಬಂದಿಲ್ಲ."
"Notification receiver saved.": "ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರನ್ನು ಉಳಿಸಲಾಗಿದೆ."
