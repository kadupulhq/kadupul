"SNMPv3 authentication and privacy passphrases require at least 8 bytes.": "SNMPv3 ದೃಢೀಕರಣ ಮತ್ತು ಗೋಪ್ಯತೆ ಪಾಸ್‌ಫ್ರೇಸ್‌ಗಳಿಗೆ ಕನಿಷ್ಠ 8 ಬೈಟ್‌ಗಳು ಬೇಕು."
"SNMPv3 privacy also requires authentication.": "SNMPv3 ಗೋಪ್ಯತೆಗೆ ದೃಢೀಕರಣವೂ ಅಗತ್ಯ."
"SNMPv3 requires a username and an engine ID.": "SNMPv3 ಗೆ ಬಳಕೆದಾರಹೆಸರು ಮತ್ತು ಎಂಜಿನ್ ID ಅಗತ್ಯ."
"Save": "ಉಳಿಸಿ"
"Save outcome is uncertain. Reload before retrying.": "ಉಳಿಸುವಿಕೆಯ ಫಲಿತಾಂಶ ಖಚಿತವಿಲ್ಲ. ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಮರುಲೋಡ್ ಮಾಡಿ."
"Select a supported notification receiver setting.": "ಬೆಂಬಲಿತ ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರ ಸೆಟ್ಟಿಂಗ್ ಅನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Select supported notification receiver settings.": "ಬೆಂಬಲಿತ ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರ ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿ."
"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "SNMPv3 ದೃಢೀಕರಣ ಅಥವಾ ಗೋಪ್ಯತೆ ಪ್ರೋಟೋಕಾಲ್ ಅನ್ನು ಅದರ ಪಾಸ್‌ಫ್ರೇಸ್‌ನೊಂದಿಗೆ ಹೊಂದಿಸಿ."
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "ಸಂಗ್ರಹಿಸಿದ ರುಜುವಾತುಗಳನ್ನು ಎಂದಿಗೂ ಪ್ರದರ್ಶಿಸುವುದಿಲ್ಲ. ಅವುಗಳನ್ನು ಬದಲಾಯಿಸಿದರೆ ನಾಲ್ಕೂ ರುಜುವಾತು ಕ್ಷೇತ್ರಗಳು ಹೊಂದಿಸಲ್ಪಡುತ್ತವೆ; SNMP ಆವೃತ್ತಿ 3 ಅನ್ನು ಬಿಟ್ಟರೆ ಅದರ ಬಳಕೆದಾರಹೆಸರು ಮತ್ತು ಪಾಸ್‌ಫ್ರೇಸ್‌ಗಳು ಅಳಿಸಲ್ಪಡುತ್ತವೆ."
"Submit every notification receiver field.": "ಪ್ರತಿ ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರ ಕ್ಷೇತ್ರವನ್ನು ಸಲ್ಲಿಸಿ."
"The notification receiver changed since you opened this form. Reload before saving.": "ನೀವು ಈ ಫಾರ್ಮ್ ಅನ್ನು ತೆರೆದ ನಂತರ ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರು ಬದಲಾಗಿದೆ. ಉಳಿಸುವ ಮೊದಲು ಮರುಲೋಡ್ ಮಾಡಿ."
"The passphrases do not match.": "ಪಾಸ್‌ಫ್ರೇಸ್‌ಗಳು ಹೊಂದುತ್ತಿಲ್ಲ."
"Unable to load the notification receiver. Reload before retrying.": "ಅಧಿಸೂಚನೆ ಸ್ವೀಕರಿಸುವವರನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಮರುಲೋಡ್ ಮಾಡಿ."
"Unexpected fields were submitted.": "ಅನಿರೀಕ್ಷಿತ ಕ್ಷೇತ್ರಗಳನ್ನು ಸಲ್ಲಿಸಲಾಗಿದೆ."
