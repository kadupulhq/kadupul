"A useful name for this Rule.": "Isang kapaki-pakinabang na pangalan para sa Panuntunang ito."
"Access denied.": "Tinanggihan ang access."
"Add Graph Rule": "Magdagdag ng Graph Rule"
"Back to Graph Rules": "Bumalik sa Mga Graph Rule"
"Cancel": "Kanselahin"
"Check this box to enable this rule.": "I-check ang kahon na ito upang i-enable ang panuntunang ito."
"Choose a Data Query to apply to this rule.": "Pumili ng Data Query na ia-apply sa panuntunang ito."
"Choose a Graph Type": "Pumili ng Uri ng Graph"
"Choose a Graph Type of the selected Data Query.": "Pumili ng Uri ng Graph ng napiling Data Query."
"Choose an existing Data Query.": "Pumili ng umiiral na Data Query."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Pumili ng alinman sa mga available na Uri ng Graph ng napiling Data Query na ilalapat sa rule na ito."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "I-click ang Magpatuloy upang burahin ang mga sumusunod na Graph Rule kasama ang kanilang Device Selection at Graph Creation Criteria."
"Click Continue to disable the following Graph Rules.": "I-click ang Magpatuloy upang i-disable ang mga sumusunod na Graph Rule."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "I-click ang Magpatuloy upang i-duplicate ang mga sumusunod na Graph Rule. Maaari mong baguhin ang format ng pamagat para sa mga bagong Graph Rule, na magsisimulang naka-disable."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "I-click ang Magpatuloy upang i-enable ang mga sumusunod na Graph Rule. Tiyaking matagumpay na nasubukan ang mga ito."
"Continue": "Magpatuloy"
"Data Query": "Data Query"
"Delete Graph Rules": "Burahin ang Mga Graph Rule"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pagbura. Suriin ang listahan ng Graph Rule bago muling subukan."
"Delete selected": "Burahin ang napili"
"Device Selection and Graph Creation Criteria": "Device Selection at Graph Creation Criteria"
"Disable Graph Rules": "I-disable ang Mga Graph Rule"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pag-disable. Suriin ang listahan ng Graph Rule bago muling subukan."
"Disable selected": "I-disable ang napili"
"Duplicate Graph Rules": "I-duplicate ang Mga Graph Rule"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pag-duplicate. Suriin ang listahan ng Graph Rule bago muling subukan."
"Duplicate selected": "I-duplicate ang napili"
"Edit Graph Rule": "I-edit ang Graph Rule"
"Enable Graph Rules": "I-enable ang Mga Graph Rule"
"Enable Rule": "I-enable ang Panuntunan"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pag-enable. Suriin ang listahan ng Graph Rule bago muling subukan."
"Enable selected": "I-enable ang napili"
"Enter a name.": "Maglagay ng pangalan."
"Enter a valid name format.": "Maglagay ng wastong format ng pangalan."
"Enter at most %count% characters.": "Maglagay ng hindi hihigit sa %count% karakter."
"Enter single-line text.": "Maglagay ng tekstong isang linya."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Papalitan ng pangalan ng kinokopyang Graph Rule ang bawat <rule_name>."
"Graph Type": "Uri ng Graph"
"Graph rule not found.": "Hindi nakita ang graph rule."
"Graph rule saved.": "Na-save ang graph rule."
"Invalid Graph Rule selection.": "Di-wastong pagpili ng Graph Rule."
"Name": "Pangalan"
"One or more selected Graph Rules no longer exist.": "Ang isa o higit pa sa mga napiling Graph Rule ay wala na."
"Rule Selection [edit: %name%]": "Pagpili ng Rule [i-edit: %name%]"
"Rule Selection [new]": "Pagpili ng Rule [bago]"
"Save": "I-save"
"Save outcome is uncertain. Reload before retrying.": "Hindi tiyak ang kinalabasan ng pag-save. I-reload bago muling subukan."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "I-save muna ang rule; idaragdag pagkatapos ang Device Selection at Graph Creation Criteria nito."
"Select": "Piliin"
"Select %name%": "Piliin ang %name%"
"Select at least one Graph Rule.": "Pumili ng kahit isang Graph Rule."
"Select at most 100 Graph Rules at a time.": "Pumili ng hindi hihigit sa 100 Graph Rule sa isang pagkakataon."
"Select up to %count% rows at a time.": "Pumili ng hanggang %count% hilera sa isang pagkakataon."
"The graph rule changed since you opened this form. Reload before saving.": "Nagbago ang graph rule mula nang buksan mo ang form na ito. I-reload bago mag-save."
"The name format must give every copy a name of 1 to 255 characters.": "Dapat magbigay ang format ng pangalan ng pangalang 1 hanggang 255 karakter sa bawat kopya."
"Title Format": "Format ng Pamagat"
"Unable to load Graph Rules. Reload before retrying.": "Hindi ma-load ang mga Graph Rule. I-reload bago muling subukan."
"Unable to load the graph rule. Reload before retrying.": "Hindi ma-load ang graph rule. I-reload bago muling subukan."
"Unexpected fields were submitted.": "May mga hindi inaasahang field na naisumite."
