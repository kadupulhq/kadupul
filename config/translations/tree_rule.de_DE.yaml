"Graph Grouping Style": "Gruppierungsstil für Graphen"
"Graph Template": "Graph-Vorlage"
"Leaf Item Type": "Blattartikeltyp"
"Name": "Name"
"Object Selection and Tree Creation Criteria": "Kriterien für Objektauswahl und Baumerstellung"
"Optional: Sub-Tree Item": "Optional: Teilbaumelement"
"Remove graph-based criteria": "Graphbasierte Kriterien entfernen"
"Save": "Speichern"
"Save outcome is uncertain. Reload before retrying.": "Das Speicherergebnis ist ungewiss. Vor einem erneuten Versuch neu laden."
