"The Item Type that shall be dynamically added to the tree.": "Der Elementtyp, der dem Baum dynamisch hinzugefügt werden soll."
"The tree rule changed since you opened this form. Reload before saving.": "Die Baumregel wurde geändert, seit Sie dieses Formular geöffnet haben. Vor dem Speichern neu laden."
