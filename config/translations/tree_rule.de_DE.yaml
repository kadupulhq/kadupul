"A useful name for this Rule.": "Ein nützlicher Name für diese Regel."
"Access denied.": "Zugriff verweigert."
"Add Tree Rule": "Baumregel hinzufügen"
"Back to Tree Rules": "Zurück zu den Baumregeln"
"Check this box to enable this rule.": "Aktivieren Sie dieses Kontrollkästchen, um diese Regel zu aktivieren."
"Choose a Tree for the new Tree Items.": "Wählen Sie einen Baum für die neuen Baumelemente aus."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Wählen Sie eine Überschrift des ausgewählten Baums zum Einhängen oder dessen Wurzel. Stellen Sie sicher, dass sie bei Ausführung dieser Regel noch existiert."
"Choose a header of the selected Tree.": "Wählen Sie eine Überschrift des ausgewählten Baums aus."
"Choose a listed Graph Grouping Style.": "Wählen Sie einen aufgeführten Graph-Gruppierungsstil aus."
"Choose a listed Leaf Item Type.": "Wählen Sie einen aufgeführten Blattelementtyp aus."
"Choose an existing Tree.": "Wählen Sie einen vorhandenen Baum aus."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Wählen Sie aus, wie Graphen für diesen Host im Baum beim Zeichnen gruppiert werden. Wird für Geräte-Blätter verwendet."
"Data Query Index": "Index der Datenabfrage"
"Device": "Gerät"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Geräte-Blätter können keine Kriterien für Graph- oder Graph-Vorlagen-Spalten verwenden. Aktivieren Sie beim Ändern des Blattelementtyps auf „Gerät“ dieses Kontrollkästchen, um diese Kriterien zu entfernen; sie können nicht wiederhergestellt werden."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Geräte-Blätter können keine graphbasierten Kriterien verwenden. Bestätigen Sie zum Speichern das Entfernen von %count% Kriterien."
"Edit Tree Rule": "Baumregel bearbeiten"
"Enable Rule": "Regel aktivieren"
"Enter a name.": "Geben Sie einen Namen ein."
"Enter at most %count% characters.": "Geben Sie höchstens %count% Zeichen ein."
"Enter single-line text.": "Geben Sie einzeiligen Text ein."
