"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Ово је јединствен низ који ће се поредити са sysDescr низом уређаја ради упаривања са овим шаблоном аутоматизације.  Може се користити било који Perl регуларни израз, као и било који SQL Where израз."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Ово је јединствен низ који ће се поредити са sysName низом уређаја ради упаривања са овим шаблоном аутоматизације.  Може се користити било који Perl регуларни израз, као и било који SQL Where израз."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Ово је јединствен низ који ће се поредити са sysOid низом уређаја ради упаривања са овим шаблоном аутоматизације.  Може се користити било који Perl регуларни израз, као и било који SQL Where израз."
