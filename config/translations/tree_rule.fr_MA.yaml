"A useful name for this Rule.": "Un nom utile pour cette règle."
"Access denied.": "Accès refusé."
"Add Tree Rule": "Ajouter une règle d’arbre"
"Back to Tree Rules": "Retour aux règles d’arbre"
"Cancel": "Annuler"
"Check this box to enable this rule.": "Cochez cette case pour activer cette règle."
"Choose a Tree for the new Tree Items.": "Choisissez une arborescence pour les nouveaux éléments d'arborescence."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Choisissez un en-tête de l’arbre sélectionné auquel rattacher les éléments, ou sa racine. Vérifiez qu’il existe toujours lorsque cette règle s’exécute."
"Choose a header of the selected Tree.": "Choisissez un en-tête de l’arbre sélectionné."
"Choose a listed Graph Grouping Style.": "Choisissez un style de regroupement de graphiques de la liste."
"Choose a listed Leaf Item Type.": "Choisissez un type d’élément feuille de la liste."
"Choose an existing Tree.": "Choisissez un arbre existant."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Choisissez comment les graphiques sont regroupés lorsqu’ils sont tracés pour cet hôte dans l’arbre. Utilisé pour les feuilles de type Équipement."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Cliquez sur Continuer pour supprimer les règles d’arbre suivantes avec leurs critères de sélection d’objets et de création d’arbre."
"Click Continue to disable the following Tree Rules.": "Cliquez sur Continuer pour désactiver les règles d’arbre suivantes."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Cliquez sur Continuer pour dupliquer les règles d’arbre suivantes. Vous pouvez modifier facultativement le format du titre des nouvelles règles d’arbre, qui sont créées désactivées."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Cliquez sur Continuer pour activer les règles d’arbre suivantes. Assurez-vous qu’elles ont été testées avec succès."
"Continue": "Continuer"
"Data Query Index": "Index de requête de données"
"Delete Tree Rules": "Supprimer des règles d’arbre"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Le résultat de la suppression est incertain. Vérifiez la liste des règles d’arbre avant de réessayer."
"Delete selected": "Supprimer la sélection"
"Device": "Équipement"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Les feuilles de type Équipement ne peuvent pas utiliser de critères sur les colonnes des graphiques ou des modèles de graphique. Lorsque vous passez le type d’élément feuille à Équipement, cochez cette case pour supprimer ces critères ; ils ne pourront pas être récupérés."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Les feuilles de type Équipement ne peuvent pas utiliser de critères basés sur les graphiques. Confirmez la suppression de %count% critères pour enregistrer."
"Disable Tree Rules": "Désactiver des règles d’arbre"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Le résultat de la désactivation est incertain. Vérifiez la liste des règles d’arbre avant de réessayer."
"Disable selected": "Désactiver la sélection"
"Duplicate Tree Rules": "Dupliquer des règles d’arbre"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Le résultat de la duplication est incertain. Vérifiez la liste des règles d’arbre avant de réessayer."
"Duplicate selected": "Dupliquer la sélection"
"Edit Tree Rule": "Modifier la règle d’arbre"
"Enable Rule": "Activer la règle"
"Enable Tree Rules": "Activer des règles d’arbre"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Le résultat de l’activation est incertain. Vérifiez la liste des règles d’arbre avant de réessayer."
"Enable selected": "Activer la sélection"
"Enter a name.": "Saisissez un nom."
"Enter a valid name format.": "Saisissez un format de nom valide."
"Enter at most %count% characters.": "Saisissez au plus %count% caractères."
"Enter single-line text.": "Saisissez un texte sur une seule ligne."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Chaque <rule_name> est remplacé par le nom de la règle d’arbre copiée."
"Graph": "Graphique"
"Graph Grouping Style": "Style de regroupement de graphiques"
"Graph Template": "Modèle de graphique"
"Invalid Tree Rule selection.": "Sélection de règles d’arbre non valide."
"Leaf Item Type": "Type d'élément feuille"
"Name": "Nom"
"Object Selection and Tree Creation Criteria": "Critères de sélection d’objets et de création d’arbres"
"One or more selected Tree Rules no longer exist.": "Une ou plusieurs règles d’arbre sélectionnées n’existent plus."
"Optional: Sub-Tree Item": "Facultatif : Élément de sous-arborescence"
"Remove graph-based criteria": "Supprimer les critères basés sur les graphiques"
"Save": "Enregistrer"
"Save outcome is uncertain. Reload before retrying.": "Le résultat de l’enregistrement est incertain. Rechargez avant de réessayer."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Enregistrez d’abord la règle ; ses critères de sélection d’objets et de création d’arbres s’ajoutent ensuite."
"Select": "Sélectionner"
"Select %name%": "Sélectionner %name%"
"Select at least one Tree Rule.": "Sélectionnez au moins une règle d’arbre."
"Select at most 100 Tree Rules at a time.": "Sélectionnez au plus 100 règles d’arbre à la fois."
"Select up to %count% rows at a time.": "Sélectionnez jusqu’à %count% lignes à la fois."
"The Item Type that shall be dynamically added to the tree.": "Le type d'élément qui doit être ajouté dynamiquement à l'arborescence."
"The name format must give every copy a name of 1 to 255 characters.": "Le format de nom doit donner à chaque copie un nom de 1 à 255 caractères."
"The tree rule changed since you opened this form. Reload before saving.": "La règle d’arbre a été modifiée depuis l’ouverture de ce formulaire. Rechargez avant d’enregistrer."
"Title Format": "Format du titre"
"Tree": "Arbre"
"Tree Rule Selection [edit: %name%]": "Sélection de règle d'arborescence [modifier : %name%]"
"Tree Rules Selection [new]": "Sélection de règles d’arbre [nouvelle]"
"Tree rule not found.": "Règle d’arbre introuvable."
"Tree rule saved.": "Règle d’arbre enregistrée."
"Unable to load Tree Rules. Reload before retrying.": "Impossible de charger les règles d’arbre. Rechargez avant de réessayer."
"Unable to load the tree rule. Reload before retrying.": "Impossible de charger la règle d’arbre. Rechargez avant de réessayer."
"Unexpected fields were submitted.": "Des champs inattendus ont été soumis."
