"When discovering devices, allow duplicate sysnames to be added on different hosts": "ডিভাইস ডিসকভার করার সময়, বিভিন্ন হোস্টে ডুপ্লিকেট sysName যোগ করার অনুমতি দিন"
"You must specify both the Months and Days of Month.": "আপনাকে অবশ্যই মাস এবং মাসের দিন উভয়ই নির্দিষ্ট করতে হবে।"
"You must specify the Months, Weeks of Months, and Days of Week.": "আপনাকে অবশ্যই মাস, মাসের সপ্তাহ এবং সপ্তাহের দিন নির্দিষ্ট করতে হবে।"
"You must specify the day of the week.": "আপনাকে অবশ্যই সপ্তাহের দিন নির্দিষ্ট করতে হবে।"
