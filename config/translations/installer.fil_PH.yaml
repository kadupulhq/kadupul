"Action": "Aksyon"
"Advanced options": "Mga advanced na opsyon"
"Applying database upgrades": "Paglalapat ng mga pag-upgrade ng database"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "I-back up ang database, mga RRD file, configuration at mga key. Maaaring mag-commit ang mga pag-upgrade ng database ng mga pagbabagong hindi maibabalik ng application rollback."
"Blocked": "Naka-block"
"Check": "Suriin"
"Check again": "Suriing muli"
"Check collection freshness and collector connectivity before enabling discovery.": "Suriin ang kasariwaan ng koleksyon at koneksyon ng collector bago i-enable ang discovery."
"Check requirements": "Suriin ang mga kinakailangan"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Sinusuri ng mga pagsusuri ang prosesong ito at mga pahintulot ng filesystem. Hindi sila sumusulat ng mga test file o nakikipag-ugnayan sa mga device."
"Collection profile": "Profile ng koleksyon"
"Collector": "Tagakolekta"
"Configure": "I-configure"
"Configuring collection profiles": "Pagko-configure ng mga profile ng koleksyon"
"Configuring discovery": "Pagko-configure ng discovery"
"Configuring the local device": "Pagko-configure ng lokal na device"
"Confirming database version": "Kinukumpirma ang bersyon ng database"
"Converting selected tables": "Kino-convert ang mga napiling table"
"Database version": "Bersyon ng database"
"Disabled": "Naka-disable"
"Discovery": "Pagtuklas"
"Discovery SNMP settings": "Mga SNMP setting ng discovery"
"Discovery range": "Range ng discovery"
"Enable discovery after installation": "I-enable ang discovery pagkatapos ng installation"
"Executable paths": "Mga path ng executable"
"Execution status": "Katayuan ng execution"
"Finished execution": "Natapos ang execution"
"Finishing tasks only. Schema migrations will not be replayed.": "Mga finishing task lamang. Hindi na uulitin ang mga schema migration."
"I accept the license terms": "Tinatanggap ko ang mga tuntunin ng lisensya"
"I authorize discovery of the displayed range": "Pinahihintulutan ko ang discovery ng ipinapakitang range"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Sinuri ko ang log at kinumpirma kong huminto na ang nakaraang worker at ang mga child process nito"
"I checked the previous attempt and accept that some changes may already be committed": "Sinuri ko ang nakaraang pagtatangka at tinatanggap kong maaaring na-commit na ang ilang pagbabago"
"I reviewed this plan and have the required backups": "Nasuri ko ang planong ito at mayroon akong kinakailangang mga backup"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Kung biglang huminto ang isang worker, panatilihin ang log/cacti.log at kumpirmahing natapos na ang proseso nito bago tahasang muling subukan. Hindi kinukumpirma ng estado ng paghihintay ang matagumpay na paglulunsad."
"Importing templates": "Ini-import ang mga template"
"Install Kadupul": "I-install ang Kadupul"
"Installation and upgrade": "Installation at upgrade"
"Installation request was rejected.": "Tinanggihan ang kahilingan sa installation."
"Installation steps": "Mga hakbang ng installation"
"Installed": "Naka-install"
"Keep a backup of the database, RRD files, configuration and secret material.": "Magtabi ng backup ng database, mga RRD file, configuration at secret material."
"Language": "Wika"
"Large tables may require the dedicated CLI conversion tool before installation.": "Maaaring mangailangan ang malalaking table ng nakalaang CLI conversion tool bago ang installation."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Iwanang blangko ang mga secret field upang mapanatili ang mga nakaimbak na kredensyal. Hindi kailanman ipinapakita muli ang mga secret."
"License": "Lisensya"
"No action needed": "Walang kailangang gawin"
"Observed": "Naobserbahan"
"Open the console": "Buksan ang console"
"Operation": "Operasyon"
"Override discovery SNMP settings": "I-override ang mga SNMP setting ng discovery"
"Pass": "Pasado"
"Poller interval in seconds": "Poller interval sa segundo"
"Preparing CSRF protection": "Inihahanda ang proteksyon ng CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Ipinapakita ng progress ang huling naitalang yugto. Hindi kailanman nagsisimula o muling sumusubok ng worker ang pag-refresh ng pahinang ito."
"Recover stopped attempt": "I-recover ang huminto na pagtatangka"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Pinapanatili ng recovery ang mga naka-save na pinili at hindi kailanman winawakasan ang isang buhay na worker. Suriin muli ang plano bago muling subukan."
"Review": "Suriin"
"Review installation plan": "Suriin ang plano ng installation"
"Run": "Patakbuhin"
"Run reviewed plan": "Patakbuhin ang nasuring plano"
"Save and review": "I-save at suriin"
"Scope": "Saklaw"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Hindi available ang katayuan. Pinapanatili ang naka-save na gawa. Mag-refresh upang muling kumonekta; huwag magsumite ng isa pang installation."
"Synchronizing collectors": "Sini-synchronize ang mga collector"
"Table conversions": "Mga conversion ng table"
"Templates": "Mga Template"
"The database version matches this application. Installation does not establish that polling is healthy.": "Tumutugma ang bersyon ng database sa application na ito. Hindi nito itinatatag na malusog ang polling ang installation."
"The request outcome is unknown. Check execution status before retrying.": "Hindi alam ang kinalabasan ng kahilingan. Suriin ang katayuan ng execution bago muling subukan."
"Theme": "Tema"
"Verify": "I-verify"
"Verify the poller schedule and service account.": "I-verify ang iskedyul ng poller at service account."
"Version change": "Pagbabago ng bersyon"
"Waiting for the installation worker": "Naghihintay sa installation worker"
"collector": "tagakolekta"
"complete": "kumpleto"
"failed": "nabigo"
"finish": "tapusin"
"install": "i-install"
"not_started": "Hindi pa nagsimula"
"partial": "bahagya"
"running": "tumatakbo"
"succeeded": "nagtagumpay"
"upgrade": "i-upgrade"
"waiting": "naghihintay"
"Accept the license before saving the installation plan.": "Tanggapin ang lisensya bago i-save ang plano ng installation."
"Invalid installation form.": "Di-wastong form ng installation."
"Access denied.": "Tinanggihan ang access."
"Confirm the recovery warning before retrying.": "Kumpirmahin ang babala sa recovery bago muling subukan."
"Review and confirm the current installation plan.": "Suriin at kumpirmahin ang kasalukuyang plano ng installation."
"Confirm the discovery scope before starting.": "Kumpirmahin ang saklaw ng discovery bago magsimula."
"Resolve the blocking checks before starting.": "Lutasin ang mga humaharang na pagsusuri bago magsimula."
"Too many installer options.": "Masyadong maraming opsyon ng installer."
"Invalid installer option name.": "Di-wastong pangalan ng opsyon ng installer."
"Unknown or malformed installer option.": "Hindi kilala o maling anyo ang opsyon ng installer."
"Installer options must be scalar values.": "Dapat scalar na halaga ang mga opsyon ng installer."
"Installer option is too long or contains a null byte.": "Masyadong mahaba ang opsyon ng installer o naglalaman ito ng null byte."
"Installer IDs and intervals must be whole numbers.": "Dapat buong numero ang mga ID at interval ng installer."
"Installer ID or interval is outside its supported range.": "Wala sa sinusuportahang saklaw ang ID o interval ng installer."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Hindi makapagpatuloy ang installation. I-reload ang katayuan nito at suriin ang mga humaharang na pagsusuri bago muling subukan."
"Confirm that the previous worker has stopped before recovering its plan.": "Kumpirmahing huminto na ang nakaraang worker bago i-recover ang plano nito."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Naka-install na ang database, ngunit kailangan pa ring i-synchronize ang ilang collector. Subukang muli ang mga finishing task pagkatapos suriin ang katayuan ng mga ito."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Huminto ang installation. Panatilihin ang log ng installer, itama ang sanhi at tahasang kumpirmahin ang muling pagsubok. Maaaring na-commit na ang ilang pagbabago sa database. Suriin ang plugin cleanup bago pahintulutan ang muling pagsubok."
"Next action": "Susunod na aksyon"
"Follow the execution status. Do not start another attempt while a worker is active.": "Sundan ang katayuan ng execution. Huwag magsimula ng isa pang pagtatangka habang aktibo ang isang worker."
"Complete the recovery checklist before retrying.": "Kumpletuhin ang checklist ng recovery bago muling subukan."
"Verify collection and graph operation before enabling discovery.": "I-verify ang operasyon ng koleksyon at graph bago i-enable ang discovery."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Lutasin ang mga naka-block na kinakailangan, pagkatapos ay suriing muli. Pinapanatili ang mga naka-save na pinili."
"Review the planned changes and backup checklist before authorizing execution.": "Suriin ang mga nakaplanong pagbabago at checklist ng backup bago pahintulutan ang execution."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Pumili ng profile ng koleksyon at tanggapin ang lisensya. Maaaring buksan ang mga opsyonal na setting kapag kailangan."
"Download installation diagnostics": "I-download ang diagnostics ng installation"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Magbukas ng graph at kumpirmahing nag-a-update ang RRD data nito pagkatapos ng isang cycle ng poller."
"Requirement details": "Mga detalye ng kinakailangan"
"Recover": "I-recover"
"Recovery checklist": "Checklist ng recovery"
"Preserve log/cacti.log and record the failed attempt.": "Panatilihin ang log/cacti.log at itala ang nabigong pagtatangka."
"Confirm that the previous worker and its child processes have stopped.": "Kumpirmahing huminto na ang nakaraang worker at ang mga child process nito."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Suriin ang mga na-commit na pagbabago, synchronization ng collector at plugin cleanup. Itama ang sanhi bago muling subukan."
"Review the saved plan again, then explicitly authorize a retry.": "Suriing muli ang naka-save na plano, pagkatapos ay tahasang pahintulutan ang muling pagsubok."
"Recover a stopped worker": "I-recover ang huminto na worker"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Gamitin lamang ang recovery pagkatapos kumpirmahing hindi na tumatakbo ang pagtatangkang ito. Hindi nito pinipigil ang proseso."
"Collector and installation mode": "Mode ng collector at installation"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Tinutukoy ng configuration ng deployment ang papel ng collector at mga koneksyon sa database. I-verify ang configuration ng pangunahing server bago magsimula ng collector."
"Discovery and SNMP settings": "Mga setting ng discovery at SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Panatilihing naka-disable ang discovery hanggang ma-verify ang koleksyon at koneksyon ng collector."
"Template selection": "Pagpili ng template"
"Templates selected for import": "Mga template na napili para sa import"
"No templates selected.": "Walang napiling template."
"Backup checklist": "Checklist ng backup"
"Database backup and a tested restoration procedure.": "Backup ng database at nasubukang pamamaraan ng restoration."
"RRD files and the service account permissions needed to restore them.": "Mga RRD file at mga pahintulot ng service account na kailangan upang maibalik ang mga ito."
"Configuration, keys and plugin data outside the database.": "Configuration, mga key at plugin data sa labas ng database."
"Post-installation checks": "Mga pagsusuri pagkatapos ng installation"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Sumasaklaw lamang ang mga na-verify na pagsusuri sa ebidensyang ipinapakita. Kailangan pa ring i-verify ng operator ang mga hindi nasuri."
"Operational checks still require operator verification.": "Kailangan pa ring i-verify ng operator ang mga operational na pagsusuri."
"Status": "Katayuan"
"verified": "Na-verify"
"action_required": "Kailangan ng aksyon"
"not_assessed": "Hindi pa nasusuri"
"Database schema": "Schema ng database"
"Stored schema matches the application target.": "Tumutugma ang naka-imbak na schema sa target ng application."
"Target schema completion has not been confirmed.": "Hindi pa nakukumpirma ang pagkumpleto ng target na schema."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Suriin ang kinalabasan ng installation at lutasin ang mga pagkabigo bago ituring na kumpleto ang pag-upgrade ng schema."
"Installation outcome": "Kinalabasan ng installation"
"A successful receipt matches the current target schema.": "Tumutugma ang matagumpay na resibo sa kasalukuyang target na schema."
"A complete successful installation outcome has not been confirmed.": "Hindi pa nakukumpirma ang kumpleto at matagumpay na kinalabasan ng installation."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Panatilihin ang log ng installer at gamitin ang tahasang pamamaraan ng recovery o muling pagsubok kapag kinakailangan."
"Collector synchronization": "Synchronization ng collector"
"The completed installer reports pending collector synchronization.": "Iniuulat ng natapos na installer ang nakabinbing synchronization ng collector."
"The completed installer reports no pending collectors.": "Iniuulat ng natapos na installer na walang nakabinbing collector."
"Collector completion remains unconfirmed by this partial receipt.": "Nananatiling hindi nakumpirma ng bahagyang resibong ito ang pagkumpleto ng collector."
"Collector completion is not established by this installation outcome.": "Hindi itinatatag ng kinalabasang ito ng installation ang pagkumpleto ng collector."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Suriin ang katayuan ng collector at subukang muli ang mga finishing task para sa mga bahagyang kinalabasan. Hindi nito vine-verify ang kasariwaan ng susunod na koleksyon."
"Scheduled collection": "Naka-iskedyul na koleksyon"
"No poller or device was contacted by this assessment.": "Walang poller o device na nakontak ng pagtatasang ito."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Kumpirmahing pinapatakbo ng naka-configure na scheduler ang poller bilang nilalayong service account at suriin ang susunod nitong normal na cycle."
"Graph data": "Data ng graph"
"Live samples and RRD updates were not exercised.": "Hindi sinubukan ang mga live na sample at RRD update."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Pagkatapos ng normal na cycle ng koleksyon, kumpirmahing nakakatanggap ng sariwang sample ang mga inaasahang graph at suriin ang mga error ng poller."
"Recovery readiness": "Kahandaan sa recovery"
"Backup restoration was not exercised.": "Hindi sinubukan ang backup restoration."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "I-verify ang nakahiwalay na restore ng database, mga RRD file, configuration at key material bago umasa sa recovery."
"No persisted local poller start has been recorded.": "Walang naitalang persisted na lokal na simula ng poller."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Di-wasto ang persisted na timing ng poller at hindi nito maitatatag ang kalusugan ng scheduler."
"The recorded poller start is in the future. Check clock synchronization.": "Nasa hinaharap ang naitalang simula ng poller. Suriin ang clock synchronization."
"The recorded poller start is older than the native scheduling tolerance.": "Mas luma ang naitalang simula ng poller kaysa sa native na tolerance ng pag-iskedyul."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "May naitalang lokal na simula ng poller sa loob ng native na tolerance ng pag-iskedyul. Hindi na-verify ang pagkumpleto at kalusugan ng device."
"readable": "nababasa"
"missing or unreadable": "nawawala o hindi mabasa"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Ibalik ang kumpletong release at ang mga naka-lock na dependency nito; bigyan ng read access ang service account."
"PHP temporary directory": "Pansamantalang directory ng PHP"
"directory writable by this process": "directory na maisusulat ng prosesong ito"
"missing or not writable": "nawawala o hindi maisusulat"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "I-configure ang sys_temp_dir bilang umiiral na directory na maisusulat ng account ng installation. Gumagamit ng pansamantalang file ang mga native import."
"Background worker launch": "Paglulunsad ng background worker"
"required PHP functions available; launch not exercised": "available ang mga kinakailangang PHP function; hindi sinubukan ang paglulunsad"
"required PHP launch function disabled": "naka-disable ang kinakailangang PHP launch function"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "I-enable ang exec para sa web PHP runtime, o gamitin ang awtorisadong CLI installer."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "I-enable ang popen, pclose para sa web PHP runtime, o gamitin ang awtorisadong CLI installer."
"Database transaction ownership": "Pagmamay-ari ng database transaction"
"autocommit enabled; no caller-owned transaction": "naka-enable ang autocommit; walang transaksyong pag-aari ng caller"
"autocommit disabled or caller transaction active": "naka-disable ang autocommit o aktibo ang transaksyon ng caller"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Patakbuhin ang installation sa labas ng transaksyong pag-aari ng caller at i-enable ang autocommit sa mutation connection nito."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Ibalik ang release directory at bigyan ng write access ang account ng installation para sa mga template resource import. Huwag itong gawing writable ng lahat."
"Worker file: install/background.php": "File ng worker: install/background.php"
"Worker file: bin/legacy-installer.php": "File ng worker: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "File ng worker: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destinasyon ng import: resource/snmp_queries"
"Import destination: resource/script_server": "Destinasyon ng import: resource/script_server"
"Import destination: resource/script_queries": "Destinasyon ng import: resource/script_queries"
"Import destination: scripts": "Destinasyon ng import: scripts"
"Database privileges": "Mga pribilehiyo ng database"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Hindi na-verify ang mga epektibong pribilehiyo sa migration, kabilang ang mga aktibong role at grant na partikular sa object."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Ipa-verify sa administrator ng database ang kinakailangang table write, pagbabago ng schema, trigger at routine para sa account ng installation at schema. Huwag magbigay ng pangglobal na pribilehiyo ng administrator."
"Compare web and worker runtimes": "Ihambing ang mga runtime ng web at worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tahasan nitong sinisimulan ang isang maikling read-only na PHP probe. Hindi ito nagre-reserve ng installer, nagsusulat ng mga file o nakikipag-ugnayan sa mga device."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Minamana ng probe ang web process na ito at ginagamit ang naka-configure na PHP interpreter ng installer. Hindi nito sinusuri ang hiwalay na scheduler o serbisyo."
"I authorize the read-only worker runtime comparison.": "Pinahihintulutan ko ang read-only na paghahambing ng runtime ng worker."
"Compare runtimes": "Ihambing ang mga runtime"
"Runtime comparison results": "Mga resulta ng paghahambing ng runtime"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Maaaring sinadya ang mga pagkakaiba sa pahintulot at pagkakakilanlan. Hindi pinatutunayan ng mga read-only na obserbasyon na magtatagumpay ang mga write o installation."
"Confirm the read-only worker runtime comparison.": "Kumpirmahin ang read-only na paghahambing ng runtime ng worker."
"The runtime comparison is unavailable.": "Hindi available ang paghahambing ng runtime."
"Shared application secret": "Ibinahaging secret ng application"
"A strong web application secret is required before comparison.": "Kailangan ng matibay na secret ng web application bago ang paghahambing."
"Runtime comparison": "Paghahambing ng runtime"
"The configured worker runtime did not confirm a bounded comparison.": "Hindi nakumpirma ng naka-configure na runtime ng worker ang may hangganang paghahambing."
"The inherited worker secret could not be confirmed against the web secret.": "Hindi makumpirma ang minanang secret ng worker laban sa web secret."
"PHP runtime comparison": "Paghahambing ng PHP runtime"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Dapat suportahan ng parehong runtime ang PHP 8.4; kailangang suriin ang magkakaibang patch version."
"Required extension comparison": "Paghahambing ng kinakailangang extension"
"Required extension availability is checked; differing versions require review.": "Sinusuri ang availability ng kinakailangang extension; kailangang suriin ang magkakaibang bersyon."
"Process identity comparison": "Paghahambing ng pagkakakilanlan ng proseso"
"Effective process identity is unavailable on this platform.": "Hindi available ang epektibong pagkakakilanlan ng proseso sa platform na ito."
"Effective process identities match.": "Magkapareho ang mga epektibong pagkakakilanlan ng proseso."
"Effective process identities differ; separate service accounts may be intentional.": "Magkaiba ang mga epektibong pagkakakilanlan ng proseso; maaaring sinadya ang magkahiwalay na service account."
"Directory access comparison": "Paghahambing ng access sa directory"
"Read-only directory permission observations match.": "Magkapareho ang mga read-only na obserbasyon ng pahintulot sa directory."
"Directory locations or permission observations differ; review the service-account roles.": "Magkaiba ang mga lokasyon ng directory o obserbasyon ng pahintulot; suriin ang mga papel ng service account."
"Worker directory read and traversal": "Pagbasa at traversal ng directory ng worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Dapat umiiral ang mga kinakailangang directory ng worker at payagan ang pagbasa at traversal. Walang sinubukang write."
"The inherited worker secret matches the web secret for this private challenge.": "Tumutugma ang minanang secret ng worker sa web secret para sa pribadong hamong ito."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Suriin ang naka-configure na PHP interpreter, mga kinakailangang extension, minanang secret at mga pahintulot sa directory ng service account. Walang sinubukang write o pagsisimula ng installer."
"advisory": "payo"
