"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "To je enoličen niz, ki se primerja z nizom sysDescr naprave, da se naprava poveže s to predlogo avtomatizacije. Poleg katerega koli izraza SQL Where je mogoče uporabiti tudi kateri koli regularni izraz Perl."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "To je enoličen niz, ki se primerja z nizom sysName naprave, da se naprava poveže s to predlogo avtomatizacije. Poleg katerega koli izraza SQL Where je mogoče uporabiti tudi kateri koli regularni izraz Perl."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "To je enoličen niz, ki se primerja z nizom sysOid naprave, da se naprava poveže s to predlogo avtomatizacije. Poleg katerega koli izraza SQL Where je mogoče uporabiti tudi kateri koli regularni izraz Perl."
