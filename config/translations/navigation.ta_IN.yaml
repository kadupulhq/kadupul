"This legacy form has expired. Open External Links and submit a new form.": "இந்த மரபுப் படிவம் காலாவதியாகிவிட்டது. வெளிப்புற இணைப்புகளைத் திறந்து புதிய படிவத்தைச் சமர்ப்பிக்கவும்."
"Open External Links and use its current forms.": "வெளிப்புற இணைப்புகளைத் திறந்து அதன் தற்போதைய படிவங்களைப் பயன்படுத்தவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
