"Confirm clearing statistics": "تأكيد مسح الإحصائيات"
"Selected device statistics cleared.": "تم مسح إحصائيات الأجهزة المحددة."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "إعادة تعيين أوقات الاستجابة وأعداد الاستطلاع والتوافر لهذه الأجهزة. يتم الاحتفاظ بالرسوم البيانية والبيانات التاريخية وإعدادات الجهاز. وتُستأنف الإحصائيات مع الاستطلاع التالي."
"Synchronize device templates": "مزامنة قوالب الأجهزة"
"Confirm synchronization": "تأكيد المزامنة"
"Selected device templates synchronized.": "تمت مزامنة قوالب الأجهزة المحددة."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "تطبيق القوالب المعينة حالياً على هذه الأجهزة. تُضاف ارتباطات الرسوم البيانية واستعلامات البيانات المفقودة، وقد تُزال ارتباطات قوالب الرسوم البيانية غير المستخدمة. يتم تخطي الأجهزة التي لا تملك قوالب. يتم الاحتفاظ بالرسوم البيانية الحالية والبيانات التاريخية؛ وقد تنشئ الأتمتة رسوماً بيانية جديدة."
