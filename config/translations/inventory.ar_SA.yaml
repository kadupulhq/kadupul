"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "لا يمكن التراجع عن إزالة الجهاز هنا. اختر ما إذا كنت تريد الاحتفاظ بالرسوم البيانية ومصادر البيانات المعطّلة أم إزالتها."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "يجب فصل مصادر البيانات المشتركة والرسوم البيانية التجميعية قبل إزالة الرسم البياني. تصبح الرسوم البيانية ومصادر البيانات المحتفظ بها غير معيّنة."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "يجب أن تكون المجمّعات البعيدة المتأثرة متصلة بالشبكة. قد يترك الإزالة الفاشلة تغييرات بعيدة أو تغييرات في الإضافات؛ افحص النتيجة قبل إعادة المحاولة."
"RRD file cleanup follows the configured maintenance policy.": "يتبع تنظيف ملفات RRD سياسة الصيانة المكوّنة."
"%graphs% graphs, %sources% data sources": "%graphs% رسوم بيانية، %sources% مصادر بيانات"
