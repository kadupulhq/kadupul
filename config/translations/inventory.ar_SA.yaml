"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "تتغيّر الخيارات المحددة فقط. وتحتفظ الخيارات غير المحددة بقيمها الحالية. يؤدي اختيار موقع فارغ إلى مسحه."
