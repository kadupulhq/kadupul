"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "ఈ పరికరాల కోసం ప్రతిస్పందన సమయాలు, పోల్ గణనలు మరియు లభ్యతను రీసెట్ చేయండి. గ్రాఫ్‌లు, చారిత్రక డేటా మరియు పరికర సెట్టింగ్‌లు నిలుపుదల చేయబడతాయి. తదుపరి పోల్‌తో గణాంకాలు తిరిగి ప్రారంభమవుతాయి."
