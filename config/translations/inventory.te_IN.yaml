"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "ఈ పరికరాలకు ప్రస్తుతం కేటాయించిన టెంప్లేట్‌లను వర్తింపజేయండి. లేని గ్రాఫ్ మరియు డేటా-క్వెరీ అనుబంధాలు జోడించబడతాయి మరియు ఉపయోగించని గ్రాఫ్-టెంప్లేట్ అనుబంధాలు తొలగించబడవచ్చు. టెంప్లేట్లు లేని పరికరాలు దాటవేయబడతాయి. ఇప్పటికే ఉన్న గ్రాఫ్‌లు మరియు చారిత్రక డేటా నిలుపుదల చేయబడతాయి; ఆటోమేషన్ కొత్త గ్రాఫ్‌లను సృష్టించవచ్చు."
