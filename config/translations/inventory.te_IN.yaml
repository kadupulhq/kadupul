"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "ఇక్కడ పరికర తొలగింపును రద్దు చేయలేము. గ్రాఫ్‌లు మరియు నిలిపివేయబడిన డేటా మూలాలను నిలుపుదల చేయాలా లేదా వాటిని తొలగించాలా అని ఎంచుకోండి."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "గ్రాఫ్ తొలగింపుకు ముందు భాగస్వామ్య డేటా మూలాలు మరియు అగ్రిగేట్ గ్రాఫ్‌లను వేరు చేయాలి. నిలుపుదల చేయబడిన గ్రాఫ్‌లు మరియు డేటా మూలాలు కేటాయించబడనివిగా మారతాయి."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "ప్రభావిత రిమోట్ కలెక్టర్లు ఆన్‌లైన్‌లో ఉండాలి. విఫలమైన తొలగింపు రిమోట్ లేదా ప్లగిన్ మార్పులను వదిలివేయవచ్చు; మళ్లీ ప్రయత్నించే ముందు ఫలితాన్ని పరిశీలించండి."
"RRD file cleanup follows the configured maintenance policy.": "RRD ఫైల్ క్లీనప్ కాన్ఫిగర్ చేసిన నిర్వహణ విధానాన్ని అనుసరిస్తుంది."
