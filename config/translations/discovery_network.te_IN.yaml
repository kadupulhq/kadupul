"The Email Address to be used as the senders Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "నోటిఫికేషన్ ఇమెయిల్ కోసం పంపేవారి ఇమెయిల్‌గా ఉపయోగించాల్సిన ఇమెయిల్ చిరునామా. ఖాళీగా ఉంచితే, డిఫాల్ట్ ఆటోమేషన్ నోటిఫికేషన్ ఇమెయిల్ చిరునామా ఉపయోగించబడుతుంది."
