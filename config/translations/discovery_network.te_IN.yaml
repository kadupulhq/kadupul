"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS రిజల్యూషన్ కోసం ఉపయోగించాల్సిన ప్రత్యామ్నాయ DNS సర్వర్‌ల ఖాళీ-వేరు చేయబడిన జాబితా. ఖాళీగా ఉంటే, DNS పేర్లను పరిష్కరించడానికి పోలర్ OS ఉపయోగించబడుతుంది."
"Access denied.": "యాక్సెస్ నిరాకరించబడింది."
