"Unable to load the discovery network. Reload before retrying.": "డిస్కవరీ నెట్‌వర్క్‌ను లోడ్ చేయలేకపోయింది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Unexpected fields were submitted.": "ఊహించని ఫీల్డ్‌లు సమర్పించబడ్డాయి."
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "అప్‌లో ఉన్న హోస్ట్‌ల హోస్ట్‌నేమ్‌ను పరిష్కరించడానికి ప్రయత్నించడానికి NetBIOSని ఉపయోగించండి."
"Wednesday": "బుధవారం"
"Week(s) of Month": "నెలలోని వారం(లు)"
"Weekly": "వారపు"
"What Day(s) of the Month will this Network Range be discovered.": "నెలలోని ఏ రోజు(ల)లో ఈ నెట్‌వర్క్ పరిధి కనుగొనబడుతుంది."
"What Day(s) of the week will this Network Range be discovered.": "వారంలోని ఏ రోజు(ల)లో ఈ నెట్‌వర్క్ పరిధి కనుగొనబడుతుంది."
"What Months(s) of the Year will this Network Range be discovered.": "సంవత్సరంలోని ఏ నెల(ల)లో ఈ నెట్‌వర్క్ పరిధి కనుగొనబడుతుంది."
"What Week(s) of the Month will this Network Range be discovered.": "నెలలోని ఏ వారం(ల)లో ఈ నెట్‌వర్క్ పరిధి కనుగొనబడుతుంది."
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "ఈ నెట్‌వర్క్ డిస్కవరీ అంశం ఏ సమయానికి ప్రారంభమవుతుంది? దానిని YYYY-MM-DD HH:MMగా నమోదు చేయండి."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "పరికరాలను కనుగొనేటప్పుడు, వేర్వేరు హోస్ట్‌లలో నకిలీ sysnameలను జోడించడానికి అనుమతించు"
"You must specify both the Months and Days of Month.": "మీరు నెలలు మరియు నెలలోని రోజులు రెండింటినీ తప్పనిసరిగా పేర్కొనాలి."
"You must specify the Months, Weeks of Months, and Days of Week.": "మీరు నెలలు, నెలల వారాలు మరియు వారంలోని రోజులను తప్పనిసరిగా పేర్కొనాలి."
"You must specify the day of the week.": "మీరు వారంలోని రోజును తప్పనిసరిగా పేర్కొనాలి."
