"Enter DNS servers as IP addresses or host names separated by spaces.": "ఖాళీలతో వేరు చేయబడిన IP చిరునామాలు లేదా హోస్ట్ పేర్లుగా DNS సర్వర్‌లను నమోదు చేయండి."
"Enter IPs or FQDNs of DNS Servers": "DNS సర్వర్‌ల IPలు లేదా FQDNలను నమోదు చేయండి"
