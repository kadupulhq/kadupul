"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "కామాలతో వేరు చేయబడిన చెల్లుబాటు అయ్యే నెట్‌వర్క్ పరిధులను నమోదు చేయండి. మీరు IP చిరునామా, 192.168.1.0/24 లేదా 192.168.1.0/255.255.255.0 వంటి నెట్‌వర్క్ పరిధి, లేదా 192.168.*.* వంటి వైల్డ్‌కార్డ్ సంకేతనాన్ని ఉపయోగించవచ్చు"
"Enter valid network ranges separated by commas.": "కామాలతో వేరు చేయబడిన చెల్లుబాటు అయ్యే నెట్‌వర్క్ పరిధులను నమోదు చేయండి."
