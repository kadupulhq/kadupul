"After an initial failure, the number of ping retries to attempt before failing.": "ప్రారంభ వైఫల్యం తర్వాత, విఫలమయ్యే ముందు ప్రయత్నించాల్సిన పింగ్ పునఃప్రయత్నాల సంఖ్య."
"After the selected Run Limit, the discovery process will be terminated.": "ఎంచుకున్న రన్ పరిమితి తర్వాత, డిస్కవరీ ప్రక్రియ నిలిపివేయబడుతుంది."
