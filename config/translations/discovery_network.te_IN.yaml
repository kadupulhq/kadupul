"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "రోజువారీ మరియు వారపు షెడ్యూల్‌లు ప్రారంభం మరియు 'ప్రతిసారి మళ్లీ అమలు చేయి'ని ఉపయోగిస్తాయి; వారపు షెడ్యూల్ వారం రోజులను కూడా ఉపయోగిస్తుంది. నెలవారీ షెడ్యూల్ నెలలు మరియు నెల రోజులను ఉపయోగిస్తుంది; రోజు ఆధారిత నెలవారీ షెడ్యూల్ నెలలు, నెల వారాలు మరియు వారం రోజులను ఉపయోగిస్తుంది."
