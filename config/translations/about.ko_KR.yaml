"About Kadupul": "Kadupul 소개"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul은 네트워크 모니터링 및 시계열 그래프 작성을 위한 독립적인 오픈 소스 프로젝트입니다."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "개발, 기여 및 릴리스 결정은 Kadupul 조직에서 관리합니다."
