"Unexpected fields were submitted.": "غیر متوقع فیلڈز جمع کروائی گئیں۔"
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "فعال ہوسٹس کا ہوسٹ نام حل کرنے کی کوشش کے لیے NetBIOS استعمال کریں۔"
"Wednesday": "بدھ"
"Week(s) of Month": "مہینے کے ہفتے"
"Weekly": "ہفتہ وار"
"What Day(s) of the Month will this Network Range be discovered?": "یہ نیٹ ورک رینج مہینے کے کن دنوں میں دریافت کی جائے گی؟"
"What Day(s) of the week will this Network Range be discovered?": "یہ نیٹ ورک رینج ہفتے کے کن دنوں میں دریافت کی جائے گی؟"
"What Month(s) of the Year will this Network Range be discovered?": "یہ نیٹ ورک رینج سال کے کن مہینوں میں دریافت کی جائے گی؟"
"What Week(s) of the Month will this Network Range be discovered?": "یہ نیٹ ورک رینج مہینے کے کن ہفتوں میں دریافت کی جائے گی؟"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "یہ نیٹ ورک ڈسکوری آئٹم کس وقت شروع ہو گا؟ اسے YYYY-MM-DD HH:MM کے طور پر درج کریں۔"
"When discovering devices, allow duplicate sysnames to be added on different hosts": "ڈیوائسز دریافت کرتے وقت، مختلف ہوسٹس پر ڈپلیکیٹ sysnames شامل کرنے کی اجازت دیں"
"You must specify both the Months and Days of Month.": "آپ کو مہینے اور مہینے کے دن دونوں بتانا ہوں گے۔"
"You must specify the Months, Weeks of Month, and Days of Week.": "آپ کو مہینے، مہینے کے ہفتے اور ہفتے کے دن بتانا ہوں گے۔"
"You must specify the day of the week.": "آپ کو ہفتے کا دن بتانا ہو گا۔"
