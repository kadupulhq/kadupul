"December": "دسمبر"
"Define the collection frequency.": "کلیکشن کی تعدد متعین کریں۔"
"Define the number of threads to use for discovering this Network Range.": "اس نیٹ ورک رینج کو دریافت کرنے کے لیے استعمال ہونے والے تھریڈز کی تعداد متعین کریں۔"
