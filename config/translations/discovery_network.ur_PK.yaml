"Enter the start as YYYY-MM-DD HH:MM.": "آغاز کو YYYY-MM-DD HH:MM کے طور پر درج کریں۔"
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "کوما سے جدا کردہ درست نیٹ ورک رینجز درج کریں۔ آپ کوئی IP پتہ، نیٹ ورک رینج مثلاً 192.168.1.0/24 یا 192.168.1.0/255.255.255.0، یا وائلڈ کارڈ نوٹیشن مثلاً 192.168.*.* استعمال کر سکتے ہیں"
"Enter valid network ranges separated by commas.": "کوما سے جدا کردہ درست نیٹ ورک رینجز درج کریں۔"
