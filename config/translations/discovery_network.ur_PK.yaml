"First": "پہلا"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "کسی بھی نئی دریافت شدہ ڈیوائس کے لیے جو SNMP کے ذریعے قابل رسائی ہو اور ڈیوائس قاعدے سے میل کھاتی ہو، اسے ڈیوائسز کے طور پر شامل کریں۔"
