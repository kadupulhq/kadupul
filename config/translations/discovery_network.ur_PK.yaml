"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "نوٹیفکیشن ای میل کے لیے مرسل کی ای میل کے طور پر استعمال ہونے والا ای میل پتہ۔ اگر خالی چھوڑ دیا جائے تو طے شدہ آٹومیشن نوٹیفکیشن ای میل پتہ استعمال ہوتا ہے۔"
"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "نوٹیفکیشن ای میل کے لیے مرسل کے نام کے طور پر استعمال ہونے والا ای میل اکاؤنٹ کا نام۔ اگر خالی چھوڑ دیا جائے تو طے شدہ آٹومیشن نوٹیفکیشن نام استعمال ہوتا ہے۔"
"The Email account to be used to send the Notification Email to.": "نوٹیفکیشن ای میل بھیجنے کے لیے استعمال ہونے والا ای میل اکاؤنٹ۔"
"The discovery network changed since you opened this form. Reload before saving.": "یہ فارم کھولنے کے بعد ڈسکوری نیٹ ورک تبدیل ہو گیا۔ محفوظ کرنے سے پہلے دوبارہ لوڈ کریں۔"
