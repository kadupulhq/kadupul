"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS ریزولوشن کے لیے استعمال ہونے والے متبادل DNS سرورز کی اسپیس سے جدا کردہ فہرست۔ اگر خالی چھوڑ دیا جائے تو DNS نام حل کرنے کے لیے پولر OS استعمال کیا جائے گا۔"
"Access denied.": "رسائی مسترد کر دی گئی۔"
"Add Discovery Network": "ڈسکوری نیٹ ورک شامل کریں"
"After an initial failure, the number of ping retries to attempt before failing.": "ابتدائی ناکامی کے بعد، ناکام قرار دینے سے پہلے پنگ کی دوبارہ کوششوں کی تعداد۔"
"After the selected Run Limit, the discovery process will be terminated.": "منتخب رن لیمٹ کے بعد، ڈسکوری کا عمل ختم کر دیا جائے گا۔"
"Allow same sysName on different hosts": "مختلف ہوسٹس پر یکساں sysName کی اجازت دیں"
"Alternate DNS Servers": "متبادل DNS سرورز"
"April": "اپریل"
"Associated Site": "وابستہ سائٹ"
"August": "اگست"
"Automatically Add Devices": "خودکار طور پر ڈیوائسز شامل کریں"
"Back to Networks": "نیٹ ورکس پر واپس جائیں"
"Choose an existing Data Collector.": "ایک موجود ڈیٹا کلیکٹر منتخب کریں۔"
"Choose an existing SNMP Option Set.": "ایک موجود SNMP آپشن سیٹ منتخب کریں۔"
"Choose an existing Site.": "ایک موجود سائٹ منتخب کریں۔"
"Choose one of the listed values.": "فہرست میں سے ایک قدر منتخب کریں۔"
"Choose the Data Collector/Poller to be used to gather data from this Device.": "اس ڈیوائس سے ڈیٹا اکٹھا کرنے کے لیے استعمال ہونے والا ڈیٹا کلیکٹر/پولر منتخب کریں۔"
"Choose the Site that you wish to associate discovered Devices with.": "وہ سائٹ منتخب کریں جس سے آپ دریافت شدہ ڈیوائسز کو وابستہ کرنا چاہتے ہیں۔"
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "روزانہ اور ہفتہ وار شیڈولز آغاز اور ہر مرتبہ دوبارہ چلائیں استعمال کرتے ہیں؛ ہفتہ وار ہفتے کے دن بھی استعمال کرتا ہے۔ ماہانہ مہینے اور مہینے کے دن استعمال کرتا ہے؛ دن کی بنیاد پر ماہانہ مہینے، مہینے کے ہفتے اور ہفتے کے دن استعمال کرتا ہے۔"
