"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "ہوسٹ ICMP اور UDP پنگنگ کے لیے استعمال ہونے والی ٹائم آؤٹ قدر۔ یہ ہوسٹ SNMP ٹائم آؤٹ قدر SNMP پنگز کے لیے لاگو ہوتی ہے۔"
"The type of ping packet to send.": "بھیجے جانے والے پنگ پیکٹ کی قسم۔"
