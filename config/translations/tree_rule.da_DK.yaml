"Optional: Sub-Tree Item": "Valgfrit: undertræelement"
"Remove graph-based criteria": "Fjern grafbaserede kriterier"
"Save": "Gem"
"Save outcome is uncertain. Reload before retrying.": "Resultatet af lagringen er usikkert. Genindlæs, før du prøver igen."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Gem først reglen; dens objektudvælgelse og kriterier for træoprettelse tilføjes bagefter."
