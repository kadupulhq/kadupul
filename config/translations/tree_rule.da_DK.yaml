"The name format must give every copy a name of 1 to 255 characters.": "Navneformatet skal give hver kopi et navn på 1 til 255 tegn."
"The tree rule changed since you opened this form. Reload before saving.": "Træreglen er ændret, siden du åbnede denne formular. Genindlæs, før du gemmer."
"Title Format": "Titelformat"
"Tree": "Træ"
