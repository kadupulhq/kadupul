"Enter at most %count% characters.": "Angiv højst %count% tegn."
"Enter single-line text.": "Angiv tekst på én linje."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Hvert <rule_name> erstattes af navnet på den træregel, der kopieres."
