"A useful name for this Rule.": "Et nyttigt navn til denne regel."
"Access denied.": "Adgang nægtet."
"Add Tree Rule": "Tilføj træregel"
"Back to Tree Rules": "Tilbage til træregler"
"Cancel": "Annullér"
"Check this box to enable this rule.": "Markér dette felt for at aktivere denne regel."
"Choose a Tree for the new Tree Items.": "Vælg et træ til de nye træelementer."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Vælg en overskrift i det valgte træ at tilknytte til, eller dets rod. Sørg for, at den stadig findes, når denne regel udføres."
"Choose a header of the selected Tree.": "Vælg en overskrift i det valgte træ."
"Choose a listed Graph Grouping Style.": "Vælg en grafgrupperingsstil fra listen."
"Choose a listed Leaf Item Type.": "Vælg en bladelementtype fra listen."
"Choose an existing Tree.": "Vælg et eksisterende træ."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Vælg, hvordan grafer grupperes, når de tegnes for denne værtsenhed i træet. Bruges til enhedsblade."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Klik på Fortsæt for at slette følgende træregler sammen med deres objektudvælgelse og kriterier for træoprettelse."
"Click Continue to disable the following Tree Rules.": "Klik på Fortsæt for at deaktivere følgende træregler."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Klik på Fortsæt for at duplikere følgende træregler. Du kan eventuelt ændre titelformatet for de nye træregler, som starter deaktiveret."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Klik på Fortsæt for at aktivere følgende træregler. Sørg for, at de er testet med succes."
"Continue": "Fortsæt"
"Data Query Index": "Dataforespørgselsindeks"
"Delete Tree Rules": "Slet træregler"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet af sletningen er usikkert. Kontrollér listen over træregler, før du prøver igen."
"Delete selected": "Slet valgte"
"Device": "Enhed"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Enhedsblade kan ikke bruge kriterier for graf- eller grafskabelonkolonner. Når bladelementtypen ændres til Enhed, skal du markere dette felt for at fjerne disse kriterier; de kan ikke gendannes."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Enhedsblade kan ikke bruge grafbaserede kriterier. Bekræft fjernelsen af %count% kriterier for at gemme."
"Disable Tree Rules": "Deaktivér træregler"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet af deaktiveringen er usikkert. Kontrollér listen over træregler, før du prøver igen."
"Disable selected": "Deaktivér valgte"
"Duplicate Tree Rules": "Duplikér træregler"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet af duplikeringen er usikkert. Kontrollér listen over træregler, før du prøver igen."
"Duplicate selected": "Duplikér valgte"
"Edit Tree Rule": "Rediger træregel"
"Enable Rule": "Aktivér regel"
"Enable Tree Rules": "Aktivér træregler"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Resultatet af aktiveringen er usikkert. Kontrollér listen over træregler, før du prøver igen."
"Enable selected": "Aktivér valgte"
"Enter a name.": "Angiv et navn."
