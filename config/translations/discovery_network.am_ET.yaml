"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "ለማሳወቂያ ኢሜይል እንደ ላኪ ኢሜይል የሚያገለግለው የኢሜይል አድራሻ። ባዶ ከተተወ፣ ነባሪው የራስ-ሰር ማሳወቂያ ኢሜይል አድራሻ ጥቅም ላይ ይውላል።"
