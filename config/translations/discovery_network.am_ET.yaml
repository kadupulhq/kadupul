"Enter a valid email address.": "ትክክለኛ የኢሜይል አድራሻ ያስገቡ።"
"Enter a whole number from %min% to %max%.": "ከ %min% እስከ %max% ያለ ሙሉ ቁጥር ያስገቡ።"
