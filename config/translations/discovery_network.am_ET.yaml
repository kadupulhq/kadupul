"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "በነጠላ ሰረዝ የተለዩ ትክክለኛ የአውታረ መረብ ክልሎችን ያስገቡ። የ IP አድራሻ፣ እንደ 192.168.1.0/24 ወይም 192.168.1.0/255.255.255.0 ያለ የአውታረ መረብ ክልል፣ ወይም እንደ 192.168.*.* ያለ የ wildcard አጻጻፍ መጠቀም ይችላሉ"
"Enter valid network ranges separated by commas.": "በነጠላ ሰረዝ የተለዩ ትክክለኛ የአውታረ መረብ ክልሎችን ያስገቡ።"
