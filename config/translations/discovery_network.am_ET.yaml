"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "ዕለታዊ እና ሳምንታዊ መርሐግብሮች መጀመሪያውን እና በየስንት ጊዜው እንደገና መሄድ እንዳለበት ይጠቀማሉ፤ ሳምንታዊ የሳምንቱን ቀናትም ይጠቀማል። ወርሃዊ ወሮችን እና የወሩን ቀናት ይጠቀማል፤ በቀን ላይ የተመሰረተ ወርሃዊ ወሮችን፣ የወሩን ሳምንታት እና የሳምንቱን ቀናት ይጠቀማል።"
