"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "ለአስተናጋጅ ICMP እና UDP ping የሚያገለግለው የጊዜ ማብቂያ እሴት። ይህ የአስተናጋጅ SNMP የጊዜ ማብቂያ እሴት ለSNMP pings ይተገበራል።"
