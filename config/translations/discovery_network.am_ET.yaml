"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "ለ DNS መፍታት የሚያገለግሉ በክፍተት የተለዩ አማራጭ DNS አገልጋዮች ዝርዝር። ባዶ ከሆነ፣ የ DNS ስሞችን ለመፍታት የፖለር ስርዓተ ክወና ጥቅም ላይ ይውላል።"
