"Unable to load the discovery network. Reload before retrying.": "የግኝት አውታረ መረቡን መጫን አልተቻለም። እንደገና ከመሞከርዎ በፊት እንደገና ይጫኑ።"
"Unexpected fields were submitted.": "ያልተጠበቁ መስኮች ገብተዋል።"
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "በርተው ያሉ አስተናጋጆችን የአስተናጋጅ ስም ለመፍታት ለመሞከር NetBIOS ይጠቀሙ።"
"Wednesday": "ረቡዕ"
"Week(s) of Month": "የወሩ ሳምንት(ቶች)"
"Weekly": "ሳምንታዊ"
"What Day(s) of the Month will this Network Range be discovered?": "ይህ የአውታረ መረብ ክልል በወሩ በየትኛው ቀን(ኖች) ይገኛል።"
"What Day(s) of the week will this Network Range be discovered?": "ይህ የአውታረ መረብ ክልል በሳምንቱ በየትኛው ቀን(ኖች) ይገኛል።"
"What Month(s) of the Year will this Network Range be discovered?": "ይህ የአውታረ መረብ ክልል በዓመቱ በየትኛው ወር(ሮች) ይገኛል።"
"What Week(s) of the Month will this Network Range be discovered?": "ይህ የአውታረ መረብ ክልል በወሩ በየትኛው ሳምንት(ቶች) ይገኛል።"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "ይህ የአውታረ መረብ ግኝት ንጥል በየትኛው ሰዓት ይጀምራል? እንደ YYYY-MM-DD HH:MM ያስገቡት።"
"When discovering devices, allow duplicate sysnames to be added on different hosts": "መሣሪያዎችን ሲያገኙ፣ የተባዙ sysnames በተለያዩ አስተናጋጆች ላይ እንዲታከሉ ይፍቀዱ"
"You must specify both the Months and Days of Month.": "ሁለቱንም ወራት እና የወሩን ቀናት መግለጽ አለብዎት።"
"You must specify the Months, Weeks of Month, and Days of Week.": "ወራትን፣ የወራት ሳምንታትን እና የሳምንቱን ቀናት መግለጽ አለብዎት።"
"You must specify the day of the week.": "የሳምንቱን ቀን መግለጽ አለብዎት።"
