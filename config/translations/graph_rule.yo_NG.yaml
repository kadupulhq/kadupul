"A useful name for this Rule.": "Orúkọ tó wúlò fún Òfin yìí."
"Access denied.": "A kọ̀ ìráyè."
"Add Graph Rule": "Fi Òfin Àwòrán ìtọ́ka kún"
"Back to Graph Rules": "Padà sí Àwọn Òfin Àwòrán ìtọ́ka"
"Check this box to enable this rule.": "Ṣàmì sí àpótí yìí láti mú òfin yìí ṣiṣẹ́."
"Choose a Data Query to apply to this rule.": "Yan Ìbéèrè Dátà kan láti lò fún òfin yìí."
"Choose a Graph Type": "Yan Irú Àwòrán ìtọ́ka kan"
"Choose a Graph Type of the selected Data Query.": "Yan Irú Àwòrán ìtọ́ka kan ti Ìbéèrè Dátà tí a yàn."
"Choose an existing Data Query.": "Yan Ìbéèrè Dátà tó wà tẹ́lẹ̀."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Yan èyíkéyìí nínú Àwọn Irú Àwòrán ìtọ́ka tó wà ti Ìbéèrè Dátà tí a yàn láti lò fún òfin yìí."
"Data Query": "Ìbéèrè Dátà"
"Device Selection and Graph Creation Criteria": "Àwọn Ìlànà Ìyàn Ẹ̀rọ àti Ìdásílẹ̀ Àwòrán ìtọ́ka"
"Edit Graph Rule": "Ṣàtúnṣe Òfin Àwòrán ìtọ́ka"
"Enable Rule": "Mú Òfin Ṣiṣẹ́"
"Enter a name.": "Tẹ orúkọ kan."
"Enter at most %count% characters.": "Tẹ lẹ́tà %count% nígbà tó pọ̀ jùlọ."
"Enter single-line text.": "Tẹ ọ̀rọ̀ ìlà-kan."
"Graph Type": "Irú Àtẹ àwòrán"
"Graph rule not found.": "A kò rí òfin àtẹ àwòrán."
"Graph rule saved.": "A ti fipamọ́ òfin àtẹ àwòrán."
"Name": "Orúkọ"
"Rule Selection [edit: %name%]": "Àṣàyàn Òfin [ṣàtúnṣe: %name%]"
"Rule Selection [new]": "Àṣàyàn Òfin [tuntun]"
"Save": "Fipamọ́"
"Save outcome is uncertain. Reload before retrying.": "Àbájáde ìfipamọ́ kò dájú. Tún gbé e wọlé kí o tó tún gbìyànjú."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Fi òfin pamọ́ lákọ̀ọ́kọ́; a ó fi Ìyàn Ẹ̀rọ àti Ìlànà Ìṣẹ̀dá Gíráfù rẹ̀ kún un lẹ́yìn náà."
"The graph rule changed since you opened this form. Reload before saving.": "Òfin gíráfù náà yí padà láti ìgbà tí o ti ṣí fọ́ọ̀mù yìí. Tún gbé jáde kí o tó fi pamọ́."
"Unable to load the graph rule. Reload before retrying.": "Kò ṣeé ṣe láti gbé òfin gíráfù jáde. Tún gbé jáde kí o tó tún gbìyànjú."
"Unexpected fields were submitted.": "A fi àwọn ààyè àìròtẹ́lẹ̀ ránṣẹ́."
