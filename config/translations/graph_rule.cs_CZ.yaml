"A useful name for this Rule.": "Užitečný název tohoto pravidla."
"Access denied.": "Přístup byl odepřen."
"Add Graph Rule": "Přidat pravidlo grafů"
"Back to Graph Rules": "Zpět na pravidla grafů"
"Cancel": "Zrušit"
"Check this box to enable this rule.": "Zaškrtnutím povolíte toto pravidlo."
"Choose a Data Query to apply to this rule.": "Vyberte datový dotaz, který se pro toto pravidlo použije."
"Choose a Graph Type": "Vyberte typ grafu"
"Choose a Graph Type of the selected Data Query.": "Vyberte typ grafu vybraného datového dotazu."
"Choose an existing Data Query.": "Vyberte existující datový dotaz."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Vyberte kterýkoli z dostupných typů grafů vybraného datového dotazu, který se pro toto pravidlo použije."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kliknutím na Pokračovat odstraníte následující pravidla grafů včetně jejich kritérií výběru zařízení a vytváření grafů."
"Click Continue to disable the following Graph Rules.": "Kliknutím na Pokračovat zakážete následující pravidla grafů."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kliknutím na Pokračovat zduplikujete následující pravidla grafů. Volitelně můžete změnit formát názvu nových pravidel grafů, která budou zpočátku zakázána."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kliknutím na Pokračovat povolíte následující pravidla grafů. Ujistěte se, že byla úspěšně otestována."
