"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Huu ni mfuatano wa kipekee ambao utalinganishwa na mfuatano wa sysDescr wa kifaa ili kuuoanisha na Kiolezo hiki cha Uotomatishaji. Usemi wowote wa kawaida wa Perl unaweza kutumika pamoja na usemi wowote wa SQL Where."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Huu ni mfuatano wa kipekee ambao utalinganishwa na mfuatano wa sysName wa kifaa ili kuuoanisha na Kiolezo hiki cha Uotomatishaji. Usemi wowote wa kawaida wa Perl unaweza kutumika pamoja na usemi wowote wa SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Huu ni mfuatano wa kipekee ambao utalinganishwa na mfuatano wa sysOid wa kifaa ili kuuoanisha na Kiolezo hiki cha Uotomatishaji. Usemi wowote wa kawaida wa Perl unaweza kutumika pamoja na usemi wowote wa SQL Where."
