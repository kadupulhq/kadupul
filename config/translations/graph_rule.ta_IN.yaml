"A useful name for this Rule.": "இந்த விதிக்குப் பயனுள்ள பெயர்."
"Access denied.": "அணுகல் மறுக்கப்பட்டது."
"Add Graph Rule": "வரைபட விதி சேர்"
"Back to Graph Rules": "வரைபட விதிகளுக்குத் திரும்பு"
"Check this box to enable this rule.": "இந்த விதியை இயக்க இந்தப் பெட்டியைத் தேர்ந்தெடுக்கவும்."
"Choose a Data Query to apply to this rule.": "இந்த விதிக்குப் பயன்படுத்த ஒரு தரவு வினவலைத் தேர்ந்தெடுக்கவும்."
"Choose a Graph Type": "ஒரு வரைபட வகையைத் தேர்ந்தெடுக்கவும்"
"Choose a Graph Type of the selected Data Query.": "தேர்ந்தெடுக்கப்பட்ட தரவு வினவலின் ஒரு வரைபட வகையைத் தேர்ந்தெடுக்கவும்."
"Choose an existing Data Query.": "ஏற்கனவே உள்ள தரவு வினவலைத் தேர்ந்தெடுக்கவும்."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "இந்த விதிக்குப் பயன்படுத்த தேர்ந்தெடுக்கப்பட்ட தரவு வினவலில் உள்ள கிடைக்கக்கூடிய வரைபட வகைகளில் ஏதேனும் ஒன்றைத் தேர்ந்தெடுக்கவும்."
"Data Query": "தரவு வினவல்"
"Device Selection and Graph Creation Criteria": "சாதனத் தேர்வு மற்றும் வரைபட உருவாக்க நிபந்தனைகள்"
"Edit Graph Rule": "வரைபட விதியைத் திருத்து"
"Enable Rule": "விதியை இயக்கு"
"Enter a name.": "ஒரு பெயரை உள்ளிடவும்."
"Enter at most %count% characters.": "அதிகபட்சம் %count% எழுத்துகள் உள்ளிடவும்."
"Enter single-line text.": "ஒற்றை வரி உரையை உள்ளிடவும்."
"Graph Type": "வரைபட வகை"
"Graph rule not found.": "வரைபட விதி கிடைக்கவில்லை."
"Graph rule saved.": "வரைபட விதி சேமிக்கப்பட்டது."
"Name": "பெயர்"
"Rule Selection [edit: %name%]": "விதித் தேர்வு [திருத்து: %name%]"
"Rule Selection [new]": "விதித் தேர்வு [புதியது]"
"Save": "சேமி"
"Save outcome is uncertain. Reload before retrying.": "சேமிப்பின் முடிவு உறுதியற்றது. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "முதலில் விதியைச் சேமிக்கவும்; அதன் சாதனத் தேர்வு மற்றும் வரைபட உருவாக்க நிபந்தனைகள் பின்னர் சேர்க்கப்படும்."
"The graph rule changed since you opened this form. Reload before saving.": "இந்தப் படிவத்தைத் திறந்த பிறகு வரைபட விதி மாறிவிட்டது. சேமிப்பதற்கு முன் மீண்டும் ஏற்றவும்."
"Unable to load the graph rule. Reload before retrying.": "வரைபட விதியை ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
