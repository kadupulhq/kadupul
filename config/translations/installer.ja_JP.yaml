"Synchronizing collectors": "コレクターを同期中"
"Table conversions": "テーブル変換"
"Templates": "テンプレート"
"The database version matches this application. Installation does not establish that polling is healthy.": "データベースバージョンはこのアプリケーションと一致しています。インストール完了によってポーリングが正常であることは保証されません。"
"The request outcome is unknown. Check execution status before retrying.": "リクエスト結果が不明です。再試行する前に実行ステータスを確認してください。"
