"Recover stopped attempt": "停止した試行を復旧"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "復旧では保存された選択内容が保持され、稼働中のワーカーを終了することはありません。再試行する前に計画を再度確認してください。"
