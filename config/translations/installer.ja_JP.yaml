"Accept the license before saving the installation plan.": "インストール計画を保存する前にライセンスに同意してください。"
"Invalid installation form.": "インストールフォームが無効です。"
"Access denied.": "アクセスが拒否されました。"
"Confirm the recovery warning before retrying.": "再試行する前に復旧警告を確認してください。"
"Review and confirm the current installation plan.": "現在のインストール計画を確認して確定してください。"
"Confirm the discovery scope before starting.": "開始する前にディスカバリ範囲を確認してください。"
"Resolve the blocking checks before starting.": "開始する前にブロッキングチェックを解決してください。"
"Too many installer options.": "インストーラーオプションが多すぎます。"
"Invalid installer option name.": "インストーラーオプション名が無効です。"
"Unknown or malformed installer option.": "不明または不正な形式のインストーラーオプションです。"
"Installer options must be scalar values.": "インストーラーオプションはスカラー値である必要があります。"
"Installer option is too long or contains a null byte.": "インストーラーオプションが長すぎるか、NULL バイトが含まれています。"
"Installer IDs and intervals must be whole numbers.": "インストーラー ID と間隔は整数である必要があります。"
"Installer ID or interval is outside its supported range.": "インストーラー ID または間隔がサポート範囲外です。"
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "インストールを続行できませんでした。再試行する前にステータスを再読み込みし、ブロッキングチェックを確認してください。"
"Confirm that the previous worker has stopped before recovering its plan.": "計画を復旧する前に前回のワーカーが停止していることを確認してください。"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "データベースはインストールされていますが、一部のコレクターは引き続き同期が必要です。ステータスを確認した後、仕上げタスクを再試行してください。"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "インストールが停止しました。インストーラーログを保存し、原因を修正してから明示的に再試行を承認してください。一部のデータベース変更はすでにコミットされている場合があります。再試行を承認する前にプラグインのクリーンアップを確認してください。"
"Next action": "次の操作"
"Follow the execution status. Do not start another attempt while a worker is active.": "実行ステータスを確認してください。ワーカーが稼働中に別の試行を開始しないでください。"
"Complete the recovery checklist before retrying.": "再試行する前に復旧チェックリストを完了してください。"
"Verify collection and graph operation before enabling discovery.": "ディスカバリを有効にする前に、収集とグラフの動作を検証してください。"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "ブロックされた要件を解決してから再確認してください。保存された選択内容は保持されます。"
"Review the planned changes and backup checklist before authorizing execution.": "実行を許可する前に、計画された変更とバックアップチェックリストを確認してください。"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "収集プロファイルを選択し、ライセンスに同意してください。オプション設定は必要に応じて開くことができます。"
"Download installation diagnostics": "インストール診断をダウンロード"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "グラフを開き、ポーラーサイクル後に RRD データが更新されることを確認してください。"
"Requirement details": "要件の詳細"
"Recover": "復旧"
"Recovery checklist": "復旧チェックリスト"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log を保存し、失敗した試行を記録してください。"
"Confirm that the previous worker and its child processes have stopped.": "前回のワーカーとその子プロセスが停止していることを確認してください。"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "コミット済みの変更、コレクター同期、およびプラグインのクリーンアップを確認してください。原因を修正してから再試行してください。"
"Review the saved plan again, then explicitly authorize a retry.": "保存された計画を再度確認してから、明示的に再試行を許可してください。"
"Recover a stopped worker": "停止したワーカーを復旧"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "この試行が実行中でないことを確認した後にのみ復旧を使用してください。復旧はプロセスを停止しません。"
"Collector and installation mode": "コレクターとインストールモード"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "デプロイ構成によってコレクターの役割とデータベース接続が決まります。コレクターを開始する前にプライマリサーバー構成を確認してください。"
"Discovery and SNMP settings": "ディスカバリと SNMP 設定"
"Keep discovery disabled until collection and collector connectivity have been verified.": "収集およびコレクターの接続性が検証されるまでディスカバリは無効にしておいてください。"
"Template selection": "テンプレート選択"
"Templates selected for import": "インポート対象として選択されたテンプレート"
"No templates selected.": "テンプレートが選択されていません。"
"Backup checklist": "バックアップチェックリスト"
"Database backup and a tested restoration procedure.": "データベースのバックアップと検証済みの復元手順。"
"RRD files and the service account permissions needed to restore them.": "RRD ファイルおよびそれらを復元するために必要なサービスアカウント権限。"
"Configuration, keys and plugin data outside the database.": "データベース外の設定、キー、およびプラグインデータ。"
"Post-installation checks": "インストール後のチェック"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "検証済みチェックは表示されている証跡のみを対象とします。未評価のチェックには引き続きオペレーターによる確認が必要です。"
"Operational checks still require operator verification.": "運用チェックには引き続きオペレーターによる確認が必要です。"
"Status": "状態"
"verified": "検証済み"
"action_required": "要対応"
"not_assessed": "未評価"
"Database schema": "データベーススキーマ"
"Stored schema matches the application target.": "保存されたスキーマはアプリケーションターゲットと一致しています。"
"Target schema completion has not been confirmed.": "ターゲットスキーマの完了が確認されていません。"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "スキーマのアップグレードが完了したとみなす前に、インストール結果を確認し、失敗を解決してください。"
"Installation outcome": "インストール結果"
"A successful receipt matches the current target schema.": "成功したレシートは現在のターゲットスキーマと一致しています。"
"A complete successful installation outcome has not been confirmed.": "インストールの完全な成功結果はまだ確認されていません。"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "インストーラーログを保存し、必要に応じて明示的な復旧または再試行手順を使用してください。"
"Collector synchronization": "コレクター同期"
"The completed installer reports pending collector synchronization.": "完了したインストーラーは保留中のコレクター同期があることを報告しています。"
"The completed installer reports no pending collectors.": "完了したインストーラーは保留中のコレクターがないことを報告しています。"
"Collector completion remains unconfirmed by this partial receipt.": "この部分的なレシートではコレクターの完了が未確認のままです。"
"Collector completion is not established by this installation outcome.": "このインストール結果ではコレクターの完了が確定していません。"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "コレクターのステータスを確認し、部分的な結果に対して仕上げタスクを再試行してください。これは後続の収集鮮度を検証するものではありません。"
"Scheduled collection": "スケジュール収集"
"No poller or device was contacted by this assessment.": "この評価ではポーラーやデバイスへの通信は行われていません。"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "設定されたスケジューラーが意図したサービスアカウントとしてポーラーを実行していることを確認し、次の通常サイクルを確認してください。"
"Graph data": "グラフデータ"
"Live samples and RRD updates were not exercised.": "ライブサンプルと RRD 更新は実施されませんでした。"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "通常の収集サイクル後、対象のグラフが新しいサンプルを受信していることを確認し、ポーラーエラーを確認してください。"
"Recovery readiness": "復旧準備状況"
"Backup restoration was not exercised.": "バックアップの復元は実施されませんでした。"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "復旧に頼る前に、データベース、RRD ファイル、設定、およびキーマテリアルの分離された復元を検証してください。"
"No persisted local poller start has been recorded.": "永続化されたローカルポーラーの開始は記録されていません。"
"Persisted poller timing is invalid and cannot establish scheduler health.": "永続化されたポーラー時刻が無効であるため、スケジューラーの健全性を確立できません。"
"The recorded poller start is in the future. Check clock synchronization.": "記録されたポーラー開始時刻が未来になっています。時刻同期を確認してください。"
"The recorded poller start is older than the native scheduling tolerance.": "記録されたポーラー開始時刻がネイティブのスケジュール許容範囲を超過して古くなっています。"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "ローカルポーラーの開始がネイティブのスケジュール許容範囲内に記録されました。完了とデバイスの健全性は検証されていません。"
"readable": "読み取り可能"
"missing or unreadable": "欠落または読み取り不可"
"Restore the complete release and its locked dependencies; grant the service account read access.": "完全なリリースとそのロックされた依存関係を復元し、サービスアカウントに読み取りアクセス権を付与してください。"
"PHP temporary directory": "PHP 一時ディレクトリ"
"directory writable by this process": "このプロセスによって書き込み可能なディレクトリ"
"missing or not writable": "欠落または書き込み不可"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "インストールアカウントが書き込み可能な既存ディレクトリとして sys_temp_dir を設定してください。ネイティブインポートでは一時ファイルを使用します。"
"Background worker launch": "バックグラウンドワーカー起動"
"required PHP functions available; launch not exercised": "必須の PHP 関数は利用可能ですが、起動は実施されていません"
"required PHP launch function disabled": "必須の PHP 起動関数が無効になっています"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Web PHP ランタイムで exec を有効にするか、権限のある CLI インストーラーを使用してください。"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Web PHP ランタイムで popen、pclose を有効にするか、権限のある CLI インストーラーを使用してください。"
"Database transaction ownership": "データベーストランザクションの所有権"
"autocommit enabled; no caller-owned transaction": "autocommit が有効であり、呼び出し元所有のトランザクションはありません"
"autocommit disabled or caller transaction active": "autocommit が無効、または呼び出し元のトランザクションがアクティブです"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "呼び出し元所有のトランザクション外でインストールを実行し、変更用接続で autocommit を有効にしてください。"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "リリースディレクトリを復元し、テンプレートリソースのインポート用にインストールアカウントへ書き込みアクセス権を付与してください。誰でも書き込み可能 (world-writable) にはしないでください。"
"Worker file: install/background.php": "ワーカーファイル: install/background.php"
"Worker file: bin/legacy-installer.php": "ワーカーファイル: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "ワーカーファイル: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "インポート先: resource/snmp_queries"
"Import destination: resource/script_server": "インポート先: resource/script_server"
"Import destination: resource/script_queries": "インポート先: resource/script_queries"
"Import destination: scripts": "インポート先: scripts"
"Database privileges": "データベース権限"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "有効なロールやオブジェクト固有の権限を含む実効移行権限は検証されていません。"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "データベース管理者に、インストールアカウントおよびスキーマに対して必要なテーブル書き込み、スキーマ変更、トリガー、ルーチンが許可されているか確認してもらってください。グローバル管理者権限は付与しないでください。"
"Compare web and worker runtimes": "Web とワーカーのランタイムを比較"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "これにより、短時間の読み取り専用 PHP プローブが明示的に開始されます。インストーラーの予約、ファイル書き込み、デバイスへの通信は行いません。"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "プローブはこの Web プロセスを継承し、設定されたインストーラー PHP インタープリターを使用します。別のスケジューラーやサービスは検査しません。"
"I authorize the read-only worker runtime comparison.": "読み取り専用のワーカーランタイム比較を許可します。"
"Compare runtimes": "ランタイムを比較"
"Runtime comparison results": "ランタイム比較結果"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "権限や ID の差異は意図的な場合があります。読み取り専用の観測では、書き込みやインストールが成功することは証明されません。"
"Confirm the read-only worker runtime comparison.": "読み取り専用のワーカーランタイム比較を確認してください。"
"The runtime comparison is unavailable.": "ランタイム比較は利用できません。"
"Shared application secret": "共有アプリケーションシークレット"
"A strong web application secret is required before comparison.": "比較を行う前に強力な Web アプリケーションシークレットが必要です。"
"Runtime comparison": "ランタイム比較"
"The configured worker runtime did not confirm a bounded comparison.": "設定されたワーカーランタイムは限定された比較を確認できませんでした。"
"The inherited worker secret could not be confirmed against the web secret.": "継承されたワーカーシークレットを Web シークレットと照合して確認できませんでした。"
"PHP runtime comparison": "PHP ランタイム比較"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "両方のランタイムが PHP 8.4 をサポートしている必要があります。パッチバージョンの差異は確認が必要です。"
"Required extension comparison": "必須拡張モジュール比較"
"Required extension availability is checked; differing versions require review.": "必須拡張モジュールの利用可否がチェックされます。バージョンの差異は確認が必要です。"
"Process identity comparison": "プロセス ID 比較"
"Effective process identity is unavailable on this platform.": "このプラットフォームでは実効プロセス ID を利用できません。"
"Effective process identities match.": "実効プロセス ID が一致しています。"
"Effective process identities differ; separate service accounts may be intentional.": "実効プロセス ID が異なります。別のサービスアカウントの使用は意図的な場合があります。"
"Directory access comparison": "ディレクトリアクセス比較"
"Read-only directory permission observations match.": "読み取り専用のディレクトリ権限の観測結果が一致しています。"
"Directory locations or permission observations differ; review the service-account roles.": "ディレクトリの場所または権限の観測結果が異なります。サービスアカウントのロールを確認してください。"
"Worker directory read and traversal": "ワーカーディレクトリの読み取りと走査"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "必須ワーカーディレクトリは存在し、読み取りおよび走査を許可する必要があります。書き込みテストは行われていません。"
"The inherited worker secret matches the web secret for this private challenge.": "継承されたワーカーシークレットは、このプライベートチャレンジにおいて Web シークレットと一致しています。"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "設定済みの PHP インタープリター、必須拡張モジュール、継承されたシークレット、およびサービスアカウントのディレクトリ権限を確認してください。書き込みやインストーラーの起動は実施されていません。"
"advisory": "参考情報"
