"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "ワーカーが予期せず停止した場合は、log/cacti.log を保存し、プロセスが終了したことを確認してから明示的に再試行してください。待機状態は起動成功を意味するものではありません。"
