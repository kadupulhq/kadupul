"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "Ba a taɓa nuna bayanan sirrin da aka ajiye. Sauya su yana saita dukkan filayen bayanan sirri guda huɗu; barin SNMP nau'i na 3 yana share sunan mai amfaninsa da kalmomin sirrinsa."
"Submit every notification receiver field.": "Aika kowane filin mai karɓar sanarwa."
