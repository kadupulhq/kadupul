"Choose an existing Data Input Method.": "Yan Ọ̀nà Ìfisínú Dátà tó wà tẹ́lẹ̀."
"Choose the input method for this Data Query.  This input method defines how data is collected for each Device associated with the Data Query.": "Yan ọ̀nà ìfisínú fún Ìbéèrè Dátà yìí. Ọ̀nà ìfisínú yìí ṣàlàyé bí a ṣe ń kó dátà jọ fún Ẹ̀rọ kọ̀ọ̀kan tí ó somọ́ Ìbéèrè Dátà náà."
"Could not locate XML file.": "Kò lè rí fáìlì XML."
"Data Input Method": "Ọ̀nà Ìfisínú Dátà"
"Data Queries [edit: %name%]": "Àwọn Ìbéèrè Dátà [ṣàtúnṣe: %name%]"
"Data Queries [new]": "Àwọn Ìbéèrè Dátà [tuntun]"
"Data query not found.": "A kò rí ìbéèrè dátà."
"Data query saved, but a Remote Data Collector was down and did not receive the poller cache change. Perform a Full Sync once it is up again.": "A ti fi ìbéèrè dátà pamọ́, ṣùgbọ́n Olùkó Dátà Jíjìn kan wà ní pípa kò sì gba àtúnṣe àkójọ ìpamọ́ olùṣàyẹ̀wò. Ṣe Full Sync nígbà tí ó bá tún jí."
"Data query saved.": "A ti fi ìbéèrè dátà pamọ́."
"Description": "Àpèjúwe"
"Edit Data Query": "Ṣàtúnṣe Ìbéèrè Dátà"
"Enter a value.": "Tẹ iye kan."
"Enter at most %count% characters.": "Tẹ lẹ́tà %count% nígbà tó pọ̀ jùlọ."
"Enter single-line text.": "Tẹ ọ̀rọ̀ ìlà-kan."
"Enter the path of a readable XML file under the resource directory.": "Tẹ ipa-ọ̀nà ti fáìlì XML tó ṣeé kà lábẹ́ àpò ohun èlò."
"Invalid command.": "Àṣẹ tí kò tọ́."
"Name": "Orúkọ"
"Save": "Fipamọ́"
"Save outcome is uncertain. Reload before retrying.": "Àbájáde ìfipamọ́ kò dájú. Tún gbé e wọlé kí o tó tún gbìyànjú."
"Save the data query first; its Graph Templates are associated afterwards.": "Fi ìbéèrè dátà pamọ́ lákọ̀ọ́kọ́; a ó so àwọn Àdàkọ Gíráfù rẹ̀ pọ̀ lẹ́yìn náà."
"Successfully located XML file": "A ti rí fáìlì XML ní àṣeyọrí"
"The data query changed since you opened this form. Reload before saving.": "Ìbéèrè dátà náà yí padà láti ìgbà tí o ti ṣí fọ́ọ̀mù yìí. Tún gbé jáde kí o tó fi pamọ́."
"The full path to the XML file containing definitions for this data query.": "Ọ̀nà kíkún sí fáìlì XML tí ó ní àwọn ìtumọ̀ fún ìbéèrè dátà yìí."
"Unable to load the data query. Reload before retrying.": "Kò ṣeé ṣe láti gbé ìbéèrè dátà jáde. Tún gbé jáde kí o tó tún gbìyànjú."
"Unexpected fields were submitted.": "A fi àwọn ààyè àìròtẹ́lẹ̀ ránṣẹ́."
"XML Path": "Ọ̀nà XML"
