"A description for this data query.": "Àpèjúwe fún ìbéèrè dátà yìí."
"A name for this data query.": "Orúkọ kan fún ìbéèrè dátà yìí."
"Access denied.": "A kọ̀ ìráyè."
"Add Data Query": "Fi Ìbéèrè Dátà kún"
