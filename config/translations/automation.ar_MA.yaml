"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "انتهت صلاحية استمارة مجموعة خيارات SNMP هذه. افتح مجموعة خيارات SNMP مجدداً واستخدم استمارتها الحالية."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "هذه سلسلة نصية فريدة تتم مطابقتها مع سلسلة sysDescr الخاصة بالجهاز لإقرانه بقالب الأتمتة هذا. يمكن استخدام أي تعبير نمطي لـ Perl بالإضافة إلى أي تعبير SQL Where."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "هذه سلسلة نصية فريدة تتم مطابقتها مع سلسلة sysName الخاصة بالجهاز لإقرانه بقالب الأتمتة هذا. يمكن استخدام أي تعبير نمطي لـ Perl بالإضافة إلى أي تعبير SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "هذه سلسلة نصية فريدة تتم مطابقتها مع سلسلة sysOid الخاصة بالجهاز لإقرانه بقالب الأتمتة هذا. يمكن استخدام أي تعبير نمطي لـ Perl بالإضافة إلى أي تعبير SQL Where."
