"Device Selection and Graph Creation Criteria": "Criteris de selecció de dispositius i de creació de gràfics"
"Disable Graph Rules": "Desactiva les regles de gràfics"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "El resultat de la desactivació és incert. Comproveu la llista de regles de gràfics abans de tornar-ho a provar."
