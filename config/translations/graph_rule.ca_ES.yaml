"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "El resultat de l'activació és incert. Comproveu la llista de regles de gràfics abans de tornar-ho a provar."
"Enable selected": "Activa la selecció"
"Enter a name.": "Introduïu un nom."
"Enter a valid name format.": "Introduïu un format de nom vàlid."
"Enter at most %count% characters.": "Introduïu com a màxim %count% caràcters."
"Enter single-line text.": "Introduïu text d'una sola línia."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Cada <rule_name> se substitueix pel nom de la regla de gràfic que es copia."
"Graph Type": "Tipus de gràfic"
"Graph rule not found.": "No s'ha trobat la regla de gràfic."
"Graph rule saved.": "S'ha desat la regla de gràfic."
"Invalid Graph Rule selection.": "Selecció de regles de gràfics no vàlida."
"Name": "Nom"
"One or more selected Graph Rules no longer exist.": "Una o més regles de gràfics seleccionades ja no existeixen."
