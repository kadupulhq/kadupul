"A useful name for this Rule.": "Un nom útil per a aquesta regla."
"Access denied.": "Accés denegat."
"Add Graph Rule": "Afegeix una regla de gràfic"
"Back to Graph Rules": "Torna a les regles de gràfics"
"Cancel": "Cancel·la"
"Check this box to enable this rule.": "Marqueu aquesta casella per activar aquesta regla."
"Choose a Data Query to apply to this rule.": "Trieu una consulta de dades que s'aplicarà a aquesta regla."
"Choose a Graph Type": "Trieu un tipus de gràfic"
"Choose a Graph Type of the selected Data Query.": "Trieu un tipus de gràfic de la consulta de dades seleccionada."
"Choose an existing Data Query.": "Trieu una consulta de dades existent."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Trieu qualsevol dels tipus de gràfic disponibles de la consulta de dades seleccionada per aplicar-lo a aquesta regla."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Feu clic a Continua per suprimir les regles de gràfics següents amb els seus criteris de selecció de dispositius i de creació de gràfics."
"Click Continue to disable the following Graph Rules.": "Feu clic a Continua per desactivar les regles de gràfics següents."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Feu clic a Continua per duplicar les regles de gràfics següents. Opcionalment, podeu canviar el format del títol de les noves regles de gràfics, que s'inicien desactivades."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Feu clic a Continua per activar les regles de gràfics següents. Assegureu-vos que s'han provat correctament."
"Continue": "Continua"
"Data Query": "Consulta de dades"
"Delete Graph Rules": "Suprimeix les regles de gràfics"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "El resultat de la supressió és incert. Comproveu la llista de regles de gràfics abans de tornar-ho a provar."
