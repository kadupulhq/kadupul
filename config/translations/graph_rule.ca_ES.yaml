"Rule Selection [new]": "Selecció de regla [nova]"
"Save": "Desa"
"Save outcome is uncertain. Reload before retrying.": "El resultat de desar és incert. Torneu a carregar abans de tornar-ho a provar."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Deseu primer la regla; els seus criteris de selecció de dispositius i de creació de gràfics s'afegeixen després."
"Select": "Selecciona"
"Select %name%": "Selecciona %name%"
"Select at least one Graph Rule.": "Seleccioneu almenys una regla de gràfic."
