"The name format must give every copy a name of 1 to 255 characters.": "El format del nom ha de donar a cada còpia un nom d'1 a 255 caràcters."
"Title Format": "Format del títol"
"Unable to load Graph Rules. Reload before retrying.": "No s'han pogut carregar les regles de gràfics. Torneu a carregar abans de tornar-ho a provar."
