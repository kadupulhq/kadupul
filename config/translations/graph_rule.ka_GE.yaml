"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "ქვემოთ მოცემული გრაფიკის წესების დასუბლირებლად დააწკაპუნეთ „გაგრძელებაზე“. სურვილისამებრ შეგიძლიათ შეცვალოთ ახალი გრაფიკის წესების სათაურის ფორმატი; ისინი გამორთული იქნება."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "ქვემოთ მოცემული გრაფიკის წესების ჩასართავად დააწკაპუნეთ „გაგრძელებაზე“. დარწმუნდით, რომ ისინი წარმატებით გამოიცადა."
