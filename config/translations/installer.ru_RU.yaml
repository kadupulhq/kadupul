"Action": "Действие"
"Advanced options": "Дополнительные параметры"
"Applying database upgrades": "Применение обновлений базы данных"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Выполните резервное копирование базы данных, файлов RRD, конфигурации и ключей. Обновления базы данных могут зафиксировать изменения, которые невозможно отменить откатом приложения."
"Blocked": "Заблокировано"
"Check": "Проверить"
"Check again": "Проверить снова"
"Check collection freshness and collector connectivity before enabling discovery.": "Проверьте актуальность сбора данных и связность с коллекторами перед включением обнаружения."
"Check requirements": "Проверить требования"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Проверки анализируют текущий процесс и права доступа к файловой системе. Они не создают тестовых файлов и не обращаются к устройствам."
"Collection profile": "Профиль сбора"
"Collector": "Коллектор"
"Configure": "Настроить"
"Configuring collection profiles": "Настройка профилей сбора"
"Configuring discovery": "Настройка обнаружения"
"Configuring the local device": "Настройка локального устройства"
"Confirming database version": "Подтверждение версии базы данных"
"Converting selected tables": "Конвертация выбранных таблиц"
"Database version": "Версия базы данных"
"Disabled": "Выключен"
"Discovery": "Обнаружение"
"Discovery SNMP settings": "Параметры SNMP для обнаружения"
"Discovery range": "Диапазон обнаружения"
"Enable discovery after installation": "Включить обнаружение после установки"
"Executable paths": "Пути к исполняемым файлам"
"Execution status": "Состояние выполнения"
"Finished execution": "Выполнение завершено"
"Finishing tasks only. Schema migrations will not be replayed.": "Только завершающие задачи. Миграции схемы не будут воспроизводиться повторно."
"I accept the license terms": "Я принимаю условия лицензии"
"I authorize discovery of the displayed range": "Я разрешаю обнаружение отображаемого диапазона"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Я проверил журнал и убедился, что предыдущий обработчик и его дочерние процессы завершились"
"I checked the previous attempt and accept that some changes may already be committed": "Я проверил предыдущую попытку и принимаю, что часть изменений уже могла быть зафиксирована"
"I reviewed this plan and have the required backups": "Я ознакомился с этим планом и располагаю необходимыми резервными копиями"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Если обработчик остановился неожиданно, сохраните log/cacti.log и убедитесь, что его процесс завершился, прежде чем явно повторять попытку. Состояние ожидания не подтверждает успешный запуск."
"Importing templates": "Импорт шаблонов"
"Install Kadupul": "Установить Kadupul"
"Installation and upgrade": "Установка и обновление"
"Installation request was rejected.": "Запрос на установку отклонён."
"Installation steps": "Шаги установки"
"Installed": "Установленно"
"Keep a backup of the database, RRD files, configuration and secret material.": "Сохраните резервную копию базы данных, файлов RRD, конфигурации и секретных ключей."
"Language": "Язык"
"Large tables may require the dedicated CLI conversion tool before installation.": "Крупные таблицы могут требовать запуска специализированного CLI-инструмента конвертации перед установкой."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Оставьте поля секретов пустыми, чтобы сохранить текущие учётные данные. Секреты никогда не отображаются повторно."
"License": "Лицензионное соглашение"
"No action needed": "Действий не требуется"
"Observed": "Наблюдалось"
"Open the console": "Открыть консоль"
"Operation": "Операция"
"Override discovery SNMP settings": "Переопределить параметры SNMP для обнаружения"
"Pass": "Пройдено"
"Poller interval in seconds": "Интервал поллера в секундах"
"Preparing CSRF protection": "Подготовка защиты от CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Индикатор выполнения показывает последний зафиксированный этап. Обновление этой страницы никогда не запускает обработчик и не повторяет попытку."
"Recover stopped attempt": "Восстановить остановленную попытку"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Восстановление сохраняет выбранные параметры и никогда не завершает работающий обработчик. Просмотрите план ещё раз перед повторной попыткой."
"Review": "Проверка"
"Review installation plan": "Проверить план установки"
"Run": "Запустить"
"Run reviewed plan": "Выполнить проверенный план"
"Save and review": "Сохранить и проверить"
"Scope": "Область охвата"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Состояние недоступно. Сохранённая работа не потеряна. Обновите страницу для повторного подключения; не отправляйте ещё одну установку."
"Synchronizing collectors": "Синхронизация коллекторов"
"Table conversions": "Конвертация таблиц"
"Templates": "Шаблоны"
"The database version matches this application. Installation does not establish that polling is healthy.": "Версия базы данных соответствует этому приложению. Установка не подтверждает, что опрос работает исправно."
"The request outcome is unknown. Check execution status before retrying.": "Результат запроса неизвестен. Проверьте состояние выполнения перед повторной попыткой."
"Theme": "Тема"
"Verify": "Проверить"
"Verify the poller schedule and service account.": "Проверьте расписание поллера и сервисную учётную запись."
"Version change": "Смена версии"
"Waiting for the installation worker": "Ожидание обработчика установки"
"collector": "коллектор"
"complete": "завершено"
"failed": "сбой"
"finish": "завершение"
"install": "установка"
"not_started": "не запущено"
"partial": "частично"
"running": "выполняется"
"succeeded": "успешно"
"upgrade": "обновление"
"waiting": "ожидание"
"Accept the license before saving the installation plan.": "Примите лицензионное соглашение перед сохранением плана установки."
"Invalid installation form.": "Недопустимая форма установки."
"Access denied.": "Доступ запрещён."
"Confirm the recovery warning before retrying.": "Подтвердите предупреждение о восстановлении перед повторной попыткой."
"Review and confirm the current installation plan.": "Проверьте и подтвердите текущий план установки."
"Confirm the discovery scope before starting.": "Подтвердите область обнаружения перед запуском."
"Resolve the blocking checks before starting.": "Устраните блокирующие проверки перед запуском."
"Too many installer options.": "Слишком много параметров установщика."
"Invalid installer option name.": "Недопустимое имя параметра установщика."
"Unknown or malformed installer option.": "Неизвестный или некорректный параметр установщика."
"Installer options must be scalar values.": "Параметры установщика должны быть скалярными значениями."
"Installer option is too long or contains a null byte.": "Параметр установщика слишком длинный или содержит нулевой байт."
"Installer IDs and intervals must be whole numbers.": "Идентификаторы и интервалы установщика должны быть целыми числами."
"Installer ID or interval is outside its supported range.": "Идентификатор или интервал установщика выходит за пределы допустимого диапазона."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Не удалось продолжить установку. Обновите её состояние и устраните блокирующие проверки перед повторной попыткой."
"Confirm that the previous worker has stopped before recovering its plan.": "Перед восстановлением плана убедитесь, что предыдущий обработчик остановлен."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "База данных установлена, но некоторые коллекторы всё ещё требуют синхронизации. Повторите завершающие задачи после проверки их состояния."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Установка остановлена. Сохраните журнал установщика, устраните причину и явно подтвердите повторную попытку. Некоторые изменения базы данных уже могут быть зафиксированы. Проверьте очистку плагинов перед разрешением повтора."
"Next action": "Следующее действие"
"Follow the execution status. Do not start another attempt while a worker is active.": "Следите за состоянием выполнения. Не запускайте новую попытку, пока обработчик активен."
"Complete the recovery checklist before retrying.": "Выполните контрольный список восстановления перед повторной попыткой."
"Verify collection and graph operation before enabling discovery.": "Проверьте сбор данных и работу графиков перед включением обнаружения."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Устраните заблокированные требования, затем проверьте снова. Сохранённые параметры сохраняются."
"Review the planned changes and backup checklist before authorizing execution.": "Проверьте запланированные изменения и контрольный список резервного копирования перед разрешением выполнения."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Выберите профиль сбора и примите лицензию. При необходимости можно открыть дополнительные параметры."
"Download installation diagnostics": "Скачать диагностику установки"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Откройте график и убедитесь, что его данные RRD обновляются после цикла поллера."
"Requirement details": "Подробности требований"
"Recover": "Восстановить"
"Recovery checklist": "Контрольный список восстановления"
"Preserve log/cacti.log and record the failed attempt.": "Сохраните log/cacti.log и зафиксируйте неудачную попытку."
"Confirm that the previous worker and its child processes have stopped.": "Убедитесь, что предыдущий обработчик и его дочерние процессы завершились."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Проверьте зафиксированные изменения, синхронизацию коллекторов и очистку плагинов. Устраните причину перед повторной попыткой."
"Review the saved plan again, then explicitly authorize a retry.": "Повторно проверьте сохранённый план, затем явно разрешите повторную попытку."
"Recover a stopped worker": "Восстановить остановленный обработчик"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Используйте восстановление только после подтверждения, что эта попытка больше не выполняется. Восстановление не останавливает процесс."
"Collector and installation mode": "Коллектор и режим установки"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Конфигурация развёртывания определяет роль коллектора и подключения к базе данных. Проверьте конфигурацию основного сервера перед запуском коллектора."
"Discovery and SNMP settings": "Параметры обнаружения и SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Держите обнаружение отключённым до тех пор, пока не будут проверены сбор данных и связность с коллекторами."
"Template selection": "Выбор шаблона"
"Templates selected for import": "Шаблоны, выбранные для импорта"
"No templates selected.": "Шаблоны не выбраны."
"Backup checklist": "Контрольный список резервного копирования"
"Database backup and a tested restoration procedure.": "Резервная копия базы данных и проверенная процедура восстановления."
"RRD files and the service account permissions needed to restore them.": "Файлы RRD и права сервисной учётной записи, необходимые для их восстановления."
"Configuration, keys and plugin data outside the database.": "Конфигурация, ключи и данные плагинов вне базы данных."
"Post-installation checks": "Проверки после установки"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Подтверждённые проверки охватывают только показанные данные. Неоценённые проверки всё ещё требуют подтверждения оператором."
"Operational checks still require operator verification.": "Эксплуатационные проверки всё ещё требуют подтверждения оператором."
"Status": "Статус"
"verified": "Проверено"
"action_required": "Требуется действие"
"not_assessed": "Не оценивалось"
"Database schema": "Схема базы данных"
"Stored schema matches the application target.": "Сохранённая схема соответствует целевой схеме приложения."
"Target schema completion has not been confirmed.": "Завершение целевой схемы не подтверждено."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Проверьте результат установки и устраните сбои, прежде чем считать обновление схемы завершённым."
"Installation outcome": "Результат установки"
"A successful receipt matches the current target schema.": "Успешная квитанция соответствует текущей целевой схеме."
"A complete successful installation outcome has not been confirmed.": "Полное успешное завершение установки не подтверждено."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Сохраните журнал установщика и при необходимости используйте явную процедуру восстановления или повторной попытки."
"Collector synchronization": "Синхронизация коллекторов"
"The completed installer reports pending collector synchronization.": "Завершённый установщик сообщает об ожидающей синхронизации коллекторов."
"The completed installer reports no pending collectors.": "Завершённый установщик сообщает об отсутствии ожидающих коллекторов."
"Collector completion remains unconfirmed by this partial receipt.": "Завершение работы коллектора остаётся неподтверждённым по этой частичной квитанции."
"Collector completion is not established by this installation outcome.": "Завершение работы коллектора не подтверждается данным результатом установки."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Проверьте состояние коллекторов и повторите завершающие задачи для частичных результатов. Это не подтверждает последующую актуальность сбора данных."
"Scheduled collection": "Сбор по расписанию"
"No poller or device was contacted by this assessment.": "В ходе этой оценки обращения к поллеру или устройствам не выполнялись."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Убедитесь, что настроенный планировщик запускает поллер от имени требуемой сервисной учётной записи, и проверьте его следующий штатный цикл."
"Graph data": "Данные графиков"
"Live samples and RRD updates were not exercised.": "Живые выборки и обновления RRD не проверялись."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "После обычного цикла сбора данных убедитесь, что на ожидаемые графики поступают свежие выборки, и проверьте журнал на наличие ошибок поллера."
"Recovery readiness": "Готовность к восстановлению"
"Backup restoration was not exercised.": "Восстановление из резервной копии не проверялось."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Проверьте изолированное восстановление базы данных, файлов RRD, конфигурации и ключевого материала, прежде чем полагаться на восстановление."
"No persisted local poller start has been recorded.": "Зафиксированный локальный запуск поллера отсутствует."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Зафиксированное время запуска поллера недопустимо и не может подтвердить работоспособность планировщика."
"The recorded poller start is in the future. Check clock synchronization.": "Зафиксированное время запуска поллера находится в будущем. Проверьте синхронизацию часов."
"The recorded poller start is older than the native scheduling tolerance.": "Зафиксированное время запуска поллера превышает штатный допуск расписания."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Локальный запуск поллера зафиксирован в пределах штатного допуска расписания. Завершение работы и состояние устройств не проверены."
"readable": "доступно для чтения"
"missing or unreadable": "отсутствует или недоступен для чтения"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Восстановите полный выпуск и его зафиксированные зависимости; предоставьте сервисной учётной записи права на чтение."
"PHP temporary directory": "Временный каталог PHP"
"directory writable by this process": "каталог доступен для записи этому процессу"
"missing or not writable": "отсутствует или недоступен для записи"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Настройте sys_temp_dir на существующий каталог с правом записи для учётной записи установки. Нативный импорт использует временные файлы."
"Background worker launch": "Запуск фонового обработчика"
"required PHP functions available; launch not exercised": "необходимые функции PHP доступны; запуск не выполнялся"
"required PHP launch function disabled": "необходимая функция запуска PHP отключена"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Включите exec для веб-среды выполнения PHP или используйте авторизованный CLI-установщик."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Включите popen, pclose для веб-среды выполнения PHP или используйте авторизованный CLI-установщик."
"Database transaction ownership": "Владение транзакциями базы данных"
"autocommit enabled; no caller-owned transaction": "autocommit включён; нет транзакции вызывающей стороны"
"autocommit disabled or caller transaction active": "autocommit отключён или активна транзакция вызывающей стороны"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Запустите установку вне транзакции, принадлежащей вызывающей стороне, и включите autocommit на её соединении для изменений."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Восстановите каталог выпуска и предоставьте учётной записи установки права на запись для импорта ресурсов шаблонов. Не делайте его доступным для записи всем пользователям."
"Worker file: install/background.php": "Файл обработчика: install/background.php"
"Worker file: bin/legacy-installer.php": "Файл обработчика: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Файл обработчика: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Назначение импорта: resource/snmp_queries"
"Import destination: resource/script_server": "Назначение импорта: resource/script_server"
"Import destination: resource/script_queries": "Назначение импорта: resource/script_queries"
"Import destination: scripts": "Назначение импорта: scripts"
"Database privileges": "Привилегии базы данных"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Фактические привилегии миграции, включая активные роли и права на конкретные объекты, не проверялись."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Попросите администратора базы данных проверить необходимые права на запись в таблицы, изменение схемы, триггеры и подпрограммы для учётной записи установки и схемы. Не выдавайте глобальные права администратора."
"Compare web and worker runtimes": "Сравнить веб-среду и среду обработчика"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Это действие явно запускает короткую проверку PHP в режиме только для чтения. Оно не резервирует установщик, не записывает файлы и не обращается к устройствам."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Проверка наследует текущий веб-процесс и использует настроенный интерпретатор PHP установщика. Она не проверяет отдельный планировщик или службу."
"I authorize the read-only worker runtime comparison.": "Я разрешаю сравнение среды выполнения обработчика в режиме только для чтения."
"Compare runtimes": "Сравнить среды выполнения"
"Runtime comparison results": "Результаты сравнения сред выполнения"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Различия в правах доступа и идентификаторах могут быть намеренными. Наблюдения в режиме только для чтения не доказывают, что запись или установка завершатся успешно."
"Confirm the read-only worker runtime comparison.": "Подтвердите сравнение среды выполнения обработчика в режиме только для чтения."
"The runtime comparison is unavailable.": "Сравнение сред выполнения недоступно."
"Shared application secret": "Общий секрет приложения"
"A strong web application secret is required before comparison.": "Перед сравнением требуется надёжный секретный ключ веб-приложения."
"Runtime comparison": "Сравнение сред выполнения"
"The configured worker runtime did not confirm a bounded comparison.": "Настроенная среда выполнения обработчика не подтвердила ограниченное сравнение."
"The inherited worker secret could not be confirmed against the web secret.": "Не удалось подтвердить соответствие унаследованного секрета обработчика веб-секрету."
"PHP runtime comparison": "Сравнение сред выполнения PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Обе среды выполнения должны поддерживать PHP 8.4; различия в номерах патчей требуют проверки."
"Required extension comparison": "Сравнение обязательных расширений"
"Required extension availability is checked; differing versions require review.": "Проверяется наличие обязательных расширений; различия в версиях требуют проверки."
"Process identity comparison": "Сравнение идентификаторов процессов"
"Effective process identity is unavailable on this platform.": "Фактический идентификатор процесса недоступен на этой платформе."
"Effective process identities match.": "Фактические идентификаторы процессов совпадают."
"Effective process identities differ; separate service accounts may be intentional.": "Фактические идентификаторы процессов различаются; раздельные сервисные учётные записи могут быть предусмотрены намеренно."
"Directory access comparison": "Сравнение доступа к каталогам"
"Read-only directory permission observations match.": "Наблюдаемые права доступа к каталогам в режиме только для чтения совпадают."
"Directory locations or permission observations differ; review the service-account roles.": "Расположение каталогов или наблюдаемые права доступа различаются; проверьте роли сервисных учётных записей."
"Worker directory read and traversal": "Чтение и обход каталогов обработчика"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Обязательные каталоги обработчика должны существовать и допускать чтение и обход. Запись не проверялась."
"The inherited worker secret matches the web secret for this private challenge.": "Унаследованный секрет обработчика соответствует веб-секрету для этой закрытой проверки."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Проверьте настроенный интерпретатор PHP, обязательные расширения, унаследованный секрет и права сервисной учётной записи на каталоги. Запись и запуск установщика не выполнялись."
"advisory": "рекомендательный"
