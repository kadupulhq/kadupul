"The Email Address to be used as the senders Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "عنوان البريد الإلكتروني المراد استخدامه كبريد المُرسل لبريد الإشعارات. إذا تُرك فارغاً، فسيُستخدم عنوان بريد إشعارات الأتمتة الافتراضي."
"The Email account name to be used as the senders name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "اسم حساب البريد الإلكتروني المراد استخدامه كاسم المُرسل لبريد الإشعارات. إذا تُرك فارغاً، فسيُستخدم اسم إشعارات الأتمتة الافتراضي."
"The Email account to be used to send the Notification Email to.": "حساب البريد الإلكتروني المراد إرسال بريد الإشعارات إليه."
"The discovery network changed since you opened this form. Reload before saving.": "تغيّرت شبكة الاكتشاف منذ فتح هذا النموذج. أعد التحميل قبل الحفظ."
