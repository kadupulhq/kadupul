"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "قائمة مفصولة بمسافات لخوادم DNS البديلة لاستخدامها في تحليل DNS. إذا تُركت فارغة، فسيُستخدم نظام تشغيل المجمّع لتحليل أسماء DNS."
"Access denied.": "تم رفض الوصول."
"Add Discovery Network": "إضافة شبكة اكتشاف"
"After an initial failure, the number of ping retries to attempt before failing.": "بعد الفشل الأولي، عدد محاولات إعادة الـ ping قبل إعلان الفشل."
"After the selected Run Limit, the discovery process will be terminated.": "بعد حد التشغيل المحدد، سيتم إنهاء عملية الاكتشاف."
"Allow same sysName on different hosts": "السماح بنفس sysName على مضيفين مختلفين"
"Alternate DNS Servers": "خوادم DNS البديلة"
"April": "أبريل"
"Associated Site": "الموقع المرتبط"
"August": "أغسطس"
"Automatically Add Devices": "إضافة الأجهزة تلقائياً"
"Back to Networks": "العودة إلى الشبكات"
"Choose an existing Data Collector.": "اختر مجمّع بيانات موجوداً."
"Choose an existing SNMP Option Set.": "اختر مجموعة خيارات SNMP موجودة."
"Choose an existing Site.": "اختر موقعاً موجوداً."
"Choose one of the listed values.": "اختر إحدى القيم المدرجة."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "اختر مجمّع البيانات/المستطلع المراد استخدامه لجمع البيانات من هذا الجهاز."
"Choose the Site that you wish to associate discovered Devices with.": "اختر الموقع الذي ترغب في ربط الأجهزة المكتشفة به."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "تستخدم الجداول اليومية والأسبوعية وقت البدء وخيار «إعادة التشغيل كل»؛ وتستخدم الأسبوعية أيضاً أيام الأسبوع. وتستخدم الشهرية الأشهر وأيام الشهر؛ وتستخدم «شهرياً في يوم محدد» الأشهر وأسابيع الشهر وأيام الأسبوع."
"Daily": "يومي"
"Data Collector": "جامع البيانات"
"Day(s) of Week": "يوم (أيام) الأسبوع"
"Days of Month": "أيام الشهر"
"Days of Week": "أيام الأسبوع"
"December": "ديسمبر"
"Define the collection frequency.": "حدّد وتيرة الجمع."
"Define the number of threads to use for discovering this Network Range.": "حدّد عدد خيوط المعالجة المراد استخدامها لاكتشاف نطاق الشبكة هذا."
"Discovery Threads": "خيوط معالجة الاكتشاف"
"Discovery Timing": "توقيت الاكتشاف"
