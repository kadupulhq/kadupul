"Enabled": "مفعل"
"Enter DNS servers as IP addresses or host names separated by spaces.": "أدخل خوادم DNS كعناوين IP أو أسماء مضيفين مفصولة بمسافات."
"Enter IPs or FQDNs of DNS Servers": "أدخل عناوين IP أو أسماء FQDN لخوادم DNS"
"Enter a name.": "أدخل اسماً."
"Enter a valid email address.": "أدخل عنوان بريد إلكتروني صالحاً."
"Enter a whole number from %min% to %max%.": "أدخل عدداً صحيحاً من %min% إلى %max%."
"Enter at most %count% bytes.": "أدخل %count% بايت على الأكثر."
"Enter single-line text.": "أدخل نصاً من سطر واحد."
"Enter the start as YYYY-MM-DD HH:MM.": "أدخل وقت البدء بالتنسيق YYYY-MM-DD HH:MM."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "أدخل نطاقات شبكات صالحة مفصولة بفواصل. يمكنك استخدام عنوان IP، أو نطاق شبكة مثل 192.168.1.0/24 أو 192.168.1.0/255.255.255.0، أو استخدام ترميز البدل مثل 192.168.*.*."
"Enter valid network ranges separated by commas.": "أدخل نطاقات شبكات صالحة مفصولة بفواصل."
"February": "فبراير"
"First": "الأول"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "لأي أجهزة مكتشفة حديثاً يمكن الوصول إليها عبر SNMP وتطابق قاعدة جهاز، أضفها كأجهزة."
