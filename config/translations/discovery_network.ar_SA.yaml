"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "قيمة المهلة لاستخدام المضيف ICMP و poding UDP. تنطبق قيمة مهلة SNMP للمضيف على أوامر SNMP."
