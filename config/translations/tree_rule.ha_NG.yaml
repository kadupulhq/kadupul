"A useful name for this Rule.": "Suna mai amfani don wannan Dokar."
"Access denied.": "An hana shiga."
"Add Tree Rule": "Ƙara Dokar Bishiya"
"Back to Tree Rules": "Koma zuwa Dokokin Bishiya"
"Check this box to enable this rule.": "Duba wannan akwatin don kunna wannan dokar."
"Choose a Tree for the new Tree Items.": "Zaɓi Bishiya don sababbin Abubuwan Bishiya."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Zaɓi kanun labari na Bishiya da aka zaɓa don haɗawa a ciki, ko tushenta. Tabbatar cewa har yanzu yana wanzu lokacin da aka aiwatar da wannan dokar."
"Choose a header of the selected Tree.": "Zaɓi kanun labari na Bishiya da aka zaɓa."
"Choose a listed Graph Grouping Style.": "Zaɓi Salon Haɗa Jadawalai da aka jera."
"Choose a listed Leaf Item Type.": "Zaɓi Nau'in Abun Ganye da aka jera."
"Choose an existing Tree.": "Zaɓi Bishiya da ke akwai."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Zaɓi yadda ake haɗa jadawalai lokacin da aka zana su don wannan mai masaukin baki na musamman a kan bishiyar. Ana amfani da shi don ganyen Na'ura."
"Data Query Index": "Fihirisar Tambayar Bayanai"
"Device": "Na'ura"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Ganyen na'ura ba za su iya amfani da sharudda a kan jadawali ko rukunnan samfurin jadawali ba. Lokacin canza Nau'in Abun Ganye zuwa Na'ura, duba wannan akwatin don cire waɗannan sharuddan; ba za a iya dawo da su ba."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Ganyen na'ura ba za su iya amfani da sharudda bisa jadawali ba. Tabbatar da cire sharudda guda %count% don adanawa."
"Edit Tree Rule": "Gyara Dokar Bishiya"
"Enable Rule": "Kunna Doka"
"Enter a name.": "Shigar da suna."
"Enter at most %count% characters.": "Shigar da haruffa %count% a mafi yawa."
"Enter single-line text.": "Shigar da rubutun layi guda."
"Graph": "Jadawali"
"Graph Grouping Style": "Salon Haɗa Jadawalai"
"Graph Template": "Samfurin Jadawali"
"Leaf Item Type": "Nau'in Abun Ganye"
"Name": "Suna"
"Object Selection and Tree Creation Criteria": "Sharuddan Zaɓar Abu da Ƙirƙirar Bishiya"
"Optional: Sub-Tree Item": "Na Zaɓi: Ƙaramin Abun Bishiya"
"Remove graph-based criteria": "Cire sharuddan bisa jadawali"
"Save": "Ajiye"
"Save outcome is uncertain. Reload before retrying.": "Sakamakon ajiye ba shi da tabbas. Sake lodawa kafin sake gwadawa."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Ajiye ƙa'idar da farko; za a ƙara Zaɓin Abu da Ma'aunin Ƙirƙirar Bishiya daga baya."
"The Item Type that shall be dynamically added to the tree.": "Nau'in Abun da za a ƙara zuwa bishiya kai tsaye."
"The tree rule changed since you opened this form. Reload before saving.": "Ƙa'idar bishiya ta canja tun lokacin da ka buɗe wannan fom ɗin. Sake lodawa kafin ajiyewa."
"Tree": "Bishiya"
"Tree Rule Selection [edit: %name%]": "Zaɓin Ƙa'idar Bishiya [gyara: %name%]"
"Tree Rules Selection [new]": "Zaɓin Ƙa'idojin Bishiya [sabo]"
"Tree rule not found.": "Ba a sami ƙa'idar bishiya ba."
"Tree rule saved.": "An ajiye ƙa'idar bishiya."
"Unable to load the tree rule. Reload before retrying.": "An kasa loda ƙa'idar bishiya. Sake lodawa kafin sake gwadawa."
"Unexpected fields were submitted.": "An gabatar da filayen da ba a zata ba."
