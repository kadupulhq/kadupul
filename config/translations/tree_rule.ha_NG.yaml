"Choose a Tree for the new Tree Items.": "Zaɓi Bishiya don sababbin Abubuwan Bishiya."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Zaɓi kanun labari na Bishiya da aka zaɓa don haɗawa a ciki, ko tushenta. Tabbatar cewa har yanzu yana wanzu lokacin da aka aiwatar da wannan dokar."
"Choose a header of the selected Tree.": "Zaɓi kanun labari na Bishiya da aka zaɓa."
