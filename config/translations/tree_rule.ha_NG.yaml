"Choose a listed Leaf Item Type.": "Zaɓi Nau'in Abun Ganye da aka jera."
"Choose an existing Tree.": "Zaɓi Bishiya da ke akwai."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Zaɓi yadda ake haɗa jadawalai lokacin da aka zana su don wannan mai masaukin baki na musamman a kan bishiyar. Ana amfani da shi don ganyen Na'ura."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria."
"Click Continue to disable the following Tree Rules.": "Click Continue to disable the following Tree Rules."
