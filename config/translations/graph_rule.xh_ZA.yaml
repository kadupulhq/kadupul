"A useful name for this Rule.": "Igama eliluncedo lalo Mgaqo."
"Access denied.": "Ufikelelo lwaliwe."
"Add Graph Rule": "Yongeza uMgaqo weGrafu"
"Back to Graph Rules": "Buyela kwiMigaqo yeGrafu"
"Check this box to enable this rule.": "Phawula le bhokisi ukuze uvule lo mgaqo."
"Choose a Data Query to apply to this rule.": "Khetha uMbuzo weDatha ozakusetyenziswa kulo mgaqo."
"Choose a Graph Type": "Khetha uHlobo lweGrafu"
"Choose a Graph Type of the selected Data Query.": "Khetha uHlobo lweGrafu loMbuzo weDatha okhethiweyo."
"Choose an existing Data Query.": "Khetha uMbuzo weDatha okhoyo."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Khetha nayiphi na kwiNdidi zeGrafu ezifumanekayo zoMbuzo weDatha okhethiweyo ukuze uyisebenzise kulo mgaqo."
"Data Query": "Umbuzo weDatha"
"Device Selection and Graph Creation Criteria": "UkuKhetha iSixhobo kunye neMiqathango yokuYila iGrafu"
"Edit Graph Rule": "Hlela uMgaqo weGrafu"
"Enable Rule": "Vula uMgaqo"
"Enter a name.": "Faka igama."
"Enter at most %count% characters.": "Faka ubuninzi beempawu ezingama-%count%."
"Enter single-line text.": "Faka umbhalo womgca omnye."
"Graph Type": "Uhlobo lweGrafu"
"Graph rule not found.": "Umgaqo wegrafu awufumanekanga."
"Graph rule saved.": "Umgaqo wegrafu ugciniwe."
"Name": "Igama"
"Rule Selection [edit: %name%]": "UKhetho loMgaqo [hlela: %name%]"
"Rule Selection [new]": "UKhetho loMgaqo [olutsha]"
"Save": "Gcina"
"Save outcome is uncertain. Reload before retrying.": "Isiphumo sokugcina asiqinisekwanga. Layisha kwakhona ngaphambi kokuzama kwakhona."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Gcina umgaqo kuqala; ukhetho lwezixhobo kunye nemiqathango yokudala igrafu zongezwa emva koko."
"The graph rule changed since you opened this form. Reload before saving.": "Umgaqo wegrafu utshintshile ukusukela oko uvule le fomu. Layisha kwakhona ngaphambi kokugcina."
"Unable to load the graph rule. Reload before retrying.": "Ayikwazi ukulayisha umgaqo wegrafu. Layisha kwakhona ngaphambi kokuzama kwakhona."
"Unexpected fields were submitted.": "Kuthunyelwe iindawo ezingalindelekanga."
