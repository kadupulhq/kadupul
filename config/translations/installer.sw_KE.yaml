"Action": "Kitendo"
"Advanced options": "Chaguo za hali ya juu"
"Applying database upgrades": "Inatekeleza masasisho ya hifadhidata"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Hifadhi nakala rudufu ya hifadhidata, faili za RRD, usanidi na funguo. Masasisho ya hifadhidata yanaweza kuthibitisha mabadiliko ambayo kurejesha kwa programu hakuwezi kutendua."
"Blocked": "Imezuiwa"
"Check": "Kagua"
"Check again": "Kagua tena"
"Check collection freshness and collector connectivity before enabling discovery.": "Kagua upya wa ukusanyaji na muunganisho wa kikusanyaji kabla ya kuwezesha ugunduzi."
"Check requirements": "Kagua mahitaji"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Ukaguzi huchunguza mchakato huu na ruhusa za mfumo wa faili. Hauandiki faili za majaribio au kuwasiliana na vifaa."
"Collection profile": "Wasifu wa ukusanyaji"
"Collector": "Kikusanyaji"
"Configure": "Sanidi"
"Configuring collection profiles": "Inasanidi wasifu wa ukusanyaji"
"Configuring discovery": "Inasanidi ugunduzi"
"Configuring the local device": "Inasanidi kifaa cha ndani"
"Confirming database version": "Inathibitisha toleo la hifadhidata"
"Converting selected tables": "Inabadilisha majedwali yaliyochaguliwa"
"Database version": "Toleo la hifadhidata"
"Disabled": "Imelemazwa"
"Discovery": "Ugunduzi"
"Discovery SNMP settings": "Mipangilio ya SNMP ya ugunduzi"
"Discovery range": "Masafa ya ugunduzi"
"Enable discovery after installation": "Wezesha ugunduzi baada ya usakinishaji"
"Executable paths": "Njia za faili zinazotekelezeka"
"Execution status": "Hali ya utekelezaji"
"Finished execution": "Utekelezaji umekamilika"
"Finishing tasks only. Schema migrations will not be replayed.": "Kazi za kumalizia pekee. Uhamiaji wa muundo hautarudiwa."
"I accept the license terms": "Ninakubali masharti ya leseni"
"I authorize discovery of the displayed range": "Ninaidhinisha ugunduzi wa masafa yanayoonyeshwa"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Nimekagua kumbukumbu na kuthibitisha kuwa mfanyakazi aliyetangulia na michakato yake ya watoto imesimama"
"I checked the previous attempt and accept that some changes may already be committed": "Nimekagua jaribio lililotangulia na ninakubali kuwa baadhi ya mabadiliko huenda tayari yamethibitishwa"
"I reviewed this plan and have the required backups": "Nimekagua mpango huu na nina nakala rudufu zinazohitajika"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ikiwa mfanyakazi atasimama bila kutarajia, hifadhi log/cacti.log na uthibitishe kuwa mchakato wake umekamilika kabla ya kujaribu tena waziwazi. Hali ya kusubiri haithibitishi uzinduzi uliofanikiwa."
"Importing templates": "Inaleta violezo"
"Install Kadupul": "Sakinisha Kadupul"
"Installation and upgrade": "Usakinishaji na upandishaji toleo"
"Installation request was rejected.": "Ombi la usakinishaji lilikataliwa."
"Installation steps": "Hatua za usakinishaji"
"Installed": "Imesakinishwa"
"Keep a backup of the database, RRD files, configuration and secret material.": "Hifadhi nakala rudufu ya hifadhidata, faili za RRD, usanidi na nyenzo za siri."
"Language": "Lugha"
"Large tables may require the dedicated CLI conversion tool before installation.": "Majedwali makubwa yanaweza kuhitaji zana maalum ya ubadilishaji ya CLI kabla ya usakinishaji."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Acha sehemu za siri zikiwa tupu ili kuhifadhi vitambulisho vilivyohifadhiwa. Siri hazionyeshwi tena kamwe."
"License": "Leseni"
"No action needed": "Hakuna kitendo kinachohitajika"
"Observed": "Iliyochunguzwa"
"Open the console": "Fungua konsole"
"Operation": "Operesheni"
"Override discovery SNMP settings": "Batilisha mipangilio ya SNMP ya ugunduzi"
"Pass": "Imepita"
"Poller interval in seconds": "Muda wa Poller katika sekunde"
"Preparing CSRF protection": "Inaandaa ulinzi wa CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Maendeleo yanaonyesha awamu ya mwisho iliyorekodiwa. Kuonyesha upya ukurasa huu hakuwahi kuanzisha au kujaribu tena mfanyakazi."
"Recover stopped attempt": "Rejesha jaribio lililosimama"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Urejeshaji huhifadhi chaguo zilizohifadhiwa na kamwe hausimamishi mfanyakazi hai. Kagua mpango tena kabla ya kujaribu tena."
"Review": "Kagua"
"Review installation plan": "Kagua mpango wa usakinishaji"
"Run": "Endesha"
"Run reviewed plan": "Endesha mpango uliokaguliwa"
"Save and review": "Hifadhi na ukague"
"Scope": "Wigo"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Hali haipatikani. Kazi iliyohifadhiwa inahifadhiwa. Onyesha upya ili kuunganisha tena; usiwasilishe usakinishaji mwingine."
"Synchronizing collectors": "Inasawazisha vikusanyaji"
"Table conversions": "Ubadilishaji wa majedwali"
"Templates": "Violezo"
"The database version matches this application. Installation does not establish that polling is healthy.": "Toleo la hifadhidata linalingana na programu hii. Usakinishaji hauthibitishi kuwa ukusanyaji unaendelea vizuri."
"The request outcome is unknown. Check execution status before retrying.": "Matokeo ya ombi hayajulikani. Kagua hali ya utekelezaji kabla ya kujaribu tena."
"Theme": "Mandhari"
"Verify": "Thibitisha"
"Verify the poller schedule and service account.": "Thibitisha ratiba ya Poller na akaunti ya huduma."
"Version change": "Mabadiliko ya toleo"
"Waiting for the installation worker": "Inasubiri mfanyakazi wa usakinishaji"
"collector": "kikusanyaji"
"complete": "imekamilika"
"failed": "imeshindwa"
"finish": "maliza"
"install": "sakinisha"
"not_started": "haijaanza"
"partial": "sehemu"
"running": "inaendeshwa"
"succeeded": "imefanikiwa"
"upgrade": "pandisha toleo"
"waiting": "inasubiri"
"Accept the license before saving the installation plan.": "Kubali leseni kabla ya kuhifadhi mpango wa usakinishaji."
"Invalid installation form.": "Fomu batili ya usakinishaji."
"Access denied.": "Ufikiaji umekataliwa."
"Confirm the recovery warning before retrying.": "Thibitisha onyo la urejeshaji kabla ya kujaribu tena."
"Review and confirm the current installation plan.": "Kagua na uthibitishe mpango wa sasa wa usakinishaji."
"Confirm the discovery scope before starting.": "Thibitisha wigo wa ugunduzi kabla ya kuanza."
"Resolve the blocking checks before starting.": "Tatua ukaguzi unaozuia kabla ya kuanza."
"Too many installer options.": "Chaguo za kisakinishi ni nyingi mno."
"Invalid installer option name.": "Jina batili la chaguo la kisakinishi."
"Unknown or malformed installer option.": "Chaguo la kisakinishi lisilojulikana au lisiloundwa vizuri."
"Installer options must be scalar values.": "Chaguo za kisakinishi lazima ziwe thamani za skela."
"Installer option is too long or contains a null byte.": "Chaguo la kisakinishi ni refu mno au lina byte tupu."
"Installer IDs and intervals must be whole numbers.": "Vitambulisho vya kisakinishi na muda lazima viwe nambari kamili."
"Installer ID or interval is outside its supported range.": "Kitambulisho cha kisakinishi au muda uko nje ya masafa yake yanayotumika."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Usakinishaji haukuweza kuendelea. Pakia upya hali yake na ukague ukaguzi unaozuia kabla ya kujaribu tena."
"Confirm that the previous worker has stopped before recovering its plan.": "Thibitisha kuwa mfanyakazi aliyetangulia amesimama kabla ya kurejesha mpango wake."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Hifadhidata imesakinishwa, lakini baadhi ya vikusanyaji bado vinahitaji usawazishaji. Jaribu tena kazi za kumalizia baada ya kukagua hali yake."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Usakinishaji umesimama. Hifadhi kumbukumbu ya kisakinishi, rekebisha chanzo na uthibitishe waziwazi jaribio tena. Baadhi ya mabadiliko ya hifadhidata huenda tayari yamethibitishwa. Kagua usafishaji wa programu-jalizi kabla ya kuidhinisha jaribio tena."
"Next action": "Kitendo kinachofuata"
"Follow the execution status. Do not start another attempt while a worker is active.": "Fuatilia hali ya utekelezaji. Usianze jaribio lingine wakati mfanyakazi yuko hai."
"Complete the recovery checklist before retrying.": "Kamilisha orodha hakiki ya urejeshaji kabla ya kujaribu tena."
"Verify collection and graph operation before enabling discovery.": "Thibitisha uendeshaji wa ukusanyaji na grafu kabla ya kuwezesha ugunduzi."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Tatua mahitaji yaliyozuiwa, kisha kagua tena. Chaguo zilizohifadhiwa zinahifadhiwa."
"Review the planned changes and backup checklist before authorizing execution.": "Kagua mabadiliko yaliyopangwa na orodha hakiki ya nakala rudufu kabla ya kuidhinisha utekelezaji."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Chagua wasifu wa ukusanyaji na ukubali leseni. Mipangilio ya hiari inaweza kufunguliwa inapohitajika."
"Download installation diagnostics": "Pakua uchunguzi wa usakinishaji"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Fungua grafu na uthibitishe kuwa data yake ya RRD inasasishwa baada ya mzunguko wa Poller."
"Requirement details": "Maelezo ya mahitaji"
"Recover": "Rejesha"
"Recovery checklist": "Orodha hakiki ya urejeshaji"
"Preserve log/cacti.log and record the failed attempt.": "Hifadhi log/cacti.log na urekodi jaribio lililoshindwa."
"Confirm that the previous worker and its child processes have stopped.": "Thibitisha kuwa mfanyakazi aliyetangulia na michakato yake ya watoto imesimama."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Kagua mabadiliko yaliyothibitishwa, usawazishaji wa kikusanyaji na usafishaji wa programu-jalizi. Rekebisha chanzo kabla ya kujaribu tena."
"Review the saved plan again, then explicitly authorize a retry.": "Kagua mpango uliohifadhiwa tena, kisha uidhinishe waziwazi jaribio tena."
"Recover a stopped worker": "Rejesha mfanyakazi aliyesimama"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Tumia urejeshaji tu baada ya kuthibitisha kuwa jaribio hili haliendeshwi tena. Urejeshaji hausimamishi mchakato."
"Collector and installation mode": "Kikusanyaji na hali ya usakinishaji"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Usanidi wa uwekaji huamua jukumu la kikusanyaji na miunganisho ya hifadhidata. Thibitisha usanidi wa seva kuu kabla ya kuanzisha kikusanyaji."
"Discovery and SNMP settings": "Mipangilio ya ugunduzi na SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Acha ugunduzi ukiwa umelemazwa hadi ukusanyaji na muunganisho wa kikusanyaji vithibitishwe."
"Template selection": "Uteuzi wa kiolezo"
"Templates selected for import": "Violezo vilivyochaguliwa kuletwa"
"No templates selected.": "Hakuna violezo vilivyochaguliwa."
"Backup checklist": "Orodha hakiki ya nakala rudufu"
"Database backup and a tested restoration procedure.": "Nakala rudufu ya hifadhidata na utaratibu wa urejeshaji uliojaribiwa."
"RRD files and the service account permissions needed to restore them.": "Faili za RRD na ruhusa za akaunti ya huduma zinazohitajika kuzirejesha."
"Configuration, keys and plugin data outside the database.": "Usanidi, funguo na data ya programu-jalizi nje ya hifadhidata."
"Post-installation checks": "Ukaguzi wa baada ya usakinishaji"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Ukaguzi uliothibitishwa unashughulikia ushahidi ulioonyeshwa pekee. Ukaguzi ambao haujatathminiwa bado unahitaji uthibitishaji wa mwendeshaji."
"Operational checks still require operator verification.": "Ukaguzi wa kiutendaji bado unahitaji uthibitishaji wa mwendeshaji."
"Status": "Hali"
"verified": "Imethibitishwa"
"action_required": "Kitendo kinahitajika"
"not_assessed": "Haijatathminiwa"
"Database schema": "Muundo wa hifadhidata"
"Stored schema matches the application target.": "Muundo uliohifadhiwa unalingana na lengo la programu."
"Target schema completion has not been confirmed.": "Kukamilika kwa muundo lengwa hakujathibitishwa."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Kagua matokeo ya usakinishaji na utatue hitilafu kabla ya kuchukulia upandishaji toleo wa muundo kuwa umekamilika."
"Installation outcome": "Matokeo ya usakinishaji"
"A successful receipt matches the current target schema.": "Risiti iliyofanikiwa inalingana na muundo lengwa wa sasa."
"A complete successful installation outcome has not been confirmed.": "Matokeo kamili ya usakinishaji uliofanikiwa hayajathibitishwa."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Hifadhi kumbukumbu ya kisakinishi na utumie utaratibu wa wazi wa urejeshaji au kujaribu tena inapohitajika."
"Collector synchronization": "Usawazishaji wa kikusanyaji"
"The completed installer reports pending collector synchronization.": "Kisakinishi kilichokamilika kinaripoti usawazishaji wa vikusanyaji unaosubiri."
"The completed installer reports no pending collectors.": "Kisakinishi kilichokamilika hakiripoti vikusanyaji vinavyosubiri."
"Collector completion remains unconfirmed by this partial receipt.": "Kukamilika kwa kikusanyaji bado hakujathibitishwa na risiti hii ya sehemu."
"Collector completion is not established by this installation outcome.": "Kukamilika kwa kikusanyaji hakuthibitishwi na matokeo haya ya usakinishaji."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Kagua hali ya kikusanyaji na ujaribu tena kazi za kumalizia kwa matokeo ya sehemu. Hii haithibitishi upya wa ukusanyaji wa baadaye."
"Scheduled collection": "Ukusanyaji uliopangwa"
"No poller or device was contacted by this assessment.": "Hakuna Poller au kifaa kilichowasiliana nacho na tathmini hii."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Thibitisha kuwa kipanga ratiba kilichosanidiwa kinaendesha Poller kama akaunti ya huduma iliyokusudiwa na ukague mzunguko wake wa kawaida unaofuata."
"Graph data": "Data ya grafu"
"Live samples and RRD updates were not exercised.": "Sampuli za moja kwa moja na masasisho ya RRD hazikujaribiwa."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Baada ya mzunguko wa kawaida wa ukusanyaji, thibitisha kuwa grafu zinazotarajiwa zinapokea sampuli mpya na ukague hitilafu za Poller."
"Recovery readiness": "Utayari wa urejeshaji"
"Backup restoration was not exercised.": "Urejeshaji wa nakala rudufu haukujaribiwa."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Thibitisha urejeshaji uliotengwa wa hifadhidata, faili za RRD, usanidi na nyenzo za ufunguo kabla ya kutegemea urejeshaji."
"No persisted local poller start has been recorded.": "Hakuna kuanza kwa Poller ya ndani kulikoendelezwa kulikorekodiwa."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Muda wa Poller uliohifadhiwa ni batili na hauwezi kuthibitisha afya ya kipanga ratiba."
"The recorded poller start is in the future. Check clock synchronization.": "Kuanza kwa Poller kulikorekodiwa kuko siku zijazo. Kagua usawazishaji wa saa."
"The recorded poller start is older than the native scheduling tolerance.": "Kuanza kwa Poller kulikorekodiwa ni kwa zamani zaidi kuliko ustahimilivu wa ratiba asilia."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Kuanza kwa Poller ya ndani kulirekodiwa ndani ya ustahimilivu wa ratiba asilia. Kukamilika na hali ya afya ya kifaa hazijathibitishwa."
"readable": "inasomeka"
"missing or unreadable": "inakosekana au haisomeki"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Rejesha toleo kamili na vitegemezi vyake vilivyofungwa; ipatie akaunti ya huduma ruhusa ya kusoma."
"PHP temporary directory": "Saraka ya muda ya PHP"
"directory writable by this process": "saraka inaweza kuandikwa na mchakato huu"
"missing or not writable": "inakosekana au haiwezi kuandikwa"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Sanidi sys_temp_dir kama saraka iliyopo inayoweza kuandikwa na akaunti ya usakinishaji. Uletaji asilia hutumia faili za muda."
"Background worker launch": "Uzinduzi wa mfanyakazi wa chinichini"
"required PHP functions available; launch not exercised": "vitendaji vya PHP vinavyohitajika vinapatikana; uzinduzi haujajaribiwa"
"required PHP launch function disabled": "kitendaji cha uzinduzi cha PHP kinachohitajika kimelemazwa"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Wezesha exec kwa mazingira ya utekelezaji ya PHP ya wavuti, au tumia kisakinishi cha CLI kilichoidhinishwa."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Wezesha popen, pclose kwa mazingira ya utekelezaji ya PHP ya wavuti, au tumia kisakinishi cha CLI kilichoidhinishwa."
"Database transaction ownership": "Umiliki wa muamala wa hifadhidata"
"autocommit enabled; no caller-owned transaction": "autocommit imewezeshwa; hakuna muamala unaomilikiwa na mpigaji simu"
"autocommit disabled or caller transaction active": "autocommit imelemazwa au muamala wa mpigaji simu unatumika"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Endesha usakinishaji nje ya muamala unaomilikiwa na mpigaji simu na uwezeshe autocommit kwenye muunganisho wake wa mabadiliko."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Rejesha saraka ya toleo na uipatie akaunti ya usakinishaji ruhusa ya kuandika kwa ajili ya uletaji wa rasilimali za kiolezo. Usiifanye iweze kuandikwa na kila mtu."
"Worker file: install/background.php": "Faili ya mfanyakazi: install/background.php"
"Worker file: bin/legacy-installer.php": "Faili ya mfanyakazi: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Faili ya mfanyakazi: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Lengwa la uletaji: resource/snmp_queries"
"Import destination: resource/script_server": "Lengwa la uletaji: resource/script_server"
"Import destination: resource/script_queries": "Lengwa la uletaji: resource/script_queries"
"Import destination: scripts": "Lengwa la uletaji: scripts"
"Database privileges": "Ruhusa za hifadhidata"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Ruhusa halisi za uhamiaji, ikijumuisha majukumu amilifu na ruzuku mahususi za vipengee, hazikuthibitishwa."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Mwombe msimamizi wa hifadhidata athibitishe uandishi wa majedwali unaohitajika, mabadiliko ya muundo, vichochezi na taratibu za akaunti ya usakinishaji na muundo. Usitoe ruhusa za msimamizi wa kimataifa."
"Compare web and worker runtimes": "Linganisha mazingira ya utekelezaji ya wavuti na mfanyakazi"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Hii huanzisha waziwazi uchunguzi mfupi wa kusoma tu wa PHP. Haihifadhi kisakinishi, haiandiki faili au kuwasiliana na vifaa."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Uchunguzi unarithi mchakato huu wa wavuti na hutumia mkalimani wa PHP wa kisakinishi aliyesanidiwa. Hauchunguzi kipanga ratiba au huduma tofauti."
"I authorize the read-only worker runtime comparison.": "Ninaidhinisha ulinganishaji wa kusoma tu wa mazingira ya utekelezaji ya mfanyakazi."
"Compare runtimes": "Linganisha mazingira ya utekelezaji"
"Runtime comparison results": "Matokeo ya ulinganishaji wa mazingira ya utekelezaji"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Tofauti za ruhusa na utambulisho zinaweza kuwa za makusudi. Uchunguzi wa kusoma tu hauthibitishi kuwa uandishi au usakinishaji utafanikiwa."
"Confirm the read-only worker runtime comparison.": "Thibitisha ulinganishaji wa kusoma tu wa mazingira ya utekelezaji ya mfanyakazi."
"The runtime comparison is unavailable.": "Ulinganishaji wa mazingira ya utekelezaji haupatikani."
"Shared application secret": "Siri ya programu iliyoshirikiwa"
"A strong web application secret is required before comparison.": "Siri thabiti ya programu ya wavuti inahitajika kabla ya ulinganishaji."
"Runtime comparison": "Ulinganishaji wa mazingira ya utekelezaji"
"The configured worker runtime did not confirm a bounded comparison.": "Mazingira ya utekelezaji ya mfanyakazi yaliyosanidiwa hayakuthibitisha ulinganishaji wenye mipaka."
"The inherited worker secret could not be confirmed against the web secret.": "Siri ya mfanyakazi iliyorithiwa haikuweza kuthibitishwa dhidi ya siri ya wavuti."
"PHP runtime comparison": "Ulinganishaji wa mazingira ya utekelezaji ya PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Mazingira yote mawili lazima yatumie PHP 8.4; matoleo tofauti ya kiraka yanahitaji ukaguzi."
"Required extension comparison": "Ulinganishaji wa viendelezi vinavyohitajika"
"Required extension availability is checked; differing versions require review.": "Upatikanaji wa viendelezi vinavyohitajika hukaguliwa; matoleo tofauti yanahitaji ukaguzi."
"Process identity comparison": "Ulinganishaji wa utambulisho wa mchakato"
"Effective process identity is unavailable on this platform.": "Utambulisho halisi wa mchakato haupatikani kwenye jukwaa hili."
"Effective process identities match.": "Utambulisho halisi wa michakato unalingana."
"Effective process identities differ; separate service accounts may be intentional.": "Utambulisho halisi wa michakato unatofautiana; akaunti tofauti za huduma zinaweza kuwa za makusudi."
"Directory access comparison": "Ulinganishaji wa ufikiaji wa saraka"
"Read-only directory permission observations match.": "Uchunguzi wa kusoma tu wa ruhusa za saraka unalingana."
"Directory locations or permission observations differ; review the service-account roles.": "Maeneo ya saraka au uchunguzi wa ruhusa vinatofautiana; kagua majukumu ya akaunti ya huduma."
"Worker directory read and traversal": "Kusoma na kupita saraka ya mfanyakazi"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Saraka za mfanyakazi zinazohitajika lazima ziwepo na ziruhusu kusoma na kupita. Hakuna uandishi uliojaribiwa."
"The inherited worker secret matches the web secret for this private challenge.": "Siri ya mfanyakazi iliyorithiwa inalingana na siri ya wavuti kwa changamoto hii ya faragha."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Kagua mkalimani wa PHP aliyesanidiwa, viendelezi vinavyohitajika, siri iliyorithiwa na ruhusa za saraka ya akaunti ya huduma. Hakuna uandishi au uanzishaji wa kisakinishi uliojaribiwa."
"advisory": "ushauri"
