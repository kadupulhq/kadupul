"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Najpierw zapisz regułę; jej kryteria wyboru urządzeń i tworzenia wykresów są dodawane później."
"The graph rule changed since you opened this form. Reload before saving.": "Reguła wykresu zmieniła się od otwarcia tego formularza. Odśwież stronę przed zapisaniem."
"Unable to load the graph rule. Reload before retrying.": "Nie można wczytać reguły wykresu. Odśwież stronę przed ponowną próbą."
"Unexpected fields were submitted.": "Przesłano nieoczekiwane pola."
