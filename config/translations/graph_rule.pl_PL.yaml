"Choose an existing Data Query.": "Wybierz istniejące zapytanie o dane."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Wybierz dowolny z dostępnych typów wykresów wybranego zapytania o dane, aby zastosować go w tej regule."
"Data Query": "Zapytanie o dane"
"Device Selection and Graph Creation Criteria": "Kryteria wyboru urządzeń i tworzenia wykresów"
"Edit Graph Rule": "Edytuj regułę wykresu"
"Enable Rule": "Włącz regułę"
"Enter a name.": "Wprowadź nazwę."
"Enter at most %count% characters.": "Wprowadź maksymalnie %count% znaków."
"Enter single-line text.": "Wprowadź tekst jednowierszowy."
"Graph Type": "Rodzaj wykresu"
"Graph rule not found.": "Nie znaleziono reguły wykresu."
"Graph rule saved.": "Zapisano regułę wykresu."
"Name": "Nazwa"
"Rule Selection [edit: %name%]": "Wybór reguły [edycja: %name%]"
"Rule Selection [new]": "Wybór reguły [nowy]"
"Save": "Zapisz"
