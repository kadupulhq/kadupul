"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Daftar server DNS alternatif yang dipisahkan spasi untuk resolusi DNS. Jika kosong, OS poller akan digunakan untuk me-resolve nama DNS."
