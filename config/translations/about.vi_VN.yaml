"About Kadupul": "Giới thiệu về Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul là một dự án mã nguồn mở độc lập phục vụ giám sát mạng và vẽ đồ thị chuỗi thời gian."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Việc phát triển, đóng góp và quyết định phát hành do tổ chức Kadupul quản lý."
