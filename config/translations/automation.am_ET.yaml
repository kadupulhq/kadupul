"The SNMP Option Set changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የSNMP አማራጭ ስብስቡ ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"The SNMP entry changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የSNMP ግቤቱ ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"The SNMP entry order changed since you opened this page. Reload before moving.": "ይህን ገጽ ከከፈቱ በኋላ የSNMP ግቤት ቅደም ተከተሉ ተለውጧል። ከማንቀሳቀስዎ በፊት እንደገና ይጫኑ።"
"The automation template changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የራስ-ሰር አብነቱ ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"The automation template order changed since you opened this page. Reload before moving.": "ይህን ገጽ ከከፈቱ በኋላ የራስ-ሰር አብነት ቅደም ተከተሉ ተለውጧል። ከማንቀሳቀስዎ በፊት እንደገና ይጫኑ።"
"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "ተስፋ ከመቁረጥ በፊት በSNMP የንባብ ሕብረቁምፊ ወደ መሣሪያ ለመድረስ የሚደረጉ ከፍተኛ የሙከራዎች ብዛት።"
"The maximum number of milliseconds Cacti will wait for an SNMP response (does not work with php-snmp support).": "Cacti ለSNMP ምላሽ የሚጠብቀው ከፍተኛ የሚሊሰከንዶች ብዛት (ከphp-snmp ድጋፍ ጋር አይሰራም)።"
"The name can be at most 100 characters.": "ስሙ ከ100 ቁምፊዎች መብለጥ የለበትም።"
"The name format must give every copy a name of 1 to 100 characters.": "The name format must give every copy a name of 1 to 100 characters."
"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "ይህ የSNMP አማራጭ ስብስብ ቅጽ ጊዜው አልፎበታል። የSNMP አማራጭ ስብስቡን እንደገና ይክፈቱ እና የአሁኑን ቅጽ ይጠቀሙ።"
"This is a unique string that will be matched to a devices sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ይህ ከዚህ የራስ-ሰር አብነት ጋር ለማጣመር ከመሣሪያዎች sysDescr ሕብረቁምፊ ጋር የሚዛመድ ልዩ ሕብረቁምፊ ነው። ከማንኛውም የSQL Where አገላለጽ በተጨማሪ ማንኛውም የPerl መደበኛ አገላለጽ ጥቅም ላይ ሊውል ይችላል።"
"This is a unique string that will be matched to a devices sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ይህ ከዚህ የራስ-ሰር አብነት ጋር ለማጣመር ከመሣሪያዎች sysName ሕብረቁምፊ ጋር የሚዛመድ ልዩ ሕብረቁምፊ ነው። ከማንኛውም የSQL Where አገላለጽ በተጨማሪ ማንኛውም የPerl መደበኛ አገላለጽ ጥቅም ላይ ሊውል ይችላል።"
"This is a unique string that will be matched to a devices sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ይህ ከዚህ የራስ-ሰር አብነት ጋር ለማጣመር ከመሣሪያዎች sysOid ሕብረቁምፊ ጋር የሚዛመድ ልዩ ሕብረቁምፊ ነው። ከማንኛውም የSQL Where አገላለጽ በተጨማሪ ማንኛውም የPerl መደበኛ አገላለጽ ጥቅም ላይ ሊውል ይችላል።"
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "ይህ የቆየ የራስ-ሰር አብነት ቅጽ ጊዜው አልፎበታል። የመሣሪያ ደንቦችን ይክፈቱ እና አዲስ ቅጽ ያስገቡ።"
