"System Name Match": "የሥርዓት ስም ተዛማጅ"
"System Name Match is not a regular expression the database accepts.": "የሥርዓት ስም ተዛማጅ የውሂብ ጎታው የሚቀበለው መደበኛ አገላለጽ አይደለም።"
