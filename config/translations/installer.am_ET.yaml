"Import destination: resource/script_server": "የማስመጣት መድረሻ: resource/script_server"
"Import destination: resource/script_queries": "የማስመጣት መድረሻ: resource/script_queries"
"Import destination: scripts": "የማስመጣት መድረሻ: scripts"
"Database privileges": "የዳታቤዝ መብቶች"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "ንቁ ሚናዎችን እና በነገር ላይ የተወሰኑ ስጦታዎችን ጨምሮ ውጤታማ የስደት መብቶች አልተረጋገጡም።"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "የውሂብ ጎታ አስተዳዳሪው ለመጫኛ መለያው እና ለschemaው የሚያስፈልጉትን የሰንጠረዥ ጽሑፎች፣ የschema ለውጦች፣ triggers እና routines እንዲያረጋግጥ ያድርጉ። ዓለም አቀፍ የአስተዳዳሪ መብቶችን አይስጡ።"
"Compare web and worker runtimes": "የድር እና የሰራተኛ አሂድ ጊዜያትን አወዳድር"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "ይህ በግልጽ አጭር ተነባቢ-ብቻ PHP ፍተሻን ይጀምራል። መጫኛን አይይዝም፣ ፋይሎችን አይጽፍም ወይም መሣሪያዎችን አያገኝም።"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "ፍተሻው ይህን የድር ሂደት ይወርሳል እና የተዋቀረውን የመጫኛ PHP ተርጓሚ ይጠቀማል። የተለየ መርሐግብር አውጪን ወይም አገልግሎትን አይመረምርም።"
"I authorize the read-only worker runtime comparison.": "ተነባቢ-ብቻ የሠራተኛ አሂድ ጊዜ ንጽጽርን እፈቅዳለሁ።"
"Compare runtimes": "አሂድ ጊዜያትን አወዳድር"
"Runtime comparison results": "የአሂድ ጊዜ ንጽጽር ውጤቶች"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "የፈቃድ እና የማንነት ልዩነቶች ሆን ተብለው የተደረጉ ሊሆኑ ይችላሉ። ተነባቢ-ብቻ ምልከታዎች ጽሑፎች ወይም መጫን እንደሚሳኩ አያረጋግጡም።"
"Confirm the read-only worker runtime comparison.": "ለንባብ-ብቻ የሆነውን የሰራተኛ አሂድ ጊዜ ንጽጽር ያረጋግጡ።"
"The runtime comparison is unavailable.": "የአሂድ ጊዜ ንጽጽሩ አይገኝም።"
"Shared application secret": "የተጋራ የመተግበሪያ ምስጢር"
"A strong web application secret is required before comparison.": "ከማነጻጸር በፊት ጠንካራ የድር መተግበሪያ ሚስጥር ያስፈልጋል።"
"Runtime comparison": "የአሂድ ጊዜ ንጽጽር"
"The configured worker runtime did not confirm a bounded comparison.": "የተዋቀረው የሠራተኛ አሂድ ጊዜ የተገደበ ንጽጽርን አላረጋገጠም።"
"The inherited worker secret could not be confirmed against the web secret.": "የተወረሰው የሠራተኛ ምስጢር ከድር ምስጢር ጋር ሊረጋገጥ አልቻለም።"
"PHP runtime comparison": "የPHP አሂድ ጊዜ ንጽጽር"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "ሁለቱም አሂድ ጊዜያት PHP 8.4 መደገፍ አለባቸው፤ የሚለያዩ የጥገና ስሪቶች ግምገማ ይፈልጋሉ።"
"Required extension comparison": "የሚያስፈልግ የቅጥያ ንጽጽር"
"Required extension availability is checked; differing versions require review.": "የሚያስፈልግ የቅጥያ መገኘት ተፈትሿል፤ የተለያዩ ስሪቶች ግምገማ ይፈልጋሉ።"
"Process identity comparison": "የሂደት ማንነት ንጽጽር"
"Effective process identity is unavailable on this platform.": "ውጤታማ የሂደት ማንነት በዚህ መድረክ ላይ አይገኝም።"
"Effective process identities match.": "ውጤታማ የሂደት ማንነቶች ይዛመዳሉ።"
"Effective process identities differ; separate service accounts may be intentional.": "ውጤታማ የሂደት ማንነቶች ይለያያሉ፤ የተለዩ የአገልግሎት መለያዎች ሆን ተብሎ የተደረጉ ሊሆኑ ይችላሉ።"
"Directory access comparison": "የማውጫ መዳረሻ ንጽጽር"
"Read-only directory permission observations match.": "ተነባቢ-ብቻ የማውጫ ፈቃድ ምልከታዎች ይዛመዳሉ።"
"Directory locations or permission observations differ; review the service-account roles.": "የማውጫ ቦታዎች ወይም የፈቃድ ምልከታዎች ይለያያሉ፤ የአገልግሎት-መለያ ሚናዎችን ይገምግሙ።"
"Worker directory read and traversal": "የሠራተኛ ማውጫ ንባብ እና መሻገር"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "የሚያስፈልጉ የሠራተኛ ማውጫዎች መኖር አለባቸው እና ማንበብና መሻገር መፍቀድ አለባቸው። ምንም ጽሑፎች አልተሞከሩም።"
"The inherited worker secret matches the web secret for this private challenge.": "የተወረሰው የሠራተኛ ምስጢር ለዚህ የግል ፈተና ከድር ምስጢር ጋር ይዛመዳል።"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "የተዋቀረውን PHP interpreter፣ የሚያስፈልጉ ቅጥያዎችን፣ የተወረሰ ሚስጥርን እና የአገልጋይ-መለያ ማውጫ ፈቃዶችን ይገምግሙ። ምንም ጽሑፎች ወይም የጫኚ ጅምር አልተካሄዱም።"
"advisory": "ምክር"
