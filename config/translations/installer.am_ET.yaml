"Confirm that the previous worker has stopped before recovering its plan.": "እቅዱን መልሶ ከማግኘትዎ በፊት የቀደመው ሰራተኛ መቆሙን ያረጋግጡ።"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "የውሂብ ጎታው ተጭኗል፣ ነገር ግን አንዳንድ ሰብሳቢዎች አሁንም ማመሳሰል ያስፈልጋቸዋል። ሁኔታቸውን ከፈተሹ በኋላ የማጠናቀቂያ ተግባራቱን እንደገና ይሞክሩ።"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "መጫኑ ቆሟል። የመጫኛውን ምዝግብ ማስታወሻ ይጠብቁ፣ መንስኤውን ያስተካክሉ እና ድጋሚ ሙከራን በግልጽ ያረጋግጡ። አንዳንድ የውሂብ ጎታ ለውጦች ቀድሞውኑ ተግባራዊ ሆነው ሊሆን ይችላል። ድጋሚ ሙከራን ከመፍቀድዎ በፊት የተሰኪ ጽዳትን ያረጋግጡ።"
"Next action": "ቀጣይ እርምጃ"
"Follow the execution status. Do not start another attempt while a worker is active.": "የአፈጻጸም ሁኔታውን ይከታተሉ። ሠራተኛ ንቁ ሆኖ ሳለ ሌላ ሙከራ አይጀምሩ።"
"Complete the recovery checklist before retrying.": "እንደገና ከመሞከርዎ በፊት የመልሶ ማግኛ ማረጋገጫ ዝርዝሩን ያጠናቅቁ።"
"Verify collection and graph operation before enabling discovery.": "ግኝትን ከማንቃትዎ በፊት የስብስብ እና የግራፍ አሠራርን ያረጋግጡ።"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "የታገዱትን መስፈርቶች ይፍቱ፣ ከዚያ እንደገና ይፈትሹ። የተቀመጡ ምርጫዎች ይጠበቃሉ።"
"Review the planned changes and backup checklist before authorizing execution.": "አፈጻጸምን ከመፍቀድዎ በፊት የታቀዱትን ለውጦች እና የምትኬ ማረጋገጫ ዝርዝሩን ይገምግሙ።"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "የመሰብሰቢያ መገለጫ ይምረጡ እና ፈቃዱን ይቀበሉ። አማራጭ ቅንብሮች ሲያስፈልግ ሊከፈቱ ይችላሉ።"
"Download installation diagnostics": "የመጫኛ ምርመራዎችን አውርድ"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ግራፍ ክፈት እና ከpoller ዑደት በኋላ የRRD ውሂቡ መዘመኑን አረጋግጥ።"
"Requirement details": "የመስፈርት ዝርዝሮች"
"Recover": "መልሰህ አግኝ"
"Recovery checklist": "የማገገሚያ ማረጋገጫ ዝርዝር"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.logን ይጠብቁ እና ያልተሳካውን ሙከራ ይመዝግቡ።"
"Confirm that the previous worker and its child processes have stopped.": "የቀደመው ሰራተኛ እና የልጅ ሂደቶቹ መቆማቸውን ያረጋግጡ።"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "የተፈጸሙ ለውጦችን፣ የሰብሳቢ ማመሳሰልን እና የተሰኪ ጽዳትን ይመርምሩ። እንደገና ከመሞከርዎ በፊት መንስኤውን ያስተካክሉ።"
"Review the saved plan again, then explicitly authorize a retry.": "የተቀመጠውን እቅድ እንደገና ይገምግሙ፣ ከዚያ ድጋሚ ሙከራን በግልጽ ይፍቀዱ።"
"Recover a stopped worker": "የቆመ ሠራተኛን መልሰህ አግኝ"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "ማገገምን የሚጠቀሙት ይህ ሙከራ ከአሁን በኋላ እየሰራ አለመሆኑን ካረጋገጡ በኋላ ብቻ ነው። ማገገም ሂደትን አያቆምም።"
"Collector and installation mode": "ሰብሳቢ እና የመጫኛ ሁነታ"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "የማሰማራት ውቅሩ የሰብሳቢውን ሚና እና የውሂብ ጎታ ግንኙነቶችን ይወስናል። ሰብሳቢ ከመጀመርዎ በፊት የዋናውን አገልጋይ ውቅር ያረጋግጡ።"
"Discovery and SNMP settings": "ግኝት እና የ SNMP ቅንብሮች"
"Keep discovery disabled until collection and collector connectivity have been verified.": "መሰብሰብ እና የሰብሳቢ ግንኙነት እስኪረጋገጡ ድረስ ግኝትን እንዲቦዝን ያድርጉ።"
"Template selection": "የአብነት ምርጫ"
"Templates selected for import": "ለማስመጣት የተመረጡ አብነቶች"
"No templates selected.": "ምንም አብነቶች አልተመረጡም።"
"Backup checklist": "የምትኬ ማረጋገጫ ዝርዝር"
"Database backup and a tested restoration procedure.": "የዳታቤዝ ምትኬ እና የተሞከረ የመመለስ ሂደት።"
"RRD files and the service account permissions needed to restore them.": "RRD ፋይሎች እና እነሱን ወደነበሩበት ለመመለስ የሚያስፈልጉት የአገልጋይ መለያ ፈቃዶች።"
"Configuration, keys and plugin data outside the database.": "ከዳታቤዙ ውጭ ያሉ ውቅር፣ ቁልፎች እና የተሰኪ ውሂብ።"
"Post-installation checks": "ከመጫኛ በኋላ ፍተሻዎች"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "የተረጋገጡ ፍተሻዎች የሚሸፍኑት የታየውን ማስረጃ ብቻ ነው። ያልተገመገሙ ፍተሻዎች አሁንም የኦፕሬተር ማረጋገጫ ያስፈልጋቸዋል።"
"Operational checks still require operator verification.": "የአሠራር ፍተሻዎች አሁንም የኦፕሬተር ማረጋገጫ ይፈልጋሉ።"
"Status": "ሁኔታ"
"verified": "ተረጋግጧል"
"action_required": "እርምጃ ያስፈልጋል"
"not_assessed": "አልተገመገመም"
"Database schema": "የዳታቤዝ መዋቅር (Schema)"
"Stored schema matches the application target.": "የተቀመጠው መዋቅር ከመተግበሪያው ዒላማ ጋር ይዛመዳል።"
"Target schema completion has not been confirmed.": "የዒላማ መዋቅር ማጠናቀቅ አልተረጋገጠም።"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "የschema ማሻሻያው እንደተጠናቀቀ ከመቆጠሩ በፊት የመጫኛውን ውጤት ይገምግሙ እና ውድቀቶችን ይፍቱ።"
"Installation outcome": "የመጫኛ ውጤት"
"A successful receipt matches the current target schema.": "ስኬታማ ደረሰኝ ከአሁኑ ዒላማ መዋቅር ጋር ይዛመዳል።"
"A complete successful installation outcome has not been confirmed.": "ሙሉ ስኬታማ የመጫኛ ውጤት አልተረጋገጠም።"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "የመጫኛውን ምዝግብ ማስታወሻ ይጠብቁ እና ሲያስፈልግ ግልጽ የመልሶ ማግኛ ወይም የድጋሚ ሙከራ አሰራርን ይጠቀሙ።"
"Collector synchronization": "የሰብሳቢ ማስመር"
"The completed installer reports pending collector synchronization.": "የተጠናቀቀው መጫኛ በመጠባበቅ ላይ ያለ የሰብሳቢ ማመሳሰል እንዳለ ሪፖርት ያደርጋል።"
"The completed installer reports no pending collectors.": "የተጠናቀቀው መጫኛ ምንም በመጠባበቅ ላይ ያሉ ሰብሳቢዎች እንደሌሉ ሪፖርት ያደርጋል።"
"Collector completion remains unconfirmed by this partial receipt.": "የሰብሳቢ መጠናቀቅ በዚህ ከፊል ደረሰኝ ያልተረጋገጠ ሆኖ ይቆያል።"
"Collector completion is not established by this installation outcome.": "የሰብሳቢ መጠናቀቅ በዚህ የመጫኛ ውጤት አልተረጋገጠም።"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "ለከፊል ውጤቶች የሰብሳቢ ሁኔታን ይገምግሙ እና የማጠናቀቂያ ተግባራትን እንደገና ይሞክሩ። ይህ የበኋላ የመሰብሰብ ትኩስነትን አያረጋግጥም።"
"Scheduled collection": "የታቀደ ስብስብ"
"No poller or device was contacted by this assessment.": "በዚህ ግምገማ ምንም poller ወይም መሣሪያ አልተገናኘም።"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "የተዋቀረው መርሐግብር አውጪ ፖለሩን እንደታሰበው የአገልግሎት መለያ እንደሚያስኬድ ያረጋግጡ እና ቀጣዩን መደበኛ ዑደቱን ይገምግሙ።"
"Graph data": "የግራፍ ውሂብ"
"Live samples and RRD updates were not exercised.": "ቀጥታ ናሙናዎች እና የRRD ዝመናዎች አልተካሄዱም።"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "ከመደበኛ የመሰብሰቢያ ዑደት በኋላ፣ የሚጠበቁ ግራፎች ትኩስ ናሙናዎችን ማግኘታቸውን ያረጋግጡ እና የፖለር ስህተቶችን ይገምግሙ።"
"Recovery readiness": "የማገገሚያ ዝግጁነት"
"Backup restoration was not exercised.": "የምትኬ መመለስ አልተሞከረም።"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "በማገገም ላይ ከመታመንዎ በፊት የተገለለ የውሂብ ጎታ፣ የRRD ፋይሎች፣ የውቅር እና የቁልፍ ቁሳቁስ እነበረበት መመለስን ያረጋግጡ።"
"No persisted local poller start has been recorded.": "ምንም የተቀመጠ የአካባቢያዊ poller ጅምር አልተመዘገበም።"
"Persisted poller timing is invalid and cannot establish scheduler health.": "የተቀመጠው የpoller ጊዜ ልክ ያልሆነ ነው እና የመርሐግብር አስያዥ ጤናን ማረጋገጥ አይችልም።"
"The recorded poller start is in the future. Check clock synchronization.": "የተመዘገበው የሰብሳቢ ጅምር ወደፊት ነው። የሰዓት ማመሳሰልን ይፈትሹ።"
"The recorded poller start is older than the native scheduling tolerance.": "የተመዘገበው የሰብሳቢ ጅምር ከአገሬው ተወላጅ የመርሐግብር መቻቻል የበለጠ የቆየ ነው።"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "የአካባቢ ፖለር ጅምር በአገሬው መርሐግብር መቻቻል ውስጥ ተመዝግቧል። መጠናቀቁ እና የመሣሪያ ጤና አልተረጋገጡም።"
"readable": "ሊነበብ የሚችል"
"missing or unreadable": "ጠፍቷል ወይም ሊነበብ አይችልም"
"Restore the complete release and its locked dependencies; grant the service account read access.": "ሙሉውን ልቀት እና የተቆለፉ ጥገኝነቶቹን ወደነበሩበት ይመልሱ፤ ለአገልጋይ መለያው የንባብ መዳረሻ ይስጡ።"
"PHP temporary directory": "PHP ጊዜያዊ ማውጫ"
"directory writable by this process": "በዚህ ሂደት ሊጻፍበት የሚችል ማውጫ"
"missing or not writable": "ጠፍቷል ወይም ሊጻፍበት አይችልም"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir ን በመጫኛ መለያው ሊጻፍበት የሚችል ነባር ማውጫ አድርገው ያዋቅሩ። ቤተኛ ማስመጣቶች ጊዜያዊ ፋይሎችን ይጠቀማሉ።"
"Background worker launch": "የጀርባ ሰራተኛ ማስጀመር"
"required PHP functions available; launch not exercised": "የሚፈለጉ የPHP ተግባራት ይገኛሉ፤ ማስጀመር አልተሞከረም"
"required PHP launch function disabled": "የሚፈለግ የPHP ማስጀመሪያ ተግባር ተሰናክሏል"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "ለድር PHP አሂድ ጊዜ exec ን አንቃ፣ ወይም የተፈቀደውን CLI መጫኛ ይጠቀሙ።"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "ለድር PHP አሂድ ጊዜ popen፣ pclose ን አንቃ፣ ወይም የተፈቀደውን CLI መጫኛ ይጠቀሙ።"
"Database transaction ownership": "የዳታቤዝ ግብይት ባለቤትነት"
"autocommit enabled; no caller-owned transaction": "autocommit ነቅቷል፤ በጠሪ የተያዘ ግብይት የለም"
"autocommit disabled or caller transaction active": "autocommit ተሰናክሏል ወይም የጠሪ ግብይት ንቁ ነው"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "መጫኛውን በጠሪ-ባለቤትነት ከተያዘ ግብይት ውጭ ያሂዱ እና በመለወጫ ግንኙነቱ ላይ autocommitን ያንቁ።"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "የልቀት ማውጫውን ወደነበረበት ይመልሱ እና ለአብነት መርጃ ማስመጣቶች ለመጫኛ መለያው የጽሑፍ መዳረሻ ይስጡ። በዓለም አቀፍ ደረጃ ሊጻፍበት የሚችል አያድርጉት።"
"Worker file: install/background.php": "የሠራተኛ ፋይል: install/background.php"
"Worker file: bin/legacy-installer.php": "የሠራተኛ ፋይል: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "የሠራተኛ ፋይል: include/vendor/autoload.php"
