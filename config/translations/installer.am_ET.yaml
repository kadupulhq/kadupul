"Unknown or malformed installer option.": "ያልታወቀ ወይም የተበላሸ የመጫኛ አማራጭ።"
"Installer options must be scalar values.": "የጫኚ አማራጮች scalar እሴቶች መሆን አለባቸው።"
"Installer option is too long or contains a null byte.": "የጫኚ አማራጭ በጣም ረጅም ነው ወይም ባዶ ባይት ይዟል።"
"Installer IDs and intervals must be whole numbers.": "የጫኚ IDዎች እና ክፍተቶች ሙሉ ቁጥሮች መሆን አለባቸው።"
"Installer ID or interval is outside its supported range.": "የጫኚ ID ወይም ክፍተት ከሚደገፈው ክልል ውጭ ነው።"
