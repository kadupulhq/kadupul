"Remote collectors must be online. Reload and verify the device after a failed assignment before retrying.": "Ururiyayaasha fog waa inay khadka ku jiraan. Dib u soo rar oo xaqiiji aaladda ka dib qoondayn guuldarreysatay ka hor intaadan dib u isku dayin."
