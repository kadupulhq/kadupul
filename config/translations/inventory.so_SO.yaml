"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "Ka saarista aaladda lagama noqon karo halkan. Dooro inaad hayso garaafyada iyo ilaha xogta la demiyay ama aad ka saarto."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "Ilaha xogta la wadaago iyo garaafyada wadajirka ah waa in laga soocaa ka hor ka saarista garaafka. Garaafyada iyo ilaha xogta la hayo waxay noqdaan kuwo aan loo qoondeyn."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "Ururiyayaasha fog ee ay saamayso waa inay khadka ku jiraan. Ka saarista guuldarraysata waxay ka tagi kartaa isbeddello fog ama kuwo kordhin; baar natiijada ka hor intaadan dib isugu dayin."
"RRD file cleanup follows the configured maintenance policy.": "Nadiifinta faylka RRD waxay raacdaa siyaasadda dayactirka ee la habeeyay."
