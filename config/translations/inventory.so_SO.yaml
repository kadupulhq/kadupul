"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Qoondeynta la xushay waxaa lagu dabbaqaa aalad kasta oo liiska ku jirta. Isbeddellada qaab-dhismeedku waxay ilaaliyaan garaafyada jira; otomaatiggu wuxuu abuuri karaa garaafyo cusub. Isbeddellada ururiyuhu waxay wareejiyaan lahaanshaha xog-ururinta."
