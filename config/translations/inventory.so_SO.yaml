"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Ku dabbaq qaab-dhismeedyada hadda loo qoondeeyay aaladahan. Xiriirrada garaafka iyo weydiinta xogta ee maqan waa la daraa, xiriirrada qaab-dhismeedka garaafka ee aan la isticmaalinna waa laga saari karaa. Aaladaha aan lahayn qaab-dhismeedyo waa laga boodaa. Garaafyada jira iyo xogta taariikhiga ah waa la hayaa; otomaatiggu wuxuu abuuri karaa garaafyo cusub."
