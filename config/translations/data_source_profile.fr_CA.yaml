"How data is to be entered in RRAs.": "Comment les données doivent être saisies dans les arr."
"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "Durée pendant laquelle les données peuvent être manquantes avant que RRDtool n'enregistre des données inconnues. Augmentez cette valeur si votre source de données est instable et que vous souhaitez reporter d'anciennes données plutôt que d'afficher des trous dans vos graphiques. Cette valeur est multipliée par le facteur X-Files pour déterminer la durée réelle."
"How many generations data is kept in the RRA.": "Combien de générations de données sont conservées dans le RRA."
"Is this the default storage profile?": "S'agit-il du profil de stockage par défaut ?"
"N/A": "N/A"
