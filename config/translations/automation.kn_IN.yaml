"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "ಈ SNMP ಆಯ್ಕೆ ಸೆಟ್ ಫಾರ್ಮ್ ಅವಧಿ ಮುಗಿದಿದೆ. SNMP ಆಯ್ಕೆ ಸೆಟ್ ಅನ್ನು ಮತ್ತೆ ತೆರೆದು ಅದರ ಪ್ರಸ್ತುತ ಫಾರ್ಮ್ ಅನ್ನು ಬಳಸಿ."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ಇದು ಸಾಧನದ sysDescr ಸ್ಟ್ರಿಂಗ್‌ಗೆ ಹೊಂದಿಸಿ ಅದನ್ನು ಈ ಆಟೋಮೇಶನ್ ಟೆಂಪ್ಲೇಟ್‌ನೊಂದಿಗೆ ಜೋಡಿಸುವ ವಿಶಿಷ್ಟ ಸ್ಟ್ರಿಂಗ್ ಆಗಿದೆ. ಯಾವುದೇ SQL Where ಅಭಿವ್ಯಕ್ತಿಯ ಜೊತೆಗೆ ಯಾವುದೇ Perl ನಿಯಮಿತ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಬಳಸಬಹುದು."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ಇದು ಸಾಧನದ sysName ಸ್ಟ್ರಿಂಗ್‌ಗೆ ಹೊಂದಿಸಿ ಅದನ್ನು ಈ ಆಟೋಮೇಶನ್ ಟೆಂಪ್ಲೇಟ್‌ನೊಂದಿಗೆ ಜೋಡಿಸುವ ವಿಶಿಷ್ಟ ಸ್ಟ್ರಿಂಗ್ ಆಗಿದೆ. ಯಾವುದೇ SQL Where ಅಭಿವ್ಯಕ್ತಿಯ ಜೊತೆಗೆ ಯಾವುದೇ Perl ನಿಯಮಿತ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಬಳಸಬಹುದು."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ಇದು ಸಾಧನದ sysOid ಸ್ಟ್ರಿಂಗ್‌ಗೆ ಹೊಂದಿಸಿ ಅದನ್ನು ಈ ಆಟೋಮೇಶನ್ ಟೆಂಪ್ಲೇಟ್‌ನೊಂದಿಗೆ ಜೋಡಿಸುವ ವಿಶಿಷ್ಟ ಸ್ಟ್ರಿಂಗ್ ಆಗಿದೆ. ಯಾವುದೇ SQL Where ಅಭಿವ್ಯಕ್ತಿಯ ಜೊತೆಗೆ ಯಾವುದೇ Perl ನಿಯಮಿತ ಅಭಿವ್ಯಕ್ತಿಯನ್ನು ಬಳಸಬಹುದು."
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "ಈ ಹಳೆಯ ಆಟೋಮೇಶನ್ ಟೆಂಪ್ಲೇಟ್ ಫಾರ್ಮ್‌ನ ಅವಧಿ ಮುಗಿದಿದೆ. ಸಾಧನ ನಿಯಮಗಳನ್ನು ತೆರೆದು ಹೊಸ ಫಾರ್ಮ್ ಅನ್ನು ಸಲ್ಲಿಸಿ."
