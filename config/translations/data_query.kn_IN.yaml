"Choose the input method for this Data Query.  This input method defines how data is collected for each Device associated with the Data Query.": "ಈ ಡೇಟಾ ಕ್ವೆರಿಗೆ ಇನ್‌ಪುಟ್ ವಿಧಾನವನ್ನು ಆಯ್ಕೆಮಾಡಿ.  ಈ ಇನ್‌ಪುಟ್ ವಿಧಾನವು ಡೇಟಾ ಕ್ವೆರಿಗೆ ಸಂಯೋಜಿತವಾದ ಪ್ರತಿ ಸಾಧನಕ್ಕೆ ಡೇಟಾ ಹೇಗೆ ಸಂಗ್ರಹವಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ವ್ಯಾಖ್ಯಾನಿಸುತ್ತದೆ."
