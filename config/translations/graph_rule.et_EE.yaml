"A useful name for this Rule.": "Selle reegli kasulik nimi."
"Access denied.": "Juurdepääs keelatud."
"Add Graph Rule": "Lisa graafikureegel"
"Back to Graph Rules": "Tagasi graafikureeglite juurde"
"Cancel": "Tühista"
"Check this box to enable this rule.": "Selle reegli lubamiseks märgi see ruut."
"Choose a Data Query to apply to this rule.": "Vali sellele reeglile rakendatav andmepäring."
"Choose a Graph Type": "Vali graafiku tüüp"
"Choose a Graph Type of the selected Data Query.": "Vali valitud andmepäringu graafiku tüüp."
"Choose an existing Data Query.": "Vali olemasolev andmepäring."
