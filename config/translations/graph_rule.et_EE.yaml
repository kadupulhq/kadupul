"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Järgmiste graafikureeglite kustutamiseks koos nende seadmevaliku ja graafikuloome kriteeriumidega klõpsa „Jätka“."
"Click Continue to disable the following Graph Rules.": "Järgmiste graafikureeglite keelamiseks klõpsa „Jätka“."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Järgmiste graafikureeglite kopeerimiseks klõpsa „Jätka“. Soovi korral võid uute graafikureeglite, mis algavad keelatuna, pealkirja vormingut muuta."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Järgmiste graafikureeglite lubamiseks klõpsa „Jätka“. Veendu, et need on edukalt testitud."
