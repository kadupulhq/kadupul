"A useful name for this Rule.": "ఈ నియమం కోసం ఉపయోగకరమైన పేరు."
"Access denied.": "యాక్సెస్ నిరాకరించబడింది."
"Add Graph Rule": "గ్రాఫ్ నియమాన్ని జోడించు"
"Back to Graph Rules": "గ్రాఫ్ నియమాలకు తిరిగి వెళ్ళు"
"Check this box to enable this rule.": "ఈ నియమాన్ని ప్రారంభించడానికి ఈ పెట్టెను ఎంచుకోండి."
"Choose a Data Query to apply to this rule.": "ఈ నియమానికి వర్తింపజేయడానికి డేటా క్వెరీని ఎంచుకోండి."
"Choose a Graph Type": "గ్రాఫ్ రకాన్ని ఎంచుకోండి"
"Choose a Graph Type of the selected Data Query.": "ఎంచుకున్న డేటా క్వెరీ యొక్క గ్రాఫ్ రకాన్ని ఎంచుకోండి."
"Choose an existing Data Query.": "ఇప్పటికే ఉన్న డేటా క్వెరీని ఎంచుకోండి."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "ఈ నియమానికి వర్తింపజేయడానికి ఎంచుకున్న డేటా క్వెరీలో అందుబాటులో ఉన్న గ్రాఫ్ రకాలలో దేనినైనా ఎంచుకోండి."
"Data Query": "డేటా క్వెరీ"
"Device Selection and Graph Creation Criteria": "పరికర ఎంపిక మరియు గ్రాఫ్ సృష్టి ప్రమాణాలు"
"Edit Graph Rule": "గ్రాఫ్ నియమాన్ని సవరించు"
"Enable Rule": "నియమాన్ని ప్రారంభించు"
"Enter a name.": "పేరును నమోదు చేయండి."
"Enter at most %count% characters.": "గరిష్టంగా %count% అక్షరాలు నమోదు చేయండి."
"Enter single-line text.": "సింగిల్-లైన్ టెక్స్ట్‌ను నమోదు చేయండి."
"Graph Type": "గ్రాఫ్ రకం"
"Graph rule not found.": "గ్రాఫ్ నియమం కనుగొనబడలేదు."
"Graph rule saved.": "గ్రాఫ్ నియమం సేవ్ చేయబడింది."
"Name": "పేరు"
"Rule Selection [edit: %name%]": "నియమం ఎంపిక [సవరణ: %name%]"
"Rule Selection [new]": "నియమం ఎంపిక [కొత్తది]"
"Save": "సేవ్ చేయి"
"Save outcome is uncertain. Reload before retrying.": "సేవ్ ఫలితం అనిశ్చితంగా ఉంది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "ముందుగా నియమాన్ని సేవ్ చేయండి; దాని పరికర ఎంపిక మరియు గ్రాఫ్ సృష్టి ప్రమాణాలు ఆ తర్వాత జోడించబడతాయి."
"The graph rule changed since you opened this form. Reload before saving.": "మీరు ఈ ఫారమ్‌ను తెరిచిన తర్వాత గ్రాఫ్ నియమం మారింది. సేవ్ చేసే ముందు మళ్లీ లోడ్ చేయండి."
"Unable to load the graph rule. Reload before retrying.": "గ్రాఫ్ నియమాన్ని లోడ్ చేయలేకపోయింది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Unexpected fields were submitted.": "ఊహించని ఫీల్డ్‌లు సమర్పించబడ్డాయి."
