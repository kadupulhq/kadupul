"The discovery network changed since you opened this form. Reload before saving.": "നിങ്ങൾ ഈ ഫോം തുറന്നതിന് ശേഷം ഡിസ്കവറി നെറ്റ്‌വർക്ക് മാറി. സംരക്ഷിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
