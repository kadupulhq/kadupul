"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "ദിവസേന, പ്രതിവാര ഷെഡ്യൂളുകൾ ആരംഭവും വീണ്ടും പ്രവർത്തിപ്പിക്കൽ ഇടവേളയും ഉപയോഗിക്കുന്നു; പ്രതിവാരം ആഴ്ചയിലെ ദിവസങ്ങളും ഉപയോഗിക്കുന്നു. പ്രതിമാസം മാസങ്ങളും മാസത്തിലെ ദിവസങ്ങളും ഉപയോഗിക്കുന്നു; മാസത്തിലെ ദിവസം മാസങ്ങൾ, മാസത്തിലെ ആഴ്ചകൾ, ആഴ്ചയിലെ ദിവസങ്ങൾ എന്നിവ ഉപയോഗിക്കുന്നു."
