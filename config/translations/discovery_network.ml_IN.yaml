"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS റെസലൂഷനായി ഉപയോഗിക്കേണ്ട ബദൽ DNS സെർവറുകളുടെ സ്പേസ് ഉപയോഗിച്ച് വേർതിരിച്ച ലിസ്റ്റ്. ശൂന്യമാണെങ്കിൽ DNS പേരുകൾ പരിഹരിക്കാൻ പോളർ OS ഉപയോഗിക്കും."
