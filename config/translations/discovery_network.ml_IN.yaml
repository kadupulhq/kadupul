"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "ഹോസ്റ്റ് ICMP, UDP പിംഗിംഗിന് ഉപയോഗിക്കേണ്ട ടൈംഔട്ട് മൂല്യം. ഈ ഹോസ്റ്റ് SNMP ടൈംഔട്ട് മൂല്യം SNMP പിംഗുകൾക്ക് ബാധകമാണ്."
"The type of ping packet to send.": "അയയ്ക്കേണ്ട പിംഗ് പാക്കറ്റിന്റെ തരം."
"Third": "മൂന്നാമത്തെ"
"Thursday": "വ്യാഴം"
"Total IP Addresses: %count%": "ആകെ IP വിലാസങ്ങൾ: %count%"
"Tuesday": "ചൊവ്വ"
"UDP Ping": "UDP പിംഗ്"
"Unable to load the discovery network. Reload before retrying.": "ഡിസ്കവറി നെറ്റ്‌വർക്ക് ലോഡ് ചെയ്യാനായില്ല. വീണ്ടും ശ്രമിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"Unexpected fields were submitted.": "പ്രതീക്ഷിക്കാത്ത ഫീൽഡുകൾ സമർപ്പിച്ചു."
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "അപ് ആയ ഹോസ്റ്റുകളുടെ ഹോസ്റ്റ്നാമം പരിഹരിക്കാൻ ശ്രമിക്കാൻ NetBIOS ഉപയോഗിക്കുക."
"Wednesday": "ബുധൻ"
"Week(s) of Month": "മാസത്തിലെ ആഴ്ച/ആഴ്ചകൾ"
"Weekly": "പ്രതിവാരം"
"What Day(s) of the Month will this Network Range be discovered?": "ഈ നെറ്റ്‌വർക്ക് റേഞ്ച് മാസത്തിലെ ഏത് ദിവസം/ദിവസങ്ങളിൽ കണ്ടെത്തണം?"
"What Day(s) of the week will this Network Range be discovered?": "ഈ നെറ്റ്‌വർക്ക് റേഞ്ച് ആഴ്ചയിലെ ഏത് ദിവസം/ദിവസങ്ങളിൽ കണ്ടെത്തണം?"
"What Month(s) of the Year will this Network Range be discovered?": "ഈ നെറ്റ്‌വർക്ക് റേഞ്ച് വർഷത്തിലെ ഏത് മാസം/മാസങ്ങളിൽ കണ്ടെത്തണം?"
"What Week(s) of the Month will this Network Range be discovered?": "ഈ നെറ്റ്‌വർക്ക് റേഞ്ച് മാസത്തിലെ ഏത് ആഴ്ച/ആഴ്ചകളിൽ കണ്ടെത്തണം?"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "ഈ നെറ്റ്‌വർക്ക് ഡിസ്കവറി ഇനം ഏത് സമയത്ത് ആരംഭിക്കണം? YYYY-MM-DD HH:MM ആയി നൽകുക."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "ഉപകരണങ്ങൾ കണ്ടെത്തുമ്പോൾ, വ്യത്യസ്ത ഹോസ്റ്റുകളിൽ ഒരേ sysname ചേർക്കാൻ അനുവദിക്കുക"
"You must specify both the Months and Days of Month.": "നിങ്ങൾ മാസങ്ങളും മാസത്തിലെ ദിവസങ്ങളും രണ്ടും വ്യക്തമാക്കണം."
"You must specify the Months, Weeks of Month, and Days of Week.": "നിങ്ങൾ മാസങ്ങൾ, മാസത്തിലെ ആഴ്ചകൾ, ആഴ്ചയിലെ ദിവസങ്ങൾ എന്നിവ വ്യക്തമാക്കണം."
"You must specify the day of the week.": "നിങ്ങൾ ആഴ്ചയിലെ ദിവസം വ്യക്തമാക്കണം."
