"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "കോമ ഉപയോഗിച്ച് വേർതിരിച്ച സാധുവായ നെറ്റ്‌വർക്ക് റേഞ്ചുകൾ നൽകുക. നിങ്ങൾക്ക് ഒരു IP വിലാസം, 192.168.1.0/24 അല്ലെങ്കിൽ 192.168.1.0/255.255.255.0 പോലുള്ള ഒരു നെറ്റ്‌വർക്ക് റേഞ്ച്, അല്ലെങ്കിൽ 192.168.*.* പോലുള്ള വൈൽഡ്കാർഡ് നോട്ടേഷൻ ഉപയോഗിക്കാം."
