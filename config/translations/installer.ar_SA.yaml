"Accept the license before saving the installation plan.": "اقبل الترخيص قبل حفظ خطة التثبيت."
"Invalid installation form.": "نموذج التثبيت غير صالح."
"Access denied.": "تم رفض الوصول."
"Confirm the recovery warning before retrying.": "أكّد تحذير الاسترداد قبل إعادة المحاولة."
"Review and confirm the current installation plan.": "راجع خطة التثبيت الحالية وأكّدها."
"Confirm the discovery scope before starting.": "تأكد من نطاق الاكتشاف قبل البدء."
"Resolve the blocking checks before starting.": "عالج الفحوصات المانعة قبل البدء."
"Too many installer options.": "خيارات المثبّت كثيرة جداً."
"Invalid installer option name.": "اسم خيار المثبّت غير صالح."
"Unknown or malformed installer option.": "خيار مثبّت غير معروف أو غير سليم الصياغة."
"Installer options must be scalar values.": "يجب أن تكون خيارات المثبّت قيماً سُلمية (scalar)."
"Installer option is too long or contains a null byte.": "خيار المثبّت طويل جداً أو يحتوي على بايت فارغ (null)."
"Installer IDs and intervals must be whole numbers.": "يجب أن تكون معرّفات المثبّت والفواصل الزمنية أعداداً صحيحة."
"Installer ID or interval is outside its supported range.": "معرّف المثبّت أو الفاصل الزمني خارج نطاقه المدعوم."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "تعذّر متابعة التثبيت. أعد تحميل حالته وراجع الفحوصات المانعة قبل إعادة المحاولة."
"Confirm that the previous worker has stopped before recovering its plan.": "تأكد من توقف العامل السابق قبل استرداد خطته."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "تم تثبيت قاعدة البيانات، لكن لا تزال بعض المجمّعات بحاجة إلى مزامنة. أعد محاولة المهام الختامية بعد التحقق من حالتها."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "توقف التثبيت. احتفظ بسجل المثبّت وصحّح السبب وأكّد إعادة المحاولة صراحةً. قد تكون بعض تغييرات قاعدة البيانات قد ثُبّتت بالفعل. تحقق من تنظيف الإضافات قبل التصريح بإعادة المحاولة."
"Next action": "الإجراء التالي"
"Follow the execution status. Do not start another attempt while a worker is active.": "تابع حالة التنفيذ. لا تبدأ محاولة أخرى أثناء نشاط أحد العمال."
"Complete the recovery checklist before retrying.": "أكمل قائمة التحقق من الاسترداد قبل إعادة المحاولة."
"Verify collection and graph operation before enabling discovery.": "تحقق من عمل الجمع والرسوم البيانية قبل تفعيل الاكتشاف."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "عالج المتطلبات المحظورة، ثم تحقق مرة أخرى. يتم الاحتفاظ بالتحديدات المحفوظة."
"Review the planned changes and backup checklist before authorizing execution.": "راجع التغييرات المخططة وقائمة التحقق من النسخ الاحتياطي قبل التصريح بالتنفيذ."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "اختر ملف تعريف للجمع واقبل الترخيص. يمكن فتح الإعدادات الاختيارية عند الحاجة."
"Download installation diagnostics": "تنزيل تشخيصات التثبيت"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "افتح رسماً بيانياً وتأكد من تحديث بيانات RRD الخاصة به بعد دورة المستطلع."
"Requirement details": "تفاصيل المتطلبات"
"Recover": "استرداد"
"Recovery checklist": "قائمة التحقق من الاسترداد"
"Preserve log/cacti.log and record the failed attempt.": "احتفظ بملف log/cacti.log وسجّل المحاولة الفاشلة."
"Confirm that the previous worker and its child processes have stopped.": "تأكد من توقف العامل السابق وعملياته الفرعية."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "افحص التغييرات المثبّتة ومزامنة المجمّع وتنظيف الإضافات. صحّح السبب قبل إعادة المحاولة."
"Review the saved plan again, then explicitly authorize a retry.": "راجع الخطة المحفوظة مرة أخرى، ثم صرّح صراحةً بإعادة المحاولة."
"Recover a stopped worker": "استرداد عامل متوقف"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "استخدم الاسترداد فقط بعد التأكد من أن هذه المحاولة لم تعد قيد التشغيل. لا يوقف الاسترداد أي عملية."
"Collector and installation mode": "المجمّع ووضع التثبيت"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "يحدّد تكوين النشر دور المجمّع واتصالات قاعدة البيانات. تحقق من تكوين الخادم الرئيسي قبل بدء تشغيل المجمّع."
"Discovery and SNMP settings": "إعدادات الاكتشاف وSNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "أبقِ الاكتشاف معطّلاً حتى يتم التحقق من الجمع واتصال المجمّع."
"Template selection": "تحديد القالب"
"Templates selected for import": "القوالب المحددة للاستيراد"
"No templates selected.": "لم يتم تحديد أي قوالب."
"Backup checklist": "قائمة التحقق من النسخ الاحتياطي"
"Database backup and a tested restoration procedure.": "نسخ احتياطي لقاعدة البيانات وإجراء استعادة مختبَر."
"RRD files and the service account permissions needed to restore them.": "ملفات RRD وأذونات حساب الخدمة اللازمة لاستعادتها."
"Configuration, keys and plugin data outside the database.": "التكوين والمفاتيح وبيانات الإضافات خارج قاعدة البيانات."
"Post-installation checks": "فحوصات ما بعد التثبيت"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "تغطي الفحوصات المتحقّق منها الأدلة المعروضة فقط. ولا تزال الفحوصات غير المقيّمة تتطلب تحقق المشغّل."
"Operational checks still require operator verification.": "لا تزال الفحوصات التشغيلية تتطلب تحقق المشغّل."
"Status": "الحالة"
"verified": "متحقّق منه"
"action_required": "إجراء مطلوب"
"not_assessed": "غير مقيّم"
"Database schema": "مخطط قاعدة البيانات"
"Stored schema matches the application target.": "يطابق المخطط المخزن هدف التطبيق."
"Target schema completion has not been confirmed.": "لم يتم تأكيد اكتمال المخطط المستهدف."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "راجع نتيجة التثبيت وعالج الإخفاقات قبل اعتبار ترقية المخطط مكتملة."
"Installation outcome": "نتيجة التثبيت"
"A successful receipt matches the current target schema.": "يطابق الإيصال الناجح المخطط المستهدف الحالي."
"A complete successful installation outcome has not been confirmed.": "لم يتم تأكيد إتمام التثبيت بنجاح بالكامل."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "احتفظ بسجل المثبّت واستخدم إجراء الاسترداد أو إعادة المحاولة الصريح عند اللزوم."
"Collector synchronization": "مزامنة المجمّع"
"The completed installer reports pending collector synchronization.": "يُبلغ المثبّت المكتمل عن وجود مزامنة معلّقة للمجمّعات."
"The completed installer reports no pending collectors.": "يُبلغ المثبّت المكتمل عن عدم وجود مجمّعات معلّقة."
"Collector completion remains unconfirmed by this partial receipt.": "يظل اكتمال المجمّع غير مؤكد من خلال هذا الإيصال الجزئي."
"Collector completion is not established by this installation outcome.": "لم يُثبت اكتمال المجمّع من خلال نتيجة التثبيت هذه."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "راجع حالة المجمّع وأعد محاولة المهام الختامية للنتائج الجزئية. لا يتحقق هذا من حداثة الجمع اللاحقة."
"Scheduled collection": "الجمع المجدول"
"No poller or device was contacted by this assessment.": "لم يتم الاتصال بأي مجمّع أو جهاز بواسطة هذا التقييم."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "تأكد من أن المجدول المكوّن يشغّل المستطلع بصفته حساب الخدمة المقصود وراجع دورته الاعتيادية التالية."
"Graph data": "بيانات الرسم البياني"
"Live samples and RRD updates were not exercised.": "لم يتم اختبار العينات الحية وتحديثات RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "بعد دورة جمع اعتيادية، تأكد من أن الرسوم البيانية المتوقعة تتلقى عينات حديثة وراجع أخطاء المجمّع."
"Recovery readiness": "جاهزية الاسترداد"
"Backup restoration was not exercised.": "لم يتم اختبار استعادة النسخة الاحتياطية."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "تحقق من استعادة معزولة لقاعدة البيانات وملفات RRD والتكوين ومواد المفاتيح قبل الاعتماد على الاسترداد."
"No persisted local poller start has been recorded.": "لم يتم تسجيل أي بدء مستمر للمجمّع المحلي."
"Persisted poller timing is invalid and cannot establish scheduler health.": "توقيت المستطلع المحفوظ غير صالح ولا يمكنه إثبات سلامة المجدول."
"The recorded poller start is in the future. Check clock synchronization.": "بدء تشغيل المستطلع المسجّل في المستقبل. تحقق من مزامنة الساعة."
"The recorded poller start is older than the native scheduling tolerance.": "بدء تشغيل المستطلع المسجّل أقدم من سماحية الجدولة الأصلية."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "تم تسجيل بدء تشغيل المجمّع المحلي ضمن سماحية الجدولة الأصلية. لم يتم التحقق من الاكتمال وسلامة الجهاز."
"readable": "قابل للقراءة"
"missing or unreadable": "مفقود أو غير قابل للقراءة"
"Restore the complete release and its locked dependencies; grant the service account read access.": "استعد الإصدار الكامل وتبعياته المقفلة؛ وامنح حساب الخدمة حق القراءة."
"PHP temporary directory": "دليل PHP المؤقت"
"directory writable by this process": "الدليل قابل للكتابة من قِبل هذه العملية"
"missing or not writable": "مفقود أو غير قابل للكتابة"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "كوّن sys_temp_dir كدليل موجود قابل للكتابة من قِبل حساب التثبيت. تستخدم عمليات الاستيراد الأصلية ملفات مؤقتة."
"Background worker launch": "تشغيل عامل الخلفية"
"required PHP functions available; launch not exercised": "دوال PHP المطلوبة متاحة؛ لم يتم اختبار التشغيل"
"required PHP launch function disabled": "دالة تشغيل PHP المطلوبة معطّلة"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "فعّل exec لبيئة تشغيل PHP للويب، أو استخدم مثبّت CLI المصرّح به."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "فعّل popen وpclose لبيئة تشغيل PHP للويب، أو استخدم مثبّت CLI المصرّح به."
"Database transaction ownership": "ملكية معاملات قاعدة البيانات"
"autocommit enabled; no caller-owned transaction": "الالتزام التلقائي (autocommit) مفعّل؛ لا توجد معاملة مملوكة للمُستدعي"
"autocommit disabled or caller transaction active": "الالتزام التلقائي (autocommit) معطّل أو معاملة المُستدعي نشطة"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "شغّل التثبيت خارج معاملة مملوكة للمُستدعي وفعّل الالتزام التلقائي (autocommit) على اتصال التعديل الخاص به."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "استعد دليل الإصدار وامنح حساب التثبيت حق الكتابة لاستيراد موارد القوالب. لا تجعله قابلاً للكتابة للجميع."
"Worker file: install/background.php": "ملف العامل: install/background.php"
"Worker file: bin/legacy-installer.php": "ملف العامل: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "ملف العامل: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "وجهة الاستيراد: resource/snmp_queries"
"Import destination: resource/script_server": "وجهة الاستيراد: resource/script_server"
"Import destination: resource/script_queries": "وجهة الاستيراد: resource/script_queries"
"Import destination: scripts": "وجهة الاستيراد: scripts"
"Database privileges": "امتيازات قاعدة البيانات"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "لم يتم التحقق من امتيازات الترحيل الفعّالة، بما في ذلك الأدوار النشطة والمنح الخاصة بالكائنات."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "اطلب من مسؤول قاعدة البيانات التحقق من عمليات الكتابة المطلوبة للجداول وتغييرات المخطط والمشغّلات والإجراءات المخزّنة لحساب التثبيت والمخطط. لا تمنح امتيازات المسؤول العام."
"Compare web and worker runtimes": "مقارنة بيئتَي تشغيل الويب والعامل"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "يبدأ هذا صراحةً اختبار PHP قصيراً للقراءة فقط. ولا يحجز مثبّتاً أو يكتب ملفات أو يتصل بالأجهزة."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "يرث الاختبار عملية الويب هذه ويستخدم مفسّر PHP المكوّن للمثبّت. ولا يفحص مجدولاً أو خدمة منفصلة."
"I authorize the read-only worker runtime comparison.": "أصرّح بمقارنة بيئة تشغيل العامل للقراءة فقط."
"Compare runtimes": "مقارنة بيئات التشغيل"
"Runtime comparison results": "نتائج مقارنة بيئات التشغيل"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "قد تكون اختلافات الأذونات والهوية مقصودة. لا تُثبت الملاحظات للقراءة فقط نجاح عمليات الكتابة أو التثبيت."
"Confirm the read-only worker runtime comparison.": "أكّد مقارنة بيئة تشغيل العامل للقراءة فقط."
"The runtime comparison is unavailable.": "مقارنة بيئات التشغيل غير متاحة."
"Shared application secret": "سرّ التطبيق المشترك"
"A strong web application secret is required before comparison.": "مطلوب سرّ قوي لتطبيق الويب قبل المقارنة."
"Runtime comparison": "مقارنة بيئات التشغيل"
"The configured worker runtime did not confirm a bounded comparison.": "لم تؤكد بيئة تشغيل العامل المكوّنة إجراء مقارنة محدودة."
"The inherited worker secret could not be confirmed against the web secret.": "تعذّر تأكيد سرّ العامل الموروث مقابل سرّ الويب."
"PHP runtime comparison": "مقارنة بيئة تشغيل PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "يجب أن يدعم كلا بيئتَي التشغيل PHP 8.4؛ وتستلزم اختلافات إصدارات التصحيح مراجعة."
"Required extension comparison": "مقارنة الإضافات المطلوبة"
"Required extension availability is checked; differing versions require review.": "يتم فحص توفر الإضافات المطلوبة؛ وتستلزم اختلافات الإصدارات مراجعة."
"Process identity comparison": "مقارنة هوية العملية"
"Effective process identity is unavailable on this platform.": "هوية العملية الفعّالة غير متاحة على هذه المنصة."
"Effective process identities match.": "تتطابق هويات العمليات الفعّالة."
"Effective process identities differ; separate service accounts may be intentional.": "تختلف هويات العمليات الفعّالة؛ قد يكون فصل حسابات الخدمة مقصوداً."
"Directory access comparison": "مقارنة الوصول إلى الدليل"
"Read-only directory permission observations match.": "تتطابق ملاحظات أذونات الدليل للقراءة فقط."
"Directory locations or permission observations differ; review the service-account roles.": "تختلف مواقع الأدلة أو ملاحظات الأذونات؛ راجع أدوار حساب الخدمة."
"Worker directory read and traversal": "قراءة دليل العامل وعبوره"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "يجب أن تكون أدلة العامل المطلوبة موجودة وتسمح بالقراءة والعبور. لم يتم اختبار أي عمليات كتابة."
"The inherited worker secret matches the web secret for this private challenge.": "يتطابق سرّ العامل الموروث مع سرّ الويب لهذا التحدّي الخاص."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "راجع مفسّر PHP المكوّن والإضافات المطلوبة والسرّ الموروث وأذونات دليل حساب الخدمة. لم يتم اختبار أي عمليات كتابة أو تشغيل المثبّت."
"advisory": "استشاري"
