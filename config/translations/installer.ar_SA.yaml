"Applying database upgrades": "جارٍ تطبيق ترقيات قاعدة البيانات"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "انسخ قاعدة البيانات وملفات RRD والتكوين والمفاتيح احتياطياً. قد تُثبّت ترقيات قاعدة البيانات تغييرات لا يمكن للتراجع على مستوى التطبيق إلغاؤها."
