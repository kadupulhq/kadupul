"Preparing CSRF protection": "جارٍ تحضير حماية CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "يُظهر التقدّم آخر مرحلة مسجّلة. لا يؤدي تحديث هذه الصفحة أبداً إلى بدء أو إعادة محاولة تشغيل عامل."
"Recover stopped attempt": "استرداد المحاولة المتوقفة"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "يحتفظ الاسترداد بالتحديدات المحفوظة ولا يُنهي أبداً عاملاً حياً. راجع الخطة مرة أخرى قبل إعادة المحاولة."
