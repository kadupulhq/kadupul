"Run": "تشغيل"
"Run reviewed plan": "تشغيل الخطة المراجَعة"
"Save and review": "حفظ ومراجعة"
"Scope": "النطاق"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "الحالة غير متاحة. تم الاحتفاظ بالعمل المحفوظ. حدّث لإعادة الاتصال؛ لا ترسل تثبيتاً آخر."
"Synchronizing collectors": "جارٍ مزامنة المجمّعات"
"Table conversions": "تحويلات الجداول"
"Templates": "القوالب"
"The database version matches this application. Installation does not establish that polling is healthy.": "يتطابق إصدار قاعدة البيانات مع هذا التطبيق. لا يُثبت التثبيت أن الاستطلاع سليم."
"The request outcome is unknown. Check execution status before retrying.": "نتيجة الطلب غير معروفة. تحقق من حالة التنفيذ قبل إعادة المحاولة."
