"Check requirements": "فحص المتطلبات"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "تفحص الاختبارات هذه العملية وأذونات نظام الملفات. ولا تكتب ملفات اختبار أو تتصل بالأجهزة."
