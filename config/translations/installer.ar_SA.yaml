"I authorize discovery of the displayed range": "أصرّح باكتشاف النطاق المعروض"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "لقد تحققت من السجل وتأكدت من توقف العامل السابق وعملياته الفرعية"
"I checked the previous attempt and accept that some changes may already be committed": "لقد تحققت من المحاولة السابقة وأقرّ بأن بعض التغييرات قد تكون قد ثُبّتت بالفعل"
"I reviewed this plan and have the required backups": "لقد راجعت هذه الخطة ولديّ النسخ الاحتياطية المطلوبة"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "إذا توقف أحد العمال بشكل غير متوقع، فاحتفظ بملف log/cacti.log وتأكد من انتهاء عمليته قبل إعادة المحاولة صراحةً. لا تؤكد حالة الانتظار نجاح التشغيل."
