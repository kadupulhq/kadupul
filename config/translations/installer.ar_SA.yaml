"Language": "اللغة"
"Large tables may require the dedicated CLI conversion tool before installation.": "قد تتطلب الجداول الكبيرة استخدام أداة التحويل المخصصة عبر CLI قبل التثبيت."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "اترك حقول الأسرار فارغة للاحتفاظ ببيانات الاعتماد المخزنة. لا يُعاد عرض الأسرار مطلقاً."
