"A useful name for this Rule.": "Suna mai amfani don wannan Dokar."
"Access denied.": "An hana shiga."
"Add Graph Rule": "Ƙara Dokar Jadawali"
"Back to Graph Rules": "Koma zuwa Dokokin Jadawali"
"Check this box to enable this rule.": "Duba wannan akwatin don kunna wannan dokar."
"Choose a Data Query to apply to this rule.": "Zaɓi Tambayar Bayanai da za a aiwatar da ita ga wannan dokar."
"Choose a Graph Type": "Zaɓi Nau'in Jadawali"
"Choose a Graph Type of the selected Data Query.": "Zaɓi Nau'in Jadawali na Tambayar Bayanai da aka zaɓa."
"Choose an existing Data Query.": "Zaɓi Tambayar Bayanai da ke akwai."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Zaɓi kowane ɗaya daga cikin Nau'ikan Jadawali da ke akwai na Tambayar Bayanai da aka zaɓa don aiwatarwa ga wannan dokar."
"Data Query": "Tambayar Bayanai"
"Device Selection and Graph Creation Criteria": "Sharuddan Zaɓin Na'ura da Ƙirƙirar Jadawali"
"Edit Graph Rule": "Gyara Dokar Jadawali"
"Enable Rule": "Kunna Doka"
"Enter a name.": "Shigar da suna."
"Enter at most %count% characters.": "Shigar da haruffa %count% a mafi yawa."
"Enter single-line text.": "Shigar da rubutun layi guda."
"Graph Type": "Nau'in Jadawali"
"Graph rule not found.": "Ba a sami ƙa'idar jadawali ba."
"Graph rule saved.": "An ajiye ƙa'idar jadawali."
"Name": "Suna"
"Rule Selection [edit: %name%]": "Zaɓin Ƙa'ida [gyara: %name%]"
"Rule Selection [new]": "Zaɓin Ƙa'ida [sabo]"
"Save": "Ajiye"
"Save outcome is uncertain. Reload before retrying.": "Sakamakon ajiye ba shi da tabbas. Sake lodawa kafin sake gwadawa."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Ajiye ƙa'idar da farko; za a ƙara Zaɓin Na'ura da Ma'aunin Ƙirƙirar Jadawali daga baya."
"The graph rule changed since you opened this form. Reload before saving.": "Ƙa'idar jadawali ta canja tun lokacin da ka buɗe wannan fom ɗin. Sake lodawa kafin ajiyewa."
"Unable to load the graph rule. Reload before retrying.": "An kasa loda ƙa'idar jadawali. Sake lodawa kafin sake gwadawa."
"Unexpected fields were submitted.": "An gabatar da filayen da ba a zata ba."
