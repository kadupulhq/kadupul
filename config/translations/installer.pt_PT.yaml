"I reviewed this plan and have the required backups": "Revi este plano e disponho das cópias de segurança necessárias"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Se um worker parar inesperadamente, preserve log/cacti.log e confirme que o processo terminou antes de tentar novamente de forma explícita. Um estado em espera não confirma um arranque bem-sucedido."
