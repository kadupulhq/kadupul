"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "O progresso mostra a última fase registada. Atualizar esta página nunca inicia nem volta a tentar um worker."
"Recover stopped attempt": "Recuperar tentativa parada"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "A recuperação mantém as seleções guardadas e nunca termina um worker ativo. Reveja novamente o plano antes de tentar novamente."
