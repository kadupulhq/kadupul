"waiting": "em espera"
"Accept the license before saving the installation plan.": "Aceite a licença antes de guardar o plano de instalação."
"Invalid installation form.": "Formulário de instalação inválido."
"Access denied.": "Acesso negado."
"Confirm the recovery warning before retrying.": "Confirme o aviso de recuperação antes de tentar novamente."
"Review and confirm the current installation plan.": "Reveja e confirme o plano de instalação atual."
"Confirm the discovery scope before starting.": "Confirme o âmbito da descoberta antes de iniciar."
"Resolve the blocking checks before starting.": "Resolva as verificações bloqueantes antes de iniciar."
"Too many installer options.": "Demasiadas opções do instalador."
"Invalid installer option name.": "Nome de opção do instalador inválido."
"Unknown or malformed installer option.": "Opção do instalador desconhecida ou malformada."
"Installer options must be scalar values.": "As opções do instalador têm de ser valores escalares."
"Installer option is too long or contains a null byte.": "A opção do instalador é demasiado longa ou contém um byte nulo."
"Installer IDs and intervals must be whole numbers.": "Os IDs e intervalos do instalador têm de ser números inteiros."
"Installer ID or interval is outside its supported range.": "O ID ou intervalo do instalador está fora do intervalo suportado."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Não foi possível prosseguir com a instalação. Recarregue o estado e reveja as verificações bloqueantes antes de tentar novamente."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirme que o worker anterior terminou antes de recuperar o respetivo plano."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "A base de dados está instalada, mas alguns coletores ainda precisam de sincronização. Tente novamente as tarefas de conclusão após verificar o respetivo estado."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "A instalação foi interrompida. Preserve o registo do instalador, corrija a causa e confirme explicitamente uma nova tentativa. Algumas alterações na base de dados podem já estar confirmadas. Verifique a limpeza de plugins antes de autorizar uma nova tentativa."
"Next action": "Próxima ação"
"Follow the execution status. Do not start another attempt while a worker is active.": "Acompanhe o estado da execução. Não inicie outra tentativa enquanto um worker estiver ativo."
"Complete the recovery checklist before retrying.": "Conclua a lista de verificação de recuperação antes de tentar novamente."
"Verify collection and graph operation before enabling discovery.": "Verifique o funcionamento da recolha e dos gráficos antes de ativar a descoberta."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Resolva os requisitos bloqueados e depois verifique novamente. As seleções guardadas são mantidas."
"Review the planned changes and backup checklist before authorizing execution.": "Reveja as alterações planeadas e a lista de verificação de cópias de segurança antes de autorizar a execução."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Escolha um perfil de recolha e aceite a licença. As definições opcionais podem ser abertas quando necessário."
"Download installation diagnostics": "Transferir diagnósticos de instalação"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Abra um gráfico e confirme que os respetivos dados RRD são atualizados após um ciclo do poller."
"Requirement details": "Detalhes do requisito"
"Recover": "Recuperar"
"Recovery checklist": "Lista de verificação de recuperação"
"Preserve log/cacti.log and record the failed attempt.": "Preserve log/cacti.log e registe a tentativa falhada."
"Confirm that the previous worker and its child processes have stopped.": "Confirme que o worker anterior e os respetivos processos filhos terminaram."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspecione as alterações confirmadas, a sincronização de coletores e a limpeza de plugins. Corrija a causa antes de tentar novamente."
"Review the saved plan again, then explicitly authorize a retry.": "Reveja novamente o plano guardado e depois autorize explicitamente uma nova tentativa."
"Recover a stopped worker": "Recuperar um worker parado"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Utilize a recuperação apenas após confirmar que esta tentativa já não está em execução. A recuperação não para um processo."
"Collector and installation mode": "Coletor e modo de instalação"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "A configuração de implementação determina a função do coletor e as ligações à base de dados. Verifique a configuração do servidor primário antes de iniciar um coletor."
"Discovery and SNMP settings": "Definições de descoberta e SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Mantenha a descoberta desativada até que a recolha e a conectividade do coletor tenham sido verificadas."
"Template selection": "Seleção de modelo"
"Templates selected for import": "Modelos selecionados para importação"
"No templates selected.": "Nenhum modelo selecionado."
"Backup checklist": "Lista de verificação de cópias de segurança"
"Database backup and a tested restoration procedure.": "Cópia de segurança da base de dados e procedimento de restauro testado."
"RRD files and the service account permissions needed to restore them.": "Ficheiros RRD e as permissões da conta de serviço necessárias para os restaurar."
"Configuration, keys and plugin data outside the database.": "Configuração, chaves e dados de plugins fora da base de dados."
"Post-installation checks": "Verificações pós-instalação"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "As verificações confirmadas abrangem apenas a evidência apresentada. As verificações não avaliadas continuam a exigir verificação pelo operador."
"Operational checks still require operator verification.": "As verificações operacionais continuam a exigir verificação pelo operador."
"Status": "Estado"
"verified": "verificado"
"action_required": "action_required"
"not_assessed": "not_assessed"
"Database schema": "Esquema da base de dados"
"Stored schema matches the application target.": "O esquema armazenado corresponde ao destino da aplicação."
"Target schema completion has not been confirmed.": "A conclusão do esquema de destino não foi confirmada."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Reveja o resultado da instalação e resolva as falhas antes de considerar a atualização do esquema concluída."
"Installation outcome": "Resultado da instalação"
"A successful receipt matches the current target schema.": "Um recibo bem-sucedido corresponde ao esquema de destino atual."
"A complete successful installation outcome has not been confirmed.": "Não foi confirmado um resultado de instalação completo e bem-sucedido."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Preserve o registo do instalador e utilize o procedimento explícito de recuperação ou nova tentativa quando necessário."
"Collector synchronization": "Sincronização de coletores"
"The completed installer reports pending collector synchronization.": "O instalador concluído comunica sincronização de coletores pendente."
"The completed installer reports no pending collectors.": "O instalador concluído não comunica coletores pendentes."
"Collector completion remains unconfirmed by this partial receipt.": "A conclusão do coletor permanece por confirmar neste recibo parcial."
"Collector completion is not established by this installation outcome.": "A conclusão do coletor não está garantida por este resultado de instalação."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Reveja o estado do coletor e tente novamente as tarefas de conclusão para resultados parciais. Isto não verifica a atualidade da recolha posterior."
"Scheduled collection": "Recolha agendada"
"No poller or device was contacted by this assessment.": "Nenhum poller ou dispositivo foi contactado por esta avaliação."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Confirme que o agendador configurado executa o poller com a conta de serviço pretendida e reveja o seu próximo ciclo normal."
"Graph data": "Dados do gráfico"
"Live samples and RRD updates were not exercised.": "Amostras em direto e atualizações de RRD não foram testadas."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Após um ciclo normal de recolha, confirme que os gráficos esperados recebem amostras recentes e reveja os erros do poller."
"Recovery readiness": "Prontidão para recuperação"
"Backup restoration was not exercised.": "O restauro da cópia de segurança não foi testado."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifique um restauro isolado da base de dados, dos ficheiros RRD, da configuração e do material de chaves antes de confiar na recuperação."
"No persisted local poller start has been recorded.": "Não foi registado nenhum arranque persistente do poller local."
"Persisted poller timing is invalid and cannot establish scheduler health.": "A temporização persistida do poller é inválida e não permite confirmar o estado de integridade do agendador."
"The recorded poller start is in the future. Check clock synchronization.": "O arranque do poller registado está no futuro. Verifique a sincronização do relógio."
"The recorded poller start is older than the native scheduling tolerance.": "O arranque do poller registado é mais antigo do que a tolerância de agendamento nativa."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Foi registado um arranque do poller local dentro da tolerância de agendamento nativa. A conclusão e o estado de integridade do dispositivo não estão verificados."
"readable": "legível"
"missing or unreadable": "em falta ou ilegível"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaure a versão completa e as respetivas dependências bloqueadas; conceda acesso de leitura à conta de serviço."
"PHP temporary directory": "Diretório temporário do PHP"
"directory writable by this process": "diretório com permissão de escrita por este processo"
"missing or not writable": "em falta ou sem permissão de escrita"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configure sys_temp_dir como um diretório existente com permissão de escrita para a conta de instalação. As importações nativas utilizam ficheiros temporários."
"Background worker launch": "Arranque do worker em segundo plano"
"required PHP functions available; launch not exercised": "funções PHP obrigatórias disponíveis; execução não testada"
"required PHP launch function disabled": "função PHP obrigatória para execução desativada"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Ative exec para o runtime PHP web ou utilize o instalador CLI autorizado."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Ative popen e pclose para o runtime PHP web ou utilize o instalador CLI autorizado."
"Database transaction ownership": "Titularidade da transação da base de dados"
"autocommit enabled; no caller-owned transaction": "autocommit ativado; sem transação pertencente ao chamador"
"autocommit disabled or caller transaction active": "autocommit desativado ou transação do chamador ativa"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Execute a instalação fora de uma transação pertencente ao chamador e ative o autocommit na respetiva ligação de mutação."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaure o diretório da versão e conceda acesso de escrita à conta de instalação para importações de recursos de modelos. Não o torne gravável por todos."
