"I authorize discovery of the displayed range": "Autorizo a descoberta do intervalo apresentado"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Verifiquei o registo e confirmei que o worker anterior e os respetivos processos filhos terminaram"
