"Keep a backup of the database, RRD files, configuration and secret material.": "Mantenha uma cópia de segurança da base de dados, dos ficheiros RRD, da configuração e do material de chaves."
"Language": "Idioma"
"Large tables may require the dedicated CLI conversion tool before installation.": "Tabelas grandes podem requerer a ferramenta CLI de conversão dedicada antes da instalação."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Deixe os campos secretos em branco para manter as credenciais armazenadas. Os segredos nunca são novamente apresentados."
