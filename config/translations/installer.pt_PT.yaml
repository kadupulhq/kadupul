"Import destination: scripts": "Destino da importação: scripts"
"Database privileges": "Privilégios da base de dados"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Os privilégios efetivos de migração, incluindo funções ativas e concessões específicas de objetos, não foram verificados."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Peça ao administrador da base de dados que verifique as escritas em tabelas necessárias, alterações de esquema, triggers e rotinas para a conta de instalação e esquema. Não conceda privilégios de administrador global."
"Compare web and worker runtimes": "Comparar runtimes web e worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Isto inicia explicitamente uma breve sonda PHP só de leitura. Não reserva um instalador, não escreve ficheiros nem contacta dispositivos."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "A sonda herda este processo web e utiliza o interpretador PHP do instalador configurado. Não inspeciona um agendador ou serviço separado."
"I authorize the read-only worker runtime comparison.": "Autorizo a comparação só de leitura do runtime do worker."
"Compare runtimes": "Comparar runtimes"
"Runtime comparison results": "Resultados da comparação de runtimes"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "As diferenças de permissões e identidades podem ser intencionais. As observações só de leitura não comprovam que as escritas ou a instalação terão êxito."
"Confirm the read-only worker runtime comparison.": "Confirme a comparação só de leitura do runtime do worker."
"The runtime comparison is unavailable.": "A comparação de runtimes não está disponível."
"Shared application secret": "Segredo partilhado da aplicação"
"A strong web application secret is required before comparison.": "É necessário um segredo forte da aplicação web antes da comparação."
"Runtime comparison": "Comparação de runtimes"
"The configured worker runtime did not confirm a bounded comparison.": "O runtime do worker configurado não confirmou uma comparação limitada."
"The inherited worker secret could not be confirmed against the web secret.": "Não foi possível confirmar o segredo herdado do worker em relação ao segredo web."
"PHP runtime comparison": "Comparação de runtimes PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Ambos os runtimes têm de suportar PHP 8.4; versões de correção diferentes requerem revisão."
"Required extension comparison": "Comparação de extensões obrigatórias"
"Required extension availability is checked; differing versions require review.": "A disponibilidade das extensões obrigatórias é verificada; versões diferentes requerem revisão."
"Process identity comparison": "Comparação de identidade de processo"
"Effective process identity is unavailable on this platform.": "A identidade efetiva do processo não está disponível nesta plataforma."
"Effective process identities match.": "As identidades efetivas dos processos coincidem."
"Effective process identities differ; separate service accounts may be intentional.": "As identidades efetivas dos processos diferem; contas de serviço separadas podem ser intencionais."
"Directory access comparison": "Comparação de acesso a diretórios"
"Read-only directory permission observations match.": "As observações só de leitura das permissões de diretório coincidem."
"Directory locations or permission observations differ; review the service-account roles.": "As localizações de diretórios ou observações de permissões diferem; reveja as funções das contas de serviço."
"Worker directory read and traversal": "Leitura e travessia do diretório do worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Os diretórios de worker obrigatórios têm de existir e permitir leitura e travessia. Não foram testadas escritas."
"The inherited worker secret matches the web secret for this private challenge.": "O segredo herdado do worker coincide com o segredo web para este desafio privado."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Reveja o interpretador PHP configurado, as extensões obrigatórias, o segredo herdado e as permissões de diretório da conta de serviço. Não foram executadas escritas nem o arranque do instalador."
"advisory": "informativo"
