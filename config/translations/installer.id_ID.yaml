"Action": "Tindakan"
"Advanced options": "Opsi lanjutan"
"Applying database upgrades": "Menerapkan peningkatan basis data"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Cadangkan basis data, berkas RRD, konfigurasi, dan kunci. Peningkatan basis data dapat menerapkan perubahan yang tidak dapat dibatalkan oleh pemulihan aplikasi."
"Blocked": "Diblokir"
"Check": "Periksa"
"Check again": "Periksa lagi"
"Check collection freshness and collector connectivity before enabling discovery.": "Periksa keterbaruan pengumpulan dan konektivitas kolektor sebelum mengaktifkan penemuan."
"Check requirements": "Periksa persyaratan"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Pemeriksaan mengecek proses ini dan izin sistem berkas. Pemeriksaan ini tidak menulis berkas uji atau menghubungi perangkat."
"Collection profile": "Profil pengumpulan"
"Collector": "Kolektor"
"Configure": "Konfigurasikan"
"Configuring collection profiles": "Mengonfigurasi profil pengumpulan"
"Configuring discovery": "Mengonfigurasi penemuan"
"Configuring the local device": "Mengonfigurasi perangkat lokal"
"Confirming database version": "Mengonfirmasi versi basis data"
"Converting selected tables": "Mengonversi tabel yang dipilih"
"Database version": "Versi basis data"
"Disabled": "Dinonaktifkan"
"Discovery": "Penemuan"
"Discovery SNMP settings": "Pengaturan SNMP penemuan"
"Discovery range": "Rentang penemuan"
"Enable discovery after installation": "Aktifkan penemuan setelah instalasi"
"Executable paths": "Jalur eksekusi"
"Execution status": "Status eksekusi"
"Finished execution": "Eksekusi selesai"
"Finishing tasks only. Schema migrations will not be replayed.": "Hanya tugas penyelesaian. Migrasi skema tidak akan dijalankan ulang."
"I accept the license terms": "Saya menyetujui ketentuan lisensi"
"I authorize discovery of the displayed range": "Saya mengotorisasi penemuan rentang yang ditampilkan"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Saya telah memeriksa log dan memastikan bahwa worker sebelumnya beserta proses turunannya telah berhenti"
"I checked the previous attempt and accept that some changes may already be committed": "Saya telah memeriksa percobaan sebelumnya dan menerima bahwa beberapa perubahan mungkin sudah diterapkan"
"I reviewed this plan and have the required backups": "Saya telah meninjau rencana ini dan memiliki cadangan yang diperlukan"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Jika worker berhenti secara tiba-tiba, simpan log/cacti.log dan pastikan prosesnya telah berakhir sebelum mencoba lagi secara eksplisit. Status menunggu tidak memastikan peluncuran berhasil."
"Importing templates": "Mengimpor templat"
"Install Kadupul": "Pasang Kadupul"
"Installation and upgrade": "Instalasi dan peningkatan"
"Installation request was rejected.": "Permintaan instalasi ditolak."
"Installation steps": "Langkah instalasi"
"Installed": "Terpasang"
"Keep a backup of the database, RRD files, configuration and secret material.": "Simpan cadangan basis data, berkas RRD, konfigurasi, dan materi rahasia."
"Language": "Bahasa"
"Large tables may require the dedicated CLI conversion tool before installation.": "Tabel berukuran besar mungkin memerlukan alat konversi CLI khusus sebelum instalasi."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Biarkan kolom rahasia kosong untuk mempertahankan kredensial tersimpan. Rahasia tidak pernah ditampilkan ulang."
"License": "Lisensi"
"No action needed": "Tidak perlu tindakan"
"Observed": "Diamati"
"Open the console": "Buka konsol"
"Operation": "Operasi"
"Override discovery SNMP settings": "Timpa pengaturan SNMP penemuan"
"Pass": "Lulus"
"Poller interval in seconds": "Interval poller dalam detik"
"Preparing CSRF protection": "Menyiapkan perlindungan CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Progres menampilkan fase terakhir yang tercatat. Menyegarkan halaman ini tidak pernah memulai atau mencoba ulang worker."
"Recover stopped attempt": "Pulihkan percobaan yang berhenti"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Pemulihan mempertahankan pilihan yang disimpan dan tidak pernah menghentikan worker yang masih aktif. Tinjau rencana lagi sebelum mencoba ulang."
"Review": "Tinjau"
"Review installation plan": "Tinjau rencana instalasi"
"Run": "Jalankan"
"Run reviewed plan": "Jalankan rencana yang telah ditinjau"
"Save and review": "Simpan dan tinjau"
"Scope": "Cakupan"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status tidak tersedia. Pekerjaan yang disimpan tetap dipertahankan. Segarkan untuk menyambung kembali; jangan kirim instalasi lain."
"Synchronizing collectors": "Menyinkronkan kolektor"
"Table conversions": "Konversi tabel"
"Templates": "Templat"
"The database version matches this application. Installation does not establish that polling is healthy.": "Versi basis data cocok dengan aplikasi ini. Instalasi tidak memastikan bahwa polling berjalan sehat."
"The request outcome is unknown. Check execution status before retrying.": "Hasil permintaan tidak diketahui. Periksa status eksekusi sebelum mencoba lagi."
"Theme": "Tema"
"Verify": "Verifikasi"
"Verify the poller schedule and service account.": "Verifikasi jadwal poller dan akun layanan."
"Version change": "Perubahan versi"
"Waiting for the installation worker": "Menunggu worker instalasi"
"collector": "kolektor"
"complete": "selesai"
"failed": "gagal"
"finish": "selesai"
"install": "pasang"
"not_started": "belum dimulai"
"partial": "parsial"
"running": "berjalan"
"succeeded": "berhasil"
"upgrade": "tingkatkan"
"waiting": "menunggu"
"Accept the license before saving the installation plan.": "Setujui lisensi sebelum menyimpan rencana instalasi."
"Invalid installation form.": "Formulir instalasi tidak valid."
"Access denied.": "Akses ditolak."
"Confirm the recovery warning before retrying.": "Konfirmasi peringatan pemulihan sebelum mencoba lagi."
"Review and confirm the current installation plan.": "Tinjau dan konfirmasi rencana instalasi saat ini."
"Confirm the discovery scope before starting.": "Konfirmasi cakupan penemuan sebelum memulai."
"Resolve the blocking checks before starting.": "Selesaikan pemeriksaan yang memblokir sebelum memulai."
"Too many installer options.": "Terlalu banyak opsi penginstal."
"Invalid installer option name.": "Nama opsi penginstal tidak valid."
"Unknown or malformed installer option.": "Opsi penginstal tidak diketahui atau formatnya salah."
"Installer options must be scalar values.": "Opsi penginstal harus berupa nilai skalar."
"Installer option is too long or contains a null byte.": "Opsi penginstal terlalu panjang atau berisi byte null."
"Installer IDs and intervals must be whole numbers.": "ID penginstal dan interval harus berupa bilangan bulat."
"Installer ID or interval is outside its supported range.": "ID penginstal atau interval berada di luar rentang yang didukung."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Instalasi tidak dapat dilanjutkan. Muat ulang statusnya dan tinjau pemeriksaan yang memblokir sebelum mencoba lagi."
"Confirm that the previous worker has stopped before recovering its plan.": "Pastikan worker sebelumnya telah berhenti sebelum memulihkan rencananya."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Basis data telah terpasang, tetapi beberapa kolektor masih memerlukan sinkronisasi. Coba ulang tugas penyelesaian setelah memeriksa statusnya."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Instalasi dihentikan. Simpan log penginstal, perbaiki penyebabnya, dan konfirmasi percobaan ulang secara eksplisit. Beberapa perubahan basis data mungkin sudah diterapkan. Periksa pembersihan plugin sebelum mengotorisasi percobaan ulang."
"Next action": "Tindakan berikutnya"
"Follow the execution status. Do not start another attempt while a worker is active.": "Pantau status eksekusi. Jangan memulai percobaan lain saat worker masih aktif."
"Complete the recovery checklist before retrying.": "Lengkapi daftar periksa pemulihan sebelum mencoba lagi."
"Verify collection and graph operation before enabling discovery.": "Verifikasi operasi pengumpulan dan grafik sebelum mengaktifkan penemuan."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Selesaikan persyaratan yang diblokir, lalu periksa lagi. Pilihan yang disimpan tetap dipertahankan."
"Review the planned changes and backup checklist before authorizing execution.": "Tinjau perubahan yang direncanakan dan daftar periksa pencadangan sebelum mengotorisasi eksekusi."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Pilih profil pengumpulan dan setujui lisensi. Pengaturan opsional dapat dibuka bila diperlukan."
"Download installation diagnostics": "Unduh diagnostik instalasi"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Buka grafik dan pastikan data RRD-nya diperbarui setelah satu siklus poller."
"Requirement details": "Detail persyaratan"
"Recover": "Pulihkan"
"Recovery checklist": "Daftar periksa pemulihan"
"Preserve log/cacti.log and record the failed attempt.": "Simpan log/cacti.log dan catat percobaan yang gagal."
"Confirm that the previous worker and its child processes have stopped.": "Pastikan worker sebelumnya beserta proses turunannya telah berhenti."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Periksa perubahan yang sudah diterapkan, sinkronisasi kolektor, dan pembersihan plugin. Perbaiki penyebabnya sebelum mencoba lagi."
"Review the saved plan again, then explicitly authorize a retry.": "Tinjau kembali rencana yang disimpan, lalu otorisasi percobaan ulang secara eksplisit."
"Recover a stopped worker": "Pulihkan worker yang berhenti"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Gunakan pemulihan hanya setelah memastikan bahwa percobaan ini tidak lagi berjalan. Pemulihan tidak menghentikan proses."
"Collector and installation mode": "Kolektor dan mode instalasi"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Konfigurasi penerapan menentukan peran kolektor dan koneksi basis data. Verifikasi konfigurasi server utama sebelum memulai kolektor."
"Discovery and SNMP settings": "Pengaturan penemuan dan SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Biarkan penemuan tetap dinonaktifkan hingga pengumpulan dan konektivitas kolektor terverifikasi."
"Template selection": "Pemilihan templat"
"Templates selected for import": "Templat dipilih untuk impor"
"No templates selected.": "Tidak ada templat yang dipilih."
"Backup checklist": "Daftar periksa pencadangan"
"Database backup and a tested restoration procedure.": "Cadangan basis data dan prosedur pemulihan yang teruji."
"RRD files and the service account permissions needed to restore them.": "Berkas RRD dan izin akun layanan yang diperlukan untuk memulihkannya."
"Configuration, keys and plugin data outside the database.": "Konfigurasi, kunci, dan data plugin di luar basis data."
"Post-installation checks": "Pemeriksaan pascainstalasi"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Pemeriksaan terverifikasi hanya mencakup bukti yang ditampilkan. Pemeriksaan yang belum dinilai masih memerlukan verifikasi operator."
"Operational checks still require operator verification.": "Pemeriksaan operasional tetap memerlukan verifikasi operator."
"Status": "Status"
"verified": "Terverifikasi"
"action_required": "Tindakan diperlukan"
"not_assessed": "Belum dinilai"
"Database schema": "Skema basis data"
"Stored schema matches the application target.": "Skema tersimpan cocok dengan target aplikasi."
"Target schema completion has not been confirmed.": "Penyelesaian skema target belum dikonfirmasi."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Tinjau hasil instalasi dan selesaikan kegagalan sebelum menganggap peningkatan skema selesai."
"Installation outcome": "Hasil instalasi"
"A successful receipt matches the current target schema.": "Tanda terima yang berhasil sesuai dengan skema target saat ini."
"A complete successful installation outcome has not been confirmed.": "Hasil instalasi yang berhasil sepenuhnya belum terkonfirmasi."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Simpan log penginstal dan gunakan prosedur pemulihan atau percobaan ulang eksplisit bila diperlukan."
"Collector synchronization": "Sinkronisasi kolektor"
"The completed installer reports pending collector synchronization.": "Penginstal yang selesai melaporkan adanya sinkronisasi kolektor yang tertunda."
"The completed installer reports no pending collectors.": "Penginstal yang selesai melaporkan tidak ada kolektor yang tertunda."
"Collector completion remains unconfirmed by this partial receipt.": "Penyelesaian kolektor masih belum terkonfirmasi oleh tanda terima parsial ini."
"Collector completion is not established by this installation outcome.": "Penyelesaian kolektor tidak dipastikan oleh hasil instalasi ini."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Tinjau status kolektor dan coba ulang tugas penyelesaian untuk hasil parsial. Tindakan ini tidak memverifikasi keterbaruan pengumpulan berikutnya."
"Scheduled collection": "Pengumpulan terjadwal"
"No poller or device was contacted by this assessment.": "Tidak ada poller atau perangkat yang dihubungi oleh penilaian ini."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Pastikan penjadwal terkonfigurasi menjalankan poller sebagai akun layanan yang dimaksud dan tinjau siklus normal berikutnya."
"Graph data": "Data grafik"
"Live samples and RRD updates were not exercised.": "Sampel langsung dan pembaruan RRD tidak diujicobakan."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Setelah siklus pengumpulan normal, pastikan grafik yang diharapkan menerima sampel terbaru dan tinjau galat poller."
"Recovery readiness": "Kesiapan pemulihan"
"Backup restoration was not exercised.": "Pemulihan cadangan tidak diujicobakan."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifikasi pemulihan terisolasi untuk basis data, berkas RRD, konfigurasi, dan materi kunci sebelum mengandalkan pemulihan."
"No persisted local poller start has been recorded.": "Belum ada mulai poller lokal persisten yang tercatat."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Waktu poller yang tersimpan tidak valid dan tidak dapat memastikan kesehatan penjadwal."
"The recorded poller start is in the future. Check clock synchronization.": "Waktu mulai poller yang tercatat berada di masa depan. Periksa sinkronisasi jam."
"The recorded poller start is older than the native scheduling tolerance.": "Waktu mulai poller yang tercatat lebih lama daripada toleransi penjadwalan bawaan."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Mulai poller lokal tercatat dalam toleransi penjadwalan bawaan. Penyelesaian dan kesehatan perangkat belum terverifikasi."
"readable": "dapat dibaca"
"missing or unreadable": "hilang atau tidak dapat dibaca"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Pulihkan rilis lengkap beserta dependensinya yang terkunci; berikan akses baca kepada akun layanan."
"PHP temporary directory": "Direktori sementara PHP"
"directory writable by this process": "direktori dapat ditulisi oleh proses ini"
"missing or not writable": "hilang atau tidak dapat ditulisi"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurasikan sys_temp_dir sebagai direktori yang ada dan dapat ditulisi oleh akun instalasi. Impor bawaan menggunakan berkas sementara."
"Background worker launch": "Peluncuran worker latar belakang"
"required PHP functions available; launch not exercised": "fungsi PHP yang diperlukan tersedia; peluncuran tidak diujicobakan"
"required PHP launch function disabled": "fungsi peluncuran PHP yang diperlukan dinonaktifkan"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Aktifkan exec untuk runtime PHP web, atau gunakan penginstal CLI yang berwenang."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Aktifkan popen, pclose untuk runtime PHP web, atau gunakan penginstal CLI yang berwenang."
"Database transaction ownership": "Kepemilikan transaksi basis data"
"autocommit enabled; no caller-owned transaction": "autocommit diaktifkan; tidak ada transaksi milik pemanggil"
"autocommit disabled or caller transaction active": "autocommit dinonaktifkan atau transaksi pemanggil aktif"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Jalankan instalasi di luar transaksi milik pemanggil dan aktifkan autocommit pada koneksi mutasinya."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Pulihkan direktori rilis dan berikan akses tulis kepada akun instalasi untuk impor sumber daya templat. Jangan menjadikannya dapat ditulis oleh semua pengguna (world-writable)."
"Worker file: install/background.php": "Berkas worker: install/background.php"
"Worker file: bin/legacy-installer.php": "Berkas worker: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Berkas worker: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Tujuan impor: resource/snmp_queries"
"Import destination: resource/script_server": "Tujuan impor: resource/script_server"
"Import destination: resource/script_queries": "Tujuan impor: resource/script_queries"
"Import destination: scripts": "Tujuan impor: scripts"
"Database privileges": "Hak istimewa basis data"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Hak istimewa migrasi efektif, termasuk peran aktif dan izin khusus objek, belum diverifikasi."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Minta administrator basis data memverifikasi penulisan tabel, perubahan skema, trigger, dan rutin yang diperlukan untuk akun instalasi dan skema. Jangan berikan hak istimewa administrator global."
"Compare web and worker runtimes": "Bandingkan runtime web dan worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Tindakan ini secara eksplisit memulai pemeriksaan PHP singkat yang bersifat hanya-baca. Ini tidak mencadangkan penginstal, menulis berkas, atau menghubungi perangkat."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Pemeriksaan ini mewarisi proses web ini dan menggunakan penerjemah PHP penginstal yang dikonfigurasi. Ini tidak memeriksa penjadwal atau layanan terpisah."
"I authorize the read-only worker runtime comparison.": "Saya mengotorisasi perbandingan runtime worker hanya-baca."
"Compare runtimes": "Bandingkan runtime"
"Runtime comparison results": "Hasil perbandingan runtime"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Perbedaan izin dan identitas mungkin disengaja. Observasi hanya-baca tidak membuktikan bahwa penulisan atau instalasi akan berhasil."
"Confirm the read-only worker runtime comparison.": "Konfirmasi perbandingan runtime worker hanya-baca."
"The runtime comparison is unavailable.": "Perbandingan runtime tidak tersedia."
"Shared application secret": "Rahasia aplikasi bersama"
"A strong web application secret is required before comparison.": "Rahasia aplikasi web yang kuat diperlukan sebelum perbandingan."
"Runtime comparison": "Perbandingan runtime"
"The configured worker runtime did not confirm a bounded comparison.": "Runtime worker yang dikonfigurasi tidak mengonfirmasi perbandingan terbatas."
"The inherited worker secret could not be confirmed against the web secret.": "Rahasia worker yang diwarisi tidak dapat dikonfirmasi terhadap rahasia web."
"PHP runtime comparison": "Perbandingan runtime PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Kedua runtime harus mendukung PHP 8.4; perbedaan versi patch memerlukan peninjauan."
"Required extension comparison": "Perbandingan ekstensi yang diperlukan"
"Required extension availability is checked; differing versions require review.": "Ketersediaan ekstensi yang diperlukan diperiksa; perbedaan versi memerlukan peninjauan."
"Process identity comparison": "Perbandingan identitas proses"
"Effective process identity is unavailable on this platform.": "Identitas proses efektif tidak tersedia di platform ini."
"Effective process identities match.": "Identitas proses efektif cocok."
"Effective process identities differ; separate service accounts may be intentional.": "Identitas proses efektif berbeda; pemisahan akun layanan mungkin disengaja."
"Directory access comparison": "Perbandingan akses direktori"
"Read-only directory permission observations match.": "Hasil observasi izin direktori hanya-baca cocok."
"Directory locations or permission observations differ; review the service-account roles.": "Lokasi direktori atau hasil observasi izin berbeda; tinjau peran akun layanan."
"Worker directory read and traversal": "Pembacaan dan penelusuran direktori worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Direktori worker yang diperlukan harus ada dan mengizinkan pembacaan serta penelusuran. Tidak ada penulisan yang diuji."
"The inherited worker secret matches the web secret for this private challenge.": "Rahasia worker yang diwarisi cocok dengan rahasia web untuk tantangan privat ini."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Tinjau penerjemah PHP yang dikonfigurasi, ekstensi yang diperlukan, rahasia warisan, dan izin direktori akun layanan. Tidak ada penulisan atau peluncuran penginstal yang dijalankan."
"advisory": "saran"
