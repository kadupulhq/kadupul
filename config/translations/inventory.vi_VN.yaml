"Select a valid assignment target.": "Chọn một đối tượng phân công hợp lệ."
"Invalid assignment kind.": "Loại phân công không hợp lệ."
"Assign device sites": "Gán địa điểm cho thiết bị"
"Assign device templates": "Gán mẫu cho thiết bị"
"Assign device collectors": "Gán trình thu thập cho thiết bị"
"Confirm assignments": "Xác nhận phân công"
"Selected device assignments updated.": "Đã cập nhật phân công của các thiết bị đã chọn."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Phân công đã chọn được áp dụng cho mọi thiết bị được liệt kê. Thay đổi mẫu vẫn giữ lại đồ thị hiện có; tự động hóa có thể tạo đồ thị mới. Thay đổi trình thu thập sẽ chuyển quyền sở hữu thăm dò."
"Change device SNMP settings": "Thay đổi cài đặt SNMP của thiết bị"
"Confirm SNMP changes": "Xác nhận thay đổi SNMP"
"Selected device SNMP settings updated.": "Đã cập nhật cài đặt SNMP của các thiết bị đã chọn."
"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "Áp dụng các cài đặt SNMP này cho mọi thiết bị đã chọn. Giữ lại thông tin xác thực đã lưu của từng thiết bị hoặc thay thế rõ ràng. Bí mật đã lưu không bao giờ được hiển thị."
"Device graph-template associations": "Liên kết mẫu đồ thị của thiết bị"
"Device associations updated.": "Đã cập nhật liên kết thiết bị."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Gỡ bỏ liên kết vẫn giữ lại đồ thị hiện có và dữ liệu lịch sử. Thêm liên kết có thể tạo đồ thị thông qua tự động hóa. Các trình thu thập bị ảnh hưởng phải đang trực tuyến."
