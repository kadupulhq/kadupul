"Select a removal policy.": "Chọn một chính sách gỡ bỏ."
"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "Các thiết bị đã chọn hoặc đồ thị và nguồn dữ liệu của chúng đã thay đổi. Hãy tải lại màn hình xác nhận trước khi gỡ bỏ thiết bị."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "Nguồn dữ liệu dùng chung hoặc đồ thị tổng hợp phải được tách ra trước khi gỡ bỏ đồ thị và nguồn dữ liệu."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "Kết quả gỡ bỏ thiết bị không chắc chắn. Kiểm tra các thiết bị, đồ thị và nguồn dữ liệu đã chọn trước khi thử lại."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "Không thể hoàn tác việc gỡ bỏ thiết bị tại đây. Chọn giữ lại đồ thị và vô hiệu hóa nguồn dữ liệu hoặc xóa chúng."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "Nguồn dữ liệu dùng chung và đồ thị tổng hợp phải được tách ra trước khi gỡ bỏ đồ thị. Các đồ thị và nguồn dữ liệu được giữ lại sẽ trở thành chưa gán."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "Các trình thu thập từ xa bị ảnh hưởng phải đang trực tuyến. Việc gỡ bỏ thất bại có thể để lại thay đổi trên trình thu thập từ xa hoặc plugin; hãy kiểm tra kết quả trước khi thử lại."
"RRD file cleanup follows the configured maintenance policy.": "Việc dọn dẹp tệp RRD tuân theo chính sách bảo trì đã cấu hình."
"%graphs% graphs, %sources% data sources": "%graphs% đồ thị, %sources% nguồn dữ liệu"
"Device template updated.": "Đã cập nhật mẫu thiết bị."
"Clear device statistics": "Xóa thống kê thiết bị"
"Confirm clearing statistics": "Xác nhận xóa thống kê"
"Selected device statistics cleared.": "Đã xóa thống kê của các thiết bị đã chọn."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Đặt lại thời gian phản hồi, số lần thăm dò và tính khả dụng cho các thiết bị này. Đồ thị, dữ liệu lịch sử và cài đặt thiết bị được giữ lại. Thống kê sẽ tiếp tục ở lần thăm dò kế tiếp."
"Synchronize device templates": "Đồng bộ hóa mẫu thiết bị"
"Confirm synchronization": "Xác nhận đồng bộ hóa"
"Selected device templates synchronized.": "Đã đồng bộ hóa mẫu của các thiết bị đã chọn."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Áp dụng các mẫu được gán hiện tại cho những thiết bị này. Các liên kết đồ thị và truy vấn dữ liệu còn thiếu sẽ được thêm, và các liên kết mẫu đồ thị không dùng có thể bị gỡ bỏ. Thiết bị không có mẫu sẽ bị bỏ qua. Đồ thị hiện có và dữ liệu lịch sử được giữ lại; tự động hóa có thể tạo đồ thị mới."
"Change device options": "Thay đổi tùy chọn thiết bị"
"Confirm option changes": "Xác nhận thay đổi tùy chọn"
"Selected device options updated.": "Đã cập nhật tùy chọn của các thiết bị đã chọn."
"Device options": "Tùy chọn thiết bị"
"Update this field": "Cập nhật trường này"
"Select at least one supported device option.": "Chọn ít nhất một tùy chọn thiết bị được hỗ trợ."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Chỉ các tùy chọn được chọn mới thay đổi. Các tùy chọn không được chọn giữ nguyên giá trị hiện tại. Chọn vị trí trống sẽ xóa vị trí đó."
"Update %option%": "Cập nhật %option%"
"Assignment target": "Đối tượng phân công"
