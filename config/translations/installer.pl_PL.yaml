"Action": "Akcja"
"Advanced options": "Opcje zaawansowane"
"Applying database upgrades": "Stosowanie aktualizacji bazy danych"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Wykonaj kopię zapasową bazy danych, plików RRD, konfiguracji i kluczy. Aktualizacje bazy danych mogą zatwierdzić zmiany, których cofnięcie przez aplikację nie jest możliwe."
"Blocked": "Zablokowane"
"Check": "Sprawdź"
"Check again": "Sprawdź ponownie"
"Check collection freshness and collector connectivity before enabling discovery.": "Sprawdź świeżość zbierania danych i łączność kolektorów przed włączeniem wykrywania."
"Check requirements": "Sprawdź wymagania"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Kontrole sprawdzają ten proces oraz uprawnienia systemu plików. Nie zapisują plików testowych ani nie kontaktują się z urządzeniami."
"Collection profile": "Profil zbierania danych"
"Collector": "Kolektor"
"Configure": "Konfiguruj"
"Configuring collection profiles": "Konfigurowanie profili zbierania danych"
"Configuring discovery": "Konfigurowanie wykrywania"
"Configuring the local device": "Konfigurowanie urządzenia lokalnego"
"Confirming database version": "Potwierdzanie wersji bazy danych"
"Converting selected tables": "Konwertowanie wybranych tabel"
"Database version": "Wersja bazy danych"
"Disabled": "Wyłączone"
"Discovery": "Wykrywanie"
"Discovery SNMP settings": "Ustawienia SNMP wykrywania"
"Discovery range": "Zakres wykrywania"
"Enable discovery after installation": "Włącz wykrywanie po instalacji"
"Executable paths": "Ścieżki plików wykonywalnych"
"Execution status": "Status wykonania"
"Finished execution": "Zakończono wykonanie"
"Finishing tasks only. Schema migrations will not be replayed.": "Tylko zadania kończące. Migracje schematu nie zostaną uruchomione ponownie."
"I accept the license terms": "Akceptuję warunki licencji"
"I authorize discovery of the displayed range": "Autoryzuję wykrywanie wyświetlanego zakresu"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Sprawdziłem dziennik i potwierdziłem, że poprzedni proces roboczy oraz jego procesy potomne zostały zatrzymane"
"I checked the previous attempt and accept that some changes may already be committed": "Sprawdziłem poprzednią próbę i akceptuję, że niektóre zmiany mogły już zostać zatwierdzone"
"I reviewed this plan and have the required backups": "Przejrzałem ten plan i posiadam wymagane kopie zapasowe"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Jeśli proces roboczy zatrzyma się nieoczekiwanie, zachowaj plik log/cacti.log i potwierdź zakończenie jego procesu przed jawnym ponowieniem próby. Stan oczekiwania nie potwierdza pomyślnego uruchomienia."
"Importing templates": "Importowanie szablonów"
"Install Kadupul": "Zainstaluj Kadupul"
"Installation and upgrade": "Instalacja i aktualizacja"
"Installation request was rejected.": "Żądanie instalacji zostało odrzucone."
"Installation steps": "Kroki instalacji"
"Installed": "Zainstalowane"
"Keep a backup of the database, RRD files, configuration and secret material.": "Zachowaj kopię zapasową bazy danych, plików RRD, konfiguracji oraz danych tajnych."
"Language": "Język"
"Large tables may require the dedicated CLI conversion tool before installation.": "Duże tabele mogą wymagać użycia dedykowanego narzędzia CLI do konwersji przed instalacją."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Pozostaw pola tajne puste, aby zachować zapisane poświadczenia. Dane tajne nigdy nie są ponownie wyświetlane."
"License": "Licencja"
"No action needed": "Nie jest wymagane żadne działanie"
"Observed": "Zaobserwowano"
"Open the console": "Otwórz konsolę"
"Operation": "Operacja"
"Override discovery SNMP settings": "Nadpisz ustawienia SNMP wykrywania"
"Pass": "Zaliczone"
"Poller interval in seconds": "Interwał pollera w sekundach"
"Preparing CSRF protection": "Przygotowywanie ochrony CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Postęp pokazuje ostatnio zarejestrowaną fazę. Odświeżenie tej strony nigdy nie uruchamia ani nie ponawia procesu roboczego."
"Recover stopped attempt": "Odzyskaj zatrzymaną próbę"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Odzyskiwanie zachowuje zapisane wybory i nigdy nie kończy działającego procesu roboczego. Przejrzyj plan ponownie przed ponowną próbą."
"Review": "Przejrzyj"
"Review installation plan": "Przejrzyj plan instalacji"
"Run": "Uruchom"
"Run reviewed plan": "Uruchom przejrzany plan"
"Save and review": "Zapisz i przejrzyj"
"Scope": "Zakres"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status jest niedostępny. Zapisana praca została zachowana. Odśwież, aby połączyć się ponownie; nie przesyłaj kolejnej instalacji."
"Synchronizing collectors": "Synchronizowanie kolektorów"
"Table conversions": "Konwersje tabel"
"Templates": "Szablony"
"The database version matches this application. Installation does not establish that polling is healthy.": "Wersja bazy danych odpowiada tej aplikacji. Instalacja nie potwierdza prawidłowego działania odpytywania."
"The request outcome is unknown. Check execution status before retrying.": "Wynik żądania jest nieznany. Sprawdź status wykonania przed ponowną próbą."
"Theme": "Motyw"
"Verify": "Zweryfikuj"
"Verify the poller schedule and service account.": "Zweryfikuj harmonogram pollera oraz konto usługi."
"Version change": "Zmiana wersji"
"Waiting for the installation worker": "Oczekiwanie na proces roboczy instalacji"
"collector": "kolektor"
"complete": "ukończone"
"failed": "niepowodzenie"
"finish": "zakończ"
"install": "zainstaluj"
"not_started": "nierozpoczęte"
"partial": "częściowe"
"running": "uruchomione"
"succeeded": "powodzenie"
"upgrade": "aktualizuj"
"waiting": "oczekuje"
"Accept the license before saving the installation plan.": "Zaakceptuj licencję przed zapisaniem planu instalacji."
"Invalid installation form.": "Nieprawidłowy formularz instalacji."
"Access denied.": "Odmowa dostępu."
"Confirm the recovery warning before retrying.": "Potwierdź ostrzeżenie dotyczące odzyskiwania przed ponowną próbą."
"Review and confirm the current installation plan.": "Przejrzyj i potwierdź bieżący plan instalacji."
"Confirm the discovery scope before starting.": "Potwierdź zakres wykrywania przed rozpoczęciem."
"Resolve the blocking checks before starting.": "Rozwiąż blokujące kontrole przed rozpoczęciem."
"Too many installer options.": "Za dużo opcji instalatora."
"Invalid installer option name.": "Nieprawidłowa nazwa opcji instalatora."
"Unknown or malformed installer option.": "Nieznana lub nieprawidłowo sformatowana opcja instalatora."
"Installer options must be scalar values.": "Opcje instalatora muszą być wartościami skalarnymi."
"Installer option is too long or contains a null byte.": "Opcja instalatora jest za długa lub zawiera bajt zerowy."
"Installer IDs and intervals must be whole numbers.": "Identyfikatory i interwały instalatora muszą być liczbami całkowitymi."
"Installer ID or interval is outside its supported range.": "Identyfikator lub interwał instalatora wykracza poza obsługiwany zakres."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Instalacja nie mogła być kontynuowana. Odśwież jej status i przejrzyj blokujące kontrole przed ponowną próbą."
"Confirm that the previous worker has stopped before recovering its plan.": "Potwierdź zatrzymanie poprzedniego procesu roboczego przed odzyskaniem jego planu."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Baza danych jest zainstalowana, ale niektóre kolektory nadal wymagają synchronizacji. Ponów zadania kończące po sprawdzeniu ich statusu."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Instalacja została zatrzymana. Zachowaj dziennik instalatora, usuń przyczynę i jawnie potwierdź ponowną próbę. Część zmian w bazie danych mogła już zostać zatwierdzona. Sprawdź oczyszczanie wtyczek przed autoryzacją ponownej próby."
"Next action": "Następna akcja"
"Follow the execution status. Do not start another attempt while a worker is active.": "Śledź status wykonania. Nie rozpoczynaj kolejnej próby, gdy proces roboczy jest aktywny."
"Complete the recovery checklist before retrying.": "Wypełnij listę kontrolną odzyskiwania przed ponowną próbą."
"Verify collection and graph operation before enabling discovery.": "Zweryfikuj zbieranie danych i działanie wykresów przed włączeniem wykrywania."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Rozwiąż zablokowane wymagania, a następnie sprawdź ponownie. Zapisane wybory zostają zachowane."
"Review the planned changes and backup checklist before authorizing execution.": "Przejrzyj planowane zmiany oraz listę kontrolną kopii zapasowej przed autoryzacją wykonania."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Wybierz profil zbierania danych i zaakceptuj licencję. Ustawienia opcjonalne można otworzyć w razie potrzeby."
"Download installation diagnostics": "Pobierz diagnostykę instalacji"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Otwórz wykres i potwierdź, że jego dane RRD aktualizują się po cyklu pollera."
"Requirement details": "Szczegóły wymagań"
"Recover": "Odzyskaj"
"Recovery checklist": "Lista kontrolna odzyskiwania"
"Preserve log/cacti.log and record the failed attempt.": "Zachowaj plik log/cacti.log i odnotuj nieudaną próbę."
"Confirm that the previous worker and its child processes have stopped.": "Potwierdź, że poprzedni proces roboczy i jego procesy potomne zostały zatrzymane."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Sprawdź zatwierdzone zmiany, synchronizację kolektorów oraz oczyszczanie wtyczek. Usuń przyczynę przed ponowną próbą."
"Review the saved plan again, then explicitly authorize a retry.": "Przejrzyj ponownie zapisany plan, a następnie jawnie autoryzuj ponowną próbę."
"Recover a stopped worker": "Odzyskaj zatrzymany proces roboczy"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Użyj odzyskiwania dopiero po potwierdzeniu, że ta próba już nie działa. Odzyskiwanie nie zatrzymuje procesu."
"Collector and installation mode": "Kolektor i tryb instalacji"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Konfiguracja wdrożenia określa rolę kolektora oraz połączenia z bazą danych. Zweryfikuj konfigurację serwera głównego przed uruchomieniem kolektora."
"Discovery and SNMP settings": "Ustawienia wykrywania i SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Pozostaw wykrywanie wyłączone do czasu zweryfikowania zbierania danych i łączności kolektorów."
"Template selection": "Wybór szablonu"
"Templates selected for import": "Szablony wybrane do importu"
"No templates selected.": "Nie wybrano szablonów."
"Backup checklist": "Lista kontrolna kopii zapasowej"
"Database backup and a tested restoration procedure.": "Kopia zapasowa bazy danych oraz przetestowana procedura odtwarzania."
"RRD files and the service account permissions needed to restore them.": "Pliki RRD oraz uprawnienia konta usługi wymagane do ich przywrócenia."
"Configuration, keys and plugin data outside the database.": "Konfiguracja, klucze i dane wtyczek poza bazą danych."
"Post-installation checks": "Kontrole poinstalacyjne"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Zweryfikowane kontrole obejmują wyłącznie przedstawione dowody. Nieocenione kontrole nadal wymagają weryfikacji przez operatora."
"Operational checks still require operator verification.": "Kontrole operacyjne nadal wymagają weryfikacji przez operatora."
"Status": "Status"
"verified": "Zweryfikowano"
"action_required": "Wymagane działanie"
"not_assessed": "Nie oceniono"
"Database schema": "Schemat bazy danych"
"Stored schema matches the application target.": "Zapisany schemat odpowiada docelowej wersji aplikacji."
"Target schema completion has not been confirmed.": "Nie potwierdzono ukończenia schematu docelowego."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Przejrzyj wynik instalacji i usuń błędy przed uznaniem aktualizacji schematu za ukończoną."
"Installation outcome": "Wynik instalacji"
"A successful receipt matches the current target schema.": "Pomyślne potwierdzenie odpowiada bieżącemu schematowi docelowemu."
"A complete successful installation outcome has not been confirmed.": "Nie potwierdzono pełnego powodzenia instalacji."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Zachowaj dziennik instalatora i w razie potrzeby użyj jawnej procedury odzyskiwania lub ponowienia."
"Collector synchronization": "Synchronizacja kolektorów"
"The completed installer reports pending collector synchronization.": "Ukończony instalator zgłasza oczekującą synchronizację kolektorów."
"The completed installer reports no pending collectors.": "Ukończony instalator nie zgłasza oczekujących kolektorów."
"Collector completion remains unconfirmed by this partial receipt.": "To częściowe potwierdzenie nie potwierdza ukończenia pracy przez kolektory."
"Collector completion is not established by this installation outcome.": "Ten wynik instalacji nie potwierdza ukończenia pracy przez kolektory."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Sprawdź status kolektorów i ponów zadania kończące dla wyników częściowych. Nie weryfikuje to późniejszej świeżości zbierania danych."
"Scheduled collection": "Zaplanowane zbieranie danych"
"No poller or device was contacted by this assessment.": "Ta ocena nie nawiązała kontaktu z żadnym pollerem ani urządzeniem."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Potwierdź, że skonfigurowany harmonogram uruchamia poller na koncie docelowej usługi i sprawdź jego następny normalny cykl."
"Graph data": "Dane wykresu"
"Live samples and RRD updates were not exercised.": "Próbki na żywo i aktualizacje RRD nie zostały przetestowane."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Po normalnym cyklu zbierania danych potwierdź, że oczekiwane wykresy otrzymują świeże próbki, i przejrzyj błędy pollera."
"Recovery readiness": "Gotowość do odzyskiwania"
"Backup restoration was not exercised.": "Przywracanie kopii zapasowej nie zostało przetestowane."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Zweryfikuj odizolowane odtworzenie bazy danych, plików RRD, konfiguracji oraz materiału kluczy przed poleganiem na odzyskiwaniu."
"No persisted local poller start has been recorded.": "Nie zarejestrowano trwałego uruchomienia lokalnego pollera."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Zapisany czas działania pollera jest nieprawidłowy i nie może potwierdzić prawidłowej pracy harmonogramu."
"The recorded poller start is in the future. Check clock synchronization.": "Zarejestrowany czas uruchomienia pollera jest w przyszłości. Sprawdź synchronizację zegara."
"The recorded poller start is older than the native scheduling tolerance.": "Zarejestrowany czas uruchomienia pollera jest starszy niż natywna tolerancja harmonogramu."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Zarejestrowano uruchomienie lokalnego pollera w ramach natywnej tolerancji harmonogramu. Ukończenie cyklu i stan urządzeń nie zostały zweryfikowane."
"readable": "możliwy do odczytu"
"missing or unreadable": "brak lub brak możliwości odczytu"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Przywróć pełne wydanie i jego zablokowane zależności; przyznaj kontu usługi uprawnienia do odczytu."
"PHP temporary directory": "Katalog tymczasowy PHP"
"directory writable by this process": "katalog z prawem zapisu dla tego procesu"
"missing or not writable": "brak lub brak uprawnień zapisu"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Skonfiguruj sys_temp_dir jako istniejący katalog z prawem zapisu dla konta instalacyjnego. Natywne importy używają plików tymczasowych."
"Background worker launch": "Uruchomienie procesu roboczego w tle"
"required PHP functions available; launch not exercised": "wymagane funkcje PHP dostępne; uruchomienie nie zostało przetestowane"
"required PHP launch function disabled": "wymagana funkcja uruchamiania PHP jest wyłączona"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Włącz funkcję exec dla środowiska webowego PHP lub użyj autoryzowanego instalatora CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Włącz funkcje popen i pclose dla środowiska webowego PHP lub użyj autoryzowanego instalatora CLI."
"Database transaction ownership": "Własność transakcji bazy danych"
"autocommit enabled; no caller-owned transaction": "autocommit włączony; brak transakcji należącej do wywołującego"
"autocommit disabled or caller transaction active": "autocommit wyłączony lub aktywna transakcja wywołującego"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Uruchom instalację poza transakcją wywołującego i włącz autocommit na jej połączeniu modyfikującym."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Przywróć katalog wydania i przyznaj kontu instalacyjnemu uprawnienia zapisu do importu zasobów szablonów. Nie nadawaj uprawnień zapisu dla wszystkich użytkowników."
"Worker file: install/background.php": "Plik procesu roboczego: install/background.php"
"Worker file: bin/legacy-installer.php": "Plik procesu roboczego: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Plik procesu roboczego: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Miejsce docelowe importu: resource/snmp_queries"
"Import destination: resource/script_server": "Miejsce docelowe importu: resource/script_server"
"Import destination: resource/script_queries": "Miejsce docelowe importu: resource/script_queries"
"Import destination: scripts": "Miejsce docelowe importu: scripts"
"Database privileges": "Uprawnienia bazy danych"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Efektywne uprawnienia migracji, w tym aktywne role i uprawnienia specyficzne dla obiektów, nie zostały zweryfikowane."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Poproś administratora bazy danych o zweryfikowanie wymaganych uprawnień zapisu w tabelach, zmian schematu, wyzwalaczy i procedur dla konta instalacyjnego oraz schematu. Nie przyznawaj globalnych uprawnień administratora."
"Compare web and worker runtimes": "Porównaj środowiska uruchomieniowe serwera WWW i procesu roboczego"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "To polecenie jawnie uruchamia krótki test PHP w trybie tylko do odczytu. Nie rezerwuje instalatora, nie zapisuje plików ani nie kontaktuje się z urządzeniami."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Test dziedziczy ten proces WWW i używa skonfigurowanego interpretera PHP instalatora. Nie sprawdza osobnego harmonogramu ani usługi."
"I authorize the read-only worker runtime comparison.": "Autoryzuję porównanie środowiska uruchomieniowego procesu roboczego w trybie tylko do odczytu."
"Compare runtimes": "Porównaj środowiska uruchomieniowe"
"Runtime comparison results": "Wyniki porównania środowisk uruchomieniowych"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Różnice w uprawnieniach i tożsamościach mogą być zamierzone. Obserwacje tylko do odczytu nie dowodzą, że zapisy lub instalacja zakończą się powodzeniem."
"Confirm the read-only worker runtime comparison.": "Potwierdź porównanie środowiska uruchomieniowego procesu roboczego w trybie tylko do odczytu."
"The runtime comparison is unavailable.": "Porównanie środowisk uruchomieniowych jest niedostępne."
"Shared application secret": "Wspólny klucz tajny aplikacji"
"A strong web application secret is required before comparison.": "Przed porównaniem wymagany jest silny klucz tajny aplikacji webowej."
"Runtime comparison": "Porównanie środowisk uruchomieniowych"
"The configured worker runtime did not confirm a bounded comparison.": "Skonfigurowane środowisko uruchomieniowe procesu roboczego nie potwierdziło ograniczonego porównania."
"The inherited worker secret could not be confirmed against the web secret.": "Dziedziczony klucz tajny procesu roboczego nie mógł zostać potwierdzony względem klucza tajnego serwera WWW."
"PHP runtime comparison": "Porównanie środowisk uruchomieniowych PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Oba środowiska uruchomieniowe muszą obsługiwać PHP 8.4; różnice w wersjach poprawkowych wymagają przeglądu."
"Required extension comparison": "Porównanie wymaganych rozszerzeń"
"Required extension availability is checked; differing versions require review.": "Dostępność wymaganych rozszerzeń została sprawdzona; różnice w wersjach wymagają przeglądu."
"Process identity comparison": "Porównanie tożsamości procesów"
"Effective process identity is unavailable on this platform.": "Efektywna tożsamość procesu jest niedostępna na tej platformie."
"Effective process identities match.": "Efektywne tożsamości procesów są zgodne."
"Effective process identities differ; separate service accounts may be intentional.": "Efektywne tożsamości procesów różnią się; osobne konta usługowe mogą być zamierzone."
"Directory access comparison": "Porównanie dostępu do katalogów"
"Read-only directory permission observations match.": "Zaobserwowane uprawnienia katalogów w trybie tylko do odczytu są zgodne."
"Directory locations or permission observations differ; review the service-account roles.": "Lokalizacje katalogów lub zaobserwowane uprawnienia różnią się; sprawdź role kont usługowych."
"Worker directory read and traversal": "Odczyt i przechodzenie katalogów procesu roboczego"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Wymagane katalogi procesu roboczego muszą istnieć oraz umożliwiać odczyt i przechodzenie. Nie testowano operacji zapisu."
"The inherited worker secret matches the web secret for this private challenge.": "Dziedziczony klucz tajny procesu roboczego jest zgodny z kluczem tajnym serwera WWW dla tego prywatnego wyzwania."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Sprawdź skonfigurowany interpreter PHP, wymagane rozszerzenia, dziedziczony klucz tajny i uprawnienia katalogów konta usługi. Nie wykonano żadnych zapisów ani uruchomienia instalatora."
"advisory": "informacyjne"
