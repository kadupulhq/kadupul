"A useful name for this Rule.": "Полезное название для этого правила."
"Access denied.": "Доступ запрещён."
"Add Tree Rule": "Добавить правило дерева"
"Back to Tree Rules": "Назад к правилам дерева"
"Check this box to enable this rule.": "Установите этот флажок, чтобы включить это правило."
"Choose a Tree for the new Tree Items.": "Выберите дерево для новых элементов дерева."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Выберите заголовок выбранного дерева для привязки или его корень. Убедитесь, что он всё ещё существует на момент выполнения этого правила."
"Choose a header of the selected Tree.": "Выберите заголовок выбранного дерева."
"Choose a listed Graph Grouping Style.": "Выберите стиль группировки графиков из списка."
"Choose a listed Leaf Item Type.": "Выберите тип конечного элемента из списка."
"Choose an existing Tree.": "Выберите существующее дерево."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Выберите способ группировки графиков при их отображении для этого узла в дереве. Используется для конечных элементов «Устройство»."
"Data Query Index": "Индекс запросов данных"
"Device": "Устройство"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Конечные элементы «Устройство» не могут использовать критерии по столбцам графиков или шаблонов графиков. При смене типа конечного элемента на «Устройство» установите этот флажок, чтобы удалить эти критерии; их нельзя будет восстановить."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Конечные элементы «Устройство» не могут использовать критерии на основе графиков. Подтвердите удаление %count% критериев для сохранения."
"Edit Tree Rule": "Редактировать правило дерева"
"Enable Rule": "Включить правило"
"Enter a name.": "Введите имя."
"Enter at most %count% characters.": "Введите не более %count% символов."
"Enter single-line text.": "Введите однострочный текст."
"Graph": "График"
"Graph Grouping Style": "Стиль группировки графиков"
"Graph Template": "Шаблон Графика"
"Leaf Item Type": "Тип конечного элемента"
"Name": "Имя"
"Object Selection and Tree Creation Criteria": "Критерии отбора объектов и построения дерева"
"Optional: Sub-Tree Item": "Необязательно: Пункт поддерева"
"Remove graph-based criteria": "Удалить критерии на основе графиков"
"Save": "Сохранить"
"Save outcome is uncertain. Reload before retrying.": "Результат сохранения не определён. Перезагрузите страницу перед повторной попыткой."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Сначала сохраните правило; критерии отбора объектов и построения дерева добавляются после этого."
"The Item Type that shall be dynamically added to the tree.": "Тип объекта, который должен быть динамически добавлен в дерево."
"The tree rule changed since you opened this form. Reload before saving.": "Правило дерева изменилось после открытия этой формы. Перезагрузите страницу перед сохранением."
"Tree": "Дерево"
"Tree Rule Selection [edit: %name%]": "Выбор правила дерева [редактирование: %name%]"
"Tree Rules Selection [new]": "Выбор правил дерева [новый]"
"Tree rule not found.": "Правило дерева не найдено."
"Tree rule saved.": "Правило дерева сохранено."
"Unable to load the tree rule. Reload before retrying.": "Не удалось загрузить правило дерева. Перезагрузите страницу перед повторной попыткой."
"Unexpected fields were submitted.": "Отправлены неожиданные поля."
