"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir ಅನ್ನು ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಖಾತೆಗೆ ಬರೆಯಬಹುದಾದ ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಡೈರೆಕ್ಟರಿಯಾಗಿ ಕಾನ್ಫಿಗರ್ ಮಾಡಿ. ಸ್ಥಳೀಯ ಆಮದುಗಳು ತಾತ್ಕಾಲಿಕ ಫೈಲ್‌ಗಳನ್ನು ಬಳಸುತ್ತವೆ."
