"Runtime comparison": "ರನ್‌ಟೈಮ್ ಹೋಲಿಕೆ"
"The configured worker runtime did not confirm a bounded comparison.": "ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ ವರ್ಕರ್ ರನ್‌ಟೈಮ್ ಸೀಮಿತ ಹೋಲಿಕೆಯನ್ನು ದೃಢೀಕರಿಸಲಿಲ್ಲ."
"The inherited worker secret could not be confirmed against the web secret.": "ಆನುವಂಶಿಕ ವರ್ಕರ್ ರಹಸ್ಯವನ್ನು ವೆಬ್ ರಹಸ್ಯದೊಂದಿಗೆ ದೃಢೀಕರಿಸಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ."
