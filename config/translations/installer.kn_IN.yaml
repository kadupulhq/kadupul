"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಅನ್ನು ಕರೆಗಾರನ ಒಡೆತನದ ವಹಿವಾಟಿನ ಹೊರಗೆ ಚಲಾಯಿಸಿ ಮತ್ತು ಅದರ ಮ್ಯುಟೇಶನ್ ಸಂಪರ್ಕದಲ್ಲಿ ಆಟೋಕಮಿಟ್ ಅನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಿ."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "ಬಿಡುಗಡೆ ಡೈರೆಕ್ಟರಿಯನ್ನು ಪುನಃಸ್ಥಾಪಿಸಿ ಮತ್ತು ಟೆಂಪ್ಲೇಟ್ ರಿಸೋರ್ಸ್ ಆಮದುಗಳಿಗಾಗಿ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಖಾತೆಗೆ ಬರೆಯುವ ಪ್ರವೇಶ ನೀಡಿ. ಅದನ್ನು ಎಲ್ಲರಿಗೂ ಬರೆಯಬಹುದಾದಂತೆ ಮಾಡಬೇಡಿ."
