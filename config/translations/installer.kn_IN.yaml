"Finishing tasks only. Schema migrations will not be replayed.": "ಮುಕ್ತಾಯ ಕಾರ್ಯಗಳು ಮಾತ್ರ. ಸ್ಕೀಮಾ ಮೈಗ್ರೇಶನ್‌ಗಳನ್ನು ಮರುಪ್ರಸಾರ ಮಾಡಲಾಗುವುದಿಲ್ಲ."
"I accept the license terms": "ನಾನು ಪರವಾನಗಿ ನಿಯಮಗಳನ್ನು ಒಪ್ಪುತ್ತೇನೆ"
