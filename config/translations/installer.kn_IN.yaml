"Both runtimes must support PHP 8.4; differing patch versions require review.": "ಎರಡೂ ರನ್‌ಟೈಮ್‌ಗಳು PHP 8.4 ಅನ್ನು ಬೆಂಬಲಿಸಬೇಕು; ಭಿನ್ನ ಪ್ಯಾಚ್ ಆವೃತ್ತಿಗಳಿಗೆ ಪರಿಶೀಲನೆ ಅಗತ್ಯ."
"Required extension comparison": "ಅಗತ್ಯ ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಹೋಲಿಕೆ"
"Required extension availability is checked; differing versions require review.": "ಅಗತ್ಯ ಎಕ್ಸ್‌ಟೆನ್ಶನ್ ಲಭ್ಯತೆಯನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ; ಭಿನ್ನ ಆವೃತ್ತಿಗಳಿಗೆ ಪರಿಶೀಲನೆ ಅಗತ್ಯ."
"Process identity comparison": "ಪ್ರಕ್ರಿಯೆ ಗುರುತು ಹೋಲಿಕೆ"
"Effective process identity is unavailable on this platform.": "ಈ ಪ್ಲಾಟ್‌ಫಾರ್ಮ್‌ನಲ್ಲಿ ಪರಿಣಾಮಕಾರಿ ಪ್ರಕ್ರಿಯೆ ಗುರುತು ಲಭ್ಯವಿಲ್ಲ."
"Effective process identities match.": "ಪರಿಣಾಮಕಾರಿ ಪ್ರಕ್ರಿಯೆ ಗುರುತುಗಳು ಹೊಂದುತ್ತವೆ."
"Effective process identities differ; separate service accounts may be intentional.": "ಪರಿಣಾಮಕಾರಿ ಪ್ರಕ್ರಿಯೆ ಗುರುತುಗಳು ಭಿನ್ನವಾಗಿವೆ; ಪ್ರತ್ಯೇಕ ಸೇವಾ ಖಾತೆಗಳು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿರಬಹುದು."
"Directory access comparison": "ಡೈರೆಕ್ಟರಿ ಪ್ರವೇಶ ಹೋಲಿಕೆ"
"Read-only directory permission observations match.": "ಓದಲು ಮಾತ್ರ ಡೈರೆಕ್ಟರಿ ಅನುಮತಿ ಅವಲೋಕನಗಳು ಹೊಂದುತ್ತವೆ."
"Directory locations or permission observations differ; review the service-account roles.": "ಡೈರೆಕ್ಟರಿ ಸ್ಥಳಗಳು ಅಥವಾ ಅನುಮತಿ ಅವಲೋಕನಗಳು ಭಿನ್ನವಾಗಿವೆ; ಸೇವಾ ಖಾತೆ ಪಾತ್ರಗಳನ್ನು ಪರಿಶೀಲಿಸಿ."
"Worker directory read and traversal": "ವರ್ಕರ್ ಡೈರೆಕ್ಟರಿ ಓದುವಿಕೆ ಮತ್ತು ಸಂಚಾರ"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "ಅಗತ್ಯ ವರ್ಕರ್ ಡೈರೆಕ್ಟರಿಗಳು ಅಸ್ತಿತ್ವದಲ್ಲಿರಬೇಕು ಮತ್ತು ಓದುವಿಕೆ ಹಾಗೂ ಸಂಚಾರಕ್ಕೆ ಅವಕಾಶ ನೀಡಬೇಕು. ಯಾವುದೇ ಬರವಣಿಗೆಗಳನ್ನು ಪರೀಕ್ಷಿಸಲಾಗಿಲ್ಲ."
"The inherited worker secret matches the web secret for this private challenge.": "ಆನುವಂಶಿಕ ವರ್ಕರ್ ರಹಸ್ಯವು ಈ ಖಾಸಗಿ ಸವಾಲಿಗೆ ವೆಬ್ ರಹಸ್ಯದೊಂದಿಗೆ ಹೊಂದುತ್ತದೆ."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ PHP ಇಂಟರ್ಪ್ರಿಟರ್, ಅಗತ್ಯ ಎಕ್ಸ್‌ಟೆನ್ಶನ್‌ಗಳು, ಆನುವಂಶಿಕ ರಹಸ್ಯ ಮತ್ತು ಸೇವಾ ಖಾತೆ ಡೈರೆಕ್ಟರಿ ಅನುಮತಿಗಳನ್ನು ಪರಿಶೀಲಿಸಿ. ಯಾವುದೇ ಬರವಣಿಗೆಗಳು ಅಥವಾ ಇನ್‌ಸ್ಟಾಲರ್ ಪ್ರಾರಂಭವನ್ನು ಪರೀಕ್ಷಿಸಲಾಗಿಲ್ಲ."
"advisory": "ಸಲಹಾತ್ಮಕ"
