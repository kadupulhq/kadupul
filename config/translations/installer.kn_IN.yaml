"Effective migration privileges, including active roles and object-specific grants, were not verified.": "ಸಕ್ರಿಯ ಪಾತ್ರಗಳು ಮತ್ತು ವಸ್ತು-ನಿರ್ದಿಷ್ಟ ಅನುದಾನಗಳನ್ನು ಒಳಗೊಂಡಂತೆ ಪರಿಣಾಮಕಾರಿ ಮೈಗ್ರೇಶನ್ ಸವಲತ್ತುಗಳನ್ನು ಪರಿಶೀಲಿಸಲಾಗಿಲ್ಲ."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಖಾತೆ ಮತ್ತು ಸ್ಕೀಮಾಗೆ ಅಗತ್ಯ ಕೋಷ್ಟಕ ಬರವಣಿಗೆಗಳು, ಸ್ಕೀಮಾ ಬದಲಾವಣೆಗಳು, ಟ್ರಿಗರ್‌ಗಳು ಮತ್ತು ರೂಟೀನ್‌ಗಳನ್ನು ಡೇಟಾಬೇಸ್ ನಿರ್ವಾಹಕರು ಪರಿಶೀಲಿಸುವಂತೆ ಮಾಡಿ. ಜಾಗತಿಕ ನಿರ್ವಾಹಕ ಸವಲತ್ತುಗಳನ್ನು ನೀಡಬೇಡಿ."
"Compare web and worker runtimes": "ವೆಬ್ ಮತ್ತು ವರ್ಕರ್ ರನ್‌ಟೈಮ್‌ಗಳನ್ನು ಹೋಲಿಸಿ"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "ಇದು ಓದಲು ಮಾತ್ರ ಇರುವ ಚಿಕ್ಕ PHP ಪರೀಕ್ಷೆಯನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರಾರಂಭಿಸುತ್ತದೆ. ಇದು ಇನ್‌ಸ್ಟಾಲರ್ ಅನ್ನು ಕಾಯ್ದಿರಿಸುವುದಿಲ್ಲ, ಫೈಲ್‌ಗಳನ್ನು ಬರೆಯುವುದಿಲ್ಲ ಅಥವಾ ಸಾಧನಗಳನ್ನು ಸಂಪರ್ಕಿಸುವುದಿಲ್ಲ."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "ಪರೀಕ್ಷೆಯು ಈ ವೆಬ್ ಪ್ರಕ್ರಿಯೆಯಿಂದ ಆನುವಂಶಿಕವಾಗಿ ಪಡೆದು, ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ ಇನ್‌ಸ್ಟಾಲರ್ PHP ಇಂಟರ್ಪ್ರಿಟರ್ ಅನ್ನು ಬಳಸುತ್ತದೆ. ಇದು ಪ್ರತ್ಯೇಕ ಶೆಡ್ಯೂಲರ್ ಅಥವಾ ಸೇವೆಯನ್ನು ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ."
"I authorize the read-only worker runtime comparison.": "ಓದಲು ಮಾತ್ರ ವರ್ಕರ್ ರನ್‌ಟೈಮ್ ಹೋಲಿಕೆಗೆ ನಾನು ಅಧಿಕಾರ ನೀಡುತ್ತೇನೆ."
"Compare runtimes": "ರನ್‌ಟೈಮ್‌ಗಳನ್ನು ಹೋಲಿಸಿ"
"Runtime comparison results": "ರನ್‌ಟೈಮ್ ಹೋಲಿಕೆ ಫಲಿತಾಂಶಗಳು"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "ಅನುಮತಿ ಮತ್ತು ಗುರುತಿನ ವ್ಯತ್ಯಾಸಗಳು ಉದ್ದೇಶಪೂರ್ವಕವಾಗಿರಬಹುದು. ಓದಲು ಮಾತ್ರ ಅವಲೋಕನಗಳು ಬರವಣಿಗೆಗಳು ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಯಶಸ್ವಿಯಾಗುತ್ತದೆ ಎಂದು ಸಾಬೀತುಪಡಿಸುವುದಿಲ್ಲ."
"Confirm the read-only worker runtime comparison.": "ಓದಲು ಮಾತ್ರ ವರ್ಕರ್ ರನ್‌ಟೈಮ್ ಹೋಲಿಕೆಯನ್ನು ದೃಢೀಕರಿಸಿ."
"The runtime comparison is unavailable.": "ರನ್‌ಟೈಮ್ ಹೋಲಿಕೆ ಲಭ್ಯವಿಲ್ಲ."
