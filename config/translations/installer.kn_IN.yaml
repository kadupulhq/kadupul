"Check collection freshness and collector connectivity before enabling discovery.": "ಡಿಸ್ಕವರಿಯನ್ನು ಸಕ್ರಿಯಗೊಳಿಸುವ ಮೊದಲು ಸಂಗ್ರಹಣೆ ತಾಜಾತನ ಮತ್ತು ಸಂಗ್ರಾಹಕ ಸಂಪರ್ಕವನ್ನು ಪರಿಶೀಲಿಸಿ."
"Check requirements": "ಅವಶ್ಯಕತೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "ಪರಿಶೀಲನೆಗಳು ಈ ಪ್ರಕ್ರಿಯೆ ಮತ್ತು ಫೈಲ್‌ಸಿಸ್ಟಂ ಅನುಮತಿಗಳನ್ನು ಪರೀಕ್ಷಿಸುತ್ತವೆ. ಅವು ಪರೀಕ್ಷಾ ಫೈಲ್‌ಗಳನ್ನು ಬರೆಯುವುದಿಲ್ಲ ಅಥವಾ ಸಾಧನಗಳನ್ನು ಸಂಪರ್ಕಿಸುವುದಿಲ್ಲ."
