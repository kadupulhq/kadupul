"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "ಡೇಟಾಬೇಸ್, RRD ಫೈಲ್‌ಗಳು, ಕಾನ್ಫಿಗರೇಶನ್ ಮತ್ತು ಕೀಗಳ ಬ್ಯಾಕಪ್ ತೆಗೆದುಕೊಳ್ಳಿ. ಡೇಟಾಬೇಸ್ ಅಪ್‌ಗ್ರೇಡ್‌ಗಳು ಅಪ್ಲಿಕೇಶನ್ ರೋಲ್‌ಬ್ಯಾಕ್‌ನಿಂದ ಹಿಂತಿರುಗಿಸಲಾಗದ ಬದಲಾವಣೆಗಳನ್ನು ಕಮಿಟ್ ಮಾಡಬಹುದು."
