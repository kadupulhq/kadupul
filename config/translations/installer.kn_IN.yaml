"Installer option is too long or contains a null byte.": "ಇನ್‌ಸ್ಟಾಲರ್ ಆಯ್ಕೆ ತುಂಬಾ ಉದ್ದವಾಗಿದೆ ಅಥವಾ ನಲ್ ಬೈಟ್ ಹೊಂದಿದೆ."
"Installer IDs and intervals must be whole numbers.": "ಇನ್‌ಸ್ಟಾಲರ್ ಐಡಿಗಳು ಮತ್ತು ಅಂತರಗಳು ಪೂರ್ಣಾಂಕಗಳಾಗಿರಬೇಕು."
"Installer ID or interval is outside its supported range.": "ಇನ್‌ಸ್ಟಾಲರ್ ಐಡಿ ಅಥವಾ ಅಂತರವು ಬೆಂಬಲಿತ ವ್ಯಾಪ್ತಿಯ ಹೊರಗಿದೆ."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಮುಂದುವರಿಯಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ. ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಅದರ ಸ್ಥಿತಿಯನ್ನು ಮರುಲೋಡ್ ಮಾಡಿ ಮತ್ತು ನಿರ್ಬಂಧಿಸುವ ಪರಿಶೀಲನೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ."
"Confirm that the previous worker has stopped before recovering its plan.": "ಯೋಜನೆಯನ್ನು ಮರುಪಡೆಯುವ ಮೊದಲು ಹಿಂದಿನ ವರ್ಕರ್ ನಿಂತಿದೆ ಎಂದು ದೃಢೀಕರಿಸಿ."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ಡೇಟಾಬೇಸ್ ಇನ್‌ಸ್ಟಾಲ್ ಆಗಿದೆ, ಆದರೆ ಕೆಲವು ಸಂಗ್ರಾಹಕಗಳಿಗೆ ಇನ್ನೂ ಸಿಂಕ್ರೊನೈಸೇಶನ್ ಅಗತ್ಯವಿದೆ. ಅವುಗಳ ಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಿದ ನಂತರ ಮುಕ್ತಾಯ ಕಾರ್ಯಗಳನ್ನು ಮರುಪ್ರಯತ್ನಿಸಿ."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ನಿಂತಿದೆ. ಇನ್‌ಸ್ಟಾಲರ್ ಲಾಗ್ ಅನ್ನು ಉಳಿಸಿಕೊಳ್ಳಿ, ಕಾರಣವನ್ನು ಸರಿಪಡಿಸಿ ಮತ್ತು ಮರುಪ್ರಯತ್ನವನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ದೃಢೀಕರಿಸಿ. ಕೆಲವು ಡೇಟಾಬೇಸ್ ಬದಲಾವಣೆಗಳು ಈಗಾಗಲೇ ಕಮಿಟ್ ಆಗಿರಬಹುದು. ಮರುಪ್ರಯತ್ನಕ್ಕೆ ಅಧಿಕಾರ ನೀಡುವ ಮೊದಲು ಪ್ಲಗಿನ್ ಸ್ವಚ್ಛಗೊಳಿಸುವಿಕೆಯನ್ನು ಪರಿಶೀಲಿಸಿ."
"Next action": "ಮುಂದಿನ ಕ್ರಿಯೆ"
"Follow the execution status. Do not start another attempt while a worker is active.": "ಕಾರ್ಯಗತಗೊಳಿಸುವಿಕೆ ಸ್ಥಿತಿಯನ್ನು ಅನುಸರಿಸಿ. ವರ್ಕರ್ ಸಕ್ರಿಯವಾಗಿರುವಾಗ ಇನ್ನೊಂದು ಪ್ರಯತ್ನವನ್ನು ಪ್ರಾರಂಭಿಸಬೇಡಿ."
"Complete the recovery checklist before retrying.": "ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಮರುಪಡೆಯುವಿಕೆ ಪರಿಶೀಲನಾಪಟ್ಟಿಯನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ."
"Verify collection and graph operation before enabling discovery.": "ಡಿಸ್ಕವರಿಯನ್ನು ಸಕ್ರಿಯಗೊಳಿಸುವ ಮೊದಲು ಸಂಗ್ರಹಣೆ ಮತ್ತು ಗ್ರಾಫ್ ಕಾರ್ಯಾಚರಣೆಯನ್ನು ಪರಿಶೀಲಿಸಿ."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "ನಿರ್ಬಂಧಿತ ಅವಶ್ಯಕತೆಗಳನ್ನು ಪರಿಹರಿಸಿ, ನಂತರ ಮತ್ತೆ ಪರಿಶೀಲಿಸಿ. ಉಳಿಸಿದ ಆಯ್ಕೆಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳಲಾಗಿದೆ."
"Review the planned changes and backup checklist before authorizing execution.": "ಕಾರ್ಯಗತಗೊಳಿಸಲು ಅಧಿಕಾರ ನೀಡುವ ಮೊದಲು ಯೋಜಿತ ಬದಲಾವಣೆಗಳು ಮತ್ತು ಬ್ಯಾಕಪ್ ಪರಿಶೀಲನಾಪಟ್ಟಿಯನ್ನು ಪರಿಶೀಲಿಸಿ."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "ಸಂಗ್ರಹಣೆ ಪ್ರೊಫೈಲ್ ಅನ್ನು ಆಯ್ಕೆಮಾಡಿ ಮತ್ತು ಪರವಾನಗಿಯನ್ನು ಒಪ್ಪಿಕೊಳ್ಳಿ. ಐಚ್ಛಿಕ ಸೆಟ್ಟಿಂಗ್‌ಗಳನ್ನು ಬೇಕಾದಾಗ ತೆರೆಯಬಹುದು."
"Download installation diagnostics": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ರೋಗನಿರ್ಣಯವನ್ನು ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ಗ್ರಾಫ್ ತೆರೆಯಿರಿ ಮತ್ತು ಪೋಲರ್ ಚಕ್ರದ ನಂತರ ಅದರ RRD ಡೇಟಾ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತದೆಯೇ ಎಂದು ಖಚಿತಪಡಿಸಿ."
"Requirement details": "ಅವಶ್ಯಕತೆ ವಿವರಗಳು"
"Recover": "ಮರುಪಡೆಯಿರಿ"
"Recovery checklist": "ಮರುಪಡೆಯುವಿಕೆ ಪರಿಶೀಲನಾಪಟ್ಟಿ"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log ಅನ್ನು ಉಳಿಸಿಕೊಳ್ಳಿ ಮತ್ತು ವಿಫಲ ಪ್ರಯತ್ನವನ್ನು ದಾಖಲಿಸಿ."
"Confirm that the previous worker and its child processes have stopped.": "ಹಿಂದಿನ ವರ್ಕರ್ ಮತ್ತು ಅದರ ಚೈಲ್ಡ್ ಪ್ರಕ್ರಿಯೆಗಳು ನಿಂತಿವೆ ಎಂದು ದೃಢೀಕರಿಸಿ."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "ಕಮಿಟ್ ಆದ ಬದಲಾವಣೆಗಳು, ಸಂಗ್ರಾಹಕ ಸಿಂಕ್ರೊನೈಸೇಶನ್ ಮತ್ತು ಪ್ಲಗಿನ್ ಸ್ವಚ್ಛಗೊಳಿಸುವಿಕೆಯನ್ನು ಪರೀಕ್ಷಿಸಿ. ಮರುಪ್ರಯತ್ನಿಸುವ ಮೊದಲು ಕಾರಣವನ್ನು ಸರಿಪಡಿಸಿ."
"Review the saved plan again, then explicitly authorize a retry.": "ಉಳಿಸಿದ ಯೋಜನೆಯನ್ನು ಮತ್ತೆ ಪರಿಶೀಲಿಸಿ, ನಂತರ ಮರುಪ್ರಯತ್ನಕ್ಕೆ ಸ್ಪಷ್ಟವಾಗಿ ಅಧಿಕಾರ ನೀಡಿ."
"Recover a stopped worker": "ನಿಂತ ವರ್ಕರ್ ಅನ್ನು ಮರುಪಡೆಯಿರಿ"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "ಈ ಪ್ರಯತ್ನ ಇನ್ನು ಚಾಲನೆಯಲ್ಲಿಲ್ಲ ಎಂದು ದೃಢೀಕರಿಸಿದ ನಂತರವೇ ಮರುಪಡೆಯುವಿಕೆಯನ್ನು ಬಳಸಿ. ಮರುಪಡೆಯುವಿಕೆ ಯಾವುದೇ ಪ್ರಕ್ರಿಯೆಯನ್ನು ನಿಲ್ಲಿಸುವುದಿಲ್ಲ."
"Collector and installation mode": "ಸಂಗ್ರಾಹಕ ಮತ್ತು ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಮೋಡ್"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "ನಿಯೋಜನೆ ಕಾನ್ಫಿಗರೇಶನ್ ಸಂಗ್ರಾಹಕ ಪಾತ್ರ ಮತ್ತು ಡೇಟಾಬೇಸ್ ಸಂಪರ್ಕಗಳನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ. ಸಂಗ್ರಾಹಕ ಅನ್ನು ಪ್ರಾರಂಭಿಸುವ ಮೊದಲು ಪ್ರಾಥಮಿಕ ಸರ್ವರ್ ಕಾನ್ಫಿಗರೇಶನ್ ಅನ್ನು ಪರಿಶೀಲಿಸಿ."
"Discovery and SNMP settings": "ಡಿಸ್ಕವರಿ ಮತ್ತು SNMP ಸೆಟ್ಟಿಂಗ್‌ಗಳು"
"Keep discovery disabled until collection and collector connectivity have been verified.": "ಸಂಗ್ರಹಣೆ ಮತ್ತು ಸಂಗ್ರಾಹಕ ಸಂಪರ್ಕವನ್ನು ಪರಿಶೀಲಿಸುವವರೆಗೆ ಡಿಸ್ಕವರಿಯನ್ನು ನಿಷ್ಕ್ರಿಯವಾಗಿಡಿ."
"Template selection": "ಟೆಂಪ್ಲೇಟ್ ಆಯ್ಕೆ"
"Templates selected for import": "ಆಮದಿಗಾಗಿ ಆಯ್ದ ಟೆಂಪ್ಲೇಟ್‌ಗಳು"
"No templates selected.": "ಯಾವುದೇ ಟೆಂಪ್ಲೇಟ್‌ಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿಲ್ಲ."
"Backup checklist": "ಬ್ಯಾಕಪ್ ಪರಿಶೀಲನಾಪಟ್ಟಿ"
"Database backup and a tested restoration procedure.": "ಡೇಟಾಬೇಸ್ ಬ್ಯಾಕಪ್ ಮತ್ತು ಪರೀಕ್ಷಿಸಿದ ಪುನಃಸ್ಥಾಪನೆ ಕಾರ್ಯವಿಧಾನ."
"RRD files and the service account permissions needed to restore them.": "RRD ಫೈಲ್‌ಗಳು ಮತ್ತು ಅವುಗಳನ್ನು ಪುನಃಸ್ಥಾಪಿಸಲು ಬೇಕಾದ ಸೇವಾ ಖಾತೆ ಅನುಮತಿಗಳು."
"Configuration, keys and plugin data outside the database.": "ಡೇಟಾಬೇಸ್‌ನ ಹೊರಗಿನ ಕಾನ್ಫಿಗರೇಶನ್, ಕೀಗಳು ಮತ್ತು ಪ್ಲಗಿನ್ ಡೇಟಾ."
"Post-installation checks": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ನಂತರದ ಪರಿಶೀಲನೆಗಳು"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "ಪರಿಶೀಲಿತ ಪರಿಶೀಲನೆಗಳು ತೋರಿಸಿದ ಪುರಾವೆಯನ್ನು ಮಾತ್ರ ಒಳಗೊಳ್ಳುತ್ತವೆ. ಮೌಲ್ಯಮಾಪನ ಮಾಡದ ಪರಿಶೀಲನೆಗಳಿಗೆ ಇನ್ನೂ ನಿರ್ವಾಹಕರ ಪರಿಶೀಲನೆ ಅಗತ್ಯ."
"Operational checks still require operator verification.": "ಕಾರ್ಯಾಚರಣೆಯ ಪರಿಶೀಲನೆಗಳಿಗೆ ಇನ್ನೂ ನಿರ್ವಾಹಕರ ಪರಿಶೀಲನೆ ಅಗತ್ಯ."
"Status": "ಸ್ಥಿತಿ"
"verified": "ಪರಿಶೀಲಿಸಲಾಗಿದೆ"
"action_required": "ಕ್ರಮ ಅಗತ್ಯ"
"not_assessed": "ಮೌಲ್ಯಮಾಪನ ಮಾಡಲಾಗಿಲ್ಲ"
"Database schema": "ಡೇಟಾಬೇಸ್ ಸ್ಕೀಮಾ"
"Stored schema matches the application target.": "ಸಂಗ್ರಹಿತ ಸ್ಕೀಮಾ ಅಪ್ಲಿಕೇಶನ್ ಗುರಿಗೆ ಹೊಂದುತ್ತದೆ."
"Target schema completion has not been confirmed.": "ಗುರಿ ಸ್ಕೀಮಾ ಪೂರ್ಣಗೊಂಡಿರುವುದನ್ನು ದೃಢೀಕರಿಸಲಾಗಿಲ್ಲ."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಫಲಿತಾಂಶವನ್ನು ಪರಿಶೀಲಿಸಿ ಮತ್ತು ಸ್ಕೀಮಾ ಅಪ್‌ಗ್ರೇಡ್ ಪೂರ್ಣಗೊಂಡಿದೆ ಎಂದು ಪರಿಗಣಿಸುವ ಮೊದಲು ವೈಫಲ್ಯಗಳನ್ನು ಪರಿಹರಿಸಿ."
"Installation outcome": "ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಫಲಿತಾಂಶ"
"A successful receipt matches the current target schema.": "ಯಶಸ್ವಿ ರಸೀದಿಯು ಪ್ರಸ್ತುತ ಗುರಿ ಸ್ಕೀಮಾಗೆ ಹೊಂದುತ್ತದೆ."
"A complete successful installation outcome has not been confirmed.": "ಸಂಪೂರ್ಣ ಯಶಸ್ವಿ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಫಲಿತಾಂಶವನ್ನು ದೃಢೀಕರಿಸಲಾಗಿಲ್ಲ."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "ಇನ್‌ಸ್ಟಾಲರ್ ಲಾಗ್ ಅನ್ನು ಉಳಿಸಿಕೊಳ್ಳಿ ಮತ್ತು ಅಗತ್ಯವಿದ್ದಾಗ ಸ್ಪಷ್ಟ ಮರುಪಡೆಯುವಿಕೆ ಅಥವಾ ಮರುಪ್ರಯತ್ನ ಕಾರ್ಯವಿಧಾನವನ್ನು ಬಳಸಿ."
"Collector synchronization": "ಸಂಗ್ರಾಹಕ ಸಿಂಕ್ರೊನೈಸೇಶನ್"
"The completed installer reports pending collector synchronization.": "ಪೂರ್ಣಗೊಂಡ ಇನ್‌ಸ್ಟಾಲರ್ ಬಾಕಿ ಇರುವ ಸಂಗ್ರಾಹಕ ಸಿಂಕ್ರೊನೈಸೇಶನ್ ಅನ್ನು ವರದಿ ಮಾಡುತ್ತದೆ."
"The completed installer reports no pending collectors.": "ಪೂರ್ಣಗೊಂಡ ಇನ್‌ಸ್ಟಾಲರ್ ಯಾವುದೇ ಬಾಕಿ ಸಂಗ್ರಾಹಕಗಳಿಲ್ಲ ಎಂದು ವರದಿ ಮಾಡುತ್ತದೆ."
"Collector completion remains unconfirmed by this partial receipt.": "ಈ ಭಾಗಶಃ ರಸೀದಿಯಿಂದ ಸಂಗ್ರಾಹಕ ಪೂರ್ಣಗೊಳ್ಳುವಿಕೆ ದೃಢೀಕರಿಸಲ್ಪಟ್ಟಿಲ್ಲ."
"Collector completion is not established by this installation outcome.": "ಈ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಫಲಿತಾಂಶದಿಂದ ಸಂಗ್ರಾಹಕ ಪೂರ್ಣಗೊಳ್ಳುವಿಕೆ ಸ್ಥಾಪಿತವಾಗಿಲ್ಲ."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "ಭಾಗಶಃ ಫಲಿತಾಂಶಗಳಿಗಾಗಿ ಸಂಗ್ರಾಹಕ ಸ್ಥಿತಿಯನ್ನು ಪರಿಶೀಲಿಸಿ ಮತ್ತು ಮುಕ್ತಾಯ ಕಾರ್ಯಗಳನ್ನು ಮರುಪ್ರಯತ್ನಿಸಿ. ಇದು ನಂತರದ ಸಂಗ್ರಹಣೆ ತಾಜಾತನವನ್ನು ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ."
"Scheduled collection": "ನಿಗದಿತ ಸಂಗ್ರಹಣೆ"
"No poller or device was contacted by this assessment.": "ಈ ಮೌಲ್ಯಮಾಪನದಿಂದ ಯಾವುದೇ ಪೋಲರ್ ಅಥವಾ ಸಾಧನವನ್ನು ಸಂಪರ್ಕಿಸಲಾಗಿಲ್ಲ."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "ಕಾನ್ಫಿಗರ್ ಮಾಡಿದ ಶೆಡ್ಯೂಲರ್ ಪೋಲರ್ ಅನ್ನು ಉದ್ದೇಶಿತ ಸೇವಾ ಖಾತೆಯಾಗಿ ಚಲಾಯಿಸುತ್ತದೆ ಎಂದು ದೃಢೀಕರಿಸಿ ಮತ್ತು ಅದರ ಮುಂದಿನ ಸಾಮಾನ್ಯ ಚಕ್ರವನ್ನು ಪರಿಶೀಲಿಸಿ."
"Graph data": "ಗ್ರಾಫ್ ಡೇಟಾ"
"Live samples and RRD updates were not exercised.": "ಲೈವ್ ಮಾದರಿಗಳು ಮತ್ತು RRD ಅಪ್‌ಡೇಟ್‌ಗಳನ್ನು ಪರೀಕ್ಷಿಸಲಾಗಿಲ್ಲ."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "ಸಾಮಾನ್ಯ ಸಂಗ್ರಹಣೆ ಚಕ್ರದ ನಂತರ, ನಿರೀಕ್ಷಿತ ಗ್ರಾಫ್‌ಗಳು ಹೊಸ ಮಾದರಿಗಳನ್ನು ಪಡೆಯುತ್ತವೆ ಎಂದು ದೃಢೀಕರಿಸಿ ಮತ್ತು ಪೋಲರ್ ದೋಷಗಳನ್ನು ಪರಿಶೀಲಿಸಿ."
"Recovery readiness": "ಮರುಪಡೆಯುವಿಕೆ ಸಿದ್ಧತೆ"
"Backup restoration was not exercised.": "ಬ್ಯಾಕಪ್ ಪುನಃಸ್ಥಾಪನೆಯನ್ನು ಪರೀಕ್ಷಿಸಲಾಗಿಲ್ಲ."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "ಮರುಪಡೆಯುವಿಕೆಯನ್ನು ಅವಲಂಬಿಸುವ ಮೊದಲು ಡೇಟಾಬೇಸ್, RRD ಫೈಲ್‌ಗಳು, ಕಾನ್ಫಿಗರೇಶನ್ ಮತ್ತು ಕೀ ಸಾಮಗ್ರಿಯ ಪ್ರತ್ಯೇಕ ಪುನಃಸ್ಥಾಪನೆಯನ್ನು ಪರಿಶೀಲಿಸಿ."
"No persisted local poller start has been recorded.": "ಯಾವುದೇ ಸ್ಥಿರ ಸ್ಥಳೀಯ ಪೋಲರ್ ಪ್ರಾರಂಭವನ್ನು ದಾಖಲಿಸಲಾಗಿಲ್ಲ."
"Persisted poller timing is invalid and cannot establish scheduler health.": "ಸ್ಥಿರ ಪೋಲರ್ ಸಮಯ ಅಮಾನ್ಯವಾಗಿದೆ ಮತ್ತು ಶೆಡ್ಯೂಲರ್ ಆರೋಗ್ಯವನ್ನು ಸ್ಥಾಪಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ."
"The recorded poller start is in the future. Check clock synchronization.": "ದಾಖಲಾದ ಪೋಲರ್ ಪ್ರಾರಂಭ ಭವಿಷ್ಯದಲ್ಲಿದೆ. ಗಡಿಯಾರ ಸಿಂಕ್ರೊನೈಸೇಶನ್ ಪರಿಶೀಲಿಸಿ."
"The recorded poller start is older than the native scheduling tolerance.": "ದಾಖಲಾದ ಪೋಲರ್ ಪ್ರಾರಂಭವು ಸ್ಥಳೀಯ ವೇಳಾಪಟ್ಟಿ ಸಹನೆಗಿಂತ ಹಳೆಯದಾಗಿದೆ."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "ಸ್ಥಳೀಯ ವೇಳಾಪಟ್ಟಿ ಸಹನೆಯೊಳಗೆ ಸ್ಥಳೀಯ ಪೋಲರ್ ಪ್ರಾರಂಭವನ್ನು ದಾಖಲಿಸಲಾಗಿದೆ. ಪೂರ್ಣಗೊಳ್ಳುವಿಕೆ ಮತ್ತು ಸಾಧನ ಆರೋಗ್ಯವನ್ನು ಪರಿಶೀಲಿಸಲಾಗಿಲ್ಲ."
