"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "ವೆಬ್ PHP ರನ್‌ಟೈಮ್‌ಗೆ popen, pclose ಅನ್ನು ಸಕ್ರಿಯಗೊಳಿಸಿ, ಅಥವಾ ಅಧಿಕೃತ CLI ಇನ್‌ಸ್ಟಾಲರ್ ಬಳಸಿ."
