"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "تغيّرت الأجهزة المحددة أو رسومها البيانية ومصادر بياناتها. أعد تحميل التأكيد قبل إزالة الأجهزة."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "يلزم فصل مصادر البيانات المشتركة أو الرسوم البيانية التجميعية قبل إزالة الرسوم البيانية ومصادر البيانات."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "نتيجة إزالة الجهاز غير مؤكدة. افحص الأجهزة المحددة والرسوم البيانية ومصادر البيانات قبل إعادة المحاولة."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "لا يمكن التراجع عن إزالة الجهاز من هنا. اختر الاحتفاظ بالرسوم البيانية ومصادر البيانات المعطلة أو إزالتها."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "يلزم فصل مصادر البيانات المشتركة والرسوم البيانية التجميعية قبل إزالة الرسوم البيانية. تصبح الرسوم البيانية ومصادر البيانات المحتفظ بها غير معيّنة."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "يجب أن تكون المجمّعات البعيدة المتأثرة متصلة بالشبكة. قد تترك الإزالة الفاشلة تغييرات على الأنظمة البعيدة أو الإضافات؛ افحص النتيجة قبل إعادة المحاولة."
"RRD file cleanup follows the configured maintenance policy.": "يتبع تنظيف ملفات RRD سياسة الصيانة المضبوطة."
