"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "إزالة الارتباط تحتفظ بالرسوم البيانية الحالية والبيانات التاريخية. إضافة ارتباط قد تنشئ رسوما بيانية عبر الأتمتة. يجب أن تكون المجمّعات المتأثرة متصلة بالشبكة."
