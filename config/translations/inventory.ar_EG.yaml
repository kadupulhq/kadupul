"Confirm clearing statistics": "تأكيد مسح الإحصائيات"
"Selected device statistics cleared.": "تم مسح إحصائيات الأجهزة المحددة."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "إعادة ضبط أوقات الاستجابة وعدد مرات الاستطلاع والإتاحة لهذه الأجهزة. يتم الاحتفاظ بالرسوم البيانية والبيانات التاريخية وإعدادات الجهاز، وتُستأنف الإحصائيات مع الاستطلاع التالي."
"Synchronize device templates": "مزامنة قوالب الأجهزة"
"Confirm synchronization": "تأكيد المزامنة"
"Selected device templates synchronized.": "تمت مزامنة قوالب الأجهزة المحددة."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "تطبيق القوالب المعيّنة حاليا على هذه الأجهزة. تتم إضافة ارتباطات الرسوم البيانية واستعلامات البيانات الناقصة، وقد تتم إزالة ارتباطات قوالب الرسوم البيانية غير المستخدمة. يتم تخطي الأجهزة بدون قوالب، مع الاحتفاظ بالرسوم البيانية الحالية والبيانات التاريخية؛ وقد تنشئ الأتمتة رسوما بيانية جديدة."
"Change device options": "تعديل خيارات الجهاز"
"Confirm option changes": "تأكيد تعديلات الخيارات"
"Selected device options updated.": "تم تحديث خيارات الأجهزة المحددة."
"Device options": "خيارات الجهاز"
"Select at least one supported device option.": "اختر خيار جهاز مدعوما واحدا على الأقل."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "تتغير الخيارات المحددة فقط، وتحتفظ الخيارات غير المحددة بقيمها الحالية. اختيار موقع فارغ يقوم بمسحه."
