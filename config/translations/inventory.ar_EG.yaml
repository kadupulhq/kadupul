"Selected device assignments updated.": "تم تحديث تعيينات الأجهزة المحددة."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "يتم تطبيق التعيين المحدد على كل جهاز في القائمة. تحافظ تغييرات القوالب على الرسوم البيانية الحالية؛ وقد تنشئ الأتمتة رسوما بيانية جديدة. تنقل تغييرات المجمّع ملكية الاستطلاع."
