'The recorded poller start is older than the native scheduling tolerance.': 'Zabilježeno pokretanje pollera starije je od izvorne tolerancije planiranja.'
'A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.': 'Lokalno pokretanje pollera zabilježeno je unutar izvorne tolerancije planiranja. Dovršetak i ispravnost uređaja nisu provjereni.'
