'Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.': 'Vratite direktorij izdanja i dodijelite instalacijskom nalogu pristup za pisanje radi uvoza resursa šablona. Nemojte ga činiti dostupnim za pisanje svima.'
