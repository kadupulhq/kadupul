'Installation outcome': 'Ishod instalacije'
'A successful receipt matches the current target schema.': 'Uspješna potvrda odgovara trenutnoj ciljnoj shemi.'
'A complete successful installation outcome has not been confirmed.': 'Potpuni uspješan ishod instalacije nije potvrđen.'
'Preserve the installer log and use the explicit recovery or retry procedure when required.': 'Sačuvajte zapisnik instalatera i po potrebi koristite izričiti postupak oporavka ili ponovnog pokušaja.'
'Collector synchronization': 'Sinhronizacija prikupljača'
'The completed installer reports pending collector synchronization.': 'Dovršeni instalater izvještava o sinhronizaciji prikupljača na čekanju.'
'The completed installer reports no pending collectors.': 'Dovršeni instalater izvještava da nema prikupljača na čekanju.'
'Collector completion remains unconfirmed by this partial receipt.': 'Ova djelomična potvrda ne potvrđuje dovršetak prikupljača.'
'Collector completion is not established by this installation outcome.': 'Ovaj ishod instalacije ne dokazuje dovršetak prikupljača.'
'Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.': 'Pregledajte status prikupljača i ponovite završne zadatke za djelomične ishode. Time se ne provjerava kasnija svježina prikupljanja.'
'Scheduled collection': 'Planirano prikupljanje'
'No poller or device was contacted by this assessment.': 'Ovom procjenom nije kontaktiran nijedan poller ni uređaj.'
'Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.': 'Potvrdite da konfigurisani planer pokreće poller kao predviđeni servisni nalog i pregledajte njegov sljedeći uobičajeni ciklus.'
