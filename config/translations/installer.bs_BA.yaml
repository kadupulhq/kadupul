'directory writable by this process': 'direktorij u koji ovaj proces može pisati'
'missing or not writable': 'nedostaje ili nije moguće pisati'
'Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.': 'Konfigurišite sys_temp_dir kao postojeći direktorij u koji instalacijski nalog može pisati. Izvorni uvozi koriste privremene datoteke.'
'Background worker launch': 'Pokretanje pozadinskog radnika'
