'Accept the license before saving the installation plan.': 'Prihvatite licencu prije čuvanja plana instalacije.'
'Invalid installation form.': 'Nevažeći obrazac instalacije.'
'Access denied.': 'Pristup odbijen.'
'Confirm the recovery warning before retrying.': 'Potvrdite upozorenje o oporavku prije novog pokušaja.'
'Review and confirm the current installation plan.': 'Pregledajte i potvrdite trenutni plan instalacije.'
'Confirm the discovery scope before starting.': 'Potvrdite opseg otkrivanja prije pokretanja.'
'Resolve the blocking checks before starting.': 'Riješite blokirajuće provjere prije pokretanja.'
'Too many installer options.': 'Previše opcija instalatera.'
'Invalid installer option name.': 'Nevažeći naziv opcije instalatera.'
'Unknown or malformed installer option.': 'Nepoznata ili neispravna opcija instalatera.'
'Installer options must be scalar values.': 'Opcije instalatera moraju biti skalarne vrijednosti.'
'Installer option is too long or contains a null byte.': 'Opcija instalatera je preduga ili sadrži nul-bajt.'
'Installer IDs and intervals must be whole numbers.': 'ID-ovi i intervali instalatera moraju biti cijeli brojevi.'
'Installer ID or interval is outside its supported range.': 'ID ili interval instalatera je izvan podržanog raspona.'
'The installation could not proceed. Reload its status and review the blocking checks before retrying.': 'Instalacija nije mogla nastaviti. Ponovno učitajte njezin status i pregledajte blokirajuće provjere prije novog pokušaja.'
'Confirm that the previous worker has stopped before recovering its plan.': 'Potvrdite da je prethodni radnik zaustavljen prije oporavka njegovog plana.'
'The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.': 'Baza podataka je instalirana, ali nekim prikupljačima je i dalje potrebna sinhronizacija. Ponovite završne zadatke nakon provjere njihovog statusa.'
'Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.': 'Instalacija je zaustavljena. Sačuvajte zapisnik instalatera, otklonite uzrok i izričito potvrdite ponovni pokušaj. Neke promjene baze podataka možda su već potvrđene. Provjerite čišćenje dodataka prije odobravanja ponovnog pokušaja.'
'Next action': 'Sljedeća radnja'
'Follow the execution status. Do not start another attempt while a worker is active.': 'Pratite status izvršavanja. Nemojte pokretati novi pokušaj dok je radnik aktivan.'
'Complete the recovery checklist before retrying.': 'Dovršite kontrolnu listu oporavka prije novog pokušaja.'
'Verify collection and graph operation before enabling discovery.': 'Provjerite prikupljanje i rad grafova prije omogućavanja otkrivanja.'
'Resolve the blocked requirements, then check again. Saved selections are retained.': 'Riješite blokirane zahtjeve, a zatim ponovo provjerite. Sačuvani izbori su zadržani.'
'Review the planned changes and backup checklist before authorizing execution.': 'Pregledajte planirane promjene i kontrolnu listu sigurnosnih kopija prije odobravanja izvršavanja.'
'Choose a collection profile and accept the license. Optional settings can be opened when needed.': 'Odaberite profil prikupljanja i prihvatite licencu. Neobavezne postavke mogu se otvoriti prema potrebi.'
'Download installation diagnostics': 'Preuzmi dijagnostiku instalacije'
'Open a graph and confirm that its RRD data updates after a poller cycle.': 'Otvorite graf i potvrdite da se njegovi RRD podaci ažuriraju nakon ciklusa pollera.'
'Requirement details': 'Pojedinosti zahtjeva'
Recover: Oporavi
'Recovery checklist': 'Kontrolna lista oporavka'
'Preserve log/cacti.log and record the failed attempt.': 'Sačuvajte log/cacti.log i zabilježite neuspjeli pokušaj.'
'Confirm that the previous worker and its child processes have stopped.': 'Potvrdite da su prethodni radnik i njegovi podređeni procesi zaustavljeni.'
'Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.': 'Pregledajte potvrđene promjene, sinhronizaciju prikupljača i čišćenje dodataka. Otklonite uzrok prije novog pokušaja.'
'Review the saved plan again, then explicitly authorize a retry.': 'Ponovo pregledajte sačuvani plan, a zatim izričito odobrite ponovni pokušaj.'
'Recover a stopped worker': 'Oporavi zaustavljenog radnika'
'Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.': 'Koristite oporavak tek nakon potvrde da ovaj pokušaj više nije aktivan. Oporavak ne zaustavlja proces.'
'Collector and installation mode': 'Način rada prikupljača i instalacije'
'The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.': 'Konfiguracija implementacije određuje ulogu prikupljača i veze sa bazom podataka. Provjerite konfiguraciju primarnog servera prije pokretanja prikupljača.'
'Discovery and SNMP settings': 'Otkrivanje i SNMP postavke'
'Keep discovery disabled until collection and collector connectivity have been verified.': 'Držite otkrivanje onemogućenim dok se ne provjere prikupljanje i povezivost prikupljača.'
