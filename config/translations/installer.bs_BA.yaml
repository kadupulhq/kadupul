'After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.': 'Nakon uobičajenog ciklusa prikupljanja potvrdite da očekivani grafikoni primaju svježe uzorke i pregledajte greške pollera.'
'Recovery readiness': 'Spremnost za oporavak'
