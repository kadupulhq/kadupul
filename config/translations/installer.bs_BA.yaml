'Import destination: scripts': 'Odredište uvoza: scripts'
'Database privileges': 'Privilegije baze podataka'
'Effective migration privileges, including active roles and object-specific grants, were not verified.': 'Efektivne privilegije migracije, uključujući aktivne uloge i dozvole specifične za objekte, nisu provjerene.'
'Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.': 'Neka administrator baze podataka verifikuje potrebne upise u tabele, izmjene šeme, okidače i rutine za instalacijski nalog i šemu. Nemojte dodjeljivati globalne administratorske privilegije.'
'Compare web and worker runtimes': 'Usporedi web i radnička okruženja'
'This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.': 'Ovo izričito pokreće kratku PHP probu samo za čitanje. Ne rezervira instalater, ne zapisuje datoteke i ne kontaktira uređaje.'
'The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.': 'Proba nasljeđuje ovaj web proces i koristi konfigurisani PHP interpreter instalatera. Ne ispituje poseban planer ili servis.'
'I authorize the read-only worker runtime comparison.': 'Odobravam usporedbu radničkog okruženja samo za čitanje.'
'Compare runtimes': 'Usporedi okruženja'
'Runtime comparison results': 'Rezultati usporedbe okruženja'
'Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.': 'Razlike u dozvolama i identitetu mogu biti namjerne. Opažanja samo za čitanje ne dokazuju da će pisanje ili instalacija uspjeti.'
'Confirm the read-only worker runtime comparison.': 'Potvrdite usporedbu radničkog okruženja samo za čitanje.'
'The runtime comparison is unavailable.': 'Usporedba okruženja nije dostupna.'
'Shared application secret': 'Zajednička tajna aplikacije'
'A strong web application secret is required before comparison.': 'Jaka tajna web aplikacije potrebna je prije usporedbe.'
'Runtime comparison': 'Usporedba okruženja'
'The configured worker runtime did not confirm a bounded comparison.': 'Konfigurisano radno okruženje radnika nije potvrdilo ograničeno poređenje.'
'The inherited worker secret could not be confirmed against the web secret.': 'Naslijeđenu tajnu radnika nije bilo moguće potvrditi u odnosu na web tajnu.'
'PHP runtime comparison': 'Usporedba PHP okruženja'
'Both runtimes must support PHP 8.4; differing patch versions require review.': 'Oba okruženja moraju podržavati PHP 8.4; različite zakrpe verzija zahtijevaju pregled.'
'Required extension comparison': 'Usporedba potrebnih ekstenzija'
'Required extension availability is checked; differing versions require review.': 'Provjerava se dostupnost potrebnih ekstenzija; različite verzije zahtijevaju pregled.'
'Process identity comparison': 'Usporedba identiteta procesa'
'Effective process identity is unavailable on this platform.': 'Efektivni identitet procesa nije dostupan na ovoj platformi.'
'Effective process identities match.': 'Efektivni identiteti procesa se podudaraju.'
'Effective process identities differ; separate service accounts may be intentional.': 'Efektivni identiteti procesa se razlikuju; zasebni servisni računi mogu biti namjerni.'
'Directory access comparison': 'Usporedba pristupa direktorijima'
'Read-only directory permission observations match.': 'Opažanja dozvola direktorija samo za čitanje se podudaraju.'
'Directory locations or permission observations differ; review the service-account roles.': 'Lokacije direktorija ili opažanja dozvola se razlikuju; pregledajte uloge servisnih računa.'
'Worker directory read and traversal': 'Čitanje i prolaz kroz direktorije radnika'
'Required worker directories must exist and allow reading and traversal. No writes were tested.': 'Potrebni direktoriji radnika moraju postojati i dopuštati čitanje i prolaz. Pisanje nije testirano.'
'The inherited worker secret matches the web secret for this private challenge.': 'Naslijeđena tajna radnika podudara se s web tajnom za ovaj privatni izazov.'
'Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.': 'Pregledajte konfigurisani PHP interpreter, potrebne ekstenzije, naslijeđenu tajnu i dozvole direktorija servisnog naloga. Pisanje i pokretanje instalatera nisu testirani.'
