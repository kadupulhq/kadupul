'Database backup and a tested restoration procedure.': 'Sigurnosna kopija baze podataka i testirani postupak vraćanja.'
'RRD files and the service account permissions needed to restore them.': 'RRD datoteke i dozvole servisnog računa potrebne za njihovo vraćanje.'
'Configuration, keys and plugin data outside the database.': 'Konfiguracija, ključevi i podaci dodataka izvan baze podataka.'
'Post-installation checks': 'Provjere nakon instalacije'
