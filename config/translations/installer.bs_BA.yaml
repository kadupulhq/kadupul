'Worker file: include/vendor/autoload.php': 'Datoteka radnika: include/vendor/autoload.php'
'Import destination: resource/snmp_queries': 'Odredište uvoza: resource/snmp_queries'
'Import destination: resource/script_server': 'Odredište uvoza: resource/script_server'
