"A useful name for this Rule.": "Igama eliluncedo lalo Mgaqo."
"Access denied.": "Ufikelelo lwaliwe."
"Add Tree Rule": "Yongeza uMgaqo woMthi"
"Back to Tree Rules": "Buyela kwiMigaqo yoMthi"
"Check this box to enable this rule.": "Phawula le bhokisi ukuze uvule lo mgaqo."
"Choose a Tree for the new Tree Items.": "Khetha uMthi weZinto ezintsha zoMthi."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Khetha intloko yoMthi okhethiweyo ukuze ungene kuyo, okanye ingcambu yawo. Qiniseka ukuba isekhona xa lo mgaqo uqhutywa."
"Choose a header of the selected Tree.": "Khetha intloko yoMthi okhethiweyo."
"Choose a listed Graph Grouping Style.": "Khetha uHlobo loKwahlula iiGrafu oludwelisiweyo."
"Choose a listed Leaf Item Type.": "Khetha uHlobo lweNto yeGqabi oludwelisiweyo."
"Choose an existing Tree.": "Khetha uMthi okhoyo."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Khetha indlela ezahlulwa ngayo iigrafu xa zizotywa kule host ethile emthini. Isetyenziswa kumagqabi eSixhobo."
"Data Query Index": "I-Index yoMbuzo weDatha"
"Device": "ISixhobo"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Amagqabi eSixhobo awanakusebenzisa imiqathango kwiikholamu zegrafu okanye zesakhelo segrafu. Xa utshintsha uHlobo lweNto yeGqabi libe ngu-Device, phawula le bhokisi ukususa loo miqathango; ayisayi kubuyiselwa."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Amagqabi eSixhobo awanakusebenzisa imiqathango esekelwe kwigrafu. Qinisekisa ukususwa kwemiqathango eyi-%count% ukuze ugcine."
"Edit Tree Rule": "Hlela uMgaqo woMthi"
"Enable Rule": "Vula uMgaqo"
"Enter a name.": "Faka igama."
"Enter at most %count% characters.": "Faka ubuninzi beempawu ezingama-%count%."
"Enter single-line text.": "Faka umbhalo womgca omnye."
"Graph": "Igrafu"
"Graph Grouping Style": "Isimbo sokuHlanganisa iGrafu"
"Graph Template": "Ithempleyithi yeGrafu"
"Leaf Item Type": "Uhlobo lweNto yeGqabi"
"Name": "Igama"
"Object Selection and Tree Creation Criteria": "Imiqathango yoKhetho lweNto kunye neyokuDala uMthi"
"Optional: Sub-Tree Item": "Ukuzikhethela: Into yoMthi oNgezantsi"
"Remove graph-based criteria": "Susa imiqathango esekelwe kwigrafu"
"Save": "Gcina"
"Save outcome is uncertain. Reload before retrying.": "Isiphumo sokugcina asiqinisekwanga. Layisha kwakhona ngaphambi kokuzama kwakhona."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Gcina umgaqo kuqala; ukhetho lwezinto kunye nemiqathango yokudala umthi zongezwa emva koko."
"The Item Type that shall be dynamically added to the tree.": "Uhlobo lwento oluya kongezwa ngokuzenzekelayo emthini."
"The tree rule changed since you opened this form. Reload before saving.": "Umgaqo womthi utshintshile ukusukela oko uvule le fomu. Layisha kwakhona ngaphambi kokugcina."
"Tree": "Umthi"
"Tree Rule Selection [edit: %name%]": "Ukhetho lomgaqo womthi [hlela: %name%]"
"Tree Rules Selection [new]": "Ukhetho lwemigaqo yomthi [entsha]"
"Tree rule not found.": "Umgaqo womthi awufumanekanga."
"Tree rule saved.": "Umgaqo womthi ugciniwe."
"Unable to load the tree rule. Reload before retrying.": "Ayikwazi ukulayisha umgaqo womthi. Layisha kwakhona ngaphambi kokuzama kwakhona."
"Unexpected fields were submitted.": "Kuthunyelwe iindawo ezingalindelekanga."
