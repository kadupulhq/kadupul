"Operation": "العملية"
"Override discovery SNMP settings": "تجاوز إعدادات SNMP الخاصة بالاكتشاف"
"Pass": "ناجح"
"Poller interval in seconds": "الفاصل الزمني للمستطلع بالثواني"
"Preparing CSRF protection": "في طور إعداد حماية CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "يعرض التقدم آخر مرحلة مسجّلة. تحيين هذه الصفحة لا يطلق عامل التنفيذ ولا يعيد محاولته أبداً."
"Recover stopped attempt": "استعادة المحاولة المتوقفة"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "تحتفظ عملية الاستعادة بالاختيارات المحفوظة ولا توقف أي عامل قيد التشغيل. راجع الخطة مجدداً قبل إعادة المحاولة."
"Review": "مراجعة"
"Review installation plan": "مراجعة خطة التثبيت"
"Run": "تشغيل"
"Run reviewed plan": "تشغيل الخطة التي تمت مراجعتها"
"Save and review": "حفظ ومراجعة"
"Scope": "النطاق"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "الحالة غير متوفرة. تم الاحتفاظ بالمعطيات المحفوظة. قم بتحيين الصفحة لإعادة الاتصال؛ لا ترسل طلب تثبيت آخر."
"Synchronizing collectors": "في طور مزامنة المجمّعات"
"Table conversions": "تحويلات الجداول"
"Templates": "القوالب"
"The database version matches this application. Installation does not establish that polling is healthy.": "يتطابق إصدار قاعدة المعطيات مع هذا التطبيق. لا يثبت التثبيت سلامة عملية الاستطلاع."
"The request outcome is unknown. Check execution status before retrying.": "نتيجة الطلب غير معروفة. تحقق من حالة التنفيذ قبل إعادة المحاولة."
"Theme": "المظهر"
"Verify": "التحقق"
"Verify the poller schedule and service account.": "تحقق من جدولة المستطلع وحساب الخدمة."
"Version change": "تغيير الإصدار"
