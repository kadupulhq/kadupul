"Action": "الإجراء"
"Advanced options": "خيارات متقدمة"
"Applying database upgrades": "جارٍ تطبيق ترقيات قاعدة المعطيات"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "قم بنسخ قاعدة المعطيات وملفات RRD والإعدادات والمفاتيح احتياطياً. قد تُثبّت ترقيات قاعدة المعطيات تغييرات لا يمكن للتراجع على مستوى التطبيق إلغاؤها."
"Blocked": "محظور"
"Check": "الفحص"
"Check again": "إعادة التحقق"
