"running": "قيد التشغيل"
"succeeded": "نجح"
"upgrade": "ترقية"
"waiting": "في الانتظار"
"Accept the license before saving the installation plan.": "اقبل الترخيص قبل حفظ خطة التثبيت."
"Invalid installation form.": "استمارة التثبيت غير صالحة."
"Access denied.": "الولوج مرفوض."
"Confirm the recovery warning before retrying.": "أكّد تحذير الاستعادة قبل إعادة المحاولة."
"Review and confirm the current installation plan.": "راجع خطة التثبيت الحالية وأكّدها."
"Confirm the discovery scope before starting.": "أكّد نطاق الاكتشاف قبل البدء."
"Resolve the blocking checks before starting.": "عالج عمليات التحقق المانعة قبل البدء."
"Too many installer options.": "عدد خيارات المثبّت كبير جداً."
"Invalid installer option name.": "اسم خيار المثبّت غير صالح."
"Unknown or malformed installer option.": "خيار مثبّت غير معروف أو بصياغة غير سليمة."
"Installer options must be scalar values.": "يجب أن تكون خيارات المثبّت قيماً سُلمية."
"Installer option is too long or contains a null byte.": "خيار المثبّت طويل جداً أو يحتوي على بايت فارغ."
"Installer IDs and intervals must be whole numbers.": "يجب أن تكون معرّفات المثبّت والفواصل الزمنية أعداداً صحيحة."
"Installer ID or interval is outside its supported range.": "معرّف المثبّت أو الفاصل الزمني خارج النطاق المدعوم."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "تعذّر إكمال التثبيت. أعد تحميل حالته وراجع عمليات التحقق المانعة قبل إعادة المحاولة."
"Confirm that the previous worker has stopped before recovering its plan.": "تأكد من توقف العامل السابق قبل استعادة خطته."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "تم تثبيت قاعدة المعطيات، لكن بعض المجمّعات لا تزال بحاجة إلى المزامنة. أعد محاولة المهام النهائية بعد التحقق من حالتها."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "توقف التثبيت. احتفظ بسجل المثبّت، وصحّح السبب، ثم أكّد إعادة المحاولة صراحةً. قد تكون بعض تغييرات قاعدة المعطيات قد اعتمِدت بالفعل. تحقق من تنظيف الإضافات قبل التصريح بإعادة المحاولة."
"Next action": "الإجراء الموالي"
"Follow the execution status. Do not start another attempt while a worker is active.": "تتبّع حالة التنفيذ. لا تطلق محاولة أخرى بينما يوجد عامل نشط."
"Complete the recovery checklist before retrying.": "أكمل قائمة التحقق من الاستعادة قبل إعادة المحاولة."
"Verify collection and graph operation before enabling discovery.": "تحقق من اشتغال الجمع والرسوم البيانية قبل تفعيل الاكتشاف."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "عالج المتطلبات المحظورة، ثم أعد التحقق. يتم الاحتفاظ بالاختيارات المحفوظة."
"Review the planned changes and backup checklist before authorizing execution.": "راجع التغييرات المبرمجة وقائمة التحقق من النسخ الاحتياطي قبل التصريح بالتنفيذ."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "اختر ملف تعريف للجمع واقبل الترخيص. يمكن فتح الإعدادات الاختيارية عند الحاجة."
"Download installation diagnostics": "تحميل تشخيصات التثبيت"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "افتح رسماً بيانياً وتأكد من تحيين معطيات RRD الخاصة به بعد دورة المستطلع."
"Requirement details": "تفاصيل المتطلبات"
"Recover": "استعادة"
"Recovery checklist": "قائمة التحقق من الاستعادة"
"Preserve log/cacti.log and record the failed attempt.": "احتفظ بالملف log/cacti.log وسجّل المحاولة الفاشلة."
"Confirm that the previous worker and its child processes have stopped.": "تأكد من توقف عامل المعالجة السابق وسيروراته الفرعية."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "افحص التغييرات المعتمدة ومزامنة المُجمّع وتنظيف الملحقات. صحح السبب قبل إعادة المحاولة."
"Review the saved plan again, then explicitly authorize a retry.": "راجع المخطط المحفوظ مجدداً، ثم رخّص صراحةً بإعادة المحاولة."
"Recover a stopped worker": "استرجاع عامل معالجة متوقف"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "لا تستعمل الاسترجاع إلا بعد التحقق من أن هذه المحاولة لم تعد قيد التشغيل. الاسترجاع لا يوقف أي سيرورة."
"Collector and installation mode": "المُجمّع ونمط التثبيت"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "تحدد تهيئة النشر دور المُجمّع واتصالات قاعدة المعطيات. تحقق من تهيئة المخدم الرئيسي قبل تشغيل أي مُجمّع."
"Discovery and SNMP settings": "إعدادات الاستكشاف وSNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "أبقِ الاستكشاف معطّلاً إلى حين التحقق من عملية الجمع واتصال المُجمّع."
"Template selection": "اختيار القالب"
"Templates selected for import": "القوالب المختارة للاستيراد"
"No templates selected.": "لم يتم اختيار أي قالب."
"Backup checklist": "قائمة مراجعة النسخ الاحتياطي"
"Database backup and a tested restoration procedure.": "نسخة احتياطية لقاعدة المعطيات وإجراء استرجاع مجرَّب."
"RRD files and the service account permissions needed to restore them.": "ملفات RRD وصلاحيات حساب الخدمة اللازمة لاسترجاعها."
"Configuration, keys and plugin data outside the database.": "التهيئة والمفاتيح ومعطيات الملحقات الموجودة خارج قاعدة المعطيات."
"Post-installation checks": "عمليات التحقق بعد التثبيت"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "تشمل عمليات التحقق المؤكدة الأدلة المعروضة فقط. لا تزال الفحوصات غير المقيّمة تتطلب تحقق المشغّل."
"Operational checks still require operator verification.": "لا تزال الفحوصات التشغيلية تتطلب تحقق المشغّل."
"Status": "الحالة"
"verified": "تم التحقق منه"
"action_required": "يتطلب إجراءً"
"not_assessed": "لم يُقيَّم"
"Database schema": "مخطط قاعدة المعطيات"
"Stored schema matches the application target.": "يطابق المخطط المخزّن الهدف المحدد للتطبيق."
"Target schema completion has not been confirmed.": "لم يُؤكَّد بعد اكتمال المخطط المستهدف."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "راجع حصيلة التثبيت وعالج الأعطال قبل اعتبار ترقية المخطط مكتملة."
"Installation outcome": "حصيلة التثبيت"
"A successful receipt matches the current target schema.": "يطابق وصل الإثبات الناجح المخطط المستهدف الحالي."
"A complete successful installation outcome has not been confirmed.": "لم يتم تأكيد إتمام التثبيت بنجاح بشكل كامل."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "احتفظ بسجل المثبّت واستعمل إجراء الاسترجاع أو إعادة المحاولة الصريح عند الحاجة."
"Collector synchronization": "مزامنة المُجمّع"
"The completed installer reports pending collector synchronization.": "يفيد المثبّت المكتمل بوجود مزامنة معلّقة للمُجمّعات."
"The completed installer reports no pending collectors.": "يفيد المثبّت المكتمل بعدم وجود أي مُجمّعات معلّقة."
"Collector completion remains unconfirmed by this partial receipt.": "يبقى اكتمال عمل المُجمّع غير مؤكد بناءً على هذا الوصل الجزئي."
"Collector completion is not established by this installation outcome.": "لا تثبت حصيلة التثبيت هذه اكتمال عمل المُجمّع."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "راجع وضعية المُجمّع وأعد تنفيذ المهام الختامية للحصائل الجزئية. لا يثبت هذا حداثة عمليات الجمع اللاحقة."
"Scheduled collection": "الجمع المبرمج"
"No poller or device was contacted by this assessment.": "لم يتم الاتصال بأي مستطلع أو جهاز خلال هذا التقييم."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "تحقق من أن المجدول المهيّأ يشغّل المستطلع عبر حساب الخدمة المقصود، وراجع دورته العادية الموالية."
"Graph data": "معطيات المبيان"
"Live samples and RRD updates were not exercised.": "لم يتم اختبار العينات الفورية وتحيينات RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "بعد دورة جمع عادية، تأكد من توصل المبيانات المرتقبة بعينات جديدة وراجع أخطاء المستطلع."
"Recovery readiness": "الجاهزية للاسترجاع"
"Backup restoration was not exercised.": "لم يتم اختبار استرجاع النسخة الاحتياطية."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "تحقق من إجراء استرجاع معزول لقاعدة المعطيات وملفات RRD والتهيئة ومواد المفاتيح قبل الاعتماد على الاسترداد."
"No persisted local poller start has been recorded.": "لم يُسجَّل أي تشغيل مستدام للمستطلع المحلي."
"Persisted poller timing is invalid and cannot establish scheduler health.": "التوقيت المحفوظ للمستطلع غير سليم ولا يثبت سلامة اشتغال المجدول."
"The recorded poller start is in the future. Check clock synchronization.": "وقت انطلاق المستطلع المسجّل يقع في المستقبل. تحقق من مزامنة الساعة."
"The recorded poller start is older than the native scheduling tolerance.": "وقت انطلاق المستطلع المسجّل أقدم من هامش التسامح الزمني الأصلي للجدولة."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "تم تسجيل انطلاق المستطلع المحلي ضمن هامش التسامح الأصلي للجدولة. لم يتم التحقق من الاكتمال ومن سلامة الأجهزة."
"readable": "متاح للقراءة"
"missing or unreadable": "مفقود أو متعذّر القراءة"
"Restore the complete release and its locked dependencies; grant the service account read access.": "استرجع الإصدار الكامل وتبعياته المثبّتة؛ وامنح حساب الخدمة صلاحية الولوج للقراءة."
"PHP temporary directory": "المجلد المؤقت لـ PHP"
"directory writable by this process": "مجلد قابل للكتابة من طرف هذه السيرورة"
"missing or not writable": "مفقود أو غير متاح للكتابة"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "هيّئ sys_temp_dir كمجلد موجود وقابل للكتابة من طرف حساب التثبيت. تعتمد عمليات الاستيراد الأصلية على ملفات مؤقتة."
"Background worker launch": "إطلاق عامل الخلفية"
"required PHP functions available; launch not exercised": "دوال PHP اللازمة متوفرة؛ لم يتم اختبار الإطلاق"
"required PHP launch function disabled": "دالة الإطلاق المطلوبة في PHP معطّلة"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "فعّل exec لبيئة تشغيل PHP للويب، أو استعمل مثبّت CLI المرخّص له."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "فعّل popen وpclose لبيئة تشغيل PHP للويب، أو استعمل مثبّت CLI المرخّص له."
"Database transaction ownership": "ملكية معاملات قاعدة المعطيات"
"autocommit enabled; no caller-owned transaction": "الاعتماد التلقائي (autocommit) مفعّل؛ لا توجد معاملة تابعة للمُستدعي"
"autocommit disabled or caller transaction active": "الاعتماد التلقائي (autocommit) معطّل أو معاملة المُستدعي قيد النشاط"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "شغّل التثبيت خارج أي معاملة تابعة للمُستدعي وفعّل الاعتماد التلقائي (autocommit) على اتصال التعديل الخاص به."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "استرجع مجلد الإصدار وامنح حساب التثبيت صلاحية الكتابة لاستيراد موارد القوالب. لا تجعله متاحاً للكتابة للعموم."
"Worker file: install/background.php": "ملف عامل المعالجة: install/background.php"
"Worker file: bin/legacy-installer.php": "ملف عامل المعالجة: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "ملف عامل المعالجة: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "وجهة الاستيراد: resource/snmp_queries"
"Import destination: resource/script_server": "وجهة الاستيراد: resource/script_server"
"Import destination: resource/script_queries": "وجهة الاستيراد: resource/script_queries"
"Import destination: scripts": "وجهة الاستيراد: scripts"
"Database privileges": "صلاحيات قاعدة المعطيات"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "لم يتم التحقق من صلاحيات الترحيل الفعلية، بما في ذلك الأدوار النشطة والمنح الخاصة بكل عنصر."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "اطلب من مدير قاعدة المعطيات التحقق من عمليات الكتابة اللازمة في الجداول وتعديلات المخطط والمحفّزات والإجراءات المخزّنة لحساب التثبيت والمخطط. لا تمنح صلاحيات المدير العام."
"Compare web and worker runtimes": "مقارنة بيئتَي تشغيل الويب وعامل المعالجة"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "يُطلق هذا الإجراء صراحةً فحص PHP قصيراً للقراءة فقط. لا يحجز هذا الفحص أي مثبّت ولا يكتب ملفات ولا يتصل بالأجهزة."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "يرث هذا الفحص سيرورة الويب الحالية ويستعمل مفسّر PHP المهيّأ للمثبّت. لا يفحص أي مجدول أو خدمة منفصلة."
"I authorize the read-only worker runtime comparison.": "أرخّص بمقارنة بيئة تشغيل عامل المعالجة للقراءة فقط."
"Compare runtimes": "قارن بيئات التشغيل"
"Runtime comparison results": "حصيلة مقارنة بيئات التشغيل"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "قد تكون الفوارق في الصلاحيات والهوية مقصودة. المعاينات للقراءة فقط لا تثبت نجاح عمليات الكتابة أو التثبيت."
"Confirm the read-only worker runtime comparison.": "أكّد مقارنة بيئة تشغيل عامل المعالجة للقراءة فقط."
"The runtime comparison is unavailable.": "مقارنة بيئات التشغيل غير متوفرة."
"Shared application secret": "السرّ المشترك للتطبيق"
"A strong web application secret is required before comparison.": "يلزم توفر سرّ قوي لتطبيق الويب قبل إجراء المقارنة."
"Runtime comparison": "مقارنة بيئات التشغيل"
"The configured worker runtime did not confirm a bounded comparison.": "لم تؤكد بيئة تشغيل عامل المعالجة المهيّأة إجراء مقارنة محدودة النطاق."
"The inherited worker secret could not be confirmed against the web secret.": "تعذّر التحقق من تطابق السرّ الموروث للعامل مع سرّ الويب."
"PHP runtime comparison": "مقارنة بيئة تنفيذ PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "يجب أن تدعم كلتا بيئتي التنفيذ إصدار PHP 8.4؛ كما تستوجب اختلافات إصدارات التصحيح المراجعة."
"Required extension comparison": "مقارنة الامتدادات المطلوبة"
"Required extension availability is checked; differing versions require review.": "يتم التحقق من توفر الامتدادات المطلوبة؛ وتستوجب اختلافات الإصدارات المراجعة."
"Process identity comparison": "مقارنة هوية عملية التشغيل"
"Effective process identity is unavailable on this platform.": "هوية العملية الفعلية غير متوفرة على هذه المنصة."
"Effective process identities match.": "هويات العمليات الفعلية متطابقة."
"Effective process identities differ; separate service accounts may be intentional.": "تختلف هويات العمليات الفعلية؛ وقد يكون فصل حسابات الخدمة مقصوداً."
"Directory access comparison": "مقارنة صلاحيات الولوج إلى المجلد"
"Read-only directory permission observations match.": "تتطابق معاينات صلاحيات المجلد المخصصة للقراءة فقط."
"Directory locations or permission observations differ; review the service-account roles.": "تختلف مسارات المجلدات أو معاينات الصلاحيات؛ يُرجى مراجعة أدوار حساب الخدمة."
"Worker directory read and traversal": "قراءة مجلد العامل والتنقل داخله"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "يجب أن تكون مجلدات العامل المطلوبة موجودة وتتيح القراءة والتنقل داخلها. لم يتم اختبار أي عمليات كتابة."
"The inherited worker secret matches the web secret for this private challenge.": "يتطابق السرّ الموروث للعامل مع سرّ الويب الخاص بهذا التحدّي."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "يُرجى مراجعة مفسّر PHP المُعدّ والامتدادات المطلوبة والسرّ الموروث وصلاحيات مجلدات حساب الخدمة. لم يتم تنفيذ أي عمليات كتابة أو تشغيل المثبّت."
"advisory": "إرشادي"
