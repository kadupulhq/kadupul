"Check requirements": "التحقق من المتطلبات"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "تفحص عمليات التحقق هذه العملية وصلاحيات نظام الملفات، ولا تكتب ملفات اختبار ولا تتصل بالأجهزة."
