"Installation and upgrade": "التثبيت والترقية"
"Installation request was rejected.": "تم رفض طلب التثبيت."
"Installation steps": "مراحل التثبيت"
"Installed": "مثبّت"
"Keep a backup of the database, RRD files, configuration and secret material.": "احتفظ بنسخة احتياطية من قاعدة المعطيات وملفات RRD والإعدادات والمعطيات السرية."
"Language": "اللغة"
"Large tables may require the dedicated CLI conversion tool before installation.": "قد تستلزم الجداول الكبيرة استخدام أداة التحويل المخصصة عبر CLI قبل التثبيت."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "اترك الحقول السرية فارغة للاحتفاظ بمعطيات الاعتماد المخزنة. لا يتم عرض الأسرار مجدداً أبداً."
"License": "الترخيص"
"No action needed": "لا يلزم أي إجراء"
"Observed": "مُلاحظ"
