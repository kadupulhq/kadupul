"Installer options must be scalar values.": "ინსტალერის პარამეტრები უნდა იყოს სკალარული მნიშვნელობები."
"Installer option is too long or contains a null byte.": "ინსტალერის პარამეტრი ზედმეტად გრძელია ან შეიცავს null ბაიტს."
"Installer IDs and intervals must be whole numbers.": "ინსტალერის ID-ები და ინტერვალები უნდა იყოს მთელი რიცხვები."
"Installer ID or interval is outside its supported range.": "ინსტალერის ID ან ინტერვალი მხარდაჭერილი დიაპაზონის გარეშეა."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ინსტალაცია ვერ გაგრძელდა. ხელახლა ცდამდე თავიდან ჩატვირთეთ მისი სტატუსი და გადახედეთ დამბლოკავ შემოწმებებს."
"Confirm that the previous worker has stopped before recovering its plan.": "წინა შემსრულებლის გეგმის აღდგენამდე დაადასტურეთ, რომ ის შეჩერდა."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "მონაცემთა ბაზა დაინსტალირებულია, მაგრამ ზოგ შემგროვებელს ჯერ კიდევ სჭირდება სინქრონიზაცია. მათი სტატუსის შემოწმების შემდეგ გაიმეორეთ დასრულების ამოცანები."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ინსტალაცია შეჩერდა. შეინახეთ ინსტალერის ჟურნალი, აღმოფხვრეთ მიზეზი და ცალსახად დაადასტურეთ ხელახალი ცდა. ზოგი ცვლილება მონაცემთა ბაზაში შესაძლოა უკვე დაფიქსირებულია. ხელახალი ცდის ნებართვამდე შეამოწმეთ პლაგინების გასუფთავება."
"Next action": "შემდეგი მოქმედება"
"Follow the execution status. Do not start another attempt while a worker is active.": "მიჰყევით შესრულების სტატუსს. სანამ შემსრულებელი აქტიურია, სხვა მცდელობას ნუ დაიწყებთ."
"Complete the recovery checklist before retrying.": "ხელახლა ცდამდე შეასრულეთ აღდგენის ჩამონათვალი."
"Verify collection and graph operation before enabling discovery.": "აღმოჩენის ჩართვამდე გადაამოწმეთ შეგროვება და გრაფიკების მუშაობა."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "გადაწყვიტეთ დაბლოკილი მოთხოვნები, შემდეგ კვლავ შეამოწმეთ. შენახული არჩევანი შენარჩუნებულია."
"Review the planned changes and backup checklist before authorizing execution.": "შესრულების ნებართვამდე გადახედეთ დაგეგმილ ცვლილებებსა და სარეზერვო ასლების ჩამონათვალს."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "აირჩიეთ შეგროვების პროფილი და დაეთანხმეთ ლიცენზიას. არასავალდებულო პარამეტრები საჭიროების შემთხვევაში შეგიძლიათ გახსნათ."
"Download installation diagnostics": "ინსტალაციის დიაგნოსტიკის ჩამოტვირთვა"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "გახსენით გრაფიკი და დარწმუნდით, რომ მისი RRD მონაცემები პოლერის ციკლის შემდეგ განახლდება."
"Requirement details": "მოთხოვნის დეტალები"
"Recover": "აღდგენა"
"Recovery checklist": "აღდგენის ჩამონათვალი"
"Preserve log/cacti.log and record the failed attempt.": "შეინახეთ log/cacti.log და ჩაიწერეთ წარუმატებელი მცდელობა."
"Confirm that the previous worker and its child processes have stopped.": "დარწმუნდით, რომ წინა შემსრულებელი და მისი შვილობილი პროცესები შეჩერდა."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "შეამოწმეთ დაფიქსირებული ცვლილებები, შემგროვებლების სინქრონიზაცია და პლაგინების გასუფთავება. ხელახლა ცდამდე აღმოფხვრეთ მიზეზი."
"Review the saved plan again, then explicitly authorize a retry.": "კვლავ გადახედეთ შენახულ გეგმას, შემდეგ ცალსახად დაუშვით ხელახალი ცდა."
