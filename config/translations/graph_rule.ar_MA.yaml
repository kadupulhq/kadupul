"A useful name for this Rule.": "اسم مفيد لهذه القاعدة."
"Access denied.": "الولوج مرفوض."
"Add Graph Rule": "إضافة قاعدة رسم بياني"
"Back to Graph Rules": "الرجوع إلى قواعد الرسوم البيانية"
"Cancel": "إلغاء"
"Check this box to enable this rule.": "حدد هذه الخانة لتفعيل هذه القاعدة."
"Choose a Data Query to apply to this rule.": "اختر استعلام معطيات لتطبيقه على هذه القاعدة."
"Choose a Graph Type": "اختر نوع الرسم البياني"
"Choose a Graph Type of the selected Data Query.": "اختر نوع رسم بياني من استعلام المعطيات المحدد."
"Choose an existing Data Query.": "اختر استعلام معطيات موجوداً."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "اختر أياً من أنواع الرسوم البيانية المتوفرة لاستعلام المعطيات المحدد لتطبيقها على هذه القاعدة."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "انقر على متابعة لحذف قواعد الرسوم البيانية التالية مع معايير اختيار الأجهزة وإنشاء الرسوم البيانية الخاصة بها."
"Click Continue to disable the following Graph Rules.": "انقر على متابعة لتعطيل قواعد الرسوم البيانية التالية."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "انقر على متابعة لتكرار قواعد الرسوم البيانية التالية. يمكنك اختيارياً تغيير تنسيق العنوان لقواعد الرسوم البيانية الجديدة، التي تبدأ معطّلة."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "انقر على متابعة لتفعيل قواعد الرسوم البيانية التالية. تأكد من اختبارها بنجاح."
"Continue": "متابعة"
"Data Query": "استعلام المعطيات"
"Delete Graph Rules": "حذف قواعد الرسوم البيانية"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة الحذف غير مؤكدة. تحقق من قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Delete selected": "حذف المحدد"
"Device Selection and Graph Creation Criteria": "معايير اختيار الأجهزة وإنشاء الرسوم البيانية"
"Disable Graph Rules": "تعطيل قواعد الرسوم البيانية"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة التعطيل غير مؤكدة. تحقق من قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Disable selected": "تعطيل المحدد"
"Duplicate Graph Rules": "تكرار قواعد الرسوم البيانية"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة التكرار غير مؤكدة. تحقق من قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Duplicate selected": "تكرار المحدد"
"Edit Graph Rule": "تعديل قاعدة الرسم البياني"
"Enable Graph Rules": "تفعيل قواعد الرسوم البيانية"
"Enable Rule": "تفعيل القاعدة"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "نتيجة التفعيل غير مؤكدة. تحقق من قائمة قواعد الرسوم البيانية قبل إعادة المحاولة."
"Enable selected": "تفعيل المحدد"
"Enter a name.": "أدخل اسماً."
"Enter a valid name format.": "أدخل صيغة اسم صالحة."
"Enter at most %count% characters.": "أدخل %count% حرفاً على الأكثر."
"Enter single-line text.": "أدخل نصاً من سطر واحد."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "يتم تعويض كل <rule_name> باسم قاعدة الرسم البياني الجاري نسخها."
"Graph Type": "نوع المبيان"
"Graph rule not found.": "لم يتم العثور على قاعدة الرسم البياني."
"Graph rule saved.": "تم حفظ قاعدة الرسم البياني."
"Invalid Graph Rule selection.": "تحديد قاعدة الرسم البياني غير صالح."
"Name": "الاسم"
"One or more selected Graph Rules no longer exist.": "لم تعد قاعدة رسم بياني واحدة أو أكثر من القواعد المحددة موجودة."
"Rule Selection [edit: %name%]": "تحديد القاعدة [تعديل: %name%]"
"Rule Selection [new]": "تحديد القواعد [جديد]"
"Save": "حفظ"
"Save outcome is uncertain. Reload before retrying.": "نتيجة الحفظ غير مؤكدة. أعد التحميل قبل إعادة المحاولة."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "احفظ القاعدة أولاً؛ وتُضاف معايير اختيار الأجهزة وإنشاء الرسوم البيانية الخاصة بها لاحقاً."
"Select": "تحديد"
"Select %name%": "تحديد %name%"
"Select at least one Graph Rule.": "حدد قاعدة رسم بياني واحدة على الأقل."
"Select at most 100 Graph Rules at a time.": "حدد 100 قاعدة رسم بياني على الأكثر في كل مرة."
"Select up to %count% rows at a time.": "حدّد ما يصل إلى %count% صفوف في المرة الواحدة."
"The graph rule changed since you opened this form. Reload before saving.": "تغيّرت قاعدة الرسم البياني منذ فتح هذه الاستمارة. أعد التحميل قبل الحفظ."
"The name format must give every copy a name of 1 to 255 characters.": "يجب أن يمنح تنسيق الاسم لكل نسخة اسماً يتراوح طوله بين 1 و255 حرفاً."
"Title Format": "تنسيق العنوان"
"Unable to load Graph Rules. Reload before retrying.": "تعذّر تحميل قواعد الرسوم البيانية. أعد التحميل قبل إعادة المحاولة."
"Unable to load the graph rule. Reload before retrying.": "تعذّر تحميل قاعدة الرسم البياني. أعد التحميل قبل إعادة المحاولة."
"Unexpected fields were submitted.": "تم إرسال حقول غير متوقعة."
