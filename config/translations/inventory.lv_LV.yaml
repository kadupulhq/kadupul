"Selected device assignments updated.": "Atlasīto ierīču piešķīrumi atjaunināti."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Atlasītais piešķīrums tiek piemērots katrai sarakstā norādītajai ierīcei. Veidņu izmaiņas saglabā esošos grafikus; automatizācija var izveidot jaunus grafikus. Savācēju izmaiņas nodod aptaujas īpašumtiesības."
