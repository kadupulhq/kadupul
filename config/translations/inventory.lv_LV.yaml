"Selected device SNMP settings updated.": "Atlasīto ierīču SNMP iestatījumi atjaunināti."
"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "Lietot šos SNMP iestatījumus katrai atlasītajai ierīcei. Saglabājiet katras ierīces saglabātos akreditācijas datus vai skaidri aizstājiet tos. Saglabātie noslēpumi nekad netiek rādīti."
"Device graph-template associations": "Ierīces grafiku veidņu saistības"
"Device associations updated.": "Ierīces saistības atjauninātas."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Saistības noņemšana saglabā esošos grafikus un vēsturiskos datus. Saistības pievienošana var izveidot grafikus, izmantojot automatizāciju. Skartajiem savācējiem jābūt tiešsaistē."
