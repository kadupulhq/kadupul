"Stored credentials are never displayed. Replacing them sets all four fields below; leaving SNMP version 3 clears its username and passphrases.": "સંગ્રહિત ક્રેડેન્શિયલ્સ ક્યારેય દર્શાવાતા નથી. તેમને બદલવાથી નીચેના ચારેય ફીલ્ડ્સ સેટ થાય છે; SNMP સંસ્કરણ 3 છોડવાથી તેનું વપરાશકર્તાનામ અને પાસફ્રેઝ સાફ થાય છે."
