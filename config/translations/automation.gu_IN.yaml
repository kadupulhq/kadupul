"The SNMP Option Set changed since you opened this form. Reload before saving.": "તમે આ ફોર્મ ખોલ્યું ત્યારથી SNMP વિકલ્પ સેટ બદલાયો છે. સાચવતા પહેલાં ફરીથી લોડ કરો."
"The SNMP entry changed since you opened this form. Reload before saving.": "તમે આ ફોર્મ ખોલ્યું ત્યારથી SNMP એન્ટ્રી બદલાઈ છે. સાચવતા પહેલાં ફરીથી લોડ કરો."
"The SNMP entry order changed since you opened this page. Reload before moving.": "તમે આ પૃષ્ઠ ખોલ્યું ત્યારથી SNMP એન્ટ્રી ક્રમ બદલાયો છે. ખસેડતા પહેલાં ફરીથી લોડ કરો."
"The automation template changed since you opened this form. Reload before saving.": "તમે આ ફોર્મ ખોલ્યું ત્યારથી ઑટોમેશન ટેમ્પ્લેટ બદલાયું છે. સાચવતા પહેલાં ફરીથી લોડ કરો."
"The automation template order changed since you opened this page. Reload before moving.": "તમે આ પૃષ્ઠ ખોલ્યું ત્યારથી ઑટોમેશન ટેમ્પ્લેટ ક્રમ બદલાયો છે. ખસેડતા પહેલાં ફરીથી લોડ કરો."
"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "SNMP રીડસ્ટ્રિંગ દ્વારા ઉપકરણ સુધી પહોંચવાના પ્રયાસો છોડી દેતા પહેલાંની મહત્તમ સંખ્યા."
"The maximum number of milliseconds Kadupul will wait for an SNMP response (does not work with php-snmp support).": "SNMP પ્રતિસાદ માટે Kadupul મહત્તમ કેટલા મિલિસેકન્ડ રાહ જોશે (php-snmp સપોર્ટ સાથે કામ કરતું નથી)."
"The name can be at most 100 characters.": "નામ વધુમાં વધુ 100 અક્ષરોનું હોઈ શકે."
"The name format must give every copy a name of 1 to 100 characters.": "નામ ફોર્મેટે દરેક નકલને 1 થી 100 અક્ષરોનું નામ આપવું જોઈએ."
"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "આ SNMP વિકલ્પ સેટ ફોર્મની મુદત પૂરી થઈ છે. SNMP વિકલ્પ સેટ ફરી ખોલો અને તેનું વર્તમાન ફોર્મ વાપરો."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "આ એક અનન્ય સ્ટ્રિંગ છે જે આ ઑટોમેશન ટેમ્પ્લેટ સાથે જોડવા માટે ઉપકરણની sysDescr સ્ટ્રિંગ સાથે મેળવવામાં આવશે.  કોઈપણ SQL Where એક્સપ્રેશન ઉપરાંત કોઈપણ Perl રેગ્યુલર એક્સપ્રેશનનો ઉપયોગ કરી શકાય છે."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "આ એક અનન્ય સ્ટ્રિંગ છે જે આ ઑટોમેશન ટેમ્પ્લેટ સાથે જોડવા માટે ઉપકરણની sysName સ્ટ્રિંગ સાથે મેળવવામાં આવશે.  કોઈપણ SQL Where એક્સપ્રેશન ઉપરાંત કોઈપણ Perl રેગ્યુલર એક્સપ્રેશનનો ઉપયોગ કરી શકાય છે."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "આ એક અનન્ય સ્ટ્રિંગ છે જે આ ઑટોમેશન ટેમ્પ્લેટ સાથે જોડવા માટે ઉપકરણની sysOid સ્ટ્રિંગ સાથે મેળવવામાં આવશે.  કોઈપણ SQL Where એક્સપ્રેશન ઉપરાંત કોઈપણ Perl રેગ્યુલર એક્સપ્રેશનનો ઉપયોગ કરી શકાય છે."
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "આ જૂના ઑટોમેશન ટેમ્પ્લેટ ફોર્મની મુદત પૂરી થઈ છે. ઉપકરણ નિયમો ખોલો અને નવું ફોર્મ સબમિટ કરો."
