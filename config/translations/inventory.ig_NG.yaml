"Confirm synchronization": "Kwado nmekọrịta"
"Selected device templates synchronized.": "Emekọrịtala atụmatụ ngwaọrụ ahọpụtara."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Tinye tẹmpletị e kenyere ugbu a na ngwaọrụ ndị a. A na-agbakwunye njikọ eserese na ajụjụ data na-efu, ma enwere ike iwepụ njikọ tẹmpletị eserese a na-ejighị eme ihe. A na-awụpụ ngwaọrụ na-enweghị tẹmpletị. A na-edobe eserese dị ugbu a na data akụkọ ihe mere eme; nhazi akpaaka nwere ike imepụta eserese ọhụrụ."
"Change device options": "Gbanwee nhọrọ ngwaọrụ"
"Confirm option changes": "Kwado mgbanwe nhọrọ"
"Selected device options updated.": "Emelitela nhọrọ ngwaọrụ ahọpụtara."
"Device options": "Nhọrọ ngwaọrụ"
"Select at least one supported device option.": "Họrọ opekata mpe otu nhọrọ ngwaọrụ a na-akwado."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Naanị nhọrọ enyochara ka a na-agbanwe. Nhọrọ enyochaghị na-ejigide uru ha ugbu a. Ịhọrọ ebe efu na-ekpochapụ ya."
"Update %option%": "Melite %option%"
"Assignment target": "Ebumnuche okenye"
"Select an assignment target": "Họrọ ebe e kenyere ọrụ"
"Select a valid assignment target.": "Họrọ ebe e kenyere ọrụ ziri ezi."
"Invalid assignment kind.": "Ụdị ọrụ adịghị mma."
"Assign device sites": "Kenye saịtị ngwaọrụ"
"Assign device templates": "Kenye tẹmpletị ngwaọrụ"
"Assign device collectors": "Kenye ngwa nchịkọta ngwaọrụ"
"Confirm assignments": "Kwado okenye"
"Selected device assignments updated.": "Emelitela ọrụ e kenyere ngwaọrụ ahọpụtara."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "A na-etinye ọrụ e kenyere ahọpụtara na ngwaọrụ ọ bụla edepụtara. Mgbanwe atụmatụ na-echekwa eserese dị adị; akpaaka nwere ike imepụta eserese ọhụrụ. Mgbanwe onye nchịkọta na-ebufe ikike polling."
"Change device SNMP settings": "Gbanwee ntọala SNMP ngwaọrụ"
"Confirm SNMP changes": "Kwado mgbanwe SNMP"
"Selected device SNMP settings updated.": "Emelitela ntọala SNMP nke ngwaọrụ ahọpụtara."
"Device graph-template associations": "Njikọ tẹmpletị eserese ngwaọrụ"
"Device associations updated.": "Emelitela njikọ ngwaọrụ."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Iwepụ njikọ na-ejigide eserese dị adị na data akụkọ ihe mere eme. Itinye njikọ nwere ike ịmepụta eserese site na automation. Ndị nchịkọta emetụtara ga-adịrịrị n'ịntanetị."
