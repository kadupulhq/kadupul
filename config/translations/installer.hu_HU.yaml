"Table conversions": "Táblakonverziók"
"Templates": "Sablonok"
"The database version matches this application. Installation does not establish that polling is healthy.": "Az adatbázis verziója megegyezik az alkalmazáséval. A telepítés nem igazolja, hogy a lekérdezés egészséges."
"The request outcome is unknown. Check execution status before retrying.": "A kérés eredménye ismeretlen. Újrapróbálkozás előtt ellenőrizze a végrehajtási állapotot."
