"Preparing CSRF protection": "A CSRF-védelem előkészítése"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Az előrehaladás az utolsó rögzített fázist mutatja. Az oldal frissítése soha nem indít el és nem próbál újra munkafolyamatot."
"Recover stopped attempt": "Leállt kísérlet helyreállítása"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "A helyreállítás megtartja a mentett kijelöléseket, és soha nem szakít meg futó munkafolyamatot. Újrapróbálás előtt nézze át újra a tervet."
