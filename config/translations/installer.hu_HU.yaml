"Accept the license before saving the installation plan.": "A telepítési terv mentése előtt fogadja el a licencet."
"Invalid installation form.": "Érvénytelen telepítési űrlap."
"Access denied.": "A hozzáférés megtagadva."
"Confirm the recovery warning before retrying.": "Újrapróbálás előtt erősítse meg a helyreállítási figyelmeztetést."
"Review and confirm the current installation plan.": "Tekintse át és erősítse meg az aktuális telepítési tervet."
"Confirm the discovery scope before starting.": "Indítás előtt erősítse meg a felderítés hatókörét."
"Resolve the blocking checks before starting.": "Indítás előtt hárítsa el a blokkoló ellenőrzéseket."
"Too many installer options.": "Túl sok telepítői beállítás."
"Invalid installer option name.": "Érvénytelen telepítői beállításnév."
"Unknown or malformed installer option.": "Ismeretlen vagy hibás telepítői beállítás."
"Installer options must be scalar values.": "A telepítői beállításoknak skaláris értékeknek kell lenniük."
"Installer option is too long or contains a null byte.": "A telepítői beállítás túl hosszú, vagy null bájtot tartalmaz."
"Installer IDs and intervals must be whole numbers.": "A telepítői azonosítóknak és időközöknek egész számnak kell lenniük."
"Installer ID or interval is outside its supported range.": "A telepítői azonosító vagy időköz kívül esik a támogatott tartományon."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "A telepítés nem folytatható. Újrapróbálkozás előtt töltse újra az állapotot, és tekintse át a blokkoló ellenőrzéseket."
"Confirm that the previous worker has stopped before recovering its plan.": "A terv helyreállítása előtt erősítse meg, hogy az előző munkafolyamat leállt."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Az adatbázis telepítve van, de egyes adatgyűjtőket még szinkronizálni kell. Az állapotuk ellenőrzése után próbálja újra a befejező feladatokat."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "A telepítés leállt. Őrizze meg a telepítési naplót, hárítsa el az okot, és explicit módon erősítse meg az újrapróbálást. Egyes adatbázis-módosítások már véglegesítve lehetnek. Az újrapróbálás engedélyezése előtt ellenőrizze a bővítmények takarítását."
"Next action": "Következő művelet"
"Follow the execution status. Do not start another attempt while a worker is active.": "Kövesse a végrehajtási állapotot. Ne indítson újabb kísérletet, amíg egy munkafolyamat aktív."
"Complete the recovery checklist before retrying.": "Újrapróbálás előtt fejezze be a helyreállítási ellenőrzőlistát."
"Verify collection and graph operation before enabling discovery.": "A felderítés engedélyezése előtt ellenőrizze az adatgyűjtést és a grafikonműködést."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Hárítsa el a blokkolt követelményeket, majd ellenőrizzen újra. A mentett kijelölések megmaradnak."
"Review the planned changes and backup checklist before authorizing execution.": "A végrehajtás engedélyezése előtt tekintse át a tervezett módosításokat és a biztonsági mentési ellenőrzőlistát."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Válasszon gyűjtési profilt, és fogadja el a licencet. A nem kötelező beállítások szükség esetén megnyithatók."
"Download installation diagnostics": "Telepítési diagnosztika letöltése"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Nyisson meg egy grafikont, és ellenőrizze, hogy az RRD-adatai egy lekérdezési ciklus után frissülnek."
"Requirement details": "A követelmény részletei"
"Recover": "Helyreállítás"
"Recovery checklist": "Helyreállítási ellenőrzőlista"
"Preserve log/cacti.log and record the failed attempt.": "Őrizze meg a log/cacti.log fájlt, és jegyezze fel a sikertelen kísérletet."
"Confirm that the previous worker and its child processes have stopped.": "Győződjön meg róla, hogy az előző munkafolyamat és gyermekfolyamatai leálltak."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Vizsgálja meg a véglegesített módosításokat, az adatgyűjtők szinkronizálását és a bővítmények takarítását. Újrapróbálás előtt hárítsa el az okot."
"Review the saved plan again, then explicitly authorize a retry.": "Tekintse át újra a mentett tervet, majd explicit módon engedélyezze az újrapróbálást."
"Recover a stopped worker": "Leállt munkafolyamat helyreállítása"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "A helyreállítást csak azután használja, hogy megerősítette: a kísérlet már nem fut. A helyreállítás nem állít le folyamatot."
"Collector and installation mode": "Adatgyűjtői és telepítési mód"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "A telepítési konfiguráció határozza meg az adatgyűjtői szerepet és az adatbázis-kapcsolatokat. Adatgyűjtő indítása előtt ellenőrizze a fő kiszolgáló konfigurációját."
"Discovery and SNMP settings": "Felderítési és SNMP-beállítások"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Tartsa letiltva a felderítést, amíg az adatgyűjtést és az adatgyűjtők kapcsolatát nem ellenőrizte."
"Template selection": "Sablonkijelölés"
"Templates selected for import": "Importálásra kijelölt sablonok"
"No templates selected.": "Nincs kijelölt sablon."
"Backup checklist": "Biztonsági mentési ellenőrzőlista"
"Database backup and a tested restoration procedure.": "Adatbázis-mentés és kipróbált visszaállítási eljárás."
"RRD files and the service account permissions needed to restore them.": "RRD-fájlok és a visszaállításukhoz szükséges szolgáltatásfiók-jogosultságok."
"Configuration, keys and plugin data outside the database.": "Az adatbázison kívüli konfiguráció, kulcsok és bővítményadatok."
"Post-installation checks": "Telepítés utáni ellenőrzések"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Az ellenőrzött vizsgálatok csak a bemutatott bizonyítékra terjednek ki. Az értékelés nélküli vizsgálatokat továbbra is az üzemeltetőnek kell ellenőriznie."
"Operational checks still require operator verification.": "Az üzemeltetési ellenőrzéseket továbbra is az üzemeltetőnek kell ellenőriznie."
"Status": "Állapot"
"verified": "Ellenőrizve"
"action_required": "Beavatkozás szükséges"
"not_assessed": "Nincs értékelve"
"Database schema": "Adatbázissémája"
"Stored schema matches the application target.": "A tárolt séma megegyezik az alkalmazás célsémájával."
"Target schema completion has not been confirmed.": "A célséma befejezése nincs megerősítve."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "A sémafrissítés befejezettnek tekintése előtt tekintse át a telepítés eredményét, és hárítsa el a hibákat."
"Installation outcome": "A telepítés eredménye"
"A successful receipt matches the current target schema.": "A sikeres nyugta megegyezik az aktuális célsémával."
"A complete successful installation outcome has not been confirmed.": "A teljes sikeres telepítési eredmény nincs megerősítve."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Őrizze meg a telepítési naplót, és szükség esetén használja az explicit helyreállítási vagy újrapróbálási eljárást."
"Collector synchronization": "Adatgyűjtők szinkronizálása"
"The completed installer reports pending collector synchronization.": "A befejezett telepítő függőben lévő adatgyűjtő-szinkronizálást jelent."
"The completed installer reports no pending collectors.": "A befejezett telepítő nem jelent függőben lévő adatgyűjtőt."
"Collector completion remains unconfirmed by this partial receipt.": "Az adatgyűjtő befejezését ez a részleges nyugta nem erősíti meg."
"Collector completion is not established by this installation outcome.": "Az adatgyűjtő befejezését ez a telepítési eredmény nem igazolja."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Részleges eredmények esetén tekintse át az adatgyűjtők állapotát, és próbálja újra a befejező feladatokat. Ez nem igazolja a későbbi adatgyűjtés frissességét."
"Scheduled collection": "Ütemezett adatgyűjtés"
"No poller or device was contacted by this assessment.": "Ez az értékelés nem vett fel kapcsolatot pollerrel vagy eszközzel."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Győződjön meg róla, hogy a beállított ütemező a pollert a kívánt szolgáltatásfiókkal futtatja, és tekintse át a következő szokásos ciklust."
"Graph data": "Grafikonadatok"
"Live samples and RRD updates were not exercised.": "Az élő mintákat és az RRD-frissítéseket nem próbálták ki."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Egy szokásos adatgyűjtési ciklus után győződjön meg róla, hogy a várt grafikonok friss mintákat kapnak, és tekintse át a lekérdezési hibákat."
"Recovery readiness": "Helyreállítási készenlét"
"Backup restoration was not exercised.": "A biztonsági mentés visszaállítását nem próbálták ki."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "A helyreállásra támaszkodás előtt ellenőrizze az adatbázis, az RRD-fájlok, a konfiguráció és a kulcsanyag elkülönített visszaállítását."
"No persisted local poller start has been recorded.": "Nincs rögzített, tartósan tárolt helyi lekérdezésindítás."
"Persisted poller timing is invalid and cannot establish scheduler health.": "A tartósan tárolt lekérdezési időzítés érvénytelen, és nem igazolja az ütemező egészségét."
"The recorded poller start is in the future. Check clock synchronization.": "A rögzített lekérdezésindítás a jövőben van. Ellenőrizze az óraszinkronizálást."
"The recorded poller start is older than the native scheduling tolerance.": "A rögzített lekérdezésindítás régebbi a natív ütemezési toleranciánál."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "A helyi lekérdezésindítás a natív ütemezési toleranciánál belül lett rögzítve. A befejezés és az eszközök egészsége nincs ellenőrizve."
"readable": "olvasható"
"missing or unreadable": "hiányzik vagy nem olvasható"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Állítsa vissza a teljes kiadást és a rögzített függőségeit; adjon olvasási hozzáférést a szolgáltatásfióknak."
"PHP temporary directory": "PHP ideiglenes könyvtára"
"directory writable by this process": "a folyamat által írható könyvtár"
"missing or not writable": "hiányzik vagy nem írható"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Állítsa be a sys_temp_dir értékét egy létező, a telepítési fiók által írható könyvtárra. A natív importálások ideiglenes fájlokat használnak."
"Background worker launch": "Háttérmunkafolyamat indítása"
"required PHP functions available; launch not exercised": "a szükséges PHP-függvények elérhetők; az indítást nem próbálták ki"
"required PHP launch function disabled": "a szükséges PHP-indítófüggvény le van tiltva"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Engedélyezze az exec függvényt a webes PHP-futtatókörnyezetben, vagy használja az engedélyezett parancssori telepítőt."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Engedélyezze a popen, pclose függvényeket a webes PHP-futtatókörnyezetben, vagy használja az engedélyezett parancssori telepítőt."
"Database transaction ownership": "Adatbázis-tranzakció tulajdonlása"
"autocommit enabled; no caller-owned transaction": "az autocommit engedélyezve; nincs hívó által birtokolt tranzakció"
"autocommit disabled or caller transaction active": "az autocommit le van tiltva, vagy hívói tranzakció aktív"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Futtassa a telepítést hívó által birtokolt tranzakción kívül, és engedélyezze az autocommit módot a módosító kapcsolatán."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Állítsa vissza a kiadási könyvtárat, és adjon írási hozzáférést a telepítési fiókhoz a sablonerőforrások importálásához. Ne tegye mindenki által írhatóvá."
"Worker file: install/background.php": "Munkafájl: install/background.php"
"Worker file: bin/legacy-installer.php": "Munkafájl: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Munkafájl: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importálási cél: resource/snmp_queries"
"Import destination: resource/script_server": "Importálási cél: resource/script_server"
"Import destination: resource/script_queries": "Importálási cél: resource/script_queries"
"Import destination: scripts": "Importálási cél: scripts"
"Database privileges": "Adatbázis-jogosultságok"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "A tényleges migrációs jogosultságok, beleértve az aktív szerepköröket és az objektumspecifikus engedélyeket, nem lettek ellenőrizve."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Kérje meg az adatbázis-rendszergazdát, hogy ellenőrizze a telepítési fiók és séma számára szükséges táblaírásokat, sémamódosításokat, eseményindítókat és rutinokat. Ne adjon globális rendszergazdai jogosultságot."
"Compare web and worker runtimes": "Webes és munkafolyamat-futtatókörnyezetek összehasonlítása"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Ez explicit módon elindít egy rövid, csak olvasási PHP-próbát. Nem foglal le telepítőt, nem ír fájlokat, és nem vesz fel kapcsolatot eszközökkel."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "A próba ezt a webes folyamatot örökli, és a beállított telepítői PHP-értelmezőt használja. Nem vizsgál külön ütemezőt vagy szolgáltatást."
"I authorize the read-only worker runtime comparison.": "Engedélyezem a csak olvasási munkafolyamat-futtatókörnyezet-összehasonlítást."
"Compare runtimes": "Futtatókörnyezetek összehasonlítása"
"Runtime comparison results": "A futtatókörnyezet-összehasonlítás eredményei"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Az engedélyek és az azonosságok közötti különbségek szándékosak lehetnek. A csak olvasási megfigyelések nem igazolják, hogy az írás vagy a telepítés sikeres lesz."
"Confirm the read-only worker runtime comparison.": "Erősítse meg a csak olvasási munkafolyamat-futtatókörnyezet-összehasonlítást."
"The runtime comparison is unavailable.": "A futtatókörnyezet-összehasonlítás nem érhető el."
"Shared application secret": "Megosztott alkalmazástitok"
"A strong web application secret is required before comparison.": "Az összehasonlítás előtt erős webalkalmazás-titokra van szükség."
"Runtime comparison": "Futtatókörnyezet-összehasonlítás"
"The configured worker runtime did not confirm a bounded comparison.": "A beállított munkafolyamat-futtatókörnyezet nem erősítette meg a korlátozott összehasonlítást."
"The inherited worker secret could not be confirmed against the web secret.": "Az örökölt munkafolyamat-titok nem erősíthető meg a webes titokkal szemben."
"PHP runtime comparison": "PHP-futtatókörnyezet összehasonlítása"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Mindkét futtatókörnyezetnek támogatnia kell a PHP 8.4-et; a különböző javítóverziók felülvizsgálatot igényelnek."
"Required extension comparison": "Szükséges bővítmények összehasonlítása"
"Required extension availability is checked; differing versions require review.": "A szükséges bővítmények elérhetősége ellenőrzésre kerül; a különböző verziók felülvizsgálatot igényelnek."
"Process identity comparison": "Folyamatazonosság összehasonlítása"
"Effective process identity is unavailable on this platform.": "A tényleges folyamatazonosság ezen a platformon nem érhető el."
"Effective process identities match.": "A tényleges folyamatazonosságok egyeznek."
"Effective process identities differ; separate service accounts may be intentional.": "A tényleges folyamatazonosságok eltérnek; a külön szolgáltatásfiókok szándékosak lehetnek."
"Directory access comparison": "Könyvtárhozzáférés összehasonlítása"
"Read-only directory permission observations match.": "A csak olvasási könyvtárengedély-megfigyelések egyeznek."
"Directory locations or permission observations differ; review the service-account roles.": "A könyvtárhelyek vagy az engedélymegfigyelések eltérnek; tekintse át a szolgáltatásfiók-szerepköröket."
"Worker directory read and traversal": "Munkafolyamat-könyvtár olvasása és bejárása"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "A szükséges munkafolyamat-könyvtáraknak létezniük kell, és engedélyezniük kell az olvasást és a bejárást. Írást nem teszteltek."
"The inherited worker secret matches the web secret for this private challenge.": "Az örökölt munkafolyamat-titok megegyezik a webes titokkal ennél a privát kihívásnál."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Tekintse át a beállított PHP-értelmezőt, a szükséges bővítményeket, az örökölt titkot és a szolgáltatásfiók könyvtárengedélyeit. Írást vagy telepítőindítást nem próbáltak ki."
"advisory": "tájékoztató"
