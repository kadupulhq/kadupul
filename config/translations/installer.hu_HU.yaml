"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ha egy munkafolyamat váratlanul leáll, őrizze meg a log/cacti.log fájlt, és az explicit újrapróbálás előtt ellenőrizze, hogy a folyamata befejeződött-e. A várakozó állapot nem igazolja a sikeres indítást."
