"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Chekwaa iwu ahụ mbụ; a na-agbakwunye Nhọrọ Ngwaọrụ na Ụkpụrụ Imepụta Eserese ya ma emechaa."
