"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Jadwallada Maalinlaha iyo Toddobaadlaha ahi waxay adeegsadaan bilowga iyo Dib U Socodsii Kasta; Toddobaadluhu wuxuu sidoo kale adeegsadaa Maalmaha Toddobaadka. Billuhu wuxuu adeegsadaa Bilaha iyo Maalmaha Bisha; Billaha Maalinta ku salaysan wuxuu adeegsadaa Bilaha, Toddobaadyada Bisha iyo Maalmaha Toddobaadka."
