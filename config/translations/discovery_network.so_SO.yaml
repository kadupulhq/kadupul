"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Liis meel bannaan lagu kala soocay oo ah Adeegayaasha DNS ee beddelka ah si loogu isticmaalo xallinta DNS. Haddii uu bannaan yahay, nidaamka hawlgalka ee xog-ururiyaha ayaa loo isticmaali doonaa xallinta magacyada DNS."
"Access denied.": "Gelitaanka waa la diiday."
