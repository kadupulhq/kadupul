"After an initial failure, the number of ping retries to attempt before failing.": "Kaddib fashilka bilowga ah, tirada isku dayada ping ee la samaynayo ka hor inta uusan fashilmin."
"After the selected Run Limit, the discovery process will be terminated.": "Kaddib Xadka Socodsiinta ee la doortay, habka sahaminta waa la joojin doonaa."
