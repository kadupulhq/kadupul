"A useful name for this Rule.": "Зручна назва для цього правила."
"Access denied.": "Доступ заборонено."
"Add Tree Rule": "Додати правило дерева"
"Back to Tree Rules": "Назад до правил дерева"
"Check this box to enable this rule.": "Установіть цей прапорець, щоб увімкнути це правило."
"Choose a Tree for the new Tree Items.": "Виберіть дерево для нових елементів дерева."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Виберіть заголовок вибраного дерева для приєднання або його корінь. Переконайтеся, що він усе ще існуватиме під час виконання цього правила."
"Choose a header of the selected Tree.": "Виберіть заголовок вибраного дерева."
"Choose a listed Graph Grouping Style.": "Виберіть стиль групування графіків зі списку."
"Choose a listed Leaf Item Type.": "Виберіть тип кінцевого елемента зі списку."
"Choose an existing Tree.": "Виберіть наявне дерево."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Виберіть спосіб групування графіків під час відображення для цього вузла в дереві. Використовується для кінцевих елементів «Пристрій»."
"Data Query Index": "Індекс запиту даних"
"Device": "Пристрій"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Кінцеві елементи типу «Пристрій» не можуть використовувати критерії за стовпцями графіків або шаблонів графіків. Змінюючи тип кінцевого елемента на «Пристрій», установіть цей прапорець, щоб видалити ці критерії; їх неможливо буде відновити."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Кінцеві елементи типу «Пристрій» не можуть використовувати критерії на основі графіків. Підтвердьте видалення %count% критеріїв для збереження."
"Edit Tree Rule": "Редагувати правило дерева"
"Enable Rule": "Увімкнути правило"
"Enter a name.": "Уведіть назву."
"Enter at most %count% characters.": "Уведіть щонайбільше %count% символів."
"Enter single-line text.": "Уведіть однорядковий текст."
"Graph": "Графік"
"Graph Grouping Style": "Стиль групування графіків"
"Graph Template": "Шаблон Графіку"
"Leaf Item Type": "Тип кінцевого елемента"
"Name": "Ім'я"
"Object Selection and Tree Creation Criteria": "Критерії вибору об'єктів і створення дерева"
"Optional: Sub-Tree Item": "Необов'язково: підпорядкований елемент дерева"
"Remove graph-based criteria": "Вилучити критерії на основі графіків"
"Save": "Зберегти"
"Save outcome is uncertain. Reload before retrying.": "Результат збереження невідомий. Перезавантажте перед повторною спробою."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Спочатку збережіть правило; його критерії вибору об'єктів і створення дерева додаються після цього."
"The Item Type that shall be dynamically added to the tree.": "Тип елемента, який динамічно додаватиметься до дерева."
"The tree rule changed since you opened this form. Reload before saving.": "Правило дерева змінилося після відкриття цієї форми. Перезавантажте перед збереженням."
"Tree": "Дерево"
"Tree Rule Selection [edit: %name%]": "Вибір правила дерева [редагування: %name%]"
"Tree Rules Selection [new]": "Вибір правил дерева [новий]"
"Tree rule not found.": "Правило дерева не знайдено."
"Tree rule saved.": "Правило дерева збережено."
"Unable to load the tree rule. Reload before retrying.": "Не вдалося завантажити правило дерева. Перезавантажте перед повторною спробою."
"Unexpected fields were submitted.": "Надіслано неочікувані поля."
