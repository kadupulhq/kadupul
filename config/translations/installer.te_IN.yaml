"Language": "భాష"
"Large tables may require the dedicated CLI conversion tool before installation.": "పెద్ద పట్టికలకు ఇన్‌స్టాలేషన్‌కు ముందు ప్రత్యేక CLI మార్పిడి సాధనం అవసరం కావచ్చు."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "నిల్వ చేసిన ఆధారాలను అలాగే ఉంచడానికి రహస్య ఫీల్డ్‌లను ఖాళీగా ఉంచండి. రహస్యాలు ఎప్పుడూ మళ్లీ ప్రదర్శించబడవు."
