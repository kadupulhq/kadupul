"The database version matches this application. Installation does not establish that polling is healthy.": "డేటాబేస్ వెర్షన్ ఈ అప్లికేషన్‌తో సరిపోలుతుంది. ఇన్‌స్టాలేషన్ పోలింగ్ ఆరోగ్యంగా ఉందని నిర్ధారించదు."
"The request outcome is unknown. Check execution status before retrying.": "అభ్యర్థన ఫలితం తెలియదు. మళ్లీ ప్రయత్నించే ముందు అమలు స్థితిని తనిఖీ చేయండి."
