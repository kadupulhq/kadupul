"Configure": "కాన్ఫిగర్ చేయి"
"Configuring collection profiles": "సేకరణ ప్రొఫైళ్లను కాన్ఫిగర్ చేస్తోంది"
"Configuring discovery": "డిస్కవరీని కాన్ఫిగర్ చేస్తోంది"
"Configuring the local device": "స్థానిక పరికరాన్ని కాన్ఫిగర్ చేస్తోంది"
"Confirming database version": "డేటాబేస్ వెర్షన్‌ను నిర్ధారిస్తోంది"
"Converting selected tables": "ఎంచుకున్న పట్టికలను మారుస్తోంది"
"Database version": "డేటాబేస్ వెర్షన్"
"Disabled": "నిలిపివేయబడింది"
"Discovery": "డిస్కవరీ"
"Discovery SNMP settings": "డిస్కవరీ SNMP సెట్టింగ్‌లు"
"Discovery range": "డిస్కవరీ పరిధి"
"Enable discovery after installation": "ఇన్‌స్టాలేషన్ తర్వాత డిస్కవరీని ప్రారంభించు"
"Executable paths": "అమలు చేయదగిన మార్గాలు"
