"directory writable by this process": "ఈ ప్రక్రియ ద్వారా వ్రాయగలిగే డైరెక్టరీ"
"missing or not writable": "లేదు లేదా వ్రాయదగినది కాదు"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "ఇన్‌స్టాలేషన్ ఖాతా ద్వారా వ్రాయగలిగే ఇప్పటికే ఉన్న డైరెక్టరీగా sys_temp_dirను కాన్ఫిగర్ చేయండి. నేటివ్ దిగుమతులు తాత్కాలిక ఫైళ్లను ఉపయోగిస్తాయి."
