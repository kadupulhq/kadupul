"Action": "చర్య"
"Advanced options": "అధునాతన ఎంపికలు"
"Applying database upgrades": "డేటాబేస్ అప్‌గ్రేడ్‌లను వర్తింపజేస్తోంది"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "డేటాబేస్, RRD ఫైళ్లు, కాన్ఫిగరేషన్ మరియు కీలను బ్యాకప్ చేయండి. అప్లికేషన్ రోల్‌బ్యాక్ రద్దు చేయలేని మార్పులను డేటాబేస్ అప్‌గ్రేడ్‌లు నమోదు చేయవచ్చు."
"Blocked": "నిరోధించబడింది"
"Check": "తనిఖీ చేయి"
"Check again": "మళ్లీ తనిఖీ చేయి"
"Check collection freshness and collector connectivity before enabling discovery.": "డిస్కవరీని ప్రారంభించే ముందు సేకరణ తాజాదనం మరియు కలెక్టర్ కనెక్టివిటీని తనిఖీ చేయండి."
"Check requirements": "అవసరాలను తనిఖీ చేయి"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "తనిఖీలు ఈ ప్రక్రియ మరియు ఫైల్‌సిస్టమ్ అనుమతులను పరిశీలిస్తాయి. అవి పరీక్ష ఫైళ్లను వ్రాయవు లేదా పరికరాలను సంప్రదించవు."
"Collection profile": "సేకరణ ప్రొఫైల్"
