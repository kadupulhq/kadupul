"Database privileges": "డేటాబేస్ అధికారాలు"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "సక్రియ పాత్రలు మరియు ఆబ్జెక్ట్-నిర్దిష్ట గ్రాంట్లతో సహా ప్రభావవంతమైన మైగ్రేషన్ అధికారాలు ధృవీకరించబడలేదు."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ఇన్‌స్టాలేషన్ ఖాతా మరియు స్కీమా కోసం అవసరమైన పట్టిక వ్రాతలు, స్కీమా మార్పులు, ట్రిగ్గర్లు మరియు రొటీన్‌లను డేటాబేస్ నిర్వాహకుడితో ధృవీకరించండి. గ్లోబల్ నిర్వాహక అధికారాలను మంజూరు చేయవద్దు."
"Compare web and worker runtimes": "వెబ్ మరియు వర్కర్ రన్‌టైమ్‌లను పోల్చు"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "ఇది చదవడానికి-మాత్రమే చిన్న PHP ప్రోబ్‌ను స్పష్టంగా ప్రారంభిస్తుంది. ఇది ఇన్‌స్టాలర్‌ను రిజర్వ్ చేయదు, ఫైళ్లను వ్రాయదు లేదా పరికరాలను సంప్రదించదు."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "ఈ ప్రోబ్ ఈ వెబ్ ప్రక్రియను వారసత్వంగా పొందుతుంది మరియు కాన్ఫిగర్ చేసిన ఇన్‌స్టాలర్ PHP ఇంటర్‌ప్రెటర్‌ను ఉపయోగిస్తుంది. ఇది ప్రత్యేక షెడ్యూలర్ లేదా సేవను పరిశీలించదు."
"I authorize the read-only worker runtime comparison.": "చదవడానికి-మాత్రమే వర్కర్ రన్‌టైమ్ పోలికకు నేను అధికారం ఇస్తున్నాను."
"Compare runtimes": "రన్‌టైమ్‌లను పోల్చు"
"Runtime comparison results": "రన్‌టైమ్ పోలిక ఫలితాలు"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "అనుమతి మరియు గుర్తింపు వ్యత్యాసాలు ఉద్దేశపూర్వకంగా ఉండవచ్చు. చదవడానికి-మాత్రమే పరిశీలనలు వ్రాతలు లేదా ఇన్‌స్టాలేషన్ విజయవంతమవుతాయని నిరూపించవు."
"Confirm the read-only worker runtime comparison.": "చదవడానికి-మాత్రమే వర్కర్ రన్‌టైమ్ పోలికను నిర్ధారించండి."
"The runtime comparison is unavailable.": "రన్‌టైమ్ పోలిక అందుబాటులో లేదు."
"Shared application secret": "భాగస్వామ్య అప్లికేషన్ రహస్యం"
"A strong web application secret is required before comparison.": "పోలికకు ముందు బలమైన వెబ్ అప్లికేషన్ రహస్యం అవసరం."
"Runtime comparison": "రన్‌టైమ్ పోలిక"
"The configured worker runtime did not confirm a bounded comparison.": "కాన్ఫిగర్ చేసిన వర్కర్ రన్‌టైమ్ పరిమిత పోలికను నిర్ధారించలేదు."
"The inherited worker secret could not be confirmed against the web secret.": "ఈ ప్రైవేట్ సవాలు కోసం వారసత్వ వర్కర్ రహస్యాన్ని వెబ్ రహస్యంతో నిర్ధారించలేకపోయింది."
"PHP runtime comparison": "PHP రన్‌టైమ్ పోలిక"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "రెండు రన్‌టైమ్‌లు PHP 8.4కు మద్దతు ఇవ్వాలి; వేర్వేరు ప్యాచ్ వెర్షన్‌లకు సమీక్ష అవసరం."
"Required extension comparison": "అవసరమైన ఎక్స్‌టెన్షన్ పోలిక"
"Required extension availability is checked; differing versions require review.": "అవసరమైన ఎక్స్‌టెన్షన్ లభ్యత తనిఖీ చేయబడింది; వేర్వేరు వెర్షన్‌లకు సమీక్ష అవసరం."
"Process identity comparison": "ప్రక్రియ గుర్తింపు పోలిక"
"Effective process identity is unavailable on this platform.": "ఈ ప్లాట్‌ఫారమ్‌లో ప్రభావవంతమైన ప్రక్రియ గుర్తింపు అందుబాటులో లేదు."
"Effective process identities match.": "ప్రభావవంతమైన ప్రక్రియ గుర్తింపులు సరిపోలాయి."
"Effective process identities differ; separate service accounts may be intentional.": "ప్రభావవంతమైన ప్రక్రియ గుర్తింపులు వేర్వేరుగా ఉన్నాయి; వేర్వేరు సేవా ఖాతాలు ఉద్దేశపూర్వకంగా ఉండవచ్చు."
"Directory access comparison": "డైరెక్టరీ యాక్సెస్ పోలిక"
"Read-only directory permission observations match.": "చదవడానికి-మాత్రమే డైరెక్టరీ అనుమతి పరిశీలనలు సరిపోలాయి."
"Directory locations or permission observations differ; review the service-account roles.": "డైరెక్టరీ స్థానాలు లేదా అనుమతి పరిశీలనలు వేర్వేరుగా ఉన్నాయి; సేవా-ఖాతా పాత్రలను సమీక్షించండి."
"Worker directory read and traversal": "వర్కర్ డైరెక్టరీ చదవడం మరియు ట్రావర్సల్"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "అవసరమైన వర్కర్ డైరెక్టరీలు తప్పనిసరిగా ఉండాలి మరియు చదవడం మరియు ట్రావర్సల్‌ను అనుమతించాలి. వ్రాతలు ఏవీ పరీక్షించబడలేదు."
"The inherited worker secret matches the web secret for this private challenge.": "ఈ ప్రైవేట్ సవాలు కోసం వారసత్వ వర్కర్ రహస్యం వెబ్ రహస్యంతో సరిపోలుతుంది."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "కాన్ఫిగర్ చేసిన PHP ఇంటర్‌ప్రెటర్, అవసరమైన ఎక్స్‌టెన్షన్లు, వారసత్వ రహస్యం మరియు సేవా-ఖాతా డైరెక్టరీ అనుమతులను సమీక్షించండి. వ్రాతలు లేదా ఇన్‌స్టాలర్ ప్రారంభం ఏదీ పరీక్షించబడలేదు."
"advisory": "సలహాపూర్వక"
