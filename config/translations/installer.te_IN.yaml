"Finishing tasks only. Schema migrations will not be replayed.": "పనులను మాత్రమే పూర్తి చేస్తోంది. స్కీమా మైగ్రేషన్లు మళ్లీ అమలు చేయబడవు."
"I accept the license terms": "నేను లైసెన్స్ నిబంధనలను అంగీకరిస్తున్నాను"
"I authorize discovery of the displayed range": "ప్రదర్శించబడిన పరిధి యొక్క డిస్కవరీకి నేను అధికారం ఇస్తున్నాను"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "నేను లాగ్‌ను తనిఖీ చేసాను మరియు మునుపటి వర్కర్ మరియు దాని చైల్డ్ ప్రక్రియలు ఆగిపోయాయని నిర్ధారించాను"
"I checked the previous attempt and accept that some changes may already be committed": "నేను మునుపటి ప్రయత్నాన్ని తనిఖీ చేసాను మరియు కొన్ని మార్పులు ఇప్పటికే కమిట్ చేయబడి ఉండవచ్చని అంగీకరిస్తున్నాను"
"I reviewed this plan and have the required backups": "నేను ఈ ప్రణాళికను సమీక్షించాను మరియు అవసరమైన బ్యాకప్‌లను కలిగి ఉన్నాను"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "వర్కర్ ఊహించని విధంగా ఆగిపోతే, log/cacti.logని భద్రపరచండి మరియు స్పష్టంగా మళ్లీ ప్రయత్నించే ముందు దాని ప్రక్రియ ముగిసిందని నిర్ధారించండి. వేచి ఉన్న స్థితి విజయవంతమైన ప్రారంభాన్ని నిర్ధారించదు."
