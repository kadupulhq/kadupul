"upgrade": "అప్‌గ్రేడ్ చేయి"
"waiting": "వేచి ఉంది"
"Accept the license before saving the installation plan.": "ఇన్‌స్టాలేషన్ ప్రణాళికను సేవ్ చేసే ముందు లైసెన్స్‌ను అంగీకరించండి."
"Invalid installation form.": "చెల్లని ఇన్‌స్టాలేషన్ ఫారమ్."
"Access denied.": "యాక్సెస్ నిరాకరించబడింది."
"Confirm the recovery warning before retrying.": "మళ్లీ ప్రయత్నించే ముందు రికవరీ హెచ్చరికను నిర్ధారించండి."
"Review and confirm the current installation plan.": "ప్రస్తుత ఇన్‌స్టాలేషన్ ప్రణాళికను సమీక్షించి నిర్ధారించండి."
"Confirm the discovery scope before starting.": "ప్రారంభించే ముందు డిస్కవరీ పరిధిని నిర్ధారించండి."
"Resolve the blocking checks before starting.": "ప్రారంభించే ముందు నిరోధించే తనిఖీలను పరిష్కరించండి."
"Too many installer options.": "చాలా ఎక్కువ ఇన్‌స్టాలర్ ఎంపికలు."
"Invalid installer option name.": "చెల్లని ఇన్‌స్టాలర్ ఎంపిక పేరు."
"Unknown or malformed installer option.": "తెలియని లేదా తప్పు ఫార్మాట్ ఉన్న ఇన్‌స్టాలర్ ఎంపిక."
"Installer options must be scalar values.": "ఇన్‌స్టాలర్ ఎంపికలు స్కేలార్ విలువలు అయి ఉండాలి."
"Installer option is too long or contains a null byte.": "ఇన్‌స్టాలర్ ఎంపిక చాలా పొడవుగా ఉంది లేదా శూన్య బైట్‌ను కలిగి ఉంది."
"Installer IDs and intervals must be whole numbers.": "ఇన్‌స్టాలర్ IDలు మరియు విరామాలు పూర్ణ సంఖ్యలు అయి ఉండాలి."
"Installer ID or interval is outside its supported range.": "ఇన్‌స్టాలర్ ID లేదా విరామం దాని మద్దతు గల పరిధి వెలుపల ఉంది."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ఇన్‌స్టాలేషన్ కొనసాగలేకపోయింది. దాని స్థితిని మళ్లీ లోడ్ చేసి, మళ్లీ ప్రయత్నించే ముందు నిరోధించే తనిఖీలను సమీక్షించండి."
"Confirm that the previous worker has stopped before recovering its plan.": "దాని ప్రణాళికను రికవరీ చేసే ముందు మునుపటి వర్కర్ ఆగిపోయిందని నిర్ధారించండి."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "డేటాబేస్ ఇన్‌స్టాల్ చేయబడింది, కానీ కొన్ని కలెక్టర్లకు ఇంకా సమకాలీకరణ అవసరం. వాటి స్థితిని తనిఖీ చేసిన తర్వాత పూర్తి చేసే పనులను మళ్లీ ప్రయత్నించండి."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ఇన్‌స్టాలేషన్ ఆగిపోయింది. ఇన్‌స్టాలర్ లాగ్‌ను భద్రపరచండి, కారణాన్ని సరిచేసి, మళ్లీ ప్రయత్నించడానికి స్పష్టంగా అధికారం ఇవ్వండి. కొన్ని డేటాబేస్ మార్పులు ఇప్పటికే కమిట్ చేయబడి ఉండవచ్చు. పునఃప్రయత్నానికి అధికారం ఇచ్చే ముందు ప్లగిన్ క్లీనప్‌ను తనిఖీ చేయండి."
"Next action": "తదుపరి చర్య"
"Follow the execution status. Do not start another attempt while a worker is active.": "అమలు స్థితిని అనుసరించండి. ఒక వర్కర్ సక్రియంగా ఉన్నప్పుడు మరొక ప్రయత్నాన్ని ప్రారంభించవద్దు."
"Complete the recovery checklist before retrying.": "మళ్లీ ప్రయత్నించే ముందు రికవరీ తనిఖీ జాబితాను పూర్తి చేయండి."
"Verify collection and graph operation before enabling discovery.": "డిస్కవరీని ప్రారంభించే ముందు సేకరణ మరియు గ్రాఫ్ ఆపరేషన్‌ను ధృవీకరించండి."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "నిరోధించబడిన అవసరాలను పరిష్కరించి, ఆపై మళ్లీ తనిఖీ చేయండి. సేవ్ చేసిన ఎంపికలు నిలుపుదల చేయబడతాయి."
"Review the planned changes and backup checklist before authorizing execution.": "అమలుకు అధికారం ఇచ్చే ముందు ప్రణాళిక చేసిన మార్పులు మరియు బ్యాకప్ తనిఖీ జాబితాను సమీక్షించండి."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "సేకరణ ప్రొఫైల్‌ను ఎంచుకుని లైసెన్స్‌ను అంగీకరించండి. అవసరమైనప్పుడు ఐచ్ఛిక సెట్టింగ్‌లను తెరవవచ్చు."
"Download installation diagnostics": "ఇన్‌స్టాలేషన్ నిర్ధారణను డౌన్‌లోడ్ చేయి"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "గ్రాఫ్‌ను తెరిచి, పోలర్ చక్రం తర్వాత దాని RRD డేటా అప్‌డేట్ అవుతుందని నిర్ధారించండి."
"Requirement details": "అవసరాల వివరాలు"
"Recover": "రికవర్ చేయి"
"Recovery checklist": "రికవరీ తనిఖీ జాబితా"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.logని భద్రపరచండి మరియు విఫలమైన ప్రయత్నాన్ని నమోదు చేయండి."
"Confirm that the previous worker and its child processes have stopped.": "మునుపటి వర్కర్ మరియు దాని చైల్డ్ ప్రక్రియలు ఆగిపోయాయని నిర్ధారించండి."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "కమిట్ చేసిన మార్పులు, కలెక్టర్ సమకాలీకరణ మరియు ప్లగిన్ క్లీనప్‌ను పరిశీలించండి. మళ్లీ ప్రయత్నించే ముందు కారణాన్ని సరిచేయండి."
"Review the saved plan again, then explicitly authorize a retry.": "సేవ్ చేసిన ప్రణాళికను మళ్లీ సమీక్షించి, ఆపై స్పష్టంగా పునఃప్రయత్నానికి అధికారం ఇవ్వండి."
"Recover a stopped worker": "ఆగిపోయిన వర్కర్‌ను రికవర్ చేయి"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "ఈ ప్రయత్నం ఇకపై నడవడం లేదని నిర్ధారించిన తర్వాత మాత్రమే రికవరీని ఉపయోగించండి. రికవరీ ప్రక్రియను ఆపదు."
"Collector and installation mode": "కలెక్టర్ మరియు ఇన్‌స్టాలేషన్ మోడ్"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "విస్తరణ కాన్ఫిగరేషన్ కలెక్టర్ పాత్ర మరియు డేటాబేస్ కనెక్షన్లను నిర్ణయిస్తుంది. కలెక్టర్‌ను ప్రారంభించే ముందు ప్రాథమిక సర్వర్ కాన్ఫిగరేషన్‌ను ధృవీకరించండి."
"Discovery and SNMP settings": "డిస్కవరీ మరియు SNMP సెట్టింగ్‌లు"
"Keep discovery disabled until collection and collector connectivity have been verified.": "సేకరణ మరియు కలెక్టర్ కనెక్టివిటీ ధృవీకరించబడే వరకు డిస్కవరీని నిలిపివేయండి."
"Template selection": "టెంప్లేట్ ఎంపిక"
"Templates selected for import": "దిగుమతి కోసం ఎంచుకున్న టెంప్లేట్లు"
"No templates selected.": "టెంప్లేట్లు ఏవీ ఎంచుకోబడలేదు."
"Backup checklist": "బ్యాకప్ తనిఖీ జాబితా"
"Database backup and a tested restoration procedure.": "డేటాబేస్ బ్యాకప్ మరియు పరీక్షించబడిన పునరుద్ధరణ ప్రక్రియ."
"RRD files and the service account permissions needed to restore them.": "RRD ఫైళ్లు మరియు వాటిని పునరుద్ధరించడానికి అవసరమైన సేవా ఖాతా అనుమతులు."
"Configuration, keys and plugin data outside the database.": "డేటాబేస్ వెలుపల ఉన్న కాన్ఫిగరేషన్, కీలు మరియు ప్లగిన్ డేటా."
"Post-installation checks": "ఇన్‌స్టాలేషన్-తర్వాతి తనిఖీలు"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "ధృవీకరించబడిన తనిఖీలు చూపబడిన ఆధారాన్ని మాత్రమే కవర్ చేస్తాయి. అంచనా వేయని తనిఖీలకు ఇంకా ఆపరేటర్ ధృవీకరణ అవసరం."
"Operational checks still require operator verification.": "కార్యాచరణ తనిఖీలకు ఇంకా ఆపరేటర్ ధృవీకరణ అవసరం."
"Status": "స్థితి"
"verified": "ధృవీకరించబడింది"
"action_required": "చర్య అవసరం"
"not_assessed": "అంచనా వేయబడలేదు"
"Database schema": "డేటాబేస్ స్కీమా"
"Stored schema matches the application target.": "నిల్వ చేసిన స్కీమా అప్లికేషన్ లక్ష్యంతో సరిపోలుతుంది."
"Target schema completion has not been confirmed.": "లక్ష్య స్కీమా పూర్తి కావడం నిర్ధారించబడలేదు."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "స్కీమా అప్‌గ్రేడ్ పూర్తయినట్లు పరిగణించే ముందు ఇన్‌స్టాలేషన్ ఫలితాన్ని సమీక్షించి వైఫల్యాలను పరిష్కరించండి."
"Installation outcome": "ఇన్‌స్టాలేషన్ ఫలితం"
"A successful receipt matches the current target schema.": "విజయవంతమైన రసీదు ప్రస్తుత లక్ష్య స్కీమాతో సరిపోలుతుంది."
"A complete successful installation outcome has not been confirmed.": "పూర్తి మరియు విజయవంతమైన ఇన్‌స్టాలేషన్ ఫలితం ఇంకా నిర్ధారించబడలేదు."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "ఇన్‌స్టాలర్ లాగ్‌ను భద్రపరచండి మరియు అవసరమైనప్పుడు స్పష్టమైన రికవరీ లేదా పునఃప్రయత్న ప్రక్రియను ఉపయోగించండి."
"Collector synchronization": "కలెక్టర్ సమకాలీకరణ"
"The completed installer reports pending collector synchronization.": "పూర్తయిన ఇన్‌స్టాలర్ పెండింగ్‌లో ఉన్న కలెక్టర్ సమకాలీకరణను నివేదిస్తుంది."
"The completed installer reports no pending collectors.": "పూర్తయిన ఇన్‌స్టాలర్ పెండింగ్‌లో ఉన్న కలెక్టర్లు ఏవీ లేవని నివేదిస్తుంది."
"Collector completion remains unconfirmed by this partial receipt.": "ఈ పాక్షిక రసీదు ద్వారా కలెక్టర్ పూర్తి కావడం నిర్ధారించబడలేదు."
"Collector completion is not established by this installation outcome.": "ఈ ఇన్‌స్టాలేషన్ ఫలితం ద్వారా కలెక్టర్ పూర్తి కావడం నిర్ధారించబడలేదు."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "కలెక్టర్ స్థితిని సమీక్షించి, పాక్షిక ఫలితాల కోసం పూర్తి చేసే పనులను మళ్లీ ప్రయత్నించండి. ఇది తదుపరి సేకరణ తాజాదనాన్ని ధృవీకరించదు."
"Scheduled collection": "షెడ్యూల్ చేసిన సేకరణ"
"No poller or device was contacted by this assessment.": "ఈ అంచనా ద్వారా ఏ పోలర్ లేదా పరికరాన్ని సంప్రదించలేదు."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "కాన్ఫిగర్ చేసిన షెడ్యూలర్ పోలర్‌ను ఉద్దేశించిన సేవా ఖాతాగా అమలు చేస్తుందని నిర్ధారించి, దాని తదుపరి సాధారణ చక్రాన్ని సమీక్షించండి."
"Graph data": "గ్రాఫ్ డేటా"
"Live samples and RRD updates were not exercised.": "లైవ్ నమూనాలు మరియు RRD అప్‌డేట్లు పరీక్షించబడలేదు."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "సాధారణ సేకరణ చక్రం తర్వాత, ఆశించిన గ్రాఫ్‌లు తాజా నమూనాలను అందుకుంటున్నాయని నిర్ధారించుకోండి మరియు పోలర్ లోపాలను సమీక్షించండి."
"Recovery readiness": "రికవరీ సంసిద్ధత"
"Backup restoration was not exercised.": "బ్యాకప్ పునరుద్ధరణ పరీక్షించబడలేదు."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "రికవరీపై ఆధారపడే ముందు డేటాబేస్, RRD ఫైళ్లు, కాన్ఫిగరేషన్ మరియు కీ సమాచారం యొక్క వేరుచేయబడిన పునరుద్ధరణను ధృవీకరించండి."
"No persisted local poller start has been recorded.": "స్థిరమైన స్థానిక పోలర్ ప్రారంభం ఏదీ నమోదు చేయబడలేదు."
"Persisted poller timing is invalid and cannot establish scheduler health.": "స్థిరమైన పోలర్ సమయపాలన చెల్లనిది మరియు షెడ్యూలర్ ఆరోగ్యాన్ని నిర్ధారించలేదు."
"The recorded poller start is in the future. Check clock synchronization.": "నమోదు చేయబడిన పోలర్ ప్రారంభం భవిష్యత్తులో ఉంది. గడియార సమకాలీకరణను తనిఖీ చేయండి."
"The recorded poller start is older than the native scheduling tolerance.": "నమోదు చేయబడిన పోలర్ ప్రారంభం స్థానిక షెడ్యూలింగ్ సహన పరిధి కంటే పాతది."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "స్థానిక పోలర్ ప్రారంభం స్థానిక షెడ్యూలింగ్ సహన పరిధిలో నమోదు చేయబడింది. పూర్తి కావడం మరియు పరికర ఆరోగ్యం ధృవీకరించబడలేదు."
"readable": "చదవదగినది"
"missing or unreadable": "లేదు లేదా చదవదగినది కాదు"
"Restore the complete release and its locked dependencies; grant the service account read access.": "పూర్తి విడుదలను మరియు దాని లాక్ చేసిన డిపెండెన్సీలను పునరుద్ధరించండి; సేవా ఖాతాకు చదవడానికి యాక్సెస్ ఇవ్వండి."
