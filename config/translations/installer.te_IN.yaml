"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "పురోగతి చివరిగా నమోదు చేయబడిన దశను చూపుతుంది. ఈ పేజీని రిఫ్రెష్ చేయడం వలన వర్కర్ ఎప్పుడూ ప్రారంభించబడదు లేదా మళ్లీ ప్రయత్నించబడదు."
