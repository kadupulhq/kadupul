"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "వెబ్ PHP రన్‌టైమ్ కోసం execని ప్రారంభించండి, లేదా అధికారం కలిగిన CLI ఇన్‌స్టాలర్‌ను ఉపయోగించండి."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "వెబ్ PHP రన్‌టైమ్ కోసం popen, pcloseని ప్రారంభించండి, లేదా అధికారం కలిగిన CLI ఇన్‌స్టాలర్‌ను ఉపయోగించండి."
"Database transaction ownership": "డేటాబేస్ లావాదేవీ యాజమాన్యం"
"autocommit enabled; no caller-owned transaction": "autocommit ప్రారంభించబడింది; కాలర్-యాజమాన్య లావాదేవీ లేదు"
"autocommit disabled or caller transaction active": "autocommit నిలిపివేయబడింది లేదా కాలర్ లావాదేవీ సక్రియంగా ఉంది"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "కాలర్-యాజమాన్య లావాదేవీ వెలుపల ఇన్‌స్టాలేషన్‌ను అమలు చేయండి మరియు దాని మ్యుటేషన్ కనెక్షన్‌పై autocommitను ప్రారంభించండి."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "విడుదల డైరెక్టరీని పునరుద్ధరించండి మరియు టెంప్లేట్ వనరు దిగుమతుల కోసం ఇన్‌స్టాలేషన్ ఖాతాకు వ్రాయడానికి యాక్సెస్ ఇవ్వండి. దీనిని అందరికీ వ్రాయగలిగేలా చేయవద్దు."
