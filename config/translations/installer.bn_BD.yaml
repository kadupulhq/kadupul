"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "অগ্রগতি সর্বশেষ রেকর্ডকৃত ধাপ দেখায়। এই পৃষ্ঠা রিফ্রেশ করলে কখনোই কোনো ওয়ার্কার শুরু হয় না বা পুনরায় চেষ্টা করে না।"
