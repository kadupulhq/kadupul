"The database version matches this application. Installation does not establish that polling is healthy.": "ডেটাবেস সংস্করণ এই অ্যাপ্লিকেশনের সাথে মেলে। ইনস্টলেশন প্রমাণ করে না যে পোলিং সুস্থ রয়েছে।"
