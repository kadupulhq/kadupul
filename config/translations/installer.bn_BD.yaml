"Review and confirm the current installation plan.": "বর্তমান ইনস্টলেশন পরিকল্পনাটি পর্যালোচনা ও নিশ্চিত করুন।"
"Confirm the discovery scope before starting.": "শুরু করার আগে ডিসকভারির পরিধি নিশ্চিত করুন।"
"Resolve the blocking checks before starting.": "শুরু করার আগে ব্লককারী পরীক্ষাগুলো সমাধান করুন।"
"Too many installer options.": "অত্যধিক ইনস্টলার বিকল্প।"
"Invalid installer option name.": "অবৈধ ইনস্টলার বিকল্পের নাম।"
"Unknown or malformed installer option.": "অজানা বা ত্রুটিপূর্ণ ইনস্টলার বিকল্প।"
"Installer options must be scalar values.": "ইনস্টলার বিকল্পসমূহ অবশ্যই স্কেলার মান হতে হবে।"
"Installer option is too long or contains a null byte.": "ইনস্টলার বিকল্পটি অত্যন্ত দীর্ঘ অথবা এতে নাল বাইট রয়েছে।"
"Installer IDs and intervals must be whole numbers.": "ইনস্টলার ID এবং ব্যবধানসমূহ অবশ্যই পূর্ণ সংখ্যা হতে হবে।"
"Installer ID or interval is outside its supported range.": "ইনস্টলার ID বা ব্যবধান এর সমর্থিত সীমার বাইরে।"
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ইনস্টলেশন এগিয়ে নেওয়া যায়নি। পুনরায় চেষ্টা করার আগে এর অবস্থা রিলোড করুন এবং ব্লককারী পরীক্ষাগুলো পর্যালোচনা করুন।"
"Confirm that the previous worker has stopped before recovering its plan.": "পরিকল্পনা পুনরুদ্ধার করার আগে নিশ্চিত করুন যে পূর্ববর্তী ওয়ার্কার বন্ধ হয়েছে।"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ডেটাবেস ইনস্টল হয়েছে, তবে কিছু কালেক্টরের এখনো সিঙ্ক্রোনাইজেশন প্রয়োজন। সেগুলোর অবস্থা পরীক্ষা করার পর সমাপনী কাজগুলো পুনরায় চেষ্টা করুন।"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ইনস্টলেশন থেমে গেছে। ইনস্টলার লগ সংরক্ষণ করুন, কারণটি সমাধান করুন এবং স্পষ্টভাবে পুনরায় চেষ্টা নিশ্চিত করুন। কিছু ডেটাবেস পরিবর্তন ইতিমধ্যেই কমিট হয়ে থাকতে পারে। পুনরায় চেষ্টার অনুমোদন দেওয়ার আগে প্লাগইন ক্লিনআপ পরীক্ষা করুন।"
"Next action": "পরবর্তী কার্যক্রম"
"Follow the execution status. Do not start another attempt while a worker is active.": "সম্পাদনের অবস্থা অনুসরণ করুন। কোনো ওয়ার্কার সক্রিয় থাকা অবস্থায় আরেকটি প্রচেষ্টা শুরু করবেন না।"
"Complete the recovery checklist before retrying.": "পুনরায় চেষ্টা করার আগে পুনরুদ্ধার চেকলিস্ট সম্পূর্ণ করুন।"
"Verify collection and graph operation before enabling discovery.": "ডিসকভারি সক্রিয় করার আগে সংগ্রহ এবং গ্রাফ কার্যক্রম যাচাই করুন।"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "ব্লককৃত প্রয়োজনীয়তাগুলো সমাধান করুন, তারপর পুনরায় পরীক্ষা করুন। সংরক্ষিত নির্বাচনগুলো বজায় থাকবে।"
"Review the planned changes and backup checklist before authorizing execution.": "সম্পাদনের অনুমোদন দেওয়ার আগে পরিকল্পিত পরিবর্তন এবং ব্যাকআপ চেকলিস্ট পর্যালোচনা করুন।"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "একটি সংগ্রহ প্রোফাইল নির্বাচন করুন এবং লাইসেন্স গ্রহণ করুন। প্রয়োজনে ঐচ্ছিক সেটিংস খোলা যেতে পারে।"
"Download installation diagnostics": "ইনস্টলেশন ডায়াগনস্টিকস ডাউনলোড করুন"
