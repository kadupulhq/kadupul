"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ইনস্টলেশন অ্যাকাউন্ট এবং স্কিমার জন্য প্রয়োজনীয় টেবিল রাইট, স্কিমা পরিবর্তন, ট্রিগার এবং রুটিনসমূহ ডেটাবেস অ্যাডমিনিস্ট্রেটরকে দিয়ে যাচাই করান। গ্লোবাল অ্যাডমিনিস্ট্রেটর অধিকার দেবেন না।"
"Compare web and worker runtimes": "ওয়েব এবং ওয়ার্কার রানটাইম তুলনা করুন"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "এটি স্পষ্টভাবে একটি সংক্ষিপ্ত শুধুমাত্র-পঠনযোগ্য PHP প্রোব শুরু করে। এটি কোনো ইনস্টলার সংরক্ষণ করে না, ফাইল লেখে না বা ডিভাইসের সাথে যোগাযোগ করে না।"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "প্রোবটি এই ওয়েব প্রসেসের উত্তরাধিকারী হয় এবং কনফিগার করা ইনস্টলার PHP ইন্টারপ্রেটার ব্যবহার করে। এটি কোনো পৃথক শিডিউলার বা পরিষেবা পরিদর্শন করে না।"
"I authorize the read-only worker runtime comparison.": "আমি শুধুমাত্র-পঠনযোগ্য ওয়ার্কার রানটাইম তুলনা অনুমোদন করছি।"
"Compare runtimes": "রানটাইম তুলনা করুন"
"Runtime comparison results": "রানটাইম তুলনার ফলাফল"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "অনুমতি এবং পরিচয়ের পার্থক্য ইচ্ছাকৃত হতে পারে। শুধুমাত্র-পঠনযোগ্য পর্যবেক্ষণগুলো প্রমাণ করে না যে রাইট বা ইনস্টলেশন সফল হবে।"
"Confirm the read-only worker runtime comparison.": "শুধুমাত্র-পঠনযোগ্য ওয়ার্কার রানটাইম তুলনা নিশ্চিত করুন।"
"The runtime comparison is unavailable.": "রানটাইম তুলনা উপলব্ধ নয়।"
"Shared application secret": "শেয়ারকৃত অ্যাপ্লিকেশন সিক্রেট"
"A strong web application secret is required before comparison.": "তুলনা করার আগে একটি শক্তিশালী ওয়েব অ্যাপ্লিকেশন সিক্রেট প্রয়োজন।"
"Runtime comparison": "রানটাইম তুলনা"
"The configured worker runtime did not confirm a bounded comparison.": "কনফিগার করা ওয়ার্কার রানটাইম একটি সীমাবদ্ধ তুলনা নিশ্চিত করেনি।"
"The inherited worker secret could not be confirmed against the web secret.": "উত্তরাধিকারসূত্রে প্রাপ্ত ওয়ার্কার সিক্রেটটি ওয়েব সিক্রেটের বিপরীতে নিশ্চিত করা যায়নি।"
"PHP runtime comparison": "PHP রানটাইম তুলনা"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "উভয় রানটাইমকেই অবশ্যই PHP 8.4 সমর্থন করতে হবে; প্যাচ সংস্করণ ভিন্ন হলে পর্যালোচনা প্রয়োজন।"
"Required extension comparison": "প্রয়োজনীয় এক্সটেনশন তুলনা"
"Required extension availability is checked; differing versions require review.": "প্রয়োজনীয় এক্সটেনশন উপলব্ধতা পরীক্ষা করা হয়েছে; সংস্করণ ভিন্ন হলে পর্যালোচনা প্রয়োজন।"
"Process identity comparison": "প্রসেস পরিচয় তুলনা"
"Effective process identity is unavailable on this platform.": "এই প্ল্যাটফর্মে কার্যকর প্রসেস পরিচয় উপলব্ধ নয়।"
"Effective process identities match.": "কার্যকর প্রসেস পরিচয় মিলে গেছে।"
"Effective process identities differ; separate service accounts may be intentional.": "কার্যকর প্রসেস পরিচয় ভিন্ন; পৃথক সার্ভিস অ্যাকাউন্ট ইচ্ছাকৃত হতে পারে।"
"Directory access comparison": "ডিরেক্টরি অ্যাক্সেস তুলনা"
"Read-only directory permission observations match.": "শুধুমাত্র-পঠনযোগ্য ডিরেক্টরি অনুমতির পর্যবেক্ষণ মিলে গেছে।"
"Directory locations or permission observations differ; review the service-account roles.": "ডিরেক্টরির অবস্থান বা অনুমতির পর্যবেক্ষণ ভিন্ন; সার্ভিস-অ্যাকাউন্টের ভূমিকা পর্যালোচনা করুন।"
"Worker directory read and traversal": "ওয়ার্কার ডিরেক্টরি পড়া এবং পরিভ্রমণ"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "প্রয়োজনীয় ওয়ার্কার ডিরেক্টরিগুলো অবশ্যই বিদ্যমান থাকতে হবে এবং পড়া ও পরিভ্রমণের অনুমতি দিতে হবে। কোনো রাইট পরীক্ষা করা হয়নি।"
"The inherited worker secret matches the web secret for this private challenge.": "এই ব্যক্তিগত চ্যালেঞ্জের জন্য উত্তরাধিকারসূত্রে প্রাপ্ত ওয়ার্কার সিক্রেটটি ওয়েব সিক্রেটের সাথে মিলে গেছে।"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "কনফিগার করা PHP ইন্টারপ্রেটার, প্রয়োজনীয় এক্সটেনশন, উত্তরাধিকারসূত্রে প্রাপ্ত সিক্রেট এবং সার্ভিস-অ্যাকাউন্ট ডিরেক্টরি অনুমতিসমূহ পর্যালোচনা করুন। কোনো রাইট বা ইনস্টলার চালু করা পরীক্ষা করা হয়নি।"
"advisory": "পরামর্শমূলক"
