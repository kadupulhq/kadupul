"A useful name for this Rule.": "Ett användbart namn för denna regel."
"Access denied.": "Åtkomst nekad."
"Add Tree Rule": "Lägg till trädregel"
"Back to Tree Rules": "Tillbaka till trädregler"
"Check this box to enable this rule.": "Markera den här rutan för att aktivera regeln."
"Choose a Tree for the new Tree Items.": "Välj ett träd för de nya trädföremålen."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Välj en rubrik i det valda trädet att haka fast i, eller dess rot. Se till att den fortfarande finns när den här regeln körs."
"Choose a header of the selected Tree.": "Välj en rubrik i det valda trädet."
"Choose a listed Graph Grouping Style.": "Välj en listad grafgrupperingsstil."
"Choose a listed Leaf Item Type.": "Välj en listad bladobjekttyp."
"Choose an existing Tree.": "Välj ett befintligt träd."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Välj hur grafer grupperas när de ritas för denna värd i trädet. Används för enhetsblad."
"Data Query Index": "Index för datafrågor"
"Device": "Enhet"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Enhetsblad kan inte använda kriterier på kolumner för graf eller grafmall. När du ändrar bladobjekttyp till Enhet, markera denna ruta för att ta bort dessa kriterier; de kan inte återställas."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Enhetsblad kan inte använda grafbaserade kriterier. Bekräfta borttagning av %count% kriterier för att spara."
"Edit Tree Rule": "Redigera trädregel"
"Enable Rule": "Aktivera regel"
"Enter a name.": "Ange ett namn."
"Enter at most %count% characters.": "Ange högst %count% tecken."
"Enter single-line text.": "Ange enradig text."
"Graph": "Diagram"
"Graph Grouping Style": "Stil för gruppering av grafer"
"Graph Template": "Grafmall"
"Leaf Item Type": "Blad Artikeltyp"
"Name": "Namn"
"Object Selection and Tree Creation Criteria": "Kriterier för objektval och trädskapande"
"Optional: Sub-Tree Item": "Valfritt: Underträdspost"
"Remove graph-based criteria": "Ta bort grafbaserade kriterier"
"Save": "Spara"
"Save outcome is uncertain. Reload before retrying.": "Resultatet av att spara är osäkert. Ladda om innan du försöker igen."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Spara regeln först; dess kriterier för objektval och trädskapande läggs till efteråt."
"The Item Type that shall be dynamically added to the tree.": "Den objekttyp som dynamiskt ska läggas till i trädet."
"The tree rule changed since you opened this form. Reload before saving.": "Trädregeln ändrades efter att du öppnade det här formuläret. Ladda om innan du sparar."
"Tree": "Träd"
"Tree Rule Selection [edit: %name%]": "Val av trädregel [redigera: %name%]"
"Tree Rules Selection [new]": "Val av trädregler [ny]"
"Tree rule not found.": "Trädregeln hittades inte."
"Tree rule saved.": "Trädregeln sparades."
"Unable to load the tree rule. Reload before retrying.": "Kunde inte läsa in trädregeln. Ladda om innan du försöker igen."
