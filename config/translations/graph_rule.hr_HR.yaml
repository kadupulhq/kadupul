"Enable selected": "Omogući odabrano"
"Enter a name.": "Unesite naziv."
"Enter a valid name format.": "Unesite važeći format naziva."
"Enter at most %count% characters.": "Unesite najviše %count% znakova."
"Enter single-line text.": "Unesite tekst u jednom retku."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Svaki <rule_name> zamjenjuje se nazivom pravila grafa koje se kopira."
"Graph Type": "Vrsta grafa"
"Graph rule not found.": "Pravilo grafa nije pronađeno."
