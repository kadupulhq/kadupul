"A useful name for this Rule.": "Smislen naziv za ovo pravilo."
"Access denied.": "Pristup odbijen."
"Add Graph Rule": "Dodaj pravilo grafa"
"Back to Graph Rules": "Natrag na pravila grafova"
"Cancel": "Odustani"
"Check this box to enable this rule.": "Označite ovaj okvir za omogućavanje ovog pravila."
"Choose a Data Query to apply to this rule.": "Odaberite upit podataka koji će se primijeniti na ovo pravilo."
"Choose a Graph Type": "Odaberite vrstu grafa"
"Choose a Graph Type of the selected Data Query.": "Odaberite vrstu grafa odabranog upita podataka."
"Choose an existing Data Query.": "Odaberite postojeći upit podataka."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Odaberite bilo koju od dostupnih vrsta grafa odabranog upita podataka koja će se primijeniti na ovo pravilo."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kliknite Nastavi za brisanje sljedećih pravila grafova s njihovim kriterijima odabira uređaja i stvaranja grafova."
"Click Continue to disable the following Graph Rules.": "Kliknite Nastavi za onemogućavanje sljedećih pravila grafova."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kliknite Nastavi za dupliciranje sljedećih pravila grafova. Po želji možete promijeniti format naslova za nova pravila grafova, koja počinju onemogućena."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kliknite Nastavi za omogućavanje sljedećih pravila grafova. Provjerite jesu li uspješno testirana."
"Continue": "Nastavi"
"Data Query": "Upit podataka"
"Delete Graph Rules": "Izbriši pravila grafova"
