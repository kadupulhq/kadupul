"Rule Selection [new]": "Odabir pravila [novo]"
"Save": "Spremi"
"Save outcome is uncertain. Reload before retrying.": "Ishod spremanja je neizvjestan. Ponovno učitajte stranicu prije novog pokušaja."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Prvo spremite pravilo; njegovi kriteriji odabira uređaja i stvaranja grafova dodaju se nakon toga."
"Select": "Odaberi"
"Select %name%": "Odaberi %name%"
"Select at least one Graph Rule.": "Odaberite barem jedno pravilo grafa."
"Select at most 100 Graph Rules at a time.": "Odaberite najviše 100 pravila grafova odjednom."
"Select up to %count% rows at a time.": "Odaberite najviše %count% redaka odjednom."
"The graph rule changed since you opened this form. Reload before saving.": "Pravilo grafa se promijenilo otkad ste otvorili ovaj obrazac. Ponovno učitajte stranicu prije spremanja."
"The name format must give every copy a name of 1 to 255 characters.": "Format naziva mora svakoj kopiji dati naziv od 1 do 255 znakova."
"Title Format": "Format naslova"
"Unable to load Graph Rules. Reload before retrying.": "Nije moguće učitati pravila grafova. Ponovno učitajte stranicu prije novog pokušaja."
