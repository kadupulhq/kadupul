"Action": "Hành động"
"Advanced options": "Tùy chọn nâng cao"
"Applying database upgrades": "Đang áp dụng các bản nâng cấp cơ sở dữ liệu"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Sao lưu cơ sở dữ liệu, các tệp RRD, cấu hình và khóa. Các bản nâng cấp cơ sở dữ liệu có thể ghi nhận những thay đổi mà việc hoàn tác ứng dụng không thể đảo ngược."
"Blocked": "Bị chặn"
"Check": "Kiểm tra"
"Check again": "Kiểm tra lại"
"Check collection freshness and collector connectivity before enabling discovery.": "Kiểm tra độ mới của dữ liệu thu thập và kết nối trình thu thập trước khi bật dò tìm."
"Check requirements": "Kiểm tra yêu cầu"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Các bước kiểm tra xem xét tiến trình này và quyền hệ thống tệp. Chúng không ghi tệp thử nghiệm hay liên hệ với thiết bị."
"Collection profile": "Hồ sơ thu thập"
"Collector": "Trình thu thập"
"Configure": "Cấu hình"
"Configuring collection profiles": "Đang cấu hình hồ sơ thu thập"
"Configuring discovery": "Đang cấu hình dò tìm"
"Configuring the local device": "Đang cấu hình thiết bị cục bộ"
"Confirming database version": "Đang xác nhận phiên bản cơ sở dữ liệu"
"Converting selected tables": "Đang chuyển đổi các bảng đã chọn"
"Database version": "Phiên bản cơ sở dữ liệu"
"Disabled": "Vô hiệu hóa"
"Discovery": "Dò tìm"
"Discovery SNMP settings": "Cài đặt SNMP dò tìm"
"Discovery range": "Dải dò tìm"
"Enable discovery after installation": "Bật dò tìm sau khi cài đặt"
"Executable paths": "Đường dẫn tệp thực thi"
"Execution status": "Trạng thái thực thi"
"Finished execution": "Thực thi hoàn tất"
"Finishing tasks only. Schema migrations will not be replayed.": "Chỉ hoàn thiện các tác vụ cuối. Quá trình di trú lược đồ sẽ không chạy lại."
"I accept the license terms": "Tôi chấp nhận các điều khoản giấy phép"
"I authorize discovery of the displayed range": "Tôi ủy quyền dò tìm dải mạng đang hiển thị"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Tôi đã kiểm tra nhật ký và xác nhận rằng worker trước đó cùng các tiến trình con của nó đã dừng"
"I checked the previous attempt and accept that some changes may already be committed": "Tôi đã kiểm tra lần thử trước đó và chấp nhận rằng một số thay đổi có thể đã được ghi nhận"
"I reviewed this plan and have the required backups": "Tôi đã xem xét kế hoạch này và đã có các bản sao lưu bắt buộc"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Nếu một worker dừng đột ngột, hãy giữ lại log/cacti.log và xác nhận tiến trình của nó đã kết thúc trước khi thử lại một cách tường minh. Trạng thái đang chờ không xác nhận việc khởi chạy thành công."
"Importing templates": "Đang nhập mẫu"
"Install Kadupul": "Cài đặt Kadupul"
"Installation and upgrade": "Cài đặt và nâng cấp"
"Installation request was rejected.": "Yêu cầu cài đặt đã bị từ chối."
"Installation steps": "Các bước cài đặt"
"Installed": "Đã lắp đặt"
"Keep a backup of the database, RRD files, configuration and secret material.": "Giữ một bản sao lưu cơ sở dữ liệu, các tệp RRD, cấu hình và tài liệu khóa bí mật."
"Language": "Ngôn ngữ"
"Large tables may require the dedicated CLI conversion tool before installation.": "Các bảng lớn có thể yêu cầu công cụ chuyển đổi CLI chuyên dụng trước khi cài đặt."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Để trống các trường bí mật nếu muốn giữ thông tin xác thực đã lưu. Bí mật không bao giờ được hiển thị lại."
"License": "Giấy phép"
"No action needed": "Không cần hành động"
"Observed": "Đã quan sát"
"Open the console": "Mở bảng điều khiển"
"Operation": "Thao tác"
"Override discovery SNMP settings": "Ghi đè cài đặt SNMP dò tìm"
"Pass": "Đạt"
"Poller interval in seconds": "Chu kỳ Poller tính bằng giây"
"Preparing CSRF protection": "Đang chuẩn bị bảo vệ CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Tiến trình hiển thị giai đoạn được ghi nhận gần nhất. Việc làm mới trang này không bao giờ khởi chạy hoặc thử lại worker."
"Recover stopped attempt": "Khôi phục lần thử đã dừng"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Việc khôi phục giữ lại các lựa chọn đã lưu và không bao giờ kết thúc một worker đang chạy. Xem lại kế hoạch trước khi thử lại."
"Review": "Xem xét"
"Review installation plan": "Xem xét kế hoạch cài đặt"
"Run": "Chạy"
"Run reviewed plan": "Chạy kế hoạch đã xem xét"
"Save and review": "Lưu và xem xét"
"Scope": "Phạm vi"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Trạng thái không khả dụng. Công việc đã lưu vẫn được giữ lại. Hãy làm mới để kết nối lại; không gửi thêm yêu cầu cài đặt khác."
"Synchronizing collectors": "Đang đồng bộ hóa trình thu thập"
"Table conversions": "Chuyển đổi bảng"
"Templates": "Giao diện"
"The database version matches this application. Installation does not establish that polling is healthy.": "Phiên bản cơ sở dữ liệu khớp với ứng dụng này. Việc cài đặt không xác lập rằng hoạt động thăm dò đang ổn định."
"The request outcome is unknown. Check execution status before retrying.": "Kết quả yêu cầu không rõ ràng. Hãy kiểm tra trạng thái thực thi trước khi thử lại."
"Theme": "Chủ đề"
"Verify": "Xác minh"
"Verify the poller schedule and service account.": "Xác minh lịch trình Poller và tài khoản dịch vụ."
"Version change": "Thay đổi phiên bản"
"Waiting for the installation worker": "Đang chờ worker cài đặt"
"collector": "trình thu thập"
"complete": "hoàn tất"
"failed": "thất bại"
"finish": "hoàn thành"
"install": "cài đặt"
"not_started": "chưa bắt đầu"
"partial": "một phần"
"running": "đang chạy"
"succeeded": "thành công"
"upgrade": "nâng cấp"
"waiting": "đang chờ"
"Accept the license before saving the installation plan.": "Chấp nhận giấy phép trước khi lưu kế hoạch cài đặt."
"Invalid installation form.": "Biểu mẫu cài đặt không hợp lệ."
"Access denied.": "Truy cập bị từ chối."
"Confirm the recovery warning before retrying.": "Xác nhận cảnh báo khôi phục trước khi thử lại."
"Review and confirm the current installation plan.": "Xem xét và xác nhận kế hoạch cài đặt hiện tại."
"Confirm the discovery scope before starting.": "Xác nhận phạm vi dò tìm trước khi bắt đầu."
"Resolve the blocking checks before starting.": "Giải quyết các kiểm tra đang chặn trước khi bắt đầu."
"Too many installer options.": "Quá nhiều tùy chọn trình cài đặt."
"Invalid installer option name.": "Tên tùy chọn trình cài đặt không hợp lệ."
"Unknown or malformed installer option.": "Tùy chọn trình cài đặt không xác định hoặc sai định dạng."
"Installer options must be scalar values.": "Tùy chọn trình cài đặt phải là giá trị vô hướng."
"Installer option is too long or contains a null byte.": "Tùy chọn trình cài đặt quá dài hoặc chứa byte null."
"Installer IDs and intervals must be whole numbers.": "ID và chu kỳ của trình cài đặt phải là số nguyên."
"Installer ID or interval is outside its supported range.": "ID hoặc chu kỳ của trình cài đặt nằm ngoài phạm vi được hỗ trợ."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Không thể tiếp tục cài đặt. Hãy tải lại trạng thái và xem xét các kiểm tra đang chặn trước khi thử lại."
"Confirm that the previous worker has stopped before recovering its plan.": "Xác nhận rằng worker trước đó đã dừng trước khi khôi phục kế hoạch của nó."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Cơ sở dữ liệu đã được cài đặt, nhưng một số trình thu thập vẫn cần đồng bộ hóa. Hãy thử lại các tác vụ hoàn thiện sau khi kiểm tra trạng thái của chúng."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Quá trình cài đặt đã dừng. Hãy giữ lại nhật ký trình cài đặt, khắc phục nguyên nhân và xác nhận thử lại tường minh. Một số thay đổi cơ sở dữ liệu có thể đã được ghi nhận. Kiểm tra dọn dẹp plugin trước khi ủy quyền thử lại."
"Next action": "Hành động tiếp theo"
"Follow the execution status. Do not start another attempt while a worker is active.": "Theo dõi trạng thái thực thi. Không bắt đầu lần thử khác khi một worker đang hoạt động."
"Complete the recovery checklist before retrying.": "Hoàn tất danh sách kiểm tra khôi phục trước khi thử lại."
"Verify collection and graph operation before enabling discovery.": "Xác minh hoạt động thu thập và đồ thị trước khi bật dò tìm."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Giải quyết các yêu cầu bị chặn, sau đó kiểm tra lại. Các lựa chọn đã lưu được giữ lại."
"Review the planned changes and backup checklist before authorizing execution.": "Xem xét các thay đổi dự kiến và danh sách kiểm tra sao lưu trước khi ủy quyền thực thi."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Chọn một hồ sơ thu thập và chấp nhận giấy phép. Có thể mở các cài đặt tùy chọn khi cần."
"Download installation diagnostics": "Tải xuống chẩn đoán cài đặt"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Mở một đồ thị và xác nhận dữ liệu RRD của nó được cập nhật sau một chu kỳ Poller."
"Requirement details": "Chi tiết yêu cầu"
"Recover": "Khôi phục"
"Recovery checklist": "Danh sách kiểm tra khôi phục"
"Preserve log/cacti.log and record the failed attempt.": "Giữ lại log/cacti.log và ghi nhận lần thử thất bại."
"Confirm that the previous worker and its child processes have stopped.": "Xác nhận rằng worker trước đó và các tiến trình con của nó đã dừng."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Kiểm tra các thay đổi đã ghi nhận, đồng bộ hóa trình thu thập và dọn dẹp plugin. Khắc phục nguyên nhân trước khi thử lại."
"Review the saved plan again, then explicitly authorize a retry.": "Xem lại kế hoạch đã lưu một lần nữa, sau đó ủy quyền thử lại một cách tường minh."
"Recover a stopped worker": "Khôi phục worker đã dừng"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Chỉ sử dụng khôi phục sau khi xác nhận lần thử này không còn chạy nữa. Việc khôi phục không dừng tiến trình."
"Collector and installation mode": "Trình thu thập và chế độ cài đặt"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Cấu hình triển khai quyết định vai trò trình thu thập và các kết nối cơ sở dữ liệu. Hãy xác minh cấu hình máy chủ chính trước khi khởi chạy một trình thu thập."
"Discovery and SNMP settings": "Cài đặt dò tìm và SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Giữ trạng thái tắt dò tìm cho đến khi việc thu thập và kết nối trình thu thập đã được xác minh."
"Template selection": "Chọn mẫu"
"Templates selected for import": "Các mẫu được chọn để nhập"
"No templates selected.": "Chưa chọn mẫu nào."
"Backup checklist": "Danh sách kiểm tra sao lưu"
"Database backup and a tested restoration procedure.": "Bản sao lưu cơ sở dữ liệu và quy trình khôi phục đã được kiểm thử."
"RRD files and the service account permissions needed to restore them.": "Các tệp RRD và quyền tài khoản dịch vụ cần thiết để khôi phục chúng."
"Configuration, keys and plugin data outside the database.": "Cấu hình, khóa và dữ liệu plugin nằm ngoài cơ sở dữ liệu."
"Post-installation checks": "Kiểm tra sau cài đặt"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Các kiểm tra đã xác minh chỉ bao phủ bằng chứng được hiển thị. Các kiểm tra chưa đánh giá vẫn cần người vận hành xác minh."
"Operational checks still require operator verification.": "Các bước kiểm tra vận hành vẫn cần người vận hành xác minh."
"Status": "Trạng thái"
"verified": "Đã xác minh"
"action_required": "Cần hành động"
"not_assessed": "Chưa đánh giá"
"Database schema": "Lược đồ cơ sở dữ liệu"
"Stored schema matches the application target.": "Lược đồ đã lưu khớp với đích ứng dụng."
"Target schema completion has not been confirmed.": "Chưa xác nhận hoàn tất lược đồ đích."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Xem xét kết quả cài đặt và khắc phục các lỗi trước khi coi việc nâng cấp lược đồ là hoàn tất."
"Installation outcome": "Kết quả cài đặt"
"A successful receipt matches the current target schema.": "Biên nhận thành công khớp với lược đồ đích hiện tại."
"A complete successful installation outcome has not been confirmed.": "Kết quả cài đặt thành công hoàn toàn chưa được xác nhận."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Giữ lại nhật ký trình cài đặt và sử dụng quy trình khôi phục hoặc thử lại tường minh khi cần."
"Collector synchronization": "Đồng bộ hóa trình thu thập"
"The completed installer reports pending collector synchronization.": "Trình cài đặt đã hoàn tất báo cáo còn trình thu thập đang chờ đồng bộ hóa."
"The completed installer reports no pending collectors.": "Trình cài đặt đã hoàn tất báo cáo không còn trình thu thập nào đang chờ."
"Collector completion remains unconfirmed by this partial receipt.": "Việc hoàn tất trình thu thập vẫn chưa được xác nhận bởi biên nhận một phần này."
"Collector completion is not established by this installation outcome.": "Việc hoàn tất trình thu thập chưa được xác lập bởi kết quả cài đặt này."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Kiểm tra trạng thái trình thu thập và thử lại các tác vụ hoàn thiện đối với kết quả một phần. Thao tác này không xác minh độ mới của dữ liệu thu thập sau đó."
"Scheduled collection": "Thu thập theo lịch"
"No poller or device was contacted by this assessment.": "Đánh giá này không liên hệ với bất kỳ Poller hoặc thiết bị nào."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Xác nhận trình lập lịch đã cấu hình chạy Poller dưới tài khoản dịch vụ dự kiến và xem lại chu kỳ thông thường tiếp theo."
"Graph data": "Dữ liệu đồ thị"
"Live samples and RRD updates were not exercised.": "Chưa thực hiện kiểm thử mẫu trực tiếp và cập nhật RRD."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Sau một chu kỳ thu thập thông thường, hãy xác nhận các đồ thị dự kiến nhận được mẫu mới và xem lại lỗi Poller."
"Recovery readiness": "Mức độ sẵn sàng khôi phục"
"Backup restoration was not exercised.": "Chưa thực hiện kiểm thử khôi phục bản sao lưu."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Xác minh bản khôi phục cô lập cơ sở dữ liệu, tệp RRD, cấu hình và tài liệu khóa trước khi tin cậy vào quy trình khôi phục."
"No persisted local poller start has been recorded.": "Chưa ghi nhận lần khởi chạy Poller cục bộ nào được lưu."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Thời gian Poller đã lưu không hợp lệ và không thể xác nhận tình trạng bộ lập lịch."
"The recorded poller start is in the future. Check clock synchronization.": "Thời điểm bắt đầu Poller được ghi nhận nằm ở tương lai. Hãy kiểm tra đồng bộ hóa đồng hồ."
"The recorded poller start is older than the native scheduling tolerance.": "Thời điểm bắt đầu Poller được ghi nhận cũ hơn dung sai lập lịch gốc."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Đã ghi nhận một lần khởi chạy Poller cục bộ trong dung sai lập lịch gốc. Trạng thái hoàn tất và tình trạng thiết bị chưa được xác minh."
"readable": "có thể đọc"
"missing or unreadable": "thiếu hoặc không thể đọc"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Khôi phục toàn bộ bản phát hành và các gói phụ thuộc đã khóa của nó; cấp quyền đọc cho tài khoản dịch vụ."
"PHP temporary directory": "Thư mục tạm thời PHP"
"directory writable by this process": "thư mục có quyền ghi bởi tiến trình này"
"missing or not writable": "thiếu hoặc không thể ghi"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Cấu hình sys_temp_dir là một thư mục đang tồn tại có quyền ghi bởi tài khoản cài đặt. Các thao tác nhập gốc sử dụng tệp tạm thời."
"Background worker launch": "Khởi chạy tiến trình nền"
"required PHP functions available; launch not exercised": "các hàm PHP bắt buộc khả dụng; chưa thực hiện khởi chạy"
"required PHP launch function disabled": "hàm khởi chạy PHP bắt buộc đã bị vô hiệu hóa"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Bật exec cho môi trường chạy PHP web, hoặc sử dụng trình cài đặt CLI được ủy quyền."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Bật popen, pclose cho môi trường chạy PHP web, hoặc sử dụng trình cài đặt CLI được ủy quyền."
"Database transaction ownership": "Quyền sở hữu giao dịch cơ sở dữ liệu"
"autocommit enabled; no caller-owned transaction": "autocommit đã bật; không có giao dịch do bên gọi sở hữu"
"autocommit disabled or caller transaction active": "autocommit bị tắt hoặc giao dịch của bên gọi đang hoạt động"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Chạy cài đặt bên ngoài giao dịch do bên gọi sở hữu và bật autocommit trên kết nối ghi dữ liệu của nó."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Khôi phục thư mục phát hành và cấp quyền ghi cho tài khoản cài đặt để nhập tài nguyên mẫu. Không đặt quyền ghi cho mọi người dùng."
"Worker file: install/background.php": "Tệp worker: install/background.php"
"Worker file: bin/legacy-installer.php": "Tệp worker: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Tệp worker: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Đích nhập: resource/snmp_queries"
"Import destination: resource/script_server": "Đích nhập: resource/script_server"
"Import destination: resource/script_queries": "Đích nhập: resource/script_queries"
"Import destination: scripts": "Đích nhập: scripts"
"Database privileges": "Đặc quyền cơ sở dữ liệu"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Đặc quyền di trú hiệu lực, bao gồm vai trò đang hoạt động và quyền cấp theo đối tượng, chưa được xác minh."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Yêu cầu quản trị viên cơ sở dữ liệu xác minh quyền ghi bảng bắt buộc, thay đổi lược đồ, trigger và routine cho tài khoản và lược đồ cài đặt. Không cấp đặc quyền quản trị viên toàn cục."
"Compare web and worker runtimes": "So sánh môi trường chạy web và worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Thao tác này khởi chạy tường minh một tiến trình kiểm tra PHP ngắn ở chế độ chỉ đọc. Nó không giữ chỗ trình cài đặt, không ghi tệp hay liên hệ với thiết bị."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Công cụ thăm dò kiểm tra kế thừa tiến trình web này và sử dụng trình thông dịch PHP trình cài đặt đã cấu hình. Nó không kiểm tra bộ lập lịch hoặc dịch vụ riêng biệt."
"I authorize the read-only worker runtime comparison.": "Tôi ủy quyền so sánh môi trường chạy worker ở chế độ chỉ đọc."
"Compare runtimes": "So sánh môi trường chạy"
"Runtime comparison results": "Kết quả so sánh môi trường chạy"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Sự khác biệt về quyền và danh tính có thể là có chủ đích. Các quan sát chỉ đọc không chứng minh việc ghi dữ liệu hoặc cài đặt sẽ thành công."
"Confirm the read-only worker runtime comparison.": "Xác nhận so sánh môi trường chạy worker ở chế độ chỉ đọc."
"The runtime comparison is unavailable.": "So sánh môi trường chạy không khả dụng."
"Shared application secret": "Bí mật ứng dụng dùng chung"
"A strong web application secret is required before comparison.": "Cần có một khóa bí mật ứng dụng web mạnh trước khi so sánh."
"Runtime comparison": "So sánh môi trường chạy"
"The configured worker runtime did not confirm a bounded comparison.": "Môi trường chạy worker đã cấu hình không xác nhận được phép so sánh giới hạn."
"The inherited worker secret could not be confirmed against the web secret.": "Không thể xác nhận bí mật worker kế thừa khớp với bí mật web."
"PHP runtime comparison": "So sánh môi trường chạy PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Cả hai môi trường chạy phải hỗ trợ PHP 8.4; sự khác biệt về phiên bản vá cần được xem xét."
"Required extension comparison": "So sánh phần mở rộng bắt buộc"
"Required extension availability is checked; differing versions require review.": "Tính khả dụng của các phần mở rộng bắt buộc đã được kiểm tra; sự khác biệt về phiên bản cần được xem xét."
"Process identity comparison": "So sánh danh tính tiến trình"
"Effective process identity is unavailable on this platform.": "Danh tính tiến trình hiệu lực không khả dụng trên nền tảng này."
"Effective process identities match.": "Danh tính tiến trình hiệu lực khớp nhau."
"Effective process identities differ; separate service accounts may be intentional.": "Danh tính tiến trình hiệu lực khác nhau; việc tách riêng tài khoản dịch vụ có thể là có chủ đích."
"Directory access comparison": "So sánh quyền truy cập thư mục"
"Read-only directory permission observations match.": "Các quan sát quyền thư mục chỉ đọc khớp nhau."
"Directory locations or permission observations differ; review the service-account roles.": "Vị trí thư mục hoặc quan sát quyền khác nhau; hãy xem xét vai trò tài khoản dịch vụ."
"Worker directory read and traversal": "Đọc và duyệt thư mục worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Các thư mục worker bắt buộc phải tồn tại và cho phép đọc cũng như duyệt qua. Không có thao tác ghi nào được kiểm thử."
"The inherited worker secret matches the web secret for this private challenge.": "Bí mật worker kế thừa khớp với bí mật web cho thử thách riêng tư này."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Xem xét trình thông dịch PHP đã cấu hình, các phần mở rộng bắt buộc, bí mật kế thừa và quyền thư mục của tài khoản dịch vụ. Không có thao tác ghi hoặc khởi chạy trình cài đặt nào được thực hiện."
"advisory": "khuyến cáo"
