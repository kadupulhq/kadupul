"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "ਜੇ ਕੋਈ ਵਰਕਰ ਅਚਾਨਕ ਰੁਕ ਜਾਵੇ, ਤਾਂ ਸਪੱਸ਼ਟ ਤੌਰ 'ਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ log/cacti.log ਸੁਰੱਖਿਅਤ ਰੱਖੋ ਅਤੇ ਪੁਸ਼ਟੀ ਕਰੋ ਕਿ ਉਸਦੀ ਪ੍ਰਕਿਰਿਆ ਸਮਾਪਤ ਹੋ ਗਈ ਹੈ। ਉਡੀਕ ਅਵਸਥਾ ਸਫਲ ਸ਼ੁਰੂਆਤ ਦੀ ਪੁਸ਼ਟੀ ਨਹੀਂ ਕਰਦੀ।"
