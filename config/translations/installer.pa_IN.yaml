"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ਇੰਸਟਾਲੇਸ਼ਨ ਅੱਗੇ ਨਹੀਂ ਵਧ ਸਕੀ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਇਸਦੀ ਸਥਿਤੀ ਰੀਲੋਡ ਕਰੋ ਅਤੇ ਰੁਕਾਵਟ ਪਾਉਣ ਵਾਲੀਆਂ ਜਾਂਚਾਂ ਦੀ ਸਮੀਖਿਆ ਕਰੋ।"
"Confirm that the previous worker has stopped before recovering its plan.": "ਯੋਜਨਾ ਨੂੰ ਮੁੜ ਬਹਾਲ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਪੁਸ਼ਟੀ ਕਰੋ ਕਿ ਪਿਛਲਾ ਵਰਕਰ ਰੁਕ ਗਿਆ ਹੈ।"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ਡਾਟਾਬੇਸ ਇੰਸਟਾਲ ਹੋ ਗਿਆ ਹੈ, ਪਰ ਕੁਝ ਕੁਲੈਕਟਰਾਂ ਨੂੰ ਅਜੇ ਵੀ ਸਿੰਕ੍ਰੋਨਾਈਜ਼ੇਸ਼ਨ ਦੀ ਲੋੜ ਹੈ। ਉਨ੍ਹਾਂ ਦੀ ਸਥਿਤੀ ਜਾਂਚਣ ਤੋਂ ਬਾਅਦ ਸਮਾਪਤੀ ਕਾਰਜ ਦੁਬਾਰਾ ਚਲਾਓ।"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ਇੰਸਟਾਲੇਸ਼ਨ ਰੁਕ ਗਈ। ਇੰਸਟਾਲਰ ਲੌਗ ਸੁਰੱਖਿਅਤ ਰੱਖੋ, ਕਾਰਨ ਠੀਕ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਦੀ ਸਪੱਸ਼ਟ ਪੁਸ਼ਟੀ ਕਰੋ। ਕੁਝ ਡਾਟਾਬੇਸ ਬਦਲਾਅ ਪਹਿਲਾਂ ਹੀ ਕਮਿਟ ਹੋ ਚੁੱਕੇ ਹੋ ਸਕਦੇ ਹਨ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਨੂੰ ਅਧਿਕਾਰਤ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਪਲੱਗਇਨ ਸਫ਼ਾਈ ਦੀ ਜਾਂਚ ਕਰੋ।"

"Next action": "ਅਗਲੀ ਕਾਰਵਾਈ"
"Follow the execution status. Do not start another attempt while a worker is active.": "ਚਲਾਉਣ ਦੀ ਸਥਿਤੀ ਦੇ ਅਨੁਸਾਰ ਚੱਲੋ। ਜਦੋਂ ਤੱਕ ਕੋਈ ਵਰਕਰ ਸਰਗਰਮ ਹੈ, ਹੋਰ ਕੋਸ਼ਿਸ਼ ਸ਼ੁਰੂ ਨਾ ਕਰੋ।"
"Complete the recovery checklist before retrying.": "ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਮੁੜ ਬਹਾਲੀ ਚੈੱਕਲਿਸਟ ਪੂਰੀ ਕਰੋ।"
"Verify collection and graph operation before enabling discovery.": "ਖੋਜ ਚਾਲੂ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਇਕੱਤਰ ਕਰਨ ਅਤੇ ਗ੍ਰਾਫ਼ ਦੇ ਕੰਮ ਦੀ ਪੁਸ਼ਟੀ ਕਰੋ।"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "ਰੁਕੀਆਂ ਹੋਈਆਂ ਲੋੜਾਂ ਹੱਲ ਕਰੋ, ਫਿਰ ਦੁਬਾਰਾ ਜਾਂਚ ਕਰੋ। ਸੰਭਾਲੀਆਂ ਚੋਣਾਂ ਬਰਕਰਾਰ ਹਨ।"
"Review the planned changes and backup checklist before authorizing execution.": "ਚਲਾਉਣ ਨੂੰ ਅਧਿਕਾਰਤ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਯੋਜਨਾਬੱਧ ਬਦਲਾਵਾਂ ਅਤੇ ਬੈਕਅੱਪ ਚੈੱਕਲਿਸਟ ਦੀ ਸਮੀਖਿਆ ਕਰੋ।"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "ਇਕੱਤਰ ਕਰਨ ਦੀ ਪ੍ਰੋਫ਼ਾਈਲ ਚੁਣੋ ਅਤੇ ਲਾਇਸੰਸ ਸਵੀਕਾਰ ਕਰੋ। ਵਿਕਲਪਿਕ ਸੈਟਿੰਗਾਂ ਲੋੜ ਪੈਣ 'ਤੇ ਖੋਲ੍ਹੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ।"
"Download installation diagnostics": "ਇੰਸਟਾਲੇਸ਼ਨ ਡਾਇਗਨੌਸਟਿਕਸ ਡਾਊਨਲੋਡ ਕਰੋ"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ਇੱਕ ਗ੍ਰਾਫ਼ ਖੋਲ੍ਹੋ ਅਤੇ ਪੁਸ਼ਟੀ ਕਰੋ ਕਿ ਇੱਕ ਪੋਲਰ ਚੱਕਰ ਤੋਂ ਬਾਅਦ ਇਸਦਾ RRD ਡਾਟਾ ਅੱਪਡੇਟ ਹੁੰਦਾ ਹੈ।"
"Requirement details": "ਲੋੜ ਦੇ ਵੇਰਵੇ"
"Recover": "ਮੁੜ ਬਹਾਲ ਕਰੋ"
"Recovery checklist": "ਮੁੜ ਬਹਾਲੀ ਚੈੱਕਲਿਸਟ"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log ਸੁਰੱਖਿਅਤ ਰੱਖੋ ਅਤੇ ਅਸਫਲ ਕੋਸ਼ਿਸ਼ ਦਰਜ ਕਰੋ।"
