"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "ਮੁੜ ਬਹਾਲੀ ਤਾਂ ਹੀ ਵਰਤੋ ਜਦੋਂ ਪੁਸ਼ਟੀ ਹੋ ਜਾਵੇ ਕਿ ਇਹ ਕੋਸ਼ਿਸ਼ ਹੁਣ ਨਹੀਂ ਚੱਲ ਰਹੀ। ਮੁੜ ਬਹਾਲੀ ਕਿਸੇ ਪ੍ਰਕਿਰਿਆ ਨੂੰ ਬੰਦ ਨਹੀਂ ਕਰਦੀ।"
