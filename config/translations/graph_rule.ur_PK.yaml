"A useful name for this Rule.": "اس قاعدے کے لیے ایک موزوں نام۔"
"Access denied.": "رسائی مسترد کر دی گئی۔"
"Add Graph Rule": "گراف قاعدہ شامل کریں"
"Back to Graph Rules": "گراف قواعد پر واپس جائیں"
"Check this box to enable this rule.": "اس قاعدے کو فعال کرنے کے لیے اس باکس پر نشان لگائیں۔"
"Choose a Data Query to apply to this rule.": "اس قاعدے پر لاگو کرنے کے لیے ایک ڈیٹا کوئری منتخب کریں۔"
"Choose a Graph Type": "گراف کی قسم منتخب کریں"
"Choose a Graph Type of the selected Data Query.": "منتخب ڈیٹا کوئری کے لیے گراف کی قسم منتخب کریں۔"
"Choose an existing Data Query.": "ایک موجود ڈیٹا کوئری منتخب کریں۔"
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "اس قاعدے پر لاگو کرنے کے لیے منتخب ڈیٹا کوئری کی دستیاب گراف اقسام میں سے کوئی بھی منتخب کریں۔"
"Data Query": "ڈیٹا کوئری"
"Device Selection and Graph Creation Criteria": "ڈیوائس کا انتخاب اور گراف بنانے کے معیارات"
"Edit Graph Rule": "گراف قاعدے میں ترمیم کریں"
"Enable Rule": "قاعدہ فعال کریں"
"Enter a name.": "نام درج کریں۔"
"Enter at most %count% characters.": "زیادہ سے زیادہ %count% حروف درج کریں۔"
"Enter single-line text.": "ایک سطر کا متن درج کریں۔"
"Graph Type": "گراف کی قسم"
"Graph rule not found.": "گراف قاعدہ نہیں ملا۔"
"Graph rule saved.": "گراف قاعدہ محفوظ ہو گیا۔"
"Name": "نام"
"Rule Selection [edit: %name%]": "قاعدہ کا انتخاب [ترمیم: %name%]"
"Rule Selection [new]": "قاعدہ کا انتخاب [نیا]"
"Save": "محفوظ کریں"
"Save outcome is uncertain. Reload before retrying.": "محفوظ کرنے کا نتیجہ غیر یقینی ہے۔ دوبارہ کوشش کرنے سے پہلے دوبارہ لوڈ کریں۔"
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "پہلے قاعدہ محفوظ کریں؛ اس کے ڈیوائس کے انتخاب اور گراف بنانے کے معیارات بعد میں شامل کیے جاتے ہیں۔"
"The graph rule changed since you opened this form. Reload before saving.": "یہ فارم کھولنے کے بعد گراف قاعدہ تبدیل ہو گیا۔ محفوظ کرنے سے پہلے دوبارہ لوڈ کریں۔"
"Unable to load the graph rule. Reload before retrying.": "گراف قاعدہ لوڈ کرنے میں ناکام۔ دوبارہ کوشش کرنے سے پہلے دوبارہ لوڈ کریں۔"
"Unexpected fields were submitted.": "غیر متوقع فیلڈز جمع کروائی گئیں۔"
