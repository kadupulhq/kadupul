"A useful name for this Rule.": "Magac waxtar leh oo loogu talagalay Xeerkan."
"Access denied.": "Gelitaanka waa la diiday."
"Add Graph Rule": "Ku dar Xeerka Shaxanka"
"Back to Graph Rules": "Ku noqo Xeerarka Shaxanka"
"Cancel": "Jooji"
"Check this box to enable this rule.": "Calaamadee sanduuqan si aad u hawl-geliso xeerkan."
"Choose a Data Query to apply to this rule.": "Dooro Weydiin Xog oo lagu dabakho xeerkan."
"Choose a Graph Type": "Dooro Nooca Shaxanka"
"Choose a Graph Type of the selected Data Query.": "Dooro Nooca Shaxanka ee Weydiinta Xogta ee la doortay."
"Choose an existing Data Query.": "Dooro Weydiin Xogeed oo jirta."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Dooro mid ka mid ah Noocyada Shaxanka ee la heli karo ee Weydiinta Xogta ee la doortay si loogu dabaqo xeerkan."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Guji Sii wad si aad u tirtirto Xeerarka Shaxanka ee soo socda iyaga iyo Xulashada Qalabkooda iyo Shuruudaha Abuurista Shaxanka."
"Click Continue to disable the following Graph Rules.": "Guji Sii wad si aad u joojiso Xeerarka Shaxanka ee soo socda."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Guji Sii wad si aad u koobiyayso Xeerarka Shaxanka ee soo socda. Ikhtiyaar ahaan waxaad beddeli kartaa qaabka cinwaanka ee Xeerarka Shaxanka cusub, kuwaas oo ku bilaabma iyagoo joojisan."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Guji Sii wad si aad u hawlgeliso Xeerarka Shaxanka ee soo socda. Hubi in si guul leh loo tijaabiyay."
"Continue": "Sii wad"
"Data Query": "Weydiinta Xogta"
"Delete Graph Rules": "Tirtir Xeerarka Shaxanka"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Natiijada tirtiristu ma cadda. Hubi liiska Xeerarka Shaxanka ka hor intaadan isku dayin mar kale."
"Delete selected": "Tirtir kuwa la doortay"
"Device Selection and Graph Creation Criteria": "Xulashada Qalabka iyo Shuruudaha Abuurista Shaxanka"
"Disable Graph Rules": "Jooji Xeerarka Shaxanka"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Natiijada joojintu ma cadda. Hubi liiska Xeerarka Shaxanka ka hor intaadan isku dayin mar kale."
"Disable selected": "Jooji kuwa la doortay"
"Duplicate Graph Rules": "Koobiyee Xeerarka Shaxanka"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Natiijada koobiyayntu ma cadda. Hubi liiska Xeerarka Shaxanka ka hor intaadan isku dayin mar kale."
"Duplicate selected": "Nuqul ka samee kuwa la doortay"
"Edit Graph Rule": "Wax ka beddel Xeerka Shaxanka"
"Enable Graph Rules": "Hawlgeli Xeerarka Shaxanka"
"Enable Rule": "Hawl-geli Xeerka"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Natiijada hawlgelintu ma cadda. Hubi liiska Xeerarka Shaxanka ka hor intaadan isku dayin mar kale."
"Enable selected": "Hawlgeli kuwa la doortay"
"Enter a name.": "Geli magac."
"Enter a valid name format.": "Geli qaab magac oo sax ah."
"Enter at most %count% characters.": "Geli ugu badnaan %count% xaraf."
"Enter single-line text.": "Geli qoraal hal saf ah."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "<rule_name> kasta waxaa lagu beddelaa magaca Xeerka Shaxanka ee la koobiyaynayo."
"Graph Type": "Nooca Jaantuska"
"Graph rule not found.": "Xeerka shaxanka lama helin."
"Graph rule saved.": "Xeerka shaxanka waa la kaydiyay."
"Invalid Graph Rule selection.": "Xulashada Xeerka Shaxanku ma aha mid sax ah."
"Name": "Magaca"
"One or more selected Graph Rules no longer exist.": "Mid ama ka badan oo ka mid ah Xeerarka Shaxanka ee la doortay hadda ma jiraan."
"Rule Selection [edit: %name%]": "Xulashada Xeerka [wax ka beddel: %name%]"
"Rule Selection [new]": "Xulashada Xeerka [cusub]"
"Save": "Kaydi"
"Save outcome is uncertain. Reload before retrying.": "Natiijada kaydinta lama hubo. Dib u soo rar ka hor intaadan isku dayin mar kale."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Kaydi xeerka marka hore; Xulashada Qalabkiisa iyo Shuruudaha Abuurista Shaxanka waxaa lagu daraa kaddib."
"Select": "Dooro"
"Select %name%": "Dooro %name%"
"Select at least one Graph Rule.": "Dooro ugu yaraan hal Xeer Shaxan."
"Select at most 100 Graph Rules at a time.": "Dooro ugu badnaan 100 Xeer Shaxan markiiba."
"Select up to %count% rows at a time.": "Dooro ilaa %count% saf mar qura."
"The graph rule changed since you opened this form. Reload before saving.": "Xeerka shaxanku wuu isbeddelay tan iyo markii aad furtay foomkan. Dib u soo geli ka hor intaadan kaydin."
"The name format must give every copy a name of 1 to 255 characters.": "Qaabka magacu waa inuu koobi kasta siiyo magac ka kooban 1 ilaa 255 xaraf."
"Title Format": "Qaabka Cinwaanka"
"Unable to load Graph Rules. Reload before retrying.": "Lama soo gelin karin Xeerarka Shaxanka. Dib u soo geli ka hor intaadan isku dayin mar kale."
"Unable to load the graph rule. Reload before retrying.": "Lama soo gelin karin xeerka shaxanka. Dib u soo geli ka hor intaadan isku dayin mar kale."
"Unexpected fields were submitted.": "Meelo aan la filayn ayaa la gudbiyay."
