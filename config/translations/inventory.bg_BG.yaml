"Clear device statistics": "Изчистване на статистиката на устройството"
"Confirm clearing statistics": "Потвърждаване на изчистването на статистиката"
"Selected device statistics cleared.": "Статистиката на избраните устройства е изчистена."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Нулирайте времената за отговор, броя обхождания и достъпността за тези устройства. Графиките, историческите данни и настройките на устройствата се запазват. Статистиките се възобновяват при следващото обхождане."
"Synchronize device templates": "Синхронизиране на шаблони за устройства"
"Confirm synchronization": "Потвърждаване на синхронизацията"
"Selected device templates synchronized.": "Шаблоните на избраните устройства са синхронизирани."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Прилагане на текущо зададените шаблони към тези устройства. Липсващите асоциации с графики и заявки за данни се добавят, а неизползваните асоциации с шаблони за графики могат да бъдат премахнати. Устройствата без шаблони се пропускат. Съществуващите графики и историческите данни се запазват; автоматизацията може да създаде нови графики."
"Change device options": "Промяна на опциите на устройство"
"Confirm option changes": "Потвърждаване на промените на опциите"
"Selected device options updated.": "Опциите на избраните устройства са актуализирани."
"Device options": "Опции на устройството"
"Update this field": "Актуализиране на това поле"
"Select at least one supported device option.": "Изберете поне една поддържана опция за устройство."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Променят се само отметнатите опции. Неотметнатите опции запазват текущите си стойности. Избирането на празно местоположение го изчиства."
"Update %option%": "Актуализиране на %option%"
"Assignment target": "Цел на назначението"
"Select an assignment target": "Изберете цел на назначението"
"Select a valid assignment target.": "Изберете валидна цел на назначението."
"Invalid assignment kind.": "Невалиден вид назначение."
"Assign device sites": "Задаване на обекти на устройства"
"Assign device templates": "Задаване на шаблони на устройства"
"Assign device collectors": "Задаване на колектори на устройства"
"Confirm assignments": "Потвърждаване на назначенията"
"Selected device assignments updated.": "Назначенията на избраните устройства са актуализирани."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Избраното назначение се прилага към всяко изброено устройство. Промените на шаблони запазват съществуващите графики; автоматизацията може да създаде нови графики. Промените на колектор прехвърлят притежанието на обхождането."
"Change device SNMP settings": "Промяна на SNMP настройките на устройство"
"Confirm SNMP changes": "Потвърждаване на промените по SNMP"
"Selected device SNMP settings updated.": "SNMP настройките на избраните устройства са актуализирани."
"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "Приложете тези SNMP настройки към всяко избрано устройство. Запазете съхранените идентификационни данни на всяко устройство или изрично ги заменете. Съхранените тайни никога не се показват."
"Device graph-template associations": "Асоциации с шаблони за графики на устройството"
"Device associations updated.": "Асоциациите на устройството са актуализирани."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Премахването на асоциация запазва съществуващите графики и историческите данни. Добавянето на асоциация може да създаде графики чрез автоматизация. Засегнатите колектори трябва да са онлайн."
