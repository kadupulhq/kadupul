"The default profile and profiles in use by Data Templates or Data Sources can not be deleted.": "இயல்புநிலை சுயவிவரத்தையும் தரவு வார்ப்புருக்கள் அல்லது தரவு மூலங்கள் பயன்படுத்தும் சுயவிவரங்களையும் நீக்க முடியாது."
"The frequency that data will be collected from the Data Source?": "தரவு மூலத்திலிருந்து தரவு எவ்வளவு அடிக்கடி சேகரிக்கப்படும்?"
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "RRA விவரக்குறிப்பில் ஒரு வரிசையை நிரப்புவதற்கு முன் தேவையான மாதிரிகளின் எண்ணிக்கை. முதல் RRA எப்போதும் 1 என்ற மதிப்பைக் கொண்டிருக்க வேண்டும்."
"The polling interval, X-Files Factor, Consolidation Functions and RRAs cannot be changed.": "போலிங் இடைவெளி, X-Files காரணி, ஒருங்கிணைப்புச் செயல்கூறுகள் மற்றும் RRA-களை மாற்ற முடியாது."
"This legacy Data Source Profile form has expired. Open Data Source Profiles and submit a new form.": "இந்த மரபு தரவு மூல சுயவிவரப் படிவம் காலாவதியாகிவிட்டது. தரவு மூல சுயவிவரங்களைத் திறந்து புதிய படிவத்தைச் சமர்ப்பிக்கவும்."
"Title Format": "தலைப்பு வடிவம்"
"To change the default, mark another profile as the default.": "இயல்புநிலையை மாற்ற, மற்றொரு சுயவிவரத்தை இயல்புநிலையாகக் குறிக்கவும்."
"Unable to load Data Source Profiles. Reload before retrying.": "தரவு மூல சுயவிவரங்களை ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
"When viewing a Graph based upon the RRA in question, the default Timespan to show for that Graph.": "கேள்விக்குரிய RRA-இன் அடிப்படையில் ஒரு வரைபடத்தைப் பார்க்கும்போது, அந்த வரைபடத்திற்குக் காட்ட வேண்டிய இயல்புநிலை கால அளவு."
