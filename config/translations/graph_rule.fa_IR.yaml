"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "هر یک از انواع نمودار موجودِ پرس‌وجوی داده انتخاب‌شده را برای اعمال در این قانون برگزینید."
"Data Query": "پرس‌وجوی داده"
"Device Selection and Graph Creation Criteria": "معیارهای انتخاب دستگاه و ایجاد نمودار"
"Edit Graph Rule": "ویرایش قانون نمودار"
