"Enter a name.": "یک نام وارد کنید."
"Enter at most %count% characters.": "حداکثر %count% نویسه وارد کنید."
"Enter single-line text.": "متن تک‌خطی وارد کنید."
"Graph Type": "نوع نمودار"
"Graph rule not found.": "قانون نمودار یافت نشد."
"Graph rule saved.": "قانون نمودار ذخیره شد."
"Name": "نام"
"Rule Selection [edit: %name%]": "انتخاب قانون [ویرایش: %name%]"
"Rule Selection [new]": "انتخاب قانون [جدید]"
"Save": "ذخیره"
"Save outcome is uncertain. Reload before retrying.": "نتیجه ذخیره نامشخص است. پیش از تلاش مجدد دوباره بارگذاری کنید."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "ابتدا قانون را ذخیره کنید؛ معیارهای انتخاب دستگاه و ایجاد نمودار آن پس از آن افزوده می‌شوند."
"The graph rule changed since you opened this form. Reload before saving.": "قانون نمودار از زمانی که این فرم را باز کرده‌اید تغییر کرده است. پیش از ذخیره دوباره بارگذاری کنید."
"Unable to load the graph rule. Reload before retrying.": "امکان بارگذاری قانون نمودار وجود ندارد. پیش از تلاش مجدد دوباره بارگذاری کنید."
"Unexpected fields were submitted.": "فیلدهای غیرمنتظره‌ای ارسال شدند."
