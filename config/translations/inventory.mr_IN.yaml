"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "या डिव्हाइसेसवर सध्याची नेमलेली टेम्पलेट्स लागू करा. गहाळ ग्राफ आणि डेटा-क्वेरी सहसंबंध जोडले जातात, आणि न वापरलेले ग्राफ-टेम्पलेट सहसंबंध काढले जाऊ शकतात. टेम्पलेट नसलेली डिव्हाइसेस वगळली जातात. विद्यमान ग्राफ आणि ऐतिहासिक डेटा राखला जातो; ऑटोमेशन नवीन ग्राफ तयार करू शकते."
