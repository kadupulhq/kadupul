"Device automation rules applied.": "डिव्हाइस ऑटोमेशन नियम लागू केले."
"Apply existing graph and tree automation rules to the selected devices. Rules may create graphs, data sources and tree entries.": "निवडलेल्या डिव्हाइसेसवर विद्यमान ग्राफ आणि ट्री ऑटोमेशन नियम लागू करा. नियमांमुळे ग्राफ, डेटा स्रोत आणि ट्री नोंदी तयार होऊ शकतात."
"Only checked SNMP settings are changed. Unchecked settings and credentials retain their current values.": "केवळ निवडलेल्या SNMP सेटिंग्ज बदलल्या जातात. अनचेक केलेल्या सेटिंग्ज आणि क्रेडेन्शियल्स त्यांची सध्याची मूल्ये कायम ठेवतात."
"Select at least one supported SNMP setting.": "किमान एक समर्थित SNMP सेटिंग निवडा."
"Invalid location search.": "अवैध स्थान शोध."
