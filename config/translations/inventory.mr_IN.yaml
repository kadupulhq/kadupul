"Select a removal policy.": "काढण्याचे धोरण निवडा."
"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "निवडलेली डिव्हाइसेस किंवा त्यांचे ग्राफ आणि डेटा स्रोत बदलले आहेत. डिव्हाइसेस काढण्यापूर्वी पुष्टी पुन्हा लोड करा."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "ग्राफ आणि डेटा स्रोत काढण्यापूर्वी सामायिक डेटा स्रोत किंवा एकत्रित ग्राफ वेगळे करणे आवश्यक आहे."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "डिव्हाइस काढण्याचा परिणाम अनिश्चित आहे. पुन्हा प्रयत्न करण्यापूर्वी निवडलेली डिव्हाइसेस, ग्राफ आणि डेटा स्रोत तपासा."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "डिव्हाइस काढणे येथे पूर्ववत करता येत नाही. ग्राफ आणि अक्षम डेटा स्रोत ठेवायचे की काढून टाकायचे ते निवडा."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "ग्राफ काढण्यापूर्वी सामायिक डेटा स्रोत आणि एकत्रित ग्राफ वेगळे करणे आवश्यक आहे. राखलेले ग्राफ आणि डेटा स्रोत अनियुक्त होतात."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "प्रभावित रिमोट कलेक्टर्स ऑनलाइन असणे आवश्यक आहे. अयशस्वी काढण्यामुळे रिमोट किंवा प्लगइन बदल शिल्लक राहू शकतात; पुन्हा प्रयत्न करण्यापूर्वी परिणामाचे निरीक्षण करा."
