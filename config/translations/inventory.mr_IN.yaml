"Changing templates adds their graph and data-query associations and removes unused graph associations. Existing graphs and collected data are retained. Unassigning keeps current associations.": "टेम्पलेट्स बदलल्याने त्यांचे ग्राफ आणि डेटा-क्वेरी सहसंबंध जोडले जातात आणि न वापरलेले ग्राफ सहसंबंध काढले जातात. विद्यमान ग्राफ आणि संकलित डेटा राखला जातो. नेमणूक रद्द केल्याने सध्याचे सहसंबंध कायम राहतात."
"Remote collectors must be online. Reload and verify the device after a failed assignment before retrying.": "रिमोट कलेक्टर्स ऑनलाइन असणे आवश्यक आहे. अयशस्वी नेमणुकानंतर पुन्हा प्रयत्न करण्यापूर्वी डिव्हाइस रीलोड करा आणि पडताळणी करा."
"Select supported SNMP settings.": "समर्थित SNMP सेटिंग्ज निवडा."
