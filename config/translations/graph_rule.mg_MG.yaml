"A useful name for this Rule.": "Anarana ilaina ho an'ity Fitsipika ity."
"Access denied.": "Tsy nahazo alalana."
"Add Graph Rule": "Hanampy fitsipika kisary"
"Back to Graph Rules": "Hiverina any amin'ny Fitsipika kisary"
"Cancel": "Aoka ihany"
"Check this box to enable this rule.": "Mariho ity efajoro ity mba handefasana ity fitsipika ity."
"Choose a Data Query to apply to this rule.": "Misafidiana Fangatahan-drakitra hampiharina amin'ity fitsipika ity."
"Choose a Graph Type": "Misafidiana karazana kisary"
"Choose a Graph Type of the selected Data Query.": "Misafidiana karazana kisary amin'ny Fangatahana angona voafidy."
"Choose an existing Data Query.": "Misafidiana Fangatahana angona efa misy."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Misafidiana amin'ireo Karazana kisary misy ao amin'ny Fangatahana angona voafidy mba hampiharina amin'ity fitsipika ity."
"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "Kitiho ny Tohizo mba hamafana ireto Fitsipika kisary manaraka ireto miaraka amin'ny Fifidianana fitaovana sy ny Fepetra famoronana kisary."
"Click Continue to disable the following Graph Rules.": "Kitiho ny Tohizo mba hampitsaharana ireto Fitsipika kisary manaraka ireto."
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "Kitiho ny Tohizo mba handikana ireto Fitsipika kisary manaraka ireto. Azonao ovaina raha tianao ny endriky ny lohateny ho an'ireo Fitsipika kisary vaovao, izay manomboka tsy mandeha."
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "Kitiho ny Tohizo mba hampandehanana ireto Fitsipika kisary manaraka ireto. Ataovy azo antoka fa nandeha tsara ny fitsapana azy ireo."
"Continue": "Tohizo"
"Data Query": "Fangatahana angon-drakitra"
"Delete Graph Rules": "Hamafa fitsipika kisary"
"Delete outcome is uncertain. Check the Graph Rule list before retrying.": "Tsy azo antoka ny vokatry ny famafana. Jereo ny lisitry ny Fitsipika kisary alohan'ny hanandramana indray."
"Delete selected": "Hamafa izay voafidy"
"Device Selection and Graph Creation Criteria": "Fifidianana fitaovana sy Fepetra famoronana kisary"
"Disable Graph Rules": "Hampitsahatra fitsipika kisary"
"Disable outcome is uncertain. Check the Graph Rule list before retrying.": "Tsy azo antoka ny vokatry ny fampitsaharana. Jereo ny lisitry ny Fitsipika kisary alohan'ny hanandramana indray."
"Disable selected": "Hampitsahatra ireo voafidy"
"Duplicate Graph Rules": "Handika fitsipika kisary"
"Duplicate outcome is uncertain. Check the Graph Rule list before retrying.": "Tsy azo antoka ny vokatry ny fandikana. Jereo ny lisitry ny Fitsipika kisary alohan'ny hanandramana indray."
"Duplicate selected": "Ataovy kopia izay voafidy"
"Edit Graph Rule": "Hanova fitsipika kisary"
"Enable Graph Rules": "Hampandeha fitsipika kisary"
"Enable Rule": "Alefaso ny fitsipika"
"Enable outcome is uncertain. Check the Graph Rule list before retrying.": "Tsy azo antoka ny vokatry ny fampandehanana. Jereo ny lisitry ny Fitsipika kisary alohan'ny hanandramana indray."
"Enable selected": "Hampandeha ireo voafidy"
"Enter a name.": "Ampidiro ny anarana."
"Enter a valid name format.": "Ampidiro endrika anarana manan-kery."
"Enter at most %count% characters.": "Mampidira soratra farafahabetsany %count%."
"Enter single-line text.": "Mampidira lahatsoratra andalana tokana."
"Every <rule_name> is replaced by the name of the Graph Rule being copied.": "Ny <rule_name> tsirairay dia soloina ny anaran'ny Fitsipika kisary adika."
"Graph Type": "Karazana Kisary"
"Graph rule not found.": "Tsy hita ny fitsipika kisary."
"Graph rule saved.": "Voatahiry ny fitsipika kisary."
"Invalid Graph Rule selection.": "Tsy manan-kery ny fifidianana Fitsipika kisary."
"Name": "Anarana"
"One or more selected Graph Rules no longer exist.": "Tsy misy intsony ny Fitsipika kisary iray na maromaro voafidy."
"Rule Selection [edit: %name%]": "Fifantenana Fitsipika [fanovana: %name%]"
"Rule Selection [new]": "Fifidianana fitsipika [vaovao]"
"Save": "Tahirizo"
"Save outcome is uncertain. Reload before retrying.": "Tsy azo antoka ny valin'ny fitahirizana. Havaozy alohan'ny hanandramana indray."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Tehirizo aloha ny fitsipika; ampiana avy eo ny Fifidianana fitaovana sy ny Fepetra famoronana kisary."
"Select": "Fidio"
"Select %name%": "Fidio ny %name%"
"Select at least one Graph Rule.": "Misafidiana Fitsipika kisary iray farafahakeliny."
"Select at most 100 Graph Rules at a time.": "Misafidiana Fitsipika kisary 100 farafahabetsany indray mandeha."
"Select up to %count% rows at a time.": "Fidio hatramin'ny andalana %count% indray mandeha."
"The graph rule changed since you opened this form. Reload before saving.": "Niova ny fitsipika kisary hatramin'ny nanokafanao ity taratasy fenoina ity. Avereno alaina alohan'ny hitahirizana."
"The name format must give every copy a name of 1 to 255 characters.": "Ny endriky ny anarana dia tsy maintsy manome anarana misy tarehintsoratra 1 hatramin'ny 255 ho an'ny dika mitovy tsirairay."
"Title Format": "Endriky ny lohateny"
"Unable to load Graph Rules. Reload before retrying.": "Tsy azo alaina ireo Fitsipika kisary. Avereno alaina alohan'ny hanandramana indray."
"Unable to load the graph rule. Reload before retrying.": "Tsy azo alaina ny fitsipika kisary. Avereno alaina alohan'ny hanandramana indray."
"Unexpected fields were submitted.": "Nisy saha tsy nampoizina nalefa."
