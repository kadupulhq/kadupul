"Action": "Action"
"Advanced options": "Options avancées"
"Applying database upgrades": "Mise à niveau de la base de données"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Sauvegardez la base de données, les fichiers RRD, la configuration et les clés. Une mise à niveau peut valider des modifications qu’un retour à la version précédente de l’application ne peut pas annuler."
"Blocked": "Bloqué"
"Check": "Vérification"
"Check again": "Vérifier à nouveau"
"Check collection freshness and collector connectivity before enabling discovery.": "Vérifiez la fraîcheur des données et la connectivité des collecteurs avant d’activer la découverte."
"Check requirements": "Vérifier les prérequis"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Les vérifications examinent ce processus et les permissions des fichiers. Elles ne créent pas de fichiers de test et ne contactent aucun équipement."
