"I accept the license terms": "J’accepte les conditions de la licence"
"I authorize discovery of the displayed range": "J’autorise la découverte de la plage affichée"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "J’ai vérifié le journal et confirmé l’arrêt du processus précédent et de ses processus enfants"
"I checked the previous attempt and accept that some changes may already be committed": "J’ai vérifié la tentative précédente et j’accepte que certaines modifications soient déjà validées"
"I reviewed this plan and have the required backups": "J’ai examiné ce plan et je dispose des sauvegardes nécessaires"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Si un processus s’arrête de façon inattendue, conservez log/cacti.log et confirmez son arrêt avant de relancer explicitement l’opération. L’état en attente ne confirme pas le démarrage."
"Importing templates": "Importation des modèles"
"Install Kadupul": "Installer Kadupul"
"Installation and upgrade": "Installation et mise à niveau"
"Installation request was rejected.": "La demande d’installation a été refusée."
"Installation steps": "Étapes de l’installation"
"Installed": "Installé"
"Keep a backup of the database, RRD files, configuration and secret material.": "Conservez une sauvegarde de la base de données, des fichiers RRD, de la configuration et des secrets."
"Language": "Langue"
"Large tables may require the dedicated CLI conversion tool before installation.": "Les grandes tables peuvent nécessiter l’outil de conversion en ligne de commande avant l’installation."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Laissez les champs secrets vides pour conserver les identifiants enregistrés. Les secrets ne sont jamais réaffichés."
