"Finished execution": "Exécution terminée"
"Finishing tasks only. Schema migrations will not be replayed.": "Tâches de finalisation uniquement. Les migrations du schéma ne seront pas répétées."
"I accept the license terms": "J’accepte les conditions de la licence"
"I authorize discovery of the displayed range": "J’autorise la découverte de la plage affichée"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "J’ai vérifié le journal et confirmé l’arrêt du processus précédent et de ses processus enfants"
"I checked the previous attempt and accept that some changes may already be committed": "J’ai vérifié la tentative précédente et j’accepte que certaines modifications soient déjà validées"
"I reviewed this plan and have the required backups": "J’ai examiné ce plan et je dispose des sauvegardes nécessaires"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Si un processus s’arrête de façon inattendue, conservez log/cacti.log et confirmez son arrêt avant de relancer explicitement l’opération. L’état en attente ne confirme pas le démarrage."
"Importing templates": "Importation des modèles"
"Install Kadupul": "Installer Kadupul"
"Installation and upgrade": "Installation et mise à niveau"
"Installation request was rejected.": "La demande d’installation a été refusée."
"Installation steps": "Étapes de l’installation"
"Installed": "Installé"
"Keep a backup of the database, RRD files, configuration and secret material.": "Conservez une sauvegarde de la base de données, des fichiers RRD, de la configuration et des secrets."
"Language": "Langue"
"Large tables may require the dedicated CLI conversion tool before installation.": "Les grandes tables peuvent nécessiter l’outil de conversion en ligne de commande avant l’installation."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Laissez les champs secrets vides pour conserver les identifiants enregistrés. Les secrets ne sont jamais réaffichés."
"License": "Licence"
"No action needed": "Aucune action nécessaire"
"Observed": "Valeur observée"
"Open the console": "Ouvrir la console"
"Operation": "Opération"
"Override discovery SNMP settings": "Remplacer les paramètres SNMP de découverte"
"Pass": "Réussi"
"Poller interval in seconds": "Intervalle de collecte en secondes"
"Preparing CSRF protection": "Préparation de la protection CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "La progression indique la dernière phase enregistrée. Actualiser cette page ne démarre et ne relance jamais un processus."
"Recover stopped attempt": "Récupérer la tentative arrêtée"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "La récupération conserve les choix enregistrés et n’arrête jamais un processus actif. Réexaminez le plan avant de réessayer."
"Review": "Examiner"
"Review installation plan": "Examiner le plan d’installation"
"Run": "Exécuter"
"Run reviewed plan": "Exécuter le plan examiné"
"Save and review": "Enregistrer et examiner"
"Scope": "Périmètre"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "L’état est indisponible. Les données enregistrées sont conservées. Actualisez pour vous reconnecter ; ne soumettez pas une autre installation."
"Synchronizing collectors": "Synchronisation des collecteurs"
"Table conversions": "Conversions des tables"
"Templates": "Modèles"
"The database version matches this application. Installation does not establish that polling is healthy.": "La version de la base de données correspond à cette application. L’installation ne garantit pas le bon fonctionnement de la collecte."
"The request outcome is unknown. Check execution status before retrying.": "Le résultat de la demande est inconnu. Vérifiez l’état de l’exécution avant de réessayer."
"Theme": "Thème"
"Verify": "Vérifier"
"Verify the poller schedule and service account.": "Vérifiez la planification de la collecte et le compte de service."
"Version change": "Changement de version"
"Waiting for the installation worker": "En attente du processus d’installation"
"collector": "collecteur"
"complete": "terminé"
"failed": "échec"
"finish": "finalisation"
"install": "installation"
"not_started": "non démarré"
"partial": "partiel"
"running": "en cours"
"succeeded": "réussi"
"upgrade": "mise à niveau"
"waiting": "en attente"
"Accept the license before saving the installation plan.": "Acceptez la licence avant d’enregistrer le plan d’installation."
"Invalid installation form.": "Formulaire d’installation invalide."
"Access denied.": "Accès refusé."
"Confirm the recovery warning before retrying.": "Confirmez l’avertissement de récupération avant de réessayer."
"Review and confirm the current installation plan.": "Examinez et confirmez le plan d’installation actuel."
"Confirm the discovery scope before starting.": "Confirmez le périmètre de découverte avant de commencer."
"Resolve the blocking checks before starting.": "Corrigez les prérequis bloquants avant de commencer."
"Too many installer options.": "Trop d’options d’installation."
"Invalid installer option name.": "Nom d’option d’installation invalide."
"Unknown or malformed installer option.": "Option d’installation inconnue ou mal formée."
"Installer options must be scalar values.": "Les options d’installation doivent être des valeurs scalaires."
"Installer option is too long or contains a null byte.": "Une option d’installation est trop longue ou contient un octet nul."
"Installer IDs and intervals must be whole numbers.": "Les identifiants et intervalles d’installation doivent être des nombres entiers."
"Installer ID or interval is outside its supported range.": "Un identifiant ou intervalle d’installation est hors de la plage autorisée."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "L’installation n’a pas pu continuer. Actualisez son état et examinez les prérequis bloquants avant de réessayer."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirmez l’arrêt du processus précédent avant de récupérer son plan."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "La base de données est installée, mais certains collecteurs doivent encore être synchronisés. Vérifiez leur état avant de relancer les tâches de finalisation."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "L’installation s’est arrêtée. Conservez le journal, corrigez la cause et confirmez explicitement une nouvelle tentative. Certaines modifications de la base peuvent déjà être validées. Vérifiez le nettoyage des extensions avant d’autoriser une nouvelle tentative."

"Next action": "Prochaine action"
"Follow the execution status. Do not start another attempt while a worker is active.": "Suivez l’état d’exécution. Ne lancez pas une autre tentative tant qu’un processus est actif."
"Complete the recovery checklist before retrying.": "Suivez la liste de vérification de récupération avant de réessayer."
"Verify collection and graph operation before enabling discovery.": "Vérifiez le fonctionnement de la collecte et des graphiques avant d’activer la découverte."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Corrigez les prérequis bloquants, puis relancez la vérification. Les sélections enregistrées sont conservées."
"Review the planned changes and backup checklist before authorizing execution.": "Examinez les modifications prévues et la liste de sauvegarde avant d’autoriser l’exécution."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Choisissez un profil de collecte et acceptez la licence. Les paramètres facultatifs peuvent être ouverts au besoin."
"Download installation diagnostics": "Télécharger le diagnostic d’installation"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Ouvrez un graphique et vérifiez que ses données RRD sont actualisées après un cycle de collecte."
"Requirement details": "Détails des prérequis"
"Recover": "Récupérer"
"Recovery checklist": "Liste de vérification de récupération"
"Preserve log/cacti.log and record the failed attempt.": "Conservez log/cacti.log et notez la tentative ayant échoué."
"Confirm that the previous worker and its child processes have stopped.": "Vérifiez que le processus précédent et ses processus enfants sont arrêtés."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Examinez les modifications validées, la synchronisation des collecteurs et le nettoyage des extensions. Corrigez la cause avant de réessayer."
"Review the saved plan again, then explicitly authorize a retry.": "Examinez à nouveau le plan enregistré, puis autorisez explicitement une nouvelle tentative."
"Recover a stopped worker": "Récupérer une tentative interrompue"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "N’utilisez la récupération qu’après avoir vérifié que cette tentative n’est plus en cours. La récupération n’arrête aucun processus."
"Collector and installation mode": "Collecteur et mode d’installation"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "La configuration du déploiement détermine le rôle du collecteur et les connexions aux bases de données. Vérifiez la configuration du serveur principal avant de démarrer un collecteur."
"Discovery and SNMP settings": "Paramètres de découverte et SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Laissez la découverte désactivée jusqu’à la vérification de la collecte et de la connectivité des collecteurs."
"Template selection": "Sélection des modèles"
"Templates selected for import": "Modèles sélectionnés pour l’importation"
"No templates selected.": "Aucun modèle sélectionné."
"Backup checklist": "Liste de vérification des sauvegardes"
"Database backup and a tested restoration procedure.": "Sauvegarde de la base de données et procédure de restauration testée."
"RRD files and the service account permissions needed to restore them.": "Fichiers RRD et autorisations du compte de service nécessaires à leur restauration."
"Configuration, keys and plugin data outside the database.": "Configuration, clés et données des extensions situées hors de la base de données."
"Post-installation checks": "Vérifications après installation"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Les vérifications effectuées couvrent uniquement les éléments présentés. Les points non évalués doivent encore être vérifiés par l’opérateur."
"Operational checks still require operator verification.": "Les contrôles opérationnels doivent encore être effectués par l’opérateur."
"Status": "État"
"verified": "Vérifié"
"action_required": "Action requise"
"not_assessed": "Non évalué"

"Database schema": "Schéma de la base de données"
"Stored schema matches the application target.": "Le schéma enregistré correspond à la version cible de l’application."
"Target schema completion has not been confirmed.": "La mise en place du schéma cible n’a pas été confirmée."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Examinez le résultat de l’installation et corrigez les échecs avant de considérer la mise à niveau du schéma comme terminée."
"Installation outcome": "Résultat de l’installation"
"A successful receipt matches the current target schema.": "Un compte rendu de réussite correspond au schéma cible actuel."
"A complete successful installation outcome has not been confirmed.": "La réussite complète de l’installation n’a pas été confirmée."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Conservez le journal d’installation et suivez la procédure explicite de récupération ou de nouvelle tentative si nécessaire."
"Collector synchronization": "Synchronisation des collecteurs"
"The completed installer reports pending collector synchronization.": "L’installation terminée signale des synchronisations de collecteurs en attente."
"The completed installer reports no pending collectors.": "L’installation terminée ne signale aucun collecteur en attente."
"Collector completion remains unconfirmed by this partial receipt.": "Ce compte rendu partiel ne confirme pas la finalisation des collecteurs."
"Collector completion is not established by this installation outcome.": "Ce résultat d’installation n’établit pas la finalisation des collecteurs."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Examinez l’état des collecteurs et relancez les tâches de finalisation en cas de résultat partiel. Cela ne vérifie pas la fraîcheur des collectes ultérieures."
"Scheduled collection": "Collecte planifiée"
"No poller or device was contacted by this assessment.": "Cette évaluation n’a contacté aucun processus de collecte ni aucun équipement."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Vérifiez que le planificateur configuré lance la collecte avec le compte de service prévu, puis examinez le prochain cycle normal."
"Graph data": "Données des graphiques"
"Live samples and RRD updates were not exercised.": "Les échantillons en temps réel et les mises à jour RRD n’ont pas été testés."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Après un cycle normal de collecte, vérifiez que les graphiques attendus reçoivent des échantillons récents et examinez les erreurs de collecte."
"Recovery readiness": "Préparation à la récupération"
"Backup restoration was not exercised.": "La restauration des sauvegardes n’a pas été testée."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Vérifiez une restauration isolée de la base de données, des fichiers RRD, de la configuration et des clés avant de compter sur la récupération."
"No persisted local poller start has been recorded.": "Aucun démarrage du processus de collecte local n’a été enregistré."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Les horaires de collecte enregistrés sont invalides et ne permettent pas d’établir le bon fonctionnement du planificateur."
"The recorded poller start is in the future. Check clock synchronization.": "Le démarrage de collecte enregistré se situe dans le futur. Vérifiez la synchronisation des horloges."
"The recorded poller start is older than the native scheduling tolerance.": "Le démarrage de collecte enregistré est trop ancien selon la tolérance de planification native."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Un démarrage de collecte local a été enregistré dans la tolérance de planification native. La fin de la collecte et l’état des équipements ne sont pas vérifiés."

"readable": "lisible"
"missing or unreadable": "absent ou illisible"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaurez la version complète et ses dépendances verrouillées ; accordez un accès en lecture au compte de service."
"PHP temporary directory": "Répertoire temporaire PHP"
"directory writable by this process": "répertoire accessible en écriture à ce processus"
"missing or not writable": "absent ou inaccessible en écriture"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configurez sys_temp_dir vers un répertoire existant accessible en écriture au compte d’installation. Les importations natives utilisent des fichiers temporaires."
"Background worker launch": "Lancement du processus en arrière-plan"
"required PHP functions available; launch not exercised": "fonctions PHP requises disponibles ; lancement non testé"
"required PHP launch function disabled": "fonction PHP requise pour le lancement désactivée"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Activez exec dans le PHP du serveur web ou utilisez l’installateur en ligne de commande avec les autorisations requises."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Activez popen et pclose dans le PHP du serveur web ou utilisez l’installateur en ligne de commande avec les autorisations requises."
"Database transaction ownership": "Propriété des transactions de la base de données"
"autocommit enabled; no caller-owned transaction": "autocommit activé ; aucune transaction appartenant à l’appelant"
"autocommit disabled or caller transaction active": "autocommit désactivé ou transaction de l’appelant active"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Exécutez l’installation hors d’une transaction appartenant à l’appelant et activez autocommit sur sa connexion de modification."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaurez le répertoire de la version et accordez un accès en écriture au compte d’installation pour importer les ressources des modèles. N’accordez pas un accès en écriture à tout le monde."
"Worker file: install/background.php": "Fichier du processus : install/background.php"
"Worker file: bin/legacy-installer.php": "Fichier du processus : bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fichier du processus : include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destination des importations : resource/snmp_queries"
"Import destination: resource/script_server": "Destination des importations : resource/script_server"
"Import destination: resource/script_queries": "Destination des importations : resource/script_queries"
"Import destination: scripts": "Destination des importations : scripts"

"Database privileges": "Privilèges de la base de données"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Les privilèges effectifs de migration, y compris les rôles actifs et les droits propres aux objets, n’ont pas été vérifiés."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Demandez à l’administrateur de la base de données de vérifier les droits nécessaires aux écritures de tables, aux modifications de schéma, aux déclencheurs et aux routines pour le compte et le schéma d’installation. N’accordez pas de privilèges d’administration globaux."
