"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Tämä on yksilöllinen merkkijono, joka verrataan laitteen sysName-merkkijonoon sen yhdistämiseksi tähän automaation malliin. Mitä tahansa Perl-säännöllistä lauseketta voi käyttää SQL Where -lausekkeiden lisäksi."
