"A description for this data query.": "இந்தத் தரவு வினவலுக்கான விளக்கம்."
"A name for this data query.": "இந்தத் தரவு வினவலுக்கான பெயர்."
"Access denied.": "அணுகல் மறுக்கப்பட்டது."
"Add Data Query": "தரவு வினவல் சேர்"
"Associated Graph Templates": "தொடர்புடைய வரைபட வார்ப்புருக்கள்"
"Back to Data Queries": "தரவு வினவல்களுக்குத் திரும்பு"
"Choose a Data Input Method": "ஒரு தரவு உள்ளீட்டு முறையைத் தேர்ந்தெடுக்கவும்"
"Choose an existing Data Input Method.": "ஏற்கனவே உள்ள தரவு உள்ளீட்டு முறையைத் தேர்ந்தெடுக்கவும்."
"Choose the input method for this Data Query.  This input method defines how data is collected for each Device associated with the Data Query.": "இந்தத் தரவு வினவலுக்கான உள்ளீட்டு முறையைத் தேர்ந்தெடுக்கவும். தரவு வினவலுடன் தொடர்புடைய ஒவ்வொரு சாதனத்திற்கும் தரவு எவ்வாறு சேகரிக்கப்படுகிறது என்பதை இந்த உள்ளீட்டு முறை வரையறுக்கிறது."
"Could not locate XML file.": "XML கோப்பைக் கண்டறிய முடியவில்லை."
"Data Input Method": "தரவு உள்ளீட்டு முறை"
"Data Queries [edit: %name%]": "தரவு வினவல்கள் [திருத்து: %name%]"
"Data Queries [new]": "தரவு வினவல்கள் [புதியது]"
"Data query not found.": "தரவு வினவல் கிடைக்கவில்லை."
"Data query saved, but a Remote Data Collector was down and did not receive the poller cache change. Perform a Full Sync once it is up again.": "தரவு வினவல் சேமிக்கப்பட்டது, ஆனால் ஒரு தொலைநிலை தரவு சேகரிப்பான் செயலிழந்திருந்ததால் போலர் தற்காலிக சேமிப்பு மாற்றத்தைப் பெறவில்லை. அது மீண்டும் இயங்கியதும் முழு ஒத்திசைவைச் செய்யவும்."
"Data query saved.": "தரவு வினவல் சேமிக்கப்பட்டது."
"Description": "விளக்கம்"
"Edit Data Query": "தரவு வினவலைத் திருத்து"
"Enter a value.": "ஒரு மதிப்பை உள்ளிடவும்."
"Enter at most %count% characters.": "அதிகபட்சம் %count% எழுத்துகள் உள்ளிடவும்."
"Enter single-line text.": "ஒற்றை வரி உரையை உள்ளிடவும்."
"Enter the path of a readable XML file under the resource directory.": "வள கோப்பகத்தின் கீழ் படிக்கக்கூடிய XML கோப்பின் பாதையை உள்ளிடவும்."
"Invalid command.": "தவறான கட்டளை."
"Name": "பெயர்"
"Save": "சேமி"
"Save outcome is uncertain. Reload before retrying.": "சேமிப்பின் முடிவு உறுதியற்றது. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Save the data query first; its Graph Templates are associated afterwards.": "முதலில் தரவு வினவலைச் சேமிக்கவும்; அதன் வரைபட வார்ப்புருக்கள் பின்னர் தொடர்புபடுத்தப்படும்."
"Successfully located XML file": "XML கோப்பு வெற்றிகரமாகக் கண்டறியப்பட்டது"
"The data query changed since you opened this form. Reload before saving.": "இந்தப் படிவத்தைத் திறந்த பிறகு தரவு வினவல் மாறிவிட்டது. சேமிப்பதற்கு முன் மீண்டும் ஏற்றவும்."
"The full path to the XML file containing definitions for this data query.": "இந்தத் தரவு வினவலுக்கான வரையறைகளைக் கொண்ட XML கோப்பின் முழுப் பாதை."
"Unable to load the data query. Reload before retrying.": "தரவு வினவலை ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
"XML Path": "XML பாதை"
