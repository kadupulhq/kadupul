"Installer ID or interval is outside its supported range.": "Yükleyici Kimliği veya aralığı desteklenen aralığın dışında."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Kurulum devam edemedi. Yeniden denemeden önce durumunu yeniden yükleyin ve engelleyen kontrolleri inceleyin."
"Confirm that the previous worker has stopped before recovering its plan.": "Planını kurtarmadan önce önceki çalışanın durduğunu onaylayın."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Veritabanı kuruldu, ancak bazı toplayıcıların hala eşitlenmesi gerekiyor. Durumlarını kontrol ettikten sonra bitirme görevlerini yeniden deneyin."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Kurulum durduruldu. Kurulum günlüğünü koruyun, nedeni düzeltin ve yeniden denemeyi açıkça onaylayın. Bazı veritabanı değişiklikleri zaten işlenmiş olabilir. Yeniden denemeye izin vermeden önce eklenti temizliğini kontrol edin."
"Next action": "Sonraki işlem"
"Follow the execution status. Do not start another attempt while a worker is active.": "Yürütme durumunu takip edin. Bir çalışan etkinken başka bir deneme başlatmayın."
"Complete the recovery checklist before retrying.": "Yeniden denemeden önce kurtarma kontrol listesini tamamlayın."
"Verify collection and graph operation before enabling discovery.": "Keşfi etkinleştirmeden önce toplama ve grafik işlemini doğrulayın."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Engellenen gereksinimleri çözün, ardından tekrar kontrol edin. Kaydedilen seçimler korunur."
"Review the planned changes and backup checklist before authorizing execution.": "Yürütmeye izin vermeden önce planlanan değişiklikleri ve yedekleme kontrol listesini inceleyin."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Bir toplama profili seçin ve lisansı kabul edin. İsteğe bağlı ayarlar gerektiğinde açılabilir."
"Download installation diagnostics": "Kurulum tanılamasını indir"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Bir grafik açın ve bir yoklama döngüsünden sonra RRD verilerinin güncellendiğini doğrulayın."
"Requirement details": "Gereksinim ayrıntıları"
"Recover": "Kurtar"
"Recovery checklist": "Kurtarma kontrol listesi"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log dosyasını koruyun ve başarısız denemeyi kaydedin."
"Confirm that the previous worker and its child processes have stopped.": "Önceki çalışanın ve alt işlemlerinin durduğunu onaylayın."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "İşlenen değişiklikleri, toplayıcı eşitlemesini ve eklenti temizliğini inceleyin. Yeniden denemeden önce nedeni düzeltin."
"Review the saved plan again, then explicitly authorize a retry.": "Kaydedilen planı tekrar inceleyin, ardından yeniden denemeyi açıkça yetkilendirin."
"Recover a stopped worker": "Durdurulmuş bir çalışanı kurtar"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Kurtarma işlemini yalnızca bu denemenin artık çalışmadığını doğruladıktan sonra kullanın. Kurtarma işlemi bir süreci durdurmaz."
"Collector and installation mode": "Toplayıcı ve kurulum modu"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Dağıtım yapılandırması toplayıcı rolünü ve veritabanı bağlantılarını belirler. Bir toplayıcıyı başlatmadan önce birincil sunucu yapılandırmasını doğrulayın."
"Discovery and SNMP settings": "Keşif ve SNMP ayarları"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Toplama ve toplayıcı bağlantısı doğrulanana kadar keşfi devre dışı bırakın."
