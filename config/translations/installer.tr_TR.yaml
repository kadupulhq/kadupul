"directory writable by this process": "bu işlem tarafından yazılabilir dizin"
"missing or not writable": "eksik veya yazılabilir değil"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir ayarını kurulum hesabı tarafından yazılabilir mevcut bir dizin olarak yapılandırın. Yerel içe aktarma işlemleri geçici dosyalar kullanır."
"Background worker launch": "Arka plan çalışanı başlatma"
"required PHP functions available; launch not exercised": "gerekli PHP işlevleri mevcut; başlatma test edilmedi"
"required PHP launch function disabled": "gerekli PHP başlatma işlevi devre dışı"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Web PHP çalışma zamanı için exec işlevini etkinleştirin veya yetkili CLI yükleyicisini kullanın."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Web PHP çalışma zamanı için popen, pclose işlevlerini etkinleştirin veya yetkili CLI yükleyicisini kullanın."
"Database transaction ownership": "Veritabanı işlem (transaction) sahipliği"
"autocommit enabled; no caller-owned transaction": "autocommit etkin; çağıranın sahip olduğu işlem yok"
"autocommit disabled or caller transaction active": "autocommit devre dışı veya çağıran işlemi etkin"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Kurulumu çağıranın sahip olduğu bir işlem (transaction) dışında çalıştırın ve değişiklik bağlantısında autocommit özelliğini etkinleştirin."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Sürüm dizinini geri yükleyin ve şablon kaynağı içe aktarma işlemleri için kurulum hesabına yazma erişimi verin. Herkes tarafından yazılabilir yapmayın."
"Worker file: install/background.php": "Çalışan dosyası: install/background.php"
"Worker file: bin/legacy-installer.php": "Çalışan dosyası: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Çalışan dosyası: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "İçe aktarma hedefi: resource/snmp_queries"
"Import destination: resource/script_server": "İçe aktarma hedefi: resource/script_server"
"Import destination: resource/script_queries": "İçe aktarma hedefi: resource/script_queries"
"Import destination: scripts": "İçe aktarma hedefi: scripts"
"Database privileges": "Veritabanı ayrıcalıkları"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Etkin roller ve nesneye özgü izinler dahil olmak üzere etkin geçiş ayrıcalıkları doğrulanmadı."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Veritabanı yöneticisinin kurulum hesabı ve şema için gerekli tablo yazma izinlerini, şema değişikliklerini, tetikleyicileri ve yordamları doğrulamasını sağlayın. Genel yönetici ayrıcalıkları vermeyin."
"Compare web and worker runtimes": "Web ve çalışan (worker) çalışma zamanlarını karşılaştır"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Bu işlem açıkça kısa bir salt okunur PHP yoklaması başlatır. Bir yükleyici ayırmaz, dosya yazmaz veya cihazlarla iletişim kurmaz."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Yoklama bu web işlemini devralır ve yapılandırılmış yükleyici PHP yorumlayıcısını kullanır. Ayrı bir zamanlayıcıyı veya hizmeti incelemez."
"I authorize the read-only worker runtime comparison.": "Salt okunur çalışan (worker) çalışma zamanı karşılaştırmasına izin veriyorum."
"Compare runtimes": "Çalışma zamanlarını karşılaştır"
"Runtime comparison results": "Çalışma zamanı karşılaştırma sonuçları"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "İzin ve kimlik farklılıkları kasıtlı olabilir. Salt okunur gözlemler yazma veya kurulum işlemlerinin başarılı olacağını kanıtlamaz."
"Confirm the read-only worker runtime comparison.": "Salt okunur çalışan (worker) çalışma zamanı karşılaştırmasını onaylayın."
"The runtime comparison is unavailable.": "Çalışma zamanı karşılaştırması kullanılamıyor."
"Shared application secret": "Paylaşılan uygulama gizli anahtarı"
"A strong web application secret is required before comparison.": "Karşılaştırma öncesinde güçlü bir web uygulaması gizli anahtarı gereklidir."
"Runtime comparison": "Çalışma zamanı karşılaştırması"
"The configured worker runtime did not confirm a bounded comparison.": "Yapılandırılmış çalışan (worker) çalışma zamanı sınırlı bir karşılaştırmayı doğrulamadı."
"The inherited worker secret could not be confirmed against the web secret.": "Devralınan çalışan (worker) gizli anahtarı web gizli anahtarına karşı doğrulanamadı."
"PHP runtime comparison": "PHP çalışma zamanı karşılaştırması"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Her iki çalışma zamanı da PHP 8.4 sürümünü desteklemelidir; farklı yama sürümleri inceleme gerektirir."
"Required extension comparison": "Gerekli eklenti karşılaştırması"
"Required extension availability is checked; differing versions require review.": "Gerekli eklenti kullanılabilirliği kontrol edilir; farklı sürümler inceleme gerektirir."
"Process identity comparison": "İşlem kimliği karşılaştırması"
"Effective process identity is unavailable on this platform.": "Etkin işlem kimliği bu platformda kullanılamıyor."
"Effective process identities match.": "Etkin işlem kimlikleri eşleşiyor."
"Effective process identities differ; separate service accounts may be intentional.": "Etkin işlem kimlikleri farklı; ayrı hizmet hesapları kasıtlı olabilir."
"Directory access comparison": "Dizin erişimi karşılaştırması"
"Read-only directory permission observations match.": "Salt okunur dizin izni gözlemleri eşleşiyor."
"Directory locations or permission observations differ; review the service-account roles.": "Dizin konumları veya izin gözlemleri farklılık gösteriyor; hizmet hesabı rollerini inceleyin."
"Worker directory read and traversal": "Çalışan dizini okuma ve geçiş"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Gerekli çalışan dizinleri mevcut olmalı ve okuma ile geçişe izin vermelidir. Yazma işlemi test edilmedi."
"The inherited worker secret matches the web secret for this private challenge.": "Devralınan çalışan (worker) gizli anahtarı bu özel sınama için web gizli anahtarıyla eşleşiyor."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Yapılandırılmış PHP yorumlayıcısını, gerekli eklentileri, devralınan gizli anahtarı ve hizmet hesabı dizin izinlerini inceleyin. Yazma veya yükleyici başlatma işlemi çalıştırılmadı."
"advisory": "bilgilendirme"
