"RRD files and the service account permissions needed to restore them.": "RRD dosyaları ve bunları geri yüklemek için gereken hizmet hesabı izinleri."
"Configuration, keys and plugin data outside the database.": "Veritabanı dışındaki yapılandırma, anahtarlar ve eklenti verileri."
