"Target schema completion has not been confirmed.": "Hedef şema tamamlanması doğrulanmadı."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Şema yükseltmesini tamamlanmış saymadan önce kurulum sonucunu inceleyin ve hataları çözün."
"Installation outcome": "Kurulum sonucu"
"A successful receipt matches the current target schema.": "Başarılı bir alındı bilgisi geçerli hedef şemayla eşleşir."
"A complete successful installation outcome has not been confirmed.": "Tam ve başarılı bir kurulum sonucu henüz doğrulanmadı."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Kurulum günlüğünü koruyun ve gerektiğinde açık kurtarma veya yeniden deneme prosedürünü kullanın."
"Collector synchronization": "Toplayıcı eşitleme"
"The completed installer reports pending collector synchronization.": "Tamamlanan yükleyici bekleyen toplayıcı eşitlemesi olduğunu bildiriyor."
"The completed installer reports no pending collectors.": "Tamamlanan yükleyici bekleyen toplayıcı olmadığını bildiriyor."
"Collector completion remains unconfirmed by this partial receipt.": "Toplayıcının tamamlanması bu kısmi alındı bilgisiyle henüz doğrulanmamıştır."
"Collector completion is not established by this installation outcome.": "Toplayıcının tamamlanması bu kurulum sonucuyla doğrulanmamıştır."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Kısmi sonuçlar için toplayıcı durumunu inceleyin ve bitirme görevlerini yeniden deneyin. Bu işlem daha sonraki toplama güncelliğini doğrulamaz."
"Scheduled collection": "Zamanlanmış toplama"
"No poller or device was contacted by this assessment.": "Bu değerlendirme tarafından hiçbir yoklayıcı veya cihazla iletişim kurulmadı."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Yapılandırılmış zamanlayıcının yoklayıcıyı hedeflenen hizmet hesabı olarak çalıştırdığını onaylayın ve bir sonraki normal döngüsünü inceleyin."
"Graph data": "Grafik verileri"
"Live samples and RRD updates were not exercised.": "Canlı örnekler ve RRD güncellemeleri test edilmedi."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Normal bir toplama döngüsünden sonra, beklenen grafiklerin yeni örnekler aldığını doğrulayın ve yoklayıcı hatalarını inceleyin."
"Recovery readiness": "Kurtarma hazırlığı"
"Backup restoration was not exercised.": "Yedekten geri yükleme test edilmedi."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Kurtarmaya güvenmeden önce veritabanı, RRD dosyaları, yapılandırma ve anahtar materyallerinin yalıtılmış bir geri yüklemesini doğrulayın."
"No persisted local poller start has been recorded.": "Kalıcı bir yerel yoklayıcı başlatması kaydedilmedi."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Kalıcı yoklayıcı zamanlaması geçersiz ve zamanlayıcı sağlığını doğrulayamaz."
"The recorded poller start is in the future. Check clock synchronization.": "Kaydedilen yoklayıcı başlangıcı gelecekte. Saat eşitlemesini kontrol edin."
"The recorded poller start is older than the native scheduling tolerance.": "Kaydedilen yoklayıcı başlangıcı yerel zamanlama toleransından daha eski."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Yerel zamanlama toleransı içinde bir yerel yoklayıcı başlatması kaydedildi. Tamamlanma ve cihaz sağlığı doğrulanmadı."
"readable": "okunabilir"
"missing or unreadable": "eksik veya okunamıyor"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Tam sürümü ve kilitli bağımlılıklarını geri yükleyin; hizmet hesabına okuma erişimi verin."
