"A useful name for this Rule.": "שם שימושי לכלל זה."
"Access denied.": "הגישה נדחתה."
"Add Graph Rule": "הוסף כלל גרף"
"Back to Graph Rules": "חזרה לכללי הגרפים"
"Check this box to enable this rule.": "סמן תיבה זו כדי להפעיל את הכלל הזה."
"Choose a Data Query to apply to this rule.": "בחר שאילתת נתונים כדי להחיל על כלל זה."
"Choose a Graph Type": "בחר סוג גרף"
"Choose a Graph Type of the selected Data Query.": "בחר סוג גרף מתוך שאילתת הנתונים שנבחרה."
"Choose an existing Data Query.": "בחר שאילתת נתונים קיימת."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "בחר כל אחד מסוגי הגרפים הזמינים של שאילתת הנתונים שנבחרה כדי להחיל על כלל זה."
"Data Query": "שאילתת נתונים"
"Device Selection and Graph Creation Criteria": "קריטריונים לבחירת התקנים ויצירת גרפים"
"Edit Graph Rule": "ערוך כלל גרף"
"Enable Rule": "הפעל כלל"
"Enter a name.": "הזן שם."
"Enter at most %count% characters.": "הזן לכל היותר %count% תווים."
"Enter single-line text.": "הזן טקסט בשורה אחת."
"Graph Type": "סוג גרף סטטיסטיקה"
"Graph rule not found.": "כלל הגרף לא נמצא."
"Graph rule saved.": "כלל הגרף נשמר."
"Name": "שם"
"Rule Selection [edit: %name%]": "בחירת כלל [עריכה: %name%]"
"Rule Selection [new]": "בחירת כלל [חדש]"
"Save": "שמור"
"Save outcome is uncertain. Reload before retrying.": "תוצאת השמירה אינה ודאית. טען מחדש לפני שתנסה שוב."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "שמור תחילה את הכלל; הקריטריונים לבחירת התקנים ויצירת גרפים יתווספו לאחר מכן."
"The graph rule changed since you opened this form. Reload before saving.": "כלל הגרף השתנה מאז פתחת טופס זה. טען מחדש לפני השמירה."
"Unable to load the graph rule. Reload before retrying.": "לא ניתן לטעון את כלל הגרף. טען מחדש לפני שתנסה שוב."
"Unexpected fields were submitted.": "נשלחו שדות בלתי צפויים."
