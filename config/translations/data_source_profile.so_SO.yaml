"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "Inta ay xogtu maqnaan karto ka hor inta uusan RRDtool diiwaangelin xog aan la garanayn. Kordhi qiimahan haddii Ishaada Xogta aysan degganayn oo aad rabto inaad horay u sii wadato xogtii hore halkii aad ka muujin lahayd meelo bannaan jaantusyadaada. Qiimahan waxaa lagu dhuftaa Qodobka X-Files (X-Files Factor) si loo go'aamiyo waqtiga dhabta ah."
