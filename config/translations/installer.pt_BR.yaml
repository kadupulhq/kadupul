"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Se um worker parar inesperadamente, preserve log/cacti.log e confirme que seu processo terminou antes de tentar novamente explicitamente. Um estado de espera não confirma uma inicialização bem-sucedida."
