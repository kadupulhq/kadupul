"Accept the license before saving the installation plan.": "Aceite a licença antes de salvar o plano de instalação."
"Invalid installation form.": "Formulário de instalação inválido."
"Access denied.": "Acesso negado."
"Confirm the recovery warning before retrying.": "Confirme o aviso de recuperação antes de tentar novamente."
"Review and confirm the current installation plan.": "Revise e confirme o plano de instalação atual."
"Confirm the discovery scope before starting.": "Confirme o escopo da descoberta antes de iniciar."
"Resolve the blocking checks before starting.": "Resolva as verificações bloqueadoras antes de iniciar."
"Too many installer options.": "Muitas opções do instalador."
"Invalid installer option name.": "Nome de opção do instalador inválido."
"Unknown or malformed installer option.": "Opção do instalador desconhecida ou malformada."
"Installer options must be scalar values.": "Opções do instalador devem ser valores escalares."
"Installer option is too long or contains a null byte.": "A opção do instalador é muito longa ou contém um byte nulo."
"Installer IDs and intervals must be whole numbers.": "IDs e intervalos do instalador devem ser números inteiros."
"Installer ID or interval is outside its supported range.": "O ID ou intervalo do instalador está fora do intervalo suportado."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "A instalação não pôde prosseguir. Recarregue seu status e revise as verificações bloqueadoras antes de tentar novamente."
"Confirm that the previous worker has stopped before recovering its plan.": "Confirme que o worker anterior foi encerrado antes de recuperar seu plano."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "O banco de dados está instalado, mas alguns coletores ainda precisam de sincronização. Tente novamente as tarefas finais após verificar seu status."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Instalação interrompida. Preserve o log do instalador, corrija a causa e confirme explicitamente uma nova tentativa. Algumas alterações no banco de dados já podem ter sido confirmadas. Verifique a limpeza de plugins antes de autorizar uma nova tentativa."
"Next action": "Próxima ação"
"Follow the execution status. Do not start another attempt while a worker is active.": "Acompanhe o status da execução. Não inicie outra tentativa enquanto um worker estiver ativo."
"Complete the recovery checklist before retrying.": "Conclua a lista de verificação de recuperação antes de tentar novamente."
"Verify collection and graph operation before enabling discovery.": "Verifique a operação de coleta e gráficos antes de habilitar a descoberta."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Resolva os requisitos bloqueados e verifique novamente. As seleções salvas são mantidas."
"Review the planned changes and backup checklist before authorizing execution.": "Revise as alterações planejadas e a lista de verificação de backup antes de autorizar a execução."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Escolha um perfil de coleta e aceite a licença. Configurações opcionais podem ser abertas quando necessário."
"Download installation diagnostics": "Baixar diagnósticos da instalação"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Abra um gráfico e confirme se os dados do RRD são atualizados após um ciclo do poller."
"Requirement details": "Detalhes do requisito"
"Recover": "Recuperar"
"Recovery checklist": "Lista de verificação de recuperação"
"Preserve log/cacti.log and record the failed attempt.": "Preserve log/cacti.log e registre a tentativa com falha."
"Confirm that the previous worker and its child processes have stopped.": "Confirme que o worker anterior e seus processos filhos foram encerrados."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspecione alterações confirmadas, sincronização do coletor e limpeza de plugins. Corrija a causa antes de tentar novamente."
"Review the saved plan again, then explicitly authorize a retry.": "Revise o plano salvo novamente e autorize explicitamente uma nova tentativa."
"Recover a stopped worker": "Recuperar um worker interrompido"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Use a recuperação somente após confirmar que esta tentativa não está mais em execução. A recuperação não interrompe um processo."
"Collector and installation mode": "Coletor e modo de instalação"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "A configuração de implantação determina a função do coletor e as conexões de banco de dados. Verifique a configuração do servidor primário antes de iniciar um coletor."
"Discovery and SNMP settings": "Configurações de descoberta e SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Mantenha a descoberta desabilitada até que a coleta e a conectividade do coletor tenham sido verificadas."
"Template selection": "Seleção de modelo"
"Templates selected for import": "Modelos selecionados para importação"
"No templates selected.": "Nenhum modelo selecionado."
"Backup checklist": "Lista de verificação de backup"
"Database backup and a tested restoration procedure.": "Backup do banco de dados e um procedimento de restauração testado."
"RRD files and the service account permissions needed to restore them.": "Arquivos RRD e as permissões da conta de serviço necessárias para restaurá-los."
"Configuration, keys and plugin data outside the database.": "Configuração, chaves e dados de plugins fora do banco de dados."
"Post-installation checks": "Verificações pós-instalação"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "As verificações verificadas cobrem apenas a evidência exibida. Verificações não avaliadas ainda exigem verificação do operador."
"Operational checks still require operator verification.": "Verificações operacionais ainda exigem verificação do operador."
"Status": "Status"
"verified": "Verificado"
"action_required": "Ação necessária"
"not_assessed": "Não avaliado"
"Database schema": "Esquema do banco de dados"
"Stored schema matches the application target.": "O esquema armazenado corresponde ao destino da aplicação."
"Target schema completion has not been confirmed.": "A conclusão do esquema de destino não foi confirmada."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Revise o resultado da instalação e resolva as falhas antes de considerar a atualização do esquema concluída."
"Installation outcome": "Resultado da instalação"
"A successful receipt matches the current target schema.": "Um recibo bem-sucedido corresponde ao esquema de destino atual."
"A complete successful installation outcome has not been confirmed.": "Não foi confirmado um resultado completo e bem-sucedido da instalação."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Preserve o log do instalador e use o procedimento explícito de recuperação ou nova tentativa quando necessário."
"Collector synchronization": "Sincronização do coletor"
"The completed installer reports pending collector synchronization.": "O instalador concluído relata sincronização de coletores pendente."
"The completed installer reports no pending collectors.": "O instalador concluído não relata coletores pendentes."
"Collector completion remains unconfirmed by this partial receipt.": "A conclusão do coletor permanece não confirmada por este recibo parcial."
"Collector completion is not established by this installation outcome.": "A conclusão do coletor não foi estabelecida por este resultado da instalação."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Revise o status do coletor e tente novamente as tarefas finais para resultados parciais. Isso não verifica a atualidade da coleta posterior."
"Scheduled collection": "Coleta agendada"
"No poller or device was contacted by this assessment.": "Nenhum poller ou dispositivo foi contatado por esta avaliação."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Confirme se o agendador configurado executa o poller com a conta de serviço pretendida e revise seu próximo ciclo normal."
"Graph data": "Dados do gráfico"
"Live samples and RRD updates were not exercised.": "Amostras ao vivo e atualizações de RRD não foram testadas."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Após um ciclo normal de coleta, confirme se os gráficos esperados recebem amostras recentes e revise os erros do poller."
"Recovery readiness": "Prontidão para recuperação"
"Backup restoration was not exercised.": "A restauração de backup não foi testada."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifique uma restauração isolada do banco de dados, arquivos RRD, configuração e material de chaves antes de depender da recuperação."
"No persisted local poller start has been recorded.": "Nenhum início persistido do poller local foi registrado."
"Persisted poller timing is invalid and cannot establish scheduler health.": "A temporização persistida do poller é inválida e não pode confirmar a integridade do agendador."
"The recorded poller start is in the future. Check clock synchronization.": "O início registrado do poller está no futuro. Verifique a sincronização de relógio."
"The recorded poller start is older than the native scheduling tolerance.": "O início registrado do poller é mais antigo do que a tolerância nativa de agendamento."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Um início do poller local foi registrado dentro da tolerância nativa de agendamento. A conclusão e a integridade dos dispositivos não foram verificadas."
"readable": "legível"
"missing or unreadable": "ausente ou ilegível"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Restaure a versão completa e suas dependências bloqueadas; conceda acesso de leitura à conta de serviço."
"PHP temporary directory": "Diretório temporário do PHP"
"directory writable by this process": "diretório gravável por este processo"
"missing or not writable": "ausente ou não gravável"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configure sys_temp_dir como um diretório existente gravável pela conta de instalação. Importações nativas usam arquivos temporários."
"Background worker launch": "Inicialização do worker em segundo plano"
"required PHP functions available; launch not exercised": "funções PHP necessárias disponíveis; inicialização não testada"
"required PHP launch function disabled": "função de inicialização PHP necessária desabilitada"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Habilite exec para o runtime PHP web ou use o instalador CLI autorizado."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Habilite popen, pclose para o runtime PHP web ou use o instalador CLI autorizado."
"Database transaction ownership": "Propriedade da transação do banco de dados"
"autocommit enabled; no caller-owned transaction": "autocommit habilitado; nenhuma transação pertencente ao chamador"
"autocommit disabled or caller transaction active": "autocommit desabilitado ou transação do chamador ativa"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Execute a instalação fora de uma transação pertencente ao chamador e habilite o autocommit em sua conexão de mutação."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Restaure o diretório da versão e conceda à conta de instalação acesso de gravação para importações de recursos de modelo. Não o torne gravável por todos."
