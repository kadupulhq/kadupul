"Large tables may require the dedicated CLI conversion tool before installation.": "Tabelas grandes podem exigir a ferramenta CLI dedicada de conversão antes da instalação."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Deixe os campos secretos em branco para manter as credenciais armazenadas. Os segredos nunca são exibidos novamente."
