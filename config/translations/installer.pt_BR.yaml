"Database privileges": "Privilégios do banco de dados"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Privilégios efetivos de migração, incluindo papéis ativos e concessões específicas de objetos, não foram verificados."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Solicite ao administrador do banco de dados que verifique as gravações de tabela necessárias, alterações de esquema, triggers e rotinas para a conta e o esquema de instalação. Não conceda privilégios de administrador global."
"Compare web and worker runtimes": "Comparar runtimes web e worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Isso inicia explicitamente uma sonda PHP curta somente leitura. Ela não reserva um instalador, não grava arquivos nem contata dispositivos."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "A sonda herda este processo web e usa o interpretador PHP configurado do instalador. Ela não inspeciona um agendador ou serviço separado."
"I authorize the read-only worker runtime comparison.": "Eu autorizo a comparação somente leitura do runtime do worker."
"Compare runtimes": "Comparar runtimes"
"Runtime comparison results": "Resultados da comparação de runtime"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Diferenças de permissão e identidade podem ser intencionais. Observações somente leitura não comprovam que gravações ou a instalação terão sucesso."
"Confirm the read-only worker runtime comparison.": "Confirme a comparação somente leitura do runtime do worker."
"The runtime comparison is unavailable.": "A comparação de runtime está indisponível."
"Shared application secret": "Segredo compartilhado da aplicação"
"A strong web application secret is required before comparison.": "Um segredo forte da aplicação web é necessário antes da comparação."
"Runtime comparison": "Comparação de runtime"
"The configured worker runtime did not confirm a bounded comparison.": "O runtime do worker configurado não confirmou uma comparação limitada."
"The inherited worker secret could not be confirmed against the web secret.": "O segredo herdado do worker não pôde ser confirmado em relação ao segredo web."
"PHP runtime comparison": "Comparação de runtime PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Ambos os runtimes devem suportar PHP 8.4; versões de patch diferentes exigem revisão."
"Required extension comparison": "Comparação de extensões necessárias"
"Required extension availability is checked; differing versions require review.": "A disponibilidade das extensões necessárias é verificada; versões diferentes exigem revisão."
"Process identity comparison": "Comparação de identidade do processo"
"Effective process identity is unavailable on this platform.": "A identidade efetiva do processo não está disponível nesta plataforma."
"Effective process identities match.": "As identidades efetivas de processo coincidem."
"Effective process identities differ; separate service accounts may be intentional.": "As identidades efetivas de processo diferem; contas de serviço separadas podem ser intencionais."
"Directory access comparison": "Comparação de acesso a diretórios"
"Read-only directory permission observations match.": "As observações de permissão de diretório somente leitura coincidem."
"Directory locations or permission observations differ; review the service-account roles.": "Os locais de diretórios ou as observações de permissão diferem; revise as funções da conta de serviço."
"Worker directory read and traversal": "Leitura e travessia de diretório do worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Os diretórios necessários do worker devem existir e permitir leitura e travessia. Nenhuma gravação foi testada."
"The inherited worker secret matches the web secret for this private challenge.": "O segredo herdado do worker corresponde ao segredo web para este desafio privado."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Revise o interpretador PHP configurado, as extensões necessárias, o segredo herdado e as permissões de diretório da conta de serviço. Nenhuma gravação ou inicialização do instalador foi executada."
"advisory": "informativo"
