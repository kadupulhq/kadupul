"Recover stopped attempt": "Recuperar tentativa interrompida"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "A recuperação mantém as seleções salvas e nunca encerra um worker ativo. Revise o plano novamente antes de tentar."
