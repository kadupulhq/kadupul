"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "DNS பெயர் தீர்வுக்குப் பயன்படுத்த வேண்டிய மாற்று DNS சேவையகங்களின் இடைவெளியால் பிரிக்கப்பட்ட பட்டியல். காலியாக இருந்தால், DNS பெயர்களைத் தீர்க்க போலர் OS பயன்படுத்தப்படும்."
"Access denied.": "அணுகல் மறுக்கப்பட்டது."
"Add Discovery Network": "கண்டறிதல் பிணையம் சேர்"
"After an initial failure, the number of ping retries to attempt before failing.": "ஆரம்பத் தோல்விக்குப் பிறகு, தோல்வியடைவதற்கு முன் முயற்சிக்க வேண்டிய பிங் மறுமுயற்சிகளின் எண்ணிக்கை."
"After the selected Run Limit, the discovery process will be terminated.": "தேர்ந்தெடுக்கப்பட்ட இயக்க வரம்புக்குப் பிறகு, கண்டறிதல் செயல்முறை நிறுத்தப்படும்."
"Allow same sysName on different hosts": "வெவ்வேறு புரவலன்களில் ஒரே sysName-ஐ அனுமதி"
"Alternate DNS Servers": "மாற்று DNS சேவையகங்கள்"
"April": "ஏப்ரல்"
"Associated Site": "தொடர்புடைய தளம்"
"August": "ஆகஸ்ட்"
"Automatically Add Devices": "சாதனங்களைத் தானாகச் சேர்"
"Back to Networks": "பிணையங்களுக்குத் திரும்பு"
"Choose an existing Data Collector.": "ஏற்கனவே உள்ள தரவு சேகரிப்பானைத் தேர்ந்தெடுக்கவும்."
"Choose an existing SNMP Option Set.": "ஏற்கனவே உள்ள SNMP விருப்பத் தொகுப்பைத் தேர்ந்தெடுக்கவும்."
"Choose an existing Site.": "ஏற்கனவே உள்ள தளத்தைத் தேர்ந்தெடுக்கவும்."
"Choose one of the listed values.": "பட்டியலிடப்பட்ட மதிப்புகளில் ஒன்றைத் தேர்ந்தெடுக்கவும்."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "இந்தச் சாதனத்திலிருந்து தரவைச் சேகரிக்கப் பயன்படுத்த வேண்டிய தரவு சேகரிப்பான்/போலரைத் தேர்ந்தெடுக்கவும்."
"Choose the Site that you wish to associate discovered Devices with.": "கண்டறியப்பட்ட சாதனங்களைத் தொடர்புபடுத்த விரும்பும் தளத்தைத் தேர்ந்தெடுக்கவும்."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "தினசரி மற்றும் வாராந்திர அட்டவணைகள் தொடக்கம் மற்றும் மீண்டும் இயக்கு இடைவெளியைப் பயன்படுத்துகின்றன; வாராந்திரம் வார நாட்களையும் பயன்படுத்துகிறது. மாதாந்திரம் மாதங்கள் மற்றும் மாத நாட்களைப் பயன்படுத்துகிறது; நாளில் மாதாந்திரம் மாதங்கள், மாத வாரங்கள் மற்றும் வார நாட்களைப் பயன்படுத்துகிறது."
"Daily": "தினசரி"
"Data Collector": "தரவு சேகரிப்பான்"
"Day(s) of Week": "வாரத்தின் நாள்(கள்)"
"Days of Month": "மாதத்தின் நாட்கள்"
"Days of Week": "வாரத்தின் நாட்கள்"
"December": "டிசம்பர்"
"Define the collection frequency.": "சேகரிப்பு அதிர்வெண்ணை வரையறுக்கவும்."
"Define the number of threads to use for discovering this Network Range.": "இந்தப் பிணைய வரம்பைக் கண்டறியப் பயன்படுத்த வேண்டிய த்ரெட்களின் எண்ணிக்கையை வரையறுக்கவும்."
"Discovery Threads": "கண்டறிதல் த்ரெட்கள்"
"Discovery Timing": "கண்டறிதல் நேரம்"
"Discovery network not found.": "கண்டறிதல் பிணையம் கிடைக்கவில்லை."
"Discovery network saved.": "கண்டறிதல் பிணையம் சேமிக்கப்பட்டது."
"Edit Discovery Network": "கண்டறிதல் பிணையத்தைத் திருத்து"
"Enable NetBIOS": "NetBIOS-ஐ இயக்கு"
"Enable this Network Range.": "இந்தப் பிணைய வரம்பை இயக்கவும்."
"Enabled": "இயக்கப்பட்டது"
"Enter DNS servers as IP addresses or host names separated by spaces.": "DNS சேவையகங்களை இடைவெளிகளால் பிரிக்கப்பட்ட IP முகவரிகள் அல்லது புரவலன் பெயர்களாக உள்ளிடவும்."
"Enter IPs or FQDNs of DNS Servers": "DNS சேவையகங்களின் IP-கள் அல்லது FQDN-களை உள்ளிடவும்"
"Enter a name.": "ஒரு பெயரை உள்ளிடவும்."
"Enter a valid email address.": "சரியான மின்னஞ்சல் முகவரியை உள்ளிடவும்."
"Enter a whole number from %min% to %max%.": "%min% முதல் %max% வரையிலான முழு எண்ணை உள்ளிடவும்."
"Enter at most %count% bytes.": "அதிகபட்சம் %count% bytes உள்ளிடவும்."
"Enter single-line text.": "ஒற்றை வரி உரையை உள்ளிடவும்."
"Enter the start as YYYY-MM-DD HH:MM.": "தொடக்கத்தை YYYY-MM-DD HH:MM என உள்ளிடவும்."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "காற்புள்ளிகளால் பிரிக்கப்பட்ட சரியான பிணைய வரம்புகளை உள்ளிடவும். நீங்கள் ஒரு IP முகவரி, 192.168.1.0/24 அல்லது 192.168.1.0/255.255.255.0 போன்ற பிணைய வரம்பு அல்லது 192.168.*.* போன்ற வைல்ட்கார்டு குறியீட்டைப் பயன்படுத்தலாம்"
"Enter valid network ranges separated by commas.": "காற்புள்ளிகளால் பிரிக்கப்பட்ட சரியான பிணைய வரம்புகளை உள்ளிடவும்."
"February": "பிப்ரவரி"
"First": "முதல்"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "SNMP மூலம் அணுகக்கூடிய மற்றும் ஒரு சாதன விதியுடன் பொருந்தும் புதிதாகக் கண்டறியப்பட்ட எந்தச் சாதனங்களையும் சாதனங்களாகச் சேர்க்கவும்."
"Friday": "வெள்ளி"
"General Settings": "பொது அமைப்புகள்"
"Give this Network a meaningful name.": "இந்தப் பிணையத்திற்கு அர்த்தமுள்ள பெயரைக் கொடுக்கவும்."
"ICMP Ping": "ICMP பிங்"
"If a device previously added is found, rerun its data queries.": "முன்னர் சேர்க்கப்பட்ட சாதனம் கண்டறியப்பட்டால், அதன் தரவு வினவல்களை மீண்டும் இயக்கவும்."
"If checked, when the Automation Network is scanned, a report will be sent to the Notification Email account.": "தேர்ந்தெடுக்கப்பட்டால், தானியங்கு பிணையம் ஸ்கேன் செய்யப்படும்போது, அறிவிப்பு மின்னஞ்சல் கணக்கிற்கு ஒரு அறிக்கை அனுப்பப்படும்."
