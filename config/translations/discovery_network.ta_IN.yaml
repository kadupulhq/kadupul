"The Email Address to be used as the senders Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "அறிவிப்பு மின்னஞ்சலுக்கு அனுப்புநரின் மின்னஞ்சலாகப் பயன்படுத்த வேண்டிய மின்னஞ்சல் முகவரி. காலியாக விடப்பட்டால், இயல்புநிலை தானியங்கு அறிவிப்பு மின்னஞ்சல் முகவரி பயன்படுத்தப்படும்."
"The Email account name to be used as the senders name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "அறிவிப்பு மின்னஞ்சலுக்கு அனுப்புநரின் பெயராகப் பயன்படுத்த வேண்டிய மின்னஞ்சல் கணக்குப் பெயர். காலியாக விடப்பட்டால், இயல்புநிலை தானியங்கு அறிவிப்புப் பெயர் பயன்படுத்தப்படும்."
"The Email account to be used to send the Notification Email to.": "அறிவிப்பு மின்னஞ்சலை அனுப்பப் பயன்படுத்த வேண்டிய மின்னஞ்சல் கணக்கு."
"The discovery network changed since you opened this form. Reload before saving.": "இந்தப் படிவத்தைத் திறந்த பிறகு கண்டறிதல் பிணையம் மாறிவிட்டது. சேமிப்பதற்கு முன் மீண்டும் ஏற்றவும்."
"The discovery network form is incomplete.": "கண்டறிதல் பிணையப் படிவம் முழுமையடையவில்லை."
"The ranges cover more than %count% addresses.": "வரம்புகள் %count% முகவரிகளுக்கு மேல் உள்ளன."
"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "புரவலன் ICMP மற்றும் UDP பிங்கிங்கிற்குப் பயன்படுத்த வேண்டிய காலாவதி மதிப்பு. இந்தப் புரவலன் SNMP காலாவதி மதிப்பு SNMP பிங்குகளுக்குப் பொருந்தும்."
"The type of ping packet to send.": "அனுப்ப வேண்டிய பிங் பாக்கெட் வகை."
"Third": "மூன்றாவது"
"Thursday": "வியாழன்"
"Total IP Addresses: %count%": "மொத்த IP முகவரிகள்: %count%"
"Tuesday": "செவ்வாய்"
"UDP Ping": "UDP பிங்"
"Unable to load the discovery network. Reload before retrying.": "கண்டறிதல் பிணையத்தை ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கும் முன் மீண்டும் ஏற்றவும்."
"Unexpected fields were submitted.": "எதிர்பாராத புலங்கள் சமர்ப்பிக்கப்பட்டன."
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "இயங்கும் புரவலன்களின் புரவலன் பெயரைத் தீர்க்க முயற்சிக்க NetBIOS-ஐப் பயன்படுத்தவும்."
"Wednesday": "புதன்"
"Week(s) of Month": "மாதத்தின் வாரம்(கள்)"
"Weekly": "வாராந்திரம்"
"What Day(s) of the Month will this Network Range be discovered.": "மாதத்தின் எந்த நாள்(களில்) இந்தப் பிணைய வரம்பு கண்டறியப்படும்."
"What Day(s) of the week will this Network Range be discovered.": "வாரத்தின் எந்த நாள்(களில்) இந்தப் பிணைய வரம்பு கண்டறியப்படும்."
"What Months(s) of the Year will this Network Range be discovered.": "ஆண்டின் எந்த மாதம்(களில்) இந்தப் பிணைய வரம்பு கண்டறியப்படும்."
"What Week(s) of the Month will this Network Range be discovered.": "மாதத்தின் எந்த வாரம்(களில்) இந்தப் பிணைய வரம்பு கண்டறியப்படும்."
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "இந்தப் பிணையக் கண்டறிதல் உருப்படி எந்த நேரத்தில் தொடங்கும்? இதை YYYY-MM-DD HH:MM என உள்ளிடவும்."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "சாதனங்களைக் கண்டறியும்போது, வெவ்வேறு புரவலன்களில் நகல் sysName-களைச் சேர்க்க அனுமதிக்கவும்"
"You must specify both the Months and Days of Month.": "மாதங்கள் மற்றும் மாதத்தின் நாட்கள் இரண்டையும் நீங்கள் குறிப்பிட வேண்டும்."
"You must specify the Months, Weeks of Months, and Days of Week.": "மாதங்கள், மாதங்களின் வாரங்கள் மற்றும் வாரத்தின் நாட்கள் ஆகியவற்றை நீங்கள் குறிப்பிட வேண்டும்."
"You must specify the day of the week.": "வாரத்தின் நாளை நீங்கள் குறிப்பிட வேண்டும்."
