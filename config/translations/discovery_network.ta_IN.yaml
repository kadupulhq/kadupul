"Rerun discovery for this Network Range every X days for a Daily schedule, or every X weeks for a Weekly one.": "தினசரி அட்டவணைக்கு ஒவ்வொரு X நாட்களுக்கும், அல்லது வாராந்திர அட்டவணைக்கு ஒவ்வொரு X வாரங்களுக்கும் இந்தப் பிணைய வரம்பிற்கான கண்டறிதலை மீண்டும் இயக்கவும்."
