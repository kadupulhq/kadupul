"succeeded": "सफल भयो"
"upgrade": "अपग्रेड"
"waiting": "प्रतीक्षामा"
"Accept the license before saving the installation plan.": "इन्स्टलेसन योजना सुरक्षित गर्नुअघि इजाजतपत्र स्वीकार गर्नुहोस्।"
"Invalid installation form.": "अमान्य इन्स्टलेसन फारम।"
"Access denied.": "पहुँच अस्वीकृत।"
"Confirm the recovery warning before retrying.": "पुनः प्रयास गर्नुअघि पुनःप्राप्ति चेतावनी पुष्टि गर्नुहोस्।"
"Review and confirm the current installation plan.": "हालको इन्स्टलेसन योजना समीक्षा गरी पुष्टि गर्नुहोस्।"
"Confirm the discovery scope before starting.": "सुरु गर्नुअघि डिस्कभरी दायरा पुष्टि गर्नुहोस्।"
"Resolve the blocking checks before starting.": "सुरु गर्नुअघि अवरोधक जाँचहरू समाधान गर्नुहोस्।"
"Too many installer options.": "धेरै इन्स्टलर विकल्पहरू।"
"Invalid installer option name.": "अमान्य इन्स्टलर विकल्प नाम।"
"Unknown or malformed installer option.": "अज्ञात वा बिग्रिएको इन्स्टलर विकल्प।"
"Installer options must be scalar values.": "इन्स्टलर विकल्पहरू स्केलर मानहरू हुनुपर्छ।"
"Installer option is too long or contains a null byte.": "इन्स्टलर विकल्प अति लामो छ वा नल बाइट समावेश गर्छ।"
"Installer IDs and intervals must be whole numbers.": "इन्स्टलर ID र अन्तरालहरू पूर्ण सङ्ख्या हुनुपर्छ।"
"Installer ID or interval is outside its supported range.": "इन्स्टलर ID वा अन्तराल यसको समर्थित दायराबाहिर छ।"
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "इन्स्टलेसन अगाडि बढ्न सकेन। पुनः प्रयास गर्नुअघि यसको स्थिति रिलोड गरी अवरोधक जाँचहरू समीक्षा गर्नुहोस्।"
"Confirm that the previous worker has stopped before recovering its plan.": "योजना पुनःप्राप्त गर्नुअघि अघिल्लो वर्कर रोकिएको पुष्टि गर्नुहोस्।"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "डेटाबेस इन्स्टल भएको छ, तर केही सङ्कलकहरूलाई अझै सिङ्क्रोनाइजेसन चाहिन्छ। तिनको स्थिति जाँचेपछि अन्तिम कार्यहरू पुनः प्रयास गर्नुहोस्।"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "इन्स्टलेसन रोकियो। इन्स्टलर लग सुरक्षित राख्नुहोस्, कारण सच्याउनुहोस् र पुनः प्रयासलाई स्पष्ट रूपमा पुष्टि गर्नुहोस्। केही डेटाबेस परिवर्तनहरू पहिले नै कमिट भइसकेका हुन सक्छन्। पुनः प्रयासलाई अधिकार दिनुअघि प्लगइन सफाइ जाँच गर्नुहोस्।"
"Next action": "अर्को कार्य"
"Follow the execution status. Do not start another attempt while a worker is active.": "कार्यान्वयन स्थिति पछ्याउनुहोस्। वर्कर सक्रिय हुँदा अर्को प्रयास सुरु नगर्नुहोस्।"
"Complete the recovery checklist before retrying.": "पुनः प्रयास गर्नुअघि पुनःप्राप्ति चेकलिस्ट पूरा गर्नुहोस्।"
"Verify collection and graph operation before enabling discovery.": "डिस्कभरी सक्षम गर्नुअघि सङ्कलन र ग्राफ सञ्चालन प्रमाणित गर्नुहोस्।"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "अवरोधक आवश्यकताहरू समाधान गरेर फेरि जाँच गर्नुहोस्। सुरक्षित गरिएका चयनहरू राखिएका छन्।"
"Review the planned changes and backup checklist before authorizing execution.": "कार्यान्वयनलाई अधिकार दिनुअघि योजनाबद्ध परिवर्तनहरू र ब्याकअप चेकलिस्ट समीक्षा गर्नुहोस्।"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "सङ्कलन प्रोफाइल छानेर इजाजतपत्र स्वीकार गर्नुहोस्। वैकल्पिक सेटिङहरू आवश्यक परेमा खोल्न सकिन्छ।"
"Download installation diagnostics": "इन्स्टलेसन निदान डाउनलोड गर्नुहोस्"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "ग्राफ खोलेर पोलर चक्रपछि यसको RRD डेटा अद्यावधिक हुन्छ भनी पुष्टि गर्नुहोस्।"
"Requirement details": "आवश्यकता विवरण"
"Recover": "पुनःप्राप्त गर्नुहोस्"
"Recovery checklist": "पुनःप्राप्ति चेकलिस्ट"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log सुरक्षित राख्नुहोस् र असफल प्रयास रेकर्ड गर्नुहोस्।"
"Confirm that the previous worker and its child processes have stopped.": "अघिल्लो वर्कर र यसका चाइल्ड प्रक्रियाहरू रोकिएको पुष्टि गर्नुहोस्।"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "कमिट गरिएका परिवर्तनहरू, सङ्कलक सिङ्क्रोनाइजेसन र प्लगइन सफाइ निरीक्षण गर्नुहोस्। पुनः प्रयास गर्नुअघि कारण सच्याउनुहोस्।"
"Review the saved plan again, then explicitly authorize a retry.": "सुरक्षित गरिएको योजना फेरि समीक्षा गर्नुहोस्, त्यसपछि पुनः प्रयासलाई स्पष्ट रूपमा अधिकार दिनुहोस्।"
"Recover a stopped worker": "रोकिएको वर्कर पुनःप्राप्त गर्नुहोस्"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "यो प्रयास अब चलिरहेको छैन भन्ने पुष्टि गरेपछि मात्र पुनःप्राप्ति प्रयोग गर्नुहोस्। पुनःप्राप्तिले कुनै प्रक्रिया रोक्दैन।"
"Collector and installation mode": "सङ्कलक र इन्स्टलेसन मोड"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "परिनियोजन कन्फिगरेसनले सङ्कलक भूमिका र डेटाबेस जडानहरू निर्धारण गर्छ। सङ्कलक सुरु गर्नुअघि प्राथमिक सर्भर कन्फिगरेसन प्रमाणित गर्नुहोस्।"
"Discovery and SNMP settings": "डिस्कभरी र SNMP सेटिङहरू"
"Keep discovery disabled until collection and collector connectivity have been verified.": "सङ्कलन र सङ्कलक जडान प्रमाणित नभएसम्म डिस्कभरी अक्षम राख्नुहोस्।"
"Template selection": "टेम्प्लेट चयन"
"Templates selected for import": "आयातका लागि छानिएका टेम्प्लेटहरू"
"No templates selected.": "कुनै टेम्प्लेट छानिएको छैन।"
"Backup checklist": "ब्याकअप चेकलिस्ट"
"Database backup and a tested restoration procedure.": "डेटाबेस ब्याकअप र परीक्षण गरिएको पुनःस्थापना प्रक्रिया।"
"RRD files and the service account permissions needed to restore them.": "RRD फाइलहरू र तिनलाई पुनःस्थापना गर्न आवश्यक सेवा खाता अनुमतिहरू।"
"Configuration, keys and plugin data outside the database.": "डेटाबेसबाहिरका कन्फिगरेसन, कुञ्जीहरू र प्लगइन डेटा।"
"Post-installation checks": "इन्स्टलेसनपछिका जाँचहरू"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "प्रमाणित जाँचहरूले देखाइएको प्रमाणलाई मात्र समेट्छन्। मूल्याङ्कन नगरिएका जाँचहरूलाई अझै अपरेटरको प्रमाणीकरण चाहिन्छ।"
"Operational checks still require operator verification.": "सञ्चालन जाँचहरूलाई अझै अपरेटरको प्रमाणीकरण चाहिन्छ।"
"Status": "स्थिति"
"verified": "प्रमाणित"
"action_required": "कार्य आवश्यक"
"not_assessed": "मूल्याङ्कन गरिएको छैन"
"Database schema": "डेटाबेस स्कीमा"
"Stored schema matches the application target.": "भण्डारण गरिएको स्कीमा एप्लिकेसनको लक्ष्यसँग मेल खान्छ।"
"Target schema completion has not been confirmed.": "लक्षित स्कीमाको पूर्णता पुष्टि गरिएको छैन।"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "स्कीमा अपग्रेड पूरा भएको मान्नुअघि इन्स्टलेसन नतिजा समीक्षा गरी असफलताहरू समाधान गर्नुहोस्।"
"Installation outcome": "इन्स्टलेसन नतिजा"
"A successful receipt matches the current target schema.": "सफल रसिद हालको लक्षित स्कीमासँग मेल खान्छ।"
"A complete successful installation outcome has not been confirmed.": "पूर्ण सफल इन्स्टलेसन नतिजा पुष्टि गरिएको छैन।"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "इन्स्टलर लग सुरक्षित राख्नुहोस् र आवश्यक परेमा स्पष्ट पुनःप्राप्ति वा पुनः प्रयास प्रक्रिया प्रयोग गर्नुहोस्।"
"Collector synchronization": "सङ्कलक सिङ्क्रोनाइजेसन"
"The completed installer reports pending collector synchronization.": "पूरा भएको इन्स्टलरले विचाराधीन सङ्कलक सिङ्क्रोनाइजेसन रिपोर्ट गर्छ।"
"The completed installer reports no pending collectors.": "पूरा भएको इन्स्टलरले कुनै विचाराधीन सङ्कलक रिपोर्ट गर्दैन।"
"Collector completion remains unconfirmed by this partial receipt.": "यो आंशिक रसिदले सङ्कलक पूर्णता अपुष्ट राख्छ।"
"Collector completion is not established by this installation outcome.": "यो इन्स्टलेसन नतिजाले सङ्कलक पूर्णता स्थापित गर्दैन।"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "आंशिक नतिजाहरूका लागि सङ्कलक स्थिति समीक्षा गरी अन्तिम कार्यहरू पुनः प्रयास गर्नुहोस्। यसले पछिको सङ्कलन ताजापन प्रमाणित गर्दैन।"
"Scheduled collection": "निर्धारित सङ्कलन"
"No poller or device was contacted by this assessment.": "यो मूल्याङ्कनले कुनै पोलर वा उपकरणलाई सम्पर्क गरेन।"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "कन्फिगर गरिएको सेड्युलरले पोलरलाई इच्छित सेवा खाताका रूपमा चलाउँछ भनी पुष्टि गर्नुहोस् र यसको अर्को सामान्य चक्र समीक्षा गर्नुहोस्।"
"Graph data": "ग्राफ डेटा"
"Live samples and RRD updates were not exercised.": "प्रत्यक्ष नमूनाहरू र RRD अद्यावधिकहरूको प्रयोग गरिएन।"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "सामान्य सङ्कलन चक्रपछि, अपेक्षित ग्राफहरूले ताजा नमूना पाएका छन् भनी पुष्टि गर्नुहोस् र पोलर त्रुटिहरू समीक्षा गर्नुहोस्।"
"Recovery readiness": "पुनःप्राप्ति तयारी"
"Backup restoration was not exercised.": "ब्याकअप पुनःस्थापनाको प्रयोग गरिएन।"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "पुनःप्राप्तिमा भर पर्नुअघि डेटाबेस, RRD फाइलहरू, कन्फिगरेसन र कुञ्जी सामग्रीको पृथक पुनःस्थापना प्रमाणित गर्नुहोस्।"
"No persisted local poller start has been recorded.": "कुनै स्थायी स्थानीय पोलर सुरुवात रेकर्ड गरिएको छैन।"
"Persisted poller timing is invalid and cannot establish scheduler health.": "स्थायी पोलर समय अमान्य छ र सेड्युलर स्वास्थ्य स्थापित गर्न सक्दैन।"
"The recorded poller start is in the future. Check clock synchronization.": "रेकर्ड गरिएको पोलर सुरुवात भविष्यमा छ। घडी सिङ्क्रोनाइजेसन जाँच गर्नुहोस्।"
"The recorded poller start is older than the native scheduling tolerance.": "रेकर्ड गरिएको पोलर सुरुवात नेटिभ सेड्युलिङ सहनशीलताभन्दा पुरानो छ।"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "नेटिभ सेड्युलिङ सहनशीलताभित्र स्थानीय पोलर सुरुवात रेकर्ड गरिएको थियो। पूर्णता र उपकरण स्वास्थ्य प्रमाणित गरिएको छैन।"
"readable": "पढ्न मिल्ने"
"missing or unreadable": "हराएको वा पढ्न नमिल्ने"
"Restore the complete release and its locked dependencies; grant the service account read access.": "पूरा रिलिज र यसका लक गरिएका निर्भरताहरू पुनःस्थापना गर्नुहोस्; सेवा खातालाई पढ्ने पहुँच दिनुहोस्।"
"PHP temporary directory": "PHP अस्थायी डाइरेक्टरी"
"directory writable by this process": "यो प्रक्रियाले लेख्न सक्ने डाइरेक्टरी"
"missing or not writable": "हराएको वा लेख्न नमिल्ने"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir लाई इन्स्टलेसन खाताले लेख्न सक्ने विद्यमान डाइरेक्टरीका रूपमा कन्फिगर गर्नुहोस्। नेटिभ आयातहरूले अस्थायी फाइलहरू प्रयोग गर्छन्।"
"Background worker launch": "ब्याकग्राउन्ड वर्कर सुरुवात"
"required PHP functions available; launch not exercised": "आवश्यक PHP प्रकार्यहरू उपलब्ध छन्; सुरुवातको प्रयोग गरिएन"
"required PHP launch function disabled": "आवश्यक PHP सुरुवात प्रकार्य अक्षम छ"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "वेब PHP रनटाइमका लागि exec सक्षम गर्नुहोस्, वा अधिकृत CLI इन्स्टलर प्रयोग गर्नुहोस्।"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "वेब PHP रनटाइमका लागि popen, pclose सक्षम गर्नुहोस्, वा अधिकृत CLI इन्स्टलर प्रयोग गर्नुहोस्।"
"Database transaction ownership": "डेटाबेस लेनदेन स्वामित्व"
"autocommit enabled; no caller-owned transaction": "अटोकमिट सक्षम; कलरको स्वामित्वमा कुनै लेनदेन छैन"
"autocommit disabled or caller transaction active": "अटोकमिट अक्षम वा कलरको लेनदेन सक्रिय"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "कलरको स्वामित्वको लेनदेनबाहिर इन्स्टलेसन चलाउनुहोस् र यसको म्युटेसन जडानमा अटोकमिट सक्षम गर्नुहोस्।"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "रिलिज डाइरेक्टरी पुनःस्थापना गर्नुहोस् र टेम्प्लेट रिसोर्स आयातका लागि इन्स्टलेसन खातालाई लेख्ने पहुँच दिनुहोस्। यसलाई सबैले लेख्न मिल्ने नबनाउनुहोस्।"
"Worker file: install/background.php": "वर्कर फाइल: install/background.php"
"Worker file: bin/legacy-installer.php": "वर्कर फाइल: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "वर्कर फाइल: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "आयात गन्तव्य: resource/snmp_queries"
"Import destination: resource/script_server": "आयात गन्तव्य: resource/script_server"
"Import destination: resource/script_queries": "आयात गन्तव्य: resource/script_queries"
"Import destination: scripts": "आयात गन्तव्य: scripts"
"Database privileges": "डेटाबेस विशेषाधिकारहरू"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "सक्रिय भूमिकाहरू र वस्तु-विशिष्ट अनुदानहरू सहितका प्रभावकारी माइग्रेसन विशेषाधिकारहरू प्रमाणित गरिएका थिएनन्।"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "डेटाबेस प्रशासकले इन्स्टलेसन खाता र स्कीमाका लागि आवश्यक तालिका लेखन, स्कीमा परिवर्तन, ट्रिगर र रुटिनहरू प्रमाणित गरून्। विश्वव्यापी प्रशासक विशेषाधिकार नदिनुहोस्।"
"Compare web and worker runtimes": "वेब र वर्कर रनटाइमहरू तुलना गर्नुहोस्"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "यसले स्पष्ट रूपमा छोटो पढ्न-मात्र PHP प्रोब सुरु गर्छ। यसले इन्स्टलर आरक्षित गर्दैन, फाइल लेख्दैन वा उपकरणहरूलाई सम्पर्क गर्दैन।"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "प्रोबले यो वेब प्रक्रियाबाट उत्तराधिकार लिन्छ र कन्फिगर गरिएको इन्स्टलर PHP इन्टरप्रिटर प्रयोग गर्छ। यसले अलग सेड्युलर वा सेवा निरीक्षण गर्दैन।"
"I authorize the read-only worker runtime comparison.": "म पढ्न-मात्र वर्कर रनटाइम तुलनालाई अधिकार दिन्छु।"
"Compare runtimes": "रनटाइमहरू तुलना गर्नुहोस्"
"Runtime comparison results": "रनटाइम तुलना नतिजाहरू"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "अनुमति र पहिचानका भिन्नताहरू जानाजानी हुन सक्छन्। पढ्न-मात्र अवलोकनहरूले लेखन वा इन्स्टलेसन सफल हुन्छ भन्ने प्रमाणित गर्दैनन्।"
"Confirm the read-only worker runtime comparison.": "पढ्न-मात्र वर्कर रनटाइम तुलना पुष्टि गर्नुहोस्।"
"The runtime comparison is unavailable.": "रनटाइम तुलना अनुपलब्ध छ।"
"Shared application secret": "साझा एप्लिकेसन गोप्य कुञ्जी"
"A strong web application secret is required before comparison.": "तुलना गर्नुअघि बलियो वेब एप्लिकेसन गोप्य कुञ्जी आवश्यक छ।"
"Runtime comparison": "रनटाइम तुलना"
"The configured worker runtime did not confirm a bounded comparison.": "कन्फिगर गरिएको वर्कर रनटाइमले सीमित तुलना पुष्टि गरेन।"
"The inherited worker secret could not be confirmed against the web secret.": "उत्तराधिकारमा पाएको वर्कर गोप्य कुञ्जी वेब गोप्य कुञ्जीसँग पुष्टि गर्न सकिएन।"
"PHP runtime comparison": "PHP रनटाइम तुलना"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "दुवै रनटाइमले PHP 8.4 समर्थन गर्नुपर्छ; फरक प्याच संस्करणहरू समीक्षा गर्नुपर्छ।"
"Required extension comparison": "आवश्यक एक्सटेन्सन तुलना"
"Required extension availability is checked; differing versions require review.": "आवश्यक एक्सटेन्सनको उपलब्धता जाँचिन्छ; फरक संस्करणहरू समीक्षा गर्नुपर्छ।"
"Process identity comparison": "प्रक्रिया पहिचान तुलना"
"Effective process identity is unavailable on this platform.": "यो प्लेटफर्ममा प्रभावकारी प्रक्रिया पहिचान अनुपलब्ध छ।"
"Effective process identities match.": "प्रभावकारी प्रक्रिया पहिचानहरू मेल खान्छन्।"
"Effective process identities differ; separate service accounts may be intentional.": "प्रभावकारी प्रक्रिया पहिचानहरू फरक छन्; अलग सेवा खाताहरू जानाजानी हुन सक्छन्।"
"Directory access comparison": "डाइरेक्टरी पहुँच तुलना"
"Read-only directory permission observations match.": "पढ्न-मात्र डाइरेक्टरी अनुमति अवलोकनहरू मेल खान्छन्।"
"Directory locations or permission observations differ; review the service-account roles.": "डाइरेक्टरी स्थान वा अनुमति अवलोकनहरू फरक छन्; सेवा खाता भूमिकाहरू समीक्षा गर्नुहोस्।"
"Worker directory read and traversal": "वर्कर डाइरेक्टरी पढाइ र ट्राभर्सल"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "आवश्यक वर्कर डाइरेक्टरीहरू अवस्थित हुनुपर्छ र पढ्न तथा ट्राभर्स गर्न दिनुपर्छ। कुनै लेखन परीक्षण गरिएन।"
"The inherited worker secret matches the web secret for this private challenge.": "यो निजी चुनौतीका लागि उत्तराधिकारमा पाएको वर्कर गोप्य कुञ्जी वेब गोप्य कुञ्जीसँग मेल खान्छ।"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "कन्फिगर गरिएको PHP इन्टरप्रिटर, आवश्यक एक्सटेन्सनहरू, उत्तराधिकारमा पाएको गोप्य कुञ्जी र सेवा खाता डाइरेक्टरी अनुमतिहरू समीक्षा गर्नुहोस्। कुनै लेखन वा इन्स्टलर सुरुवातको प्रयोग गरिएन।"
"advisory": "सल्लाहात्मक"
