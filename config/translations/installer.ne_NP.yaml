"Scope": "दायरा"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "स्थिति अनुपलब्ध छ। सुरक्षित गरिएको काम राखिएको छ। पुनः जडान गर्न ताजा गर्नुहोस्; अर्को इन्स्टलेसन पेस नगर्नुहोस्।"
