"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "भण्डारण गरिएका प्रमाणपत्रहरू कायम राख्न गोप्य फिल्डहरू खाली छोड्नुहोस्। गोप्य कुराहरू कहिल्यै फेरि देखाइँदैनन्।"
