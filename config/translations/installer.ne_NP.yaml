"I checked the previous attempt and accept that some changes may already be committed": "मैले अघिल्लो प्रयास जाँच गरेको छु र केही परिवर्तनहरू पहिले नै कमिट भइसकेका हुन सक्छन् भन्ने स्वीकार गर्छु"
"I reviewed this plan and have the required backups": "मैले यो योजना समीक्षा गरेको छु र आवश्यक ब्याकअपहरू मसँग छन्"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "वर्कर अप्रत्याशित रूपमा रोकिएमा, log/cacti.log सुरक्षित राख्नुहोस् र स्पष्ट रूपमा पुनः प्रयास गर्नुअघि यसको प्रक्रिया समाप्त भएको पुष्टि गर्नुहोस्। प्रतीक्षा अवस्थाले सफल सुरुवात पुष्टि गर्दैन।"
