"Data Query Index": "Índice de consulta de dados"
"Device": "Dispositivo"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "As folhas de dispositivo não podem utilizar critérios em colunas de gráfico ou modelo de gráfico. Ao alterar o tipo de item folha para Dispositivo, marque esta caixa para remover esses critérios; não podem ser recuperados."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "As folhas de dispositivo não podem utilizar critérios baseados em gráficos. Confirme a remoção de %count% critérios para guardar."
