"A notification receiver field exceeds its maximum length.": "የማሳወቂያ ተቀባይ መስክ ከከፍተኛው ርዝመቱ በልጧል።"
"Access denied.": "መዳረሻ ተከልክሏል።"
"Add SNMP Notification Receiver": "የ SNMP ማሳወቂያ ተቀባይ አክል"
"Back to SNMP Notification Receivers": "ወደ SNMP ማሳወቂያ ተቀባዮች ተመለስ"
"Choose Replace credentials before entering new credentials.": "አዲስ ማረጋገጫዎችን ከማስገባትዎ በፊት Replace credentials ይምረጡ።"
"Confirm SNMP Auth Password (v3)": "የ SNMP የማረጋገጫ ይለፍ ቃልን (v3) አረጋግጥ"
"Confirm SNMP Privacy Passphrase (v3)": "የ SNMP Privacy የይለፍ ሐረግን (v3) አረጋግጥ"
"Credentials": "ማረጋገጫዎች"
"Description": "መግለጫ"
"Disable SNMP Notification Receiver": "የ SNMP ማሳወቂያ ተቀባይን አቦዝን"
"Edit SNMP Notification Receiver": "የ SNMP ማሳወቂያ ተቀባይ አርትዕ"
"Enter a description and a hostname.": "መግለጫ እና የአስተናጋጅ ስም ያስገቡ።"
"Enter a whole number.": "ሙሉ ቁጥር ያስገቡ።"
"Enter the credentials for a new notification receiver.": "ለአዲስ የማሳወቂያ ተቀባይ ማረጋገጫዎችን ያስገቡ።"
"General": "አጠቃላይ"
"Hostname": "የአስተናጋጅ ስም"
"Logs": "ምዝግብ ማስታወሻዎች"
"Maximum Log Size": "ከፍተኛ የምዝግብ ማስታወሻ መጠን"
"Notes": "ማስታወሻዎች"
"Notes must be valid text of at most 65535 bytes.": "ማስታወሻዎች ቢበዛ 65535 ባይት ያለው ትክክለኛ ጽሑፍ መሆን አለባቸው።"
"Notification receiver fields must contain valid single-line text.": "የማሳወቂያ ተቀባይ መስኮች ትክክለኛ ነጠላ-መስመር ጽሑፍ መያዝ አለባቸው።"
"Notification receiver not found.": "የማሳወቂያ ተቀባይ አልተገኘም።"
"Notification receiver saved.": "የማሳወቂያ ተቀባይ ተቀምጧል።"
"Notifications": "ማሳወቂያዎች"
"Receiver sections": "የተቀባይ ክፍሎች"
"Replace credentials": "ምስክርነቶችን ተካ"
"Replace stored credentials that contain control characters.": "የመቆጣጠሪያ ቁምፊዎችን የያዙ የተቀመጡ ምስክርነቶችን ተካ።"
"SNMP Auth Password (v3)": "SNMP የማረጋገጫ የይለፍ ቃል (v3)"
"SNMP Auth Protocol (v3)": "SNMP የማረጋገጫ ፕሮቶኮል (v3)"
"SNMP Community": "SNMP Community"
"SNMP Engine ID (v3)": "SNMP ሞተር ID (v3)"
"SNMP Message Type": "የSNMP መልእክት ዓይነት"
"SNMP Notification Receiver [edit: %name%]": "የSNMP ማሳወቂያ ተቀባይ [አርትዕ: %name%]"
"SNMP Notification Receiver [new]": "የSNMP ማሳወቂያ ተቀባይ [አዲስ]"
"SNMP Port": "SNMP ወደብ"
"SNMP Privacy Passphrase (v3)": "SNMP የግላዊነት ይለፍ ሐረግ (v3)"
"SNMP Privacy Protocol (v3)": "SNMP የግላዊነት ፕሮቶኮል (v3)"
"SNMP Username (v3)": "SNMP የተጠቃሚ ስም (v3)"
"SNMP Version": "SNMP ስሪት"
"SNMPv3 authentication and privacy passphrases require at least 8 bytes.": "የSNMPv3 የማረጋገጫ እና የግላዊነት ይለፍ ሐረጎች ቢያንስ 8 ባይት ይፈልጋሉ።"
"SNMPv3 privacy also requires authentication.": "SNMPv3 ግላዊነት ማረጋገጫንም ይፈልጋል።"
"SNMPv3 requires a username and an engine ID.": "SNMPv3 የተጠቃሚ ስም እና የሞተር ID ይፈልጋል።"
"Save": "አስቀምጥ"
"Save outcome is uncertain. Reload before retrying.": "የማስቀመጥ ውጤቱ እርግጠኛ አይደለም። እንደገና ከመሞከርዎ በፊት ዳግም ይጫኑ።"
"Select a supported notification receiver setting.": "የሚደገፍ የማሳወቂያ ተቀባይ ቅንብር ይምረጡ።"
"Select supported notification receiver settings.": "የሚደገፉ የማሳወቂያ ተቀባይ ቅንብሮችን ይምረጡ።"
"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "የSNMPv3 ማረጋገጫ ወይም የግላዊነት ፕሮቶኮልን ከይለፍ ሐረጉ ጋር ያዘጋጁ።"
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "የተቀመጡ ምስክርነቶች በፍጹም አይታዩም። እነሱን መተካት ሁሉንም አራት የምስክርነት መስኮችን ያዘጋጃል፤ የSNMP ስሪት 3 ን መተው የተጠቃሚ ስሙን እና የይለፍ ሐረጎቹን ያጸዳል።"
"Submit every notification receiver field.": "እያንዳንዱን የማሳወቂያ ተቀባይ መስክ ያስገቡ።"
"The notification receiver changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የማሳወቂያ ተቀባዩ ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"The passphrases do not match.": "የይለፍ ሐረጎቹ አይዛመዱም።"
"Unable to load the notification receiver. Reload before retrying.": "የማሳወቂያ ተቀባዩን መጫን አልተቻለም። እንደገና ከመሞከርዎ በፊት እንደገና ይጫኑ።"
"Unexpected fields were submitted.": "ያልተጠበቁ መስኮች ገብተዋል።"
"Use stored credentials": "የተቀመጡ ምስክርነቶችን ተጠቀም"
"Version 1": "ስሪት 1"
"Version 2": "ስሪት 2"
"Version 3": "ስሪት 3"
