"Action": "Igikorwa"
"Advanced options": "Amahitamo yisumbuye"
"Applying database upgrades": "Gushyira mu bikorwa ivugurura ry'ububiko bw'amakuru"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Bika kopi y'ububiko bw'amakuru, dosiye za RRD, igenamiterere n'imfunguzo. Ivugurura ry'ububiko bw'amakuru rishobora kwemeza impinduka zidasubirwaho n'isubizainyuma rya porogaramu."
"Blocked": "Byahagaritswe"
"Check": "Isuzuma"
"Check again": "Ongera usuzume"
"Check collection freshness and collector connectivity before enabling discovery.": "Suzuma ko ikusanyamakuru rigezweho kandi ko igikusanyamakuru gihujwe neza mbere yo gukoresha itahura."
"Check requirements": "Suzuma ibisabwa"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Isuzuma rireba iyi mikorere n'uburenganzira bw'ububiko bwa dosiye. Ntabwo ryandika dosiye z'igerageza cyangwa ngo rivugane n'ibikoresho."
"Collection profile": "Umwirondoro w'ikusanyamakuru"
"Collector": "Igikusanyamakuru"
"Configure": "Gena imiterere"
"Configuring collection profiles": "Kugena imiterere y'imyirondoro y'ikusanyamakuru"
"Configuring discovery": "Kugena imiterere y'itahura"
"Configuring the local device": "Kugena imiterere y'igikoresho cy'imbere"
"Confirming database version": "Kwemeza verisiyo y'ububiko bw'amakuru"
"Converting selected tables": "Guhindura imbonerahamwe zahiswemo"
"Database version": "Verisiyo y'ububikoshingiro"
"Disabled": "Bihagaritswe"
"Discovery": "Ishakisha"
"Discovery SNMP settings": "Igenamiterere rya SNMP y'ishakisha"
"Discovery range": "Imbibi z'ishakisha"
"Enable discovery after installation": "Emeza ishakisha nyuma y'iyishyiraho"
"Executable paths": "Inzira z'amadosiye akora"
"Execution status": "Imiterere y'ishyirwa mu bikorwa"
"Finished execution": "Ishyirwa mu bikorwa ryarangiye"
"Finishing tasks only. Schema migrations will not be replayed.": "Imirimo isoza gusa. Imihindurire y'imiterere y'ububikoshingiro ntizongera gukorwa."
"I accept the license terms": "Nemeye amategeko n'amabwiriza y'uruhushya"
"I authorize discovery of the displayed range": "Nemereye ishakisha ry'imbibi zigaragajwe"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Nagenzuye inyandiko y'ibikorwa kandi nemeza ko umukozi wabanjirije n'ibikorwa bimushamikiyeho byahagaze"
"I checked the previous attempt and accept that some changes may already be committed": "Nagenzuye igerageza ryabanjirije kandi nemera ko impinduka zimwe zishobora kuba zarashyizwe mu bikorwa"
"I reviewed this plan and have the required backups": "Nasuzumye iyi gahunda kandi mfite kopi z'ububiko zisabwa"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Niba umukozi ahagaze mu buryo butunguranye, bika log/cacti.log kandi wemeze ko igikorwa cye cyarangiye mbere yo kongera kugerageza mu buryo bweruye. Imiterere yo gutegereza ntiyemeza ko gutangira byagenze neza."
"Importing templates": "Kwinjiza inyandikorugero"
"Install Kadupul": "Shyiraho Kadupul"
"Installation and upgrade": "Iyishyiraho n'ivugurura"
"Installation request was rejected.": "Ubusabe bwo gushyiraho bwanzwe."
"Installation steps": "Intambwe zo gushyiraho"
"Installed": "Byashyizwemo"
"Keep a backup of the database, RRD files, configuration and secret material.": "Bika kopi y'ububikoshingiro, amadosiye ya RRD, igenamiterere n'ibanga ry'umutekano."
"Language": "Ururimi"
"Large tables may require the dedicated CLI conversion tool before installation.": "Imbonerahamwe nini zishobora gusaba igikoresho cyihariye cya CLI cyo guhindura mbere yo gushyiraho."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Siga imyanya y'ibanga irimo ubusa kugira ngo ugumane ibyangombwa bibitswe. Ibanga ntiryongera kugaragazwa."
"License": "Uruhushya"
"No action needed": "Nta gikorwa gikenewe"
"Observed": "Byagaragaye"
"Open the console": "Fungura konsole"
"Operation": "Igikorwa"
"Override discovery SNMP settings": "Simbuza igenamiterere rya SNMP y'ishakisha"
"Pass": "Byagenze neza"
"Poller interval in seconds": "Intera y'ikusanyamakuru mu masegonda"
"Preparing CSRF protection": "Gutegura uburinzi bwa CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Aho bigeze hagaragaza icyiciro cya nyuma cyanditswe. Kuvugurura iyi paji ntibigera bitangiza cyangwa ngo byongere kugerageza umukozi."
"Recover stopped attempt": "Garura igerageza ryahagaze"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Igarura rigumana ibyahiswemo byabitswe kandi ntirigera rihagarika umukozi ukora. Ongera usuzume gahunda mbere yo kongera kugerageza."
"Review": "Isuzuma"
"Review installation plan": "Suzuma gahunda yo gushyiraho"
"Run": "Tangiza"
"Run reviewed plan": "Shyira mu bikorwa gahunda yasuzumwe"
"Save and review": "Bika kandi usuzume"
"Scope": "Imbibi z'igikorwa"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Imiterere ntiboneka. Imirimo yabitswe yagumishijweho. Vugurura kugira ngo wongere guhuza; ntutange ubundi busabe bwo gushyiraho."
"Synchronizing collectors": "Guhuza abakusanyamakuru"
"Table conversions": "Ihindura ry'imbonerahamwe"
"Templates": "Inyandikorugero"
"The database version matches this application. Installation does not establish that polling is healthy.": "Verisiyo y'ububikoshingiro ihura n'iyi porogaramu. Iyishyiraho ntiryemeza ko ikusanyamakuru rimeze neza."
"The request outcome is unknown. Check execution status before retrying.": "Ibisohotse mu busabe ntibizwi. Genzura imiterere y'ishyirwa mu bikorwa mbere yo kongera kugerageza."
"Theme": "Insanganyamatsiko"
"Verify": "Genzura"
"Verify the poller schedule and service account.": "Genzura gahunda y'ikusanyamakuru na konti ya serivisi."
"Version change": "Impinduka ya verisiyo"
"Waiting for the installation worker": "Gutegereza umukozi ushyiraho porogaramu"
"collector": "umukusanyamakuru"
"complete": "byarangiye"
"failed": "byanze"
"finish": "soza"
"install": "shyiraho"
"not_started": "ntiratangira"
"partial": "igice"
"running": "biri gukora"
"succeeded": "byagenze neza"
"upgrade": "vugurura"
"waiting": "bitegereje"
"Accept the license before saving the installation plan.": "Emera uruhushya mbere yo kubika gahunda yo gushyiraho."
"Invalid installation form.": "Ifishi yo gushyiraho ntiyemewe."
"Access denied.": "Uburenganzira bwanzwe."
"Confirm the recovery warning before retrying.": "Emeza umuburo w'igarura mbere yo kongera kugerageza."
"Review and confirm the current installation plan.": "Suzuma kandi wemeze gahunda iriho yo gushyiraho."
"Confirm the discovery scope before starting.": "Emeza imbibi z'ishakisha mbere yo gutangira."
"Resolve the blocking checks before starting.": "Kemura ibigenzura bihagarika mbere yo gutangira."
"Too many installer options.": "Amahitamo menshi cyane yo gushyiraho."
"Invalid installer option name.": "Izina ry'ihitamo ryo gushyiraho ntiryemewe."
"Unknown or malformed installer option.": "Ihitamo ryo gushyiraho ritazwi cyangwa ritanditswe neza."
"Installer options must be scalar values.": "Amahitamo yo gushyiraho agomba kuba uduciro tumwe tudafite urutonde."
"Installer option is too long or contains a null byte.": "Ihitamo ryo gushyiraho ni rirerire cyane cyangwa ririmo bayiti y'ubusa."
"Installer IDs and intervals must be whole numbers.": "ID z'iyishyiraho n'intera zigomba kuba imibare yuzuye."
"Installer ID or interval is outside its supported range.": "ID y'iyishyiraho cyangwa intera iri hanze y'urugero rwemewe."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Iyishyiraho ntiryashoboye gukomeza. Ongera ufungure imiterere yaryo kandi usuzume ibigenzura bihagarika mbere yo kongera kugerageza."
"Confirm that the previous worker has stopped before recovering its plan.": "Emeza ko umukozi wabanjirije yahagaze mbere yo kugarura gahunda ye."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Ububikoshingiro bwashyizweho, ariko abakusanyamakuru bamwe baracyakeneye guhuzwa. Ongera ugerageze imirimo isoza nyuma yo kugenzura imiterere yabo."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Iyishyiraho ryahagaze. Bika inyandiko y'ibikorwa by'iyishyiraho, kosora impamvu kandi wemeze mu buryo bweruye kongera kugerageza. Impinduka zimwe z'ububikoshingiro zishobora kuba zarashyizwe mu bikorwa. Genzura isukura ry'ibyongerwamo mbere yo kwemerera kongera kugerageza."
"Next action": "Igikorwa gikurikira"
"Follow the execution status. Do not start another attempt while a worker is active.": "Kurikira imiterere y'ishyirwa mu bikorwa. Ntutangize irindi gerageza mu gihe umukozi agikora."
"Complete the recovery checklist before retrying.": "Uzuza urutonde rw'ibisabwa mu igarura mbere yo kongera kugerageza."
"Verify collection and graph operation before enabling discovery.": "Genzura ikusanyamakuru n'imikorere y'ibishushanyo mbere yo kwemeza ishakisha."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Kemura ibisabwa byahagaze, hanyuma wongere ugenzure. Ibyahiswemo byabitswe byagumishijweho."
"Review the planned changes and backup checklist before authorizing execution.": "Suzuma impinduka zateguwe n'urutonde rw'ibikwiye kubikwa mbere yo kwemerera ishyirwa mu bikorwa."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Hitamo umwirondoro w'ikusanyamakuru kandi wemere uruhushya. Igenamiterere ryo guhitamo rishobora gufungurwa igihe bikenewe."
"Download installation diagnostics": "Kuramo isuzuma ry'iyishyiraho"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Fungura igishushanyo kandi wemeze ko amakuru yacyo ya RRD avugururwa nyuma y'umuzenguruko w'ikusanyamakuru."
"Requirement details": "Ibisobanuro by'ibisabwa"
"Recover": "Garura"
"Recovery checklist": "Urutonde rw'igarura"
"Preserve log/cacti.log and record the failed attempt.": "Bika log/cacti.log kandi wandike igerageza ryanze."
"Confirm that the previous worker and its child processes have stopped.": "Emeza ko umukozi wabanjirije n'ibikorwa bimushamikiyeho byahagaze."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Genzura impinduka zemejwe, ihuzwa ry'abakusanya amakuru n'isukurwa ry'imigereka. Kosora icyabiteye mbere yo kongera kugerageza."
"Review the saved plan again, then explicitly authorize a retry.": "Ongera usuzume gahunda yabitswe, maze wemere ku mugaragaro kongera kugerageza."
"Recover a stopped worker": "Garura umukozi wahagaze"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Koresha igarura gusa nyuma yo kwemeza ko iri gerageza ritagikora. Igarura ntirihagarika igikorwa."
"Collector and installation mode": "Umukusanya n'uburyo bw'ishyirwamo"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Igenamiterere ry'ishyirwaho rigena uruhare rw'umukusanya n'imiyoboro y'ububiko bw'amakuru. Genzura igenamiterere rya seriveri nkuru mbere yo gutangiza umukusanya."
"Discovery and SNMP settings": "Igenamiterere ry'ishakisha na SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Komeza gufunga ishakisha kugeza igihe ikusanya n'umuyoboro w'umukusanya byagenzuwe."
"Template selection": "Guhitamo inyandikorugero"
"Templates selected for import": "Inyandikorugero zahiswemo kwinjizwa"
"No templates selected.": "Nta nyandikorugero zahiswemo."
"Backup checklist": "Urutonde rw'igenzura ry'ikopi y'ububiko"
"Database backup and a tested restoration procedure.": "Ikopi y'ububiko bw'amakuru n'uburyo bwo kugarura bwageragejwe."
"RRD files and the service account permissions needed to restore them.": "Amadosiye ya RRD n'uburenganzira bwa konti ya serivisi bukenewe mu kuyagarura."
"Configuration, keys and plugin data outside the database.": "Igenamiterere, imfunguzo n'amakuru y'imigereka ari hanze y'ububiko bw'amakuru."
"Post-installation checks": "Igenzura rya nyuma y'ishyirwamo"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Igenzura ryemejwe rireba gusa ibimenyetso byagaragajwe. Igenzura ritasuzumwe riracyakeneye igenzurwa n'umukozi ubishinzwe."
"Operational checks still require operator verification.": "Igenzura ry'imikorere riracyakeneye igenzurwa n'umukozi ubishinzwe."
"Status": "Imimerere"
"verified": "Byagenzuwe"
"action_required": "Igikorwa kirakenewe"
"not_assessed": "Ntibyasuzumwe"
"Database schema": "Imiterere y'ububiko bw'amakuru"
"Stored schema matches the application target.": "Imiterere yabitswe ihuye n'intego ya porogaramu."
"Target schema completion has not been confirmed.": "Iyuzuzwa ry'imiterere y'intego ntiryemejwe."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Suzuma umusaruro w'ishyirwamo kandi ukemure amakosa mbere yo kwemeza ko ivugurura ry'imiterere ryarangiye."
"Installation outcome": "Umusaruro w'ishyirwamo"
"A successful receipt matches the current target schema.": "Inyemezabikorwa yagenze neza ihuye n'imiterere y'intego iriho."
"A complete successful installation outcome has not been confirmed.": "Ntiharaboneka iyemezwa ry'umusaruro wuzuye w'ishyirwamo ryagenze neza."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Bika inyandikomikorere y'ishyirwamo kandi ukoreshe uburyo busobanutse bwo kugarura cyangwa kongera kugerageza igihe bikenewe."
"Collector synchronization": "Ihuzwa ry'umukusanya"
"The completed installer reports pending collector synchronization.": "Porogaramu y'ishyirwamo yarangiye iragaragaza ko hari ihuzwa ry'umukusanya ritegereje."
"The completed installer reports no pending collectors.": "Porogaramu y'ishyirwamo yarangiye nta mukusanya utegereje igaragaza."
"Collector completion remains unconfirmed by this partial receipt.": "Irangira ry'umukusanya ntiryemejwe n'iyi nyemezabikorwa ituzuye."
"Collector completion is not established by this installation outcome.": "Irangira ry'umukusanya ntiryemezwa n'uyu musaruro w'ishyirwamo."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Suzuma imimerere y'umukusanya kandi wongere ugerageze imirimo irangiza ku musaruro utuzuye. Ibi ntibigenzura ko ikusanya rya nyuma ari rishya."
"Scheduled collection": "Ikusanya riteganyijwe"
"No poller or device was contacted by this assessment.": "Nta mubazi cyangwa igikoresho cyavugishijwe n'iri suzuma."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Emeza ko gahunda yagenwe ikoresha umubazi nka konti ya serivisi yagenwe kandi usuzume igihe cyayo gisanzwe gikurikira."
"Graph data": "Amakuru y'imbonerahamwe"
"Live samples and RRD updates were not exercised.": "Ingero z'ako kanya n'ivugurura rya RRD ntibyageragejwe."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Nyuma y'igihe gisanzwe cy'ikusanya, emeza ko imbonerahamwe zitezwe zakira ingero nshya kandi usuzume amakosa y'umubazi."
"Recovery readiness": "Ubwitegure bw'igarura"
"Backup restoration was not exercised.": "Igarura ry'ikopi y'ububiko ntiryageragejwe."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Genzura igarura ryitaruye ry'ububiko bw'amakuru, amadosiye ya RRD, igenamiterere n'imfunguzo mbere yo kwiringira igarura."
"No persisted local poller start has been recorded.": "Nta tangira ry'umubazi wa hafi ryabitswe ryanditswe."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Igihe cy'umubazi cyabitswe ntikemewe kandi ntigishobora kwemeza ubuziranenge bwa gahunda."
"The recorded poller start is in the future. Check clock synchronization.": "Itangira ry'umubazi ryanditswe riri mu gihe kizaza. Genzura ihuzwa ry'isaha."
"The recorded poller start is older than the native scheduling tolerance.": "Itangira ry'umubazi ryanditswe rimaze igihe kirenze igihe cyemewe cyo guteganya."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Itangira ry'umubazi wa hafi ryanditswe mu gihe cyemewe cyo guteganya. Irangira n'ubuzima bw'igikoresho ntibyagenzuwe."
"readable": "bishobora gusomwa"
"missing or unreadable": "bibura cyangwa ntibishobora gusomwa"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Garura verisiyo yuzuye n'ibyo ishingiyeho bifunzwe; ha konti ya serivisi uburenganzira bwo gusoma."
"PHP temporary directory": "Ububiko bw'agateganyo bwa PHP"
"directory writable by this process": "ububiko bushobora kwandikwamo n'iki gikorwa"
"missing or not writable": "bibura cyangwa ntibishobora kwandikwamo"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Teganya sys_temp_dir nk'ububiko busanzwe buhari bushobora kwandikwamo na konti ishyiramo porogaramu. Iyinjiza ry'imbere rikoresha amadosiye y'agateganyo."
"Background worker launch": "Gutangiza umukozi w'inyuma"
"required PHP functions available; launch not exercised": "imimaro ya PHP ikenewe irahari; itangiza ntiryageragejwe"
"required PHP launch function disabled": "umumaro wa PHP ukenewe wo gutangiza wahagaritswe"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Fungura exec kuri PHP y'urubuga, cyangwa ukoreshe porogaramu yemewe y'ishyirwamo ya CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Fungura popen, pclose kuri PHP y'urubuga, cyangwa ukoreshe porogaramu yemewe y'ishyirwamo ya CLI."
"Database transaction ownership": "Uburenganzira ku bikorwa by'ububiko bw'amakuru"
"autocommit enabled; no caller-owned transaction": "autocommit irafunguye; nta gikorwa gifitwe n'uwahamagaye"
"autocommit disabled or caller transaction active": "autocommit irafunze cyangwa igikorwa cy'uwahamagaye kirakora"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Kora ishyirwamo hanze y'igikorwa gifitwe n'uwahamagaye kandi ufungure autocommit ku muyoboro wacyo w'impinduka."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Garura ububiko bwa verisiyo kandi uhe konti ishyiramo porogaramu uburenganzira bwo kwandika ku iyinjiza ry'ibikoresho by'inyandikorugero. Ntukabigire ibyandikwamo na buri wese."
"Worker file: install/background.php": "Idosiye y'umukozi: install/background.php"
"Worker file: bin/legacy-installer.php": "Idosiye y'umukozi: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Idosiye y'umukozi: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Aho byinjizwa: resource/snmp_queries"
"Import destination: resource/script_server": "Aho byinjizwa: resource/script_server"
"Import destination: resource/script_queries": "Aho byinjizwa: resource/script_queries"
"Import destination: scripts": "Aho byinjizwa: scripts"
"Database privileges": "Uburenganzira ku bubiko bw'amakuru"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Uburenganzira nyabwo bwo kwimura, burimo inshingano zikora n'uburenganzira bwihariye ku bikoresho, ntibyagenzuwe."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Saba umuyobozi w'ububiko bw'amakuru kugenzura iyandika mu mbonerahamwe, impinduka z'imiterere, imbarutso n'imikorere bikenewe kuri konti n'imiterere y'ishyirwamo. Ntugahe uburenganzira bw'umuyobozi rusange."
"Compare web and worker runtimes": "Gereranya imikorere y'urubuga n'iy'umukozi"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Ibi bitangiza ku mugaragaro igenzura rigufi rya PHP ryo gusoma gusa. Ntabwo bifata porogaramu y'ishyirwamo, ntibyandika amadosiye kandi ntibivugisha ibikoresho."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Igenzura rikomoka kuri iki gikorwa cy'urubuga kandi rikoresha umusemuzi wa PHP w'ishyirwamo wagenwe. Ntirisuzuma gahunda cyangwa serivisi itandukanye."
"I authorize the read-only worker runtime comparison.": "Nemeye igereranya ry'imikorere y'umukozi ryo gusoma gusa."
"Compare runtimes": "Gereranya imikorere"
"Runtime comparison results": "Ibisubizo by'igereranya ry'imikorere"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Itandukaniro ry'uburenganzira n'umwirondoro rishobora kuba ryateguwe ku bushake. Ibyagaragajwe mu gusoma gusa ntibyemeza ko kwandika cyangwa gushyiramo porogaramu bizagenda neza."
"Confirm the read-only worker runtime comparison.": "Emeza igereranya ry'imikorere y'umukozi ryo gusoma gusa."
"The runtime comparison is unavailable.": "Igereranya ry'imikorere ntiriboneka."
"Shared application secret": "Ibanga rya porogaramu rihuriweho"
"A strong web application secret is required before comparison.": "Ibanga rikomeye rya porogaramu y'urubuga rirakenewe mbere yo kugereranya."
"Runtime comparison": "Igereranya ry'imikorere"
"The configured worker runtime did not confirm a bounded comparison.": "Imikorere y'umukozi yagenwe ntiyemeje igereranya rifite imbibi."
"The inherited worker secret could not be confirmed against the web secret.": "Ibanga ry'umukozi ryakomotsweho ntiryashoboye kwemezwa ugereranyije n'ibanga ry'urubuga."
"PHP runtime comparison": "Igereranya ry'ikorwa rya PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Imikorere yombi igomba gushyigikira PHP 8.4; verisiyo z'ibisana bitandukanye bisaba kugenzurwa."
"Required extension comparison": "Igereranya ry'inyongera zisabwa"
"Required extension availability is checked; differing versions require review.": "Ukuboneka kw'inyongera zisabwa kurasuzumwa; verisiyo zitandukanye zisaba kugenzurwa."
"Process identity comparison": "Igereranya ry'umwirondoro w'igikorwa"
"Effective process identity is unavailable on this platform.": "Umwirondoro nyakuri w'igikorwa ntuboneka kuri iyi sisitemu."
"Effective process identities match.": "Imyirondoro nyakuri y'ibikorwa irahura."
"Effective process identities differ; separate service accounts may be intentional.": "Imyirondoro nyakuri y'ibikorwa iratandukanye; konti za serivisi zitandukanye zishobora kuba zarateganyijwe."
"Directory access comparison": "Igereranya ry'uburenganzira ku bubiko bw'amadosiye"
"Read-only directory permission observations match.": "Igenzura ry'uburenganzira bwo gusoma gusa ku bubiko bw'amadosiye rirahura."
"Directory locations or permission observations differ; review the service-account roles.": "Aho ububiko bw'amadosiye buherereye cyangwa igenzura ry'uburenganzira biratandukanye; genzura inshingano za konti za serivisi."
"Worker directory read and traversal": "Gusoma no kunyura mu bubiko bw'amadosiye bw'umukozi wa sisitemu"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Ububiko bw'amadosiye busabwa bw'umukozi wa sisitemu bugomba kuba buhari kandi bukemerera gusoma no kubunyuramo. Nta kwandika kwageragejwe."
"The inherited worker secret matches the web secret for this private challenge.": "Ibanga ryazunguwe ry'umukozi wa sisitemu rirahura n'ibanga ry'urubuga kuri iri suzuma ryihariye."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Genzura umusemuzi wa PHP wagenwe, inyongera zisabwa, ibanga ryazunguwe n'uburenganzira bw'ububiko bw'amadosiye bwa konti ya serivisi. Nta kwandika cyangwa gutangiza porogaramu ishyiraho byakoreshejwe."
"advisory": "inama"
