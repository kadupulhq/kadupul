"A useful name for this Rule.": "Một tên hữu ích cho Quy tắc này."
"Access denied.": "Truy cập bị từ chối."
"Add Tree Rule": "Thêm Quy tắc cây"
"Back to Tree Rules": "Quay lại Quy tắc cây"
"Check this box to enable this rule.": "Chọn hộp này để kích hoạt quy tắc này."
"Choose a Tree for the new Tree Items.": "Chọn một cây cho các mục cây mới."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Chọn một tiêu đề nhánh của Cây đã chọn để gắn vào, hoặc gốc của cây. Đảm bảo tiêu đề nhánh đó vẫn tồn tại khi quy tắc này được thực thi."
"Choose a header of the selected Tree.": "Chọn một tiêu đề nhánh của Cây đã chọn."
"Choose a listed Graph Grouping Style.": "Chọn một Kiểu nhóm đồ thị trong danh sách."
"Choose a listed Leaf Item Type.": "Chọn một Loại mục nút lá trong danh sách."
"Choose an existing Tree.": "Chọn một Cây đang tồn tại."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Chọn cách nhóm các đồ thị khi vẽ cho máy chủ cụ thể này trên cây. Dùng cho các nút lá Thiết bị."
"Data Query Index": "Chỉ mục truy vấn dữ liệu"
"Device": "Thiết bị"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Nút lá Thiết bị không thể sử dụng tiêu chí trên cột đồ thị hoặc mẫu đồ thị. Khi đổi Loại mục nút lá sang Thiết bị, hãy đánh dấu hộp này để xóa các tiêu chí đó; chúng không thể khôi phục."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Nút lá Thiết bị không thể sử dụng tiêu chí dựa trên đồ thị. Xác nhận xóa %count% tiêu chí để lưu."
"Edit Tree Rule": "Chỉnh sửa Quy tắc cây"
"Enable Rule": "Kích hoạt quy tắc"
"Enter a name.": "Nhập tên."
"Enter at most %count% characters.": "Nhập tối đa %count% ký tự."
"Enter single-line text.": "Nhập văn bản một dòng."
"Graph": "Biểu đồ"
"Graph Grouping Style": "Biểu đồ nhóm"
"Graph Template": "Mẫu biểu đồ"
"Leaf Item Type": "Loại vật phẩm lá"
"Name": "Tên"
"Object Selection and Tree Creation Criteria": "Tiêu chí chọn đối tượng và tạo cây"
"Optional: Sub-Tree Item": "Tùy chọn: Mục cây"
"Remove graph-based criteria": "Xóa tiêu chí dựa trên đồ thị"
"Save": "Lưu"
"Save outcome is uncertain. Reload before retrying.": "Kết quả lưu không chắc chắn. Hãy tải lại trước khi thử lại."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Hãy lưu quy tắc trước; Tiêu chí chọn đối tượng và tạo cây sẽ được thêm sau."
"The Item Type that shall be dynamically added to the tree.": "Loại vật phẩm sẽ được tự động thêm vào cây."
"The tree rule changed since you opened this form. Reload before saving.": "Quy tắc cây đã thay đổi kể từ khi bạn mở biểu mẫu này. Hãy tải lại trước khi lưu."
"Tree": "Tree"
"Tree Rule Selection [edit: %name%]": "Chọn quy tắc cây [chỉnh sửa: %name%]"
"Tree Rules Selection [new]": "Chọn quy tắc cây [mới]"
"Tree rule not found.": "Không tìm thấy quy tắc cây."
"Tree rule saved.": "Đã lưu quy tắc cây."
"Unable to load the tree rule. Reload before retrying.": "Không thể tải quy tắc cây. Hãy tải lại trước khi thử lại."
"Unexpected fields were submitted.": "Đã gửi các trường không mong muốn."
