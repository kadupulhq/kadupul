"Advanced options": "प्रगत पर्याय"
"Applying database upgrades": "डेटाबेस अपग्रेड लागू करत आहे"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "डेटाबेस, RRD फाइल्स, कॉन्फिगरेशन आणि कीजचा बॅकअप घ्या. डेटाबेस अपग्रेड असे बदल करू शकतात जे अॅप्लिकेशन रोलबॅक पूर्ववत करू शकत नाही."
"Blocked": "अवरोधित"
"Check": "तपासा"
"Check again": "पुन्हा तपासा"
"Check collection freshness and collector connectivity before enabling discovery.": "डिस्कव्हरी सक्षम करण्यापूर्वी संकलन ताजेपणा आणि कलेक्टर कनेक्टिव्हिटी तपासा."
"Check requirements": "आवश्यकता तपासा"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "तपासण्या या प्रक्रियेची आणि फाइलसिस्टीम परवानग्यांची तपासणी करतात. त्या चाचणी फाइल्स लिहीत नाहीत किंवा डिव्हाइसेसशी संपर्क साधत नाहीत."
