"Operation": "क्रिया"
"Override discovery SNMP settings": "डिस्कव्हरी SNMP सेटिंग्ज अधिलिखित करा"
"Pass": "उत्तीर्ण"
"Poller interval in seconds": "सेकंदांमध्ये पोलर अंतराल"
"Preparing CSRF protection": "CSRF संरक्षण तयार करत आहे"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "प्रगती शेवटचा नोंदवलेला टप्पा दर्शवते. हे पृष्ठ रिफ्रेश केल्याने कधीही वर्कर सुरू होत नाही किंवा पुन्हा प्रयत्न केला जात नाही."
"Recover stopped attempt": "थांबलेला प्रयत्न पुनर्प्राप्त करा"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "पुनर्प्राप्ती जतन केलेल्या निवडी राखते आणि जिवंत वर्कर कधीही समाप्त करत नाही. पुन्हा प्रयत्न करण्यापूर्वी योजनेचे पुन्हा पुनरावलोकन करा."
"Review": "पुनरावलोकन"
"Review installation plan": "इंस्टॉलेशन योजनेचे पुनरावलोकन करा"
"Run": "चालवा"
"Run reviewed plan": "पुनरावलोकन केलेली योजना चालवा"
"Save and review": "जतन करा आणि पुनरावलोकन करा"
"Scope": "व्याप्ती"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "स्थिती उपलब्ध नाही. जतन केलेले काम राखले जाते. पुन्हा कनेक्ट करण्यासाठी रिफ्रेश करा; दुसरे इंस्टॉलेशन सबमिट करू नका."
"Synchronizing collectors": "कलेक्टर्स सिंक करत आहे"
"Table conversions": "तक्ता रूपांतरणे"
"Templates": "टेम्पलेट्स"
"The database version matches this application. Installation does not establish that polling is healthy.": "डेटाबेस आवृत्ती या अॅप्लिकेशनशी जुळते. इंस्टॉलेशन पोलिंग निरोगी आहे हे सिद्ध करत नाही."
"The request outcome is unknown. Check execution status before retrying.": "विनंतीचा परिणाम अज्ञात आहे. पुन्हा प्रयत्न करण्यापूर्वी कार्यवाही स्थिती तपासा."
"Theme": "थीम"
"Verify": "पडताळणी करा"
"Verify the poller schedule and service account.": "पोलर वेळापत्रक आणि सेवा खात्याची पडताळणी करा."
"Version change": "आवृत्ती बदल"
"Waiting for the installation worker": "इंस्टॉलेशन वर्करची प्रतीक्षा करत आहे"
"collector": "कलेक्टर"
"complete": "पूर्ण"
"failed": "अयशस्वी"
"finish": "पूर्ण करा"
"install": "इंस्टॉल करा"
"not_started": "सुरू झालेले नाही"
"partial": "आंशिक"
"running": "सुरू आहे"
"succeeded": "यशस्वी झाले"
"upgrade": "अपग्रेड"
"waiting": "प्रतीक्षेत"
"Accept the license before saving the installation plan.": "इंस्टॉलेशन योजना जतन करण्यापूर्वी परवाना स्वीकारा."
"Invalid installation form.": "अवैध इंस्टॉलेशन फॉर्म."
"Access denied.": "प्रवेश नाकारला."
"Confirm the recovery warning before retrying.": "पुन्हा प्रयत्न करण्यापूर्वी पुनर्प्राप्ती इशाऱ्याची पुष्टी करा."
"Review and confirm the current installation plan.": "सध्याच्या इंस्टॉलेशन योजनेचे पुनरावलोकन आणि पुष्टी करा."
"Confirm the discovery scope before starting.": "सुरू करण्यापूर्वी डिस्कव्हरी व्याप्तीची पुष्टी करा."
"Resolve the blocking checks before starting.": "सुरू करण्यापूर्वी अवरोधित करणाऱ्या तपासण्यांचे निराकरण करा."
"Too many installer options.": "खूप जास्त इंस्टॉलर पर्याय."
"Invalid installer option name.": "अवैध इंस्टॉलर पर्याय नाव."
"Unknown or malformed installer option.": "अज्ञात किंवा विकृत इंस्टॉलर पर्याय."
"Installer options must be scalar values.": "इंस्टॉलर पर्याय स्केलर मूल्ये असणे आवश्यक आहे."
"Installer option is too long or contains a null byte.": "इंस्टॉलर पर्याय खूप मोठा आहे किंवा त्यात नल बाइट आहे."
"Installer IDs and intervals must be whole numbers.": "इंस्टॉलर IDs आणि अंतराल पूर्णांक असणे आवश्यक आहे."
"Installer ID or interval is outside its supported range.": "इंस्टॉलर ID किंवा अंतराल त्याच्या समर्थित मर्यादेबाहेर आहे."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "इंस्टॉलेशन पुढे जाऊ शकले नाही. पुन्हा प्रयत्न करण्यापूर्वी त्याची स्थिती रीलोड करा आणि अवरोधित तपासण्यांचे पुनरावलोकन करा."
"Confirm that the previous worker has stopped before recovering its plan.": "मागील वर्करची योजना पुनर्प्राप्त करण्यापूर्वी तो थांबला आहे याची पुष्टी करा."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "डेटाबेस इंस्टॉल केलेला आहे, परंतु काही कलेक्टर्सना अद्याप सिंक्रोनायझेशन आवश्यक आहे. त्यांची स्थिती तपासल्यानंतर पूर्ण करण्याची कामे पुन्हा प्रयत्न करा."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "इंस्टॉलेशन थांबले. इंस्टॉलर लॉग जतन करा, कारण दुरुस्त करा आणि पुन्हा प्रयत्नाची स्पष्टपणे पुष्टी करा. काही डेटाबेस बदल आधीच कमिट झाले असू शकतात. पुन्हा प्रयत्नास अधिकृत करण्यापूर्वी प्लगइन क्लीनअप तपासा."
"Next action": "पुढील कृती"
"Follow the execution status. Do not start another attempt while a worker is active.": "कार्यवाही स्थितीचे अनुसरण करा. वर्कर सक्रिय असताना दुसरा प्रयत्न सुरू करू नका."
"Complete the recovery checklist before retrying.": "पुन्हा प्रयत्न करण्यापूर्वी पुनर्प्राप्ती चेकलिस्ट पूर्ण करा."
"Verify collection and graph operation before enabling discovery.": "डिस्कव्हरी सक्षम करण्यापूर्वी संकलन आणि ग्राफ कार्यप्रणालीची पडताळणी करा."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "अवरोधित आवश्यकतांचे निराकरण करा, नंतर पुन्हा तपासा. जतन केलेल्या निवडी राखल्या जातात."
"Review the planned changes and backup checklist before authorizing execution.": "कार्यवाही अधिकृत करण्यापूर्वी नियोजित बदल आणि बॅकअप चेकलिस्टचे पुनरावलोकन करा."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "संकलन प्रोफाइल निवडा आणि परवाना स्वीकारा. आवश्यक असल्यास पर्यायी सेटिंग्ज उघडता येतात."
"Download installation diagnostics": "इंस्टॉलेशन निदान डाउनलोड करा"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "एक ग्राफ उघडा आणि पोलर चक्रानंतर त्याचा RRD डेटा अद्यतनित होतो याची खात्री करा."
"Requirement details": "आवश्यकता तपशील"
"Recover": "पुनर्प्राप्त करा"
"Recovery checklist": "पुनर्प्राप्ती चेकलिस्ट"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log जतन करा आणि अयशस्वी प्रयत्नाची नोंद करा."
"Confirm that the previous worker and its child processes have stopped.": "मागील वर्कर आणि त्याच्या चाइल्ड प्रक्रिया थांबल्या आहेत याची पुष्टी करा."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "कमिट केलेले बदल, कलेक्टर सिंक्रोनायझेशन आणि प्लगइन क्लीनअपचे निरीक्षण करा. पुन्हा प्रयत्न करण्यापूर्वी कारण दुरुस्त करा."
"Review the saved plan again, then explicitly authorize a retry.": "जतन केलेल्या योजनेचे पुन्हा पुनरावलोकन करा, नंतर स्पष्टपणे पुन्हा प्रयत्नास अधिकृत करा."
"Recover a stopped worker": "थांबलेला वर्कर पुनर्प्राप्त करा"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "हा प्रयत्न यापुढे चालू नाही याची पुष्टी केल्यानंतरच पुनर्प्राप्ती वापरा. पुनर्प्राप्ती प्रक्रिया थांबवत नाही."
"Collector and installation mode": "कलेक्टर आणि इंस्टॉलेशन मोड"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "डिप्लॉयमेंट कॉन्फिगरेशन कलेक्टर भूमिका आणि डेटाबेस कनेक्शन ठरवते. कलेक्टर सुरू करण्यापूर्वी प्राथमिक सर्व्हर कॉन्फिगरेशनची पडताळणी करा."
"Discovery and SNMP settings": "डिस्कव्हरी आणि SNMP सेटिंग्ज"
"Keep discovery disabled until collection and collector connectivity have been verified.": "संकलन आणि कलेक्टर कनेक्टिव्हिटीची पडताळणी होईपर्यंत डिस्कव्हरी अक्षम ठेवा."
"Template selection": "टेम्पलेट निवड"
"Templates selected for import": "आयातीसाठी निवडलेली टेम्पलेट्स"
"No templates selected.": "कोणतीही टेम्पलेट्स निवडलेली नाहीत."
"Backup checklist": "बॅकअप चेकलिस्ट"
"Database backup and a tested restoration procedure.": "डेटाबेस बॅकअप आणि चाचणी केलेली पुनर्संचयन प्रक्रिया."
"RRD files and the service account permissions needed to restore them.": "RRD फाइल्स आणि त्या पुनर्संचयित करण्यासाठी आवश्यक सेवा खाते परवानग्या."
"Configuration, keys and plugin data outside the database.": "डेटाबेसबाहेरील कॉन्फिगरेशन, कीज आणि प्लगइन डेटा."
"Post-installation checks": "इंस्टॉलेशननंतरच्या तपासण्या"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "पडताळलेल्या तपासण्या केवळ दर्शविलेले पुरावे समाविष्ट करतात. मूल्यांकन न केलेल्या तपासण्यांसाठी अद्याप ऑपरेटर पडताळणी आवश्यक आहे."
"Operational checks still require operator verification.": "परिचालन तपासण्यांसाठी अद्याप ऑपरेटर पडताळणी आवश्यक आहे."
"Status": "स्थिती"
"verified": "पडताळलेले"
"action_required": "कृती आवश्यक"
"not_assessed": "मूल्यांकन केलेले नाही"
"Database schema": "डेटाबेस स्कीमा"
"Stored schema matches the application target.": "संचयित स्कीमा अॅप्लिकेशन लक्ष्याशी जुळते."
"Target schema completion has not been confirmed.": "लक्ष्य स्कीमा पूर्णतेची पुष्टी झालेली नाही."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "स्कीमा अपग्रेड पूर्ण मानण्यापूर्वी इंस्टॉलेशन परिणामाचे पुनरावलोकन करा आणि अपयशांचे निराकरण करा."
"Installation outcome": "इंस्टॉलेशन परिणाम"
"A successful receipt matches the current target schema.": "यशस्वी पावती सध्याच्या लक्ष्य स्कीमाशी जुळते."
"A complete successful installation outcome has not been confirmed.": "पूर्ण यशस्वी इंस्टॉलेशन परिणामाची पुष्टी झालेली नाही."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "इंस्टॉलर लॉग जतन करा आणि आवश्यक तेव्हा स्पष्ट पुनर्प्राप्ती किंवा पुन्हा प्रयत्न प्रक्रिया वापरा."
"Collector synchronization": "कलेक्टर सिंक्रोनायझेशन"
"The completed installer reports pending collector synchronization.": "पूर्ण झालेला इंस्टॉलर प्रलंबित कलेक्टर सिंक्रोनायझेशन नोंदवतो."
"The completed installer reports no pending collectors.": "पूर्ण झालेला इंस्टॉलर कोणतेही प्रलंबित कलेक्टर्स नोंदवत नाही."
"Collector completion remains unconfirmed by this partial receipt.": "या आंशिक पावतीद्वारे कलेक्टर पूर्णतेची पुष्टी बाकी आहे."
"Collector completion is not established by this installation outcome.": "या इंस्टॉलेशन परिणामाद्वारे कलेक्टर पूर्णता सिद्ध होत नाही."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "कलेक्टर स्थितीचे पुनरावलोकन करा आणि आंशिक परिणामांसाठी पूर्ण करण्याची कामे पुन्हा प्रयत्न करा. यामुळे नंतरच्या संकलन ताजेपणाची पडताळणी होत नाही."
"Scheduled collection": "नियोजित संकलन"
"No poller or device was contacted by this assessment.": "या मूल्यांकनाद्वारे कोणत्याही पोलर किंवा डिव्हाइसशी संपर्क साधला गेला नाही."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "कॉन्फिगर केलेले शेड्यूलर पोलरला इच्छित सेवा खाते म्हणून चालवते याची पुष्टी करा आणि त्याच्या पुढील सामान्य चक्राचे पुनरावलोकन करा."
"Graph data": "ग्राफ डेटा"
"Live samples and RRD updates were not exercised.": "थेट नमुने आणि RRD अद्यतने तपासली गेली नाहीत."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "सामान्य संकलन चक्रानंतर, अपेक्षित ग्राफना ताजे नमुने मिळतात याची खात्री करा आणि पोलर त्रुटींचे पुनरावलोकन करा."
"Recovery readiness": "पुनर्प्राप्ती सज्जता"
"Backup restoration was not exercised.": "बॅकअप पुनर्संचयन तपासले गेले नाही."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "पुनर्प्राप्तीवर अवलंबून राहण्यापूर्वी डेटाबेस, RRD फाइल्स, कॉन्फिगरेशन आणि की सामग्रीचे वेगळे पुनर्संचयन पडताळा."
"No persisted local poller start has been recorded.": "कोणतीही कायमस्वरूपी स्थानिक पोलर सुरुवात नोंदवली गेलेली नाही."
"Persisted poller timing is invalid and cannot establish scheduler health.": "कायमस्वरूपी पोलर वेळ अवैध आहे आणि शेड्यूलर स्थिती सिद्ध करू शकत नाही."
"The recorded poller start is in the future. Check clock synchronization.": "नोंदवलेली पोलर सुरुवात भविष्यातील आहे. घड्याळ सिंक्रोनायझेशन तपासा."
"The recorded poller start is older than the native scheduling tolerance.": "नोंदवलेली पोलर सुरुवात मूळ शेड्यूलिंग सहनशीलतेपेक्षा जुनी आहे."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "मूळ शेड्यूलिंग सहनशीलतेमध्ये स्थानिक पोलरची सुरुवात नोंदवली गेली. पूर्णता आणि डिव्हाइस स्थितीची पडताळणी झालेली नाही."
"readable": "वाचनीय"
"missing or unreadable": "गहाळ किंवा वाचता न येण्याजोगे"
"Restore the complete release and its locked dependencies; grant the service account read access.": "संपूर्ण रिलीझ आणि त्याची लॉक केलेली अवलंबित्वे पुनर्संचयित करा; सेवा खात्याला वाचन प्रवेश द्या."
"PHP temporary directory": "PHP तात्पुरती निर्देशिका"
"directory writable by this process": "या प्रक्रियेद्वारे लिहिता येण्याजोगी निर्देशिका"
"missing or not writable": "गहाळ किंवा लिहिता न येण्याजोगे"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "इंस्टॉलेशन खात्याद्वारे लिहिता येण्याजोग्या विद्यमान निर्देशिकेनुसार sys_temp_dir कॉन्फिगर करा. मूळ आयात तात्पुरत्या फाइल्स वापरतात."
"Background worker launch": "बॅकग्राउंड वर्कर लॉन्च"
"required PHP functions available; launch not exercised": "आवश्यक PHP फंक्शन्स उपलब्ध आहेत; लॉन्च केले गेले नाही"
"required PHP launch function disabled": "आवश्यक PHP लॉन्च फंक्शन अक्षम आहे"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "वेब PHP रनटाइमसाठी exec सक्षम करा, किंवा अधिकृत CLI इंस्टॉलर वापरा."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "वेब PHP रनटाइमसाठी popen, pclose सक्षम करा, किंवा अधिकृत CLI इंस्टॉलर वापरा."
"Database transaction ownership": "डेटाबेस ट्रान्झॅक्शन मालकी"
"autocommit enabled; no caller-owned transaction": "ऑटोकमिट सक्षम; कोणतेही कॉलर-मालकीचे ट्रान्झॅक्शन नाही"
"autocommit disabled or caller transaction active": "ऑटोकमिट अक्षम किंवा कॉलर ट्रान्झॅक्शन सक्रिय"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "कॉलर-मालकीच्या ट्रान्झॅक्शनच्या बाहेर इंस्टॉलेशन चालवा आणि त्याच्या म्यूटेशन कनेक्शनवर ऑटोकमिट सक्षम करा."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "रिलीझ निर्देशिका पुनर्संचयित करा आणि टेम्पलेट संसाधन आयातीसाठी इंस्टॉलेशन खात्याला लेखन प्रवेश द्या. ती सर्वांसाठी लिहिता येण्याजोगी बनवू नका."
"Worker file: install/background.php": "वर्कर फाइल: install/background.php"
"Worker file: bin/legacy-installer.php": "वर्कर फाइल: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "वर्कर फाइल: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "आयात गंतव्यस्थान: resource/snmp_queries"
"Import destination: resource/script_server": "आयात गंतव्यस्थान: resource/script_server"
"Import destination: resource/script_queries": "आयात गंतव्यस्थान: resource/script_queries"
"Import destination: scripts": "आयात गंतव्यस्थान: scripts"
"Database privileges": "डेटाबेस विशेषाधिकार"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "सक्रिय भूमिका आणि ऑब्जेक्ट-विशिष्ट परवानग्यांसह प्रभावी स्थलांतर विशेषाधिकार पडताळले गेले नाहीत."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "डेटाबेस प्रशासकाकडून इंस्टॉलेशन खाते आणि स्कीमासाठी आवश्यक तक्ता लेखन, स्कीमा बदल, ट्रिगर्स आणि रूटीन्सची पडताळणी करून घ्या. जागतिक प्रशासक विशेषाधिकार देऊ नका."
"Compare web and worker runtimes": "वेब आणि वर्कर रनटाइम तुलना करा"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "हे स्पष्टपणे एक लहान केवळ-वाचनीय PHP प्रोब सुरू करते. ते इंस्टॉलर आरक्षित करत नाही, फाइल्स लिहीत नाही किंवा डिव्हाइसेसशी संपर्क साधत नाही."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "हा प्रोब या वेब प्रक्रियेचा वारसा घेतो आणि कॉन्फिगर केलेला इंस्टॉलर PHP इंटरप्रिटर वापरतो. तो स्वतंत्र शेड्यूलर किंवा सेवेची तपासणी करत नाही."
"I authorize the read-only worker runtime comparison.": "मी केवळ-वाचनीय वर्कर रनटाइम तुलनेला अधिकृत करतो."
"Compare runtimes": "रनटाइम तुलना करा"
"Runtime comparison results": "रनटाइम तुलना परिणाम"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "परवानगी आणि ओळख फरक हेतुपुरस्सर असू शकतात. केवळ-वाचनीय निरीक्षणे लेखन किंवा इंस्टॉलेशन यशस्वी होईल हे सिद्ध करत नाहीत."
"Confirm the read-only worker runtime comparison.": "केवळ-वाचनीय वर्कर रनटाइम तुलनेची पुष्टी करा."
"The runtime comparison is unavailable.": "रनटाइम तुलना उपलब्ध नाही."
"Shared application secret": "सामायिक अॅप्लिकेशन सिक्रेट"
"A strong web application secret is required before comparison.": "तुलना करण्यापूर्वी एक मजबूत वेब अॅप्लिकेशन सिक्रेट आवश्यक आहे."
"Runtime comparison": "रनटाइम तुलना"
"The configured worker runtime did not confirm a bounded comparison.": "कॉन्फिगर केलेल्या वर्कर रनटाइमने मर्यादित तुलनेची पुष्टी केली नाही."
"The inherited worker secret could not be confirmed against the web secret.": "वेब सिक्रेटशी वारसाहक्काने मिळालेल्या वर्कर सिक्रेटची पुष्टी होऊ शकली नाही."
"PHP runtime comparison": "PHP रनटाइम तुलना"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "दोन्ही रनटाइम PHP 8.4 ला समर्थन देणारे असणे आवश्यक आहे; भिन्न पॅच आवृत्त्यांचे पुनरावलोकन आवश्यक आहे."
"Required extension comparison": "आवश्यक एक्स्टेंशन तुलना"
"Required extension availability is checked; differing versions require review.": "आवश्यक एक्स्टेंशन उपलब्धता तपासली गेली आहे; भिन्न आवृत्त्यांचे पुनरावलोकन आवश्यक आहे."
"Process identity comparison": "प्रक्रिया ओळख तुलना"
"Effective process identity is unavailable on this platform.": "या प्लॅटफॉर्मवर प्रभावी प्रक्रिया ओळख उपलब्ध नाही."
"Effective process identities match.": "प्रभावी प्रक्रिया ओळख जुळतात."
"Effective process identities differ; separate service accounts may be intentional.": "प्रभावी प्रक्रिया ओळख भिन्न आहेत; स्वतंत्र सेवा खाती हेतुपुरस्सर असू शकतात."
"Directory access comparison": "निर्देशिका प्रवेश तुलना"
"Read-only directory permission observations match.": "केवळ-वाचनीय निर्देशिका परवानगी निरीक्षणे जुळतात."
"Directory locations or permission observations differ; review the service-account roles.": "निर्देशिका स्थाने किंवा परवानगी निरीक्षणे भिन्न आहेत; सेवा-खाते भूमिकांचे पुनरावलोकन करा."
"Worker directory read and traversal": "वर्कर निर्देशिका वाचन आणि प्रवास"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "आवश्यक वर्कर निर्देशिका अस्तित्वात असणे आणि वाचन व प्रवास करण्याची परवानगी असणे आवश्यक आहे. कोणतेही लेखन तपासले गेले नाही."
"The inherited worker secret matches the web secret for this private challenge.": "या खाजगी आव्हानासाठी वारसाहक्काने मिळालेले वर्कर सिक्रेट वेब सिक्रेटशी जुळते."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "कॉन्फिगर केलेले PHP इंटरप्रिटर, आवश्यक एक्स्टेंशन्स, वारसाहक्काने मिळालेले सिक्रेट आणि सेवा-खाते निर्देशिका परवानग्यांचे पुनरावलोकन करा. कोणतेही लेखन किंवा इंस्टॉलर स्टार्टअप केले गेले नाही."
"advisory": "सल्लागार"
