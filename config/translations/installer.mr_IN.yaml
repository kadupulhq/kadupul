"Finished execution": "कार्यवाही पूर्ण झाली"
"Finishing tasks only. Schema migrations will not be replayed.": "केवळ पूर्ण करण्याची कामे. स्कीमा मायग्रेशन्स पुन्हा चालवली जाणार नाहीत."
"I accept the license terms": "मी परवाना अटी स्वीकारतो"
"I authorize discovery of the displayed range": "मी प्रदर्शित श्रेणीच्या डिस्कव्हरीला अधिकृत करतो"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "मी लॉग तपासला आहे आणि मागील वर्कर तसेच त्याच्या चाइल्ड प्रक्रिया थांबल्या आहेत याची पुष्टी करतो"
"I checked the previous attempt and accept that some changes may already be committed": "मी मागील प्रयत्न तपासला आहे आणि काही बदल आधीच कमिट झाले असू शकतात हे स्वीकारतो"
"I reviewed this plan and have the required backups": "मी या योजनेचे पुनरावलोकन केले आहे आणि माझ्याकडे आवश्यक बॅकअप आहेत"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "वर्कर अनपेक्षितपणे थांबल्यास, log/cacti.log जतन करा आणि स्पष्टपणे पुन्हा प्रयत्न करण्यापूर्वी त्याची प्रक्रिया समाप्त झाली असल्याची पुष्टी करा. प्रतीक्षा स्थिती यशस्वी लॉन्चची पुष्टी करत नाही."
"Importing templates": "टेम्पलेट्स आयात करत आहे"
"Install Kadupul": "Kadupul इंस्टॉल करा"
"Installation and upgrade": "इंस्टॉलेशन आणि अपग्रेड"
