"Installation steps": "इंस्टॉलेशन पायऱ्या"
"Installed": "इंस्टॉल केलेले"
"Keep a backup of the database, RRD files, configuration and secret material.": "डेटाबेस, RRD फाइल्स, कॉन्फिगरेशन आणि गुप्त सामग्रीचा बॅकअप ठेवा."
"Language": "भाषा"
"Large tables may require the dedicated CLI conversion tool before installation.": "मोठ्या तक्त्यांसाठी इंस्टॉलेशनपूर्वी समर्पित CLI रूपांतरण साधन आवश्यक असू शकते."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "संचयित क्रेडेन्शियल्स राखण्यासाठी सिक्रेट फील्ड्स रिकामे ठेवा. सिक्रेट्स पुन्हा कधीही प्रदर्शित केले जात नाहीत."
"License": "परवाना"
