"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "संग्रहीत क्रेडेंशियल बनाए रखने के लिए गुप्त फ़ील्ड रिक्त छोड़ें। सीक्रेट कभी पुनः प्रदर्शित नहीं किए जाते हैं।"
