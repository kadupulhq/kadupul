"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "पुनर्प्राप्ति सहेजे गए चयनों को बनाए रखती है और कभी भी किसी सक्रिय वर्कर को समाप्त नहीं करती है। पुनः प्रयास करने से पहले योजना की फिर से समीक्षा करें।"
