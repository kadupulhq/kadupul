"Accept the license before saving the installation plan.": "इंस्टॉलेशन योजना सहेजने से पहले लाइसेंस स्वीकार करें।"
"Invalid installation form.": "अमान्य इंस्टॉलेशन फ़ॉर्म।"
"Access denied.": "पहुंच अस्वीकृत।"
"Confirm the recovery warning before retrying.": "पुनः प्रयास करने से पहले पुनर्प्राप्ति चेतावनी की पुष्टि करें।"
"Review and confirm the current installation plan.": "वर्तमान इंस्टॉलेशन योजना की समीक्षा और पुष्टि करें।"
"Confirm the discovery scope before starting.": "शुरू करने से पहले डिस्कवरी दायरे की पुष्टि करें।"
"Resolve the blocking checks before starting.": "शुरू करने से पहले अवरोधक जांचों को हल करें।"
"Too many installer options.": "बहुत अधिक इंस्टॉलर विकल्प।"
"Invalid installer option name.": "अमान्य इंस्टॉलर विकल्प नाम।"
"Unknown or malformed installer option.": "अज्ञात या विकृत इंस्टॉलर विकल्प।"
"Installer options must be scalar values.": "इंस्टॉलर विकल्प स्केलर मान होने चाहिए।"
"Installer option is too long or contains a null byte.": "इंस्टॉलर विकल्प बहुत लंबा है या इसमें नल बाइट है।"
"Installer IDs and intervals must be whole numbers.": "इंस्टॉलर IDs और अंतराल पूर्ण संख्याएं होने चाहिए।"
"Installer ID or interval is outside its supported range.": "इंस्टॉलर ID या अंतराल अपनी समर्थित सीमा से बाहर है।"
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "इंस्टॉलेशन आगे नहीं बढ़ सका। पुनः प्रयास करने से पहले इसकी स्थिति पुनः लोड करें और अवरोधक जांचों की समीक्षा करें।"
"Confirm that the previous worker has stopped before recovering its plan.": "अपनी योजना पुनर्प्राप्त करने से पहले पुष्टि करें कि पिछला वर्कर बंद हो गया है।"
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "डेटाबेस इंस्टॉल हो गया है, लेकिन कुछ कलेक्टरों को अभी भी सिंक्रनाइज़ेशन की आवश्यकता है। उनकी स्थिति जांचने के बाद समापन कार्यों का पुनः प्रयास करें।"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "इंस्टॉलेशन रुक गया। इंस्टॉलर लॉग सुरक्षित रखें, कारण सुधारें और स्पष्ट रूप से पुनः प्रयास की पुष्टि करें। कुछ डेटाबेस परिवर्तन पहले ही कमिट हो चुके हो सकते हैं। पुनः प्रयास को अधिकृत करने से पहले प्लगइन क्लीनअप जांचें।"
"Next action": "अगली कार्रवाई"
"Follow the execution status. Do not start another attempt while a worker is active.": "निष्पादन स्थिति का पालन करें। जब कोई वर्कर सक्रिय हो तो दूसरा प्रयास शुरू न करें।"
"Complete the recovery checklist before retrying.": "पुनः प्रयास करने से पहले पुनर्प्राप्ति चेकलिस्ट पूरी करें।"
"Verify collection and graph operation before enabling discovery.": "डिस्कवरी सक्षम करने से पहले संग्रह और ग्राफ़ संचालन सत्यापित करें।"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "अवरुद्ध आवश्यकताओं को हल करें, फिर पुनः जांचें। सहेजे गए चयन सुरक्षित रहते हैं।"
"Review the planned changes and backup checklist before authorizing execution.": "निष्पादन को अधिकृत करने से पहले नियोजित परिवर्तनों और बैकअप चेकलिस्ट की समीक्षा करें।"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "संग्रह प्रोफ़ाइल चुनें और लाइसेंस स्वीकार करें। आवश्यकता पड़ने पर वैकल्पिक सेटिंग्स खोली जा सकती हैं।"
"Download installation diagnostics": "इंस्टॉलेशन डायग्नोस्टिक्स डाउनलोड करें"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "एक ग्राफ़ खोलें और पुष्टि करें कि पोलर चक्र के बाद उसका RRD डेटा अपडेट होता है।"
"Requirement details": "आवश्यकता विवरण"
"Recover": "पुनर्प्राप्त करें"
"Recovery checklist": "पुनर्प्राप्ति चेकलिस्ट"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log सुरक्षित रखें और विफल प्रयास दर्ज करें।"
"Confirm that the previous worker and its child processes have stopped.": "पुष्टि करें कि पिछला वर्कर और उसकी चाइल्ड प्रक्रियाएं बंद हो गई हैं।"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "कमिट किए गए परिवर्तनों, कलेक्टर सिंक्रनाइज़ेशन और प्लगइन क्लीनअप का निरीक्षण करें। पुनः प्रयास करने से पहले कारण को सुधारें।"
"Review the saved plan again, then explicitly authorize a retry.": "सहेजी गई योजना की फिर से समीक्षा करें, फिर स्पष्ट रूप से पुनः प्रयास को अधिकृत करें।"
"Recover a stopped worker": "रुके हुए वर्कर को पुनर्प्राप्त करें"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "पुनर्प्राप्ति का उपयोग केवल यह पुष्टि करने के बाद करें कि यह प्रयास अब नहीं चल रहा है। पुनर्प्राप्ति किसी प्रक्रिया को रोकती नहीं है।"
"Collector and installation mode": "कलेक्टर और इंस्टॉलेशन मोड"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "परिनियोजन कॉन्फ़िगरेशन कलेक्टर की भूमिका और डेटाबेस कनेक्शन निर्धारित करता है। कलेक्टर शुरू करने से पहले प्राथमिक सर्वर कॉन्फ़िगरेशन सत्यापित करें।"
"Discovery and SNMP settings": "डिस्कवरी और SNMP सेटिंग्स"
"Keep discovery disabled until collection and collector connectivity have been verified.": "संग्रह और कलेक्टर कनेक्टिविटी सत्यापित होने तक डिस्कवरी को अक्षम रखें।"
"Template selection": "टेम्पलेट चयन"
"Templates selected for import": "आयात के लिए चयनित टेम्पलेट"
"No templates selected.": "कोई टेम्पलेट चयनित नहीं।"
"Backup checklist": "बैकअप चेकलिस्ट"
"Database backup and a tested restoration procedure.": "डेटाबेस बैकअप और एक परीक्षित पुनर्स्थापना प्रक्रिया।"
"RRD files and the service account permissions needed to restore them.": "RRD फ़ाइलें और उन्हें पुनर्स्थापित करने के लिए आवश्यक सेवा खाता अनुमतियां।"
"Configuration, keys and plugin data outside the database.": "डेटाबेस के बाहर कॉन्फ़िगरेशन, कुंजियां और प्लगइन डेटा।"
"Post-installation checks": "इंस्टॉलेशन के बाद की जांचें"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "सत्यापित जांचें केवल दिखाए गए साक्ष्य को कवर करती हैं। अमूल्यांकित जांचों के लिए अभी भी ऑपरेटर सत्यापन आवश्यक है।"
"Operational checks still require operator verification.": "परिचालन जांचों के लिए अभी भी ऑपरेटर सत्यापन आवश्यक है।"
