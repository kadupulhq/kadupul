"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "डेटाबेस, RRD फ़ाइलों, कॉन्फ़िगरेशन और कुंजियों का बैकअप लें। डेटाबेस अपग्रेड ऐसे परिवर्तन कर सकते हैं जिन्हें एप्लिकेशन रोलबैक पूर्ववत नहीं कर सकता।"
