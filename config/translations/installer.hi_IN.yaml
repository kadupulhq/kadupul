"Check requirements": "आवश्यकताएं जांचें"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "जांच इस प्रक्रिया और फ़ाइल सिस्टम अनुमतियों का निरीक्षण करती हैं। वे परीक्षण फ़ाइलें नहीं लिखतीं या डिवाइस से संपर्क नहीं करतीं।"
