"Finishing tasks only. Schema migrations will not be replayed.": "केवल समापन कार्य। स्कीमा माइग्रेशन को पुनः नहीं चलाया जाएगा।"
"I accept the license terms": "मैं लाइसेंस की शर्तों को स्वीकार करता हूं"
