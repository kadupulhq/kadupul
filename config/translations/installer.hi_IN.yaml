"Stored schema matches the application target.": "संग्रहीत स्कीमा एप्लिकेशन लक्ष्य से मेल खाता है।"
"Target schema completion has not been confirmed.": "लक्ष्य स्कीमा पूर्णता की पुष्टि नहीं हुई है।"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "स्कीमा अपग्रेड को पूर्ण मानने से पहले इंस्टॉलेशन परिणाम की समीक्षा करें और विफलताओं को हल करें।"
"Installation outcome": "इंस्टॉलेशन परिणाम"
"A successful receipt matches the current target schema.": "एक सफल रसीद वर्तमान लक्ष्य स्कीमा से मेल खाती है।"
"A complete successful installation outcome has not been confirmed.": "पूर्ण और सफल इंस्टॉलेशन परिणाम की पुष्टि नहीं हुई है।"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "इंस्टॉलर लॉग सुरक्षित रखें और आवश्यकता पड़ने पर स्पष्ट पुनर्प्राप्ति या पुनः प्रयास प्रक्रिया का उपयोग करें।"
"Collector synchronization": "कलेक्टर सिंक्रनाइज़ेशन"
"The completed installer reports pending collector synchronization.": "पूर्ण हुआ इंस्टॉलर लंबित कलेक्टर सिंक्रनाइज़ेशन की रिपोर्ट करता है।"
"The completed installer reports no pending collectors.": "पूर्ण हुआ इंस्टॉलर कोई लंबित कलेक्टर रिपोर्ट नहीं करता है।"
"Collector completion remains unconfirmed by this partial receipt.": "इस आंशिक रसीद से कलेक्टर की पूर्णता की पुष्टि नहीं होती है।"
"Collector completion is not established by this installation outcome.": "इस इंस्टॉलेशन परिणाम द्वारा कलेक्टर की पूर्णता स्थापित नहीं होती है।"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "कलेक्टर स्थिति की समीक्षा करें और आंशिक परिणामों के लिए समापन कार्यों का पुनः प्रयास करें। यह बाद के संग्रह की ताज़गी को सत्यापित नहीं करता है।"
"Scheduled collection": "नियोजित संग्रह"
"No poller or device was contacted by this assessment.": "इस मूल्यांकन द्वारा किसी पोलर या डिवाइस से संपर्क नहीं किया गया था।"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "पुष्टि करें कि कॉन्फ़िगर किया गया शेड्यूलर पोलर को इच्छित सेवा खाते के रूप में चलाता है और उसके अगले सामान्य चक्र की समीक्षा करें।"
"Graph data": "ग्राफ़ डेटा"
"Live samples and RRD updates were not exercised.": "लाइव नमूने और RRD अपडेट का परीक्षण नहीं किया गया था।"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "सामान्य संग्रह चक्र के बाद, पुष्टि करें कि अपेक्षित ग्राफ़ को नए नमूने मिल रहे हैं और पोलर त्रुटियों की समीक्षा करें।"
"Recovery readiness": "पुनर्प्राप्ति तत्परता"
"Backup restoration was not exercised.": "बैकअप पुनर्स्थापना का परीक्षण नहीं किया गया था।"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "पुनर्प्राप्ति पर निर्भर रहने से पहले डेटाबेस, RRD फ़ाइलों, कॉन्फ़िगरेशन और कुंजी सामग्री की एक पृथक पुनर्स्थापना सत्यापित करें।"
"No persisted local poller start has been recorded.": "कोई स्थायी स्थानीय पोलर प्रारंभ दर्ज नहीं किया गया है।"
"Persisted poller timing is invalid and cannot establish scheduler health.": "स्थायी पोलर समय अमान्य है और शेड्यूलर की स्थिति स्थापित नहीं कर सकता।"
"The recorded poller start is in the future. Check clock synchronization.": "दर्ज पोलर प्रारंभ भविष्य में है। घड़ी सिंक्रनाइज़ेशन जांचें।"
"The recorded poller start is older than the native scheduling tolerance.": "दर्ज पोलर प्रारंभ मूल शेड्यूलिंग सहनशीलता से पुराना है।"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "मूल शेड्यूलिंग सहनशीलता के भीतर एक स्थानीय पोलर प्रारंभ दर्ज किया गया था। पूर्णता और डिवाइस की स्थिति सत्यापित नहीं हैं।"
"readable": "पठनीय"
"missing or unreadable": "अनुपस्थित या अपठनीय"
"Restore the complete release and its locked dependencies; grant the service account read access.": "पूर्ण रिलीज़ और इसकी लॉक की गई निर्भरताओं को पुनर्स्थापित करें; सेवा खाते को पढ़ने की अनुमति दें।"
"PHP temporary directory": "PHP अस्थायी निर्देशिका"
"directory writable by this process": "इस प्रक्रिया द्वारा लिखने योग्य निर्देशिका"
"missing or not writable": "अनुपस्थित या लिखने योग्य नहीं"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "sys_temp_dir को इंस्टॉलेशन खाते द्वारा लिखने योग्य किसी मौजूदा निर्देशिका के रूप में कॉन्फ़िगर करें। मूल आयात अस्थायी फ़ाइलों का उपयोग करते हैं।"
"Background worker launch": "बैकग्राउंड वर्कर लॉन्च"
"required PHP functions available; launch not exercised": "आवश्यक PHP फ़ंक्शन उपलब्ध हैं; लॉन्च का परीक्षण नहीं किया गया"
"required PHP launch function disabled": "आवश्यक PHP लॉन्च फ़ंक्शन अक्षम है"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "वेब PHP रनटाइम के लिए exec सक्षम करें, या अधिकृत CLI इंस्टॉलर का उपयोग करें।"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "वेब PHP रनटाइम के लिए popen, pclose सक्षम करें, या अधिकृत CLI इंस्टॉलर का उपयोग करें।"
"Database transaction ownership": "डेटाबेस लेनदेन स्वामित्व"
"autocommit enabled; no caller-owned transaction": "autocommit सक्षम; कोई कॉलर-स्वामित्व वाला लेनदेन नहीं"
"autocommit disabled or caller transaction active": "autocommit अक्षम या कॉलर लेनदेन सक्रिय"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "कॉलर-स्वामित्व वाले लेनदेन के बाहर इंस्टॉलेशन चलाएं और इसके म्यूटेशन कनेक्शन पर autocommit सक्षम करें।"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "रिलीज़ निर्देशिका पुनर्स्थापित करें और टेम्पलेट संसाधन आयात के लिए इंस्टॉलेशन खाते को लेखन अनुमति दें। इसे सभी के लिए लिखने योग्य (world-writable) न बनाएं।"
"Worker file: install/background.php": "वर्कर फ़ाइल: install/background.php"
"Worker file: bin/legacy-installer.php": "वर्कर फ़ाइल: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "वर्कर फ़ाइल: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "आयात गंतव्य: resource/snmp_queries"
"Import destination: resource/script_server": "आयात गंतव्य: resource/script_server"
"Import destination: resource/script_queries": "आयात गंतव्य: resource/script_queries"
"Import destination: scripts": "आयात गंतव्य: scripts"
"Database privileges": "डेटाबेस विशेषाधिकार"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "सक्रिय भूमिकाओं और ऑब्जेक्ट-विशिष्ट अनुदानों सहित प्रभावी माइग्रेशन विशेषाधिकारों को सत्यापित नहीं किया गया था।"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "डेटाबेस व्यवस्थापक से इंस्टॉलेशन खाते और स्कीमा के लिए आवश्यक तालिका लेखन, स्कीमा परिवर्तन, ट्रिगर और रूटीन सत्यापित कराएं। वैश्विक व्यवस्थापक विशेषाधिकार प्रदान न करें।"
"Compare web and worker runtimes": "वेब और वर्कर रनटाइम की तुलना करें"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "यह स्पष्ट रूप से एक संक्षिप्त केवल-पठनीय PHP जांच शुरू करता है। यह किसी इंस्टॉलर को आरक्षित नहीं करता, फ़ाइलें नहीं लिखता या डिवाइस से संपर्क नहीं करता।"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "जांच इस वेब प्रक्रिया को इनहेरिट करती है और कॉन्फ़िगर किए गए इंस्टॉलर PHP दुभाषिए का उपयोग करती है। यह किसी अलग शेड्यूलर या सेवा का निरीक्षण नहीं करती है।"
"I authorize the read-only worker runtime comparison.": "मैं केवल-पठनीय वर्कर रनटाइम तुलना को अधिकृत करता हूं।"
"Compare runtimes": "रनटाइम की तुलना करें"
"Runtime comparison results": "रनटाइम तुलना परिणाम"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "अनुमति और पहचान में अंतर जानबूझकर हो सकते हैं। केवल-पठनीय अवलोकन यह साबित नहीं करते कि लेखन या इंस्टॉलेशन सफल होगा।"
"Confirm the read-only worker runtime comparison.": "केवल-पठनीय वर्कर रनटाइम तुलना की पुष्टि करें।"
"The runtime comparison is unavailable.": "रनटाइम तुलना अनुपलब्ध है।"
"Shared application secret": "साझा एप्लिकेशन सीक्रेट"
"A strong web application secret is required before comparison.": "तुलना से पहले एक मज़बूत वेब एप्लिकेशन सीक्रेट आवश्यक है।"
"Runtime comparison": "रनटाइम तुलना"
"The configured worker runtime did not confirm a bounded comparison.": "कॉन्फ़िगर किए गए वर्कर रनटाइम ने सीमित तुलना की पुष्टि नहीं की।"
"The inherited worker secret could not be confirmed against the web secret.": "वेब सीक्रेट के विरुद्ध इनहेरिट किए गए वर्कर सीक्रेट की पुष्टि नहीं की जा सकी।"
"PHP runtime comparison": "PHP रनटाइम तुलना"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "दोनों रनटाइम को PHP 8.4 का समर्थन करना चाहिए; भिन्न पैच संस्करणों की समीक्षा आवश्यक है।"
"Required extension comparison": "आवश्यक एक्सटेंशन तुलना"
"Required extension availability is checked; differing versions require review.": "आवश्यक एक्सटेंशन उपलब्धता की जांच की जाती है; भिन्न संस्करणों की समीक्षा आवश्यक है।"
"Process identity comparison": "प्रक्रिया पहचान तुलना"
"Effective process identity is unavailable on this platform.": "इस प्लेटफ़ॉर्म पर प्रभावी प्रक्रिया पहचान अनुपलब्ध है।"
"Effective process identities match.": "प्रभावी प्रक्रिया पहचान मेल खाती हैं।"
"Effective process identities differ; separate service accounts may be intentional.": "प्रभावी प्रक्रिया पहचान भिन्न हैं; अलग-अलग सेवा खाते जानबूझकर हो सकते हैं।"
"Directory access comparison": "निर्देशिका पहुंच तुलना"
"Read-only directory permission observations match.": "केवल-पठनीय निर्देशिका अनुमति अवलोकन मेल खाते हैं।"
"Directory locations or permission observations differ; review the service-account roles.": "निर्देशिका स्थान या अनुमति अवलोकन भिन्न हैं; सेवा-खाता भूमिकाओं की समीक्षा करें।"
"Worker directory read and traversal": "वर्कर निर्देशिका पठन और ट्रैवर्सल"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "आवश्यक वर्कर निर्देशिकाएं मौजूद होनी चाहिए और पढ़ने व ट्रैवर्सल की अनुमति देनी चाहिए। कोई लेखन परीक्षण नहीं किया गया।"
"The inherited worker secret matches the web secret for this private challenge.": "इस निजी चुनौती के लिए इनहेरिट किया गया वर्कर सीक्रेट वेब सीक्रेट से मेल खाता है।"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "कॉन्फ़िगर किए गए PHP दुभाषिए, आवश्यक एक्सटेंशन, इनहेरिट किए गए सीक्रेट और सेवा-खाता निर्देशिका अनुमतियों की समीक्षा करें। कोई लेखन या इंस्टॉलर स्टार्टअप नहीं चलाया गया था।"
"advisory": "सलाहकारी"
