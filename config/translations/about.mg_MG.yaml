"About Kadupul": "Momba ny Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Ny Kadupul dia tetikasa mahaleo tena misokatra ny loharanony ho an'ny fanaraha-maso tambajotra sy ny fanaovana kisary ara-potoana."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Ny fikambanana Kadupul no mitantana ny fampandrosoana, ny fandraisana anjara ary ny fanapahan-kevitra momba ny famoahana."
"For documentation and support, visit the Kadupul project.": "Ho an'ny tahirin-kevitra sy ny fanohanana, tsidiho ny tetikasa Kadupul."
"License": "Lisansa"
"Kadupul is licensed under the GNU GPL:": "Ny Kadupul dia manana fahazoan-dalana amin'ny alalan'ny GNU GPL:"
