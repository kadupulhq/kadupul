"Advanced options": "Täpsemad valikud"
"Applying database upgrades": "Andmebaasi uuenduste rakendamine"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Varunda andmebaas, RRD-failid, konfiguratsioon ja võtmed. Andmebaasi uuendused võivad teha muudatusi, mida rakenduse tagasipööramine ei suuda tühistada."
"Blocked": "Blokeeritud"
"Check": "Kontrolli"
"Check again": "Kontrolli uuesti"
"Check collection freshness and collector connectivity before enabling discovery.": "Enne avastamise lubamist kontrolli kogumise värskust ja andmekoguja ühendust."
"Check requirements": "Kontrolli nõudeid"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Kontrollid uurivad selle protsessi ja failisüsteemi õigusi. Need ei kirjuta testifaile ega võta seadmetega ühendust."
