"Converting selected tables": "Valitud tabelite teisendamine"
"Database version": "Andmebaasi versioon"
"Disabled": "Keelatud"
"Discovery": "Avastamine"
"Discovery SNMP settings": "Avastamise SNMP seaded"
"Discovery range": "Avastamise vahemik"
"Enable discovery after installation": "Luba avastamine pärast paigaldamist"
"Executable paths": "Käivitatavate failide teed"
"Execution status": "Täitmise olek"
"Finished execution": "Täitmine lõpetatud"
"Finishing tasks only. Schema migrations will not be replayed.": "Ainult lõpetavad toimingud. Skeemi migreerimisi ei esitata uuesti."
"I accept the license terms": "Nõustun litsentsitingimustega"
"I authorize discovery of the displayed range": "Volitan kuvatud vahemiku avastamist"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Kontrollisin logi ja kinnitasin, et eelmine töötaja ja selle alamprotsessid on peatunud"
"I checked the previous attempt and accept that some changes may already be committed": "Kontrollisin eelmist katset ja nõustun, et osa muudatusi võib olla juba tehtud"
"I reviewed this plan and have the required backups": "Vaatasin selle plaani üle ja vajalikud varukoopiad on olemas"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Kui töötaja peatub ootamatult, säilita log/cacti.log ja veendu enne selget uuesti proovimist, et selle protsess on lõppenud. Ooteolek ei kinnita eduka käivitamise toimumist."
"Importing templates": "Mallide importimine"
"Install Kadupul": "Paigalda Kadupul"
"Installation and upgrade": "Paigaldus ja uuendamine"
"Installation request was rejected.": "Paigaldustaotlus lükati tagasi."
"Installation steps": "Paigaldussammud"
"Installed": "Paigaldatud"
"Keep a backup of the database, RRD files, configuration and secret material.": "Hoia varukoopiat andmebaasist, RRD-failidest, konfiguratsioonist ja salajasest materjalist."
"Language": "Keel"
"Large tables may require the dedicated CLI conversion tool before installation.": "Suured tabelid võivad enne paigaldamist vajada spetsiaalset CLI teisendustööriista."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Jäta salajased väljad salvestatud mandaatide säilitamiseks tühjaks. Saladusi ei kuvata kunagi uuesti."
"License": "Litsents"
"No action needed": "Tegevust pole vaja"
"Observed": "Vaadeldud"
"Open the console": "Ava konsool"
"Operation": "Toiming"
"Override discovery SNMP settings": "Alista avastamise SNMP seaded"
"Pass": "Läbitud"
"Poller interval in seconds": "Pollija intervall sekundites"
"Preparing CSRF protection": "CSRF-kaitse ettevalmistamine"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Edenemine näitab viimast registreeritud etappi. Selle lehe värskendamine ei käivita ega korda töötajat kunagi."
"Recover stopped attempt": "Taasta peatunud katse"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Taastamine säilitab salvestatud valikud ja ei lõpeta kunagi töötavat töötajat. Vaata plaan enne uuesti proovimist uuesti üle."
"Review": "Vaata üle"
"Review installation plan": "Vaata paigaldusplaan üle"
"Run": "Käivita"
"Run reviewed plan": "Käivita üle vaadatud plaan"
"Save and review": "Salvesta ja vaata üle"
"Scope": "Ulatus"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Olek pole saadaval. Salvestatud töö säilib. Ühenduse taastamiseks värskenda; ära esita uut paigaldust."
"Synchronizing collectors": "Andmekogujate sünkroonimine"
"Table conversions": "Tabelite teisendused"
"Templates": "Mallid"
"The database version matches this application. Installation does not establish that polling is healthy.": "Andmebaasi versioon ühtib selle rakendusega. Paigaldus ei tõenda, et pollimine on korras."
"The request outcome is unknown. Check execution status before retrying.": "Taotluse tulemus on teadmata. Enne uuesti proovimist kontrolli täitmise olekut."
"Theme": "Teema"
"Verify": "Kontrolli"
"Verify the poller schedule and service account.": "Kontrolli pollija ajakava ja teenusekontot."
"Version change": "Versiooni muutus"
"Waiting for the installation worker": "Paigaldustöötaja ootamine"
"collector": "andmekoguja"
"complete": "lõpetatud"
"failed": "ebaõnnestus"
"finish": "lõpeta"
"install": "paigalda"
"not_started": "pole alustatud"
"partial": "osaline"
"running": "töötab"
"succeeded": "õnnestus"
"upgrade": "uuenda"
"waiting": "ootel"
"Accept the license before saving the installation plan.": "Nõustu litsentsiga enne paigaldusplaani salvestamist."
"Invalid installation form.": "Kehtetu paigaldusvorm."
"Access denied.": "Juurdepääs keelatud."
"Confirm the recovery warning before retrying.": "Enne uuesti proovimist kinnita taastamise hoiatus."
"Review and confirm the current installation plan.": "Vaata praegune paigaldusplaan üle ja kinnita see."
"Confirm the discovery scope before starting.": "Enne alustamist kinnita avastuse ulatus."
"Resolve the blocking checks before starting.": "Enne alustamist lahenda blokeerivad kontrollid."
"Too many installer options.": "Liiga palju paigaldaja valikuid."
"Invalid installer option name.": "Kehtetu paigaldaja valiku nimi."
"Unknown or malformed installer option.": "Tundmatu või vigase kujuga paigaldaja valik."
"Installer options must be scalar values.": "Paigaldaja valikud peavad olema skalaarväärtused."
"Installer option is too long or contains a null byte.": "Paigaldaja valik on liiga pikk või sisaldab nullbaiti."
"Installer IDs and intervals must be whole numbers.": "Paigaldaja ID-d ja intervallid peavad olema täisarvud."
"Installer ID or interval is outside its supported range.": "Paigaldaja ID või intervall on lubatud vahemikust väljas."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Paigaldusega ei saanud jätkata. Laadi selle olek uuesti ja vaata blokeerivad kontrollid enne uuesti proovimist üle."
"Confirm that the previous worker has stopped before recovering its plan.": "Veendu, et eelmine töötaja on peatunud, enne kui selle plaani taastad."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Andmebaas on paigaldatud, kuid mõned andmekogujad vajavad veel sünkroonimist. Kontrolli nende olekut ja proovi lõpetavaid toiminguid uuesti."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Paigaldus peatus. Säilita paigaldaja logi, paranda põhjus ja kinnita uuesti proovimine selgesõnaliselt. Mõned andmebaasi muudatused võivad olla juba tehtud. Kontrolli pistikprogrammide puhastust enne uuesti proovimise lubamist."
"Next action": "Järgmine tegevus"
"Follow the execution status. Do not start another attempt while a worker is active.": "Jälgi täitmise olekut. Ära alusta uut katset, kui töötaja on aktiivne."
"Complete the recovery checklist before retrying.": "Enne uuesti proovimist täida taastamise kontrollnimekiri."
"Verify collection and graph operation before enabling discovery.": "Enne avastamise lubamist kontrolli kogumise ja graafikute toimimist."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Lahenda blokeerivad nõuded ja kontrolli uuesti. Salvestatud valikud säilivad."
"Review the planned changes and backup checklist before authorizing execution.": "Vaata enne täitmise volitamist üle kavandatud muudatused ja varundamise kontrollnimekiri."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Vali kogumisprofiil ja nõustu litsentsiga. Valikulised seaded saab vajaduse korral avada."
"Download installation diagnostics": "Laadi alla paigalduse diagnostika"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Ava graafik ja veendu, et selle RRD andmed uuenevad pärast pollija tsüklit."
"Requirement details": "Nõude üksikasjad"
"Recover": "Taasta"
"Recovery checklist": "Taastamise kontrollnimekiri"
"Preserve log/cacti.log and record the failed attempt.": "Säilita log/cacti.log ja registreeri ebaõnnestunud katse."
"Confirm that the previous worker and its child processes have stopped.": "Veendu, et eelmine töötaja ja selle alamprotsessid on peatunud."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Vaata üle tehtud muudatused, andmekoguja sünkroonimine ja pistikprogrammide puhastus. Paranda põhjus enne uuesti proovimist."
"Review the saved plan again, then explicitly authorize a retry.": "Vaata salvestatud plaan uuesti üle ja volita seejärel uuesti proovimine selgesõnaliselt."
"Recover a stopped worker": "Taasta peatunud töötaja"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Kasuta taastamist alles pärast kinnitamist, et see katse enam ei tööta. Taastamine ei peata protsessi."
"Collector and installation mode": "Andmekoguja ja paigaldusrežiim"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Juurutuse konfiguratsioon määrab andmekoguja rolli ja andmebaasiühendused. Enne andmekoguja käivitamist kontrolli põhiserveri konfiguratsiooni."
"Discovery and SNMP settings": "Avastamise ja SNMP seaded"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Hoia avastamine keelatuna, kuni kogumine ja andmekoguja ühendus on kontrollitud."
"Template selection": "Malli valik"
"Templates selected for import": "Importimiseks valitud mallid"
"No templates selected.": "Malle pole valitud."
"Backup checklist": "Varundamise kontrollnimekiri"
"Database backup and a tested restoration procedure.": "Andmebaasi varukoopia ja testitud taastamisprotseduur."
"RRD files and the service account permissions needed to restore them.": "RRD-failid ja nende taastamiseks vajalikud teenusekonto õigused."
"Configuration, keys and plugin data outside the database.": "Konfiguratsioon, võtmed ja pistikprogrammide andmed väljaspool andmebaasi."
"Post-installation checks": "Paigalduse järgsed kontrollid"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Kontrollitud kontrollid hõlmavad ainult kuvatud tõendeid. Hindamata kontrollid vajavad endiselt operaatori kinnitust."
"Operational checks still require operator verification.": "Operatiivsed kontrollid vajavad endiselt operaatori kinnitust."
"Status": "Olek"
"verified": "Kontrollitud"
"action_required": "Vajab tegevust"
"not_assessed": "Hindamata"
"Database schema": "Andmebaasi skeem"
"Stored schema matches the application target.": "Salvestatud skeem vastab rakenduse sihtmärgile."
"Target schema completion has not been confirmed.": "Sihtskeemi lõpetamist ei ole kinnitatud."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Vaata paigalduse tulemus üle ja lahenda tõrked enne, kui skeemi uuendust lõpetatuks pead."
"Installation outcome": "Paigalduse tulemus"
"A successful receipt matches the current target schema.": "Edukas kinnitus vastab praegusele sihtskeemile."
"A complete successful installation outcome has not been confirmed.": "Täielikku eduka paigalduse tulemust ei ole kinnitatud."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Säilita paigaldaja logi ja kasuta vajaduse korral selgesõnalist taastamis- või korduskatse protseduuri."
"Collector synchronization": "Andmekoguja sünkroonimine"
"The completed installer reports pending collector synchronization.": "Lõpetatud paigaldaja teatab ootel andmekoguja sünkroonimisest."
"The completed installer reports no pending collectors.": "Lõpetatud paigaldaja teatab, et ootel andmekogujaid pole."
"Collector completion remains unconfirmed by this partial receipt.": "Andmekoguja lõpetamine jääb selle osalise kinnitusega kinnitamata."
"Collector completion is not established by this installation outcome.": "Andmekoguja lõpetamist see paigalduse tulemus ei kinnita."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Vaata üle andmekoguja olek ja proovi osaliste tulemuste korral lõpetavaid toiminguid uuesti. See ei kontrolli hilisemat kogumise värskust."
"Scheduled collection": "Ajastatud kogumine"
"No poller or device was contacted by this assessment.": "See hindamine ei võtnud ühendust ühegi pollija ega seadmega."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Veendu, et seadistatud ajastaja käivitab pollija ettenähtud teenusekontona, ja vaata üle selle järgmine tavaline tsükkel."
"Graph data": "Graafiku andmed"
"Live samples and RRD updates were not exercised.": "Reaalajas proove ja RRD uuendusi ei kontrollitud."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Pärast tavalist kogumistsüklit veendu, et oodatud graafikud saavad värskeid proove, ja vaata üle pollija vead."
"Recovery readiness": "Taastamisvalmidus"
"Backup restoration was not exercised.": "Varukoopiast taastamist ei proovitud."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Enne taastamisele lootmist kontrolli andmebaasi, RRD-failide, konfiguratsiooni ja võtmematerjali isoleeritud taastamist."
"No persisted local poller start has been recorded.": "Püsivat kohaliku pollija käivitust pole registreeritud."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Püsiv pollija ajastus on kehtetu ega saa tõendada ajastaja tervist."
"The recorded poller start is in the future. Check clock synchronization.": "Registreeritud pollija käivitus on tulevikus. Kontrolli kella sünkroonimist."
"The recorded poller start is older than the native scheduling tolerance.": "Registreeritud pollija käivitus on vanem kui natiivse ajastuse tolerants."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Kohaliku pollija käivitus registreeriti natiivse ajastuse tolerantsi piires. Lõpetamist ja seadme seisundit ei ole kontrollitud."
"readable": "loetav"
"missing or unreadable": "puudub või ei ole loetav"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Taasta täielik väljalase ja selle lukustatud sõltuvused; anna teenusekontole lugemisõigus."
"PHP temporary directory": "PHP ajutine kataloog"
"directory writable by this process": "kataloog on selle protsessi jaoks kirjutatav"
"missing or not writable": "puudub või ei ole kirjutatav"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Seadista sys_temp_dir olemasoleva kaustana, kuhu paigalduskonto saab kirjutada. Natiivsed impordid kasutavad ajutisi faile."
"Background worker launch": "Taustatöötaja käivitamine"
"required PHP functions available; launch not exercised": "nõutavad PHP funktsioonid on saadaval; käivitamist ei proovitud"
"required PHP launch function disabled": "nõutav PHP käivitusfunktsioon on keelatud"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Luba veebi PHP käituskeskkonnas exec või kasuta volitatud CLI paigaldajat."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Luba veebi PHP käituskeskkonnas popen, pclose või kasuta volitatud CLI paigaldajat."
"Database transaction ownership": "Andmebaasi tehingu omand"
"autocommit enabled; no caller-owned transaction": "automaatne kinnitamine lubatud; kutsuja omatavat tehingut pole"
"autocommit disabled or caller transaction active": "automaatne kinnitamine keelatud või kutsuja tehing on aktiivne"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Käivita paigaldus väljaspool kutsuja omatavat tehingut ja luba selle muutmisühenduses automaatne kinnitamine."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Taasta väljalaske kataloog ja anna paigalduskontole kirjutusõigus malliressursside importimiseks. Ära tee seda kõigile kirjutatavaks."
"Worker file: install/background.php": "Töötaja fail: install/background.php"
"Worker file: bin/legacy-installer.php": "Töötaja fail: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Töötaja fail: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Impordi sihtkoht: resource/snmp_queries"
"Import destination: resource/script_server": "Impordi sihtkoht: resource/script_server"
"Import destination: resource/script_queries": "Impordi sihtkoht: resource/script_queries"
"Import destination: scripts": "Impordi sihtkoht: scripts"
"Database privileges": "Andmebaasi õigused"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Efektiivseid migreerimisõigusi, sealhulgas aktiivseid rolle ja objektispetsiifilisi õigusi, ei kontrollitud."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Palu andmebaasi administraatoril kontrollida paigalduskonto ja skeemi jaoks vajalikke tabelikirjutusi, skeemimuudatusi, päästikuid ja rutiine. Ära anna globaalse administraatori õigusi."
"Compare web and worker runtimes": "Võrdle veebi ja töötaja käituskeskkondi"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "See käivitab selgesõnaliselt lühikese kirjutuskaitstud PHP sondi. See ei reserveeri paigaldajat, ei kirjuta faile ega võta seadmetega ühendust."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Sond pärib selle veebiprotsessi ja kasutab seadistatud paigaldaja PHP tõlgendajat. See ei uuri eraldi ajastajat ega teenust."
"I authorize the read-only worker runtime comparison.": "Volitan töötaja käituskeskkondade kirjutuskaitstud võrdlust."
"Compare runtimes": "Võrdle käituskeskkondi"
"Runtime comparison results": "Käituskeskkonna võrdluse tulemused"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Õiguste ja identiteedi erinevused võivad olla tahtlikud. Kirjutuskaitstud vaatlused ei tõesta, et kirjutamine või paigaldamine õnnestub."
"Confirm the read-only worker runtime comparison.": "Kinnita töötaja käituskeskkondade kirjutuskaitstud võrdlus."
"The runtime comparison is unavailable.": "Käituskeskkonna võrdlus pole saadaval."
"Shared application secret": "Jagatud rakenduse saladus"
"A strong web application secret is required before comparison.": "Enne võrdlemist on vaja tugevat veebirakenduse saladust."
"Runtime comparison": "Käituskeskkonna võrdlus"
"The configured worker runtime did not confirm a bounded comparison.": "Seadistatud töötaja käituskeskkond ei kinnitanud piiratud võrdlust."
"The inherited worker secret could not be confirmed against the web secret.": "Päritud töötaja saladust ei saanud veebi saladusega võrrelda."
"PHP runtime comparison": "PHP käituskeskkonna võrdlus"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Mõlemad käituskeskkonnad peavad toetama PHP 8.4; erinevad paigaversioonid vajavad ülevaatust."
"Required extension comparison": "Nõutavate laienduste võrdlus"
"Required extension availability is checked; differing versions require review.": "Nõutavate laienduste saadavust kontrollitakse; erinevad versioonid vajavad ülevaatust."
"Process identity comparison": "Protsessi identiteedi võrdlus"
"Effective process identity is unavailable on this platform.": "Protsessi efektiivne identiteet pole sellel platvormil saadaval."
"Effective process identities match.": "Protsesside efektiivsed identiteedid ühtivad."
"Effective process identities differ; separate service accounts may be intentional.": "Protsesside efektiivsed identiteedid erinevad; eraldi teenusekontod võivad olla tahtlikud."
"Directory access comparison": "Kataloogi juurdepääsu võrdlus"
"Read-only directory permission observations match.": "Kirjutuskaitstud kataloogiõiguste tähelepanekud ühtivad."
"Directory locations or permission observations differ; review the service-account roles.": "Kataloogide asukohad või õiguste tähelepanekud erinevad; vaata üle teenusekontode rollid."
"Worker directory read and traversal": "Töötaja kataloogi lugemine ja läbimine"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Nõutavad töötaja kataloogid peavad olemas olema ning lubama lugemist ja läbimist. Kirjutamist ei testitud."
"The inherited worker secret matches the web secret for this private challenge.": "Päritud töötaja saladus ühtib selle privaatse väljakutse jaoks veebi saladusega."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Vaata üle seadistatud PHP tõlgendaja, nõutavad laiendused, päritud saladus ja teenusekonto kataloogiõigused. Kirjutamist ega paigaldaja käivitamist ei proovitud."
"advisory": "nõuandev"
