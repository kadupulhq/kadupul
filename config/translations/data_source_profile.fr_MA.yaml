"A useful name for this Data Storage and Polling Profile.": "Un nom explicite pour ce profil de stockage et de collecte de données."
"Every %count% Day": "Tous les %count% jours"
"Graph Timespan": "Durée du graphique"
"Has Data Sources": "Possède des sources de données"
"How data is to be entered in RRAs.": "La façon dont les données doivent être enregistrées dans les RRA."
"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "Durée pendant laquelle des données peuvent manquer avant que RRDtool n'enregistre des données inconnues.  Augmentez cette valeur si votre source de données est instable et que vous souhaitez reporter d'anciennes données plutôt que d'afficher des trous dans vos graphiques.  Cette valeur est multipliée par le facteur X-Files pour déterminer la durée réelle."
"How many generations data is kept in the RRA.": "Combien de générations de données sont conservées dans le RRA."
"Is this the default storage profile?": "S'agit-il du profil de stockage par défaut ?"
"N/A": "N/A"
"New Profile RRA": "Nouveau profil RRA"
"Polling Interval": "Intervalle de collecte"
"RRA Size (in Bytes)": "Taille du RRA (en octets)"
"Selected Poller Interval": "Intervalle d'interrogation sélectionné"
"Templates Using": "Modèles l'utilisant"
"The amount of unknown data that can still be regarded as known.": "La proportion de données inconnues pouvant encore être considérée comme connue."
"The frequency that data will be collected from the Data Source?": "La fréquence à laquelle les données seront collectées depuis la source de données ?"
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "Le nombre d'échantillons requis avant de remplir une ligne dans la spécification RRA.  Le premier RRA doit toujours avoir une valeur de 1."
"When viewing a Graph based upon the RRA in question, the default Timespan to show for that Graph.": "Lors de l'affichage d'un graphique basé sur le RRA en question, la période par défaut à afficher pour ce graphique."
