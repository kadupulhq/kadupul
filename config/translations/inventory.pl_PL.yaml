"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Wybrane przypisanie jest stosowane do każdego wymienionego urządzenia. Zmiany szablonów zachowują istniejące wykresy; automatyzacja może utworzyć nowe wykresy. Zmiany kolektorów przenoszą własność odpytywania."
