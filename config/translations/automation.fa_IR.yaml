"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "این فرم مجموعه گزینه SNMP منقضی شده است. مجموعه گزینه SNMP را دوباره باز کرده و از فرم فعلی آن استفاده کنید."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "این یک رشته یکتا است که با رشته sysDescr دستگاه‌ها تطبیق داده می‌شود تا آن را به این الگوی خودکارسازی جفت کند. علاوه بر هر عبارت SQL Where، می‌توان از هر عبارت باقاعده Perl نیز استفاده کرد."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "این یک رشته یکتا است که با رشته sysName دستگاه‌ها تطبیق داده می‌شود تا آن را به این الگوی خودکارسازی جفت کند. علاوه بر هر عبارت SQL Where، می‌توان از هر عبارت باقاعده Perl نیز استفاده کرد."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "این یک رشته یکتا است که با رشته sysOid دستگاه‌ها تطبیق داده می‌شود تا آن را به این الگوی خودکارسازی جفت کند. علاوه بر هر عبارت SQL Where، می‌توان از هر عبارت باقاعده Perl نیز استفاده کرد."
