"Data Queries [new]": "Weydiimaha Xogta [cusub]"
"Data query not found.": "Weydiinta xogta lama helin."
"Data query saved, but a Remote Data Collector was down and did not receive the poller cache change. Perform a Full Sync once it is up again.": "Weydiinta xogta waa la keydiyay, laakiin Ururiye Xog oo Fog ayaa maqan mana helin isbeddelka kaydka xog-ururiyaha. Samee Isu-waafajin Buuxda marka uu mar kale shaqeeyo."
"Data query saved.": "Weydiinta xogta waa la keydiyay."
"Description": "Sharaxaadda"
"Edit Data Query": "Wax ka beddel Weydiinta Xogta"
"Enter a value.": "Geli qiime."
"Enter at most %count% characters.": "Geli ugu badnaan %count% xaraf."
"Enter single-line text.": "Geli qoraal hal saf ah."
"Enter the path of a readable XML file under the resource directory.": "Geli waddada faylka XML ee la akhrin karo ee ku hoos jira galka khayraadka."
"Invalid command.": "Amar aan sax ahayn."
"Name": "Magaca"
"Save": "Kaydi"
"Save outcome is uncertain. Reload before retrying.": "Natiijada kaydinta lama hubo. Dib u soo rar ka hor intaadan isku dayin mar kale."
"Save the data query first; its Graph Templates are associated afterwards.": "Marka hore kaydi weydiinta xogta; qaababka garaafka waxaa lala xiriiriyaa intaa ka dib."
"Successfully located XML file": "Si guul leh ayaa loo helay faylka XML"
"The data query changed since you opened this form. Reload before saving.": "Weydiinta xogtu way isbeddeshay tan iyo markii aad furtay foomkan. Dib u soo rar ka hor intaadan kaydin."
"The full path to the XML file containing definitions for this data query.": "Waddada buuxda ee faylka XML ee ka kooban qeexitaannada weydiintan xogta."
"Unable to load the data query. Reload before retrying.": "Waa la awoodi waayay in la soo raro weydiinta xogta. Dib u soo rar ka hor intaadan isku dayin mar kale."
"Unexpected fields were submitted.": "Meelo aan la filayn ayaa la gudbiyay."
"XML Path": "Waddada XML"
