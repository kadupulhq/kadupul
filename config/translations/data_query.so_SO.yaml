"Choose a Data Input Method": "Dooro Hab Gelin Xog"
"Choose an existing Data Input Method.": "Dooro Hab Gelin Xog oo horay u jira."
"Choose the input method for this Data Query.  This input method defines how data is collected for each Device associated with the Data Query.": "Dooro habka galinta ee Weydiintan Xogta. Habkan galintu wuxuu qeexaa sida xogta loogu ururiyo Qalab kasta oo ku xiran Weydiinta Xogta."
