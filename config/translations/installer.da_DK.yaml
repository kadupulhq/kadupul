"Finishing tasks only. Schema migrations will not be replayed.": "Kun afsluttende opgaver. Skemamigreringer afspilles ikke igen."
"I accept the license terms": "Jeg accepterer licensbetingelserne"
"I authorize discovery of the displayed range": "Jeg godkender opdagelse af det viste område"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Jeg har kontrolleret loggen og bekræftet, at den forrige worker og dens underprocesser er stoppet"
"I checked the previous attempt and accept that some changes may already be committed": "Jeg har kontrolleret det forrige forsøg og accepterer, at nogle ændringer allerede kan være gennemført"
"I reviewed this plan and have the required backups": "Jeg har gennemgået denne plan og har de nødvendige backups"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Hvis en worker stopper uventet, skal du bevare log/cacti.log og bekræfte, at dens proces er afsluttet, før du udtrykkeligt prøver igen. En ventetilstand bekræfter ikke, at opstarten lykkedes."
"Importing templates": "Importerer skabeloner"
"Install Kadupul": "Installér Kadupul"
"Installation and upgrade": "Installation og opgradering"
"Installation request was rejected.": "Installationsanmodningen blev afvist."
"Installation steps": "Installationstrin"
"Installed": "Installeret"
"Keep a backup of the database, RRD files, configuration and secret material.": "Opbevar en backup af databasen, RRD-filerne, konfigurationen og hemmeligt materiale."
"Language": "Sprog"
"Large tables may require the dedicated CLI conversion tool before installation.": "Store tabeller kan kræve det dedikerede CLI-konverteringsværktøj før installationen."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Lad hemmelige felter stå tomme for at beholde de gemte legitimationsoplysninger. Hemmeligheder vises aldrig igen."
"License": "Licens"
"No action needed": "Ingen handling nødvendig"
"Observed": "Observeret"
