"Advanced options": "Avancerede indstillinger"
"Applying database upgrades": "Anvender databaseopgraderinger"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Tag backup af databasen, RRD-filerne, konfigurationen og nøglerne. Databaseopgraderinger kan gennemføre ændringer, som en tilbagerulning af applikationen ikke kan fortryde."
"Blocked": "Blokeret"
"Check": "Kontrollér"
"Check again": "Kontrollér igen"
"Check collection freshness and collector connectivity before enabling discovery.": "Kontrollér indsamlingens friskhed og indsamlernes forbindelse, før du aktiverer opdagelse."
"Check requirements": "Kontrollér krav"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Kontrollerne undersøger denne proces og filsystemets tilladelser. De skriver ikke testfiler og kontakter ikke enheder."
