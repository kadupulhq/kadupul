"waiting": "venter"
"Accept the license before saving the installation plan.": "Accepter licensen, før du gemmer installationsplanen."
"Invalid installation form.": "Ugyldig installationsformular."
"Access denied.": "Adgang nægtet."
"Confirm the recovery warning before retrying.": "Bekræft gendannelsesadvarslen, før du prøver igen."
"Review and confirm the current installation plan.": "Gennemgå og bekræft den aktuelle installationsplan."
"Confirm the discovery scope before starting.": "Bekræft opdagelsesomfanget, før du starter."
"Resolve the blocking checks before starting.": "Løs de blokerende kontroller, før du starter."
"Too many installer options.": "For mange installationsindstillinger."
"Invalid installer option name.": "Ugyldigt navn på installationsindstilling."
"Unknown or malformed installer option.": "Ukendt eller ugyldigt udformet installationsindstilling."
"Installer options must be scalar values.": "Installationsindstillinger skal være skalarværdier."
"Installer option is too long or contains a null byte.": "Installationsindstillingen er for lang eller indeholder en nulbyte."
"Installer IDs and intervals must be whole numbers.": "Installations-id'er og intervaller skal være heltal."
"Installer ID or interval is outside its supported range.": "Installations-id eller interval ligger uden for det understøttede område."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Installationen kunne ikke fortsætte. Genindlæs dens status, og gennemgå de blokerende kontroller, før du prøver igen."
"Confirm that the previous worker has stopped before recovering its plan.": "Bekræft, at den forrige worker er stoppet, før du gendanner dens plan."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Databasen er installeret, men nogle indsamlere skal stadig synkroniseres. Prøv de afsluttende opgaver igen, efter du har kontrolleret deres status."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installationen blev stoppet. Bevar installationsloggen, ret årsagen, og bekræft udtrykkeligt et nyt forsøg. Nogle databaseændringer kan allerede være gennemført. Kontrollér plugin-oprydningen, før du godkender et nyt forsøg."
"Next action": "Næste handling"
"Follow the execution status. Do not start another attempt while a worker is active.": "Følg udførelsesstatus. Start ikke et nyt forsøg, mens en worker er aktiv."
"Complete the recovery checklist before retrying.": "Gennemfør gendannelsestjeklisten, før du prøver igen."
"Verify collection and graph operation before enabling discovery.": "Verificér indsamling og grafdrift, før du aktiverer opdagelse."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Løs de blokerede krav, og kontrollér derefter igen. Gemte valg bevares."
"Review the planned changes and backup checklist before authorizing execution.": "Gennemgå de planlagte ændringer og backuptjeklisten, før du godkender udførelsen."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Vælg en indsamlingsprofil, og accepter licensen. Valgfrie indstillinger kan åbnes ved behov."
"Download installation diagnostics": "Download installationsdiagnostik"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Åbn en graf, og bekræft, at dens RRD-data opdateres efter en pollercyklus."
"Requirement details": "Kravdetaljer"
"Recover": "Gendan"
"Recovery checklist": "Gendannelsestjekliste"
"Preserve log/cacti.log and record the failed attempt.": "Bevar log/cacti.log, og registrér det mislykkede forsøg."
"Confirm that the previous worker and its child processes have stopped.": "Bekræft, at den forrige worker og dens underprocesser er stoppet."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Undersøg gennemførte ændringer, indsamlersynkronisering og plugin-oprydning. Ret årsagen, før du prøver igen."
"Review the saved plan again, then explicitly authorize a retry.": "Gennemgå den gemte plan igen, og godkend derefter udtrykkeligt et nyt forsøg."
"Recover a stopped worker": "Gendan en stoppet worker"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Brug kun gendannelse, når du har bekræftet, at dette forsøg ikke længere kører. Gendannelse stopper ikke en proces."
"Collector and installation mode": "Indsamler- og installationstilstand"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Driftskonfigurationen bestemmer indsamlerrollen og databaseforbindelserne. Verificér primærserverens konfiguration, før du starter en indsamler."
"Discovery and SNMP settings": "Opdagelses- og SNMP-indstillinger"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Hold opdagelse deaktiveret, indtil indsamling og indsamlernes forbindelse er verificeret."
"Template selection": "Valg af skabeloner"
"Templates selected for import": "Skabeloner valgt til import"
"No templates selected.": "Ingen skabeloner valgt."
"Backup checklist": "Backuptjekliste"
"Database backup and a tested restoration procedure.": "Databasebackup og en testet gendannelsesprocedure."
"RRD files and the service account permissions needed to restore them.": "RRD-filer og de servicekontotilladelser, der kræves for at gendanne dem."
"Configuration, keys and plugin data outside the database.": "Konfiguration, nøgler og plugin-data uden for databasen."
"Post-installation checks": "Kontroller efter installationen"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Verificerede kontroller dækker kun den viste dokumentation. Ikke-vurderede kontroller kræver stadig verificering af en operatør."
"Operational checks still require operator verification.": "Driftskontroller kræver stadig verificering af en operatør."
"Status": "Status"
"verified": "Verificeret"
"action_required": "Handling påkrævet"
"not_assessed": "Ikke vurderet"
"Database schema": "Databaseskema"
"Stored schema matches the application target.": "Det gemte skema svarer til applikationens målskema."
"Target schema completion has not been confirmed.": "Fuldførelse af målskemaet er ikke bekræftet."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Gennemgå installationsresultatet, og løs fejl, før du betragter skemaopgraderingen som fuldført."
"Installation outcome": "Installationsresultat"
"A successful receipt matches the current target schema.": "En vellykket kvittering svarer til det aktuelle målskema."
"A complete successful installation outcome has not been confirmed.": "Et komplet vellykket installationsresultat er ikke bekræftet."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Bevar installationsloggen, og brug den udtrykkelige gendannelses- eller genforsøgsprocedure, når det er nødvendigt."
"Collector synchronization": "Indsamlersynkronisering"
"The completed installer reports pending collector synchronization.": "Den gennemførte installation rapporterer ventende indsamlersynkronisering."
"The completed installer reports no pending collectors.": "Den gennemførte installation rapporterer ingen ventende indsamlere."
"Collector completion remains unconfirmed by this partial receipt.": "Fuldførelse af indsamlere er fortsat ubekræftet af denne delvise kvittering."
"Collector completion is not established by this installation outcome.": "Fuldførelse af indsamlere er ikke fastslået af dette installationsresultat."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Gennemgå indsamlernes status, og prøv de afsluttende opgaver igen ved delvise resultater. Dette verificerer ikke senere indsamlingsfriskhed."
"Scheduled collection": "Planlagt indsamling"
"No poller or device was contacted by this assessment.": "Ingen poller eller enhed blev kontaktet af denne vurdering."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Bekræft, at den konfigurerede scheduler kører polleren som den tilsigtede servicekonto, og gennemgå dens næste normale cyklus."
"Graph data": "Grafdata"
"Live samples and RRD updates were not exercised.": "Live-prøver og RRD-opdateringer blev ikke afprøvet."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Bekræft efter en normal indsamlingscyklus, at forventede grafer modtager friske prøver, og gennemgå pollerfejl."
"Recovery readiness": "Gendannelsesberedskab"
"Backup restoration was not exercised.": "Gendannelse fra backup blev ikke afprøvet."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verificér en isoleret gendannelse af database, RRD-filer, konfiguration og nøglemateriale, før du er afhængig af gendannelse."
"No persisted local poller start has been recorded.": "Ingen vedvarende lokal pollerstart er registreret."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Den vedvarende pollertiming er ugyldig og kan ikke fastslå schedulerens sundhed."
"The recorded poller start is in the future. Check clock synchronization.": "Den registrerede pollerstart ligger i fremtiden. Kontrollér urets synkronisering."
"The recorded poller start is older than the native scheduling tolerance.": "Den registrerede pollerstart er ældre end den native planlægningstolerance."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "En lokal pollerstart blev registreret inden for den native planlægningstolerance. Fuldførelse og enhedernes sundhed er ikke verificeret."
"readable": "læsbar"
"missing or unreadable": "mangler eller kan ikke læses"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Gendan den komplette udgivelse og dens låste afhængigheder; giv servicekontoen læseadgang."
"PHP temporary directory": "PHP's midlertidige mappe"
"directory writable by this process": "mappe, der kan skrives til af denne proces"
"missing or not writable": "mangler eller kan ikke skrives til"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigurér sys_temp_dir som en eksisterende mappe, som installationskontoen kan skrive til. Native importer bruger midlertidige filer."
"Background worker launch": "Start af baggrundsworker"
"required PHP functions available; launch not exercised": "krævede PHP-funktioner tilgængelige; start ikke afprøvet"
"required PHP launch function disabled": "krævet PHP-startfunktion deaktiveret"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Aktivér exec for web-PHP-runtimen, eller brug det autoriserede CLI-installationsprogram."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Aktivér popen, pclose for web-PHP-runtimen, eller brug det autoriserede CLI-installationsprogram."
"Database transaction ownership": "Ejerskab af databasetransaktion"
"autocommit enabled; no caller-owned transaction": "autocommit aktiveret; ingen transaktion ejet af kalderen"
"autocommit disabled or caller transaction active": "autocommit deaktiveret, eller en transaktion ejet af kalderen er aktiv"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Kør installationen uden for en transaktion ejet af kalderen, og aktivér autocommit på dens mutationsforbindelse."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Gendan udgivelsesmappen, og giv installationskontoen skriveadgang til import af skabelonressourcer. Gør den ikke skrivbar for alle."
"Worker file: install/background.php": "Workerfil: install/background.php"
"Worker file: bin/legacy-installer.php": "Workerfil: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Workerfil: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Importmål: resource/snmp_queries"
"Import destination: resource/script_server": "Importmål: resource/script_server"
"Import destination: resource/script_queries": "Importmål: resource/script_queries"
"Import destination: scripts": "Importmål: scripts"
"Database privileges": "Databaseprivilegier"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Effektive migreringsprivilegier, herunder aktive roller og objektspecifikke tildelinger, blev ikke verificeret."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Lad databaseadministratoren verificere de nødvendige tabelskrivninger, skemaændringer, triggere og rutiner for installationskontoen og skemaet. Giv ikke globale administratorprivilegier."
"Compare web and worker runtimes": "Sammenlign web- og worker-runtimes"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Dette starter udtrykkeligt en kort skrivebeskyttet PHP-probe. Den reserverer ikke et installationsprogram, skriver ikke filer og kontakter ikke enheder."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Proben arver denne webproces og bruger den konfigurerede PHP-fortolker til installationsprogrammet. Den undersøger ikke en separat scheduler eller tjeneste."
"I authorize the read-only worker runtime comparison.": "Jeg godkender den skrivebeskyttede sammenligning af worker-runtimes."
"Compare runtimes": "Sammenlign runtimes"
"Runtime comparison results": "Resultater af runtimesammenligning"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Forskelle i tilladelser og identitet kan være tilsigtede. Skrivebeskyttede observationer beviser ikke, at skrivninger eller installationen vil lykkes."
"Confirm the read-only worker runtime comparison.": "Bekræft den skrivebeskyttede sammenligning af worker-runtimes."
"The runtime comparison is unavailable.": "Runtimesammenligningen er utilgængelig."
"Shared application secret": "Delt applikationshemmelighed"
"A strong web application secret is required before comparison.": "En stærk webapplikationshemmelighed kræves før sammenligning."
"Runtime comparison": "Runtimesammenligning"
"The configured worker runtime did not confirm a bounded comparison.": "Den konfigurerede worker-runtime bekræftede ikke en afgrænset sammenligning."
"The inherited worker secret could not be confirmed against the web secret.": "Den nedarvede workerhemmelighed kunne ikke bekræftes mod webhemmeligheden."
"PHP runtime comparison": "Sammenligning af PHP-runtime"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Begge runtimes skal understøtte PHP 8.4; forskellige patchversioner kræver gennemgang."
"Required extension comparison": "Sammenligning af påkrævede udvidelser"
"Required extension availability is checked; differing versions require review.": "Tilgængeligheden af påkrævede udvidelser kontrolleres; forskellige versioner kræver gennemgang."
"Process identity comparison": "Sammenligning af procesidentitet"
"Effective process identity is unavailable on this platform.": "Den effektive procesidentitet er utilgængelig på denne platform."
"Effective process identities match.": "De effektive procesidentiteter er ens."
"Effective process identities differ; separate service accounts may be intentional.": "De effektive procesidentiteter er forskellige; separate servicekonti kan være tilsigtede."
"Directory access comparison": "Sammenligning af mappeadgang"
"Read-only directory permission observations match.": "De skrivebeskyttede observationer af mappetilladelser er ens."
"Directory locations or permission observations differ; review the service-account roles.": "Mappeplaceringer eller observationer af tilladelser er forskellige; gennemgå servicekontoernes roller."
"Worker directory read and traversal": "Læsning og gennemgang af workermapper"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "De påkrævede workermapper skal findes og tillade læsning og gennemgang. Der blev ikke testet skrivning."
"The inherited worker secret matches the web secret for this private challenge.": "Den nedarvede workerhemmelighed svarer til webhemmeligheden for denne private udfordring."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Gennemgå den konfigurerede PHP-fortolker, de påkrævede udvidelser, den nedarvede hemmelighed og servicekontoens mappetilladelser. Der blev ikke afprøvet skrivning eller start af installationsprogrammet."
"advisory": "vejledende"
