"Override discovery SNMP settings": "Tilsidesæt SNMP-indstillinger for opdagelse"
"Pass": "Bestået"
"Poller interval in seconds": "Pollerinterval i sekunder"
"Preparing CSRF protection": "Forbereder CSRF-beskyttelse"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Fremdriften viser den senest registrerede fase. Opdatering af denne side starter eller gentager aldrig en worker."
"Recover stopped attempt": "Gendan stoppet forsøg"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Gendannelse bevarer de gemte valg og afbryder aldrig en kørende worker. Gennemgå planen igen, før du prøver igen."
"Review": "Gennemgå"
"Review installation plan": "Gennemgå installationsplan"
"Run": "Kør"
"Run reviewed plan": "Kør gennemgået plan"
"Save and review": "Gem og gennemgå"
"Scope": "Omfang"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Status er utilgængelig. Gemt arbejde bevares. Opdatér for at oprette forbindelse igen; send ikke endnu en installation."
"Synchronizing collectors": "Synkroniserer indsamlere"
"Table conversions": "Tabelkonverteringer"
"Templates": "Skabeloner"
"The database version matches this application. Installation does not establish that polling is healthy.": "Databaseversionen svarer til denne applikation. Installationen fastslår ikke, at polling fungerer korrekt."
"The request outcome is unknown. Check execution status before retrying.": "Resultatet af anmodningen er ukendt. Kontrollér udførelsesstatus, før du prøver igen."
