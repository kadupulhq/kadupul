"Selected device statistics cleared.": "Статистика изабраних уређаја је очишћена."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Ресетујте времена одзива, бројаче прикупљања и доступност за ове уређаје. Графикони, историјски подаци и подешавања уређаја се задржавају. Статистика се наставља са следећим прикупљањем."
"Synchronize device templates": "Синхронизуј шаблоне уређаја"
"Confirm synchronization": "Потврди синхронизацију"
"Selected device templates synchronized.": "Шаблони изабраних уређаја су синхронизовани."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Примените тренутно додељене шаблоне на ове уређаје. Недостајуће придружености графикона и упита података се додају, а неискоришћене придружености шаблона графикона могу бити уклоњене. Уређаји без шаблона се прескачу. Постојећи графикони и историјски подаци се задржавају; аутоматизација може креирати нове графиконе."
"Change device options": "Промени опције уређаја"
"Confirm option changes": "Потврди промене опција"
"Selected device options updated.": "Опције изабраних уређаја су ажуриране."
"Device options": "Опције уређаја"
"Select at least one supported device option.": "Изаберите најмање једну подржану опцију уређаја."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "Мењају се само означене опције. Неозначене опције задржавају тренутне вредности. Избор празне локације је брише."
"Update %option%": "Ажурирај %option%"
"Assignment target": "Циљ доделе"
"Select an assignment target": "Изаберите циљ доделе"
"Select a valid assignment target.": "Изаберите исправан циљ доделе."
"Invalid assignment kind.": "Неисправна врста доделе."
"Assign device sites": "Додели локације уређајима"
"Assign device templates": "Додели шаблоне уређајима"
"Assign device collectors": "Додели прикупљаче уређајима"
"Confirm assignments": "Потврди доделе"
"Selected device assignments updated.": "Доделе изабраних уређаја су ажуриране."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Изабрана додела се примењује на сваки наведени уређај. Промене шаблона чувају постојеће графиконе; аутоматизација може креирати нове графиконе. Промене прикупљача преносе власништво над прикупљањем."
"Change device SNMP settings": "Промени SNMP подешавања уређаја"
"Confirm SNMP changes": "Потврди SNMP промене"
"Selected device SNMP settings updated.": "SNMP подешавања изабраних уређаја су ажурирана."
"Device graph-template associations": "Придружености шаблона графикона уређаја"
"Device associations updated.": "Придружености уређаја су ажуриране."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Уклањање придружености задржава постојеће графиконе и историјске податке. Додавање придружености може створити графиконе путем аутоматизације. Захваћени прикупљачи морају бити на мрежи."
