"A useful name for this Rule.": "שם שימושי לכלל זה."
"Access denied.": "הגישה נדחתה."
"Add Tree Rule": "הוסף כלל עץ"
"Back to Tree Rules": "חזרה לכללי העץ"
"Check this box to enable this rule.": "סמן תיבה זו כדי להפעיל את הכלל הזה."
"Choose a Tree for the new Tree Items.": "בחר עץ עבור פריטי עץ חדשים."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "בחר כותרת מהעץ שנבחר לחיבור אליה, או את השורש שלו. ודא שהיא עדיין קיימת בעת הרצת כלל זה."
"Choose a header of the selected Tree.": "בחר כותרת מהעץ שנבחר."
"Choose a listed Graph Grouping Style.": "בחר סגנון קיבוץ גרפים מהרשימה."
"Choose a listed Leaf Item Type.": "בחר סוג פריט עלה מהרשימה."
"Choose an existing Tree.": "בחר עץ קיים."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "בחר כיצד יקובצו הגרפים בעת הצגתם עבור מארח זה בעץ. משמש עבור עלי התקן."
"Data Query Index": "אינדקס שאילתת הנתונים"
"Device": "התקן"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "עלי התקן אינם יכולים להשתמש בקריטריונים על עמודות גרף או תבנית גרף. בעת שינוי סוג פריט העלה להתקן, סמן תיבה זו כדי להסיר קריטריונים אלה; לא ניתן יהיה לשחזרם."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "עלי התקן אינם יכולים להשתמש בקריטריונים מבוססי גרף. אשר הסרה של %count% קריטריונים כדי לשמור."
"Edit Tree Rule": "ערוך כלל עץ"
"Enable Rule": "הפעל כלל"
"Enter a name.": "הזן שם."
"Enter at most %count% characters.": "הזן לכל היותר %count% תווים."
"Enter single-line text.": "הזן טקסט בשורה אחת."
"Graph": "Symbol for file attachment annotations"
"Graph Grouping Style": "סגנון קיבוץ גרפים"
"Graph Template": "תבנית גרף"
"Leaf Item Type": "סוג פריט עלה"
"Name": "שם"
"Object Selection and Tree Creation Criteria": "קריטריונים לבחירת אובייקטים ויצירת עץ"
"Optional: Sub-Tree Item": "אופציונלי: פריט משנה"
"Remove graph-based criteria": "הסר קריטריונים מבוססי גרף"
"Save": "שמור"
"Save outcome is uncertain. Reload before retrying.": "תוצאת השמירה אינה ודאית. טען מחדש לפני שתנסה שוב."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "שמור תחילה את הכלל; הקריטריונים לבחירת אובייקטים ויצירת עץ יתווספו לאחר מכן."
"The Item Type that shall be dynamically added to the tree.": "סוג הפריט שיוסיף באופן דינמי לעץ."
"The tree rule changed since you opened this form. Reload before saving.": "כלל העץ השתנה מאז פתחת טופס זה. טען מחדש לפני השמירה."
"Tree": "עץ"
"Tree Rule Selection [edit: %name%]": "בחירת כלל עץ [עריכה: %name%]"
"Tree Rules Selection [new]": "בחירת כללי עץ [חדש]"
"Tree rule not found.": "כלל העץ לא נמצא."
"Tree rule saved.": "כלל העץ נשמר."
"Unable to load the tree rule. Reload before retrying.": "לא ניתן לטעון את כלל העץ. טען מחדש לפני שתנסה שוב."
"Unexpected fields were submitted.": "נשלחו שדות בלתי צפויים."
