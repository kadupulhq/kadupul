"Accept the license before saving the installation plan.": "Aanvaar die lisensie voordat die installasieplan gestoor word."
"Invalid installation form.": "Ongeldige installasievorm."
"Access denied.": "Toegang geweier."
"Confirm the recovery warning before retrying.": "Bevestig die herstelwaarskuwing voordat jy weer probeer."
"Review and confirm the current installation plan.": "Hersien en bevestig die huidige installasieplan."
"Confirm the discovery scope before starting.": "Bevestig die ontdekkingsomvang voordat jy begin."
"Resolve the blocking checks before starting.": "Los die blokkerende kontroles op voordat jy begin."
"Too many installer options.": "Te veel installeerderopsies."
"Invalid installer option name.": "Ongeldige installeerder-opsienaam."
"Unknown or malformed installer option.": "Onbekende of wangevormde installeerderopsie."
"Installer options must be scalar values.": "Installeerderopsies moet skalaarwaardes wees."
"Installer option is too long or contains a null byte.": "Installeerderopsie is te lank of bevat 'n nulgreep."
"Installer IDs and intervals must be whole numbers.": "Installeerder-ID's en -intervalle moet heelgetalle wees."
"Installer ID or interval is outside its supported range.": "Installeerder-ID of -interval is buite sy ondersteunde reeks."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Die installasie kon nie voortgaan nie. Herlaai sy status en hersien die blokkerende toetse voordat jy weer probeer."
"Confirm that the previous worker has stopped before recovering its plan.": "Bevestig dat die vorige werker gestop het voordat sy plan herstel word."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Die databasis is geïnstalleer, maar sommige versamelaars benodig steeds sinkronisasie. Probeer die afrondingstake weer nadat jy hul status nagegaan het."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installasie gestop. Bewaar die installeerderlog, maak die oorsaak reg en bevestig uitdruklik 'n herprobeer. Sommige databasisveranderinge is moontlik reeds deurgevoer. Kontroleer inprop-opruiming voordat jy 'n herprobeer magtig."
"Next action": "Volgende aksie"
"Follow the execution status. Do not start another attempt while a worker is active.": "Volg die uitvoeringstatus. Moenie nog 'n poging begin terwyl 'n werker aktief is nie."
"Complete the recovery checklist before retrying.": "Voltooi die herstelkontrolelys voordat jy weer probeer."
"Verify collection and graph operation before enabling discovery.": "Verifieer versameling en grafiekwerking voordat ontdekking geaktiveer word."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Los die geblokkeerde vereistes op en kontroleer dan weer. Gestoorde keuses word behou."
"Review the planned changes and backup checklist before authorizing execution.": "Hersien die beplande veranderinge en rugsteunkontrolelys voordat jy uitvoering magtig."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Kies 'n versamelingsprofiel en aanvaar die lisensie. Opsionele instellings kan oopgemaak word wanneer nodig."
"Download installation diagnostics": "Laai installasiediagnostiek af"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Maak 'n grafiek oop en bevestig dat sy RRD-data ná 'n peilersiklus bygewerk word."
"Requirement details": "Vereistebesonderhede"
"Recover": "Herstel"
"Recovery checklist": "Herstelkontrolelys"
"Preserve log/cacti.log and record the failed attempt.": "Bewaar log/cacti.log en teken die mislukte poging aan."
"Confirm that the previous worker and its child processes have stopped.": "Bevestig dat die vorige werker en sy kinderprosesse gestop het."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Inspekteer deurgevoerde veranderinge, versamelaarsinchronisasie en inprop-opruiming. Maak die oorsaak reg voordat jy weer probeer."
"Review the saved plan again, then explicitly authorize a retry.": "Hersien die gestoorde plan weer en magtig dan uitdruklik 'n herprobeer."
"Recover a stopped worker": "Herstel 'n gestopte werker"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Gebruik herstel slegs nadat jy bevestig het dat hierdie poging nie meer loop nie. Herstel stop nie 'n proses nie."
"Collector and installation mode": "Versamelaar- en installasiemodus"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Die ontplooiingskonfigurasie bepaal die versamelaarrol en databasisverbindings. Verifieer die primêre bedienerkonfigurasie voordat 'n versamelaar begin word."
"Discovery and SNMP settings": "Ontdekking en SNMP-instellings"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Hou ontdekking gedeaktiveer totdat versameling en versamelaarkonnektiwiteit geverifieer is."
"Template selection": "Sjabloonkeuse"
"Templates selected for import": "Sjablone gekies vir invoer"
"No templates selected.": "Geen sjablone gekies nie."
"Backup checklist": "Rugsteunkontrolelys"
"Database backup and a tested restoration procedure.": "Databasisrugsteun en 'n getoetste herstelprosedure."
"RRD files and the service account permissions needed to restore them.": "RRD-lêers en die diensrekeningtoestemmings wat nodig is om dit te herstel."
"Configuration, keys and plugin data outside the database.": "Konfigurasie, sleutels en inpropdata buite die databasis."
"Post-installation checks": "Na-installasiekontroles"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Geverifieerde toetse dek slegs die bewyse wat gewys word. Ongeassesseerde toetse vereis steeds operateurverifikasie."
"Operational checks still require operator verification.": "Operasionele kontroles vereis steeds operateurverifikasie."
"Status": "Status"
"verified": "geverifieer"
"action_required": "aksie vereis"
"not_assessed": "nie geassesseer nie"
"Database schema": "Databasisskema"
"Stored schema matches the application target.": "Gestoorde skema stem ooreen met die toepassingsteiken."
"Target schema completion has not been confirmed.": "Teikenskema-voltooiing is nog nie bevestig nie."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Hersien die installasie-uitkoms en los mislukkings op voordat die skema-opgradering as voltooi beskou word."
"Installation outcome": "Installasie-uitkoms"
"A successful receipt matches the current target schema.": "'n Suksesvolle kwitansie stem ooreen met die huidige teikenskema."
"A complete successful installation outcome has not been confirmed.": "'n Volledige suksesvolle installasie-uitkoms is nie bevestig nie."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Bewaar die installeerderlog en gebruik die uitdruklike herstel- of herprobeerprosedure wanneer nodig."
"Collector synchronization": "Versamelaarsinkronisasie"
"The completed installer reports pending collector synchronization.": "Die voltooide installeerder rapporteer hangende versamelaar-sinkronisasie."
"The completed installer reports no pending collectors.": "Die voltooide installeerder rapporteer geen hangende versamelaars nie."
"Collector completion remains unconfirmed by this partial receipt.": "Versamelaarvoltooiing bly onbevestig deur hierdie gedeeltelike kwitansie."
"Collector completion is not established by this installation outcome.": "Versamelaarvoltooiing word nie deur hierdie installasie-uitkoms vasgestel nie."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Hersien versamelaarstatus en probeer afrondingstake weer vir gedeeltelike uitkomste. Dit verifieer nie latere versamelingvarsheid nie."
"Scheduled collection": "Geskeduleerde versameling"
"No poller or device was contacted by this assessment.": "Geen peiler of toestel is deur hierdie assessering gekontak nie."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Bevestig dat die gekonfigureerde skeduleerder die poller as die beoogde diensrekening laat loop en hersien sy volgende normale siklus."
"Graph data": "Grafiekdata"
"Live samples and RRD updates were not exercised.": "Lewendige monsters en RRD-bywerkings is nie geoefen nie."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Bevestig ná 'n normale versamelingsiklus dat verwagte grafieke vars monsters ontvang en hersien poller-foute."
"Recovery readiness": "Herstelgereedheid"
"Backup restoration was not exercised.": "Rugsteunherstel is nie getoets nie."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifieer 'n geïsoleerde herstel van databasis, RRD-lêers, konfigurasie en sleutelmateriaal voordat jy op herstel staatmaak."
"No persisted local poller start has been recorded.": "Geen volgehoue plaaslike peilerbegin is aangeteken nie."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Volgehoue peilertydberekening is ongeldig en kan nie skeduleerdergesondheid vasstel nie."
"The recorded poller start is in the future. Check clock synchronization.": "Die aangetekende poller-begin is in die toekoms. Gaan kloksinkronisasie na."
"The recorded poller start is older than the native scheduling tolerance.": "Die aangetekende poller-begin is ouer as die inheemse skeduleringstoleransie."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "'n Plaaslike poller-begin is binne die oorspronklike skeduleringstoleransie aangeteken. Voltooiing en toestelgesondheid is nie geverifieer nie."
"readable": "leesbaar"
"missing or unreadable": "ontbreek of onleesbaar"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Herstel die volledige vrystelling en sy geslote afhanklikhede; verleen leestoegang aan die diensrekening."
"PHP temporary directory": "Tydelike PHP-gids"
"directory writable by this process": "gids skryfbaar deur hierdie proses"
"missing or not writable": "ontbreek of nie skryfbaar nie"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Konfigureer sys_temp_dir as 'n bestaande gids wat deur die installasierekening skryfbaar is. Oorspronklike invoere gebruik tydelike lêers."
"Background worker launch": "Agtergrondwerker-lansering"
"required PHP functions available; launch not exercised": "vereiste PHP-funksies beskikbaar; bekendstelling nie uitgeoefen nie"
"required PHP launch function disabled": "vereiste PHP-bekendstellingsfunksie gedeaktiveer"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Aktiveer exec vir die web-PHP-looptyd, of gebruik die gemagtigde CLI-installeerder."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Aktiveer popen, pclose vir die web-PHP-looptyd, of gebruik die gemagtigde CLI-installeerder."
"Database transaction ownership": "Databasistransaksie-eienaarskap"
"autocommit enabled; no caller-owned transaction": "outovaslegging geaktiveer; geen roeper-besit transaksie nie"
"autocommit disabled or caller transaction active": "outovaslegging gedeaktiveer of roeper-transaksie aktief"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Laat loop installasie buite 'n roeper-besitte transaksie en aktiveer outobevestiging op sy mutasieverbinding."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Herstel die vrystellingsgids en verleen skryftoegang aan die installasierekening vir sjabloonhulpbron-invoere. Moenie dit wêreldskryfbaar maak nie."
"Worker file: install/background.php": "Werkerlêer: install/background.php"
"Worker file: bin/legacy-installer.php": "Werkerlêer: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Werkerlêer: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Invoerbestemming: resource/snmp_queries"
"Import destination: resource/script_server": "Invoerbestemming: resource/script_server"
"Import destination: resource/script_queries": "Invoerbestemming: resource/script_queries"
"Import destination: scripts": "Invoerbestemming: scripts"
"Database privileges": "Databasisvoorregte"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Effektiewe migrasievoorregte, insluitend aktiewe rolle en objekspesifieke toekennings, is nie geverifieer nie."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Laat die databasisadministrateur vereiste tabelskrywings, skemaveranderinge, snellers en roetines vir die installasierekening en -skema verifieer. Moenie globale administrateursvoorregte verleen nie."
"Compare web and worker runtimes": "Vergelyk web- en werkerlooptye"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Hierdie begin eksplisiet 'n kort leesalleen PHP-sonde. Dit bespreek nie 'n installeerder, skryf lêers of kontak toestelle nie."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Die sonde erf hierdie webproses en gebruik die gekonfigureerde installeerder PHP-interpreteerder. Dit inspekteer nie 'n aparte skeduleerder of diens nie."
"I authorize the read-only worker runtime comparison.": "Ek magtig die leesalleen werker-looptydvergelyking."
"Compare runtimes": "Vergelyk looptye"
"Runtime comparison results": "Looptydvergelyking-resultate"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Toestemmings- en identiteitsverskille kan opsetlik wees. Leesalleen waarnemings bewys nie dat skrywings of installasie sal slaag nie."
"Confirm the read-only worker runtime comparison.": "Bevestig die slegs-lees werkerlooptydvergelyking."
"The runtime comparison is unavailable.": "Die looptydvergelyking is onbeskikbaar."
"Shared application secret": "Gedeelde toepassingsgeheim"
"A strong web application secret is required before comparison.": "'n Sterk webtoepassingsgeheim word vereis voor vergelyking."
"Runtime comparison": "Looptydvergelyking"
"The configured worker runtime did not confirm a bounded comparison.": "Die gekonfigureerde werker-looptyd het nie 'n begrensde vergelyking bevestig nie."
"The inherited worker secret could not be confirmed against the web secret.": "Die oorgeërfde werkergeheim kon nie teen die webgeheim bevestig word nie."
"PHP runtime comparison": "PHP-looptydvergelyking"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Beide looptye moet PHP 8.4 ondersteun; verskillende lapweergawes vereis hersiening."
"Required extension comparison": "Vereiste uitbreiding-vergelyking"
"Required extension availability is checked; differing versions require review.": "Vereiste uitbreiding-beskikbaarheid word gekontroleer; verskillende weergawes vereis hersiening."
"Process identity comparison": "Prosesidentiteit-vergelyking"
"Effective process identity is unavailable on this platform.": "Effektiewe prosesidentiteit is nie op hierdie platform beskikbaar nie."
"Effective process identities match.": "Effektiewe prosesidentiteite stem ooreen."
"Effective process identities differ; separate service accounts may be intentional.": "Effektiewe prosesidentiteite verskil; afsonderlike diensrekeninge kan opsetlik wees."
"Directory access comparison": "Gidstoegang-vergelyking"
"Read-only directory permission observations match.": "Leesalleen gidstoestemming-waarnemings stem ooreen."
"Directory locations or permission observations differ; review the service-account roles.": "Gidsliggings of toestemmingswaarnemings verskil; hersien die diensrekeningrolle."
"Worker directory read and traversal": "Werkergids lees en deurkruising"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Vereiste werkergidse moet bestaan en lees en deurkruising toelaat. Geen skrywings is getoets nie."
"The inherited worker secret matches the web secret for this private challenge.": "Die oorgeërfde werkergeheim stem ooreen met die webgeheim vir hierdie privaat uitdaging."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Hersien die gekonfigureerde PHP-vertolker, vereiste uitbreidings, oorgeërfde geheim en diensrekening-gidstoestemmings. Geen skrywings of installeerder-opstart is geoefen nie."
"advisory": "raadgewend"
