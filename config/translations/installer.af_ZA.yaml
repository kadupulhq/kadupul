"I authorize discovery of the displayed range": "Ek magtig ontdekking van die vertoonde reeks"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Ek het die log nagegaan en bevestig dat die vorige werker en sy kindprosesse gestop het"
"I checked the previous attempt and accept that some changes may already be committed": "Ek het die vorige poging nagegaan en aanvaar dat sommige veranderinge moontlik reeds deurgevoer is"
"I reviewed this plan and have the required backups": "Ek het hierdie plan hersien en het die vereiste rugsteune"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "As 'n werker onverwags stop, bewaar log/cacti.log en bevestig dat sy proses geëindig het voordat jy uitdruklik weer probeer. 'n Wagstatus bevestig nie 'n suksesvolle bekendstelling nie."
