"Keep a backup of the database, RRD files, configuration and secret material.": "Behou 'n rugsteun van die databasis, RRD-lêers, konfigurasie en geheime materiaal."
"Language": "Taal"
"Large tables may require the dedicated CLI conversion tool before installation.": "Groot tabelle mag die toegewyde CLI-omskakelingsnutsding voor installasie vereis."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Laat geheime velde leeg om gestoorde aanmeldbewyse te behou. Geheime word nooit weer vertoon nie."
