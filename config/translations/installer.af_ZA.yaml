"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Vordering wys die laaste aangetekende fase. Die verfrissing van hierdie bladsy begin of herprobeer nooit 'n werker nie."
"Recover stopped attempt": "Herstel gestopte poging"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Herstel behou die gestoorde keuses en beëindig nooit 'n lewendige werker nie. Hersien die plan weer voordat jy weer probeer."
