"Changing the Heartbeat from this page does not change the Heartbeat for your existing Data Sources.  Use RRDtool's 'tune' function to make that change to your existing RRDfiles' heartbeats, or run the CLI utility update_heartbeat.php to correct.": "Ny fanovana ny fitempo eto amin'ity pejy ity dia tsy manova ny fitempo ho an'ireo loharanon'angona efa misy. Ampiasao ny fampiasa 'tune' an'ny RRDtool hanovana ny fitempon'ireo rakitra RRD efa misy, na alefaso ny fitaovana CLI update_heartbeat.php hanitsiana izany."
