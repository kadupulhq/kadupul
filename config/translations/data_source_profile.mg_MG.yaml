"How long can data be missing before RRDtool records unknown data.  Increase this value if your Data Source is unstable and you wish to carry forward old data rather than show gaps in your graphs.  This value is multiplied by the X-Files Factor to determine the actual amount of time.": "Hafiriana no mety tsy hisian'ny angon-drakitra alohan'ny handraisan'ny RRDtool angon-drakitra tsy fantatra. Ampitomboy ity sanda ity raha tsy marin-toerana ny loharanon-drakitrao ka tianao hitohy ny angon-drakitra teo aloha fa tsy hisy banga amin'ny kisary. Ity sanda ity dia ampitomboina amin'ny anton-javatra X-Files hamaritana ny tena faharetan'ny fotoana."
