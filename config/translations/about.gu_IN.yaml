"Kadupul is licensed under the GNU GPL:": "Kadupul GNU GPL હેઠળ લાઇસન્સ થયેલ છે:"
"This program is free software; you can redistribute it and/or modify it under the terms of the GNU General Public License as published by the Free Software Foundation; either version 2 of the License, or (at your option) any later version.": "આ પ્રોગ્રામ મુક્ત સૉફ્ટવેર છે; ફ્રી સૉફ્ટવેર ફાઉન્ડેશન દ્વારા પ્રકાશિત GNU જનરલ પબ્લિક લાઇસન્સની શરતો હેઠળ, લાઇસન્સના સંસ્કરણ 2 અથવા (તમારી પસંદગી મુજબ) કોઈપણ પછીના સંસ્કરણ હેઠળ, તમે તેને પુનઃવિતરિત અને/અથવા સુધારી શકો છો."
"This program is distributed in the hope that it will be useful, but WITHOUT ANY WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the GNU General Public License for more details.": "આ પ્રોગ્રામ ઉપયોગી થશે તેવી આશા સાથે વિતરિત કરવામાં આવે છે, પરંતુ કોઈપણ વોરંટી વિના; વેપારીયોગ્યતા અથવા કોઈ ચોક્કસ હેતુ માટે યોગ્યતાની ગર્ભિત વોરંટી વિના પણ. વધુ વિગતો માટે GNU જનરલ પબ્લિક લાઇસન્સ જુઓ."
