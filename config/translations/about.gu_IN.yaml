"About Kadupul": "Kadupul વિશે"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul નેટવર્ક મોનિટરિંગ અને ટાઇમ-સિરીઝ ગ્રાફિંગ માટેનો એક સ્વતંત્ર ઓપન-સોર્સ પ્રોજેક્ટ છે."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "વિકાસ, યોગદાન અને રિલીઝ નિર્ણયોનું સંચાલન Kadupul સંસ્થા દ્વારા કરવામાં આવે છે."
"For documentation and support, visit the Kadupul project.": "દસ્તાવેજીકરણ અને સપોર્ટ માટે Kadupul પ્રોજેક્ટની મુલાકાત લો."
