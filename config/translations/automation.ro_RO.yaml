"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "Acest formular de set de opțiuni SNMP a expirat. Deschideți din nou setul de opțiuni SNMP și folosiți formularul său actual."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Acesta este un șir unic care va fi comparat cu șirul sysDescr al unui dispozitiv pentru a-l asocia cu acest șablon de automatizare.  Se poate folosi orice expresie regulată Perl, în plus față de orice expresie SQL Where."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Acesta este un șir unic care va fi comparat cu șirul sysName al unui dispozitiv pentru a-l asocia cu acest șablon de automatizare.  Se poate folosi orice expresie regulată Perl, în plus față de orice expresie SQL Where."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Acesta este un șir unic care va fi comparat cu șirul sysOid al unui dispozitiv pentru a-l asocia cu acest șablon de automatizare.  Se poate folosi orice expresie regulată Perl, în plus față de orice expresie SQL Where."
