"Rerun discovery for this Network Range every X days for a Daily schedule, or every X weeks for a Weekly one.": "اجرای مجدد کشف برای این بازه شبکه هر X روز در زمان‌بندی روزانه یا هر X هفته در زمان‌بندی هفتگی."
