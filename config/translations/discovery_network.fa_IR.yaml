"TCP Ping": "Ping از نوع TCP"
"TCP or UDP port to attempt connection.": "پورت TCP یا UDP برای تلاش اتصال."
"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "نشانی ایمیلی که به‌عنوان ایمیل فرستنده برای ایمیل اعلان استفاده می‌شود. در صورت خالی ماندن، نشانی ایمیل پیش‌فرض اعلان خودکارسازی استفاده خواهد شد."
"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "نام حساب ایمیلی که به‌عنوان نام فرستنده برای ایمیل اعلان استفاده می‌شود. در صورت خالی ماندن، نام پیش‌فرض اعلان خودکارسازی استفاده خواهد شد."
"The Email account to be used to send the Notification Email to.": "حساب ایمیلی که ایمیل اعلان به آن ارسال خواهد شد."
"The discovery network changed since you opened this form. Reload before saving.": "شبکه کشف از زمانی که این فرم را باز کرده‌اید تغییر کرده است. پیش از ذخیره دوباره بارگذاری کنید."
"The discovery network form is incomplete.": "فرم شبکه کشف ناقص است."
"The ranges cover more than %count% addresses.": "بازه‌ها بیش از %count% نشانی را پوشش می‌دهند."
"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "مقدار مهلت زمانی مورد استفاده برای pingهای ICMP و UDP میزبان. این مقدار مهلت زمانی SNMP میزبان برای pingهای SNMP اعمال می‌شود."
"The type of ping packet to send.": "نوع بسته ping برای ارسال."
"Third": "سوم"
"Thursday": "پنج‌شنبه"
"Total IP Addresses: %count%": "کل نشانی‌های IP: %count%"
"Tuesday": "سه‌شنبه"
"UDP Ping": "Ping از نوع UDP"
"Unable to load the discovery network. Reload before retrying.": "امکان بارگذاری شبکه کشف وجود ندارد. پیش از تلاش مجدد دوباره بارگذاری کنید."
"Unexpected fields were submitted.": "فیلدهای غیرمنتظره‌ای ارسال شدند."
"Use NetBIOS to attempt to resolve the hostname of up hosts.": "از NetBIOS برای تلاش در تفکیک نام میزبانِ میزبان‌های فعال استفاده شود."
"Wednesday": "چهارشنبه"
"Week(s) of Month": "هفته(های) ماه"
"Weekly": "هفتگی"
"What Day(s) of the Month will this Network Range be discovered?": "در چه روز(های) ماه این بازه شبکه کشف خواهد شد."
"What Day(s) of the week will this Network Range be discovered?": "در چه روز(های) هفته این بازه شبکه کشف خواهد شد."
"What Month(s) of the Year will this Network Range be discovered?": "در چه ماه(های) سال این بازه شبکه کشف خواهد شد."
"What Week(s) of the Month will this Network Range be discovered?": "در چه هفته(های) ماه این بازه شبکه کشف خواهد شد."
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "این آیتم کشف شبکه در چه زمانی آغاز خواهد شد؟ آن را به شکل YYYY-MM-DD HH:MM وارد کنید."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "هنگام کشف دستگاه‌ها، اجازه دهید sysNameهای تکراری روی میزبان‌های مختلف اضافه شوند"
"You must specify both the Months and Days of Month.": "باید هم ماه‌ها و هم روزهای ماه را مشخص کنید."
"You must specify the Months, Weeks of Month, and Days of Week.": "باید ماه‌ها، هفته‌های ماه و روزهای هفته را مشخص کنید."
"You must specify the day of the week.": "باید روز هفته را مشخص کنید."
