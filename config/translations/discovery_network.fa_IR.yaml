"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "فهرستی از سرورهای DNS جایگزین که با فاصله از هم جدا شده‌اند برای تفکیک نام‌های DNS. در صورت خالی بودن، سیستم‌عامل پولر برای تفکیک نام‌های DNS استفاده خواهد شد."
"Access denied.": "دسترسی رد شد."
"Add Discovery Network": "افزودن شبکه کشف"
"After an initial failure, the number of ping retries to attempt before failing.": "پس از اولین خطا، تعداد تلاش‌های مجدد ping پیش از اعلام شکست."
"After the selected Run Limit, the discovery process will be terminated.": "پس از اتمام محدودیت زمانی اجرا، فرآیند کشف متوقف خواهد شد."
"Allow same sysName on different hosts": "مجاز کردن sysName یکسان روی میزبان‌های مختلف"
"Alternate DNS Servers": "سرورهای DNS جایگزین"
"April": "آوریل"
"Associated Site": "سایت پیوسته"
"August": "اوت"
"Automatically Add Devices": "افزودن خودکار دستگاه‌ها"
"Back to Networks": "بازگشت به شبکه‌ها"
"Choose an existing Data Collector.": "یک گردآورنده داده موجود انتخاب کنید."
"Choose an existing SNMP Option Set.": "یک مجموعه گزینه‌های SNMP موجود انتخاب کنید."
"Choose an existing Site.": "یک سایت موجود انتخاب کنید."
"Choose one of the listed values.": "یکی از مقادیر فهرست‌شده را انتخاب کنید."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "گردآورنده داده/پولر مورد استفاده برای جمع‌آوری داده از این دستگاه را انتخاب کنید."
"Choose the Site that you wish to associate discovered Devices with.": "سایتی را انتخاب کنید که می‌خواهید دستگاه‌های کشف‌شده به آن پیوسته شوند."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "زمان‌بندی‌های روزانه و هفتگی از زمان شروع و «اجرای مجدد هر» استفاده می‌کنند؛ هفتگی همچنین از روزهای هفته استفاده می‌کند. ماهانه از ماه‌ها و روزهای ماه استفاده می‌کند؛ «ماهانه در روز مشخص» از ماه‌ها، هفته‌های ماه و روزهای هفته استفاده می‌کند."
"Daily": "روزانه"
"Data Collector": "گردآورنده داده"
"Day(s) of Week": "روز(های) هفته"
"Days of Month": "روزهای ماه"
"Days of Week": "روزهای هفته"
"December": "دسامبر"
"Define the collection frequency.": "تعیین بسامد جمع‌آوری."
"Define the number of threads to use for discovering this Network Range.": "تعیین تعداد رشته‌ها برای کشف این بازه شبکه."
"Discovery Threads": "رشته‌های کشف"
"Discovery Timing": "زمان‌بندی کشف"
"Discovery network not found.": "شبکه کشف یافت نشد."
"Discovery network saved.": "شبکه کشف ذخیره شد."
"Edit Discovery Network": "ویرایش شبکه کشف"
"Enable NetBIOS": "فعال کردن NetBIOS"
"Enable this Network Range.": "فعال کردن این بازه شبکه."
"Enabled": "فعال"
"Enter DNS servers as IP addresses or host names separated by spaces.": "سرورهای DNS را به‌صورت نشانی‌های IP یا نام‌های میزبان جداشده با فاصله وارد کنید."
"Enter IPs or FQDNs of DNS Servers": "IPها یا FQDNهای سرورهای DNS را وارد کنید"
"Enter a name.": "یک نام وارد کنید."
"Enter a valid email address.": "یک نشانی ایمیل معتبر وارد کنید."
"Enter a whole number from %min% to %max%.": "یک عدد صحیح از %min% تا %max% وارد کنید."
"Enter at most %count% bytes.": "حداکثر %count% بایت وارد کنید."
"Enter single-line text.": "متن تک‌خطی وارد کنید."
"Enter the start as YYYY-MM-DD HH:MM.": "زمان شروع را به شکل YYYY-MM-DD HH:MM وارد کنید."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "بازه‌های شبکه معتبر را با کاما از هم جدا کرده و وارد کنید. می‌توانید از یک نشانی IP، یک بازه شبکه مانند 192.168.1.0/24 یا 192.168.1.0/255.255.255.0 یا از نشانه‌گذاری وایلدکارد مانند 192.168.*.* استفاده کنید"
"Enter valid network ranges separated by commas.": "بازه‌های شبکه معتبر را با کاما جدا کرده و وارد کنید."
"February": "فوریه"
"First": "اول"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "برای هر دستگاه تازه‌کشف‌شده‌ای که از طریق SNMP قابل دسترس است و با یک قانون دستگاه مطابقت دارد، آن را به‌عنوان دستگاه اضافه کنید."
"Friday": "جمعه"
"General Settings": "تنظیمات عمومی"
"Give this Network a meaningful name.": "به این شبکه یک نام معنادار بدهید."
"ICMP Ping": "Ping از نوع ICMP"
"If a device previously added is found, rerun its data queries.": "اگر دستگاهی که قبلاً اضافه شده یافت شود، پرس‌وجوهای داده آن دوباره اجرا شوند."
"If checked, when the Automation Network is scanned, a report will be sent to the Notification Email account.": "در صورت انتخاب، هنگام اسکن شبکه خودکارسازی، گزارشی به حساب ایمیل اعلان ارسال خواهد شد."
