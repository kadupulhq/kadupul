"Second": "ثانیه"
"Select the SNMP Options to use for discovery of this Network Range.": "گزینه‌های SNMP مورد استفاده برای کشف این بازه شبکه را انتخاب کنید."
"September": "سپتامبر"
"Starting Date/Time": "تاریخ/زمان شروع"
"Subnet Range": "بازه زیرشبکه"
