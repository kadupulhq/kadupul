"Accept the license before saving the installation plan.": "설치 계획을 저장하기 전에 라이선스에 동의하세요."
"Invalid installation form.": "잘못된 설치 양식입니다."
"Access denied.": "액세스가 거부되었습니다."
"Confirm the recovery warning before retrying.": "다시 시도하기 전에 복구 경고를 확인하세요."
"Review and confirm the current installation plan.": "현재 설치 계획을 검토하고 확인하세요."
"Confirm the discovery scope before starting.": "시작하기 전에 검색 범위를 확인하세요."
"Resolve the blocking checks before starting.": "시작하기 전에 차단 검사를 해결하세요."
"Too many installer options.": "설치 프로그램 옵션이 너무 많습니다."
"Invalid installer option name.": "잘못된 설치 프로그램 옵션 이름입니다."
"Unknown or malformed installer option.": "알 수 없거나 잘못된 형식의 설치 프로그램 옵션입니다."
"Installer options must be scalar values.": "설치 프로그램 옵션은 스칼라 값이어야 합니다."
"Installer option is too long or contains a null byte.": "설치 프로그램 옵션이 너무 길거나 null 바이트를 포함하고 있습니다."
"Installer IDs and intervals must be whole numbers.": "설치 프로그램 ID와 간격은 정수여야 합니다."
"Installer ID or interval is outside its supported range.": "설치 프로그램 ID 또는 간격이 지원되는 범위를 벗어났습니다."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "설치를 진행할 수 없습니다. 다시 시도하기 전에 상태를 다시 불러오고 차단 검사를 검토하세요."
"Confirm that the previous worker has stopped before recovering its plan.": "계획을 복구하기 전에 이전 작업자가 중지되었는지 확인하세요."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "데이터베이스가 설치되었지만 일부 수집기는 여전히 동기화가 필요합니다. 상태를 확인한 후 마무리 작업을 다시 시도하세요."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "설치가 중지되었습니다. 설치 프로그램 로그를 보존하고 원인을 해결한 후 재시도를 명시적으로 확인하세요. 일부 데이터베이스 변경 사항이 이미 커밋되었을 수 있습니다. 재시도를 승인하기 전에 플러그인 정리를 확인하세요."
"Next action": "다음 작업"
"Follow the execution status. Do not start another attempt while a worker is active.": "실행 상태를 확인하세요. 작업자가 활성 상태인 동안에는 다른 시도를 시작하지 마세요."
"Complete the recovery checklist before retrying.": "다시 시도하기 전에 복구 체크리스트를 완료하세요."
"Verify collection and graph operation before enabling discovery.": "검색을 활성화하기 전에 수집 및 그래프 작동을 검증하세요."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "차단된 요구 사항을 해결한 다음 다시 확인하세요. 저장된 선택 항목은 유지됩니다."
"Review the planned changes and backup checklist before authorizing execution.": "실행을 승인하기 전에 계획된 변경 사항과 백업 체크리스트를 검토하세요."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "수집 프로필을 선택하고 라이선스에 동의하세요. 필요한 경우 선택적 설정을 열 수 있습니다."
"Download installation diagnostics": "설치 진단 다운로드"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "그래프를 열고 폴러 주기 후에 RRD 데이터가 업데이트되는지 확인하세요."
"Requirement details": "요구 사항 세부 정보"
"Recover": "복구"
"Recovery checklist": "복구 체크리스트"
"Preserve log/cacti.log and record the failed attempt.": "log/cacti.log를 보존하고 실패한 시도를 기록하세요."
"Confirm that the previous worker and its child processes have stopped.": "이전 작업자와 그 하위 프로세스가 중지되었는지 확인하세요."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "커밋된 변경 사항, 수집기 동기화 및 플러그인 정리를 점검하세요. 다시 시도하기 전에 원인을 해결하세요."
"Review the saved plan again, then explicitly authorize a retry.": "저장된 계획을 다시 검토한 다음 명시적으로 재시도를 승인하세요."
"Recover a stopped worker": "중지된 작업자 복구"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "이 시도가 더 이상 실행 중이지 않음을 확인한 후에만 복구를 사용하세요. 복구는 프로세스를 중지하지 않습니다."
"Collector and installation mode": "수집기 및 설치 모드"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "배포 구성에 따라 수집기 역할과 데이터베이스 연결이 결정됩니다. 수집기를 시작하기 전에 기본 서버 구성을 확인하세요."
"Discovery and SNMP settings": "검색 및 SNMP 설정"
"Keep discovery disabled until collection and collector connectivity have been verified.": "수집 및 수집기 연결이 검증될 때까지 검색을 비활성화된 상태로 유지하세요."
"Template selection": "템플릿 선택"
"Templates selected for import": "가져오기 위해 선택된 템플릿"
"No templates selected.": "선택된 템플릿이 없습니다."
"Backup checklist": "백업 체크리스트"
"Database backup and a tested restoration procedure.": "데이터베이스 백업 및 검증된 복원 절차입니다."
"RRD files and the service account permissions needed to restore them.": "RRD 파일과 이를 복원하는 데 필요한 서비스 계정 권한입니다."
"Configuration, keys and plugin data outside the database.": "데이터베이스 외부의 구성, 키 및 플러그인 데이터입니다."
"Post-installation checks": "설치 후 확인"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "검증된 검사는 표시된 증빙만 다룹니다. 평가되지 않은 검사는 여전히 운영자의 검증이 필요합니다."
"Operational checks still require operator verification.": "운영 점검에는 여전히 운영자의 검증이 필요합니다."
"Status": "상태"
"verified": "검증됨"
"action_required": "조치 필요"
"not_assessed": "평가되지 않음"
"Database schema": "데이터베이스 스키마"
"Stored schema matches the application target.": "저장된 스키마가 애플리케이션 대상과 일치합니다."
"Target schema completion has not been confirmed.": "대상 스키마 완료 여부가 확인되지 않았습니다."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "스키마 업그레이드가 완료되었다고 간주하기 전에 설치 결과를 검토하고 실패 항목을 해결하세요."
"Installation outcome": "설치 결과"
"A successful receipt matches the current target schema.": "성공적인 수신 확인이 현재 대상 스키마와 일치합니다."
"A complete successful installation outcome has not been confirmed.": "전체 설치가 성공적으로 완료되었는지 확인되지 않았습니다."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "설치 프로그램 로그를 보존하고 필요한 경우 명시적 복구 또는 재시도 절차를 사용하세요."
"Collector synchronization": "수집기 동기화"
"The completed installer reports pending collector synchronization.": "완료된 설치 프로그램이 대기 중인 수집기 동기화가 있다고 보고합니다."
"The completed installer reports no pending collectors.": "완료된 설치 프로그램이 대기 중인 수집기가 없다고 보고합니다."
"Collector completion remains unconfirmed by this partial receipt.": "이 부분 수신 확인만으로는 수집기 완료 여부가 확인되지 않습니다."
"Collector completion is not established by this installation outcome.": "이 설치 결과만으로는 수집기 완료 여부가 확정되지 않습니다."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "부분 결과에 대해 수집기 상태를 검토하고 마무리 작업을 다시 시도하세요. 이 작업은 이후 수집 최신 상태를 검증하지는 않습니다."
"Scheduled collection": "예약된 수집"
"No poller or device was contacted by this assessment.": "이 평가에서는 폴러나 장치에 연결하지 않았습니다."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "구성된 스케줄러가 의도된 서비스 계정으로 폴러를 실행하는지 확인하고 다음 정상 주기를 검토하세요."
"Graph data": "그래프 데이터"
"Live samples and RRD updates were not exercised.": "실시간 샘플 및 RRD 업데이트는 수행되지 않았습니다."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "정상적인 수집 주기가 지난 후 예상한 그래프에 최신 샘플이 수신되는지 확인하고 폴러 오류를 검토하세요."
"Recovery readiness": "복구 준비 상태"
"Backup restoration was not exercised.": "백업 복원 테스트는 수행되지 않았습니다."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "복구에 의존하기 전에 데이터베이스, RRD 파일, 구성 및 키 자료의 격리된 복원을 검증하세요."
"No persisted local poller start has been recorded.": "저장된 로컬 폴러 시작 기록이 없습니다."
"Persisted poller timing is invalid and cannot establish scheduler health.": "저장된 폴러 타이밍이 잘못되어 스케줄러 상태를 확인할 수 없습니다."
"The recorded poller start is in the future. Check clock synchronization.": "기록된 폴러 시작 시간이 미래입니다. 시간 동기화를 확인하세요."
"The recorded poller start is older than the native scheduling tolerance.": "기록된 폴러 시작 시간이 네이티브 스케줄링 허용 오차보다 오래되었습니다."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "네이티브 스케줄링 허용 오차 내에서 로컬 폴러 시작이 기록되었습니다. 완료 여부와 장치 상태는 검증되지 않았습니다."
"readable": "읽기 가능"
"missing or unreadable": "누락되었거나 읽기 불가"
"Restore the complete release and its locked dependencies; grant the service account read access.": "전체 릴리스 및 잠긴 종속성을 복원하고 서비스 계정에 읽기 권한을 부여하세요."
"PHP temporary directory": "PHP 임시 디렉터리"
"directory writable by this process": "이 프로세스에서 쓸 수 있는 디렉터리"
"missing or not writable": "누락되었거나 쓰기 불가"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "설치 계정이 쓸 수 있는 기존 디렉터리로 sys_temp_dir을 구성하세요. 네이티브 가져오기에는 임시 파일이 사용됩니다."
"Background worker launch": "백그라운드 작업자 실행"
"required PHP functions available; launch not exercised": "필수 PHP 함수를 사용할 수 있으나 실행은 수행되지 않음"
"required PHP launch function disabled": "필수 PHP 실행 함수가 비활성화됨"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "웹 PHP 런타임에 대해 exec을 활성화하거나 권한이 부여된 CLI 설치 프로그램을 사용하세요."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "웹 PHP 런타임에 대해 popen, pclose를 활성화하거나 권한이 부여된 CLI 설치 프로그램을 사용하세요."
"Database transaction ownership": "데이터베이스 트랜잭션 소유권"
"autocommit enabled; no caller-owned transaction": "autocommit이 활성화되었으며 호출자 소유 트랜잭션이 없음"
"autocommit disabled or caller transaction active": "autocommit이 비활성화되었거나 호출자 트랜잭션이 활성 상태임"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "호출자가 소유한 트랜잭션 외부에서 설치를 실행하고 변경 연결에서 autocommit을 활성화하세요."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "릴리스 디렉터리를 복원하고 템플릿 리소스 가져오기를 위해 설치 계정에 쓰기 권한을 부여하세요. 모든 사용자에게 쓰기 권한(world-writable)을 부여하지 마세요."
"Worker file: install/background.php": "작업자 파일: install/background.php"
"Worker file: bin/legacy-installer.php": "작업자 파일: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "작업자 파일: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "가져오기 대상: resource/snmp_queries"
"Import destination: resource/script_server": "가져오기 대상: resource/script_server"
"Import destination: resource/script_queries": "가져오기 대상: resource/script_queries"
"Import destination: scripts": "가져오기 대상: scripts"
"Database privileges": "데이터베이스 권한"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "활성 역할 및 개체별 부여 권한을 포함한 유효 마이그레이션 권한은 검증되지 않았습니다."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "데이터베이스 관리자에게 설치 계정 및 스키마에 대해 필요한 테이블 쓰기, 스키마 변경, 트리거 및 루틴 권한을 확인하도록 요청하세요. 전역 관리자 권한은 부여하지 마세요."
"Compare web and worker runtimes": "웹 및 작업자 런타임 비교"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "이 작업은 짧은 읽기 전용 PHP 프로브를 명시적으로 시작합니다. 설치 프로그램을 예약하거나 파일을 쓰거나 장치에 연결하지 않습니다."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "이 프로브는 현재 웹 프로세스를 상속하고 구성된 설치 프로그램 PHP 인터프리터를 사용합니다. 별도의 스케줄러나 서비스를 검사하지는 않습니다."
"I authorize the read-only worker runtime comparison.": "읽기 전용 작업자 런타임 비교를 승인합니다."
"Compare runtimes": "런타임 비교"
"Runtime comparison results": "런타임 비교 결과"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "권한 및 ID 차이는 의도된 것일 수 있습니다. 읽기 전용 관측 결과만으로 쓰기나 설치가 성공한다고 보장할 수는 없습니다."
"Confirm the read-only worker runtime comparison.": "읽기 전용 작업자 런타임 비교를 확인하세요."
"The runtime comparison is unavailable.": "런타임 비교를 사용할 수 없습니다."
"Shared application secret": "공유 애플리케이션 시크릿"
"A strong web application secret is required before comparison.": "비교하기 전에 강력한 웹 애플리케이션 시크릿이 필요합니다."
"Runtime comparison": "런타임 비교"
"The configured worker runtime did not confirm a bounded comparison.": "구성된 작업자 런타임이 제한된 비교를 확인하지 못했습니다."
"The inherited worker secret could not be confirmed against the web secret.": "상속된 작업자 시크릿을 웹 시크릿과 대조하여 확인할 수 없었습니다."
"PHP runtime comparison": "PHP 런타임 비교"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "두 런타임 모두 PHP 8.4를 지원해야 하며, 패치 버전이 다른 경우 검토가 필요합니다."
"Required extension comparison": "필수 확장 모듈 비교"
"Required extension availability is checked; differing versions require review.": "필수 확장 모듈 사용 가능 여부가 확인되었으며, 버전이 다른 경우 검토가 필요합니다."
"Process identity comparison": "프로세스 ID 비교"
"Effective process identity is unavailable on this platform.": "이 플랫폼에서는 유효 프로세스 ID를 사용할 수 없습니다."
"Effective process identities match.": "유효 프로세스 ID가 일치합니다."
"Effective process identities differ; separate service accounts may be intentional.": "유효 프로세스 ID가 다릅니다. 의도적으로 별도의 서비스 계정을 사용하는 것일 수 있습니다."
"Directory access comparison": "디렉터리 액세스 비교"
"Read-only directory permission observations match.": "읽기 전용 디렉터리 권한 관측 결과가 일치합니다."
"Directory locations or permission observations differ; review the service-account roles.": "디렉터리 위치 또는 권한 관측 결과가 다릅니다. 서비스 계정 역할을 검토하세요."
"Worker directory read and traversal": "작업자 디렉터리 읽기 및 탐색"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "필수 작업자 디렉터리가 존재해야 하며 읽기 및 탐색(traversal)을 허용해야 합니다. 쓰기 테스트는 수행되지 않았습니다."
"The inherited worker secret matches the web secret for this private challenge.": "상속된 작업자 시크릿이 이 비공개 챌린지의 웹 시크릿과 일치합니다."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "구성된 PHP 인터프리터, 필수 확장 모듈, 상속된 시크릿 및 서비스 계정 디렉터리 권한을 검토하세요. 쓰기 작업이나 설치 프로그램 시작은 수행되지 않았습니다."
"advisory": "권고"
