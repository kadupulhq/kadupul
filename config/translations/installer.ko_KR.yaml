"Recover stopped attempt": "중지된 시도 복구"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "복구는 저장된 선택 항목을 유지하며 실행 중인 작업자를 종료하지 않습니다. 다시 시도하기 전에 계획을 다시 검토하세요."
"Review": "검토"
"Review installation plan": "설치 계획 검토"
"Run": "실행"
"Run reviewed plan": "검토된 계획 실행"
"Save and review": "저장 및 검토"
"Scope": "범위"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "상태를 사용할 수 없습니다. 저장된 작업은 유지됩니다. 다시 연결하려면 새로 고침하세요. 다른 설치를 제출하지 마세요."
