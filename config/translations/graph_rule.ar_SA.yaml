"A useful name for this Rule.": "اسم مفيد لهذه القاعدة."
"Access denied.": "تم رفض الوصول."
"Add Graph Rule": "إضافة قاعدة رسم بياني"
"Back to Graph Rules": "العودة إلى قواعد الرسوم البيانية"
"Check this box to enable this rule.": "حدد هذا المربع لتمكين هذه القاعدة."
"Choose a Data Query to apply to this rule.": "اختر استعلام بيانات لتطبيقه على هذه القاعدة."
"Choose a Graph Type": "اختر نوع الرسم البياني"
"Choose a Graph Type of the selected Data Query.": "اختر نوع رسم بياني من استعلام البيانات المحدد."
"Choose an existing Data Query.": "اختر استعلام بيانات موجوداً."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "اختر أيّاً من أنواع الرسوم البيانية المتاحة لاستعلام البيانات المحدد لتطبيقها على هذه القاعدة."
"Data Query": "استعلام البيانات"
"Device Selection and Graph Creation Criteria": "معايير اختيار الأجهزة وإنشاء الرسوم البيانية"
"Edit Graph Rule": "تحرير قاعدة الرسم البياني"
"Enable Rule": "تمكين القاعدة"
"Enter a name.": "أدخل اسماً."
"Enter at most %count% characters.": "أدخل %count% حرفاً على الأكثر."
"Enter single-line text.": "أدخل نصاً من سطر واحد."
"Graph Type": "نوع الجراف"
"Graph rule not found.": "لم يتم العثور على قاعدة الرسم البياني."
"Graph rule saved.": "تم حفظ قاعدة الرسم البياني."
"Name": "الاسم"
"Rule Selection [edit: %name%]": "تحديد القواعد [تحرير: %name%]"
"Rule Selection [new]": "تحديد القواعد [جديد]"
"Save": "حفظ"
"Save outcome is uncertain. Reload before retrying.": "نتيجة الحفظ غير مؤكدة. أعد التحميل قبل إعادة المحاولة."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "احفظ القاعدة أولاً؛ وتُضاف معايير اختيار الأجهزة وإنشاء الرسوم البيانية الخاصة بها بعد ذلك."
"The graph rule changed since you opened this form. Reload before saving.": "تغيّرت قاعدة الرسم البياني منذ فتح هذا النموذج. أعد التحميل قبل الحفظ."
"Unable to load the graph rule. Reload before retrying.": "تعذّر تحميل قاعدة الرسم البياني. أعد التحميل قبل إعادة المحاولة."
"Unexpected fields were submitted.": "تم إرسال حقول غير متوقعة."
