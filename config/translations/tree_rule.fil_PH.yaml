"A useful name for this Rule.": "Isang kapaki-pakinabang na pangalan para sa Panuntunang ito."
"Access denied.": "Tinanggihan ang access."
"Add Tree Rule": "Magdagdag ng Tree Rule"
"Back to Tree Rules": "Bumalik sa Mga Tree Rule"
"Cancel": "Kanselahin"
"Check this box to enable this rule.": "I-check ang kahon na ito upang i-enable ang panuntunang ito."
"Choose a Tree for the new Tree Items.": "Pumili ng Tree para sa mga bagong Tree Item."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Pumili ng header ng napiling Tree na pagkakabitan, o ang root nito. Tiyaking umiiral pa ito kapag isinagawa ang rule na ito."
"Choose a header of the selected Tree.": "Pumili ng header ng napiling Tree."
"Choose a listed Graph Grouping Style.": "Pumili ng nakalistang Graph Grouping Style."
"Choose a listed Leaf Item Type.": "Pumili ng nakalistang Uri ng Leaf Item."
"Choose an existing Tree.": "Pumili ng umiiral na Tree."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Piliin kung paano pinagsasama-sama ang mga graph kapag iginuhit para sa partikular na host na ito sa tree. Ginagamit para sa mga Device leaf."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "I-click ang Magpatuloy upang burahin ang mga sumusunod na Tree Rule kasama ang kanilang Object Selection at Tree Creation Criteria."
"Click Continue to disable the following Tree Rules.": "I-click ang Magpatuloy upang i-disable ang mga sumusunod na Tree Rule."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "I-click ang Magpatuloy upang i-duplicate ang mga sumusunod na Tree Rule. Maaari mong baguhin ang format ng pamagat para sa mga bagong Tree Rule, na magsisimulang naka-disable."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "I-click ang Magpatuloy upang i-enable ang mga sumusunod na Tree Rule. Tiyaking matagumpay na nasubukan ang mga ito."
"Continue": "Magpatuloy"
"Data Query Index": "Index ng Data Query"
"Delete Tree Rules": "Burahin ang Mga Tree Rule"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pagbura. Suriin ang listahan ng Tree Rule bago muling subukan."
"Delete selected": "Burahin ang napili"
"Device": "Device"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Hindi maaaring gumamit ng pamantayan sa mga column ng graph o graph template ang mga Device leaf. Kapag binago ang Uri ng Leaf Item sa Device, lagyan ng check ang kahon na ito upang alisin ang mga pamantayang iyon; hindi na maibabalik ang mga ito."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Hindi maaaring gumamit ng pamantayang nakabatay sa graph ang mga Device leaf. Kumpirmahin ang pag-alis ng %count% pamantayan upang mag-save."
"Disable Tree Rules": "I-disable ang Mga Tree Rule"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pag-disable. Suriin ang listahan ng Tree Rule bago muling subukan."
"Disable selected": "I-disable ang napili"
"Duplicate Tree Rules": "I-duplicate ang Mga Tree Rule"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pag-duplicate. Suriin ang listahan ng Tree Rule bago muling subukan."
"Duplicate selected": "I-duplicate ang napili"
"Edit Tree Rule": "I-edit ang Tree Rule"
"Enable Rule": "I-enable ang Panuntunan"
"Enable Tree Rules": "I-enable ang Mga Tree Rule"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Hindi tiyak ang kinalabasan ng pag-enable. Suriin ang listahan ng Tree Rule bago muling subukan."
"Enable selected": "I-enable ang napili"
"Enter a name.": "Maglagay ng pangalan."
"Enter a valid name format.": "Maglagay ng wastong format ng pangalan."
"Enter at most %count% characters.": "Maglagay ng hindi hihigit sa %count% karakter."
"Enter single-line text.": "Maglagay ng tekstong isang linya."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Papalitan ng pangalan ng kinokopyang Tree Rule ang bawat <rule_name>."
"Graph": "Graph"
"Graph Grouping Style": "Estilo ng Pagpapangkat ng Graph"
"Graph Template": "Graph Template"
"Invalid Tree Rule selection.": "Di-wastong pagpili ng Tree Rule."
"Leaf Item Type": "Uri ng Leaf Item"
"Name": "Pangalan"
"Object Selection and Tree Creation Criteria": "Object Selection at Tree Creation Criteria"
"One or more selected Tree Rules no longer exist.": "Ang isa o higit pa sa mga napiling Tree Rule ay wala na."
"Optional: Sub-Tree Item": "Opsyonal: Sub-Tree Item"
"Remove graph-based criteria": "Alisin ang pamantayang nakabatay sa graph"
"Save": "I-save"
"Save outcome is uncertain. Reload before retrying.": "Hindi tiyak ang kinalabasan ng pag-save. I-reload bago muling subukan."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "I-save muna ang rule; idaragdag pagkatapos ang Object Selection at Tree Creation Criteria nito."
"Select": "Piliin"
"Select %name%": "Piliin ang %name%"
"Select at least one Tree Rule.": "Pumili ng kahit isang Tree Rule."
"Select at most 100 Tree Rules at a time.": "Pumili ng hindi hihigit sa 100 Tree Rule sa isang pagkakataon."
"Select up to %count% rows at a time.": "Pumili ng hanggang %count% hilera sa isang pagkakataon."
"The Item Type that shall be dynamically added to the tree.": "Ang Item Type na dynamic na idadagdag sa tree."
"The name format must give every copy a name of 1 to 255 characters.": "Dapat magbigay ang format ng pangalan ng pangalang 1 hanggang 255 karakter sa bawat kopya."
"The tree rule changed since you opened this form. Reload before saving.": "Nagbago ang tree rule mula nang buksan mo ang form na ito. I-reload bago mag-save."
"Title Format": "Format ng Pamagat"
"Tree": "Tree"
"Tree Rule Selection [edit: %name%]": "Pagpili ng Tree Rule [i-edit: %name%]"
"Tree Rules Selection [new]": "Pagpili ng Mga Tree Rule [bago]"
"Tree rule not found.": "Hindi nakita ang tree rule."
"Tree rule saved.": "Na-save ang tree rule."
"Unable to load Tree Rules. Reload before retrying.": "Hindi ma-load ang mga Tree Rule. I-reload bago muling subukan."
"Unable to load the tree rule. Reload before retrying.": "Hindi ma-load ang tree rule. I-reload bago muling subukan."
"Unexpected fields were submitted.": "May mga hindi inaasahang field na naisumite."
