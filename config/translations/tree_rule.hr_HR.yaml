"A useful name for this Rule.": "Smislen naziv za ovo pravilo."
"Access denied.": "Pristup odbijen."
"Add Tree Rule": "Dodaj pravilo stabla"
"Back to Tree Rules": "Natrag na pravila stabla"
"Cancel": "Odustani"
"Check this box to enable this rule.": "Označite ovaj okvir za omogućavanje ovog pravila."
"Choose a Tree for the new Tree Items.": "Odaberite stablo za nove stavke stabla."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Odaberite zaglavlje odabranog stabla na koje se veže ili njegov korijen. Provjerite da još postoji kada se ovo pravilo izvrši."
"Choose a header of the selected Tree.": "Odaberite zaglavlje odabranog stabla."
"Choose a listed Graph Grouping Style.": "Odaberite stil grupiranja grafova s popisa."
"Choose a listed Leaf Item Type.": "Odaberite vrstu stavke lista s popisa."
"Choose an existing Tree.": "Odaberite postojeće stablo."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Odaberite kako se grafovi grupiraju pri crtanju za ovaj poslužitelj na stablu. Koristi se za listove uređaja."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Kliknite Nastavi za brisanje sljedećih pravila stabla s njihovim kriterijima odabira objekata i stvaranja stabla."
"Click Continue to disable the following Tree Rules.": "Kliknite Nastavi za onemogućavanje sljedećih pravila stabla."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Kliknite Nastavi za dupliciranje sljedećih pravila stabla. Po želji možete promijeniti format naslova za nova pravila stabla, koja počinju onemogućena."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Kliknite Nastavi za omogućavanje sljedećih pravila stabla. Provjerite jesu li uspješno testirana."
"Continue": "Nastavi"
"Data Query Index": "Indeks upita podataka"
"Delete Tree Rules": "Izbriši pravila stabla"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Ishod brisanja je neizvjestan. Provjerite popis pravila stabla prije novog pokušaja."
"Delete selected": "Izbriši odabrano"
"Device": "Uređaj"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Listovi uređaja ne mogu koristiti kriterije na stupcima grafa ili predloška grafa. Pri promjeni vrste stavke lista u Uređaj označite ovaj okvir za uklanjanje tih kriterija; ne mogu se vratiti."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Listovi uređaja ne mogu koristiti kriterije temeljene na grafovima. Potvrdite uklanjanje kriterija (%count%) za spremanje."
