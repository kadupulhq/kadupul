"Collector": "Collettore"
"Configure": "Configura"
"Configuring collection profiles": "Configurazione dei profili di raccolta"
"Configuring discovery": "Configurazione del rilevamento"
"Configuring the local device": "Configurazione del dispositivo locale"
"Confirming database version": "Conferma della versione del database"
"Converting selected tables": "Conversione delle tabelle selezionate"
"Database version": "Versione del database"
"Disabled": "Disabilitato"
"Discovery": "Rilevamento"
"Discovery SNMP settings": "Impostazioni SNMP di rilevamento"
"Discovery range": "Intervallo di rilevamento"
"Enable discovery after installation": "Abilita rilevamento dopo l'installazione"
"Executable paths": "Percorsi degli eseguibili"
"Execution status": "Stato di esecuzione"
"Finished execution": "Esecuzione completata"
"Finishing tasks only. Schema migrations will not be replayed.": "Solo attività conclusive. Le migrazioni dello schema non verranno rieseguite."
"I accept the license terms": "Accetto i termini di licenza"
"I authorize discovery of the displayed range": "Autorizzo il rilevamento dell'intervallo visualizzato"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Ho controllato il log e confermato che il worker precedente e i relativi processi figli sono terminati"
"I checked the previous attempt and accept that some changes may already be committed": "Ho controllato il tentativo precedente e accetto che alcune modifiche possano essere già state applicate"
"I reviewed this plan and have the required backups": "Ho esaminato questo piano e dispongo dei backup richiesti"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Se un worker si arresta in modo imprevisto, conserva log/cacti.log e verifica che il relativo processo sia terminato prima di riprovare esplicitamente. Uno stato di attesa non conferma l'avvio riuscito."
"Importing templates": "Importazione dei modelli"
"Install Kadupul": "Installa Kadupul"
"Installation and upgrade": "Installazione e aggiornamento"
"Installation request was rejected.": "La richiesta di installazione è stata rifiutata."
"Installation steps": "Passaggi di installazione"
"Installed": "Installato"
"Keep a backup of the database, RRD files, configuration and secret material.": "Conserva un backup del database, dei file RRD, della configurazione e del materiale crittografico."
"Language": "Lingua"
"Large tables may require the dedicated CLI conversion tool before installation.": "Le tabelle di grandi dimensioni potrebbero richiedere l'uso dello strumento di conversione CLI dedicato prima dell'installazione."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Lascia vuoti i campi dei segreti per mantenere le credenziali memorizzate. I segreti non vengono mai visualizzati nuovamente."
"License": "Licenza"
"No action needed": "Nessuna azione necessaria"
"Observed": "Osservato"
"Open the console": "Apri la console"
"Operation": "Operazione"
"Override discovery SNMP settings": "Sovrascrivi impostazioni SNMP di rilevamento"
"Pass": "Superato"
"Poller interval in seconds": "Intervallo poller in secondi"
"Preparing CSRF protection": "Preparazione protezione CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "L'avanzamento mostra l'ultima fase registrata. L'aggiornamento di questa pagina non avvia né ripete mai un worker."
"Recover stopped attempt": "Recupera tentativo arrestato"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Il recupero conserva le selezioni salvate e non termina mai un worker attivo. Esamina nuovamente il piano prima di riprovare."
"Review": "Revisiona"
"Review installation plan": "Esamina piano di installazione"
"Run": "Esegui"
"Run reviewed plan": "Esegui piano esaminato"
"Save and review": "Salva e revisiona"
"Scope": "Ambito"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Lo stato non è disponibile. Il lavoro salvato è mantenuto. Aggiorna per riconnetterti; non inviare un'altra installazione."
"Synchronizing collectors": "Sincronizzazione collettori"
"Table conversions": "Conversioni tabelle"
"Templates": "Modelli"
"The database version matches this application. Installation does not establish that polling is healthy.": "La versione del database corrisponde a questa applicazione. L'installazione non dimostra che il polling sia integro."
"The request outcome is unknown. Check execution status before retrying.": "L'esito della richiesta è sconosciuto. Controlla lo stato di esecuzione prima di riprovare."
"Theme": "Tema"
"Verify": "Verifica"
"Verify the poller schedule and service account.": "Verifica la pianificazione del poller e l'account di servizio."
"Version change": "Cambio versione"
"Waiting for the installation worker": "In attesa del worker di installazione"
"collector": "collettore"
"complete": "completato"
"failed": "non riuscito"
"finish": "completa"
"install": "installa"
"not_started": "non avviato"
"partial": "parziale"
"running": "in esecuzione"
"succeeded": "riuscito"
"upgrade": "aggiorna"
"waiting": "in attesa"
"Accept the license before saving the installation plan.": "Accetta la licenza prima di salvare il piano di installazione."
"Invalid installation form.": "Modulo di installazione non valido."
"Access denied.": "Accesso negato."
"Confirm the recovery warning before retrying.": "Conferma l'avviso di ripristino prima di riprovare."
"Review and confirm the current installation plan.": "Esamina e conferma il piano di installazione corrente."
"Confirm the discovery scope before starting.": "Conferma l'ambito di rilevamento prima di iniziare."
"Resolve the blocking checks before starting.": "Risolvi i controlli bloccanti prima di iniziare."
"Too many installer options.": "Troppe opzioni dell'installer."
"Invalid installer option name.": "Nome opzione installer non valido."
"Unknown or malformed installer option.": "Opzione dell'installer sconosciuta o non valida."
"Installer options must be scalar values.": "Le opzioni dell'installer devono essere valori scalari."
"Installer option is too long or contains a null byte.": "L'opzione dell'installer è troppo lunga o contiene un byte nullo."
"Installer IDs and intervals must be whole numbers.": "Gli ID e gli intervalli dell'installer devono essere numeri interi."
"Installer ID or interval is outside its supported range.": "L'ID o l'intervallo dell'installer è al di fuori dell'intervallo supportato."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Impossibile procedere con l'installazione. Ricarica lo stato ed esamina i controlli bloccanti prima di riprovare."
"Confirm that the previous worker has stopped before recovering its plan.": "Conferma che il worker precedente si sia arrestato prima di recuperarne il piano."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Il database è installato, ma alcuni collettori richiedono ancora la sincronizzazione. Riprova le attività conclusive dopo averne verificato lo stato."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Installazione interrotta. Conserva il log dell'installer, correggi la causa e conferma esplicitamente un nuovo tentativo. Alcune modifiche al database potrebbero essere già state applicate. Verifica la pulizia dei plugin prima di autorizzare un nuovo tentativo."
"Next action": "Azione successiva"
"Follow the execution status. Do not start another attempt while a worker is active.": "Segui lo stato di esecuzione. Non avviare un altro tentativo mentre un worker è attivo."
"Complete the recovery checklist before retrying.": "Completa la checklist di ripristino prima di riprovare."
"Verify collection and graph operation before enabling discovery.": "Verifica il funzionamento di raccolta e grafici prima di abilitare il rilevamento."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Risolvi i requisiti bloccati, quindi controlla di nuovo. Le selezioni salvate vengono mantenute."
"Review the planned changes and backup checklist before authorizing execution.": "Esamina le modifiche pianificate e la checklist di backup prima di autorizzare l'esecuzione."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Scegli un profilo di raccolta e accetta la licenza. Le impostazioni opzionali possono essere aperte quando necessario."
"Download installation diagnostics": "Scarica diagnostica di installazione"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Apri un grafico e verifica che i relativi dati RRD si aggiornino dopo un ciclo del poller."
"Requirement details": "Dettagli requisiti"
"Recover": "Recupera"
"Recovery checklist": "Checklist di recupero"
"Preserve log/cacti.log and record the failed attempt.": "Conserva log/cacti.log e registra il tentativo non riuscito."
"Confirm that the previous worker and its child processes have stopped.": "Conferma che il worker precedente e i relativi processi figli siano terminati."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Esamina le modifiche applicate, la sincronizzazione dei collettori e la pulizia dei plugin. Correggi la causa prima di riprovare."
"Review the saved plan again, then explicitly authorize a retry.": "Esamina nuovamente il piano salvato, quindi autorizza esplicitamente un nuovo tentativo."
"Recover a stopped worker": "Recupera un worker arrestato"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Usa il recupero solo dopo aver confermato che questo tentativo non è più in esecuzione. Il recupero non arresta un processo."
"Collector and installation mode": "Collettore e modalità di installazione"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "La configurazione di distribuzione determina il ruolo del collettore e le connessioni al database. Verifica la configurazione del server primario prima di avviare un collettore."
"Discovery and SNMP settings": "Impostazioni di rilevamento e SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Mantieni disabilitato il rilevamento finché la raccolta e la connettività dei collettori non sono state verificate."
"Template selection": "Selezione modello"
"Templates selected for import": "Modelli selezionati per l'importazione"
"No templates selected.": "Nessun modello selezionato."
"Backup checklist": "Checklist di backup"
"Database backup and a tested restoration procedure.": "Backup del database e procedura di ripristino testata."
"RRD files and the service account permissions needed to restore them.": "I file RRD e i permessi dell'account di servizio necessari per ripristinarli."
"Configuration, keys and plugin data outside the database.": "Configurazione, chiavi e dati dei plugin esterni al database."
"Post-installation checks": "Controlli post-installazione"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "I controlli verificati coprono solo le evidenze mostrate. I controlli non valutati richiedono comunque la verifica dell'operatore."
"Operational checks still require operator verification.": "I controlli operativi richiedono comunque la verifica dell'operatore."
"Status": "Stato"
"verified": "Verificato"
"action_required": "Azione richiesta"
"not_assessed": "Non valutato"
"Database schema": "Schema del database"
"Stored schema matches the application target.": "Lo schema memorizzato corrisponde alla destinazione dell'applicazione."
"Target schema completion has not been confirmed.": "Il completamento dello schema di destinazione non è stato confermato."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Esamina l'esito dell'installazione e risolvi gli errori prima di considerare completato l'aggiornamento dello schema."
"Installation outcome": "Esito installazione"
"A successful receipt matches the current target schema.": "Una ricevuta valida corrisponde allo schema di destinazione corrente."
"A complete successful installation outcome has not been confirmed.": "Non è stato confermato un esito completo e riuscito dell'installazione."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Conserva il log dell'installer e usa la procedura esplicita di ripristino o nuovo tentativo quando necessario."
"Collector synchronization": "Sincronizzazione collettori"
"The completed installer reports pending collector synchronization.": "Il programma di installazione completato segnala una sincronizzazione dei collettori in sospeso."
"The completed installer reports no pending collectors.": "Il programma di installazione completato segnala nessun collettore in sospeso."
"Collector completion remains unconfirmed by this partial receipt.": "Il completamento del collettore resta non confermato da questa ricevuta parziale."
"Collector completion is not established by this installation outcome.": "Il completamento del collettore non è dimostrato da questo esito dell'installazione."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Esamina lo stato dei collettori e riprova le attività conclusive per gli esiti parziali. Questo non verifica l'aggiornamento successivo della raccolta."
"Scheduled collection": "Raccolta pianificata"
"No poller or device was contacted by this assessment.": "Nessun poller o dispositivo è stato contattato da questa valutazione."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Conferma che lo scheduler configurato esegua il poller con l'account di servizio previsto e verifica il successivo ciclo normale."
"Graph data": "Dati grafico"
"Live samples and RRD updates were not exercised.": "I campioni in tempo reale e gli aggiornamenti RRD non sono stati eseguiti."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Dopo un normale ciclo di raccolta, verifica che i grafici previsti ricevano campioni recenti e controlla gli errori del poller."
"Recovery readiness": "Prontezza al recupero"
"Backup restoration was not exercised.": "Il ripristino del backup non è stato eseguito."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Verifica un ripristino isolato di database, file RRD, configurazione e materiale delle chiavi prima di fare affidamento sul recupero."
"No persisted local poller start has been recorded.": "Non è stato registrato alcun avvio persistente del poller locale."
"Persisted poller timing is invalid and cannot establish scheduler health.": "La temporizzazione persistita del poller non è valida e non può stabilire lo stato dello scheduler."
"The recorded poller start is in the future. Check clock synchronization.": "L'avvio registrato del poller è nel futuro. Verifica la sincronizzazione dell'orologio."
"The recorded poller start is older than the native scheduling tolerance.": "L'avvio registrato del poller è precedente alla tolleranza di pianificazione nativa."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "È stato registrato un avvio del poller locale entro la tolleranza di pianificazione nativa. Il completamento e lo stato del dispositivo non sono verificati."
"readable": "leggibile"
"missing or unreadable": "mancante o illeggibile"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Ripristina la release completa e le relative dipendenze bloccate; concedi all'account di servizio l'accesso in lettura."
"PHP temporary directory": "Directory temporanea PHP"
"directory writable by this process": "directory scrivibile da questo processo"
"missing or not writable": "mancante o non scrivibile"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Configura sys_temp_dir come directory esistente scrivibile dall'account di installazione. Le importazioni native usano file temporanei."
"Background worker launch": "Avvio worker in background"
"required PHP functions available; launch not exercised": "funzioni PHP richieste disponibili; avvio non eseguito"
"required PHP launch function disabled": "funzione di avvio PHP richiesta disabilitata"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Abilita exec per il runtime PHP web oppure usa il programma di installazione CLI autorizzato."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Abilita popen, pclose per il runtime PHP web oppure usa il programma di installazione CLI autorizzato."
"Database transaction ownership": "Titolarità delle transazioni del database"
"autocommit enabled; no caller-owned transaction": "autocommit abilitato; nessuna transazione di proprietà del chiamante"
"autocommit disabled or caller transaction active": "autocommit disabilitato o transazione del chiamante attiva"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Esegui l'installazione al di fuori di una transazione di proprietà del chiamante e abilita l'autocommit sulla relativa connessione di modifica."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Ripristina la directory della release e concedi all'account di installazione l'accesso in scrittura per le importazioni delle risorse dei modelli. Non renderla scrivibile da chiunque."
"Worker file: install/background.php": "File worker: install/background.php"
"Worker file: bin/legacy-installer.php": "File worker: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "File worker: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Destinazione importazione: resource/snmp_queries"
"Import destination: resource/script_server": "Destinazione importazione: resource/script_server"
"Import destination: resource/script_queries": "Destinazione importazione: resource/script_queries"
"Import destination: scripts": "Destinazione importazione: scripts"
"Database privileges": "Privilegi del database"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "I privilegi effettivi di migrazione, inclusi i ruoli attivi e i permessi specifici per oggetto, non sono stati verificati."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Chiedi all'amministratore del database di verificare le scritture su tabella, le modifiche allo schema, i trigger e le routine richiesti per l'account e lo schema di installazione. Non concedere privilegi di amministratore globale."
"Compare web and worker runtimes": "Confronta i runtime web e worker"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Questo avvia esplicitamente un breve probe PHP di sola lettura. Non riserva un installer, non scrive file né contatta dispositivi."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Il probe eredita questo processo web e usa l'interprete PHP configurato per l'installer. Non ispeziona uno scheduler o un servizio separato."
"I authorize the read-only worker runtime comparison.": "Autorizzo il confronto di sola lettura del runtime del worker."
"Compare runtimes": "Confronta runtime"
"Runtime comparison results": "Risultati confronto runtime"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Le differenze di permessi e identità possono essere intenzionali. Le osservazioni in sola lettura non dimostrano che le scritture o l'installazione riusciranno."
"Confirm the read-only worker runtime comparison.": "Conferma il confronto di sola lettura del runtime del worker."
"The runtime comparison is unavailable.": "Il confronto runtime non è disponibile."
"Shared application secret": "Segreto condiviso dell'applicazione"
"A strong web application secret is required before comparison.": "È richiesto un segreto sicuro dell'applicazione web prima del confronto."
"Runtime comparison": "Confronto runtime"
"The configured worker runtime did not confirm a bounded comparison.": "Il runtime del worker configurato non ha confermato un confronto limitato."
"The inherited worker secret could not be confirmed against the web secret.": "Impossibile confermare il segreto ereditato del worker rispetto al segreto web."
"PHP runtime comparison": "Confronto runtime PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Entrambi i runtime devono supportare PHP 8.4; versioni patch differenti richiedono una verifica."
"Required extension comparison": "Confronto estensioni richieste"
"Required extension availability is checked; differing versions require review.": "Viene verificata la disponibilità delle estensioni richieste; versioni differenti richiedono una verifica."
"Process identity comparison": "Confronto identità di processo"
"Effective process identity is unavailable on this platform.": "L'identità effettiva del processo non è disponibile su questa piattaforma."
"Effective process identities match.": "Le identità effettive dei processi corrispondono."
"Effective process identities differ; separate service accounts may be intentional.": "Le identità effettive dei processi differiscono; account di servizio separati potrebbero essere intenzionali."
"Directory access comparison": "Confronto accesso alle directory"
"Read-only directory permission observations match.": "Le osservazioni di sola lettura sui permessi delle directory corrispondono."
"Directory locations or permission observations differ; review the service-account roles.": "I percorsi delle directory o le osservazioni sui permessi differiscono; verifica i ruoli dell'account di servizio."
"Worker directory read and traversal": "Lettura e attraversamento delle directory del worker"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Le directory richieste del worker devono esistere e consentire lettura e attraversamento. Non sono state testate scritture."
"The inherited worker secret matches the web secret for this private challenge.": "Il segreto ereditato del worker corrisponde al segreto web per questa verifica privata."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Esamina l'interprete PHP configurato, le estensioni richieste, il segreto ereditato e i permessi delle directory dell'account di servizio. Non sono state eseguite scritture né avvii dell'installer."
"advisory": "informativo"
