"Action": "Azione"
"Advanced options": "Opzioni avanzate"
"Applying database upgrades": "Applicazione degli aggiornamenti del database"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Esegui il backup del database, dei file RRD, della configurazione e delle chiavi. Gli aggiornamenti del database possono applicare modifiche che il rollback dell'applicazione non può annullare."
"Blocked": "Bloccato"
"Check": "Controllo"
"Check again": "Controlla di nuovo"
"Check collection freshness and collector connectivity before enabling discovery.": "Verifica l'aggiornamento della raccolta e la connettività dei collettori prima di abilitare il rilevamento."
"Check requirements": "Verifica requisiti"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "I controlli verificano questo processo e i permessi del filesystem. Non scrivono file di test né contattano i dispositivi."
