"Remove devices": "حذف دستگاه‌ها"
"Remove selected devices": "حذف دستگاه‌های انتخاب‌شده"
"Selected devices removed.": "دستگاه‌های انتخاب‌شده حذف شدند."
"Confirm removal": "تأیید حذف"
"Graphs and data sources": "نمودارها و منابع داده"
"Retain graphs and disable data sources": "حفظ نمودارها و غیرفعال کردن منابع داده"
"Remove graphs and data sources": "حذف نمودارها و منابع داده"
"Select a removal policy.": "یک سیاست حذف انتخاب کنید."
"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "دستگاه‌های انتخاب‌شده یا نمودارها و منابع داده آن‌ها تغییر کرده‌اند. پیش از حذف دستگاه‌ها، تأییدیه را دوباره بارگذاری کنید."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "منابع داده مشترک یا نمودارهای تجمیعی باید پیش از حذف نمودارها و منابع داده جدا شوند."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "نتیجه حذف دستگاه نامشخص است. پیش از تلاش مجدد، دستگاه‌ها، نمودارها و منابع داده انتخاب‌شده را بررسی کنید."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "حذف دستگاه از اینجا قابل بازگشت نیست. انتخاب کنید که نمودارها و منابع داده غیرفعال حفظ شوند یا حذف گردند."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "منابع داده مشترک و نمودارهای تجمیعی باید پیش از حذف نمودار جدا شوند. نمودارها و منابع داده حفظ‌شده به‌صورت تخصیص‌نیافته درمی‌آیند."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "گردآورنده‌های راه‌دورِ متأثر باید آنلاین باشند. حذف ناموفق ممکن است تغییرات راه‌دور یا افزونه را باقی بگذارد؛ پیش از تلاش مجدد، نتیجه را بررسی کنید."
"RRD file cleanup follows the configured maintenance policy.": "پاک‌سازی فایل RRD از سیاست نگهداری پیکربندی‌شده پیروی می‌کند."
"%graphs% graphs, %sources% data sources": "%graphs% نمودار، %sources% منبع داده"
"Device template updated.": "الگوی دستگاه به‌روزرسانی شد."
"Clear device statistics": "پاک کردن آمار دستگاه"
"Confirm clearing statistics": "تأیید پاک کردن آمار"
"Selected device statistics cleared.": "آمار دستگاه‌های انتخاب‌شده پاک شدند."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "بازنشانی زمان‌های پاسخ، شمارش‌های پولینگ و دسترس‌پذیری برای این دستگاه‌ها. نمودارها، داده‌های تاریخی و تنظیمات دستگاه حفظ می‌شوند. آمار از پولینگ بعدی از سر گرفته می‌شود."
"Synchronize device templates": "همگام‌سازی الگوهای دستگاه"
"Confirm synchronization": "تأیید همگام‌سازی"
"Selected device templates synchronized.": "الگوهای دستگاه‌های انتخاب‌شده همگام‌سازی شدند."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "الگوهای تخصیص‌یافته فعلی را روی این دستگاه‌ها اعمال کنید. پیوستگی‌های جاافتاده نمودار و پرس‌وجوی داده افزوده می‌شوند و پیوستگی‌های استفاده‌نشده الگوی نمودار ممکن است حذف شوند. دستگاه‌های بدون الگو نادیده گرفته می‌شوند. نمودارهای موجود و داده‌های تاریخی حفظ می‌شوند؛ خودکارسازی ممکن است نمودارهای جدید بسازد."
"Change device options": "تغییر گزینه‌های دستگاه"
"Confirm option changes": "تأیید تغییرات گزینه"
"Selected device options updated.": "گزینه‌های دستگاه‌های انتخاب‌شده به‌روزرسانی شدند."
"Device options": "گزینه‌های دستگاه"
"Update this field": "به‌روزرسانی این فیلد"
"Select at least one supported device option.": "حداقل یک گزینه دستگاه پشتیبانی‌شده انتخاب کنید."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "فقط گزینه‌های انتخاب‌شده تغییر می‌کنند. گزینه‌های انتخاب‌نشده مقادیر فعلی خود را حفظ می‌کنند. انتخاب یک مکان خالی، آن را پاک می‌کند."
"Update %option%": "به‌روزرسانی %option%"
"Assignment target": "هدف تخصیص"
