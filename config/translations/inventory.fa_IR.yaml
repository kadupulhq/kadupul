"Confirm SNMP changes": "تأیید تغییرات SNMP"
"Selected device SNMP settings updated.": "تنظیمات SNMP دستگاه‌های انتخاب‌شده به‌روزرسانی شدند."
"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "این تنظیمات SNMP را روی تمام دستگاه‌های انتخاب‌شده اعمال کنید. اعتبارنامه‌های ذخیره‌شده هر دستگاه را نگه دارید یا به‌طور صریح جایگزین کنید. مقادیر محرمانه ذخیره‌شده هرگز نمایش داده نمی‌شوند."
"Device graph-template associations": "پیوستگی‌های الگوی نمودار دستگاه"
"Device associations updated.": "پیوستگی‌های دستگاه به‌روزرسانی شدند."
