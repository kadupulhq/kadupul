"Selected device assignments updated.": "تخصیص‌های دستگاه‌های انتخاب‌شده به‌روزرسانی شدند."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "تخصیص انتخاب‌شده روی هر دستگاه فهرست‌شده اعمال می‌شود. تغییرات الگو، نمودارهای موجود را حفظ می‌کنند؛ خودکارسازی ممکن است نمودارهای جدید بسازد. تغییرات گردآورنده، مالکیت پولینگ را منتقل می‌کنند."
