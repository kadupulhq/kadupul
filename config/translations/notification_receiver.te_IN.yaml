"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "నిల్వ చేసిన ఆధారాలు ఎప్పుడూ ప్రదర్శించబడవు. వాటిని భర్తీ చేయడం వలన మొత్తం నాలుగు ఆధార ఫీల్డ్‌లు సెట్ చేయబడతాయి; SNMP వెర్షన్ 3ని వదిలివేయడం వలన దాని వినియోగదారు పేరు మరియు పాస్‌ఫ్రేజ్‌లు తుడిచివేయబడతాయి."
