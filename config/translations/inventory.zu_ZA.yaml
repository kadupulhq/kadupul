"Selected device assignments updated.": "Izabelo zedivayisi ezikhethiwe zibuyekeziwe."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Isabelo esikhethiwe sisetshenziswa kuyo yonke idivayisi esohlwini. Ushintsho lwesifanekiso lugcina amagrafu akhona; ukuzenzakalela kungadala amagrafu amasha. Ushintsho lomqoqi ludlulisela ubunikazi bokuqoqa idatha."
"Change device SNMP settings": "Shintsha izilungiselelo ze-SNMP zedivayisi"
"Confirm SNMP changes": "Qinisekisa izinguquko ze-SNMP"
"Selected device SNMP settings updated.": "Izilungiselelo ze-SNMP zedivayisi ezikhethiwe zibuyekeziwe."
"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "Sebenzisa lezi zilungiselelo ze-SNMP kudivayisi ngayinye ekhethiwe. Gcina imininingwane yokungena egciniwe yedivayisi ngayinye noma uyishintshe ngokusobala. Izimfihlo ezigciniwe aziboniswa nakanye."
"Device graph-template associations": "Ukuhlangana kwesifanekiso segrafu sedivayisi"
"Device associations updated.": "Ukuhlangana kwedivayisi kubuyekeziwe."
"Removing an association retains existing graphs and historical data. Adding an association may create graphs through automation. Affected collectors must be online.": "Ukukhipha ukuhlanganiswa kugcina amagrafu akhona nedatha yomlando. Ukwengeza ukuhlanganiswa kungadala amagrafu ngokuzenzakalela. Abaqoqi abathintekile kufanele babe ku-inthanethi."
