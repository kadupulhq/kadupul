"Action": "פעולה"
"Advanced options": "אפשרויות מתקדמות"
"Applying database upgrades": "מחיל שדרוגי מסד נתונים"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "גבה את מסד הנתונים, קובצי RRD, ההגדרות והמפתחות. שדרוגי מסד נתונים עשויים לבצע שינויים ששחזור יישום לא יוכל לבטל."
"Blocked": "חסום"
"Check": "בדוק"
"Check again": "בדוק שוב"
"Check collection freshness and collector connectivity before enabling discovery.": "בדוק את עדכניות האיסוף ואת הקישוריות של אוסף הנתונים לפני הפעלת הגילוי."
"Check requirements": "בדוק דרישות"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "הבדיקות בוחנות תהליך זה והרשאות מערכת קבצים. הן אינן כותבות קובצי בדיקה ואינן יוצרות קשר עם התקנים."
"Collection profile": "פרופיל איסוף"
"Collector": "אוסף נתונים"
"Configure": "הגדר"
"Configuring collection profiles": "הגדרת פרופילי איסוף"
"Configuring discovery": "הגדרת גילוי"
"Configuring the local device": "הגדרת ההתקן המקומי"
"Confirming database version": "מאמת גרסת מסד נתונים"
"Converting selected tables": "ממיר טבלאות נבחרות"
"Database version": "גרסת מסד נתונים"
"Disabled": "Disabled"
"Discovery": "גילוי"
"Discovery SNMP settings": "הגדרות SNMP לגילוי"
"Discovery range": "טווח גילוי"
"Enable discovery after installation": "הפעל גילוי לאחר ההתקנה"
"Executable paths": "נתיבי קובצי הרצה"
"Execution status": "מצב ביצוע"
"Finished execution": "הביצוע הסתיים"
"Finishing tasks only. Schema migrations will not be replayed.": "משימות סיום בלבד. הגירות סכמה לא יופעלו מחדש."
"I accept the license terms": "אני מקבל את תנאי הרישיון"
"I authorize discovery of the displayed range": "אני מאשר גילוי של הטווח המוצג"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "בדקתי את היומן ווידאתי שתהליך העבודה הקודם ותהליכי הבן שלו נעצרו"
"I checked the previous attempt and accept that some changes may already be committed": "בדקתי את הניסיון הקודם ואני מאשר שחלק מהשינויים עשויים להיות כבר מוטמעים"
"I reviewed this plan and have the required backups": "סקרתי תוכנית זו ויש בידי את הגיבויים הנדרשים"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "אם תהליך עבודה נעצר באופן בלתי צפוי, שמור את log/cacti.log וודא שהתהליך שלו הסתיים לפני ניסיון חוזר מפורש. מצב המתנה אינו מאשר הפעלה מוצלחת."
"Importing templates": "מייבא תבניות"
"Install Kadupul": "התקן את Kadupul"
"Installation and upgrade": "התקנה ושדרוג"
"Installation request was rejected.": "בקשת ההתקנה נדחתה."
"Installation steps": "שלבי התקנה"
"Installed": "מותקן"
"Keep a backup of the database, RRD files, configuration and secret material.": "שמור גיבוי של מסד הנתונים, קובצי RRD, ההגדרות וחומר המפתחות."
"Language": "שפה"
"Large tables may require the dedicated CLI conversion tool before installation.": "טבלאות גדולות עשויות לדרוש את כלי ההמרה הייעודי ב-CLI לפני ההתקנה."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "השאר שדות סוד ריקים כדי לשמור על פרטי ההזדהות השמורים. סודות אינם מוצגים שוב לעולם."
"License": "רישיון"
"No action needed": "אין צורך בפעולה"
"Observed": "נצפה"
"Open the console": "פתח את המסוף"
"Operation": "פעולה"
"Override discovery SNMP settings": "דרוס הגדרות SNMP לגילוי"
"Pass": "עבר"
"Poller interval in seconds": "מרווח דוגם בשניות"
"Preparing CSRF protection": "מכין הגנת CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "ההתקדמות מציגה את השלב המתועד האחרון. רענון דף זה לעולם אינו מפעיל או מנסה מחדש תהליך עבודה."
"Recover stopped attempt": "שחזר ניסיון שנעצר"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "השחזור שומר על הבחירות השמורות ואינו מפסיק לעולם תהליך עבודה פעיל. סקור את התוכנית שוב לפני שתנסה מחדש."
"Review": "סקירה"
"Review installation plan": "סקור תוכנית התקנה"
"Run": "הרץ"
"Run reviewed plan": "הרץ תוכנית שנסקרה"
"Save and review": "שמור וסקור"
"Scope": "היקף"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "המצב אינו זמין. העבודה השמורה נשמרת. רענן כדי להתחבר מחדש; אל תשלח התקנה נוספת."
"Synchronizing collectors": "מסנכרן אוספי נתונים"
"Table conversions": "המרות טבלאות"
"Templates": "תבניות"
"The database version matches this application. Installation does not establish that polling is healthy.": "גרסת מסד הנתונים תואמת ליישום זה. ההתקנה אינה מוכיחה שהדגימה תקינה."
"The request outcome is unknown. Check execution status before retrying.": "תוצאת הבקשה אינה ידועה. בדוק את מצב הביצוע לפני שתנסה שוב."
"Theme": "תבנית"
"Verify": "אמת"
"Verify the poller schedule and service account.": "אמת את לוח הזמנים של הדוגם ואת חשבון השירות."
"Version change": "שינוי גרסה"
"Waiting for the installation worker": "ממתין לתהליך העבודה של ההתקנה"
"collector": "אוסף נתונים"
"complete": "הושלם"
"failed": "נכשל"
"finish": "סיום"
"install": "התקן"
"not_started": "לא התחיל"
"partial": "חלקי"
"running": "רץ"
"succeeded": "הצליח"
"upgrade": "שדרג"
"waiting": "ממתין"
"Accept the license before saving the installation plan.": "אשר את הרישיון לפני שמירת תוכנית ההתקנה."
"Invalid installation form.": "טופס התקנה לא חוקי."
"Access denied.": "הגישה נדחתה."
"Confirm the recovery warning before retrying.": "אשר את אזהרת השחזור לפני שתנסה שוב."
"Review and confirm the current installation plan.": "סקור ואשר את תוכנית ההתקנה הנוכחית."
"Confirm the discovery scope before starting.": "אשר את היקף הגילוי לפני ההתחלה."
"Resolve the blocking checks before starting.": "פתור את הבדיקות החוסמות לפני ההתחלה."
"Too many installer options.": "יותר מדי אפשרויות מתקין."
"Invalid installer option name.": "שם אפשרות מתקין לא חוקי."
"Unknown or malformed installer option.": "אפשרות מתקין לא ידועה או פגומה."
"Installer options must be scalar values.": "אפשרויות המתקין חייבות להיות ערכים סקלריים."
"Installer option is too long or contains a null byte.": "אפשרות המתקין ארוכה מדי או מכילה תו null."
"Installer IDs and intervals must be whole numbers.": "מזהי מתקין ומרווחים חייבים להיות מספרים שלמים."
"Installer ID or interval is outside its supported range.": "מזהה המתקין או המרווח נמצא מחוץ לטווח הנתמך שלו."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ההתקנה לא יכלה להמשיך. טען מחדש את מצבה וסקור את הבדיקות החוסמות לפני שתנסה שוב."
"Confirm that the previous worker has stopped before recovering its plan.": "ודא שתהליך העבודה הקודם נעצר לפני שחזור התוכנית שלו."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "מסד הנתונים מותקן, אך חלק מאוספי הנתונים עדיין זקוקים לסנכרון. נסה שוב את משימות הסיום לאחר בדיקת מצבם."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ההתקנה נעצרה. שמור את יומן המתקין, תקן את הגורם ואשר במפורש ניסיון חוזר. ייתכן שחלק מהשינויים במסד הנתונים כבר בוצעו. בדוק ניקוי תוספים לפני אישור ניסיון חוזר."
"Next action": "הפעולה הבאה"
"Follow the execution status. Do not start another attempt while a worker is active.": "עקוב אחר מצב הביצוע. אל תתחיל ניסיון נוסף בזמן שתהליך עבודה פעיל."
"Complete the recovery checklist before retrying.": "השלם את רשימת הבדיקה לשחזור לפני שתנסה שוב."
"Verify collection and graph operation before enabling discovery.": "אמת את תקינות האיסוף והגרפים לפני הפעלת הגילוי."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "פתור את הדרישות החסומות ולאחר מכן בדוק שוב. הבחירות השמורות נשמרות."
"Review the planned changes and backup checklist before authorizing execution.": "סקור את השינויים המתוכננים ורשימת הבדיקה לגיבוי לפני אישור הביצוע."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "בחר פרופיל איסוף ואשר את הרישיון. ניתן לפתוח הגדרות אופציונליות בעת הצורך."
"Download installation diagnostics": "הורד נתוני אבחון התקנה"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "פתח גרף וודא שנתוני ה-RRD שלו מתעדכנים לאחר מחזור דוגם."
"Requirement details": "פרטי דרישה"
"Recover": "שחזר"
"Recovery checklist": "רשימת בדיקה לשחזור"
"Preserve log/cacti.log and record the failed attempt.": "שמור את log/cacti.log ותעד את הניסיון שנכשל."
"Confirm that the previous worker and its child processes have stopped.": "ודא שתהליך העבודה הקודם ותהליכי הבן שלו נעצרו."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "בדוק שינויים שבוצעו, סנכרון אוספי נתונים וניקוי תוספים. תקן את הגורם לפני שתנסה שוב."
"Review the saved plan again, then explicitly authorize a retry.": "סקור שוב את התוכנית השמורה ולאחר מכן אשר במפורש ניסיון חוזר."
"Recover a stopped worker": "שחזר תהליך עבודה שנעצר"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "השתמש בשחזור רק לאחר וידוא שניסיון זה אינו רץ עוד. השחזור אינו עוצר תהליך."
"Collector and installation mode": "אוסף נתונים ומצב התקנה"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "תצורת הפריסה קובעת את תפקיד אוסף הנתונים ואת חיבורי מסד הנתונים. אמת את תצורת השרת הראשי לפני הפעלת אוסף נתונים."
"Discovery and SNMP settings": "הגדרות גילוי ו-SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "השאר את הגילוי מושבת עד שהאיסוף והקישוריות לאוסף הנתונים יאומתו."
"Template selection": "בחירת תבנית"
"Templates selected for import": "תבניות שנבחרו לייבוא"
"No templates selected.": "לא נבחרו תבניות."
"Backup checklist": "רשימת בדיקה לגיבוי"
"Database backup and a tested restoration procedure.": "גיבוי מסד נתונים ונוהל שחזור שנבדק."
"RRD files and the service account permissions needed to restore them.": "קובצי RRD והרשאות חשבון השירות הנדרשות לשחזורם."
"Configuration, keys and plugin data outside the database.": "תצורה, מפתחות ונתוני תוספים מחוץ למסד הנתונים."
"Post-installation checks": "בדיקות לאחר התקנה"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "בדיקות מאומתות מכסות רק את הראיות המוצגות. בדיקות שלא הוערכו עדיין דורשות אימות מפעיל."
"Operational checks still require operator verification.": "בדיקות תפעוליות עדיין דורשות אימות מפעיל."
"Status": "סטטוס"
"verified": "מאומת"
"action_required": "נדרשת פעולה"
"not_assessed": "לא הוערך"
"Database schema": "סכמת מסד נתונים"
"Stored schema matches the application target.": "הסכמה השמורה תואמת ליעד היישום."
"Target schema completion has not been confirmed.": "השלמת סכמת היעד טרם אושרה."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "סקור את תוצאת ההתקנה ופתור כשלים לפני שתתייחס לשדרוג הסכמה כהושלם."
"Installation outcome": "תוצאת ההתקנה"
"A successful receipt matches the current target schema.": "אישור קבלה תקין תואם לסכמת היעד הנוכחית."
"A complete successful installation outcome has not been confirmed.": "תוצאת התקנה מלאה ומוצלחת טרם אושרה."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "שמור את יומן המתקין והשתמש בנוהל השחזור או הניסיון החוזר המפורש בעת הצורך."
"Collector synchronization": "סנכרון אוספי נתונים"
"The completed installer reports pending collector synchronization.": "המתקין שהושלם מדווח על סנכרון אוספי נתונים ממתין."
"The completed installer reports no pending collectors.": "המתקין שהושלם אינו מדווח על אוספי נתונים ממתינים."
"Collector completion remains unconfirmed by this partial receipt.": "השלמת אוסף הנתונים נותרת בלתי מאושרת על ידי אישור קבלה חלקי זה."
"Collector completion is not established by this installation outcome.": "השלמת אוסף הנתונים אינה מוכחת על ידי תוצאת התקנה זו."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "סקור את מצב אוספי הנתונים ונסה שוב משימות סיום עבור תוצאות חלקיות. פעולה זו אינה מאמתת עדכניות איסוף מאוחרת יותר."
"Scheduled collection": "איסוף מתוזמן"
"No poller or device was contacted by this assessment.": "הערכה זו לא יצרה קשר עם אף דוגם או התקן."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "ודא שהמתזמן המוגדר מריץ את הדוגם תחת חשבון השירות המיועד ובדוק את המחזור הרגיל הבא שלו."
"Graph data": "נתוני גרף"
"Live samples and RRD updates were not exercised.": "דגימות חיות ועדכוני RRD לא תורגלו."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "לאחר מחזור איסוף רגיל, ודא שהגרפים הצפויים מקבלים דגימות עדכניות ובדוק שגיאות דוגם."
"Recovery readiness": "מוכנות לשחזור"
"Backup restoration was not exercised.": "שחזור הגיבוי לא תורגל."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "אמת שחזור מבודד של מסד הנתונים, קובצי RRD, התצורה וחומר המפתחות לפני הסתמכות על שחזור."
"No persisted local poller start has been recorded.": "לא נרשמה הפעלה מתועדת של דוגם מקומי."
"Persisted poller timing is invalid and cannot establish scheduler health.": "תזמון הדוגם המתועד אינו חוקי ואינו יכול להעיד על תקינות המתזמן."
"The recorded poller start is in the future. Check clock synchronization.": "התחלת הדוגם המתועדת היא בעתיד. בדוק את סנכרון השעון."
"The recorded poller start is older than the native scheduling tolerance.": "התחלת הדוגם המתועדת ישנה יותר מטווח הסבילות של התזמון המובנה."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "הפעלת דוגם מקומי נרשמה בתוך טווח הסבילות של התזמון המובנה. ההשלמה ותקינות ההתקן לא אומתו."
"readable": "קריא"
"missing or unreadable": "חסר או לא קריא"
"Restore the complete release and its locked dependencies; grant the service account read access.": "שחזר את הגרסה המלאה ואת התלויות הנעולות שלה; הענק לחשבון השירות הרשאת קריאה."
"PHP temporary directory": "תיקייה זמנית של PHP"
"directory writable by this process": "תיקייה ניתנת לכתיבה על ידי תהליך זה"
"missing or not writable": "חסר או לא ניתן לכתיבה"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "הגדר את sys_temp_dir כתיקייה קיימת הניתנת לכתיבה על ידי חשבון ההתקנה. ייבוא מובנה משתמש בקבצים זמניים."
"Background worker launch": "הפעלת תהליך רקע"
"required PHP functions available; launch not exercised": "פונקציות PHP נדרשות זמינות; ההפעלה לא תורגלה"
"required PHP launch function disabled": "פונקציית הפעלת PHP נדרשת מושבתת"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "הפעל את exec עבור סביבת הריצה של PHP באינטרנט, או השתמש במתקין ה-CLI המורשה."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "הפעל את popen, pclose עבור סביבת הריצה של PHP באינטרנט, או השתמש במתקין ה-CLI המורשה."
"Database transaction ownership": "בעלות על טרנזקציית מסד נתונים"
"autocommit enabled; no caller-owned transaction": "autocommit מופעל; אין טרנזקציה בבעלות הקורא"
"autocommit disabled or caller transaction active": "autocommit מושבת או שטרנזקציית קורא פעילה"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "הרץ התקנה מחוץ לטרנזקציה בבעלות הקורא והפעל autocommit בחיבור השינוי שלה."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "שחזר את תיקיית הגרסה והענק לחשבון ההתקנה הרשאת כתיבה עבור ייבוא משאבי תבנית. אל תהפוך אותה לניתנת לכתיבה לכל העולם."
"Worker file: install/background.php": "קובץ תהליך עבודה: install/background.php"
"Worker file: bin/legacy-installer.php": "קובץ תהליך עבודה: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "קובץ תהליך עבודה: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "יעד ייבוא: resource/snmp_queries"
"Import destination: resource/script_server": "יעד ייבוא: resource/script_server"
"Import destination: resource/script_queries": "יעד ייבוא: resource/script_queries"
"Import destination: scripts": "יעד ייבוא: scripts"
"Database privileges": "הרשאות מסד נתונים"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "הרשאות ההגירה בפועל, כולל תפקידים פעילים והרשאות ייעודיות לאובייקטים, לא אומתו."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "בקש ממנהל מסד הנתונים לאמת כתיבות נדרשות לטבלאות, שינויי סכמה, טריגרים ושגרות עבור חשבון ההתקנה והסכמה. אל תעניק הרשאות מנהל גלובליות."
"Compare web and worker runtimes": "השווה סביבות ריצה של אינטרנט ותהליך עבודה"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "פעולה זו מפעילה במפורש גישוש PHP קצר לקריאה בלבד. היא אינה משריינת מתקין, אינה כותבת קבצים ואינה יוצרת קשר עם התקנים."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "הגישוש יורש תהליך אינטרנט זה ומשתמש במפרש ה-PHP המוגדר למתקין. הוא אינו בודק מתזמן או שירות נפרדים."
"I authorize the read-only worker runtime comparison.": "אני מאשר את השוואת סביבת הריצה לקריאה בלבד של תהליך העבודה."
"Compare runtimes": "השווה סביבות ריצה"
"Runtime comparison results": "תוצאות השוואת סביבות ריצה"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "הבדלי הרשאות וזהויות עשויים להיות מכוונים. תצפיות לקריאה בלבד אינן מוכיחות שכתיבה או התקנה יצליחו."
"Confirm the read-only worker runtime comparison.": "אשר את השוואת סביבת הריצה לקריאה בלבד של תהליך העבודה."
"The runtime comparison is unavailable.": "השוואת סביבות הריצה אינה זמינה."
"Shared application secret": "סוד יישום משותף"
"A strong web application secret is required before comparison.": "נדרש סוד יישום אינטרנט חזק לפני ההשוואה."
"Runtime comparison": "השוואת סביבות ריצה"
"The configured worker runtime did not confirm a bounded comparison.": "סביבת הריצה המוגדרת של תהליך העבודה לא אישרה השוואה תחומה."
"The inherited worker secret could not be confirmed against the web secret.": "לא ניתן היה לאמת את הסוד המורש של תהליך העבודה מול סוד האינטרנט."
"PHP runtime comparison": "השוואת סביבות ריצה של PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "שתי סביבות הריצה חייבות לתמוך ב-PHP 8.4; הבדלים בגרסאות תיקון דורשים בדיקה."
"Required extension comparison": "השוואת הרחבות נדרשות"
"Required extension availability is checked; differing versions require review.": "זמינות הרחבות נדרשות נבדקת; גרסאות שונות דורשות בדיקה."
"Process identity comparison": "השוואת זהות תהליך"
"Effective process identity is unavailable on this platform.": "זהות התהליך בפועל אינה זמינה בפלטפורמה זו."
"Effective process identities match.": "זהויות התהליך בפועל תואמות."
"Effective process identities differ; separate service accounts may be intentional.": "זהויות התהליך בפועל שונות; חשבונות שירות נפרדים עשויים להיות מכוונים."
"Directory access comparison": "השוואת גישה לתיקיות"
"Read-only directory permission observations match.": "תצפיות הרשאות התיקייה לקריאה בלבד תואמות."
"Directory locations or permission observations differ; review the service-account roles.": "מיקומי תיקיות או תצפיות הרשאות שונים; בדוק את תפקידי חשבון השירות."
"Worker directory read and traversal": "קריאה ומעבר בתיקיית תהליך העבודה"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "תיקיות תהליך העבודה הנדרשות חייבות להיות קיימות ולאפשר קריאה ומעבר. לא נבדקו פעולות כתיבה."
"The inherited worker secret matches the web secret for this private challenge.": "הסוד המורש של תהליך העבודה תואם לסוד האינטרנט עבור אתגר פרטי זה."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "סקור את מפרש ה-PHP המוגדר, ההרחבות הנדרשות, הסוד המורש והרשאות התיקיות של חשבון השירות. לא תורגלו פעולות כתיבה או הפעלת מתקין."
"advisory": "ייעוץ"
