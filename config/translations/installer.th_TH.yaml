"required PHP functions available; launch not exercised": "ฟังก์ชัน PHP ที่จำเป็นพร้อมใช้งาน ยังไม่ได้ทดสอบการเปิดใช้งาน"
"required PHP launch function disabled": "ฟังก์ชันเปิดใช้งาน PHP ที่จำเป็นถูกปิดใช้งานอยู่"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "เปิดใช้งาน exec สำหรับรันไทม์ PHP ของเว็บ หรือใช้ตัวติดตั้ง CLI ที่ได้รับอนุญาต"
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "เปิดใช้งาน popen, pclose สำหรับรันไทม์ PHP ของเว็บ หรือใช้ตัวติดตั้ง CLI ที่ได้รับอนุญาต"
"Database transaction ownership": "ความเป็นเจ้าของธุรกรรมฐานข้อมูล"
"autocommit enabled; no caller-owned transaction": "เปิดใช้งาน autocommit แล้ว ไม่มีธุรกรรมที่เป็นของผู้เรียก"
"autocommit disabled or caller transaction active": "ปิดใช้งาน autocommit อยู่ หรือมีธุรกรรมของผู้เรียกทำงานอยู่"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "รันการติดตั้งนอกธุรกรรมที่เป็นของผู้เรียก และเปิดใช้งาน autocommit บนการเชื่อมต่อสำหรับแก้ไขข้อมูล"
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "กู้คืนไดเรกทอรีรีลีสและให้สิทธิ์การเขียนแก่บัญชีติดตั้งสำหรับการนำเข้าทรัพยากรเทมเพลต อย่าตั้งสิทธิ์ให้ทุกคนเขียนได้ (world-writable)"
