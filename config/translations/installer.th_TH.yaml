"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "การติดตั้งไม่สามารถดำเนินการต่อได้ โปรดโหลดสถานะใหม่และตรวจสอบรายการตรวจที่บล็อกอยู่ก่อนลองอีกครั้ง"
