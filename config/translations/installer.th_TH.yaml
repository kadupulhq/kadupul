"Database backup and a tested restoration procedure.": "การสำรองข้อมูลฐานข้อมูลและขั้นตอนการกู้คืนที่ผ่านการทดสอบแล้ว"
"RRD files and the service account permissions needed to restore them.": "ไฟล์ RRD และสิทธิ์บัญชีบริการที่จำเป็นในการกู้คืนไฟล์เหล่านั้น"
"Configuration, keys and plugin data outside the database.": "การกำหนดค่า คีย์ และข้อมูลปลั๊กอินที่อยู่นอกฐานข้อมูล"
