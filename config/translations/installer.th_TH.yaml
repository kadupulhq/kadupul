"Collector and installation mode": "ตัวรวบรวมข้อมูลและโหมดการติดตั้ง"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "การกำหนดค่าการปรับใช้จะเป็นตัวกำหนดบทบาทของตัวรวบรวมข้อมูลและการเชื่อมต่อฐานข้อมูล โปรดตรวจสอบการกำหนดค่าเซิร์ฟเวอร์หลักก่อนเริ่มต้นตัวรวบรวมข้อมูล"
"Discovery and SNMP settings": "การตั้งค่าการค้นหาอุปกรณ์และ SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "ปิดการค้นหาอุปกรณ์ไว้จนกว่าจะได้ตรวจสอบการรวบรวมข้อมูลและการเชื่อมต่อของตัวรวบรวมข้อมูลแล้ว"
"Template selection": "การเลือกเทมเพลต"
"Templates selected for import": "เทมเพลตที่เลือกสำหรับการนำเข้า"
"No templates selected.": "ไม่ได้เลือกเทมเพลต"
