"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ติดตั้งฐานข้อมูลแล้ว แต่ตัวรวบรวมข้อมูลบางตัวยังต้องซิงโครไนซ์ โปรดลองทำงานขั้นสุดท้ายอีกครั้งหลังจากตรวจสอบสถานะของตัวรวบรวมข้อมูลเหล่านั้น"
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "การติดตั้งหยุดชะงัก โปรดเก็บรักษาบันทึกของตัวติดตั้ง แก้ไขสาเหตุ และยืนยันการลองใหม่อีกครั้งอย่างชัดเจน การเปลี่ยนแปลงฐานข้อมูลบางส่วนอาจถูกยืนยันไปแล้ว โปรดตรวจสอบการล้างข้อมูลปลั๊กอินก่อนอนุญาตให้ลองใหม่"
"Next action": "การดำเนินการถัดไป"
"Follow the execution status. Do not start another attempt while a worker is active.": "ติดตามสถานะการทำงาน อย่าเริ่มการดำเนินการใหม่ในขณะที่เวิร์กเกอร์กำลังทำงานอยู่"
"Complete the recovery checklist before retrying.": "ดำเนินการตามรายการตรวจสอบการกู้คืนให้ครบถ้วนก่อนลองอีกครั้ง"
"Verify collection and graph operation before enabling discovery.": "ตรวจสอบยืนยันการทำงานของการรวบรวมข้อมูลและกราฟก่อนเปิดใช้งานการค้นหาอุปกรณ์"
"Resolve the blocked requirements, then check again. Saved selections are retained.": "แก้ไขข้อกำหนดที่ถูกบล็อก แล้วตรวจสอบอีกครั้ง การเลือกที่บันทึกไว้จะยังคงอยู่"
"Review the planned changes and backup checklist before authorizing execution.": "ตรวจสอบการเปลี่ยนแปลงที่วางแผนไว้และรายการตรวจสอบการสำรองข้อมูลก่อนอนุญาตให้ดำเนินการ"
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "เลือกโปรไฟล์การรวบรวมข้อมูลและยอมรับสัญญาอนุญาต สามารถเปิดการตั้งค่าเพิ่มเติมได้เมื่อต้องการ"
"Download installation diagnostics": "ดาวน์โหลดข้อมูลการวินิจฉัยการติดตั้ง"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "เปิดกราฟและตรวจสอบว่าข้อมูล RRD อัปเดตหลังจากรอบการทำงานของ Poller"
"Requirement details": "รายละเอียดข้อกำหนด"
"Recover": "กู้คืน"
"Recovery checklist": "รายการตรวจสอบการกู้คืน"
"Preserve log/cacti.log and record the failed attempt.": "เก็บรักษา log/cacti.log และบันทึกความพยายามที่ล้มเหลวไว้"
"Confirm that the previous worker and its child processes have stopped.": "ยืนยันว่าเวิร์กเกอร์ก่อนหน้าและกระบวนการลูกได้หยุดทำงานแล้ว"
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "ตรวจสอบการเปลี่ยนแปลงที่ยืนยันแล้ว การซิงโครไนซ์ตัวรวบรวมข้อมูล และการล้างข้อมูลปลั๊กอิน แก้ไขสาเหตุก่อนลองอีกครั้ง"
"Review the saved plan again, then explicitly authorize a retry.": "ตรวจสอบแผนที่บันทึกไว้อีกครั้ง จากนั้นอนุญาตให้ลองใหม่อีกครั้งอย่างชัดเจน"
"Recover a stopped worker": "กู้คืนเวิร์กเกอร์ที่หยุดทำงาน"
