"Import destination: scripts": "ปลายทางการนำเข้า: scripts"
"Database privileges": "สิทธิ์ของฐานข้อมูล"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "สิทธิ์การย้ายข้อมูลที่มีผล รวมถึงบทบาทที่ใช้งานอยู่และสิทธิ์เฉพาะออบเจ็กต์ ยังไม่ได้รับการตรวจสอบ"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ให้ผู้ดูแลระบบฐานข้อมูลตรวจสอบสิทธิ์การเขียนตาราง การเปลี่ยนแปลงสคีมา ทริกเกอร์ และรูทีนที่จำเป็นสำหรับบัญชีติดตั้งและสคีมา อย่าให้สิทธิ์ผู้ดูแลระบบระดับโกลบอล"
"Compare web and worker runtimes": "เปรียบเทียบรันไทม์ของเว็บและเวิร์กเกอร์"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "การดำเนินการนี้เป็นการเริ่มการตรวจสอบ PHP แบบอ่านอย่างเดียวระยะสั้นอย่างชัดเจน โดยจะไม่จองตัวติดตั้ง เขียนไฟล์ หรือติดต่ออุปกรณ์"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "ตัวตรวจสอบนี้สืบทอดมาจากกระบวนการเว็บนี้และใช้ตัวแปล PHP ของตัวติดตั้งที่กำหนดค่าไว้ โดยไม่ได้ตรวจสอบตัวจัดตารางเวลาหรือบริการอื่นที่แยกต่างหาก"
"I authorize the read-only worker runtime comparison.": "ฉันอนุญาตให้เปรียบเทียบรันไทม์ของเวิร์กเกอร์แบบอ่านอย่างเดียว"
"Compare runtimes": "เปรียบเทียบรันไทม์"
"Runtime comparison results": "ผลการเปรียบเทียบรันไทม์"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "ความแตกต่างของสิทธิ์และตัวตนอาจเป็นความตั้งใจ การสังเกตการณ์แบบอ่านอย่างเดียวไม่ได้พิสูจน์ว่าการเขียนหรือการติดตั้งจะสำเร็จ"
"Confirm the read-only worker runtime comparison.": "ยืนยันการเปรียบเทียบรันไทม์ของเวิร์กเกอร์แบบอ่านอย่างเดียว"
"The runtime comparison is unavailable.": "ไม่สามารถเปรียบเทียบรันไทม์ได้"
"Shared application secret": "ข้อมูลลับที่ใช้ร่วมกันของแอปพลิเคชัน"
"A strong web application secret is required before comparison.": "จำเป็นต้องใช้ข้อมูลลับของเว็บแอปพลิเคชันที่มีความปลอดภัยสูงก่อนทำการเปรียบเทียบ"
"Runtime comparison": "การเปรียบเทียบรันไทม์"
"The configured worker runtime did not confirm a bounded comparison.": "รันไทม์เวิร์กเกอร์ที่กำหนดค่าไว้ไม่ได้ยืนยันการเปรียบเทียบที่มีขอบเขตจำกัด"
"The inherited worker secret could not be confirmed against the web secret.": "ไม่สามารถยืนยันข้อมูลลับของเวิร์กเกอร์ที่สืบทอดมากับข้อมูลลับของเว็บได้"
"PHP runtime comparison": "การเปรียบเทียบรันไทม์ PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "รันไทม์ทั้งสองต้องรองรับ PHP 8.4 หากเวอร์ชันแพตช์ต่างกันจำเป็นต้องตรวจสอบ"
"Required extension comparison": "การเปรียบเทียบส่วนขยายที่จำเป็น"
"Required extension availability is checked; differing versions require review.": "ตรวจสอบความพร้อมใช้งานของส่วนขยายที่จำเป็นแล้ว หากเวอร์ชันแตกต่างกันจำเป็นต้องตรวจสอบ"
"Process identity comparison": "การเปรียบเทียบตัวตนของกระบวนการ"
"Effective process identity is unavailable on this platform.": "ตัวตนของกระบวนการที่มีผลไม่สามารถใช้งานได้บนแพลตฟอร์มนี้"
"Effective process identities match.": "ตัวตนของกระบวนการที่มีผลตรงกัน"
"Effective process identities differ; separate service accounts may be intentional.": "ตัวตนของกระบวนการที่มีผลแตกต่างกัน การแยกบัญชีบริการอาจเป็นความตั้งใจ"
"Directory access comparison": "การเปรียบเทียบการเข้าถึงไดเรกทอรี"
"Read-only directory permission observations match.": "ผลการสังเกตสิทธิ์ไดเรกทอรีแบบอ่านอย่างเดียวตรงกัน"
"Directory locations or permission observations differ; review the service-account roles.": "ตำแหน่งไดเรกทอรีหรือผลการสังเกตสิทธิ์แตกต่างกัน โปรดตรวจสอบบทบาทของบัญชีบริการ"
"Worker directory read and traversal": "การอ่านและการเข้าถึงไดเรกทอรีเวิร์กเกอร์"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "ไดเรกทอรีเวิร์กเกอร์ที่จำเป็นต้องมีอยู่จริงและอนุญาตให้การอ่านและการเข้าถึงได้ ไม่ได้ทำการทดสอบการเขียน"
"The inherited worker secret matches the web secret for this private challenge.": "ข้อมูลลับของเวิร์กเกอร์ที่สืบทอดมาตรงกับข้อมูลลับของเว็บสำหรับการท้าทายส่วนตัวนี้"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "ตรวจสอบตัวแปล PHP ที่กำหนดค่าไว้ ส่วนขยายที่จำเป็น ข้อมูลลับที่สืบทอดมา และสิทธิ์ไดเรกทอรีของบัญชีบริการ ไม่ได้ทำการเขียนหรือเริ่มต้นตัวติดตั้ง"
"advisory": "คำแนะนำ"
