"Target schema completion has not been confirmed.": "ยังไม่ได้รับการยืนยันว่าสคีมาเป้าหมายเสร็จสมบูรณ์"
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "ตรวจสอบผลลัพธ์การติดตั้งและแก้ไขความล้มเหลวก่อนถือว่าการอัปเกรดสคีมาเสร็จสมบูรณ์"
"Installation outcome": "ผลลัพธ์การติดตั้ง"
"A successful receipt matches the current target schema.": "ข้อมูลยืนยันผลที่สำเร็จตรงกับสคีมาเป้าหมายปัจจุบัน"
"A complete successful installation outcome has not been confirmed.": "ยังไม่ได้รับการยืนยันผลลัพธ์การติดตั้งที่สมบูรณ์"
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "เก็บรักษาบันทึกของตัวติดตั้งและใช้ขั้นตอนการกู้คืนหรือลองใหม่อย่างชัดเจนเมื่อจำเป็น"
"Collector synchronization": "การซิงโครไนซ์ตัวรวบรวมข้อมูล"
"The completed installer reports pending collector synchronization.": "ตัวติดตั้งที่เสร็จสมบูรณ์รายงานว่ามีการซิงโครไนซ์ตัวรวบรวมข้อมูลที่รอดำเนินการอยู่"
"The completed installer reports no pending collectors.": "ตัวติดตั้งที่เสร็จสมบูรณ์รายงานว่าไม่มีตัวรวบรวมข้อมูลที่รอดำเนินการ"
"Collector completion remains unconfirmed by this partial receipt.": "ข้อมูลยืนยันผลบางส่วนนี้ยังไม่ยืนยันว่าตัวรวบรวมข้อมูลทำงานเสร็จสมบูรณ์"
"Collector completion is not established by this installation outcome.": "ผลลัพธ์การติดตั้งนี้ยังไม่ยืนยันว่าตัวรวบรวมข้อมูลทำงานเสร็จสมบูรณ์"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "ตรวจสอบสถานะตัวรวบรวมข้อมูลและลองทำงานขั้นสุดท้ายใหม่สำหรับผลลัพธ์บางส่วน การดำเนินการนี้ไม่ได้ตรวจสอบความใหม่ของการรวบรวมข้อมูลในภายหลัง"
"Scheduled collection": "การรวบรวมข้อมูลตามตารางเวลา"
"No poller or device was contacted by this assessment.": "การประเมินนี้ไม่ได้ติดต่อกับ Poller หรืออุปกรณ์ใดๆ"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "ยืนยันว่าตัวจัดตารางเวลาที่กำหนดค่าไว้เรียกใช้ Poller ในนามบัญชีบริการที่ตั้งใจไว้ และตรวจสอบรอบการทำงานปกติถัดไป"
"Graph data": "ข้อมูลกราฟ"
"Live samples and RRD updates were not exercised.": "ยังไม่ได้ทดสอบตัวอย่างข้อมูลจริงและการอัปเดต RRD"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "หลังจากรอบการรวบรวมข้อมูลปกติ โปรดตรวจสอบให้แน่ใจว่ากราฟที่คาดไว้ได้รับตัวอย่างข้อมูลใหม่ และตรวจสอบข้อผิดพลาดของ Poller"
"Recovery readiness": "ความพร้อมในการกู้คืน"
"Backup restoration was not exercised.": "ยังไม่ได้ทดสอบการกู้คืนข้อมูลสำรอง"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "ตรวจสอบยืนยันการกู้คืนฐานข้อมูล ไฟล์ RRD การกำหนดค่า และข้อมูลคีย์ในสภาพแวดล้อมที่แยกต่างหากก่อนพึ่งพาการกู้คืนจริง"
"No persisted local poller start has been recorded.": "ไม่มีการบันทึกการเริ่มต้น Poller ในเครื่องไว้"
"Persisted poller timing is invalid and cannot establish scheduler health.": "จังหวะเวลา Poller ที่บันทึกไว้ไม่ถูกต้องและไม่สามารถยืนยันความสมบูรณ์ของตัวจัดตารางเวลาได้"
"The recorded poller start is in the future. Check clock synchronization.": "เวลาเริ่มต้น Poller ที่บันทึกไว้อยู่ในอนาคต โปรดตรวจสอบการซิงโครไนซ์นาฬิกา"
"The recorded poller start is older than the native scheduling tolerance.": "เวลาเริ่มต้น Poller ที่บันทึกไว้เก่ากว่าช่วงความคลาดเคลื่อนของการจัดตารางเวลาปกติ"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "มีการบันทึกการเริ่มต้น Poller ในเครื่องภายในช่วงความคลาดเคลื่อนของการจัดตารางเวลาปกติ ทั้งนี้ยังไม่ได้ตรวจสอบความสมบูรณ์ของการทำงานและสถานะอุปกรณ์"
"readable": "อ่านได้"
"missing or unreadable": "สูญหายหรือไม่สามารถอ่านได้"
