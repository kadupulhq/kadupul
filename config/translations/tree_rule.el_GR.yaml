"A useful name for this Rule.": "Ένα χρήσιμο όνομα για αυτόν τον κανόνα."
"Access denied.": "Άρνηση πρόσβασης."
"Add Tree Rule": "Προσθήκη κανόνα δέντρου"
"Back to Tree Rules": "Επιστροφή στους κανόνες δέντρου"
"Check this box to enable this rule.": "Επιλέξτε αυτό το πλαίσιο για να ενεργοποιήσετε αυτόν τον κανόνα."
"Choose a Tree for the new Tree Items.": "Επιλέξτε ένα δέντρο για τα νέα στοιχεία του δέντρου."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Επιλέξτε μια κεφαλίδα του επιλεγμένου δέντρου για σύνδεση, ή τη ρίζα του. Βεβαιωθείτε ότι εξακολουθεί να υπάρχει όταν εκτελεστεί αυτός ο κανόνας."
"Choose a header of the selected Tree.": "Επιλέξτε μια κεφαλίδα του επιλεγμένου δέντρου."
"Choose a listed Graph Grouping Style.": "Επιλέξτε ένα καταχωρισμένο στυλ ομαδοποίησης γραφημάτων."
"Choose a listed Leaf Item Type.": "Επιλέξτε έναν καταχωρισμένο τύπο στοιχείου φύλλου."
"Choose an existing Tree.": "Επιλέξτε ένα υπάρχον δέντρο."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Επιλέξτε πώς ομαδοποιούνται τα γραφήματα κατά τη σχεδίαση για αυτόν τον συγκεκριμένο κεντρικό υπολογιστή στο δέντρο. Χρησιμοποιείται για φύλλα συσκευών."
"Data Query Index": "Δείκτης ερωτήματος δεδομένων"
"Device": "Συσκευή"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Τα φύλλα συσκευών δεν μπορούν να χρησιμοποιούν κριτήρια σε στήλες γραφημάτων ή προτύπων γραφημάτων. Κατά την αλλαγή του τύπου στοιχείου φύλλου σε Συσκευή, επιλέξτε αυτό το πλαίσιο για να αφαιρέσετε αυτά τα κριτήρια· δεν μπορούν να ανακτηθούν."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Τα φύλλα συσκευών δεν μπορούν να χρησιμοποιούν κριτήρια βάσει γραφημάτων. Επιβεβαιώστε την αφαίρεση %count% κριτηρίων για αποθήκευση."
"Edit Tree Rule": "Επεξεργασία κανόνα δέντρου"
"Enable Rule": "Ενεργοποίηση κανόνα"
"Enter a name.": "Εισαγάγετε ένα όνομα."
"Enter at most %count% characters.": "Εισαγάγετε το πολύ %count% χαρακτήρες."
"Enter single-line text.": "Εισαγάγετε κείμενο μίας γραμμής."
"Graph": "Γραφικό Σχήμα"
"Graph Grouping Style": "Στυλ ομάδας ομαδοποίησης"
"Graph Template": "Πρότυπο γραφήματος"
"Leaf Item Type": "Τύπος στοιχείου φύλλων"
"Name": "Όνομα"
"Object Selection and Tree Creation Criteria": "Κριτήρια επιλογής αντικειμένων και δημιουργίας δέντρου"
"Optional: Sub-Tree Item": "Προαιρετικό: Στοιχείο υπο-δέντρου"
"Remove graph-based criteria": "Αφαίρεση κριτηρίων βάσει γραφημάτων"
"Save": "Αποθήκευση"
"Save outcome is uncertain. Reload before retrying.": "Η έκβαση της αποθήκευσης είναι αβέβαιη. Επαναφορτώστε πριν προσπαθήσετε ξανά."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Αποθηκεύστε πρώτα τον κανόνα· τα κριτήρια επιλογής αντικειμένων και δημιουργίας δέντρου του προστίθενται στη συνέχεια."
"The Item Type that shall be dynamically added to the tree.": "Ο τύπος στοιχείου που θα προστεθεί δυναμικά στο δέντρο."
"The tree rule changed since you opened this form. Reload before saving.": "Ο κανόνας δέντρου άλλαξε από τότε που ανοίξατε αυτήν τη φόρμα. Επαναφορτώστε πριν αποθηκεύσετε."
"Tree": "Δέντρο"
"Tree Rule Selection [edit: %name%]": "Επιλογή κανόνα δέντρου [επεξεργασία: %name%]"
"Tree Rules Selection [new]": "Επιλογή κανόνων δέντρου [νέο]"
"Tree rule not found.": "Ο κανόνας δέντρου δεν βρέθηκε."
"Tree rule saved.": "Ο κανόνας δέντρου αποθηκεύτηκε."
"Unable to load the tree rule. Reload before retrying.": "Αδυναμία φόρτωσης του κανόνα δέντρου. Επαναφορτώστε πριν προσπαθήσετε ξανά."
"Unexpected fields were submitted.": "Υποβλήθηκαν απροσδόκητα πεδία."
