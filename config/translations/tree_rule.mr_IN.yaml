"A useful name for this Rule.": "या नियमासाठी एक उपयुक्त नाव."
"Access denied.": "प्रवेश नाकारला."
"Add Tree Rule": "ट्री नियम जोडा"
"Back to Tree Rules": "ट्री नियमांवर परत जा"
"Check this box to enable this rule.": "हा नियम सक्षम करण्यासाठी हा बॉक्स निवडा."
"Choose a Tree for the new Tree Items.": "नवीन ट्री आयटम्ससाठी ट्री निवडा."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "जोडण्यासाठी निवडलेल्या ट्रीचे हेडर किंवा त्याचा रूट निवडा. हा नियम कार्यान्वित होईल तेव्हा तो अजूनही अस्तित्वात आहे याची खात्री करा."
"Choose a header of the selected Tree.": "निवडलेल्या ट्रीचे हेडर निवडा."
"Choose a listed Graph Grouping Style.": "सूचीबद्ध ग्राफ समूहीकरण शैली निवडा."
"Choose a listed Leaf Item Type.": "सूचीबद्ध लीफ आयटम प्रकार निवडा."
"Choose an existing Tree.": "विद्यमान ट्री निवडा."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ट्रीवर या विशिष्ट होस्टसाठी ग्राफ काढताना ते कसे गटबद्ध केले जातात ते निवडा. डिव्हाइस लीव्हजसाठी वापरले जाते."
"Data Query Index": "डेटा क्वेरी इंडेक्स"
"Device": "डिव्हाइस"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "डिव्हाइस लीव्हज ग्राफ किंवा ग्राफ टेम्पलेट स्तंभांवरील निकष वापरू शकत नाहीत. लीफ आयटम प्रकार डिव्हाइसमध्ये बदलताना, ते निकष काढून टाकण्यासाठी हा बॉक्स निवडा; ते परत मिळवता येणार नाहीत."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "डिव्हाइस लीव्हज ग्राफ-आधारित निकष वापरू शकत नाहीत. जतन करण्यासाठी %count% निकष काढून टाकण्याची पुष्टी करा."
"Edit Tree Rule": "ट्री नियम संपादित करा"
"Enable Rule": "नियम सक्षम करा"
"Enter a name.": "नाव प्रविष्ट करा."
"Enter at most %count% characters.": "कमाल %count% वर्ण प्रविष्ट करा."
"Enter single-line text.": "एका ओळीचा मजकूर प्रविष्ट करा."
"Graph": "ग्राफ"
"Graph Grouping Style": "ग्राफ समूहीकरण शैली"
"Graph Template": "ग्राफ टेम्पलेट"
"Leaf Item Type": "लीफ आयटम प्रकार"
"Name": "नाव"
"Object Selection and Tree Creation Criteria": "ऑब्जेक्ट निवड आणि ट्री निर्मिती निकष"
"Optional: Sub-Tree Item": "पर्यायी: उप-ट्री आयटम"
"Remove graph-based criteria": "ग्राफ-आधारित निकष काढून टाका"
"Save": "जतन करा"
"Save outcome is uncertain. Reload before retrying.": "जतन करण्याचा परिणाम अनिश्चित आहे. पुन्हा प्रयत्न करण्यापूर्वी रीलोड करा."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "प्रथम नियम जतन करा; त्याचे ऑब्जेक्ट निवड आणि ट्री निर्मिती निकष नंतर जोडले जातात."
"The Item Type that shall be dynamically added to the tree.": "ट्रीमध्ये डायनॅमिकरित्या जोडला जाणारा आयटम प्रकार."
"The tree rule changed since you opened this form. Reload before saving.": "तुम्ही हा फॉर्म उघडल्यापासून ट्री नियम बदलला आहे. जतन करण्यापूर्वी रीलोड करा."
"Tree": "ट्री"
"Tree Rule Selection [edit: %name%]": "ट्री नियम निवड [संपादन: %name%]"
"Tree Rules Selection [new]": "ट्री नियम निवड [नवीन]"
"Tree rule not found.": "ट्री नियम आढळला नाही."
"Tree rule saved.": "ट्री नियम जतन केला."
"Unable to load the tree rule. Reload before retrying.": "ट्री नियम लोड करण्यात अक्षम. पुन्हा प्रयत्न करण्यापूर्वी रीलोड करा."
"Unexpected fields were submitted.": "अनपेक्षित फील्ड्स सबमिट केली गेली."
