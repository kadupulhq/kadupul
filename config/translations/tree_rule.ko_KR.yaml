"A useful name for this Rule.": "이 규칙의 유용한 이름."
"Access denied.": "액세스가 거부되었습니다."
"Add Tree Rule": "트리 규칙 추가"
"Back to Tree Rules": "트리 규칙 목록으로 돌아가기"
"Check this box to enable this rule.": "이 규칙을 사용하려면이 상자를 선택하십시오."
"Choose a Tree for the new Tree Items.": "새 트리 항목에 대한 트리를 선택하십시오."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "연결할 선택한 트리의 헤더 또는 루트를 선택하세요. 이 규칙이 실행될 때도 해당 위치가 계속 존재하는지 확인하세요."
"Choose a header of the selected Tree.": "선택한 트리의 헤더를 선택하세요."
"Choose a listed Graph Grouping Style.": "목록에 있는 그래프 그룹화 스타일을 선택하세요."
"Choose a listed Leaf Item Type.": "목록에 있는 리프 항목 유형을 선택하세요."
"Choose an existing Tree.": "기존 트리를 선택하세요."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "트리에서 이 특정 호스트에 대한 그래프를 그릴 때 그래프를 그룹화하는 방법을 선택합니다. 장치 리프에 사용됩니다."
"Data Query Index": "데이터 쿼리 색인"
"Device": "장치"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "장치 리프는 그래프 또는 그래프 템플릿 열의 기준을 사용할 수 없습니다. 리프 항목 유형을 장치로 변경할 때 해당 기준을 제거하려면 이 상자를 선택하세요. 제거된 기준은 복구할 수 없습니다."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "장치 리프는 그래프 기반 기준을 사용할 수 없습니다. 저장하려면 %count%개 기준의 제거를 확인하세요."
"Edit Tree Rule": "트리 규칙 편집"
"Enable Rule": "규칙 사용"
"Enter a name.": "이름을 입력하세요."
"Enter at most %count% characters.": "최대 %count%자까지 입력하세요."
"Enter single-line text.": "한 줄 텍스트를 입력하세요."
"Graph": "그래프"
"Graph Grouping Style": "그래프 그룹화 스타일"
"Graph Template": "그래프 템플릿"
"Leaf Item Type": "리프 아이템 유형"
"Name": "이름"
"Object Selection and Tree Creation Criteria": "개체 선택 및 트리 생성 기준"
"Optional: Sub-Tree Item": "선택 사항 : 하위 트리 항목"
"Remove graph-based criteria": "그래프 기반 기준 제거"
"Save": "저장"
"Save outcome is uncertain. Reload before retrying.": "저장 결과를 확인할 수 없습니다. 다시 시도하기 전에 새로 고침하세요."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "먼저 규칙을 저장하세요. 개체 선택 및 트리 생성 기준은 그 이후에 추가됩니다."
"The Item Type that shall be dynamically added to the tree.": "트리에 동적으로 추가되는 Item Type."
"The tree rule changed since you opened this form. Reload before saving.": "이 양식을 연 후 트리 규칙이 변경되었습니다. 저장하기 전에 다시 불러오세요."
"Tree": "나무"
"Tree Rule Selection [edit: %name%]": "트리 규칙 선택 [편집: %name%]"
"Tree Rules Selection [new]": "트리 규칙 선택 [새로 만들기]"
"Tree rule not found.": "트리 규칙을 찾을 수 없습니다."
"Tree rule saved.": "트리 규칙이 저장되었습니다."
"Unable to load the tree rule. Reload before retrying.": "트리 규칙을 불러올 수 없습니다. 다시 시도하기 전에 새로 고침하세요."
"Unexpected fields were submitted.": "예기치 않은 필드가 제출되었습니다."
