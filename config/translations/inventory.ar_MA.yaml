"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "يجب أن تكون المجمّعات البعيدة المعنية متصلة بالشبكة. قد يخلّف الحذف الفاشل تغييرات بعيدة أو في الوحدات الإضافية؛ عاين النتيجة قبل إعادة المحاولة."
