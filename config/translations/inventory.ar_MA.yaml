"Confirm clearing statistics": "تأكيد مسح الإحصائيات"
"Selected device statistics cleared.": "تم مسح إحصائيات الأجهزة المختارة."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "إعادة ضبط أوقات الاستجابة وعدد عمليات الاستطلاع والتوفر لهذه الأجهزة. يتم الاحتفاظ بالمبيانات والمعطيات التاريخية وإعدادات الجهاز، وتُستأنف الإحصائيات عند الاستطلاع الموالي."
"Synchronize device templates": "مزامنة قوالب الأجهزة"
"Confirm synchronization": "تأكيد المزامنة"
"Selected device templates synchronized.": "تمت مزامنة قوالب الأجهزة المختارة."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "تطبيق القوالب المعيّنة حالياً على هذه الأجهزة. تُضاف ارتباطات المبيانات واستعلامات المعطيات الناقصة، وقد تُحذف ارتباطات قوالب المبيانات غير المستعملة. يتم تجاوز الأجهزة التي لا تتوفر على قوالب، مع الاحتفاظ بالمبيانات الحالية والمعطيات التاريخية؛ وقد تنشئ الأتمتة مبيانات جديدة."
"Change device options": "تغيير خيارات الجهاز"
"Confirm option changes": "تأكيد تغييرات الخيارات"
"Selected device options updated.": "تم تحيين خيارات الأجهزة المختارة."
"Device options": "خيارات الجهاز"
"Select at least one supported device option.": "اختر خياراً مدعوماً واحداً على الأقل للجهاز."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "تُعدّل الخيارات المؤشّر عليها فقط، بينما تحتفظ الخيارات غير المؤشّر عليها بقيمها الحالية. يؤدي اختيار موقع فارغ إلى مسحه."
