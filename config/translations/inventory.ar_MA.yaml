"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "لا يمكن التراجع عن حذف الجهاز من هنا. اختر ما إذا كنت تريد الاحتفاظ بالمبيانات ومصادر المعطيات المعطّلة أو حذفها."
