"Selected device assignments updated.": "تم تحيين تعيينات الأجهزة المختارة."
"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "يُطبّق التعيين المختار على كل جهاز مدرج. تحافظ تغييرات القوالب على المبيانات الحالية؛ وقد تنشئ الأتمتة مبيانات جديدة، بينما تنقل تغييرات المجمّع مسؤولية الاستطلاع."
