"SNMPv3 authentication and privacy passphrases require at least 8 bytes.": "Weedhaha sirta ah ee xaqiijinta iyo qarsoodiga SNMPv3 waxay u baahan yihiin ugu yaraan 8 bayt."
"SNMPv3 privacy also requires authentication.": "Qarsoodiga SNMPv3 wuxuu sidoo kale u baahan yahay xaqiijin."
