"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "Deji borotokoolka xaqiijinta ama qarsoodiga SNMPv3 oo ay weheliso weedha sirta ah."
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "Aqoonsiga keydsan weligii lama soo bandhigo. Beddeliddoodu waxay dejisaa dhammaan afarta meelood ee aqoonsiga; ka bixitaanka nooca SNMP 3 wuxuu tirtiraa magaca isticmaalaha iyo weedhaha sirta ah."
"Submit every notification receiver field.": "Soo gudbi meel kasta oo ka mid ah meelaha qaataha ogeysiiska."
"The notification receiver changed since you opened this form. Reload before saving.": "Qaataha ogeysiisku wuu isbeddelay tan iyo markii aad furtay foomkan. Dib u soo rar ka hor intaadan keydin."
"The passphrases do not match.": "Weedhaha sirta ahi isma waafaqsana."
"Unable to load the notification receiver. Reload before retrying.": "Lama soo rari karin qaataha ogeysiiska. Dib u soo rar ka hor intaadan isku dayin mar kale."
