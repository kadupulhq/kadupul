"About Kadupul": "À propos de Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul est un projet open source indépendant de surveillance réseau et de représentation graphique de séries temporelles."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Le développement, les contributions et les décisions de publication sont gérés par l’organisation Kadupul."
"For documentation and support, visit the Kadupul project.": "Pour la documentation et l’assistance, consultez le projet Kadupul."
