"Action": "Aiki"
"Advanced options": "Zaɓuɓɓuka na gaba"
"Applying database upgrades": "Ana aiwatar da haɓaka rumbun bayanai"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Yi ajiyar rumbun bayanai, fayilolin RRD, saiti da maɓallai. Haɓaka rumbun bayanai na iya ƙaddamar da sauye-sauyen da koma baya na manhaja ba zai iya sokewa ba."
"Blocked": "An Toshi"
"Check": "Duba"
"Check again": "Sake dubawa"
"Check collection freshness and collector connectivity before enabling discovery.": "Duba sabunta tarawa da haɗin mai tattara bayanai kafin kunna ganowa."
"Check requirements": "Duba buƙatu"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Bincike suna duba wannan tsari da izinin tsarin fayil. Ba sa rubuta fayilolin gwaji ko tuntuɓar na'urori."
"Collection profile": "Bayanin tattarawa"
"Collector": "Mai Tattara Bayanai"
"Configure": "Saita"
"Configuring collection profiles": "Ana saita bayanan tarawa"
"Configuring discovery": "Ana saita ganowa"
"Configuring the local device": "Ana saita na'urar gida"
"Confirming database version": "Ana tabbatar da sigar rumbun bayanai"
"Converting selected tables": "Ana juya zaɓaɓɓun tebura"
"Database version": "Sigar rumbun bayanai"
"Disabled": "An Kashe"
"Discovery": "Ganowa"
"Discovery SNMP settings": "Saitunan SNMP na Ganowa"
"Discovery range": "Kewayon ganowa"
"Enable discovery after installation": "Kunna ganowa bayan shigarwa"
"Executable paths": "Hanyoyin aiwatarwa"
"Execution status": "Matsayin aiwatarwa"
"Finished execution": "An kammala aiwatarwa"
"Finishing tasks only. Schema migrations will not be replayed.": "Ana kammala ayyukan ƙarshe kawai. Ba za a sake kunna ƙaurar tsarin bayanai ba."
"I accept the license terms": "Na amince da sharuɗɗan lasisi"
"I authorize discovery of the displayed range": "Na ba da izinin binciken kewayon da aka nuna"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Na duba rajistar kuma na tabbatar cewa ma'aikacin baya da ƙananan tsarin sa sun tsaya"
"I checked the previous attempt and accept that some changes may already be committed": "Na duba yunƙurin da ya gabata kuma na yarda cewa wataƙila an riga an zartar da wasu sauye-sauye"
"I reviewed this plan and have the required backups": "Na duba wannan shirin kuma ina da ajiyar baya da ake buƙata"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Idan ma'aikaci ya tsaya ba zato ba tsammani, kiyaye log/cacti.log kuma tabbatar tsarin sa ya ƙare kafin sake gwadawa kai tsaye. Yanayin jira ba ya tabbatar da nasarar farawa."
"Importing templates": "Ana shigo da samfura"
"Install Kadupul": "Shigar da Kadupul"
"Installation and upgrade": "Shigarwa da haɓakawa"
"Installation request was rejected.": "An ƙi amincewa da buƙatar shigarwa."
"Installation steps": "Matakan shigarwa"
"Installed": "An Shigar"
"Keep a backup of the database, RRD files, configuration and secret material.": "Ajiye ajiyar baya na rumbun bayanai, fayilolin RRD, saiti da bayanan sirri."
"Language": "Harshe"
"Large tables may require the dedicated CLI conversion tool before installation.": "Manyan tebura na iya buƙatar keɓantaccen kayan aikin canzawa na CLI kafin shigarwa."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Bar fagagen sirri a fanko don riƙe bayanan shiga da aka adana. Ba a sake nuna bayanan sirri."
"License": "Lasisi"
"No action needed": "Babu aikin da ake buƙata"
"Observed": "An lura"
"Open the console": "Buɗe console"
"Operation": "Aiki"
"Override discovery SNMP settings": "Soke saitunan SNMP na bincike"
"Pass": "Ya Wuce"
"Poller interval in seconds": "Tazarar poller a daƙiƙa"
"Preparing CSRF protection": "Ana shirya kariyar CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Ci gaba yana nuna matakin ƙarshe da aka yi rikodi. Sabunta wannan shafin ba ya taɓa farawa ko sake gwada ma'aikaci."
"Recover stopped attempt": "Farfaɗo da yunƙurin da ya tsaya"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Farfaɗowa yana riƙe zaɓuɓɓukan da aka ajiye kuma ba ya taɓa kashe ma'aikacin da ke aiki. Sake duba shirin kafin sake gwadawa."
"Review": "Bita"
"Review installation plan": "Duba shirin shigarwa"
"Run": "Gudanar"
"Run reviewed plan": "Gudanar da shirin da aka duba"
"Save and review": "Ajiye kuma duba"
"Scope": "Iyakar Aiki"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Matsayi ba ya samuwa. An riƙe aikin da aka ajiye. Sabunta shafin don sake haɗawa; kar ka gabatar da wani shigarwa."
"Synchronizing collectors": "Ana daidaita masu tara bayanai"
"Table conversions": "Sauye-sauyen tebur"
"Templates": "Samfura"
"The database version matches this application. Installation does not establish that polling is healthy.": "Sigar rumbun bayanai ta dace da wannan manhajar. Shigarwa ba ta tabbatar da cewa tattarawa yana da lafiya ba."
"The request outcome is unknown. Check execution status before retrying.": "Sakamakon buƙatar ba a san shi ba. Duba matsayin aiwatarwa kafin sake gwadawa."
"Theme": "Jigo"
"Verify": "Tabbatar"
"Verify the poller schedule and service account.": "Tabbatar da jadawalin poller da asusun sabis."
"Version change": "Sauyin siga"
"Waiting for the installation worker": "Ana jiran ma'aikacin shigarwa"
"collector": "mai tara bayanai"
"complete": "an kammala"
"failed": "ya kasa"
"finish": "kammala"
"install": "shigar"
"not_started": "not_started"
"partial": "rabin"
"running": "yana aiki"
"succeeded": "ya yi nasara"
"upgrade": "haɓakawa"
"waiting": "ana jira"
"Accept the license before saving the installation plan.": "Karɓi lasisin kafin adana shirin shigarwa."
"Invalid installation form.": "Fom ɗin shigarwa mara inganci."
"Access denied.": "An hana shiga."
"Confirm the recovery warning before retrying.": "Tabbatar da gargaɗin farfadowa kafin sake gwadawa."
"Review and confirm the current installation plan.": "Duba kuma ka tabbatar da shirin shigarwa na yanzu."
"Confirm the discovery scope before starting.": "Tabbatar da iyakar ganowa kafin farawa."
"Resolve the blocking checks before starting.": "Warware binciken da ke toshewa kafin farawa."
"Too many installer options.": "Zaɓuɓɓukan mai shigarwa sun yi yawa."
"Invalid installer option name.": "Sunan zaɓin mai shigarwa mara inganci."
"Unknown or malformed installer option.": "Zaɓin mai shigarwa da ba a sani ba ko mara tsari."
"Installer options must be scalar values.": "Zaɓuɓɓukan mai shigarwa dole ne su zama ƙimomi guda ɗaya (scalar values)."
"Installer option is too long or contains a null byte.": "Zaɓin mai shigarwa ya yi tsawo da yawa ko ya ƙunshi null byte."
"Installer IDs and intervals must be whole numbers.": "IDs da tazarorin mai shigarwa dole ne su zama cikakkun lambobi."
"Installer ID or interval is outside its supported range.": "ID ko tazarar mai shigarwa tana wajen kewayon da ake tallafawa."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Shigarwa ba ta iya ci gaba ba. Sake loda matsayinta kuma duba matsalolin da ke toshewa kafin sake gwadawa."
"Confirm that the previous worker has stopped before recovering its plan.": "Tabbatar da cewa ma'aikacin baya ya tsaya kafin dawo da shirinsa."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "An shigar da rumbun bayanai, amma wasu masu tara bayanai har yanzu suna buƙatar daidaitawa. Sake gwada ayyukan ƙarshe bayan duba matsayinsu."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Shigarwa ta tsaya. Kiyaye rajistar mai shigarwa, gyara musabbabin kuma ka tabbatar da sake gwadawa kai tsaye. Wataƙila an riga an zartar da wasu sauye-sauyen rumbun bayanai. Duba sharewar plugin kafin ba da izinin sake gwadawa."
"Next action": "Aiki na gaba"
"Follow the execution status. Do not start another attempt while a worker is active.": "Bi halin aiwatarwa. Kada a fara wani yunƙuri yayin da ma'aikacin tsari ke aiki."
"Complete the recovery checklist before retrying.": "Cika jerin duba farfadowa kafin sake gwadawa."
"Verify collection and graph operation before enabling discovery.": "Tabbatar da aikin tattarawa da jadawali kafin kunna ganowa."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Warware buƙatun da aka toshe, sannan ka sake dubawa. Ana riƙe zaɓuɓɓukan da aka ajiye."
"Review the planned changes and backup checklist before authorizing execution.": "Duba sauye-sauyen da aka tsara da jerin duba ajiyar baya kafin ba da izinin aiwatarwa."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Zaɓi bayanin tarawa kuma karɓi lasisin. Ana iya buɗe saitunan zaɓi idan an buƙata."
"Download installation diagnostics": "Sauke bayanan binciken shigarwa"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Buɗe jadawali kuma tabbatar cewa bayanan RRD ɗinsa sun sabunta bayan zagayen poller."
"Requirement details": "Cikakken bayanin buƙata"
"Recover": "Farfaɗo"
"Recovery checklist": "Jerin duba farfaɗowa"
"Preserve log/cacti.log and record the failed attempt.": "Kiyaye log/cacti.log kuma yi rikodin yunƙurin da ya gaza."
"Confirm that the previous worker and its child processes have stopped.": "Tabbatar da cewa ma'aikacin baya da tsarukan 'ya'yansa sun tsaya."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Duba sauye-sauyen da aka zartar, daidaitawar mai tattara bayanai da sharewar plugin. Gyara musabbabin kafin sake gwadawa."
"Review the saved plan again, then explicitly authorize a retry.": "Sake duba shirin da aka ajiye, sannan ka ba da izinin sake gwadawa kai tsaye."
"Recover a stopped worker": "Farfaɗo da ma'aikacin da ya tsaya"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Yi amfani da farfaɗowa ne kawai bayan ka tabbatar cewa wannan yunƙurin ba ya gudana kuma. Farfaɗowa ba ya tsayar da tsari."
"Collector and installation mode": "Mai tattara bayanai da yanayin shigarwa"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Saitin turawa (deployment) yana ƙayyade matsayin mai tara bayanai da haɗin rumbun bayanai. Tabbatar da saitin babbar sabar kafin fara mai tara bayanai."
"Discovery and SNMP settings": "Saitunan Ganowa da SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Ajiye binciken gano na'urori a kashe har sai an tabbatar da tattarawa da haɗin mai tattara bayanai."
"Template selection": "Zaɓin samfuri"
"Templates selected for import": "Samfuran da aka zaɓa don shigo da su"
"No templates selected.": "Ba a zaɓi samfura ba."
"Backup checklist": "Jerin duba ajiya"
"Database backup and a tested restoration procedure.": "Ajiyar rumbun bayanai da tsarin maidowa da aka gwada."
"RRD files and the service account permissions needed to restore them.": "Fayilolin RRD da izinin asusun sabis da ake buƙata don dawo da su."
"Configuration, keys and plugin data outside the database.": "Saitawa, maɓallai da bayanan plugin a wajen rumbun bayanai."
"Post-installation checks": "Binciken bayan shigarwa"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Binciken da aka tabbatar sun shafi shaidar da aka nuna ne kawai. Binciken da ba a tantance ba har yanzu suna buƙatar tabbatarwar mai aiki."
"Operational checks still require operator verification.": "Binciken aiki har yanzu yana buƙatar tabbatarwar mai gudanarwa."
"Status": "Matsayi"
"verified": "an tabbatar"
"action_required": "Action required"
"not_assessed": "Not assessed"
"Database schema": "Tsarin rumbun bayanai"
"Stored schema matches the application target.": "Tsarin da aka ajiye (schema) ya dace da abin da manhaja ke nema."
"Target schema completion has not been confirmed.": "Ba a tabbatar da kammaluwar tsarin (schema) da aka yi niyya ba."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Duba sakamakon shigarwa kuma warware gazawa kafin ɗaukar haɓaka tsarin bayanai a matsayin kammalalle."
"Installation outcome": "Sakamakon shigarwa"
"A successful receipt matches the current target schema.": "Rasit mai nasara ya dace da tsarin da ake nufi na yanzu."
"A complete successful installation outcome has not been confirmed.": "Ba a tabbatar da cikakken sakamakon shigarwa mai nasara ba."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Kiyaye rajistar mai shigarwa kuma yi amfani da hanyar farfaɗowa ko sake gwadawa kai tsaye lokacin da ake buƙata."
"Collector synchronization": "Daidaita mai tattara bayanai"
"The completed installer reports pending collector synchronization.": "Mai shigarwa da aka kammala ya ba da rahoton daidaitawar masu tara bayanai masu jira."
"The completed installer reports no pending collectors.": "Mai shigarwa da aka kammala bai ba da rahoton masu tara bayanai masu jira ba."
"Collector completion remains unconfirmed by this partial receipt.": "Kammala mai tattara bayanai ya kasance ba a tabbatar da shi ba ta wannan rasit na ɓangare."
"Collector completion is not established by this installation outcome.": "Ba a tabbatar da kammala mai tattara bayanai ta wannan sakamakon shigarwa ba."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Duba matsayin mai tattara bayanai kuma sake gwada ayyukan ƙarshe don sakamakon da bai cika ba. Wannan ba ya tabbatar da sabuntar tattarawa na baya."
"Scheduled collection": "Tattarawa bisa jadawali"
"No poller or device was contacted by this assessment.": "Wannan tantancewar ba ta tuntuɓi kowane poller ko na'ura ba."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Tabbatar da cewa mai tsara lokaci da aka saita yana gudanar da poller a matsayin asusun sabis da aka yi niyya kuma duba zagayensa na yau da kullum na gaba."
"Graph data": "Bayanan jadawali"
"Live samples and RRD updates were not exercised.": "Ba a gwada samfuran lokaci guda da sabunta RRD ba."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Bayan zagayen tattarawa na yau da kullum, tabbatar cewa jadawalan da ake tsammani sun sami sababbin samfura kuma duba kurakuran poller."
"Recovery readiness": "Shirye-shiryen farfaɗowa"
"Backup restoration was not exercised.": "Ba a gwada maido da ajiya ba."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Tabbatar da dawo da rumbun bayanai, fayilolin RRD, saiti da maɓallan tsaro a keɓe kafin dogaro da farfaɗowa."
"No persisted local poller start has been recorded.": "Ba a yi rikodin fara poller na gida da ya wanzu ba."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Lokacin poller da ya wanzu ba shi da inganci kuma ba zai iya tabbatar da lafiyar mai tsara lokaci ba."
"The recorded poller start is in the future. Check clock synchronization.": "Farawar poller da aka rubuta tana nan gaba. Duba daidaitawar agogo."
"The recorded poller start is older than the native scheduling tolerance.": "Farawar poller da aka rubuta ta fi tsufa fiye da jurewar jadawalin asali."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "An yi rikodin farawar poller na gida a cikin juriya na tsara lokaci na asali. Ba a tabbatar da kammalawa da lafiyar na'ura ba."
"readable": "yana karantawa"
"missing or unreadable": "ya ɓace ko ba ya karantawa"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Mayar da cikakken sakin shirin da abubuwan dogaronsa da aka kulle; ba wa asusun sabis damar karatu."
"PHP temporary directory": "Kundin wucin gadi na PHP"
"directory writable by this process": "kundi yana rubutu ta wannan tsarin"
"missing or not writable": "ya ɓace ko ba ya rubutu"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Saita sys_temp_dir a matsayin kundin da ke akwai wanda asusun shigarwa zai iya rubutawa. Shigo da asali na amfani da fayilolin wucin gadi."
"Background worker launch": "Fara ma'aikacin bango"
"required PHP functions available; launch not exercised": "ayyukan PHP da ake buƙata suna samuwa; ba a gwada farawa ba"
"required PHP launch function disabled": "an kashe aikin farawa na PHP da ake buƙata"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Kunna exec don lokacin gudanarwar PHP na yanar gizo, ko yi amfani da mai shigarwa na CLI mai izini."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Kunna popen, pclose don lokacin gudanarwar PHP na yanar gizo, ko yi amfani da mai shigarwa na CLI mai izini."
"Database transaction ownership": "Mallakar ma'amalar rumbun bayanai"
"autocommit enabled; no caller-owned transaction": "an kunna autocommit; babu mu'amala mallakin mai kira"
"autocommit disabled or caller transaction active": "an kashe autocommit ko mu'amalar mai kira tana aiki"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Gudanar da shigarwa a wajen transaction mallakin mai kira kuma kunna autocommit a haɗin sauyin sa."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Mayar da kundin sakin shirin kuma ba wa asusun shigarwa izinin rubutawa don shigo da albarkatun samfuri. Kada a mayar da shi mai rubutu ga kowa a duniya."
"Worker file: install/background.php": "Fayil ɗin ma'aikaci: install/background.php"
"Worker file: bin/legacy-installer.php": "Fayil ɗin ma'aikaci: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Fayil ɗin ma'aikaci: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Wurin shigo da bayanai: resource/snmp_queries"
"Import destination: resource/script_server": "Wurin shigo da bayanai: resource/script_server"
"Import destination: resource/script_queries": "Wurin shigo da bayanai: resource/script_queries"
"Import destination: scripts": "Wurin shigo da bayanai: scripts"
"Database privileges": "Izinin rumbun bayanai"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Ba a tabbatar da izinin ƙaura mai tasiri ba, gami da ayyuka masu aiki da tallafi na musamman ga abubuwa."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Sa mai kula da rumbun bayanai ya tabbatar da rubutun tebur da ake buƙata, sauye-sauyen tsari, triggers da routines don asusun shigarwa da tsarin bayanai. Kada a ba da izinin babban mai gudanarwa na gaba ɗaya."
"Compare web and worker runtimes": "Kwatanta lokutan gudanarwa na yanar gizo da na ma'aikaci"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Wannan yana fara ɗan gajeren binciken PHP na karatu-kaɗai a sarari. Ba ya keɓe mai shigarwa, rubuta fayiloli ko tuntuɓar na'urori."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Binciken yana gadar wannan tsarin yanar gizo kuma yana amfani da mai fassara na PHP na mai shigarwa da aka saita. Ba ya duba wani tsarin jadawali ko sabis daban."
"I authorize the read-only worker runtime comparison.": "Na ba da izinin kwatancen yanayin aiki na ma'aikaci mai karatu kawai."
"Compare runtimes": "Kwatanta lokutan gudanarwa"
"Runtime comparison results": "Sakamakon kwatancen yanayin aiki"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Bambance-bambancen izini da ainihi na iya zama da gangan. Abubuwan da aka lura na karatu kawai ba su tabbatar da cewa rubutu ko shigarwa za su yi nasara ba."
"Confirm the read-only worker runtime comparison.": "Tabbatar da kwatancen lokacin gudanarwa na ma'aikaci na karatu kawai."
"The runtime comparison is unavailable.": "Kwatancen lokacin aiki ba ya samuwa."
"Shared application secret": "Sirrin manhajar da aka raba"
"A strong web application secret is required before comparison.": "Ana buƙatar sirrin manhajar yanar gizo mai ƙarfi kafin kwatantawa."
"Runtime comparison": "Kwatancen yanayin aiki"
"The configured worker runtime did not confirm a bounded comparison.": "Lokacin aiki na ma'aikaci da aka saita bai tabbatar da kwatancen da ke da iyaka ba."
"The inherited worker secret could not be confirmed against the web secret.": "Ba a iya tabbatar da sirrin ma'aikacin da aka gada a kan sirrin yanar gizo ba."
"PHP runtime comparison": "Kwatancen yanayin aiki na PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Duk lokutan gudanarwa guda biyu dole ne su goyi bayan PHP 8.4; sigogin gyara masu bambanci suna buƙatar dubawa."
"Required extension comparison": "Kwatancen extension da ake buƙata"
"Required extension availability is checked; differing versions require review.": "Ana duba samuwar extension da ake buƙata; nau'ika masu bambanci suna buƙatar bita."
"Process identity comparison": "Kwatancen ainihin tsari"
"Effective process identity is unavailable on this platform.": "Shaidar tsari mai tasiri ba ta samuwa a kan wannan dandamalin."
"Effective process identities match.": "Shaidun tsari masu tasiri sun dace."
"Effective process identities differ; separate service accounts may be intentional.": "Shaidun tsari masu tasiri sun bambanta; asusun sabis daban-daban na iya zama da gangan."
"Directory access comparison": "Kwatanta damar shiga kundi"
"Read-only directory permission observations match.": "Abubuwan da aka lura na izinin kundi na karatu kawai sun dace."
"Directory locations or permission observations differ; review the service-account roles.": "Wuraren kundi ko abubuwan lura na izini sun bambanta; duba ayyukan asusun sabis."
"Worker directory read and traversal": "Karanta kundin ma'aikaci da kewayawa"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Kundin ma'aikata da ake buƙata dole ne su wanzu kuma su ba da izinin karatu da shiga ciki. Ba a gwada wani rubutu ba."
"The inherited worker secret matches the web secret for this private challenge.": "Sirrin ma'aikacin da aka gada ya dace da sirrin yanar gizo don wannan ƙalubale na sirri."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Duba PHP interpreter da aka saita, extensions da ake buƙata, sirrin da aka gada da izinin kundin asusun sabis. Ba a gwada wani rubutu ko fara mai shigarwa ba."
"advisory": "shawara"
