"Preparing CSRF protection": "Príprava ochrany CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Priebeh zobrazuje poslednú zaznamenanú fázu. Obnovenie tejto stránky nikdy nespustí ani neopakuje worker."
"Recover stopped attempt": "Obnoviť zastavený pokus"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Obnova zachováva uložené výbery a nikdy neukončí živý worker. Pred opakovaním znova skontrolujte plán."
