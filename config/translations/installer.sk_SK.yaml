"Accept the license before saving the installation plan.": "Pred uložením plánu inštalácie prijmite licenciu."
"Invalid installation form.": "Neplatný formulár inštalácie."
"Access denied.": "Prístup zamietnutý."
"Confirm the recovery warning before retrying.": "Pred opakovaním potvrďte upozornenie na obnovu."
"Review and confirm the current installation plan.": "Skontrolujte a potvrďte aktuálny plán inštalácie."
"Confirm the discovery scope before starting.": "Pred spustením potvrďte rozsah zisťovania."
"Resolve the blocking checks before starting.": "Pred spustením vyriešte blokujúce kontroly."
"Too many installer options.": "Príliš veľa volieb inštalátora."
"Invalid installer option name.": "Neplatný názov voľby inštalátora."
"Unknown or malformed installer option.": "Neznáma alebo chybne formátovaná voľba inštalátora."
"Installer options must be scalar values.": "Voľby inštalátora musia byť skalárne hodnoty."
"Installer option is too long or contains a null byte.": "Voľba inštalátora je príliš dlhá alebo obsahuje nulový bajt."
"Installer IDs and intervals must be whole numbers.": "ID a intervaly inštalátora musia byť celé čísla."
"Installer ID or interval is outside its supported range.": "ID alebo interval inštalátora je mimo podporovaného rozsahu."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Inštalácia nemohla pokračovať. Pred ďalším pokusom znova načítajte jej stav a skontrolujte blokujúce kontroly."
"Confirm that the previous worker has stopped before recovering its plan.": "Pred obnovou plánu potvrďte, že predchádzajúci worker sa zastavil."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Databáza je nainštalovaná, ale niektoré zberače ešte vyžadujú synchronizáciu. Po kontrole ich stavu zopakujte dokončovacie úlohy."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Inštalácia sa zastavila. Zachovajte záznam inštalátora, odstráňte príčinu a opakovanie explicitne potvrďte. Niektoré zmeny databázy už mohli byť potvrdené. Pred schválením opakovania skontrolujte vyčistenie pluginov."
"Next action": "Ďalšia akcia"
"Follow the execution status. Do not start another attempt while a worker is active.": "Sledujte stav vykonávania. Nespúšťajte ďalší pokus, kým je worker aktívny."
"Complete the recovery checklist before retrying.": "Pred opakovaním dokončite kontrolný zoznam obnovy."
"Verify collection and graph operation before enabling discovery.": "Pred povolením zisťovania overte zber a fungovanie grafov."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Vyriešte blokované požiadavky a potom skontrolujte znova. Uložené výbery sa zachovajú."
"Review the planned changes and backup checklist before authorizing execution.": "Pred schválením vykonania skontrolujte plánované zmeny a kontrolný zoznam zálohovania."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Vyberte profil zberu a prijmite licenciu. Voliteľné nastavenia možno otvoriť podľa potreby."
"Download installation diagnostics": "Stiahnuť diagnostiku inštalácie"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Otvorte graf a overte, že sa jeho údaje RRD po cykle pollera aktualizujú."
"Requirement details": "Podrobnosti požiadavky"
"Recover": "Obnoviť"
"Recovery checklist": "Kontrolný zoznam obnovy"
"Preserve log/cacti.log and record the failed attempt.": "Zachovajte log/cacti.log a zaznamenajte zlyhaný pokus."
"Confirm that the previous worker and its child processes have stopped.": "Potvrďte, že predchádzajúci worker a jeho podriadené procesy sa zastavili."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Skontrolujte potvrdené zmeny, synchronizáciu zberačov a vyčistenie pluginov. Pred opakovaním odstráňte príčinu."
"Review the saved plan again, then explicitly authorize a retry.": "Znova skontrolujte uložený plán a potom opakovanie explicitne schváľte."
"Recover a stopped worker": "Obnoviť zastavený worker"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Obnovu použite až po potvrdení, že tento pokus už nebeží. Obnova proces nezastavuje."
"Collector and installation mode": "Režim zberača a inštalácie"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Konfigurácia nasadenia určuje rolu zberača a pripojenia k databáze. Pred spustením zberača overte konfiguráciu primárneho servera."
"Discovery and SNMP settings": "Zisťovanie a nastavenia SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Ponechajte zisťovanie zakázané, kým sa neoverí zber a pripojenie zberačov."
"Template selection": "Výber šablón"
"Templates selected for import": "Šablóny vybrané na import"
"No templates selected.": "Nie sú vybrané žiadne šablóny."
"Backup checklist": "Kontrolný zoznam zálohovania"
"Database backup and a tested restoration procedure.": "Záloha databázy a otestovaný postup obnovy."
"RRD files and the service account permissions needed to restore them.": "Súbory RRD a oprávnenia servisného účtu potrebné na ich obnovu."
"Configuration, keys and plugin data outside the database.": "Konfigurácia, kľúče a údaje pluginov mimo databázy."
"Post-installation checks": "Kontroly po inštalácii"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Overené kontroly pokrývajú len zobrazené dôkazy. Nehodnotené kontroly stále vyžadujú overenie operátorom."
"Operational checks still require operator verification.": "Prevádzkové kontroly stále vyžadujú overenie operátorom."
"Status": "Stav"
"verified": "Overené"
"action_required": "Vyžaduje sa akcia"
"not_assessed": "Nehodnotené"
"Database schema": "Schéma databázy"
"Stored schema matches the application target.": "Uložená schéma zodpovedá cieľu aplikácie."
"Target schema completion has not been confirmed.": "Dokončenie cieľovej schémy nebolo potvrdené."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Skontrolujte výsledok inštalácie a pred považovaním aktualizácie schémy za dokončenú vyriešte zlyhania."
"Installation outcome": "Výsledok inštalácie"
"A successful receipt matches the current target schema.": "Úspešná potvrdenka zodpovedá aktuálnej cieľovej schéme."
"A complete successful installation outcome has not been confirmed.": "Úplný úspešný výsledok inštalácie nebol potvrdený."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Zachovajte záznam inštalátora a v prípade potreby použite explicitný postup obnovy alebo opakovania."
"Collector synchronization": "Synchronizácia zberačov"
"The completed installer reports pending collector synchronization.": "Dokončený inštalátor hlási čakajúcu synchronizáciu zberačov."
"The completed installer reports no pending collectors.": "Dokončený inštalátor nehlási žiadne čakajúce zberače."
"Collector completion remains unconfirmed by this partial receipt.": "Dokončenie zberačov zostáva touto čiastočnou potvrdenkou nepotvrdené."
"Collector completion is not established by this installation outcome.": "Dokončenie zberačov nie je týmto výsledkom inštalácie preukázané."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Skontrolujte stav zberačov a pri čiastočných výsledkoch zopakujte dokončovacie úlohy. Tým sa neoveruje neskoršia aktuálnosť zberu."
"Scheduled collection": "Plánovaný zber"
"No poller or device was contacted by this assessment.": "Toto posúdenie nekontaktovalo žiadny poller ani zariadenie."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Potvrďte, že nakonfigurovaný plánovač spúšťa poller pod zamýšľaným servisným účtom, a skontrolujte jeho ďalší bežný cyklus."
"Graph data": "Údaje grafov"
"Live samples and RRD updates were not exercised.": "Živé vzorky a aktualizácie RRD sa nevyskúšali."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Po bežnom cykle zberu potvrďte, že očakávané grafy dostávajú čerstvé vzorky, a skontrolujte chyby pollera."
"Recovery readiness": "Pripravenosť na obnovu"
"Backup restoration was not exercised.": "Obnova zo zálohy sa nevyskúšala."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Pred spoliehaním sa na obnovu overte izolovanú obnovu databázy, súborov RRD, konfigurácie a kľúčového materiálu."
"No persisted local poller start has been recorded.": "Nebol zaznamenaný žiadny trvalo uložený lokálny štart pollera."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Trvalo uložené časovanie pollera je neplatné a nemôže preukázať zdravie plánovača."
"The recorded poller start is in the future. Check clock synchronization.": "Zaznamenaný štart pollera je v budúcnosti. Skontrolujte synchronizáciu hodín."
"The recorded poller start is older than the native scheduling tolerance.": "Zaznamenaný štart pollera je starší ako natívna tolerancia plánovania."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Lokálny štart pollera bol zaznamenaný v rámci natívnej tolerancie plánovania. Dokončenie a zdravie zariadení nie sú overené."
"readable": "čitateľné"
"missing or unreadable": "chýba alebo nie je čitateľné"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Obnovte úplné vydanie a jeho uzamknuté závislosti; udeľte servisnému účtu prístup na čítanie."
"PHP temporary directory": "Dočasný adresár PHP"
"directory writable by this process": "adresár zapisovateľný týmto procesom"
"missing or not writable": "chýba alebo nie je zapisovateľný"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Nastavte sys_temp_dir na existujúci adresár zapisovateľný inštalačným účtom. Natívne importy používajú dočasné súbory."
"Background worker launch": "Spustenie worker procesu na pozadí"
"required PHP functions available; launch not exercised": "požadované funkcie PHP sú dostupné; spustenie sa nevyskúšalo"
"required PHP launch function disabled": "požadovaná funkcia PHP na spustenie je zakázaná"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Povoľte exec pre webové prostredie PHP alebo použite autorizovaný inštalátor CLI."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Povoľte popen, pclose pre webové prostredie PHP alebo použite autorizovaný inštalátor CLI."
"Database transaction ownership": "Vlastníctvo databázovej transakcie"
"autocommit enabled; no caller-owned transaction": "autocommit povolený; žiadna transakcia vlastnená volajúcim"
"autocommit disabled or caller transaction active": "autocommit zakázaný alebo je aktívna transakcia volajúceho"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Spustite inštaláciu mimo transakcie vlastnenej volajúcim a povoľte autocommit na jej mutačnom pripojení."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Obnovte adresár vydania a udeľte inštalačnému účtu právo zápisu na importy zdrojov šablón. Nenastavujte ho ako zapisovateľný pre všetkých."
"Worker file: install/background.php": "Súbor workera: install/background.php"
"Worker file: bin/legacy-installer.php": "Súbor workera: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Súbor workera: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Cieľ importu: resource/snmp_queries"
"Import destination: resource/script_server": "Cieľ importu: resource/script_server"
"Import destination: resource/script_queries": "Cieľ importu: resource/script_queries"
"Import destination: scripts": "Cieľ importu: scripts"
"Database privileges": "Oprávnenia databázy"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Účinné oprávnenia migrácie vrátane aktívnych rolí a oprávnení špecifických pre objekty neboli overené."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Požiadajte správcu databázy, aby overil požadované zápisy do tabuliek, zmeny schémy, triggery a rutiny pre inštalačný účet a schému. Neudeľujte globálne oprávnenia správcu."
"Compare web and worker runtimes": "Porovnať webové a worker prostredia"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Týmto sa explicitne spustí krátka sonda PHP len na čítanie. Nerezervuje inštalátor, nezapisuje súbory ani nekontaktuje zariadenia."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Sonda dedí tento webový proces a používa nakonfigurovaný interpreter PHP inštalátora. Neskúma samostatný plánovač ani službu."
"I authorize the read-only worker runtime comparison.": "Povoľujem porovnanie worker prostredia len na čítanie."
"Compare runtimes": "Porovnať prostredia"
"Runtime comparison results": "Výsledky porovnania prostredí"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Rozdiely v oprávneniach a identite môžu byť zámerné. Pozorovania len na čítanie nepreukazujú, že zápisy alebo inštalácia uspejú."
"Confirm the read-only worker runtime comparison.": "Potvrďte porovnanie worker prostredia len na čítanie."
"The runtime comparison is unavailable.": "Porovnanie prostredí nie je dostupné."
"Shared application secret": "Zdieľané tajomstvo aplikácie"
"A strong web application secret is required before comparison.": "Pred porovnaním sa vyžaduje silné tajomstvo webovej aplikácie."
"Runtime comparison": "Porovnanie prostredí"
"The configured worker runtime did not confirm a bounded comparison.": "Nakonfigurované worker prostredie nepotvrdilo ohraničené porovnanie."
"The inherited worker secret could not be confirmed against the web secret.": "Zdedené tajomstvo workera sa nepodarilo potvrdiť voči webovému tajomstvu."
"PHP runtime comparison": "Porovnanie prostredí PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Obe prostredia musia podporovať PHP 8.4; odlišné verzie záplat vyžadujú kontrolu."
"Required extension comparison": "Porovnanie požadovaných rozšírení"
"Required extension availability is checked; differing versions require review.": "Kontroluje sa dostupnosť požadovaných rozšírení; odlišné verzie vyžadujú kontrolu."
"Process identity comparison": "Porovnanie identity procesu"
"Effective process identity is unavailable on this platform.": "Účinná identita procesu nie je na tejto platforme dostupná."
"Effective process identities match.": "Účinné identity procesov sa zhodujú."
"Effective process identities differ; separate service accounts may be intentional.": "Účinné identity procesov sa líšia; samostatné servisné účty môžu byť zámerné."
"Directory access comparison": "Porovnanie prístupu k adresárom"
"Read-only directory permission observations match.": "Pozorovania oprávnení adresárov len na čítanie sa zhodujú."
"Directory locations or permission observations differ; review the service-account roles.": "Umiestnenia adresárov alebo pozorovania oprávnení sa líšia; skontrolujte role servisných účtov."
"Worker directory read and traversal": "Čítanie a prechod adresárov workera"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Požadované adresáre workera musia existovať a umožňovať čítanie a prechod. Zápisy sa netestovali."
"The inherited worker secret matches the web secret for this private challenge.": "Zdedené tajomstvo workera sa zhoduje s webovým tajomstvom pre túto súkromnú výzvu."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Skontrolujte nakonfigurovaný interpreter PHP, požadované rozšírenia, zdedené tajomstvo a oprávnenia adresárov servisných účtov. Zápisy ani spustenie inštalátora sa nevyskúšali."
"advisory": "odporúčanie"
