"Installed": "Nainštalované"
"Keep a backup of the database, RRD files, configuration and secret material.": "Uchovajte zálohu databázy, súborov RRD, konfigurácie a tajného materiálu."
"Language": "Jazyk"
"Large tables may require the dedicated CLI conversion tool before installation.": "Veľké tabuľky môžu pred inštaláciou vyžadovať vyhradený konverzný nástroj CLI."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Ak chcete zachovať uložené prihlasovacie údaje, nechajte tajné polia prázdne. Tajné údaje sa nikdy znova nezobrazujú."
