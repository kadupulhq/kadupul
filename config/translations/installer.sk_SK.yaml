"Finishing tasks only. Schema migrations will not be replayed.": "Len dokončovacie úlohy. Migrácie schémy sa nebudú opakovať."
"I accept the license terms": "Prijímam licenčné podmienky"
"I authorize discovery of the displayed range": "Povoľujem zisťovanie zobrazeného rozsahu"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Skontroloval som záznam a potvrdil som, že predchádzajúci worker a jeho podriadené procesy sa zastavili"
"I checked the previous attempt and accept that some changes may already be committed": "Skontroloval som predchádzajúci pokus a beriem na vedomie, že niektoré zmeny už mohli byť potvrdené"
"I reviewed this plan and have the required backups": "Skontroloval som tento plán a mám potrebné zálohy"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ak sa worker neočakávane zastaví, zachovajte log/cacti.log a pred explicitným opakovaním potvrďte, že jeho proces skončil. Stav čakania nepotvrdzuje úspešné spustenie."
"Importing templates": "Import šablón"
