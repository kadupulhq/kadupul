"Check requirements": "Skontrolovať požiadavky"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Kontroly preverujú tento proces a oprávnenia súborového systému. Nezapisujú testovacie súbory ani nekontaktujú zariadenia."
