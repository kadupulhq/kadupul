"Choose a Tree for the new Tree Items.": "नयाँ ट्री वस्तुहरूका लागि ट्री छान्नुहोस्।"
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "जोड्न छानिएको ट्रीको हेडर, वा यसको रुट छान्नुहोस्। यो नियम कार्यान्वयन हुँदा त्यो अझै अस्तित्वमा छ भन्ने सुनिश्चित गर्नुहोस्।"
"Choose a header of the selected Tree.": "छानिएको ट्रीको हेडर छान्नुहोस्।"
"Choose a listed Graph Grouping Style.": "सूचीमा भएको ग्राफ समूहीकरण शैली छान्नुहोस्।"
"Choose a listed Leaf Item Type.": "सूचीमा भएको पात वस्तु प्रकार छान्नुहोस्।"
"Choose an existing Tree.": "विद्यमान ट्री छान्नुहोस्।"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ट्रीमा यो विशेष होस्टका लागि ग्राफहरू कसरी समूहबद्ध गरेर देखाइन्छ भन्ने छान्नुहोस्। उपकरण पातहरूका लागि प्रयोग हुन्छ।"
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "निम्न ट्री नियमहरू र तिनका वस्तु चयन तथा ट्री सिर्जना मापदण्डहरू मेटाउन जारी राख्नुहोस् थिच्नुहोस्।"
"Click Continue to disable the following Tree Rules.": "निम्न ट्री नियमहरू अक्षम गर्न जारी राख्नुहोस् थिच्नुहोस्।"
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "निम्न ट्री नियमहरूको नक्कल गर्न जारी राख्नुहोस् थिच्नुहोस्। तपाईं नयाँ ट्री नियमहरूको शीर्षक ढाँचा वैकल्पिक रूपमा परिवर्तन गर्न सक्नुहुन्छ, जो अक्षम अवस्थामा सुरु हुन्छन्।"
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "निम्न ट्री नियमहरू सक्षम गर्न जारी राख्नुहोस् थिच्नुहोस्। तिनीहरू सफलतापूर्वक परीक्षण गरिएका छन् भन्ने सुनिश्चित गर्नुहोस्।"
