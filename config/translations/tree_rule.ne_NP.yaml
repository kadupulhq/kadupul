"A useful name for this Rule.": "यो नियमको उपयोगी नाम।"
"Access denied.": "पहुँच अस्वीकृत।"
"Add Tree Rule": "ट्री नियम थप्नुहोस्"
"Back to Tree Rules": "ट्री नियमहरूमा फर्कनुहोस्"
"Cancel": "रद्द गर्नुहोस्"
