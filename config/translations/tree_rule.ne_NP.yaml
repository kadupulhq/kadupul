"Delete selected": "छानिएका मेटाउनुहोस्"
"Device": "उपकरण"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "उपकरण पातहरूले ग्राफ वा ग्राफ टेम्प्लेट स्तम्भमा मापदण्ड प्रयोग गर्न सक्दैनन्। पात वस्तु प्रकार उपकरणमा परिवर्तन गर्दा ती मापदण्डहरू हटाउन यो बाकस चिन्ह लगाउनुहोस्; तिनलाई फिर्ता ल्याउन सकिँदैन।"
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "उपकरण पातहरूले ग्राफमा आधारित मापदण्ड प्रयोग गर्न सक्दैनन्। सुरक्षित गर्न %count% मापदण्ड हटाउने कुरा पुष्टि गर्नुहोस्।"
"Disable Tree Rules": "ट्री नियमहरू अक्षम गर्नुहोस्"
