"A useful name for this Rule.": "Полезно име за това правило."
"Access denied.": "Достъпът е отказан."
"Add Graph Rule": "Добавяне на правило за графики"
"Back to Graph Rules": "Назад към правилата за графики"
"Check this box to enable this rule.": "Поставете отметка в това квадратче, за да активирате това правило."
"Choose a Data Query to apply to this rule.": "Изберете заявка за данни, която да се приложи към това правило."
"Choose a Graph Type": "Изберете тип графика"
"Choose a Graph Type of the selected Data Query.": "Изберете тип графика от избраната заявка за данни."
"Choose an existing Data Query.": "Изберете съществуваща заявка за данни."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Изберете който и да е от наличните типове графики на избраната заявка за данни, който да се приложи към това правило."
"Data Query": "Вземане на данни"
"Device Selection and Graph Creation Criteria": "Критерии за избор на устройства и създаване на графики"
"Edit Graph Rule": "Редактиране на правило за графики"
"Enable Rule": "Активиране на правилото"
"Enter a name.": "Въведете име."
"Enter at most %count% characters.": "Въведете най-много %count% знака."
"Enter single-line text.": "Въведете едноредов текст."
"Graph Type": "Тип на графиката"
"Graph rule not found.": "Правилото за графики не е намерено."
"Graph rule saved.": "Правилото за графики е запазено."
"Name": "Име"
"Rule Selection [edit: %name%]": "Избор на правило [редактиране: %name%]"
"Rule Selection [new]": "Избор на правило [ново]"
"Save": "Запази"
"Save outcome is uncertain. Reload before retrying.": "Резултатът от запазването е несигурен. Презаредете, преди да опитате отново."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Първо запазете правилото; неговите критерии за избор на устройства и създаване на графики се добавят след това."
"The graph rule changed since you opened this form. Reload before saving.": "Правилото за графики е променено, откакто отворихте този формуляр. Презаредете, преди да запазите."
"Unable to load the graph rule. Reload before retrying.": "Не може да се зареди правилото за графики. Презаредете, преди да опитате отново."
"Unexpected fields were submitted.": "Бяха изпратени неочаквани полета."
