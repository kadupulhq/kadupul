"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Programările zilnice și săptămânale folosesc ora de început și Reluare la fiecare; cea săptămânală folosește și Zilele săptămânii. Cea lunară folosește Lunile și Zilele lunii; Lunar în ziua folosește Lunile, Săptămânile lunii și Zilele săptămânii."
