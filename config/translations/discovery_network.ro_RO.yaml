"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "O listă separată prin spații de servere DNS alternative de folosit pentru rezolvarea DNS. Dacă este goală, se folosește sistemul de operare al poller-ului pentru rezolvarea numelor DNS."
