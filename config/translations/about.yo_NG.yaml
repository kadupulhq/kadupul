"About Kadupul": "Nípa Kadupul"
"Kadupul is an independent open-source project for network monitoring and time-series graphing.": "Kadupul jẹ́ iṣẹ́ àkànṣe orísun-ṣíṣí aládàáṣe fún àmójútó nẹ́tíwọ́ọ̀kì àti yíyà àtẹ àwòrán oníṣẹ̀ẹ́-àkókò."
"Development, contributions, and release decisions are managed by the Kadupul organization.": "Àjọ Kadupul ló ń ṣàkóso ìdàgbàsókè, àwọn àfikún, àti àwọn ìpinnu ìtújáde."
"For documentation and support, visit the Kadupul project.": "Fún ìwé àkọsílẹ̀ àti àtìlẹ́yìn, ṣèbẹ̀wò sí iṣẹ́ àkànṣe Kadupul."
