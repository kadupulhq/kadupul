"A useful name for this Rule.": "Igama eliwusizo lalo Mthetho."
"Access denied.": "Ukufinyelela kwenqatshiwe."
"Add Graph Rule": "Engeza Umthetho Wegrafu"
"Back to Graph Rules": "Buyela kuMithetho Yegrafu"
"Check this box to enable this rule.": "Maka leli bhokisi ukuze unike amandla lo mthetho."
"Choose a Data Query to apply to this rule.": "Khetha Umbuzo Wedatha ozosetshenziswa kulo mthetho."
"Choose a Graph Type": "Khetha Uhlobo Lwegrafu"
"Choose a Graph Type of the selected Data Query.": "Khetha Uhlobo Lwegrafu loMbuzo Wedatha okhethiwe."
"Choose an existing Data Query.": "Khetha Umbuzo Wedatha okhona."
"Choose any of the available Graph Types of the selected Data Query to apply to this rule.": "Khetha noma yiziphi Izinhlobo Zegrafu ezitholakalayo zoMbuzo Wedatha okhethiwe ozowusebenzisa kulo mthetho."
"Data Query": "Umbuzo Wedatha"
"Device Selection and Graph Creation Criteria": "Ukukhetha Idivayisi kanye Nemibandela Yokudala Igrafu"
"Edit Graph Rule": "Hlela Umthetho Wegrafu"
"Enable Rule": "Nika Amandla Umthetho"
"Enter a name.": "Faka igama."
"Enter at most %count% characters.": "Faka izinhlamvu ezingafika ku-%count% kakhulu."
"Enter single-line text.": "Faka umbhalo womugqa owodwa."
"Graph Type": "Uhlobo Lwegrafu"
"Graph rule not found.": "Umthetho wegrafu awutholakali."
"Graph rule saved.": "Umthetho wegrafu ulondoloziwe."
"Name": "Igama"
"Rule Selection [edit: %name%]": "Ukukhethwa Komthetho [hlela: %name%]"
"Rule Selection [new]": "Ukukhethwa Komthetho [okusha]"
"Save": "Londoloza"
"Save outcome is uncertain. Reload before retrying.": "Umphumela wokulondoloza awuqinisekile. Layisha kabusha ngaphambi kokuzama futhi."
"Save the rule first; its Device Selection and Graph Creation Criteria are added afterwards.": "Londoloza umthetho kuqala; Ukukhethwa Kwedivayisi kanye Nezimfuneko Zokudala Igrafu kwengezwa ngemva kwalokho."
"The graph rule changed since you opened this form. Reload before saving.": "Umthetho wegrafu ushintshile selokhu uvule leli fomu. Layisha kabusha ngaphambi kokulondoloza."
"Unable to load the graph rule. Reload before retrying.": "Ayikwazi ukulayisha umthetho wegrafu. Layisha kabusha ngaphambi kokuzama futhi."
"Unexpected fields were submitted.": "Kuthunyelwe izinkambu ezingalindelekile."
