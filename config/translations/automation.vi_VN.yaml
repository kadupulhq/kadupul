"This is a unique string that will be matched to a devices sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Đây là chuỗi duy nhất sẽ được khớp với chuỗi sysOid của thiết bị để ghép nối với Mẫu tự động hóa này. Có thể sử dụng bất kỳ biểu thức chính quy Perl nào cùng với bất kỳ biểu thức SQL Where nào."
