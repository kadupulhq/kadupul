"Action": "Isenzo"
"Advanced options": "Izinketho ezithuthukile"
"Applying database upgrades": "Kusebenza izibuyekezo zesizindalwazi"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Yenza ikhophi yasenqolobaneni yesizindalwazi, amafayela e-RRD, ukulungiselelwa nokhiye. Izibuyekezo zesizindalwazi zingenza izinguquko ukuhlehliswa kohlelo okungeke kuzisuse."
"Blocked": "Kuvinjelwe"
"Check": "Hlola"
"Check again": "Hlola futhi"
"Check collection freshness and collector connectivity before enabling discovery.": "Hlola ubusha bokuqoqa kanye nokuxhumana komqoqi ngaphambi kokunika amandla ukuthola."
"Check requirements": "Hlola izidingo"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Ukuhlola kuhlolisisa le nqubo nezimvume zesistimu yamafayela. Akubhali amafayela okuhlola noma kuxhumane namadivayisi."
"Collection profile": "Iphrofayela yokuqoqa"
"Collector": "Umqoqi"
"Configure": "Lungiselela"
"Configuring collection profiles": "Ilungiselela amaphrofayela okuqoqa"
"Configuring discovery": "Ilungiselela ukuthola"
"Configuring the local device": "Ilungiselela idivayisi yendawo"
"Confirming database version": "Iqinisekisa inguqulo yesizindalwazi"
"Converting selected tables": "Iguqula amathebula akhethiwe"
"Database version": "Inguqulo yesizindalwazi"
"Disabled": "Kukhutshaziwe"
"Discovery": "Ukuthola"
"Discovery SNMP settings": "Izilungiselelo ze-SNMP zokuthola"
"Discovery range": "Ububanzi bokuthola"
"Enable discovery after installation": "Nika amandla ukuthola ngemva kokufaka"
"Executable paths": "Izindlela ezisebenzisekayo"
"Execution status": "Isimo sokusebenza"
"Finished execution": "Kuqedwe ukusebenza"
"Finishing tasks only. Schema migrations will not be replayed.": "Iqedela imisebenzi kuphela. Ukuthuthwa kwesikema ngeke kudlalwe kabusha."
"I accept the license terms": "Ngiyayamukela imigomo yelayisensi"
"I authorize discovery of the displayed range": "Nginikeza imvume yokutholwa kwebanga elibonisiwe"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Ngihlole ilogi futhi ngaqinisekisa ukuthi isisebenzi sangaphambilini nezinqubo zaso zezingane zimiile"
"I checked the previous attempt and accept that some changes may already be committed": "Ngihlole umzamo wangaphambilini futhi ngiyavuma ukuthi ezinye izinguquko zingase zivele ziboshiwe"
"I reviewed this plan and have the required backups": "Ngibuyekeze lolu hlelo futhi nginamakhophi okusekelayo adingekayo"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Uma isisebenzi sima ngokungalindelekile, gcina i-log/cacti.log futhi uqinisekise ukuthi inqubo yaso iphelile ngaphambi kokuzama futhi ngokuqondile. Isimo sokulinda asiqinisekisi ukuqaliswa okuphumelele."
"Importing templates": "Ingenisa izifanekiso"
"Install Kadupul": "Faka i-Kadupul"
"Installation and upgrade": "Ukufaka nokuthuthukisa"
"Installation request was rejected.": "Isicelo sokufaka sinqatshiwe."
"Installation steps": "Izinyathelo zokufaka"
"Installed": "Kufakiwe"
"Keep a backup of the database, RRD files, configuration and secret material.": "Gcina ikhophi yokusekelayo yedathabheyisi, amafayela e-RRD, ukumiswa kanye nezinto eziyimfihlo."
"Language": "Ulimi"
"Large tables may require the dedicated CLI conversion tool before installation.": "Amathebula amakhulu angadinga ithuluzi lokuguqula le-CLI elizinikele ngaphambi kokufaka."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Shiya izinkundla eziyimfihlo zingenalutho ukuze ugcine iziqinisekiso ezilondoloziwe. Izimfihlo aziphinde ziboniswe."
"License": "Ilayisensi"
"No action needed": "Asikho isenzo esidingekayo"
"Observed": "Kuboniwe"
"Open the console": "Vula ikhonsoli"
"Operation": "Umsebenzi"
"Override discovery SNMP settings": "Bhala ngaphezulu izilungiselelo ze-SNMP zokuthola"
"Pass": "Phumelela"
"Poller interval in seconds": "Isikhawu se-Poller ngamasekhondi"
"Preparing CSRF protection": "Ilungisa ukuvikelwa kwe-CSRF"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Inqubekelaphambili ibonisa isigaba sokugcina esirekhodiwe. Ukuvuselela leli khasi akulokothi kuqale noma kuzame futhi isisebenzi."
"Recover stopped attempt": "Buyisela umzamo omile"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Ukubuyisela esimweni kugcina okukhethiwe okulondoloziwe futhi akulokothi kuqede isisebenzi esiphilayo. Buyekeza uhlelo futhi ngaphambi kokuzama futhi."
"Review": "Buyekeza"
"Review installation plan": "Buyekeza uhlelo lokufaka"
"Run": "Sebenzisa"
"Run reviewed plan": "Sebenzisa uhlelo olubuyekeziwe"
"Save and review": "Londoloza futhi ubuyekeze"
"Scope": "Ububanzi"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Isimo asitholakali. Umsebenzi olondoloziwe ugcinwa. Vuselela ukuze uxhume futhi; ungathumeli okunye ukufaka."
"Synchronizing collectors": "Kuvumelaniswa abaqoqi"
"Table conversions": "Ukuguqulwa kwamathebula"
"Templates": "Izifanekiso"
"The database version matches this application. Installation does not establish that polling is healthy.": "Inguqulo yesizindalwazi ihambisana nale softhiwe. Ukufaka akufakazeli ukuthi ukuqoqa idatha kuphilile."
"The request outcome is unknown. Check execution status before retrying.": "Umphumela wesicelo awaziwa. Hlola isimo sokwenziwa ngaphambi kokuzama futhi."
"Theme": "Itimu"
"Verify": "Qinisekisa"
"Verify the poller schedule and service account.": "Qinisekisa isheduli ye-poller kanye ne-akhawunti yesevisi."
"Version change": "Ukushintshwa kwenguqulo"
"Waiting for the installation worker": "Kulindwe umsebenzi wokufaka"
"collector": "umqoqi"
"complete": "kuphelele"
"failed": "kuhlulekile"
"finish": "qeda"
"install": "faka"
"not_started": "akuqalwanga"
"partial": "okuyingxenye"
"running": "kuyasebenza"
"succeeded": "kuphumelele"
"upgrade": "thuthukisa"
"waiting": "kulindile"
"Accept the license before saving the installation plan.": "Yamukela ilayisensi ngaphambi kokulondoloza uhlelo lokufaka."
"Invalid installation form.": "Ifomu lokufaka elingalungile."
"Access denied.": "Ukufinyelela kwenqatshiwe."
"Confirm the recovery warning before retrying.": "Qinisekisa isexwayiso sokubuyisela ngaphambi kokuzama futhi."
"Review and confirm the current installation plan.": "Buyekeza futhi uqinisekise uhlelo lwamanje lokufaka."
"Confirm the discovery scope before starting.": "Qinisekisa ububanzi bokuthola ngaphambi kokuqala."
"Resolve the blocking checks before starting.": "Xazulula ukuhlolwa okuvimbayo ngaphambi kokuqala."
"Too many installer options.": "Izinketho eziningi kakhulu zesifaki."
"Invalid installer option name.": "Igama lenketho yomfaki elingalungile."
"Unknown or malformed installer option.": "Inketho yesifaki engaziwa noma engakhekiwe kahle."
"Installer options must be scalar values.": "Izinketho zomfaki kufanele zibe amanani e-scalar."
"Installer option is too long or contains a null byte.": "Inketho yomfaki yinde kakhulu noma iqukethe i-null byte."
"Installer IDs and intervals must be whole numbers.": "Ama-ID omfaki nezikhawu kufanele kube izinombolo eziphelele."
"Installer ID or interval is outside its supported range.": "I-ID yomfaki noma isikhawu singaphandle kwebanga laso elisekelwayo."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Ukufaka akukwazanga ukuqhubeka. Layisha kabusha isimo sako bese ubuyekeza amasheke avimbayo ngaphambi kokuzama futhi."
"Confirm that the previous worker has stopped before recovering its plan.": "Qinisekisa ukuthi umsebenzi wangaphambilini umile ngaphambi kokubuyisela uhlelo lwawo."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Isizindalwazi sifakiwe, kodwa abanye abaqoqi basadinga ukuvumelaniswa. Zama futhi imisebenzi yokuqedela ngemva kokuhlola isimo sabo."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Ukufaka kumisiwe. Gcina ilogi yomfaki, lungisa imbangela bese uqinisekisa ngokucacile ukuzama futhi. Ezinye izinguquko zedathabheyisi zingase zivele ziboshiwe. Hlola ukuhlanzwa kwe-plugin ngaphambi kokugunyaza ukuzama futhi."
"Next action": "Isenzo esilandelayo"
"Follow the execution status. Do not start another attempt while a worker is active.": "Landela isimo sokusebenza. Ungaqali omunye umzamo ngenkathi isisebenzi sisasebenza."
"Complete the recovery checklist before retrying.": "Qedela uhlu lokuhlola lokubuyisela ngaphambi kokuzama futhi."
"Verify collection and graph operation before enabling discovery.": "Qinisekisa ukuqoqwa nokusebenza kwegrafu ngaphambi kokunika amandla ukuthola."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Xazulula izidingo ezivinjiwe, bese uhlola futhi. Okukhethiwe okulondoloziwe kuyagcinwa."
"Review the planned changes and backup checklist before authorizing execution.": "Buyekeza izinguquko ezihleliwe kanye nohlu lokuhlola ikhophi yokusekelayo ngaphambi kokugunyaza ukusebenza."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Khetha iphrofayela yokuqoqa bese wamukela ilayisensi. Izilungiselelo ezingakhethwa zingavulwa uma zidingeka."
"Download installation diagnostics": "Landa ukuxilongwa kokufaka"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Vula igrafu bese uqinisekisa ukuthi idatha yayo ye-RRD iyabuyekezwa ngemva komjikelezo we-poller."
"Requirement details": "Imininingwane yezidingo"
"Recover": "Buyisela esimweni"
"Recovery checklist": "Uhlu lokuhlola ukubuyisela esimweni"
"Preserve log/cacti.log and record the failed attempt.": "Gcina i-log/cacti.log futhi urekhode umzamo ohlulekile."
"Confirm that the previous worker and its child processes have stopped.": "Qinisekisa ukuthi umsebenzi wangaphambilini nezinqubo zawo ezingaphansi kumile."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Hlola izinguquko eziboshiwe, ukuvumelanisa komqoqi kanye nokuhlanzwa kwe-plugin. Lungisa imbangela ngaphambi kokuzama futhi."
"Review the saved plan again, then explicitly authorize a retry.": "Buyekeza uhlelo olulondoloziwe futhi, bese ugunyaza ngokucacile ukuzama futhi."
"Recover a stopped worker": "Buyisela isisebenzi esimile"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Sebenzisa ukululama kuphela ngemva kokuqinisekisa ukuthi lo mzamo awusasebenzi. Ukululama akumisi inqubo."
"Collector and installation mode": "Umqoqi nemodi yokufaka"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Ukulungiselelwa kokuthunyelwa kunquma indima yomqoqi nokuxhumana kwesizindalwazi. Qinisekisa ukulungiselelwa kweseva eyinhloko ngaphambi kokuqalisa umqoqi."
"Discovery and SNMP settings": "Izilungiselelo zokuthola neze-SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Gcina ukutholwa (discovery) kukhutshaziwe kuze kube yilapho ukuqoqwa nokuxhumeka komqoqi sekuqinisekisiwe."
"Template selection": "Ukukhethwa kwesifanekiso"
"Templates selected for import": "Izifanekiso ezikhethelwe ukungeniswa"
"No templates selected.": "Azikho izifanekiso ezikhethiwe."
"Backup checklist": "Uhlu lokuhlola ikhophi yasenqolobaneni"
"Database backup and a tested restoration procedure.": "Ikhophi yasenqolobaneni yesizindalwazi kanye nenqubo yokubuyisela ehloliwe."
"RRD files and the service account permissions needed to restore them.": "Amafayela e-RRD kanye nezimvume ze-akhawunti yesevisi ezidingekayo ukuze abuyiselwe."
"Configuration, keys and plugin data outside the database.": "Ukulungiselelwa, okhiye nedatha ye-plugin engaphandle kwesizindalwazi."
"Post-installation checks": "Ukuhlola ngemva kokufaka"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Ukuhlolwa okuqinisekisiwe kuhlanganisa kuphela ubufakazi obubonisiwe. Ukuhlolwa okungahloliwe kusadinga ukuqinisekiswa ngumsebenzisi."
"Operational checks still require operator verification.": "Ukuhlola kokusebenza kusadinga ukuqinisekiswa komsebenzisi."
"Status": "Isimo"
"verified": "kuqinisekisiwe"
"action_required": "kudingeka isenzo"
"not_assessed": "akuhloliwe"
"Database schema": "I-schema yesizindalwazi"
"Stored schema matches the application target.": "Isikimu esilondoloziwe sihambisana nokuhloswe yisofthiwe."
"Target schema completion has not been confirmed.": "Ukuqedwa kwesikimu okuhlosiwe akuqinisekiswanga."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Buyekeza umphumela wokufaka futhi uxazulule ukwehluleka ngaphambi kokubheka ukuthuthukiswa kwesikema njengokuqediwe."
"Installation outcome": "Umphumela wokufaka"
"A successful receipt matches the current target schema.": "Irisidi ephumelele ihambisana ne-schema yokuqondisa yamanje."
"A complete successful installation outcome has not been confirmed.": "Umphumela ophelele ophumelele wokufakwa awukaqinisekiswa."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Gcina ilogi yomfaki futhi usebenzise inqubo ecacile yokubuyisela noma yokuzama futhi lapho kudingeka."
"Collector synchronization": "Ukuvumelaniswa komqoqi"
"The completed installer reports pending collector synchronization.": "Isifaki esiqediwe sibika ukuvumelanisa komqoqi okulindile."
"The completed installer reports no pending collectors.": "Isifaki esiqediwe sibika ukuthi abekho abaqoqi abalindile."
"Collector completion remains unconfirmed by this partial receipt.": "Ukuqedwa komqoqi kuhlala kungaqinisekisiwe ngale risidi eyingxenye."
"Collector completion is not established by this installation outcome.": "Ukuqedwa komqoqi akukatholakali ngalo mphumela wokufaka."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Buyekeza isimo somqoqi futhi uzame futhi imisebenzi yokuqeda yemiphumela engaphelele. Lokhu akuqinisekisi ubusha bokuqoqwa kwakamuva."
"Scheduled collection": "Ukuqoqwa okuhleliwe"
"No poller or device was contacted by this assessment.": "Ayikho i-poller noma idivayisi ethintwe yilokhu kuhlola."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Qinisekisa ukuthi isihleli esilungiselelwe sisebenzisa umqoqi njenge-akhawunti yesevisi ehlosiwe futhi ubuyekeze umjikelezo waso ojwayelekile olandelayo."
"Graph data": "Idatha yegrafu"
"Live samples and RRD updates were not exercised.": "Amasampula aphilayo kanye nezibuyekezo ze-RRD akuzange kusetshenziswe."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "Ngemva komjikelezo ojwayelekile wokuqoqa, qinisekisa ukuthi amagrafu alindelwe athola amasampula amasha futhi ubuyekeze amaphutha omqoqi."
"Recovery readiness": "Ukulungela ukubuyisela esimweni"
"Backup restoration was not exercised.": "Ukubuyiselwa kwekhophi yasenqolobaneni akuzange kwenziwe."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Qinisekisa ukubuyiselwa okuhlukanisiwe kwesizindalwazi, amafayela e-RRD, ukulungiselelwa kanye nezinto zokhiye ngaphambi kokuthembela ekululameni."
"No persisted local poller start has been recorded.": "Akukho ukuqala kwe-poller yasendaweni okulondoloziwe okurekhodiwe."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Isikhathi se-poller esilondoloziwe asilungile futhi ngeke sisungule impilo yesihleli."
"The recorded poller start is in the future. Check clock synchronization.": "Ukuqala kwe-poller okurekhodiwe kusesikhathini esizayo. Hlola ukuvumelaniswa kwewashi."
"The recorded poller start is older than the native scheduling tolerance.": "Ukuqala kwe-poller okurekhodiwe kudala kunokubekezelela kokuhlela kwemvelo."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Ukuqala komqoqi wendawo kurekhodwe ngaphakathi kokubekezelelana kokuhlela kwasekuqaleni. Ukuqedwa nempilo yedivayisi akuqinisekisiwe."
"readable": "iyafundeka"
"missing or unreadable": "ayikho noma ayifundeki"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Buyisela ukukhululwa okuphelele nokuncikile kwakho okukhiyiwe; nikeza i-akhawunti yesevisi ukufinyelela kokufunda."
"PHP temporary directory": "Idayirekthri yesikhashana ye-PHP"
"directory writable by this process": "uhla lwamafolda lubhaleka yile nqubo"
"missing or not writable": "ayikho noma ayibhaleki"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Lungiselela i-sys_temp_dir njengohla lwemibhalo olukhona olubhaleka yi-akhawunti yokufaka. Ukungenisa kwasekuqaleni kusebenzisa amafayela esikhashana."
"Background worker launch": "Ukuqaliswa komsebenzi wasemuva"
"required PHP functions available; launch not exercised": "imisebenzi ye-PHP edingekayo iyatholakala; ukuqaliswa akuzange kwenziwe"
"required PHP launch function disabled": "umsebenzi wokuqalisa we-PHP odingekayo ukhutshaziwe"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Nika amandla i-exec yesikhathi sokusebenza se-PHP yewebhu, noma sebenzisa isifaki se-CLI esigunyaziwe."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Nika amandla i-popen, pclose yesikhathi sokusebenza se-PHP yewebhu, noma sebenzisa isifaki se-CLI esigunyaziwe."
"Database transaction ownership": "Ubunikazi bokwenziwayo besizindalwazi"
"autocommit enabled; no caller-owned transaction": "i-autocommit inikwe amandla; akukho ukuthengiselana okungokwemvelo komshayeli"
"autocommit disabled or caller transaction active": "i-autocommit ikhutshaziwe noma ukuthengiselana komshayeli kuyasebenza"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Sebenzisa ukufaka ngaphandle kwe-transaction ephethwe umshayeli bese unika amandla i-autocommit kuxhumo lwayo lokuguqula."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Buyisela idayirekthri yokukhululwa futhi unikeze i-akhawunti yokufaka ukufinyelela kokubhala kokungeniswa kwezinsiza zesifanekiso. Ungayenzi ibhaleke emhlabeni wonke."
"Worker file: install/background.php": "Ifayela lomsebenzi: install/background.php"
"Worker file: bin/legacy-installer.php": "Ifayela lomsebenzi: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Ifayela lomsebenzi: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Indawo yokungenisa: resource/snmp_queries"
"Import destination: resource/script_server": "Indawo yokungenisa: resource/script_server"
"Import destination: resource/script_queries": "Indawo yokungenisa: resource/script_queries"
"Import destination: scripts": "Indawo yokungenisa: scripts"
"Database privileges": "Amalungelo esizindalwazi"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Amalungelo okuthutha asebenzayo, kuhlanganise nezindima ezisebenzayo nezimvume eziqondene nento, akuzange kuqinisekiswe."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Cela umlawuli wedathabheyisi aqinisekise ukubhalwa kwethebula okudingekayo, izinguquko zesikema, ama-trigger kanye nama-routine we-akhawunti yokufaka kanye nesikema. Unganiki amalungelo omlawuli womhlaba wonke."
"Compare web and worker runtimes": "Qhathanisa izikhathi zokusebenza zewebhu nezomsebenzi"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Lokhu kuqala ngokucacile ukuhlolwa okufushane kwe-PHP okufundwayo kuphela. Akubeki isifaki, akubhali amafayela noma akuxhumani namadivayisi."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Ukuhlola kuthatha le nqubo yewebhu njengefa futhi kusebenzisa umhumushi we-PHP wesifaki olungiselelwe. Akuhloli isihleli esihlukile noma isevisi."
"I authorize the read-only worker runtime comparison.": "Nginikeza imvume yokuqhathaniswa kokusebenza kwesisebenzi okufundwayo kuphela."
"Compare runtimes": "Qhathanisa izikhathi zokusebenza"
"Runtime comparison results": "Imiphumela yokuqhathaniswa kokusebenza"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Umehluko wemvume nowobunikazi ungase ube ngamabomu. Okuboniwe okufundwayo kuphela akuqinisekisi ukuthi ukubhala noma ukufaka kuzophumelela."
"Confirm the read-only worker runtime comparison.": "Qinisekisa ukuqhathaniswa kwesikhathi sokusebenza somsebenzi okufundwa kuphela."
"The runtime comparison is unavailable.": "Ukuqhathanisa kwesikhathi sokusebenza akutholakali."
"Shared application secret": "Imfihlo yohlelo lokusebenza ehlanganyelwe"
"A strong web application secret is required before comparison.": "Imfihlo eqinile yohlelo lokusebenza lwewebhu iyadingeka ngaphambi kokuqhathanisa."
"Runtime comparison": "Ukuqhathaniswa kokusebenza"
"The configured worker runtime did not confirm a bounded comparison.": "Isikhathi sokusebenza somsebenzi esilungiselelwe asikuqinisekisanga ukuqhathaniswa okukhawulelwe."
"The inherited worker secret could not be confirmed against the web secret.": "Imfihlo yomsebenzi ezuze njengefa ayikwazanga ukuqinisekiswa ngokumelene nemfihlo yewebhu."
"PHP runtime comparison": "Ukuqhathaniswa kokusebenza kwe-PHP"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "Zombili izikhathi zokusebenza kufanele zisekele i-PHP 8.4; izinhlelo ezihlukile ze-patch zidinga ukubuyekezwa."
"Required extension comparison": "Ukuqhathaniswa kwesandiso esidingekayo"
"Required extension availability is checked; differing versions require review.": "Ukutholakala kwesandiso esidingekayo kuyahlolwa; izinguqulo ezihlukile zidinga ukubuyekezwa."
"Process identity comparison": "Ukuqhathaniswa kobunikazi benqubo"
"Effective process identity is unavailable on this platform.": "Isibonakalisi senqubo esisebenzayo asitholakali kule nkundla."
"Effective process identities match.": "Izibonakalisi zenqubo ezisebenzayo ziyafana."
"Effective process identities differ; separate service accounts may be intentional.": "Izibonakalisi zenqubo ezisebenzayo ziyahluka; ama-akhawunti esevisi ahlukene kungenzeka enziwe ngamabomu."
"Directory access comparison": "Ukuqhathaniswa kokufinyelela kohla lwemibhalo"
"Read-only directory permission observations match.": "Okuboniwe kwemvume yedayirekthri okufundwayo kuphela kuyafana."
"Directory locations or permission observations differ; review the service-account roles.": "Izindawo zohla lwemibhalo noma okubonwe ngezimvume kuyahluka; buyekeza izindima ze-akhawunti yesevisi."
"Worker directory read and traversal": "Ukufundwa nokudabula uhla lwamafolda lomsebenzi"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Izidayirekthri zezisebenzi ezidingekayo kufanele zibe khona futhi zivumele ukufunda nokudabula. Akukho ukubhala okuhloliwe."
"The inherited worker secret matches the web secret for this private challenge.": "Imfihlo yomsebenzi ezuze njengefa ihambisana nemfihlo yewebhu yale nselele eyimfihlo."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Buyekeza umhumushi we-PHP ocushiwe, izandiso ezidingekayo, izimfihlo ezizuzwe njengefa kanye nezimvume zedayirekthri ye-akhawunti yesevisi. Akukho ukubhala noma ukuqaliswa komfaki okuhloliwe."
"advisory": "okwelulekayo"
