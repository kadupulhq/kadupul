"A useful name for this Rule.": "Un nume util pentru această regulă."
"Access denied.": "Acces refuzat."
"Add Tree Rule": "Adaugă regulă de arbore"
"Back to Tree Rules": "Înapoi la regulile de arbori"
"Cancel": "Anulează"
"Check this box to enable this rule.": "Bifați această casetă pentru a activa această regulă."
"Choose a Tree for the new Tree Items.": "Alegeți un arbore pentru noile elemente de arbore."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Alegeți un antet al arborelui selectat în care să se atașeze, sau rădăcina acestuia. Asigurați-vă că încă există la executarea acestei reguli."
"Choose a header of the selected Tree.": "Alegeți un antet al arborelui selectat."
"Choose a listed Graph Grouping Style.": "Alegeți un stil de grupare a graficelor din listă."
"Choose a listed Leaf Item Type.": "Alegeți un tip de element frunză din listă."
"Choose an existing Tree.": "Alegeți un arbore existent."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Alegeți cum sunt grupate graficele atunci când sunt desenate pentru această gazdă în arbore. Folosit pentru frunzele de tip dispozitiv."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Faceți clic pe Continuă pentru a șterge următoarele reguli de arbori împreună cu criteriile lor de selecție a obiectelor și de creare a arborelui."
"Click Continue to disable the following Tree Rules.": "Faceți clic pe Continuă pentru a dezactiva următoarele reguli de arbori."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Faceți clic pe Continuă pentru a duplica următoarele reguli de arbori. Opțional, puteți schimba formatul titlului pentru noile reguli de arbori, care pornesc dezactivate."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Faceți clic pe Continuă pentru a activa următoarele reguli de arbori. Asigurați-vă că au fost testate cu succes."
"Continue": "Continuă"
"Data Query Index": "Index interogare de date"
"Delete Tree Rules": "Șterge regulile de arbori"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Rezultatul ștergerii este incert. Verificați lista regulilor de arbori înainte de a reîncerca."
"Delete selected": "Șterge selecția"
"Device": "Dispozitiv"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Frunzele de tip dispozitiv nu pot folosi criterii referitoare la coloanele de grafic sau de șablon de grafic. Când schimbați tipul elementului frunză în Dispozitiv, bifați această casetă pentru a elimina acele criterii; ele nu pot fi recuperate."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Frunzele de tip dispozitiv nu pot folosi criterii bazate pe grafice. Confirmați eliminarea a %count% criterii pentru a salva."
"Disable Tree Rules": "Dezactivează regulile de arbori"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Rezultatul dezactivării este incert. Verificați lista regulilor de arbori înainte de a reîncerca."
"Disable selected": "Dezactivează selecția"
"Duplicate Tree Rules": "Duplică regulile de arbori"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Rezultatul duplicării este incert. Verificați lista regulilor de arbori înainte de a reîncerca."
"Duplicate selected": "Duplică selecția"
"Edit Tree Rule": "Editează regula de arbore"
"Enable Rule": "Activează regula"
"Enable Tree Rules": "Activează regulile de arbori"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Rezultatul activării este incert. Verificați lista regulilor de arbori înainte de a reîncerca."
"Enable selected": "Activează selecția"
"Enter a name.": "Introduceți un nume."
"Enter a valid name format.": "Introduceți un format de nume valid."
"Enter at most %count% characters.": "Introduceți cel mult %count% caractere."
"Enter single-line text.": "Introduceți text pe o singură linie."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Fiecare <rule_name> este înlocuit cu numele regulii de arbore copiate."
"Graph": "Grafic"
"Graph Grouping Style": "Stil de grupare a graficelor"
"Graph Template": "Șablon de grafic"
"Invalid Tree Rule selection.": "Selecție nevalidă de reguli de arbori."
"Leaf Item Type": "Tip de element frunză"
"Name": "Nume"
"Object Selection and Tree Creation Criteria": "Criterii de selecție a obiectelor și de creare a arborelui"
"One or more selected Tree Rules no longer exist.": "Una sau mai multe dintre regulile de arbori selectate nu mai există."
"Optional: Sub-Tree Item": "Opțional: element de subarbore"
"Remove graph-based criteria": "Elimină criteriile bazate pe grafice"
"Save": "Salvează"
"Save outcome is uncertain. Reload before retrying.": "Rezultatul salvării este incert. Reîncărcați înainte de a reîncerca."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Salvați mai întâi regula; criteriile ei de selecție a obiectelor și de creare a arborelui se adaugă ulterior."
"Select": "Selectează"
"Select %name%": "Selectează %name%"
"Select at least one Tree Rule.": "Selectați cel puțin o regulă de arbore."
"Select at most 100 Tree Rules at a time.": "Selectați cel mult 100 de reguli de arbori odată."
"Select up to %count% rows at a time.": "Selectați cel mult %count% rânduri odată."
"The Item Type that shall be dynamically added to the tree.": "Tipul de element care va fi adăugat dinamic în arbore."
"The name format must give every copy a name of 1 to 255 characters.": "Formatul numelui trebuie să ofere fiecărei copii un nume de 1 până la 255 de caractere."
"The tree rule changed since you opened this form. Reload before saving.": "Regula de arbore s-a modificat de la deschiderea acestui formular. Reîncărcați înainte de a salva."
"Title Format": "Formatul titlului"
"Tree": "Arbore"
"Tree Rule Selection [edit: %name%]": "Selecția regulilor de arbore [editare: %name%]"
"Tree Rules Selection [new]": "Selecția regulilor de arbori [nou]"
"Tree rule not found.": "Regula de arbore nu a fost găsită."
"Tree rule saved.": "Regula de arbore a fost salvată."
"Unable to load Tree Rules. Reload before retrying.": "Regulile de arbori nu au putut fi încărcate. Reîncărcați înainte de a reîncerca."
"Unable to load the tree rule. Reload before retrying.": "Regula de arbore nu a putut fi încărcată. Reîncărcați înainte de a reîncerca."
"Unexpected fields were submitted.": "Au fost trimise câmpuri neașteptate."
