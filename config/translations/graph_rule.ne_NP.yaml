"Click Continue to delete the following Graph Rules with their Device Selection and Graph Creation Criteria.": "निम्न ग्राफ नियमहरू र तिनका उपकरण चयन तथा ग्राफ सिर्जना मापदण्डहरू मेटाउन जारी राख्नुहोस् थिच्नुहोस्।"
"Click Continue to disable the following Graph Rules.": "निम्न ग्राफ नियमहरू अक्षम गर्न जारी राख्नुहोस् थिच्नुहोस्।"
"Click Continue to duplicate the following Graph Rules. You can optionally change the title format for the new Graph Rules, which start disabled.": "निम्न ग्राफ नियमहरूको नक्कल गर्न जारी राख्नुहोस् थिच्नुहोस्। तपाईं नयाँ ग्राफ नियमहरूको शीर्षक ढाँचा वैकल्पिक रूपमा परिवर्तन गर्न सक्नुहुन्छ, जो अक्षम अवस्थामा सुरु हुन्छन्।"
"Click Continue to enable the following Graph Rules. Make sure that they have been tested successfully.": "निम्न ग्राफ नियमहरू सक्षम गर्न जारी राख्नुहोस् थिच्नुहोस्। तिनीहरू सफलतापूर्वक परीक्षण गरिएका छन् भन्ने सुनिश्चित गर्नुहोस्।"
