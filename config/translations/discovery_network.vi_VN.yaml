"A space delimited list of alternate DNS Servers to use for DNS resolution. If blank, the poller OS will be used to resolve DNS names.": "Danh sách các máy chủ DNS thay thế phân tách bằng dấu cách dùng để phân giải DNS. Nếu để trống, hệ điều hành của Poller sẽ được dùng để phân giải tên DNS."
"Access denied.": "Truy cập bị từ chối."
"Add Discovery Network": "Thêm Mạng dò tìm"
"After an initial failure, the number of ping retries to attempt before failing.": "Sau một lần thất bại ban đầu, số lần thử ping lại trước khi báo lỗi."
"After the selected Run Limit, the discovery process will be terminated.": "Sau Giới hạn chạy đã chọn, tiến trình dò tìm sẽ bị kết thúc."
"Allow same sysName on different hosts": "Cho phép cùng sysName trên các máy chủ khác nhau"
"Alternate DNS Servers": "Máy chủ DNS thay thế"
"April": "Tháng 4"
"Associated Site": "Địa điểm liên kết"
"August": "Tháng 8"
"Automatically Add Devices": "Tự động thêm thiết bị"
"Back to Networks": "Quay lại Mạng"
"Choose an existing Data Collector.": "Chọn một Trình thu thập dữ liệu đang tồn tại."
"Choose an existing SNMP Option Set.": "Chọn một Bộ tùy chọn SNMP đang tồn tại."
"Choose an existing Site.": "Chọn một Địa điểm đang tồn tại."
"Choose one of the listed values.": "Chọn một trong các giá trị được liệt kê."
"Choose the Data Collector/Poller to be used to gather data from this Device.": "Chọn Trình thu thập dữ liệu/Poller sẽ dùng để thu thập dữ liệu từ Thiết bị này."
"Choose the Site that you wish to associate discovered Devices with.": "Chọn Địa điểm mà bạn muốn liên kết với các Thiết bị được dò tìm."
"Daily and Weekly schedules use the start and Rerun Every; Weekly also uses Days of Week. Monthly uses Months and Days of Month; Monthly on Day uses Months, Weeks of Month and Days of Week.": "Lịch Hàng ngày và Hàng tuần sử dụng thời điểm bắt đầu và Chạy lại mỗi; Hàng tuần cũng dùng Các ngày trong tuần. Hàng tháng dùng Các tháng và Các ngày trong tháng; Hàng tháng vào ngày dùng Các tháng, Các tuần trong tháng và Các ngày trong tuần."
"Daily": "Hàng ngày"
"Data Collector": "Thu thập dữ liệu"
"Day(s) of Week": "Các ngày trong tuần"
"Days of Month": "Các ngày trong tháng"
"Days of Week": "Các ngày trong tuần"
"December": "Tháng 12"
"Define the collection frequency.": "Xác định tần suất thu thập."
"Define the number of threads to use for discovering this Network Range.": "Xác định số luồng sử dụng để dò tìm Dải mạng này."
"Discovery Threads": "Số luồng dò tìm"
"Discovery Timing": "Thời gian dò tìm"
