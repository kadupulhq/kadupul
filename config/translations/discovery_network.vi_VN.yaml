"The Email Address to be used as the sender's Email for the Notification Email.  If left blank, the default Automation Notification Email Address is used.": "Địa chỉ Email được dùng làm Email người gửi cho Email thông báo. Nếu để trống, Địa chỉ Email thông báo tự động hóa mặc định sẽ được sử dụng."
"The Email account name to be used as the sender's name for the Notification Email.  If left blank, the default Automation Notification Name is used.": "Tên tài khoản Email được dùng làm tên người gửi cho Email thông báo. Nếu để trống, Tên thông báo tự động hóa mặc định sẽ được sử dụng."
"The Email account to be used to send the Notification Email to.": "Tài khoản Email dùng để gửi Email thông báo tới."
"The discovery network changed since you opened this form. Reload before saving.": "Mạng dò tìm đã thay đổi kể từ khi bạn mở biểu mẫu này. Hãy tải lại trước khi lưu."
"The discovery network form is incomplete.": "Biểu mẫu mạng dò tìm chưa đầy đủ."
"The ranges cover more than %count% addresses.": "Các dải mạng bao phủ hơn %count% địa chỉ."
"The timeout value to use for host ICMP and UDP pinging.  This host SNMP timeout value applies for SNMP pings.": "Giá trị hết thời gian sử dụng cho máy chủ ICMP và ping UDP. Giá trị thời gian chờ SNMP của máy chủ này áp dụng cho ping SNMP."
"The type of ping packet to send.": "Loại gói tin ping sẽ gửi."
