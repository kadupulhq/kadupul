"Discovery network saved.": "Đã lưu mạng dò tìm."
"Edit Discovery Network": "Chỉnh sửa Mạng dò tìm"
"Enable NetBIOS": "Bật NetBIOS"
"Enable this Network Range.": "Bật Dải mạng này."
"Enabled": "Bật"
"Enter DNS servers as IP addresses or host names separated by spaces.": "Nhập các máy chủ DNS dưới dạng địa chỉ IP hoặc tên máy chủ phân tách bằng dấu cách."
"Enter IPs or FQDNs of DNS Servers": "Nhập IP hoặc FQDN của máy chủ DNS"
"Enter a name.": "Nhập tên."
"Enter a valid email address.": "Nhập địa chỉ email hợp lệ."
"Enter a whole number from %min% to %max%.": "Nhập số nguyên từ %min% đến %max%."
"Enter at most %count% bytes.": "Nhập tối đa %count% byte."
"Enter single-line text.": "Nhập văn bản một dòng."
"Enter the start as YYYY-MM-DD HH:MM.": "Nhập thời điểm bắt đầu theo định dạng YYYY-MM-DD HH:MM."
"Enter valid Network Ranges separated by commas.  You may use an IP address, a Network range such as 192.168.1.0/24 or 192.168.1.0/255.255.255.0, or using wildcard notation such as 192.168.*.*": "Nhập các Dải mạng hợp lệ phân tách bằng dấu phẩy. Bạn có thể dùng địa chỉ IP, dải mạng như 192.168.1.0/24 hoặc 192.168.1.0/255.255.255.0, hoặc ký hiệu đại diện như 192.168.*.*"
"Enter valid network ranges separated by commas.": "Nhập các dải mạng hợp lệ phân tách bằng dấu phẩy."
"February": "Tháng 2"
"First": "Đầu tiên"
"For any newly discovered Devices that are reachable using SNMP and who match a Device Rule, add them as Devices.": "Đối với mọi Thiết bị mới được dò tìm có thể truy cập qua SNMP và khớp với một Quy tắc thiết bị, hãy thêm chúng làm Thiết bị."
"Friday": "Thứ sáu"
"General Settings": "Cài đặt chung"
"Give this Network a meaningful name.": "Đặt cho Mạng này một tên có ý nghĩa."
"ICMP Ping": "ICMP Ping"
"If a device previously added is found, rerun its data queries.": "Nếu tìm thấy thiết bị đã được thêm trước đó, hãy chạy lại các truy vấn dữ liệu của nó."
"If checked, when the Automation Network is scanned, a report will be sent to the Notification Email account.": "Nếu được chọn, khi Mạng tự động hóa được quét, một báo cáo sẽ được gửi tới tài khoản Email thông báo."
