"Wednesday": "Thứ tư"
"Week(s) of Month": "Các tuần trong tháng"
"Weekly": "Hàng tuần"
"What Day(s) of the Month will this Network Range be discovered?": "Dải mạng này sẽ được dò tìm vào những ngày nào trong tháng."
"What Day(s) of the week will this Network Range be discovered?": "Dải mạng này sẽ được dò tìm vào những ngày nào trong tuần."
"What Month(s) of the Year will this Network Range be discovered?": "Dải mạng này sẽ được dò tìm vào những tháng nào trong năm."
"What Week(s) of the Month will this Network Range be discovered?": "Dải mạng này sẽ được dò tìm vào những tuần nào trong tháng."
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "Mục dò tìm mạng này sẽ bắt đầu vào thời điểm nào? Hãy nhập theo định dạng YYYY-MM-DD HH:MM."
"When discovering devices, allow duplicate sysnames to be added on different hosts": "Khi dò tìm thiết bị, cho phép thêm các sysName trùng lặp trên các máy chủ khác nhau"
"You must specify both the Months and Days of Month.": "Bạn phải chỉ định cả Các tháng và Các ngày trong tháng."
"You must specify the Months, Weeks of Month, and Days of Week.": "Bạn phải chỉ định Các tháng, Các tuần trong tháng và Các ngày trong tuần."
"You must specify the day of the week.": "Bạn phải chỉ định ngày trong tuần."
