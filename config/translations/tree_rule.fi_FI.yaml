"Optional: Sub-Tree Item": "Valinnainen: alipuun kohde"
"Remove graph-based criteria": "Poista kaaviopohjaiset ehdot"
"Save": "Tallenna"
"Save outcome is uncertain. Reload before retrying.": "Tallennuksen lopputulos on epävarma. Lataa sivu uudelleen ennen uutta yritystä."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Tallenna sääntö ensin; sen kohdevalinta ja puun luontiehdot lisätään sen jälkeen."
"Select": "Valitse"
"Select %name%": "Valitse %name%"
"Select at least one Tree Rule.": "Valitse vähintään yksi puusääntö."
