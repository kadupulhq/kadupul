"A useful name for this Rule.": "Kuvaava nimi tälle säännölle."
"Access denied.": "Pääsy estetty."
"Add Tree Rule": "Lisää puusääntö"
"Back to Tree Rules": "Takaisin puusääntöihin"
"Cancel": "Peruuta"
"Check this box to enable this rule.": "Ota tämä sääntö käyttöön valitsemalla ruutu."
"Choose a Tree for the new Tree Items.": "Valitse puu uusille puun kohteille."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Valitse valitun puun otsikko, johon liitetään, tai sen juuri. Varmista, että se on yhä olemassa, kun tämä sääntö suoritetaan."
"Choose a header of the selected Tree.": "Valitse valitun puun otsikko."
"Choose a listed Graph Grouping Style.": "Valitse luettelossa oleva kaavioiden ryhmittelytyyli."
"Choose a listed Leaf Item Type.": "Valitse luettelossa oleva lehtikohteen tyyppi."
"Choose an existing Tree.": "Valitse olemassa oleva puu."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Valitse, miten kaaviot ryhmitellään piirrettäessä tätä isäntää puussa. Käytetään laitelehdille."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "Poista seuraavat puusäännöt kohdevalintoineen ja puun luontiehtoineen valitsemalla Jatka."
"Click Continue to disable the following Tree Rules.": "Poista seuraavat puusäännöt käytöstä valitsemalla Jatka."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "Monista seuraavat puusäännöt valitsemalla Jatka. Voit halutessasi muuttaa uusien puusääntöjen otsikkomuotoa; ne aloittavat pois käytöstä."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "Ota seuraavat puusäännöt käyttöön valitsemalla Jatka. Varmista, että ne on testattu onnistuneesti."
"Continue": "Jatka"
"Data Query Index": "Tietokyselyn indeksi"
"Delete Tree Rules": "Poista puusäännöt"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "Poiston lopputulos on epävarma. Tarkista puusääntöjen luettelo ennen uutta yritystä."
"Delete selected": "Poista valitut"
"Device": "Laite"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Laitelehdet eivät voi käyttää kaavio- tai kaaviomallisarakkeiden ehtoja. Kun vaihdat lehtikohteen tyypiksi Laite, valitse tämä ruutu poistaaksesi nämä ehdot; niitä ei voi palauttaa."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Laitelehdet eivät voi käyttää kaaviopohjaisia ehtoja. Vahvista %count% ehdon poisto tallentaaksesi."
"Disable Tree Rules": "Poista puusäännöt käytöstä"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "Käytöstä poiston lopputulos on epävarma. Tarkista puusääntöjen luettelo ennen uutta yritystä."
"Disable selected": "Poista valitut käytöstä"
"Duplicate Tree Rules": "Monista puusäännöt"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "Monistuksen lopputulos on epävarma. Tarkista puusääntöjen luettelo ennen uutta yritystä."
"Duplicate selected": "Monista valitut"
"Edit Tree Rule": "Muokkaa puusääntöä"
"Enable Rule": "Ota sääntö käyttöön"
"Enable Tree Rules": "Ota puusäännöt käyttöön"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "Käyttöönoton lopputulos on epävarma. Tarkista puusääntöjen luettelo ennen uutta yritystä."
"Enable selected": "Ota valitut käyttöön"
"Enter a name.": "Anna nimi."
"Enter a valid name format.": "Anna kelvollinen nimimuoto."
"Enter at most %count% characters.": "Anna enintään %count% merkkiä."
"Enter single-line text.": "Anna yksirivinen teksti."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "Jokainen <rule_name> korvataan kopioitavan puusäännön nimellä."
"Graph": "Kaavio"
"Graph Grouping Style": "Kaavioiden ryhmittelytyyli"
"Graph Template": "Kaaviomalli"
