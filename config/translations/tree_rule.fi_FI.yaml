"Select up to %count% rows at a time.": "Valitse kerrallaan enintään %count% riviä."
"The Item Type that shall be dynamically added to the tree.": "Kohteen tyyppi, joka lisätään puuhun dynaamisesti."
"The name format must give every copy a name of 1 to 255 characters.": "Nimimuodon on annettava jokaiselle kopiolle 1-255 merkkiä pitkä nimi."
"The tree rule changed since you opened this form. Reload before saving.": "Puusääntö muuttui sen jälkeen, kun avasit tämän lomakkeen. Lataa sivu uudelleen ennen tallennusta."
"Title Format": "Otsikkomuoto"
"Tree": "Puu"
