"Set an SNMPv3 authentication or privacy protocol together with its passphrase.": "پروتکل احراز هویت یا محرمانگی SNMPv3 را به همراه عبارت عبور آن تنظیم کنید."
"Stored credentials are never displayed. Replacing them sets all four credential fields; leaving SNMP version 3 clears its username and passphrases.": "اعتبارنامه‌های ذخیره‌شده هرگز نمایش داده نمی‌شوند. جایگزینی آن‌ها، هر چهار فیلد اعتبارنامه را تنظیم می‌کند؛ خروج از نسخه 3 SNMP، نام کاربری و عبارت‌های عبور آن را پاک می‌کند."
"Submit every notification receiver field.": "ارسال تمام فیلدهای گیرنده اعلان."
"The notification receiver changed since you opened this form. Reload before saving.": "گیرنده اعلان از زمانی که این فرم را باز کرده‌اید تغییر کرده است. پیش از ذخیره دوباره بارگذاری کنید."
"The passphrases do not match.": "عبارت‌های عبور مطابقت ندارند."
"Unable to load the notification receiver. Reload before retrying.": "امکان بارگذاری گیرنده اعلان وجود ندارد. پیش از تلاش مجدد دوباره بارگذاری کنید."
"Unexpected fields were submitted.": "فیلدهای غیرمنتظره‌ای ارسال شدند."
"Use stored credentials": "استفاده از اعتبارنامه‌های ذخیره‌شده"
