"Accept the license before saving the installation plan.": "ઇન્સ્ટૉલેશન યોજના સાચવતા પહેલાં લાઇસન્સ સ્વીકારો."
"Invalid installation form.": "અમાન્ય ઇન્સ્ટૉલેશન ફોર્મ."
"Access denied.": "પ્રવેશ નકારવામાં આવ્યો."
"Confirm the recovery warning before retrying.": "ફરી પ્રયાસ કરતા પહેલાં પુનઃપ્રાપ્તિ ચેતવણીની પુષ્ટિ કરો."
"Review and confirm the current installation plan.": "વર્તમાન ઇન્સ્ટૉલેશન યોજનાની સમીક્ષા કરો અને પુષ્ટિ કરો."
"Confirm the discovery scope before starting.": "શરૂ કરતા પહેલાં ડિસ્કવરી વ્યાપની પુષ્ટિ કરો."
"Resolve the blocking checks before starting.": "શરૂ કરતા પહેલાં અવરોધક તપાસો ઉકેલો."
"Too many installer options.": "ઘણા બધા ઇન્સ્ટૉલર વિકલ્પો."
"Invalid installer option name.": "અમાન્ય ઇન્સ્ટૉલર વિકલ્પ નામ."
"Unknown or malformed installer option.": "અજ્ઞાત અથવા ખામીયુક્ત ઇન્સ્ટૉલર વિકલ્પ."
"Installer options must be scalar values.": "ઇન્સ્ટૉલર વિકલ્પો સ્કેલર મૂલ્યો હોવા જોઈએ."
"Installer option is too long or contains a null byte.": "ઇન્સ્ટૉલર વિકલ્પ ખૂબ લાંબો છે અથવા તેમાં નલ બાઇટ છે."
"Installer IDs and intervals must be whole numbers.": "ઇન્સ્ટૉલર ID અને અંતરાલ પૂર્ણ સંખ્યાઓ હોવા જોઈએ."
"Installer ID or interval is outside its supported range.": "ઇન્સ્ટૉલર ID અથવા અંતરાલ તેની સમર્થિત શ્રેણીની બહાર છે."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "ઇન્સ્ટૉલેશન આગળ વધી શક્યું નહીં. ફરી પ્રયાસ કરતા પહેલાં તેની સ્થિતિ ફરીથી લોડ કરો અને અવરોધક તપાસોની સમીક્ષા કરો."
"Confirm that the previous worker has stopped before recovering its plan.": "યોજના પુનઃપ્રાપ્ત કરતા પહેલાં પુષ્ટિ કરો કે અગાઉનું વર્કર બંધ થઈ ગયું છે."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "ડેટાબેઝ ઇન્સ્ટૉલ થયો છે, પરંતુ કેટલાક કલેક્ટર્સને હજુ સિંક્રનાઇઝેશનની જરૂર છે. તેમની સ્થિતિ તપાસ્યા પછી અંતિમ કાર્યો ફરી પ્રયાસ કરો."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "ઇન્સ્ટૉલેશન અટકી ગયું. ઇન્સ્ટૉલર લૉગ સાચવો, કારણ સુધારો અને સ્પષ્ટપણે ફરી પ્રયાસની પુષ્ટિ કરો. કેટલાક ડેટાબેઝ ફેરફારો પહેલેથી કમિટ થઈ ગયા હોઈ શકે. ફરી પ્રયાસને અધિકૃત કરતા પહેલાં પ્લગઇન સફાઈ તપાસો."
"Next action": "આગલી ક્રિયા"
"Follow the execution status. Do not start another attempt while a worker is active.": "અમલ સ્થિતિને અનુસરો. વર્કર સક્રિય હોય ત્યારે બીજો પ્રયાસ શરૂ કરશો નહીં."
"Complete the recovery checklist before retrying.": "ફરી પ્રયાસ કરતા પહેલાં પુનઃપ્રાપ્તિ ચેકલિસ્ટ પૂર્ણ કરો."
"Verify collection and graph operation before enabling discovery.": "ડિસ્કવરી સક્ષમ કરતા પહેલાં એકત્રીકરણ અને ગ્રાફ કામગીરી ચકાસો."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "અવરોધિત જરૂરિયાતો ઉકેલો, પછી ફરી તપાસો. સાચવેલી પસંદગીઓ જાળવી રાખવામાં આવી છે."
"Review the planned changes and backup checklist before authorizing execution.": "અમલને અધિકૃત કરતા પહેલાં આયોજિત ફેરફારો અને બૅકઅપ ચેકલિસ્ટની સમીક્ષા કરો."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "એકત્રીકરણ પ્રોફાઇલ પસંદ કરો અને લાઇસન્સ સ્વીકારો. જરૂર પડે ત્યારે વૈકલ્પિક સેટિંગ્સ ખોલી શકાય છે."
