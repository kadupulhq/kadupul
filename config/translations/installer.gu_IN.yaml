"Database privileges": "ડેટાબેઝ વિશેષાધિકારો"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "સક્રિય ભૂમિકાઓ અને ઑબ્જેક્ટ-વિશિષ્ટ અધિકારો સહિત અસરકારક માઇગ્રેશન વિશેષાધિકારો ચકાસાયા નથી."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "ડેટાબેઝ એડમિનિસ્ટ્રેટર પાસે ઇન્સ્ટૉલેશન ખાતા અને સ્કીમા માટે જરૂરી કોષ્ટક લખાણો, સ્કીમા ફેરફારો, ટ્રિગર્સ અને રૂટિન્સ ચકાસાવો. વૈશ્વિક એડમિનિસ્ટ્રેટર વિશેષાધિકારો આપશો નહીં."
"Compare web and worker runtimes": "વેબ અને વર્કર રનટાઇમની સરખામણી કરો"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "આ સ્પષ્ટપણે ટૂંકી ફક્ત-વાંચવા માટેની PHP તપાસ શરૂ કરે છે. તે ઇન્સ્ટૉલર અનામત રાખતી નથી, ફાઇલ્સ લખતી નથી કે ઉપકરણોનો સંપર્ક કરતી નથી."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "તપાસ આ વેબ પ્રક્રિયા પાસેથી વારસો લે છે અને ગોઠવેલ ઇન્સ્ટૉલર PHP ઇન્ટરપ્રિટરનો ઉપયોગ કરે છે. તે અલગ શેડ્યૂલર કે સર્વિસનું નિરીક્ષણ કરતી નથી."
"I authorize the read-only worker runtime comparison.": "હું ફક્ત-વાંચવા માટેની વર્કર રનટાઇમ સરખામણીને અધિકૃત કરું છું."
"Compare runtimes": "રનટાઇમની સરખામણી કરો"
"Runtime comparison results": "રનટાઇમ સરખામણી પરિણામો"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "પરવાનગી અને ઓળખના તફાવતો ઇરાદાપૂર્વક હોઈ શકે. ફક્ત-વાંચવા માટેના અવલોકનો સાબિત કરતા નથી કે લખાણ કે ઇન્સ્ટૉલેશન સફળ થશે."
"Confirm the read-only worker runtime comparison.": "ફક્ત-વાંચવા માટેની વર્કર રનટાઇમ સરખામણીની પુષ્ટિ કરો."
"The runtime comparison is unavailable.": "રનટાઇમ સરખામણી ઉપલબ્ધ નથી."
"Shared application secret": "વહેંચાયેલ એપ્લિકેશન ગુપ્ત"
"A strong web application secret is required before comparison.": "સરખામણી પહેલાં મજબૂત વેબ એપ્લિકેશન ગુપ્ત જરૂરી છે."
"Runtime comparison": "રનટાઇમ સરખામણી"
"The configured worker runtime did not confirm a bounded comparison.": "ગોઠવેલ વર્કર રનટાઇમે મર્યાદિત સરખામણીની પુષ્ટિ કરી નથી."
"The inherited worker secret could not be confirmed against the web secret.": "વારસામાં મળેલ વર્કર ગુપ્તની વેબ ગુપ્ત સામે પુષ્ટિ થઈ શકી નથી."
"PHP runtime comparison": "PHP રનટાઇમ સરખામણી"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "બંને રનટાઇમ PHP 8.4 ને સપોર્ટ કરતા હોવા જોઈએ; અલગ પેચ સંસ્કરણોની સમીક્ષા જરૂરી છે."
"Required extension comparison": "જરૂરી એક્સ્ટેન્શન સરખામણી"
"Required extension availability is checked; differing versions require review.": "જરૂરી એક્સ્ટેન્શન ઉપલબ્ધતા તપાસવામાં આવે છે; અલગ સંસ્કરણોની સમીક્ષા જરૂરી છે."
"Process identity comparison": "પ્રક્રિયા ઓળખ સરખામણી"
"Effective process identity is unavailable on this platform.": "અસરકારક પ્રક્રિયા ઓળખ આ પ્લૅટફૉર્મ પર ઉપલબ્ધ નથી."
"Effective process identities match.": "અસરકારક પ્રક્રિયા ઓળખ મેળ ખાય છે."
"Effective process identities differ; separate service accounts may be intentional.": "અસરકારક પ્રક્રિયા ઓળખ અલગ છે; અલગ સર્વિસ ખાતાં ઇરાદાપૂર્વક હોઈ શકે."
"Directory access comparison": "ડિરેક્ટરી પ્રવેશ સરખામણી"
"Read-only directory permission observations match.": "ફક્ત-વાંચવા માટે ડિરેક્ટરી પરવાનગી અવલોકનો મેળ ખાય છે."
"Directory locations or permission observations differ; review the service-account roles.": "ડિરેક્ટરી સ્થાનો અથવા પરવાનગી અવલોકનો અલગ છે; સર્વિસ ખાતાની ભૂમિકાઓની સમીક્ષા કરો."
"Worker directory read and traversal": "વર્કર ડિરેક્ટરી વાંચન અને ટ્રાવર્સલ"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "જરૂરી વર્કર ડિરેક્ટરીઓ અસ્તિત્વમાં હોવી જોઈએ અને વાંચન તથા ટ્રાવર્સલની મંજૂરી આપવી જોઈએ. કોઈ લખાણનું પરીક્ષણ થયું નથી."
"The inherited worker secret matches the web secret for this private challenge.": "વારસામાં મળેલ વર્કર ગુપ્ત આ ખાનગી ચેલેન્જ માટે વેબ ગુપ્ત સાથે મેળ ખાય છે."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "ગોઠવેલ PHP ઇન્ટરપ્રિટર, જરૂરી એક્સ્ટેન્શન્સ, વારસામાં મળેલ ગુપ્ત અને સર્વિસ ખાતાની ડિરેક્ટરી પરવાનગીઓની સમીક્ષા કરો. કોઈ લખાણ કે ઇન્સ્ટૉલર શરૂઆતનું પરીક્ષણ થયું નથી."
"advisory": "સલાહકારી"
