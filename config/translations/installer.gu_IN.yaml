"I authorize discovery of the displayed range": "હું દર્શાવેલ રેન્જની ડિસ્કવરીને અધિકૃત કરું છું"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "મેં લૉગ તપાસ્યો છે અને પુષ્ટિ કરી છે કે અગાઉનું વર્કર અને તેની ચાઇલ્ડ પ્રક્રિયાઓ બંધ થઈ ગઈ છે"
"I checked the previous attempt and accept that some changes may already be committed": "મેં અગાઉનો પ્રયાસ તપાસ્યો છે અને સ્વીકારું છું કે કેટલાક ફેરફારો પહેલેથી કમિટ થઈ ગયા હોઈ શકે"
"I reviewed this plan and have the required backups": "મેં આ યોજનાની સમીક્ષા કરી છે અને મારી પાસે જરૂરી બૅકઅપ છે"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "જો વર્કર અણધાર્યું અટકી જાય, તો log/cacti.log સાચવો અને સ્પષ્ટપણે ફરી પ્રયાસ કરતા પહેલાં તેની પ્રક્રિયા સમાપ્ત થઈ છે તેની પુષ્ટિ કરો. પ્રતીક્ષા સ્થિતિ સફળ લૉન્ચની પુષ્ટિ કરતી નથી."
