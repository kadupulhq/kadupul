"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "Ο μέγιστος αριθμός προσπαθειών προσέγγισης μιας συσκευής μέσω μιας σειράς ανάγνωσης SNMP πριν από την εγκατάλειψη."
"The maximum number of milliseconds Cacti will wait for an SNMP response (does not work with php-snmp support).": "Ο μέγιστος αριθμός χιλιοστών του δευτερολέπτου που το Cacti θα περιμένει για απόκριση SNMP (δεν λειτουργεί με υποστήριξη php-snmp)."
"The name can be at most 100 characters.": "Το όνομα μπορεί να έχει το πολύ 100 χαρακτήρες."
"This is a unique string that will be matched to a devices sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Αυτή είναι μια μοναδική συμβολοσειρά που θα αντιστοιχιστεί με τη συμβολοσειρά sysDescr μιας συσκευής για να συνδεθεί με αυτό το πρότυπο αυτοματοποίησης. Οποιαδήποτε κανονική έκφραση Perl μπορεί να χρησιμοποιηθεί επιπλέον οποιασδήποτε έκφρασης SQL Where."
"This is a unique string that will be matched to a devices sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Αυτή είναι μια μοναδική συμβολοσειρά που θα αντιστοιχιστεί με τη συμβολοσειρά sysName μιας συσκευής για να συνδεθεί με αυτό το πρότυπο αυτοματοποίησης. Οποιαδήποτε κανονική έκφραση Perl μπορεί να χρησιμοποιηθεί επιπλέον οποιασδήποτε έκφρασης SQL Where."
"This is a unique string that will be matched to a devices sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "Αυτή είναι μια μοναδική συμβολοσειρά που θα αντιστοιχιστεί με τη συμβολοσειρά sysOid μιας συσκευής για να συνδεθεί με αυτό το πρότυπο αυτοματοποίησης. Οποιαδήποτε κανονική έκφραση Perl μπορεί να χρησιμοποιηθεί επιπλέον οποιασδήποτε έκφρασης SQL Where."
