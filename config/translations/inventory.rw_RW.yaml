"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Igenwa ryatoranyijwe rishyirwa kuri buri gikoresho kiri ku rutonde. Impinduka z'inyandikorugero zigumishaho ibishushanyo bisanzwe; uburyo bwikora bushobora guhanga ibishushanyo bishya. Impinduka z'igikusanyamakuru zimurira ububasha bw'ikusanyamakuru ahandi."
