"Selected devices or their graphs and data sources changed. Reload the confirmation before removing devices.": "Ibikoresho byatoranyijwe cyangwa ibishushanyo n'inkomoko z'amakuru byabyo byahindutse. Ongera utangize iyemeza mbere yo gukuraho ibikoresho."
"Shared data sources or aggregate graphs must be detached before removing graphs and data sources.": "Inkomoko z'amakuru zisangiwe cyangwa ibishushanyo bihurije hamwe bigomba gutandukanywa mbere yo gukuraho ibishushanyo n'inkomoko z'amakuru."
"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "Ibyavuye mu ikurwaho ry'igikoresho ntibisobanutse. Genzura ibikoresho byatoranyijwe, ibishushanyo n'inkomoko z'amakuru mbere yo kongera kugerageza."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "Ikurwaho ry'igikoresho ntirishobora gusubizwaho hano. Hitamo niba ugumishaho ibishushanyo n'inkomoko z'amakuru zahagaritswe cyangwa ubikuraho."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "Inkomoko z'amakuru zisangiwe n'ibishushanyo bihurije hamwe bigomba gutandukanywa mbere yo gukuraho igishushanyo. Ibishushanyo n'inkomoko z'amakuru bigumishijweho bisigara bitagira aho bibarizwa."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "Ibikusanyamakuru bya kure birebwa bigomba kuba biri ku murongo. Ikurwaho ritagenze neza rishobora gusiga impinduka za kure cyangwa iz'imigereka; suzuma ibyavuyemo mbere yo kongera kugerageza."
"RRD file cleanup follows the configured maintenance policy.": "Isukura ry'amadosiye ya RRD rikurikiza politiki yo kubungabunga yashyizweho."
"%graphs% graphs, %sources% data sources": "ibishushanyo %graphs%, inkomoko z'amakuru %sources%"
