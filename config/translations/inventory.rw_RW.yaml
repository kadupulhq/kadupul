"Selected device templates synchronized.": "Inyandikorugero z'ibikoresho byatoranyijwe zahujwe."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "Shyira mu bikorwa inyandikorugero ziriho zahawe ibi bikoresho. Amahuza y'ibishushanyo n'ay'amabaza y'amakuru abura arongerwamo, kandi amahuza y'inyandikorugero z'ibishushanyo adakoreshwa ashobora gukurwaho. Ibikoresho bitagira inyandikorugero birasimbukwa. Ibishushanyo bisanzwe n'amakuru y'amateka biragumishwaho; uburyo bwikora bushobora guhanga ibishushanyo bishya."
