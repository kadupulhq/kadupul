"Affected remote collectors must be online. A failed operation may have changed remote devices; verify every selected device before retrying.": "Ibikusanyamakuru bya kure birebwa bigomba kuba biri ku murongo. Igikorwa kitagenze neza gishobora kuba cyahinduye ibikoresho bya kure; genzura buri gikoresho cyatoranyijwe mbere yo kongera kugerageza."
