"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "Subiza ku ntangiriro igihe cyo gusubiza, umubare w'ikusanyamakuru n'uboneka kuri ibi bikoresho. Ibishushanyo, amakuru y'amateka n'amagenamiterere y'igikoresho biragumishwaho. Imibare izongera gutangira mu ikusanyamakuru ritaha."
