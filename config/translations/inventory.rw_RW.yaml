"Changing templates adds their graph and data-query associations and removes unused graph associations. Existing graphs and collected data are retained. Unassigning keeps current associations.": "Guhindura inyandikorugero byongeraho isano yazo n'imbonerahamwe n'ibibazo by'amakuru kandi bigakuraho isano y'imbonerahamwe idakoreshwa. Imbonerahamwe zisanzwe n'amakuru yakusanyijwe birabikwa. Gukuraho inyandikorugero bigumana isano iriho."
"Remote collectors must be online. Reload and verify the device after a failed assignment before retrying.": "Abakusanya amakuru ba kure bagomba kuba bari ku murongo. Ongera utangize kandi ugenzure igikoresho nyuma y'ishyirwaho ritagenze neza mbere yo kongera kugerageza."
