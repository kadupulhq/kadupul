"Apply existing graph and tree automation rules to the selected devices. Rules may create graphs, data sources and tree entries.": "ਚੁਣੇ ਡਿਵਾਈਸਾਂ 'ਤੇ ਮੌਜੂਦਾ ਗ੍ਰਾਫ਼ ਅਤੇ ਟ੍ਰੀ ਆਟੋਮੇਸ਼ਨ ਨਿਯਮ ਲਾਗੂ ਕਰੋ। ਨਿਯਮ ਗ੍ਰਾਫ਼, ਡਾਟਾ ਸਰੋਤ ਅਤੇ ਟ੍ਰੀ ਐਂਟਰੀਆਂ ਬਣਾ ਸਕਦੇ ਹਨ।"
"Only checked SNMP settings are changed. Unchecked settings and credentials retain their current values.": "ਸਿਰਫ਼ ਚੁਣੀਆਂ SNMP ਸੈਟਿੰਗਾਂ ਬਦਲੀਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਨਾ ਚੁਣੀਆਂ ਸੈਟਿੰਗਾਂ ਅਤੇ ਪ੍ਰਮਾਣ-ਪੱਤਰ ਆਪਣੇ ਮੌਜੂਦਾ ਮੁੱਲ ਬਰਕਰਾਰ ਰੱਖਦੇ ਹਨ।"
"Select at least one supported SNMP setting.": "ਘੱਟੋ-ਘੱਟ ਇੱਕ ਸਮਰਥਿਤ SNMP ਸੈਟਿੰਗ ਚੁਣੋ।"
"Invalid location search.": "ਅਵੈਧ ਸਥਾਨ ਖੋਜ।"
