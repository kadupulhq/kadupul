"Action": "Действие"
"Advanced options": "Разширени опции"
"Applying database upgrades": "Прилагане на актуализации на базата данни"
"Back up the database, RRD files, configuration and keys. Database upgrades may commit changes that application rollback cannot undo.": "Направете резервно копие на базата данни, RRD файловете, конфигурацията и ключовете. Актуализациите на базата данни могат да запишат промени, които връщането на приложението не може да отмени."
"Blocked": "Блокирано"
"Check": "Проверка"
"Check again": "Повторна проверка"
"Check collection freshness and collector connectivity before enabling discovery.": "Проверете актуалността на събирането и свързаността на колектора, преди да активирате откриването."
"Check requirements": "Проверка на изискванията"
"Checks inspect this process and filesystem permissions. They do not write test files or contact devices.": "Проверките инспектират този процес и правата върху файловата система. Те не записват тестови файлове и не се свързват с устройства."
"Collection profile": "Профил за събиране"
"Collector": "Колектор"
"Configure": "Конфигуриране"
"Configuring collection profiles": "Конфигуриране на профили за събиране"
"Configuring discovery": "Конфигуриране на откриването"
"Configuring the local device": "Конфигуриране на локалното устройство"
"Confirming database version": "Потвърждаване на версията на базата данни"
"Converting selected tables": "Конвертиране на избраните таблици"
"Database version": "Версия на базата данни"
"Disabled": "Изключен"
"Discovery": "Откриване"
"Discovery SNMP settings": "SNMP настройки за откриване"
"Discovery range": "Обхват на откриване"
"Enable discovery after installation": "Активиране на откриването след инсталация"
"Executable paths": "Пътища на изпълними файлове"
"Execution status": "Състояние на изпълнението"
"Finished execution": "Изпълнението завърши"
"Finishing tasks only. Schema migrations will not be replayed.": "Само довършителни задачи. Миграциите на схемата няма да бъдат изпълнявани повторно."
"I accept the license terms": "Приемам условията на лиценза"
"I authorize discovery of the displayed range": "Упълномощавам откриването в показания обхват"
"I checked the log and confirmed that the previous worker and its child processes have stopped": "Проверих дневника и потвърдих, че предишният фонов процес и дъщерните му процеси са спрели"
"I checked the previous attempt and accept that some changes may already be committed": "Проверих предишния опит и приемам, че някои промени може вече да са записани"
"I reviewed this plan and have the required backups": "Прегледах този план и разполагам с необходимите резервни копия"
"If a worker stops unexpectedly, preserve log/cacti.log and confirm its process has ended before explicitly retrying. A waiting state does not confirm a successful launch.": "Ако фоновият процес спре неочаквано, запазете log/cacti.log и потвърдете, че процесът му е приключил, преди изрично да опитате отново. Състоянието на изчакване не потвърждава успешно стартиране."
"Importing templates": "Импортиране на шаблони"
"Install Kadupul": "Инсталиране на Kadupul"
"Installation and upgrade": "Инсталация и актуализация"
"Installation request was rejected.": "Заявката за инсталация бе отхвърлена."
"Installation steps": "Стъпки на инсталацията"
"Installed": "Инсталирано"
"Keep a backup of the database, RRD files, configuration and secret material.": "Пазете резервно копие на базата данни, RRD файловете, конфигурацията и тайния материал."
"Language": "Език"
"Large tables may require the dedicated CLI conversion tool before installation.": "Големите таблици може да изискват специализирания CLI инструмент за конвертиране преди инсталацията."
"Leave secret fields blank to retain stored credentials. Secrets are never redisplayed.": "Оставете тайните полета празни, за да запазите съхранените идентификационни данни. Тайните никога не се показват повторно."
"License": "Лиценз"
"No action needed": "Не се изисква действие"
"Observed": "Наблюдавано"
"Open the console": "Отваряне на конзолата"
"Operation": "Операция"
"Override discovery SNMP settings": "Презаписване на SNMP настройките за откриване"
"Pass": "Успешно"
"Poller interval in seconds": "Интервал на полера в секунди"
"Preparing CSRF protection": "Подготовка на CSRF защита"
"Progress shows the last recorded phase. Refreshing this page never starts or retries a worker.": "Напредъкът показва последната записана фаза. Опресняването на тази страница никога не стартира и не повтаря фонов процес."
"Recover stopped attempt": "Възстановяване на спрял опит"
"Recovery retains the saved selections and never terminates a live worker. Review the plan again before retrying.": "Възстановяването запазва записаните избори и никога не прекратява активен фонов процес. Прегледайте плана отново, преди да опитате отново."
"Review": "Преглед"
"Review installation plan": "Преглед на плана за инсталация"
"Run": "Изпълнение"
"Run reviewed plan": "Изпълнение на прегледания план"
"Save and review": "Запазване и преглед"
"Scope": "Обхват"
"Status is unavailable. Saved work is retained. Refresh to reconnect; do not submit another installation.": "Състоянието не е налично. Запазената работа е съхранена. Опреснете за повторно свързване; не изпращайте друга инсталация."
"Synchronizing collectors": "Синхронизиране на колекторите"
"Table conversions": "Конвертиране на таблици"
"Templates": "Шаблони"
"The database version matches this application. Installation does not establish that polling is healthy.": "Версията на базата данни съответства на това приложение. Инсталацията не доказва, че обхождането работи изправно."
"The request outcome is unknown. Check execution status before retrying.": "Резултатът от заявката е неизвестен. Проверете състоянието на изпълнението, преди да опитате отново."
"Theme": "Теми"
"Verify": "Проверка"
"Verify the poller schedule and service account.": "Проверете графика на полера и служебния акаунт."
"Version change": "Промяна на версията"
"Waiting for the installation worker": "Изчакване на фоновия процес за инсталация"
"collector": "колектор"
"complete": "завършено"
"failed": "неуспешно"
"finish": "завършване"
"install": "инсталиране"
"not_started": "not_started"
"partial": "частично"
"running": "изпълнява се"
"succeeded": "успешно"
"upgrade": "актуализация"
"waiting": "изчакване"
"Accept the license before saving the installation plan.": "Приемете лиценза, преди да запазите плана за инсталация."
"Invalid installation form.": "Невалиден формуляр за инсталация."
"Access denied.": "Достъпът е отказан."
"Confirm the recovery warning before retrying.": "Потвърдете предупреждението за възстановяване, преди да опитате отново."
"Review and confirm the current installation plan.": "Прегледайте и потвърдете текущия план за инсталация."
"Confirm the discovery scope before starting.": "Потвърдете обхвата на откриване, преди да стартирате."
"Resolve the blocking checks before starting.": "Разрешете блокиращите проверки, преди да започнете."
"Too many installer options.": "Твърде много опции на инсталатора."
"Invalid installer option name.": "Невалидно име на опция на инсталатора."
"Unknown or malformed installer option.": "Неизвестна или неправилно форматирана опция на инсталатора."
"Installer options must be scalar values.": "Опциите на инсталатора трябва да бъдат скаларни стойности."
"Installer option is too long or contains a null byte.": "Опцията на инсталатора е твърде дълга или съдържа нулев байт."
"Installer IDs and intervals must be whole numbers.": "ИД и интервалите на инсталатора трябва да бъдат цели числа."
"Installer ID or interval is outside its supported range.": "ИД на инсталатора или интервалът е извън поддържания диапазон."
"The installation could not proceed. Reload its status and review the blocking checks before retrying.": "Инсталацията не можа да продължи. Презаредете състоянието ѝ и прегледайте блокиращите проверки, преди да опитате отново."
"Confirm that the previous worker has stopped before recovering its plan.": "Потвърдете, че предишният фонов процес е спрял, преди да възстановите плана му."
"The database is installed, but some collectors still need synchronization. Retry the finishing tasks after checking their status.": "Базата данни е инсталирана, но някои колектори все още се нуждаят от синхронизация. Повторете довършителните задачи, след като проверите състоянието им."
"Installation stopped. Preserve the installer log, correct the cause and explicitly confirm a retry. Some database changes may already be committed. Check plugin cleanup before authorizing a retry.": "Инсталацията спря. Запазете дневника на инсталатора, отстранете причината и изрично потвърдете повторен опит. Някои промени в базата данни може вече да са записани. Проверете почистването на приставките, преди да разрешите повторен опит."
"Next action": "Следващо действие"
"Follow the execution status. Do not start another attempt while a worker is active.": "Следете състоянието на изпълнението. Не стартирайте друг опит, докато има активен фонов процес."
"Complete the recovery checklist before retrying.": "Попълнете контролния списък за възстановяване, преди да опитате отново."
"Verify collection and graph operation before enabling discovery.": "Проверете събирането и работата на графиките, преди да активирате откриването."
"Resolve the blocked requirements, then check again. Saved selections are retained.": "Разрешете блокираните изисквания, след което проверете отново. Записаните избори се запазват."
"Review the planned changes and backup checklist before authorizing execution.": "Прегледайте планираните промени и контролния списък за архивиране, преди да разрешите изпълнението."
"Choose a collection profile and accept the license. Optional settings can be opened when needed.": "Изберете профил за събиране и приемете лиценза. Незадължителните настройки могат да се отворят при нужда."
"Download installation diagnostics": "Изтегляне на диагностика на инсталацията"
"Open a graph and confirm that its RRD data updates after a poller cycle.": "Отворете графика и потвърдете, че нейните RRD данни се актуализират след цикъл на полера."
"Requirement details": "Подробности за изискванията"
"Recover": "Възстановяване"
"Recovery checklist": "Контролен списък за възстановяване"
"Preserve log/cacti.log and record the failed attempt.": "Запазете log/cacti.log и запишете неуспешния опит."
"Confirm that the previous worker and its child processes have stopped.": "Потвърдете, че предишният фонов процес и дъщерните му процеси са спрели."
"Inspect committed changes, collector synchronization and plugin cleanup. Correct the cause before retrying.": "Проверете записаните промени, синхронизацията на колекторите и почистването на приставките. Отстранете причината, преди да опитате отново."
"Review the saved plan again, then explicitly authorize a retry.": "Прегледайте записания план отново, след което изрично разрешете повторен опит."
"Recover a stopped worker": "Възстановяване на спрял фонов процес"
"Use recovery only after confirming that this attempt is no longer running. Recovery does not stop a process.": "Използвайте възстановяването само след като потвърдите, че този опит вече не се изпълнява. Възстановяването не спира процес."
"Collector and installation mode": "Колектор и режим на инсталиране"
"The deployment configuration determines the collector role and database connections. Verify the primary server configuration before starting a collector.": "Конфигурацията на внедряването определя ролята на колектора и връзките с базата данни. Проверете конфигурацията на основния сървър, преди да стартирате колектор."
"Discovery and SNMP settings": "Настройки за откриване и SNMP"
"Keep discovery disabled until collection and collector connectivity have been verified.": "Дръжте откриването деактивирано, докато събирането и свързаността на колекторите не бъдат проверени."
"Template selection": "Избор на шаблон"
"Templates selected for import": "Шаблони, избрани за импортиране"
"No templates selected.": "Няма избрани шаблони."
"Backup checklist": "Контролен списък за архивиране"
"Database backup and a tested restoration procedure.": "Резервно копие на базата данни и тествана процедура за възстановяване."
"RRD files and the service account permissions needed to restore them.": "RRD файловете и правата на служебния акаунт, необходими за възстановяването им."
"Configuration, keys and plugin data outside the database.": "Конфигурация, ключове и данни на приставките извън базата данни."
"Post-installation checks": "Слединсталационни проверки"
"Verified checks cover only the evidence shown. Unassessed checks still require operator verification.": "Потвърдените проверки обхващат само показаните доказателства. Неоценените проверки все още изискват потвърждение от оператор."
"Operational checks still require operator verification.": "Оперативните проверки все още изискват потвърждение от оператор."
"Status": "Статус"
"verified": "проверено"
"action_required": "Action required"
"not_assessed": "Not assessed"
"Database schema": "Схема на базата данни"
"Stored schema matches the application target.": "Съхранената схема съответства на целевата за приложението."
"Target schema completion has not been confirmed.": "Завършването на целевата схема не е потвърдено."
"Review the installation outcome and resolve failures before considering the schema upgrade complete.": "Прегледайте резултата от инсталацията и отстранете грешките, преди да счетете актуализацията на схемата за завършена."
"Installation outcome": "Резултат от инсталацията"
"A successful receipt matches the current target schema.": "Успешното потвърждение съответства на текущата целева схема."
"A complete successful installation outcome has not been confirmed.": "Не е потвърден пълен успешен резултат от инсталацията."
"Preserve the installer log and use the explicit recovery or retry procedure when required.": "Запазете дневника на инсталатора и използвайте изричната процедура за възстановяване или повторен опит, когато е необходимо."
"Collector synchronization": "Синхронизация на колектори"
"The completed installer reports pending collector synchronization.": "Завършилият инсталатор докладва чакаща синхронизация на колектори."
"The completed installer reports no pending collectors.": "Завършилият инсталатор докладва, че няма чакащи колектори."
"Collector completion remains unconfirmed by this partial receipt.": "Завършването на колектора остава непотвърдено от това частично потвърждение."
"Collector completion is not established by this installation outcome.": "Завършването на колектора не е потвърдено от този резултат от инсталацията."
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "Прегледайте състоянието на колекторите и повторете довършителните задачи при частични резултати. Това не проверява последващата актуалност на събирането."
"Scheduled collection": "Планирано събиране"
"No poller or device was contacted by this assessment.": "Тази оценка не се е свързвала с нито един полер или устройство."
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "Потвърдете, че конфигурираният планировчик стартира полера под предвидения служебен акаунт, и прегледайте следващия му нормален цикъл."
"Graph data": "Данни на графиката"
"Live samples and RRD updates were not exercised.": "Актуалните измервания и RRD актуализациите не са тествани."
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "След нормален цикъл на събиране проверете дали очакваните графики получават нови измервания и прегледайте грешките на полера."
"Recovery readiness": "Готовност за възстановяване"
"Backup restoration was not exercised.": "Възстановяването от резервно копие не е тествано."
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "Проверете изолирано възстановяване на базата данни, RRD файловете, конфигурацията и ключовия материал, преди да разчитате на възстановяването."
"No persisted local poller start has been recorded.": "Не е записано запазено стартиране на локален полер."
"Persisted poller timing is invalid and cannot establish scheduler health.": "Запазеното време на полера е невалидно и не може да установи изправността на планировчика."
"The recorded poller start is in the future. Check clock synchronization.": "Записаното стартиране на полера е в бъдещето. Проверете синхронизацията на часовника."
"The recorded poller start is older than the native scheduling tolerance.": "Записаното стартиране на полера е по-старо от стандартния толеранс на планирането."
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "Записано е стартиране на локален полер в рамките на стандартния толеранс на планирането. Завършването и изправността на устройствата не са проверени."
"readable": "четим"
"missing or unreadable": "липсва или е нечетим"
"Restore the complete release and its locked dependencies; grant the service account read access.": "Възстановете пълното издание и заключените му зависимости; предоставете на служебния акаунт права за четене."
"PHP temporary directory": "Временна директория на PHP"
"directory writable by this process": "директория с права за запис от този процес"
"missing or not writable": "липсва или няма права за запис"
"Configure sys_temp_dir as an existing directory writable by the installation account. Native imports use temporary files.": "Конфигурирайте sys_temp_dir като съществуваща директория с права за запис от акаунта за инсталация. Локалните импорти използват временни файлове."
"Background worker launch": "Стартиране на фоновия процес"
"required PHP functions available; launch not exercised": "необходимите PHP функции са налични; стартирането не е тествано"
"required PHP launch function disabled": "необходимата PHP функция за стартиране е деактивирана"
"Enable exec for the web PHP runtime, or use the authorized CLI installer.": "Активирайте exec за уеб средата на PHP или използвайте оторизирания CLI инсталатор."
"Enable popen, pclose for the web PHP runtime, or use the authorized CLI installer.": "Активирайте popen, pclose за уеб средата на PHP или използвайте оторизирания CLI инсталатор."
"Database transaction ownership": "Притежание на трансакция в базата данни"
"autocommit enabled; no caller-owned transaction": "autocommit е активиран; няма трансакция, притежавана от извикващия"
"autocommit disabled or caller transaction active": "autocommit е деактивиран или е активна трансакция на извикващия"
"Run installation outside a caller-owned transaction and enable autocommit on its mutation connection.": "Изпълнете инсталацията извън трансакция, притежавана от извикващия, и активирайте autocommit за връзката ѝ за промени."
"Restore the release directory and grant the installation account write access for template resource imports. Do not make it world-writable.": "Възстановете директорията на изданието и предоставете на инсталационния акаунт права за запис за импортиране на ресурси на шаблони. Не я правете достъпна за запис от всички."
"Worker file: install/background.php": "Файл на фоновия процес: install/background.php"
"Worker file: bin/legacy-installer.php": "Файл на фоновия процес: bin/legacy-installer.php"
"Worker file: include/vendor/autoload.php": "Файл на фоновия процес: include/vendor/autoload.php"
"Import destination: resource/snmp_queries": "Дестинация за импортиране: resource/snmp_queries"
"Import destination: resource/script_server": "Дестинация за импортиране: resource/script_server"
"Import destination: resource/script_queries": "Дестинация за импортиране: resource/script_queries"
"Import destination: scripts": "Дестинация за импортиране: scripts"
"Database privileges": "Права върху базата данни"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "Действителните права за миграция, включително активните роли и специфичните за обекти права, не са проверени."
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "Поискайте от администратора на базата данни да провери изискваните записи в таблици, промени в схемата, тригери и процедури за инсталационния акаунт и схема. Не предоставяйте глобални администраторски права."
"Compare web and worker runtimes": "Сравняване на уеб и фоновата среда за изпълнение"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "Това изрично стартира кратка PHP проверка само за четене. То не резервира инсталатор, не записва файлове и не се свързва с устройства."
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "Проверката наследява този уеб процес и използва конфигурирания PHP интерпретатор на инсталатора. Тя не проверява отделен планировчик или услуга."
"I authorize the read-only worker runtime comparison.": "Упълномощавам сравнението само за четене на фоновата среда за изпълнение."
"Compare runtimes": "Сравняване на средите за изпълнение"
"Runtime comparison results": "Резултати от сравнението на средите за изпълнение"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "Разликите в правата и идентичностите може да са преднамерени. Наблюденията само за четене не доказват, че записите или инсталацията ще бъдат успешни."
"Confirm the read-only worker runtime comparison.": "Потвърдете сравнението само за четене на фоновата среда за изпълнение."
"The runtime comparison is unavailable.": "Сравнението на средите за изпълнение не е налично."
"Shared application secret": "Споделена тайна на приложението"
"A strong web application secret is required before comparison.": "Преди сравнението се изисква силна тайна на уеб приложението."
"Runtime comparison": "Сравнение на средите за изпълнение"
"The configured worker runtime did not confirm a bounded comparison.": "Конфигурираната фонова среда за изпълнение не потвърди ограничено сравнение."
"The inherited worker secret could not be confirmed against the web secret.": "Наследената тайна на фоновия процес не можа да бъде потвърдена спрямо уеб тайната."
"PHP runtime comparison": "Сравнение на PHP средите за изпълнение"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "И двете среди за изпълнение трябва да поддържат PHP 8.4; различаващите се корекционни версии изискват преглед."
"Required extension comparison": "Сравнение на изискваните разширения"
"Required extension availability is checked; differing versions require review.": "Проверява се наличността на изискваните разширения; различаващите се версии изискват преглед."
"Process identity comparison": "Сравнение на идентичността на процесите"
"Effective process identity is unavailable on this platform.": "Действителната идентичност на процеса не е налична на тази платформа."
"Effective process identities match.": "Действителните идентичности на процесите съвпадат."
"Effective process identities differ; separate service accounts may be intentional.": "Действителните идентичности на процесите се различават; отделни служебни акаунти може да са преднамерени."
"Directory access comparison": "Сравнение на достъпа до директории"
"Read-only directory permission observations match.": "Наблюденията за права върху директории само за четене съвпадат."
"Directory locations or permission observations differ; review the service-account roles.": "Местоположенията на директориите или наблюденията върху правата се различават; прегледайте ролите на служебните акаунти."
"Worker directory read and traversal": "Четене и обхождане на директорията на фоновия процес"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "Изискваните директории на фоновия процес трябва да съществуват и да позволяват четене и обхождане. Не са тествани записи."
"The inherited worker secret matches the web secret for this private challenge.": "Наследената тайна на фоновия процес съответства на уеб тайната за това частно предизвикателство."
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "Прегледайте конфигурирания PHP интерпретатор, изискваните разширения, наследената тайна и правата върху директории на служебния акаунт. Не са извършвани записи или стартиране на инсталатора."
"advisory": "препоръчително"
