"A useful name for this Rule.": "આ નિયમ માટે ઉપયોગી નામ."
"Access denied.": "પ્રવેશ નકારવામાં આવ્યો."
"Add Tree Rule": "ટ્રી નિયમ ઉમેરો"
"Back to Tree Rules": "ટ્રી નિયમો પર પાછા જાઓ"
"Cancel": "રદ કરો"
"Check this box to enable this rule.": "આ નિયમ સક્ષમ કરવા આ બૉક્સ ચેક કરો."
"Choose a Tree for the new Tree Items.": "નવી ટ્રી આઇટમ્સ માટે ટ્રી પસંદ કરો."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "જોડવા માટે પસંદ કરેલ ટ્રીનું હેડર, અથવા તેનું રૂટ, પસંદ કરો. આ નિયમ ચલાવાય ત્યારે તે હજુ અસ્તિત્વમાં છે તેની ખાતરી કરો."
"Choose a header of the selected Tree.": "પસંદ કરેલ ટ્રીનું હેડર પસંદ કરો."
"Choose a listed Graph Grouping Style.": "યાદીમાંથી ગ્રાફ જૂથ શૈલી પસંદ કરો."
"Choose a listed Leaf Item Type.": "યાદીમાંથી લીફ આઇટમ પ્રકાર પસંદ કરો."
"Choose an existing Tree.": "હાલનું ટ્રી પસંદ કરો."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "ટ્રી પર આ ચોક્કસ હોસ્ટ માટે દોરતી વખતે ગ્રાફ્સ કેવી રીતે જૂથબદ્ધ થાય તે પસંદ કરો. ઉપકરણ લીફ્સ માટે વપરાય છે."
"Click Continue to delete the following Tree Rules with their Object Selection and Tree Creation Criteria.": "નીચેના ટ્રી નિયમો તેમની ઑબ્જેક્ટ પસંદગી અને ટ્રી બનાવટ માપદંડ સાથે કાઢી નાખવા માટે ચાલુ રાખો પર ક્લિક કરો."
"Click Continue to disable the following Tree Rules.": "નીચેના ટ્રી નિયમો અક્ષમ કરવા માટે ચાલુ રાખો પર ક્લિક કરો."
"Click Continue to duplicate the following Tree Rules. You can optionally change the title format for the new Tree Rules, which start disabled.": "નીચેના ટ્રી નિયમોની નકલ કરવા માટે ચાલુ રાખો પર ક્લિક કરો. તમે નવા ટ્રી નિયમો માટે શીર્ષક ફોર્મેટ વૈકલ્પિક રીતે બદલી શકો છો, જે અક્ષમ તરીકે શરૂ થાય છે."
"Click Continue to enable the following Tree Rules. Make sure that they have been tested successfully.": "નીચેના ટ્રી નિયમો સક્ષમ કરવા માટે ચાલુ રાખો પર ક્લિક કરો. ખાતરી કરો કે તેમનું સફળતાપૂર્વક પરીક્ષણ થયું છે."
"Continue": "ચાલુ રાખો"
"Data Query Index": "ડેટા ક્વેરી ઇન્ડેક્સ"
"Delete Tree Rules": "ટ્રી નિયમો કાઢી નાખો"
"Delete outcome is uncertain. Check the Tree Rule list before retrying.": "કાઢી નાખવાનું પરિણામ અનિશ્ચિત છે. ફરી પ્રયાસ કરતા પહેલાં ટ્રી નિયમ યાદી તપાસો."
"Delete selected": "પસંદ કરેલ કાઢી નાખો"
"Device": "ઉપકરણ"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "ઉપકરણ લીફ્સ ગ્રાફ અથવા ગ્રાફ ટેમ્પ્લેટ કૉલમ્સ પરના માપદંડનો ઉપયોગ કરી શકતા નથી. લીફ આઇટમ પ્રકાર ઉપકરણમાં બદલતી વખતે, તે માપદંડ દૂર કરવા આ બૉક્સ ચેક કરો; તે પાછા મેળવી શકાતા નથી."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "ઉપકરણ લીફ્સ ગ્રાફ-આધારિત માપદંડનો ઉપયોગ કરી શકતા નથી. સાચવવા માટે %count% માપદંડ દૂર કરવાની પુષ્ટિ કરો."
"Disable Tree Rules": "ટ્રી નિયમો અક્ષમ કરો"
"Disable outcome is uncertain. Check the Tree Rule list before retrying.": "અક્ષમ કરવાનું પરિણામ અનિશ્ચિત છે. ફરી પ્રયાસ કરતા પહેલાં ટ્રી નિયમ યાદી તપાસો."
"Disable selected": "પસંદ કરેલ અક્ષમ કરો"
"Duplicate Tree Rules": "ટ્રી નિયમોની નકલ કરો"
"Duplicate outcome is uncertain. Check the Tree Rule list before retrying.": "નકલનું પરિણામ અનિશ્ચિત છે. ફરી પ્રયાસ કરતા પહેલાં ટ્રી નિયમ યાદી તપાસો."
"Duplicate selected": "પસંદ કરેલની નકલ કરો"
