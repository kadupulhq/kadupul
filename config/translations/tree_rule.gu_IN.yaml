"Enable Rule": "નિયમ સક્ષમ કરો"
"Enable Tree Rules": "ટ્રી નિયમો સક્ષમ કરો"
"Enable outcome is uncertain. Check the Tree Rule list before retrying.": "સક્ષમ કરવાનું પરિણામ અનિશ્ચિત છે. ફરી પ્રયાસ કરતા પહેલાં ટ્રી નિયમ યાદી તપાસો."
"Enable selected": "પસંદ કરેલ સક્ષમ કરો"
"Enter a name.": "નામ દાખલ કરો."
"Enter a valid name format.": "માન્ય નામ ફોર્મેટ દાખલ કરો."
"Enter at most %count% characters.": "વધુમાં વધુ %count% અક્ષરો દાખલ કરો."
"Enter single-line text.": "એક લીટીનું ટેક્સ્ટ દાખલ કરો."
"Every <rule_name> is replaced by the name of the Tree Rule being copied.": "દરેક <rule_name> ની જગ્યાએ કૉપી થઈ રહેલા ટ્રી નિયમનું નામ મૂકવામાં આવે છે."
"Graph": "ગ્રાફ"
"Graph Grouping Style": "ગ્રાફ જૂથ શૈલી"
"Graph Template": "ગ્રાફ ટેમ્પ્લેટ"
"Invalid Tree Rule selection.": "અમાન્ય ટ્રી નિયમ પસંદગી."
"Leaf Item Type": "લીફ આઇટમ પ્રકાર"
"Name": "નામ"
"Object Selection and Tree Creation Criteria": "ઑબ્જેક્ટ પસંદગી અને ટ્રી બનાવટ માપદંડ"
"One or more selected Tree Rules no longer exist.": "પસંદ કરેલા એક અથવા વધુ ટ્રી નિયમો હવે અસ્તિત્વમાં નથી."
"Optional: Sub-Tree Item": "વૈકલ્પિક: સબ-ટ્રી આઇટમ"
"Remove graph-based criteria": "ગ્રાફ-આધારિત માપદંડ દૂર કરો"
"Save": "સાચવો"
"Save outcome is uncertain. Reload before retrying.": "સાચવવાનું પરિણામ અનિશ્ચિત છે. ફરી પ્રયાસ કરતા પહેલાં ફરીથી લોડ કરો."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "પહેલાં નિયમ સાચવો; તેની ઑબ્જેક્ટ પસંદગી અને ટ્રી બનાવટ માપદંડ પછીથી ઉમેરવામાં આવે છે."
"Select": "પસંદ કરો"
"Select %name%": "%name% પસંદ કરો"
"Select at least one Tree Rule.": "ઓછામાં ઓછો એક ટ્રી નિયમ પસંદ કરો."
"Select at most 100 Tree Rules at a time.": "એક સમયે વધુમાં વધુ 100 ટ્રી નિયમો પસંદ કરો."
"Select up to %count% rows at a time.": "એક સમયે %count% પંક્તિઓ સુધી પસંદ કરો."
"The Item Type that shall be dynamically added to the tree.": "ટ્રીમાં ગતિશીલ રીતે ઉમેરવાનો આઇટમ પ્રકાર."
"The name format must give every copy a name of 1 to 255 characters.": "નામ ફોર્મેટે દરેક નકલને 1 થી 255 અક્ષરોનું નામ આપવું જોઈએ."
"The tree rule changed since you opened this form. Reload before saving.": "તમે આ ફોર્મ ખોલ્યું ત્યારથી ટ્રી નિયમ બદલાયો છે. સાચવતા પહેલાં ફરીથી લોડ કરો."
"Title Format": "શીર્ષક ફોર્મેટ"
"Tree": "ટ્રી"
"Tree Rule Selection [edit: %name%]": "ટ્રી નિયમ પસંદગી [સંપાદન: %name%]"
"Tree Rules Selection [new]": "ટ્રી નિયમો પસંદગી [નવી]"
"Tree rule not found.": "ટ્રી નિયમ મળ્યો નથી."
"Tree rule saved.": "ટ્રી નિયમ સાચવવામાં આવ્યો."
"Unable to load Tree Rules. Reload before retrying.": "ટ્રી નિયમો લોડ કરી શકાયા નથી. ફરી પ્રયાસ કરતા પહેલાં ફરીથી લોડ કરો."
"Unable to load the tree rule. Reload before retrying.": "ટ્રી નિયમ લોડ કરી શકાયો નથી. ફરી પ્રયાસ કરતા પહેલાં ફરીથી લોડ કરો."
"Unexpected fields were submitted.": "અનપેક્ષિત ફીલ્ડ્સ સબમિટ કરવામાં આવ્યા."
