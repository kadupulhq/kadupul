"A description for this data query.": "ఈ డేటా క్వెరీ కోసం వివరణ."
"A name for this data query.": "ఈ డేటా క్వెరీ కోసం పేరు."
"Access denied.": "యాక్సెస్ నిరాకరించబడింది."
"Add Data Query": "డేటా క్వెరీని జోడించు"
"Associated Graph Templates": "అనుబంధిత గ్రాఫ్ టెంప్లేట్లు"
"Back to Data Queries": "డేటా క్వెరీలకు తిరిగి వెళ్ళు"
"Choose a Data Input Method": "డేటా ఇన్‌పుట్ పద్ధతిని ఎంచుకోండి"
"Choose an existing Data Input Method.": "ఇప్పటికే ఉన్న డేటా ఇన్‌పుట్ పద్ధతిని ఎంచుకోండి."
"Choose the input method for this Data Query.  This input method defines how data is collected for each Device associated with the Data Query.": "ఈ డేటా క్వెరీ కోసం ఇన్‌పుట్ పద్ధతిని ఎంచుకోండి. డేటా క్వెరీతో అనుబంధించబడిన ప్రతి పరికరం కోసం డేటా ఎలా సేకరించబడుతుందో ఈ ఇన్‌పుట్ పద్ధతి నిర్వచిస్తుంది."
"Could not locate XML file.": "XML ఫైల్‌ను గుర్తించలేకపోయింది."
"Data Input Method": "డేటా ఇన్‌పుట్ పద్ధతి"
"Data Queries [edit: %name%]": "డేటా క్వెరీలు [సవరణ: %name%]"
"Data Queries [new]": "డేటా క్వెరీలు [కొత్తది]"
"Data query not found.": "డేటా క్వెరీ కనుగొనబడలేదు."
"Data query saved, but a Remote Data Collector was down and did not receive the poller cache change. Perform a Full Sync once it is up again.": "డేటా క్వెరీ సేవ్ చేయబడింది, కానీ ఒక రిమోట్ డేటా కలెక్టర్ డౌన్‌లో ఉన్నందున పోలర్ క్యాష్ మార్పును అందుకోలేదు. అది మళ్లీ ప్రారంభమైన తర్వాత Full Sync నిర్వహించండి."
"Data query saved.": "డేటా క్వెరీ సేవ్ చేయబడింది."
"Description": "వివరణ"
"Edit Data Query": "డేటా క్వెరీని సవరించు"
"Enter a value.": "విలువను నమోదు చేయండి."
"Enter at most %count% characters.": "గరిష్టంగా %count% అక్షరాలు నమోదు చేయండి."
"Enter single-line text.": "సింగిల్-లైన్ టెక్స్ట్‌ను నమోదు చేయండి."
"Enter the path of a readable XML file under the resource directory.": "రిసోర్స్ డైరెక్టరీ క్రింద చదవగలిగే XML ఫైల్ మార్గాన్ని నమోదు చేయండి."
"Invalid command.": "చెల్లని కమాండ్."
"Name": "పేరు"
"Save": "సేవ్ చేయి"
"Save outcome is uncertain. Reload before retrying.": "సేవ్ ఫలితం అనిశ్చితంగా ఉంది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Save the data query first; its Graph Templates are associated afterwards.": "ముందుగా డేటా క్వెరీని సేవ్ చేయండి; దాని గ్రాఫ్ టెంప్లేట్లు ఆ తర్వాత అనుబంధించబడతాయి."
"Successfully located XML file": "XML ఫైల్ విజయవంతంగా గుర్తించబడింది"
"The data query changed since you opened this form. Reload before saving.": "మీరు ఈ ఫారమ్‌ను తెరిచిన తర్వాత డేటా క్వెరీ మారింది. సేవ్ చేసే ముందు మళ్లీ లోడ్ చేయండి."
"The full path to the XML file containing definitions for this data query.": "ఈ డేటా క్వెరీ కోసం నిర్వచనాలను కలిగి ఉన్న XML ఫైల్‌కు పూర్తి మార్గం."
"Unable to load the data query. Reload before retrying.": "డేటా క్వెరీని లోడ్ చేయలేకపోయింది. మళ్లీ ప్రయత్నించే ముందు మళ్లీ లోడ్ చేయండి."
"Unexpected fields were submitted.": "ఊహించని ఫీల్డ్‌లు సమర్పించబడ్డాయి."
"XML Path": "XML మార్గం"
