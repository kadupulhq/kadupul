"The Data Source Profile changed since you opened this form. Reload before saving.": "ਇਹ ਫ਼ਾਰਮ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ ਡਾਟਾ ਸਰੋਤ ਪ੍ਰੋਫ਼ਾਈਲ ਬਦਲ ਗਈ ਹੈ। ਸੰਭਾਲਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The RRA changed since you opened this form. Reload before saving.": "ਇਹ ਫ਼ਾਰਮ ਖੋਲ੍ਹਣ ਤੋਂ ਬਾਅਦ RRA ਬਦਲ ਗਿਆ ਹੈ। ਸੰਭਾਲਣ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"The amount of unknown data that can still be regarded as known.": "ਅਗਿਆਤ ਡਾਟਾ ਦੀ ਉਹ ਮਾਤਰਾ ਜਿਸਨੂੰ ਫਿਰ ਵੀ ਜਾਣਿਆ-ਪਛਾਣਿਆ ਮੰਨਿਆ ਜਾ ਸਕਦਾ ਹੈ।"
"The default Data Source Profile cannot be deleted.": "ਮੂਲ ਡਾਟਾ ਸਰੋਤ ਪ੍ਰੋਫ਼ਾਈਲ ਮਿਟਾਈ ਨਹੀਂ ਜਾ ਸਕਦੀ।"
"The default profile and profiles in use by Data Templates or Data Sources cannot be deleted.": "ਮੂਲ ਪ੍ਰੋਫ਼ਾਈਲ ਅਤੇ ਡਾਟਾ ਟੈਮਪਲੇਟਾਂ ਜਾਂ ਡਾਟਾ ਸਰੋਤਾਂ ਦੁਆਰਾ ਵਰਤੀਆਂ ਜਾ ਰਹੀਆਂ ਪ੍ਰੋਫ਼ਾਈਲਾਂ ਮਿਟਾਈਆਂ ਨਹੀਂ ਜਾ ਸਕਦੀਆਂ।"
"The frequency that data will be collected from the Data Source.": "ਡਾਟਾ ਸਰੋਤ ਤੋਂ ਡਾਟਾ ਇਕੱਤਰ ਕਰਨ ਦੀ ਵਾਰਵਾਰਤਾ।"
"The number of samples required prior to filling a row in the RRA specification.  The first RRA should always have a value of 1.": "RRA ਵਿਸ਼ੇਸ਼ਤਾ ਵਿੱਚ ਇੱਕ ਕਤਾਰ ਭਰਨ ਤੋਂ ਪਹਿਲਾਂ ਲੋੜੀਂਦੇ ਨਮੂਨਿਆਂ ਦੀ ਗਿਣਤੀ। ਪਹਿਲੇ RRA ਦਾ ਮੁੱਲ ਹਮੇਸ਼ਾ 1 ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ।"
"The polling interval, X-Files Factor, Consolidation Functions and RRAs cannot be changed.": "ਪੋਲਿੰਗ ਅੰਤਰਾਲ, X-Files ਫੈਕਟਰ, ਕੰਸੋਲੀਡੇਸ਼ਨ ਫੰਕਸ਼ਨ ਅਤੇ RRA ਬਦਲੇ ਨਹੀਂ ਜਾ ਸਕਦੇ।"
"This legacy Data Source Profile form has expired. Open Data Source Profiles and submit a new form.": "ਇਸ ਪੁਰਾਣੇ ਡਾਟਾ ਸਰੋਤ ਪ੍ਰੋਫ਼ਾਈਲ ਫ਼ਾਰਮ ਦੀ ਮਿਆਦ ਪੁੱਗ ਗਈ ਹੈ। ਡਾਟਾ ਸਰੋਤ ਪ੍ਰੋਫ਼ਾਈਲਾਂ ਖੋਲ੍ਹੋ ਅਤੇ ਨਵਾਂ ਫ਼ਾਰਮ ਜਮ੍ਹਾਂ ਕਰੋ।"
"Title Format": "ਸਿਰਲੇਖ ਫ਼ਾਰਮੈਟ"
"To change the default, mark another profile as the default.": "ਮੂਲ ਬਦਲਣ ਲਈ ਕਿਸੇ ਹੋਰ ਪ੍ਰੋਫ਼ਾਈਲ ਨੂੰ ਮੂਲ ਵਜੋਂ ਚਿੰਨ੍ਹਿਤ ਕਰੋ।"
"Unable to load Data Source Profiles. Reload before retrying.": "ਡਾਟਾ ਸਰੋਤ ਪ੍ਰੋਫ਼ਾਈਲਾਂ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕੀਆਂ। ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਰੀਲੋਡ ਕਰੋ।"
"Unexpected fields were submitted.": "ਅਣਕਿਆਸੇ ਖੇਤਰ ਜਮ੍ਹਾਂ ਕੀਤੇ ਗਏ।"
"When viewing a Graph based upon the RRA in question, the default Timespan to show for that Graph.": "ਸੰਬੰਧਿਤ RRA ਉੱਤੇ ਆਧਾਰਿਤ ਗ੍ਰਾਫ਼ ਦੇਖਣ ਵੇਲੇ, ਉਸ ਗ੍ਰਾਫ਼ ਲਈ ਦਿਖਾਈ ਜਾਣ ਵਾਲੀ ਮੂਲ ਸਮਾਂ-ਸੀਮਾ।"
