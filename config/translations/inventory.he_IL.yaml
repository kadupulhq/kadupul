"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "השיוך שנבחר מוחל על כל התקן ברשימה. שינויי תבנית שומרים על גרפים קיימים; אוטומציה עשויה ליצור גרפים חדשים. שינויי אוסף נתונים מעבירים את בעלות הדגימה."
