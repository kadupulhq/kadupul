"Device removal outcome is uncertain. Check selected devices, graphs and data sources before retrying.": "תוצאת הסרת ההתקן אינה ודאית. בדוק את ההתקנים, הגרפים ומקורות הנתונים שנבחרו לפני שתנסה שוב."
"Device removal cannot be undone here. Choose whether to retain graphs and disabled data sources or remove them.": "הסרת התקן אינה ניתנת לביטול כאן. בחר אם לשמור גרפים ומקורות נתונים מושבתים או להסיר אותם."
"Shared data sources and aggregate graphs must be detached before graph removal. Retained graphs and data sources become unassigned.": "יש לנתק מקורות נתונים משותפים וגרפים מצטברים לפני הסרת גרפים. גרפים ומקורות נתונים שנשמרים הופכים ללא-משויכים."
"Affected remote collectors must be online. Failed removal may leave remote or plugin changes; inspect the outcome before retrying.": "אוספי נתונים מרוחקים מושפעים חייבים להיות מקוונים. הסרה שנכשלה עלולה להשאיר שינויים מרוחקים או שינויי תוספים; בדוק את התוצאה לפני שתנסה שוב."
"RRD file cleanup follows the configured maintenance policy.": "ניקוי קובצי RRD פועל לפי מדיניות התחזוקה המוגדרת."
"%graphs% graphs, %sources% data sources": "%graphs% גרפים, %sources% מקורות נתונים"
"Device template updated.": "תבנית ההתקן עודכנה."
"Clear device statistics": "נקה סטטיסטיקות התקן"
"Confirm clearing statistics": "אשר ניקוי סטטיסטיקות"
"Selected device statistics cleared.": "סטטיסטיקות ההתקנים שנבחרו נוקו."
"Reset response times, poll counts and availability for these devices. Graphs, historical data and device settings are retained. Statistics resume with the next poll.": "אפס זמני תגובה, ספירות דגימה וזמינות עבור התקנים אלה. גרפים, נתונים היסטוריים והגדרות התקן נשמרים. הסטטיסטיקות מתחדשות בדגימה הבאה."
"Synchronize device templates": "סנכרן תבניות התקן"
"Confirm synchronization": "אשר סנכרון"
"Selected device templates synchronized.": "תבניות ההתקנים שנבחרו סונכרנו."
"Apply the current assigned templates to these devices. Missing graph and data-query associations are added, and unused graph-template associations may be removed. Devices without templates are skipped. Existing graphs and historical data are retained; automation may create new graphs.": "החל את התבניות המשויכות כעת על התקנים אלה. שיוכי גרפים ושאילתות נתונים חסרים יתווספו, ושיוכי תבניות גרף שאינם בשימוש עשויים להיות מוסרים. התקנים ללא תבניות ידולגו. גרפים קיימים ונתונים היסטוריים יישמרו; אוטומציה עשויה ליצור גרפים חדשים."
"Change device options": "שנה אפשרויות התקן"
"Confirm option changes": "אשר שינויי אפשרויות"
"Selected device options updated.": "אפשרויות ההתקנים שנבחרו עודכנו."
"Device options": "אפשרויות התקן"
"Update this field": "עדכן שדה זה"
"Select at least one supported device option.": "בחר לפחות אפשרות התקן נתמכת אחת."
"Only checked options are changed. Unchecked options retain their current values. Selecting an empty location clears it.": "רק אפשרויות מסומנות ישתנו. אפשרויות לא מסומנות ישמרו על ערכיהן הנוכחיים. בחירת מיקום ריק תנקה אותו."
