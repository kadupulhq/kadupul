"Stored credentials are never displayed. Replacing them sets all four fields below; leaving SNMP version 3 clears its username and passphrases.": "സംഭരിച്ച ക്രെഡൻഷ്യലുകൾ ഒരിക്കലും പ്രദർശിപ്പിക്കില്ല. അവ മാറ്റിസ്ഥാപിക്കുന്നത് താഴെയുള്ള നാല് ഫീൽഡുകളും സജ്ജമാക്കുന്നു; SNMP പതിപ്പ് 3 ഒഴിവാക്കുന്നത് അതിന്റെ ഉപയോക്തൃനാമവും പാസ്‌ഫ്രേസുകളും മായ്ക്കുന്നു."
