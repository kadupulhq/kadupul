"The SNMP Option Set changed since you opened this form. Reload before saving.": "നിങ്ങൾ ഈ ഫോം തുറന്നതിന് ശേഷം SNMP ഓപ്ഷൻ സെറ്റ് മാറി. സംരക്ഷിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The SNMP entry changed since you opened this form. Reload before saving.": "നിങ്ങൾ ഈ ഫോം തുറന്നതിന് ശേഷം SNMP എൻട്രി മാറി. സംരക്ഷിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The SNMP entry order changed since you opened this page. Reload before moving.": "നിങ്ങൾ ഈ പേജ് തുറന്നതിന് ശേഷം SNMP എൻട്രി ക്രമം മാറി. നീക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The automation template changed since you opened this form. Reload before saving.": "നിങ്ങൾ ഈ ഫോം തുറന്നതിന് ശേഷം ഓട്ടോമേഷൻ ടെംപ്ലേറ്റ് മാറി. സംരക്ഷിക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The automation template order changed since you opened this page. Reload before moving.": "നിങ്ങൾ ഈ പേജ് തുറന്നതിന് ശേഷം ഓട്ടോമേഷൻ ടെംപ്ലേറ്റ് ക്രമം മാറി. നീക്കുന്നതിന് മുമ്പ് റീലോഡ് ചെയ്യുക."
"The maximum number of attempts to reach a device via an SNMP readstring prior to giving up.": "ഉപേക്ഷിക്കുന്നതിന് മുമ്പ് ഒരു SNMP റീഡ്‌സ്ട്രിംഗ് വഴി ഒരു ഉപകരണത്തിൽ എത്താനുള്ള പരമാവധി ശ്രമങ്ങളുടെ എണ്ണം."
"The maximum number of milliseconds Kadupul will wait for an SNMP response (does not work with php-snmp support).": "ഒരു SNMP പ്രതികരണത്തിനായി Kadupul കാത്തിരിക്കുന്ന പരമാവധി മില്ലിസെക്കൻഡുകൾ (php-snmp പിന്തുണയോടെ പ്രവർത്തിക്കില്ല)."
"The name can be at most 100 characters.": "പേര് പരമാവധി 100 അക്ഷരങ്ങൾ ആകാം."
"The name format must give every copy a name of 1 to 100 characters.": "പേര് ഫോർമാറ്റ് ഓരോ പകർപ്പിനും 1 മുതൽ 100 വരെ അക്ഷരങ്ങളുള്ള പേര് നൽകണം."
"This SNMP Option Set form has expired. Open the SNMP Option Set again and use its current form.": "ഈ SNMP ഓപ്ഷൻ സെറ്റ് ഫോമിന്റെ കാലാവധി കഴിഞ്ഞു. SNMP ഓപ്ഷൻ സെറ്റ് വീണ്ടും തുറന്ന് അതിന്റെ നിലവിലെ ഫോം ഉപയോഗിക്കുക."
"This is a unique string that will be matched to a device's sysDescr string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ഒരു ഉപകരണത്തിന്റെ sysDescr സ്ട്രിംഗുമായി പൊരുത്തപ്പെടുത്തി ഈ ഓട്ടോമേഷൻ ടെംപ്ലേറ്റുമായി ജോടിയാക്കുന്ന ഒരു അദ്വിതീയ സ്ട്രിംഗാണിത്. ഏത് SQL Where എക്സ്പ്രഷനുമൊപ്പം ഏത് Perl റെഗുലർ എക്സ്പ്രഷനും ഉപയോഗിക്കാം."
"This is a unique string that will be matched to a device's sysName string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ഒരു ഉപകരണത്തിന്റെ sysName സ്ട്രിംഗുമായി പൊരുത്തപ്പെടുത്തി ഈ ഓട്ടോമേഷൻ ടെംപ്ലേറ്റുമായി ജോടിയാക്കുന്ന ഒരു അദ്വിതീയ സ്ട്രിംഗാണിത്. ഏത് SQL Where എക്സ്പ്രഷനുമൊപ്പം ഏത് Perl റെഗുലർ എക്സ്പ്രഷനും ഉപയോഗിക്കാം."
"This is a unique string that will be matched to a device's sysOid string to pair it to this Automation Template.  Any Perl regular expression can be used in addition to any SQL Where expression.": "ഒരു ഉപകരണത്തിന്റെ sysOid സ്ട്രിംഗുമായി പൊരുത്തപ്പെടുത്തി ഈ ഓട്ടോമേഷൻ ടെംപ്ലേറ്റുമായി ജോടിയാക്കുന്ന ഒരു അദ്വിതീയ സ്ട്രിംഗാണിത്. ഏത് SQL Where എക്സ്പ്രഷനുമൊപ്പം ഏത് Perl റെഗുലർ എക്സ്പ്രഷനും ഉപയോഗിക്കാം."
"This legacy automation template form has expired. Open Device Rules and submit a new form.": "ഈ ലെഗസി ഓട്ടോമേഷൻ ടെംപ്ലേറ്റ് ഫോമിന്റെ കാലാവധി കഴിഞ്ഞു. ഉപകരണ നിയമങ്ങൾ തുറന്ന് പുതിയ ഫോം സമർപ്പിക്കുക."
