"The selected assignment is applied to every listed device. Template changes preserve existing graphs; automation may create new graphs. Collector changes transfer polling ownership.": "Isabelo esikhethiweyo sisetyenziswa kuzo zonke izixhobo ezidwelisiweyo. Utshintsho lwetempleyithi lugcina iigrafu ezikhoyo; okuzenzekelayo kunokudala iigrafu ezitsha. Utshintsho lomqokeleli ludlulisela ubunini bokuqokelela."
