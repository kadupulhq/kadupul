"Apply these SNMP settings to every selected device. Keep each device’s stored credentials or explicitly replace them. Stored secrets are never displayed.": "Sebenzisa ezi setingi ze-SNMP kwisixhobo ngasinye esikhethiweyo. Gcina iziqinisekiso ezigciniweyo zesixhobo ngasinye okanye uzitshintshe ngokucacileyo. Iimfihlo ezigciniweyo azize ziboniswe."
