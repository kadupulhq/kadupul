"A useful name for this Rule.": "ለዚህ ደንብ ጠቃሚ ስም።"
"Access denied.": "መዳረሻ ተከልክሏል።"
"Add Tree Rule": "የዛፍ ደንብ አክል"
"Back to Tree Rules": "ወደ ዛፍ ደንቦች ተመለስ"
"Check this box to enable this rule.": "ይህንን ደንብ ለማንቃት ይህንን ሳጥን ምልክት ያድርጉ።"
"Choose a Tree for the new Tree Items.": "ለአዲሶቹ የዛፍ ንጥሎች ዛፍ ይምረጡ።"
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "ለማገናኘት የተመረጠውን ዛፍ ራስጌ ወይም ሥሩን ይምረጡ። ይህ ደንብ በሚፈጸምበት ጊዜ አሁንም መኖሩን ያረጋግጡ።"
"Choose a header of the selected Tree.": "የተመረጠውን ዛፍ ራስጌ ይምረጡ።"
"Choose a listed Graph Grouping Style.": "የተዘረዘረ የግራፍ መቧደን ዘይቤ ይምረጡ።"
"Choose a listed Leaf Item Type.": "የተዘረዘረ የቅጠል ንጥል ዓይነት ይምረጡ።"
"Choose an existing Tree.": "ያለ ዛፍ ይምረጡ።"
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "በዛፉ ላይ ለዚህ ልዩ አስተናጋጅ ሲሳሉ ግራፎች እንዴት እንደሚቧደኑ ይምረጡ። ለመሣሪያ ቅጠሎች ጥቅም ላይ ይውላል።"
"Data Query Index": "የውሂብ መጠይቅ ኢንዴክስ"
"Device": "መሣሪያ"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "የመሣሪያ ቅጠሎች በግራፍ ወይም በግራፍ አብነት ዓምዶች ላይ መስፈርቶችን መጠቀም አይችሉም። የቅጠል ንጥል ዓይነትን ወደ መሣሪያ ሲቀይሩ፣ እነዚያን መስፈርቶች ለማስወገድ ይህንን ሳጥን ምልክት ያድርጉ፤ መልሰው ሊገኙ አይችሉም።"
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "የመሣሪያ ቅጠሎች በግራፍ ላይ የተመሰረቱ መስፈርቶችን መጠቀም አይችሉም። ለማስቀመጥ የ %count% መስፈርቶችን መወገድ ያረጋግጡ።"
"Edit Tree Rule": "የዛፍ ደንብ አርትዕ"
"Enable Rule": "ደንብ አንቃ"
"Enter a name.": "ስም ያስገቡ።"
"Enter at most %count% characters.": "ቢበዛ %count% ቁምፊዎችን ያስገቡ።"
"Enter single-line text.": "ባለ አንድ መስመር ጽሑፍ ያስገቡ።"
"Graph": "ግራፍ"
"Graph Grouping Style": "የግራፍ መመደቢያ ዘይቤ"
"Graph Template": "የግራፍ አብነት"
"Leaf Item Type": "የቅጠል ንጥል ዓይነት"
"Name": "ስም"
"Object Selection and Tree Creation Criteria": "የነገር ምርጫ እና የዛፍ መፍጠሪያ መስፈርቶች"
"Optional: Sub-Tree Item": "አማራጭ: ንዑስ-ዛፍ ንጥል"
"Remove graph-based criteria": "በግራፍ ላይ የተመሠረቱ መስፈርቶችን አስወግድ"
"Save": "አስቀምጥ"
"Save outcome is uncertain. Reload before retrying.": "የማስቀመጥ ውጤቱ እርግጠኛ አይደለም። እንደገና ከመሞከርዎ በፊት ዳግም ይጫኑ።"
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "መጀመሪያ ደንቡን ያስቀምጡ፤ የነገር ምርጫው እና የዛፍ መፍጠሪያ መስፈርቶቹ በኋላ ይታከላሉ።"
"The Item Type that shall be dynamically added to the tree.": "በተለዋዋጭነት ወደ ዛፉ የሚታከለው የንጥል ዓይነት።"
"The tree rule changed since you opened this form. Reload before saving.": "ይህን ቅጽ ከከፈቱ በኋላ የዛፍ ደንቡ ተለውጧል። ከማስቀመጥዎ በፊት እንደገና ይጫኑ።"
"Tree": "ዛፍ"
"Tree Rule Selection [edit: %name%]": "የዛፍ ደንብ ምርጫ [አርትዕ: %name%]"
"Tree Rules Selection [new]": "የዛፍ ደንቦች ምርጫ [አዲስ]"
"Tree rule not found.": "የዛፍ ደንብ አልተገኘም።"
"Tree rule saved.": "የዛፍ ደንብ ተቀምጧል።"
"Unable to load the tree rule. Reload before retrying.": "የዛፍ ደንቡን መጫን አልተቻለም። እንደገና ከመሞከርዎ በፊት እንደገና ይጫኑ።"
"Unexpected fields were submitted.": "ያልተጠበቁ መስኮች ገብተዋል።"
