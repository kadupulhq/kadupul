"Choose the input method for this Data Query.  This input method defines how data is collected for each Device associated with the Data Query.": "Safidio ny fomba fampidirana ho an'ity Fangatahana angon-drakitra ity. Ity fomba fampidirana ity no mamaritra ny fomba fanangonana ny angon-drakitra ho an'ny Fitaovana tsirairay mifandray amin'ny Fangatahana angon-drakitra."
