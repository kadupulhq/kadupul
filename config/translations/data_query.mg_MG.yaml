"Data query not found.": "Tsy hita ny fangatahana angona."
"Data query saved, but a Remote Data Collector was down and did not receive the poller cache change. Perform a Full Sync once it is up again.": "Voatahiry ny fangatahana angona, saingy maty ny Mpanangona angona lavitra iray ka tsy nahazo ny fanovana tao amin'ny tahiry vonjimaikan'ny mpanontany. Manaova fampifanarahana feno rehefa mandeha indray izy."
