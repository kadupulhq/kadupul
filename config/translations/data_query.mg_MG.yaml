"Successfully located XML file": "Hita soa aman-tsara ny rakitra XML"
"The data query changed since you opened this form. Reload before saving.": "Niova ny fangatahana angona hatramin'ny nanokafanao ity takelaka ity. Havaozy alohan'ny hitehirizana."
