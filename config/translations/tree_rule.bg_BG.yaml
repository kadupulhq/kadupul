"A useful name for this Rule.": "Полезно име за това правило."
"Access denied.": "Достъпът е отказан."
"Add Tree Rule": "Добавяне на правило за дърво"
"Back to Tree Rules": "Назад към правилата за дърво"
"Check this box to enable this rule.": "Поставете отметка в това квадратче, за да активирате това правило."
"Choose a Tree for the new Tree Items.": "Изберете дърво за новите елементи на дърво."
"Choose a header of the selected Tree to hook in, or its root. Make sure that it still exists when this rule is executed.": "Изберете заглавка от избраното дърво за прикачване или неговия корен. Уверете се, че тя все още съществува при изпълнението на това правило."
"Choose a header of the selected Tree.": "Изберете заглавка на избраното дърво."
"Choose a listed Graph Grouping Style.": "Изберете стил на групиране на графики от списъка."
"Choose a listed Leaf Item Type.": "Изберете тип на елемента (лист) от списъка."
"Choose an existing Tree.": "Изберете съществуващо дърво."
"Choose how graphs are grouped when drawn for this particular host on the tree. Used for Device leaves.": "Изберете как се групират графиките при изчертаване за този конкретен хост в дървото. Използва се за листа тип Устройство."
"Data Query Index": "Индекс на заявките за данни"
"Device": "Устройство"
"Device leaves cannot use criteria on graph or graph template columns. When changing the Leaf Item Type to Device, check this box to remove those criteria; they cannot be recovered.": "Листата тип Устройство не могат да използват критерии по колони на графика или шаблон за графика. Когато променяте типа на елемента (лист) на Устройство, поставете отметка в това поле, за да премахнете тези критерии; те не могат да бъдат възстановени."
"Device leaves cannot use graph-based criteria. Confirm the removal of %count% criteria to save.": "Листата тип Устройство не могат да използват критерии, базирани на графики. Потвърдете премахването на %count% критерия, за да запазите."
"Edit Tree Rule": "Редактиране на правило за дърво"
"Enable Rule": "Активиране на правилото"
"Enter a name.": "Въведете име."
"Enter at most %count% characters.": "Въведете най-много %count% знака."
"Enter single-line text.": "Въведете едноредов текст."
"Graph": "Графика"
"Graph Grouping Style": "Стил на групиране на графики"
"Graph Template": "Шаблони за елементи на графиката"
"Leaf Item Type": "Тип на листа"
"Name": "Име"
"Object Selection and Tree Creation Criteria": "Критерии за избор на обекти и създаване на дърво"
"Optional: Sub-Tree Item": "Незадължително: Под-дърво"
"Remove graph-based criteria": "Премахване на критерии, базирани на графики"
"Save": "Запази"
"Save outcome is uncertain. Reload before retrying.": "Резултатът от запазването е несигурен. Презаредете, преди да опитате отново."
"Save the rule first; its Object Selection and Tree Creation Criteria are added afterwards.": "Първо запазете правилото; неговите критерии за избор на обекти и създаване на дърво се добавят след това."
"The Item Type that shall be dynamically added to the tree.": "Типът елемент, който се добавя динамично към дървото."
"The tree rule changed since you opened this form. Reload before saving.": "Правилото за дърво е променено, откакто отворихте този формуляр. Презаредете, преди да запазите."
"Tree": "‎درخت"
"Tree Rule Selection [edit: %name%]": "Избор на правило за дърво [редактиране: %name%]"
"Tree Rules Selection [new]": "Избор на правила за дърво [ново]"
"Tree rule not found.": "Правилото за дърво не е намерено."
"Tree rule saved.": "Правилото за дърво е запазено."
"Unable to load the tree rule. Reload before retrying.": "Не може да се зареди правилото за дърво. Презаредете, преди да опитате отново."
"Unexpected fields were submitted.": "Бяха изпратени неочаквани полета."
