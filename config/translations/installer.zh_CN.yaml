"The completed installer reports pending collector synchronization.": "已完成的安装程序报告仍有待同步的采集器。"
"The completed installer reports no pending collectors.": "已完成的安装程序报告没有待处理的采集器。"
"Collector completion remains unconfirmed by this partial receipt.": "此部分回执尚无法确认采集器已完成。"
"Collector completion is not established by this installation outcome.": "此安装结果尚未确定采集器是否已完成。"
"Review collector status and retry finishing tasks for partial outcomes. This does not verify later collection freshness.": "检查采集器状态并为部分成功的结果重试收尾任务。这不会验证后续采集的时效性。"
"Scheduled collection": "计划采集"
"No poller or device was contacted by this assessment.": "此评估未联系任何轮询器或设备。"
"Confirm the configured scheduler runs the poller as the intended service account and review its next normal cycle.": "确认已配置的调度程序以预期服务账户运行轮询器，并检查其下一个正常周期。"
"Graph data": "图形数据"
"Live samples and RRD updates were not exercised.": "未演练实时采样和 RRD 更新。"
"After a normal collection cycle, confirm expected graphs receive fresh samples and review poller errors.": "经过一个正常的采集周期后，确认预期图形收到新样本并检查轮询器错误。"
"Recovery readiness": "恢复就绪状态"
"Backup restoration was not exercised.": "未演练备份恢复。"
"Verify an isolated restore of database, RRD files, configuration and key material before relying on recovery.": "依赖恢复前，请先验证数据库、RRD 文件、配置和密钥材料的隔离还原。"
