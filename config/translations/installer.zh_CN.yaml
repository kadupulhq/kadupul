"The recorded poller start is in the future. Check clock synchronization.": "记录的轮询器启动时间在未来。请检查时钟同步。"
"The recorded poller start is older than the native scheduling tolerance.": "记录的轮询器启动时间早于原生调度容差。"
"A local poller start was recorded within the native scheduling tolerance. Completion and device health are not verified.": "已在原生调度容差范围内记录一次本地轮询器启动。尚未验证完成状态和设备健康状况。"
