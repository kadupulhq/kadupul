"Recover": "恢复"
"Recovery checklist": "恢复检查清单"
"Preserve log/cacti.log and record the failed attempt.": "保留 log/cacti.log 并记录失败的尝试。"
"Confirm that the previous worker and its child processes have stopped.": "确认之前的工作进程及其子进程已停止。"
