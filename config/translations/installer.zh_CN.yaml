"Database privileges": "数据库权限"
"Effective migration privileges, including active roles and object-specific grants, were not verified.": "未验证有效迁移权限（包括活动角色和对象级授权）。"
"Have the database administrator verify required table writes, schema changes, triggers and routines for the installation account and schema. Do not grant global administrator privileges.": "请数据库管理员针对安装账户和架构核实所需的表写入、架构更改、触发器和例程权限。请勿授予全局管理员权限。"
"Compare web and worker runtimes": "比较 Web 与工作进程运行时"
"This explicitly starts a short read-only PHP probe. It does not reserve an installer, write files or contact devices.": "这将显式启动一次简短的只读 PHP 探测。不会预留安装程序、写入文件或联系设备。"
"The probe inherits this web process and uses the configured installer PHP interpreter. It does not inspect a separate scheduler or service.": "此探测继承当前 Web 进程并使用已配置的安装程序 PHP 解释器。它不会检查独立的调度程序或服务。"
"I authorize the read-only worker runtime comparison.": "我授权执行只读工作进程运行时比较。"
"Compare runtimes": "比较运行时"
"Runtime comparison results": "运行时比较结果"
"Permission and identity differences may be intentional. Read-only observations do not prove that writes or installation will succeed.": "权限和身份差异可能是有意配置的。只读观测结果不能证明写入或安装一定会成功。"
"Confirm the read-only worker runtime comparison.": "确认只读工作进程运行时比较。"
"The runtime comparison is unavailable.": "运行时比较不可用。"
"Shared application secret": "共享应用密钥"
"A strong web application secret is required before comparison.": "执行比较前需要强 Web 应用密钥。"
"Runtime comparison": "运行时比较"
"The configured worker runtime did not confirm a bounded comparison.": "已配置的工作进程运行时未能确认有界比较。"
"The inherited worker secret could not be confirmed against the web secret.": "继承的工作进程密钥无法与 Web 密钥核对确认。"
"PHP runtime comparison": "PHP 运行时比较"
"Both runtimes must support PHP 8.4; differing patch versions require review.": "两个运行时都必须支持 PHP 8.4；补丁版本不同时需要审核。"
"Required extension comparison": "所需扩展比较"
"Required extension availability is checked; differing versions require review.": "已检查所需扩展的可用性；版本不同时需要审核。"
"Process identity comparison": "进程身份比较"
"Effective process identity is unavailable on this platform.": "此平台无法获取有效进程身份。"
"Effective process identities match.": "有效进程身份一致。"
"Effective process identities differ; separate service accounts may be intentional.": "有效进程身份不同；使用独立的服务账户可能是有意为之。"
"Directory access comparison": "目录访问比较"
"Read-only directory permission observations match.": "只读目录权限观测结果一致。"
"Directory locations or permission observations differ; review the service-account roles.": "目录位置或权限观测结果存在差异；请检查服务账户角色。"
"Worker directory read and traversal": "工作进程目录读取与遍历"
"Required worker directories must exist and allow reading and traversal. No writes were tested.": "所需的工作进程目录必须存在并允许读取和遍历。未测试写入权限。"
"The inherited worker secret matches the web secret for this private challenge.": "继承的工作进程密钥与此次私有质询的 Web 密钥一致。"
"Review the configured PHP interpreter, required extensions, inherited secret and service-account directory permissions. No writes or installer startup were exercised.": "检查已配置的 PHP 解释器、所需扩展、继承的密钥和服务账户目录权限。未演练写入或安装程序启动。"
"advisory": "建议"
