"What Day(s) of the week will this Network Range be discovered?": "ਇਸ ਨੈੱਟਵਰਕ ਰੇਂਜ ਦੀ ਖੋਜ ਹਫ਼ਤੇ ਦੇ ਕਿਹੜੇ ਦਿਨ ਕੀਤੀ ਜਾਵੇਗੀ?"
"What Month(s) of the Year will this Network Range be discovered?": "ਇਸ ਨੈੱਟਵਰਕ ਰੇਂਜ ਦੀ ਖੋਜ ਸਾਲ ਦੇ ਕਿਹੜੇ ਮਹੀਨਿਆਂ ਵਿੱਚ ਕੀਤੀ ਜਾਵੇਗੀ?"
"What Week(s) of the Month will this Network Range be discovered?": "ਇਸ ਨੈੱਟਵਰਕ ਰੇਂਜ ਦੀ ਖੋਜ ਮਹੀਨੇ ਦੇ ਕਿਹੜੇ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਕੀਤੀ ਜਾਵੇਗੀ?"
"What time will this Network discover item start?  Enter it as YYYY-MM-DD HH:MM.": "ਇਸ ਨੈੱਟਵਰਕ ਖੋਜ ਆਈਟਮ ਦੀ ਸ਼ੁਰੂਆਤ ਕਿਸ ਸਮੇਂ ਹੋਵੇਗੀ? ਇਸਨੂੰ YYYY-MM-DD HH:MM ਰੂਪ ਵਿੱਚ ਦਰਜ ਕਰੋ।"
"When discovering devices, allow duplicate sysnames to be added on different hosts": "ਡਿਵਾਈਸਾਂ ਦੀ ਖੋਜ ਕਰਦੇ ਸਮੇਂ, ਵੱਖ-ਵੱਖ ਹੋਸਟਾਂ 'ਤੇ ਦੁਹਰਾਏ ਗਏ sysname ਸ਼ਾਮਲ ਕਰਨ ਦੀ ਇਜਾਜ਼ਤ ਦਿਓ"
"You must specify both the Months and Days of Month.": "ਤੁਹਾਨੂੰ ਮਹੀਨੇ ਅਤੇ ਮਹੀਨੇ ਦੇ ਦਿਨ ਦੋਵੇਂ ਦੱਸਣੇ ਪੈਣਗੇ।"
"You must specify the Months, Weeks of Month, and Days of Week.": "ਤੁਹਾਨੂੰ ਮਹੀਨੇ, ਮਹੀਨੇ ਦੇ ਹਫ਼ਤੇ ਅਤੇ ਹਫ਼ਤੇ ਦੇ ਦਿਨ ਦੱਸਣੇ ਪੈਣਗੇ।"
"You must specify the day of the week.": "ਤੁਹਾਨੂੰ ਹਫ਼ਤੇ ਦਾ ਦਿਨ ਦੱਸਣਾ ਪਵੇਗਾ।"
