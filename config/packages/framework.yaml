framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    router:
        utf8: true
    php_errors:
        log: true
    # The read-only compatibility adapter opens the existing native session.
    # Do not start a second Symfony session with a different cookie or payload.
    session: false
    form: true
    csrf_protection:
        stateless_token_ids: ['inventory_device_edit', 'inventory_device_template', 'inventory_device_collector', 'inventory_device_associations', 'inventory_device_maintenance', 'inventory_device_state', 'inventory_device_bulk_assignment', 'inventory_device_remove', 'inventory_site_edit', 'inventory_site_create', 'inventory_device_create', 'inventory_site_action']

when@test:
    framework:
        test: true
