security:
    password_hashers:
        legacy_native:
            id: Kadupul\IdentityAccess\Infrastructure\Legacy\LegacyPasswordHasher
    firewalls:
        native_session:
            request_matcher: Kadupul\IdentityAccess\Infrastructure\Symfony\Security\NativeSessionRoutes
            stateless: true
            custom_authenticators:
                - Kadupul\IdentityAccess\Infrastructure\Symfony\Security\NativeSessionAuthenticator
